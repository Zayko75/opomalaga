<text x="550" y="88" text-anchor="middle" font-size="10" fill="currentColor">de la LCSP</text>
</svg>`},
{n:5,t:"Negocios jurídicos y contratos excluidos en el ámbito de la Defensa y de la Seguridad",ubic:"Título Preliminar (Disposiciones generales) ▸ Capítulo I (Objeto y ámbito de aplicación de la Ley) ▸ Sección 2.ª (Negocios y contratos excluidos)",idea:"Fuera lo de defensa y seguridad que tiene su propia ley o procedimiento internacional.",literal:`<p>1. Quedan excluidos del ámbito de la presente Ley los convenios incluidos en el ámbito del artículo 346 del Tratado de Funcionamiento de la Unión Europea que se concluyan en el sector de la defensa y la seguridad.</p><p>2. Se excluyen, asimismo, del ámbito de la presente Ley los contratos de obras, suministros y servicios que se celebren en el ámbito de la seguridad o de la defensa que estén comprendidos dentro del ámbito de aplicación de la Ley 24/2011, de 1 de agosto, de contratos del sector público en los ámbitos de la defensa y de la seguridad; así como los contratos a los que no resulte de aplicación la citada Ley en virtud de su artículo 7.</p><p>Quedan también excluidos los contratos de concesiones de obras y concesiones de servicios, que se celebren en el ámbito de la seguridad y de la defensa, en los que concurra alguna de las circunstancias siguientes:</p><p>a) Que sean adjudicados en el marco de un programa de cooperación basado en la investigación y el desarrollo de un nuevo producto y, en su caso, también relacionados con el ciclo de vida del mismo o partes de dicho ciclo, siempre que participen en el programa al menos dos Estados miembros de la Unión Europea.</p><p>b) Los que se adjudiquen en un tercer Estado no miembro de la Unión Europea para efectuar compras, incluidas las de carácter civil, cuando las Fuerzas Armadas estén desplegadas fuera del territorio de la Unión y las necesidades operativas hagan necesario que estos contratos se concluyan con empresarios situados en la zona de operaciones. A los efectos de esta Ley, se entenderán incluidos en la zona de operaciones los territorios de influencia de esta y las bases logísticas avanzadas.</p><p>c) Las concesiones que se adjudiquen a otro Estado en relación con obras y servicios directamente relacionados con el equipo militar sensible, u obras y servicios específicamente con fines militares, u obras y servicios sensibles.</p><p>3. Lo establecido en los dos apartados anteriores se aplicará aún en el supuesto de que parte de las prestaciones correspondientes estén sometidas a la presente Ley, y no se haya optado por adjudicar un contrato separado por cada una de las distintas prestaciones que constituyan el objeto del contrato.</p><p>No obstante, constituirá una condición necesaria para la aplicación de lo señalado en el párrafo anterior el hecho de que la opción entre adjudicar un único contrato o varios contratos por separado no se ejerza con el objetivo de excluir el contrato o contratos del ámbito de aplicación de la presente Ley.</p><p>4. Quedan excluidos, también, del ámbito de la presente Ley los contratos y convenios que se celebren en los ámbitos de la defensa o de la seguridad y que deban adjudicarse de conformidad con un procedimiento de contratación específico que haya sido establecido de alguna de las siguientes maneras:</p><p>a) En virtud de un acuerdo o convenio internacional celebrado de conformidad con el Tratado de Funcionamiento de la Unión Europea con uno o varios Estados no signatarios de este último, relativo a las obras, suministros o servicios que resulten necesarios para la explotación o el desarrollo conjunto de un proyecto por los Estados firmantes.</p><p>b) En virtud de un acuerdo o convenio internacional relativo al estacionamiento de tropas y que se refiera a las empresas de un Estado Miembro de la Unión Europea o de un tercer Estado.</p><p>c) En virtud de las normas de contratación establecidas por una organización internacional o por una institución financiera internacional, cuando además los contratos que se adjudiquen estén financiados íntegramente o en su mayor parte por esa institución.</p>`,dis:`<ul>
<li><b>5.1:</b> convenios del <b>art. 346 TFUE</b> concluidos en el sector de la defensa y la seguridad.</li>
<li><b>5.2:</b> contratos de <b>obras, suministros y servicios</b> del ámbito de seguridad o defensa incluidos en la <b>Ley 24/2011</b>, y los que no le resulten aplicables por su art. 7. También las <b>concesiones de obras y de servicios</b> en ese ámbito cuando concurra alguna de estas circunstancias:
<ol><li><b>a)</b> programa de cooperación basado en investigación y desarrollo de un nuevo producto con al menos <b>dos Estados miembros</b>;</li>
<li><b>b)</b> adjudicados en un tercer Estado para compras con las Fuerzas Armadas <b>desplegadas fuera de la Unión</b> cuando las necesidades operativas exijan contratar en la zona de operaciones;</li>
<li><b>c)</b> concesiones adjudicadas a <b>otro Estado</b> sobre equipo militar sensible u obras y servicios con fines militares o sensibles.</li></ol></li>
<li><b>5.3 — antifraude:</b> la exclusión opera aunque parte de las prestaciones esté sujeta a la ley y no se hayan adjudicado por separado, <b>siempre que</b> la opción de contrato único no se haya ejercido <b>con el objetivo de excluir</b> el contrato del ámbito de la ley.</li>
<li><b>5.4:</b> contratos y convenios de defensa o seguridad con procedimiento específico establecido por: a) acuerdo internacional con Estados no signatarios del TFUE para un proyecto conjunto; b) acuerdo sobre <b>estacionamiento de tropas</b>; c) normas de una <b>organización internacional o institución financiera internacional</b> que financie el contrato íntegra o mayoritariamente.</li>
</ul>`,llano:`<p>Lo militar y lo de seguridad tiene sus propias reglas, porque no se puede publicar en el perfil del contratante la compra de material sensible. La ley lo saca de su ámbito, pero pone un cortafuegos: si mezclas prestaciones normales con prestaciones militares en un solo contrato <b>para escapar de la ley</b>, la exclusión no vale.</p>`,porque:`<p>El art. 346 TFUE permite a los Estados proteger sus intereses esenciales de seguridad, y ese es el fundamento europeo de toda la exclusión. Pero como el argumento de la seguridad nacional es un comodín peligroso, el legislador añade en el apartado 3 una <b>cláusula antiabuso</b> explícita: la finalidad elusiva desactiva la exclusión.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> una empresa con área confidencial: sigue habiendo reglas, pero no las mismas ni con la misma publicidad.</li>
<li><b>Real:</b> la adquisición de sistemas de comunicaciones cifradas para las Fuerzas Armadas se rige por la Ley 24/2011, no por la LCSP (art. 5.2).</li>
<li><b>Caso límite:</b> un contrato que engloba el suministro de material militar y, de paso, la limpieza de las oficinas de un ministerio. Si la unión se hizo para evitar licitar la limpieza, la exclusión <b>no</b> ampara esa parte (art. 5.3).</li>
</ul>`,noej:`<ul>
<li><b>No basta</b> con que el contrato lo firme el Ministerio de Defensa: tiene que estar en el ámbito material de la Ley 24/2011 o en las circunstancias del 5.2.</li>
<li><b>No hay exclusión</b> si la agrupación de prestaciones persigue eludir la ley.</li>
</ul>`,conex:`<ul>
<li><b>Ley 24/2011</b>, de contratos del sector público en los ámbitos de la defensa y de la seguridad.</li>
<li><b>Art. 346 TFUE:</b> intereses esenciales de seguridad.</li>
<li><b>Art. 18:</b> contratos mixtos, con criterios análogos de no elusión.</li>
</ul>`,trampas:`<ul>
<li>La <b>cláusula antiabuso</b> del 5.3 es lo más preguntable: la exclusión decae si la opción de contrato único busca eludir la ley.</li>
<li>La letra a) del 5.2 exige <b>al menos dos Estados miembros</b>.</li>
<li>En el 5.4.c) la financiación debe ser <b>íntegra o mayoritaria</b> de la organización o institución internacional.</li>
</ul>`,ancla:`<p><b>"Defensa fuera, salvo que la mezcla sea trampa."</b> Recuerda el número mágico europeo: <b>art. 346 TFUE</b>.</p>`,vis:`<svg viewBox="0 0 640 155" role="img" aria-label="Exclusiones en defensa y seguridad">
<rect x="20" y="25" width="290" height="66" rx="8" fill="var(--exc-bg)" stroke="var(--exc)"/>

<text x="165" y="64" text-anchor="middle" font-size="10" fill="currentColor">convenios del art. 346 TFUE · contratos de la Ley 24/2011</text>

<text x="475" y="46" text-anchor="middle" font-size="11" font-weight="700" fill="var(--acc)">También excluidos (5.4)</text>
<text x="475" y="64" text-anchor="middle" font-size="10" fill="currentColor">procedimiento específico por acuerdo internacional,</text>
<text x="475" y="80" text-anchor="middle" font-size="10" fill="currentColor">estacionamiento de tropas u organización internacional</text>

<text x="320" y="139" text-anchor="middle" font-size="10" fill="currentColor">no vale unir prestaciones en un solo contrato para eludir la ley</text>
</svg>`},
{n:6,t:"Convenios y encomiendas de gestión",ubic:"Título Preliminar (Disposiciones generales) ▸ Capítulo I (Objeto y ámbito de aplicación de la Ley) ▸ Sección 2.ª (Negocios y contratos excluidos)",idea:"Los convenios y las encomiendas quedan fuera si de verdad no son contratos encubiertos.",literal:`<p>1. Quedan excluidos del ámbito de la presente Ley los convenios, cuyo contenido no esté comprendido en el de los contratos regulados en esta Ley o en normas administrativas especiales celebrados entre sí por la Administración General del Estado, las Entidades Gestoras y los Servicios Comunes de la Seguridad Social, las Universidades Públicas, las Comunidades Autónomas y las Ciudades Autónomas de Ceuta y Melilla, las Entidades locales, las entidades con personalidad jurídico pública de ellas dependientes y las entidades con personalidad jurídico privada, siempre que, en este último caso, tengan la condición de poder adjudicador.</p><p>Su exclusión queda condicionada al cumplimiento de las siguientes condiciones:</p><p>a) Las entidades intervinientes no han de tener vocación de mercado, la cual se presumirá cuando realicen en el mercado abierto un porcentaje igual o superior al 20 por ciento de las actividades objeto de colaboración. Para el cálculo de dicho porcentaje se tomará en consideración el promedio del volumen de negocios total u otro indicador alternativo de actividad apropiado, como los gastos soportados considerados en relación con la prestación que constituya el objeto del convenio en los tres ejercicios anteriores a la adjudicación del contrato. Cuando, debido a la fecha de creación o de inicio de actividad o a la reorganización de las actividades, el volumen de negocios u otro indicador alternativo de actividad apropiado, como los gastos, no estuvieran disponibles respecto de los tres ejercicios anteriores o hubieran perdido su vigencia, será suficiente con demostrar que el cálculo del nivel de actividad se corresponde con la realidad, en especial, mediante proyecciones de negocio.</p><p>b) Que el convenio establezca o desarrolle una cooperación entre las entidades participantes con la finalidad de garantizar que los servicios públicos que les incumben se prestan de modo que se logren los objetivos que tienen en común.</p><p>c) Que el desarrollo de la cooperación se guíe únicamente por consideraciones relacionadas con el interés público.</p><p>2. Estarán también excluidos del ámbito de la presente Ley los convenios que celebren las entidades del sector público con personas físicas o jurídicas sujetas al derecho privado, siempre que su contenido no esté comprendido en el de los contratos regulados en esta Ley o en normas administrativas especiales.</p><p>3. Asimismo, quedan excluidas del ámbito de la presente Ley las encomiendas de gestión reguladas en la legislación vigente en materia de régimen jurídico del sector público.</p>`,dis:`<div class="box exc"><span class="lbl">Condición previa e ineludible</span>Para que un <span class="t" data-k="convenio">convenio</span> quede excluido, su <b>contenido no puede estar comprendido en el de los contratos regulados en esta ley o en normas administrativas especiales</b>. Si lo está, es un contrato, se llame como se llame.</div>
<ul>
<li><b>6.1 — convenios entre entidades públicas</b> (AGE, Entidades Gestoras y Servicios Comunes de la Seguridad Social, Universidades Públicas, CCAA, Ceuta y Melilla, Entidades locales, entidades públicas dependientes y entidades privadas que sean poder adjudicador). Además del requisito de contenido, <b>tres condiciones acumulativas</b>:
<ol><li><b>a)</b> que las entidades <b>no tengan vocación de mercado</b>, que se presume cuando realicen en el mercado abierto un porcentaje <b>igual o superior al 20 %</b> de las actividades objeto de colaboración (promedio de los <b>tres ejercicios</b> anteriores);</li>
<li><b>b)</b> que el convenio establezca o desarrolle una <b>cooperación</b> para lograr objetivos comunes de servicio público;</li>
<li><b>c)</b> que la cooperación se guíe <b>únicamente</b> por consideraciones de interés público.</li></ol></li>
<li><b>6.2 — convenios con privados:</b> excluidos siempre que su contenido no sea el de un contrato regulado en esta ley o en normas administrativas especiales.</li>
<li><b>6.3 — <span class="t" data-k="encomienda">encomiendas de gestión</span></b> reguladas en la legislación de régimen jurídico del sector público (art. 11 LRJSP): excluidas.</li>
</ul>`,llano:`<p>Dos administraciones pueden cooperar mediante un convenio sin licitar, pero solo si de verdad están cooperando y no comprándose servicios entre ellas. Por eso la ley pone tres filtros: que no actúen como empresas en el mercado (menos del 20 % de esa actividad), que persigan objetivos comunes y que solo les mueva el interés público. Y antes de nada: si el contenido del convenio es el de un contrato, no hay convenio que valga.</p>`,porque:`<p>El convenio fue durante años la <b>puerta trasera</b> de la contratación pública: bastaba con llamar convenio a un contrato de servicios para no licitar. La LCSP, siguiendo la jurisprudencia europea sobre cooperación horizontal, cierra esa puerta con un requisito de contenido y tres condiciones objetivas. El umbral del <b>20 %</b> traduce en cifra la idea de que quien opera en el mercado debe competir en el mercado.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> dos vecinos que comparten el coste del arreglo del tejado común (cooperación) no es lo mismo que uno contratando al otro para que se lo arregle (contrato).</li>
<li><b>Real:</b> convenio entre una diputación y varios municipios para gestionar conjuntamente un servicio de emergencias, sin que ninguna de las entidades preste ese servicio en el mercado abierto: excluido (art. 6.1).</li>
<li><b>Caso límite:</b> un consorcio público que factura el 35 % de su actividad de recogida de residuos a clientes privados firma un "convenio" con un ayuntamiento para recogerle la basura. Se presume <b>vocación de mercado</b> (supera el 20 %) y el contenido es el de un contrato de servicios: hay que licitar.</li>
</ul>`,noej:`<ul>
<li><b>No es convenio excluido</b> aquel cuyo contenido coincide con un contrato de la ley, aunque lo firmen dos administraciones.</li>
<li><b>No basta</b> con cumplir una de las tres condiciones del 6.1: son <b>acumulativas</b>.</li>
<li><b>No son encomiendas de gestión</b> los encargos a medios propios personificados: esos se regulan en el art. 32 y <b>no</b> están excluidos, sino sujetos a requisitos.</li>
</ul>`,conex:`<ul>
<li><b>Art. 32:</b> encargos a medios propios personificados, figura distinta de la encomienda del 6.3.</li>
<li><b>Arts. 47 a 53 LRJSP</b> (documento 2 de la biblioteca): régimen general de los convenios.</li>
<li><b>Art. 11 LRJSP:</b> encomienda de gestión.</li>
<li><b>Art. 4:</b> régimen supletorio de principios.</li>
</ul>`,trampas:`<ul>
<li>El umbral es <b>igual o superior al 20 %</b>, calculado sobre el promedio de los <b>tres ejercicios</b> anteriores.</li>
<li>La condición de contenido ("que no esté comprendido en el de los contratos regulados") es <b>previa</b> a las tres condiciones.</li>
<li>La cooperación debe guiarse <b>únicamente</b> por el interés público.</li>
<li>No confundas <b>encomienda de gestión</b> (excluida, art. 6.3) con <b>encargo a medio propio</b> (art. 32, no excluido).</li>
</ul>`,ancla:`<p><b>"Convenio sí, contrato disfrazado no."</b><br>Tres condiciones: <b>sin mercado (20 %) · cooperación · solo interés público</b>. Regla del 20: si un quinto de tu actividad la vendes fuera, eres empresa.</p>`,vis:`<svg viewBox="0 0 640 200" role="img" aria-label="Requisitos de exclusión de los convenios">

{n:7,t:"Negocios jurídicos y contratos excluidos en el ámbito internacional",ubic:"Título Preliminar (Disposiciones generales) ▸ Capítulo I (Objeto y ámbito de aplicación de la Ley) ▸ Sección 2.ª (Negocios y contratos excluidos)",idea:"Fuera los acuerdos entre Estados y lo que se rija por procedimientos internacionales.",literal:`<p>1. Se excluyen del ámbito de la presente Ley los acuerdos que celebre el Estado con otros Estados o con otros sujetos de derecho internacional.</p><p>2. Estarán también excluidos del ámbito de la presente Ley los contratos que deban adjudicarse de conformidad con un procedimiento de contratación específico que haya sido establecido en virtud de un instrumento jurídico, celebrado de conformidad con el Tratado de Funcionamiento de la Unión Europea con uno o varios Estados no signatarios de este último, que cree obligaciones de derecho internacional relativo a las obras, suministros o servicios que resulten necesarios para la ejecución o la realización conjunta de un proyecto por sus signatarios.</p><p>3. Asimismo, quedarán excluidos del ámbito de la presente Ley los contratos que deban adjudicarse de conformidad con un procedimiento de contratación específico que haya sido establecido en virtud de las normas de contratación aprobadas por una organización internacional o por una institución financiera internacional, siempre y cuando estén financiados íntegramente o mayoritariamente por esa institución.</p>`,dis:`<ul>
<li><b>7.1:</b> acuerdos que celebre el <b>Estado</b> con otros Estados o con otros <b>sujetos de derecho internacional</b>.</li>
<li><b>7.2:</b> contratos que deban adjudicarse conforme a un procedimiento específico establecido en un <b>instrumento jurídico celebrado con Estados no signatarios del TFUE</b> que cree obligaciones de derecho internacional, relativo a obras, suministros o servicios necesarios para la ejecución o realización conjunta de un proyecto por los signatarios.</li>
<li><b>7.3:</b> contratos con procedimiento específico establecido por normas de una <b>organización internacional</b> o de una <b>institución financiera internacional</b>, siempre que estén financiados <b>íntegra o mayoritariamente</b> por esa institución.</li>
</ul>`,llano:`<p>Cuando España pacta con otro país o con una organización internacional, no se le puede exigir que aplique su ley interna de contratos: manda el instrumento internacional. Y si quien pone el dinero es un organismo internacional, se siguen sus reglas.</p>`,porque:`<p>Es una exigencia de coherencia del <b>derecho internacional</b>: un Estado no puede imponer unilateralmente su procedimiento de contratación a un acuerdo bilateral o a un proyecto financiado por el Banco Mundial. La condición de financiación mayoritaria evita el abuso: quien paga, pone las reglas, pero si paga poco, no puede desplazar la ley nacional.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> en una obra pagada por tu comunidad y por el ayuntamiento, quien aporta casi todo suele fijar el procedimiento.</li>
<li><b>Real:</b> un proyecto de cooperación financiado en un 80 % por el Banco Europeo de Inversiones que impone su propio procedimiento de licitación: excluido por el art. 7.3.</li>
<li><b>Caso límite:</b> un proyecto financiado al 30 % por una institución financiera internacional: <b>no</b> alcanza la financiación mayoritaria y por tanto no opera la exclusión.</li>
</ul>`,noej:`<ul>
<li><b>No están excluidos</b> los contratos ordinarios celebrados en el extranjero por la Administración española si no responden a un instrumento internacional.</li>
<li><b>No basta</b> con la participación de una organización internacional: hace falta procedimiento específico y financiación íntegra o mayoritaria en el 7.3.</li>
</ul>`,conex:`<ul>
<li><b>Art. 5.4:</b> exclusiones internacionales paralelas en el ámbito de defensa y seguridad.</li>
<li><b>Art. 4:</b> aplicación supletoria de los principios.</li>
</ul>`,trampas:`<ul>
<li>Los tres apartados exigen matices distintos: <b>7.1</b> sujetos de derecho internacional; <b>7.2</b> Estados <b>no signatarios</b> del TFUE; <b>7.3</b> financiación <b>íntegra o mayoritaria</b>.</li>
<li>El 7.1 se refiere al <b>Estado</b>, no a cualquier entidad del sector público.</li>
</ul>`,ancla:`<p><b>"Si el acuerdo es entre Estados o el dinero es de fuera, mandan sus reglas."</b></p>`,vis:`<svg viewBox="0 0 640 140" role="img" aria-label="Exclusiones en el ámbito internacional">

{n:8,t:"Negocios y contratos excluidos en el ámbito de la Investigación, el Desarrollo y la Innovación",ubic:"Título Preliminar (Disposiciones generales) ▸ Capítulo I (Objeto y ámbito de aplicación de la Ley) ▸ Sección 2.ª (Negocios y contratos excluidos)",idea:"La I+D queda fuera, salvo que el poder adjudicador se lo quede todo y lo pague todo.",literal:`<p>Quedan excluidos de la presente Ley los contratos de investigación y desarrollo, excepto aquellos que además de estar incluidos en los códigos CPV 73000000-2 (servicios de investigación y desarrollo y servicios de consultoría conexos); 73100000-3 (servicio de investigación y desarrollo experimental); 73110000-6 (servicios de investigación);</p><p>73111000-3 (servicios de laboratorio de investigación); 73112000-0 (servicios de investigación marina); 73120000-9 (servicios de desarrollo experimental); 73300000-5 (diseño y ejecución en materia de investigación y desarrollo); 73420000-2 (estudio de previabilidad y demostración tecnológica) y 73430000-5 (ensayo y evaluación), cumplan las dos condiciones siguientes:</p><p>a) Que los beneficios pertenezcan exclusivamente al poder adjudicador para su utilización en el ejercicio de su propia actividad.</p><p>b) Que el servicio prestado sea remunerado íntegramente por el poder adjudicador.</p>`,dis:`<ul>
<li><b>Regla:</b> quedan excluidos los contratos de <b>investigación y desarrollo</b>.</li>
<li><b>Excepción (vuelven a la ley):</b> los que, estando en los códigos <span class="t" data-k="cpv">CPV</span> enumerados (73000000-2, 73100000-3, 73110000-6, 73111000-3, 73112000-0, 73120000-9, 73300000-5, 73420000-2 y 73430000-5), cumplan <b>las dos condiciones a la vez</b>:
<ol><li><b>a)</b> que los beneficios pertenezcan <b>exclusivamente al poder adjudicador</b> para su propia actividad;</li>
<li><b>b)</b> que el servicio sea <b>remunerado íntegramente</b> por el poder adjudicador.</li></ol></li>
</ul>
<div class="box warn"><span class="lbl">Cómo se lee este artículo</span>Está redactado al revés de lo que uno espera: la <b>regla</b> es la exclusión y la <b>excepción</b> es la sujeción. Si el poder adjudicador paga todo y se queda todo, ya no es fomento de la investigación: es una compra ordinaria, y por eso se somete a la ley.</div>`,llano:`<p>Financiar investigación no es lo mismo que comprar un servicio de investigación. Si la Administración reparte el riesgo y los resultados con quien investiga, eso queda fuera de la ley. Pero si paga la factura entera y se queda con todos los beneficios, entonces está comprando y tiene que licitar.</p>`,porque:`<p>La contratación pública de I+D es una <b>herramienta de política científica</b>: exigir licitación ordinaria para cofinanciar investigación estratégica ahogaría la innovación. Ahora bien, cuando no hay riesgo compartido ni resultados compartidos, la operación económica es idéntica a la compra de cualquier servicio, y someterla a la ley evita que la etiqueta "I+D" sirva para adjudicar a dedo.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> no es lo mismo apoyar económicamente a un inventor a cambio de compartir la patente que encargarle un invento pagándoselo entero.</li>
<li><b>Real:</b> un ayuntamiento cofinancia con una universidad un proyecto de sensores de calidad del aire cuyos resultados serán compartidos y publicables: excluido. Si en cambio paga íntegramente el desarrollo y se reserva en exclusiva su uso, el contrato <b>vuelve</b> a la LCSP.</li>
<li><b>Caso límite:</b> contrato de I+D con código CPV no incluido en la lista: aunque se cumplan las dos condiciones, la excepción no opera y la exclusión se mantiene.</li>
</ul>`,noej:`<ul>
<li><b>No basta</b> con una de las dos condiciones: son <b>cumulativas</b>.</li>
<li><b>No es I+D excluida</b> la simple compra de equipamiento científico: eso es un contrato de suministro.</li>
</ul>`,conex:`<ul>
<li><b>Art. 2.4:</b> el CPV como instrumento de identificación de prestaciones.</li>
<li><b>Art. 177 y ss.:</b> asociación para la innovación, procedimiento pensado para I+D dentro de la ley.</li>
</ul>`,trampas:`<ul>
<li>El artículo funciona al revés: <b>regla = exclusión</b>; excepción = sujeción.</li>
<li>Dos condiciones <b>acumulativas</b>: beneficios exclusivos + remuneración íntegra.</li>
<li>La excepción exige además estar en los <b>códigos CPV</b> listados.</li>
</ul>`,ancla:`<p><b>"Si lo pago todo y me lo quedo todo, licito."</b> Dos "todos" y vuelves a la ley.</p>`,vis:`<svg viewBox="0 0 640 150" role="img" aria-label="Contratos de I+D excluidos y su excepción">
<rect x="35" y="30" width="240" height="70" rx="8" fill="var(--exc-bg)" stroke="var(--exc)"/>
<text x="155" y="55" text-anchor="middle" font-size="11" font-weight="700" fill="var(--exc)">REGLA: I+D EXCLUIDA</text>
<text x="155" y="76" text-anchor="middle" font-size="10" fill="currentColor">riesgo y resultados compartidos</text>
<text x="300" y="70" text-anchor="middle" font-size="16" fill="var(--ink2)">≠</text>
<rect x="325" y="20" width="290" height="90" rx="8" fill="var(--ej-bg)" stroke="var(--ej)"/>
<text x="470" y="42" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ej)">EXCEPCIÓN: vuelve a la LCSP</text>
<text x="470" y="62" text-anchor="middle" font-size="10" fill="currentColor">códigos CPV listados</text>
<text x="470" y="79" text-anchor="middle" font-size="10" fill="currentColor">a) beneficios exclusivos del poder adjudicador</text>
<text x="470" y="95" text-anchor="middle" font-size="10" fill="currentColor">b) remuneración íntegra por el poder adjudicador</text>
<text x="320" y="133" text-anchor="middle" font-size="10" fill="var(--warn)">Las dos condiciones han de darse conjuntamente</text>
</svg>`},
{n:9,t:"Relaciones jurídicas, negocios y contratos excluidos en el ámbito del dominio público y en el ámbito patrimonial",ubic:"Título Preliminar (Disposiciones generales) ▸ Capítulo I (Objeto y ámbito de aplicación de la Ley) ▸ Sección 2.ª (Negocios y contratos excluidos)",idea:"El dominio público y los negocios sobre inmuebles y valores van por su legislación.",literal:`<p>1. Se encuentran excluidas de la presente Ley las autorizaciones y concesiones sobre bienes de dominio público y los contratos de explotación de bienes patrimoniales distintos a los definidos en el artículo 14, que se regularán por su legislación específica salvo en los casos en que expresamente se declaren de aplicación las prescripciones de la presente Ley.</p><p>2. Quedan, asimismo, excluidos de la presente Ley los contratos de compraventa, donación, permuta, arrendamiento y demás negocios jurídicos análogos sobre bienes inmuebles, valores negociables y propiedades incorporales, a no ser que recaigan sobre programas de ordenador y deban ser calificados como contratos de suministro o servicios, que tendrán siempre el carácter de contratos privados y se regirán por la legislación patrimonial. En estos contratos solo podrán incluirse prestaciones que sean propias de los contratos típicos regulados en la Sección 1.ª del Capítulo II del Título Preliminar, si el valor estimado de las mismas no es superior al 50 por 100 del importe total del negocio y, a su vez, mantienen con la prestación característica del contrato patrimonial relaciones de vinculación y complementariedad en los términos previstos en el artículo 34.2.</p>`,dis:`<ul>
<li><b>9.1 — dominio público:</b> excluidas las <b>autorizaciones y concesiones sobre bienes de <span class="t" data-k="domipub">dominio público</span></b> y los contratos de explotación de bienes patrimoniales distintos de los definidos en el <b>art. 14</b> (concesión de obras). Se rigen por su legislación específica, salvo declaración expresa de aplicación de la LCSP.</li>
<li><b>9.2 — negocios patrimoniales:</b> excluidos la <b>compraventa, donación, permuta, arrendamiento y demás negocios análogos</b> sobre <b>bienes inmuebles, valores negociables y propiedades incorporales</b>. Son siempre <b>contratos privados</b> y se rigen por la <b>legislación patrimonial</b>.
<ul><li><b>Excepción:</b> si recaen sobre <b>programas de ordenador</b> y deben calificarse como suministro o servicios, quedan sujetos.</li>
<li><b>Límite a la mezcla:</b> en estos negocios solo pueden incluirse prestaciones típicas de los contratos de la Sección 1.ª del Capítulo II si su valor estimado <b>no supera el 50 %</b> del importe total del negocio y mantienen con la prestación característica relaciones de <b>vinculación y complementariedad</b> (art. 34.2).</li></ul></li>
</ul>`,llano:`<p>Cuando el Ayuntamiento vende un solar, alquila un local o da una concesión de un quiosco en la playa, no está comprando nada: está gestionando su patrimonio o su dominio público. Eso tiene su propia legislación. Ahora bien, no vale colar dentro de la venta de un edificio la reforma completa del edificio: si la parte contractual pasa del 50 %, no cabe la exclusión.</p>`,porque:`<p>La LCSP regula la Administración cuando <b>compra</b>, no cuando <b>administra o vende</b> lo suyo: ahí la lógica es la del derecho patrimonial y de bienes. La regla del 50 % existe porque estos negocios se prestaron históricamente a incluir obras y servicios sin licitar, escondidos tras la venta o el arrendamiento de un inmueble.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> no es lo mismo comprar muebles para tu casa que vender tu casa: son operaciones de naturaleza distinta.</li>
<li><b>Real:</b> el arrendamiento por un ayuntamiento de un local para oficinas municipales: contrato <b>privado</b> y patrimonial, excluido (art. 9.2). La concesión de un chiringuito en dominio público marítimo-terrestre: excluida (art. 9.1).</li>
<li><b>Caso límite:</b> permuta de una parcela municipal a cambio de que el adquirente construya un centro de día. Si el valor de la obra supera el 50 % del negocio, no cabe tratarlo como negocio patrimonial excluido: hay contrato de obras.</li>
</ul>`,noej:`<ul>
<li><b>No está excluida</b> la <b>concesión de obras</b> del art. 14, aunque recaiga sobre dominio público: está expresamente exceptuada en el 9.1.</li>
<li><b>No están excluidos</b> los negocios sobre <b>programas de ordenador</b> calificables como suministro o servicios.</li>
<li><b>No es negocio patrimonial excluido</b> la compra de bienes muebles: eso es un contrato de suministro.</li>
</ul>`,conex:`<ul>
<li><b>Art. 14:</b> concesión de obras, expresamente excluida de la exclusión.</li>
<li><b>Art. 34.2:</b> vinculación y complementariedad de prestaciones.</li>
<li><b>Art. 26:</b> contratos privados.</li>
<li><b>Ley 33/2003</b>, del Patrimonio de las Administraciones Públicas, y la legislación patrimonial local.</li>
</ul>`,trampas:`<ul>
<li>El límite es el <b>50 % del importe total</b> del negocio, medido por <b>valor estimado</b>.</li>
<li>La exclusión del 9.1 <b>no</b> alcanza a la concesión de obras del art. 14.</li>
<li>Los <b>programas de ordenador</b> son la excepción expresa del 9.2.</li>
<li>Estos contratos son <b>siempre privados</b>.</li>
</ul>`,ancla:`<p><b>"Comprar sí, vender no."</b> Si la Administración gestiona lo suyo (dominio público o patrimonio), fuera de la LCSP.<br>Y el freno: <b>50 %</b> de prestaciones contractuales, más vinculación y complementariedad.</p>`,vis:`<svg viewBox="0 0 640 165" role="img" aria-label="Exclusiones patrimoniales y de dominio público">
<rect x="25" y="25" width="280" height="72" rx="8" fill="var(--exc-bg)" stroke="var(--exc)"/>
<text x="165" y="47" text-anchor="middle" font-size="11" font-weight="700" fill="var(--exc)">9.1 Dominio público</text>
<text x="165" y="66" text-anchor="middle" font-size="10" fill="currentColor">autorizaciones y concesiones demaniales</text>
<text x="165" y="83" text-anchor="middle" font-size="10" fill="var(--warn)">salvo la concesión de obras del art. 14</text>
<rect x="335" y="25" width="280" height="72" rx="8" fill="var(--exc-bg)" stroke="var(--exc)"/>
<text x="475" y="47" text-anchor="middle" font-size="11" font-weight="700" fill="var(--exc)">9.2 Negocios patrimoniales</text>
<text x="475" y="66" text-anchor="middle" font-size="10" fill="currentColor">inmuebles, valores y propiedades incorporales</text>
<text x="475" y="83" text-anchor="middle" font-size="10" fill="var(--warn)">salvo programas de ordenador</text>
<rect x="130" y="110" width="380" height="44" rx="8" fill="var(--acc-soft)" stroke="var(--acc)"/>
<text x="320" y="129" text-anchor="middle" font-size="11" font-weight="700" fill="var(--acc)">Límite a la mezcla de prestaciones</text>
<text x="320" y="146" text-anchor="middle" font-size="10" fill="currentColor">valor estimado no superior al 50 % + vinculación y complementariedad</text>
</svg>`},
{n:10,t:"Negocios y contratos excluidos en el ámbito financiero",ubic:"Título Preliminar (Disposiciones generales) ▸ Capítulo I (Objeto y ámbito de aplicación de la Ley) ▸ Sección 2.ª (Negocios y contratos excluidos)",idea:"Fuera lo financiero: valores, Banco de España, rescates europeos, préstamos y tesorería.",literal:`<p>Están excluidos del ámbito de la presente Ley los contratos relativos a servicios financieros relacionados con la emisión, compra, venta o transferencia de valores o de otros instrumentos financieros en el sentido de la Directiva 2004/39/CE, del Parlamento Europeo y del Consejo, de 21 de abril de 2004, relativa a los mercados de instrumentos financieros, por la que se modifican las Directivas 85/611/CEE y 93/6/CEE, del Consejo y la Directiva 2000/12/CE, del Parlamento Europeo y del Consejo y se deroga la Directiva 93/22/ CEE, del Consejo. Asimismo quedan excluidos los servicios prestados por el Banco de España y las operaciones realizadas con la Facilidad Europea de Estabilización Financiera y el Mecanismo Europeo de Estabilidad y los contratos de préstamo y operaciones de tesorería, estén o no relacionados con la emisión, venta, compra o transferencia de valores o de otros instrumentos financieros.</p>`,dis:`<ul>
<li><b>Servicios financieros</b> relacionados con la <b>emisión, compra, venta o transferencia de valores</b> o de otros instrumentos financieros (Directiva 2004/39/CE, mercados de instrumentos financieros).</li>
<li>Servicios prestados por el <b>Banco de España</b>.</li>
<li>Operaciones realizadas con la <b>Facilidad Europea de Estabilización Financiera</b> y el <b>Mecanismo Europeo de Estabilidad</b>.</li>
<li>Los <b>contratos de préstamo</b> y las <b>operaciones de tesorería</b>, <b>estén o no</b> relacionados con la emisión, venta, compra o transferencia de valores u otros instrumentos financieros.</li>
</ul>`,llano:`<p>Cuando una entidad pública pide un préstamo, emite deuda o mueve su tesorería, no está comprando bienes ni servicios: está operando en el mercado financiero, donde las condiciones cambian cada hora. La ley lo deja fuera.</p>`,porque:`<p>Un procedimiento de licitación dura semanas; una operación financiera se cierra en minutos y su precio varía por momentos. Someterla al procedimiento ordinario sería <b>materialmente imposible</b> y perjudicial para el interés público. La coletilla "estén o no relacionados con valores" cierra cualquier discusión sobre los préstamos: siempre fuera.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> pedir una hipoteca no es lo mismo que contratar una reforma: negocias con bancos, no publicas un pliego.</li>
<li><b>Real:</b> un ayuntamiento concierta un préstamo de 4 M€ para financiar inversiones: excluido de la LCSP (art. 10), aunque sí sujeto al régimen de operaciones de crédito de los arts. 48 y ss. del TRLHL y a las autorizaciones que procedan.</li>
<li><b>Caso límite:</b> la contratación del servicio de <b>asesoramiento jurídico</b> para preparar una emisión de deuda no es un servicio financiero de los del art. 10: es un contrato de servicios sujeto a la ley.</li>
</ul>`,noej:`<ul>
<li><b>No está excluida</b> la contratación de servicios bancarios ordinarios ajenos a estas operaciones, ni los seguros.</li>
<li><b>No está excluida</b> la consultoría o asistencia relacionada con la operación financiera.</li>
</ul>`,conex:`<ul>
<li><b>Arts. 48 a 55 TRLHL</b> (documento 5 de la biblioteca): régimen de las operaciones de crédito de las entidades locales.</li>
<li><b>Art. 177.5 TRLHL:</b> condiciones para financiar gasto corriente con operaciones de crédito.</li>
<li><b>Art. 4:</b> aplicación de los principios ante lagunas.</li>
</ul>`,trampas:`<ul>
<li>Los <b>préstamos y operaciones de tesorería</b> están excluidos <b>en todo caso</b> ("estén o no relacionados").</li>
<li>Los <b>seguros</b> no aparecen en este artículo: son contratos de servicios sujetos a la ley.</li>
<li>El <b>Banco de España</b> se cita expresamente.</li>
</ul>`,ancla:`<p><b>"Dinero por dinero, fuera."</b> Valores, Banco de España, rescates europeos, préstamos y tesorería. Los <b>seguros no</b>: esos sí licitan.</p>`,vis:`<svg viewBox="0 0 640 145" role="img" aria-label="Exclusiones en el ámbito financiero">
<g font-size="10" text-anchor="middle" fill="currentColor">
<rect x="15" y="35" width="145" height="60" rx="8" fill="var(--exc-bg)" stroke="var(--exc)"/><text x="87" y="60" font-weight="700">Valores e</text><text x="87" y="76">instrumentos financieros</text>
<rect x="172" y="35" width="145" height="60" rx="8" fill="var(--exc-bg)" stroke="var(--exc)"/><text x="244" y="60" font-weight="700">Servicios del</text><text x="244" y="76">Banco de España</text>
<rect x="329" y="35" width="145" height="60" rx="8" fill="var(--exc-bg)" stroke="var(--exc)"/><text x="401" y="60" font-weight="700">FEEF y MEDE</text><text x="401" y="76">rescates europeos</text>
<rect x="486" y="35" width="139" height="60" rx="8" fill="var(--exc-bg)" stroke="var(--exc)"/><text x="555" y="60" font-weight="700">Préstamos y</text><text x="555" y="76">tesorería</text>
</g>
<text x="320" y="120" text-anchor="middle" font-size="11" fill="var(--warn)">Los préstamos, estén o no relacionados con valores · Los seguros NO están aquí: sí se licitan</text>
</svg>`},
{n:11,t:"Otros negocios o contratos excluidos",ubic:"Título Preliminar (Disposiciones generales) ▸ Capítulo I (Objeto y ámbito de aplicación de la Ley) ▸ Sección 2.ª (Negocios y contratos excluidos)",idea:"Cajón de sastre: funcionarios, tarifas, arbitraje, entregas, campañas y servicios sociales.",literal:`<p>1. La relación de servicio de los funcionarios públicos y los contratos regulados en la legislación laboral queda excluida del ámbito de la presente Ley.</p><p>2. Se excluyen, asimismo, de la presente Ley las relaciones jurídicas consistentes en la prestación de un servicio público cuya utilización por los usuarios requiera el abono de una tarifa, tasa o precio público de aplicación general.</p><p>3. Los contratos relativos a servicios de arbitraje y conciliación quedan excluidos de la presente Ley.</p><p>4. Asimismo, están excluidos los contratos por los que una entidad del sector público se obligue a entregar bienes o derechos o a prestar algún servicio, sin perjuicio de que el adquirente de los bienes o el receptor de los servicios, si es una entidad del sector público sujeta a esta Ley, deba ajustarse a sus prescripciones para la celebración del correspondiente contrato.</p><p>5. Se encuentran, asimismo, excluidos los contratos que tengan por objeto servicios relacionados con campañas políticas, incluidos en los códigos CPV 79341400-0, 92111230-3 y 92111240-6, cuando sean adjudicados por un partido político.</p><p>6. Queda excluida de la presente Ley la prestación de servicios sociales por entidades privadas, siempre que esta se realice sin necesidad de celebrar contratos públicos, a través, entre otros medios, de la simple financiación de estos servicios o la concesión de licencias o autorizaciones a todas las entidades que cumplan las condiciones previamente fijadas por el poder adjudicador, sin límites ni cuotas, y que dicho sistema garantice una publicidad suficiente y se ajuste a los principios de transparencia y no discriminación.</p>`,dis:`<table><thead><tr><th>Apdo.</th><th>Qué se excluye</th><th>Matiz</th></tr></thead><tbody>
<tr><td>11.1</td><td>La <b>relación de servicio de los funcionarios</b> públicos y los contratos regulados en la <b>legislación laboral</b></td><td>Personal, no compras</td></tr>
<tr><td>11.2</td><td>Relaciones consistentes en la prestación de un <b>servicio público</b> cuya utilización requiera el abono de una <b>tarifa, tasa o precio público de aplicación general</b></td><td>La relación con el usuario, no la contratación del servicio</td></tr>
<tr><td>11.3</td><td>Contratos de servicios de <b>arbitraje y conciliación</b></td><td>—</td></tr>
<tr><td>11.4</td><td>Contratos por los que una entidad del sector público <b>se obliga a entregar bienes o derechos o a prestar un servicio</b></td><td>Si el adquirente o receptor es otra entidad del sector público sujeta a la ley, <b>esta sí</b> debe ajustarse a la ley para celebrar el contrato</td></tr>
<tr><td>11.5</td><td>Servicios relacionados con <b>campañas políticas</b> (CPV 79341400-0, 92111230-3 y 92111240-6)</td><td>Solo cuando los adjudique un <b>partido político</b></td></tr>
<tr><td>11.6</td><td>Prestación de <b>servicios sociales por entidades privadas</b> sin necesidad de celebrar contratos públicos</td><td>Mediante financiación simple o licencias/autorizaciones a todas las entidades que cumplan condiciones previas, <b>sin límites ni cuotas</b>, con publicidad suficiente y respeto a transparencia y no discriminación</td></tr>
</tbody></table>`,llano:`<p>Este artículo recoge lo que no encaja en ningún otro: contratar personal no es contratación pública; pagar el autobús con una tarifa tampoco; el arbitraje se queda fuera; cuando la Administración es la que entrega o presta, la exclusión mira al que da, no al que recibe; las campañas de los partidos son suyas; y los servicios sociales prestados por entidades privadas mediante sistemas abiertos de acreditación no necesitan licitación.</p>`,porque:`<p>Cada apartado responde a una lógica distinta: el <b>empleo público</b> tiene su propio derecho; la relación con el <b>usuario de un servicio</b> es estatutaria, no contractual; el <b>arbitraje</b> se basa en la confianza de las partes; y el apartado 6 responde a la idea europea de que los <b>sistemas de acreditación abiertos</b> —donde entra todo el que cumple, sin cupo— no restringen la competencia y por tanto no exigen licitación.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> contratar a un empleado no es comprar un servicio; pagar el billete de metro tampoco es firmar un contrato público.</li>
<li><b>Real (11.2):</b> el usuario que paga 1,40 € por el autobús urbano no celebra un contrato sujeto a la LCSP; en cambio, el contrato entre el ayuntamiento y la empresa que presta el servicio <b>sí</b> lo está.</li>
<li><b>Real (11.6):</b> un sistema de acreditación de centros de día abierto a todas las entidades que cumplan los requisitos, sin número máximo, con publicidad: excluido.</li>
<li><b>Caso límite (11.4):</b> una diputación vende suelo industrial a un ayuntamiento. Para la diputación es negocio excluido; el ayuntamiento, en cuanto adquirente sujeto a la ley, <b>sí</b> debe ajustarse a sus prescripciones para celebrarlo.</li>
</ul>`,noej:`<ul>
<li><b>No excluye</b> el 11.2 la contratación del servicio público con el operador: solo la relación con el usuario.</li>
<li><b>No excluye</b> el 11.5 las campañas institucionales de una Administración: solo las de los partidos.</li>
<li><b>No excluye</b> el 11.6 los conciertos sociales con cupo o número limitado de plazas: la exclusión exige un sistema <b>sin límites ni cuotas</b>.</li>
</ul>`,conex:`<ul>
<li><b>Art. 3.4:</b> obligaciones de los partidos políticos como poderes adjudicadores en contratos SARA.</li>
<li><b>Art. 15:</b> concesión de servicios, figura con la que contrasta el 11.2.</li>
<li><b>Disposición adicional cuadragésima novena y ss.:</b> contratación de servicios a las personas.</li>
<li><b>Texto refundido del Estatuto Básico del Empleado Público:</b> régimen de la relación de servicio del 11.1.</li>
</ul>`,trampas:`<ul>
<li>El 11.2 exige que la tarifa, tasa o precio público sea de <b>aplicación general</b>.</li>
<li>El 11.4 tiene doble cara: excluye para quien entrega, obliga a quien recibe si es sector público sujeto a la ley.</li>
<li>El 11.5 solo opera si el adjudicador es un <b>partido político</b>.</li>
<li>El 11.6 exige <b>sin límites ni cuotas</b> y <b>publicidad suficiente</b>: si hay cupo, no hay exclusión.</li>
</ul>`,ancla:`<p><b>Seis cajones — "FUNTA-CAS":</b> <b>FUN</b>cionarios y laboral · <b>TA</b>rifas · <b>Ca</b>onciliación y arbitraje · <b>A</b>l entregar bienes · <b>S</b>ervicios sociales... y en medio, las <b>campañas de los partidos</b>.<br>Más fácil aún: <b>persona, precio, pleito, entrega, política y social</b>.</p>`,vis:`<svg viewBox="0 0 640 175" role="img" aria-label="Otros negocios o contratos excluidos">

<rect x="15" y="25" width="195" height="58" rx="8" fill="var(--exc-bg)" stroke="var(--exc)"/><text x="112" y="47" font-weight="700" fill="var(--exc)">11.1 Personal</text><text x="112" y="66">funcionarios y contratos laborales</text>

<script>
const PLAZOS=[["Más del 50 %", "Participación pública en una sociedad mercantil para ser sector público", "Sociedades", "3.1.h)", "Directa o indirecta; o control del art. 5 TRLMV"], ["Más del 50 %", "Patrimonio de una fundación aportado por el sector público con carácter permanente", "Fundaciones", "3.1.e) 2.º", "Basta uno de los tres requisitos de la letra e)"], ["Más de la mitad", "Miembros del órgano de administración, dirección o vigilancia nombrados por el sector público", "Entidades del 3.1.j) y 3.3.d)", "3.1.j)", "Alternativa a financiar o controlar mayoritariamente"], ["Mayoría de votos", "Representantes públicos en el patronato de una fundación", "Fundaciones", "3.1.e) 3.º", "Tercer requisito alternativo"], ["20 % o más", "Actividad en mercado abierto que presume vocación de mercado e impide excluir el convenio", "Entidades cooperantes", "6.1.a)", "Promedio de los tres ejercicios anteriores"], ["Tres ejercicios", "Periodo de cálculo del volumen de negocios para el umbral del 20 %", "Entidades cooperantes", "6.1.a)", "O indicador alternativo de actividad"], ["No superior al 50 %", "Valor estimado de prestaciones típicas incluidas en un negocio patrimonial", "Entidad", "9.2", "Además, vinculación y complementariedad (art. 34.2)"], ["Dos Estados miembros", "Mínimo para el programa de cooperación en I+D del ámbito de defensa", "Estados", "5.2.a)", "Nuevo producto y, en su caso, su ciclo de vida"], ["Íntegra o mayoritaria", "Financiación por organización o institución financiera internacional", "Organismo internacional", "7.3 y 5.4.c)", "Condición para excluir"], ["Sin límites ni cuotas", "Requisito del sistema abierto de prestación de servicios sociales", "Entidades privadas", "11.6", "Con publicidad suficiente, transparencia y no discriminación"]];
const FLASH=[["Enumera los principios del art. 1.1 LCSP", "Libertad de acceso a las licitaciones · publicidad y transparencia · no discriminación e igualdad de trato · integridad · eficiente utilización de los fondos."], ["¿Qué exige el art. 1.3?", "Incorporar de manera <b>transversal y preceptiva</b> criterios sociales y medioambientales cuando guarden relación con el objeto del contrato, y facilitar el acceso de <b>PYMES</b> y empresas de economía social."], ["¿Cuándo un contrato es oneroso?", "Cuando el contratista obtiene <b>algún tipo de beneficio económico, directo o indirecto</b> (art. 2.1)."], ["¿Qué contratos sujeta la LCSP según el art. 2.1?", "Los contratos <b>onerosos</b>, <b>cualquiera que sea su naturaleza jurídica</b>, celebrados por las entidades del art. 3."], ["¿Para qué sirve el CPV?", "Para identificar las prestaciones objeto de los contratos: Vocabulario común de contratos públicos, Reglamento (CE) 2195/2002 (art. 2.4)."], ["¿Qué entidades son Administración Pública a efectos de la LCSP?", "Las de las letras a), b), c) y l) del art. 3.1, y los consorcios y entidades de derecho público que, siendo poder adjudicador y vinculados a Administraciones, no se financien mayoritariamente con ingresos de mercado (art. 3.2)."], ["¿Quiénes son poderes adjudicadores?", "Administraciones Públicas · fundaciones públicas · Mutuas colaboradoras con la Seguridad Social · entidades creadas para necesidades de interés general no industriales ni mercantiles financiadas, controladas o dirigidas mayoritariamente por poderes adjudicadores · asociaciones de las anteriores (art. 3.3)."], ["¿Cuándo una sociedad mercantil es sector público?", "Cuando la participación pública, directa o indirecta, sea <b>superior al 50 %</b>, o exista el control del art. 5 del TR de la Ley del Mercado de Valores (art. 3.1.h)."], ["¿Cuándo una fundación es pública?", "Cuando cumpla <b>alguno</b> de estos: aportación mayoritaria pública inicial o posterior; más del <b>50 %</b> del patrimonio aportado por el sector público con carácter permanente; mayoría de votos públicos en el patronato (art. 3.1.e)."], ["¿Están sujetos los partidos políticos y sindicatos?", "Cuando cumplan los requisitos de poder adjudicador de la letra d) del 3.3 y respecto de contratos <b>SARA</b>: deben respetar publicidad, concurrencia, transparencia, igualdad y no discriminación, y aprobar instrucciones internas publicadas en su web (art. 3.4)."], ["¿Y las Corporaciones de derecho público?", "Sujetas cuando cumplan los requisitos para ser poder adjudicador del art. 3.3.d) (art. 3.5)."], ["¿Qué régimen tienen los negocios excluidos?", "Sus <b>normas especiales</b>, aplicándose los <b>principios</b> de la LCSP para resolver dudas y lagunas (art. 4)."], ["¿Qué cláusula antiabuso contiene el art. 5?", "La exclusión no opera si la opción de adjudicar un único contrato en vez de varios se ejerce <b>con el objetivo de excluir</b> el contrato del ámbito de la ley (art. 5.3)."], ["Condición previa para excluir un convenio", "Que su contenido <b>no esté comprendido</b> en el de los contratos regulados en la ley o en normas administrativas especiales (art. 6.1 y 6.2)."], ["Las tres condiciones del art. 6.1", "Que las entidades no tengan vocación de mercado (menos del <b>20 %</b> de actividad en mercado abierto) · que el convenio desarrolle una <b>cooperación</b> para objetivos comunes · que se guíe <b>únicamente</b> por el interés público."], ["¿Están excluidas las encomiendas de gestión?", "Sí, las reguladas en la legislación de régimen jurídico del sector público (art. 6.3). No confundir con los encargos a medios propios del art. 32."], ["¿Cuándo un contrato de I+D vuelve a la LCSP?", "Cuando, estando en los códigos CPV listados, los beneficios pertenezcan <b>exclusivamente</b> al poder adjudicador y el servicio sea <b>remunerado íntegramente</b> por él (art. 8)."], ["¿Qué negocios patrimoniales quedan excluidos?", "Compraventa, donación, permuta, arrendamiento y análogos sobre <b>inmuebles, valores negociables y propiedades incorporales</b>; son siempre contratos privados y se rigen por la legislación patrimonial (art. 9.2)."], ["¿Qué excepción tiene la exclusión patrimonial?", "Los que recaigan sobre <b>programas de ordenador</b> y deban calificarse como suministro o servicios (art. 9.2)."], ["Límite a la inclusión de prestaciones en un negocio patrimonial", "Valor estimado <b>no superior al 50 %</b> del importe total del negocio, y con vinculación y complementariedad conforme al art. 34.2."], ["¿Qué queda excluido en el ámbito financiero?", "Servicios financieros sobre valores e instrumentos financieros · servicios del <b>Banco de España</b> · operaciones con la FEEF y el MEDE · <b>préstamos y operaciones de tesorería</b>, estén o no relacionados con valores (art. 10)."], ["¿Están excluidos los contratos de seguro?", "No: no figuran en el art. 10, son contratos de servicios sujetos a la ley."], ["¿Qué excluye el art. 11.2?", "Las relaciones consistentes en la prestación de un servicio público cuya utilización requiera el abono de una <b>tarifa, tasa o precio público de aplicación general</b>."], ["¿Qué matiz tiene el art. 11.4?", "Excluye el contrato para la entidad que entrega bienes o presta el servicio, pero el <b>adquirente o receptor</b>, si es sector público sujeto a la ley, debe ajustarse a sus prescripciones."], ["¿Cuándo se excluye la prestación de servicios sociales por entidades privadas?", "Cuando se realice sin necesidad de contratos públicos, mediante financiación simple o licencias y autorizaciones a todas las entidades que cumplan condiciones previas, <b>sin límites ni cuotas</b>, con publicidad suficiente (art. 11.6)."]];
const TEST=[{"a": 1, "q": "¿Cuál de estos NO es un principio enunciado en el art. 1.1 LCSP?", "o": [["la primacía del precio más bajo como criterio de adjudicación", 1, "Correcto: la ley habla de la oferta económicamente más ventajosa y, en el art. 145, de la mejor relación calidad-precio, no del precio más bajo como principio."], ["la libertad de acceso a las licitaciones", 0, "Sí lo es."], ["la publicidad y transparencia de los procedimientos", 0, "Sí lo es."], ["la no discriminación e igualdad de trato entre los licitadores", 0, "Sí lo es."]]}, {"a": 1, "q": "Los criterios sociales y medioambientales se incorporan a la contratación pública de manera potestativa.", "vf": true, "ok": false, "fb": "<b>Falso.</b> El art. 1.3 los impone de manera <b>transversal y preceptiva</b>, siempre que guarden relación con el objeto del contrato."}, {"a": 2, "q": "Un contrato se entiende oneroso cuando:", "o": [["el contratista obtiene algún tipo de beneficio económico, directo o indirecto", 1, "Correcto: definición literal del art. 2.1."], ["la Administración paga un precio cierto en dinero", 0, "Insuficiente: el beneficio puede ser indirecto y no dinerario."], ["su valor estimado supera los umbrales europeos", 0, "Eso determina si es SARA, no si es oneroso."], ["así lo califica el pliego", 0, "La onerosidad es objetiva, no depende de la calificación del pliego."]]}, {"a": 2, "q": "Completa: «Son contratos del sector público los contratos onerosos, ______ que sea su naturaleza jurídica, que celebren las entidades enumeradas en el artículo 3».", "gap": "cualquiera", "fb": "<b>Cualquiera</b> que sea su naturaleza jurídica (art. 2.1). Es la cláusula que impide huir de la ley cambiándole el nombre al contrato."}, {"a": 3, "q": "¿Cuál de estas entidades tiene la consideración de Administración Pública a efectos de la LCSP?", "o": [["las Universidades Públicas", 1, "Correcto: letra c) del art. 3.1, incluida entre las Administraciones Públicas por el art. 3.2.a)."], ["las fundaciones públicas", 0, "Son poder adjudicador (3.3.b) pero no Administración Pública."], ["las entidades públicas empresariales", 0, "Son sector público, pero no Administración Pública."], ["las Mutuas colaboradoras con la Seguridad Social", 0, "Son poder adjudicador (3.3.c), no Administración Pública."]]}, {"a": 3, "q": "Una sociedad mercantil forma parte del sector público cuando la participación pública sea igual o superior al 50 %.", "vf": true, "ok": false, "fb": "<b>Falso.</b> El art. 3.1.h) exige participación, directa o indirecta, <b>superior</b> al 50 %, o el supuesto de control del art. 5 del TR de la Ley del Mercado de Valores."}, {"a": 3, "q": "Para que una fundación sea pública a efectos de la LCSP:", "o": [["basta con que concurra alguno de los tres requisitos del art. 3.1.e)", 1, "Correcto: aportación mayoritaria pública, más del 50 % del patrimonio o mayoría de votos en el patronato."], ["deben concurrir los tres requisitos conjuntamente", 0, "No: la ley dice «alguno de los siguientes requisitos»."], ["debe estar participada al 100 % por el sector público", 0, "No se exige."], ["debe ser Administración Pública", 0, "Las fundaciones públicas nunca son Administración Pública a estos efectos."]]}, {"a": 4, "q": "Los negocios excluidos de la LCSP:", "o": [["se rigen por sus normas especiales, aplicándose los principios de la ley para dudas y lagunas", 1, "Correcto: art. 4."], ["quedan sin régimen jurídico aplicable", 0, "No: tienen sus normas especiales."], ["se rigen supletoriamente por los procedimientos de la LCSP", 0, "Se aplican los <b>principios</b>, no los procedimientos."], ["deben licitarse igualmente por procedimiento abierto", 0, "No: están excluidos del ámbito de la ley."]]}, {"a": 5, "q": "En el ámbito de la defensa, la exclusión decae cuando:", "o": [["la opción de adjudicar un único contrato se ejerce con el objetivo de excluirlo del ámbito de la ley", 1, "Correcto: cláusula antiabuso del art. 5.3."], ["participan al menos dos Estados miembros", 0, "Al contrario: es una de las circunstancias que permiten excluir concesiones (5.2.a)."], ["las Fuerzas Armadas están desplegadas fuera de la Unión", 0, "También es un supuesto de exclusión (5.2.b)."], ["la financiación procede de una institución financiera internacional", 0, "Es otro supuesto de exclusión (5.4.c)."]]}, {"a": 6, "q": "Se presume que una entidad tiene vocación de mercado, impidiendo excluir el convenio, cuando realiza en mercado abierto un porcentaje de actividad:", "o": [["igual o superior al 20 %", 1, "Correcto: art. 6.1.a), calculado sobre el promedio de los tres ejercicios anteriores."], ["superior al 50 %", 0, "Ese umbral es el de la participación societaria del art. 3.1.h)."], ["igual o superior al 10 %", 0, "No es la cifra del precepto."], ["superior al 25 %", 0, "No es la cifra del precepto."]]}, {"a": 6, "q": "Un convenio entre dos administraciones queda excluido aunque su contenido coincida con el de un contrato de servicios de la ley.", "vf": true, "ok": false, "fb": "<b>Falso.</b> El art. 6.1 condiciona la exclusión a que el contenido <b>no esté comprendido</b> en el de los contratos regulados en la ley o en normas administrativas especiales."}, {"a": 6, "q": "Completa: «Quedan excluidas del ámbito de la presente Ley las ______ de gestión reguladas en la legislación vigente en materia de régimen jurídico del sector público».", "gap": "encomiendas", "fb": "<b>Encomiendas</b> de gestión (art. 6.3). No confundirlas con los encargos a medios propios personificados del art. 32, que no están excluidos."}, {"a": 7, "q": "Los contratos adjudicados conforme a las normas de una institución financiera internacional quedan excluidos:", "o": [["si están financiados íntegra o mayoritariamente por esa institución", 1, "Correcto: art. 7.3."], ["en todo caso, cualquiera que sea la financiación", 0, "No: la financiación íntegra o mayoritaria es condición."], ["solo si los adjudica el Estado", 0, "El precepto no lo limita así."], ["solo si superan los umbrales de regulación armonizada", 0, "El umbral no interviene en esta exclusión."]]}, {"a": 8, "q": "Un contrato de investigación y desarrollo queda sujeto a la LCSP cuando:", "o": [["los beneficios pertenecen exclusivamente al poder adjudicador y este lo remunera íntegramente", 1, "Correcto: las dos condiciones cumulativas del art. 8, además de estar en los códigos CPV listados."], ["los resultados se publican y se comparten con el contratista", 0, "Ese es el supuesto típico de exclusión."], ["su valor estimado supera los umbrales europeos", 0, "El umbral no interviene en esta regla."], ["lo celebra una universidad pública", 0, "El sujeto no es el criterio del art. 8."]]}, {"a": 9, "q": "¿Cuál de estos negocios NO está excluido por el art. 9?", "o": [["la concesión de obras definida en el artículo 14", 1, "Correcto: el art. 9.1 excluye la explotación de bienes patrimoniales «distintos a los definidos en el artículo 14»."], ["la autorización sobre un bien de dominio público", 0, "Sí está excluida: art. 9.1."], ["el arrendamiento de un inmueble por la Administración", 0, "Sí está excluido: art. 9.2."], ["la permuta de un bien inmueble municipal", 0, "Sí está excluida: art. 9.2."]]}, {"a": 9, "q": "En un negocio patrimonial solo pueden incluirse prestaciones típicas de los contratos de la ley si su valor estimado no supera el:", "o": [["50 % del importe total del negocio", 1, "Correcto: art. 9.2, y además con vinculación y complementariedad del art. 34.2."], ["20 % del importe total", 0, "El 20 % es el umbral de vocación de mercado del art. 6.1.a)."], ["30 % del importe total", 0, "No es la cifra del precepto."], ["100 %: no hay límite", 0, "Sí hay límite expreso."]]}, {"a": 10, "q": "Están excluidos del ámbito de la LCSP:", "o": [["los contratos de préstamo y las operaciones de tesorería, estén o no relacionados con la emisión de valores", 1, "Correcto: art. 10, con esa coletilla literal."], ["los contratos de seguro de los edificios municipales", 0, "No están excluidos: son contratos de servicios sujetos a la ley."], ["los servicios de asesoramiento jurídico sobre una emisión de deuda", 0, "Son contratos de servicios sujetos a la ley."], ["los contratos de suministro energético", 0, "Sujetos a la ley."]]}, {"a": 11, "q": "El art. 11.4 excluye los contratos por los que una entidad del sector público se obliga a entregar bienes o prestar un servicio. Ello significa que:", "o": [["si el adquirente es una entidad del sector público sujeta a la ley, esta sí debe ajustarse a sus prescripciones", 1, "Correcto: el propio art. 11.4 lo dice expresamente."], ["ninguna de las dos partes queda sujeta a la ley", 0, "El receptor público sí queda sujeto."], ["la exclusión solo opera entre Administraciones Públicas", 0, "El precepto habla de entidades del sector público."], ["se excluye únicamente la entrega de bienes inmuebles", 0, "Alcanza a bienes, derechos y servicios."]]}, {"a": 11, "q": "La prestación de servicios sociales por entidades privadas queda excluida aunque el sistema establezca cuotas o número máximo de entidades.", "vf": true, "ok": false, "fb": "<b>Falso.</b> El art. 11.6 exige que el sistema opere <b>sin límites ni cuotas</b>, con publicidad suficiente y respeto a la transparencia y no discriminación."}, {"a": 3, "q": "Completa: «Se considerarán poderes adjudicadores las entidades creadas específicamente para satisfacer necesidades de interés general que no tengan carácter ______ o mercantil».", "gap": "industrial", "fb": "<b>Industrial</b> (art. 3.3.d). Es el criterio funcional europeo, junto con la financiación, el control o el nombramiento mayoritario."}];
const CASOS=[{"t": "Caso 1 · ¿Dentro o fuera de la ley?", "e": "Clasifica estos seis negocios de un ayuntamiento: <b>(1)</b> compra de 40 ordenadores; <b>(2)</b> arrendamiento de un local para la sede de la policía local; <b>(3)</b> préstamo de 2 M€ con un banco; <b>(4)</b> convenio con la Diputación para gestionar conjuntamente un servicio de emergencias, sin actividad de mercado de ninguna de las dos; <b>(5)</b> contratación de un abogado externo para un pleito; <b>(6)</b> concesión de un quiosco en un parque municipal.", "s": "<p><b>(1) Sujeto.</b> Contrato de suministro, oneroso y celebrado por entidad del art. 3.</p><p><b>(2) Excluido</b> por el art. 9.2: arrendamiento sobre bien inmueble. Es contrato <b>privado</b> y se rige por la legislación patrimonial.</p><p><b>(3) Excluido</b> por el art. 10: contrato de préstamo, esté o no relacionado con valores. Sujeto, eso sí, al régimen de operaciones de crédito del TRLHL.</p><p><b>(4) Excluido</b> por el art. 6.1, siempre que el contenido no sea el propio de un contrato, no haya vocación de mercado (menos del 20 % de actividad en mercado abierto), exista cooperación para objetivos comunes y solo guíe el interés público.</p><p><b>(5) Sujeto.</b> Contrato de servicios. Ojo: el art. 11.3 excluye el <b>arbitraje y la conciliación</b>, no la defensa jurídica.</p><p><b>(6) Excluido</b> por el art. 9.1: concesión sobre bien de dominio público, regida por la legislación patrimonial y de bienes.</p><p><b>En todos los excluidos</b> se aplican los principios de la LCSP para dudas y lagunas (art. 4).</p>"}, {"t": "Caso 2 · Los tres círculos", "e": "Sitúa cada entidad en su círculo (sector público / poder adjudicador / Administración Pública): <b>(a)</b> la Universidad de Sevilla; <b>(b)</b> una fundación municipal de cultura cuyo patronato está controlado por el ayuntamiento; <b>(c)</b> una sociedad municipal de aguas con capital 100 % público; <b>(d)</b> una empresa pública que fabrica y vende productos en competencia con el sector privado; <b>(e)</b> el Colegio Oficial de Arquitectos.", "s": "<p><b>(a) Universidad de Sevilla:</b> los tres círculos. Es sector público (3.1.c), poder adjudicador (3.3.a) y <b>Administración Pública</b> (3.2.a). Celebra contratos administrativos.</p><p><b>(b) Fundación municipal:</b> es fundación pública (3.1.e, por mayoría de votos en el patronato), sector público y <b>poder adjudicador</b> (3.3.b), pero <b>no</b> Administración Pública.</p><p><b>(c) Sociedad de aguas:</b> sector público (3.1.h, participación superior al 50 %). Será poder adjudicador si satisface necesidades de interés general no industriales ni mercantiles, que es lo habitual en el ciclo del agua. Nunca Administración Pública.</p><p><b>(d) Empresa pública en competencia:</b> sector público si cumple el 3.1.h), pero <b>no</b> poder adjudicador, porque su actividad tiene carácter industrial o mercantil.</p><p><b>(e) Colegio de Arquitectos:</b> corporación de derecho público; queda sujeta cuando cumpla los requisitos de poder adjudicador de la letra d) del art. 3.3 (art. 3.5).</p><p><b>Regla que se deduce:</b> el círculo determina el régimen. Solo las Administraciones Públicas celebran contratos administrativos (art. 25).</p>"}, {"t": "Caso 3 · El convenio sospechoso", "e": "Un consorcio público de residuos, que factura el 28 % de su actividad a clientes privados, firma con un ayuntamiento un documento llamado «convenio de colaboración» por el que se compromete a recoger la basura del municipio a cambio de 900.000 € anuales. La interventora pregunta si procede licitar. <b>Analízalo paso a paso.</b>", "s": "<p><b>1) Primer filtro — el contenido (art. 6.1).</b> El objeto es la recogida de residuos a cambio de precio: contenido propio de un <b>contrato de servicios</b> (art. 17) o, si hubiera transferencia del riesgo operacional, de una <b>concesión de servicios</b> (art. 15). Solo con esto la exclusión ya decae.</p><p><b>2) Segundo filtro — vocación de mercado (art. 6.1.a).</b> El consorcio realiza el <b>28 %</b> de su actividad en mercado abierto, por encima del umbral del <b>20 %</b>: se presume vocación de mercado. Segunda razón para no excluir.</p><p><b>3) Tercer filtro — cooperación (art. 6.1.b y c).</b> No hay cooperación para objetivos comunes: hay un prestador y un pagador. Es una relación de intercambio, no de colaboración.</p><p><b>4) Conclusión.</b> No cabe convenio: hay que <b>licitar</b>. Llamarlo convenio no cambia su naturaleza, por aplicación del art. 2.1 («cualquiera que sea su naturaleza jurídica»).</p><p><b>5) Alternativa legal.</b> Si el consorcio reuniera los requisitos de <b>medio propio personificado</b>, cabría un encargo del art. 32 — figura distinta de la encomienda de gestión del art. 6.3 y sujeta a sus propios requisitos, entre ellos el control análogo y el 80 % de actividad para el poder adjudicador.</p>"}];

const INTRO_HTML="<section class=\"card\" id=\"intro\"><h2>Tema 9 · Objeto y ámbito de aplicación de la LCSP</h2><p class=\"small\">Primera parte de la Ley 9/2017: qué persigue la ley (art. 1), a qué contratos se aplica (art. 2), a qué entidades alcanza (art. 3) y qué queda fuera (arts. 4 a 11). Es el artículo 3 el que decide, en la práctica, el régimen jurídico de todo lo demás.</p><div class=\"box ej\"><span class=\"lbl\">La idea que ordena todo el tema</span>Para saber si la LCSP se aplica hay que responder <b>tres preguntas en cadena</b>: <b>1)</b> ¿es un contrato oneroso? (art. 2) · <b>2)</b> ¿lo celebra una entidad del art. 3, y en qué círculo está? · <b>3)</b> ¿encaja en alguna de las exclusiones de los arts. 5 a 11? Si supera las tres, la ley se aplica; y con qué intensidad lo dirá el círculo del art. 3.</div><div class=\"box warn\"><span class=\"lbl\">Advertencia de vigencia</span>Texto consolidado de la Ley 9/2017 con <b>última modificación de 26 de diciembre de 2025</b>. La LCSP se modifica con frecuencia y los umbrales europeos se actualizan cada dos años por reglamentos delegados. Verifica siempre en el BOE consolidado.</div><svg viewBox=\"0 0 660 215\" role=\"img\" aria-label=\"Mapa conceptual del tema 9\"><rect x=\"215\" y=\"8\" width=\"230\" height=\"36\" rx=\"9\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"330\" y=\"31\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"#fff\">¿SE APLICA LA LCSP?</text><line x1=\"330\" y1=\"44\" x2=\"330\" y2=\"60\" stroke=\"var(--acc)\" stroke-width=\"2\"/><line x1=\"130\" y1=\"60\" x2=\"530\" y2=\"60\" stroke=\"var(--acc)\" stroke-width=\"2\"/><line x1=\"130\" y1=\"60\" x2=\"130\" y2=\"78\" stroke=\"var(--acc)\" stroke-width=\"2\"/><line x1=\"330\" y1=\"60\" x2=\"330\" y2=\"78\" stroke=\"var(--acc)\" stroke-width=\"2\"/><line x1=\"530\" y1=\"60\" x2=\"530\" y2=\"78\" stroke=\"var(--acc)\" stroke-width=\"2\"/><rect x=\"25\" y=\"78\" width=\"210\" height=\"120\" rx=\"9\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"130\" y=\"100\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"var(--acc)\">1 · QUÉ Y PARA QUÉ</text><text x=\"130\" y=\"126\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">art. 1 · objeto y principios</text><text x=\"130\" y=\"148\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">art. 2 · contratos onerosos</text><text x=\"130\" y=\"176\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--ink2)\">la puerta de entrada</text><rect x=\"245\" y=\"78\" width=\"170\" height=\"120\" rx=\"9\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"330\" y=\"100\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"var(--ej)\">2 · A QUIÉN</text><text x=\"330\" y=\"128\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">art. 3 · tres círculos</text><text x=\"330\" y=\"150\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">sector público ▸ poderes</text><text x=\"330\" y=\"168\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">adjudicadores ▸ AAPP</text><text x=\"330\" y=\"190\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--ink2)\">decide el régimen</text><rect x=\"425\" y=\"78\" width=\"210\" height=\"120\" rx=\"9\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"530\" y=\"100\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"var(--exc)\">3 · QUÉ QUEDA FUERA</text><text x=\"530\" y=\"124\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">art. 4 · régimen de lo excluido</text><text x=\"530\" y=\"144\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">arts. 5-8 · defensa, convenios,</text><text x=\"530\" y=\"160\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">internacional, I+D</text><text x=\"530\" y=\"180\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">arts. 9-11 · patrimonio, finanzas y otros</text></svg></section>";
const RESUMEN_HTML="<section class=\"card\" id=\"resumen\"><h2>Resumen ejecutivo</h2><table><tbody><tr><th style=\"width:60px\">1</th><td>Objeto: regular la contratación pública con <b>libertad de acceso, publicidad y transparencia, no discriminación e igualdad, integridad y eficiencia</b>; régimen de efectos, cumplimiento y extinción de los contratos administrativos; criterios sociales y ambientales <b>transversales y preceptivos</b> y acceso de PYMES.</td></tr><tr><th>2</th><td>Contratos <b>onerosos</b> (beneficio directo o indirecto), <b>cualquiera que sea su naturaleza jurídica</b>, de entidades del art. 3; más los <b>subvencionados</b> del art. 23. Prestaciones identificadas por <b>CPV</b>.</td></tr><tr><th>3</th><td><b>Sector público</b> (3.1, letras a a l) ▸ <b>Poderes adjudicadores</b> (3.3) ▸ <b>Administraciones Públicas</b> (3.2: letras a, b, c y l + consorcios sin ingresos de mercado). Sociedades: participación <b>superior al 50 %</b>. Fundaciones públicas: basta <b>uno</b> de tres requisitos. Partidos y sindicatos: SARA e instrucciones internas.</td></tr><tr><th>4</th><td>Lo excluido se rige por sus <b>normas especiales</b> + <b>principios</b> de la LCSP para dudas y lagunas.</td></tr><tr><th>5</th><td>Defensa y seguridad: art. 346 TFUE, Ley 24/2011, concesiones con tres circunstancias y procedimientos internacionales. <b>Cláusula antiabuso</b> en el 5.3.</td></tr><tr><th>6</th><td>Convenios: solo si su contenido <b>no es contractual</b>, y con tres condiciones — sin vocación de mercado (<b>20 %</b>), cooperación y solo interés público. <b>Encomiendas de gestión</b> excluidas.</td></tr><tr><th>7</th><td>Internacional: acuerdos entre Estados · instrumentos con Estados no signatarios del TFUE · organizaciones e instituciones financieras internacionales con financiación <b>íntegra o mayoritaria</b>.</td></tr><tr><th>8</th><td>I+D excluida, <b>salvo</b> CPV listados con beneficios <b>exclusivos</b> y remuneración <b>íntegra</b> del poder adjudicador.</td></tr><tr><th>9</th><td>Dominio público y negocios patrimoniales (inmuebles, valores, propiedades incorporales): excluidos y <b>privados</b>. Salvo programas de ordenador. Prestaciones típicas: máximo <b>50 %</b> del negocio.</td></tr><tr><th>10</th><td>Financiero: valores e instrumentos financieros · Banco de España · FEEF y MEDE · <b>préstamos y tesorería</b>, estén o no relacionados con valores.</td></tr><tr><th>11</th><td>Personal · tarifas de servicios públicos · arbitraje y conciliación · entrega de bienes (el receptor público sí se ajusta) · campañas de partidos · servicios sociales por sistemas abiertos <b>sin límites ni cuotas</b>.</td></tr></tbody></table><h2 style=\"margin-top:1.2rem\">Calendario de repaso espaciado</h2><table><thead><tr><th>Momento</th><th>Fecha</th><th>Qué hacer</th></tr></thead><tbody id=\"calbody\"></tbody></table></section>";

(function(){
"use strict";
var K_THEME="oposi_bII_theme", K_FS="oposi_bII_fs", K_STREAK="oposi_bII_streak";
function load(k,f){try{var v=localStorage.getItem(k);return v?JSON.parse(v):f;}catch(e){return f;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

/* Reveal on scroll para las tarjetas */
function reveal(){
  var els=document.querySelectorAll("section.card:not(.rv)");
  if(!els.length)return;
  if(!("IntersectionObserver" in window)){return;}
  var io=new IntersectionObserver(function(es){
    es.forEach(function(en){if(en.isIntersecting){en.target.classList.add("in");io.unobserve(en.target);}});
  },{threshold:.06,rootMargin:"0px 0px -30px 0px"});
  Array.prototype.forEach.call(els,function(el){el.classList.add("rv");io.observe(el);});
}

/* Sección activa en el índice lateral */
function spy(){
  var links=document.querySelectorAll("nav.side a[href^='#']");
  if(!links.length||!("IntersectionObserver" in window))return;
  var map={};
  Array.prototype.forEach.call(links,function(a){
    var t=document.getElementById(a.getAttribute("href").slice(1));
    if(t)map[t.id]=a;
  });
  var io=new IntersectionObserver(function(es){
    es.forEach(function(en){
      if(en.isIntersecting){
        Array.prototype.forEach.call(links,function(a){a.classList.remove("on");});
        if(map[en.target.id])map[en.target.id].classList.add("on");
      }
    });
  },{rootMargin:"-80px 0px -70% 0px",threshold:0});
  Object.keys(map).forEach(function(id){io.observe(document.getElementById(id));});
}

document.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b||b.classList.contains("navtoggle"))return;
  var r=b.getBoundingClientRect(),d=Math.max(r.width,r.height),s=document.createElement("span");
  s.className="ripple";s.style.width=s.style.height=d+"px";
  s.style.left=(e.clientX-r.left-d/2)+"px";s.style.top=(e.clientY-r.top-d/2)+"px";

});

})();

<script>

/* ═══ Parser de respuestas: estructura semántica ═══ */
var FCFMT=(function(){
  var CITA=/\s*\(((?:arts?\.|DA\b|DT\b|disp\.)[^)]*)\)\s*\.?\s*$/i;
  var strip=function(h){return h.replace(/<[^>]+>/g,"");};

  function esc(s){return s;}

  function parse(raw){
    var out={verdict:null,cite:null,kind:"p",items:[],text:""};
    var body=String(raw).trim();

    /* 1 ── Cita legal al final */
    var m=body.match(CITA);
    if(m){out.cite=m[1].replace(/\s+/g," ").trim();body=body.slice(0,m.index).trim();}
    body=body.replace(/[.;,\s]+$/,"");

    /* 2 ── Veredicto Sí / No inicial */
    var v=strip(body).match(/^(Sí|Sí,|No|No,)[.:,]?\s/);
    if(v){
      out.verdict=/^Sí/.test(v[1])?"si":"no";
      body=body.replace(/^(<[^>]+>\s*)*(Sí|No)[.,:]?\s*/,"").trim();
      body=body.replace(/^en\s/,"En ");
    }

    /* 3 ── Enumeración con · */
    var parts=body.split(/\s+·\s+/);
    if(parts.length>=2){
      out.kind="list";
      var letras=parts.filter(function(p){return /^\s*<?[a-h]\)/.test(strip(p));}).length;
      out.marker = letras>=parts.length-1 ? "alpha" : "num";
      out.items=parts.map(function(p){
        return p.replace(/^\s*[a-h]\)\s*/,"").replace(/[.\s]+$/,"").trim();
      }).filter(Boolean);
      return out;
    }

    /* 4 ── Cláusulas contrapuestas con ; */
    var semi=body.split(/;\s+/);
    if(semi.length>=2&&semi.length<=3&&semi.every(function(s){return strip(s).length>14;})){
      out.kind="clauses";
      out.items=semi.map(function(s){return s.replace(/[.\s]+$/,"").trim();});
      return out;
    }

    /* 5 ── Párrafo */
    out.text=body;
    return out;
  }

  function render(raw){
    var d=parse(raw),h="";

    if(d.verdict){
      h+='<span class="fc-verdict '+d.verdict+'">'+(d.verdict==="si"?"✓ Sí":"✗ No")+'</span>';
    }

    if(d.kind==="list"){
      h+='<ol class="fc-list '+d.marker+'">';
      d.items.forEach(function(it){h+='<li>'+it+'</li>';});
      h+='</ol>';
    }else if(d.kind==="clauses"){
      h+='<div class="fc-clauses">';
      d.items.forEach(function(it){h+='<p>'+it+'</p>';});
      h+='</div>';
    }else if(d.text){
      h+='<p class="fc-p">'+d.text+'</p>';
    }

    if(d.cite){
      h+='<span class="fc-cite"><span class="s">§</span>'+d.cite+'</span>';
    }
    return {html:h,struct:(d.kind!=="p"||!!d.verdict||strip(raw).length>150)};
  }
  return {parse:parse,render:render};
})();

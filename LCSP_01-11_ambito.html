<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>LCSP · Arts. 1-11 · Objeto y ámbito de aplicación de la Ley</title>
<style>
/* ═══════════════════════════════════════════════════════════════
   SISTEMA DE DISEÑO · "Académico Gamificado" · Bloque II
   Temas 8, 9 y 10 · Auxiliar Administrativo
   ═══════════════════════════════════════════════════════════════ */
:root{
  --fs:16px;

  --bg:#faf9f7;
  --bg-grad:radial-gradient(1100px 560px at 12% -8%, #ede9ff 0%, transparent 55%),
            radial-gradient(850px 460px at 96% 0%, #dcf5ee 0%, transparent 50%);
  --surface:#ffffff;
  --surface-2:#f4f3f0;
  --surface-3:#eceae5;
  --line:#e6e3dc;
  --line-strong:#d4d0c7;

  --ink:#15161c;
  --ink-2:#5d616e;
  --ink-3:#8b8f9c;

  --brand:#5b3df5;
  --brand-2:#7c5cff;
  --brand-soft:#efeaff;
  --brand-ring:rgba(91,61,245,.18);

  --legal:#4338ca;  --legal-bg:#eeecff;
  --ej:#059669;     --ej-bg:#e4f7f0;
  --warn:#c2690a;   --warn-bg:#fdf1de;
  --exc:#dc2626;    --exc-bg:#ffeceb;

  --ok:#16a34a; --ok-soft:#e7f7ec;
  --mid:#eab308; --mid-soft:#fdf6dd;
  --off:#a1a1aa; --off-soft:#f1f1f3;

  --sh-1:0 1px 2px rgba(20,20,30,.04), 0 2px 8px rgba(20,20,30,.04);
  --sh-2:0 2px 6px rgba(20,20,30,.05), 0 12px 28px rgba(20,20,30,.07);
  --sh-3:0 8px 20px rgba(91,61,245,.13), 0 24px 56px rgba(20,20,30,.10);
  --sh-glow:0 0 0 4px var(--brand-ring);

  --r-sm:9px; --r-md:14px; --r-lg:20px; --r-full:999px;

  --f-display:"Segoe UI Variable Display",system-ui,-apple-system,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-legal:ui-serif,Georgia,Cambria,"Times New Roman",serif;
  --f-mono:ui-monospace,"SF Mono","Cascadia Mono","Segoe UI Mono",Menlo,monospace;

  --t-h1:clamp(1.02rem,.95rem + .3vw,1.2rem);
  --t-h2:clamp(1.2rem,1.05rem + .6vw,1.55rem);
  --t-h3:clamp(1rem,.95rem + .25vw,1.12rem);
  --t-sm:.86rem;
  --t-xs:.75rem;

  --e-out:cubic-bezier(.22,1,.36,1);
  --e-spring:cubic-bezier(.34,1.56,.64,1);

  /* ── Compatibilidad con SVG y contenido generado ── */
  --panel:var(--surface);
  --ink2:var(--ink-2);
  --acc:var(--brand);
  --acc-soft:var(--brand-soft);
  --g:var(--ok); --y:var(--mid); --r:var(--exc);
}

html[data-theme="dark"]{
  --bg:#0a0b0f;
  --bg-grad:radial-gradient(1100px 560px at 12% -8%, #1c1740 0%, transparent 55%),
            radial-gradient(850px 460px at 96% 0%, #08302b 0%, transparent 50%);
  --surface:#13151b;
  --surface-2:#1a1d25;
  --surface-3:#232733;
  --line:#262a34;
  --line-strong:#343947;

  --ink:#eceef4;
  --ink-2:#9ba2b3;
  --ink-3:#6e7585;

  --brand:#8b6dff;
  --brand-2:#a78bff;
  --brand-soft:#1e1a3d;
  --brand-ring:rgba(139,109,255,.22);

  --legal:#a5b4fc; --legal-bg:#191b3a;
  --ej:#34d399;    --ej-bg:#0c2a24;
  --warn:#fbbf24;  --warn-bg:#2e2110;
  --exc:#fb7185;   --exc-bg:#331119;

  --ok:#4ade80; --ok-soft:#0e2a19;
  --mid:#facc15; --mid-soft:#2c2610;
  --off:#5b6070; --off-soft:#1c1f27;

  --sh-1:0 1px 2px rgba(0,0,0,.3), 0 2px 8px rgba(0,0,0,.25);
  --sh-2:0 2px 6px rgba(0,0,0,.35), 0 12px 28px rgba(0,0,0,.4);
  --sh-3:0 8px 20px rgba(139,109,255,.2), 0 24px 56px rgba(0,0,0,.5);
}

*,*::before,*::after{box-sizing:border-box}
html{font-size:var(--fs);scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);background-image:var(--bg-grad);
  background-attachment:fixed;background-repeat:no-repeat;
  color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.68;
  -webkit-font-smoothing:antialiased;
  transition:background-color .5s var(--e-out),color .3s;
}
::selection{background:var(--brand);color:#fff}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{font-family:var(--f-display);letter-spacing:-.022em;line-height:1.2}
.num{font-variant-numeric:tabular-nums}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:99px;border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3)}

/* ═══ HEADER ═══ */
header.top{
  position:sticky;top:0;z-index:60;
  background:color-mix(in srgb,var(--surface) 80%,transparent);
  backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);
  border-bottom:1px solid var(--line);
}
.top-in{max-width:1280px;margin:0 auto;padding:.65rem 1.1rem;display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.brandwrap{display:flex;align-items:center;gap:.65rem;min-width:0;flex:1}
.mark{
  width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;
  font-weight:800;font-size:.8rem;letter-spacing:-.02em;text-decoration:none;
  box-shadow:0 4px 14px var(--brand-ring);
  transition:transform .3s var(--e-spring),box-shadow .3s;
}
.mark:hover{transform:rotate(-8deg) scale(1.08);box-shadow:var(--sh-3);text-decoration:none}
.top h1{font-size:var(--t-h1);margin:0;font-weight:800;line-height:1.25;min-width:0}
.top h1 .sub{display:block;font-size:var(--t-xs);color:var(--ink-2);font-weight:500;letter-spacing:0;
  margin-top:.1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tools{margin-left:auto;display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}

button,select,input[type=search]{
  font:inherit;font-size:var(--t-sm);font-weight:600;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:var(--r-sm);padding:.4rem .72rem;cursor:pointer;
  position:relative;overflow:hidden;
  transition:transform .18s var(--e-spring),border-color .2s,background .2s,box-shadow .2s,color .2s;
}
button:hover{transform:translateY(-1.5px);border-color:var(--brand);box-shadow:var(--sh-1)}
button:active{transform:translateY(0) scale(.97)}
button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible{outline:none;box-shadow:var(--sh-glow)}
input[type=search]{min-width:190px;cursor:text;font-weight:500}
input[type=search]:focus{border-color:var(--brand)}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--surface-2);padding:2px;gap:2px}
.seg button{border:0;border-radius:calc(var(--r-sm) - 2px);padding:.32rem .68rem;background:transparent;box-shadow:none}
.seg button:hover{transform:none;background:var(--surface)}
.seg button[aria-pressed="true"]{background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;box-shadow:0 2px 8px var(--brand-ring)}

.ripple{position:absolute;border-radius:50%;transform:scale(0);background:currentColor;opacity:.25;animation:rip .55s linear;pointer-events:none}
@keyframes rip{to{transform:scale(3.4);opacity:0}}

.progress{position:absolute;left:0;bottom:-1px;height:2.5px;width:0;
  background:linear-gradient(90deg,var(--brand),var(--legal),var(--ej));transition:width .1s linear}

/* ═══ LAYOUT ═══ */
.layout{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:270px 1fr;gap:1.8rem;padding:1.4rem 1.1rem 5rem}
main{min-width:0}

/* ═══ SIDEBAR ═══ */
nav.side{
  position:sticky;top:76px;align-self:start;max-height:calc(100vh - 96px);overflow:auto;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:.85rem;box-shadow:var(--sh-1);
}
nav.side h2{font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);
  margin:.5rem .4rem .5rem;font-weight:800}
nav.side h2:first-child{margin-top:.1rem}
nav.side a{
  display:flex;align-items:baseline;gap:.5rem;padding:.36rem .55rem;border-radius:var(--r-sm);
  text-decoration:none;color:var(--ink-2);font-size:var(--t-sm);font-weight:500;
  position:relative;transition:background .22s,color .22s,transform .22s var(--e-out);
}
nav.side a:hover{background:var(--surface-2);color:var(--ink);transform:translateX(3px);text-decoration:none}
nav.side a.on{background:var(--brand-soft);color:var(--brand);font-weight:700}
nav.side a.on::before{content:"";position:absolute;left:-.85rem;top:20%;bottom:20%;width:3px;
  border-radius:0 3px 3px 0;background:var(--brand)}
nav.side a b{color:var(--ink-3);font-weight:800;font-size:var(--t-xs);font-variant-numeric:tabular-nums;flex:none;min-width:1.9em}
nav.side a.on b{color:var(--brand)}
.navtoggle{display:none}

/* ═══ TARJETAS ═══ */
section.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:1.35rem 1.5rem;margin-bottom:1.1rem;box-shadow:var(--sh-1);
  transition:box-shadow .3s var(--e-out),border-color .3s;
}
section.card:hover{box-shadow:var(--sh-2)}
section.card>h2{
  margin:0 0 1rem;font-size:var(--t-h2);font-weight:800;
  display:flex;align-items:center;gap:.6rem;
}
section.card>h2::before{
  content:"";width:4px;height:1.05em;border-radius:99px;flex:none;
  background:linear-gradient(180deg,var(--brand),var(--brand-2));
}

/* ═══ ARTÍCULO ═══ */
.art{scroll-margin-top:86px;padding-top:.4rem}
.art + .art{margin-top:1.6rem;padding-top:1.6rem;border-top:1px dashed var(--line)}
.art h2{display:flex;flex-wrap:wrap;gap:.5rem;align-items:baseline;font-size:var(--t-h3);
  margin:0 0 .25rem;font-weight:800;letter-spacing:-.015em}
.art h2 .num{
  color:var(--brand);font-weight:800;font-family:var(--f-display);
  background:var(--brand-soft);padding:.1rem .5rem;border-radius:var(--r-sm);
  font-size:.92em;letter-spacing:-.02em;
}
.ubic{font-size:var(--t-xs);color:var(--ink-3);margin:0 0 .8rem;font-weight:600;
  letter-spacing:.03em;text-transform:uppercase}

/* ═══ IDEA CLAVE ═══ */
.idea{
  background:linear-gradient(100deg,var(--brand-soft),color-mix(in srgb,var(--brand-soft) 40%,transparent));
  border-left:4px solid var(--brand);border-radius:0 var(--r-md) var(--r-md) 0;
  padding:.75rem 1rem;font-weight:650;margin:.7rem 0 1rem;position:relative;
  font-size:.97rem;line-height:1.55;
}

/* ═══ ACORDEÓN ═══ */
details.panel{
  border:1px solid var(--line);border-radius:var(--r-md);margin:.6rem 0;
  background:var(--surface);overflow:hidden;
  transition:border-color .25s,box-shadow .25s,background .25s;
}
details.panel:hover{border-color:var(--line-strong)}
details.panel[open]{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-ring)}
details.panel>summary{
  cursor:pointer;padding:.62rem .9rem;font-weight:700;font-size:.93rem;
  list-style:none;display:flex;align-items:center;gap:.55rem;
  transition:background .2s,color .2s;
}
details.panel>summary:hover{background:var(--surface-2)}
details.panel[open]>summary{background:var(--brand-soft);color:var(--brand)}
details.panel>summary::-webkit-details-marker{display:none}
details.panel>summary::before{
  content:"";width:16px;height:16px;flex:none;border-radius:5px;
  background:var(--brand-soft);position:relative;transition:transform .3s var(--e-spring),background .25s;
}
details.panel>summary::after{
  content:"";position:absolute;width:0;height:0;margin-left:5px;
  border:4px solid transparent;border-left-color:var(--brand);
  transition:transform .3s var(--e-spring);
}
details.panel[open]>summary::before{background:var(--surface)}
details.panel[open]>summary::after{transform:rotate(90deg) translateX(-1px)}
details.panel .body{padding:.3rem 1rem 1rem;font-size:.95rem;animation:slidein .35s var(--e-out)}
@keyframes slidein{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* ═══ TEXTO LEGAL ═══ */
.legal{
  background:var(--legal-bg);border-left:4px solid var(--legal);
  border-radius:0 var(--r-md) var(--r-md) 0;padding:.85rem 1.05rem;
  font-family:var(--f-legal);font-size:.95rem;line-height:1.7;
}
.legal p{margin:.45rem 0}
.legal .lbl{
  font-family:var(--f-body);font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;
  color:var(--legal);font-weight:800;display:block;margin-bottom:.4rem;
}

/* ═══ CAJAS SEMÁNTICAS ═══ */
.box{
  border-left:4px solid var(--line);border-radius:0 var(--r-md) var(--r-md) 0;
  padding:.72rem .95rem;margin:.65rem 0;font-size:.94rem;
  transition:transform .25s var(--e-out),box-shadow .25s;
}
.box:hover{transform:translateX(3px);box-shadow:var(--sh-1)}
.box.ej{background:var(--ej-bg);border-color:var(--ej)}
.box.warn{background:var(--warn-bg);border-color:var(--warn)}
.box.exc{background:var(--exc-bg);border-color:var(--exc)}
.box .lbl{font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;font-weight:800;
  display:block;margin-bottom:.3rem}
.box.ej .lbl{color:var(--ej)}
.box.warn .lbl{color:var(--warn)}
.box.exc .lbl{color:var(--exc)}

.interp{
  border:1px dashed var(--warn);background:color-mix(in srgb,var(--warn-bg) 45%,transparent);
  border-radius:var(--r-md);padding:.65rem .9rem;font-size:.9rem;margin:.6rem 0;
}
.interp .lbl{font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;color:var(--warn);font-weight:800;display:block}

/* ═══ TABLAS ═══ */
table{width:100%;border-collapse:separate;border-spacing:0;font-size:.9rem;margin:.7rem 0;
  border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
th,td{padding:.5rem .68rem;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
td + td, th + th{border-left:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th{background:var(--surface-2);font-size:var(--t-xs);font-weight:800;letter-spacing:.05em;
  text-transform:uppercase;color:var(--ink-2);position:sticky;top:0}
tbody tr{transition:background .18s}
tbody tr:nth-child(even){background:color-mix(in srgb,var(--surface-2) 45%,transparent)}
tbody tr:hover{background:var(--brand-soft)}
th.sortable{cursor:pointer;user-select:none;transition:color .2s,background .2s}
th.sortable:hover{color:var(--brand);background:var(--brand-soft)}
th.sortable::after{content:" ⇅";color:var(--ink-3);font-size:.7rem}

ul,ol{margin:.5rem 0 .5rem 1.2rem;padding:0}
li{margin:.26rem 0}
li::marker{color:var(--brand);font-weight:700}

/* ═══ TOOLTIPS ═══ */
.t{border-bottom:1.5px dotted var(--brand);cursor:help;position:relative;
  transition:background .2s,color .2s}
.t:hover{background:var(--brand-soft);color:var(--brand);border-radius:3px}
#tip{
  position:fixed;z-index:99;max-width:330px;background:var(--ink);color:var(--bg);
  padding:.6rem .78rem;border-radius:var(--r-md);font-size:.82rem;line-height:1.5;
  display:none;box-shadow:0 8px 30px rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.08);
}
html[data-theme="dark"] #tip{background:#f0f1f5;color:#15161c}

/* ═══ FLECHAS DE DIAGRAMA ═══
   Un <path> con stroke pero sin fill toma el valor inicial (negro) y el
   navegador cierra el trazo implícitamente: aparece un triángulo relleno
   entre sus extremos. Forzamos fill:none para dejar solo la línea + la
   punta del <marker>, que sí lleva su color. */
svg path[stroke]:not([fill]){fill:none}
svg polyline:not([fill]){fill:none}
svg line{fill:none}

/* ═══ SVG ═══ */
svg{max-width:100%;height:auto;display:block;margin:.9rem auto}
svg text{font-family:var(--f-body)}

/* ═══ BUSCADOR ═══ */
mark.hit{background:linear-gradient(180deg,transparent 55%,#ffe066 55%);color:inherit;
  border-radius:2px;padding:0 1px;font-weight:600}
html[data-theme="dark"] mark.hit{background:linear-gradient(180deg,transparent 55%,#8a6d00 55%);color:#fff}

/* ═══ UTILIDADES ═══ */
.hide{display:none !important}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.small{font-size:var(--t-sm);color:var(--ink-2)}
.chip{
  display:inline-block;font-size:var(--t-xs);padding:.16rem .55rem;border-radius:var(--r-full);
  background:var(--brand-soft);color:var(--brand);font-weight:800;letter-spacing:.02em;
}

/* ═══ HUECOS RELLENABLES ═══ */
.gap{
  display:inline-block;min-width:5.5em;border-bottom:2px solid var(--brand);
  text-align:center;font-weight:700;color:transparent;cursor:pointer;
  transition:color .3s,background .3s;
}
.gap.on,.gap:hover{color:var(--brand);background:var(--brand-soft);border-radius:4px 4px 0 0}

/* ═══ REVELAR SOLUCIÓN ═══ */
.revelar{
  background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;border-color:transparent;
  font-weight:700;
}
.revelar:hover{box-shadow:var(--sh-3)}
.sol{
  margin-top:.7rem;padding:.8rem 1rem;border-radius:var(--r-md);
  background:var(--ej-bg);border-left:4px solid var(--ej);
  animation:slidein .4s var(--e-out);
}

/* ═══ TEST ═══ */
.opt{
  display:block;padding:.55rem .85rem;margin:.35rem 0;border:1.5px solid var(--line);
  border-radius:var(--r-md);cursor:pointer;background:var(--surface);font-size:.94rem;
  transition:border-color .22s,background .22s,transform .22s var(--e-out);
}
.opt:hover{border-color:var(--brand);background:var(--brand-soft);transform:translateX(4px)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft);font-weight:650}
.opt.ko{border-color:var(--exc);background:var(--exc-bg)}
.opt input{margin-right:.5rem;accent-color:var(--brand)}

#tscore,#semres{
  font-family:var(--f-display);font-weight:800;font-size:1.15rem;letter-spacing:-.02em;
}

/* ═══════════════════════════════════════════════════════════════
   FLASHCARDS 3D · mazo con giro, vuelo de salida y sheen
   ═══════════════════════════════════════════════════════════════ */
#flash{--fc-e:cubic-bezier(.2,.8,.25,1);--fc-h:250px}

/* — Escena — */
.fc-stage{
  perspective:1400px;perspective-origin:50% 45%;
  padding:.4rem 0 .2rem;position:relative;
}
.fc-deck{position:relative;height:var(--fc-h);will-change:transform}

/* — Cartas fantasma del mazo — */
.fc-ghost{
  position:absolute;inset:0;border-radius:var(--r-lg);
  background:var(--surface);border:1px solid var(--line);
  transition:transform .5s var(--fc-e),opacity .5s var(--fc-e);
}
.fc-ghost.g1{transform:translateY(9px) scale(.972);opacity:.75}
.fc-ghost.g2{transform:translateY(18px) scale(.944);opacity:.45}
.fc-deck.empty .fc-ghost{opacity:0;transform:translateY(26px) scale(.9)}

/* — Elevación durante el giro — */
.fc-lift{position:absolute;inset:0;transform-style:preserve-3d}
.fc-lift.lift{animation:fcLift .78s var(--fc-e)}
@keyframes fcLift{
  0%,100%{transform:scale(1) translateY(0)}
  45%{transform:scale(1.055) translateY(-16px)}
}
.fc-lift.out-ok{animation:fcOut .5s cubic-bezier(.5,0,.75,0) forwards}
.fc-lift.out-ko{animation:fcOutKo .5s cubic-bezier(.5,0,.75,0) forwards}
.fc-lift.in{animation:fcIn .48s var(--fc-e)}
@keyframes fcOut{
  0%{transform:translateX(0) rotate(0) scale(1);opacity:1}
  100%{transform:translateX(130%) rotate(17deg) scale(.85);opacity:0}
}
@keyframes fcOutKo{
  0%{transform:translateX(0) rotate(0) scale(1);opacity:1}
  100%{transform:translateX(-130%) rotate(-17deg) scale(.85);opacity:0}
}
@keyframes fcIn{
  0%{transform:translateY(26px) scale(.9);opacity:0}
  100%{transform:translateY(0) scale(1);opacity:1}
}

/* — La carta — */
.fc-card{
  position:absolute;inset:0;transform-style:preserve-3d;
  transition:transform .78s var(--fc-e);
  cursor:pointer;border-radius:var(--r-lg);
}
.fc-card:focus-visible{outline:none}
.fc-card:focus-visible .fc-face{box-shadow:var(--sh-glow),var(--sh-2)}

/* — Caras — */
.fc-face{
  position:absolute;inset:0;border-radius:var(--r-lg);
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  padding:2rem 2.2rem;text-align:center;overflow:hidden;
  box-shadow:var(--sh-2);
  transition:box-shadow .4s var(--fc-e);
}
.fc-card:hover .fc-face{box-shadow:var(--sh-3)}

/* Anverso · pregunta */
.fc-front{
  background:
    radial-gradient(120% 90% at 50% -20%, var(--brand-soft) 0%, transparent 60%),
    var(--surface);
  border:1.5px solid var(--line);color:var(--ink);
}
/* Reverso · respuesta */
.fc-back{
  transform:rotateY(180deg);
  background:linear-gradient(145deg,var(--brand) 0%,#6d4bf7 45%,var(--c5,#0891b2) 130%);
  border:1.5px solid transparent;color:#fff;
}
html[data-theme="dark"] .fc-back{
  background:linear-gradient(145deg,#5f45c9 0%,#4b3aa8 45%,#0e6b85 130%);
}
.fc-back .fc-txt{color:#fff}
.fc-back b,.fc-back strong{color:#fff;font-weight:800}

/* — Sheen que barre al girar — */
.fc-face::after{
  content:"";position:absolute;top:-60%;left:-70%;width:55%;height:220%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.42),transparent);
  transform:rotate(18deg);opacity:0;pointer-events:none;
}
.fc-lift.lift .fc-face::after{animation:fcSheen .78s var(--fc-e)}
@keyframes fcSheen{
  0%{opacity:0;left:-70%}
  35%{opacity:1}
  100%{opacity:0;left:150%}
}

/* — Etiqueta superior — */
.fc-tag{
  position:absolute;top:1rem;left:1.15rem;
  font-size:var(--t-xs);font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  display:inline-flex;align-items:center;gap:.4rem;
}
.fc-front .fc-tag{color:var(--brand)}
.fc-back .fc-tag{color:rgba(255,255,255,.9)}
.fc-tag::before{
  content:"";width:7px;height:7px;border-radius:50%;background:currentColor;
  animation:fcPulse 2.2s ease-in-out infinite;
}
@keyframes fcPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.65)}}

/* — Índice tipo naipe — */
.fc-pip{
  position:absolute;font-family:var(--f-display);font-weight:800;
  font-size:.78rem;letter-spacing:-.02em;opacity:.34;font-variant-numeric:tabular-nums;
}
.fc-pip.tr{top:1rem;right:1.15rem}
.fc-pip.bl{bottom:1rem;left:1.15rem;transform:rotate(180deg)}
.fc-front .fc-pip{color:var(--ink-2)}
.fc-back .fc-pip{color:#fff;opacity:.55}

/* — Texto — */
.fc-txt{
  font-size:clamp(1rem,.9rem + .55vw,1.28rem);font-weight:650;line-height:1.5;
  max-width:44ch;letter-spacing:-.012em;
}
.fc-front .fc-txt{font-family:var(--f-display);font-weight:700}
.fc-back .fc-txt{font-weight:600;line-height:1.6}
.fc-hint{
  position:absolute;bottom:1rem;left:0;right:0;
  font-size:var(--t-xs);font-weight:600;letter-spacing:.02em;
  display:flex;align-items:center;justify-content:center;gap:.4rem;
}
.fc-front .fc-hint{color:var(--ink-3)}
.fc-back .fc-hint{color:rgba(255,255,255,.72)}
.fc-hint .kbd{
  font-family:var(--f-mono);font-size:.68rem;font-weight:700;padding:.1rem .32rem;
  border-radius:5px;border:1px solid currentColor;opacity:.75;
}

/* — Pantalla final — */
.fc-done{
  position:absolute;inset:0;border-radius:var(--r-lg);
  background:linear-gradient(150deg,var(--ok-soft),var(--surface) 70%);
  border:1.5px solid var(--ok);
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  text-align:center;padding:2rem;gap:.35rem;
  animation:fcIn .5s var(--fc-e);box-shadow:var(--sh-2);
}
.fc-done .seal{
  font-size:2.6rem;line-height:1;
  animation:fcSeal .7s cubic-bezier(.2,1.5,.4,1);
}
@keyframes fcSeal{0%{transform:scale(0) rotate(-25deg);opacity:0}60%{transform:scale(1.2) rotate(6deg)}100%{transform:scale(1) rotate(0);opacity:1}}
.fc-done h3{font-size:1.3rem;font-weight:800;margin:.2rem 0 0}
.fc-done p{margin:0;color:var(--ink-2);font-size:var(--t-sm)}

/* — Barra de progreso de la ronda — */
.fc-bar{
  height:6px;border-radius:99px;background:var(--surface-3);
  overflow:hidden;margin:.95rem 0 .8rem;position:relative;
}
.fc-bar i{
  display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--brand),var(--c5,#0891b2));
  transition:width .55s var(--fc-e);
}

/* — Controles — */
.fc-ctrls{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.fc-ctrls button{font-weight:700}
#fcok{border-color:var(--ok);color:var(--ok)}
#fcok:hover{background:var(--ok);color:#fff;border-color:var(--ok)}
#fcko{border-color:var(--warn);color:var(--warn)}
#fcko:hover{background:var(--warn);color:#fff;border-color:var(--warn)}
#fcflip{background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;border-color:transparent}
#fcflip:hover{box-shadow:var(--sh-3)}

.fc-score{display:inline-flex;gap:.45rem;margin-left:auto;align-items:center}
.fc-pill{
  font-size:var(--t-xs);font-weight:800;padding:.24rem .6rem;border-radius:var(--r-full);
  font-variant-numeric:tabular-nums;border:1px solid;
}
.fc-pill.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.fc-pill.ko{color:var(--warn);border-color:var(--warn);background:var(--warn-bg)}
.fc-pill.left{color:var(--ink-2);border-color:var(--line);background:var(--surface-2)}
.fc-pill.bump{animation:fcBump .45s var(--e-spring)}
@keyframes fcBump{0%{transform:scale(1)}45%{transform:scale(1.28)}100%{transform:scale(1)}}

@media(max-width:620px){
  #flash{--fc-h:270px}
  .fc-face{padding:1.7rem 1.3rem}
  .fc-score{margin-left:0;width:100%}
}
@media(prefers-reduced-motion:reduce){
  .fc-card{transition:none}
  .fc-lift.lift,.fc-lift.in,.fc-lift.out-ok,.fc-lift.out-ko,.fc-face::after{animation:none !important}
}
@media print{.fc-stage,.fc-ctrls,.fc-bar{display:none !important}}
/* ═══ RESPUESTA ESTRUCTURADA ═══ */
.fc-face{justify-content:center}
.fc-face.struct{justify-content:flex-start;text-align:left;padding-top:3.1rem;padding-bottom:3.1rem}
.fc-body{
  width:100%;max-width:46ch;margin:0 auto;
  overflow-y:auto;max-height:100%;
  scrollbar-width:thin;
}
.fc-body::-webkit-scrollbar{width:5px}
.fc-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.35);border-radius:99px;border:0}
.fc-front .fc-body::-webkit-scrollbar-thumb{background:var(--line-strong)}

/* — Veredicto Sí / No — */
.fc-verdict{
  display:inline-flex;align-items:center;gap:.35rem;
  font-family:var(--f-display);font-weight:800;font-size:.82rem;
  letter-spacing:.06em;text-transform:uppercase;
  padding:.26rem .72rem;border-radius:var(--r-full);margin-bottom:.85rem;
  border:1.5px solid;animation:fcPopIn .45s var(--e-spring) backwards;animation-delay:.34s;
}
.fc-verdict.si{background:rgba(255,255,255,.16);border-color:rgba(190,255,215,.85);color:#d8ffe9}
.fc-verdict.no{background:rgba(255,255,255,.16);border-color:rgba(255,205,205,.85);color:#ffdedd}
@keyframes fcPopIn{0%{opacity:0;transform:scale(.7) translateY(6px)}100%{opacity:1;transform:none}}

/* — Párrafo — */
.fc-p{margin:0;font-size:clamp(1rem,.92rem + .45vw,1.2rem);font-weight:600;line-height:1.6}
.fc-face.struct .fc-p{font-size:clamp(.96rem,.9rem + .35vw,1.1rem)}

/* — Lista enumerada — */
.fc-list{list-style:none;margin:0;padding:0;display:grid;gap:.5rem;counter-reset:fc}
.fc-list li{
  counter-increment:fc;position:relative;margin:0;
  padding:.42rem .6rem .42rem 2.5rem;border-radius:var(--r-sm);
  background:rgba(255,255,255,.11);
  font-size:clamp(.92rem,.88rem + .3vw,1.04rem);font-weight:600;line-height:1.45;
  animation:fcRow .42s var(--e-out) backwards;
}
.fc-list li::before{
  content:counter(fc);position:absolute;left:.6rem;top:50%;transform:translateY(-50%);
  width:1.6rem;height:1.6rem;border-radius:50%;
  display:grid;place-items:center;
  background:rgba(255,255,255,.9);color:var(--brand);
  font-family:var(--f-display);font-weight:800;font-size:.78rem;
  font-variant-numeric:tabular-nums;
}
.fc-list.alpha li::before{content:counter(fc,lower-alpha)}
.fc-list li:nth-child(1){animation-delay:.36s}
.fc-list li:nth-child(2){animation-delay:.42s}
.fc-list li:nth-child(3){animation-delay:.48s}
.fc-list li:nth-child(4){animation-delay:.54s}
.fc-list li:nth-child(5){animation-delay:.60s}
.fc-list li:nth-child(n+6){animation-delay:.66s}
@keyframes fcRow{0%{opacity:0;transform:translateX(-12px)}100%{opacity:1;transform:none}}

/* — Cláusulas contrapuestas — */
.fc-clauses{display:grid;gap:.45rem}
.fc-clauses p{
  margin:0;padding:.45rem .7rem .45rem .95rem;border-radius:0 var(--r-sm) var(--r-sm) 0;
  background:rgba(255,255,255,.11);border-left:3px solid rgba(255,255,255,.55);
  font-size:clamp(.92rem,.88rem + .3vw,1.04rem);font-weight:600;line-height:1.5;
  animation:fcRow .42s var(--e-out) backwards;
}
.fc-clauses p:nth-child(1){animation-delay:.36s}
.fc-clauses p:nth-child(2){animation-delay:.44s}
.fc-clauses p:nth-child(3){animation-delay:.52s}

/* — Negritas resaltadas en el reverso — */
.fc-back .fc-body b,.fc-back .fc-body strong{
  font-weight:800;background:rgba(255,255,255,.2);
  padding:.03em .3em;border-radius:5px;
  box-decoration-break:clone;-webkit-box-decoration-break:clone;
}

/* — Cita legal al pie — */
.fc-cite{
  position:absolute;bottom:.95rem;left:0;right:0;
  display:inline-flex;align-items:center;justify-content:center;gap:.4rem;
  font-family:var(--f-mono);font-size:.74rem;font-weight:700;letter-spacing:.02em;
  color:rgba(255,255,255,.82);
  animation:fcPopIn .5s var(--e-out) backwards;animation-delay:.5s;
}
.fc-cite::before,.fc-cite::after{
  content:"";height:1px;width:clamp(18px,10%,52px);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.45));
}
.fc-cite::after{background:linear-gradient(90deg,rgba(255,255,255,.45),transparent)}
.fc-cite .s{font-size:.9rem;opacity:.75;font-family:var(--f-legal)}
.fc-front .fc-cite{color:var(--ink-3)}
.fc-front .fc-cite::before{background:linear-gradient(90deg,transparent,var(--line-strong))}
.fc-front .fc-cite::after{background:linear-gradient(90deg,var(--line-strong),transparent)}

/* la pista se oculta si hay cita, para no amontonar */
.fc-back .fc-cite ~ .fc-hint,.fc-back .fc-hint.muted{display:none}

@media(max-width:620px){
  #flash{--fc-h:320px}
  .fc-face.struct{padding-top:2.9rem;padding-bottom:2.8rem}
  .fc-list li{padding-left:2.3rem}
}
@media(prefers-reduced-motion:reduce){
  .fc-verdict,.fc-list li,.fc-clauses p,.fc-cite{animation:none !important}
}

/* ═══ SEMÁFORO ═══ */
.sembtn{
  border-radius:var(--r-full);padding:.32rem .7rem;font-weight:700;font-size:var(--t-sm);
}
.sembtn[data-v="g"]:hover,.sembtn.on[data-v="g"]{background:var(--ok);color:#fff;border-color:var(--ok)}
.sembtn[data-v="y"]:hover,.sembtn.on[data-v="y"]{background:var(--mid);color:#3d2f00;border-color:var(--mid)}
.sembtn[data-v="r"]:hover,.sembtn.on[data-v="r"]{background:var(--exc);color:#fff;border-color:var(--exc)}

/* ═══ CTA DE BLOQUE ═══ */
a.blk{
  display:inline-flex;align-items:center;gap:.5rem;
  background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;
  padding:.5rem .95rem;border-radius:var(--r-sm);font-weight:700;font-size:var(--t-sm);
  text-decoration:none;box-shadow:0 2px 10px var(--brand-ring);
  transition:transform .22s var(--e-spring),box-shadow .25s,gap .25s var(--e-out);
}
a.blk:hover{transform:translateY(-2px);box-shadow:var(--sh-3);gap:.75rem;text-decoration:none}
a.blk::after{content:"→"}
a.blk:active{transform:translateY(0) scale(.98)}

/* ═══ REVEAL ═══ */
.rv{opacity:0;transform:translateY(20px);transition:opacity .6s var(--e-out),transform .6s var(--e-out)}
.rv.in{opacity:1;transform:none}

/* ═══ RESPONSIVE ═══ */
@media(max-width:960px){
  .layout{grid-template-columns:1fr;padding-top:.9rem;gap:1rem}
  nav.side{position:static;max-height:none}
  nav.side.collapsed .navbody{display:none}
  .navtoggle{display:block;width:100%;text-align:left;font-weight:700}
  .grid2{grid-template-columns:1fr}
  .top h1 .sub{white-space:normal}
}
@media(max-width:620px){
  .top-in{padding:.55rem .8rem}
  .tools{width:100%;margin-left:0}
  input[type=search]{flex:1;min-width:0}
  section.card{padding:1.05rem 1rem;border-radius:var(--r-md)}
  table{font-size:.82rem}
  th,td{padding:.4rem .5rem}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
  .rv{opacity:1;transform:none}
}
@media print{
  header.top,nav.side,.tools,.noprint,.progress{display:none !important}
  body{background:#fff;background-image:none;font-size:11pt;color:#000}
  .layout{display:block;max-width:none;padding:0}
  section.card{border:0;padding:0;margin:0 0 1rem;break-inside:avoid;box-shadow:none}
  details.panel{border:0;box-shadow:none}
  details.panel .body{display:block !important}
  details.panel>summary{padding-left:0}
  .art{break-inside:avoid}
  .rv{opacity:1;transform:none}
  a{color:#000;text-decoration:none}
}


/* ═══ ALTURA ADAPTATIVA DE LA TARJETA ═══ */
.fc-deck{transition:height .45s var(--fc-e)}
.fc-body{max-height:none;overflow:visible}
.fc-measure{
  position:absolute;left:0;right:0;top:0;height:auto;
  visibility:hidden;pointer-events:none;z-index:-1;
}
.fc-measure .fc-face{
  position:relative;inset:auto;height:auto;min-height:0;
  box-shadow:none;backface-visibility:visible;transform:none;
}
.fc-measure .fc-body{max-height:none;overflow:visible}
.fc-measure .fc-face::after{display:none}

/* ═══ MOSTRAR / OCULTAR ÍNDICE LATERAL ═══ */
.layout{transition:grid-template-columns .42s var(--e-out)}
.layout.nonav{grid-template-columns:0 1fr;gap:0}
.layout.nonav>nav.side{
  opacity:0;transform:translateX(-14px);pointer-events:none;
  padding:0;border-width:0;overflow:hidden;width:0;min-width:0;
}
nav.side{
  transition:opacity .3s var(--e-out),transform .38s var(--e-out);
  overflow-x:hidden;
}
#navhide .ic{display:inline-block;transition:transform .35s var(--e-spring);font-size:.95em;line-height:1}
#navhide[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
#navhide[aria-pressed="true"] .ic{transform:rotate(90deg)}
@media(max-width:960px){#navhide{display:none}}

/* ═══════════════════════════════════════════════════════════════
   LECTURA EN VOZ ALTA (TTS) del texto legal
   ═══════════════════════════════════════════════════════════════ */
.tts-bar{
  display:flex;align-items:center;gap:.45rem;flex-wrap:wrap;
  margin:.15rem 0 .7rem;
}
.tts-bar button{
  font-size:var(--t-xs);font-weight:700;padding:.3rem .62rem;
  border-radius:var(--r-full);border:1px solid var(--legal);
  background:transparent;color:var(--legal);
  display:inline-flex;align-items:center;gap:.35rem;line-height:1.2;
}
.tts-bar button:hover{background:var(--legal);color:var(--surface);border-color:var(--legal)}
.tts-bar button[hidden]{display:none}
.tts-bar .tts-play.on{background:var(--legal);color:var(--surface)}

/* Ondas de audio mientras lee */
.tts-wave{display:inline-flex;align-items:flex-end;gap:2px;height:11px}
.tts-wave i{
  width:2.5px;background:currentColor;border-radius:2px;height:35%;
  animation:ttsW .9s ease-in-out infinite;
}
.tts-wave i:nth-child(2){animation-delay:.15s}
.tts-wave i:nth-child(3){animation-delay:.3s}
.tts-wave i:nth-child(4){animation-delay:.45s}
@keyframes ttsW{0%,100%{height:32%}50%{height:100%}}

.tts-time{
  font-family:var(--f-mono);font-size:.7rem;font-weight:700;
  color:var(--ink-3);font-variant-numeric:tabular-nums;
}

/* Frase que se está leyendo */
.tts-s{transition:background .25s,color .25s;border-radius:3px}
.tts-s.now{
  background:linear-gradient(180deg,transparent 8%,color-mix(in srgb,var(--legal) 26%,transparent) 8%);
  box-shadow:0 0 0 2px color-mix(in srgb,var(--legal) 16%,transparent);
}
html[data-theme="dark"] .tts-s.now{
  background:linear-gradient(180deg,transparent 8%,color-mix(in srgb,var(--legal) 34%,transparent) 8%);
}
.legal.tts-on{box-shadow:0 0 0 3px color-mix(in srgb,var(--legal) 20%,transparent)}

/* ═══ Reproductor flotante ═══ */
.tts-mini{
  position:fixed;left:50%;bottom:1.1rem;transform:translateX(-50%) translateY(140%);
  z-index:80;display:flex;align-items:center;gap:.6rem;
  background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  border:1px solid var(--line);border-radius:var(--r-full);
  padding:.5rem .7rem .5rem .95rem;box-shadow:var(--sh-3);
  transition:transform .45s var(--e-spring),opacity .3s;opacity:0;pointer-events:none;
  max-width:min(94vw,540px);
}
.tts-mini.show{transform:translateX(-50%) translateY(0);opacity:1;pointer-events:auto}
.tts-mini .lbl{
  font-size:var(--t-xs);font-weight:800;color:var(--legal);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:16ch;
}
.tts-mini button{
  border-radius:50%;width:32px;height:32px;padding:0;display:grid;place-items:center;
  font-size:.8rem;border:1px solid var(--line);flex:none;
}
.tts-mini button.main{
  width:38px;height:38px;font-size:.95rem;
  background:linear-gradient(140deg,var(--legal),var(--brand));color:#fff;border-color:transparent;
}
.tts-mini .bar{
  flex:1;min-width:70px;height:5px;border-radius:99px;background:var(--surface-3);overflow:hidden;
}
.tts-mini .bar i{display:block;height:100%;width:0;background:var(--legal);
  border-radius:99px;transition:width .35s var(--e-out)}

/* ═══ Panel de ajustes de voz ═══ */
.tts-back{
  position:fixed;inset:0;z-index:90;background:rgba(10,10,18,.45);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  display:grid;place-items:center;padding:1rem;
  opacity:0;pointer-events:none;transition:opacity .3s var(--e-out);
}
.tts-back.show{opacity:1;pointer-events:auto}
.tts-panel{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--sh-3);width:min(94vw,470px);max-height:88vh;overflow:auto;
  padding:1.3rem 1.4rem;transform:translateY(16px) scale(.97);
  transition:transform .38s var(--e-spring);
}
.tts-back.show .tts-panel{transform:none}
.tts-panel h3{
  font-size:1.12rem;font-weight:800;margin:0 0 .25rem;
  display:flex;align-items:center;gap:.5rem;
}
.tts-panel .sub{font-size:var(--t-sm);color:var(--ink-2);margin:0 0 1.1rem}
.tts-row{margin-bottom:1.05rem}
.tts-row > label{
  display:block;font-size:var(--t-xs);font-weight:800;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-2);margin-bottom:.4rem;
}
.tts-seg{display:flex;gap:3px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:3px}
.tts-seg button{
  flex:1;border:0;background:transparent;border-radius:calc(var(--r-sm) - 3px);
  padding:.42rem .3rem;font-size:var(--t-sm);font-weight:700;box-shadow:none;
}
.tts-seg button:hover{transform:none;background:var(--surface)}
.tts-seg button[aria-pressed="true"]{
  background:linear-gradient(140deg,var(--legal),var(--brand));color:#fff;
}
.tts-panel select{
  width:100%;padding:.5rem .6rem;border-radius:var(--r-sm);
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  font-size:var(--t-sm);font-weight:600;cursor:pointer;
}
.tts-panel select:focus{border-color:var(--brand);outline:none}
.tts-slider{display:flex;align-items:center;gap:.75rem}

  font-family:var(--f-mono);font-weight:800;font-size:var(--t-sm);
  min-width:3.4em;text-align:right;color:var(--legal);font-variant-numeric:tabular-nums;
}
.tts-note{

}
.tts-note b{color:var(--ink)}
.tts-acts{display:flex;gap:.5rem;justify-content:flex-end;flex-wrap:wrap}

/* — Variante compacta para los apartados desplegables — */

.legal.tts-on,.body.tts-on,.idea.tts-on{

}
.legal.tts-on{box-shadow:0 0 0 3px color-mix(in srgb,var(--legal) 20%,transparent)}

@media(max-width:620px){

  .tts-wave i{animation:none;height:60%}

@media print{.tts-bar,.tts-mini,.tts-back{display:none !important}}

<script>
const GLOSARIO={
 "presupuesto":"Documento contable y jurídico, aprobado por el Pleno, que fija el techo de gasto de un ejercicio y estima los ingresos con los que se financia. Ej.: el presupuesto de Utrera para 2026 autoriza gastar como máximo 78 M€.",
 "credito":"Crédito presupuestario: la cantidad máxima de dinero autorizada para una finalidad concreta. Ej.: 120.000 € en la aplicación de 'mantenimiento de colegios'.",
 "obligacion":"Obligación reconocida: la deuda que el Ayuntamiento admite formalmente que debe pagar, una vez comprobado que el servicio o suministro se ha prestado. Ej.: aprobada la factura del proveedor, nace la obligación.",
 "derecho":"Derecho liquidado: el importe concreto que un tercero debe a la entidad local, una vez cuantificado. Ej.: liquidado el IBI de un inmueble en 340 €, ese es el derecho.",
 "oa":"Organismo autónomo: ente con personalidad jurídica propia creado por la entidad local para gestionar un servicio (patronatos de deportes, de cultura, gerencias de urbanismo). Depende del Ayuntamiento pero tiene su propio presupuesto.",
 "sociedad":"Sociedad mercantil local: empresa con forma de S.A. o S.L. cuyo capital pertenece a la entidad local (p. ej. la empresa municipal de aguas). No aprueba 'presupuesto', sino estados de previsión de gastos e ingresos.",
 "bases":"Bases de ejecución: el 'reglamento de uso' del presupuesto. Adaptan las normas presupuestarias generales a la organización concreta de la entidad. Ej.: fijan qué órgano autoriza gastos de hasta 3.000 €.",
 "estabilidad":"Estabilidad presupuestaria: exigencia de que las cuentas públicas no incurran en déficit estructural. Ej.: un ayuntamiento no puede presupuestar más gasto no financiero que ingresos no financieros.",
 "afectacion":"No afectación: regla general de que todos los ingresos financian todo el gasto, sin que un ingreso concreto quede reservado a un gasto concreto. Ej.: lo recaudado por el IBI no está reservado a pagar el alumbrado.",
 "bruto":"Principio de presupuesto bruto (o de integridad): derechos y obligaciones se anotan por su importe total, sin compensar unos con otros. Ej.: no se puede anotar la subvención 'ya descontados' los gastos del programa.",
 "nivelacion":"Nivelación presupuestaria: que el total de ingresos previstos cubra el total de gastos autorizados; es decir, aprobar sin déficit inicial.",
 "aplicacion":"Aplicación presupuestaria: la 'casilla' exacta donde vive cada euro de gasto, formada al cruzar la clasificación por programas con la económica. Ej.: 323/22103 (funcionamiento de centros docentes / combustibles).",
 "vinculacion":"Nivel de vinculación jurídica: el nivel de agregación en el que el crédito es realmente limitativo; por debajo de él se puede mover el gasto sin tramitar una modificación de crédito (art. 172 TRLHL).",
 "intervencion":"Intervención: el órgano de control interno de la entidad local, con función de fiscalización previa del gasto y de informe preceptivo del presupuesto. Lo desempeña un funcionario de habilitación nacional.",
 "pleno":"Pleno: órgano colegiado formado por todos los concejales o diputados. Es el único competente para aprobar el presupuesto.",
 "bop":"Boletín Oficial de la Provincia: diario oficial donde las entidades locales publican sus anuncios y acuerdos con efectos frente a terceros.",
 "prorroga":"Prórroga presupuestaria: si el 1 de enero no ha entrado en vigor el presupuesto nuevo, sigue rigiendo automáticamente el anterior con sus créditos iniciales.",
 "interesado":"Interesado: quien está legitimado para intervenir en un procedimiento. En el presupuesto, la ley define expresamente quiénes lo son (art. 170.1).",
 "liquidacion":"Liquidación del presupuesto: cierre contable del ejercicio, que determina los derechos y obligaciones pendientes, el remanente de tesorería y el resultado presupuestario.",
 "tcuentas":"Tribunal de Cuentas: órgano fiscalizador externo de las cuentas y la gestión económica del sector público, dependiente de las Cortes Generales.",
 "conten":"Recurso contencioso-administrativo: impugnación ante los juzgados y tribunales de lo contencioso-administrativo, es decir, ya fuera de la propia Administración.",
 "oneroso":"Contrato oneroso: aquel en el que el contratista obtiene algún tipo de beneficio económico, directo o indirecto. Es el rasgo que convierte un negocio en contrato sujeto a la LCSP.","pa":"Administración Pública (a efectos de la LCSP): subconjunto del sector público formado por las entidades de las letras a), b), c) y l) del art. 3.1 y ciertos consorcios y entidades de derecho público que no se financian con ingresos de mercado. Son las únicas que celebran contratos administrativos.","poderadj":"Poder adjudicador: entidad que, aunque no sea Administración Pública, está sometida a las reglas de contratación por estar financiada, controlada o dirigida mayoritariamente por el sector público y satisfacer necesidades de interés general no industriales ni mercantiles.","sectorpub":"Sector público (a efectos de la LCSP): el círculo más amplio del art. 3.1, que va de la Administración General del Estado a las asociaciones constituidas por cualquiera de esas entidades.","cpv":"Vocabulario común de contratos públicos (CPV): nomenclatura europea de códigos que identifica de forma uniforme el objeto de cada contrato. Ej.: 45233222-1 = trabajos de pavimentación.","sara":"Contrato sujeto a regulación armonizada (SARA): el que, por su tipo, entidad contratante y valor estimado, queda sometido a las reglas de las directivas europeas, con más publicidad y recurso especial.","necint":"Necesidades de interés general que no tengan carácter industrial o mercantil: criterio europeo para identificar a un poder adjudicador. Se refiere a actividades que el mercado no cubre en condiciones normales de competencia y riesgo.","convenio":"Convenio: acuerdo entre entidades públicas (o con privados) con contenido distinto del propio de un contrato, sin contraprestación de mercado. Si su contenido es el de un contrato, no cabe llamarlo convenio para eludir la ley.","encomienda":"Encomienda de gestión: encargo de la realización material de actividades entre órganos o entidades administrativas, regulado en la LRJSP. No implica cesión de titularidad ni de los elementos sustantivos de la competencia.","patrimonial":"Contrato patrimonial: negocio sobre bienes inmuebles, valores negociables y propiedades incorporales (compraventa, arrendamiento, permuta…). Es privado y se rige por la legislación patrimonial.","domipub":"Dominio público: bienes destinados a un uso o servicio público. Su uso privativo se otorga por autorizaciones y concesiones demaniales, no por contratos de la LCSP.","principios":"Principios de la contratación pública: libertad de acceso, publicidad y transparencia, no discriminación e igualdad de trato, integridad y eficiencia en el uso de los fondos públicos."
};
const ARTS=[{n:1,t:"Objeto y finalidad",ubic:"Título Preliminar (Disposiciones generales) ▸ Capítulo I (Objeto y ámbito de aplicación de la Ley) ▸ Sección 1.ª (Objeto y ámbito de aplicación)",idea:"Regular la contratación pública para que sea limpia, competitiva y eficiente.",literal:`<p>1. La presente Ley tiene por objeto regular la contratación del sector público, a fin de garantizar que la misma se ajusta a los principios de libertad de acceso a las licitaciones, publicidad y transparencia de los procedimientos, y no discriminación e igualdad de trato entre los licitadores; y de asegurar, en conexión con el objetivo de estabilidad presupuestaria y control del gasto, y el principio de integridad, una eficiente utilización de los fondos destinados a la realización de obras, la adquisición de bienes y la contratación de servicios mediante la exigencia de la definición previa de las necesidades a satisfacer, la salvaguarda de la libre competencia y la selección de la oferta económicamente más ventajosa.</p><p>2. Es igualmente objeto de esta Ley la regulación del régimen jurídico aplicable a los efectos, cumplimiento y extinción de los contratos administrativos, en atención a los fines institucionales de carácter público que a través de los mismos se tratan de realizar.</p><p>3. En toda contratación pública se incorporarán de manera transversal y preceptiva criterios sociales y medioambientales siempre que guarde relación con el objeto del contrato, en la convicción de que su inclusión proporciona una mejor relación calidad-precio en la prestación contractual, así como una mayor y mejor eficiencia en la utilización de los fondos públicos. Igualmente se facilitará el acceso a la contratación pública de las pequeñas y medianas empresas, así como de las empresas de economía social.</p>`,dis:`<table><thead><tr><th>Apdo.</th><th>Contenido</th><th>Palabras clave</th></tr></thead><tbody>
<tr><td>1.1</td><td>Objeto: regular la contratación del sector público</td><td><b>Principios</b>: libertad de acceso · publicidad y transparencia · no discriminación e igualdad de trato · integridad · eficiencia. <b>Instrumentos</b>: definición previa de las necesidades · salvaguarda de la libre competencia · selección de la <b>oferta económicamente más ventajosa</b></td></tr>
<tr><td>1.2</td><td>Objeto también: régimen jurídico de <b>efectos, cumplimiento y extinción</b> de los contratos administrativos</td><td>por sus fines institucionales de carácter público</td></tr>
<tr><td>1.3</td><td>Criterios <b>sociales y medioambientales</b> de manera <b>transversal y preceptiva</b>, siempre que guarden relación con el objeto del contrato</td><td>+ facilitar el acceso de <b>PYMES</b> y <b>empresas de economía social</b></td></tr>
</tbody></table>`,llano:`<p>Cuando la Administración compra, no puede elegir a quien le apetezca ni pagar lo que quiera. Esta ley existe para que cualquiera pueda presentarse, para que se sepa lo que se contrata y por cuánto, para que nadie tenga ventaja y para que el dinero público rinda. Y desde 2017, además, para que cada contrato empuje objetivos sociales y ambientales y para que las pequeñas empresas puedan participar.</p>`,porque:`<p>La contratación pública mueve en torno al 10-15 % del PIB. Sin reglas, sería el terreno natural del favoritismo y de la corrupción. Los principios del art. 1.1 no son decorativos: son el <b>canon de interpretación</b> de toda la ley, y los tribunales los usan para resolver lo que la letra no prevé. El apartado 3 marca el cambio de filosofía de la LCSP: la compra pública deja de ser solo un gasto y pasa a ser una <b>política pública</b>.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> las normas de un concurso de plazas: bases públicas, mismos requisitos para todos y un criterio de selección conocido de antemano.</li>
<li><b>Real:</b> el Ayuntamiento de Sevilla licita la limpieza de colegios por 3,4 M€. Publica el anuncio, admite a cualquier empresa que reúna la solvencia exigida, incluye como criterio la estabilidad de la plantilla y divide el contrato en lotes para que puedan concurrir PYMES.</li>
<li><b>Caso límite:</b> un criterio de adjudicación que premie tener sede en el municipio: vulnera la no discriminación del art. 1.1, aunque persiga un fin social, porque no guarda relación con el objeto del contrato.</li>
</ul>`,noej:`<ul>
<li><b>No es objeto</b> de esta ley la actividad de fomento (subvenciones): tiene su propia ley, la 38/2003.</li>
<li><b>No basta</b> con invocar lo social: los criterios deben <b>guardar relación con el objeto del contrato</b>.</li>
<li><b>El apartado 2</b> se refiere solo a los contratos <b>administrativos</b>: efectos, cumplimiento y extinción.</li>
</ul>`,conex:`<ul>
<li><b>Art. 132:</b> principios de igualdad, transparencia y libre competencia en la adjudicación.</li>
<li><b>Art. 145:</b> mejor relación calidad-precio y criterios de adjudicación.</li>
<li><b>Art. 28:</b> necesidad e idoneidad del contrato: la "definición previa de las necesidades" del art. 1.1.</li>
<li><b>Art. 99.3:</b> división en lotes, instrumento de acceso de las PYMES.</li>
</ul>`,trampas:`<ul>
<li>La ley ya no habla de "oferta económicamente más ventajosa" solo como precio: el art. 145 la vincula a la <b>mejor relación calidad-precio</b>.</li>
<li>Los criterios sociales y medioambientales son <b>transversales y preceptivos</b>, no opcionales, pero condicionados a que <b>se relacionen con el objeto</b>.</li>
<li>Cuidado: la <b>integridad</b> y la <b>estabilidad presupuestaria</b> también aparecen en el apartado 1.</li>
</ul>`,ancla:`<p><b>Los principios — "LPNIE":</b> <b>L</b>ibertad de acceso · <b>P</b>ublicidad y transparencia · <b>N</b>o discriminación e igualdad · <b>I</b>ntegridad · <b>E</b>ficiencia.<br>Y el trío del apartado 3: <b>social, ambiental y PYMES</b>.</p>`,vis:`<svg viewBox="0 0 640 195" role="img" aria-label="Objeto y principios de la LCSP">
<rect x="200" y="10" width="240" height="36" rx="9" fill="var(--acc)" stroke="var(--acc)"/>
<text x="320" y="33" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">OBJETO DE LA LCSP</text>
<line x1="320" y1="46" x2="320" y2="60" stroke="var(--acc)" stroke-width="2"/><line x1="140" y1="60" x2="500" y2="60" stroke="var(--acc)" stroke-width="2"/>
<line x1="140" y1="60" x2="140" y2="76" stroke="var(--acc)" stroke-width="2"/><line x1="500" y1="60" x2="500" y2="76" stroke="var(--acc)" stroke-width="2"/>
<rect x="25" y="76" width="230" height="72" rx="8" fill="var(--acc-soft)" stroke="var(--acc)"/>
<text x="140" y="97" text-anchor="middle" font-size="11" font-weight="700" fill="var(--acc)">1.1 Regular la contratación</text>
<text x="140" y="116" text-anchor="middle" font-size="10" fill="currentColor">libertad de acceso · publicidad</text>
<text x="140" y="132" text-anchor="middle" font-size="10" fill="currentColor">igualdad · integridad · eficiencia</text>
<rect x="385" y="76" width="230" height="72" rx="8" fill="var(--ej-bg)" stroke="var(--ej)"/>
<text x="500" y="97" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ej)">1.2 Régimen de los contratos</text>
<text x="500" y="116" text-anchor="middle" font-size="10" fill="currentColor">administrativos: efectos,</text>
<text x="500" y="132" text-anchor="middle" font-size="10" fill="currentColor">cumplimiento y extinción</text>
<rect x="120" y="158" width="400" height="32" rx="8" fill="var(--warn-bg)" stroke="var(--warn)"/>
<text x="320" y="179" text-anchor="middle" font-size="11" fill="var(--warn)">1.3 Criterios sociales y medioambientales, transversales y preceptivos · acceso de PYMES</text>
</svg>`},
{n:2,t:"Ámbito de aplicación",ubic:"Título Preliminar (Disposiciones generales) ▸ Capítulo I (Objeto y ámbito de aplicación de la Ley) ▸ Sección 1.ª (Objeto y ámbito de aplicación)",idea:"Se aplica a los contratos onerosos que celebren las entidades del sector público.",literal:`<p>1. Son contratos del sector público y, en consecuencia, están sometidos a la presente Ley en la forma y términos previstos en la misma, los contratos onerosos, cualquiera que sea su naturaleza jurídica, que celebren las entidades enumeradas en el artículo 3.</p><p>Se entenderá que un contrato tiene carácter oneroso en los casos en que el contratista obtenga algún tipo de beneficio económico, ya sea de forma directa o indirecta.</p><p>2. Están también sujetos a la presente Ley, en los términos que en ella se señalan, los contratos subvencionados por entidades que tengan la consideración de poderes adjudicadores que celebren otras personas físicas o jurídicas en los supuestos previstos en el artículo 23 relativo a los contratos subvencionados sujetos a una regulación armonizada.</p><p>3. La aplicación de esta Ley a los contratos que celebren las Comunidades Autónomas y las entidades que integran la Administración Local, o los organismos dependientes de las mismas, así como a los contratos subvencionados por cualquiera de estas entidades, se efectuará en los términos previstos en la Disposición final primera de la presente Ley relativa a los títulos competenciales.</p><p>4. A los efectos de identificar las prestaciones que son objeto de los contratos regulados en esta Ley, se utilizará el «Vocabulario común de contratos públicos», aprobado por el Reglamento (CE) n.º 2195/2002 del Parlamento Europeo y del Consejo de 5 de noviembre de 2002, por el que se aprueba el Vocabulario común de contratos públicos (CPV), o normativa comunitaria que le sustituya.</p>`,dis:`<ul>
<li><b>2.1 — regla general:</b> son contratos del sector público los contratos <b>onerosos</b>, <b>cualquiera que sea su naturaleza jurídica</b>, celebrados por las entidades del <b>art. 3</b>. Se entiende <span class="t" data-k="oneroso">oneroso</span> cuando el contratista obtiene <b>algún tipo de beneficio económico, directo o indirecto</b>.</li>
<li><b>2.2 — extensión:</b> también los <b>contratos subvencionados</b> por poderes adjudicadores que celebren otras personas físicas o jurídicas, en los supuestos del <b>art. 23</b>.</li>
<li><b>2.3 — CCAA y entidades locales:</b> la aplicación a sus contratos y a los subvencionados por ellas se hace en los términos de la <b>disposición final primera</b> (títulos competenciales).</li>
<li><b>2.4 — identificación de prestaciones:</b> se utiliza el <span class="t" data-k="cpv">Vocabulario común de contratos públicos (CPV)</span>, Reglamento (CE) 2195/2002 o la norma que lo sustituya.</li>
</ul>
<div class="box ej"><span class="lbl">Las dos llaves del ámbito objetivo</span><b>1)</b> Que sea un contrato <b>oneroso</b> (hay beneficio económico para el contratista). <b>2)</b> Que lo celebre una entidad del <b>art. 3</b>. Si falta cualquiera de las dos, la LCSP no se aplica por esta vía.</div>`,llano:`<p>La ley entra en juego cuando una entidad pública firma un contrato del que la otra parte saca dinero, se llame como se llame ese contrato. Da igual la etiqueta: lo que importa es que haya beneficio económico y que quien contrata esté en la lista del artículo 3. Y para saber exactamente qué se está comprando, se usa un diccionario europeo de códigos, el CPV.</p>`,porque:`<p>La definición amplísima —"cualquiera que sea su naturaleza jurídica"— existe precisamente para <b>impedir la huida del derecho administrativo</b>: no se puede escapar de la ley poniéndole otro nombre al contrato. Y la precisión sobre el beneficio "directo o indirecto" cierra la vía de los contratos aparentemente gratuitos en los que el contratista se cobra explotando el servicio o la publicidad.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> da igual que lo llames "acuerdo", "colaboración" o "convenio": si te pagan por hacer algo, es un contrato.</li>
<li><b>Real:</b> un ayuntamiento firma con una empresa la instalación gratuita de marquesinas a cambio de explotar su publicidad. No hay pago directo, pero el contratista obtiene <b>beneficio económico indirecto</b>: es contrato oneroso sujeto a la LCSP.</li>
<li><b>Caso límite:</b> una obra financiada en más del 50 % por una diputación y contratada por una asociación privada. No la celebra una entidad del art. 3, pero puede ser <b>contrato subvencionado</b> sujeto a regulación armonizada (arts. 2.2 y 23).</li>
</ul>`,noej:`<ul>
<li><b>No entra</b> una donación pura a favor de la Administración: falta la onerosidad para el contratista.</li>
<li><b>No entra</b> un contrato oneroso entre dos empresas privadas sin financiación pública ni entidad del art. 3.</li>
<li><b>No decide</b> el nombre del negocio: decide su contenido.</li>
</ul>`,conex:`<ul>
<li><b>Art. 3:</b> la lista de entidades a la que remite el 2.1.</li>
<li><b>Art. 23:</b> contratos subvencionados sujetos a regulación armonizada.</li>
<li><b>Art. 12:</b> calificación de los contratos.</li>
<li><b>Disposición final primera:</b> títulos competenciales.</li>
</ul>`,trampas:`<ul>
<li>"<b>Cualquiera que sea su naturaleza jurídica</b>": la etiqueta no salva del ámbito de la ley.</li>
<li>El beneficio puede ser <b>directo o indirecto</b>.</li>
<li>El <b>CPV</b> es un reglamento europeo (2195/2002), no una norma española.</li>
</ul>`,ancla:`<p><b>"Oneroso + entidad del art. 3 = LCSP."</b> Dos llaves y una cerradura.<br>Y la muletilla que hay que recordar palabra por palabra: <b>"cualquiera que sea su naturaleza jurídica"</b>.</p>`,vis:`<svg viewBox="0 0 640 165" role="img" aria-label="Ámbito objetivo de aplicación">
<rect x="40" y="30" width="230" height="60" rx="8" fill="var(--acc-soft)" stroke="var(--acc)"/>
<text x="155" y="53" text-anchor="middle" font-size="11" font-weight="700" fill="var(--acc)">¿Es ONEROSO?</text>
<text x="155" y="72" text-anchor="middle" font-size="10" fill="currentColor">beneficio económico directo o indirecto</text>
<text x="300" y="65" text-anchor="middle" font-size="18" fill="var(--ink2)">+</text>
<rect x="330" y="30" width="230" height="60" rx="8" fill="var(--ej-bg)" stroke="var(--ej)"/>
<text x="445" y="53" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ej)">¿Lo celebra una entidad del art. 3?</text>
<text x="445" y="72" text-anchor="middle" font-size="10" fill="currentColor">ámbito subjetivo</text>
<rect x="170" y="104" width="300" height="34" rx="8" fill="var(--acc)" stroke="var(--acc)"/>
<text x="320" y="126" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">CONTRATO DEL SECTOR PÚBLICO</text>
<text x="320" y="156" text-anchor="middle" font-size="10" fill="var(--ink2)">+ contratos subvencionados del art. 23 · prestaciones identificadas con el CPV</text>
</svg>`},
{n:3,t:"Ámbito subjetivo",ubic:"Título Preliminar (Disposiciones generales) ▸ Capítulo I (Objeto y ámbito de aplicación de la Ley) ▸ Sección 1.ª (Objeto y ámbito de aplicación)",idea:"Tres círculos concéntricos: sector público, poderes adjudicadores y Administraciones Públicas.",literal:`<p>1. A los efectos de esta Ley, se considera que forman parte del sector público las siguientes entidades:</p><p>a) La Administración General del Estado, las Administraciones de las Comunidades Autónomas, las Ciudades Autónomas de Ceuta y Melilla y las Entidades que integran la Administración Local.</p><p>b) Las Entidades Gestoras y los Servicios Comunes de la Seguridad Social.</p><p>c) Los Organismos Autónomos, las Universidades Públicas y las autoridades administrativas independientes.</p><p>d) Los consorcios dotados de personalidad jurídica propia a los que se refiere la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, y la legislación de régimen local, así como los consorcios regulados por la legislación aduanera.</p><p>e) Las fundaciones públicas. A efectos de esta Ley, se entenderá por fundaciones públicas aquellas que reúnan alguno de los siguientes requisitos:</p><p>1.º Que se constituyan de forma inicial, con una aportación mayoritaria, directa o indirecta, de una o varias entidades integradas en el sector público, o bien reciban dicha aportación con posterioridad a su constitución.</p><p>2.º Que el patrimonio de la fundación esté integrado en más de un 50 por ciento por bienes o derechos aportados o cedidos por sujetos integrantes del sector público con carácter permanente.</p><p>3.º Que la mayoría de derechos de voto en su patronato corresponda a representantes del sector público.</p><p>f) Las Mutuas colaboradoras con la Seguridad Social.</p><p>g) Las Entidades Públicas Empresariales a las que se refiere la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, y cualesquiera entidades de derecho público con personalidad jurídica propia vinculadas a un sujeto que pertenezca al sector público o dependientes del mismo.</p><p>h) Las sociedades mercantiles en cuyo capital social la participación, directa o indirecta, de entidades de las mencionadas en las letras a), b), c), d), e), g) y h) del presente apartado sea superior al 50 por 100, o en los casos en que sin superar ese porcentaje, se encuentre respecto de las referidas entidades en el supuesto previsto en el artículo 5 del texto refundido de la Ley del Mercado de Valores, aprobado por Real Decreto Legislativo 4/2015, de 23 de octubre.</p><p>i) Los fondos sin personalidad jurídica.</p><p>j) Cualesquiera entidades con personalidad jurídica propia, que hayan sido creadas específicamente para satisfacer necesidades de interés general que no tengan carácter industrial o mercantil, siempre que uno o varios sujetos pertenecientes al sector público financien mayoritariamente su actividad, controlen su gestión, o nombren a más de la mitad de los miembros de su órgano de administración, dirección o vigilancia.</p><p>k) Las asociaciones constituidas por las entidades mencionadas en las letras anteriores.</p><p>l) A los efectos de esta Ley, se entiende que también forman parte del sector público las Diputaciones Forales y las Juntas Generales de los Territorios Históricos del País Vasco en lo que respecta a su actividad de contratación.</p><p>2. Dentro del sector público, y a los efectos de esta Ley, tendrán la consideración de Administraciones Públicas las siguientes entidades:</p><p>a) Las mencionadas en las letras a), b), c), y l) del apartado primero del presente artículo.</p><p>b) Los consorcios y otras entidades de derecho público, en las que dándose las circunstancias establecidas en la letra d) del apartado siguiente para poder ser considerados poder adjudicador y estando vinculados a una o varias Administraciones Públicas o dependientes de las mismas, no se financien mayoritariamente con ingresos de mercado. Se entiende que se financian mayoritariamente con ingresos de mercado cuando tengan la consideración de productor de mercado de conformidad con el Sistema Europeo de Cuentas.</p><p>3. Se considerarán poderes adjudicadores, a efectos de esta Ley, las siguientes entidades:</p><p>a) Las Administraciones Públicas.</p><p>b) Las fundaciones públicas.</p><p>c) Las Mutuas colaboradoras con la Seguridad Social.</p><p>d) Todas las demás entidades con personalidad jurídica propia distintas de las expresadas en las letras anteriores que hayan sido creadas específicamente para satisfacer necesidades de interés general que no tengan carácter industrial o mercantil, siempre que uno o varios sujetos que deban considerarse poder adjudicador de acuerdo con los criterios de este apartado 3, bien financien mayoritariamente su actividad; bien controlen su gestión; o bien nombren a más de la mitad de los miembros de su órgano de administración, dirección o vigilancia.</p><p>e) Las asociaciones constituidas por las entidades mencionadas en las letras anteriores.</p><p>4. Los partidos políticos, en el sentido definido en el artículo 1 de la Ley Orgánica 8/2007, de Financiación de los Partidos Políticos; así como las organizaciones sindicales reguladas en la Ley Orgánica 11/1985, de 2 de agosto, de Libertad Sindical, y las organizaciones empresariales y asociaciones profesionales a las que se refiere la Ley 19/1977, de 1 de abril, sobre regulación del derecho de asociación sindical, además de las fundaciones y asociaciones vinculadas a cualquiera de ellos, cuando cumplan los requisitos para ser poder adjudicador de acuerdo con la letra d) del apartado 3 del presente artículo, y respecto de los contratos sujetos a regulación armonizada deberán actuar conforme a los principios de publicidad, concurrencia, transparencia, igualdad y no discriminación sin perjuicio del respeto a la autonomía de la voluntad y de la confidencialidad cuando sea procedente.</p><p>Los sujetos obligados deberán aprobar unas instrucciones internas en materia de contratación que se adecuarán a lo previsto en el párrafo anterior y a la normativa comunitaria, y que deberán ser informadas antes de su aprobación por el órgano al que corresponda su asesoramiento jurídico. Estas instrucciones deberán publicarse en sus respectivas páginas web.</p><p>5. Asimismo, quedarán sujetos a esta Ley las Corporaciones de derecho público cuando cumplan los requisitos para ser poder adjudicador de acuerdo con el apartado tercero, letra d) del presente artículo.</p>`,dis:`<div class="box warn"><span class="lbl">La clave del artículo</span>El art. 3 define <b>tres círculos</b>, y de ellos depende <b>cuánta ley</b> se aplica: cuanto más cerca del núcleo, más intenso el régimen. El círculo grande es el <b>sector público</b> (3.1); dentro está el de los <b>poderes adjudicadores</b> (3.3); y en el centro, las <b>Administraciones Públicas</b> (3.2), las únicas que celebran contratos administrativos.</div>
<table><thead><tr><th>Círculo</th><th>Quiénes</th><th>Consecuencia</th></tr></thead><tbody>
<tr><td><b>3.1 <span class="t" data-k="sectorpub">Sector público</span></b></td><td>a) AGE, CCAA, Ceuta y Melilla y Entidades locales · b) Entidades Gestoras y Servicios Comunes de la Seguridad Social · c) Organismos Autónomos, Universidades Públicas y autoridades administrativas independientes · d) consorcios · e) fundaciones públicas · f) Mutuas colaboradoras · g) Entidades Públicas Empresariales y demás entidades de derecho público · h) sociedades mercantiles con participación pública <b>superior al 50 %</b> (o control del art. 5 TR Ley del Mercado de Valores) · i) fondos sin personalidad jurídica · j) entidades creadas para satisfacer <span class="t" data-k="necint">necesidades de interés general no industriales ni mercantiles</span> financiadas, controladas o dirigidas mayoritariamente por el sector público · k) asociaciones constituidas por las anteriores · l) Diputaciones Forales y Juntas Generales del País Vasco</td><td>Sujeción a la ley "en la forma y términos previstos en ella"</td></tr>
<tr><td><b>3.2 <span class="t" data-k="pa">Administraciones Públicas</span></b></td><td>Las de las letras <b>a), b), c) y l)</b> del 3.1 · y los consorcios y entidades de derecho público que, siendo poder adjudicador y estando vinculados a Administraciones, <b>no se financien mayoritariamente con ingresos de mercado</b></td><td>Régimen más intenso: contratos administrativos</td></tr>
<tr><td><b>3.3 <span class="t" data-k="poderadj">Poderes adjudicadores</span></b></td><td>a) Administraciones Públicas · b) fundaciones públicas · c) Mutuas colaboradoras · d) demás entidades creadas para necesidades de interés general no industriales ni mercantiles financiadas, controladas o dirigidas mayoritariamente por poderes adjudicadores · e) asociaciones de las anteriores</td><td>Reglas europeas de publicidad y recurso especial</td></tr>
</tbody></table>
<ul>
<li><b>Fundaciones públicas (3.1.e):</b> basta <b>uno</b> de tres requisitos — aportación mayoritaria pública inicial o posterior; patrimonio integrado en más del <b>50 %</b> por bienes públicos con carácter permanente; mayoría de derechos de voto públicos en el patronato.</li>
<li><b>3.4 — partidos, sindicatos y organizaciones empresariales:</b> cuando reúnan los requisitos de poder adjudicador de la letra d) y respecto de contratos <b>SARA</b>, deben actuar conforme a publicidad, concurrencia, transparencia, igualdad y no discriminación, y aprobar <b>instrucciones internas</b> informadas por su asesoría jurídica y publicadas en su web.</li>
<li><b>3.5 — Corporaciones de derecho público</b> (colegios profesionales, cámaras): sujetas cuando cumplan los requisitos de poder adjudicador de la letra d).</li>
</ul>`,llano:`<p>Imagina tres circunferencias, una dentro de otra. La más grande, el sector público: ahí cabe casi todo lo que huela a público, hasta las sociedades mercantiles con más del 50 % de capital público. Dentro hay una segunda: los poderes adjudicadores, que son los que hacen cosas de interés general y viven del dinero público, aunque tengan forma privada. Y en el centro, las Administraciones Públicas propiamente dichas. Cuanto más al centro estés, más dura es la ley contigo.</p>`,porque:`<p>Sin esta gradación, o se aplicaba el régimen administrativo completo a una sociedad mercantil pública —haciéndola inoperante— o se dejaba fuera de control a entes públicos con forma privada. Los tres círculos permiten <b>ajustar la intensidad del control</b> a la naturaleza de cada ente. El concepto de <b>poder adjudicador</b> es de origen europeo y es deliberadamente funcional: no pregunta por la forma jurídica, sino por quién paga, quién manda y para qué sirve la entidad.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> el descuento de empleado: hay quien es plantilla, quien es contratado externo y quien solo colabora. Todos están "en la empresa", pero con condiciones distintas.</li>
<li><b>Real (círculo 1):</b> Aguas del Huesna, S.A., con capital 100 % de entidades locales, es sector público (3.1.h) y poder adjudicador, pero <b>no</b> Administración Pública: no celebra contratos administrativos.</li>
<li><b>Real (círculo 3):</b> el Colegio de Abogados de Sevilla, corporación de derecho público, queda sujeto cuando cumpla los requisitos de la letra d) del 3.3 (art. 3.5).</li>
<li><b>Caso límite:</b> una fundación con solo el 30 % de aportación pública inicial, pero cuyo patronato está controlado en su mayoría por representantes públicos: es fundación pública, porque basta <b>uno</b> de los tres requisitos del 3.1.e).</li>
</ul>`,noej:`<ul>
<li><b>No es Administración Pública</b> una entidad pública empresarial ni una sociedad mercantil pública, aunque sí son sector público.</li>
<li><b>No es poder adjudicador</b> una entidad creada para una actividad <b>industrial o mercantil</b> en competencia real, aunque sea de capital público.</li>
<li><b>No basta</b> la participación pública del 50 % exacta en sociedades: el 3.1.h) exige participación <b>superior</b> al 50 %, salvo el supuesto de control del mercado de valores.</li>
</ul>`,conex:`<ul>
<li><b>Art. 2.1:</b> remite a este artículo para delimitar el ámbito.</li>
<li><b>Arts. 25 y 26:</b> contratos administrativos y privados, según se sea o no Administración Pública.</li>
<li><b>Art. 19:</b> los SARA, cuyo régimen depende de la condición de poder adjudicador.</li>
<li><b>Art. 2 y 3 LRJSP</b> (documento 2 de la biblioteca): concepto general de sector público institucional.</li>
</ul>`,trampas:`<ul>
<li><b>Tres círculos, no dos.</b> Y el orden en la ley es contraintuitivo: 3.1 sector público, 3.2 Administraciones Públicas, 3.3 poderes adjudicadores.</li>
<li>Las <b>Universidades Públicas</b> y las <b>autoridades administrativas independientes</b> son Administración Pública (letra c).</li>
<li>Las <b>fundaciones públicas</b> y las <b>Mutuas colaboradoras</b> son poder adjudicador (3.3.b y c) pero <b>no</b> Administración Pública.</li>
<li>Sociedades mercantiles: participación <b>superior al 50 %</b>, directa o indirecta.</li>
<li>El 3.4 (partidos y sindicatos) solo opera respecto de contratos <b>sujetos a regulación armonizada</b>.</li>
</ul>`,ancla:`<p><b>Tres círculos, de fuera adentro:</b> <b>S</b>ector público → <b>P</b>oderes adjudicadores → <b>A</b>dministraciones Públicas. Piensa en una <b>SPA</b>: se entra por el vestuario grande y se llega a la piscina pequeña.<br><b>Administraciones Públicas = a, b, c y l</b> ("las cuatro letras de siempre") + consorcios sin ingresos de mercado.<br><b>Fundación pública:</b> basta <b>una</b> de tres: dinero, patrimonio (50 %) o votos.</p>`,vis:`<svg viewBox="0 0 640 250" role="img" aria-label="Los tres círculos del ámbito subjetivo">
<circle cx="200" cy="125" r="115" fill="var(--acc-soft)" stroke="var(--acc)"/>

</svg>`},
{n:4,t:"Régimen aplicable a los negocios jurídicos excluidos",ubic:"Título Preliminar (Disposiciones generales) ▸ Capítulo I (Objeto y ámbito de aplicación de la Ley) ▸ Sección 2.ª (Negocios y contratos excluidos)",idea:"Lo excluido se rige por sus normas, pero los principios de la ley sirven para las lagunas.",literal:`<p>Las relaciones jurídicas, negocios y contratos citados en esta sección quedan excluidos del ámbito de la presente Ley, y se regirán por sus normas especiales, aplicándose los principios de esta Ley para resolver las dudas y lagunas que pudieran presentarse.</p>`,dis:`<ul>
<li><b>Efecto:</b> las relaciones jurídicas, negocios y contratos de la Sección 2.ª <b>quedan excluidos</b> del ámbito de la ley.</li>
<li><b>Régimen aplicable:</b> sus <b>normas especiales</b>.</li>
<li><b>Cláusula de cierre:</b> se aplican los <b>principios</b> de la LCSP para resolver <b>dudas y lagunas</b>.</li>
</ul>`,llano:`<p>Estar excluido no significa estar en tierra de nadie. Cada negocio excluido tiene su propia normativa, y cuando esa normativa no llegue o no esté clara, se vuelve a los principios de esta ley: publicidad, igualdad, transparencia, no discriminación.</p>`,porque:`<p>Si la exclusión fuera absoluta, bastaría con encajar un contrato en cualquiera de las rendijas de los arts. 5 a 11 para contratar sin ninguna regla. La <b>aplicación supletoria de los principios</b> impide ese vacío: el excluido escapa del procedimiento, no de la ética de la contratación pública.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> un juego con reglas propias en el que, ante una jugada no prevista, se recurre al reglamento general del deporte.</li>
<li><b>Real:</b> la venta de una parcela municipal se rige por la legislación patrimonial (art. 9.2), pero si esa legislación no aclara cómo dar publicidad a la licitación, se acude a los principios de publicidad y concurrencia de la LCSP.</li>
<li><b>Caso límite:</b> un convenio del art. 6 cuyo contenido resulta ser el propio de un contrato de servicios: entonces no hay exclusión que valga, porque el propio art. 6.1 la condiciona a que el contenido no sea contractual.</li>
</ul>`,noej:`<ul>
<li><b>No significa</b> ausencia de reglas ni de control.</li>
<li><b>No se aplican</b> los procedimientos de la LCSP a lo excluido: solo sus <b>principios</b>, y solo para dudas y lagunas.</li>
</ul>`,conex:`<ul>
<li><b>Art. 1.1:</b> los principios a los que remite.</li>
<li><b>Arts. 5 a 11:</b> el catálogo completo de exclusiones.</li>
<li><b>Art. 4 LPAC / art. 12 CC:</b> técnica general de la supletoriedad y de la analogía.</li>
</ul>`,trampas:`<ul>
<li>Se aplican los <b>principios</b>, no las normas ni los procedimientos.</li>
<li>Solo para <b>dudas y lagunas</b>: no desplazan a la normativa especial.</li>
</ul>`,ancla:`<p><b>"Fuera de la ley, pero no fuera de sus principios."</b> Un artículo de una sola frase que hay que saber literal.</p>`,vis:`<svg viewBox="0 0 640 130" role="img" aria-label="Régimen de los negocios excluidos">

z\" fill=\"var(--exc)\"/></marker><marker id=\"fe3\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw3\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"250\" y=\"8\" width=\"460\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"27.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">FORMAS DE PRESTAR LA GARANTÍA DEFINITIVA · ART. 108</text><rect x=\"20\" y=\"52\" width=\"219.5\" height=\"191\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"129.75\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--acc)\">a) EFECTIVO O VALORES</text><text x=\"129.75\" y=\"91\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Los valores serán en todo</text><text x=\"129.75\" y=\"106\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">caso de DEUDA PÚBLICA</text><text x=\"129.75\" y=\"121\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"129.75\" y=\"136\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Se depositan en la Caja</text><text x=\"129.75\" y=\"151\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">General de Depósitos o en</text><text x=\"129.75\" y=\"166\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">las cajas equivalentes de</text><text x=\"129.75\" y=\"181\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">comunidades autónomas y</text><text x=\"129.75\" y=\"196\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">entidades locales</text><rect x=\"253.5\" y=\"52\" width=\"219.5\" height=\"191\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"363.25\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--ej)\">b) AVAL</text><text x=\"363.25\" y=\"91\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Prestado por bancos, cajas</text><text x=\"363.25\" y=\"106\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">de ahorros, cooperativas de</text><text x=\"363.25\" y=\"121\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">crédito, establecimientos</text><text x=\"363.25\" y=\"136\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">financieros de crédito y</text><text x=\"363.25\" y=\"151\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">sociedades de garantía</text><text x=\"363.25\" y=\"166\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">recíproca autorizados para</text><text x=\"363.25\" y=\"181\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">operar en España</text><text x=\"363.25\" y=\"196\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"363.25\" y=\"211\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Se deposita en los mismos</text><text x=\"363.25\" y=\"226\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">establecimientos</text><rect x=\"487\" y=\"52\" width=\"219.5\" height=\"191\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"596.75\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--ej)\">c) SEGURO DE CAUCIÓN</text><text x=\"596.75\" y=\"91\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Contrato celebrado con una</text><text x=\"596.75\" y=\"106\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">entidad aseguradora</text><text x=\"596.75\" y=\"121\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">autorizada para operar</text><text x=\"596.75\" y=\"136\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">en el ramo</text><text x=\"596.75\" y=\"151\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"596.75\" y=\"166\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">El certificado se entrega</text><text x=\"596.75\" y=\"181\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">en los mismos</text><text x=\"596.75\" y=\"196\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">establecimientos</text><rect x=\"720.5\" y=\"52\" width=\"219.5\" height=\"191\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"830.25\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--warn)\">RETENCIÓN EN EL PRECIO</text><text x=\"830.25\" y=\"91\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Cuando así se prevea en el</text><text x=\"830.25\" y=\"106\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">PCAP, en obras, suministros</text><text x=\"830.25\" y=\"121\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">y servicios, y en concesiones</text><text x=\"830.25\" y=\"136\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">de servicios si las tarifas</text><text x=\"830.25\" y=\"151\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">las abona la Administración</text><text x=\"830.25\" y=\"166\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"830.25\" y=\"181\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">El PCAP fija la forma y</text><text x=\"830.25\" y=\"196\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">condiciones de la retención</text><text x=\"830.25\" y=\"211\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"830.25\" y=\"226\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 108.2</text><rect x=\"20\" y=\"253\" width=\"920\" height=\"34\" rx=\"8\" fill=\"var(--panel)\" stroke=\"var(--line)\"/><text x=\"480\" y=\"273.328\" text-anchor=\"middle\" font-size=\"10.4\" fill=\"currentColor\">La acreditación de la constitución de la garantía definitiva puede hacerse por MEDIOS ELECTRÓNICOS (art. 108.3).</text></svg>"}, {"n": 115, "t": "Consultas preliminares del mercado", "ubic": "Libro II ▸ Título I ▸ Capítulo I ▸ Sección 1.ª · Preparación · Disposiciones generales", "idea": "Preguntar al mercado antes de licitar es legal, pero con publicidad y sin dar ventaja a nadie.", "literal": "<p><b>1.</b> Los órganos de contratación podrán realizar estudios de mercado y dirigir consultas a los operadores económicos que estuvieran activos en el mismo con la finalidad de preparar correctamente la licitación e informar a los citados operadores económicos acerca de sus planes y de los requisitos que exigirán para concurrir al procedimiento. Para ello los órganos de contratación podrán valerse del asesoramiento de terceros, que podrán ser expertos o autoridades independientes, colegios profesionales, o, incluso, con carácter excepcional operadores económicos activos en el mercado. Antes de iniciarse la consulta, el órgano de contratación publicará en el perfil de contratante ubicado en la Plataforma de contratación del Sector Público o servicio de información equivalente a nivel autonómico, el objeto de la misma, cuando se iniciara esta y las denominaciones de los terceros que vayan a participar en la consulta, a efectos de que puedan tener acceso y posibilidad de realizar aportaciones todos los posibles interesados. Asimismo en el perfil del contratante se publicarán las razones que motiven la elección de los asesores externos que resulten seleccionados.</p><p><b>2.</b> El asesoramiento a que se refiere el apartado anterior será utilizado por el órgano de contratación para planificar el procedimiento de licitación y, también, durante la sustanciación del mismo, siempre y cuando ello no tenga el efecto de falsear la competencia o de vulnerar los principios de no discriminación y transparencia. De las consultas realizadas no podrá resultar un objeto contractual tan concreto y delimitado que únicamente se ajuste a las características técnicas de uno de los consultados. El resultado de los estudios y consultas debe, en su caso, concretarse en la introducción de características genéricas, exigencias generales o fórmulas abstractas que aseguren una mejor satisfacción de los intereses públicos, sin que en ningún caso, puedan las consultas realizadas comportar ventajas respecto de la adjudicación del contrato para las empresas participantes en aquellas.</p><p><b>3.</b> Cuando el órgano de contratación haya realizado las consultas a que se refiere el presente artículo, hará constar en un informe las actuaciones realizadas. En el informe se relacionarán los estudios realizados y sus autores, las entidades consultadas, las cuestiones que se les han formulado y las respuestas a las mismas. Este informe estará motivado, formará parte del expediente de contratación, y estará sujeto a las mismas obligaciones de publicidad que los pliegos de condiciones, publicándose en todo caso en el perfil del contratante del órgano de contratación. En ningún caso durante el proceso de consultas al que se refiere el presente artículo, el órgano de contratación podrá revelar a los participantes en el mismo las soluciones propuestas por los otros participantes, siendo las mismas solo conocidas íntegramente por aquel. Con carácter general, el órgano de contratación al elaborar los pliegos deberá tener en cuenta los resultados de las consultas realizadas; de no ser así deberá dejar constancia de los motivos en el informe a que se refiere el párrafo anterior. La participación en la consulta no impide la posterior intervención en el procedimiento de contratación que en su caso se tramite.</p>", "dis": "<ul>\n<li><b>Facultad (115.1):</b> los órganos de contratación <b>podrán</b> realizar estudios de mercado y dirigir consultas a los operadores activos, para <b>preparar correctamente la licitación</b> e <b>informar</b> a esos operadores de sus planes y requisitos.</li>\n<li><b>Asesores:</b> pueden valerse de terceros —expertos, autoridades independientes, colegios profesionales y, <b>con carácter excepcional</b>, operadores económicos activos—.</li>\n<li><b>Publicidad previa:</b> antes de iniciar la consulta se publica en el <span class=\"t\" data-k=\"perfil\">perfil de contratante</span> el <b>objeto</b>, <b>cuándo se inicia</b> y las <b>denominaciones de los terceros</b> que participarán, así como las <b>razones</b> de la elección de los asesores externos.</li>\n<li><b>Límite (115.2):</b> el asesoramiento no puede <b>falsear la competencia</b> ni vulnerar la no discriminación y la transparencia. «De las consultas realizadas <b>no podrá resultar un objeto contractual tan concreto y delimitado que únicamente se ajuste a las características técnicas de uno de los consultados</b>». El resultado debe concretarse en <b>características genéricas, exigencias generales o fórmulas abstractas</b>. Las empresas participantes no obtienen ventaja alguna en la adjudicación.</li>\n<li><b>Informe (115.3):</b> se hace constar en un <b>informe motivado</b> que relaciona estudios y autores, entidades consultadas, cuestiones formuladas y respuestas. Forma parte del expediente y está sujeto a las <b>mismas obligaciones de publicidad que los pliegos</b>.</li>\n</ul>", "llano": "<p>Antes de sacar algo a concurso, la Administración puede preguntar a las empresas del sector qué existe, cuánto cuesta y qué es razonable exigir. Es legítimo y a menudo imprescindible.</p>\n<p>Ahora bien: hay que anunciarlo antes, decir a quién se pregunta, escribir un informe con las preguntas y las respuestas, y publicarlo como los pliegos. Y del resultado no puede salir un pliego hecho a medida de la empresa consultada.</p>", "porque": "<p>Porque sin esta figura se producían dos males opuestos. O bien se licitaba a ciegas, con pliegos irreales que quedaban desiertos; o bien se preguntaba <b>en privado</b> a una empresa amiga, que acababa escribiendo de facto el pliego a su medida.</p>\n<p>El art. 115 legaliza la consulta y, a cambio, la somete a <b>publicidad total</b>: quién, cuándo, qué se preguntó y qué se respondió. La transparencia es el precio de la información.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> antes de pedir presupuestos para reformar la cocina, visitas tres tiendas para saber qué materiales existen. Lo que no puedes es copiar el catálogo de una y pedir «exactamente esto».</li>\n<li><b>Real:</b> una diputación va a licitar una plataforma de administración electrónica. Publica en el perfil de contratante el objeto de la consulta, la fecha y los nombres de las cuatro empresas y del colegio profesional consultados. El informe final —publicado con los pliegos— recoge que el mercado ofrece soluciones en la nube y on-premise, y el PPT acaba exigiendo <b>interoperabilidad con el ENI</b> y no una marca concreta.</li>\n<li><b>Caso límite:</b> una de las empresas consultadas se presenta después a la licitación. Puede hacerlo: la consulta <b>no</b> es causa de prohibición de contratar, siempre que no haya obtenido ventaja. Si el pliego reprodujera sus especificaciones exclusivas, el contrato sería impugnable.</li>\n</ul>", "noej": "<ul>\n<li><b>No es una consulta preliminar</b> pedir tres presupuestos para un contrato menor: eso es prospección de precios dentro del propio expediente.</li>\n<li><b>No cumple el art. 115</b> la consulta hecha sin publicar previamente el objeto y los nombres de los consultados.</li>\n<li><b>No puede resultar</b> de la consulta un pliego que solo encaje con un consultado: lo prohíbe expresamente el 115.2.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 116.1:</b> el expediente se inicia después; la consulta es previa y potestativa.</li>\n<li><b>Art. 126:</b> las prescripciones técnicas no pueden favorecer a un licitador, límite paralelo al del 115.2.</li>\n<li><b>Art. 63:</b> el perfil de contratante, soporte de toda esta publicidad.</li>\n<li><b>Art. 70:</b> condiciones especiales de compatibilidad y participación previa en la preparación.</li>\n</ul>", "trampas": "<ul>\n<li>Es <b>potestativa</b> («podrán»), no un trámite obligatorio del expediente.</li>\n<li>La publicidad es <b>previa</b> a la consulta, no posterior. Y el informe se publica <b>como los pliegos</b>.</li>\n<li>Participar en la consulta <b>no</b> impide licitar después.</li>\n</ul>", "ancla": "<p><b>«Pregunta, pero en voz alta.»</b> Todo lo que se pregunte en la consulta acaba publicado: objeto, fechas, nombres, preguntas y respuestas.</p>", "vis": "<svg viewBox=\"0 0 960 404\" role=\"img\" aria-label=\"Procedimiento y límites de las consultas preliminares del mercado\" style=\"width:100%;height:auto\"><defs><marker id=\"fl4\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr4\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe4\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw4\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"250\" y=\"8\" width=\"460\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"27.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">CONSULTAS PRELIMINARES DEL MERCADO · ART. 115</text><rect x=\"20\" y=\"52\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"30\" y=\"66\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"120\" y=\"83\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--warn)\">1 · PUBLICAR ANTES</text><text x=\"224\" y=\"74\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">En el perfil de contratante: objeto de la consulta, cuándo se inicia,</text><text x=\"224\" y=\"88\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">denominaciones de los terceros participantes y razones de su elección.</text><text x=\"930\" y=\"74\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">115.1</text><path d=\"M480 107 L 480 115\" stroke=\"var(--warn)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl4)\"/><rect x=\"20\" y=\"116\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"30\" y=\"130\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"120\" y=\"147\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--acc)\">2 · CONSULTAR</text><text x=\"224\" y=\"138\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">A operadores activos y, como asesores, a expertos, autoridades</text><text x=\"224\" y=\"152\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">independientes, colegios profesionales o —excepcionalmente— operadores.</text><text x=\"930\" y=\"138\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">115.1</text><path d=\"M480 171 L 480 179\" stroke=\"var(--acc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl4)\"/><rect x=\"20\" y=\"180\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><rect x=\"30\" y=\"194\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--exc)\"/><text x=\"120\" y=\"211\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--exc)\">3 · LÍMITE INFRANQUEABLE</text><text x=\"224\" y=\"202\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">De las consultas NO puede resultar un objeto contractual tan concreto</text><text x=\"224\" y=\"216\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">que solo se ajuste a las características técnicas de uno de los consultados.</text><text x=\"930\" y=\"202\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">115.2</text><path d=\"M480 235 L 480 243\" stroke=\"var(--exc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl4)\"/><rect x=\"20\" y=\"244\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><rect x=\"30\" y=\"258\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--ej)\"/><text x=\"120\" y=\"275\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--ej)\">4 · INFORME MOTIVADO</text><text x=\"224\" y=\"266\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Estudios y autores, entidades consultadas, cuestiones formuladas y</text><text x=\"224\" y=\"280\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">respuestas. Forma parte del expediente.</text><text x=\"930\" y=\"266\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">115.3</text><path d=\"M480 299 L 480 307\" stroke=\"var(--ej)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl4)\"/><rect x=\"20\" y=\"308\" width=\"920\" height=\"40\" rx=\"10\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><rect x=\"30\" y=\"315\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--ej)\"/><text x=\"120\" y=\"332\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--ej)\">5 · PUBLICAR EL INFORME</text><text x=\"224\" y=\"330\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Con las mismas obligaciones de publicidad que los pliegos.</text><text x=\"930\" y=\"330\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">115.3</text><rect x=\"20\" y=\"358\" width=\"920\" height=\"34\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"480\" y=\"378.328\" text-anchor=\"middle\" font-size=\"10.4\" fill=\"currentColor\">Participar en la consulta NO impide licitar después. Lo prohibido es obtener ventaja o que el pliego se escriba a medida de un consultado.</text></svg>"}, {"n": 116, "t": "Expediente de contratación: iniciación y contenido", "ubic": "Libro II ▸ Título I ▸ Capítulo I ▸ Sección 1.ª · Preparación · Expediente de contratación", "idea": "El expediente empieza con una resolución que motiva la necesidad, incorpora pliegos, crédito y fiscalización, y justifica siete extremos.", "literal": "<p><b>1.</b> La celebración de contratos por parte de las Administraciones Públicas requerirá la previa tramitación del correspondiente expediente, que se iniciará por el órgano de contratación motivando la necesidad del contrato en los términos previstos en el artículo 28 de esta Ley y que deberá ser publicado en el perfil de contratante. En aquellos contratos cuya ejecución requiera de la cesión de datos por parte de entidades del sector público al contratista, el órgano de contratación en todo caso deberá especificar en el expediente de contratación cuál será la finalidad del tratamiento de los datos que vayan a ser cedidos.</p><p><b>2.</b> El expediente deberá referirse a la totalidad del objeto del contrato, sin perjuicio de lo previsto en el apartado 7 del artículo 99 para los contratos adjudicados por lotes.</p><p><b>3.</b> Al expediente se incorporarán el pliego de cláusulas administrativas particulares y el de prescripciones técnicas que hayan de regir el contrato. En el caso de que el procedimiento elegido para adjudicar el contrato sea el de diálogo competitivo regulado en la subsección 5.ª, de la Sección 2.ª, del Capítulo I, del Título I, del Libro II, los pliegos de cláusulas administrativas y de prescripciones técnicas serán sustituidos por el documento descriptivo a que hace referencia el apartado 1 del artículo 174. En el caso de procedimientos para adjudicar los contratos basados en acuerdos marco invitando a una nueva licitación a las empresas parte del mismo, regulados en el artículo 221.4, los pliegos de cláusulas administrativas y de prescripciones técnicas serán sustituidos por el documento de licitación a que hace referencia el artículo 221.5 último párrafo. Asimismo, deberá incorporarse el certificado de existencia de crédito o, en el caso de entidades del sector público estatal con presupuesto estimativo, documento equivalente que acredite la existencia de financiación, y la fiscalización previa de la intervención, en su caso, en los términos previstos en la Ley 47/2003, de 26 de noviembre, General Presupuestaria.</p><p><b>4.</b> En el expediente se justificará adecuadamente:</p><p style=\"margin-left:1.1rem\">a) La elección del procedimiento de licitación.</p><p style=\"margin-left:1.1rem\">b) La clasificación que se exija a los participantes.</p><p style=\"margin-left:1.1rem\">c) Los criterios de solvencia técnica o profesional, y económica y financiera, y los criterios que se tendrán en consideración para adjudicar el contrato, así como las condiciones especiales de ejecución del mismo.</p><p style=\"margin-left:1.1rem\">d) El valor estimado del contrato con una indicación de todos los conceptos que lo integran, incluyendo siempre los costes laborales si existiesen.</p><p style=\"margin-left:1.1rem\">e) La necesidad de la Administración a la que se pretende dar satisfacción mediante la contratación de las prestaciones correspondientes; y su relación con el objeto del contrato, que deberá ser directa, clara y proporcional.</p><p style=\"margin-left:1.1rem\">f) En los contratos de servicios, el informe de insuficiencia de medios.</p><p style=\"margin-left:1.1rem\">g) La decisión de no dividir en lotes el objeto del contrato, en su caso.</p><p><b>5.</b> Si la financiación del contrato ha de realizarse con aportaciones de distinta procedencia, aunque se trate de órganos de una misma Administración pública, se tramitará un solo expediente por el órgano de contratación al que corresponda la adjudicación del contrato, debiendo acreditarse en aquel la plena disponibilidad de todas las aportaciones y determinarse el orden de su abono, con inclusión de una garantía para su efectividad.</p>", "dis": "<ul>\n<li><b>Iniciación (116.1):</b> la celebración de contratos por las Administraciones Públicas requiere la <b>previa tramitación del expediente</b>, que <b>se iniciará por el órgano de contratación motivando la necesidad del contrato en los términos previstos en el artículo 28</b> y <b>deberá ser publicado en el perfil de contratante</b>. Si la ejecución exige <b>cesión de datos</b>, hay que especificar la <b>finalidad del tratamiento</b>.</li>\n<li><b>Integridad del objeto (116.2):</b> el expediente se refiere a la <b>totalidad del objeto</b>, sin perjuicio del art. 99.7 para lotes.</li>\n<li><b>Qué se incorpora (116.3):</b>\n <ul><li>el <b>pliego de cláusulas administrativas particulares</b> y el de <b>prescripciones técnicas</b> —sustituidos por el <b>documento descriptivo</b> en diálogo competitivo (art. 174.1) y por el <b>documento de licitación</b> en contratos basados en acuerdo marco con nueva licitación (art. 221.5)—;</li>\n <li>el <b>certificado de existencia de crédito</b> o documento equivalente en entes con presupuesto estimativo;</li>\n <li>la <b>fiscalización previa de la Intervención</b>, en su caso.</li></ul></li>\n<li><b>Qué se justifica (116.4) — las siete letras:</b>\n <ul><li><b>a)</b> la <b>elección del procedimiento</b> de licitación.</li>\n <li><b>b)</b> la <span class=\"t\" data-k=\"clasificacion\">clasificación</span> que se exija a los participantes.</li>\n <li><b>c)</b> los <b>criterios de solvencia</b> técnica o profesional y económica y financiera, los <b>criterios de adjudicación</b> y las <b>condiciones especiales de ejecución</b>.</li>\n <li><b>d)</b> el <b>valor estimado</b>, con indicación de todos los conceptos que lo integran, incluidos los costes laborales.</li>\n <li><b>e)</b> la <b>necesidad</b> de la Administración a la que se pretende dar satisfacción y su relación con el objeto.</li>\n <li><b>f)</b> en los contratos de <b>servicios</b>, el <b>informe de insuficiencia de medios</b>.</li>\n <li><b>g)</b> la <b>decisión de no dividir en lotes</b>, en su caso.</li></ul></li>\n</ul>", "llano": "<p>El expediente es la carpeta del contrato. Se abre con un papel firmado por el órgano de contratación que dice por qué hace falta contratar, y ese papel se publica.</p>\n<p>Dentro se meten tres cosas: los pliegos, el papel de que hay dinero y el visto bueno de la Intervención. Y hay que explicar siete cosas por escrito: qué procedimiento, qué clasificación, qué solvencia y criterios, cuánto vale, para qué hace falta, por qué no lo hacemos nosotros —si es un servicio— y por qué no lo partimos en lotes.</p>", "porque": "<p>Porque el expediente es la <b>memoria escrita</b> de una decisión que gasta dinero público. Cada una de las siete letras del 116.4 responde a una forma histórica de discrecionalidad abusiva: elegir el procedimiento menos publicitado, pedir una clasificación que solo tiene una empresa, diseñar criterios de adjudicación a medida, calcular a la baja el valor estimado, contratar sin necesidad real, externalizar sin justificar que no hay medios propios y no dividir en lotes para dejar fuera a la pequeña empresa.</p>\n<p>La ley no prohíbe ninguna de esas decisiones: obliga a <b>motivarlas</b>, y así las hace revisables.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> la carpeta que preparas antes de pedir una hipoteca: nóminas, tasación, escritura. Sin la carpeta completa, el banco ni te escucha.</li>\n<li><b>Real:</b> un ayuntamiento tramita el <b>servicio de socorrismo</b> de sus piscinas, valor estimado 178.000 €. Resolución de inicio del alcalde de 3 de febrero, publicada en el perfil. Se incorporan PCAP, PPT, certificado de existencia de crédito de la aplicación 342.227.99 y la fiscalización previa. Se justifica: a) abierto simplificado por cuantía; b) no se exige clasificación; c) solvencia por contratos análogos y criterio único precio; d) valor estimado 178.000 € = 2 años × 89.000; e) obligación de socorrismo de la normativa sanitaria; f) <b>informe de insuficiencia de medios</b> firmado por el jefe de Deportes; g) no se divide en lotes por la necesidad de coordinar los turnos.</li>\n<li><b>Caso límite:</b> el contrato es de <b>suministro</b>, no de servicios. Entonces la letra <b>f)</b> no se aplica: el informe de insuficiencia de medios solo se exige en contratos de servicios.</li>\n</ul>", "noej": "<ul>\n<li><b>No es contenido del 116.3</b> el informe de insuficiencia de medios: ese está en el 116.4.f).</li>\n<li><b>No se justifica en el expediente</b> la solvencia <b>del adjudicatario</b>: se justifican los <b>criterios</b> de solvencia que se van a exigir.</li>\n<li><b>No basta</b> con dictar la resolución de inicio: hay que <b>publicarla en el perfil de contratante</b>.</li>\n<li><b>No se aplica</b> el art. 116 a los <b>contratos menores</b>: su expediente es el del art. 118.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 28:</b> al que remite expresamente el 116.1 para la motivación de la necesidad.</li>\n<li><b>Art. 117:</b> aprobación del expediente y del gasto.</li>\n<li><b>Art. 99.3 y 99.7:</b> división en lotes, a la que remiten el 116.2 y el 116.4.g).</li>\n<li><b>Art. 101:</b> valor estimado, contenido de la letra d).</li>\n<li><b>Art. 122 y 124:</b> pliegos que se incorporan por el 116.3.</li>\n<li><b>Arts. 214 a 218 TRLHL:</b> la fiscalización previa en las entidades locales <i>(remisión a otra norma de la biblioteca)</i>.</li>\n</ul>", "trampas": "<ul>\n<li>Distingue <b>116.3 «se incorporarán»</b> de <b>116.4 «se justificará»</b>. Documentos frente a motivación: es la pregunta favorita.</li>\n<li>La <b>no división en lotes</b> está en la letra <b>g)</b>, no en la e).</li>\n<li>El <b>informe de insuficiencia de medios</b> es solo para <b>servicios</b>.</li>\n<li>La resolución de inicio la dicta el <b>órgano de contratación</b>, y se <b>publica</b>.</li>\n</ul>", "ancla": "<p>Las siete letras, en orden: <b>P-C-S-V-N-I-L</b> — <b>P</b>rocedimiento · <b>C</b>lasificación · <b>S</b>olvencia y criterios · <b>V</b>alor estimado · <b>N</b>ecesidad · <b>I</b>nsuficiencia de medios · <b>L</b>otes.</p>\n<p>Frase para fijarla: «<b>P</b>ara <b>C</b>ontratar <b>S</b>e <b>V</b>alora, se <b>N</b>ecesita, se <b>I</b>nforma y se <b>L</b>otea.»</p>", "vis": "<svg viewBox=\"0 0 960 404\" role=\"img\" aria-label=\"Fases del expediente de contratación: inicio, contenido, justificación y aprobación\" style=\"width:100%;height:auto\"><defs><marker id=\"fl5\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr5\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe5\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw5\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"260\" y=\"8\" width=\"440\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"27.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">EL EXPEDIENTE DE CONTRATACIÓN, PASO A PASO</text><rect x=\"20\" y=\"52\" width=\"920\" height=\"58\" rx=\"10\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><circle cx=\"46\" cy=\"81\" r=\"15\" fill=\"var(--bg)\" stroke=\"var(--acc)\" stroke-width=\"2\"/><text x=\"46\" y=\"86\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"700\" fill=\"var(--acc)\">1</text><text x=\"74\" y=\"74\" text-anchor=\"start\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--acc)\">RESOLUCIÓN DE INICIO</text><text x=\"74\" y=\"90\" text-anchor=\"start\" font-size=\"9.4\" fill=\"currentColor\">Motiva la necesidad en los términos del art. 28.</text><text x=\"74\" y=\"104\" text-anchor=\"start\" font-size=\"9.4\" fill=\"currentColor\">Se publica en el perfil de contratante.</text><text x=\"930\" y=\"74\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">art. 116.1</text><path d=\"M480 111 L 480 119\" stroke=\"var(--acc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl5)\"/><rect x=\"20\" y=\"120\" width=\"920\" height=\"72\" rx=\"10\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><circle cx=\"46\" cy=\"156\" r=\"15\" fill=\"var(--bg)\" stroke=\"var(--acc)\" stroke-width=\"2\"/><text x=\"46\" y=\"161\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"700\" fill=\"var(--acc)\">2</text><text x=\"74\" y=\"142\" text-anchor=\"start\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--acc)\">SE INCORPORAN AL EXPEDIENTE</text><text x=\"74\" y=\"158\" text-anchor=\"start\" font-size=\"9.4\" fill=\"currentColor\">Pliego de cláusulas administrativas particulares y de</text><text x=\"74\" y=\"172\" text-anchor=\"start\" font-size=\"9.4\" fill=\"currentColor\">prescripciones técnicas · certificado de existencia de crédito</text><text x=\"74\" y=\"186\" text-anchor=\"start\" font-size=\"9.4\" fill=\"currentColor\">o documento equivalente · fiscalización previa de la Intervención.</text><text x=\"930\" y=\"142\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">art. 116.3</text><path d=\"M480 193 L 480 201\" stroke=\"var(--acc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl5)\"/><rect x=\"20\" y=\"202\" width=\"920\" height=\"72\" rx=\"10\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><circle cx=\"46\" cy=\"238\" r=\"15\" fill=\"var(--bg)\" stroke=\"var(--warn)\" stroke-width=\"2\"/><text x=\"46\" y=\"243\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"700\" fill=\"var(--warn)\">3</text><text x=\"74\" y=\"224\" text-anchor=\"start\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--warn)\">SE JUSTIFICA EN EL EXPEDIENTE</text><text x=\"74\" y=\"240\" text-anchor=\"start\" font-size=\"9.4\" fill=\"currentColor\">a) elección del procedimiento · b) clasificación exigida</text><text x=\"74\" y=\"254\" text-anchor=\"start\" font-size=\"9.4\" fill=\"currentColor\">c) criterios de solvencia y de adjudicación · d) valor estimado</text><text x=\"74\" y=\"268\" text-anchor=\"start\" font-size=\"9.4\" fill=\"currentColor\">e) necesidad · f) insuficiencia de medios en servicios · g) no división en lotes</text><text x=\"930\" y=\"224\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">art. 116.4</text><path d=\"M480 275 L 480 283\" stroke=\"var(--warn)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl5)\"/><rect x=\"20\" y=\"284\" width=\"920\" height=\"58\" rx=\"10\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><circle cx=\"46\" cy=\"313\" r=\"15\" fill=\"var(--bg)\" stroke=\"var(--ej)\" stroke-width=\"2\"/><text x=\"46\" y=\"318\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"700\" fill=\"var(--ej)\">4</text><text x=\"74\" y=\"306\" text-anchor=\"start\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--ej)\">RESOLUCIÓN DE APROBACIÓN</text><text x=\"74\" y=\"322\" text-anchor=\"start\" font-size=\"9.4\" fill=\"currentColor\">Aprueba el expediente y dispone la apertura del procedimiento</text><text x=\"74\" y=\"336\" text-anchor=\"start\" font-size=\"9.4\" fill=\"currentColor\">de adjudicación. IMPLICA TAMBIÉN LA APROBACIÓN DEL GASTO.</text><text x=\"930\" y=\"306\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">art. 117.1</text><rect x=\"20\" y=\"352\" width=\"920\" height=\"44\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"480\" y=\"370.828\" text-anchor=\"middle\" font-size=\"10.4\" fill=\"currentColor\">Excepción del art. 117.1: la aprobación del expediente NO implica la del gasto si el presupuesto no pudo establecerse antes,</text><text x=\"480\" y=\"383.828\" text-anchor=\"middle\" font-size=\"10.4\" fill=\"currentColor\">o si las normas de desconcentración o el acto de delegación dispusieron otra cosa. Entonces hay que recabar la del órgano competente.</text></svg>"}, {"n": 117, "t": "Aprobación del expediente", "ubic": "Libro II ▸ Título I ▸ Capítulo I ▸ Sección 1.ª · Preparación · Expediente de contratación", "idea": "Una resolución motivada aprueba el expediente, abre el procedimiento y aprueba el gasto de una sola vez.", "literal": "<p><b>1.</b> Completado el expediente de contratación, se dictará resolución motivada por el órgano de contratación aprobando el mismo y disponiendo la apertura del procedimiento de adjudicación. Dicha resolución implicará también la aprobación del gasto, salvo en el supuesto excepcional de que el presupuesto no hubiera podido ser establecido previamente, o que las normas de desconcentración o el acto de delegación hubiesen establecido lo contrario, en cuyo caso deberá recabarse la aprobación del órgano competente. Esta resolución deberá ser objeto de publicación en el perfil de contratante.</p><p><b>2.</b> Los expedientes de contratación podrán ultimarse incluso con la adjudicación y formalización del correspondiente contrato, aun cuando su ejecución, ya se realice en una o en varias anualidades, deba iniciarse en el ejercicio siguiente. A estos efectos podrán comprometerse créditos con las limitaciones que se determinen en las normas presupuestarias de las distintas Administraciones Públicas sujetas a esta Ley.</p>", "dis": "<ul>\n<li><b>Contenido de la resolución (117.1):</b> completado el expediente, el órgano de contratación dicta <b>resolución motivada</b> que:\n <ul><li><b>aprueba el expediente</b>;</li>\n <li><b>dispone la apertura del procedimiento de adjudicación</b>;</li>\n <li><b>implica también la aprobación del gasto</b>.</li></ul></li>\n<li><b>Excepciones a la aprobación automática del gasto:</b> que el <b>presupuesto no hubiera podido ser establecido previamente</b>, o que las normas de <b>desconcentración</b> o el <b>acto de delegación</b> hubiesen establecido lo contrario. En esos casos hay que <b>recabar la aprobación del órgano competente</b>.</li>\n<li><b>Publicidad:</b> «Esta resolución deberá ser objeto de <b>publicación en el perfil de contratante</b>».</li>\n<li><b>Tramitación anticipada (117.2):</b> los expedientes pueden ultimarse <b>incluso con la adjudicación y formalización</b> aunque la ejecución deba iniciarse en el <b>ejercicio siguiente</b>, comprometiendo créditos con las limitaciones de las normas presupuestarias.</li>\n</ul>", "llano": "<p>Cuando la carpeta está completa, el órgano de contratación firma un papel que hace tres cosas a la vez: dice que el expediente está bien, ordena abrir la licitación y aprueba el gasto. Ese papel también se publica.</p>\n<p>Y una posibilidad muy útil: se puede licitar y hasta firmar en diciembre un contrato que empezará en enero. Es la tramitación anticipada.</p>", "porque": "<p>Por economía procedimental. Antes hacían falta dos actos —aprobar el expediente y aprobar el gasto— con dos fiscalizaciones y dos firmas. El art. 117.1 los <b>funde en uno</b>, salvo cuando la competencia sobre el gasto esté en otro órgano por delegación o desconcentración.</p>\n<p>Y la tramitación anticipada resuelve un problema real: si el expediente no pudiera empezar hasta enero, los servicios públicos quedarían sin cobertura contractual los primeros meses de cada año.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> firmar el «sí» a una reforma y, con la misma firma, autorizar al banco a bloquear el dinero.</li>\n<li><b>Real:</b> el 14 de noviembre de 2025 la Junta de Gobierno Local aprueba el expediente del servicio de ayuda a domicilio para 2026, dispone la apertura del abierto simplificado y aprueba el gasto de 640.000 €, publicándolo en el perfil. El contrato se formaliza el 22 de diciembre y la ejecución empieza el 1 de enero de 2026: <b>tramitación anticipada</b> del 117.2.</li>\n<li><b>Caso límite:</b> el alcalde tiene delegada la contratación en la Junta de Gobierno, pero el acuerdo de delegación reservó al Pleno la aprobación de gastos plurianuales. Entonces la resolución que aprueba el expediente <b>no</b> aprueba el gasto: hay que recabarla del Pleno (117.1).</li>\n</ul>", "noej": "<ul>\n<li><b>No aprueba el gasto</b> la resolución cuando el acto de delegación o las normas de desconcentración dispusieron otra cosa.</li>\n<li><b>No es tramitación de urgencia</b> la tramitación anticipada: la urgencia está en el art. 119 y reduce plazos; la anticipada solo adelanta el expediente a un ejercicio anterior.</li>\n<li><b>No se publica solo la licitación</b>: se publica también <b>esta resolución</b> en el perfil de contratante.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 116:</b> el expediente cuya aprobación se acuerda aquí.</li>\n<li><b>Art. 119:</b> tramitación urgente, con reducción de plazos.</li>\n<li><b>Art. 120:</b> tramitación de emergencia.</li>\n<li><b>Art. 63:</b> perfil de contratante, soporte de la publicación.</li>\n<li><b>Art. 184 TRLHL:</b> la aprobación del gasto es la fase <b>A</b> del gasto en la entidad local <i>(otra norma de la biblioteca)</i>.</li>\n</ul>", "trampas": "<ul>\n<li>La resolución hace <b>tres</b> cosas, no dos: aprueba expediente, abre procedimiento y aprueba gasto.</li>\n<li>Las excepciones a la aprobación del gasto son <b>dos</b>: presupuesto no establecible previamente y delegación o desconcentración en contrario.</li>\n<li>Tramitación <b>anticipada</b> ≠ <b>urgente</b> ≠ <b>emergencia</b>. Son tres figuras distintas.</li>\n</ul>", "ancla": "<p><b>«Una firma, tres efectos: expediente, procedimiento y gasto.»</b></p>\n<p>Y el orden general del expediente, para no perderse: <b>necesidad (28) → expediente (116) → aprobación (117) → licitación</b>.</p>", "vis": "<svg viewBox=\"0 0 960 310\" role=\"img\" aria-label=\"Efectos de la resolución de aprobación del expediente de contratación\" style=\"width:100%;height:auto\"><defs><marker id=\"fl6\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr6\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe6\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw6\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"250\" y=\"8\" width=\"460\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"27.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">LA RESOLUCIÓN DEL ART. 117.1</text><rect x=\"20\" y=\"52\" width=\"219.5\" height=\"190\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"129.75\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--acc)\">EFECTO 1</text><text x=\"129.75\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">APRUEBA</text><text x=\"129.75\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">EL EXPEDIENTE</text><text x=\"129.75\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"129.75\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Cierra la fase</text><text x=\"129.75\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">preparatoria</text><rect x=\"253.5\" y=\"52\" width=\"219.5\" height=\"190\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"363.25\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--acc)\">EFECTO 2</text><text x=\"363.25\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">DISPONE LA APERTURA</text><text x=\"363.25\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">DEL PROCEDIMIENTO</text><text x=\"363.25\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">DE ADJUDICACIÓN</text><text x=\"363.25\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"363.25\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Empieza la licitación</text><rect x=\"487\" y=\"52\" width=\"219.5\" height=\"190\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"596.75\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--ej)\">EFECTO 3</text><text x=\"596.75\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">IMPLICA TAMBIÉN LA</text><text x=\"596.75\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">APROBACIÓN DEL GASTO</text><text x=\"596.75\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"596.75\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Es la fase A del gasto</text><text x=\"596.75\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">en la entidad local</text><rect x=\"720.5\" y=\"52\" width=\"219.5\" height=\"190\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"830.25\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--exc)\">SALVO QUE…</text><text x=\"830.25\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">el presupuesto no</text><text x=\"830.25\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">pudiera establecerse</text><text x=\"830.25\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">previamente, o</text><text x=\"830.25\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"830.25\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">la desconcentración o</text><text x=\"830.25\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">la delegación digan</text><text x=\"830.25\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">lo contrario</text><text x=\"830.25\" y=\"180\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"830.25\" y=\"193\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">→ recabar la aprobación</text><text x=\"830.25\" y=\"206\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">del órgano competente</text><rect x=\"20\" y=\"252\" width=\"920\" height=\"48\" rx=\"8\" fill=\"var(--panel)\" stroke=\"var(--line)\"/><text x=\"480\" y=\"272.828\" text-anchor=\"middle\" font-size=\"10.4\" fill=\"currentColor\">Y en todo caso: la resolución DEBE PUBLICARSE en el perfil de contratante.</text><text x=\"480\" y=\"285.828\" text-anchor=\"middle\" font-size=\"10.4\" fill=\"currentColor\">Tramitación anticipada (117.2): cabe adjudicar y formalizar aunque la ejecución empiece en el ejercicio siguiente.</text></svg>"}, {"n": 118, "t": "Expediente de contratación en contratos menores", "ubic": "Libro II ▸ Título I ▸ Capítulo I ▸ Sección 1.ª · Preparación · Expediente de contratación", "idea": "Menos de 40.000 € en obras y de 15.000 € en suministros y servicios: informe, gasto y factura.", "literal": "<p><b>1.</b> Se consideran contratos menores los contratos de valor estimado inferior a 40.000 euros, cuando se trate de contratos de obras, o a 15.000 euros, cuando se trate de contratos de suministro o de servicios, sin perjuicio de lo dispuesto en el artículo 229 en relación con las obras, servicios y suministros centralizados en el ámbito estatal.</p><p><b>2.</b> En los contratos menores la tramitación del expediente exigirá la emisión de un informe del órgano de contratación justificando de manera motivada la necesidad del contrato y que no se está alterando su objeto con el fin de evitar la aplicación de los umbrales descritos en el apartado anterior.</p><p><b>3.</b> Asimismo se requerirá la aprobación del gasto y la incorporación al mismo de la factura correspondiente, que deberá reunir los requisitos que las normas de desarrollo de esta Ley establezcan.</p><p><b>4.</b> En el contrato menor de obras, deberá añadirse, además, el presupuesto de las obras, sin perjuicio de que deba existir el correspondiente proyecto cuando sea requerido por las disposiciones vigentes. Deberá igualmente solicitarse el informe de las oficinas o unidades de supervisión a que se refiere el artículo 235 cuando el trabajo afecte a la estabilidad, seguridad o estanqueidad de la obra.</p><p><b>5.</b> Lo dispuesto en el apartado 2.º de este artículo no será de aplicación en aquellos contratos cuyo pago se verifique a través del sistema de anticipos de caja fija u otro similar para realizar pagos menores, siempre y cuando el valor estimado del contrato no exceda de 5.000 euros.</p><p><b>6.</b> Los contratos menores se publicarán en la forma prevista en el artículo 63.4.</p>", "dis": "<ul>\n<li><b>Umbrales (118.1):</b> son <span class=\"t\" data-k=\"menor\">contratos menores</span> los de <b>valor estimado inferior a 40.000 €</b> en <b>obras</b> y a <b>15.000 €</b> en <b>suministros o servicios</b>.</li>\n<li><b>Informe (118.2):</b> la tramitación exige <b>informe del órgano de contratación</b> justificando de manera motivada la <b>necesidad</b> del contrato y que <b>no se está alterando su objeto</b> para evitar la aplicación de los umbrales.</li>\n<li><b>Gasto y factura (118.3):</b> se requiere la <b>aprobación del gasto</b> y la <b>incorporación de la factura</b>.</li>\n<li><b>Comprobación (118.4):</b> en el expediente se justificará que el contratista <b>no ha suscrito más contratos menores</b> que individual o conjuntamente superen las cifras del apartado 1; el órgano de contratación lo comprobará.</li>\n<li><b>Obras (118.5):</b> además, presupuesto de las obras y, cuando proceda, <b>proyecto</b> e informe de <b>supervisión</b> del art. 235.</li>\n<li><b>Publicidad (118.6):</b> se publicarán en la forma prevista en el <b>art. 63.4</b>.</li>\n<li><b>Duración:</b> máximo <b>un año</b> y <b>sin prórroga</b> (art. 29.8).</li>\n</ul>", "llano": "<p>Es la vía rápida para compras pequeñas. Hace falta un informe que diga por qué se necesita y que no se está partiendo un contrato grande en trocitos; que haya dinero aprobado; y la factura. Nada más: ni pliegos, ni publicación previa, ni plazo de presentación de ofertas.</p>\n<p>A cambio, tres límites: la cifra, un año de duración sin prórroga y publicación trimestral de todos los menores en el perfil.</p>", "porque": "<p>Porque exigir un procedimiento abierto para comprar 400 € de tóner paralizaría la Administración: el coste del procedimiento superaría al del contrato. El contrato menor es la <b>excepción proporcionada</b> a la publicidad y la concurrencia.</p>\n<p>Y como toda excepción, es la más abusada. De ahí los tres cerrojos que el legislador fue añadiendo: la justificación de que no se altera el objeto (118.2), la comprobación de los menores acumulados con el mismo contratista (118.4) y la publicidad trimestral (63.4).</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> comprar en la ferretería del barrio en vez de convocar un concurso. Rápido y razonable si es una bombilla; sospechoso si compras allí toda la instalación eléctrica del edificio en veinte tickets.</li>\n<li><b>Real:</b> reparación del tejado de un colegio con un presupuesto de <b>40.453 € IVA incluido</b>. Base imponible = 40.453 / 1,21 = <b>33.432,23 €</b>. Valor estimado 33.432,23 € &lt; 40.000 €: <b>sí</b> es contrato menor de obras. Se necesita, además, presupuesto de las obras y, si procede, proyecto y supervisión (118.5).</li>\n<li><b>Caso límite:</b> el mismo ayuntamiento ya adjudicó a esa empresa dos menores de obra ese año por 18.000 y 12.000 €. La suma con el nuevo asciende a 63.432 €. El art. 118.4 obliga a justificar y comprobar que no se están superando las cifras del apartado 1 mediante el fraccionamiento entre contratos del mismo contratista.</li>\n</ul>", "noej": "<ul>\n<li><b>No es menor</b> un contrato de servicios de 15.000 € exactos: la ley dice «<b>inferior a</b>».</li>\n<li><b>No es menor</b> un contrato de 14.000 € que prevea una prórroga de otro año: el valor estimado sería 28.000 € (art. 101.2.a).</li>\n<li><b>No caben</b> en el contrato menor la prórroga ni una duración superior a un año (art. 29.8).</li>\n<li><b>No basta</b> la factura: hacen falta también el informe de necesidad y la aprobación del gasto.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 101:</b> el umbral es de <b>valor estimado</b>, sin IVA.</li>\n<li><b>Art. 29.8:</b> un año, sin prórroga.</li>\n<li><b>Art. 63.4:</b> publicidad trimestral en el perfil de contratante.</li>\n<li><b>Art. 99.2:</b> prohibición de fraccionar para eludir la publicidad.</li>\n<li><b>Art. 36.1:</b> el contrato menor se perfecciona con la <b>adjudicación</b>, no con la formalización.</li>\n<li><b>Art. 235:</b> supervisión de proyectos en obras.</li>\n</ul>", "trampas": "<ul>\n<li><b>40.000 obras / 15.000 suministros y servicios.</b> Se invierten constantemente en los enunciados.</li>\n<li>«<b>Inferior a</b>», no «hasta». 15.000 € exactos no es menor.</li>\n<li>La cifra es <b>sin IVA</b>. Si te dan el importe con IVA, divide entre 1,21.</li>\n<li>Publicidad <b>trimestral</b>, no mensual ni anual, y en el <b>perfil de contratante</b>, no en el BOP.</li>\n</ul>", "ancla": "<p><b>«Cuarenta ladrillos, quince papeles.»</b> 40.000 para lo que se construye; 15.000 para lo que se compra o se contrata.</p>\n<p>Y los tres papeles del menor: <b>I-G-F</b> — <b>I</b>nforme · <b>G</b>asto · <b>F</b>actura.</p>", "vis": "<svg viewBox=\"0 0 960 280\" role=\"img\" aria-label=\"Umbrales, expediente y límites del contrato menor\" style=\"width:100%;height:auto\"><defs><marker id=\"fl7\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr7\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe7\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw7\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"300\" y=\"8\" width=\"360\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"27.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">EL CONTRATO MENOR</text><rect x=\"20\" y=\"52\" width=\"290\" height=\"96\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"165\" y=\"64.68\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--acc)\">UMBRALES · art. 118.1</text><text x=\"165\" y=\"77.68\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">Valor estimado INFERIOR a:</text><text x=\"165\" y=\"90.68\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\"></text><text x=\"165\" y=\"103.68\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">OBRAS · 40.000 €</text><text x=\"165\" y=\"116.68\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">SUMINISTROS y SERVICIOS · 15.000 €</text><text x=\"165\" y=\"129.68\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\"></text><text x=\"165\" y=\"142.68\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">Valor estimado = sin IVA</text><rect x=\"335\" y=\"52\" width=\"290\" height=\"96\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"480\" y=\"64.68\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--ej)\">EXPEDIENTE · art. 118.2 y 118.3</text><text x=\"480\" y=\"77.68\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">Informe del órgano de contratación</text><text x=\"480\" y=\"90.68\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">motivando la necesidad y que no se</text><text x=\"480\" y=\"103.68\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">altera el objeto para eludir umbrales.</text><text x=\"480\" y=\"116.68\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\"></text><text x=\"480\" y=\"129.68\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">Aprobación del gasto.</text><text x=\"480\" y=\"142.68\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">Incorporación de la factura.</text><rect x=\"650\" y=\"52\" width=\"290\" height=\"96\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"795\" y=\"64.68\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--warn)\">LÍMITES</text><text x=\"795\" y=\"77.68\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">Duración máxima UN AÑO y</text><text x=\"795\" y=\"90.68\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">NO cabe prórroga (art. 29.8).</text><text x=\"795\" y=\"103.68\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\"></text><text x=\"795\" y=\"116.68\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">Publicidad en el perfil de</text><text x=\"795\" y=\"129.68\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">contratante, al menos</text><text x=\"795\" y=\"142.68\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">TRIMESTRAL (art. 63.4).</text><path d=\"M165 150 L 165 172\" stroke=\"var(--acc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl7)\"/><path d=\"M480 150 L 480 172\" stroke=\"var(--ej)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl7)\"/><path d=\"M795 150 L 795 172\" stroke=\"var(--warn)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl7)\"/><rect x=\"20\" y=\"174\" width=\"920\" height=\"50\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"480\" y=\"189.52\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--exc)\">LA COMPROBACIÓN DEL ART. 118.4</text><text x=\"480\" y=\"202.52\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">En el expediente se justificará que el contratista NO ha suscrito más contratos menores que, individual o conjuntamente,</text><text x=\"480\" y=\"215.52\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">superen las cifras del apartado 1. El órgano de contratación comprobará ese extremo.</text><rect x=\"20\" y=\"232\" width=\"920\" height=\"40\" rx=\"8\" fill=\"var(--panel)\" stroke=\"var(--line)\"/><text x=\"480\" y=\"255.392\" text-anchor=\"middle\" font-size=\"10.6\" fill=\"currentColor\">Trampa clásica: te dan el importe «IVA incluido». Divide entre 1,21 antes de comparar con 40.000 o 15.000.</text></svg>"}, {"n": 119, "t": "Tramitación urgente del expediente", "ubic": "Libro II ▸ Título I ▸ Capítulo I ▸ Sección 1.ª · Preparación · Expediente de contratación", "idea": "Necesidad inaplazable o interés público: mismos trámites, plazos a la mitad, con excepciones.", "literal": "<p><b>1.</b> Podrán ser objeto de tramitación urgente los expedientes correspondientes a los contratos cuya celebración responda a una necesidad inaplazable o cuya adjudicación sea preciso acelerar por razones de interés público. A tales efectos el expediente deberá contener la declaración de urgencia hecha por el órgano de contratación, debidamente motivada.</p><p><b>2.</b> Los expedientes calificados de urgentes se tramitarán siguiendo el mismo procedimiento que los ordinarios, con las siguientes especialidades:</p><p style=\"margin-left:1.1rem\">a) Los expedientes gozarán de preferencia para su despacho por los distintos órganos que intervengan en la tramitación, que dispondrán de un plazo de cinco días para emitir los respectivos informes o cumplimentar los trámites correspondientes. Cuando la complejidad del expediente o cualquier otra causa igualmente justificada impida cumplir el plazo antes indicado, los órganos que deban evacuar el trámite lo pondrán en conocimiento del órgano de contratación que hubiese declarado la urgencia. En tal caso el plazo quedará prorrogado hasta diez días.</p><p style=\"margin-left:1.1rem\">b) Acordada la apertura del procedimiento de adjudicación, los plazos establecidos en esta Ley para la licitación, adjudicación y formalización del contrato se reducirán a la mitad, salvo los siguientes: 1.º El plazo de quince días hábiles establecido en el apartado 3 del artículo 153, como período de espera antes de la formalización del contrato. 2.º El plazo de presentación de proposiciones en el procedimiento abierto en los contratos de obras, suministros y servicios sujetos a regulación armonizada, que se podrá reducir de conformidad con lo indicado en la letra b) del apartado 3) del artículo 156. 3.º Los plazos de presentación de solicitudes y de proposiciones en los procedimientos restringido y de licitación con negociación en los contratos de obras, suministros y servicios sujetos a regulación armonizada, que se podrán reducir según lo establecido en el segundo párrafo del apartado 1 del artículo 161 y en la letra b) del apartado 1 del artículo 164, según el caso. 4.º Los plazos de presentación de solicitudes en los procedimientos de diálogo competitivo y de asociación para la innovación en contratos de obras, suministros y servicios sujetos a regulación armonizada, no serán susceptibles de reducirse. 5.º El plazo de 6 días a más tardar antes de que finalice el plazo fijado para la presentación de ofertas, para que los servicios dependientes del órgano de contratación faciliten al candidato o licitador la información adicional solicitada, será de 4 días a más tardar antes de que finalice el citado plazo en los contratos de obras, suministros y servicios sujetos a regulación armonizada siempre que se adjudiquen por procedimientos abierto y restringido. La reducción anterior no se aplicará a los citados contratos cuando el procedimiento de adjudicación sea uno distinto del abierto o del restringido. 6.º Los plazos establecidos en el artículo 159 respecto a la tramitación del procedimiento abierto simplificado, de conformidad con lo señalado en el apartado 5 de dicho artículo. Las reducciones de plazo establecidas en los puntos 2.º, 3.º y 5.º anteriores no se aplicarán en la adjudicación de los contratos de concesiones de obras y concesiones de servicios sujetos a regulación armonizada cualquiera que sea el procedimiento de adjudicación utilizado, no siendo los plazos a que se refieren dichos puntos, en estos contratos, susceptibles de reducción alguna.</p><p style=\"margin-left:1.1rem\">c) El plazo de inicio de la ejecución del contrato no podrá exceder de un mes, contado desde la formalización.</p>", "dis": "<ul>\n<li><b>Supuesto de la <span class=\"t\" data-k=\"urgente\">tramitación urgente</span> (119.1):</b> contratos cuya celebración responda a una <b>necesidad inaplazable</b> o cuya adjudicación sea preciso <b>acelerar por razones de interés público</b>.</li>\n<li><b>Requisito formal:</b> el expediente debe contener la <b>declaración de urgencia</b> hecha por el <b>órgano de contratación</b>, <b>debidamente motivada</b>.</li>\n<li><b>Procedimiento (119.2):</b> se sigue el <b>mismo procedimiento que los ordinarios</b>, con estas especialidades:\n <ul><li><b>a) Preferencia:</b> los órganos que intervengan disponen de <b>cinco días</b> para informar o cumplimentar trámites; si la complejidad lo impide, lo comunican al órgano de contratación y el plazo se <b>prorroga hasta diez días</b>.</li>\n <li><b>b) Plazos a la mitad:</b> los plazos de <b>licitación, adjudicación y formalización</b> se reducen a la mitad, <b>salvo</b>:\n  <ul><li><b>1.º</b> el plazo de <b>quince días hábiles</b> del art. 153.3 —espera antes de formalizar—;</li>\n  <li><b>2.º</b> el de presentación de proposiciones en abierto SARA, que se reduce según el art. 156.3.b);</li>\n  <li><b>3.º</b> los de solicitudes y proposiciones en restringido y licitación con negociación SARA;</li>\n  <li><b>4.º</b> los de solicitudes en diálogo competitivo y asociación para la innovación SARA, que <b>no son susceptibles de reducirse</b>;</li>\n  <li><b>5.º</b> el plazo de información adicional, que pasa de <b>6 a 4 días</b> en abierto y restringido SARA;</li>\n  <li><b>6.º</b> los plazos del abierto simplificado del art. 159.</li></ul>\n  Y las reducciones 2.º, 3.º y 5.º <b>no se aplican</b> a las concesiones SARA.</li>\n <li><b>c) Inicio de la ejecución:</b> no podrá exceder de <b>un mes desde la formalización</b>.</li></ul></li>\n</ul>", "llano": "<p>Cuando algo no puede esperar, se declara la urgencia —motivada y por el órgano de contratación— y el expediente sigue los mismos pasos, pero a doble velocidad: los informes en cinco días y los plazos a la mitad.</p>\n<p>Con una excepción que no se toca nunca: los quince días hábiles que hay que esperar antes de firmar cuando cabe recurso especial.</p>", "porque": "<p>Porque la urgencia real existe —un colegio sin calefacción en noviembre— y obligarle a esperar los plazos ordinarios sería absurdo. Pero la urgencia es también la excusa preferida para reducir la concurrencia, y por eso la ley pide <b>declaración expresa y motivada</b>: quien la declara responde de ella.</p>\n<p>Y hay una línea que la urgencia no cruza: el <b>plazo de espera</b> del art. 153.3. Reducirlo a la mitad haría inviable el recurso especial, que es una garantía de origen europeo. La prisa de la Administración no puede recortar el derecho de defensa de los licitadores.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> el trámite exprés del pasaporte: los mismos pasos y los mismos requisitos, solo que más rápido. Lo que no se salta es la comprobación de tu identidad.</li>\n<li><b>Real:</b> un temporal deja sin cubierta el pabellón municipal en octubre. El alcalde declara la urgencia motivándola en el uso escolar del pabellón y en el riesgo de daños mayores. La Intervención dispone de <b>cinco días</b> para fiscalizar y el plazo de presentación de ofertas se reduce a la mitad.</li>\n<li><b>Caso límite:</b> ese mismo contrato es susceptible de recurso especial. Aunque todo lo demás vaya a la mitad, siguen siendo <b>quince días hábiles</b> de espera antes de poder formalizar. Y la ejecución debe comenzar en el plazo máximo de <b>un mes</b> desde la formalización.</li>\n</ul>", "noej": "<ul>\n<li><b>No es tramitación de emergencia:</b> la urgencia <b>sigue</b> el procedimiento; la emergencia lo <b>elimina</b> (art. 120).</li>\n<li><b>No es tramitación anticipada:</b> esa solo adelanta el expediente a un ejercicio anterior (art. 117.2).</li>\n<li><b>No se reduce</b> el plazo de espera del art. 153.3.</li>\n<li><b>No basta</b> con que el contrato corra prisa: hace falta <b>declaración de urgencia motivada</b> en el expediente.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 120:</b> tramitación de emergencia.</li>\n<li><b>Art. 117.2:</b> tramitación anticipada.</li>\n<li><b>Art. 153.3:</b> el plazo de espera que la urgencia no reduce.</li>\n<li><b>Art. 156.3.b):</b> reducción del plazo por urgencia en el abierto SARA.</li>\n<li><b>Art. 159.5:</b> plazos del abierto simplificado en tramitación urgente.</li>\n</ul>", "trampas": "<ul>\n<li><b>Cinco días</b> para informes, prorrogables a <b>diez</b>.</li>\n<li>Plazos <b>a la mitad</b>, con <b>seis</b> excepciones numeradas.</li>\n<li>El <b>plazo de espera</b> del 153.3 <b>nunca</b> se reduce.</li>\n<li>Inicio de la ejecución: máximo <b>un mes</b> desde la formalización.</li>\n</ul>", "ancla": "<p><b>«Todo a la mitad menos la espera.»</b></p>\n<p>Tres cifras: <b>5 días</b> de informe · <b>1/2</b> de los plazos · <b>1 mes</b> para empezar.</p>", "vis": "<svg viewBox=\"0 0 960 504\" role=\"img\" aria-label=\"Supuestos, requisitos y especialidades de la tramitación urgente del expediente\" style=\"width:100%;height:auto\"><defs><marker id=\"fl8\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr8\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe8\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw8\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"250\" y=\"8\" width=\"460\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"27.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">TRAMITACIÓN URGENTE · ART. 119</text><rect x=\"20\" y=\"52\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"30\" y=\"66\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"120\" y=\"83\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--acc)\">CUÁNDO</text><text x=\"224\" y=\"74\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Necesidad INAPLAZABLE, o adjudicación que es preciso ACELERAR</text><text x=\"224\" y=\"88\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">por razones de INTERÉS PÚBLICO.</text><text x=\"930\" y=\"74\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">119.1</text><path d=\"M480 107 L 480 115\" stroke=\"var(--acc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl8)\"/><rect x=\"20\" y=\"116\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"30\" y=\"130\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"120\" y=\"147\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--acc)\">QUÉ HACE FALTA</text><text x=\"224\" y=\"138\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">DECLARACIÓN DE URGENCIA del órgano de contratación,</text><text x=\"224\" y=\"152\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">debidamente MOTIVADA, en el expediente.</text><text x=\"930\" y=\"138\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">119.1</text><path d=\"M480 171 L 480 179\" stroke=\"var(--acc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl8)\"/><rect x=\"20\" y=\"180\" width=\"920\" height=\"40\" rx=\"10\" fill=\"var(--panel)\" stroke=\"var(--line)\"/><rect x=\"30\" y=\"187\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--line)\"/><text x=\"120\" y=\"204\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"currentColor\">MISMO PROCEDIMIENTO</text><text x=\"224\" y=\"202\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Se sigue el procedimiento ORDINARIO, con especialidades.</text><text x=\"930\" y=\"202\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">119.2</text><path d=\"M480 221 L 480 229\" stroke=\"var(--line)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl8)\"/><rect x=\"20\" y=\"230\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"30\" y=\"244\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"120\" y=\"261\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--warn)\">PREFERENCIA · 5 DÍAS</text><text x=\"224\" y=\"252\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Los expedientes gozan de preferencia; los órganos disponen de CINCO DÍAS</text><text x=\"224\" y=\"266\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">para informar. Si la complejidad lo impide, el plazo se prorroga hasta DIEZ.</text><text x=\"930\" y=\"252\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">119.2.a</text><path d=\"M480 285 L 480 293\" stroke=\"var(--warn)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl8)\"/><rect x=\"20\" y=\"294\" width=\"920\" height=\"40\" rx=\"10\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><rect x=\"30\" y=\"301\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--ej)\"/><text x=\"120\" y=\"318\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--ej)\">PLAZOS A LA MITAD</text><text x=\"224\" y=\"316\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Los plazos de licitación, adjudicación y formalización se REDUCEN A LA MITAD.</text><text x=\"930\" y=\"316\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">119.2.b</text><path d=\"M480 335 L 480 343\" stroke=\"var(--ej)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl8)\"/><rect x=\"20\" y=\"344\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><rect x=\"30\" y=\"358\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--exc)\"/><text x=\"120\" y=\"375\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--exc)\">EXCEPCIÓN QUE NO SE REDUCE</text><text x=\"224\" y=\"366\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">El plazo de QUINCE DÍAS HÁBILES de espera antes de formalizar (art. 153.3)</text><text x=\"224\" y=\"380\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">NO se reduce. Ni los plazos de las concesiones SARA.</text><text x=\"930\" y=\"366\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">119.2.b.1.º</text><path d=\"M480 399 L 480 407\" stroke=\"var(--exc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl8)\"/><rect x=\"20\" y=\"408\" width=\"920\" height=\"40\" rx=\"10\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"30\" y=\"415\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"120\" y=\"432\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--warn)\">INICIO DE LA EJECUCIÓN</text><text x=\"224\" y=\"430\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">No podrá exceder de UN MES desde la formalización.</text><text x=\"930\" y=\"430\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">119.2.c</text><rect x=\"20\" y=\"458\" width=\"920\" height=\"34\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"480\" y=\"478.328\" text-anchor=\"middle\" font-size=\"10.4\" fill=\"currentColor\">La urgencia acorta el camino, pero NO toca el plazo de espera del recurso especial: eso sería vaciar de contenido la garantía.</text></svg>"}, {"n": 120, "t": "Tramitación de emergencia", "ubic": "Libro II ▸ Título I ▸ Capítulo I ▸ Sección 1.ª · Preparación · Expediente de contratación", "idea": "Catástrofe, grave peligro o defensa nacional: se contrata sin expediente y hasta sin crédito.", "literal": "<p><b>1.</b> Cuando la Administración tenga que actuar de manera inmediata a causa de acontecimientos catastróficos, de situaciones que supongan grave peligro o de necesidades que afecten a la defensa nacional, se estará al siguiente régimen excepcional:</p><p style=\"margin-left:1.1rem\">a) El órgano de contratación, sin obligación de tramitar expediente de contratación, podrá ordenar la ejecución de lo necesario para remediar el acontecimiento producido o satisfacer la necesidad sobrevenida, o contratar libremente su objeto, en todo o en parte, sin sujetarse a los requisitos formales establecidos en la presente Ley, incluso el de la existencia de crédito suficiente. En caso de que no exista crédito adecuado y suficiente, una vez adoptado el acuerdo, se procederá a su dotación de conformidad con lo establecido en la Ley General Presupuestaria.</p><p style=\"margin-left:1.1rem\">b) Si el contrato ha sido celebrado por la Administración General del Estado, sus Organismos Autónomos, Entidades Gestoras y Servicios Comunes de la Seguridad Social o demás entidades públicas estatales, se dará cuenta de dichos acuerdos al Consejo de Ministros en el plazo máximo de treinta días.</p><p style=\"margin-left:1.1rem\">c) El plazo de inicio de la ejecución de las prestaciones no podrá ser superior a un mes, contado desde la adopción del acuerdo previsto en la letra a). Si se excediese este plazo, la contratación de dichas prestaciones requerirá la tramitación de un procedimiento ordinario.</p><p style=\"margin-left:1.1rem\">d) Ejecutadas las actuaciones objeto de este régimen excepcional, se observará lo dispuesto en esta Ley sobre cumplimiento de los contratos, recepción y liquidación de la prestación. En el supuesto de que el libramiento de los fondos necesarios se hubiera realizado a justificar, transcurrido el plazo establecido en la letra c) anterior, se rendirá la cuenta justificativa del mismo, con reintegro de los fondos no invertidos.</p><p><b>2.</b> Las restantes prestaciones que sean necesarias para completar la actuación acometida por la Administración y que no tengan carácter de emergencia se contratarán con arreglo a la tramitación ordinaria regulada en esta Ley.</p>", "dis": "<ul>\n<li><b>Supuesto de la <span class=\"t\" data-k=\"emergencia\">tramitación de emergencia</span> (120.1):</b> cuando la Administración tenga que actuar <b>de manera inmediata</b> a causa de:\n <ul><li>acontecimientos <b>catastróficos</b>;</li>\n <li>situaciones que supongan <b>grave peligro</b>;</li>\n <li>necesidades que afecten a la <b>defensa nacional</b>.</li></ul></li>\n<li><b>a) Régimen excepcional:</b> el órgano de contratación, <b>sin obligación de tramitar expediente</b>, puede ordenar la ejecución de lo necesario o contratar libremente su objeto, <b>sin sujetarse a los requisitos formales</b> de la ley, «<b>incluso el de la existencia de crédito suficiente</b>». Si no hay crédito, una vez adoptado el acuerdo se procede a su dotación conforme a la <b>Ley General Presupuestaria</b>.</li>\n<li><b>b) Control:</b> en el ámbito estatal, se da cuenta de los acuerdos al <b>Consejo de Ministros</b> en el plazo máximo de <b>treinta días</b>.</li>\n<li><b>c) Plazo:</b> el inicio de la ejecución de las prestaciones <b>no podrá ser superior a un mes</b> desde la adopción del acuerdo. Si se excede, la contratación requiere <b>procedimiento ordinario</b>.</li>\n<li><b>d) Después:</b> se aplican las reglas ordinarias sobre <b>cumplimiento, recepción y liquidación</b>. Si los fondos se libraron <b>a justificar</b>, se rinde la cuenta justificativa con reintegro de lo no invertido.</li>\n<li><b>Lo demás (120.2):</b> las restantes prestaciones necesarias que <b>no tengan carácter de emergencia</b> se contratan por tramitación <b>ordinaria</b>.</li>\n</ul>", "llano": "<p>Es el régimen del desastre. Ante una catástrofe, un peligro grave o una necesidad de defensa nacional, la Administración puede contratar directamente lo que haga falta: sin expediente, sin pliegos y sin esperar a que haya dinero en la partida.</p>\n<p>A cambio, tres cerrojos: hay que dar cuenta, hay que empezar en un mes y todo lo que no sea estrictamente la emergencia se contrata por la vía normal.</p>", "porque": "<p>Porque hay situaciones en las que el procedimiento cuesta vidas. Ante un incendio o una inundación, exigir treinta y cinco días de plazo de presentación de ofertas sería una forma sofisticada de no actuar.</p>\n<p>Pero la emergencia es también la puerta más ancha del ordenamiento contractual, y por eso la ley la acota por <b>causa</b> —tres supuestos tasados—, por <b>tiempo</b> —un mes para empezar— y por <b>objeto</b> —solo lo que sea emergencia, el resto por vía ordinaria—. Y la excluye del <b>recurso especial</b> (art. 44.4), precisamente porque no hay procedimiento que impugnar.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> si se te rompe una tubería a las tres de la mañana no pides tres presupuestos: llamas al fontanero de guardia. Pero la reforma completa del baño, después, sí la comparas.</li>\n<li><b>Real:</b> una riada deja incomunicadas t

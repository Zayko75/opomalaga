<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>LCSP · Tema 10 · Bloque 2 · Garantías, expediente y pliegos</title>
<style>

/* ═══════════════════════════════════════════════════════════════
   SISTEMA DE DISEÑO · "Académico Gamificado" · Bloque II
   Temas 8, 9 y 10 · Auxiliar Administrativo
   ═══════════════════════════════════════════════════════════════ */
:root{
  --fs:16px;

  --bg:#faf9f7;
  --bg-grad:radial-gradient(1100px 560px at 12% -8%, #ede9ff 0%, transparent 55%),
            radial-gradient(850px 460px at 96% 0%, #dcf5ee 0%, transparent 50%);
  --surface:#ffffff;
  --surface-2:#f4f3f0;
  --surface-3:#eceae5;
  --line:#e6e3dc;
  --line-strong:#d4d0c7;

  --ink:#15161c;
  --ink-2:#5d616e;
  --ink-3:#8b8f9c;

  --brand:#5b3df5;
  --brand-2:#7c5cff;
  --brand-soft:#efeaff;
  --brand-ring:rgba(91,61,245,.18);

  --legal:#4338ca;  --legal-bg:#eeecff;
  --ej:#059669;     --ej-bg:#e4f7f0;
  --warn:#c2690a;   --warn-bg:#fdf1de;
  --exc:#dc2626;    --exc-bg:#ffeceb;

  --ok:#16a34a; --ok-soft:#e7f7ec;
  --mid:#eab308; --mid-soft:#fdf6dd;
  --off:#a1a1aa; --off-soft:#f1f1f3;

  --sh-1:0 1px 2px rgba(20,20,30,.04), 0 2px 8px rgba(20,20,30,.04);
  --sh-2:0 2px 6px rgba(20,20,30,.05), 0 12px 28px rgba(20,20,30,.07);
  --sh-3:0 8px 20px rgba(91,61,245,.13), 0 24px 56px rgba(20,20,30,.10);
  --sh-glow:0 0 0 4px var(--brand-ring);

  --r-sm:9px; --r-md:14px; --r-lg:20px; --r-full:999px;

  --f-display:"Segoe UI Variable Display",system-ui,-apple-system,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-legal:ui-serif,Georgia,Cambria,"Times New Roman",serif;
  --f-mono:ui-monospace,"SF Mono","Cascadia Mono","Segoe UI Mono",Menlo,monospace;

  --t-h1:clamp(1.02rem,.95rem + .3vw,1.2rem);
  --t-h2:clamp(1.2rem,1.05rem + .6vw,1.55rem);
  --t-h3:clamp(1rem,.95rem + .25vw,1.12rem);
  --t-sm:.86rem;
  --t-xs:.75rem;

  --e-out:cubic-bezier(.22,1,.36,1);
  --e-spring:cubic-bezier(.34,1.56,.64,1);

  /* ── Compatibilidad con SVG y contenido generado ── */
  --panel:var(--surface);
  --ink2:var(--ink-2);
  --acc:var(--brand);
  --acc-soft:var(--brand-soft);
  --g:var(--ok); --y:var(--mid); --r:var(--exc);
}

html[data-theme="dark"]{
  --bg:#0a0b0f;
  --bg-grad:radial-gradient(1100px 560px at 12% -8%, #1c1740 0%, transparent 55%),
            radial-gradient(850px 460px at 96% 0%, #08302b 0%, transparent 50%);
  --surface:#13151b;
  --surface-2:#1a1d25;
  --surface-3:#232733;
  --line:#262a34;
  --line-strong:#343947;

  --ink:#eceef4;
  --ink-2:#9ba2b3;
  --ink-3:#6e7585;

  --brand:#8b6dff;
  --brand-2:#a78bff;
  --brand-soft:#1e1a3d;
  --brand-ring:rgba(139,109,255,.22);

  --legal:#a5b4fc; --legal-bg:#191b3a;
  --ej:#34d399;    --ej-bg:#0c2a24;
  --warn:#fbbf24;  --warn-bg:#2e2110;
  --exc:#fb7185;   --exc-bg:#331119;

  --ok:#4ade80; --ok-soft:#0e2a19;
  --mid:#facc15; --mid-soft:#2c2610;
  --off:#5b6070; --off-soft:#1c1f27;

  --sh-1:0 1px 2px rgba(0,0,0,.3), 0 2px 8px rgba(0,0,0,.25);
  --sh-2:0 2px 6px rgba(0,0,0,.35), 0 12px 28px rgba(0,0,0,.4);
  --sh-3:0 8px 20px rgba(139,109,255,.2), 0 24px 56px rgba(0,0,0,.5);
}

*,*::before,*::after{box-sizing:border-box}
html{font-size:var(--fs);scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);background-image:var(--bg-grad);
  background-attachment:fixed;background-repeat:no-repeat;
  color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.68;
  -webkit-font-smoothing:antialiased;
  transition:background-color .5s var(--e-out),color .3s;
}
::selection{background:var(--brand);color:#fff}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{font-family:var(--f-display);letter-spacing:-.022em;line-height:1.2}
.num{font-variant-numeric:tabular-nums}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:99px;border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3)}

/* ═══ HEADER ═══ */
header.top{
  position:sticky;top:0;z-index:60;
  background:color-mix(in srgb,var(--surface) 80%,transparent);
  backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);
  border-bottom:1px solid var(--line);
}
.top-in{max-width:1280px;margin:0 auto;padding:.65rem 1.1rem;display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.brandwrap{display:flex;align-items:center;gap:.65rem;min-width:0;flex:1}
.mark{
  width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;
  font-weight:800;font-size:.8rem;letter-spacing:-.02em;text-decoration:none;
  box-shadow:0 4px 14px var(--brand-ring);
  transition:transform .3s var(--e-spring),box-shadow .3s;
}
.mark:hover{transform:rotate(-8deg) scale(1.08);box-shadow:var(--sh-3);text-decoration:none}
.top h1{font-size:var(--t-h1);margin:0;font-weight:800;line-height:1.25;min-width:0}
.top h1 .sub{display:block;font-size:var(--t-xs);color:var(--ink-2);font-weight:500;letter-spacing:0;
  margin-top:.1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tools{margin-left:auto;display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}

button,select,input[type=search]{
  font:inherit;font-size:var(--t-sm);font-weight:600;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:var(--r-sm);padding:.4rem .72rem;cursor:pointer;
  position:relative;overflow:hidden;
  transition:transform .18s var(--e-spring),border-color .2s,background .2s,box-shadow .2s,color .2s;
}
button:hover{transform:translateY(-1.5px);border-color:var(--brand);box-shadow:var(--sh-1)}
button:active{transform:translateY(0) scale(.97)}
button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible{outline:none;box-shadow:var(--sh-glow)}
input[type=search]{min-width:190px;cursor:text;font-weight:500}
input[type=search]:focus{border-color:var(--brand)}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--surface-2);padding:2px;gap:2px}
.seg button{border:0;border-radius:calc(var(--r-sm) - 2px);padding:.32rem .68rem;background:transparent;box-shadow:none}
.seg button:hover{transform:none;background:var(--surface)}
.seg button[aria-pressed="true"]{background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;box-shadow:0 2px 8px var(--brand-ring)}

.ripple{position:absolute;border-radius:50%;transform:scale(0);background:currentColor;opacity:.25;animation:rip .55s linear;pointer-events:none}
@keyframes rip{to{transform:scale(3.4);opacity:0}}

.progress{position:absolute;left:0;bottom:-1px;height:2.5px;width:0;
  background:linear-gradient(90deg,var(--brand),var(--legal),var(--ej));transition:width .1s linear}

/* ═══ LAYOUT ═══ */
.layout{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:270px 1fr;gap:1.8rem;padding:1.4rem 1.1rem 5rem}
main{min-width:0}

/* ═══ SIDEBAR ═══ */
nav.side{
  position:sticky;top:76px;align-self:start;max-height:calc(100vh - 96px);overflow:auto;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:.85rem;box-shadow:var(--sh-1);
}
nav.side h2{font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);
  margin:.5rem .4rem .5rem;font-weight:800}
nav.side h2:first-child{margin-top:.1rem}
nav.side a{
  display:flex;align-items:baseline;gap:.5rem;padding:.36rem .55rem;border-radius:var(--r-sm);
  text-decoration:none;color:var(--ink-2);font-size:var(--t-sm);font-weight:500;
  position:relative;transition:background .22s,color .22s,transform .22s var(--e-out);
}
nav.side a:hover{background:var(--surface-2);color:var(--ink);transform:translateX(3px);text-decoration:none}
nav.side a.on{background:var(--brand-soft);color:var(--brand);font-weight:700}
nav.side a.on::before{content:"";position:absolute;left:-.85rem;top:20%;bottom:20%;width:3px;
  border-radius:0 3px 3px 0;background:var(--brand)}
nav.side a b{color:var(--ink-3);font-weight:800;font-size:var(--t-xs);font-variant-numeric:tabular-nums;flex:none;min-width:1.9em}
nav.side a.on b{color:var(--brand)}
.navtoggle{display:none}

/* ═══ TARJETAS ═══ */
section.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:1.35rem 1.5rem;margin-bottom:1.1rem;box-shadow:var(--sh-1);
  transition:box-shadow .3s var(--e-out),border-color .3s;
}
section.card:hover{box-shadow:var(--sh-2)}
section.card>h2{
  margin:0 0 1rem;font-size:var(--t-h2);font-weight:800;
  display:flex;align-items:center;gap:.6rem;
}
section.card>h2::before{
  content:"";width:4px;height:1.05em;border-radius:99px;flex:none;
  background:linear-gradient(180deg,var(--brand),var(--brand-2));
}

/* ═══ ARTÍCULO ═══ */
.art{scroll-margin-top:86px;padding-top:.4rem}
.art + .art{margin-top:1.6rem;padding-top:1.6rem;border-top:1px dashed var(--line)}
.art h2{display:flex;flex-wrap:wrap;gap:.5rem;align-items:baseline;font-size:var(--t-h3);
  margin:0 0 .25rem;font-weight:800;letter-spacing:-.015em}
.art h2 .num{
  color:var(--brand);font-weight:800;font-family:var(--f-display);
  background:var(--brand-soft);padding:.1rem .5rem;border-radius:var(--r-sm);
  font-size:.92em;letter-spacing:-.02em;
}
.ubic{font-size:var(--t-xs);color:var(--ink-3);margin:0 0 .8rem;font-weight:600;
  letter-spacing:.03em;text-transform:uppercase}

/* ═══ IDEA CLAVE ═══ */
.idea{
  background:linear-gradient(100deg,var(--brand-soft),color-mix(in srgb,var(--brand-soft) 40%,transparent));
  border-left:4px solid var(--brand);border-radius:0 var(--r-md) var(--r-md) 0;
  padding:.75rem 1rem;font-weight:650;margin:.7rem 0 1rem;position:relative;
  font-size:.97rem;line-height:1.55;
}

/* ═══ ACORDEÓN ═══ */
details.panel{
  border:1px solid var(--line);border-radius:var(--r-md);margin:.6rem 0;
  background:var(--surface);overflow:hidden;
  transition:border-color .25s,box-shadow .25s,background .25s;
}
details.panel:hover{border-color:var(--line-strong)}
details.panel[open]{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-ring)}
details.panel>summary{
  cursor:pointer;padding:.62rem .9rem;font-weight:700;font-size:.93rem;
  list-style:none;display:flex;align-items:center;gap:.55rem;
  transition:background .2s,color .2s;
}
details.panel>summary:hover{background:var(--surface-2)}
details.panel[open]>summary{background:var(--brand-soft);color:var(--brand)}
details.panel>summary::-webkit-details-marker{display:none}
details.panel>summary::before{
  content:"";width:16px;height:16px;flex:none;border-radius:5px;
  background:var(--brand-soft);position:relative;transition:transform .3s var(--e-spring),background .25s;
}
details.panel>summary::after{
  content:"";position:absolute;width:0;height:0;margin-left:5px;
  border:4px solid transparent;border-left-color:var(--brand);
  transition:transform .3s var(--e-spring);
}
details.panel[open]>summary::before{background:var(--surface)}
details.panel[open]>summary::after{transform:rotate(90deg) translateX(-1px)}
details.panel .body{padding:.3rem 1rem 1rem;font-size:.95rem;animation:slidein .35s var(--e-out)}
@keyframes slidein{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* ═══ TEXTO LEGAL ═══ */
.legal{
  background:var(--legal-bg);border-left:4px solid var(--legal);
  border-radius:0 var(--r-md) var(--r-md) 0;padding:.85rem 1.05rem;
  font-family:var(--f-legal);font-size:.95rem;line-height:1.7;
}
.legal p{margin:.45rem 0}
.legal .lbl{
  font-family:var(--f-body);font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;
  color:var(--legal);font-weight:800;display:block;margin-bottom:.4rem;
}

/* ═══ CAJAS SEMÁNTICAS ═══ */
.box{
  border-left:4px solid var(--line);border-radius:0 var(--r-md) var(--r-md) 0;
  padding:.72rem .95rem;margin:.65rem 0;font-size:.94rem;
  transition:transform .25s var(--e-out),box-shadow .25s;
}
.box:hover{transform:translateX(3px);box-shadow:var(--sh-1)}
.box.ej{background:var(--ej-bg);border-color:var(--ej)}
.box.warn{background:var(--warn-bg);border-color:var(--warn)}
.box.exc{background:var(--exc-bg);border-color:var(--exc)}
.box .lbl{font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;font-weight:800;
  display:block;margin-bottom:.3rem}
.box.ej .lbl{color:var(--ej)}
.box.warn .lbl{color:var(--warn)}
.box.exc .lbl{color:var(--exc)}

.interp{
  border:1px dashed var(--warn);background:color-mix(in srgb,var(--warn-bg) 45%,transparent);
  border-radius:var(--r-md);padding:.65rem .9rem;font-size:.9rem;margin:.6rem 0;
}
.interp .lbl{font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;color:var(--warn);font-weight:800;display:block}

/* ═══ TABLAS ═══ */
table{width:100%;border-collapse:separate;border-spacing:0;font-size:.9rem;margin:.7rem 0;
  border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
th,td{padding:.5rem .68rem;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
td + td, th + th{border-left:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th{background:var(--surface-2);font-size:var(--t-xs);font-weight:800;letter-spacing:.05em;
  text-transform:uppercase;color:var(--ink-2);position:sticky;top:0}
tbody tr{transition:background .18s}
tbody tr:nth-child(even){background:color-mix(in srgb,var(--surface-2) 45%,transparent)}
tbody tr:hover{background:var(--brand-soft)}
th.sortable{cursor:pointer;user-select:none;transition:color .2s,background .2s}
th.sortable:hover{color:var(--brand);background:var(--brand-soft)}
th.sortable::after{content:" ⇅";color:var(--ink-3);font-size:.7rem}

ul,ol{margin:.5rem 0 .5rem 1.2rem;padding:0}
li{margin:.26rem 0}
li::marker{color:var(--brand);font-weight:700}

/* ═══ TOOLTIPS ═══ */
.t{border-bottom:1.5px dotted var(--brand);cursor:help;position:relative;
  transition:background .2s,color .2s}
.t:hover{background:var(--brand-soft);color:var(--brand);border-radius:3px}
#tip{
  position:fixed;z-index:99;max-width:330px;background:var(--ink);color:var(--bg);
  padding:.6rem .78rem;border-radius:var(--r-md);font-size:.82rem;line-height:1.5;
  display:none;box-shadow:0 8px 30px rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.08);
}
html[data-theme="dark"] #tip{background:#f0f1f5;color:#15161c}

/* ═══ FLECHAS DE DIAGRAMA ═══
   Un <path> con stroke pero sin fill toma el valor inicial (negro) y el
   navegador cierra el trazo implícitamente: aparece un triángulo relleno
   entre sus extremos. Forzamos fill:none para dejar solo la línea + la
   punta del <marker>, que sí lleva su color. */
svg path[stroke]:not([fill]){fill:none}
svg polyline:not([fill]){fill:none}
svg line{fill:none}

/* ═══ SVG ═══ */
svg{max-width:100%;height:auto;display:block;margin:.9rem auto}
svg text{font-family:var(--f-body)}

/* ═══ BUSCADOR ═══ */
mark.hit{background:linear-gradient(180deg,transparent 55%,#ffe066 55%);color:inherit;
  border-radius:2px;padding:0 1px;font-weight:600}
html[data-theme="dark"] mark.hit{background:linear-gradient(180deg,transparent 55%,#8a6d00 55%);color:#fff}

/* ═══ UTILIDADES ═══ */
.hide{display:none !important}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.small{font-size:var(--t-sm);color:var(--ink-2)}
.chip{
  display:inline-block;font-size:var(--t-xs);padding:.16rem .55rem;border-radius:var(--r-full);
  background:var(--brand-soft);color:var(--brand);font-weight:800;letter-spacing:.02em;
}

/* ═══ HUECOS RELLENABLES ═══ */
.gap{
  display:inline-block;min-width:5.5em;border-bottom:2px solid var(--brand);
  text-align:center;font-weight:700;color:transparent;cursor:pointer;
  transition:color .3s,background .3s;
}
.gap.on,.gap:hover{color:var(--brand);background:var(--brand-soft);border-radius:4px 4px 0 0}

/* ═══ REVELAR SOLUCIÓN ═══ */
.revelar{
  background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;border-color:transparent;
  font-weight:700;
}
.revelar:hover{box-shadow:var(--sh-3)}
.sol{
  margin-top:.7rem;padding:.8rem 1rem;border-radius:var(--r-md);
  background:var(--ej-bg);border-left:4px solid var(--ej);
  animation:slidein .4s var(--e-out);
}

/* ═══ TEST ═══ */
.opt{
  display:block;padding:.55rem .85rem;margin:.35rem 0;border:1.5px solid var(--line);
  border-radius:var(--r-md);cursor:pointer;background:var(--surface);font-size:.94rem;
  transition:border-color .22s,background .22s,transform .22s var(--e-out);
}
.opt:hover{border-color:var(--brand);background:var(--brand-soft);transform:translateX(4px)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft);font-weight:650}
.opt.ko{border-color:var(--exc);background:var(--exc-bg)}
.opt input{margin-right:.5rem;accent-color:var(--brand)}

#tscore,#semres{
  font-family:var(--f-display);font-weight:800;font-size:1.15rem;letter-spacing:-.02em;
}

/* ═══════════════════════════════════════════════════════════════
   FLASHCARDS 3D · mazo con giro, vuelo de salida y sheen
   ═══════════════════════════════════════════════════════════════ */
#flash{--fc-e:cubic-bezier(.2,.8,.25,1);--fc-h:250px}

/* — Escena — */
.fc-stage{
  perspective:1400px;perspective-origin:50% 45%;
  padding:.4rem 0 .2rem;position:relative;
}
.fc-deck{position:relative;height:var(--fc-h);will-change:transform}

/* — Cartas fantasma del mazo — */
.fc-ghost{
  position:absolute;inset:0;border-radius:var(--r-lg);
  background:var(--surface);border:1px solid var(--line);
  transition:transform .5s var(--fc-e),opacity .5s var(--fc-e);
}
.fc-ghost.g1{transform:translateY(9px) scale(.972);opacity:.75}
.fc-ghost.g2{transform:translateY(18px) scale(.944);opacity:.45}
.fc-deck.empty .fc-ghost{opacity:0;transform:translateY(26px) scale(.9)}

/* — Elevación durante el giro — */
.fc-lift{position:absolute;inset:0;transform-style:preserve-3d}
.fc-lift.lift{animation:fcLift .78s var(--fc-e)}
@keyframes fcLift{
  0%,100%{transform:scale(1) translateY(0)}
  45%{transform:scale(1.055) translateY(-16px)}
}
.fc-lift.out-ok{animation:fcOut .5s cubic-bezier(.5,0,.75,0) forwards}
.fc-lift.out-ko{animation:fcOutKo .5s cubic-bezier(.5,0,.75,0) forwards}
.fc-lift.in{animation:fcIn .48s var(--fc-e)}
@keyframes fcOut{
  0%{transform:translateX(0) rotate(0) scale(1);opacity:1}
  100%{transform:translateX(130%) rotate(17deg) scale(.85);opacity:0}
}
@keyframes fcOutKo{
  0%{transform:translateX(0) rotate(0) scale(1);opacity:1}
  100%{transform:translateX(-130%) rotate(-17deg) scale(.85);opacity:0}
}
@keyframes fcIn{
  0%{transform:translateY(26px) scale(.9);opacity:0}
  100%{transform:translateY(0) scale(1);opacity:1}
}

/* — La carta — */
.fc-card{
  position:absolute;inset:0;transform-style:preserve-3d;
  transition:transform .78s var(--fc-e);
  cursor:pointer;border-radius:var(--r-lg);
}
.fc-card:focus-visible{outline:none}
.fc-card:focus-visible .fc-face{box-shadow:var(--sh-glow),var(--sh-2)}

/* — Caras — */
.fc-face{
  position:absolute;inset:0;border-radius:var(--r-lg);
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  padding:2rem 2.2rem;text-align:center;overflow:hidden;
  box-shadow:var(--sh-2);
  transition:box-shadow .4s var(--fc-e);
}
.fc-card:hover .fc-face{box-shadow:var(--sh-3)}

/* Anverso · pregunta */
.fc-front{
  background:
    radial-gradient(120% 90% at 50% -20%, var(--brand-soft) 0%, transparent 60%),
    var(--surface);
  border:1.5px solid var(--line);color:var(--ink);
}
/* Reverso · respuesta */
.fc-back{
  transform:rotateY(180deg);
  background:linear-gradient(145deg,var(--brand) 0%,#6d4bf7 45%,var(--c5,#0891b2) 130%);
  border:1.5px solid transparent;color:#fff;
}
html[data-theme="dark"] .fc-back{
  background:linear-gradient(145deg,#5f45c9 0%,#4b3aa8 45%,#0e6b85 130%);
}
.fc-back .fc-txt{color:#fff}
.fc-back b,.fc-back strong{color:#fff;font-weight:800}

/* — Sheen que barre al girar — */
.fc-face::after{
  content:"";position:absolute;top:-60%;left:-70%;width:55%;height:220%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.42),transparent);
  transform:rotate(18deg);opacity:0;pointer-events:none;
}
.fc-lift.lift .fc-face::after{animation:fcSheen .78s var(--fc-e)}
@keyframes fcSheen{
  0%{opacity:0;left:-70%}
  35%{opacity:1}
  100%{opacity:0;left:150%}
}

/* — Etiqueta superior — */
.fc-tag{
  position:absolute;top:1rem;left:1.15rem;
  font-size:var(--t-xs);font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  display:inline-flex;align-items:center;gap:.4rem;
}
.fc-front .fc-tag{color:var(--brand)}
.fc-back .fc-tag{color:rgba(255,255,255,.9)}
.fc-tag::before{
  content:"";width:7px;height:7px;border-radius:50%;background:currentColor;
  animation:fcPulse 2.2s ease-in-out infinite;
}
@keyframes fcPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.65)}}

/* — Índice tipo naipe — */
.fc-pip{
  position:absolute;font-family:var(--f-display);font-weight:800;
  font-size:.78rem;letter-spacing:-.02em;opacity:.34;font-variant-numeric:tabular-nums;
}
.fc-pip.tr{top:1rem;right:1.15rem}
.fc-pip.bl{bottom:1rem;left:1.15rem;transform:rotate(180deg)}
.fc-front .fc-pip{color:var(--ink-2)}
.fc-back .fc-pip{color:#fff;opacity:.55}

/* — Texto — */
.fc-txt{
  font-size:clamp(1rem,.9rem + .55vw,1.28rem);font-weight:650;line-height:1.5;
  max-width:44ch;letter-spacing:-.012em;
}
.fc-front .fc-txt{font-family:var(--f-display);font-weight:700}
.fc-back .fc-txt{font-weight:600;line-height:1.6}
.fc-hint{
  position:absolute;bottom:1rem;left:0;right:0;
  font-size:var(--t-xs);font-weight:600;letter-spacing:.02em;
  display:flex;align-items:center;justify-content:center;gap:.4rem;
}
.fc-front .fc-hint{color:var(--ink-3)}
.fc-back .fc-hint{color:rgba(255,255,255,.72)}
.fc-hint .kbd{
  font-family:var(--f-mono);font-size:.68rem;font-weight:700;padding:.1rem .32rem;
  border-radius:5px;border:1px solid currentColor;opacity:.75;
}

/* — Pantalla final — */
.fc-done{
  position:absolute;inset:0;border-radius:var(--r-lg);
  background:linear-gradient(150deg,var(--ok-soft),var(--surface) 70%);
  border:1.5px solid var(--ok);
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  text-align:center;padding:2rem;gap:.35rem;
  animation:fcIn .5s var(--fc-e);box-shadow:var(--sh-2);
}
.fc-done .seal{
  font-size:2.6rem;line-height:1;
  animation:fcSeal .7s cubic-bezier(.2,1.5,.4,1);
}
@keyframes fcSeal{0%{transform:scale(0) rotate(-25deg);opacity:0}60%{transform:scale(1.2) rotate(6deg)}100%{transform:scale(1) rotate(0);opacity:1}}
.fc-done h3{font-size:1.3rem;font-weight:800;margin:.2rem 0 0}
.fc-done p{margin:0;color:var(--ink-2);font-size:var(--t-sm)}

/* — Barra de progreso de la ronda — */
.fc-bar{
  height:6px;border-radius:99px;background:var(--surface-3);
  overflow:hidden;margin:.95rem 0 .8rem;position:relative;
}
.fc-bar i{
  display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--brand),var(--c5,#0891b2));
  transition:width .55s var(--fc-e);
}

/* — Controles — */
.fc-ctrls{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.fc-ctrls button{font-weight:700}
#fcok{border-color:var(--ok);color:var(--ok)}
#fcok:hover{background:var(--ok);color:#fff;border-color:var(--ok)}
#fcko{border-color:var(--warn);color:var(--warn)}
#fcko:hover{background:var(--warn);color:#fff;border-color:var(--warn)}
#fcflip{background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;border-color:transparent}
#fcflip:hover{box-shadow:var(--sh-3)}

.fc-score{display:inline-flex;gap:.45rem;margin-left:auto;align-items:center}
.fc-pill{
  font-size:var(--t-xs);font-weight:800;padding:.24rem .6rem;border-radius:var(--r-full);
  font-variant-numeric:tabular-nums;border:1px solid;
}
.fc-pill.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.fc-pill.ko{color:var(--warn);border-color:var(--warn);background:var(--warn-bg)}
.fc-pill.left{color:var(--ink-2);border-color:var(--line);background:var(--surface-2)}
.fc-pill.bump{animation:fcBump .45s var(--e-spring)}
@keyframes fcBump{0%{transform:scale(1)}45%{transform:scale(1.28)}100%{transform:scale(1)}}

@media(max-width:620px){
  #flash{--fc-h:270px}
  .fc-face{padding:1.7rem 1.3rem}
  .fc-score{margin-left:0;width:100%}
}
@media(prefers-reduced-motion:reduce){
  .fc-card{transition:none}
  .fc-lift.lift,.fc-lift.in,.fc-lift.out-ok,.fc-lift.out-ko,.fc-face::after{animation:none !important}
}
@media print{.fc-stage,.fc-ctrls,.fc-bar{display:none !important}}
/* ═══ RESPUESTA ESTRUCTURADA ═══ */
.fc-face{justify-content:center}
.fc-face.struct{justify-content:flex-start;text-align:left;padding-top:3.1rem;padding-bottom:3.1rem}
.fc-body{
  width:100%;max-width:46ch;margin:0 auto;
  overflow-y:auto;max-height:100%;
  scrollbar-width:thin;
}
.fc-body::-webkit-scrollbar{width:5px}
.fc-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.35);border-radius:99px;border:0}
.fc-front .fc-body::-webkit-scrollbar-thumb{background:var(--line-strong)}

/* — Veredicto Sí / No — */
.fc-verdict{
  display:inline-flex;align-items:center;gap:.35rem;
  font-family:var(--f-display);font-weight:800;font-size:.82rem;
  letter-spacing:.06em;text-transform:uppercase;
  padding:.26rem .72rem;border-radius:var(--r-full);margin-bottom:.85rem;
  border:1.5px solid;animation:fcPopIn .45s var(--e-spring) backwards;animation-delay:.34s;
}
.fc-verdict.si{background:rgba(255,255,255,.16);border-color:rgba(190,255,215,.85);color:#d8ffe9}
.fc-verdict.no{background:rgba(255,255,255,.16);border-color:rgba(255,205,205,.85);color:#ffdedd}
@keyframes fcPopIn{0%{opacity:0;transform:scale(.7) translateY(6px)}100%{opacity:1;transform:none}}

/* — Párrafo — */
.fc-p{margin:0;font-size:clamp(1rem,.92rem + .45vw,1.2rem);font-weight:600;line-height:1.6}
.fc-face.struct .fc-p{font-size:clamp(.96rem,.9rem + .35vw,1.1rem)}

/* — Lista enumerada — */
.fc-list{list-style:none;margin:0;padding:0;display:grid;gap:.5rem;counter-reset:fc}
.fc-list li{
  counter-increment:fc;position:relative;margin:0;
  padding:.42rem .6rem .42rem 2.5rem;border-radius:var(--r-sm);
  background:rgba(255,255,255,.11);
  font-size:clamp(.92rem,.88rem + .3vw,1.04rem);font-weight:600;line-height:1.45;
  animation:fcRow .42s var(--e-out) backwards;
}
.fc-list li::before{
  content:counter(fc);position:absolute;left:.6rem;top:50%;transform:translateY(-50%);
  width:1.6rem;height:1.6rem;border-radius:50%;
  display:grid;place-items:center;
  background:rgba(255,255,255,.9);color:var(--brand);
  font-family:var(--f-display);font-weight:800;font-size:.78rem;
  font-variant-numeric:tabular-nums;
}
.fc-list.alpha li::before{content:counter(fc,lower-alpha)}
.fc-list li:nth-child(1){animation-delay:.36s}
.fc-list li:nth-child(2){animation-delay:.42s}
.fc-list li:nth-child(3){animation-delay:.48s}
.fc-list li:nth-child(4){animation-delay:.54s}
.fc-list li:nth-child(5){animation-delay:.60s}
.fc-list li:nth-child(n+6){animation-delay:.66s}
@keyframes fcRow{0%{opacity:0;transform:translateX(-12px)}100%{opacity:1;transform:none}}

/* — Cláusulas contrapuestas — */
.fc-clauses{display:grid;gap:.45rem}
.fc-clauses p{
  margin:0;padding:.45rem .7rem .45rem .95rem;border-radius:0 var(--r-sm) var(--r-sm) 0;
  background:rgba(255,255,255,.11);border-left:3px solid rgba(255,255,255,.55);
  font-size:clamp(.92rem,.88rem + .3vw,1.04rem);font-weight:600;line-height:1.5;
  animation:fcRow .42s var(--e-out) backwards;
}
.fc-clauses p:nth-child(1){animation-delay:.36s}
.fc-clauses p:nth-child(2){animation-delay:.44s}
.fc-clauses p:nth-child(3){animation-delay:.52s}

/* — Negritas resaltadas en el reverso — */
.fc-back .fc-body b,.fc-back .fc-body strong{
  font-weight:800;background:rgba(255,255,255,.2);
  padding:.03em .3em;border-radius:5px;
  box-decoration-break:clone;-webkit-box-decoration-break:clone;
}

/* — Cita legal al pie — */
.fc-cite{
  position:absolute;bottom:.95rem;left:0;right:0;
  display:inline-flex;align-items:center;justify-content:center;gap:.4rem;
  font-family:var(--f-mono);font-size:.74rem;font-weight:700;letter-spacing:.02em;
  color:rgba(255,255,255,.82);
  animation:fcPopIn .5s var(--e-out) backwards;animation-delay:.5s;
}
.fc-cite::before,.fc-cite::after{
  content:"";height:1px;width:clamp(18px,10%,52px);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.45));
}
.fc-cite::after{background:linear-gradient(90deg,rgba(255,255,255,.45),transparent)}
.fc-cite .s{font-size:.9rem;opacity:.75;font-family:var(--f-legal)}
.fc-front .fc-cite{color:var(--ink-3)}
.fc-front .fc-cite::before{background:linear-gradient(90deg,transparent,var(--line-strong))}
.fc-front .fc-cite::after{background:linear-gradient(90deg,var(--line-strong),transparent)}

/* la pista se oculta si hay cita, para no amontonar */
.fc-back .fc-cite ~ .fc-hint,.fc-back .fc-hint.muted{display:none}

@media(max-width:620px){
  #flash{--fc-h:320px}
  .fc-face.struct{padding-top:2.9rem;padding-bottom:2.8rem}
  .fc-list li{padding-left:2.3rem}
}
@media(prefers-reduced-motion:reduce){
  .fc-verdict,.fc-list li,.fc-clauses p,.fc-cite{animation:none !important}
}

/* ═══ SEMÁFORO ═══ */
.sembtn{
  border-radius:var(--r-full);padding:.32rem .7rem;font-weight:700;font-size:var(--t-sm);
}
.sembtn[data-v="g"]:hover,.sembtn.on[data-v="g"]{background:var(--ok);color:#fff;border-color:var(--ok)}
.sembtn[data-v="y"]:hover,.sembtn.on[data-v="y"]{background:var(--mid);color:#3d2f00;border-color:var(--mid)}
.sembtn[data-v="r"]:hover,.sembtn.on[data-v="r"]{background:var(--exc);color:#fff;border-color:var(--exc)}

/* ═══ CTA DE BLOQUE ═══ */
a.blk{
  display:inline-flex;align-items:center;gap:.5rem;
  background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;
  padding:.5rem .95rem;border-radius:var(--r-sm);font-weight:700;font-size:var(--t-sm);
  text-decoration:none;box-shadow:0 2px 10px var(--brand-ring);
  transition:transform .22s var(--e-spring),box-shadow .25s,gap .25s var(--e-out);
}
a.blk:hover{transform:translateY(-2px);box-shadow:var(--sh-3);gap:.75rem;text-decoration:none}
a.blk::after{content:"→"}
a.blk:active{transform:translateY(0) scale(.98)}

/* ═══ REVEAL ═══ */
.rv{opacity:0;transform:translateY(20px);transition:opacity .6s var(--e-out),transform .6s var(--e-out)}
.rv.in{opacity:1;transform:none}

/* ═══ RESPONSIVE ═══ */
@media(max-width:960px){
  .layout{grid-template-columns:1fr;padding-top:.9rem;gap:1rem}
  nav.side{position:static;max-height:none}
  nav.side.collapsed .navbody{display:none}
  .navtoggle{display:block;width:100%;text-align:left;font-weight:700}
  .grid2{grid-template-columns:1fr}
  .top h1 .sub{white-space:normal}
}
@media(max-width:620px){
  .top-in{padding:.55rem .8rem}
  .tools{width:100%;margin-left:0}
  input[type=search]{flex:1;min-width:0}
  section.card{padding:1.05rem 1rem;border-radius:var(--r-md)}
  table{font-size:.82rem}
  th,td{padding:.4rem .5rem}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
  .rv{opacity:1;transform:none}
}
@media print{
  header.top,nav.side,.tools,.noprint,.progress{display:none !important}
  body{background:#fff;background-image:none;font-size:11pt;color:#000}
  .layout{display:block;max-width:none;padding:0}
  section.card{border:0;padding:0;margin:0 0 1rem;break-inside:avoid;box-shadow:none}
  details.panel{border:0;box-shadow:none}
  details.panel .body{display:block !important}
  details.panel>summary{padding-left:0}
  .art{break-inside:avoid}
  .rv{opacity:1;transform:none}
  a{color:#000;text-decoration:none}
}


/* ═══ ALTURA ADAPTATIVA DE LA TARJETA ═══ */
.fc-deck{transition:height .45s var(--fc-e)}
.fc-body{max-height:none;overflow:visible}
.fc-measure{
  position:absolute;left:0;right:0;top:0;height:auto;
  visibility:hidden;pointer-events:none;z-index:-1;
}
.fc-measure .fc-face{
  position:relative;inset:auto;height:auto;min-height:0;
  box-shadow:none;backface-visibility:visible;transform:none;
}
.fc-measure .fc-body{max-height:none;overflow:visible}
.fc-measure .fc-face::after{display:none}

/* ═══ MOSTRAR / OCULTAR ÍNDICE LATERAL ═══ */
.layout{transition:grid-template-columns .42s var(--e-out)}
.layout.nonav{grid-template-columns:0 1fr;gap:0}
.layout.nonav>nav.side{
  opacity:0;transform:translateX(-14px);pointer-events:none;
  padding:0;border-width:0;overflow:hidden;width:0;min-width:0;
}
nav.side{
  transition:opacity .3s var(--e-out),transform .38s var(--e-out);
  overflow-x:hidden;
}
#navhide .ic{display:inline-block;transition:transform .35s var(--e-spring);font-size:.95em;line-height:1}
#navhide[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
#navhide[aria-pressed="true"] .ic{transform:rotate(90deg)}
@media(max-width:960px){#navhide{display:none}}

/* ═══════════════════════════════════════════════════════════════
   LECTURA EN VOZ ALTA (TTS) del texto legal
   ═══════════════════════════════════════════════════════════════ */
.tts-bar{
  display:flex;align-items:center;gap:.45rem;flex-wrap:wrap;
  margin:.15rem 0 .7rem;
}
.tts-bar button{
  font-size:var(--t-xs);font-weight:700;padding:.3rem .62rem;
  border-radius:var(--r-full);border:1px solid var(--legal);
  background:transparent;color:var(--legal);
  display:inline-flex;align-items:center;gap:.35rem;line-height:1.2;
}
.tts-bar button:hover{background:var(--legal);color:var(--surface);border-color:var(--legal)}
.tts-bar button[hidden]{display:none}
.tts-bar .tts-play.on{background:var(--legal);color:var(--surface)}

/* Ondas de audio mientras lee */
.tts-wave{display:inline-flex;align-items:flex-end;gap:2px;height:11px}
.tts-wave i{
  width:2.5px;background:currentColor;border-radius:2px;height:35%;
  animation:ttsW .9s ease-in-out infinite;
}
.tts-wave i:nth-child(2){animation-delay:.15s}
.tts-wave i:nth-child(3){animation-delay:.3s}
.tts-wave i:nth-child(4){animation-delay:.45s}
@keyframes ttsW{0%,100%{height:32%}50%{height:100%}}

.tts-time{
  font-family:var(--f-mono);font-size:.7rem;font-weight:700;
  color:var(--ink-3);font-variant-numeric:tabular-nums;
}

/* Frase que se está leyendo */
.tts-s{transition:background .25s,color .25s;border-radius:3px}
.tts-s.now{
  background:linear-gradient(180deg,transparent 8%,color-mix(in srgb,var(--legal) 26%,transparent) 8%);
  box-shadow:0 0 0 2px color-mix(in srgb,var(--legal) 16%,transparent);
}
html[data-theme="dark"] .tts-s.now{
  background:linear-gradient(180deg,transparent 8%,color-mix(in srgb,var(--legal) 34%,transparent) 8%);
}
.legal.tts-on{box-shadow:0 0 0 3px color-mix(in srgb,var(--legal) 20%,transparent)}

/* ═══ Reproductor flotante ═══ */
.tts-mini{
  position:fixed;left:50%;bottom:1.1rem;transform:translateX(-50%) translateY(140%);
  z-index:80;display:flex;align-items:center;gap:.6rem;
  background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  border:1px solid var(--line);border-radius:var(--r-full);
  padding:.5rem .7rem .5rem .95rem;box-shadow:var(--sh-3);
  transition:transform .45s var(--e-spring),opacity .3s;opacity:0;pointer-events:none;
  max-width:min(94vw,540px);
}
.tts-mini.show{transform:translateX(-50%) translateY(0);opacity:1;pointer-events:auto}
.tts-mini .lbl{
  font-size:var(--t-xs);font-weight:800;color:var(--legal);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:16ch;
}
.tts-mini button{
  border-radius:50%;width:32px;height:32px;padding:0;display:grid;place-items:center;
  font-size:.8rem;border:1px solid var(--line);flex:none;
}
.tts-mini button.main{
  width:38px;height:38px;font-size:.95rem;
  background:linear-gradient(140deg,var(--legal),var(--brand));color:#fff;border-color:transparent;
}
.tts-mini .bar{
  flex:1;min-width:70px;height:5px;border-radius:99px;background:var(--surface-3);overflow:hidden;
}
.tts-mini .bar i{display:block;height:100%;width:0;background:var(--legal);
  border-radius:99px;transition:width .35s var(--e-out)}

/* ═══ Panel de ajustes de voz ═══ */
.tts-back{
  position:fixed;inset:0;z-index:90;background:rgba(10,10,18,.45);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  display:grid;place-items:center;padding:1rem;
  opacity:0;pointer-events:none;transition:opacity .3s var(--e-out);
}
.tts-back.show{opacity:1;pointer-events:auto}
.tts-panel{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--sh-3);width:min(94vw,470px);max-height:88vh;overflow:auto;
  padding:1.3rem 1.4rem;transform:translateY(16px) scale(.97);
  transition:transform .38s var(--e-spring);
}
.tts-back.show .tts-panel{transform:none}
.tts-panel h3{
  font-size:1.12rem;font-weight:800;margin:0 0 .25rem;
  display:flex;align-items:center;gap:.5rem;
}
.tts-panel .sub{font-size:var(--t-sm);color:var(--ink-2);margin:0 0 1.1rem}
.tts-row{margin-bottom:1.05rem}
.tts-row > label{
  display:block;font-size:var(--t-xs);font-weight:800;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-2);margin-bottom:.4rem;
}
.tts-seg{display:flex;gap:3px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:3px}
.tts-seg button{
  flex:1;border:0;background:transparent;border-radius:calc(var(--r-sm) - 3px);
  padding:.42rem .3rem;font-size:var(--t-sm);font-weight:700;box-shadow:none;
}
.tts-seg button:hover{transform:none;background:var(--surface)}
.tts-seg button[aria-pressed="true"]{
  background:linear-gradient(140deg,var(--legal),var(--brand));color:#fff;
}
.tts-panel select{
  width:100%;padding:.5rem .6rem;border-radius:var(--r-sm);
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  font-size:var(--t-sm);font-weight:600;cursor:pointer;
}
.tts-panel select:focus{border-color:var(--brand);outline:none}
.tts-slider{display:flex;align-items:center;gap:.75rem}
.tts-slider input[type=range]{flex:1;accent-color:var(--legal);cursor:pointer;height:22px}
.tts-val{
  font-family:var(--f-mono);font-weight:800;font-size:var(--t-sm);
  min-width:3.4em;text-align:right;color:var(--legal);font-variant-numeric:tabular-nums;
}
.tts-note{
  font-size:var(--t-xs);color:var(--ink-2);line-height:1.5;
  background:var(--surface-2);border-radius:var(--r-sm);padding:.6rem .75rem;margin:0 0 1rem;
}
.tts-note b{color:var(--ink)}
.tts-acts{display:flex;gap:.5rem;justify-content:flex-end;flex-wrap:wrap}
.tts-acts .prim{
  background:linear-gradient(140deg,var(--legal),var(--brand));color:#fff;border-color:transparent;
}
.tts-badge{
  font-size:.62rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
  padding:.1rem .35rem;border-radius:4px;background:var(--ej-bg);color:var(--ej);margin-left:.35rem;
}


/* — Variante compacta para los apartados desplegables — */
.tts-bar.mini{margin:0 0 .6rem}
.tts-bar.mini button{
  font-size:.7rem;padding:.24rem .55rem;
  border-color:var(--brand);color:var(--brand);
}
.tts-bar.mini button:hover{background:var(--brand);color:var(--surface)}
.tts-bar.mini .tts-play.on{background:var(--brand);color:var(--surface)}
.tts-bar.mini .tts-time{font-size:.66rem}
.idea .tts-bar.mini{margin:.55rem 0 0}
.legal.tts-on,.body.tts-on,.idea.tts-on{
  box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 20%,transparent)
}
.legal.tts-on{box-shadow:0 0 0 3px color-mix(in srgb,var(--legal) 20%,transparent)}


/* aviso de cambio de voz */
.tts-aviso{
  position:fixed;left:50%;bottom:5.2rem;transform:translateX(-50%) translateY(20px);
  z-index:95;max-width:min(92vw,460px);
  background:var(--warn-bg);border:1px solid var(--warn);color:var(--warn);
  border-radius:var(--r-md);padding:.6rem .9rem;font-size:var(--t-sm);font-weight:700;
  box-shadow:var(--sh-2);opacity:0;pointer-events:none;
  transition:opacity .3s var(--e-out),transform .35s var(--e-spring);
}
.tts-aviso.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:620px){
  .tts-mini{left:.6rem;right:.6rem;transform:translateY(140%);max-width:none}
  .tts-mini.show{transform:translateY(0)}
  .tts-mini .lbl{display:none}
}
@media(prefers-reduced-motion:reduce){
  .tts-wave i{animation:none;height:60%}
}
@media print{.tts-bar,.tts-mini,.tts-back{display:none !important}}

<script>
const GLOSARIO={"pliego": "Pliego: documento que fija las condiciones del contrato. El de cláusulas administrativas particulares (PCAP) contiene las reglas jurídicas y económicas; el de prescripciones técnicas (PPT), lo que hay que entregar. Ej.: el PCAP dice cómo se puntúa; el PPT, cuántos GB de RAM debe tener el ordenador.", "perfil": "Perfil de contratante: espacio en la Plataforma de Contratación del Sector Público donde cada órgano publica su actividad contractual. Ej.: allí se publican la resolución de inicio, los pliegos, las adjudicaciones y los contratos menores.", "garantia": "Garantía definitiva: fianza que constituye el adjudicatario para responder del cumplimiento, del 5 % del precio final ofertado sin IVA. Ej.: 19.300 € en una obra adjudicada en 386.000 €.", "menor": "Contrato menor: el de valor estimado inferior a 40.000 € en obras o a 15.000 € en suministros y servicios, tramitado con informe, aprobación del gasto y factura. Ej.: la reparación de un tejado por 33.432,23 € sin IVA.", "solvencia": "Solvencia: capacidad económica, financiera, técnica o profesional que se exige al licitador para poder contratar. Ej.: haber ejecutado en los tres últimos años servicios análogos por importe igual o superior al anual del contrato.", "clasificacion": "Clasificación: certificación administrativa que acredita de forma automática la solvencia de una empresa en determinados grupos y categorías. Ej.: clasificación en el grupo G, subgrupo 4, categoría 3, para viales.", "retro": "Retroacción de actuaciones: volver el procedimiento al momento anterior a aquel en que se produjo el vicio, conservando lo demás. Ej.: retroceder al momento de aprobación del pliego para corregir una exigencia improcedente.", "garprov": "Garantía provisional: fianza excepcional que responde del mantenimiento de las ofertas hasta la perfección del contrato. Máximo el 3 % del presupuesto base de licitación sin IVA. Ej.: 11.900,83 € en un contrato de 396.694,21 € sin IVA.", "aval": "Aval: garantía prestada por un banco, caja, cooperativa de crédito, establecimiento financiero de crédito o sociedad de garantía recíproca autorizado para operar en España. Ej.: aval de 19.300 € en una obra adjudicada en 386.000 €.", "caucion": "Seguro de caución: contrato con una entidad aseguradora autorizada por el que esta responde del cumplimiento del contratista. Su certificado se deposita como el aval.", "urgente": "Tramitación urgente: la del art. 119, para necesidades inaplazables o razones de interés público. Mantiene el procedimiento y reduce los plazos a la mitad, salvo el de espera del art. 153.3.", "emergencia": "Tramitación de emergencia: la del art. 120, para catástrofes, grave peligro o defensa nacional. Permite contratar sin expediente e incluso sin crédito. No cabe recurso especial.", "pgeneral": "Pliego general: modelo de cláusulas administrativas o de prescripciones técnicas aprobado para muchos contratos. Los administrativos, por el Consejo de Ministros previo dictamen del Consejo de Estado (art. 121); los técnicos, previo informe de la Junta Consultiva (art. 123).", "ppt": "Pliego de prescripciones técnicas particulares: el que define la prestación, sus calidades y sus condiciones sociales y ambientales. Lo aprueba el órgano de contratación antes de licitar y solo se corrige por error material (art. 124)."};
const ARTS=[{"n": 106, "t": "Exigencia y régimen de la garantía provisional", "ubic": "Libro I ▸ Título IV ▸ Capítulo I ▸ Sección 3.ª · Garantías exigibles", "idea": "Por regla general no se exige; si se exige, máximo el 3 % del presupuesto base sin IVA.", "literal": "<p><b>1.</b> En el procedimiento de contratación no procederá la exigencia de garantía provisional, salvo cuando de forma excepcional el órgano de contratación, por motivos de interés público, lo considere necesario y lo justifique motivadamente en el expediente. En este último caso, se podrá exigir a los licitadores la constitución previa de una garantía que responda del mantenimiento de sus ofertas hasta la perfección del contrato.</p><p><b>2.</b> En los casos en que el órgano de contratación haya acordado la exigencia de garantía provisional, en los pliegos de cláusulas administrativas particulares se determinará el importe de la misma, que no podrá ser superior a un 3 por 100 del presupuesto base de licitación del contrato, excluido el Impuesto sobre el Valor Añadido y el régimen de su devolución. La garantía provisional podrá prestarse en alguna o algunas de las formas previstas en el apartado 1 del artículo 108. En el caso de división en lotes, la garantía provisional se fijará atendiendo exclusivamente al importe de los lotes para los que el licitador vaya a presentar oferta y no en función del importe del presupuesto total del contrato. En los acuerdos marco y en los sistemas dinámicos de adquisición, el importe de la garantía provisional, de exigirse, se fijará a tanto alzado por la Administración Pública, sin que en ningún caso pueda superar el 3 por 100 del valor estimado del contrato.</p><p><b>3.</b> Cuando se exijan garantías provisionales, estas se depositarán, en las condiciones que las normas de desarrollo de esta Ley establezcan, del modo siguiente:</p><p style=\"margin-left:1.1rem\">a) En la Caja General de Depósitos o en sus sucursales encuadradas en las Delegaciones de Economía y Hacienda, o en la Caja o establecimiento público equivalente de las Comunidades Autónomas o Entidades locales contratantes ante las que deban surtir efecto cuando se trate de garantías en efectivo.</p><p style=\"margin-left:1.1rem\">b) Ante el órgano de contratación, cuando se trate de certificados de inmovilización de valores anotados, de avales o de certificados de seguro de caución.</p><p><b>4.</b> La garantía provisional se extinguirá automáticamente y será devuelta a los licitadores inmediatamente después de la perfección del contrato. En todo caso, la garantía provisional se devolverá al licitador seleccionado como adjudicatario cuando haya constituido la garantía definitiva, pudiendo aplicar el importe de la garantía provisional a la definitiva o proceder a una nueva constitución de esta última.</p>", "dis": "<ul>\n<li><b>Regla (106.1):</b> «<b>no procederá la exigencia de <span class=\"t\" data-k=\"garprov\">garantía provisional</span></b>», salvo que de forma <b>excepcional</b> el órgano de contratación, <b>por motivos de interés público</b>, lo considere necesario y lo <b>justifique motivadamente en el expediente</b>.</li>\n<li><b>Para qué sirve:</b> responde del <b>mantenimiento de las ofertas hasta la perfección del contrato</b>.</li>\n<li><b>Cuantía (106.2):</b> el <span class=\"t\" data-k=\"pliego\">PCAP</span> determina el importe, que <b>no podrá ser superior al 3 por 100 del presupuesto base de licitación, excluido el IVA</b>, y el régimen de su devolución.\n <ul><li>en caso de <b>lotes</b>, se fija atendiendo <b>exclusivamente al importe de los lotes a los que se oferta</b>, no al total del contrato;</li>\n <li>en <b>acuerdos marco</b> y <b>sistemas dinámicos</b>, a tanto alzado, sin superar el <b>3 % del valor estimado</b>.</li></ul></li>\n<li><b>Formas:</b> las mismas del art. 108.1.</li>\n<li><b>Depósito (106.3):</b> en la <b>Caja General de Depósitos</b> o cajas equivalentes de comunidades autónomas y entidades locales, si es en efectivo; <b>ante el órgano de contratación</b>, si son certificados de inmovilización de valores, avales o certificados de seguro de caución.</li>\n<li><b>Devolución (106.4):</b> se extingue <b>automáticamente</b> y se devuelve <b>inmediatamente después de la perfección del contrato</b>. Al adjudicatario, cuando haya constituido la definitiva, pudiendo <b>aplicar</b> el importe de la provisional a la definitiva.</li>\n</ul>", "llano": "<p>La garantía provisional es la fianza que se deja <b>para presentarse</b>, y la ley la ha convertido en excepcional: lo normal es que no se pida. Si se pide, hay que explicar por qué en el expediente, y como mucho puede ser el 3 % del presupuesto base sin IVA.</p>\n<p>Sirve para una cosa concreta: que nadie presente una oferta y luego se eche atrás antes de firmar. Por eso se devuelve en cuanto el contrato se perfecciona.</p>", "porque": "<p>Porque la garantía provisional encarece la participación: obliga a inmovilizar dinero o a pagar un aval solo por presentarse, y eso expulsa a la empresa pequeña. Las directivas europeas empujaron a eliminarla y la Ley 9/2017 la convirtió en <b>excepción motivada</b>.</p>\n<p>Y la regla de los lotes tiene la misma lógica: si una empresa solo oferta a un lote de 20.000 € en un contrato de 200.000 €, sería absurdo exigirle una garantía calculada sobre el total.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> la señal que dejas al reservar un piso: te la devuelven al firmar el contrato, o se descuenta de la entrada.</li>\n<li><b>Real:</b> en un contrato de suministro con presupuesto base de 480.000 € IVA incluido —396.694,21 € sin IVA— y motivos de interés público justificados, la garantía provisional máxima sería <b>11.900,83 €</b> (3 %). Se devuelve a todos en cuanto el contrato se formaliza, y al adjudicatario se le puede <b>aplicar a la garantía definitiva</b>.</li>\n<li><b>Caso límite:</b> el mismo contrato dividido en cuatro lotes de 99.173,55 € cada uno. Una empresa oferta solo al lote 2: su garantía provisional se calcula sobre <b>99.173,55 €</b>, no sobre el total. Máximo <b>2.975,21 €</b>.</li>\n</ul>", "noej": "<ul>\n<li><b>No es la garantía definitiva:</b> la provisional responde del <b>mantenimiento de la oferta</b>; la definitiva, del <b>cumplimiento del contrato</b>.</li>\n<li><b>No se calcula sobre el precio ofertado</b> —eso es la definitiva del art. 107—, sino sobre el <b>presupuesto base de licitación</b> sin IVA.</li>\n<li><b>No es la regla general</b> exigirla: es la excepción, y hay que motivarla en el expediente.</li>\n<li><b>No se devuelve al adjudicatario</b> hasta que constituya la definitiva.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 107:</b> garantía definitiva, del 5 % del precio ofertado sin IVA.</li>\n<li><b>Art. 108.1:</b> formas de constitución, comunes a ambas.</li>\n<li><b>Art. 36.1:</b> perfección del contrato, momento en que se extingue.</li>\n<li><b>Art. 100:</b> presupuesto base de licitación, base del cálculo.</li>\n<li><b>Art. 99.4:</b> lotes.</li>\n</ul>", "trampas": "<ul>\n<li><b>3 %</b> del <b>presupuesto base</b> sin IVA (provisional) frente a <b>5 %</b> del <b>precio ofertado</b> sin IVA (definitiva). Las dos cifras y las dos bases se cruzan en los exámenes.</li>\n<li>En <b>lotes</b>, solo sobre los lotes ofertados.</li>\n<li>Se devuelve tras la <b>perfección</b>, no tras la adjudicación.</li>\n</ul>", "ancla": "<p><b>«Tres por ciento para presentarse, cinco por ciento para cumplir.»</b></p>\n<p>Y la base: <b>provisional → presupuesto base</b> · <b>definitiva → precio ofertado</b>. Provisional mira al principio, definitiva mira al final.</p>", "vis": "<svg viewBox=\"0 0 960 298\" role=\"img\" aria-label=\"Régimen excepcional, cuantía y devolución de la garantía provisional\" style=\"width:100%;height:auto\"><defs><marker id=\"fl1\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr1\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe1\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw1\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"250\" y=\"8\" width=\"460\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"27.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">GARANTÍA PROVISIONAL · ART. 106</text><rect x=\"20\" y=\"52\" width=\"219.5\" height=\"236\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"129.75\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--exc)\">LA REGLA</text><text x=\"129.75\" y=\"91\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">NO PROCEDE su exigencia</text><text x=\"129.75\" y=\"106\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"129.75\" y=\"121\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Salvo que, de forma</text><text x=\"129.75\" y=\"136\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">EXCEPCIONAL, el órgano de</text><text x=\"129.75\" y=\"151\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">contratación lo considere</text><text x=\"129.75\" y=\"166\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">necesario por MOTIVOS DE</text><text x=\"129.75\" y=\"181\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">INTERÉS PÚBLICO y lo</text><text x=\"129.75\" y=\"196\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">justifique motivadamente</text><text x=\"129.75\" y=\"211\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">en el expediente</text><text x=\"129.75\" y=\"226\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"129.75\" y=\"241\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 106.1</text><rect x=\"253.5\" y=\"52\" width=\"219.5\" height=\"236\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"363.25\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--acc)\">PARA QUÉ SIRVE</text><text x=\"363.25\" y=\"91\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Responde del MANTENIMIENTO</text><text x=\"363.25\" y=\"106\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">DE LAS OFERTAS hasta la</text><text x=\"363.25\" y=\"121\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">PERFECCIÓN del contrato</text><text x=\"363.25\" y=\"136\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"363.25\" y=\"151\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 106.1</text><rect x=\"487\" y=\"52\" width=\"219.5\" height=\"236\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"596.75\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--warn)\">CUÁNTO</text><text x=\"596.75\" y=\"91\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Máximo 3 POR 100 del</text><text x=\"596.75\" y=\"106\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">PRESUPUESTO BASE DE</text><text x=\"596.75\" y=\"121\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">LICITACIÓN, excluido el IVA</text><text x=\"596.75\" y=\"136\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"596.75\" y=\"151\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Por LOTES: solo sobre los</text><text x=\"596.75\" y=\"166\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">lotes a los que se oferta</text><text x=\"596.75\" y=\"181\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"596.75\" y=\"196\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Acuerdo marco y sistema</text><text x=\"596.75\" y=\"211\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">dinámico: a tanto alzado,</text><text x=\"596.75\" y=\"226\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">máximo 3 % del VALOR</text><text x=\"596.75\" y=\"241\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">ESTIMADO</text><text x=\"596.75\" y=\"256\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"596.75\" y=\"271\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 106.2</text><rect x=\"720.5\" y=\"52\" width=\"219.5\" height=\"236\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"830.25\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--ej)\">CUÁNDO SE DEVUELVE</text><text x=\"830.25\" y=\"91\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Se extingue AUTOMÁTICAMENTE</text><text x=\"830.25\" y=\"106\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">y se devuelve inmediatamente</text><text x=\"830.25\" y=\"121\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">después de la PERFECCIÓN</text><text x=\"830.25\" y=\"136\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">del contrato</text><text x=\"830.25\" y=\"151\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"830.25\" y=\"166\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Al adjudicatario, cuando</text><text x=\"830.25\" y=\"181\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">haya constituido la</text><text x=\"830.25\" y=\"196\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">definitiva; puede aplicarse</text><text x=\"830.25\" y=\"211\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">su importe a esta</text><text x=\"830.25\" y=\"226\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"830.25\" y=\"241\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 106.4</text></svg>"}, {"n": 107, "t": "Exigencia de la garantía definitiva", "ubic": "Libro I ▸ Título IV ▸ Capítulo I ▸ Sección 3.ª · Garantías exigibles", "idea": "El 5 % del precio final ofertado sin IVA, ampliable al 10 % en casos especiales.", "literal": "<p><b>1.</b> A salvo de lo dispuesto en los apartados 4 y 5, los licitadores que, en las licitaciones de los contratos que celebren las Administraciones Públicas, presenten las mejores ofertas de conformidad con lo dispuesto en el artículo 145, deberán constituir a disposición del órgano de contratación una garantía de un 5 por 100 del precio final ofertado por aquellos, excluido el Impuesto sobre el Valor Añadido. En el caso de los contratos con precios provisionales a que se refiere el apartado 7 del artículo 102, el porcentaje se calculará con referencia al precio máximo fijado, excluido el Impuesto sobre el Valor Añadido. No obstante, atendidas las circunstancias concurrentes en el contrato, el órgano de contratación podrá eximir al adjudicatario de la obligación de constituir garantía definitiva, justificándolo adecuadamente en el pliego de cláusulas administrativas particulares, especialmente en el caso de suministros de bienes consumibles cuya entrega y recepción deba efectuarse antes del pago del precio, contratos que tengan por objeto la prestación de servicios sociales o la inclusión social o laboral de personas pertenecientes a colectivos en riesgo de exclusión social, así como en los contratos privados de la Administración a los que se refieren los puntos 1.º y 2.º de la letra a) del apartado 1 del artículo 25 de la presente Ley. Esta exención no será posible en el caso de contratos de obras, ni de concesión de obras.</p><p><b>2.</b> En casos especiales, el órgano de contratación podrá establecer en el pliego de cláusulas administrativas particulares que, además de la garantía a que se refiere el apartado anterior, se preste una complementaria de hasta un 5 por 100 del precio final ofertado por el licitador que presentó la mejor oferta de conformidad con lo dispuesto en el artículo 145, excluido el Impuesto sobre el Valor Añadido, pudiendo alcanzar la garantía total un 10 por 100 del citado precio. A estos efectos se considerará que constituyen casos especiales aquellos contratos en los que, debido al riesgo que en virtud de ellos asume el órgano de contratación, por su especial naturaleza, régimen de pagos o condiciones del cumplimiento del contrato, resulte aconsejable incrementar el porcentaje de la garantía definitiva ordinaria a que se refiere el apartado anterior, lo que deberá acordarse mediante resolución motivada. En particular, se podrá prever la presentación de esta garantía complementaria para los casos en que la oferta del adjudicatario resultara inicialmente incursa en presunción de anormalidad.</p><p><b>3.</b> Cuando el precio del contrato se formule en función de precios unitarios, el importe de la garantía a constituir se fijará atendiendo al presupuesto base de licitación, IVA excluido.</p><p><b>4.</b> En la concesión de obras y en la concesión de servicios el importe de la garantía definitiva se fijará en cada caso por el órgano de contratación en el pliego de cláusulas administrativas particulares, en función de la naturaleza, importancia y duración de la concesión de que se trate.</p><p><b>5.</b> Los pliegos que rijan los acuerdos marco y los sistemas dinámicos de adquisición establecerán si la garantía definitiva se fija estimativamente por la Administración o se fija para cada contrato basado en relación con su importe de adjudicación. Si se optara por la constitución de una garantía definitiva general del acuerdo marco o del sistema dinámico de adquisición fijada estimativamente por la Administración, cuando la suma de los importes, IVA excluido, de los contratos basados en los acuerdos marco o sistemas dinámicos de adquisición exceda del doble de la cantidad resultante de capitalizar al 5 por 100 el importe de la garantía definitiva, esta deberá ser incrementada en una cuantía equivalente. La garantía definitiva a que se refieren los párrafos anteriores responderá respecto de los incumplimientos tanto del acuerdo marco y de los sistemas dinámicos de adquisición, como del contrato basado o específico de que se trate.</p>", "dis": "<ul>\n<li><b>Regla de la <span class=\"t\" data-k=\"garantia\">garantía definitiva</span> (107.1):</b> en los contratos de las <b>Administraciones Públicas</b>, quien presente la mejor oferta conforme al art. 145 debe constituir garantía del <b>5 por 100 del precio final ofertado, excluido el IVA</b>.</li>\n<li><b>Precios provisionales:</b> el porcentaje se calcula sobre el <b>precio máximo</b> fijado, sin IVA.</li>\n<li><b>Exención potestativa:</b> el órgano puede eximir de la garantía justificándolo en el <b>PCAP</b>, especialmente en suministros de bienes consumibles entregados antes del pago, en <b>servicios sociales o de inclusión social o laboral</b> de colectivos en riesgo de exclusión, y en los contratos privados del art. 25.1.a).1.º y 2.º. <b>Nunca</b> en contratos de <b>obras</b> ni de <b>concesión de obras</b>.</li>\n<li><b>Garantía complementaria (107.2):</b> en <b>casos especiales</b>, hasta un <b>5 % adicional</b>, de modo que el total puede alcanzar el <b>10 %</b>. Requiere <b>resolución motivada</b>. Se prevé en particular para ofertas inicialmente incursas en <b>presunción de anormalidad</b>.</li>\n</ul>", "llano": "<p>Quien gana el contrato deja una fianza. Es el 5 % de lo que ha ofertado, sin contar el IVA. Si el contrato es arriesgado —por ejemplo, porque la oferta era sospechosamente barata—, se le puede pedir otro 5 %: hasta el 10 % en total.</p>\n<p>Se puede perdonar la fianza en algunos casos y justificándolo en el pliego, pero <b>nunca en obras</b>.</p>", "porque": "<p>La garantía definitiva responde de que el contrato se cumpla: penalidades, daños, vicios ocultos. Sin ella, el incumplimiento saldría gratis y la Administración tendría que reclamar en un pleito largo.</p>\n<p>El porcentaje se calcula sobre el <b>precio ofertado</b> y no sobre el presupuesto base precisamente para que la garantía sea proporcional al riesgo real: quien ofrece más barato garantiza menos en términos absolutos, y por eso el 107.2 permite la complementaria cuando la baja es anormal.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> la fianza de un mes que dejas al alquilar un piso. Si dejas el piso bien, te la devuelven.</li>\n<li><b>Real:</b> obra adjudicada en <b>386.000 € más IVA</b> (presupuesto base 480.000 € IVA incluido). Garantía definitiva = 5 % de 386.000 = <b>19.300 €</b>. Como la oferta estaba incursa en presunción de anormalidad, el órgano acuerda por resolución motivada una complementaria del 5 %: <b>otros 19.300 €</b>, total 38.600 € (10 %).</li>\n<li><b>Caso límite:</b> un contrato de servicios de inserción laboral por 60.000 €. El órgano <b>puede</b> eximir de garantía si lo justifica en el PCAP (107.1). Si fuera una obra de 60.000 €, no podría.</li>\n</ul>", "noej": "<ul>\n<li><b>No se calcula sobre el presupuesto base</b> ni sobre el valor estimado: sobre el <b>precio final ofertado</b>.</li>\n<li><b>No incluye el IVA</b> en la base de cálculo.</li>\n<li><b>No cabe exención</b> en obras ni en concesión de obras, aunque se justifique.</li>\n<li><b>No es la garantía provisional</b>: esa es excepcional y está en el art. 106.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 145:</b> determinación de la mejor oferta, a la que se refiere el 107.1.</li>\n<li><b>Art. 106:</b> garantía provisional, potestativa y motivada.</li>\n<li><b>Art. 149:</b> ofertas anormalmente bajas, supuesto típico de garantía complementaria.</li>\n<li><b>Art. 150.2:</b> requerimiento al licitador para constituir la garantía en <b>diez días hábiles</b>.</li>\n<li><b>Art. 111:</b> devolución y cancelación de las garantías.</li>\n</ul>", "trampas": "<ul>\n<li><b>5 % ordinaria · 5 % complementaria · 10 % máximo.</b> Si una opción dice «hasta el 10 % de garantía complementaria», es falsa: la complementaria es hasta el 5 %.</li>\n<li>Base de cálculo: <b>precio ofertado sin IVA</b>. Es la trampa más repetida.</li>\n<li>La exención se justifica en el <b>PCAP</b>, no en la resolución de adjudicación.</li>\n</ul>", "ancla": "<p><b>«5 siempre, 5 más si hay riesgo, 10 como techo, nunca cero en obras.»</b></p>", "vis": "<svg viewBox=\"0 0 960 462\" role=\"img\" aria-label=\"Cuantía, base de cálculo y exenciones de la garantía definitiva\" style=\"width:100%;height:auto\"><defs><marker id=\"fl2\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr2\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe2\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw2\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"250\" y=\"8\" width=\"460\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"27.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">LA GARANTÍA DEFINITIVA · ART. 107</text><rect x=\"20\" y=\"52\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"30\" y=\"66\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"120\" y=\"83\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--acc)\">5 % ORDINARIA</text><text x=\"224\" y=\"74\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Del PRECIO FINAL OFERTADO, excluido el IVA, por quien presenta</text><text x=\"224\" y=\"88\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">la mejor oferta conforme al art. 145.</text><text x=\"930\" y=\"74\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">107.1</text><path d=\"M480 107 L 480 115\" stroke=\"var(--acc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl2)\"/><rect x=\"20\" y=\"116\" width=\"920\" height=\"40\" rx=\"10\" fill=\"var(--panel)\" stroke=\"var(--line)\"/><rect x=\"30\" y=\"123\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--line)\"/><text x=\"120\" y=\"140\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"currentColor\">PRECIOS PROVISIONALES</text><text x=\"224\" y=\"138\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">El porcentaje se calcula sobre el PRECIO MÁXIMO fijado, sin IVA.</text><text x=\"930\" y=\"138\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">107.1</text><path d=\"M480 157 L 480 165\" stroke=\"var(--line)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl2)\"/><rect x=\"20\" y=\"166\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--panel)\" stroke=\"var(--line)\"/><rect x=\"30\" y=\"180\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--line)\"/><text x=\"120\" y=\"197\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"currentColor\">PRECIOS UNITARIOS</text><text x=\"224\" y=\"188\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">El importe se fija atendiendo al PRESUPUESTO BASE DE LICITACIÓN,</text><text x=\"224\" y=\"202\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">IVA excluido.</text><text x=\"930\" y=\"188\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">107.3</text><path d=\"M480 221 L 480 229\" stroke=\"var(--line)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl2)\"/><rect x=\"20\" y=\"230\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"30\" y=\"244\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"120\" y=\"261\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--warn)\">+5 % COMPLEMENTARIA</text><text x=\"224\" y=\"252\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">En casos especiales, por resolución motivada y previsión en el PCAP.</text><text x=\"224\" y=\"266\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">En particular, si la oferta estaba incursa en presunción de anormalidad.</text><text x=\"930\" y=\"252\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">107.2</text><path d=\"M480 285 L 480 293\" stroke=\"var(--warn)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl2)\"/><rect x=\"20\" y=\"294\" width=\"920\" height=\"40\" rx=\"10\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"30\" y=\"301\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"120\" y=\"318\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--warn)\">10 % MÁXIMO</text><text x=\"224\" y=\"316\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Suma de la ordinaria y la complementaria.</text><text x=\"930\" y=\"316\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">107.2</text><path d=\"M480 335 L 480 343\" stroke=\"var(--warn)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl2)\"/><rect x=\"20\" y=\"344\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><rect x=\"30\" y=\"358\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--ej)\"/><text x=\"120\" y=\"375\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--ej)\">EXENCIÓN POSIBLE</text><text x=\"224\" y=\"366\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Justificándolo en el PCAP: bienes consumibles entregados antes del pago,</text><text x=\"224\" y=\"380\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">servicios sociales o de inclusión, contratos privados del art. 25.1.a).1.º y 2.º</text><text x=\"930\" y=\"366\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">107.1</text><path d=\"M480 399 L 480 407\" stroke=\"var(--ej)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl2)\"/><rect x=\"20\" y=\"408\" width=\"920\" height=\"40\" rx=\"10\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><rect x=\"30\" y=\"415\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--exc)\"/><text x=\"120\" y=\"432\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--exc)\">EXENCIÓN IMPOSIBLE</text><text x=\"224\" y=\"430\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">NUNCA en contratos de OBRAS ni de CONCESIÓN DE OBRAS.</text><text x=\"930\" y=\"430\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">107.1</text></svg>"}, {"n": 108, "t": "Garantías definitivas admisibles", "ubic": "Libro I ▸ Título IV ▸ Capítulo I ▸ Sección 3.ª · Garantías exigibles", "idea": "Efectivo o Deuda Pública, aval, seguro de caución, y a veces retención en el precio.", "literal": "<p><b>1.</b> Las garantías definitivas exigidas en los contratos celebrados con las Administraciones Públicas podrán prestarse en alguna o algunas de las siguientes formas:</p><p style=\"margin-left:1.1rem\">a) En efectivo o en valores, que en todo caso serán de Deuda Pública, con sujeción, en cada caso, a las condiciones establecidas en las normas de desarrollo de esta Ley. El efectivo y los certificados de inmovilización de los valores anotados se depositarán en la Caja General de Depósitos o en sus sucursales encuadradas en las Delegaciones de Economía y Hacienda, o en las Cajas o establecimientos públicos equivalentes de las Comunidades Autónomas o Entidades locales contratantes ante las que deban surtir efectos, en la forma y con las condiciones que las normas de desarrollo de esta Ley establezcan, sin perjuicio de lo dispuesto para los contratos que se celebren en el extranjero.</p><p style=\"margin-left:1.1rem\">b) Mediante aval, prestado en la forma y condiciones que establezcan las normas de desarrollo de esta Ley, por alguno de los bancos, cajas de ahorros, cooperativas de crédito, establecimientos financieros de crédito y sociedades de garantía recíproca autorizados para operar en España, que deberá depositarse en los establecimientos señalados en la letra a) anterior.</p><p style=\"margin-left:1.1rem\">c) Mediante contrato de seguro de caución, celebrado en la forma y condiciones que las normas de desarrollo de esta Ley establezcan, con una entidad aseguradora autorizada para operar en el ramo. El certificado del seguro deberá entregarse en los establecimientos señalados en la letra a) anterior.</p><p><b>2.</b> Cuando así se prevea en los pliegos de cláusulas administrativas particulares, la garantía definitiva en los contratos de obras, suministros y servicios, así como en los de concesión de servicios cuando las tarifas las abone la administración contratante, podrá constituirse mediante retención en el precio. En el pliego de cláusulas administrativas particulares se fijará la forma y condiciones de la retención.</p><p><b>3.</b> La acreditación de la constitución de la garantía definitiva podrá hacerse mediante medios electrónicos.</p>", "dis": "<ul>\n<li><b>Las tres formas (108.1):</b>\n <ul><li><b>a) En efectivo o en valores</b>, que «<b>en todo caso serán de Deuda Pública</b>». El efectivo y los certificados de inmovilización se depositan en la <b>Caja General de Depósitos</b> o en las cajas o establecimientos públicos equivalentes de comunidades autónomas y entidades locales.</li>\n <li><b>b) Mediante <span class=\"t\" data-k=\"aval\">aval</span></b>, prestado por <b>bancos, cajas de ahorros, cooperativas de crédito, establecimientos financieros de crédito y sociedades de garantía recíproca</b> autorizados para operar en España, depositado en los establecimientos de la letra a).</li>\n <li><b>c) Mediante contrato de <span class=\"t\" data-k=\"caucion\">seguro de caución</span></b> con una entidad aseguradora autorizada para operar en el ramo; el certificado se entrega en los mismos establecimientos.</li></ul></li>\n<li><b>Retención en el precio (108.2):</b> cuando así se prevea en el <b>PCAP</b>, en contratos de <b>obras, suministros y servicios</b>, y en <b>concesiones de servicios cuando las tarifas las abone la Administración</b> contratante. El PCAP fija la forma y condiciones de la retención.</li>\n<li><b>Acreditación (108.3):</b> puede hacerse <b>por medios electrónicos</b>.</li>\n</ul>", "llano": "<p>La fianza se puede dejar de tres maneras: en dinero o en deuda pública, con un aval bancario o con un seguro de caución. Y hay una cuarta vía, si el pliego lo prevé: que la Administración retenga el importe de las primeras facturas.</p>", "porque": "<p>Porque exigir siempre efectivo inmovilizaría capital circulante de las empresas y encarecería los contratos. El <b>aval</b> y el <b>seguro de caución</b> permiten garantizar sin descapitalizarse, y la <b>retención en el precio</b> va todavía más lejos: no hay que aportar nada, la garantía se construye con el propio dinero del contrato a medida que se cobra.</p>\n<p>La exigencia de que los valores sean de <b>Deuda Pública</b> responde a la seguridad: la garantía no puede depender de la cotización de acciones.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> la fianza del alquiler, que puedes dejar en metálico o sustituir por un aval bancario.</li>\n<li><b>Real:</b> adjudicada una obra en 386.000 € más IVA, la garantía definitiva es de <b>19.300 €</b> (5 %). La empresa la constituye mediante <b>aval</b> de una sociedad de garantía recíproca, que deposita en la caja de la corporación local.</li>\n<li><b>Caso límite:</b> en un contrato de servicios de dos años el PCAP prevé la <b>retención en el precio</b>: la Administración retiene el 5 % de cada certificación mensual hasta completar la garantía. La empresa no adelanta nada.</li>\n</ul>", "noej": "<ul>\n<li><b>No valen</b> valores privados: los valores han de ser <b>en todo caso de Deuda Pública</b>.</li>\n<li><b>No cabe</b> la retención en el precio si el PCAP no la ha previsto.</li>\n<li><b>No cabe</b> la retención en cualquier concesión de servicios: solo cuando las <b>tarifas las abone la Administración</b> contratante.</li>\n<li><b>No es una forma de garantía</b> el compromiso de una empresa matriz: la ley enumera tres, y son cerradas.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 107:</b> cuantía de la garantía definitiva.</li>\n<li><b>Art. 106.2:</b> la garantía provisional puede prestarse en las mismas formas.</li>\n<li><b>Art. 110:</b> responsabilidades a que están afectas las garantías.</li>\n<li><b>Art. 111:</b> devolución y cancelación.</li>\n<li><b>Art. 150.2:</b> la garantía se constituye en el plazo de diez días hábiles del requerimiento.</li>\n</ul>", "trampas": "<ul>\n<li>Tres formas: <b>efectivo o Deuda Pública · aval · seguro de caución</b>. Y una cuarta modalidad, la <b>retención en el precio</b>, que exige previsión en el PCAP.</li>\n<li>Los valores son <b>siempre</b> de Deuda Pública.</li>\n<li>La acreditación puede ser <b>electrónica</b>.</li>\n</ul>", "ancla": "<p><b>E-A-S:</b> <b>E</b>fectivo o Deuda Pública · <b>A</b>val · <b>S</b>eguro de caución. Y la cuarta, si el pliego lo dice: <b>R</b>etención.</p>", "vis": "<svg viewBox=\"0 0 960 297\" role=\"img\" aria-label=\"Formas admisibles de constituir la garantía definitiva\" style=\"width:100%;height:auto\"><defs><marker id=\"fl3\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr3\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10

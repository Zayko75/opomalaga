y=\"226\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Misma regla de modificación:</text><text x=\"830.25\" y=\"241\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">solo error material, si no,</text><text x=\"830.25\" y=\"256\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">retroacción</text><rect x=\"20\" y=\"298\" width=\"920\" height=\"48\" rx=\"8\" fill=\"var(--panel)\" stroke=\"var(--line)\"/><text x=\"480\" y=\"318.828\" text-anchor=\"middle\" font-size=\"10.4\" fill=\"currentColor\">Regla para no confundirlos: ADMINISTRATIVO = reglas jurídicas y económicas · TÉCNICO = qué hay que entregar.</text><text x=\"480\" y=\"331.828\" text-anchor=\"middle\" font-size=\"10.4\" fill=\"currentColor\">GENERAL = lo aprueba el Consejo de Ministros para muchos contratos · PARTICULAR = lo aprueba el órgano de contratación para ESTE contrato.</text></svg>"}, {"n": 126, "t": "Reglas para el establecimiento de prescripciones técnicas", "ubic": "Libro II ▸ Título I ▸ Capítulo I ▸ Sección 2.ª · Pliegos", "idea": "Las prescripciones técnicas describen lo que se compra sin cerrar la puerta a nadie: prohibido nombrar marcas.", "literal": "<p><b>1.</b> Las prescripciones técnicas a que se refieren los artículos 123 y 124, proporcionarán a los empresarios acceso en condiciones de igualdad al procedimiento de contratación y no tendrán por efecto la creación de obstáculos injustificados a la apertura de la contratación pública a la competencia.</p><p><b>2.</b> Las prescripciones técnicas podrán referirse al proceso o método específico de producción o prestación de las obras, los suministros o los servicios requeridos, o a un proceso específico de otra fase de su ciclo de vida, según la definición establecida en el artículo 148, incluso cuando dichos factores no formen parte de la sustancia material de las obras, suministros o servicios, siempre que estén vinculados al objeto del contrato y guarden proporción con el valor y los objetivos de este.</p><p><b>3.</b> Para toda contratación que esté destinada a ser utilizada por personas físicas, ya sea el público en general o el personal de la Administración Pública contratante, las prescripciones técnicas se redactarán, salvo en casos debidamente justificados, de manera que se tengan en cuenta la Convención de las Naciones Unidas sobre los derechos de las personas con discapacidad, así como los criterios de accesibilidad universal y de diseño universal o diseño para todas las personas, tal y como son definidos estos términos en el texto refundido de la Ley General de derechos de las personas con discapacidad y de su inclusión social, aprobado mediante Real Decreto Legislativo 1/2013, de 29 de noviembre. De no ser posible definir las prescripciones técnicas teniendo en cuenta criterios de accesibilidad universal y de diseño universal o diseño para todas las personas, deberá motivarse suficientemente esta circunstancia. Sin perjuicio de lo anterior, siempre que existan requisitos de accesibilidad obligatorios adoptados por un acto jurídico de la Unión Europea, las especificaciones técnicas deberán ser definidas por referencia a esas normas en lo que respecta a los criterios de accesibilidad para las personas con discapacidad o el diseño para todos los usuarios.</p><p><b>4.</b> Siempre que el objeto del contrato afecte o pueda afectar al medio ambiente, las prescripciones técnicas se definirán aplicando criterios de sostenibilidad y protección ambiental, de acuerdo con las definiciones y principios regulados en los artículos 3 y 4, respectivamente, de la Ley 16/2002, de 1 de julio, de Prevención y Control Integrados de la Contaminación.</p><p><b>5.</b> Sin perjuicio de las instrucciones y reglamentos técnicos nacionales que sean obligatorios, siempre y cuando sean compatibles con el derecho de la Unión Europea, las prescripciones técnicas se formularán de una de las siguientes maneras:</p><p style=\"margin-left:1.1rem\">a) En términos de rendimiento o de exigencias funcionales, incluidas las características medioambientales, siempre que los parámetros sean lo suficientemente precisos para permitir a los licitadores determinar el objeto del contrato y al órgano de contratación adjudicar el mismo;</p><p style=\"margin-left:1.1rem\">b) Haciendo referencia, de acuerdo con el siguiente orden de prelación, a especificaciones técnicas contenidas en normas nacionales que incorporen normas europeas, a evaluaciones técnicas europeas, a especificaciones técnicas comunes, a normas internacionales, a otros sistemas de referencias técnicas elaborados por los organismos europeos de normalización o, en defecto de todos los anteriores, a normas nacionales, a documentos de idoneidad técnica nacionales o a especificaciones técnicas nacionales en materia de proyecto, cálculo y ejecución de obras y de uso de suministros; acompañando cada referencia de la mención «o equivalente»;</p><p style=\"margin-left:1.1rem\">c) En términos de rendimiento o de exigencias funcionales según lo mencionado en la letra a), haciendo referencia, como medio de presunción de conformidad con estos requisitos de rendimiento o exigencias funcionales, a las especificaciones contempladas en la letra b);</p><p style=\"margin-left:1.1rem\">d) Haciendo referencia a especificaciones técnicas mencionadas en la letra b) para determinadas características, y mediante referencia al rendimiento o exigencias funcionales mencionados en la letra a) para otras características.</p><p><b>6.</b> Salvo que lo justifique el objeto del contrato, las prescripciones técnicas no harán referencia a una fabricación o una procedencia determinada, o a un procedimiento concreto que caracterice a los productos o servicios ofrecidos por un empresario determinado, o a marcas, patentes o tipos, o a un origen o a una producción determinados, con la finalidad de favorecer o descartar ciertas empresas o ciertos productos. Tal referencia se autorizará, con carácter excepcional, en el caso en que no sea posible hacer una descripción lo bastante precisa e inteligible del objeto del contrato en aplicación del apartado 5, en cuyo caso irá acompañada de la mención «o equivalente».</p><p><b>7.</b> Cuando los órganos de contratación hagan uso de la opción prevista en el apartado 5, letra a), de formular prescripciones técnicas en términos de rendimiento o de exigencias funcionales, no podrán rechazar una oferta de obras, de suministros o de servicios que se ajusten a una norma nacional que transponga una norma europea, a un documento de idoneidad técnica europeo, a una especificación técnica común, a una norma internacional o a un sistema de referencias técnicas elaborado por un organismo europeo de normalización, si tales especificaciones tienen por objeto los requisitos de rendimiento o exigencias funcionales exigidos por las prescripciones técnicas, siempre que en su oferta, el licitador pruebe por cualquier medio adecuado, incluidos los medios de prueba mencionados en los artículos 127 y 128, que la obra, el suministro o el servicio conforme a la norma reúne los requisitos de rendimiento o exigencias funcionales establecidos por el órgano de contratación.</p><p><b>8.</b> Cuando los órganos de contratación hagan uso de la opción de referirse a las especificaciones técnicas previstas en el apartado 5, letra b), no podrán rechazar una oferta basándose en que las obras, los suministros o los servicios ofrecidos no se ajustan a las especificaciones técnicas a las que han hecho referencia, siempre que en su oferta el licitador demuestre por cualquier medio adecuado, incluidos los medios de prueba mencionados en el artículo 128, que las soluciones que propone cumplen de forma equivalente los requisitos exigidos en las correspondientes prescripciones técnicas.</p>", "dis": "<ul>\n<li><b>Principio (126.1):</b> proporcionarán a los empresarios <b>acceso en condiciones de igualdad</b> y <b>no tendrán por efecto la creación de obstáculos injustificados</b> a la apertura de la contratación a la competencia.</li>\n<li><b>Alcance (126.2):</b> pueden referirse al <b>proceso o método específico de producción o prestación</b>, o a otra fase del <b>ciclo de vida</b> (art. 148), aunque no formen parte de la sustancia material, siempre que estén <b>vinculadas al objeto</b> y guarden <b>proporción</b> con su valor y objetivos.</li>\n<li><b>Accesibilidad (126.3):</b> en toda contratación destinada a ser utilizada por <b>personas físicas</b>, se redactarán —salvo casos debidamente justificados— teniendo en cuenta la <b>Convención de la ONU sobre los derechos de las personas con discapacidad</b> y los criterios de <b>accesibilidad universal y diseño para todas las personas</b>. Si no es posible, hay que <b>motivarlo suficientemente</b>.</li>\n<li><b>Medio ambiente (126.4):</b> cuando el objeto afecte o pueda afectar al medio ambiente, se aplicarán criterios de <b>sostenibilidad y protección ambiental</b>.</li>\n<li><b>Formulación:</b> por referencia a <b>normas</b> —normas nacionales que transpongan normas europeas, evaluaciones técnicas europeas, especificaciones técnicas comunes, normas internacionales— o en términos de <b>rendimiento o exigencias funcionales</b>, admitiendo siempre la <b>equivalencia</b>.</li>\n<li><b>Prohibición de marcas:</b> salvo que lo justifique el objeto del contrato, no podrán mencionarse <b>fabricaciones o procedencias determinadas, patentes, marcas o tipos</b> que tengan por efecto favorecer o descartar a ciertas empresas. Excepcionalmente, cuando no sea posible una descripción bastante precisa e inteligible, se admite la mención acompañada de la expresión «<b>o equivalente</b>».</li>\n</ul>", "llano": "<p>Las prescripciones técnicas dicen qué se compra. La regla de oro es que se describan por lo que la cosa <b>tiene que hacer</b>, no por quién la fabrica. Si escribes una marca, estás eligiendo al ganador antes de empezar.</p>\n<p>Solo cuando es imposible describirlo de otro modo se admite citar una marca, y siempre añadiendo «<b>o equivalente</b>».</p>", "porque": "<p>Porque la especificación técnica es la forma más elegante de amañar un contrato: no hace falta manipular la mesa de contratación si el pliego exige una medida que solo cumple un producto. El art. 126 ataca ese fraude por dos vías: obliga a describir por <b>rendimiento o funcionalidad</b> y, cuando hay que citar una norma, exige admitir la <b>equivalencia</b>.</p>\n<p>Los apartados de accesibilidad y medio ambiente añaden un segundo objetivo: la contratación pública como <b>instrumento de política pública</b>, no solo como forma de comprar barato.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> pedir «un coche con maletero de al menos 400 litros y consumo inferior a 5 l/100 km» en vez de «un Golf». Lo primero deja competir; lo segundo, no.</li>\n<li><b>Real:</b> un ayuntamiento licita 40 ordenadores. El PPT exige «procesador con puntuación PassMark igual o superior a 15.000, 16 GB de RAM, SSD de 512 GB y consumo en reposo inferior a 8 W», más accesibilidad conforme al RD Legislativo 1/2013. No cita ninguna marca. Cualquier fabricante puede concurrir.</li>\n<li><b>Caso límite:</b> el ayuntamiento necesita repuestos compatibles con una depuradora ya instalada de una marca concreta. Aquí la mención de la marca <b>sí</b> puede estar justificada por el objeto del contrato; si no lo estuviera, habría que añadir «o equivalente».</li>\n</ul>", "noej": "<ul>\n<li><b>No es prescripción técnica</b> un criterio de adjudicación: la prescripción define el <b>mínimo obligatorio</b>; el criterio <b>puntúa</b> lo que mejora ese mínimo.</li>\n<li><b>No vale</b> citar una marca «para que se entienda» sin añadir «o equivalente».</li>\n<li><b>No es suficiente</b> alegar que la accesibilidad encarece el contrato: hay que <b>motivar suficientemente</b> la imposibilidad.</li>\n</ul>", "conex": "<ul>\n<li><b>Arts. 123 a 125:</b> normas de referencia y etiquetas.</li>\n<li><b>Art. 115.2:</b> la consulta preliminar no puede desembocar en un objeto a medida de un consultado.</li>\n<li><b>Art. 116.3:</b> el PPT se incorpora al expediente.</li>\n<li><b>Art. 145:</b> criterios de adjudicación, distintos de las prescripciones técnicas.</li>\n<li><b>Art. 148:</b> definición de ciclo de vida, a la que remite el 126.2.</li>\n</ul>", "trampas": "<ul>\n<li>Prescripción técnica = <b>requisito mínimo</b>, se cumple o no. Criterio de adjudicación = <b>puntuación</b>. Confundirlos invalida el pliego.</li>\n<li>La mención de marcas es <b>excepcional</b> y exige «<b>o equivalente</b>».</li>\n<li>La accesibilidad no es una recomendación: es obligatoria «salvo en casos debidamente justificados», y la justificación debe constar.</li>\n</ul>", "ancla": "<p><b>«Di lo que tiene que hacer, no quién lo fabrica.»</b></p>\n<p>Y si no hay más remedio que nombrar la marca, las dos palabras que salvan el pliego: «<b>o equivalente</b>».</p>", "vis": "<svg viewBox=\"0 0 960 281\" role=\"img\" aria-label=\"Reglas para el establecimiento de las prescripciones técnicas\" style=\"width:100%;height:auto\"><defs><marker id=\"fl14\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr14\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe14\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw14\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"250\" y=\"8\" width=\"460\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"27.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">PRESCRIPCIONES TÉCNICAS · ART. 126</text><rect x=\"20\" y=\"52\" width=\"172.8\" height=\"175\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"106.4\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--acc)\">PRINCIPIO</text><text x=\"106.4\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Acceso en condiciones</text><text x=\"106.4\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">de IGUALDAD</text><text x=\"106.4\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"106.4\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Sin obstáculos</text><text x=\"106.4\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">injustificados a la</text><text x=\"106.4\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">competencia</text><text x=\"106.4\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"106.4\" y=\"180\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 126.1</text><rect x=\"206.8\" y=\"52\" width=\"172.8\" height=\"175\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"293.2\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--acc)\">ALCANCE</text><text x=\"293.2\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Proceso o método de</text><text x=\"293.2\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">producción o prestación</text><text x=\"293.2\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">y otras fases del</text><text x=\"293.2\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">CICLO DE VIDA</text><text x=\"293.2\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"293.2\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Vinculadas al objeto y</text><text x=\"293.2\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">proporcionadas</text><text x=\"293.2\" y=\"180\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"293.2\" y=\"193\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 126.2</text><rect x=\"393.6\" y=\"52\" width=\"172.8\" height=\"175\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"480\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--ej)\">ACCESIBILIDAD</text><text x=\"480\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Si la usan personas</text><text x=\"480\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">físicas: accesibilidad</text><text x=\"480\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">universal y diseño</text><text x=\"480\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">para todas las personas</text><text x=\"480\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"480\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Si no es posible,</text><text x=\"480\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">MOTIVARLO</text><text x=\"480\" y=\"180\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"480\" y=\"193\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 126.3</text><rect x=\"580.4\" y=\"52\" width=\"172.8\" height=\"175\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"666.8\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--ej)\">MEDIO AMBIENTE</text><text x=\"666.8\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Si el objeto afecta o</text><text x=\"666.8\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">puede afectar al medio</text><text x=\"666.8\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">ambiente: criterios de</text><text x=\"666.8\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">sostenibilidad y</text><text x=\"666.8\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">protección ambiental</text><text x=\"666.8\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"666.8\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 126.4</text><rect x=\"767.2\" y=\"52\" width=\"172.8\" height=\"175\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"853.6\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--exc)\">PROHIBIDO</text><text x=\"853.6\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Mencionar fabricaciones,</text><text x=\"853.6\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">procedencias, patentes,</text><text x=\"853.6\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">MARCAS o tipos que</text><text x=\"853.6\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">favorezcan o descarten</text><text x=\"853.6\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">a ciertas empresas</text><text x=\"853.6\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"853.6\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Excepción: cuando no</text><text x=\"853.6\" y=\"180\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">quepa describirlo, con</text><text x=\"853.6\" y=\"193\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">«O EQUIVALENTE»</text><rect x=\"20\" y=\"237\" width=\"920\" height=\"34\" rx=\"8\" fill=\"var(--panel)\" stroke=\"var(--line)\"/><text x=\"480\" y=\"257.328\" text-anchor=\"middle\" font-size=\"10.4\" fill=\"currentColor\">Regla de oro: describe lo que la cosa TIENE QUE HACER, no quién la fabrica.</text></svg>"}];
const PLAZOS=[["40.000 €", "Umbral del contrato menor de obras (valor estimado, sin IVA)", "Órgano de contratación", "118.1", "«Inferior a». 40.000 exactos ya no es menor"], ["15.000 €", "Umbral del contrato menor de suministros y servicios", "Órgano de contratación", "118.1", "También valor estimado, sin IVA"], ["Trimestral", "Publicación de los contratos menores en el perfil", "Órgano de contratación", "118.6 y 63.4", "Objeto, duración, importe con IVA y adjudicatario"], ["5 %", "Garantía definitiva ordinaria", "Adjudicatario", "107.1", "Sobre el precio final ofertado, excluido el IVA"], ["5 % adicional", "Garantía complementaria en casos especiales", "Órgano de contratación", "107.2", "Requiere resolución motivada"], ["10 %", "Garantía total máxima", "Adjudicatario", "107.2", "Suma de la ordinaria y la complementaria"], ["3 %", "Importe máximo de la garantía provisional", "Licitador", "106.2", "Del presupuesto base de licitación, IVA excluido"], ["Excepcional", "Régimen de la garantía provisional", "Órgano de contratación", "106.1", "Solo por motivos de interés público, justificado en el expediente"], ["Perfección", "Momento de devolución de la garantía provisional", "Órgano de contratación", "106.4", "Se extingue automáticamente"], ["3 formas", "Garantías definitivas admisibles", "Adjudicatario", "108.1", "Efectivo o Deuda Pública · aval · seguro de caución"], ["Retención", "Modalidad alternativa de constitución", "Órgano de contratación", "108.2", "Solo si el PCAP la prevé"], ["5 días", "Plazo de los órganos para informar en tramitación urgente", "Órganos informantes", "119.2.a)", "Prorrogable hasta 10 días si la complejidad lo impide"], ["A la mitad", "Reducción de los plazos de licitación, adjudicación y formalización", "—", "119.2.b)", "Con seis excepciones numeradas"], ["1 mes", "Plazo máximo de inicio de la ejecución en tramitación urgente", "Contratista", "119.2.c)", "Desde la formalización"], ["30 días", "Dar cuenta al Consejo de Ministros en tramitación de emergencia", "Órgano de contratación", "120.1.b)", "Ámbito estatal"], ["1 mes", "Plazo máximo de inicio de la ejecución en emergencia", "Contratista", "120.1.c)", "Si se excede, procedimiento ordinario"], ["Consejo de Estado", "Dictamen previo a los pliegos de cláusulas administrativas generales", "Consejo de Ministros", "121.1", "U órgano consultivo autonómico equivalente en CCAA y EELL"], ["Junta Consultiva", "Informe previo a los pliegos de prescripciones técnicas generales", "Consejo de Ministros", "123", "Solo para el sector público estatal"], ["Antes de licitar", "Aprobación del pliego de prescripciones técnicas particulares", "Órgano de contratación", "124", "Solo se modifica por error material; si no, retroacción"]];
const FLASH=[["¿Qué debe justificarse cuando NO se divide el contrato en lotes?", "Los <b>motivos válidos</b> del art. 99.3 —riesgo de restringir la competencia, con informe previo de la autoridad de competencia, o dificultad técnica de la ejecución independiente—, debidamente justificados en el expediente, y así lo exige también el art. 116.4.g)."], ["¿Cuál es el importe de la garantía definitiva y sobre qué se calcula?", "El <b>5 %</b> del <b>precio final ofertado</b>, <b>excluido el IVA</b> (art. 107.1). Puede añadirse una complementaria de hasta otro 5 %, con un máximo total del 10 % (107.2)."], ["¿Qué se incorpora al expediente según el art. 116.3?", "El <b>PCAP</b> y el <b>PPT</b>, el <b>certificado de existencia de crédito</b> o documento equivalente y la <b>fiscalización previa</b> de la Intervención."], ["Enumera las siete letras del art. 116.4", "a) elección del procedimiento · b) clasificación exigida · c) criterios de solvencia y adjudicación y condiciones especiales de ejecución · d) valor estimado · e) necesidad · f) informe de insuficiencia de medios en servicios · g) no división en lotes."], ["¿Qué tres efectos produce la resolución del art. 117.1?", "Aprueba el <b>expediente</b>, dispone la <b>apertura del procedimiento de adjudicación</b> e implica la <b>aprobación del gasto</b> —salvo las dos excepciones del propio apartado—. Y se publica en el perfil de contratante."], ["¿Qué exige la tramitación de un contrato menor?", "<b>Informe</b> del órgano de contratación motivando la necesidad y que no se altera el objeto para eludir umbrales, <b>aprobación del gasto</b> e <b>incorporación de la factura</b> (art. 118.2 y 118.3)."], ["¿Cuándo puede modificarse un pliego ya aprobado?", "Solo por <b>error material, de hecho o aritmético</b>. En cualquier otro caso, la modificación conlleva la <b>retroacción de actuaciones</b> (art. 122.1)."], ["¿Puede el pliego de prescripciones técnicas mencionar una marca?", "Solo <b>excepcionalmente</b>, cuando no sea posible una descripción bastante precisa e inteligible, y siempre acompañada de la expresión «<b>o equivalente</b>» (art. 126)."], ["¿Qué publicidad exige la consulta preliminar del mercado?", "<b>Antes</b> de iniciarla: objeto, fecha de inicio y denominaciones de los terceros participantes, más las razones de la elección de los asesores. Y el <b>informe final</b> se publica con las mismas obligaciones que los pliegos (art. 115)."], ["¿Qué plazo NO se reduce en la tramitación urgente?", "El de <b>quince días hábiles</b> del art. 153.3, período de espera antes de la formalización. Los demás plazos de licitación, adjudicación y formalización se reducen <b>a la mitad</b> (art. 119.2.b)."], ["¿Cuál es el régimen y el importe máximo de la garantía provisional?", "<b>No procede</b> su exigencia, salvo excepcionalmente por motivos de interés público justificados en el expediente. Máximo el <b>3 % del presupuesto base de licitación, excluido el IVA</b>. Se devuelve tras la <b>perfección</b> del contrato (art. 106)."], ["¿En qué formas puede prestarse la garantía definitiva?", "En <b>efectivo o valores de Deuda Pública</b>, mediante <b>aval</b> o mediante <b>seguro de caución</b>. Y, si el PCAP lo prevé, mediante <b>retención en el precio</b> (art. 108)."], ["¿Qué plazo NO se reduce en la tramitación urgente?", "El de <b>quince días hábiles</b> del art. 153.3, período de espera antes de la formalización. Los demás plazos de licitación, adjudicación y formalización se reducen <b>a la mitad</b> (art. 119.2.b)."], ["¿Qué permite la tramitación de emergencia?", "Ordenar la ejecución o contratar libremente <b>sin expediente</b> y sin sujetarse a los requisitos formales de la ley, <b>incluso el de la existencia de crédito suficiente</b>. Supuestos: catástrofe, grave peligro o defensa nacional (art. 120.1)."], ["¿Quién aprueba los pliegos de cláusulas administrativas generales?", "El <b>Consejo de Ministros</b>, a iniciativa de los ministerios, a propuesta del Ministro de Hacienda y <b>previo dictamen del Consejo de Estado</b>. Las CCAA y las entidades locales, según sus normas y con dictamen del Consejo de Estado u órgano consultivo equivalente (art. 121)."], ["¿Qué informe se exige antes de los pliegos de prescripciones técnicas generales?", "El de la <b>Junta Consultiva de Contratación Pública del Estado</b>. Los establece el Consejo de Ministros y rigen solo en el <b>sector público estatal</b> (art. 123)."], ["¿Cuándo se aprueba el pliego de prescripciones técnicas particulares?", "Antes de la autorización del gasto o conjuntamente con ella, y <b>siempre antes de la licitación</b> o, si no la hay, antes de la adjudicación. Solo se modifica por <b>error material, de hecho o aritmético</b> (art. 124)."]];
const TEST=[{"a": 107, "q": "La garantía definitiva en los contratos de las Administraciones Públicas es, con carácter general:", "o": [["El 5 % del precio final ofertado, excluido el IVA", 1, "Correcto: art. 107.1. Puede añadirse una complementaria de hasta otro 5 %, con un máximo total del 10 %."], ["El 5 % del presupuesto base de licitación, IVA incluido", 0, "La base de cálculo es el precio final ofertado y sin IVA, no el presupuesto base."], ["El 3 % del valor estimado del contrato", 0, "Ni el porcentaje ni la base son correctos."], ["El 10 % del precio ofertado en todo caso", 0, "El 10 % es el techo cuando se acuerda motivadamente una garantía complementaria, no la regla general."]]}, {"a": 116, "q": "¿Cuál de estos documentos se INCORPORA al expediente conforme al art. 116.3?", "o": [["El certificado de existencia de crédito y la fiscalización previa de la Intervención", 1, "Correcto: junto con el PCAP y el PPT, son los documentos que el art. 116.3 manda incorporar."], ["La justificación de la elección del procedimiento", 0, "Eso no se «incorpora»: se «justifica», y está en el art. 116.4.a)."], ["La factura del contratista", 0, "La factura pertenece al expediente del contrato menor (art. 118.3)."], ["El informe de insuficiencia de medios", 0, "Es contenido del art. 116.4.f), y solo en contratos de servicios."]]}, {"a": 116, "q": "La justificación de la NO división en lotes se exige en el expediente por:", "o": [["La letra g) del artículo 116.4", 1, "Correcto: art. 116.4.g), en conexión con el art. 99.3."], ["La letra e) del artículo 116.4", 0, "La letra e) se refiere a la necesidad de la Administración a la que se pretende dar satisfacción."], ["El artículo 116.3", 0, "El 116.3 enumera documentos que se incorporan, no extremos que se justifican."], ["El artículo 117.1", 0, "El 117.1 regula la resolución de aprobación del expediente."]]}, {"a": 117, "q": "La resolución que aprueba el expediente de contratación:", "o": [["Implica también la aprobación del gasto, salvo las excepciones del propio artículo, y se publica en el perfil de contratante", 1, "Correcto: art. 117.1. Las excepciones son que el presupuesto no pudiera establecerse previamente o que la delegación o desconcentración dispusieran otra cosa."], ["Requiere siempre un acuerdo separado de aprobación del gasto", 0, "Justo al contrario: el art. 117.1 funde ambos actos como regla general."], ["No necesita publicarse", 0, "El art. 117.1 exige expresamente su publicación en el perfil de contratante."], ["Corresponde en todo caso al Pleno de la corporación", 0, "Corresponde al órgano de contratación, que en la entidad local puede ser el alcalde, la Junta de Gobierno o el Pleno según la cuantía y la delegación."]]}, {"a": 118, "q": "Un contrato de obras con un presupuesto de 40.453 € IVA incluido:", "o": [["Es contrato menor, porque su valor estimado es de 33.432,23 €", 1, "Correcto: 40.453 / 1,21 = 33.432,23 €, inferior a los 40.000 € del art. 118.1. El umbral se mide en valor estimado, sin IVA."], ["No es contrato menor, porque supera los 40.000 €", 0, "Los 40.000 € se miden sobre el valor estimado, que no incluye el IVA."], ["Es contrato menor solo si se divide en dos anualidades", 0, "El fraccionamiento para rebajar la cuantía está prohibido por el art. 99.2."], ["No es contrato menor, porque en obras el umbral es de 15.000 €", 0, "Los 15.000 € son el umbral de suministros y servicios; en obras son 40.000 €."]]}, {"a": 122, "q": "Un pliego de cláusulas administrativas particulares ya aprobado y publicado:", "o": [["Solo puede modificarse por error material, de hecho o aritmético; en otro caso procede la retroacción de actuaciones", 1, "Correcto: art. 122.1. Es la garantía de igualdad de trato entre licitadores."], ["Puede modificarse libremente hasta la apertura de las ofertas", 0, "Eso rompería la igualdad: quienes ya presentaron oferta habrían competido con otras reglas."], ["No puede modificarse en ningún caso", 0, "Sí cabe la corrección de errores materiales, de hecho o aritméticos."], ["Puede modificarse por acuerdo con los licitadores", 0, "El pliego no es negociable con los licitadores; es una norma del procedimiento."]]}, {"a": 126, "q": "Las prescripciones técnicas pueden mencionar una marca comercial:", "o": [["Excepcionalmente, cuando no sea posible una descripción precisa e inteligible, y acompañada de la expresión «o equivalente»", 1, "Correcto: es la salvedad final del art. 126, pensada para evitar que la especificación técnica designe al ganador."], ["Siempre que se justifique en el informe de necesidad", 0, "El informe del art. 28 no habilita a favorecer a un fabricante."], ["Nunca, en ningún supuesto", 0, "La ley admite la mención excepcional con la fórmula «o equivalente», y también cuando lo justifique el objeto del contrato."], ["Siempre que la marca sea de fabricación europea", 0, "El origen del fabricante es irrelevante e introduciría una discriminación adicional."]]}, {"a": 115, "q": "Las consultas preliminares del mercado:", "o": [["Exigen publicar en el perfil de contratante, antes de iniciarlas, su objeto, la fecha y las denominaciones de los terceros participantes", 1, "Correcto: art. 115.1. Y el informe final se publica con las mismas obligaciones que los pliegos (115.3)."], ["Impiden que las empresas consultadas se presenten después a la licitación", 0, "No lo impiden; lo que prohíbe el 115.2 es que obtengan ventaja o que el objeto se ajuste solo a una de ellas."], ["Son un trámite obligatorio del expediente de contratación", 0, "El art. 115.1 dice «podrán»: son potestativas."], ["Se documentan en un informe reservado que no forma parte del expediente", 0, "El 115.3 dice lo contrario: el informe forma parte del expediente y se publica."]]}, {"a": 106, "q": "La garantía provisional en los procedimientos de contratación:", "o": [["No procede su exigencia, salvo excepcionalmente por motivos de interés público justificados en el expediente", 1, "Correcto: art. 106.1. Y su importe no puede superar el 3 % del presupuesto base de licitación sin IVA."], ["Se exige siempre, por importe del 3 % del precio de adjudicación", 0, "Ni es obligatoria ni se calcula sobre el precio de adjudicación."], ["Se calcula sobre el valor estimado del contrato", 0, "Se calcula sobre el presupuesto base de licitación, excluido el IVA; el valor estimado solo se usa en acuerdos marco y sistemas dinámicos."], ["Se devuelve tras la adjudicación del contrato", 0, "Se extingue y devuelve tras la <b>perfección</b> del contrato (art. 106.4)."]]}, {"a": 108, "q": "NO es una forma admisible de constituir la garantía definitiva:", "o": [["El compromiso solidario de la empresa matriz del adjudicatario", 1, "Correcto: el art. 108.1 enumera tres formas —efectivo o valores de Deuda Pública, aval y seguro de caución— y esa no figura entre ellas."], ["El aval de una sociedad de garantía recíproca autorizada para operar en España", 0, "Es la letra b) del art. 108.1."], ["El contrato de seguro de caución con entidad aseguradora autorizada", 0, "Es la letra c) del art. 108.1."], ["El efectivo o los valores de Deuda Pública", 0, "Es la letra a) del art. 108.1."]]}, {"a": 119, "q": "En la tramitación urgente del expediente:", "o": [["Los plazos se reducen a la mitad, salvo el de quince días hábiles de espera previo a la formalización", 1, "Correcto: art. 119.2.b).1.º. Reducirlo vaciaría de contenido el recurso especial."], ["Se prescinde del expediente de contratación", 0, "Eso es la tramitación de emergencia (art. 120). La urgencia mantiene el procedimiento."], ["No es necesaria declaración alguna", 0, "El expediente debe contener la declaración de urgencia, debidamente motivada (art. 119.1)."], ["Los órganos informantes disponen de quince días para informar", 0, "Disponen de cinco días, prorrogables hasta diez (art. 119.2.a)."]]}, {"a": 120, "q": "La tramitación de emergencia permite:", "o": [["Contratar sin sujetarse a los requisitos formales de la ley, incluso el de la existencia de crédito suficiente", 1, "Correcto: art. 120.1.a). Es la única excepción legal a la exigencia de crédito."], ["Reducir a la mitad los plazos del procedimiento ordinario", 0, "Eso es la tramitación urgente del art. 119."], ["Prescindir de las reglas de recepción y liquidación del contrato", 0, "El art. 120.1.d) las mantiene íntegramente."], ["Iniciar la ejecución en el plazo que se estime conveniente", 0, "El plazo de inicio no puede superar un mes desde el acuerdo (art. 120.1.c)."]]}, {"a": 121, "q": "Los pliegos de cláusulas administrativas generales se aprueban:", "o": [["Por el Consejo de Ministros, previo dictamen del Consejo de Estado", 1, "Correcto: art. 121.1. Las CCAA y las entidades locales, según sus normas y con dictamen del Consejo de Estado u órgano consultivo autonómico equivalente."], ["Por el órgano de contratación de cada entidad", 0, "Ese aprueba los pliegos <b>particulares</b> (art. 122)."], ["Previo informe de la Junta Consultiva de Contratación Pública del Estado", 0, "Ese informe es el que precede a los pliegos de prescripciones <b>técnicas</b> generales (art. 123)."], ["Solo por la Administración General del Estado", 0, "El art. 121.2 habilita también a comunidades autónomas y entidades locales."]]}, {"a": 123, "q": "Los pliegos de prescripciones técnicas generales requieren:", "o": [["Informe previo de la Junta Consultiva de Contratación Pública del Estado", 1, "Correcto: art. 123. Los establece el Consejo de Ministros a propuesta del Ministro correspondiente."], ["Dictamen previo del Consejo de Estado", 0, "El dictamen del Consejo de Estado corresponde a los pliegos de cláusulas <b>administrativas</b> generales (art. 121)."], ["Aprobación del órgano de contratación", 0, "Ese aprueba los particulares del art. 124."], ["Informe del Tribunal de Cuentas", 0, "No interviene en la aprobación de pliegos."]]}, {"a": 124, "q": "El pliego de prescripciones técnicas particulares:", "o": [["Lo aprueba el órgano de contratación antes de la licitación y solo se modifica por error material, de hecho o aritmético", 1, "Correcto: art. 124, con el mismo régimen que el PCAP del art. 122."], ["Puede modificarse libremente hasta la adjudicación", 0, "Alteraría la competencia: en otro caso procede la retroacción de actuaciones."], ["Lo aprueba el Consejo de Ministros", 0, "Eso son los pliegos de prescripciones técnicas <b>generales</b> del art. 123."], ["Define las condiciones de pago y el régimen de penalidades", 0, "Eso es contenido del PCAP (art. 122.2); el PPT define calidades y condiciones sociales y ambientales."]]}];
const CASOS=[{"t": "Caso 2 · ¿Menor, simplificado o armonizado?", "e": "La Diputación de Málaga plantea tres contrataciones:<br><b>A)</b> Reparación de la cubierta de un centro comarcal: presupuesto de la empresa, <b>40.453 € IVA incluido</b>, ejecución en 5 semanas.<br><b>B)</b> Servicio de mantenimiento de jardines: <b>14.000 € al año sin IVA</b>, dos años más una prórroga de un año prevista en el pliego.<br><b>C)</b> Renting de 30 vehículos: 48 meses a <b>1.950 €/mes por vehículo sin IVA</b>, prórroga prevista de 12 meses y opción de compra final de 60.000 €.<br><br><b>Se pide:</b> calcula el valor estimado de cada uno y di qué régimen le corresponde.", "s": "<p><b>A)</b> Valor estimado = 40.453 / 1,21 = <b>33.432,23 €</b> &lt; 40.000 €. <b>Es contrato menor de obras</b> (art. 118.1). Necesita informe de necesidad (118.2), aprobación del gasto y factura (118.3), presupuesto de las obras y, si procede, proyecto y supervisión (118.5), y publicación trimestral en el perfil (118.6 y 63.4). Duración máxima un año y sin prórroga (29.8).</p><p><b>B)</b> Valor estimado = 14.000 × (2 + 1) = <b>42.000 €</b>. Las prórrogas previstas <b>se computan</b> (art. 101.2.a). Aunque el gasto anual sea de 14.000 €, <b>no es contrato menor</b>: supera los 15.000 € de valor estimado. Habrá que licitarlo, previsiblemente por abierto simplificado.</p><p><b>C)</b> Valor estimado = 30 × 1.950 × (48 + 12) + 60.000 = 3.510.000 + 60.000 = <b>3.570.000 €</b>. La opción de compra entra por el art. 101.2.a) —«cualquier forma de opción eventual»—. Es un suministro muy por encima del umbral armonizado: contrato <b>SARA</b>, publicidad en el DOUE y <b>recurso especial</b> del art. 44.</p><p><b>La lección:</b> el régimen del contrato no lo decide lo que se paga cada año, sino el <b>valor estimado</b> de toda su vida posible.</p>"}, {"t": "Caso 3 · Un pliego con problemas", "e": "Publicado el PCAP y el PPT de un suministro de 40 ordenadores por 47.500 € sin IVA, se detectan cuatro cuestiones:<br><b>1)</b> Las ponderaciones de los criterios de adjudicación suman 105 en vez de 100.<br><b>2)</b> El PPT exige «procesador Intel Core i7 de 13.ª generación».<br><b>3)</b> El PCAP exige clasificación empresarial al licitador.<br><b>4)</b> No consta en el expediente por qué no se ha dividido en lotes.<br><br><b>Se pide:</b> califica cada defecto y di qué procede en cada caso.", "s": "<p><b>1) Error aritmético.</b> Encaja en la única modificación admitida por el art. 122.1: se corrige y se publica la corrección, ampliando el plazo si procede. <b>No</b> hay retroacción.</p><p><b>2) Infracción del art. 126.</b> Mencionar una marca y un modelo concretos crea un obstáculo injustificado a la competencia. Habría que describir por <b>rendimiento</b> —por ejemplo, puntuación mínima en un índice objetivo— o, si fuera imprescindible citarlo, añadir «<b>o equivalente</b>». Es un vicio de fondo: procede la <b>retroacción</b> al momento de aprobación del PPT.</p><p><b>3) Improcedente.</b> La clasificación es exigible en contratos de obras a partir de determinado importe; en <b>suministros</b> no procede. Además, el art. 116.4.b) obliga a <b>justificar</b> en el expediente la clasificación que se exija, y aquí no hay justificación posible. Vicio de fondo: <b>retroacción</b>.</p><p><b>4) Infracción del art. 116.4.g)</b> en relación con el art. 99.3. La no división en lotes debe justificarse en el expediente. Su ausencia es un defecto del expediente subsanable retrotrayendo actuaciones al momento de su aprobación.</p><p><b>Y una nota de estrategia:</b> los defectos 2, 3 y 4 son exactamente los que se atacan por <b>recurso especial</b> contra los pliegos (art. 44.2.a), si el contrato entra en su ámbito.</p>"}, {"t": "Caso · Urgencia, emergencia y expediente", "e": "En un mismo mes ocurren tres cosas en el mismo ayuntamiento:<br><b>A)</b> Un temporal arranca la cubierta del pabellón municipal y hay riesgo de derrumbe sobre la vía pública.<br><b>B)</b> La caldera del colegio se avería en noviembre; no hay peligro, pero los alumnos pasan frío y la reparación cuesta <b>52.000 €</b>.<br><b>C)</b> Tres meses después se quiere reformar íntegramente la instalación térmica del colegio por <b>180.000 €</b>.<br><br><b>Se pide:</b> di qué vía de tramitación corresponde a cada una y qué requisitos exige.", "s": "<p><b>A) Emergencia · art. 120.</b> Hay <b>grave peligro</b>. El órgano de contratación puede ordenar lo necesario <b>sin expediente</b>, sin sujetarse a los requisitos formales de la ley e <b>incluso sin crédito suficiente</b>, dotándolo después conforme a la Ley General Presupuestaria. La ejecución debe iniciarse en el plazo máximo de <b>un mes</b> desde el acuerdo. Y no cabe recurso especial (art. 44.4).</p><p><b>B) Urgencia · art. 119.</b> No hay peligro grave, pero sí una <b>necesidad inaplazable</b>. Hace falta <b>declaración de urgencia motivada</b> del órgano de contratación en el expediente. Se sigue el mismo procedimiento, los órganos informan en <b>cinco días</b> —prorrogables a diez— y los plazos se reducen <b>a la mitad</b>. Con 52.000 € de valor estimado no es contrato menor —supera los 15.000 € de servicios y los 40.000 € de obras—, así que habrá licitación; y si fuera susceptible de recurso especial, los <b>quince días hábiles</b> de espera del art. 153.3 <b>no se reducen</b>.</p><p><b>C) Tramitación ordinaria.</b> Es exactamente el supuesto del art. <b>120.2</b>: las restantes prestaciones necesarias que no tengan carácter de emergencia se contratan por la vía ordinaria. Expediente completo del art. 116, aprobación del art. 117 y licitación.</p><p><b>La lección:</b> los tres regímenes se distinguen por lo que <b>suprimen</b>. La ordinaria no suprime nada; la <b>urgente</b> acorta plazos pero conserva el procedimiento; la <b>emergencia</b> suprime el expediente. Y la emergencia solo la abren tres llaves: catástrofe, grave peligro y defensa nacional.</p>"}];
const SEMAFORO=["Sé calcular la garantía definitiva y cuándo cabe la complementaria — art. 107", "Conozco los requisitos de publicidad de la consulta preliminar del mercado — art. 115", "Distingo lo que se INCORPORA (116.3) de lo que se JUSTIFICA (116.4)", "Recito las siete letras del art. 116.4 sin mirar", "Sé los tres efectos de la resolución del art. 117.1 y sus dos excepciones", "Domino los umbrales, requisitos y límites del contrato menor — art. 118", "Sé cuándo puede modificarse un pliego y cuándo hay retroacción — art. 122", "Sé por qué no se pueden citar marcas en las prescripciones técnicas — art. 126", "Sé que la garantía provisional es excepcional y cómo se calcula el 3 % — art. 106", "Enumero las tres formas de garantía definitiva y la retención en el precio — art. 108", "Sé qué se reduce y qué no se reduce en la tramitación urgente — art. 119", "Conozco los tres supuestos de emergencia y su régimen excepcional — art. 120", "Distingo quién aprueba cada uno de los cuatro pliegos — arts. 121 a 124", "Sé que el informe previo del pliego técnico general es de la Junta Consultiva — art. 123", "Sé cuándo se aprueba el PPT particular y cómo se corrige — art. 124"];
const INTRO_HTML="<section class=\"card\" id=\"intro\"><h2>Tema 10 · Bloque 2 · Garantías, expediente y pliegos</h2><p class=\"small\">Sabido quién contrata y qué se compra, este bloque construye la <b>carpeta</b>: la fianza que deja el contratista, los papeles que se reúnen, lo que hay que justificar por escrito y los cuatro pliegos que fijan las reglas. Es el bloque del que más se pregunta en los supuestos prácticos.</p><div class=\"box ej\"><span class=\"lbl\">La idea que ordena el bloque</span>El expediente responde por escrito a seis preguntas, en este orden: <b>¿por qué?</b> (art. 116.1, que remite al 28) → <b>¿con qué papeles?</b> (pliegos, crédito y fiscalización, art. 116.3) → <b>¿está todo justificado?</b> (las siete letras del art. 116.4) → <b>¿lo aprobamos?</b> (art. 117) → <b>¿corre prisa?</b> (urgencia, art. 119; emergencia, art. 120) → <b>¿con qué reglas?</b> (los cuatro pliegos, arts. 121 a 124 y 126). Y en paralelo, las garantías: <b>provisional</b> para presentarse (art. 106) y <b>definitiva</b> para cumplir (arts. 107 y 108).</div><div class=\"box warn\"><span class=\"lbl\">Fuentes utilizadas y vigencia</span><ul><li><b>Ley 9/2017, de 8 de noviembre</b>, de Contratos del Sector Público (documento de la biblioteca del proyecto), <b>texto consolidado</b>, transcrito literalmente artículo por artículo.</li><li><b>Aportación externa</b>, marcada donde aparece: la <b>Ley 7/1985</b> reguladora de las Bases del Régimen Local, la <b>Ley 40/2015</b> en materia de delegación de competencias, la <b>Ley General Presupuestaria</b> y el <b>RD Legislativo 1/2013</b> de derechos de las personas con discapacidad, citadas por los propios preceptos.</li><li><b>Verifica siempre la vigencia en el BOE consolidado.</b> Los umbrales de la regulación armonizada se actualizan cada dos años por reglamento delegado de la Comisión Europea.</li><li>Las entidades, fechas y cifras de los ejemplos y casos son <b>ficticias</b>; los preceptos y las cifras legales, reales.</li></ul></div><div class=\"box exc\"><span class=\"lbl\">Esto no es asesoramiento jurídico</span>Es material de estudio. Para un expediente real, acude a la norma consolidada y al informe del órgano competente.</div><div class=\"box\"><span class=\"lbl\">Los cuatro bloques del tema 10</span><ul><li><a href=\"LCSP_28-102_organo_y_objeto.html\"><b>Bloque 1 · El órgano de contratación, las partes y el objeto</b> — arts. 28, 29, 35, 36, 61, 62, 63, 74, 99 a 102</a></li><li><a href=\"LCSP_106-126_expediente.html\"><b>Bloque 2 · Garantías, expediente y pliegos</b> — arts. 106 a 108, 115 a 124 y 126</a></li><li><a href=\"LCSP_131-204_adjudicacion.html\"><b>Bloque 3 · Adjudicación y formalización</b> — arts. 131 a 160 y 204</a></li><li><a href=\"LCSP_44-60_recurso_especial.html\"><b>Bloque 4 · El recurso especial en materia de contratación</b> — arts. 44 a 60</a></li></ul></div></section><section class=\"card\" id=\"mapa\"><h2>El mapa del bloque</h2><p class=\"small\">El expediente paso a paso, las dos garantías y los cuatro pliegos.</p><svg viewBox=\"0 0 960 404\" role=\"img\" aria-label=\"Fases del expediente de contratación: inicio, contenido, justificación y aprobación\" style=\"width:100%;height:auto\"><defs><marker id=\"fl15\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr15\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe15\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw15\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"260\" y=\"8\" width=\"440\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"27.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">EL EXPEDIENTE DE CONTRATACIÓN, PASO A PASO</text><rect x=\"20\" y=\"52\" width=\"920\" height=\"58\" rx=\"10\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><circle cx=\"46\" cy=\"81\" r=\"15\" fill=\"var(--bg)\" stroke=\"var(--acc)\" stroke-width=\"2\"/><text x=\"46\" y=\"86\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"700\" fill=\"var(--acc)\">1</text><text x=\"74\" y=\"74\" text-anchor=\"start\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--acc)\">RESOLUCIÓN DE INICIO</text><text x=\"74\" y=\"90\" text-anchor=\"start\" font-size=\"9.4\" fill=\"currentColor\">Motiva la necesidad en los términos del art. 28.</text><text x=\"74\" y=\"104\" text-anchor=\"start\" font-size=\"9.4\" fill=\"currentColor\">Se publica en el perfil de contratante.</text><text x=\"930\" y=\"74\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">art. 116.1</text><path d=\"M480 111 L 480 119\" stroke=\"var(--acc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl15)\"/><rect x=\"20\" y=\"120\" width=\"920\" height=\"72\" rx=\"10\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><circle cx=\"46\" cy=\"156\" r=\"15\" fill=\"var(--bg)\" stroke=\"var(--acc)\" stroke-width=\"2\"/><text x=\"46\" y=\"161\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"700\" fill=\"var(--acc)\">2</text><text x=\"74\" y=\"142\" text-anchor=\"start\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--acc)\">SE INCORPORAN AL EXPEDIENTE</text><text x=\"74\" y=\"158\" text-anchor=\"start\" font-size=\"9.4\" fill=\"currentColor\">Pliego de cláusulas administrativas particulares y de</text><text x=\"74\" y=\"172\" text-anchor=\"start\" font-size=\"9.4\" fill=\"currentColor\">prescripciones técnicas · certificado de existencia de crédito</text><text x=\"74\" y=\"186\" text-anchor=\"start\" font-size=\"9.4\" fill=\"currentColor\">o documento equivalente · fiscalización previa de la Intervención.</text><text x=\"930\" y=\"142\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">art. 116.3</text><path d=\"M480 193 L 480 201\" stroke=\"var(--acc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl15)\"/><rect x=\"20\" y=\"202\" width=\"920\" height=\"72\" rx=\"10\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><circle cx=\"46\" cy=\"238\" r=\"15\" fill=\"var(--bg)\" stroke=\"var(--warn)\" stroke-width=\"2\"/><text x=\"46\" y=\"243\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"700\" fill=\"var(--warn)\">3</text><text x=\"74\" y=\"224\" text-anchor=\"start\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--warn)\">SE JUSTIFICA EN EL EXPEDIENTE</text><text x=\"74\" y=\"240\" text-anchor=\"start\" font-size=\"9.4\" fill=\"currentColor\">a) elección del procedimiento · b) clasificación exigida</text><text x=\"74\" y=\"254\" text-anchor=\"start\" font-size=\"9.4\" fill=\"currentColor\">c) criterios de solvencia y de adjudicación · d) valor estimado</text><text x=\"74\" y=\"268\" text-anchor=\"start\" font-size=\"9.4\" fill=\"currentColor\">e) necesidad · f) insuficiencia de medios en servicios · g) no división en lotes</text><text x=\"930\" y=\"224\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">art. 116.4</text><path d=\"M480 275 L 480 283\" stroke=\"var(--warn)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl15)\"/><rect x=\"20\" y=\"284\" width=\"920\" height=\"58\" rx=\"10\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><circle cx=\"46\" cy=\"313\" r=\"15\" fill=\"var(--bg)\" stroke=\"var(--ej)\" stroke-width=\"2\"/><text x=\"46\" y=\"318\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"700\" fill=\"var(--ej)\">4</text><text x=\"74\" y=\"306\" text-anchor=\"start\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--ej)\">RESOLUCIÓN DE APROBACIÓN</text><text x=\"74\" y=\"322\" text-anchor=\"start\" font-size=\"9.4\" fill=\"currentColor\">Aprueba el expediente y dispone la apertura del procedimiento</text><text x=\"74\" y=\"336\" text-anchor=\"start\" font-size=\"9.4\" fill=\"currentColor\">de adjudicación. IMPLICA TAMBIÉN LA APROBACIÓN DEL GASTO.</text><text x=\"930\" y=\"306\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">art. 117.1</text><rect x=\"20\" y=\"352\" width=\"920\" height=\"44\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"480\" y=\"370.828\" text-anchor=\"middle\" font-size=\"10.4\" fill=\"currentColor\">Excepción del art. 117.1: la aprobación del expediente NO implica la del gasto si el presupuesto no pudo establecerse antes,</text><text x=\"480\" y=\"383.828\" text-anchor=\"middle\" font-size=\"10.4\" fill=\"currentColor\">o si las normas de desconcentración o el acto de delegación dispusieron otra cosa. Entonces hay que recabar la del órgano competente.</text></svg><svg viewBox=\"0 0 960 298\" role=\"img\" aria-label=\"Régimen excepcional, cuantía y devolución de la garantía provisional\" style=\"width:100%;height:auto\"><defs><marker id=\"fl16\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr16\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe16\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw16\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"250\" y=\"8\" width=\"460\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"27.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">GARANTÍA PROVISIONAL · ART. 106</text><rect x=\"20\" y=\"52\" width=\"219.5\" height=\"236\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"129.75\" y=\"76\" text-anchor=\"middle\" /* Reveal on scroll para las tarjetas */
function reveal(){
  var els=document.querySelectorAll("section.card:not(.rv)");
  if(!els.length)return;
  if(!("IntersectionObserver" in window)){return;}
  var io=new IntersectionObserver(function(es){
    es.forEach(function(en){if(en.isIntersecting){en.target.classList.add("in");io.unobserve(en.target);}});
  },{threshold:.06,rootMargin:"0px 0px -30px 0px"});
  Array.prototype.forEach.call(els,function(el){el.classList.add("rv");io.observe(el);});
}

/* Sección activa en el índice lateral */
function spy(){
  var links=document.querySelectorAll("nav.side a[href^='#']");
  if(!links.length||!("IntersectionObserver" in window))return;
  var map={};
  Array.prototype.forEach.call(links,function(a){
    var t=document.getElementById(a.getAttribute("href").slice(1));
    if(t)map[t.id]=a;
  });
  var io=new IntersectionObserver(function(es){
    es.forEach(function(en){
      if(en.isIntersecting){
        Array.prototype.forEach.call(links,function(a){a.classList.remove("on");});
        if(map[en.target.id])map[en.target.id].classList.add("on");
      }
    });
  },{rootMargin:"-80px 0px -70% 0px",threshold:0});

}

<script>


/* ═══ Parser de respuestas: estructura semántica ═══ */
var FCFMT=(function(){
  var CITA=/\s*\(((?:arts?\.|DA\b|DT\b|disp\.)[^)]*)\)\s*\.?\s*$/i;
  var strip=function(h){return h.replace(/<[^>]+>/g,"");};

  function esc(s){return s;}

  function parse(raw){
    var out={verdict:null,cite:null,kind:"p",items:[],text:""};
    var body=String(raw).trim();

    /* 1 ── Cita legal al final */
    var m=body.match(CITA);
    if(m){out.cite=m[1].replace(/\s+/g," ").trim();body=body.slice(0,m.index).trim();}
    body=body.replace(/[.;,\s]+$/,"");

    /* 2 ── Veredicto Sí / No inicial */
    var v=strip(body).match(/^(Sí|Sí,|No|No,)[.:,]?\s/);
    if(v){
      out.verdict=/^Sí/.test(v[1])?"si":"no";
      body=body.replace(/^(<[^>]+>\s*)*(Sí|No)[.,:]?\s*/,"").trim();
      body=body.replace(/^en\s/,"En ");
    }

    /* 3 ── Enumeración con · */
    var parts=body.split(/\s+·\s+/);
    if(parts.length>=2){
      out.kind="list";
      var letras=parts.filter(function(p){return /^\s*<?[a-h]\)/.test(strip(p));}).length;
      out.marker = letras>=parts.length-1 ? "alpha" : "num";
      out.items=parts.map(function(p){
        return p.replace(/^\s*[a-h]\)\s*/,"").replace(/[.\s]+$/,"").trim();
      }).filter(Boolean);
      return out;
    }

    /* 4 ── Cláusulas contrapuestas con ; */
    var semi=body.split(/;\s+/);
    if(semi.length>=2&&semi.length<=3&&semi.every(function(s){return strip(s).length>14;})){
      out.kind="clauses";
      out.items=semi.map(function(s){return s.replace(/[.\s]+$/,"").trim();});
      return out;
    }

    /* 5 ── Párrafo */
    out.text=body;
    return out;
  }

  function render(raw){
    var d=parse(raw),h="";

    if(d.verdict){
      h+='<span class="fc-verdict '+d.verdict+'">'+(d.verdict==="si"?"✓ Sí":"✗ No")+'</span>';
    }

    if(d.kind==="list"){
      h+='<ol class="fc-list '+d.marker+'">';
      d.items.forEach(function(it){h+='<li>'+it+'</li>';});
      h+='</ol>';
    }else if(d.kind==="clauses"){
      h+='<div class="fc-clauses">';
      d.items.forEach(function(it){h+='<p>'+it+'</p>';});
      h+='</div>';
    }else if(d.text){
      h+='<p class="fc-p">'+d.text+'</p>';
    }

    if(d.cite){
      h+='<span class="fc-cite"><span class="s">§</span>'+d.cite+'</span>';
    }
    return {html:h,struct:(d.kind!=="p"||!!d.verdict||strip(raw).length>150)};
  }
  return {parse:parse,render:render};
})();

    +'<span class="kbd">espacio</span> girar · <span class="kbd">→</span> lo sabía · <span class="kbd">←</span> repasar</span>';

  var stage=document.createElement("div");

  stage.innerHTML=
    '<div class="fc-deck" id="fcdeck">'
    +'<span class="fc-ghost g2"></span><span class="fc-ghost g1"></span>'
    +'<div class="fc-lift" id="fclift">'
      +'<div class="fc-card" id="fcbox" tabindex="0" role="button" aria-label="Tarjeta. Pulsa para girar">'
        +'<div class="fc-face fc-front">'
          +'<span class="fc-tag">Pregunta</span><span class="fc-pip tr"></span><span class="fc-pip bl"></span>'
          +'<div class="fc-txt"></div>'
          +'<span class="fc-hint">Pulsa para girar</span>'
        +'</div>'
        +'<div class="fc-face fc-back">'
          +'<span class="fc-tag">Respuesta</span><span class="fc-pip tr"></span><span class="fc-pip bl"></span>'

      +'</div>'

  var bar=document.createElement("div");
  bar.className="fc-bar";bar.innerHTML="<i></i>";
  sec.appendChild(bar);

  var ctr=document.createElement("div");
  ctr.className="fc-ctrls noprint";
  ctr.innerHTML='<button id="fcflip">⟲ Girar</button>'
    +'<button id="fcok">✔ Lo sabía</button>'
    +'<button id="fcko">↻ Repasar</button>'
    +'<button id="fcreset">Reiniciar</button>'
    +'<span class="fc-score">'
      +'<span class="fc-pill ok" id="fcpok">0 sabidas</span>'
      +'<span class="fc-pill ko" id="fcpko">0 repasar</span>'
      +'<span class="fc-pill left" id="fccount">0</span>'
    +'</span>';
  sec.appendChild(ctr);

  var deck=stage.querySelector("#fcdeck"), lift=stage.querySelector("#fclift"),
      card=stage.querySelector("#fcbox"),
      front=stage.querySelector(".fc-front"), backf=stage.querySelector(".fc-back"),
      fill=bar.querySelector("i"),
      pok=ctr.querySelector("#fcpok"), pko=ctr.querySelector("#fcpko"),
      pleft=ctr.querySelector("#fccount");
  var rot=0;

  function reset(){
    order=CARDS.map(function(_,i){return i;});
    fi=0;ok=0;ko=0;back=false;busy=false;rot=0;
    card.style.transition="none";card.style.transform="rotateY(0deg)";
    void card.offsetWidth;card.style.transition="";
    deck.classList.remove("empty");
    var d=stage.querySelector(".fc-done");if(d)d.remove();
    card.style.display="";
    draw();
  }

  function bump(el){el.classList.remove("bump");void el.offsetWidth;el.classList.add("bump");}

  function draw(){
    pok.textContent=ok+(ok===1?" sabida":" sabidas");
    pko.textContent=ko+" repasar";
    var done=N-order.length;
    fill.style.width=(N?done/N*100:0)+"%";

    if(!order.length){
      pleft.textContent="0 quedan";
      deck.classList.add("empty");
      card.style.display="none";
      if(!stage.querySelector(".fc-done")){
        var d=document.createElement("div");
        d.className="fc-done";
        d.innerHTML='<span class="seal">🏆</span><h3>Ronda completada</h3>'
          +'<p>'+ok+' de '+N+' a la primera'+(ko?' · '+ko+' necesitaron repaso':'')+'</p>';
        deck.appendChild(d);
      }
      return;
    }
    if(fi>=order.length)fi=0;
    pleft.textContent=order.length+(order.length===1?" queda":" quedan");

    var c=CARDS[order[fi]];
    front.querySelector(".fc-txt").innerHTML='<p class="fc-p">'+c[0]+'</p>';
    var r=FCFMT.render(c[1]);
    backf.querySelector(".fc-txt").innerHTML=r.html;
    backf.classList.toggle("struct",r.struct);
    var hint=backf.querySelector(".fc-hint");
    if(hint)hint.classList.toggle("muted",/fc-cite/.test(r.html));
    var pip=(done+1)+"/"+N;
    Array.prototype.forEach.call(stage.querySelectorAll(".fc-pip"),function(p){p.textContent=pip;});
  }

    if(busy||!order.length)return;

    lift.classList.remove("lift");void lift.offsetWidth;lift.classList.add("lift");
  }

  function next(good){
    if(busy||!order.length)return;
    busy=true;
    if(good){ok++;bump(pok);}else{ko++;bump(pko);}
    lift.classList.remove("lift");
    lift.classList.add(good?"out-ok":"out-ko");
    setTimeout(function(){
      if(good){order.splice(fi,1);}
      else{var m=order.splice(fi,1)[0];order.push(m);}
      back=false;rot=0;
      card.style.transition="none";card.style.transform="rotateY(0deg)";
      void card.offsetWidth;card.style.transition="";
      draw();
      lift.classList.remove("out-ok","out-ko");
      lift.classList.add("in");
      setTimeout(function(){lift.classList.remove("in");busy=false;},480);

    if(e.key===" "||e.key==="Enter"){e.preventDefault();flip();}
    if(e.key==="ArrowRight"){e.preventDefault();next(true);}
    if(e.key==="ArrowLeft"){e.preventDefault();next(false);}
  };
  ctr.querySelector("#fcflip").onclick=flip;
  ctr.querySelector("#fcok").onclick=function(){next(true);};
  ctr.querySelector("#fcko").onclick=function(){next(false);};
  ctr.querySelector("#fcreset").onclick=reset;

  /* Deslizar en táctil */
  var x0=null,y0=null;
  card.addEventListener("touchstart",function(e){x0=e.touches[0].clientX;y0=e.touches[0].clientY;},{passive:true});

  },{passive:true});

  /* Atajos globales cuando el mazo está a la vista */
  document.addEventListener("keydown",function(e){
    if(e.target.matches("input,textarea,select"))return;
    var r=stage.getBoundingClientRect();
    if(r.bottom<80||r.top>innerHeight-80)return;
    if(e.key===" "){e.preventDefault();flip();}
    else if(e.key==="ArrowRight"){e.preventDefault();next(true);}
    else if(e.key==="ArrowLeft"){e.preventDefault();next(false);}
  });

  reset();
  return true;
}
if(!boot()){
  var tries=0;
  var iv=setInterval(function(){if(boot()||++tries>40)clearInterval(iv);},120);
  addEventListener("load",function(){setTimeout(boot,100);});
}
})();


</script>
<script>


/* ═══ Altura adaptativa + índice plegable ═══ */
(function(){
"use strict";

/* ── 1 · Índice lateral plegable ── */
function sidebar(){
  var lay=document.querySelector(".layout"),
      side=document.getElementById("side"),
      tools=document.querySelector(".tools");
  if(!lay||!side||!tools||document.getElementById("navhide"))return;

  var K="oposi_bII_nav";
  function get(){try{return localStorage.getItem(K)==="0";}catch(e){return false;}}
  function set(v){try{localStorage.setItem(K,v?"0":"1");}catch(e){}}

  var b=document.createElement("button");
  b.id="navhide";b.type="button";
  b.innerHTML='<span class="ic">☰</span>';
  b.setAttribute("aria-controls","side");
  tools.insertBefore(b,tools.firstChild);

  function apply(hidden,anim){
    if(!anim)lay.style.transition="none";
    lay.classList.toggle("nonav",hidden);
    side.setAttribute("aria-hidden",String(hidden));
    b.setAttribute("aria-pressed",String(hidden));
    b.title=hidden?"Mostrar índice (i)":"Ocultar índice (i)";
    b.setAttribute("aria-label",b.title);
    if(!anim)requestAnimationFrame(function(){lay.style.transition="";});
  }
  apply(get(),false);

  b.onclick=function(){
    var h=!lay.classList.contains("nonav");
    apply(h,true);set(h);
    window.dispatchEvent(new Event("resize"));
  };
  document.addEventListener("keydown",function(e){
    if(e.target.matches("input,textarea,select"))return;
    if(e.key==="i"||e.key==="I"){e.preventDefault();b.click();}
  });
}

/* ── 2 · La tarjeta se adapta a su contenido ── */
function autofit(){
  var stage=document.querySelector(".fc-stage");
  if(!stage||stage.dataset.fit)return;
  var deck=stage.querySelector(".fc-deck"),
      front=stage.querySelector(".fc-front"),
      back=stage.querySelector(".fc-back");
  if(!deck||!front||!back)return;
  stage.dataset.fit="1";

  var meas=document.createElement("div");
  meas.className="fc-measure";meas.setAttribute("aria-hidden","true");
  meas.innerHTML='<div class="fc-face fc-front"><div class="fc-body"><div class="fc-txt"></div></div></div>';
  stage.appendChild(meas);
  var mFace=meas.querySelector(".fc-face"), mTxt=meas.querySelector(".fc-txt");

  function measure(cls,html){
    mFace.className="fc-face "+cls;
    mTxt.innerHTML=html;
    return mFace.offsetHeight;
  }

  function fit(){
    if(deck.classList.contains("empty")){deck.style.height="230px";return;}
    var fT=front.querySelector(".fc-txt"), bT=back.querySelector(".fc-txt");
    if(!fT||!bT)return;
    var h=Math.max(
      measure("fc-front"+(front.classList.contains("struct")?" struct":""),fT.innerHTML),
      measure("fc-back" +(back .classList.contains("struct")?" struct":""),bT.innerHTML),
      230
    );
    deck.style.height=Math.ceil(h+8)+"px";
  }

  /* recalcular cuando cambia la tarjeta, el tamaño de letra o la ventana */
  new MutationObserver(fit).observe(back,{childList:true,subtree:true,attributes:true,attributeFilter:["class"]});
  var t;
  addEventListener("resize",function(){clearTimeout(t);t=setTimeout(fit,120);},{passive:true});
  ["fs+","fs-"].forEach(function(id){
    var el=document.getElementById(id);
    if(el)el.addEventListener("click",function(){setTimeout(fit,60);});
  });
  fit();setTimeout(fit,250);
}

function go(){sidebar();autofit();}
if(document.readyState!=="loading")go();else document.addEventListener("DOMContentLoaded",go);
addEventListener("load",function(){setTimeout(go,120);});
var n=0,iv=setInterval(function(){go();if(++n>25)clearInterval(iv);},150);
})();


</script>
<script>


/* ═══════════════════════════════════════════════════════════════
   TTS · Lectura en voz alta del texto legal
   ═══════════════════════════════════════════════════════════════ */
(function(){
"use strict";
if(!("speechSynthesis" in window))return;

var K="oposi_bII_tts";
function load(){try{return JSON.parse(localStorage.getItem(K))||{};}catch(e){return {};}}
function save(o){try{localStorage.setItem(K,JSON.stringify(o));}catch(e){}}
var cfg=load();
if(cfg.rate==null)cfg.rate=1;

var synth=window.speechSynthesis, voces=[], actual=null, bloques=[];

/* ─────────── 1 · Selección de voz ─────────── */
/* iOS y iPadOS enumeran voces de red (Google, «Online») que en realidad no
   sintetizan: se seleccionan pero no suena nada. Ahí solo valen las locales. */
var IOS=(function(){
  var ua=navigator.userAgent||"";
  if(/iPad|iPhone|iPod/i.test(ua))return true;
  return navigator.platform==="MacIntel"&&(navigator.maxTouchPoints||0)>1;
})();
var descartadas=0;

function esEspanol(v){return /^es\b|^es[-_]/i.test(v.lang||"")||/spanish|español/i.test(v.name||"");}
function esRemota(v){return v.localService===false||/google|online/i.test(v.name||"");}
function reproducible(v){return !IOS||!esRemota(v);}

function calidad(v){
  var n=(v.name||"")+" "+(v.voiceURI||""), p=0;
  if(/natural|neural/i.test(n))p+=100;
  if(/premium|enhanced|eloquence/i.test(n))p+=35;
  if(/^es-ES/i.test(v.lang))p+=12;              /* castellano de España primero */
  if(/microsoft/i.test(n))p+=8;
  if(IOS){
    /* en el iPad y el móvil de Apple mandan las locales */
    if(esRemota(v))p-=500;
    if(v.localService!==false)p+=40;
  }else{
    if(/online/i.test(n))p+=40;
    if(/google/i.test(n))p+=30;
    if(v.localService===false)p+=15;
  }
  return p;
}
var MASC=/(pablo|álvaro|alvaro|jorge|diego|juan|raul|raúl|carlos|miguel|lorenzo|gonzalo|dalton|liam|andr[eé]s|luciano|male|hombre|masculin)/i;
var FEM =/(helena|elvira|laura|mónica|monica|paulina|sabina|esperanza|marisol|ximena|dalia|salome|camila|catalina|isidora|female|mujer|femenin)/i;
function genero(v){
  var n=v.name||"";
  if(MASC.test(n))return "m";
  if(FEM.test(n))return "f";
  return "?";
}
function cargarVoces(){
  var all=synth.getVoices()||[];
  var es=all.filter(esEspanol);
  descartadas=0;
  var utiles=[];
  es.forEach(function(v){ if(reproducible(v))utiles.push(v); else descartadas++; });
  voces=utiles.sort(function(a,b){return calidad(b)-calidad(a);});
  if(!voces.length)voces=all.filter(reproducible).slice(0,12);
  /* si la voz guardada ya no sirve en este aparato, la olvidamos */
  if(cfg.voz){
    var sigue=false;
    for(var i=0;i<voces.length;i++)if(voces[i].voiceURI===cfg.voz)sigue=true;
    if(!sigue&&voces.length){cfg.voz=null;save(cfg);}
  }
  pintarSelector();
}
function elegir(){
  if(cfg.voz){
    for(var i=0;i<voces.length;i++)
      if(voces[i].voiceURI===cfg.voz&&reproducible(voces[i]))return voces[i];
  }
  var g=cfg.gen;
  for(var j=0;j<voces.length;j++)if(genero(voces[j])===g&&reproducible(voces[j]))return voces[j];
  for(var k=0;k<voces.length;k++)if(reproducible(voces[k]))return voces[k];
  return null;

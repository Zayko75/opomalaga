res pedanías. La diputación ordena el mismo día la reparación del vial de acceso por 180.000 € sin tramitar expediente, aunque la partida solo tenía 40.000 €; después se tramita la dotación. La ejecución empieza a los cuatro días.</li>\n<li><b>Caso límite:</b> tres meses después se quiere reasfaltar todo el vial y mejorar el drenaje. Eso <b>ya no es emergencia</b>: es la «restante prestación necesaria» del art. 120.2 y va por procedimiento <b>ordinario</b>.</li>\n</ul>", "noej": "<ul>\n<li><b>No es tramitación urgente:</b> la urgencia mantiene el procedimiento con plazos reducidos; la emergencia lo suprime.</li>\n<li><b>No cabe</b> el recurso especial en los procedimientos tramitados por emergencia (art. 44.4).</li>\n<li><b>No ampara</b> la emergencia todo lo que se quiera hacer después: solo lo inmediato.</li>\n<li><b>No exime</b> de las reglas de cumplimiento, recepción y liquidación.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 119:</b> tramitación urgente, el escalón anterior.</li>\n<li><b>Art. 44.4:</b> exclusión del recurso especial.</li>\n<li><b>Art. 116.1:</b> la regla general, que exige expediente previo.</li>\n<li><b>Art. 39.1:</b> nulidad de pleno derecho, que aquí se excepciona por la propia ley.</li>\n<li><b>Ley General Presupuestaria</b> <i>(aportación externa)</i>: dotación posterior del crédito.</li>\n</ul>", "trampas": "<ul>\n<li>Los <b>tres</b> supuestos son tasados: catástrofe, grave peligro y defensa nacional.</li>\n<li>Se puede contratar <b>incluso sin crédito</b>. Es la única excepción de la ley a esa exigencia.</li>\n<li><b>30 días</b> para dar cuenta al Consejo de Ministros · <b>1 mes</b> para iniciar la ejecución.</li>\n<li>Sin recurso especial.</li>\n</ul>", "ancla": "<p><b>C-P-D:</b> <b>C</b>atástrofe · <b>P</b>eligro grave · <b>D</b>efensa nacional. Los tres únicos billetes para saltarse el expediente.</p>\n<p>Y la frase que separa urgencia de emergencia: <b>«urgente corre; de emergencia, vuela sin papeles».</b></p>", "vis": "<svg viewBox=\"0 0 960 560\" role=\"img\" aria-label=\"Supuestos y régimen excepcional de la tramitación de emergencia\" style=\"width:100%;height:auto\"><defs><marker id=\"fl9\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr9\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe9\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw9\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"250\" y=\"8\" width=\"460\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"27.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">TRAMITACIÓN DE EMERGENCIA · ART. 120</text><rect x=\"20\" y=\"52\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><rect x=\"30\" y=\"66\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--exc)\"/><text x=\"120\" y=\"83\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--exc)\">CUÁNDO</text><text x=\"224\" y=\"74\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Acontecimientos CATASTRÓFICOS, situaciones de GRAVE PELIGRO</text><text x=\"224\" y=\"88\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">o necesidades que afecten a la DEFENSA NACIONAL.</text><text x=\"930\" y=\"74\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">120.1</text><path d=\"M480 107 L 480 115\" stroke=\"var(--exc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl9)\"/><rect x=\"20\" y=\"116\" width=\"920\" height=\"68\" rx=\"10\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><rect x=\"30\" y=\"137\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--exc)\"/><text x=\"120\" y=\"154\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--exc)\">QUÉ PERMITE</text><text x=\"224\" y=\"138\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Ordenar la ejecución de lo necesario o contratar libremente el objeto,</text><text x=\"224\" y=\"152\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">SIN tramitar expediente y SIN sujetarse a los requisitos formales de la Ley,</text><text x=\"224\" y=\"166\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">INCLUSO EL DE LA EXISTENCIA DE CRÉDITO SUFICIENTE.</text><text x=\"930\" y=\"138\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">120.1.a</text><path d=\"M480 185 L 480 193\" stroke=\"var(--exc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl9)\"/><rect x=\"20\" y=\"194\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"30\" y=\"208\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"120\" y=\"225\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--warn)\">SI NO HAY CRÉDITO</text><text x=\"224\" y=\"216\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Adoptado el acuerdo, se procede a su dotación conforme a la</text><text x=\"224\" y=\"230\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Ley General Presupuestaria.</text><text x=\"930\" y=\"216\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">120.1.a</text><path d=\"M480 249 L 480 257\" stroke=\"var(--warn)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl9)\"/><rect x=\"20\" y=\"258\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"30\" y=\"272\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"120\" y=\"289\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--warn)\">CONTROL · 30 DÍAS</text><text x=\"224\" y=\"280\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">En el ámbito estatal, se da cuenta de los acuerdos al Consejo de Ministros</text><text x=\"224\" y=\"294\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">en el plazo máximo de treinta días.</text><text x=\"930\" y=\"280\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">120.1.b</text><path d=\"M480 313 L 480 321\" stroke=\"var(--warn)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl9)\"/><rect x=\"20\" y=\"322\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"30\" y=\"336\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"120\" y=\"353\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--acc)\">INICIO · 1 MES</text><text x=\"224\" y=\"344\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">El plazo de inicio de la ejecución no puede superar UN MES desde el acuerdo.</text><text x=\"224\" y=\"358\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Si se excede, hay que tramitar un PROCEDIMIENTO ORDINARIO.</text><text x=\"930\" y=\"344\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">120.1.c</text><path d=\"M480 377 L 480 385\" stroke=\"var(--acc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl9)\"/><rect x=\"20\" y=\"386\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><rect x=\"30\" y=\"400\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--ej)\"/><text x=\"120\" y=\"417\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--ej)\">DESPUÉS</text><text x=\"224\" y=\"408\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Se aplican las reglas ordinarias sobre cumplimiento, recepción y liquidación.</text><text x=\"224\" y=\"422\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Si los fondos se libraron a justificar, se rinde cuenta justificativa.</text><text x=\"930\" y=\"408\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">120.1.d</text><path d=\"M480 441 L 480 449\" stroke=\"var(--ej)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl9)\"/><rect x=\"20\" y=\"450\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--panel)\" stroke=\"var(--line)\"/><rect x=\"30\" y=\"464\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--line)\"/><text x=\"120\" y=\"481\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"currentColor\">LO DEMÁS</text><text x=\"224\" y=\"472\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Las restantes prestaciones necesarias que NO tengan carácter de emergencia</text><text x=\"224\" y=\"486\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">se contratan por tramitación ORDINARIA.</text><text x=\"930\" y=\"472\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">120.2</text><rect x=\"20\" y=\"514\" width=\"920\" height=\"34\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"480\" y=\"534.328\" text-anchor=\"middle\" font-size=\"10.4\" fill=\"currentColor\">En emergencia NO cabe recurso especial en materia de contratación (art. 44.4). Es la única tramitación que queda fuera de esa garantía.</text></svg>"}, {"n": 121, "t": "Pliegos de cláusulas administrativas generales", "ubic": "Libro II ▸ Título I ▸ Capítulo I ▸ Sección 2.ª · Pliegos", "idea": "Los aprueba el Consejo de Ministros con dictamen del Consejo de Estado, para muchos contratos a la vez.", "literal": "<p><b>1.</b> El Consejo de Ministros, a iniciativa de los Ministerios interesados, a propuesta del Ministro de Hacienda y Función Pública, y previo dictamen del Consejo de Estado, podrá aprobar pliegos de cláusulas administrativas generales, que deberán ajustarse en su contenido a los preceptos de esta Ley y de sus disposiciones de desarrollo, para su utilización en los contratos que se celebren por los órganos de contratación de la Administración General del Estado, sus Organismos Autónomos, Entidades Gestoras y Servicios Comunes de la Seguridad Social y demás entidades que gocen de la condición de Administraciones Públicas integrantes del sector público estatal.</p><p><b>2.</b> Las Comunidades Autónomas y las entidades que integran la Administración Local podrán aprobar pliegos de cláusulas administrativas generales, de acuerdo con sus normas específicas, previo dictamen del Consejo de Estado u órgano consultivo equivalente de la Comunidad Autónoma respectiva, si lo hubiera.</p>", "dis": "<ul>\n<li><b>Ámbito estatal (121.1):</b> el <b>Consejo de Ministros</b>, a <b>iniciativa de los Ministerios interesados</b>, a <b>propuesta del Ministro de Hacienda y Función Pública</b> y <b>previo dictamen del Consejo de Estado</b>, podrá aprobar <span class=\"t\" data-k=\"pgeneral\">pliegos de cláusulas administrativas generales</span>.</li>\n<li><b>Contenido:</b> deberán <b>ajustarse a los preceptos de esta Ley</b> y de sus disposiciones de desarrollo.</li>\n<li><b>Destinatarios:</b> los contratos que celebren los órganos de contratación de la <b>Administración General del Estado</b>, sus organismos autónomos, entidades gestoras y servicios comunes de la Seguridad Social y demás entidades del sector público estatal con condición de Administraciones Públicas.</li>\n<li><b>Comunidades autónomas y entidades locales (121.2):</b> podrán aprobar pliegos de cláusulas administrativas generales <b>de acuerdo con sus normas específicas</b>, <b>previo dictamen del Consejo de Estado</b> u <b>órgano consultivo equivalente de la comunidad autónoma</b>, si lo hubiera.</li>\n</ul>", "llano": "<p>Un pliego general es un modelo: unas cláusulas que valen para muchos contratos y que se aprueban una vez, al máximo nivel. En el Estado los aprueba el Consejo de Ministros con el dictamen previo del Consejo de Estado. Las comunidades y las entidades locales pueden aprobar los suyos con su propio órgano consultivo.</p>", "porque": "<p>Porque si cada contrato tuviera que redactar desde cero las cláusulas sobre penalidades, cesión, subcontratación o resolución, cada órgano inventaría su propia versión y la seguridad jurídica desaparecería. El pliego general <b>estandariza</b> lo que no depende del contrato concreto.</p>\n<p>Y el <b>dictamen previo del Consejo de Estado</b> es la contrapartida: como esas cláusulas van a regir cientos de contratos, se someten al máximo órgano consultivo antes de aprobarse.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> las condiciones generales de un banco, que valen para todos sus clientes, frente al contrato particular de tu hipoteca, que fija tu tipo y tu plazo.</li>\n<li><b>Real:</b> una diputación provincial aprueba un pliego de cláusulas administrativas generales para sus contratos de servicios, previo dictamen del órgano consultivo de su comunidad autónoma. A partir de entonces, cada PCAP concreto se remite a él y solo regula lo específico: objeto, criterios, plazos y precio.</li>\n<li><b>Caso límite:</b> un ayuntamiento pequeño quiere aprobar el suyo y su comunidad autónoma no tiene órgano consultivo propio. El art. 121.2 lo resuelve: dictamen del <b>Consejo de Estado</b>.</li>\n</ul>", "noej": "<ul>\n<li><b>No es el PCAP:</b> el general vale para muchos contratos; el <b>particular</b> del art. 122 rige <b>este</b> contrato.</li>\n<li><b>No lo aprueba</b> el órgano de contratación: en el Estado, el Consejo de Ministros.</li>\n<li><b>No cabe</b> aprobarlo sin dictamen previo del Consejo de Estado o del órgano consultivo autonómico equivalente.</li>\n<li><b>No puede</b> contradecir la ley ni sus disposiciones de desarrollo.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 122:</b> pliego de cláusulas administrativas particulares.</li>\n<li><b>Art. 123:</b> pliego de prescripciones técnicas generales, con informe de la Junta Consultiva en vez de dictamen del Consejo de Estado.</li>\n<li><b>Art. 124:</b> pliego de prescripciones técnicas particulares.</li>\n<li><b>Art. 116.3:</b> los pliegos que se incorporan al expediente son los <b>particulares</b>.</li>\n</ul>", "trampas": "<ul>\n<li><b>Consejo de Estado</b> para los pliegos administrativos generales (121); <b>Junta Consultiva</b> para los técnicos generales (123). No se confunden si recuerdas: lo jurídico al Consejo de Estado, lo técnico a la Junta Consultiva.</li>\n<li>Iniciativa de los <b>Ministerios</b>, propuesta del <b>Ministro de Hacienda</b>, aprobación del <b>Consejo de Ministros</b>. Tres escalones.</li>\n<li>Las entidades locales <b>sí</b> pueden aprobarlos.</li>\n</ul>", "ancla": "<p><b>General = Consejo de Ministros · Particular = órgano de contratación.</b></p>\n<p>Y los dictámenes: <b>administrativo → Consejo de Estado</b>; <b>técnico → Junta Consultiva</b>.</p>", "vis": "<svg viewBox=\"0 0 960 356\" role=\"img\" aria-label=\"Los cuatro tipos de pliego: generales y particulares, administrativos y técnicos\" style=\"width:100%;height:auto\"><defs><marker id=\"fl10\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr10\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe10\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw10\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"250\" y=\"8\" width=\"460\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"27.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">LOS CUATRO PLIEGOS · ARTS. 121 A 124</text><rect x=\"20\" y=\"52\" width=\"219.5\" height=\"236\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"129.75\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--acc)\">CLÁUSULAS ADMINISTRATIVAS</text><text x=\"129.75\" y=\"91\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--acc)\">GENERALES · art. 121</text><text x=\"129.75\" y=\"106\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Los aprueba el CONSEJO DE</text><text x=\"129.75\" y=\"121\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">MINISTROS, a iniciativa de</text><text x=\"129.75\" y=\"136\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">los ministerios y a</text><text x=\"129.75\" y=\"151\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">propuesta del Ministro de</text><text x=\"129.75\" y=\"166\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Hacienda, previo DICTAMEN</text><text x=\"129.75\" y=\"181\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">DEL CONSEJO DE ESTADO</text><text x=\"129.75\" y=\"196\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"129.75\" y=\"211\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">CCAA y entidades locales:</text><text x=\"129.75\" y=\"226\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">según sus normas, previo</text><text x=\"129.75\" y=\"241\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">dictamen del Consejo de</text><text x=\"129.75\" y=\"256\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Estado u órgano consultivo</text><text x=\"129.75\" y=\"271\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">autonómico equivalente</text><rect x=\"253.5\" y=\"52\" width=\"219.5\" height=\"236\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"363.25\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--ej)\">CLÁUSULAS ADMINISTRATIVAS</text><text x=\"363.25\" y=\"91\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--ej)\">PARTICULARES · art. 122</text><text x=\"363.25\" y=\"106\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Los aprueba el ÓRGANO DE</text><text x=\"363.25\" y=\"121\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">CONTRATACIÓN</text><text x=\"363.25\" y=\"136\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"363.25\" y=\"151\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Antes de la autorización</text><text x=\"363.25\" y=\"166\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">del gasto o junto con ella,</text><text x=\"363.25\" y=\"181\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">y SIEMPRE antes de licitar</text><text x=\"363.25\" y=\"196\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"363.25\" y=\"211\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Solo se modifican por error</text><text x=\"363.25\" y=\"226\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">material, de hecho o</text><text x=\"363.25\" y=\"241\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">aritmético; en otro caso,</text><text x=\"363.25\" y=\"256\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">RETROACCIÓN</text><rect x=\"487\" y=\"52\" width=\"219.5\" height=\"236\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"596.75\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--warn)\">PRESCRIPCIONES TÉCNICAS</text><text x=\"596.75\" y=\"91\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--warn)\">GENERALES · art. 123</text><text x=\"596.75\" y=\"106\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Los establece el CONSEJO DE</text><text x=\"596.75\" y=\"121\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">MINISTROS, a propuesta del</text><text x=\"596.75\" y=\"136\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Ministro correspondiente,</text><text x=\"596.75\" y=\"151\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">PREVIO INFORME DE LA JUNTA</text><text x=\"596.75\" y=\"166\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">CONSULTIVA DE CONTRATACIÓN</text><text x=\"596.75\" y=\"181\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">PÚBLICA DEL ESTADO</text><text x=\"596.75\" y=\"196\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"596.75\" y=\"211\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Para la AGE, organismos</text><text x=\"596.75\" y=\"226\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">autónomos, entidades</text><text x=\"596.75\" y=\"241\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">gestoras y servicios comunes</text><text x=\"596.75\" y=\"256\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">de la Seguridad Social</text><rect x=\"720.5\" y=\"52\" width=\"219.5\" height=\"236\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"830.25\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--warn)\">PRESCRIPCIONES TÉCNICAS</text><text x=\"830.25\" y=\"91\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--warn)\">PARTICULARES · art. 124</text><text x=\"830.25\" y=\"106\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Los aprueba el ÓRGANO DE</text><text x=\"830.25\" y=\"121\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">CONTRATACIÓN, en el mismo</text><text x=\"830.25\" y=\"136\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">momento que el PCAP</text><text x=\"830.25\" y=\"151\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"830.25\" y=\"166\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Definen las CALIDADES y las</text><text x=\"830.25\" y=\"181\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">CONDICIONES SOCIALES Y</text><text x=\"830.25\" y=\"196\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">AMBIENTALES de la prestación</text><text x=\"830.25\" y=\"211\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"830.25\" y=\"226\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Misma regla de modificación:</text><text x=\"830.25\" y=\"241\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">solo error material, si no,</text><text x=\"830.25\" y=\"256\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">retroacción</text><rect x=\"20\" y=\"298\" width=\"920\" height=\"48\" rx=\"8\" fill=\"var(--panel)\" stroke=\"var(--line)\"/><text x=\"480\" y=\"318.828\" text-anchor=\"middle\" font-size=\"10.4\" fill=\"currentColor\">Regla para no confundirlos: ADMINISTRATIVO = reglas jurídicas y económicas · TÉCNICO = qué hay que entregar.</text><text x=\"480\" y=\"331.828\" text-anchor=\"middle\" font-size=\"10.4\" fill=\"currentColor\">GENERAL = lo aprueba el Consejo de Ministros para muchos contratos · PARTICULAR = lo aprueba el órgano de contratación para ESTE contrato.</text></svg>"}, {"n": 122, "t": "Pliegos de cláusulas administrativas particulares", "ubic": "Libro II ▸ Título I ▸ Capítulo I ▸ Sección 2.ª · Pliegos", "idea": "El PCAP fija las reglas jurídicas y económicas del contrato, se aprueba antes de licitar y solo se corrige por error material.", "literal": "<p><b>1.</b> Los pliegos de cláusulas administrativas particulares deberán aprobarse previamente a la autorización del gasto o conjuntamente con ella, y siempre antes de la licitación del contrato, o de no existir esta, antes de su adjudicación, y solo podrán ser modificados con posterioridad por error material, de hecho o aritmético. En otro caso, la modificación del pliego conllevará la retroacción de actuaciones.</p><p><b>2.</b> En los pliegos de cláusulas administrativas particulares se incluirán los criterios de solvencia y adjudicación del contrato; las consideraciones sociales, laborales y ambientales que como criterios de solvencia, de adjudicación o como condiciones especiales de ejecución se establezcan; los pactos y condiciones definidores de los derechos y obligaciones de las partes del contrato; la previsión de cesión del contrato salvo en los casos en que la misma no sea posible de acuerdo con lo establecido en el segundo párrafo del artículo 214.1; la obligación del adjudicatario de cumplir las condiciones salariales de los trabajadores conforme al Convenio Colectivo sectorial de aplicación; y las demás menciones requeridas por esta Ley y sus normas de desarrollo. En el caso de contratos mixtos, se detallará el régimen jurídico aplicable a sus efectos, cumplimiento y extinción, atendiendo a las normas aplicables a las diferentes prestaciones fusionadas en ellos. Los pliegos podrán también especificar si va a exigirse la transferencia de derechos de propiedad intelectual o industrial, sin perjuicio de lo establecido en el artículo 308 respecto de los contratos de servicios. Los pliegos deberán mencionar expresamente la obligación del futuro contratista de respetar la normativa vigente en materia de protección de datos. Sin perjuicio de lo establecido en el artículo 28.2 del Reglamento (UE) 2016/679 del Parlamento Europeo y del Consejo, de 27 de abril de 2016, relativo a la protección de las personas físicas en lo que respecta al tratamiento de datos personales y la libre circulación de estos datos y por el que se deroga la Directiva 95/46/CE, en aquellos contratos cuya ejecución requiera el tratamiento por el contratista de datos personales por cuenta del responsable del tratamiento, adicionalmente en el pliego se hará constar:</p><p style=\"margin-left:1.1rem\">a) La finalidad para la cual se cederán dichos datos.</p><p style=\"margin-left:1.1rem\">b) La obligación del futuro contratista de someterse en todo caso a la normativa nacional y de la Unión Europea en materia de protección de datos, sin perjuicio de lo establecido en el último párrafo del apartado 1 del artículo 202.</p><p style=\"margin-left:1.1rem\">c) La obligación de la empresa adjudicataria de presentar antes de la formalización del contrato una declaración en la que ponga de manifiesto dónde van a estar ubicados los servidores y desde dónde se van a prestar los servicios asociados a los mismos.</p><p style=\"margin-left:1.1rem\">d) La obligación de comunicar cualquier cambio que se produzca, a lo largo de la vida del contrato, de la información facilitada en la declaración a que se refiere la letra c) anterior.</p><p style=\"margin-left:1.1rem\">e) La obligación de los licitadores de indicar en su oferta, si tienen previsto subcontratar los servidores o los servicios asociados a los mismos, el nombre o el perfil empresarial, definido por referencia a las condiciones de solvencia profesional o técnica, de los subcontratistas a los que se vaya a encomendar su realización. En los pliegos correspondientes a los contratos a que se refiere el párrafo anterior las obligaciones recogidas en las letras a) a e) anteriores en todo caso deberán ser calificadas como esenciales a los efectos de lo previsto en la letra f) del apartado 1 del artículo 211.</p><p><b>3.</b> Los pliegos de cláusulas administrativas particulares podrán establecer penalidades, conforme a lo prevenido en el apartado 1 del artículo 192, para los casos de incumplimiento o de cumplimiento defectuoso de la prestación que afecten a características de la misma, en especial cuando se hayan tenido en cuenta para definir los criterios de adjudicación, o atribuir a la puntual observancia de estas características el carácter de obligación contractual esencial a los efectos señalados en la letra f) del apartado 1 del artículo 211. Asimismo, para los casos de incumplimiento de lo prevenido en los artículos 130 y 201. 3 bis. Las Administraciones públicas incorporarán en los pliegos de cláusulas administrativas particulares condiciones especiales de ejecución o criterios de adjudicación dirigidos a la promoción de la igualdad de trato y no discriminación por razón de orientación sexual, identidad sexual, expresión de género y características sexuales, siempre que exista vinculación con el objeto del contrato.</p><p><b>4.</b> Los contratos se ajustarán al contenido de los pliegos de cláusulas administrativas particulares, cuyas cláusulas se consideran parte integrante de los mismos.</p><p><b>5.</b> La aprobación de los pliegos de cláusulas administrativas particulares corresponderá al órgano de contratación, que podrá, asimismo, aprobar modelos de pliegos particulares para determinadas categorías de contratos de naturaleza análoga.</p><p><b>6.</b> La Junta Consultiva de Contratación Pública del Estado deberá informar con carácter previo todos los pliegos de cláusulas administrativas particulares en que se proponga la inclusión de estipulaciones contrarias a los correspondientes pliegos generales.</p><p><b>7.</b> En la Administración General del Estado, sus Organismos Autónomos, Entidades Gestoras y Servicios Comunes de la Seguridad Social y demás Administraciones Públicas integrantes del sector público estatal, la aprobación de los pliegos y de los modelos requerirá el informe previo del Servicio Jurídico respectivo. Este informe no será necesario cuando el pliego de cláusulas administrativas particulares se ajuste a un modelo de pliego que haya sido previamente objeto de este informe.</p><div class=\"box warn\" style=\"margin-top:.7rem\"><span class=\"lbl\">Nota del BOE al pie del precepto · no forma parte del texto articulado</span><p>Téngase en cuenta que se declara que el párrafo primero del apartado 2 no es conforme con el orden constitucional de competencias, salvo los incisos relativos a la necesidad de incluir «los pactos y condiciones definidores de los derechos y obligaciones de las partes del contrato» y «En el caso de contratos mixtos, se detallará el régimen jurídico aplicable a sus efectos, cumplimiento y extinción, atendiendo a las normas aplicables a las diferentes prestaciones fusionadas en ellos», en los términos del fundamento jurídico 7 A) d), por la Sentencia del TC 68/2021, de 18 de marzo. Ref. BOE-A-2021-6614</p></div>", "dis": "<ul>\n<li><b>Momento de aprobación (122.1):</b> <b>previamente</b> a la autorización del gasto o <b>conjuntamente</b> con ella, y <b>siempre antes de la licitación</b> o, si no la hay, antes de la adjudicación.</li>\n<li><b>Modificación posterior (122.1):</b> solo por <b>error material, de hecho o aritmético</b>. En otro caso, la modificación del pliego conlleva la <span class=\"t\" data-k=\"retro\">retroacción de actuaciones</span>.</li>\n<li><b>Contenido (122.2):</b> criterios de <span class=\"t\" data-k=\"solvencia\">solvencia</span> y de <b>adjudicación</b>; consideraciones sociales, laborales y ambientales; los <b>pactos y condiciones definidores de los derechos y obligaciones</b> de las partes; la previsión de <b>cesión del contrato</b>; la obligación de cumplir las <b>condiciones salariales</b> del convenio sectorial; y las demás menciones exigidas por la ley. En contratos <b>mixtos</b>, el régimen jurídico aplicable a efectos, cumplimiento y extinción.</li>\n<li><b>Propiedad intelectual e industrial y protección de datos:</b> los pliegos pueden especificar la exigencia de transferencia de derechos y <b>deben</b> mencionar expresamente la obligación de respetar la normativa de protección de datos.</li>\n<li><b>Valor contractual:</b> el PCAP y el documento en que se formaliza el contrato son <b>ley entre las partes</b>: lo que dice el pliego vincula a la Administración y al contratista.</li>\n</ul>", "llano": "<p>El pliego de cláusulas administrativas particulares es el reglamento del contrato: dice quién puede presentarse, cómo se puntúa, qué obligaciones tiene el que gane y qué pasa si incumple.</p>\n<p>Se aprueba antes de licitar y, una vez publicado, <b>ya no se toca</b>: si hay un error de fondo, hay que retroceder y volver a empezar. Solo se corrigen erratas y cuentas mal hechas.</p>", "porque": "<p>Porque las empresas preparan sus ofertas leyendo el pliego. Si el pliego pudiera cambiarse durante la licitación, quien ya presentó su oferta habría competido con unas reglas y los demás con otras. La <b>inmodificabilidad</b> del pliego es, en el fondo, el principio de igualdad de trato aplicado al tiempo.</p>\n<p>Por eso el remedio es drástico: no se «parchea» el pliego, se <b>retrotraen actuaciones</b>.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> las bases de un concurso de fotografía. Si a mitad de plazo cambian el tamaño mínimo exigido, quien ya envió su foto queda fuera injustamente.</li>\n<li><b>Real:</b> en el PCAP del servicio de limpieza de seis colegios se detecta, tres días después de publicarlo, que la suma de las ponderaciones de los criterios da 105 en vez de 100. Es un <b>error aritmético</b>: se corrige sin retroacción, publicando la corrección en el perfil y ampliando el plazo si procede.</li>\n<li><b>Caso límite:</b> en el mismo pliego se advierte que se exigió una clasificación empresarial improcedente para un contrato de servicios. No es error material: es un <b>vicio de fondo</b>. Procede la <b>retroacción de actuaciones</b> al momento de aprobación del pliego.</li>\n</ul>", "noej": "<ul>\n<li><b>No es el PPT.</b> El pliego de <b>prescripciones técnicas</b> describe la prestación; el PCAP fija el régimen jurídico y económico.</li>\n<li><b>No cabe</b> modificar el pliego después de la licitación por un cambio de criterio del órgano: solo por error material, de hecho o aritmético.</li>\n<li><b>No puede</b> el documento contractual añadir obligaciones que no estén en el pliego (art. 35.2).</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 116.3:</b> el PCAP se incorpora al expediente.</li>\n<li><b>Art. 124 y 126:</b> pliego de prescripciones técnicas y sus límites.</li>\n<li><b>Art. 35.2:</b> el contrato no puede apartarse de los pliegos.</li>\n<li><b>Art. 44.2.a):</b> los pliegos son acto <b>recurrible</b> en recurso especial.</li>\n<li><b>Art. 101.5:</b> el método de cálculo del valor estimado figura en el PCAP.</li>\n<li><b>Art. 107.1:</b> la exención de garantía definitiva se justifica en el PCAP.</li>\n</ul>", "trampas": "<ul>\n<li>Momento: <b>antes o a la vez</b> que la autorización del gasto, y <b>siempre antes</b> de licitar.</li>\n<li>Modificación: <b>solo</b> error <b>material, de hecho o aritmético</b>. Cualquier otra cosa, retroacción.</li>\n<li>El PCAP es impugnable por <b>recurso especial</b> cuando el contrato entra en el art. 44: es la vía natural para atacar un pliego a medida.</li>\n</ul>", "ancla": "<p><b>«El pliego, antes; y después, ni una coma que no sea una errata.»</b></p>\n<p>Para separar PCAP y PPT: <b>PCAP = las reglas del juego</b> (quién juega, cómo se puntúa). <b>PPT = de qué es el partido</b> (qué hay que entregar y con qué características).</p>", "vis": "<svg viewBox=\"0 0 960 390\" role=\"img\" aria-label=\"Aprobación, contenido y modificación del pliego de cláusulas administrativas particulares\" style=\"width:100%;height:auto\"><defs><marker id=\"fl11\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr11\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe11\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw11\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"250\" y=\"8\" width=\"460\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"27.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">EL PLIEGO DE CLÁUSULAS ADMINISTRATIVAS PARTICULARES · ART. 122</text><rect x=\"20\" y=\"52\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"30\" y=\"66\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"120\" y=\"83\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--acc)\">CUÁNDO SE APRUEBA</text><text x=\"224\" y=\"74\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Antes de la autorización del gasto o conjuntamente con ella,</text><text x=\"224\" y=\"88\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">y SIEMPRE antes de la licitación o, si no la hay, de la adjudicación.</text><text x=\"930\" y=\"74\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">122.1</text><path d=\"M480 107 L 480 115\" stroke=\"var(--acc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl11)\"/><rect x=\"20\" y=\"116\" width=\"920\" height=\"68\" rx=\"10\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><rect x=\"30\" y=\"137\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--ej)\"/><text x=\"120\" y=\"154\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--ej)\">QUÉ CONTIENE</text><text x=\"224\" y=\"138\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Criterios de solvencia y de adjudicación · consideraciones sociales,</text><text x=\"224\" y=\"152\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">laborales y ambientales · pactos y condiciones definidores de derechos y</text><text x=\"224\" y=\"166\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">obligaciones · previsión de cesión · convenio colectivo aplicable.</text><text x=\"930\" y=\"138\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">122.2</text><path d=\"M480 185 L 480 193\" stroke=\"var(--ej)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl11)\"/><rect x=\"20\" y=\"194\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><rect x=\"30\" y=\"208\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--ej)\"/><text x=\"120\" y=\"225\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--ej)\">ADEMÁS</text><text x=\"224\" y=\"216\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Puede exigir la transferencia de derechos de propiedad intelectual o</text><text x=\"224\" y=\"230\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">industrial y DEBE mencionar la obligación de respetar la protección de datos.</text><text x=\"930\" y=\"216\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">122.2</text><path d=\"M480 249 L 480 257\" stroke=\"var(--ej)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl11)\"/><rect x=\"20\" y=\"258\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"30\" y=\"272\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"120\" y=\"289\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--warn)\">SI HAY ERROR MATERIAL</text><text x=\"224\" y=\"280\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Se corrige. Error material, de hecho o aritmético: es la única</text><text x=\"224\" y=\"294\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">modificación posible una vez aprobado.</text><text x=\"930\" y=\"280\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">122.1</text><path d=\"M480 313 L 480 321\" stroke=\"var(--warn)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl11)\"/><rect x=\"20\" y=\"322\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><rect x=\"30\" y=\"336\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--exc)\"/><text x=\"120\" y=\"353\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--exc)\">SI HAY OTRO VICIO</text><text x=\"224\" y=\"344\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">RETROACCIÓN DE ACTUACIONES al momento de aprobación del pliego.</text><text x=\"224\" y=\"358\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">No se parchea: se vuelve atrás.</text><text x=\"930\" y=\"344\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">122.1</text></svg>"}, {"n": 123, "t": "Pliego de prescripciones técnicas generales", "ubic": "Libro II ▸ Título I ▸ Capítulo I ▸ Sección 2.ª · Pliegos", "idea": "Los establece el Consejo de Ministros previo informe de la Junta Consultiva, solo para el sector público estatal.", "literal": "<p>Previo informe de la Junta Consultiva de Contratación Pública del Estado, el Consejo de Ministros, a propuesta del Ministro correspondiente, podrá establecer los pliegos de prescripciones técnicas generales a que hayan de ajustarse la Administración General del Estado, sus Organismos Autónomos, Entidades Gestoras y Servicios Comunes de la Seguridad Social y demás entidades que gocen de la condición de Administraciones Públicas integrantes del sector público estatal.</p>", "dis": "<ul>\n<li><b>Quién:</b> el <b>Consejo de Ministros</b>, <b>a propuesta del Ministro correspondiente</b>.</li>\n<li><b>Trámite previo:</b> <b>informe de la Junta Consultiva de Contratación Pública del Estado</b>.</li>\n<li><b>Destinatarios:</b> la <b>Administración General del Estado</b>, sus organismos autónomos, entidades gestoras y servicios comunes de la <b>Seguridad Social</b> y demás entidades con condición de Administraciones Públicas integrantes del <b>sector público estatal</b>.</li>\n<li><b>Naturaleza:</b> es una facultad —«<b>podrá</b> establecer»—, no una obligación.</li>\n</ul>", "llano": "<p>Igual que hay cláusulas administrativas generales, puede haber prescripciones técnicas generales: modelos técnicos que valen para muchos contratos del Estado. Los aprueba el Consejo de Ministros, pero aquí el informe previo no es del Consejo de Estado, sino de la <b>Junta Consultiva de Contratación Pública</b>.</p>", "porque": "<p>Porque el contenido es <b>técnico</b>, no jurídico: qué características debe reunir un asfalto, un uniforme o un servidor. Quien tiene el conocimiento acumulado sobre eso es la Junta Consultiva de Contratación Pública, no el Consejo de Estado.</p>\n<p>Y estandarizar lo técnico tiene un efecto anticorrupción evidente: si las prescripciones de un tipo de suministro están fijadas con carácter general, es más difícil escribirlas a medida de un proveedor.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> las normas UNE de un producto. No las escribe cada comprador: existen ya, y basta con remitirse a ellas.</li>\n<li><b>Real:</b> un pliego de prescripciones técnicas generales aprobado por el Consejo de Ministros para el suministro de vehículos del parque móvil del Estado fija las categorías, emisiones máximas y equipamiento de seguridad. Cada contrato concreto se remite a él y solo detalla el número y el destino de los vehículos.</li>\n<li><b>Caso límite:</b> una diputación no puede aprobar un pliego de prescripciones técnicas <b>generales</b> por esta vía: el art. 123 solo habilita al Consejo de Ministros y para el sector público <b>estatal</b>. Sí puede, en cambio, aprobar sus propias prescripciones técnicas <b>particulares</b> (art. 124) para cada contrato.</li>\n</ul>", "noej": "<ul>\n<li><b>No interviene</b> el Consejo de Estado: el informe es de la <b>Junta Consultiva</b>.</li>\n<li><b>No alcanza</b> a comunidades autónomas ni entidades locales: su ámbito es el <b>sector público estatal</b>.</li>\n<li><b>No es obligatorio</b> aprobarlos: la ley dice «podrá».</li>\n<li><b>No sustituye</b> al pliego de prescripciones técnicas particulares del art. 124.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 121:</b> pliegos de cláusulas administrativas generales, con dictamen del Consejo de Estado.</li>\n<li><b>Art. 124:</b> pliego de prescripciones técnicas particulares.</li>\n<li><b>Art. 126:</b> reglas para establecer las prescripciones técnicas, aplicables también a estas.</li>\n<li><b>Art. 328:</b> Junta Consultiva de Contratación Pública del Estado.</li>\n</ul>", "trampas": "<ul>\n<li>El informe previo es de la <b>Junta Consultiva</b>, no del Consejo de Estado. Esta es la pregunta.</li>\n<li>Ámbito <b>estatal</b> exclusivamente.</li>\n<li>Es <b>potestativo</b>.</li>\n</ul>", "ancla": "<p>Tabla de dos entradas que resuelve los arts. 121 a 124: <b>administrativo / técnico</b> por un lado, <b>general / particular</b> por otro.</p>\n<p>Y los informes: <b>Consejo de Estado</b> para el administrativo general; <b>Junta Consultiva</b> para el técnico general.</p>", "vis": "<svg viewBox=\"0 0 960 356\" role=\"img\" aria-label=\"Los cuatro tipos de pliego: generales y particulares, administrativos y técnicos\" style=\"width:100%;height:auto\"><defs><marker id=\"fl12\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr12\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe12\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw12\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"250\" y=\"8\" width=\"460\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"27.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">LOS CUATRO PLIEGOS · ARTS. 121 A 124</text><rect x=\"20\" y=\"52\" width=\"219.5\" height=\"236\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"129.75\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--acc)\">CLÁUSULAS ADMINISTRATIVAS</text><text x=\"129.75\" y=\"91\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--acc)\">GENERALES · art. 121</text><text x=\"129.75\" y=\"106\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Los aprueba el CONSEJO DE</text><text x=\"129.75\" y=\"121\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">MINISTROS, a iniciativa de</text><text x=\"129.75\" y=\"136\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">los ministerios y a</text><text x=\"129.75\" y=\"151\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">propuesta del Ministro de</text><text x=\"129.75\" y=\"166\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Hacienda, previo DICTAMEN</text><text x=\"129.75\" y=\"181\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">DEL CONSEJO DE ESTADO</text><text x=\"129.75\" y=\"196\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"129.75\" y=\"211\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">CCAA y entidades locales:</text><text x=\"129.75\" y=\"226\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">según sus normas, previo</text><text x=\"129.75\" y=\"241\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">dictamen del Consejo de</text><text x=\"129.75\" y=\"256\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Estado u órgano consultivo</text><text x=\"129.75\" y=\"271\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">autonómico equivalente</text><rect x=\"253.5\" y=\"52\" width=\"219.5\" height=\"236\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"363.25\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--ej)\">CLÁUSULAS ADMINISTRATIVAS</text><text x=\"363.25\" y=\"91\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--ej)\">PARTICULARES · art. 122</text><text x=\"363.25\" y=\"106\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Los aprueba el ÓRGANO DE</text><text x=\"363.25\" y=\"121\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">CONTRATACIÓN</text><text x=\"363.25\" y=\"136\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"363.25\" y=\"151\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Antes de la autorización</text><text x=\"363.25\" y=\"166\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">del gasto o junto con ella,</text><text x=\"363.25\" y=\"181\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">y SIEMPRE antes de licitar</text><text x=\"363.25\" y=\"196\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"363.25\" y=\"211\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Solo se modifican por error</text><text x=\"363.25\" y=\"226\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">material, de hecho o</text><text x=\"363.25\" y=\"241\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">aritmético; en otro caso,</text><text x=\"363.25\" y=\"256\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">RETROACCIÓN</text><rect x=\"487\" y=\"52\" width=\"219.5\" height=\"236\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"596.75\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--warn)\">PRESCRIPCIONES TÉCNICAS</text><text x=\"596.75\" y=\"91\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--warn)\">GENERALES · art. 123</text><text x=\"596.75\" y=\"106\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Los establece el CONSEJO DE</text><text x=\"596.75\" y=\"121\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">MINISTROS, a propuesta del</text><text x=\"596.75\" y=\"136\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Ministro correspondiente,</text><text x=\"596.75\" y=\"151\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">PREVIO INFORME DE LA JUNTA</text><text x=\"596.75\" y=\"166\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">CONSULTIVA DE CONTRATACIÓN</text><text x=\"596.75\" y=\"181\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">PÚBLICA DEL ESTADO</text><text x=\"596.75\" y=\"196\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"596.75\" y=\"211\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Para la AGE, organismos</text><text x=\"596.75\" y=\"226\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">autónomos, entidades</text><text x=\"596.75\" y=\"241\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">gestoras y servicios comunes</text><text x=\"596.75\" y=\"256\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">de la Seguridad Social</text><rect x=\"720.5\" y=\"52\" width=\"219.5\" height=\"236\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"830.25\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--warn)\">PRESCRIPCIONES TÉCNICAS</text><text x=\"830.25\" y=\"91\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--warn)\">PARTICULARES · art. 124</text><text x=\"830.25\" y=\"106\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Los aprueba el ÓRGANO DE</text><text x=\"830.25\" y=\"121\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">CONTRATACIÓN, en el mismo</text><text x=\"830.25\" y=\"136\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">momento que el PCAP</text><text x=\"830.25\" y=\"151\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"830.25\" y=\"166\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Definen las CALIDADES y las</text><text x=\"830.25\" y=\"181\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">CONDICIONES SOCIALES Y</text><text x=\"830.25\" y=\"196\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">AMBIENTALES de la prestación</text><text x=\"830.25\" y=\"211\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"830.25\" y=\"226\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Misma regla de modificación:</text><text x=\"830.25\" y=\"241\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">solo error material, si no,</text><text x=\"830.25\" y=\"256\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">retroacción</text><rect x=\"20\" y=\"298\" width=\"920\" height=\"48\" rx=\"8\" fill=\"var(--panel)\" stroke=\"var(--line)\"/><text x=\"480\" y=\"318.828\" text-anchor=\"middle\" font-size=\"10.4\" fill=\"currentColor\">Regla para no confundirlos: ADMINISTRATIVO = reglas jurídicas y económicas · TÉCNICO = qué hay que entregar.</text><text x=\"480\" y=\"331.828\" text-anchor=\"middle\" font-size=\"10.4\" fill=\"currentColor\">GENERAL = lo aprueba el Consejo de Ministros para muchos contratos · PARTICULAR = lo aprueba el órgano de contratación para ESTE contrato.</text></svg>"}, {"n": 124, "t": "Pliego de prescripciones técnicas particulares", "ubic": "Libro II ▸ Título I ▸ Capítulo I ▸ Sección 2.ª · Pliegos", "idea": "El órgano de contratación lo aprueba antes de licitar y solo lo corrige por error material.", "literal": "<p>El órgano de contratación aprobará con anterioridad a la autorización del gasto o conjuntamente con ella, y siempre antes de la licitación del contrato, o de no existir esta, antes de su adjudicación, los pliegos y documentos que contengan las prescripciones técnicas particulares que hayan de regir la realización de la prestación y definan sus calidades, sus condiciones sociales y ambientales, de conformidad con los requisitos que para cada contrato establece la presente Ley, y solo podrán ser modificados con posterioridad por error material, de hecho o aritmético. En otro caso, la modificación del pliego conllevará la retroacción de actuaciones.</p>", "dis": "<ul>\n<li><b>Quién y cuándo:</b> el <b>órgano de contratación</b> lo aprobará «con <b>anterioridad a la autorización del gasto o conjuntamente con ella</b>, y <b>siempre antes de la licitación</b> del contrato, o de no existir esta, <b>antes de su adjudicación</b>».</li>\n<li><b>Qué contiene:</b> los pliegos y documentos con las <span class=\"t\" data-k=\"ppt\">prescripciones técnicas particulares</span> que hayan de regir la realización de la prestación y <b>definan sus calidades</b>, sus <b>condiciones sociales y ambientales</b>, conforme a los requisitos que para cada contrato establece la ley.</li>\n<li><b>Modificación:</b> «solo podrán ser modificados con posterioridad por <b>error material, de hecho o aritmético</b>. En otro caso, la modificación del pliego conllevará la <b>retroacción de actuaciones</b>».</li>\n</ul>", "llano": "<p>Es el pliego que dice <b>qué</b> se compra: las calidades, las características, las condiciones sociales y ambientales de la prestación. Lo aprueba el órgano de contratación en el mismo momento que el PCAP y, una vez publicado, no se toca salvo erratas.</p>", "porque": "<p>Porque el PPT es donde se define el objeto, y el objeto es lo que determina quién puede ofertar. Cambiarlo después de publicado alteraría la competencia igual que cambiar las reglas del PCAP. Por eso la ley le aplica <b>exactamente el mismo régimen de inmodificabilidad</b> que al art. 122: solo error material, de hecho o aritmético, y en otro caso retroacción.</p>\n<p>Y la mención expresa a las <b>condiciones sociales y ambientales</b> convierte al PPT en el instrumento donde se materializa la contratación pública estratégica.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> la lista de la compra frente a las condiciones de pago. El PPT es la lista: qué producto, de qué calidad, con qué características.</li>\n<li><b>Real:</b> en el suministro de 40 ordenadores, el PPT aprobado junto con el PCAP exige procesador con una puntuación mínima en un índice objetivo, 16 GB de RAM, SSD de 512 GB, consumo en reposo inferior a 8 W y accesibilidad conforme al RD Legislativo 1/2013. Ninguna marca.</li>\n<li><b>Caso límite:</b> tres días después de publicarlo se advierte que el PPT pide «512 MB» en vez de «512 GB». Es un <b>error material</b>: se corrige y se publica la corrección, sin retroacción. Si en cambio se quisiera cambiar la RAM de 16 a 8 GB, sería un cambio de fondo: <b>retroacción de actuaciones</b>.</li>\n</ul>", "noej": "<ul>\n<li><b>No es el PCAP:</b> el PCAP fija las reglas jurídicas y económicas; el PPT, el objeto y sus calidades.</li>\n<li><b>No lo aprueba</b> el Consejo de Ministros: eso es el general del art. 123.</li>\n<li><b>No cabe</b> modificarlo por cambio de criterio: solo error material, de hecho o aritmético.</li>\n<li><b>No puede</b> designar marcas, por aplicación del art. 126.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 122:</b> PCAP, con idéntica regla de aprobación y modificación.</li>\n<li><b>Art. 123:</b> prescripciones técnicas generales.</li>\n<li><b>Art. 126:</b> reglas de fondo para establecer las prescripciones técnicas.</li>\n<li><b>Art. 116.3:</b> el PPT se incorpora al expediente.</li>\n<li><b>Art. 44.2.a):</b> el PPT es acto recurrible en recurso especial.</li>\n</ul>", "trampas": "<ul>\n<li>Momento de aprobación <b>idéntico</b> al del PCAP: antes de la autorización del gasto o junto con ella, y siempre antes de licitar.</li>\n<li>Modificación: <b>solo error material, de hecho o aritmético</b>; si no, retroacción.</li>\n<li>Define <b>calidades</b> y <b>condiciones sociales y ambientales</b>: los dos sustantivos que la ley cita expresamente.</li>\n</ul>", "ancla": "<p><b>PCAP = las reglas del juego · PPT = de qué es el partido.</b></p>\n<p>Y los dos comparten el mismo cerrojo: <b>solo erratas; lo demás, atrás</b>.</p>", "vis": "<svg viewBox=\"0 0 960 356\" role=\"img\" aria-label=\"Los cuatro tipos de pliego: generales y particulares, administrativos y técnicos\" style=\"width:100%;height:auto\"><defs><marker id=\"fl13\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr13\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe13\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw13\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"250\" y=\"8\" width=\"460\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"27.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">LOS CUATRO PLIEGOS · ARTS. 121 A 124</text><rect x=\"20\" y=\"52\" width=\"219.5\" height=\"236\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"129.75\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--acc)\">CLÁUSULAS ADMINISTRATIVAS</text><text x=\"129.75\" y=\"91\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--acc)\">GENERALES · art. 121</text><text x=\"129.75\" y=\"106\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Los aprueba el CONSEJO DE</text><text x=\"129.75\" y=\"121\" text-anchor=\"middle\" font-size=\"9.8\" fill=\

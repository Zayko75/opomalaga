{n:15,t:"Contrato de concesión de servicios",ubic:"Título Preliminar (Disposiciones generales) ▸ Capítulo II (Contratos del sector público) ▸ Sección 1.ª (Delimitación de los tipos contractuales)",idea:"Concesión de servicios: gestionas un servicio ajeno cobrando por explotarlo, con riesgo.",literal:`<p>1. El contrato de concesión de servicios es aquel en cuya virtud uno o varios poderes adjudicadores encomiendan a título oneroso a una o varias personas, naturales o jurídicas, la gestión de un servicio cuya prestación sea de su titularidad o competencia, y cuya contrapartida venga constituida bien por el derecho a explotar los servicios objeto del contrato o bien por dicho derecho acompañado del de percibir un precio.</p><p>2. El derecho de explotación de los servicios implicará la transferencia al concesionario del riesgo operacional, en los términos señalados en el apartado cuarto del artículo anterior.</p>`,dis:`<ul>
<li><b>Sujetos:</b> uno o varios <b>poderes adjudicadores</b> encomiendan <b>a título oneroso</b> a una o varias personas físicas o jurídicas.</li>
<li><b>Objeto:</b> la <b>gestión de un servicio cuya prestación sea de su titularidad o competencia</b>.</li>
<li><b>Contrapartida:</b> el <b>derecho a explotar los servicios</b>, solo o acompañado del <b>derecho a percibir un precio</b>.</li>
<li><b>15.2 — riesgo:</b> el derecho de explotación implica la transferencia del <span class="t" data-k="riesgo">riesgo operacional</span> <b>en los términos del art. 14.4</b>.</li>
</ul>
<table><thead><tr><th></th><th>Concesión de servicios (art. 15)</th><th>Contrato de servicios (art. 17)</th></tr></thead><tbody>
<tr><th>Quién paga</th><td>Principalmente los usuarios (explotación)</td><td>La Administración</td></tr>
<tr><th>Riesgo</th><td><b>Del concesionario</b></td><td>De la Administración</td></tr>
<tr><th>Objeto</th><td>Gestión de un servicio de su titularidad o competencia</td><td>Prestación de hacer</td></tr>
</tbody></table>`,llano:`<p>Es la hermana de la concesión de obras, pero sin obra: aquí lo que se entrega es la gestión de un servicio que es competencia de la Administración. La empresa lo explota y se cobra de los usuarios, corriendo el riesgo. Si en cambio le paga la Administración una cantidad cierta por prestar el servicio, entonces es un contrato de servicios.</p>`,porque:`<p>La LCSP de 2017 <b>suprimió el contrato de gestión de servicios públicos</b> y trasladó su contenido a esta figura, por exigencia de la Directiva 2014/23/UE. El criterio ya no es la titularidad pública del servicio ni la técnica de gestión, sino un dato económico verificable: <b>quién soporta el riesgo</b>. Así se evita que un mismo negocio reciba tratamientos distintos según el nombre que le dé cada Administración.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> quien alquila un bar de un polideportivo y vive de lo que venda, frente a quien cobra un sueldo por atender la barra.</li>
<li><b>Real:</b> concesión del servicio de escuela infantil municipal, en la que el concesionario cobra las cuotas de las familias y asume el riesgo de matriculación.</li>
<li><b>Caso límite:</b> servicio de recogida de residuos retribuido íntegramente por el ayuntamiento con un precio fijo mensual: no hay riesgo de demanda ni de suministro, luego es <b>contrato de servicios</b>, no concesión.</li>
</ul>`,noej:`<ul>
<li><b>No es concesión de servicios</b> el contrato retribuido en su totalidad por la Administración con independencia del uso.</li>
<li><b>No es concesión de servicios</b> la relación con el usuario que abona una tarifa: eso está excluido (art. 11.2).</li>
<li><b>No puede tener por objeto</b> servicios que impliquen ejercicio de autoridad inherente a los poderes públicos (art. 17, aplicable por identidad de razón).</li>
</ul>`,conex:`<ul>
<li><b>Art. 14.4:</b> definición del riesgo operacional, aplicable por remisión.</li>
<li><b>Art. 17:</b> contrato de servicios, su figura de contraste.</li>
<li><b>Art. 284 y ss.:</b> régimen del contrato de concesión de servicios.</li>
<li><b>Art. 29.6:</b> plazos máximos de las concesiones.</li>
</ul>`,trampas:`<ul>
<li>El encargo lo hacen <b>poderes adjudicadores</b>, no cualquier entidad del sector público.</li>
<li>El servicio debe ser de su <b>titularidad o competencia</b>.</li>
<li>El riesgo se define <b>por remisión</b> al art. 14.4: no hay definición propia.</li>
<li>La existencia de un <b>precio</b> pagado por la Administración no excluye la concesión mientras subsista el riesgo.</li>
</ul>`,ancla:`<p><b>"¿Quién pierde si nadie viene?"</b> Si pierde el contratista, concesión. Si pierde la Administración, contrato de servicios.</p>`,vis:`<svg viewBox="0 0 640 165" role="img" aria-label="Concesión de servicios frente a contrato de servicios">
<rect x="25" y="30" width="270" height="105" rx="8" fill="var(--ej-bg)" stroke="var(--ej)"/>
<text x="160" y="52" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ej)">CONCESIÓN DE SERVICIOS</text>
<text x="160" y="74" text-anchor="middle" font-size="10" fill="currentColor">se cobra explotando el servicio</text>
<text x="160" y="92" text-anchor="middle" font-size="10" fill="currentColor">(con o sin precio añadido)</text>
<text x="160" y="115" text-anchor="middle" font-size="11" font-weight="700" fill="var(--exc)">RIESGO del concesionario</text>
<rect x="345" y="30" width="270" height="105" rx="8" fill="var(--warn-bg)" stroke="var(--warn)"/>
<text x="480" y="52" text-anchor="middle" font-size="12" font-weight="700" fill="var(--warn)">CONTRATO DE SERVICIOS</text>
<text x="480" y="74" text-anchor="middle" font-size="10" fill="currentColor">retribución cierta pagada</text>
<text x="480" y="92" text-anchor="middle" font-size="10" fill="currentColor">por la Administración</text>
<text x="480" y="115" text-anchor="middle" font-size="11" font-weight="700" fill="var(--acc)">RIESGO de la Administración</text>
<text x="320" y="20" text-anchor="middle" font-size="10" fill="var(--ink2)">La frontera es el riesgo operacional del art. 14.4, no el nombre del contrato</text>
<text x="320" y="155" text-anchor="middle" font-size="16" fill="var(--ink2)">⇄</text>
</svg>`},
{n:16,t:"Contrato de suministro",ubic:"Título Preliminar (Disposiciones generales) ▸ Capítulo II (Contratos del sector público) ▸ Sección 1.ª (Delimitación de los tipos contractuales)",idea:"Suministro: adquirir o arrendar productos o bienes muebles, con cuatro casos claros.",literal:`<p>1. Son contratos de suministro los que tienen por objeto la adquisición, el arrendamiento financiero, o el arrendamiento, con o sin opción de compra, de productos o bienes muebles.</p><p>2. Sin perjuicio de lo dispuesto en la letra b) del apartado 3 de este artículo respecto de los contratos que tengan por objeto programas de ordenador, no tendrán la consideración de contrato de suministro los contratos relativos a propiedades incorporales o valores negociables.</p><p>3. En todo caso, se considerarán contratos de suministro los siguientes:</p><p>a) Aquellos en los que el empresario se obligue a entregar una pluralidad de bienes de forma sucesiva y por precio unitario sin que la cuantía total se defina con exactitud al tiempo de celebrar el contrato, por estar subordinadas las entregas a las necesidades del adquirente.</p><p>b) Los que tengan por objeto la adquisición y el arrendamiento de equipos y sistemas de telecomunicaciones o para el tratamiento de la información, sus dispositivos y programas, y la cesión del derecho de uso de estos últimos, en cualquiera de sus modalidades de puesta</p><p>a disposición, a excepción de los contratos de adquisición de programas de ordenador desarrollados a medida, que se considerarán contratos de servicios.</p><p>c) Los de fabricación, por los que la cosa o cosas que hayan de ser entregadas por el empresario deban ser elaboradas con arreglo a características peculiares fijadas previamente por la entidad contratante, aun cuando esta se obligue a aportar, total o parcialmente, los materiales precisos.</p><p>d) Los que tengan por objeto la adquisición de energía primaria o energía transformada.</p>`,dis:`<ul>
<li><b>16.1 — objeto:</b> <b>adquisición</b>, <b>arrendamiento financiero</b> o <b>arrendamiento con o sin opción de compra</b> de <b>productos o bienes muebles</b>.</li>
<li><b>16.2 — exclusión:</b> no son suministro los contratos sobre <b>propiedades incorporales o valores negociables</b>, salvo lo previsto en la letra b) del apartado 3 para los programas de ordenador.</li>
<li><b>16.3 — en todo caso son suministro:</b>
<ol><li><b>a)</b> entrega <b>sucesiva y por precio unitario</b> sin cuantía total definida con exactitud, por estar subordinadas las entregas a las necesidades del adquirente;</li>
<li><b>b)</b> adquisición y arrendamiento de <b>equipos y sistemas de telecomunicaciones o para el tratamiento de la información</b>, sus dispositivos y programas, y la cesión del derecho de uso de estos, <b>excepto</b> los programas de ordenador <b>desarrollados a medida</b>, que son contratos de <b>servicios</b>;</li>
<li><b>c)</b> los de <b>fabricación</b> con arreglo a características peculiares fijadas por la entidad contratante, aunque esta aporte total o parcialmente los materiales;</li>
<li><b>d)</b> la adquisición de <b>energía primaria o energía transformada</b>.</li></ol></li>
</ul>`,llano:`<p>Suministro es comprar cosas que se pueden mover: ordenadores, sillas, vehículos, energía. También alquilarlas. La ley aclara cuatro casos que siempre son suministro, incluido el más traicionero: el software estándar es suministro, pero el software hecho a medida es un servicio.</p>`,porque:`<p>El listado del 16.3 existe porque son los <b>casos frontera</b> que generaban litigios: el suministro "abierto" por precio unitario podía confundirse con un servicio; la informática, con la consultoría; la fabricación por encargo, con la obra. Fijar la calificación por ley evita que cada órgano de contratación resuelva a su manera y con distinto régimen de publicidad.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> comprar una lavadora es suministro; que te diseñen una cocina a medida ya es otra cosa.</li>
<li><b>Real:</b> contrato para el suministro de material de oficina durante dos años por precio unitario, según las necesidades de cada dependencia: suministro del art. 16.3.a).</li>
<li><b>Real:</b> licencias de un programa de gestión estándar: suministro (16.3.b). Desarrollo de una aplicación municipal a medida: contrato de <b>servicios</b>.</li>
<li><b>Caso límite:</b> compra de energía eléctrica para los edificios municipales: suministro por el 16.3.d), aunque intuitivamente pueda parecer un servicio.</li>
</ul>`,noej:`<ul>
<li><b>No es suministro</b> la compra de un edificio: es negocio patrimonial excluido (art. 9.2).</li>
<li><b>No es suministro</b> el software <b>desarrollado a medida</b>: es contrato de servicios.</li>
<li><b>No es suministro</b> un contrato sobre valores negociables o propiedades incorporales, salvo el caso de los programas de ordenador.</li>
</ul>`,conex:`<ul>
<li><b>Art. 9.2:</b> exclusión patrimonial y su excepción de programas de ordenador.</li>
<li><b>Art. 21:</b> umbrales SARA de los contratos de suministro.</li>
<li><b>Art. 17:</b> contrato de servicios, su frontera natural.</li>
<li><b>Art. 29.4:</b> plazo máximo de duración de los contratos de suministro y servicios.</li>
</ul>`,trampas:`<ul>
<li><b>Software estándar = suministro; software a medida = servicios.</b> Es la pregunta clásica.</li>
<li>La <b>fabricación por encargo</b> es suministro aunque la Administración aporte los materiales.</li>
<li>La <b>energía</b> —primaria o transformada— es suministro.</li>
<li>El suministro incluye el <b>arrendamiento</b>, financiero o no, con o sin opción de compra.</li>
</ul>`,ancla:`<p><b>"Si se mueve y lo compras o lo alquilas, es suministro."</b><br>Los cuatro casos del 16.3 — <b>"SITE"</b>: <b>S</b>ucesivo por precio unitario · <b>I</b>nformática · <b>T</b>rabajo de fabricación por encargo · <b>E</b>nergía.</p>`,vis:`<svg viewBox="0 0 640 175" role="img" aria-label="Contrato de suministro y sus cuatro casos">
<rect x="185" y="10" width="270" height="34" rx="8" fill="var(--warn-bg)" stroke="var(--warn)"/>
<text x="320" y="32" text-anchor="middle" font-size="12" font-weight="700" fill="var(--warn)">SUMINISTRO: productos o bienes muebles</text>
<g font-size="10" text-anchor="middle" fill="currentColor">
<rect x="15" y="60" width="145" height="58" rx="8" fill="var(--panel)" stroke="var(--line)"/><text x="87" y="82" font-weight="700">a) Entregas sucesivas</text><text x="87" y="100">por precio unitario</text>
<rect x="172" y="60" width="145" height="58" rx="8" fill="var(--panel)" stroke="var(--line)"/><text x="244" y="82" font-weight="700">b) Informática y</text><text x="244" y="100">telecomunicaciones</text>
<rect x="329" y="60" width="145" height="58" rx="8" fill="var(--panel)" stroke="var(--line)"/><text x="401" y="82" font-weight="700">c) Fabricación</text><text x="401" y="100">por encargo</text>
<rect x="486" y="60" width="139" height="58" rx="8" fill="var(--panel)" stroke="var(--line)"/><text x="555" y="82" font-weight="700">d) Energía</text><text x="555" y="100">primaria o transformada</text>
</g>
<rect x="110" y="130" width="420" height="36" rx="8" fill="var(--exc-bg)" stroke="var(--exc)"/>
<text x="320" y="153" text-anchor="middle" font-size="11" fill="var(--exc)">Programas de ordenador A MEDIDA → contrato de SERVICIOS, no suministro</text>
</svg>`},
{n:17,t:"Contrato de servicios",ubic:"Título Preliminar (Disposiciones generales) ▸ Capítulo II (Contratos del sector público) ▸ Sección 1.ª (Delimitación de los tipos contractuales)",idea:"Servicios: prestaciones de hacer, y nunca las que impliquen ejercicio de autoridad.",literal:`<p>Son contratos de servicios aquellos cuyo objeto son prestaciones de hacer consistentes en el desarrollo de una actividad o dirigidas a la obtención de un resultado distinto de una obra o suministro, incluyendo aquellos en que el adjudicatario se obligue a ejecutar el servicio de forma sucesiva y por precio unitario.</p><p>No podrán ser objeto de estos contratos los servicios que impliquen ejercicio de la autoridad inherente a los poderes públicos.</p>`,dis:`<ul>
<li><b>Concepto:</b> contratos cuyo objeto son <b>prestaciones de hacer</b> consistentes en el desarrollo de una <b>actividad</b> o dirigidas a la obtención de un <b>resultado distinto de una obra o suministro</b>.</li>
<li><b>Modalidad incluida:</b> aquellos en que el adjudicatario se obligue a ejecutar el servicio <b>de forma sucesiva y por precio unitario</b>.</li>
<li><b>Prohibición absoluta:</b> no pueden ser objeto de estos contratos <b>los servicios que impliquen ejercicio de la autoridad inherente a los poderes públicos</b>.</li>
</ul>`,llano:`<p>Servicios es el cajón de las prestaciones de hacer: limpiar, vigilar, redactar un proyecto, dar un curso, mantener un sistema. Es un tipo residual: si no es obra ni suministro pero alguien hace algo, es servicio. Y hay una línea roja: no se puede contratar fuera lo que implique mandar, autorizar o sancionar en nombre del poder público.</p>`,porque:`<p>La prohibición de externalizar el <b>ejercicio de autoridad</b> protege un principio constitucional: las potestades públicas se ejercen por quien tiene legitimidad y responsabilidad públicas. Un particular puede ayudar materialmente a tramitar, pero no puede decidir por la Administración: quien firma una multa o una licencia debe ser un servidor público.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> puedes contratar a alguien para que te ordene los papeles, pero no para que firme por ti.</li>
<li><b>Real:</b> contrato de limpieza de dependencias municipales, de mantenimiento de zonas verdes o de redacción de un plan de movilidad: contratos de servicios.</li>
<li><b>Caso límite:</b> auxilio material en la tramitación de expedientes sancionadores (grabación de datos, notificaciones): posible como servicio. Ahora bien, la <b>propuesta de resolución</b> y la <b>firma</b> del expediente sancionador implican ejercicio de autoridad y no pueden externalizarse.</li>
</ul>`,noej:`<ul>
<li><b>No es contrato de servicios</b> la concesión de servicios: allí hay explotación y riesgo (art. 15).</li>
<li><b>No cabe</b> contratar como servicio la función interventora, la potestad sancionadora o la autorización de gasto.</li>
<li><b>No es servicio</b> el suministro de software estándar (art. 16.3.b), aunque sí el desarrollado a medida.</li>
</ul>`,conex:`<ul>
<li><b>Art. 15:</b> concesión de servicios, su figura gemela con riesgo.</li>
<li><b>Art. 22:</b> umbrales SARA de los contratos de servicios, incluidos los 750.000 € de servicios sociales del Anexo IV.</li>
<li><b>Art. 308.2:</b> prohibición de que los contratos de servicios impliquen relación laboral encubierta.</li>
<li><b>Art. 29.4:</b> duración máxima de cinco años, prórrogas incluidas, con excepciones.</li>
</ul>`,trampas:`<ul>
<li>La definición es <b>residual</b>: resultado <b>distinto</b> de una obra o suministro.</li>
<li>La prohibición del ejercicio de autoridad es <b>absoluta</b> y aparece en el propio art. 17.</li>
<li>Incluye expresamente la modalidad de ejecución <b>sucesiva y por precio unitario</b>, igual que el suministro del 16.3.a).</li>
</ul>`,ancla:`<p><b>"Hacer sin construir ni entregar."</b> Y la línea roja: <b>autoridad, nunca</b>.</p>`,vis:`<svg viewBox="0 0 640 150" role="img" aria-label="Contrato de servicios y su límite">
<rect x="80" y="25" width="480" height="52" rx="8" fill="var(--acc-soft)" stroke="var(--acc)"/>
<text x="320" y="47" text-anchor="middle" font-size="12" font-weight="700" fill="var(--acc)">CONTRATO DE SERVICIOS</text>
<text x="320" y="66" text-anchor="middle" font-size="10" fill="currentColor">prestaciones de hacer: actividad o resultado distinto de obra o suministro</text>
<rect x="80" y="90" width="480" height="46" rx="8" fill="var(--exc-bg)" stroke="var(--exc)"/>
<text x="320" y="110" text-anchor="middle" font-size="11" font-weight="700" fill="var(--exc)">LÍMITE ABSOLUTO</text>
<text x="320" y="128" text-anchor="middle" font-size="10" fill="currentColor">no pueden ser objeto los servicios que impliquen ejercicio de la autoridad inherente a los poderes públicos</text>
</svg>`},
{n:18,t:"Contratos mixtos",ubic:"Título Preliminar (Disposiciones generales) ▸ Capítulo II (Contratos del sector público) ▸ Sección 1.ª (Delimitación de los tipos contractuales)",idea:"Contrato mixto: manda la prestación principal, y si son separables, el valor decide.",literal:`<p>1. Se entenderá por contrato mixto aquel que contenga prestaciones correspondientes a otro u otros de distinta clase.</p><p>Únicamente podrán celebrarse contratos mixtos en las condiciones establecidas en el artículo 34.2 de la presente Ley.</p><p>El régimen jurídico de la preparación y adjudicación de los contratos mixtos se determinará de conformidad con lo establecido en este artículo; y el de sus efectos, cumplimiento y extinción se determinará de acuerdo con lo dispuesto en el artículo 122.2.</p><p>Para la determinación de las normas que regirán la adjudicación de los contratos mixtos cuyo objeto contenga prestaciones de varios contratos regulados en esta Ley, se estará a las siguientes reglas:</p><p>a) Cuando un contrato mixto comprenda prestaciones propias de dos o más contratos de obras, suministros o servicios se atenderá al carácter de la prestación principal.</p><p>En el caso de los contratos mixtos que comprendan en parte servicios especiales del anexo IV, y en parte otros servicios, o en el caso de los contratos mixtos compuestos en parte por servicios y en parte por suministros, el objeto principal se determinará en función de cuál sea el mayor de los valores estimados de los respectivos servicios o suministros.</p><p>b) Cuando el contrato mixto contenga prestaciones de los contratos de obras, suministros o servicios, por una parte, y contratos de concesiones de obra o concesiones de servicios, de otra, se actuará del siguiente modo:</p><p>1.º Si las distintas prestaciones no son separables se atenderá al carácter de la prestación principal.</p><p>2.º Si las distintas prestaciones son separables y se decide adjudicar un contrato único, se aplicarán las normas relativas a los contratos de obras, suministros o servicios cuando el valor estimado de las prestaciones correspondientes a estos contratos supere las cuantías establecidas en los artículos 20, 21 y 22 de la presente Ley, respectivamente. En otro caso, se aplicarán las normas relativas a los contratos de concesión de obras y concesión de servicios.</p><p>2. Cuando el contrato mixto contemple prestaciones de contratos regulados en esta Ley con prestaciones de otros contratos distintos de los regulados en la misma, para determinar las normas aplicables a su adjudicación se atenderá a las siguientes reglas:</p><p>a) Si las distintas prestaciones no son separables se atenderá al carácter de la prestación principal.</p><p>b) Si las prestaciones son separables y se decide celebrar un único contrato, se aplicará lo dispuesto en esta Ley.</p><p>3. No obstante lo establecido en el apartado 1, en los casos en que un elemento del contrato mixto sea una obra y esta supere los 50.000 euros, deberá elaborarse un proyecto y tramitarse de conformidad con los artículos 231 y siguientes de la presente Ley.</p><p>En el supuesto de que el contrato mixto contenga elementos de una concesión de obras o de una concesión de servicios, deberá acompañarse del correspondiente estudio de viabilidad y, en su caso, del anteproyecto de construcción y explotación de las obras previstos en los artículos 247, 248 y 285 de la presente Ley.</p>`,dis:`<ul>
<li><b>Concepto:</b> el que contiene prestaciones correspondientes a <b>otro u otros contratos de distinta clase</b>. Solo cabe en las condiciones del <b>art. 34.2</b> (vinculación y complementariedad).</li>
<li><b>Régimen:</b> preparación y adjudicación por este artículo; <b>efectos, cumplimiento y extinción</b> por el <b>art. 122.2</b>.</li>
</ul>
<table><thead><tr><th>Supuesto</th><th>Regla de adjudicación</th></tr></thead><tbody>
<tr><td><b>18.1.a)</b> Prestaciones de dos o más contratos de obras, suministros o servicios</td><td>Carácter de la <b>prestación principal</b>. En mixtos de servicios especiales del Anexo IV con otros servicios, o de servicios con suministros: el objeto principal se determina por el <b>mayor valor estimado</b></td></tr>
<tr><td><b>18.1.b) 1.º</b> Obras/suministros/servicios + concesiones, prestaciones <b>no separables</b></td><td>Carácter de la <b>prestación principal</b></td></tr>
<tr><td><b>18.1.b) 2.º</b> Las mismas, <b>separables</b> y contrato único</td><td>Normas de obras, suministros o servicios <b>si su valor estimado supera</b> los umbrales de los arts. 20, 21 y 22; en otro caso, normas de las concesiones</td></tr>
<tr><td><b>18.2.a)</b> Contratos regulados + contratos no regulados, <b>no separables</b></td><td>Carácter de la <b>prestación principal</b></td></tr>
<tr><td><b>18.2.b)</b> Los mismos, <b>separables</b> y contrato único</td><td>Se aplica <b>esta ley</b></td></tr>
</tbody></table>
<div class="box warn"><span class="lbl">Regla del 18.3</span>Si un elemento del contrato mixto es una <b>obra</b> y supera los <b>50.000 euros</b>, debe elaborarse <b>proyecto</b> y tramitarse conforme a los arts. 231 y siguientes. Si contiene elementos de concesión de obras o de servicios, se acompañará el <b>estudio de viabilidad</b> y, en su caso, el anteproyecto (arts. 247, 248 y 285).</div>`,llano:`<p>A veces un contrato mezcla cosas: obra más mantenimiento, suministro más instalación. La ley da un criterio general —manda lo principal— y otro cuando las partes se pueden separar pero se decide contratarlas juntas: entonces gana la parte cuyo valor supere los umbrales europeos. Y si hay obra por más de 50.000 €, hace falta proyecto.</p>`,porque:`<p>Sin reglas de mixtos, bastaría con añadir una prestación pequeña de otro tipo para cambiar el régimen aplicable y esquivar los umbrales. Las reglas obligan a mirar la <b>realidad económica</b> —qué pesa más— en lugar del rótulo. La exigencia de proyecto para obras superiores a 50.000 € impide que una obra relevante se cuele como accesorio sin control técnico.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> compras un aire acondicionado con instalación incluida: lo que domina es el aparato, no la instalación.</li>
<li><b>Real:</b> contrato de suministro e instalación de calderas por 400.000 €, de los que 320.000 € son equipos y 80.000 € obra civil: la prestación principal es el <b>suministro</b>. Pero como el elemento de obra supera los 50.000 €, hay que elaborar <b>proyecto</b> (art. 18.3).</li>
<li><b>Caso límite:</b> contrato que une la construcción de un edificio y su explotación en régimen de concesión, con prestaciones separables. Si el valor estimado de la obra supera el umbral del art. 20, se aplican las normas del contrato de <b>obras</b>; si no, las de la <b>concesión</b>.</li>
</ul>`,noej:`<ul>
<li><b>No cabe</b> cualquier mixto: solo en las condiciones del art. 34.2 (vinculación y complementariedad).</li>
<li><b>No se determina</b> el régimen por el nombre que se dé al contrato, sino por la prestación principal o por el valor estimado.</li>
</ul>`,conex:`<ul>
<li><b>Art. 34.2:</b> requisitos para unir prestaciones en un mismo contrato.</li>
<li><b>Art. 122.2:</b> régimen de efectos, cumplimiento y extinción de los mixtos.</li>
<li><b>Arts. 20, 21 y 22:</b> umbrales a los que remite la regla 18.1.b) 2.º</li>
<li><b>Art. 99:</b> objeto del contrato, lotes y prohibición de fraccionamiento.</li>
</ul>`,trampas:`<ul>
<li>Regla general: <b>prestación principal</b>. Excepción: cuando son <b>separables</b> y hay concesiones de por medio, decide el <b>valor estimado</b> frente a los umbrales.</li>
<li>En mixtos de <b>servicios del Anexo IV</b> con otros servicios, o de servicios con suministros, el objeto principal se fija por el <b>mayor valor estimado</b>, no por la importancia cualitativa.</li>
<li>La cifra que hay que recordar: <b>50.000 euros</b> de elemento de obra obligan a proyecto.</li>
<li>Preparación y adjudicación por el art. 18; efectos y extinción por el art. 122.2.</li>
</ul>`,ancla:`<p><b>"Manda lo principal; si se pueden separar, manda el valor."</b><br>Y la cifra: <b>50.000 €</b> de obra → proyecto obligatorio.</p>`,vis:`<svg viewBox="0 0 640 200" role="img" aria-label="Reglas de los contratos mixtos">
<defs><marker id="mx" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="var(--acc)"/></marker></defs>

{n:19,t:"Delimitación general",ubic:"Título Preliminar (Disposiciones generales) ▸ Capítulo II (Contratos del sector público) ▸ Sección 2.ª (Contratos sujetos a una regulación armonizada)",idea:"Son SARA los contratos de poder adjudicador que llegan al umbral europeo, salvo excepciones.",literal:`<p>1. Son contratos sujetos a una regulación armonizada los contratos de obras, los de concesión de obras, los de concesión de servicios, los de suministro, y los de servicios, cuyo valor estimado, calculado conforme a las reglas que se establecen en el artículo 101, sea igual o superior a las cuantías que se indican en los artículos siguientes, siempre que la entidad contratante tenga el carácter de poder adjudicador. Tendrán también la consideración de contratos sujetos a regulación armonizada los contratos subvencionados por estas entidades a los que se refiere el artículo 23.</p><p>2. No obstante lo señalado en el apartado anterior, no se consideran sujetos a regulación armonizada, cualquiera que sea su valor estimado, los contratos siguientes:</p><p>a) Los que tengan por objeto la adquisición, el desarrollo, la producción o la coproducción de programas destinados a servicios de comunicación audiovisual o servicios de comunicación radiofónica, que sean adjudicados por proveedores del servicio de comunicación audiovisual o radiofónica, o los relativos al tiempo de radiodifusión o al suministro de programas que sean adjudicados a proveedores del servicio de comunicación audiovisual o radiofónica. A efectos de la presente letra, por «servicio de comunicación audiovisual» y «proveedor del servicio de comunicación» se entenderá, respectivamente, lo mismo que en el artículo 1, apartado 1, letras a) y d), de la Directiva 2010/13/UE, del Parlamento Europeo y del Consejo, de 10 de marzo de 2010, sobre la coordinación de determinadas disposiciones legales, reglamentarias y administrativas de los Estados miembros relativas a la prestación de servicios de comunicación audiovisual. Por «programa» se entenderá lo mismo que en el artículo 1, apartado 1, letra b), de dicha Directiva, si bien se incluirán también los programas radiofónicos y los contenidos de los programas radiofónicos. Además, a efectos de la presente disposición, «contenidos del programa» tendrá el mismo significado que «programa».</p><p>b) Los incluidos dentro del ámbito definido por el artículo 346 del Tratado de Funcionamiento de la Unión Europea que se concluyan en el sector de la defensa.</p><p>c) Los declarados secretos o reservados, o aquellos cuya ejecución deba ir acompañada de medidas de seguridad especiales conforme a la legislación vigente, o en los que lo exija la protección de intereses esenciales para la seguridad del Estado, cuando la protección de los intereses esenciales de que se trate no pueda garantizarse mediante la aplicación de las normas que rigen los contratos sujetos a regulación armonizada en esta Ley.</p><p>La declaración de que concurre la circunstancia relativa a la protección de intereses esenciales para la seguridad del Estado deberá hacerse de forma expresa en cada caso por el titular del Departamento ministerial del que dependa el órgano de contratación en el ámbito de la Administración General del Estado, sus Organismos Autónomos, Entidades Gestoras y Servicios Comunes de la Seguridad Social y demás entidades públicas integrantes del sector público estatal, por el órgano competente de las Comunidades Autónomas, de las Ciudades Autónomas de Ceuta y Melilla, o por el órgano al que esté atribuida la competencia para celebrar el correspondiente contrato en las Entidades locales. La competencia para efectuar esta declaración no será susceptible de delegación, salvo que una ley expresamente lo autorice.</p><p>d) Aquellos cuyo objeto principal sea permitir a los órganos de contratación la puesta a disposición o la explotación de redes públicas de comunicaciones o la prestación al público de uno o varios servicios de comunicaciones electrónicas. A efectos del presente apartado «red pública de comunicaciones» y «servicio de comunicaciones electrónicas» tendrán el mismo significado que el que figura en la Directiva 2002/21/CE, del Parlamento Europeo y del Consejo, de 7 de marzo de 2002, relativa a un marco regulador común de las redes y los servicios de comunicaciones electrónicas.</p><p>e) Aquellos que tengan por objeto cualquiera de los siguientes servicios jurídicos:</p><p>1.º La representación y defensa legal de un cliente por un procurador o un abogado, ya sea en un arbitraje o una conciliación celebrada en un Estado o ante una instancia internacional de conciliación o arbitraje, o ya sea en un procedimiento judicial ante los órganos jurisdiccionales o las autoridades públicas de un Estado o ante órganos jurisdiccionales o instituciones internacionales.</p><p>2.º El asesoramiento jurídico prestado como preparación de uno de los procedimientos mencionados en el apartado anterior de la presente letra, o cuando exista una probabilidad alta de que el asunto sobre el que se asesora será objeto de dichos procedimientos, siempre que el asesoramiento lo preste un abogado.</p><p>3.º Los servicios de certificación y autenticación de documentos que deban ser prestados por un notario público.</p><p>4.º Los servicios jurídicos prestados por administradores, tutores u otros servicios jurídicos cuyos prestadores sean designados por un órgano jurisdiccional o designados por ley para desempeñar funciones específicas bajo la supervisión de dichos órganos jurisdiccionales.</p><p>5.º Otros servicios jurídicos que estén relacionados, incluso de forma ocasional, con el ejercicio del poder público.</p><p>f) Los que tengan por objeto servicios de defensa civil, protección civil y prevención de riesgos laborales prestados por organizaciones o asociaciones sin ánimo de lucro e incluidos en los siguientes códigos CPV: 75250000-3, 75251000-0, 75251100-1, 75251110-4, 75251120-7, 75252000-7, 75222000- 8; 98113100-9; 85143000-3, salvo los servicios de transporte en ambulancia de pacientes.</p><p>g) Los que tengan por objeto servicios públicos de transporte de viajeros por ferrocarril o en metro, así como las concesiones de servicios de transporte de viajeros, sin perjuicio de la aplicación del Reglamento (UE) n.º 1370/2007, del Parlamento Europeo y del Consejo, de 23 de octubre de 2007, sobre los servicios públicos de transporte de viajeros por ferrocarril y carretera y por el que se derogan los Reglamentos (CEE) n.º 1191/69 y (CEE) n.º 1107/70 del Consejo.</p><p>h) Los contratos de concesión adjudicados para:</p><p>1.º La puesta a disposición o la explotación de redes fijas destinadas a prestar un servicio al público en relación con la producción, el transporte o la distribución de agua potable;</p><p>2.º El suministro de agua potable a dichas redes.</p><p>Asimismo, tampoco se considerarán sujetos a regulación armonizada los contratos de concesión que se refieran a uno de los objetos siguientes o a ambos que estén relacionadas con una de las actividades contempladas en los números 1.º y 2.º anteriores:</p><p>I. Proyectos de ingeniería hidráulica, irrigación o drenaje, siempre que el volumen de agua destinado al abastecimiento de agua potable represente más del 20 por ciento del volumen total de agua disponible gracias a dichos proyectos o a dichas instalaciones de irrigación o drenaje, o</p><p>II. Eliminación o tratamiento de aguas residuales.</p>`,dis:`<ul>
<li><b>19.1 — requisitos acumulativos:</b>
<ol><li><b>tipo:</b> obras, concesión de obras, concesión de servicios, suministro o servicios;</li>
<li><b><span class="t" data-k="valorest">valor estimado</span></b> calculado conforme al <b>art. 101</b> <b>igual o superior</b> a los umbrales de los arts. 20 a 22;</li>
<li><b>sujeto:</b> que la entidad contratante sea <b>poder adjudicador</b>.</li></ol>
También son SARA los <b>contratos subvencionados</b> del art. 23.</li>
<li><b>19.2 — nunca son SARA, cualquiera que sea su valor estimado:</b> a) programas para servicios de comunicación audiovisual o radiofónica y tiempo de radiodifusión; b) los del art. 346 TFUE en el sector de la defensa; c) los <b>declarados secretos o reservados</b> o con medidas de seguridad especiales o que exijan proteger intereses esenciales para la seguridad del Estado, <b>con declaración expresa</b> del titular del Departamento ministerial u órgano competente; d) puesta a disposición o explotación de <b>redes públicas de comunicaciones</b>; e) determinados <b>servicios jurídicos</b> (representación y defensa legal, asesoramiento preparatorio prestado por abogado, certificación notarial, designaciones judiciales y servicios relacionados con el ejercicio del poder público); f) <b>defensa civil, protección civil y prevención de riesgos laborales</b> prestados por entidades sin ánimo de lucro con los CPV listados, <b>salvo transporte en ambulancia de pacientes</b>; g) transporte público de viajeros por <b>ferrocarril o metro</b> y concesiones de transporte de viajeros; h) concesiones sobre <b>redes de agua potable</b> y su suministro, y proyectos hidráulicos con más del <b>20 %</b> de agua destinada a abastecimiento, o tratamiento de aguas residuales.</li>
</ul>`,llano:`<p>SARA significa que el contrato es lo bastante grande como para que le apliquen las reglas europeas: más publicidad, plazos propios y recurso especial. Para serlo hacen falta tres cosas a la vez: que sea de uno de los cinco tipos, que llegue al umbral y que quien contrate sea poder adjudicador. Aun así, hay una lista de materias que nunca son SARA, por muy caras que sean: defensa, secretos, audiovisual, ciertos servicios jurídicos, protección civil sin ánimo de lucro, ferrocarril y agua.</p>`,porque:`<p>El umbral es la traducción práctica de un principio europeo: solo los contratos con <b>interés transfronterizo cierto</b> justifican el coste de un procedimiento armonizado. Por debajo, cada Estado regula. Las exclusiones del 19.2 responden a razones distintas —seguridad, pluralismo informativo, confianza personal en el abogado, altruismo de las entidades de protección civil— pero todas ellas están tasadas y son de interpretación estricta.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> los trámites de una compra grande no son los de una pequeña: a partir de cierto importe, todo se formaliza más.</li>
<li><b>Real:</b> un ayuntamiento licita un contrato de servicios de limpieza por valor estimado de 900.000 €: supera el umbral de 216.000 € del art. 22.1.b) y es <b>SARA</b>, con anuncio en el <i>Diario Oficial de la Unión Europea</i> y recurso especial.</li>
<li><b>Caso límite:</b> contratación de la defensa jurídica del ayuntamiento en un pleito por 300.000 €: pese a superar el umbral, <b>no es SARA</b> por el art. 19.2.e) 1.º</li>
</ul>`,noej:`<ul>
<li><b>No es SARA</b> el contrato de una entidad del sector público que <b>no sea poder adjudicador</b>, por elevado que sea su importe.</li>
<li><b>No es SARA</b> ningún contrato de los enumerados en el 19.2, cualquiera que sea su valor.</li>
<li><b>No basta</b> el precio del contrato: se mide por <b>valor estimado</b> del art. 101, que incluye prórrogas y modificaciones previstas.</li>
</ul>`,conex:`<ul>
<li><b>Art. 101:</b> reglas de cálculo del valor estimado.</li>
<li><b>Arts. 20 a 23:</b> los umbrales concretos.</li>
<li><b>Art. 44:</b> recurso especial en materia de contratación, ligado en buena medida a los SARA.</li>
<li><b>Art. 3.3:</b> concepto de poder adjudicador.</li>
</ul>`,trampas:`<ul>
<li>Es <b>igual o superior</b> al umbral: alcanzar la cifra exacta ya convierte el contrato en SARA.</li>
<li>Se mide por <b>valor estimado</b> (art. 101), no por presupuesto base de licitación ni por precio de adjudicación.</li>
<li>La letra f) del 19.2 <b>excluye de la exclusión</b> el transporte en ambulancia de pacientes: ese sí puede ser SARA.</li>
<li>Los contratos <b>secretos o reservados</b> exigen <b>declaración expresa</b> del órgano competente en cada caso.</li>
</ul>`,ancla:`<p><b>Tres llaves para ser SARA:</b> <b>tipo</b> + <b>umbral</b> + <b>poder adjudicador</b>. Si falta una, no hay SARA.<br>Y la lista negra del 19.2, ocho letras: <b>audiovisual, defensa, secretos, redes, jurídicos, protección civil, ferrocarril y agua</b>.</p>`,vis:`<svg viewBox="0 0 640 195" role="img" aria-label="Requisitos para que un contrato sea SARA">

</g>

<text x="320" y="181" text-anchor="middle" font-size="10" fill="currentColor">audiovisual · defensa · secretos · redes de comunicaciones · servicios jurídicos · protección civil · ferrocarril y metro · agua</text>
</svg>`},
{n:20,t:"Contratos de obras, de concesión de obras y de concesión de servicios sujetos a una regulación armonizada: Umbral",ubic:"Título Preliminar (Disposiciones generales) ▸ Capítulo II (Contratos del sector público) ▸ Sección 2.ª (Contratos sujetos a una regulación armonizada)",idea:"Obras y concesiones: umbral único de 5.404.000 euros de valor estimado.",literal:`<p>1. Están sujetos a regulación armonizada los contratos de obras, de concesión de obras y de concesión de servicios cuyo valor estimado sea igual o superior a 5.404.000 euros.</p><p>2. En el supuesto previsto en el artículo 101.12 relativo al cálculo del valor estimado en los contratos de obras que se adjudiquen por lotes separados, cuando el valor acumulado de los lotes en que se divida la obra iguale o supere la cantidad indicada en el apartado anterior, se aplicarán las normas de la regulación armonizada a la adjudicación de cada lote.</p><p>No obstante lo dispuesto en el párrafo anterior, los órganos de contratación podrán exceptuar de estas normas a los lotes cuyo valor estimado sea inferior a un millón de euros, siempre que el importe acumulado de los lotes exceptuados no sobrepase el 20 por 100 del valor acumulado de la totalidad de los mismos.</p>`,dis:`<ul>
<li><b>20.1 — umbral:</b> obras, concesión de obras y concesión de servicios con valor estimado <b>igual o superior a 5.404.000 euros</b>.</li>
<li><b>20.2 — lotes (art. 101.12):</b> si el <b>valor acumulado</b> de los lotes alcanza esa cifra, la regulación armonizada se aplica <b>a cada lote</b>. No obstante, cabe exceptuar los lotes de valor estimado <b>inferior a 1.000.000 de euros</b>, siempre que el importe acumulado de los exceptuados <b>no sobrepase el 20 %</b> del valor acumulado de la totalidad.</li>
</ul>
<div class="interp"><span class="lbl">Interpretación / contexto — aportación externa</span>Los umbrales europeos se <b>revisan cada dos años</b> mediante reglamentos delegados de la Comisión, que son directamente aplicables aunque el texto español no se modifique. Por eso la cifra vigente en el momento de licitar puede no coincidir con la que figura en el texto consolidado. Para el examen, memoriza la cifra <b>literal de la ley</b> y ten presente esta advertencia.</div>`,llano:`<p>Por encima de cinco millones y pico, una obra o una concesión juega en la liga europea. Y si el contrato se divide en lotes, se suman todos para ver si se llega al umbral: no vale trocear para quedarse debajo. Solo se permite dejar fuera lotes pequeños, y con dos condiciones numéricas.</p>`,porque:`<p>El umbral único para obras y concesiones responde a que ambas comparten magnitud e interés transfronterizo. La <b>regla de los lotes</b> es la garantía antifraccionamiento: sin ella, dividir una obra de 6 millones en seis lotes de un millón dejaría fuera del control europeo toda la operación. La excepción del millón y del 20 % es una válvula de flexibilidad medida.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> las ofertas de envío gratis a partir de cierto importe: se mira el total del pedido, no cada artículo.</li>
<li><b>Real:</b> obra de renovación urbana con valor acumulado de 7 M€ dividida en cinco lotes. Todos los lotes son SARA. Se podrían exceptuar lotes inferiores a 1 M€ mientras la suma de los exceptuados no supere <b>1,4 M€</b> (el 20 % de 7 M€).</li>
<li><b>Caso límite:</b> concesión de servicios con valor estimado de 5.404.000 € exactos: <b>es SARA</b>, porque la ley dice "igual o superior".</li>
</ul>`,noej:`<ul>
<li><b>No se calcula</b> lote a lote para eludir el umbral: se parte del valor acumulado.</li>
<li><b>No cabe</b> exceptuar lotes de un millón o más.</li>
</ul>`,conex:`<ul>
<li><b>Art. 101.12:</b> cálculo del valor estimado en contratos por lotes.</li>
<li><b>Art. 99:</b> división en lotes y prohibición de fraccionamiento.</li>
<li><b>Art. 19.1:</b> remisión general a los umbrales.</li>
</ul>`,trampas:`<ul>
<li>El umbral es el mismo para <b>obras, concesión de obras y concesión de servicios</b>.</li>
<li>Los dos números de la excepción: lote <b>inferior a 1.000.000 €</b> y acumulado exceptuado <b>no superior al 20 %</b>.</li>
<li>"Igual o superior": la cifra exacta ya entra.</li>
</ul>`,ancla:`<p><b>5.404.000</b> para lo grande (obras y concesiones). Excepción de lotes: <b>1 millón y 20 %</b>.</p>`,vis:`<svg viewBox="0 0 640 155" role="img" aria-label="Umbral de obras y concesiones">
<rect x="140" y="20" width="360" height="46" rx="8" fill="var(--acc)" stroke="var(--acc)"/>
<text x="320" y="40" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">OBRAS · CONCESIÓN DE OBRAS · CONCESIÓN DE SERVICIOS</text>
<text x="320" y="58" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">≥ 5.404.000 €</text>
<rect x="60" y="82" width="520" height="60" rx="8" fill="var(--ej-bg)" stroke="var(--ej)"/>
<text x="320" y="102" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ej)">Regla de los lotes (20.2)</text>
<text x="320" y="120" text-anchor="middle" font-size="10" fill="currentColor">se suma el valor acumulado de todos los lotes → si alcanza el umbral, cada lote es SARA</text>
<text x="320" y="136" text-anchor="middle" font-size="10" fill="var(--exc)">excepción: lotes de menos de 1.000.000 € cuyo acumulado no supere el 20 % del total</text>
</svg>`},
{n:21,t:"Contratos de suministro sujetos a una regulación armonizada: Umbral",ubic:"Título Preliminar (Disposiciones generales) ▸ Capítulo II (Contratos del sector público) ▸ Sección 2.ª (Contratos sujetos a una regulación armonizada)",idea:"Suministros: 140.000 euros para el Estado y 216.000 para los demás.",literal:`<p>1. Están sujetos a regulación armonizada los contratos de suministro cuyo valor estimado sea igual o superior a las siguientes cantidades:</p><p>a) 140.000 euros, cuando se trate de contratos adjudicados por la Administración General del Estado, sus Organismos Autónomos, o las Entidades Gestoras y Servicios Comunes de la Seguridad Social. No obstante, cuando los contratos se adjudiquen por órganos de contratación que pertenezcan al sector de la defensa, este umbral solo se aplicará respecto de los contratos de suministro que tengan por objeto los productos enumerados en el anexo II.</p><p>b) 216.000 euros, cuando se trate de contratos de suministro distintos, por razón del sujeto contratante o por razón de su objeto, de los contemplados en la letra anterior.</p><p>2. En el supuesto previsto en el artículo 101.12 relativo al cálculo del valor estimado en los contratos que se adjudiquen por lotes separados, cuando el valor acumulado de los lotes en que se divida el suministro iguale o supere las cantidades indicadas en el apartado anterior, se aplicarán las normas de la regulación armonizada a la adjudicación de cada lote. No obstante, los órganos de contratación podrán exceptuar de estas normas a los lotes cuyo valor estimado sea inferior a 80.000 euros, siempre que el importe acumulado de los lotes exceptuados no sobrepase el 20 por 100 del valor acumulado de la totalidad de los mismos.</p>`,dis:`<table><thead><tr><th>Umbral</th><th>¿Quién adjudica?</th></tr></thead><tbody>
<tr><td><b>140.000 €</b></td><td>Administración General del Estado, sus Organismos Autónomos, o Entidades Gestoras y Servicios Comunes de la Seguridad Social. En el <b>sector de la defensa</b>, este umbral solo se aplica a los suministros de los productos del <b>Anexo II</b></td></tr>
<tr><td><b>216.000 €</b></td><td>Contratos de suministro <b>distintos</b>, por razón del sujeto contratante o de su objeto, de los anteriores. <i>Es el umbral que aplican las entidades locales</i></td></tr>
</tbody></table>
<ul>
<li><b>21.2 — lotes:</b> misma regla que en obras: si el valor acumulado alcanza el umbral, cada lote es SARA; cabe exceptuar lotes de valor estimado <b>inferior a 80.000 euros</b> si el importe acumulado de los exceptuados <b>no sobrepasa el 20 %</b> del valor acumulado total.</li>
</ul>`,llano:`<p>En los suministros hay dos cifras: la baja, 140.000 €, es para la Administración del Estado; la alta, 216.000 €, para todos los demás, incluidos ayuntamientos y diputaciones. La lógica de los lotes se repite, pero aquí el lote exceptuable es más pequeño: menos de 80.000 €.</p>`,porque:`<p>La distinción entre <b>autoridades centrales</b> y el resto viene de las directivas y del Acuerdo sobre Contratación Pública de la OMC: se exige más apertura a la Administración central porque su volumen de compra tiene mayor impacto en el mercado interior. Que las entidades locales apliquen el umbral alto es, por tanto, una consecuencia directa del derecho europeo, no una concesión del legislador español.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> distintos límites de gasto según quién firma: el director general tiene más margen que el jefe de sección.</li>
<li><b>Real:</b> un ayuntamiento licita el suministro de vehículos por valor estimado de 180.000 €: <b>no</b> es SARA (umbral aplicable: 216.000 €). Si lo licitara un ministerio, <b>sí</b> lo sería (umbral: 140.000 €).</li>
<li><b>Caso límite:</b> suministro dividido en cuatro lotes de 60.000 € cada uno (240.000 € acumulados) por una diputación: se supera el umbral de 216.000 €, luego <b>todos los lotes</b> son SARA, salvo la excepción de los lotes de menos de 80.000 € con el tope del 20 %.</li>
</ul>`,noej:`<ul>
<li><b>No aplican</b> las entidades locales el umbral de 140.000 €: ese es el de la Administración General del Estado y equiparados.</li>
<li><b>No se exceptúan</b> lotes de 80.000 € o más.</li>
</ul>`,conex:`<ul>
<li><b>Anexo II:</b> productos del sector de la defensa a los que se aplica el umbral bajo.</li>
<li><b>Art. 16:</b> concepto de contrato de suministro.</li>
<li><b>Art. 101.12:</b> valor estimado en contratación por lotes.</li>
</ul>`,trampas:`<ul>
<li>Las dos cifras y sus sujetos: <b>140.000</b> Estado · <b>216.000</b> los demás. Es la confusión más frecuente del tema.</li>
<li>El lote exceptuable en suministros y servicios es <b>inferior a 80.000 €</b>, no a un millón.</li>
<li>En defensa, el umbral de 140.000 € solo alcanza a los productos del <b>Anexo II</b>.</li>
</ul>`,ancla:`<p><b>"El Estado, más estricto."</b> <b>140</b> para el Estado, <b>216</b> para el resto. Y para lotes de suministros y servicios: <b>80.000 y 20 %</b>.</p>`,vis:`<svg viewBox="0 0 640 150" role="img" aria-label="Umbrales de los contratos de suministro">

<text x="165" y="84" text-anchor="middle" font-size="10" fill="currentColor">Entidades Gestoras y Servicios Comunes SS</text>

</svg>`},
{n:22,t:"Contratos de servicios sujetos a una regulación armonizada: umbral",ubic:"Título Preliminar (Disposiciones generales) ▸ Capítulo II (Contratos del sector público) ▸ Sección 2.ª (Contratos sujetos a una regulación armonizada)",idea:"Servicios: 140.000, 216.000 y 750.000 para los servicios sociales del Anexo IV.",literal:`<p>1. Están sujetos a regulación armonizada los contratos de servicios cuyo valor estimado sea igual o superior a las siguientes cantidades:</p><p>a) 140.000 euros, cuando los contratos hayan de ser adjudicados por la Administración General del Estado, sus Organismos Autónomos, o las Entidades Gestoras y Servicios Comunes de la Seguridad Social.</p><p>b) 216.000 euros, cuando los contratos hayan de adjudicarse por entidades del sector público distintas a la Administración General del Estado, sus Organismos Autónomos o las Entidades Gestoras y Servicios Comunes de la Seguridad Social.</p><p>c) 750.000 euros, cuando se trate de contratos que tengan por objeto los servicios sociales y otros servicios específicos enumerados en el anexo IV.</p><p>2. En el supuesto previsto en el artículo 101.12 relativo al cálculo del valor estimado en los contratos que se adjudiquen por lotes separados, cuando el valor acumulado de los lotes en que se divida la contratación de servicios iguale o supere los importes indicados en el apartado anterior, se aplicarán las normas de la regulación armonizada a la adjudicación de cada lote. No obstante, los órganos de contratación podrán exceptuar de estas normas a los lotes cuyo valor estimado sea inferior a 80.000 euros, siempre que el importe acumulado de los lotes exceptuados no sobrepase el 20 por 100 del valor acumulado de la totalidad de los mismos.</p>`,dis:`<table><thead><tr><th>Umbral</th><th>Supuesto</th></tr></thead><tbody>
<tr><td><b>140.000 €</b></td><td>Contratos adjudicados por la <b>Administración General del Estado</b>, sus Organismos Autónomos o las Entidades Gestoras y Servicios Comunes de la Seguridad Social</td></tr>
<tr><td><b>216.000 €</b></td><td>Contratos adjudicados por <b>entidades del sector público distintas</b> de las anteriores</td></tr>
<tr><td><b>750.000 €</b></td><td>Contratos que tengan por objeto <b>servicios sociales y otros servicios específicos</b> enumerados en el <b>Anexo IV</b></td></tr>
</tbody></table>
<ul>
<li><b>22.2 — lotes:</b> igual que en suministros: si el valor acumulado alcanza el umbral, cada lote es SARA; se pueden exceptuar lotes de valor estimado <b>inferior a 80.000 €</b> con el límite del <b>20 %</b> acumulado.</li>
</ul>`,llano:`<p>En servicios se repiten las dos cifras del suministro y aparece una tercera muy alta: 750.000 € para los servicios sociales y otros específicos del Anexo IV. La razón es que estos servicios se prestan casi siempre en el ámbito local y su interés transfronterizo es menor.</p>`,porque:`<p>Las directivas crearon un <b>régimen aligerado</b> para los servicios a las personas: sanidad, servicios sociales, educación, cultura. Son prestaciones muy vinculadas al territorio, a la lengua y a la confianza, donde la competencia transfronteriza es limitada. Elevar el umbral a 750.000 € reduce la carga procedimental sin renunciar a los principios generales.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> no exiges el mismo papeleo para contratar a un cuidador de confianza que para comprar cien ordenadores.</li>
<li><b>Real:</b> un ayuntamiento licita el servicio de ayuda a domicilio por valor estimado de 600.000 €: al ser servicio social del Anexo IV, <b>no</b> alcanza el umbral de 750.000 € y no es SARA. Un contrato de limpieza por 600.000 € en la misma entidad <b>sí</b> lo sería (umbral 216.000 €).</li>
<li><b>Caso límite:</b> contrato mixto de servicios del Anexo IV y otros servicios: conforme al art. 18.1.a), el objeto principal se determina por el <b>mayor valor estimado</b>, y de ahí saldrá el umbral aplicable.</li>
</ul>`,noej:`<ul>
<li><b>No aplica</b> el umbral de 750.000 € a cualquier servicio prestado a personas: solo a los enumerados en el <b>Anexo IV</b>.</li>
<li><b>No hay</b> tres umbrales en suministros: el de 750.000 € es exclusivo de servicios.</li>
</ul>`,conex:`<ul>
<li><b>Anexo IV:</b> catálogo de servicios sociales y otros servicios específicos.</li>
<li><b>Art. 18.1.a):</b> mixtos con servicios del Anexo IV.</li>
<li><b>Art. 17:</b> concepto de contrato de servicios.</li>
<li><b>Disposiciones adicionales sobre contratación de servicios a las personas.</b></li>
</ul>`,trampas:`<ul>
<li><b>Tres</b> umbrales en servicios frente a <b>dos</b> en suministros.</li>
<li>El de <b>750.000 €</b> exige que el objeto esté en el <b>Anexo IV</b>.</li>
<li>La letra b) habla de "entidades del sector público distintas": ahí entran las entidades locales.</li>
</ul>`,ancla:`<p><b>"140 · 216 · 750."</b> Las dos primeras se repiten desde el suministro; la tercera es la sorpresa: <b>servicios sociales del Anexo IV</b>.</p>`,vis:`<svg viewBox="0 0 640 150" role="img" aria-label="Umbrales de los contratos de servicios">

</svg>`},
{n:23,t:"Contratos subvencionados sujetos a una regulación armonizada",ubic:"Título Preliminar (Disposiciones generales) ▸ Capítulo II (Contratos del sector público) ▸ Sección 2.ª (Contratos sujetos a una regulación armonizada)",idea:"Contratos subvencionados: obra o servicio pagado en más del 50 % por un poder adjudicador.",literal:`<p>1. Son contratos subvencionados sujetos a una regulación armonizada los contratos de obras y los contratos de servicios definidos conforme a lo previsto en los artículos 13 y 17, respectivamente, que sean subvencionados, de forma directa y en más de un 50 por 100 de su importe, por entidades que tengan la consideración de poderes adjudicadores, siempre que pertenezcan a alguna de las categorías siguientes:</p><p>a) Contratos de obras que tengan por objeto actividades de ingeniería civil de la sección F, división 45, grupo 45.2 de la Nomenclatura General de Actividades Económicas de las Comunidades Europeas (NACE), o la construcción de hospitales, centros deportivos, recreativos o de ocio, edificios escolares o universitarios y edificios de uso administrativo, siempre que su valor estimado sea igual o superior a 5.404.000 euros.</p><p>b) Contratos de servicios vinculados a un contrato de obras de los definidos en la letra a), cuyo valor estimado sea igual o superior a 216.000 euros.</p><p>2. Las normas previstas para los contratos subvencionados se aplicarán a aquellos celebrados por particulares o por entidades del sector público que no tengan la</p><p>consideración de poderes adjudicadores, en conjunción, en este último caso, con las establecidas en el Título II del Libro Tercero de esta Ley. Cuando el contrato subvencionado se adjudique por entidades del sector público que tengan la consideración de poder adjudicador, se aplicarán las normas de contratación previstas para estas entidades, de acuerdo con su naturaleza, salvo la relativa a la determinación de la competencia para resolver el recurso especial en materia de contratación y para adoptar medidas cautelares en el procedimiento de adjudicación, que se regirá, en todo caso, por la regla establecida en el apartado 2 del artículo 47.</p>`,dis:`<ul>
<li><b>23.1 — requisitos:</b> contratos de <b>obras</b> (art. 13) o de <b>servicios</b> (art. 17) subvencionados <b>de forma directa</b> y en <b>más de un 50 %</b> de su importe por entidades que sean <b>poderes adjudicadores</b>, siempre que pertenezcan a alguna de estas categorías:
<ol><li><b>a) Obras:</b> actividades de ingeniería civil (NACE sección F, división 45, grupo 45.2) o construcción de <b>hospitales, centros deportivos, recreativos o de ocio, edificios escolares o universitarios y edificios de uso administrativo</b>, con valor estimado <b>igual o superior a 5.404.000 €</b>;</li>
<li><b>b) Servicios</b> vinculados a un contrato de obras de la letra a), con valor estimado <b>igual o superior a 216.000 €</b>.</li></ol></li>
<li><b>23.2 — a quién se aplican:</b> a los celebrados por <b>particulares</b> o por entidades del sector público que <b>no sean poder adjudicador</b> (en este caso, junto con el Título II del Libro Tercero). Si los adjudica una entidad que <b>sí</b> es poder adjudicador, se aplican sus propias normas, <b>salvo</b> la competencia para resolver el <b>recurso especial</b> y adoptar medidas cautelares.</li>
</ul>`,llano:`<p>Si una administración pone más de la mitad del dinero de una obra grande —un hospital, un colegio, un polideportivo— aunque quien contrate sea un particular, ese contrato tiene que licitarse con las reglas europeas. El dinero público arrastra las reglas públicas allá donde vaya.</p>`,porque:`<p>Sin esta regla bastaría con canalizar la contratación a través de una entidad privada subvencionada para dejar fuera del control europeo obras financiadas casi en su totalidad con fondos públicos. El criterio es puramente económico: <b>quien pone más de la mitad, impone las reglas</b>.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> si tus padres pagan el 70 % del piso, tienen algo que decir sobre cómo se compra.</li>
<li><b>Real:</b> una fundación privada construye un centro deportivo de 8 M€ subvencionado en un 60 % por una diputación: es <b>contrato subvencionado SARA</b> y debe licitarse conforme a la ley.</li>
<li><b>Caso límite:</b> el mismo centro deportivo, pero con subvención del 45 %: no alcanza el "más de un 50 %" y queda fuera del art. 23.</li>
</ul>`,noej:`<ul>
<li><b>No basta</b> con la subvención: la obra debe estar en las <b>categorías</b> de la letra a) y alcanzar el umbral.</li>
<li><b>No entran</b> los contratos de suministro subvencionados: el art. 23 solo alcanza a obras y servicios.</li>
<li><b>No es directa</b> cualquier ayuda: la subvención debe serlo <b>de forma directa</b>.</li>
</ul>`,conex:`<ul>
<li><b>Art. 2.2:</b> sujeción de los contratos subvencionados.</li>
<li><b>Art. 19.1:</b> los considera SARA.</li>
<li><b>Arts. 13 y 17:</b> definición de obras y servicios.</li>
<li><b>Art. 27.1.f):</b> jurisdicción contencioso-administrativa para su preparación, adjudicación y modificaciones.</li>
</ul>`,trampas:`<ul>
<li>Solo <b>obras y servicios</b>: nunca suministros.</li>
<li>Subvención <b>directa</b> y en <b>más de un 50 %</b>: no vale el 50 % exacto.</li>
<li>Dos umbrales: <b>5.404.000 €</b> para las obras y <b>216.000 €</b> para los servicios vinculados a ellas.</li>
<li>La lista de edificios es cerrada: hospitales, centros deportivos, recreativos o de ocio, edificios escolares o universitarios y de uso administrativo.</li>
</ul>`,ancla:`<p><b>"Más de la mitad, más las reglas."</b> Obras <b>5.404.000</b>, servicios vinculados <b>216.000</b>. Y solo esos dos tipos: <b>ni un suministro</b>.</p>`,vis:`<svg viewBox="0 0 640 175" role="img" aria-label="Contratos subvencionados sujetos a regulación armonizada">

{n:24,t:"Régimen jurídico aplicable a los contratos del sector público",ubic:"Título Preliminar (Disposiciones generales) ▸ Capítulo II (Contratos del sector público) ▸ Sección 3.ª (Contratos administrativos y contratos privados)",idea:"Todo contrato del sector público es administrativo o privado. No hay tercera vía.",literal:`<p>Los contratos del sector público podrán estar sometidos a un régimen jurídico de derecho administrativo o de derecho privado.</p>`,dis:`<ul>
<li><b>Regla:</b> los contratos del sector público <b>podrán estar sometidos a un régimen jurídico de derecho administrativo o de derecho privado</b>.</li>
<li><b>Función del artículo:</b> es el pórtico de la Sección 3.ª; anuncia la <b>summa divisio</b> que desarrollan los arts. 25 y 26 y de la que depende la jurisdicción del art. 27.</li>
</ul>`,llano:`<p>Un artículo de una línea, pero decisivo: todo contrato público cae en uno de dos mundos. En el administrativo manda la LCSP de principio a fin y los pleitos van al contencioso. En el privado, la ley controla cómo se elige al contratista, pero lo que pase después se rige por el derecho civil o mercantil.</p>`,porque:`<p>La distinción tiene consecuencias muy prácticas: <b>prerrogativas</b> (interpretar, modificar y resolver unilateralmente), <b>régimen de invalidez</b>, <b>recursos</b> y <b>jurisdicción</b>. Anunciarla en un artículo propio evita que se lea como un detalle técnico: es la bisagra del sistema.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> dos reglamentos distintos según en qué pista juegues, aunque el deporte se llame igual.</li>
<li><b>Real:</b> el mismo objeto —la limpieza de un edificio— será contrato <b>administrativo</b> si lo celebra un ayuntamiento y contrato <b>privado</b> si lo celebra su sociedad mercantil municipal.</li>
</ul>`,noej:`<ul>
<li><b>No existe</b> una categoría intermedia: o administrativo o privado.</li>
<li><b>No depende</b> del objeto únicamente: depende también del <b>sujeto</b> que contrata.</li>
</ul>`,conex:`<ul>
<li><b>Art. 25:</b> contratos administrativos. <b>Art. 26:</b> contratos privados.</li>
<li><b>Art. 27:</b> jurisdicción competente, consecuencia de la distinción.</li>
<li><b>Art. 3.2:</b> concepto de Administración Pública, que es la llave del art. 25.</li>
</ul>`,trampas:`<ul>
<li>El artículo dice "<b>podrán</b> estar sometidos": no crea la distinción, la anuncia.</li>
<li>La calificación se decide por la combinación <b>sujeto + objeto</b>.</li>
</ul>`,ancla:`<p><b>"Dos mundos y ninguno más."</b> Administrativo o privado: la frontera la marcan el sujeto (art. 3.2) y el objeto (art. 25.1).</p>`,vis:`<svg viewBox="0 0 640 130" role="img" aria-label="La summa divisio de los contratos del sector público">

{n:25,t:"Contratos administrativos",ubic:"Título Preliminar (Disposiciones generales) ▸ Capítulo II (Contratos del sector público) ▸ Sección 3.ª (Contratos administrativos y contratos privados)",idea:"Administrativo: los cinco tipos celebrados por una Administración, más los especiales.",literal:`<p>1. Tendrán carácter administrativo los contratos siguientes, siempre que se celebren por una Administración Pública:</p><p>a) Los contratos de obra, concesión de obra, concesión de servicios, suministro y servicios. No obstante, tendrán carácter privado los siguientes contratos:</p><p>1.º Los contratos de servicios que tengan por objeto servicios financieros con número de referencia CPV de 66100000-1 a 66720000-3 y los que tengan por objeto la creación e interpretación artística y literaria y los de espectáculos con número de referencia CPV de 79995000-5 a 79995200-7, y de 92000000-1 a 92700000-8, excepto 92230000-2, 92231000-9 y 92232000-6.</p><p>2.º Aquellos cuyo objeto sea la suscripción a revistas, publicaciones periódicas y bases de datos.</p><p>b) Los contratos declarados así expresamente por una Ley, y aquellos otros de objeto distinto a los expresados en la letra anterior, pero que tengan naturaleza administrativa especial por estar vinculados al giro o tráfico específico de la Administración contratante o por satisfacer de forma directa o inmediata una finalidad pública de la específica competencia de aquella.</p><p>2. Los contratos administrativos se regirán, en cuanto a su preparación, adjudicación, efectos, modificación y extinción, por esta Ley y sus disposiciones de desarrollo; supletoriamente se aplicarán las restantes normas de derecho administrativo y, en su defecto, las normas de derecho privado. No obstante, a los contratos administrativos especiales a que se refiere la letra b) del apartado anterior les serán de aplicación, en primer término, sus normas específicas.</p>`,dis:`<ul>
<li><b>25.1 — requisito de sujeto:</b> <b>siempre que se celebren por una <span class="t" data-k="pa">Administración Pública</span></b> (art. 3.2).</li>
<li><b>Letra a):</b> los contratos de <b>obra, concesión de obra, concesión de servicios, suministro y servicios</b>. <b>Excepciones que son privados aunque los celebre una Administración:</b>
<ol><li><b>1.º</b> servicios <b>financieros</b> (CPV 66100000-1 a 66720000-3) y los de <b>creación e interpretación artística y literaria</b> y <b>espectáculos</b> (CPV 79995000-5 a 79995200-7 y 92000000-1 a 92700000-8, excepto 92230000-2, 92231000-9 y 92232000-6);</li>
<li><b>2.º</b> los de <b>suscripción a revistas, publicaciones periódicas y bases de datos</b>.</li></ol></li>
<li><b>Letra b) — <span class="t" data-k="adminespecial">administrativos especiales</span>:</b> los declarados así por una <b>Ley</b>, y los de objeto distinto que tengan naturaleza administrativa especial por estar vinculados al <span class="t" data-k="girotrafico">giro o tráfico específico</span> de la Administración contratante o por satisfacer de forma <b>directa o inmediata</b> una finalidad pública de su específica competencia.</li>
<li><b>25.2 — régimen:</b> preparación, adjudicación, efectos, modificación y extinción por <b>esta ley</b> y sus disposiciones de desarrollo; supletoriamente, <b>otras normas de derecho administrativo</b> y, en su defecto, <b>derecho privado</b>. En los <b>administrativos especiales</b> se aplican <b>en primer término sus normas específicas</b>.</li>
</ul>`,llano:`<p>Para que un contrato sea administrativo hacen falta dos cosas: que lo firme una Administración Pública y que su objeto sea uno de los cinco típicos. Con dos excepciones curiosas que siguen siendo privados aunque los firme un ayuntamiento: los servicios financieros y los artísticos, y las suscripciones a revistas y bases de datos. Y hay una segunda puerta: los contratos administrativos especiales, los que sin ser típicos están pegados a lo que esa Administración hace.</p>`,porque:`<p>El régimen administrativo existe porque estos contratos sirven <b>directamente al interés público</b>: por eso la Administración conserva prerrogativas exorbitantes. Las excepciones privadas responden a la lógica del mercado: en los servicios financieros y artísticos la elección depende de factores —confianza, talento, cotización— mal encajables en un procedimiento reglado. Y los especiales existen porque la realidad desborda siempre la tipología legal.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> hay encargos en los que puedes imponer condiciones y cambiarlas sobre la marcha, y otros en los que solo cabe pactar como iguales.</li>
<li><b>Real (típico):</b> contrato de obras de un colegio celebrado por un ayuntamiento: administrativo.</li>
<li><b>Real (excepción):</b> contrato con una compañía teatral para la programación cultural municipal: <b>privado</b>, por el art. 25.1.a) 1.º</li>
<li><b>Real (especial):</b> explotación de la cafetería de un hospital público: no es ninguno de los cinco tipos, pero está vinculada al giro o tráfico específico del servicio sanitario: <b>administrativo especial</b>.</li>
</ul>`,noej:`<ul>
<li><b>No es administrativo</b> ningún contrato celebrado por un poder adjudicador que <b>no</b> sea Administración Pública, aunque su objeto sea de obras.</li>
<li><b>No es administrativo</b> el contrato de suscripción a una base de datos jurídica: es privado por el 25.1.a) 2.º</li>
<li><b>No basta</b> con que el contrato interese a la Administración para ser especial: debe estar vinculado a su giro o tráfico o satisfacer <b>de forma directa o inmediata</b> una finalidad pública de su competencia.</li>
</ul>`,conex:`<ul>
<li><b>Art. 3.2:</b> quiénes son Administraciones Públicas.</li>
<li><b>Art. 26:</b> contratos privados, la otra cara.</li>
<li><b>Art. 27.1.a):</b> jurisdicción contencioso-administrativa para estos contratos.</li>
<li><b>Arts. 190 y 191:</b> prerrogativas de la Administración en los contratos administrativos.</li>
</ul>`,trampas:`<ul>
<li><b>Dos requisitos</b>: sujeto (Administración Pública) <b>y</b> objeto típico. Falla uno y el contrato es privado.</li>
<li>Las dos excepciones privadas —<b>financieros y artísticos</b>, y <b>suscripciones</b>— se preguntan mucho.</li>
<li>En los administrativos <b>especiales</b> se aplican <b>primero sus normas específicas</b>, no la LCSP.</li>
<li>El orden supletorio del 25.2: esta ley → resto del derecho administrativo → derecho privado.</li>
</ul>`,ancla:`<p><b>"Administración + tipo = administrativo."</b><br>Excepciones privadas: <b>dinero, arte y revistas</b>.<br>Especiales: <b>giro o tráfico</b> o <b>finalidad pública directa</b>.</p>`,vis:`<svg viewBox="0 0 640 195" role="img" aria-label="Contratos administrativos y sus excepciones">

{n:26,t:"Contratos privados",ubic:"Título Preliminar (Disposiciones generales) ▸ Capítulo II (Contratos del sector público) ▸ Sección 3.ª (Contratos administrativos y contratos privados)",idea:"Privado por objeto o por sujeto: la adjudicación se controla, los efectos son civiles.",literal:`<p>1. Tendrán la consideración de contratos privados:</p><p>a) Los que celebren las Administraciones Públicas cuyo objeto sea distinto de los referidos en las letras a) y b) del apartado primero del artículo anterior.</p><p>b) Los celebrados por entidades del sector público que siendo poder adjudicador no reúnan la condición de Administraciones Públicas.</p><p>c) Los celebrados por entidades del sector público que no reúnan la condición de poder adjudicador.</p><p>2. Los contratos privados que celebren las Administraciones Públicas se regirán, en cuanto a su preparación y adjudicación, en defecto de normas específicas, por las Secciones 1.ª y 2.ª del Capítulo I del Título I del Libro Segundo de la presente Ley con carácter general, y por sus disposiciones de desarrollo, aplicándose supletoriamente las restantes normas de derecho administrativo o, en su caso, las normas de derecho privado, según corresponda</p><p>por razón del sujeto o entidad contratante. En lo que respecta a su efectos, modificación y extinción, estos contratos se regirán por el derecho privado.</p><p>No obstante lo establecido en el párrafo anterior, a los contratos mencionados en los números 1.º y 2.º de la letra a) del apartado primero del artículo anterior, les resultarán de aplicación, además del Libro Primero de la presente Ley, el Libro Segundo de la misma en cuanto a su preparación y adjudicación. En cuanto a sus efectos y extinción les serán aplicables las normas de derecho privado, salvo lo establecido en los artículos de esta Ley relativos a las condiciones especiales de ejecución, modificación, cesión, subcontratación y resolución de los contratos, que les serán de aplicación cuando el contrato esté sujeto a regulación armonizada.</p><p>3. Los contratos privados que celebren los poderes adjudicadores que no pertenezcan a la categoría de Administraciones Públicas mencionados en la letra b) del apartado primero del presente artículo, cuyo objeto esté comprendido en el ámbito de la presente Ley, se regirán por lo dispuesto en el Título I del Libro Tercero de la misma, en cuanto a su preparación y adjudicación.</p><p>En cuanto a sus efectos y extinción les serán aplicables las normas de derecho privado, y aquellas normas a las que se refiere el párrafo primero del artículo 319 en materia medioambiental, social o laboral, de condiciones especiales de ejecución, de modificación del contrato, de cesión y subcontratación, de racionalización técnica de la contratación; y la causa de resolución del contrato referida a la imposibilidad de ejecutar la prestación en los términos inicialmente pactados, cuando no sea posible modificar el contrato conforme a los artículos 204 y 205.</p><p>4. Los contratos que celebren las Entidades del Sector Público que no posean la condición de poder adjudicador, se regirán por lo dispuesto en los artículos 321 y 322.</p><p>En lo que se refiere a sus efectos, modificación y extinción se regularán por las normas de derecho privado que les resulten de aplicación.</p>`,dis:`<ul>
<li><b>26.1 — son privados:</b>
<ol><li><b>a)</b> los de las <b>Administraciones Públicas</b> con objeto <b>distinto</b> de los del art. 25.1.a) y b);</li>
<li><b>b)</b> los celebrados por entidades del sector público que, <b>siendo poder adjudicador</b>, no sean Administraciones Públicas;</li>
<li><b>c)</b> los celebrados por entidades del sector público que <b>no sean poder adjudicador</b>.</li></ol></li>
<li><b>26.2 — privados de las Administraciones Públicas:</b> preparación y adjudicación, en defecto de normas específicas, por las <b>Secciones 1.ª y 2.ª del Capítulo I del Título I del Libro Segundo</b>; supletoriamente, derecho administrativo o privado. <b>Efectos, modificación y extinción: derecho privado</b>. Para los contratos del 25.1.a) 1.º y 2.º (financieros, artísticos y suscripciones) se aplican, además del Libro Primero, el <b>Libro Segundo</b> en preparación y adjudicación; y, si el contrato es <b>SARA</b>, también las normas sobre condiciones especiales de ejecución, modificación, cesión, subcontratación y resolución.</li>
<li><b>26.3 — privados de poderes adjudicadores no Administración:</b> preparación y adjudicación por el <b>Título I del Libro Tercero</b>; efectos y extinción por derecho privado, más las normas del art. 319 (medioambientales, sociales o laborales, condiciones especiales de ejecución, modificación, cesión y subcontratación, racionalización técnica) y la causa de resolución por imposibilidad de ejecutar cuando no quepa modificar conforme a los arts. 204 y 205.</li>
<li><b>26.4 — entidades que no son poder adjudicador:</b> arts. <b>321 y 322</b>; efectos, modificación y extinción por derecho privado.</li>
</ul>`,llano:`<p>Los contratos privados se ordenan en tres escalones según quién contrata: la Administración, el poder adjudicador que no es Administración y el resto del sector público. En los tres, la ley controla en mayor o menor medida <b>cómo se elige</b> al contratista; lo que ocurre después —incumplimientos, resolución— se rige por el derecho privado.</p>`,porque:`<p>La regla que atraviesa el artículo es la de los <b>actos separables</b>: aunque el contrato sea privado, la decisión de con quién contratar sigue siendo una decisión pública que gasta dinero público, y por eso se somete a control administrativo. El régimen se aligera a medida que la entidad se aleja del núcleo administrativo, pero nunca desaparece del todo.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> puedes elegir libremente al fontanero, pero si el dinero es de la comunidad de vecinos, tendrás que justificar cómo lo elegiste.</li>
<li><b>Real:</b> la compra de un solar por un ayuntamiento: contrato privado (art. 26.1.a). Su preparación y adjudicación siguen reglas administrativas; el litigio por vicios ocultos se ventila ante la jurisdicción civil.</li>
<li><b>Real:</b> contrato de obras de una empresa municipal de vivienda (poder adjudicador no Administración): privado por el 26.1.b), con preparación y adjudicación conforme al Título I del Libro Tercero.</li>
<li><b>Caso límite:</b> contrato de servicios artísticos SARA celebrado por un ayuntamiento: privado, pero se le aplican también las normas sobre modificación, cesión, subcontratación y resolución (art. 26.2, párrafo segundo).</li>
</ul>`,noej:`<ul>
<li><b>No queda</b> la adjudicación de los contratos privados fuera de control: se rige por la ley en los términos de cada apartado.</li>
<li><b>No se rigen</b> por derecho privado la preparación y adjudicación: solo los efectos, modificación y extinción.</li>
</ul>`,conex:`<ul>
<li><b>Art. 25:</b> contratos administrativos.</li>
<li><b>Art. 27.1.b) y 2.a):</b> reparto de jurisdicción, que refleja exactamente esta división.</li>
<li><b>Art. 319:</b> normas aplicables a los efectos de los contratos de poderes adjudicadores no Administración.</li>
<li><b>Arts. 321 y 322:</b> régimen de las entidades que no son poder adjudicador.</li>
</ul>`,trampas:`<ul>
<li>Los tres supuestos del 26.1: por <b>objeto</b> (letra a) y por <b>sujeto</b> (letras b y c).</li>
<li>La regla de oro: <b>preparación y adjudicación</b>, reglas de la ley; <b>efectos y extinción</b>, derecho privado.</li>
<li>En los contratos del 25.1.a) 1.º y 2.º que sean <b>SARA</b>, el derecho privado cede en modificación, cesión, subcontratación y resolución.</li>
</ul>`,ancla:`<p><b>"Cómo te elijo, derecho público; cómo cumplimos, derecho privado."</b><br>Tres escalones: <b>Administración · poder adjudicador · resto</b>.</p>`,vis:`<svg viewBox="0 0 640 190" role="img" aria-label="Régimen de los contratos privados">

<text x="320" y="52" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ej)">Poder adjudicador</text>

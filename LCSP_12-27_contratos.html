<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>LCSP · Arts. 12-27 · Los contratos del sector público</title>
<style>
/* ═══════════════════════════════════════════════════════════════
   SISTEMA DE DISEÑO · "Académico Gamificado" · Bloque II
   Temas 8, 9 y 10 · Auxiliar Administrativo
   ═══════════════════════════════════════════════════════════════ */
:root{
  --fs:16px;

  --bg:#faf9f7;
  --bg-grad:radial-gradient(1100px 560px at 12% -8%, #ede9ff 0%, transparent 55%),
            radial-gradient(850px 460px at 96% 0%, #dcf5ee 0%, transparent 50%);
  --surface:#ffffff;
  --surface-2:#f4f3f0;
  --surface-3:#eceae5;
  --line:#e6e3dc;
  --line-strong:#d4d0c7;

  --ink:#15161c;
  --ink-2:#5d616e;
  --ink-3:#8b8f9c;

  --brand:#5b3df5;
  --brand-2:#7c5cff;
  --brand-soft:#efeaff;
  --brand-ring:rgba(91,61,245,.18);

  --legal:#4338ca;  --legal-bg:#eeecff;
  --ej:#059669;     --ej-bg:#e4f7f0;
  --warn:#c2690a;   --warn-bg:#fdf1de;
  --exc:#dc2626;    --exc-bg:#ffeceb;

  --ok:#16a34a; --ok-soft:#e7f7ec;
  --mid:#eab308; --mid-soft:#fdf6dd;
  --off:#a1a1aa; --off-soft:#f1f1f3;

  --sh-1:0 1px 2px rgba(20,20,30,.04), 0 2px 8px rgba(20,20,30,.04);
  --sh-2:0 2px 6px rgba(20,20,30,.05), 0 12px 28px rgba(20,20,30,.07);
  --sh-3:0 8px 20px rgba(91,61,245,.13), 0 24px 56px rgba(20,20,30,.10);
  --sh-glow:0 0 0 4px var(--brand-ring);

  --r-sm:9px; --r-md:14px; --r-lg:20px; --r-full:999px;

  --f-display:"Segoe UI Variable Display",system-ui,-apple-system,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-legal:ui-serif,Georgia,Cambria,"Times New Roman",serif;
  --f-mono:ui-monospace,"SF Mono","Cascadia Mono","Segoe UI Mono",Menlo,monospace;

  --t-h1:clamp(1.02rem,.95rem + .3vw,1.2rem);
  --t-h2:clamp(1.2rem,1.05rem + .6vw,1.55rem);
  --t-h3:clamp(1rem,.95rem + .25vw,1.12rem);
  --t-sm:.86rem;
  --t-xs:.75rem;

  --e-out:cubic-bezier(.22,1,.36,1);
  --e-spring:cubic-bezier(.34,1.56,.64,1);

  /* ── Compatibilidad con SVG y contenido generado ── */
  --panel:var(--surface);
  --ink2:var(--ink-2);
  --acc:var(--brand);
  --acc-soft:var(--brand-soft);
  --g:var(--ok); --y:var(--mid); --r:var(--exc);
}

html[data-theme="dark"]{
  --bg:#0a0b0f;
  --bg-grad:radial-gradient(1100px 560px at 12% -8%, #1c1740 0%, transparent 55%),
            radial-gradient(850px 460px at 96% 0%, #08302b 0%, transparent 50%);
  --surface:#13151b;
  --surface-2:#1a1d25;
  --surface-3:#232733;
  --line:#262a34;
  --line-strong:#343947;

  --ink:#eceef4;
  --ink-2:#9ba2b3;
  --ink-3:#6e7585;

  --brand:#8b6dff;
  --brand-2:#a78bff;
  --brand-soft:#1e1a3d;
  --brand-ring:rgba(139,109,255,.22);

  --legal:#a5b4fc; --legal-bg:#191b3a;
  --ej:#34d399;    --ej-bg:#0c2a24;
  --warn:#fbbf24;  --warn-bg:#2e2110;
  --exc:#fb7185;   --exc-bg:#331119;

  --ok:#4ade80; --ok-soft:#0e2a19;
  --mid:#facc15; --mid-soft:#2c2610;
  --off:#5b6070; --off-soft:#1c1f27;

  --sh-1:0 1px 2px rgba(0,0,0,.3), 0 2px 8px rgba(0,0,0,.25);
  --sh-2:0 2px 6px rgba(0,0,0,.35), 0 12px 28px rgba(0,0,0,.4);
  --sh-3:0 8px 20px rgba(139,109,255,.2), 0 24px 56px rgba(0,0,0,.5);
}

*,*::before,*::after{box-sizing:border-box}
html{font-size:var(--fs);scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);background-image:var(--bg-grad);
  background-attachment:fixed;background-repeat:no-repeat;
  color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.68;
  -webkit-font-smoothing:antialiased;
  transition:background-color .5s var(--e-out),color .3s;
}
::selection{background:var(--brand);color:#fff}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{font-family:var(--f-display);letter-spacing:-.022em;line-height:1.2}
.num{font-variant-numeric:tabular-nums}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:99px;border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3)}

/* ═══ HEADER ═══ */
header.top{
  position:sticky;top:0;z-index:60;
  background:color-mix(in srgb,var(--surface) 80%,transparent);
  backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);
  border-bottom:1px solid var(--line);
}
.top-in{max-width:1280px;margin:0 auto;padding:.65rem 1.1rem;display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.brandwrap{display:flex;align-items:center;gap:.65rem;min-width:0;flex:1}
.mark{
  width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;
  font-weight:800;font-size:.8rem;letter-spacing:-.02em;text-decoration:none;
  box-shadow:0 4px 14px var(--brand-ring);
  transition:transform .3s var(--e-spring),box-shadow .3s;
}
.mark:hover{transform:rotate(-8deg) scale(1.08);box-shadow:var(--sh-3);text-decoration:none}
.top h1{font-size:var(--t-h1);margin:0;font-weight:800;line-height:1.25;min-width:0}
.top h1 .sub{display:block;font-size:var(--t-xs);color:var(--ink-2);font-weight:500;letter-spacing:0;
  margin-top:.1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tools{margin-left:auto;display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}

button,select,input[type=search]{
  font:inherit;font-size:var(--t-sm);font-weight:600;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:var(--r-sm);padding:.4rem .72rem;cursor:pointer;
  position:relative;overflow:hidden;
  transition:transform .18s var(--e-spring),border-color .2s,background .2s,box-shadow .2s,color .2s;
}
button:hover{transform:translateY(-1.5px);border-color:var(--brand);box-shadow:var(--sh-1)}
button:active{transform:translateY(0) scale(.97)}
button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible{outline:none;box-shadow:var(--sh-glow)}
input[type=search]{min-width:190px;cursor:text;font-weight:500}
input[type=search]:focus{border-color:var(--brand)}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--surface-2);padding:2px;gap:2px}
.seg button{border:0;border-radius:calc(var(--r-sm) - 2px);padding:.32rem .68rem;background:transparent;box-shadow:none}
.seg button:hover{transform:none;background:var(--surface)}
.seg button[aria-pressed="true"]{background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;box-shadow:0 2px 8px var(--brand-ring)}

.ripple{position:absolute;border-radius:50%;transform:scale(0);background:currentColor;opacity:.25;animation:rip .55s linear;pointer-events:none}
@keyframes rip{to{transform:scale(3.4);opacity:0}}

.progress{position:absolute;left:0;bottom:-1px;height:2.5px;width:0;
  background:linear-gradient(90deg,var(--brand),var(--legal),var(--ej));transition:width .1s linear}

/* ═══ LAYOUT ═══ */
.layout{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:270px 1fr;gap:1.8rem;padding:1.4rem 1.1rem 5rem}
main{min-width:0}

/* ═══ SIDEBAR ═══ */
nav.side{
  position:sticky;top:76px;align-self:start;max-height:calc(100vh - 96px);overflow:auto;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:.85rem;box-shadow:var(--sh-1);
}
nav.side h2{font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);
  margin:.5rem .4rem .5rem;font-weight:800}
nav.side h2:first-child{margin-top:.1rem}
nav.side a{
  display:flex;align-items:baseline;gap:.5rem;padding:.36rem .55rem;border-radius:var(--r-sm);
  text-decoration:none;color:var(--ink-2);font-size:var(--t-sm);font-weight:500;
  position:relative;transition:background .22s,color .22s,transform .22s var(--e-out);
}
nav.side a:hover{background:var(--surface-2);color:var(--ink);transform:translateX(3px);text-decoration:none}
nav.side a.on{background:var(--brand-soft);color:var(--brand);font-weight:700}
nav.side a.on::before{content:"";position:absolute;left:-.85rem;top:20%;bottom:20%;width:3px;
  border-radius:0 3px 3px 0;background:var(--brand)}
nav.side a b{color:var(--ink-3);font-weight:800;font-size:var(--t-xs);font-variant-numeric:tabular-nums;flex:none;min-width:1.9em}
nav.side a.on b{color:var(--brand)}
.navtoggle{display:none}

/* ═══ TARJETAS ═══ */
section.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:1.35rem 1.5rem;margin-bottom:1.1rem;box-shadow:var(--sh-1);
  transition:box-shadow .3s var(--e-out),border-color .3s;
}
section.card:hover{box-shadow:var(--sh-2)}
section.card>h2{
  margin:0 0 1rem;font-size:var(--t-h2);font-weight:800;
  display:flex;align-items:center;gap:.6rem;
}
section.card>h2::before{
  content:"";width:4px;height:1.05em;border-radius:99px;flex:none;
  background:linear-gradient(180deg,var(--brand),var(--brand-2));
}

/* ═══ ARTÍCULO ═══ */
.art{scroll-margin-top:86px;padding-top:.4rem}
.art + .art{margin-top:1.6rem;padding-top:1.6rem;border-top:1px dashed var(--line)}
.art h2{display:flex;flex-wrap:wrap;gap:.5rem;align-items:baseline;font-size:var(--t-h3);
  margin:0 0 .25rem;font-weight:800;letter-spacing:-.015em}
.art h2 .num{
  color:var(--brand);font-weight:800;font-family:var(--f-display);
  background:var(--brand-soft);padding:.1rem .5rem;border-radius:var(--r-sm);
  font-size:.92em;letter-spacing:-.02em;
}
.ubic{font-size:var(--t-xs);color:var(--ink-3);margin:0 0 .8rem;font-weight:600;
  letter-spacing:.03em;text-transform:uppercase}

/* ═══ IDEA CLAVE ═══ */
.idea{
  background:linear-gradient(100deg,var(--brand-soft),color-mix(in srgb,var(--brand-soft) 40%,transparent));
  border-left:4px solid var(--brand);border-radius:0 var(--r-md) var(--r-md) 0;
  padding:.75rem 1rem;font-weight:650;margin:.7rem 0 1rem;position:relative;
  font-size:.97rem;line-height:1.55;
}

/* ═══ ACORDEÓN ═══ */
details.panel{
  border:1px solid var(--line);border-radius:var(--r-md);margin:.6rem 0;
  background:var(--surface);overflow:hidden;
  transition:border-color .25s,box-shadow .25s,background .25s;
}
details.panel:hover{border-color:var(--line-strong)}
details.panel[open]{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-ring)}
details.panel>summary{
  cursor:pointer;padding:.62rem .9rem;font-weight:700;font-size:.93rem;
  list-style:none;display:flex;align-items:center;gap:.55rem;
  transition:background .2s,color .2s;
}
details.panel>summary:hover{background:var(--surface-2)}
details.panel[open]>summary{background:var(--brand-soft);color:var(--brand)}
details.panel>summary::-webkit-details-marker{display:none}
details.panel>summary::before{
  content:"";width:16px;height:16px;flex:none;border-radius:5px;
  background:var(--brand-soft);position:relative;transition:transform .3s var(--e-spring),background .25s;
}
details.panel>summary::after{
  content:"";position:absolute;width:0;height:0;margin-left:5px;
  border:4px solid transparent;border-left-color:var(--brand);
  transition:transform .3s var(--e-spring);
}
details.panel[open]>summary::before{background:var(--surface)}
details.panel[open]>summary::after{transform:rotate(90deg) translateX(-1px)}
details.panel .body{padding:.3rem 1rem 1rem;font-size:.95rem;animation:slidein .35s var(--e-out)}
@keyframes slidein{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* ═══ TEXTO LEGAL ═══ */
.legal{
  background:var(--legal-bg);border-left:4px solid var(--legal);
  border-radius:0 var(--r-md) var(--r-md) 0;padding:.85rem 1.05rem;
  font-family:var(--f-legal);font-size:.95rem;line-height:1.7;
}
.legal p{margin:.45rem 0}
.legal .lbl{
  font-family:var(--f-body);font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;
  color:var(--legal);font-weight:800;display:block;margin-bottom:.4rem;
}

/* ═══ CAJAS SEMÁNTICAS ═══ */
.box{
  border-left:4px solid var(--line);border-radius:0 var(--r-md) var(--r-md) 0;
  padding:.72rem .95rem;margin:.65rem 0;font-size:.94rem;
  transition:transform .25s var(--e-out),box-shadow .25s;
}
.box:hover{transform:translateX(3px);box-shadow:var(--sh-1)}
.box.ej{background:var(--ej-bg);border-color:var(--ej)}
.box.warn{background:var(--warn-bg);border-color:var(--warn)}
.box.exc{background:var(--exc-bg);border-color:var(--exc)}
.box .lbl{font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;font-weight:800;
  display:block;margin-bottom:.3rem}
.box.ej .lbl{color:var(--ej)}
.box.warn .lbl{color:var(--warn)}
.box.exc .lbl{color:var(--exc)}

.interp{
  border:1px dashed var(--warn);background:color-mix(in srgb,var(--warn-bg) 45%,transparent);
  border-radius:var(--r-md);padding:.65rem .9rem;font-size:.9rem;margin:.6rem 0;
}
.interp .lbl{font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;color:var(--warn);font-weight:800;display:block}

/* ═══ TABLAS ═══ */
table{width:100%;border-collapse:separate;border-spacing:0;font-size:.9rem;margin:.7rem 0;
  border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
th,td{padding:.5rem .68rem;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
td + td, th + th{border-left:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th{background:var(--surface-2);font-size:var(--t-xs);font-weight:800;letter-spacing:.05em;
  text-transform:uppercase;color:var(--ink-2);position:sticky;top:0}
tbody tr{transition:background .18s}
tbody tr:nth-child(even){background:color-mix(in srgb,var(--surface-2) 45%,transparent)}
tbody tr:hover{background:var(--brand-soft)}
th.sortable{cursor:pointer;user-select:none;transition:color .2s,background .2s}
th.sortable:hover{color:var(--brand);background:var(--brand-soft)}
th.sortable::after{content:" ⇅";color:var(--ink-3);font-size:.7rem}

ul,ol{margin:.5rem 0 .5rem 1.2rem;padding:0}
li{margin:.26rem 0}
li::marker{color:var(--brand);font-weight:700}

/* ═══ TOOLTIPS ═══ */
.t{border-bottom:1.5px dotted var(--brand);cursor:help;position:relative;
  transition:background .2s,color .2s}
.t:hover{background:var(--brand-soft);color:var(--brand);border-radius:3px}
#tip{
  position:fixed;z-index:99;max-width:330px;background:var(--ink);color:var(--bg);
  padding:.6rem .78rem;border-radius:var(--r-md);font-size:.82rem;line-height:1.5;
  display:none;box-shadow:0 8px 30px rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.08);
}
html[data-theme="dark"] #tip{background:#f0f1f5;color:#15161c}

/* ═══ FLECHAS DE DIAGRAMA ═══
   Un <path> con stroke pero sin fill toma el valor inicial (negro) y el
   navegador cierra el trazo implícitamente: aparece un triángulo relleno
   entre sus extremos. Forzamos fill:none para dejar solo la línea + la
   punta del <marker>, que sí lleva su color. */
svg path[stroke]:not([fill]){fill:none}
svg polyline:not([fill]){fill:none}
svg line{fill:none}

/* ═══ SVG ═══ */
svg{max-width:100%;height:auto;display:block;margin:.9rem auto}
svg text{font-family:var(--f-body)}

/* ═══ BUSCADOR ═══ */
mark.hit{background:linear-gradient(180deg,transparent 55%,#ffe066 55%);color:inherit;
  border-radius:2px;padding:0 1px;font-weight:600}
html[data-theme="dark"] mark.hit{background:linear-gradient(180deg,transparent 55%,#8a6d00 55%);color:#fff}

/* ═══ UTILIDADES ═══ */
.hide{display:none !important}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.small{font-size:var(--t-sm);color:var(--ink-2)}
.chip{
  display:inline-block;font-size:var(--t-xs);padding:.16rem .55rem;border-radius:var(--r-full);
  background:var(--brand-soft);color:var(--brand);font-weight:800;letter-spacing:.02em;
}

/* ═══ HUECOS RELLENABLES ═══ */
.gap{
  display:inline-block;min-width:5.5em;border-bottom:2px solid var(--brand);
  text-align:center;font-weight:700;color:transparent;cursor:pointer;
  transition:color .3s,background .3s;
}
.gap.on,.gap:hover{color:var(--brand);background:var(--brand-soft);border-radius:4px 4px 0 0}

/* ═══ REVELAR SOLUCIÓN ═══ */
.revelar{
  background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;border-color:transparent;
  font-weight:700;
}
.revelar:hover{box-shadow:var(--sh-3)}
.sol{
  margin-top:.7rem;padding:.8rem 1rem;border-radius:var(--r-md);
  background:var(--ej-bg);border-left:4px solid var(--ej);
  animation:slidein .4s var(--e-out);
}

/* ═══ TEST ═══ */
.opt{
  display:block;padding:.55rem .85rem;margin:.35rem 0;border:1.5px solid var(--line);
  border-radius:var(--r-md);cursor:pointer;background:var(--surface);font-size:.94rem;
  transition:border-color .22s,background .22s,transform .22s var(--e-out);
}
.opt:hover{border-color:var(--brand);background:var(--brand-soft);transform:translateX(4px)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft);font-weight:650}
.opt.ko{border-color:var(--exc);background:var(--exc-bg)}
.opt input{margin-right:.5rem;accent-color:var(--brand)}

#tscore,#semres{
  font-family:var(--f-display);font-weight:800;font-size:1.15rem;letter-spacing:-.02em;
}

/* ═══════════════════════════════════════════════════════════════
   FLASHCARDS 3D · mazo con giro, vuelo de salida y sheen
   ═══════════════════════════════════════════════════════════════ */
#flash{--fc-e:cubic-bezier(.2,.8,.25,1);--fc-h:250px}

/* — Escena — */
.fc-stage{
  perspective:1400px;perspective-origin:50% 45%;
  padding:.4rem 0 .2rem;position:relative;
}
.fc-deck{position:relative;height:var(--fc-h);will-change:transform}

/* — Cartas fantasma del mazo — */
.fc-ghost{
  position:absolute;inset:0;border-radius:var(--r-lg);
  background:var(--surface);border:1px solid var(--line);
  transition:transform .5s var(--fc-e),opacity .5s var(--fc-e);
}
.fc-ghost.g1{transform:translateY(9px) scale(.972);opacity:.75}
.fc-ghost.g2{transform:translateY(18px) scale(.944);opacity:.45}
.fc-deck.empty .fc-ghost{opacity:0;transform:translateY(26px) scale(.9)}

/* — Elevación durante el giro — */
.fc-lift{position:absolute;inset:0;transform-style:preserve-3d}
.fc-lift.lift{animation:fcLift .78s var(--fc-e)}
@keyframes fcLift{
  0%,100%{transform:scale(1) translateY(0)}
  45%{transform:scale(1.055) translateY(-16px)}
}
.fc-lift.out-ok{animation:fcOut .5s cubic-bezier(.5,0,.75,0) forwards}
.fc-lift.out-ko{animation:fcOutKo .5s cubic-bezier(.5,0,.75,0) forwards}
.fc-lift.in{animation:fcIn .48s var(--fc-e)}
@keyframes fcOut{
  0%{transform:translateX(0) rotate(0) scale(1);opacity:1}
  100%{transform:translateX(130%) rotate(17deg) scale(.85);opacity:0}
}
@keyframes fcOutKo{
  0%{transform:translateX(0) rotate(0) scale(1);opacity:1}
  100%{transform:translateX(-130%) rotate(-17deg) scale(.85);opacity:0}
}
@keyframes fcIn{
  0%{transform:translateY(26px) scale(.9);opacity:0}
  100%{transform:translateY(0) scale(1);opacity:1}
}

/* — La carta — */
.fc-card{
  position:absolute;inset:0;transform-style:preserve-3d;
  transition:transform .78s var(--fc-e);
  cursor:pointer;border-radius:var(--r-lg);
}
.fc-card:focus-visible{outline:none}
.fc-card:focus-visible .fc-face{box-shadow:var(--sh-glow),var(--sh-2)}

/* — Caras — */
.fc-face{
  position:absolute;inset:0;border-radius:var(--r-lg);
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  padding:2rem 2.2rem;text-align:center;overflow:hidden;
  box-shadow:var(--sh-2);
  transition:box-shadow .4s var(--fc-e);
}
.fc-card:hover .fc-face{box-shadow:var(--sh-3)}

/* Anverso · pregunta */
.fc-front{
  background:
    radial-gradient(120% 90% at 50% -20%, var(--brand-soft) 0%, transparent 60%),
    var(--surface);
  border:1.5px solid var(--line);color:var(--ink);
}
/* Reverso · respuesta */
.fc-back{
  transform:rotateY(180deg);
  background:linear-gradient(145deg,var(--brand) 0%,#6d4bf7 45%,var(--c5,#0891b2) 130%);
  border:1.5px solid transparent;color:#fff;
}
html[data-theme="dark"] .fc-back{
  background:linear-gradient(145deg,#5f45c9 0%,#4b3aa8 45%,#0e6b85 130%);
}
.fc-back .fc-txt{color:#fff}
.fc-back b,.fc-back strong{color:#fff;font-weight:800}

/* — Sheen que barre al girar — */
.fc-face::after{
  content:"";position:absolute;top:-60%;left:-70%;width:55%;height:220%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.42),transparent);
  transform:rotate(18deg);opacity:0;pointer-events:none;
}
.fc-lift.lift .fc-face::after{animation:fcSheen .78s var(--fc-e)}
@keyframes fcSheen{
  0%{opacity:0;left:-70%}
  35%{opacity:1}
  100%{opacity:0;left:150%}
}

/* — Etiqueta superior — */
.fc-tag{
  position:absolute;top:1rem;left:1.15rem;
  font-size:var(--t-xs);font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  display:inline-flex;align-items:center;gap:.4rem;
}
.fc-front .fc-tag{color:var(--brand)}
.fc-back .fc-tag{color:rgba(255,255,255,.9)}
.fc-tag::before{
  content:"";width:7px;height:7px;border-radius:50%;background:currentColor;
  animation:fcPulse 2.2s ease-in-out infinite;
}
@keyframes fcPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.65)}}

/* — Índice tipo naipe — */
.fc-pip{
  position:absolute;font-family:var(--f-display);font-weight:800;
  font-size:.78rem;letter-spacing:-.02em;opacity:.34;font-variant-numeric:tabular-nums;
}
.fc-pip.tr{top:1rem;right:1.15rem}
.fc-pip.bl{bottom:1rem;left:1.15rem;transform:rotate(180deg)}
.fc-front .fc-pip{color:var(--ink-2)}
.fc-back .fc-pip{color:#fff;opacity:.55}

/* — Texto — */
.fc-txt{
  font-size:clamp(1rem,.9rem + .55vw,1.28rem);font-weight:650;line-height:1.5;
  max-width:44ch;letter-spacing:-.012em;
}
.fc-front .fc-txt{font-family:var(--f-display);font-weight:700}
.fc-back .fc-txt{font-weight:600;line-height:1.6}
.fc-hint{
  position:absolute;bottom:1rem;left:0;right:0;
  font-size:var(--t-xs);font-weight:600;letter-spacing:.02em;
  display:flex;align-items:center;justify-content:center;gap:.4rem;
}
.fc-front .fc-hint{color:var(--ink-3)}
.fc-back .fc-hint{color:rgba(255,255,255,.72)}
.fc-hint .kbd{
  font-family:var(--f-mono);font-size:.68rem;font-weight:700;padding:.1rem .32rem;
  border-radius:5px;border:1px solid currentColor;opacity:.75;
}

/* — Pantalla final — */
.fc-done{
  position:absolute;inset:0;border-radius:var(--r-lg);
  background:linear-gradient(150deg,var(--ok-soft),var(--surface) 70%);
  border:1.5px solid var(--ok);
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  text-align:center;padding:2rem;gap:.35rem;
  animation:fcIn .5s var(--fc-e);box-shadow:var(--sh-2);
}
.fc-done .seal{
  font-size:2.6rem;line-height:1;
  animation:fcSeal .7s cubic-bezier(.2,1.5,.4,1);
}
@keyframes fcSeal{0%{transform:scale(0) rotate(-25deg);opacity:0}60%{transform:scale(1.2) rotate(6deg)}100%{transform:scale(1) rotate(0);opacity:1}}
.fc-done h3{font-size:1.3rem;font-weight:800;margin:.2rem 0 0}
.fc-done p{margin:0;color:var(--ink-2);font-size:var(--t-sm)}

/* — Barra de progreso de la ronda — */
.fc-bar{
  height:6px;border-radius:99px;background:var(--surface-3);
  overflow:hidden;margin:.95rem 0 .8rem;position:relative;
}
.fc-bar i{
  display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--brand),var(--c5,#0891b2));
  transition:width .55s var(--fc-e);
}

/* — Controles — */
.fc-ctrls{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.fc-ctrls button{font-weight:700}
#fcok{border-color:var(--ok);color:var(--ok)}
#fcok:hover{background:var(--ok);color:#fff;border-color:var(--ok)}
#fcko{border-color:var(--warn);color:var(--warn)}
#fcko:hover{background:var(--warn);color:#fff;border-color:var(--warn)}
#fcflip{background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;border-color:transparent}
#fcflip:hover{box-shadow:var(--sh-3)}

.fc-score{display:inline-flex;gap:.45rem;margin-left:auto;align-items:center}
.fc-pill{
  font-size:var(--t-xs);font-weight:800;padding:.24rem .6rem;border-radius:var(--r-full);
  font-variant-numeric:tabular-nums;border:1px solid;
}
.fc-pill.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.fc-pill.ko{color:var(--warn);border-color:var(--warn);background:var(--warn-bg)}
.fc-pill.left{color:var(--ink-2);border-color:var(--line);background:var(--surface-2)}
.fc-pill.bump{animation:fcBump .45s var(--e-spring)}
@keyframes fcBump{0%{transform:scale(1)}45%{transform:scale(1.28)}100%{transform:scale(1)}}

@media(max-width:620px){
  #flash{--fc-h:270px}
  .fc-face{padding:1.7rem 1.3rem}
  .fc-score{margin-left:0;width:100%}
}
@media(prefers-reduced-motion:reduce){
  .fc-card{transition:none}
  .fc-lift.lift,.fc-lift.in,.fc-lift.out-ok,.fc-lift.out-ko,.fc-face::after{animation:none !important}
}
@media print{.fc-stage,.fc-ctrls,.fc-bar{display:none !important}}
/* ═══ RESPUESTA ESTRUCTURADA ═══ */
.fc-face{justify-content:center}
.fc-face.struct{justify-content:flex-start;text-align:left;padding-top:3.1rem;padding-bottom:3.1rem}
.fc-body{
  width:100%;max-width:46ch;margin:0 auto;
  overflow-y:auto;max-height:100%;
  scrollbar-width:thin;
}
.fc-body::-webkit-scrollbar{width:5px}
.fc-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.35);border-radius:99px;border:0}
.fc-front .fc-body::-webkit-scrollbar-thumb{background:var(--line-strong)}

/* — Veredicto Sí / No — */
.fc-verdict{
  display:inline-flex;align-items:center;gap:.35rem;
  font-family:var(--f-display);font-weight:800;font-size:.82rem;
  letter-spacing:.06em;text-transform:uppercase;
  padding:.26rem .72rem;border-radius:var(--r-full);margin-bottom:.85rem;
  border:1.5px solid;animation:fcPopIn .45s var(--e-spring) backwards;animation-delay:.34s;
}
.fc-verdict.si{background:rgba(255,255,255,.16);border-color:rgba(190,255,215,.85);color:#d8ffe9}
.fc-verdict.no{background:rgba(255,255,255,.16);border-color:rgba(255,205,205,.85);color:#ffdedd}
@keyframes fcPopIn{0%{opacity:0;transform:scale(.7) translateY(6px)}100%{opacity:1;transform:none}}

/* — Párrafo — */
.fc-p{margin:0;font-size:clamp(1rem,.92rem + .45vw,1.2rem);font-weight:600;line-height:1.6}
.fc-face.struct .fc-p{font-size:clamp(.96rem,.9rem + .35vw,1.1rem)}

/* — Lista enumerada — */
.fc-list{list-style:none;margin:0;padding:0;display:grid;gap:.5rem;counter-reset:fc}
.fc-list li{
  counter-increment:fc;position:relative;margin:0;
  padding:.42rem .6rem .42rem 2.5rem;border-radius:var(--r-sm);
  background:rgba(255,255,255,.11);
  font-size:clamp(.92rem,.88rem + .3vw,1.04rem);font-weight:600;line-height:1.45;
  animation:fcRow .42s var(--e-out) backwards;
}
.fc-list li::before{
  content:counter(fc);position:absolute;left:.6rem;top:50%;transform:translateY(-50%);
  width:1.6rem;height:1.6rem;border-radius:50%;
  display:grid;place-items:center;
  background:rgba(255,255,255,.9);color:var(--brand);
  font-family:var(--f-display);font-weight:800;font-size:.78rem;
  font-variant-numeric:tabular-nums;
}
.fc-list.alpha li::before{content:counter(fc,lower-alpha)}
.fc-list li:nth-child(1){animation-delay:.36s}
.fc-list li:nth-child(2){animation-delay:.42s}
.fc-list li:nth-child(3){animation-delay:.48s}
.fc-list li:nth-child(4){animation-delay:.54s}
.fc-list li:nth-child(5){animation-delay:.60s}
.fc-list li:nth-child(n+6){animation-delay:.66s}
@keyframes fcRow{0%{opacity:0;transform:translateX(-12px)}100%{opacity:1;transform:none}}

/* — Cláusulas contrapuestas — */
.fc-clauses{display:grid;gap:.45rem}
.fc-clauses p{
  margin:0;padding:.45rem .7rem .45rem .95rem;border-radius:0 var(--r-sm) var(--r-sm) 0;
  background:rgba(255,255,255,.11);border-left:3px solid rgba(255,255,255,.55);
  font-size:clamp(.92rem,.88rem + .3vw,1.04rem);font-weight:600;line-height:1.5;
  animation:fcRow .42s var(--e-out) backwards;
}
.fc-clauses p:nth-child(1){animation-delay:.36s}
.fc-clauses p:nth-child(2){animation-delay:.44s}
.fc-clauses p:nth-child(3){animation-delay:.52s}

/* — Negritas resaltadas en el reverso — */
.fc-back .fc-body b,.fc-back .fc-body strong{
  font-weight:800;background:rgba(255,255,255,.2);
  padding:.03em .3em;border-radius:5px;
  box-decoration-break:clone;-webkit-box-decoration-break:clone;
}

/* — Cita legal al pie — */
.fc-cite{
  position:absolute;bottom:.95rem;left:0;right:0;
  display:inline-flex;align-items:center;justify-content:center;gap:.4rem;
  font-family:var(--f-mono);font-size:.74rem;font-weight:700;letter-spacing:.02em;
  color:rgba(255,255,255,.82);
  animation:fcPopIn .5s var(--e-out) backwards;animation-delay:.5s;
}
.fc-cite::before,.fc-cite::after{
  content:"";height:1px;width:clamp(18px,10%,52px);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.45));
}
.fc-cite::after{background:linear-gradient(90deg,rgba(255,255,255,.45),transparent)}
.fc-cite .s{font-size:.9rem;opacity:.75;font-family:var(--f-legal)}
.fc-front .fc-cite{color:var(--ink-3)}
.fc-front .fc-cite::before{background:linear-gradient(90deg,transparent,var(--line-strong))}
.fc-front .fc-cite::after{background:linear-gradient(90deg,var(--line-strong),transparent)}

/* la pista se oculta si hay cita, para no amontonar */
.fc-back .fc-cite ~ .fc-hint,.fc-back .fc-hint.muted{display:none}

@media(max-width:620px){
  #flash{--fc-h:320px}
  .fc-face.struct{padding-top:2.9rem;padding-bottom:2.8rem}
  .fc-list li{padding-left:2.3rem}
}
@media(prefers-reduced-motion:reduce){
  .fc-verdict,.fc-list li,.fc-clauses p,.fc-cite{animation:none !important}
}

/* ═══ SEMÁFORO ═══ */
.sembtn{
  border-radius:var(--r-full);padding:.32rem .7rem;font-weight:700;font-size:var(--t-sm);
}
.sembtn[data-v="g"]:hover,.sembtn.on[data-v="g"]{background:var(--ok);color:#fff;border-color:var(--ok)}
.sembtn[data-v="y"]:hover,.sembtn.on[data-v="y"]{background:var(--mid);color:#3d2f00;border-color:var(--mid)}
.sembtn[data-v="r"]:hover,.sembtn.on[data-v="r"]{background:var(--exc);color:#fff;border-color:var(--exc)}

/* ═══ CTA DE BLOQUE ═══ */
a.blk{
  display:inline-flex;align-items:center;gap:.5rem;
  background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;
  padding:.5rem .95rem;border-radius:var(--r-sm);font-weight:700;font-size:var(--t-sm);
  text-decoration:none;box-shadow:0 2px 10px var(--brand-ring);
  transition:transform .22s var(--e-spring),box-shadow .25s,gap .25s var(--e-out);
}
a.blk:hover{transform:translateY(-2px);box-shadow:var(--sh-3);gap:.75rem;text-decoration:none}
a.blk::after{content:"→"}
a.blk:active{transform:translateY(0) scale(.98)}

/* ═══ REVEAL ═══ */
.rv{opacity:0;transform:translateY(20px);transition:opacity .6s var(--e-out),transform .6s var(--e-out)}
.rv.in{opacity:1;transform:none}

/* ═══ RESPONSIVE ═══ */
@media(max-width:960px){
  .layout{grid-template-columns:1fr;padding-top:.9rem;gap:1rem}
  nav.side{position:static;max-height:none}
  nav.side.collapsed .navbody{display:none}
  .navtoggle{display:block;width:100%;text-align:left;font-weight:700}
  .grid2{grid-template-columns:1fr}
  .top h1 .sub{white-space:normal}
}
@media(max-width:620px){
  .top-in{padding:.55rem .8rem}
  .tools{width:100%;margin-left:0}
  input[type=search]{flex:1;min-width:0}
  section.card{padding:1.05rem 1rem;border-radius:var(--r-md)}
  table{font-size:.82rem}
  th,td{padding:.4rem .5rem}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
  .rv{opacity:1;transform:none}
}
@media print{
  header.top,nav.side,.tools,.noprint,.progress{display:none !important}
  body{background:#fff;background-image:none;font-size:11pt;color:#000}
  .layout{display:block;max-width:none;padding:0}
  section.card{border:0;padding:0;margin:0 0 1rem;break-inside:avoid;box-shadow:none}
  details.panel{border:0;box-shadow:none}
  details.panel .body{display:block !important}
  details.panel>summary{padding-left:0}
  .art{break-inside:avoid}
  .rv{opacity:1;transform:none}
  a{color:#000;text-decoration:none}
}


/* ═══ ALTURA ADAPTATIVA DE LA TARJETA ═══ */
.fc-deck{transition:height .45s var(--fc-e)}
.fc-body{max-height:none;overflow:visible}
.fc-measure{
  position:absolute;left:0;right:0;top:0;height:auto;
  visibility:hidden;pointer-events:none;z-index:-1;
}
.fc-measure .fc-face{
  position:relative;inset:auto;height:auto;min-height:0;
  box-shadow:none;backface-visibility:visible;transform:none;
}
.fc-measure .fc-body{max-height:none;overflow:visible}
.fc-measure .fc-face::after{display:none}

/* ═══ MOSTRAR / OCULTAR ÍNDICE LATERAL ═══ */
.layout{transition:grid-template-columns .42s var(--e-out)}
.layout.nonav{grid-template-columns:0 1fr;gap:0}
.layout.nonav>nav.side{
  opacity:0;transform:translateX(-14px);pointer-events:none;
  padding:0;border-width:0;overflow:hidden;width:0;min-width:0;
}
nav.side{
  transition:opacity .3s var(--e-out),transform .38s var(--e-out);
  overflow-x:hidden;
}
#navhide .ic{display:inline-block;transition:transform .35s var(--e-spring);font-size:.95em;line-height:1}
#navhide[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
#navhide[aria-pressed="true"] .ic{transform:rotate(90deg)}
@media(max-width:960px){#navhide{display:none}}
</style>

<script>
const GLOSARIO={
 "presupuesto":"Documento contable y jurídico, aprobado por el Pleno, que fija el techo de gasto de un ejercicio y estima los ingresos con los que se financia. Ej.: el presupuesto de Utrera para 2026 autoriza gastar como máximo 78 M€.",
 "credito":"Crédito presupuestario: la cantidad máxima de dinero autorizada para una finalidad concreta. Ej.: 120.000 € en la aplicación de 'mantenimiento de colegios'.",
 "obligacion":"Obligación reconocida: la deuda que el Ayuntamiento admite formalmente que debe pagar, una vez comprobado que el servicio o suministro se ha prestado. Ej.: aprobada la factura del proveedor, nace la obligación.",
 "derecho":"Derecho liquidado: el importe concreto que un tercero debe a la entidad local, una vez cuantificado. Ej.: liquidado el IBI de un inmueble en 340 €, ese es el derecho.",
 "oa":"Organismo autónomo: ente con personalidad jurídica propia creado por la entidad local para gestionar un servicio (patronatos de deportes, de cultura, gerencias de urbanismo). Depende del Ayuntamiento pero tiene su propio presupuesto.",
 "sociedad":"Sociedad mercantil local: empresa con forma de S.A. o S.L. cuyo capital pertenece a la entidad local (p. ej. la empresa municipal de aguas). No aprueba 'presupuesto', sino estados de previsión de gastos e ingresos.",
 "bases":"Bases de ejecución: el 'reglamento de uso' del presupuesto. Adaptan las normas presupuestarias generales a la organización concreta de la entidad. Ej.: fijan qué órgano autoriza gastos de hasta 3.000 €.",
 "estabilidad":"Estabilidad presupuestaria: exigencia de que las cuentas públicas no incurran en déficit estructural. Ej.: un ayuntamiento no puede presupuestar más gasto no financiero que ingresos no financieros.",
 "afectacion":"No afectación: regla general de que todos los ingresos financian todo el gasto, sin que un ingreso concreto quede reservado a un gasto concreto. Ej.: lo recaudado por el IBI no está reservado a pagar el alumbrado.",
 "bruto":"Principio de presupuesto bruto (o de integridad): derechos y obligaciones se anotan por su importe total, sin compensar unos con otros. Ej.: no se puede anotar la subvención 'ya descontados' los gastos del programa.",
 "nivelacion":"Nivelación presupuestaria: que el total de ingresos previstos cubra el total de gastos autorizados; es decir, aprobar sin déficit inicial.",
 "aplicacion":"Aplicación presupuestaria: la 'casilla' exacta donde vive cada euro de gasto, formada al cruzar la clasificación por programas con la económica. Ej.: 323/22103 (funcionamiento de centros docentes / combustibles).",
 "vinculacion":"Nivel de vinculación jurídica: el nivel de agregación en el que el crédito es realmente limitativo; por debajo de él se puede mover el gasto sin tramitar una modificación de crédito (art. 172 TRLHL).",
 "intervencion":"Intervención: el órgano de control interno de la entidad local, con función de fiscalización previa del gasto y de informe preceptivo del presupuesto. Lo desempeña un funcionario de habilitación nacional.",
 "pleno":"Pleno: órgano colegiado formado por todos los concejales o diputados. Es el único competente para aprobar el presupuesto.",
 "bop":"Boletín Oficial de la Provincia: diario oficial donde las entidades locales publican sus anuncios y acuerdos con efectos frente a terceros.",
 "prorroga":"Prórroga presupuestaria: si el 1 de enero no ha entrado en vigor el presupuesto nuevo, sigue rigiendo automáticamente el anterior con sus créditos iniciales.",
 "interesado":"Interesado: quien está legitimado para intervenir en un procedimiento. En el presupuesto, la ley define expresamente quiénes lo son (art. 170.1).",
 "liquidacion":"Liquidación del presupuesto: cierre contable del ejercicio, que determina los derechos y obligaciones pendientes, el remanente de tesorería y el resultado presupuestario.",
 "tcuentas":"Tribunal de Cuentas: órgano fiscalizador externo de las cuentas y la gestión económica del sector público, dependiente de las Cortes Generales.",
 "conten":"Recurso contencioso-administrativo: impugnación ante los juzgados y tribunales de lo contencioso-administrativo, es decir, ya fuera de la propia Administración.",
 "obra":"Obra: resultado de un conjunto de trabajos de construcción o ingeniería civil destinado a cumplir por sí mismo una función económica o técnica y que tiene por objeto un bien inmueble. También los trabajos que modifican la forma o sustancia del terreno o de su vuelo.","obracompleta":"Obra completa: la susceptible de ser entregada al uso general o al servicio correspondiente, comprendiendo todos los elementos precisos para su utilización.","riesgo":"Riesgo operacional: el que asume el concesionario cuando no está garantizado que, en condiciones normales de funcionamiento, recupere las inversiones ni cubra los costes. Abarca el riesgo de demanda, el de suministro o ambos, y su pérdida potencial no puede ser meramente nominal o desdeñable.","rdemanda":"Riesgo de demanda: el debido a la demanda real de las obras o servicios objeto del contrato. Ej.: que por el peaje pasen menos coches de los previstos.","rsuministro":"Riesgo de suministro: el relativo al suministro de las obras o servicios, en particular el riesgo de que la prestación no se ajuste a la demanda.","valorest":"Valor estimado: importe total, sin IVA, que el órgano de contratación estima que puede alcanzar el contrato, incluidas prórrogas, modificaciones previstas y primas. Se calcula conforme al art. 101 y es el que determina si un contrato es SARA.","sara2":"Contrato sujeto a regulación armonizada (SARA): el de obras, concesión de obras, concesión de servicios, suministro o servicios cuyo valor estimado alcanza el umbral europeo, celebrado por un poder adjudicador; también los subvencionados del art. 23.","mixto":"Contrato mixto: el que contiene prestaciones correspondientes a otro u otros contratos de distinta clase. Solo cabe en las condiciones del art. 34.2.","cadmin":"Contrato administrativo: el celebrado por una Administración Pública cuyo objeto es típico (obras, concesiones, suministro, servicios) o que tiene naturaleza administrativa especial. Se rige íntegramente por la LCSP y el derecho administrativo.","cprivado":"Contrato privado: el que, por su objeto o por el sujeto que lo celebra, se rige por el derecho privado en cuanto a efectos y extinción, aunque su preparación y adjudicación puedan seguir reglas administrativas.","adminespecial":"Contrato administrativo especial: el de objeto distinto de los típicos que tiene naturaleza administrativa por estar vinculado al giro o tráfico específico de la Administración o por satisfacer de forma directa e inmediata una finalidad pública de su competencia.","girotrafico":"Giro o tráfico específico: el ámbito propio de actividad de una Administración. Ej.: la explotación de un bar en un hospital está vinculada al giro del servicio sanitario."

const ARTS=[{n:12,t:"Calificación de los contratos",ubic:"Título Preliminar (Disposiciones generales) ▸ Capítulo II (Contratos del sector público) ▸ Sección 1.ª (Delimitación de los tipos contractuales)",idea:"Los cinco contratos típicos se califican por esta sección; el resto, por su normativa.",literal:`<p>1. Los contratos de obras, concesión de obras, concesión de servicios, suministro y servicios que celebren las entidades pertenecientes al sector público se calificarán de acuerdo con las normas contenidas en la presente sección.</p><p>2. Los restantes contratos del sector público se calificarán según las normas de derecho administrativo o de derecho privado que les sean de aplicación.</p>`,dis:`<ul>
<li><b>12.1 — contratos típicos:</b> <b>obras, concesión de obras, concesión de servicios, suministro y servicios</b> se califican conforme a las normas de esta sección (arts. 13 a 18).</li>
<li><b>12.2 — los demás:</b> se califican según las normas de <b>derecho administrativo o de derecho privado</b> que les sean de aplicación.</li>
</ul>
<div class="box ej"><span class="lbl">Por qué importa calificar</span>La calificación no es una etiqueta académica: de ella dependen el <b>régimen de preparación y adjudicación</b>, los <b>umbrales</b> que convierten el contrato en SARA (arts. 20 a 22), el <b>plazo máximo de duración</b> y hasta la <b>jurisdicción competente</b> (art. 27).</div>`,llano:`<p>La ley tiene cinco cajones con nombre propio: obras, concesión de obras, concesión de servicios, suministro y servicios. Lo primero que hay que hacer con cualquier contrato es ver en qué cajón entra, porque de eso depende todo lo demás. Si no entra en ninguno, se busca su régimen en otra normativa.</p>`,porque:`<p>La tipificación permite <b>ordenar el sistema</b>: sin ella, cada contrato exigiría un régimen a medida. Además, los tipos españoles se corresponden con los de las directivas europeas, lo que hace posible aplicar los umbrales armonizados de forma homogénea en toda la Unión.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> clasificar los gastos de casa antes de decidir cómo pagarlos: no es lo mismo la hipoteca que la compra semanal.</li>
<li><b>Real:</b> un ayuntamiento quiere renovar el alumbrado. Si solo compra las luminarias, es <b>suministro</b>; si además las instala con obra civil, será <b>obras</b> o un contrato mixto; si el adjudicatario asume la explotación y cobra por ahorro energético con riesgo, puede ser <b>concesión de servicios</b>.</li>
<li><b>Caso límite:</b> un contrato de patrocinio deportivo: no es ninguno de los cinco tipos, así que se califica según las normas administrativas o privadas aplicables (art. 12.2), y probablemente será un contrato administrativo especial o privado según su objeto.</li>
</ul>`,noej:`<ul>
<li><b>No es un tipo contractual</b> el contrato mixto: es una combinación de tipos con reglas propias de determinación del régimen (art. 18).</li>
<li><b>No se califican</b> por esta sección los contratos patrimoniales: están excluidos (art. 9).</li>
</ul>`,conex:`<ul>
<li><b>Arts. 13 a 18:</b> definición de cada tipo.</li>
<li><b>Art. 25:</b> el carácter administrativo se predica precisamente de estos cinco tipos cuando los celebra una Administración Pública.</li>
<li><b>Art. 2.4:</b> el CPV como herramienta de identificación del objeto.</li>
</ul>`,trampas:`<ul>
<li>Son <b>cinco</b> tipos. Desde 2018 ya no existe el "contrato de gestión de servicios públicos" ni el de "colaboración público-privada": la concesión de servicios ocupó su lugar.</li>
<li>El art. 12.2 no deja los demás contratos sin régimen: los remite a su normativa.</li>
</ul>`,ancla:`<p><b>Los cinco tipos — "O-CO-CS-SU-SE":</b> <b>O</b>bras · <b>CO</b>ncesión de obras · <b>C</b>oncesión de <b>S</b>ervicios · <b>SU</b>ministro · <b>SE</b>rvicios.<br>Truco: dos parejas y un solitario — obras y su concesión, servicios y su concesión, y en medio el suministro.</p>`,vis:`<svg viewBox="0 0 640 150" role="img" aria-label="Los cinco tipos contractuales">

{n:13,t:"Contrato de obras",ubic:"Título Preliminar (Disposiciones generales) ▸ Capítulo II (Contratos del sector público) ▸ Sección 1.ª (Delimitación de los tipos contractuales)",idea:"Obras: ejecutar una obra sobre inmueble, y siempre referida a obra completa.",literal:`<p>1. Son contratos de obras aquellos que tienen por objeto uno de los siguientes:</p><p>a) La ejecución de una obra, aislada o conjuntamente con la redacción del proyecto, o la realización de alguno de los trabajos enumerados en el Anexo I.</p><p>b) La realización, por cualquier medio, de una obra que cumpla los requisitos fijados por la entidad del sector público contratante que ejerza una influencia decisiva en el tipo o el proyecto de la obra.</p><p>2. Por «obra» se entenderá el resultado de un conjunto de trabajos de construcción o de ingeniería civil, destinado a cumplir por sí mismo una función económica o técnica, que tenga por objeto un bien inmueble.</p><p>También se considerará «obra» la realización de trabajos que modifiquen la forma o sustancia del terreno o de su vuelo, o de mejora del medio físico o natural.</p><p>3. Los contratos de obras se referirán a una obra completa, entendiendo por esta la susceptible de ser entregada al uso general o al servicio correspondiente, sin perjuicio de las ampliaciones de que posteriormente pueda ser objeto y comprenderá todos y cada uno de los elementos que sean precisos para la utilización de la obra.</p><p>No obstante lo anterior, podrán contratarse obras definidas mediante proyectos independientes relativos a cada una de las partes de una obra completa, siempre que estas sean susceptibles de utilización independiente, en el sentido del uso general o del servicio, o puedan ser sustancialmente definidas y preceda autorización administrativa del órgano de contratación que funde la conveniencia de la referida contratación.</p><p>Se podrán celebrar contratos de obras sin referirse a una obra completa en los supuestos previstos en el apartado 4 del artículo 30 de la presente Ley cuando la responsabilidad de la obra completa corresponda a la Administración por tratarse de un supuesto de ejecución de obras por la propia Administración Pública.</p>`,dis:`<ul>
<li><b>13.1 — objeto:</b> a) la <b>ejecución de una obra</b>, aislada o junto con la redacción del proyecto, o la realización de trabajos del <b>Anexo I</b>; b) la realización <b>por cualquier medio</b> de una obra que cumpla los requisitos fijados por la entidad contratante que ejerza una <b>influencia decisiva</b> en el tipo o el proyecto de la obra.</li>
<li><b>13.2 — concepto de <span class="t" data-k="obra">obra</span>:</b> resultado de un conjunto de trabajos de construcción o de ingeniería civil <b>destinado a cumplir por sí mismo una función económica o técnica</b> y que tenga por objeto un <b>bien inmueble</b>. También los trabajos que <b>modifiquen la forma o sustancia del terreno o de su vuelo</b>, o de mejora del medio físico o natural.</li>
<li><b>13.3 — <span class="t" data-k="obracompleta">obra completa</span>:</b> regla general. Excepciones:
<ol><li>proyectos independientes de partes de una obra completa, si son <b>susceptibles de utilización independiente</b> o pueden ser sustancialmente definidas, y <b>precede autorización</b> del órgano de contratación que funde su conveniencia;</li>
<li>los supuestos del <b>art. 30.4</b>, cuando la responsabilidad de la obra completa corresponde a la Administración por ejecutarla ella misma.</li></ol></li>
</ul>`,llano:`<p>Hay contrato de obras cuando lo que se encarga acaba pegado al suelo: un edificio, una carretera, una remodelación de una plaza. Y hay una regla de oro: se contrata la obra <b>entera</b>, la que sirve para algo por sí sola. No se puede trocear un puente en tres contratos para no licitar, salvo que cada trozo sirva por separado y se justifique.</p>`,porque:`<p>La exigencia de <b>obra completa</b> es una garantía doble: presupuestaria, porque evita comprometer el primer tramo de una obra que luego no se puede terminar; y de transparencia, porque impide el <b>fraccionamiento</b> para eludir la publicidad y el procedimiento. La letra b) del 13.1 persigue el mismo objetivo desde otro ángulo: si la Administración diseña la obra y otro la ejecuta "por cualquier medio", sigue siendo contrato de obras aunque se disfrace.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> no encargas media cocina: encargas la cocina completa, porque media cocina no sirve para cocinar.</li>
<li><b>Real:</b> construcción de un centro de salud por 2,8 M€ con redacción de proyecto incluida: contrato de obras del art. 13.1.a).</li>
<li><b>Real (13.2, segundo párrafo):</b> la restauración de una ladera degradada con movimientos de tierra y replantación es obra, porque modifica la forma o sustancia del terreno y mejora el medio físico.</li>
<li><b>Caso límite:</b> urbanización de un polígono ejecutada por fases. Cabe contratar por proyectos independientes si cada fase es susceptible de utilización independiente y media autorización motivada del órgano de contratación (art. 13.3).</li>
</ul>`,noej:`<ul>
<li><b>No es obra</b> el mantenimiento ordinario de un edificio sin alterar su configuración: suele ser contrato de servicios.</li>
<li><b>No es obra</b> la compra de mobiliario urbano ya fabricado: es suministro.</li>
<li><b>No cabe</b> trocear la obra sin que cada parte sea utilizable de forma independiente y sin autorización previa.</li>
</ul>`,conex:`<ul>
<li><b>Anexo I:</b> lista de trabajos que constituyen contrato de obras.</li>
<li><b>Art. 99.2:</b> prohibición del fraccionamiento del objeto del contrato para eludir la publicidad o el procedimiento.</li>
<li><b>Art. 30.4:</b> ejecución de obras por la propia Administración.</li>
<li><b>Art. 20:</b> umbral SARA de los contratos de obras.</li>
<li><b>Arts. 231 y ss.:</b> elaboración del proyecto de obras.</li>
</ul>`,trampas:`<ul>
<li>La obra debe cumplir <b>por sí misma</b> una función económica o técnica y recaer sobre un <b>bien inmueble</b>.</li>
<li>La letra b) del 13.1 exige <b>influencia decisiva</b> de la entidad en el tipo o proyecto de la obra.</li>
<li>La excepción a la obra completa exige <b>autorización administrativa previa</b> que funde su conveniencia.</li>
<li>También es obra la modificación de la forma o sustancia del <b>terreno o de su vuelo</b>.</li>
</ul>`,ancla:`<p><b>"Obra = inmueble + función propia."</b> Si no queda pegado al suelo ni sirve por sí solo, no es obra.<br>Y la regla que se pregunta siempre: <b>obra completa</b>, salvo partes utilizables por separado con autorización.</p>`,vis:`<svg viewBox="0 0 640 165" role="img" aria-label="Concepto de obra y regla de obra completa">
<rect x="30" y="25" width="260" height="72" rx="8" fill="var(--acc-soft)" stroke="var(--acc)"/>
<text x="160" y="47" text-anchor="middle" font-size="11" font-weight="700" fill="var(--acc)">¿Qué es OBRA? (13.2)</text>
<text x="160" y="66" text-anchor="middle" font-size="10" fill="currentColor">construcción o ingeniería civil sobre inmueble</text>
<text x="160" y="83" text-anchor="middle" font-size="10" fill="currentColor">que cumple por sí misma una función</text>
<rect x="345" y="25" width="265" height="72" rx="8" fill="var(--ej-bg)" stroke="var(--ej)"/>
<text x="477" y="47" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ej)">También es obra</text>
<text x="477" y="66" text-anchor="middle" font-size="10" fill="currentColor">modificar forma o sustancia del terreno</text>
<text x="477" y="83" text-anchor="middle" font-size="10" fill="currentColor">o de su vuelo · mejora del medio físico</text>
<rect x="90" y="110" width="460" height="46" rx="8" fill="var(--warn-bg)" stroke="var(--warn)"/>
<text x="320" y="129" text-anchor="middle" font-size="11" font-weight="700" fill="var(--warn)">REGLA: OBRA COMPLETA (13.3)</text>
<text x="320" y="147" text-anchor="middle" font-size="10" fill="currentColor">salvo partes de utilización independiente con autorización previa · o art. 30.4</text>
</svg>`},
{n:14,t:"Contrato de concesión de obras",ubic:"Título Preliminar (Disposiciones generales) ▸ Capítulo II (Contratos del sector público) ▸ Sección 1.ª (Delimitación de los tipos contractuales)",idea:"Concesión de obras: construyes y te cobras explotándola, asumiendo el riesgo.",literal:`<p>1. La concesión de obras es un contrato que tiene por objeto la realización por el concesionario de algunas de las prestaciones a que se refiere el artículo anterior, incluidas las de restauración y reparación de construcciones existentes, así como la conservación y mantenimiento de los elementos construidos, y en el que la contraprestación a favor de aquel consiste, o bien únicamente en el derecho a explotar la obra en el sentido del apartado cuarto siguiente, o bien en dicho derecho acompañado del de percibir un precio.</p><p>2. El contrato podrá comprender, además, el siguiente contenido:</p><p>a) La adecuación, reforma y modernización de la obra para adaptarla a las características técnicas y funcionales requeridas para la correcta prestación de los servicios o la realización de las actividades económicas a las que sirve de soporte material.</p><p>b) Las actuaciones de reposición y gran reparación que sean exigibles en relación con los elementos que ha de reunir cada una de las obras para mantenerse apta a fin de que los servicios y actividades a los que aquellas sirven puedan ser desarrollados adecuadamente de acuerdo con las exigencias económicas y las demandas sociales.</p><p>3. El contrato de concesión de obras podrá también prever que el concesionario esté obligado a proyectar, ejecutar, conservar, reponer y reparar aquellas obras que sean accesorias o estén vinculadas con la principal y que sean necesarias para que esta cumpla la finalidad determinante de su construcción y que permitan su mejor funcionamiento y explotación, así como a efectuar las actuaciones ambientales relacionadas con las mismas que en ellos se prevean. En el supuesto de que las obras vinculadas o accesorias puedan ser objeto de explotación o aprovechamiento económico, estos corresponderán al concesionario conjuntamente con la explotación de la obra principal, en la forma determinada por los pliegos respectivos.</p><p>4. El derecho de explotación de las obras, a que se refiere el apartado primero de este artículo, deberá implicar la transferencia al concesionario de un riesgo operacional en la explotación de dichas obras abarcando el riesgo de demanda o el de suministro, o ambos. Se entiende por riesgo de demanda el que se debe a la demanda real de las obras o servicios objeto del contrato y riesgo de suministro el relativo al suministro de las obras o servicios objeto del contrato, en particular el riesgo de que la prestación de los servicios no se ajuste a la demanda.</p><p>Se considerará que el concesionario asume un riesgo operacional cuando no esté garantizado que, en condiciones normales de funcionamiento, el mismo vaya a recuperar las inversiones realizadas ni a cubrir los costes en que hubiera incurrido como consecuencia de la explotación de las obras que sean objeto de la concesión. La parte de los riesgos transferidos al concesionario debe suponer una exposición real a las incertidumbres del mercado que implique que cualquier pérdida potencial estimada en que incurra el concesionario no es meramente nominal o desdeñable.</p>`,dis:`<ul>
<li><b>14.1 — objeto:</b> realización por el concesionario de las prestaciones del art. 13, <b>incluidas restauración y reparación</b> de construcciones existentes y la <b>conservación y mantenimiento</b> de lo construido. <b>Contraprestación:</b> el <b>derecho a explotar la obra</b>, solo o <b>acompañado del derecho a percibir un precio</b>.</li>
<li><b>14.2 — contenido adicional posible:</b> a) adecuación, reforma y modernización de la obra; b) reposición y gran reparación.</li>
<li><b>14.3 — obras accesorias o vinculadas:</b> el concesionario puede quedar obligado a proyectarlas, ejecutarlas, conservarlas, reponerlas y repararlas, y a efectuar actuaciones ambientales. Si son susceptibles de explotación económica, esta le corresponde junto con la principal, según los pliegos.</li>
<li><b>14.4 — <span class="t" data-k="riesgo">riesgo operacional</span>:</b> el derecho de explotación <b>debe implicar</b> su transferencia al concesionario, abarcando el <span class="t" data-k="rdemanda">riesgo de demanda</span>, el <span class="t" data-k="rsuministro">de suministro</span> o ambos. Se entiende asumido cuando <b>no esté garantizado</b> que en condiciones normales recupere las inversiones ni cubra los costes, y la pérdida potencial <b>no sea meramente nominal o desdeñable</b>.</li>
</ul>`,llano:`<p>La Administración quiere un aparcamiento pero no quiere pagarlo. Le dice a una empresa: constrúyelo tú y cóbrate durante veinte años con lo que paguen los usuarios. Eso es una concesión de obras. La clave es que la empresa <b>corre el riesgo</b>: si vienen pocos coches, pierde. Si el riesgo no existe porque la Administración le garantiza los ingresos, ya no hay concesión, hay contrato de obras.</p>`,porque:`<p>El <b>riesgo operacional</b> es la frontera que Europa dibujó para evitar que las concesiones se usaran como financiación encubierta: sin riesgo real, la concesión sería un préstamo disfrazado que saca deuda del balance público sin transferir nada. Por eso el art. 14.4 lo define con tanto detalle y exige que la pérdida potencial no sea "meramente nominal o desdeñable".</p>`,ej:`<ul>
<li><b>Cotidiano:</b> un quiosco que montas tú y del que vives según lo que vendas: si no vende, pierdes tú.</li>
<li><b>Real:</b> concesión de obra para construir y explotar durante 30 años un aparcamiento subterráneo de 320 plazas: el concesionario invierte 6 M€ y se cobra con las tarifas de los usuarios.</li>
<li><b>Caso límite:</b> misma concesión, pero el ayuntamiento garantiza contractualmente al concesionario unos ingresos mínimos que cubren la inversión y los costes. Ya <b>no hay riesgo operacional</b>: no es concesión, sino contrato de obras con pago aplazado.</li>
</ul>`,noej:`<ul>
<li><b>No es concesión de obras</b> aquella en la que la Administración garantiza la recuperación de inversiones y costes.</li>
<li><b>No es concesión de obras</b> la mera autorización demanial: esa está excluida (art. 9.1).</li>
<li><b>No basta</b> un riesgo teórico o simbólico: debe implicar exposición real a las incertidumbres del mercado.</li>
</ul>`,conex:`<ul>
<li><b>Art. 13:</b> las prestaciones que constituyen su objeto.</li>
<li><b>Art. 15.2:</b> remite a este apartado 4 para el riesgo operacional en la concesión de servicios.</li>
<li><b>Art. 9.1:</b> excluye las concesiones demaniales, pero <b>no</b> la concesión de obras.</li>
<li><b>Art. 29.6:</b> plazos máximos de duración de las concesiones.</li>
<li><b>Art. 247 y 248:</b> estudio de viabilidad y anteproyecto.</li>
</ul>`,trampas:`<ul>
<li>El riesgo puede ser de <b>demanda, de suministro o ambos</b>.</li>
<li>La contraprestación puede ser <b>solo explotación</b> o <b>explotación más precio</b>: la existencia de un precio no desnaturaliza la concesión mientras haya riesgo.</li>
<li>La fórmula literal que hay que retener: pérdida potencial <b>«no es meramente nominal o desdeñable»</b>.</li>
<li>La concesión de obras incluye <b>conservación y mantenimiento</b> de lo construido.</li>
</ul>`,ancla:`<p><b>"Construyo, exploto y me arriesgo."</b> Tres verbos: sin el tercero, no hay concesión.<br>Riesgo = <b>demanda</b> (que no vengan) o <b>suministro</b> (que no cuadre la prestación).</p>`,vis:`<svg viewBox="0 0 640 185" role="img" aria-label="Elementos de la concesión de obras">

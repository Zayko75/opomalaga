{n:27,t:"Jurisdicción competente",ubic:"Título Preliminar (Disposiciones generales) ▸ Capítulo II (Contratos del sector público) ▸ Sección 3.ª (Contratos administrativos y contratos privados)",idea:"Contencioso para lo público y para toda adjudicación; civil para efectos de lo privado.",literal:`<p>1. Serán competencia del orden jurisdiccional contencioso-administrativo las siguientes cuestiones:</p><p>a) Las relativas a la preparación, adjudicación, efectos, modificación y extinción de los contratos administrativos.</p><p>b) Las que se susciten en relación con la preparación y adjudicación de los contratos privados de las Administraciones Públicas.</p><p>Adicionalmente, respecto de los contratos referidos en los números 1.º y 2.º de la letra a) del apartado primero del artículo 25 de la presente Ley que estén sujetos a regulación armonizada, las impugnaciones de las modificaciones basadas en el incumplimiento de lo establecido en los artículos 204 y 205 de la presente Ley, por entender que la modificación debió ser objeto de una nueva adjudicación.</p><p>c) Las referidas a la preparación, adjudicación y modificaciones contractuales, cuando la impugnación de estas últimas se base en el incumplimiento de lo establecido en los artículos 204 y 205 de la presente Ley, cuando se entienda que dicha modificación debió ser objeto de una nueva adjudicación de los contratos celebrados por los poderes adjudicadores que no tengan la consideración de Administración Pública.</p><p>d) Las relativas a la preparación y adjudicación de los contratos de entidades del sector público que no tengan el carácter de poderes adjudicadores.</p><p>e) Los recursos interpuestos contra las resoluciones que se dicten por los órganos administrativos de resolución de los recursos previstos en el artículo 44 de esta Ley, así como en el artículo 321.5.</p><p>f) Las cuestiones que se susciten en relación con la preparación, adjudicación y modificación de los contratos subvencionados a que se refiere el artículo 23 de la presente Ley.</p><p>2. El orden jurisdiccional civil será el competente para resolver:</p><p>a) Las controversias que se susciten entre las partes en relación con los efectos y extinción de los contratos privados de las entidades que tengan la consideración de poderes</p><p>adjudicadores, sean o no Administraciones Públicas, con excepción de las modificaciones contractuales citadas en las letras b) y c) del apartado anterior.</p><p>b) De las cuestiones referidas a efectos y extinción de los contratos que celebren las entidades del sector público que no tengan el carácter de poderes adjudicadores.</p><p>c) El conocimiento de las cuestiones litigiosas relativas a la financiación privada del contrato de concesión de obra pública o de concesión de servicios, salvo en lo relativo a las actuaciones en ejercicio de las obligaciones y potestades administrativas que, con arreglo a lo dispuesto en esta Ley, se atribuyen a la Administración concedente, y en las que será competente el orden jurisdiccional contencioso-administrativo.</p>`,dis:`<table><thead><tr><th>Orden</th><th>Competencias</th></tr></thead><tbody>
<tr><td rowspan="2"><b>Contencioso-administrativo (27.1)</b></td><td><b>a)</b> preparación, adjudicación, <b>efectos, modificación y extinción</b> de los contratos <b>administrativos</b> · <b>b)</b> preparación y adjudicación de los contratos <b>privados de las Administraciones Públicas</b>, y —en los del art. 25.1.a) 1.º y 2.º sujetos a regulación armonizada— las impugnaciones de <b>modificaciones</b> por incumplimiento de los arts. 204 y 205</td></tr>
<tr><td><b>c)</b> preparación, adjudicación y modificaciones (por incumplimiento de los arts. 204 y 205) de los contratos de <b>poderes adjudicadores que no sean Administración</b> · <b>d)</b> preparación y adjudicación de los contratos de entidades que <b>no sean poder adjudicador</b> · <b>e)</b> recursos contra las resoluciones de los órganos de recursos contractuales (arts. 44 y 321.5) · <b>f)</b> preparación, adjudicación y modificación de los <b>contratos subvencionados</b> del art. 23</td></tr>
<tr><td><b>Civil (27.2)</b></td><td><b>a)</b> efectos y extinción de los contratos <b>privados de poderes adjudicadores</b>, sean o no Administraciones, salvo las modificaciones de las letras b) y c) anteriores · <b>b)</b> efectos y extinción de los contratos de entidades que <b>no sean poder adjudicador</b> · <b>c)</b> cuestiones litigiosas sobre la <b>financiación privada</b> de la concesión de obras o de servicios, salvo las actuaciones en ejercicio de obligaciones y potestades administrativas, que van al contencioso</td></tr>
</tbody></table>
<div class="box ej"><span class="lbl">La regla que resume el artículo</span><b>Toda adjudicación</b>, sea el contrato administrativo o privado, es contencioso-administrativa. Lo que se reparte es el <b>después</b>: efectos y extinción van al contencioso si el contrato es administrativo y al civil si es privado.</div>`,llano:`<p>¿A qué juzgado se va? Si el problema está en cómo se preparó o adjudicó el contrato, siempre al contencioso-administrativo, aunque el contrato sea privado: elegir contratista es una decisión pública. Si el problema surge después —que no cumple, que hay que resolver— entonces depende: contencioso si el contrato era administrativo, civil si era privado.</p>`,porque:`<p>Es la aplicación procesal de la <b>doctrina de los actos separables</b>: la fase de selección del contratista es siempre administrativa porque en ella se ejercen potestades y se gasta dinero público, mientras que la ejecución de un contrato privado es una relación entre iguales. Las excepciones sobre modificaciones existen porque una modificación encubierta equivale a una <b>nueva adjudicación sin licitar</b>, y eso vuelve a ser materia administrativa.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> quién arbitra depende de la fase del partido: el sorteo lo supervisa la federación, las faltas las pita el árbitro.</li>
<li><b>Real:</b> un licitador excluido de un contrato de suministro de un ayuntamiento recurre su exclusión: <b>contencioso-administrativo</b>. El proveedor de un solar comprado por el mismo ayuntamiento reclama por vicios ocultos: <b>civil</b>.</li>
<li><b>Caso límite:</b> modificación de un contrato privado SARA de servicios artísticos que un competidor considera una nueva adjudicación encubierta: pese a ser contrato privado, va al <b>contencioso-administrativo</b> (art. 27.1.b), párrafo segundo).</li>
</ul>`,noej:`<ul>
<li><b>No va al civil</b> ninguna cuestión de preparación o adjudicación, sea cual sea el contrato.</li>
<li><b>No va al contencioso</b> el incumplimiento ordinario de un contrato privado.</li>
<li><b>No es civil</b> lo relativo a las potestades administrativas en la financiación privada de una concesión.</li>
</ul>`,conex:`<ul>
<li><b>Arts. 25 y 26:</b> la calificación de la que depende el reparto.</li>
<li><b>Art. 44:</b> recurso especial en materia de contratación.</li>
<li><b>Arts. 204 y 205:</b> modificaciones previstas y no previstas.</li>
<li><b>Art. 23:</b> contratos subvencionados, cuya impugnación va al contencioso.</li>
</ul>`,trampas:`<ul>
<li><b>Preparación y adjudicación: siempre contencioso.</b> Es la clave del artículo.</li>
<li>Las <b>modificaciones</b> impugnadas por eludir una nueva adjudicación van al contencioso aunque el contrato sea privado.</li>
<li>La <b>financiación privada</b> de las concesiones es civil, <b>salvo</b> las actuaciones en ejercicio de potestades administrativas.</li>
<li>Los recursos contra las resoluciones de los tribunales administrativos de contratación son contencioso-administrativos (letra e).</li>
</ul>`,ancla:`<p><b>"El cómo te elijo: contencioso. El cómo cumplimos: depende."</b><br>Y una excepción que se pregunta: la <b>modificación encubierta</b> siempre vuelve al contencioso.</p>`,vis:`<svg viewBox="0 0 640 190" role="img" aria-label="Reparto de jurisdicción en materia contractual">
<rect x="120" y="10" width="400" height="34" rx="8" fill="var(--acc)" stroke="var(--acc)"/>
<text x="320" y="32" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">¿EN QUÉ FASE ESTÁ EL CONFLICTO?</text>
<rect x="30" y="58" width="260" height="112" rx="8" fill="var(--acc-soft)" stroke="var(--acc)"/>
<text x="160" y="80" text-anchor="middle" font-size="11" font-weight="700" fill="var(--acc)">PREPARACIÓN Y ADJUDICACIÓN</text>
<text x="160" y="102" text-anchor="middle" font-size="11" fill="currentColor">Contencioso-administrativo</text>
<text x="160" y="122" text-anchor="middle" font-size="10" fill="var(--ink2)">siempre, sea el contrato</text>
<text x="160" y="137" text-anchor="middle" font-size="10" fill="var(--ink2)">administrativo o privado</text>
<text x="160" y="158" text-anchor="middle" font-size="10" fill="var(--exc)">+ modificaciones encubiertas</text>
<rect x="350" y="58" width="260" height="112" rx="8" fill="var(--ej-bg)" stroke="var(--ej)"/>
<text x="480" y="80" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ej)">EFECTOS Y EXTINCIÓN</text>
<text x="480" y="104" text-anchor="middle" font-size="10" fill="currentColor">Contrato administrativo → contencioso</text>
<text x="480" y="124" text-anchor="middle" font-size="10" fill="currentColor">Contrato privado → civil</text>
<text x="480" y="150" text-anchor="middle" font-size="10" fill="var(--ink2)">financiación privada de concesiones: civil,</text>
<text x="480" y="164" text-anchor="middle" font-size="10" fill="var(--ink2)">salvo potestades administrativas</text>
</svg>`}];
</script>

const PLAZOS=[["5.404.000 €", "Umbral SARA de obras, concesión de obras y concesión de servicios", "Poder adjudicador", "20.1", "Valor estimado igual o superior"], ["140.000 €", "Umbral SARA de suministros y servicios de la AGE, sus OOAA y la Seguridad Social", "Estado", "21.1.a) y 22.1.a)", "En defensa, suministros del Anexo II"], ["216.000 €", "Umbral SARA de suministros y servicios del resto de entidades", "Entidades locales y demás", "21.1.b) y 22.1.b)", "El que aplican ayuntamientos y diputaciones"], ["750.000 €", "Umbral SARA de servicios sociales y otros específicos del Anexo IV", "Cualquier poder adjudicador", "22.1.c)", "Régimen aligerado europeo"], ["5.404.000 €", "Umbral de las obras subvencionadas en más del 50 %", "Particulares y entidades", "23.1.a)", "Ingeniería civil y edificios tasados"], ["216.000 €", "Umbral de los servicios vinculados a esas obras subvencionadas", "Particulares y entidades", "23.1.b)", "Solo obras y servicios: nunca suministros"], ["Más del 50 %", "Porcentaje de subvención directa que sujeta el contrato", "Poder adjudicador", "23.1", "El 50 % exacto no basta"], ["1.000.000 €", "Lotes exceptuables en obras", "Órgano de contratación", "20.2", "Si el acumulado exceptuado no supera el 20 %"], ["80.000 €", "Lotes exceptuables en suministros y servicios", "Órgano de contratación", "21.2 y 22.2", "Mismo límite del 20 % acumulado"], ["20 %", "Tope del importe acumulado de los lotes exceptuados", "Órgano de contratación", "20.2, 21.2 y 22.2", "Sobre el valor acumulado de la totalidad"], ["50.000 €", "Elemento de obra en un contrato mixto que obliga a elaborar proyecto", "Órgano de contratación", "18.3", "Arts. 231 y siguientes"]];
const FLASH=[["¿Cuáles son los cinco contratos típicos de la LCSP?", "Obras · concesión de obras · concesión de servicios · suministro · servicios (art. 12.1)."], ["¿Qué se entiende por obra?", "El resultado de un conjunto de trabajos de construcción o ingeniería civil destinado a cumplir <b>por sí mismo</b> una función económica o técnica y que tenga por objeto un <b>bien inmueble</b> (art. 13.2)."], ["¿A qué debe referirse un contrato de obras?", "A una <b>obra completa</b>, la susceptible de ser entregada al uso general o al servicio correspondiente (art. 13.3)."], ["¿Cuándo cabe contratar partes de una obra completa?", "Cuando sean susceptibles de utilización independiente o puedan ser sustancialmente definidas y preceda <b>autorización</b> del órgano de contratación que funde su conveniencia (art. 13.3)."], ["¿Qué caracteriza a la concesión de obras?", "Que la contraprestación consiste en el <b>derecho a explotar la obra</b>, solo o con un precio, y que implica la transferencia del <b>riesgo operacional</b> (art. 14)."], ["¿Qué es el riesgo operacional?", "Que no esté garantizado que, en condiciones normales, el concesionario recupere las inversiones ni cubra los costes; abarca el riesgo de <b>demanda</b>, el de <b>suministro</b> o ambos, y la pérdida potencial no puede ser <b>meramente nominal o desdeñable</b> (art. 14.4)."], ["¿Qué es la concesión de servicios?", "Aquella en que uno o varios <b>poderes adjudicadores</b> encomiendan a título oneroso la gestión de un servicio de su <b>titularidad o competencia</b>, con contrapartida en el derecho a explotarlo y transferencia del riesgo operacional (art. 15)."], ["¿Cuál es la frontera entre concesión de servicios y contrato de servicios?", "El <b>riesgo operacional</b>: si lo asume el contratista, concesión; si la retribución es cierta y la paga la Administración, contrato de servicios."], ["¿Qué es un contrato de suministro?", "El que tiene por objeto la <b>adquisición, el arrendamiento financiero o el arrendamiento</b>, con o sin opción de compra, de productos o bienes muebles (art. 16.1)."], ["Los cuatro supuestos que siempre son suministro", "Entregas sucesivas por precio unitario · informática y telecomunicaciones · fabricación por encargo · energía primaria o transformada (art. 16.3)."], ["¿Suministro o servicios: el software?", "Estándar y licencias de uso: <b>suministro</b>. Programas <b>desarrollados a medida</b>: contrato de <b>servicios</b> (art. 16.3.b)."], ["¿Qué es un contrato de servicios y qué límite tiene?", "Prestaciones de hacer, actividad o resultado <b>distinto de obra o suministro</b>. No pueden tener por objeto servicios que impliquen <b>ejercicio de la autoridad</b> inherente a los poderes públicos (art. 17)."], ["Regla general de los contratos mixtos", "Se atiende al carácter de la <b>prestación principal</b> (art. 18.1.a). En mixtos con concesiones y prestaciones separables adjudicadas en contrato único, decide si el valor estimado supera los umbrales de los arts. 20 a 22."], ["¿Cuándo exige proyecto un contrato mixto?", "Cuando un elemento sea una <b>obra que supere los 50.000 euros</b>: arts. 231 y siguientes (art. 18.3)."], ["Los tres requisitos para que un contrato sea SARA", "Ser de uno de los cinco tipos · alcanzar el <b>umbral</b> por valor estimado (art. 101) · que la entidad sea <b>poder adjudicador</b> (art. 19.1)."], ["Cita tres supuestos que nunca son SARA", "Los del art. 346 TFUE en defensa · los declarados <b>secretos o reservados</b> · determinados <b>servicios jurídicos</b> · protección civil sin ánimo de lucro · ferrocarril y metro · agua potable (art. 19.2)."], ["Umbral SARA de obras y concesiones", "<b>5.404.000 euros</b> de valor estimado (art. 20.1)."], ["Umbrales SARA de suministros", "<b>140.000 €</b> para la AGE, sus OOAA y la Seguridad Social; <b>216.000 €</b> para los demás (art. 21.1)."], ["Umbrales SARA de servicios", "<b>140.000 €</b>, <b>216.000 €</b> y <b>750.000 €</b> para servicios sociales y otros específicos del Anexo IV (art. 22.1)."], ["¿Qué lotes pueden exceptuarse de la regulación armonizada?", "Los inferiores a <b>1.000.000 €</b> en obras y a <b>80.000 €</b> en suministros y servicios, siempre que el acumulado de los exceptuados no supere el <b>20 %</b> del total."], ["¿Qué es un contrato subvencionado SARA?", "Contrato de <b>obras o servicios</b> subvencionado de forma directa en <b>más de un 50 %</b> por un poder adjudicador, en las categorías y umbrales del art. 23."], ["¿Qué contratos son administrativos?", "Los cinco tipos celebrados por una <b>Administración Pública</b>, salvo servicios financieros, artísticos y suscripciones; más los <b>administrativos especiales</b> (art. 25.1)."], ["¿Qué es un contrato administrativo especial?", "El de objeto distinto de los típicos vinculado al <b>giro o tráfico específico</b> de la Administración o que satisface de forma <b>directa o inmediata</b> una finalidad pública de su competencia (art. 25.1.b)."], ["Régimen de los contratos privados de las Administraciones", "Preparación y adjudicación por la LCSP; <b>efectos, modificación y extinción por derecho privado</b> (art. 26.2)."], ["¿Qué jurisdicción conoce de la adjudicación de un contrato privado de un ayuntamiento?", "La <b>contencioso-administrativa</b> (art. 27.1.b). Los efectos y la extinción, la civil."], ["¿Y de la financiación privada de una concesión?", "El orden <b>civil</b>, salvo las actuaciones en ejercicio de obligaciones y potestades administrativas, que van al contencioso (art. 27.2.c)."]];
const TEST=[{"a": 13, "q": "Los contratos de obras deben referirse, como regla, a:", "o": [["una obra completa, susceptible de ser entregada al uso general o al servicio correspondiente", 1, "Correcto: art. 13.3."], ["cada una de las fases del proyecto por separado", 0, "Solo cabe si son susceptibles de utilización independiente y media autorización previa."], ["un presupuesto máximo de 5.404.000 euros", 0, "Esa cifra es el umbral SARA, no un requisito del objeto."], ["obras sobre bienes muebles o inmuebles indistintamente", 0, "La obra tiene por objeto un <b>bien inmueble</b> (art. 13.2)."]]}, {"a": 14, "q": "Para que exista concesión de obras es imprescindible:", "o": [["la transferencia al concesionario del riesgo operacional", 1, "Correcto: art. 14.4. Sin riesgo no hay concesión."], ["que el concesionario no perciba ningún precio de la Administración", 0, "Puede percibirlo: la contraprestación puede ser explotación más precio."], ["que la obra sea de nueva construcción", 0, "Incluye restauración y reparación de construcciones existentes."], ["que la duración supere los 20 años", 0, "La duración no define el tipo contractual."]]}, {"a": 14, "q": "Se considera que hay riesgo operacional aunque la pérdida potencial del concesionario sea meramente nominal.", "vf": true, "ok": false, "fb": "<b>Falso.</b> El art. 14.4 exige que la pérdida potencial estimada <b>no sea meramente nominal o desdeñable</b>: debe haber exposición real a las incertidumbres del mercado."}, {"a": 15, "q": "Un ayuntamiento paga a una empresa una cantidad fija mensual por prestar el servicio de recogida de residuos, con independencia del uso. Se trata de:", "o": [["un contrato de servicios", 1, "Correcto: no hay transferencia del riesgo operacional, luego no es concesión (arts. 15 y 17)."], ["una concesión de servicios", 0, "Faltaría el riesgo operacional del art. 14.4, al que remite el art. 15.2."], ["un contrato administrativo especial", 0, "El objeto encaja en un tipo contractual típico."], ["un contrato mixto", 0, "No hay prestaciones de distinta clase."]]}, {"a": 16, "q": "El desarrollo de un programa de ordenador a medida para un ayuntamiento se califica como:", "o": [["contrato de servicios", 1, "Correcto: excepción expresa del art. 16.3.b)."], ["contrato de suministro", 0, "El software estándar y las licencias sí son suministro; el desarrollado a medida, no."], ["contrato privado en todo caso", 0, "La calificación como servicio no prejuzga su carácter administrativo o privado."], ["negocio excluido por recaer sobre propiedad incorporal", 0, "El art. 9.2 exceptúa precisamente los programas de ordenador."]]}, {"a": 16, "q": "Completa: «Son contratos de suministro los que tienen por objeto la adquisición, el arrendamiento financiero, o el arrendamiento, con o sin opción de compra, de productos o bienes ______».", "gap": "muebles", "fb": "Bienes <b>muebles</b> (art. 16.1). Los inmuebles son negocio patrimonial excluido (art. 9.2)."}, {"a": 17, "q": "Los contratos de servicios:", "o": [["no pueden tener por objeto servicios que impliquen ejercicio de la autoridad inherente a los poderes públicos", 1, "Correcto: límite expreso del art. 17."], ["pueden incluir el ejercicio de potestades si así lo prevé el pliego", 0, "La prohibición es absoluta."], ["se definen por tener siempre un resultado material", 0, "Son prestaciones de hacer: actividad o resultado distinto de obra o suministro."], ["excluyen la ejecución sucesiva por precio unitario", 0, "Al contrario: el art. 17 la incluye expresamente."]]}, {"a": 18, "q": "En un contrato mixto con prestaciones no separables de obras y de concesión de obras, la adjudicación se rige por:", "o": [["el carácter de la prestación principal", 1, "Correcto: art. 18.1.b) 1.º"], ["las normas de la concesión en todo caso", 0, "Solo si, siendo separables, el valor de las otras prestaciones no supera los umbrales."], ["las normas del contrato de mayor duración", 0, "La duración no es criterio en este artículo."], ["las normas : [["el derecho privado", 1, "Correcto: art. 26.2. La preparación y adjudicación siguen reglas de la LCSP."], ["la LCSP en su integridad", 0, "Solo la preparación y adjudicación, en defecto de normas específicas."], ["el derecho administrativo con carácter supletorio de primer grado", 0, "El precepto remite al derecho privado para esta fase."], ["las normas que fije el pliego libremente", 0, "El régimen lo fija la ley."]]}, {"a": 27, "q": "¿Qué orden jurisdiccional conoce de la impugnación de la adjudicación de un contrato privado de un ayuntamiento?", "o": [["el contencioso-administrativo", 1, "Correcto: art. 27.1.b). La preparación y adjudicación son siempre contencioso-administrativas."], ["el civil", 0, "El civil conoce de los efectos y la extinción, no de la adjudicación."], ["el social", 0, "No interviene en materia contractual."], ["depende de la cuantía", 0, "El criterio no es cuantitativo."]]}, {"a": 27, "q": "Completa: «El conocimiento de las cuestiones litigiosas relativas a la ______ privada del contrato de concesión de obra pública o de concesión de servicios corresponde al orden civil, salvo las actuaciones en ejercicio de potestades administrativas».", "gap": "financiación", "fb": "<b>Financiación</b> privada (art. 27.2.c)."}, {"a": 12, "q": "Los contratos del sector público distintos de los cinco tipos legales:", "o": [["se califican según las normas de derecho administrativo o de derecho privado que les sean de aplicación", 1, "Correcto: art. 12.2."], ["se consideran siempre contratos de servicios", 0, "No hay tal presunción."], ["quedan excluidos de la ley", 0, "No: la exclusión requiere encajar en los arts. 4 a 11."], ["se califican como contratos mixtos", 0, "El mixto exige prestaciones de varios tipos."]]}];
const CASOS=[{"t": "Caso 1 · Califica y decide el régimen", "e": "Un ayuntamiento de 60.000 habitantes va a licitar: <b>(1)</b> la construcción de un pabellón deportivo por 6,2 M€; <b>(2)</b> el suministro de energía eléctrica por 190.000 €; <b>(3)</b> la gestión de la escuela infantil, cobrando el adjudicatario las cuotas de las familias y asumiendo el riesgo de matrícula, por 480.000 €; <b>(4)</b> la ayuda a domicilio por 700.000 €; <b>(5)</b> el desarrollo a medida de una aplicación de citas por 90.000 €. <b>Indica el tipo contractual, si es SARA y su carácter administrativo o privado.</b>", "s": "<p><b>(1)</b> Contrato de <b>obras</b> (art. 13). Valor estimado 6,2 M€ ≥ 5.404.000 € → <b>SARA</b> (art. 20.1). Celebrado por Administración Pública y objeto típico → <b>administrativo</b> (art. 25.1.a).</p><p><b>(2)</b> Contrato de <b>suministro</b> por el art. 16.3.d) (energía). Umbral aplicable: 216.000 € (art. 21.1.b), luego <b>no es SARA</b>. <b>Administrativo</b>.</p><p><b>(3)</b> <b>Concesión de servicios</b> (art. 15): gestión de un servicio de su competencia, retribución por explotación y <b>riesgo operacional</b> asumido. Umbral 5.404.000 € (art. 20.1), luego <b>no es SARA</b>. <b>Administrativo</b>.</p><p><b>(4)</b> Contrato de <b>servicios</b> (art. 17), incluido en los servicios sociales del <b>Anexo IV</b>: umbral 750.000 € (art. 22.1.c). Con 700.000 € <b>no es SARA</b>. <b>Administrativo</b>.</p><p><b>(5)</b> Contrato de <b>servicios</b>: programa desarrollado a medida (art. 16.3.b, excepción). Umbral 216.000 € → <b>no es SARA</b>. <b>Administrativo</b>.</p><p><b>Observación:</b> ninguno es privado, porque todos tienen objeto típico y los celebra una Administración Pública. Serían privados si los celebrara una sociedad municipal (art. 26.1.b).</p>"}, {"t": "Caso 2 · Concesión o contrato de servicios", "e": "Una diputación quiere encargar la explotación de una red de aparcamientos disuasorios. Baraja tres fórmulas: <b>(a)</b> pagar a la empresa 1,2 M€ anuales fijos por gestionarlos; <b>(b)</b> que la empresa cobre a los usuarios y no reciba nada de la diputación; <b>(c)</b> que la empresa cobre a los usuarios y además reciba 300.000 € anuales, con la diputación garantizándole por contrato unos ingresos mínimos que cubren la inversión y los costes. <b>Califica cada opción.</b>", "s": "<p><b>(a) Contrato de servicios</b> (art. 17). Retribución cierta e independiente del uso: el riesgo lo soporta la diputación.</p><p><b>(b) Concesión de servicios</b> (art. 15). La contrapartida es exclusivamente el derecho a explotar y el <b>riesgo operacional</b> —de demanda— recae en la empresa (art. 14.4 por remisión del 15.2).</p><p><b>(c) Contrato de servicios, no concesión.</b> Aunque hay explotación y precio —combinación que el art. 15.1 admite—, la <b>garantía de ingresos mínimos</b> que cubren inversión y costes elimina el riesgo operacional: el art. 14.4 exige que <b>no esté garantizado</b> recuperar inversiones ni cubrir costes y que la pérdida potencial no sea nominal o desdeñable.</p><p><b>Consecuencias prácticas:</b> cambia el umbral aplicable (5.404.000 € para concesiones frente a 216.000 € para servicios), el plazo máximo de duración y el régimen de riesgo y ventura.</p>"}, {"t": "Caso 3 · ¿A qué juzgado voy?", "e": "Cuatro litigios en la misma provincia: <b>(1)</b> un licitador excluido de un contrato de obras de un ayuntamiento impugna su exclusión; <b>(2)</b> el vendedor de un solar comprado por ese ayuntamiento reclama por defectos en el pago; <b>(3)</b> una empresa municipal de vivienda —poder adjudicador que no es Administración— adjudica un contrato de obras y un competidor lo recurre; <b>(4)</b> un competidor impugna la modificación de un contrato privado SARA de servicios artísticos, alegando que debió licitarse de nuevo. <b>Determina el orden jurisdiccional.</b>", "s": "<p><b>(1) Contencioso-administrativo</b> — art. 27.1.a): contrato administrativo, fase de adjudicación.</p><p><b>(2) Civil</b> — art. 27.2.a): la compraventa de un inmueble es contrato <b>privado</b> (art. 26.1.a en relación con el art. 9.2) y el litigio versa sobre sus <b>efectos</b>.</p><p><b>(3) Contencioso-administrativo</b> — art. 27.1.c): preparación y adjudicación de contratos de poderes adjudicadores que no son Administración Pública.</p><p><b>(4) Contencioso-administrativo</b> — art. 27.1.b), párrafo segundo: en los contratos del art. 25.1.a) 1.º y 2.º sujetos a regulación armonizada, las impugnaciones de modificaciones basadas en el incumplimiento de los arts. 204 y 205, por entender que debió haber nueva adjudicación.</p><p><b>Regla que se extrae:</b> preparación y adjudicación, siempre contencioso; efectos y extinción, según el contrato sea administrativo o privado; y las <b>modificaciones encubiertas</b> vuelven siempre al contencioso.</p>"}];

const INTRO_HTML="<section class=\"card\" id=\"intro\"><h2>Tema 10 · Los contratos del sector público</h2><p class=\"small\">Segunda parte de la Ley 9/2017. Tres secciones encadenadas: qué tipos de contrato existen (arts. 12 a 18), cuáles alcanzan el umbral europeo (arts. 19 a 23) y cuáles son administrativos o privados, con su jurisdicción (arts. 24 a 27).</p><div class=\"box ej\"><span class=\"lbl\">La idea que ordena todo el tema</span>Cada contrato pasa por <b>tres filtros sucesivos</b>: <b>1)</b> ¿de qué <b>tipo</b> es? · <b>2)</b> ¿alcanza el <b>umbral</b> y lo celebra un poder adjudicador, es decir, es SARA? · <b>3)</b> ¿es <b>administrativo o privado</b>? De la respuesta a los tres depende el procedimiento, la publicidad, los recursos y el juez competente.</div><div class=\"box warn\"><span class=\"lbl\">Advertencia de vigencia</span>Texto consolidado de la Ley 9/2017 con <b>última modificación de 26 de diciembre de 2025</b>. Los umbrales de los arts. 20 a 23 se revisan cada dos años por reglamentos delegados de la Comisión Europea, directamente aplicables aunque el texto español conserve la cifra anterior. Memoriza la cifra literal de la ley y comprueba en el BOE consolidado y en el DOUE la vigente en cada momento.</div><svg viewBox=\"0 0 660 215\" role=\"img\" aria-label=\"Mapa conceptual del tema 10\"><rect x=\"215\" y=\"8\" width=\"230\" height=\"36\" rx=\"9\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"330\" y=\"31\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"#fff\">UN CONTRATO CONCRETO</text><line x1=\"330\" y1=\"44\" x2=\"330\" y2=\"60\" stroke=\"var(--acc)\" stroke-width=\"2\"/><line x1=\"130\" y1=\"60\" x2=\"530\" y2=\"60\" stroke=\"var(--acc)\" stroke-width=\"2\"/><line x1=\"130\" y1=\"60\" x2=\"130\" y2=\"78\" stroke=\"var(--acc)\" stroke-width=\"2\"/><line x1=\"330\" y1=\"60\" x2=\"330\" y2=\"78\" stroke=\"var(--acc)\" stroke-width=\"2\"/><line x1=\"530\" y1=\"60\" x2=\"530\" y2=\"78\" stroke=\"var(--acc)\" stroke-width=\"2\"/><rect x=\"25\" y=\"78\" width=\"210\" height=\"122\" rx=\"9\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"130\" y=\"100\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"var(--acc)\">1 · ¿QUÉ TIPO ES?</text><text x=\"130\" y=\"124\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">arts. 12 a 17 · los cinco tipos</text><text x=\"130\" y=\"146\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">art. 18 · contratos mixtos</text><text x=\"130\" y=\"176\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--ink2)\">obras · concesiones</text><text x=\"130\" y=\"191\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--ink2)\">suministro · servicios</text><rect x=\"245\" y=\"78\" width=\"170\" height=\"122\" rx=\"9\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"330\" y=\"100\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"var(--ej)\">2 · ¿ES SARA?</text><text x=\"330\" y=\"124\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">art. 19 · requisitos</text><text x=\"330\" y=\"146\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">arts. 20-22 · umbrales</text><text x=\"330\" y=\"168\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">art. 23 · subvencionados</text><text x=\"330\" y=\"191\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--ink2)\">reglas europeas</text><rect x=\"425\" y=\"78\" width=\"210\" height=\"122\" rx=\"9\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"530\" y=\"100\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"var(--warn)\">3 · ¿QUÉ RÉGIMEN?</text><text x=\"530\" y=\"124\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">art. 24 · la gran división</text><text x=\"530\" y=\"146\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">art. 25 · administrativos</text><text x=\"530\" y=\"168\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">art. 26 · privados</text><text x=\"530\" y=\"191\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">art. 27 · jurisdicción</text></svg></section>";
const RESUMEN_HTML="<section class=\"card\" id=\"resumen\"><h2>Resumen ejecutivo</h2><table><tbody><tr><th style=\"width:60px\">12</th><td>Cinco tipos: obras, concesión de obras, concesión de servicios, suministro y servicios. Los demás, según su normativa.</td></tr><tr><th>13</th><td><b>Obras</b>: sobre bien inmueble, con función propia. Regla de <b>obra completa</b>, salvo partes utilizables con autorización.</td></tr><tr><th>14</th><td><b>Concesión de obras</b>: contraprestación en la explotación (con o sin precio) y <b>riesgo operacional</b> — demanda o suministro, pérdida no nominal.</td></tr><tr><th>15</th><td><b>Concesión de servicios</b>: poderes adjudicadores encomiendan la gestión de un servicio de su titularidad o competencia, con riesgo operacional del art. 14.4.</td></tr><tr><th>16</th><td><b>Suministro</b>: bienes muebles, adquisición o arrendamiento. Siempre: entregas sucesivas por precio unitario · informática · fabricación por encargo · energía. Software <b>a medida = servicios</b>.</td></tr><tr><th>17</th><td><b>Servicios</b>: prestaciones de hacer; nunca pueden implicar <b>ejercicio de autoridad</b>.</td></tr><tr><th>18</th><td><b>Mixtos</b>: manda la <b>prestación principal</b>; si son separables con concesiones, decide el valor frente a los umbrales. Obra de más de <b>50.000 €</b> → proyecto.</td></tr><tr><th>19</th><td><b>SARA</b> = tipo + umbral (valor estimado, art. 101) + poder adjudicador. Nunca SARA: audiovisual, defensa, secretos, redes, servicios jurídicos, protección civil, ferrocarril y agua.</td></tr><tr><th>20-22</th><td>Umbrales: <b>5.404.000 €</b> obras y concesiones · <b>140.000 €</b> AGE · <b>216.000 €</b> resto · <b>750.000 €</b> servicios del Anexo IV. Lotes exceptuables: <b>1.000.000 €</b> / <b>80.000 €</b>, con tope del <b>20 %</b>.</td></tr><tr><th>23</th><td><b>Subvencionados</b>: obras y servicios subvencionados <b>directamente</b> en <b>más del 50 %</b> por un poder adjudicador, con umbrales de 5.404.000 € y 216.000 €.</td></tr><tr><th>24-25</th><td>Administrativo o privado. <b>Administrativo</b>: los cinco tipos celebrados por <b>Administración Pública</b> —salvo financieros, artísticos y suscripciones— y los <b>especiales</b> (giro o tráfico o finalidad pública directa).</td></tr><tr><th>26</th><td><b>Privados</b> por objeto (letra a) o por sujeto (letras b y c). Preparación y adjudicación, reglas de la ley; <b>efectos y extinción, derecho privado</b>.</td></tr><tr><th>27</th><td><b>Contencioso</b>: todo lo de preparación y adjudicación, los contratos administrativos completos y las modificaciones encubiertas. <b>Civil</b>: efectos y extinción de los privados y financiación privada de concesiones.</td></tr></tbody></table><h2 style=\"margin-top:1.2rem\">Calendario de repaso espaciado</h2><table><thead><tr><th>Momento</th><th>Fecha</th><th>Qué hacer</th></tr></thead><tbody id=\"calbody\"></tbody></table></section>";

<script>
/* ═══ Mejoras de interacción · Bloque II ═══ */
(function(){
"use strict";
var K_THEME="oposi_bII_theme", K_FS="oposi_bII_fs", K_STREAK="oposi_bII_streak";
function load(k,f){try{var v=localStorage.getItem(k);return v?JSON.parse(v):f;}catch(e){return f;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
var root=document.documentElement;

/* Tema persistente (sobrescribe el toggle simple anterior) */
var saved=load(K_THEME,null);
if(saved){root.setAttribute("data-theme",saved);}
else if(window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches){root.setAttribute("data-theme","dark");}
var bt=document.getElementById("theme");
if(bt)bt.onclick=function(){
  var n=root.getAttribute("data-theme")==="dark"?"light":"dark";
  root.setAttribute("data-theme",n);save(K_THEME,n);
};

/* Tamaño de texto persistente */
var fs=load(K_FS,16);
function setFs(v){fs=Math.max(13,Math.min(22,v));root.style.setProperty("--fs",fs+"px");save(K_FS,fs);}
setFs(fs);
var bp=document.getElementById("fs+"),bm=document.getElementById("fs-");
if(bp)bp.onclick=function(){setFs(fs+1);};
if(bm)bm.onclick=function(){setFs(fs-1);};

(function(){
  var el=document.getElementById("streakN");if(!el)return;
  var hoy=new Date().toISOString().slice(0,10);
  var s=load(K_STREAK,{last:null,n:0});
  if(s.last!==hoy){
    var ayer=new Date(Date.now()-864e5).toISOString().slice(0,10);
    s.n=(s.last===ayer)?s.n+1:1;s.last=hoy;save(K_STREAK,s);
  }
  el.textContent=s.n;
})();

/* Reveal on scroll para las tarjetas */
function reveal(){
  var els=document.querySelectorAll("section.card:not(.rv)");
  if(!els.length)return;
  if(!("IntersectionObserver" in window)){return;}
  var io=new IntersectionObserver(function(es){
    es.forEach(function(en){if(en.isIntersecting){en.target.classList.add("in");io.unobserve(en.target);}});
  },{threshold:.06,rootMargin:"0px 0px -30px 0px"});
  Array.prototype.forEach.call(els,function(el){el.classList.add("rv");io.observe(el);});
}

/* Sección activa en el índice lateral */
function spy(){
  var links=document.querySelectorAll("nav.side a[href^='#']");
  if(!links.length||!("IntersectionObserver" in window))return;
  var map={};
  Array.prototype.forEach.call(links,function(a){
    var t=document.getElementById(a.getAttribute("href").slice(1));
    if(t)map[t.id]=a;
  });
  var io=new IntersectionObserver(function(es){
    es.forEach(function(en){
      if(en.isIntersecting){
        Array.prototype.forEach.call(links,function(a){a.classList.remove("on");});
        if(map[en.target.id])map[en.target.id].classList.add("on");
      }
    });
  },{rootMargin:"-80px 0px -70% 0px",threshold:0});
  Object.keys(map).forEach(function(id){io.observe(document.getElementById(id));});
}

/* Ripple en botones */
document.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b||b.classList.contains("navtoggle"))return;
  var r=b.getBoundingClientRect(),d=Math.max(r.width,r.height),s=document.createElement("span");
  s.className="ripple";s.style.width=s.style.height=d+"px";
  s.style.left=(e.clientX-r.left-d/2)+"px";s.style.top=(e.clientY-r.top-d/2)+"px";
  b.appendChild(s);setTimeout(function(){if(s.parentNode)s.parentNode.removeChild(s);},560);
});

/* Atajos de teclado */
document.addEventListener("keydown",function(e){
  if(e.target.matches("input,textarea"))return;
  if(e.key==="/"){var q=document.getElementById("q");if(q){e.preventDefault();q.focus();}}
  if(e.key==="t"&&bt)bt.click();
});

/* El contenido se inyecta por JS: esperamos a que exista */
function init(){reveal();spy();}
if(document.getElementById("main")&&document.getElementById("main").children.length){init();}
else{setTimeout(init,60);}
addEventListener("load",function(){setTimeout(init,80);});
})();

</script>
<script>

/* ═══ Parser de respuestas: estructura semántica ═══ */
var FCFMT=(function(){
  var CITA=/\s*\(((?:arts?\.|DA\b|DT\b|disp\.)[^)]*)\)\s*\.?\s*$/i;
  var strip=function(h){return h.replace(/<[^>]+>/g,"");};

  function esc(s){return s;}

  function parse(raw){
    var out={verdict:null,cite:null,kind:"p",items:[],text:""};
    var body=String(raw).trim();

    /* 1 ── Cita legal al final */
    var m=body.match(CITA);
    if(m){out.cite=m[1].replace(/\s+/g," ").trim();body=body.slice(0,m.index).trim();}
    body=body.replace(/[.;,\s]+$/,"");

    /* 2 ── Veredicto Sí / No inicial */
    var v=strip(body).match(/^(Sí|Sí,|No|No,)[.:,]?\s/);
    if(v){
      out.verdict=/^Sí/.test(v[1])?"si":"no";
      body=body.replace(/^(<[^>]+>\s*)*(Sí|No)[.,:]?\s*/,"").trim();
      body=body.replace(/^en\s/,"En ");
    }

    /* 3 ── Enumeración con · */
    var parts=body.split(/\s+·\s+/);
    if(parts.length>=2){
      out.kind="list";
      var letras=parts.filter(function(p){return /^\s*<?[a-h]\)/.test(strip(p));}).length;
      out.marker = letras>=parts.length-1 ? "alpha" : "num";
      out.items=parts.map(function(p){
        return p.replace(/^\s*[a-h]\)\s*/,"").replace(/[.\s]+$/,"").trim();
      }).filter(Boolean);
      return out;
    }

    /* 4 ── Cláusulas contrapuestas con ; */
    var semi=body.split(/;\s+/);
    if(semi.length>=2&&semi.length<=3&&semi.every(function(s){return strip(s).length>14;})){
      out.kind="clauses";
      out.items=semi.map(function(s){return s.replace(/[.\s]+$/,"").trim();});
      return out;
    }

    /* 5 ── Párrafo */
    out.text=body;
    return out;
  }

  function render(raw){
    var d=parse(raw),h="";

    if(d.verdict){
      h+='<span class="fc-verdict '+d.verdict+'">'+(d.verdict==="si"?"✓ Sí":"✗ No")+'</span>';
    }

    if(d.kind==="list"){
      h+='<ol class="fc-list '+d.marker+'">';
      d.items.forEach(function(it){h+='<li>'+it+'</li>';});
      h+='</ol>';
    }else if(d.kind==="clauses"){
      h+='<div class="fc-clauses">';
      d.items.forEach(function(it){h+='<p>'+it+'</p>';});
      h+='</div>';
    }else if(d.text){
      h+='<p class="fc-p">'+d.text+'</p>';
    }

    if(d.cite){
      h+='<span class="fc-cite"><span class="s">§</span>'+d.cite+'</span>';
    }
    return {html:h,struct:(d.kind!=="p"||!!d.verdict||strip(raw).length>150)};
  }
  return {parse:parse,render:render};
})();

/* ═══ FLASHCARDS 3D ═══ */
(function(){
"use strict";
function boot(){
  var sec=document.getElementById("flash");
  if(!sec||sec.dataset.fc3d)return false;
  if(typeof FLASH==="undefined"||!FLASH||!FLASH.length)return false;
  sec.dataset.fc3d="1";

  var CARDS=FLASH, N=CARDS.length;
  var order,fi,ok,ko,back,busy;

  /* — Estructura — */
  var h2=sec.querySelector("h2");
  sec.innerHTML="";
  if(h2)sec.appendChild(h2);
  var intro=document.createElement("p");
  intro.className="small";
  intro.innerHTML="Piensa la respuesta <b>antes</b> de girar: el esfuerzo de recuperarla es lo que la fija. "
    +'<span class="fc-hint" style="position:static;display:inline;color:inherit">'
    +'<span class="kbd">espacio</span> girar · <span class="kbd">→</span> lo sabía · <span class="kbd">←</span> repasar</span>';
  sec.appendChild(intro);

  var stage=document.createElement("div");
  stage.className="fc-stage";
  stage.innerHTML=
    '<div class="fc-deck" id="fcdeck">'
    +'<span class="fc-ghost g2"></span><span class="fc-ghost g1"></span>'
    +'<div class="fc-lift" id="fclift">'
      +'<div class="fc-card" id="fcbox" tabindex="0" role="button" aria-label="Tarjeta. Pulsa para girar">'
        +'<div class="fc-face fc-front">'
          +'<span class="fc-tag">Pregunta</span><span class="fc-pip tr"></span><span class="fc-pip bl"></span>'
          +'<div class="fc-txt"></div>'
          +'<span class="fc-hint">Pulsa para girar</span>'
        +'</div>'
        +'<div class="fc-face fc-back">'
          +'<span class="fc-tag">Respuesta</span><span class="fc-pip tr"></span><span class="fc-pip bl"></span>'
          +'<div class="fc-txt"></div>'
          +'<span class="fc-hint">¿La sabías?</span>'
        +'</div>'
      +'</div>'
    +'</div></div>';
  sec.appendChild(stage);

  var bar=document.createElement("div");
  bar.className="fc-bar";bar.innerHTML="<i></i>";
  sec.appendChild(bar);

  var ctr=document.createElement("div");
  ctr.className="fc-ctrls noprint";
  ctr.innerHTML='<button id="fcflip">⟲ Girar</button>'
    +'<button id="fcok">✔ Lo sabía</button>'
    +'<button id="fcko">↻ Repasar</button>'
    +'<button id="fcreset">Reiniciar</button>'
    +'<span class="fc-score">'
      +'<span class="fc-pill ok" id="fcpok">0 sabidas</span>'
      +'<span class="fc-pill ko" id="fcpko">0 repasar</span>'
      +'<span class="fc-pill left" id="fccount">0</span>'
    +'</span>';
  sec.appendChild(ctr);

  var deck=stage.querySelector("#fcdeck"), lift=stage.querySelector("#fclift"),
      card=stage.querySelector("#fcbox"),
      front=stage.querySelector(".fc-front"), backf=stage.querySelector(".fc-back"),
      fill=bar.querySelector("i"),
      pok=ctr.querySelector("#fcpok"), pko=ctr.querySelector("#fcpko"),
      pleft=ctr.querySelector("#fccount");
  var rot=0;

  function reset(){
    order=CARDS.map(function(_,i){return i;});
    fi=0;ok=0;ko=0;back=false;busy=false;rot=0;
    card.style.transition="none";card.style.transform="rotateY(0deg)";
    void card.offsetWidth;card.style.transition="";
    deck.classList.remove("empty");
    var d=stage.querySelector(".fc-done");if(d)d.remove();
    card.style.display="";
    draw();
  }

  function bump(el){el.classList.remove("bump");void el.offsetWidth;el.classList.add("bump");}

  function draw(){
    pok.textContent=ok+(ok===1?" sabida":" sabidas");
    pko.textContent=ko+" repasar";
    var done=N-order.length;
    fill.style.width=(N?done/N*100:0)+"%";

    if(!order.length){
      pleft.textContent="0 quedan";
      deck.classList.add("empty");
      card.style.display="none";
      if(!stage.querySelector(".fc-done")){
        var d=document.createElement("div");
        d.className="fc-done";
        d.innerHTML='<span class="seal">🏆</span><h3>Ronda completada</h3>'
          +'<p>'+ok+' de '+N+' a la primera'+(ko?' · '+ko+' necesitaron repaso':'')+'</p>';
        deck.appendChild(d);
      }
      return;
    }
    if(fi>=order.length)fi=0;
    pleft.textContent=order.length+(order.length===1?" queda":" quedan");

    var c=CARDS[order[fi]];
    front.querySelector(".fc-txt").innerHTML='<p class="fc-p">'+c[0]+'</p>';
    var r=FCFMT.render(c[1]);
    backf.querySelector(".fc-txt").innerHTML=r.html;
    backf.classList.toggle("struct",r.struct);
    var hint=backf.querySelector(".fc-hint");
    if(hint)hint.classList.toggle("muted",/fc-cite/.test(r.html));
    var pip=(done+1)+"/"+N;
    Array.prototype.forEach.call(stage.querySelectorAll(".fc-pip"),function(p){p.textContent=pip;});
  }

  function flip(){
    if(busy||!order.length)return;
    back=!back;rot+=180;
    card.style.transform="rotateY("+rot+"deg)";
    card.setAttribute("aria-label",back?"Respuesta. Pulsa para volver":"Pregunta. Pulsa para girar");
    lift.classList.remove("lift");void lift.offsetWidth;lift.classList.add("lift");
  }

  function next(good){
    if(busy||!order.length)return;
    busy=true;
    if(good){ok++;bump(pok);}else{ko++;bump(pko);}
    lift.classList.remove("lift");
    lift.classList.add(good?"out-ok":"out-ko");
    setTimeout(function(){
      if(good){order.splice(fi,1);}
      else{var m=order.splice(fi,1)[0];order.push(m);}
      back=false;rot=0;
      card.style.transition="none";card.style.transform="rotateY(0deg)";
      void card.offsetWidth;card.style.transition="";
      draw();
      lift.classList.remove("out-ok","out-ko");
      lift.classList.add("in");
      setTimeout(function(){lift.classList.remove("in");busy=false;},480);
    },460);
  }

  card.onclick=flip;
  card.onkeydown=function(e){
    if(e.key===" "||e.key==="Enter"){e.preventDefault();flip();}
    if(e.key==="ArrowRight"){e.preventDefault();next(true);}
    if(e.key==="ArrowLeft"){e.preventDefault();next(false);}
  };
  ctr.querySelector("#fcflip").onclick=flip;
  ctr.querySelector("#fcok").onclick=function(){next(true);};
  ctr.querySelector("#fcko").onclick=function(){next(false);};
  ctr.querySelector("#fcreset").onclick=reset;

  /* Deslizar en táctil */
  var x0=null,y0=null;
  card.addEventListener("touchstart",function(e){x0=e.touches[0].clientX;y0=e.touches[0].clientY;},{passive:true});
  card.addEventListener("touchend",function(e){
    if(x0===null)return;
    var dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0;
    if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)){next(dx>0);}
    x0=y0=null;
  },{passive:true});

  /* Atajos globales cuando el mazo está a la vista */
  document.addEventListener("keydown",function(e){
    if(e.target.matches("input,textarea,select"))return;
    var r=stage.getBoundingClientRect();
    if(r.bottom<80||r.top>innerHeight-80)return;
    if(e.key===" "){e.preventDefault();flip();}
    else if(e.key==="ArrowRight"){e.preventDefault();next(true);}
    else if(e.key==="ArrowLeft"){e.preventDefault();next(false);}
  });

  reset();
  return true;
}
if(!boot()){
  var tries=0;
  var iv=setInterval(function(){if(boot()||++tries>40)clearInterval(iv);},120);
  addEventListener("load",function(){setTimeout(boot,100);});
}
})();

</script>
<script>

/* ═══ Altura adaptativa + índice plegable ═══ */
(function(){
"use strict";

/* ── 1 · Índice lateral plegable ── */
function sidebar(){
  var lay=document.querySelector(".layout"),
      side=document.getElementById("side"),
      tools=document.querySelector(".tools");
  if(!lay||!side||!tools||document.getElementById("navhide"))return;

  var K="oposi_bII_nav";
  function get(){try{return localStorage.getItem(K)==="0";}catch(e){return false;}}
  function set(v){try{localStorage.setItem(K,v?"0":"1");}catch(e){}}

  var b=document.createElement("button");
  b.id="navhide";b.type="button";
  b.innerHTML='<span class="ic">☰</span>';
  b.setAttribute("aria-controls","side");
  tools.insertBefore(b,tools.firstChild);

  function apply(hidden,anim){
    if(!anim)lay.style.transition="none";
    lay.classList.toggle("nonav",hidden);
    side.setAttribute("aria-hidden",String(hidden));
    b.setAttribute("aria-pressed",String(hidden));
    b.title=hidden?"Mostrar índice (i)":"Ocultar índice (i)";
    b.setAttribute("aria-label",b.title);
    if(!anim)requestAnimationFrame(function(){lay.style.transition="";});
  }
  apply(get(),false);

  b.onclick=function(){
    var h=!lay.classList.contains("nonav");
    apply(h,true);set(h);
    window.dispatchEvent(new Event("resize"));
  };
  document.addEventListener("keydown",function(e){
    if(e.target.matches("input,textarea,select"))return;
    if(e.key==="i"||e.key==="I"){e.preventDefault();b.click();}
  });
}

/* ── 2 · La tarjeta se adapta a su contenido ── */
function autofit(){
  var stage=document.querySelector(".fc-stage");
  if(!stage||stage.dataset.fit)return;
  var deck=stage.querySelector(".fc-deck"),
      front=stage.querySelector(".fc-front"),
      back=stage.querySelector(".fc-back");
  if(!deck||!front||!back)return;
  stage.dataset.fit="1";

  var meas=document.createElement("div");
  meas.className="fc-measure";meas.setAttribute("aria-hidden","true");
  meas.innerHTML='<div class="fc-face fc-front"><div class="fc-body"><div class="fc-txt"></div></div></div>';
  stage.appendChild(meas);
  var mFace=meas.querySelector(".fc-face"), mTxt=meas.querySelector(".fc-txt");

  function measure(cls,html){
    mFace.className="fc-face "+cls;
    mTxt.innerHTML=html;
    return mFace.offsetHeight;
  }

  function fit(){
    if(deck.classList.contains("empty")){deck.style.height="230px";return;}
    var fT=front.querySelector(".fc-txt"), bT=back.querySelector(".fc-txt");
    if(!fT||!bT)return;
    var h=Math.max(
      measure("fc-front"+(front.classList.contains("struct")?" struct":""),fT.innerHTML),
      measure("fc-back" +(back .classList.contains("struct")?" struct":""),bT.innerHTML),
      230
    );
    deck.style.height=Math.ceil(h+8)+"px";
  }

  /* recalcular cuando cambia la tarjeta, el tamaño de letra o la ventana */
  new MutationObserver(fit).observe(back,{childList:true,subtree:true,attributes:true,attributeFilter:["class"]});
  var t;
  addEventListener("resize",function(){clearTimeout(t);t=setTimeout(fit,120);},{passive:true});
  ["fs+","fs-"].forEach(function(id){
    var el=document.getElementById(id);
    if(el)el.addEventListener("click",function(){setTimeout(fit,60);});
  });
  fit();setTimeout(fit,250);
}

function go(){sidebar();autofit();}
if(document.readyState!=="loading")go();else document.addEventListener("DOMContentLoaded",go);
addEventListener("load",function(){setTimeout(go,120);});
var n=0,iv=setInterval(function(){go();if(++n>25)clearInterval(iv);},150);
})();

</script>

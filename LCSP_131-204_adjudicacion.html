ext x=\"129.75\" y=\"219\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 159.1.a)</text><rect x=\"253.5\" y=\"52\" width=\"219.5\" height=\"235\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"363.25\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--acc)\">Y ADEMÁS</text><text x=\"363.25\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Los criterios de</text><text x=\"363.25\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">adjudicación evaluables</text><text x=\"363.25\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">mediante JUICIO DE VALOR</text><text x=\"363.25\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">no pueden superar</text><text x=\"363.25\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">el 25 %</text><text x=\"363.25\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"363.25\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Salvo en servicios</text><text x=\"363.25\" y=\"180\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">intelectuales: 45 %</text><text x=\"363.25\" y=\"193\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"363.25\" y=\"206\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 159.1.b)</text><rect x=\"487\" y=\"52\" width=\"219.5\" height=\"235\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"596.75\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--warn)\">PLAZOS</text><text x=\"596.75\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Presentación de</text><text x=\"596.75\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">proposiciones, desde el</text><text x=\"596.75\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">día siguiente a la</text><text x=\"596.75\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">publicación del anuncio</text><text x=\"596.75\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">en el perfil:</text><text x=\"596.75\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"596.75\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">REGLA: no inferior a</text><text x=\"596.75\" y=\"180\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">QUINCE días</text><text x=\"596.75\" y=\"193\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"596.75\" y=\"206\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">OBRAS: como mínimo</text><text x=\"596.75\" y=\"219\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">VEINTE días</text><text x=\"596.75\" y=\"232\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"596.75\" y=\"245\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 159.3</text><rect x=\"720.5\" y=\"52\" width=\"219.5\" height=\"235\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"830.25\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--ej)\">SIMPLIFICADO\nABREVIADO</text><text x=\"830.25\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">OBRAS: valor estimado</text><text x=\"830.25\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">&lt; 80.000 €</text><text x=\"830.25\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"830.25\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">SUMINISTROS Y SERVICIOS:</text><text x=\"830.25\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">&lt; 60.000 €</text><text x=\"830.25\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">(salvo servicios</text><text x=\"830.25\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">intelectuales)</text><text x=\"830.25\" y=\"180\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"830.25\" y=\"193\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Plazo de 10 días hábiles;</text><text x=\"830.25\" y=\"206\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">5 en compras corrientes</text><text x=\"830.25\" y=\"219\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"830.25\" y=\"232\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 159.6</text><rect x=\"20\" y=\"297\" width=\"920\" height=\"34\" rx=\"8\" fill=\"var(--panel)\" stroke=\"var(--line)\"/><text x=\"480\" y=\"317.328\" text-anchor=\"middle\" font-size=\"9.4\" fill=\"currentColor\">Todos los licitadores deben estar inscritos en el ROLECE o en el registro equivalente de la comunidad autónoma en la fecha final de presentación de ofertas (art. 159.4.a).</text></svg>"}, {"n": 160, "t": "Caracterización del procedimiento restringido", "ubic": "Libro II ▸ Título I ▸ Capítulo I ▸ Sección 2.ª ▸ Subsección 3.ª · Procedimiento restringido", "idea": "Dos fases: primero se selecciona por solvencia, después ofertan solo los seleccionados.", "literal": "<p><b>1.</b> En el procedimiento restringido cualquier empresa interesada podrá presentar una solicitud de participación en respuesta a una convocatoria de licitación.</p><p><b>2.</b> Solo podrán presentar proposiciones aquellos empresarios que, a su solicitud y en atención a su solvencia, sean seleccionados por el órgano de contratación. Los pliegos de cláusulas administrativas particulares podrán contemplar primas o compensaciones por los gastos en que incurran los licitadores al presentar su oferta en contratos de servicios en los casos en los que su presentación implique la realización de determinados desarrollos.</p><p><b>3.</b> En este procedimiento estará prohibida toda negociación de los términos del contrato con los solicitantes o candidatos.</p><p><b>4.</b> Este procedimiento es especialmente adecuado cuando se trata de servicios intelectuales de especial complejidad, como es el caso de algunos servicios de consultoría, de arquitectura o de ingeniería.</p>", "dis": "<ul>\n<li><b>Primera fase del <span class=\"t\" data-k=\"restringido\">procedimiento restringido</span> (160.1):</b> «cualquier empresa interesada podrá presentar una <span class=\"t\" data-k=\"solicitud\">solicitud de participación</span> en respuesta a una convocatoria de licitación».</li>\n<li><b>Segunda fase (160.2):</b> «Solo podrán presentar <b>proposiciones</b> aquellos empresarios que, a su solicitud y <b>en atención a su solvencia</b>, sean <b>seleccionados</b> por el órgano de contratación».</li>\n<li><b>Primas:</b> el PCAP podrá contemplar <span class=\"t\" data-k=\"prima\">primas o compensaciones por los gastos</span> en que incurran los licitadores al presentar su oferta en <b>contratos de servicios</b>, cuando su presentación implique la realización de <b>determinados desarrollos</b>.</li>\n<li><b>Prohibición (160.3):</b> «estará <b>prohibida toda negociación</b> de los términos del contrato con los solicitantes o candidatos».</li>\n<li><b>Idoneidad (160.4):</b> «especialmente adecuado cuando se trata de <b>servicios intelectuales de especial complejidad</b>, como es el caso de algunos servicios de <b>consultoría</b>, de <b>arquitectura</b> o de <b>ingeniería</b>».</li>\n</ul>", "llano": "<p>El restringido tiene dos puertas. En la primera se apunta quien quiera, presentando una solicitud. El órgano de contratación mira la solvencia y elige a quiénes invita. En la segunda, solo esos presentan oferta.</p>\n<p>Y como en el abierto, nada se negocia. La diferencia no es la negociación: es que hay un filtro previo.</p>", "porque": "<p>Porque hay contratos en los que preparar una oferta cuesta miles de euros —un anteproyecto de arquitectura, un estudio de consultoría—. Pedir ese esfuerzo a veinte empresas para que diecinueve lo tiren es un desperdicio social. El restringido reduce el número de ofertantes a los realmente capaces, y el art. 160.2 permite además <b>compensarles el gasto</b>.</p>\n<p>La contrapartida es que la selección previa puede usarse para cerrar el mercado; por eso el filtro debe basarse en la <b>solvencia</b> y esta debe ser vinculada y proporcional (art. 74.2).</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> un concurso de arquitectura en dos vueltas: primero se preseleccionan cinco estudios por su currículo y después esos cinco presentan el proyecto, cobrando una compensación por hacerlo.</li>\n<li><b>Real:</b> una diputación licita por procedimiento restringido la redacción del proyecto y la dirección de obra de un centro comarcal. En la primera fase reciben catorce solicitudes; selecciona cinco por solvencia técnica. El PCAP prevé una <b>prima de 3.000 €</b> para cada uno de los no adjudicatarios que presente anteproyecto completo.</li>\n<li><b>Caso límite:</b> uno de los cinco seleccionados propone modificar el plazo de entrega. <b>No cabe</b>: el art. 160.3 prohíbe toda negociación. Si se quisiera negociar, habría que acudir a la <b>licitación con negociación</b> (arts. 166 y ss.), que exige su propio supuesto habilitante.</li>\n</ul>", "noej": "<ul>\n<li><b>No es el procedimiento negociado:</b> en el restringido está <b>prohibida</b> toda negociación.</li>\n<li><b>No es el abierto:</b> en el abierto se presenta oferta directamente; aquí hay una fase previa de selección.</li>\n<li><b>No cabe</b> seleccionar por criterios de adjudicación: la selección se hace <b>en atención a la solvencia</b>.</li>\n<li><b>No son obligatorias</b> las primas: el PCAP «podrá» contemplarlas, y solo en contratos de servicios con determinados desarrollos.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 131.2:</b> el restringido, junto al abierto, es procedimiento <b>ordinario</b>.</li>\n<li><b>Art. 74:</b> exigencia de solvencia, criterio de la selección.</li>\n<li><b>Art. 161:</b> solicitudes de participación y plazos.</li>\n<li><b>Art. 156.1:</b> el abierto, del que se distingue.</li>\n<li><b>Arts. 166 y ss.:</b> licitación con negociación, donde sí se negocia.</li>\n<li><b>Art. 119.2.b).3.º:</b> los plazos del restringido SARA no se reducen a la mitad por urgencia.</li>\n</ul>", "trampas": "<ul>\n<li><b>Dos fases</b>: solicitud de participación y, tras la selección, proposición.</li>\n<li>La selección se hace <b>en atención a la solvencia</b>, no por criterios de adjudicación.</li>\n<li><b>Prohibida toda negociación</b>: es la nota que lo separa del negociado, no del abierto.</li>\n<li>Idóneo para <b>servicios intelectuales de especial complejidad</b>: consultoría, arquitectura, ingeniería.</li>\n</ul>", "ancla": "<p><b>«Primero te apuntas, luego te eligen, después ofertas. Y no se regatea.»</b></p>\n<p>Frontera con el negociado: los dos filtran, pero solo el negociado <b>habla</b>.</p>", "vis": "<svg viewBox=\"0 0 960 296\" role=\"img\" aria-label=\"Caracterización del procedimiento restringido: dos fases, primas y prohibición de negociar\" style=\"width:100%;height:auto\"><defs><marker id=\"fl14\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr14\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe14\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw14\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"250\" y=\"8\" width=\"460\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"27.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">EL PROCEDIMIENTO RESTRINGIDO · ART. 160</text><rect x=\"20\" y=\"52\" width=\"172.8\" height=\"176\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"106.4\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--acc)\">PRIMERA FASE</text><text x=\"106.4\" y=\"91\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Cualquier empresa interesada</text><text x=\"106.4\" y=\"106\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">puede presentar una</text><text x=\"106.4\" y=\"121\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">SOLICITUD DE PARTICIPACIÓN</text><text x=\"106.4\" y=\"136\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">en respuesta a una</text><text x=\"106.4\" y=\"151\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">convocatoria de licitación</text><text x=\"106.4\" y=\"166\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"106.4\" y=\"181\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 160.1</text><rect x=\"206.8\" y=\"52\" width=\"172.8\" height=\"176\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"293.2\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--ej)\">SEGUNDA FASE</text><text x=\"293.2\" y=\"91\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Solo pueden presentar</text><text x=\"293.2\" y=\"106\" text-anchor=\"middle\" font-size=\"9.3\" fill=\"currentColor\">PROPOSICIONES los empresarios</text><text x=\"293.2\" y=\"121\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">que, a su solicitud y EN</text><text x=\"293.2\" y=\"136\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">ATENCIÓN A SU SOLVENCIA,</text><text x=\"293.2\" y=\"151\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">sean SELECCIONADOS por el</text><text x=\"293.2\" y=\"166\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">órgano de contratación</text><text x=\"293.2\" y=\"181\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"293.2\" y=\"196\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 160.2</text><rect x=\"393.6\" y=\"52\" width=\"172.8\" height=\"176\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"480\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--warn)\">PRIMAS</text><text x=\"480\" y=\"91\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">El PCAP puede contemplar</text><text x=\"480\" y=\"106\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">PRIMAS o COMPENSACIONES</text><text x=\"480\" y=\"121\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">por los gastos de presentar</text><text x=\"480\" y=\"136\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">la oferta en contratos de</text><text x=\"480\" y=\"151\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">servicios cuya presentación</text><text x=\"480\" y=\"166\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">implique realizar</text><text x=\"480\" y=\"181\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">determinados desarrollos</text><text x=\"480\" y=\"196\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"480\" y=\"211\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 160.2</text><rect x=\"580.4\" y=\"52\" width=\"172.8\" height=\"176\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"666.8\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--exc)\">PROHIBIDO</text><text x=\"666.8\" y=\"91\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Está PROHIBIDA toda</text><text x=\"666.8\" y=\"106\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">NEGOCIACIÓN de los términos</text><text x=\"666.8\" y=\"121\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">del contrato con los</text><text x=\"666.8\" y=\"136\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">solicitantes o candidatos</text><text x=\"666.8\" y=\"151\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"666.8\" y=\"166\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 160.3</text><rect x=\"767.2\" y=\"52\" width=\"172.8\" height=\"176\" rx=\"8\" fill=\"var(--panel)\" stroke=\"var(--line)\"/><text x=\"853.6\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"currentColor\">CUÁNDO CONVIENE</text><text x=\"853.6\" y=\"91\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Especialmente adecuado para</text><text x=\"853.6\" y=\"106\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">SERVICIOS INTELECTUALES DE</text><text x=\"853.6\" y=\"121\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">ESPECIAL COMPLEJIDAD:</text><text x=\"853.6\" y=\"136\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">consultoría, arquitectura</text><text x=\"853.6\" y=\"151\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">o ingeniería</text><text x=\"853.6\" y=\"166\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"853.6\" y=\"181\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 160.4</text><rect x=\"20\" y=\"238\" width=\"920\" height=\"48\" rx=\"8\" fill=\"var(--panel)\" stroke=\"var(--line)\"/><text x=\"480\" y=\"258.828\" text-anchor=\"middle\" font-size=\"10.4\" fill=\"currentColor\">Diferencia con el abierto: en el abierto se presenta oferta directamente; en el restringido hay una fase previa de SELECCIÓN por solvencia.</text><text x=\"480\" y=\"271.828\" text-anchor=\"middle\" font-size=\"10.4\" fill=\"currentColor\">Lo que comparten: en ninguno de los dos cabe negociar los términos del contrato.</text></svg>"}, {"n": 204, "t": "Modificaciones previstas en el pliego de cláusulas administrativas particulares", "ubic": "Libro II ▸ Título I ▸ Capítulo I ▸ Sección 3.ª · Modificación de los contratos", "idea": "Si el pliego lo dijo con claridad, se puede modificar hasta el 20 % del precio inicial sin cambiar la naturaleza del contrato.", "literal": "<p><b>1.</b> Los contratos de las Administraciones Públicas podrán modificarse durante su vigencia hasta un máximo del veinte por ciento del precio inicial cuando en los pliegos de cláusulas administrativas particulares se hubiere advertido expresamente de esta posibilidad, en la forma y con el contenido siguientes:</p><p style=\"margin-left:1.1rem\">a) La cláusula de modificación deberá estar formulada de forma clara, precisa e inequívoca.</p><p style=\"margin-left:1.1rem\">b) Asimismo, en lo que respecta a su contenido, la cláusula de modificación deberá precisar con el detalle suficiente: su alcance, límites y naturaleza; las condiciones en que podrá hacerse uso de la misma por referencia a circunstancias cuya concurrencia pueda verificarse de forma objetiva; y el procedimiento que haya de seguirse para realizar la modificación. La cláusula de modificación establecerá, asimismo, que la modificación no podrá suponer el establecimiento de nuevos precios unitarios no previstos en el contrato. La formulación y contenido de la cláusula de modificación deberá ser tal que en todo caso permita a los candidatos y licitadores comprender su alcance exacto e interpretarla de la misma forma y que, por otra parte, permita al órgano de contratación comprobar efectivamente el cumplimiento por parte de los primeros de las condiciones de aptitud exigidas y valorar correctamente las ofertas presentadas por estos.</p><p><b>2.</b> En ningún caso los órganos de contratación podrán prever en el pliego de cláusulas administrativas particulares modificaciones que puedan alterar la naturaleza global del contrato inicial. En todo caso, se entenderá que se altera esta si se sustituyen las obras, los suministros o los servicios que se van a adquirir por otros diferentes o se modifica el tipo de contrato. No se entenderá que se altera la naturaleza global del contrato cuando se sustituya alguna unidad de obra, suministro o servicio puntual.</p>", "dis": "<ul>\n<li><b>Límite cuantitativo de la <span class=\"t\" data-k=\"modif\">modificación</span> (204.1):</b> los contratos de las Administraciones Públicas pueden modificarse durante su vigencia <b>hasta un máximo del veinte por ciento del precio inicial</b>, cuando en el PCAP se hubiere advertido expresamente de esta posibilidad.</li>\n<li><b>Requisitos de la cláusula:</b>\n <ul><li><b>a)</b> formulada de forma <b>clara, precisa e inequívoca</b>;</li>\n <li><b>b)</b> precisando con detalle suficiente su <b>alcance, límites y naturaleza</b>, las <b>condiciones</b> en que podrá usarse por referencia a circunstancias verificables de forma objetiva, y el <b>procedimiento</b> a seguir.</li></ul></li>\n<li><b>Prohibición expresa:</b> la cláusula establecerá que la modificación <b>no podrá suponer el establecimiento de nuevos precios unitarios no previstos</b> en el contrato.</li>\n<li><b>Comprensibilidad:</b> su formulación debe permitir a candidatos y licitadores <b>comprender su alcance exacto e interpretarla de la misma forma</b>, y al órgano comprobar el cumplimiento de las condiciones de aptitud y valorar correctamente las ofertas.</li>\n<li><b>Límite cualitativo (204.2):</b> en ningún caso podrán preverse modificaciones que puedan <b>alterar la naturaleza global del contrato</b>.</li>\n</ul>", "llano": "<p>Un contrato se puede cambiar durante su vida, pero solo si el pliego avisó de antemano, con claridad, en qué casos y hasta dónde. El techo es el <b>20 % del precio inicial</b>, y el cambio no puede convertir el contrato en otra cosa distinta.</p>", "porque": "<p>Porque la modificación es la puerta trasera de la contratación: se adjudica barato para ganar y luego se «modifica» al alza hasta el precio real. Las directivas europeas lo atajaron distinguiendo entre modificaciones <b>previstas</b> —conocidas por todos los licitadores al ofertar, y por tanto competidas— y <b>no previstas</b>, que son excepcionales y tasadas.</p>\n<p>Que la cláusula deba ser comprensible «de la misma forma» por todos no es retórica: si cada licitador la entiende distinto, la competencia se falsea.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> un presupuesto de reforma que incluye «si al levantar el suelo aparece humedad, se añadirá una partida de hasta 1.200 € por impermeabilización». Sabes de antemano qué puede pasar y cuánto puede costar.</li>\n<li><b>Real:</b> en el contrato de socorrismo, el PCAP prevé que si el ayuntamiento abre una cuarta piscina, el contrato podrá ampliarse en el número de socorristas correspondiente, con los mismos precios unitarios y con un máximo del 20 % del precio inicial. Al abrirse la piscina, la modificación se tramita conforme a esa cláusula.</li>\n<li><b>Caso límite:</b> el mismo contrato quiere ampliarse para incluir el mantenimiento del vaso de las piscinas. Eso <b>altera la naturaleza global</b> del contrato: no cabe por el art. 204, ni siquiera dentro del 20 %.</li>\n</ul>", "noej": "<ul>\n<li><b>No cabe</b> la modificación prevista si el PCAP no advirtió expresamente de ella, por razonable que sea.</li>\n<li><b>No cabe</b> establecer <b>nuevos precios unitarios</b> no previstos en el contrato.</li>\n<li><b>No es el art. 204</b> el que ampara las modificaciones imprevistas: esas son las del <b>art. 205</b>, con supuestos tasados.</li>\n<li><b>No es una prórroga</b>: la prórroga alarga el plazo sin tocar el contenido (art. 29.2).</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 101.2.c):</b> si el pliego prevé la modificación, el <b>valor estimado</b> es el importe máximo alcanzable con todas las modificaciones al alza.</li>\n<li><b>Art. 205:</b> modificaciones no previstas.</li>\n<li><b>Art. 203:</b> potestad de modificación del contrato.</li>\n<li><b>Art. 122.2:</b> la cláusula de modificación forma parte del PCAP.</li>\n<li><b>Art. 35.j):</b> los supuestos de modificación son contenido mínimo del contrato.</li>\n<li><b>Art. 29.2:</b> prórroga, figura distinta.</li>\n</ul>", "trampas": "<ul>\n<li><b>20 % del precio inicial</b>, no del valor estimado ni del presupuesto base.</li>\n<li>Dos límites, no uno: el <b>cuantitativo</b> (20 %) y el <b>cualitativo</b> (naturaleza global).</li>\n<li>La modificación prevista <b>sí</b> se computa en el valor estimado; la imprevista, no.</li>\n</ul>", "ancla": "<p><b>«Avisado, medido y sin cambiar de contrato.»</b></p>\n<p>El número: <b>20 %</b>. Y el límite que no es número: no puede alterarse la <b>naturaleza global</b>.</p>", "vis": "<svg viewBox=\"0 0 960 281\" role=\"img\" aria-label=\"Requisitos y límites de las modificaciones previstas en el pliego\" style=\"width:100%;height:auto\"><defs><marker id=\"fl15\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr15\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe15\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw15\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"250\" y=\"8\" width=\"460\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"27.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">MODIFICACIONES PREVISTAS EN EL PLIEGO · ART. 204</text><rect x=\"20\" y=\"52\" width=\"219.5\" height=\"175\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"129.75\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--exc)\">LÍMITE CUANTITATIVO</text><text x=\"129.75\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">La modificación no puede</text><text x=\"129.75\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">superar el 20 % del</text><text x=\"129.75\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">precio inicial</text><text x=\"129.75\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"129.75\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 204.1</text><rect x=\"253.5\" y=\"52\" width=\"219.5\" height=\"175\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"363.25\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--exc)\">LÍMITE CUALITATIVO</text><text x=\"363.25\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">No puede alterar la</text><text x=\"363.25\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">naturaleza global del</text><text x=\"363.25\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">contrato</text><text x=\"363.25\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"363.25\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 204.2</text><rect x=\"487\" y=\"52\" width=\"219.5\" height=\"175\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"596.75\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--warn)\">REQUISITOS DE LA CLÁUSULA</text><text x=\"596.75\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">De forma clara, precisa</text><text x=\"596.75\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">e inequívoca:</text><text x=\"596.75\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"596.75\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">· el supuesto que la</text><text x=\"596.75\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">  activa</text><text x=\"596.75\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">· el alcance y límites</text><text x=\"596.75\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">· el procedimiento</text><text x=\"596.75\" y=\"180\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"596.75\" y=\"193\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 204.1</text><rect x=\"720.5\" y=\"52\" width=\"219.5\" height=\"175\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"830.25\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--acc)\">EFECTO EN EL CÁLCULO</text><text x=\"830.25\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Si el pliego prevé la</text><text x=\"830.25\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">modificación, el VALOR</text><text x=\"830.25\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">ESTIMADO del contrato</text><text x=\"830.25\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">es el importe MÁXIMO</text><text x=\"830.25\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">que pueda alcanzar con</text><text x=\"830.25\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">todas las modificaciones</text><text x=\"830.25\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">al alza previstas</text><text x=\"830.25\" y=\"180\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"830.25\" y=\"193\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 101.2.c)</text><rect x=\"20\" y=\"237\" width=\"920\" height=\"34\" rx=\"8\" fill=\"var(--panel)\" stroke=\"var(--line)\"/><text x=\"480\" y=\"257.328\" text-anchor=\"middle\" font-size=\"10.4\" fill=\"currentColor\">La modificación PREVISTA (art. 204) no es lo mismo que la NO prevista (art. 205), que exige que concurra alguno de los supuestos tasados de ese artículo.</text></svg>"}];
const PLAZOS=[["35 días", "Presentación de proposiciones en abierto SARA de obras, suministros y servicios", "Licitadores", "156.2", "Desde el ENVÍO del anuncio al DOUE"], ["30 días", "Presentación de proposiciones en abierto SARA de concesiones", "Licitadores", "156.2", "Desde el envío del anuncio al DOUE"], ["15 días", "Reducción del plazo por anuncio de información previa", "Licitadores", "156.3.a)", "Anuncio previo enviado entre 12 meses y 35 días antes"], ["15 días", "Presentación de proposiciones en abierto simplificado", "Licitadores", "159.3", "Desde el siguiente a la publicación en el perfil"], ["20 días", "Presentación de proposiciones en abierto simplificado de OBRAS", "Licitadores", "159.3", "Mínimo"], ["10 días hábiles", "Presentación en el abierto simplificado ABREVIADO", "Licitadores", "159.6", "5 días hábiles en suministros de adquisición corriente"], ["15 días", "Plazo máximo para adjudicar con criterio único de precio", "Órgano de contratación", "158.1", "Desde el siguiente al de apertura de las proposiciones"], ["2 meses", "Plazo máximo para adjudicar con pluralidad de criterios", "Órgano de contratación", "158.2", "Salvo otro plazo en el PCAP. Igual si el criterio único es el coste del ciclo de vida"], ["+15 días hábiles", "Ampliación del plazo para adjudicar si hay oferta anormalmente baja", "Órgano de contratación", "158.3", "Trámites del art. 149.4"], ["10 días hábiles", "Documentación y garantía definitiva del mejor licitador", "Licitador", "150.2", "Si no cumple, se entiende que RETIRA su oferta"], ["5 días hábiles", "Adjudicación tras recibir la documentación", "Órgano de contratación", "150.3", "Resolución motivada"], ["10 días hábiles", "Nueva adjudicación a otro licitador tras recurso especial", "Licitador", "150.4", "Para cumplimentar los trámites oportunos"], ["15 días", "Publicación de la adjudicación en el perfil de contratante", "Órgano de contratación", "151.1", "Además de notificarla a candidatos y licitadores"], ["15 días hábiles", "Plazo de espera antes de formalizar si cabe recurso especial", "—", "153.3", "Desde la REMISIÓN de la notificación. Las CCAA pueden ampliarlo hasta un mes"], ["5 días", "Formalización tras el requerimiento", "Adjudicatario", "153.3", "Desde el siguiente a la recepción del requerimiento"], ["15 días hábiles", "Formalización cuando NO cabe recurso especial", "Adjudicatario", "153.3", "Siguientes a la notificación de la adjudicación"], ["3 %", "Penalidad por no formalizar por causa imputable al adjudicatario", "Adjudicatario", "153.4", "Del presupuesto base de licitación, IVA excluido"], ["2.000.000 €", "Umbral del abierto simplificado en obras", "—", "159.1.a)", "Valor estimado igual o inferior"], ["25 % / 45 %", "Ponderación máxima del juicio de valor en el abierto simplificado", "—", "159.1.b)", "45 % solo en prestaciones de carácter intelectual"], ["80.000 / 60.000 €", "Umbrales del abierto simplificado abreviado", "—", "159.6", "Obras / suministros y servicios"], ["20 %", "Límite de las modificaciones previstas en el pliego", "Órgano de contratación", "204.1", "Del precio inicial, y sin alterar la naturaleza global"], ["20 días hábiles", "Informe de la CNMC sobre indicios de conductas colusorias", "CNMC", "150.1", "El órgano resuelve después en 10 días hábiles"], ["3 miembros", "Composición mínima del comité de expertos", "—", "146.2", "No adscritos al órgano proponente del contrato"], ["20 días", "Plazo máximo para la apertura de las proposiciones", "Mesa de contratación", "157.3", "Desde que finaliza el plazo de presentación"], ["Dos fases", "Estructura del procedimiento restringido", "—", "160.1 y 160.2", "Solicitud de participación y, tras la selección, proposición"], ["20 días", "Plazo máximo para la apertura de las proposiciones", "Mesa de contratación", "157.3", "Desde que finaliza el plazo de presentación"], ["Dos fases", "Estructura del procedimiento restringido", "—", "160.1 y 160.2", "Solicitud de participación y, tras la selección, proposición"]];
const FLASH=[["Enumera los procedimientos de adjudicación", "<b>Abierto</b>, <b>restringido</b>, <b>negociado</b> con o sin publicidad, <b>diálogo competitivo</b> y <b>asociación para la innovación</b>. Ordinarios: el abierto y el restringido (art. 131.2)."], ["¿Dónde se publica el anuncio de licitación?", "Siempre en el <b>perfil de contratante</b>, salvo negociado sin publicidad. Además, en el <b>BOE</b> si el contrato es de la AGE o entes vinculados, y en el <b>DOUE</b> si es SARA (art. 135.1)."], ["¿Cuál es la regla general sobre criterios de adjudicación?", "Una <b>pluralidad de criterios</b> basados en la <b>mejor relación calidad-precio</b>, vinculados al objeto, formulados objetivamente y sin conferir libertad de decisión ilimitada (art. 145)."], ["¿Cuándo es obligatorio el comité de expertos?", "Cuando los criterios sujetos a <b>juicio de valor</b> tengan una <b>ponderación mayor</b> que los evaluables automáticamente. Mínimo <b>tres miembros</b>, no adscritos al órgano proponente (art. 146.2)."], ["¿Qué hay que hacer ante una oferta anormalmente baja?", "<b>Requerir al licitador</b> para que justifique y desglose razonadamente el bajo nivel de precios o costes. Solo si no lo explica satisfactoriamente se excluye. Y se rechaza <b>obligatoriamente</b> si vulnera la normativa de subcontratación o las obligaciones medioambientales, sociales o laborales (art. 149)."], ["¿De qué plazo dispone el mejor licitador para presentar la documentación?", "<b>Diez días hábiles</b> desde el siguiente a la recepción del requerimiento. Si no cumplimenta, se entiende que <b>retira</b> su oferta y se requiere al siguiente (art. 150.2)."], ["¿En qué plazo se adjudica tras recibir la documentación?", "Dentro de los <b>cinco días hábiles</b> siguientes a su recepción (art. 150.3)."], ["Si un recurso especial obliga a adjudicar a otro licitador, ¿qué plazo se le da?", "<b>Diez días hábiles</b> para que cumplimente los trámites que resulten oportunos (art. 150.4)."], ["¿Qué debe contener la notificación de la adjudicación?", "Información suficiente para recurrir: razones del descarte de candidatos, motivos de exclusión de licitadores con <b>desglose de las valoraciones</b>, nombre del adjudicatario y las <b>características y ventajas</b> de su oferta (art. 151.2)."], ["¿Cuánto hay que esperar para formalizar un contrato susceptible de recurso especial?", "<b>Quince días hábiles</b> desde que se <b>remita</b> la notificación de la adjudicación. Después, requerimiento y <b>cinco días</b> para formalizar (art. 153.3)."], ["¿Qué penalidad hay por no formalizar por causa imputable al adjudicatario?", "El <b>3 % del presupuesto base de licitación, IVA excluido</b>, efectiva en primer lugar contra la garantía definitiva (art. 153.4)."], ["¿Cuál es el plazo mínimo de presentación en un abierto SARA?", "<b>Treinta y cinco días</b> en obras, suministros y servicios; <b>treinta</b> en concesiones, desde el <b>envío</b> del anuncio al DOUE (art. 156.2)."], ["¿Cuáles son las dos condiciones del abierto simplificado?", "<b>a)</b> Valor estimado ≤ 2.000.000 € en obras, o inferior a los umbrales de los arts. 21.1.a) y 22.1.a) en suministros y servicios. <b>b)</b> Juicio de valor ≤ 25 %, o ≤ 45 % en prestaciones intelectuales (art. 159.1)."], ["¿Cuál es el límite de las modificaciones previstas en el pliego?", "El <b>20 % del precio inicial</b>, y en ningún caso pueden <b>alterar la naturaleza global</b> del contrato (art. 204)."], ["¿Qué plazo NO se reduce en la tramitación urgente?", "El de <b>quince días hábiles</b> del art. 153.3, período de espera antes de la formalización. Los demás plazos de licitación, adjudicación y formalización se reducen <b>a la mitad</b> (art. 119.2.b)."], ["¿En qué plazo debe abrirse la proposición y qué valor tiene la propuesta de adjudicación?", "La apertura debe efectuarse en el plazo máximo de <b>veinte días</b> desde que finaliza el plazo de presentación. Y la propuesta de adjudicación <b>no crea derecho alguno</b> a favor del licitador propuesto (art. 157.3 y 157.6)."], ["¿Cómo se estructura el procedimiento restringido?", "En <b>dos fases</b>: cualquier empresa presenta <b>solicitud de participación</b> y solo pueden ofertar quienes, <b>en atención a su solvencia</b>, sean seleccionados. Está <b>prohibida toda negociación</b> (art. 160)."], ["¿Qué plazo NO se reduce en la tramitación urgente?", "El de <b>quince días hábiles</b> del art. 153.3, período de espera antes de la formalización. Los demás plazos de licitación, adjudicación y formalización se reducen <b>a la mitad</b> (art. 119.2.b)."], ["¿En qué plazo debe abrirse la proposición y qué valor tiene la propuesta de adjudicación?", "La apertura debe efectuarse en el plazo máximo de <b>veinte días</b> desde que finaliza el plazo de presentación. Y la propuesta de adjudicación <b>no crea derecho alguno</b> a favor del licitador propuesto (art. 157.3 y 157.6)."], ["¿Cómo se estructura el procedimiento restringido?", "En <b>dos fases</b>: cualquier empresa presenta <b>solicitud de participación</b> y solo pueden ofertar quienes, <b>en atención a su solvencia</b>, sean seleccionados. Está <b>prohibida toda negociación</b> (art. 160)."]];
const TEST=[{"a": 131, "q": "Los procedimientos ORDINARIOS de adjudicación son:", "o": [["El abierto y el restringido", 1, "Correcto: art. 131.2. Los demás solo proceden en los supuestos previstos por la ley."], ["El abierto y el negociado sin publicidad", 0, "El negociado nunca es ordinario: exige un supuesto habilitante."], ["El abierto simplificado y el contrato menor", 0, "El simplificado es una modalidad del abierto y el menor no es un procedimiento."], ["El diálogo competitivo y la asociación para la innovación", 0, "Son procedimientos excepcionales para contratos complejos o innovadores."]]}, {"a": 135, "q": "El anuncio de licitación de un contrato de una diputación NO sujeto a regulación armonizada se publica:", "o": [["En el perfil de contratante", 1, "Correcto: art. 135.1. El BOE solo se exige a la AGE y entes vinculados; el DOUE, a los contratos SARA."], ["En el perfil de contratante y en el BOE", 0, "La publicación en el BOE se exige a la Administración General del Estado, no a las entidades locales."], ["En el perfil de contratante y en el DOUE", 0, "El DOUE es obligatorio solo si el contrato está sujeto a regulación armonizada; aquí sería voluntario."], ["En el Boletín Oficial de la Provincia", 0, "La Ley 9/2017 no exige la publicación en el BOP del anuncio de licitación."]]}, {"a": 145, "q": "Los criterios de adjudicación deben:", "o": [["Estar vinculados al objeto del contrato y no conferir libertad de decisión ilimitada", 1, "Correcto: art. 145.5, junto con la formulación objetiva y el respeto a la igualdad, no discriminación, transparencia y proporcionalidad."], ["Valorar la experiencia general de la empresa licitadora", 0, "La experiencia general es criterio de solvencia; solo cabe valorar la del personal adscrito cuando afecte significativamente a la ejecución."], ["Referirse siempre exclusivamente al precio", 0, "La regla del art. 145.1 es la pluralidad de criterios basados en la mejor relación calidad-precio."], ["Ser fijados libremente por la mesa de contratación al valorar", 0, "Deben figurar en el pliego: fijarlos después vulnera la transparencia."]]}, {"a": 146, "q": "El comité de expertos del art. 146.2 es obligatorio cuando:", "o": [["Los criterios sujetos a juicio de valor tienen una ponderación mayor que los evaluables automáticamente", 1, "Correcto. Mínimo tres miembros y no adscritos al órgano proponente del contrato."], ["Existe cualquier criterio sujeto a juicio de valor", 0, "Solo si su ponderación es mayor que la de los automáticos."], ["El contrato está sujeto a regulación armonizada", 0, "El criterio no es el umbral, sino la ponderación de los criterios."], ["Lo solicita algún licitador", 0, "No depende de la voluntad de los licitadores."]]}, {"a": 149, "q": "Ante una oferta incursa en presunción de anormalidad, el órgano de contratación:", "o": [["Requiere al licitador para que justifique y desglose razonadamente el bajo nivel de precios o costes", 1, "Correcto: art. 149.4. Solo si la justificación no es satisfactoria se excluye la oferta."], ["La excluye automáticamente", 0, "La exclusión sin audiencia previa es nula: la presunción admite prueba en contrario."], ["La admite en todo caso si el precio es el criterio único", 0, "El criterio único no impide aplicar el trámite de anormalidad."], ["Solicita informe preceptivo de la Junta Consultiva", 0, "El art. 149.4 prevé el asesoramiento técnico del servicio correspondiente, no ese informe."]]}, {"a": 150, "q": "El licitador que ha presentado la mejor oferta dispone, para presentar la documentación y constituir la garantía definitiva, de:", "o": [["Diez días hábiles desde el siguiente a la recepción del requerimiento", 1, "Correcto: art. 150.2. Si no cumplimenta adecuadamente, se entiende que retira su oferta."], ["Cinco días hábiles", 0, "Cinco días hábiles es el plazo del órgano para adjudicar tras recibir la documentación (art. 150.3)."], ["Quince días hábiles", 0, "Quince días hábiles es el plazo de espera antes de formalizar (art. 153.3)."], ["Un mes", 0, "No es ninguno de los plazos del artículo."]]}, {"a": 150, "q": "Si por resolución de un recurso especial hay que adjudicar el contrato a otro licitador, se le concede:", "o": [["Un plazo de diez días hábiles para cumplimentar los trámites oportunos", 1, "Correcto: art. 150.4, literal."], ["Un plazo de quince días hábiles", 0, "Ese es el plazo de espera del art. 153.3, no el del art. 150.4."], ["Un plazo de cinco días", 0, "Cinco días es el plazo para formalizar tras el requerimiento del art. 153.3."], ["El mismo plazo que se dio al adjudicatario inicial en el anuncio", 0, "La ley fija un plazo específico: diez días hábiles."]]}, {"a": 151, "q": "La resolución de adjudicación:", "o": [["Debe ser motivada, notificarse a candidatos y licitadores y publicarse en el perfil en el plazo de 15 días", 1, "Correcto: art. 151.1. Y su contenido debe permitir recurrir de forma fundada (151.2)."], ["Basta con publicarla en el perfil de contratante", 0, "La notificación a candidatos y licitadores es una obligación distinta y acumulativa."], ["Debe publicarse en el plazo de 30 días", 0, "El art. 151.1 fija 15 días."], ["No necesita expresar el desglose de las valoraciones", 0, "El art. 151.2.b) lo exige respecto de los licitadores excluidos, incluyendo al adjudicatario."]]}, {"a": 153, "q": "En un contrato susceptible de recurso especial, la formalización:", "o": [["No podrá efectuarse antes de que transcurran quince días hábiles desde que se remita la notificación de la adjudicación", 1, "Correcto: art. 153.3. Las comunidades autónomas pueden incrementar el plazo sin exceder de un mes."], ["No podrá efectuarse antes de que transcurran diez días hábiles", 0, "Diez días hábiles son los de los arts. 150.2 y 150.4, no el plazo de espera."], ["Debe efectuarse en el plazo de cinco días desde la adjudicación", 0, "Los cinco días operan tras el requerimiento, y solo una vez transcurrido el plazo de espera."], ["Puede efectuarse el mismo día de la notificación", 0, "Eso vaciaría de contenido el recurso especial: el contrato ya existiría."]]}, {"a": 153, "q": "Si por causa imputable al adjudicatario no se formaliza el contrato en plazo:", "o": [["Se le exige el 3 % del presupuesto base de licitación, IVA excluido, en concepto de penalidad", 1, "Correcto: art. 153.4, efectiva en primer lugar contra la garantía definitiva."], ["Se le exige el 5 % del precio de adjudicación", 0, "Ni el porcentaje ni la base son los del art. 153.4."], ["Se pierde íntegramente la garantía definitiva", 0, "La penalidad se hace efectiva contra la garantía, pero su importe es el 3 % del presupuesto base sin IVA."], ["Se le prohíbe contratar durante tres años", 0, "La prohibición de contratar tiene su propio régimen en el art. 71."]]}, {"a": 156, "q": "En un procedimiento abierto para un contrato de servicios sujeto a regulación armonizada, el plazo de presentación de proposiciones no será inferior a:", "o": [["Treinta y cinco días desde el envío del anuncio a la Oficina de Publicaciones de la Unión Europea", 1, "Correcto: art. 156.2. En concesiones el mínimo es de treinta días."], ["Quince días desde la publicación en el perfil de contratante", 0, "Ese es el plazo del abierto simplificado (art. 159.3)."], ["Treinta días desde la publicación en el BOE", 0, "Los treinta días corresponden a las concesiones, y el cómputo es desde el envío al DOUE."], ["Veintiséis días desde la adjudicación", 0, "No es ningún plazo del artículo."]]}, {"a": 158, "q": "Cuando el único criterio de adjudicación es el precio, la adjudicación debe recaer en el plazo máximo de:", "o": [["Quince días desde el siguiente al de apertura de las proposiciones", 1, "Correcto: art. 158.1. Con pluralidad de criterios el plazo es de dos meses (158.2)."], ["Dos meses desde la apertura de las proposiciones", 0, "Dos meses es el plazo cuando hay pluralidad de criterios o el criterio único es el coste del ciclo de vida."], ["Cinco días hábiles desde la clasificación", 0, "Los cinco días hábiles del art. 150.3 se cuentan desde la recepción de la documentación."], ["Un mes desde la publicación del anuncio", 0, "No es ninguno de los plazos del art. 158."]]}, {"a": 159, "q": "El procedimiento abierto simplificado puede utilizarse en contratos de obras cuando su valor estimado sea:", "o": [["Igual o inferior a 2.000.000 de euros, y el juicio de valor no supere el 25 %", 1, "Correcto: art. 159.1.a) y b). El 45 % solo se admite en prestaciones de carácter intelectual."], ["Inferior a 40.000 euros", 0, "Ese es el umbral del contrato menor de obras (art. 118.1)."], ["Igual o inferior a 1.000.000 de euros", 0, "El umbral del art. 159.1.a) para obras es de 2.000.000 de euros."], ["Cualquiera, siempre que los criterios sean automáticos", 0, "El umbral cuantitativo es una condición autónoma que también debe cumplirse."]]}, {"a": 204, "q": "Las modificaciones previstas en el pliego:", "o": [["Pueden alcanzar hasta el 20 % del precio inicial y no pueden alterar la naturaleza global del contrato", 1, "Correcto: art. 204.1 y 204.2. Y su importe máximo se computa en el valor estimado (art. 101.2.c)."], ["Pueden alcanzar hasta el 50 % del precio inicial", 0, "El límite del art. 204.1 es el 20 %."], ["No necesitan estar previstas en el pliego si concurre interés público", 0, "Sin previsión en el pliego, la modificación se rige por el art. 205 y sus supuestos tasados."], ["Permiten establecer nuevos precios unitarios", 0, "El art. 204.1 lo prohíbe expresamente."]]}, {"a": 157, "q": "La apertura de las proposiciones en el procedimiento abierto debe efectuarse:", "o": [["En el plazo máximo de veinte días desde la finalización del plazo para presentarlas", 1, "Correcto: art. 157.3. Con varios sobres, basta abrir el primero dentro de ese plazo."], ["En el plazo máximo de quince días", 0, "Quince días es el plazo máximo para adjudicar con criterio único de precio (art. 158.1)."], ["En el plazo máximo de dos meses", 0, "Dos meses es el plazo para adjudicar con pluralidad de criterios (art. 158.2)."], ["Cuando lo estime oportuno la mesa de contratación", 0, "El art. 157.3 fija un plazo máximo indisponible."]]}, {"a": 160, "q": "En el procedimiento restringido:", "o": [["Solo pueden presentar proposiciones los empresarios seleccionados por el órgano de contratación en atención a su solvencia", 1, "Correcto: art. 160.2. Y está prohibida toda negociación de los términos del contrato (160.3)."], ["Cualquier empresario puede presentar directamente su proposición", 0, "Eso es el procedimiento abierto (art. 156.1)."], ["Cabe negociar los términos del contrato con los candidatos", 0, "El art. 160.3 lo prohíbe expresamente."], ["La selección se realiza aplicando los criterios de adjudicación", 0, "La selección se hace en atención a la <b>solvencia</b>, no a los criterios de adjudicación."]]}, {"a": 157, "q": "La apertura de las proposiciones en el procedimiento abierto debe efectuarse:", "o": [["En el plazo máximo de veinte días desde la finalización del plazo para presentarlas", 1, "Correcto: art. 157.3. Con varios sobres, basta abrir el primero dentro de ese plazo."], ["En el plazo máximo de quince días", 0, "Quince días es el plazo máximo para adjudicar con criterio único de precio (art. 158.1)."], ["En el plazo máximo de dos meses", 0, "Dos meses es el plazo para adjudicar con pluralidad de criterios (art. 158.2)."], ["Cuando lo estime oportuno la mesa de contratación", 0, "El art. 157.3 fija un plazo máximo indisponible."]]}, {"a": 160, "q": "En el procedimiento restringido:", "o": [["Solo pueden presentar proposiciones los empresarios seleccionados por el órgano de contratación en atención a su solvencia", 1, "Correcto: art. 160.2. Y está prohibida toda negociación de los términos del contrato (160.3)."], ["Cualquier empresario puede presentar directamente su proposición", 0, "Eso es el procedimiento abierto (art. 156.1)."], ["Cabe negociar los términos del contrato con los candidatos", 0, "El art. 160.3 lo prohíbe expresamente."], ["La selección se realiza aplicando los criterios de adjudicación", 0, "La selección se hace en atención a la <b>solvencia</b>, no a los criterios de adjudicación."]]}];
const CASOS=[{"t": "Caso 1 · La cuenta atrás de un contrato SARA", "e": "Una diputación licita un suministro con valor estimado de 3.570.000 €. Cronología: <b>(1)</b> 4 de marzo, envío del anuncio al DOUE. <b>(2)</b> 6 de marzo, publicación en el DOUE y en el perfil. <b>(3)</b> 9 de abril, apertura de proposiciones; hay tres criterios, dos automáticos y uno de juicio de valor con el 20 % de ponderación. <b>(4)</b> 30 de abril, clasificación y requerimiento al mejor licitador. <b>(5)</b> Presenta la documentación el 12 de mayo. <b>(6)</b> Adjudicación el 16 de mayo, notificada y remitida ese día.<br><br><b>Se pide:</b> comprueba cada plazo y di cuándo puede formalizarse como pronto.", "s": "<p><b>(1)-(3) Art. 156.2:</b> el plazo mínimo es de <b>35 días desde el ENVÍO</b> al DOUE, es decir, desde el 4 de marzo. Vencería el 8 de abril; la apertura el 9 es correcta.</p><p><b>(3) Art. 146.2:</b> el juicio de valor pesa un 20 %, menos que los criterios automáticos: <b>no</b> es obligatorio el comité de expertos. Bastan la mesa y el informe técnico.</p><p><b>(4)-(5) Art. 150.2:</b> diez días hábiles desde el siguiente al requerimiento. Del 30 de abril al 12 de mayo hay margen si se descuentan sábados, domingos y festivos: correcto.</p><p><b>(5)-(6) Art. 150.3:</b> cinco días hábiles desde la recepción de la documentación. Del 12 al 16 de mayo: correcto.</p><p><b>(6) Art. 151.1:</b> la adjudicación debe publicarse en el perfil en <b>15 días</b>.</p><p><b>Formalización, art. 153.3:</b> el contrato es SARA, luego es susceptible de recurso especial (art. 44.1). No puede formalizarse antes de que transcurran <b>quince días hábiles</b> desde el 16 de mayo, fecha de <b>remisión</b> de la notificación. Después vendrá el requerimiento y los <b>cinco días</b> para firmar.</p><p><b>Y una consecuencia del art. 36.1:</b> hasta esa firma <b>no hay contrato</b>. Por eso el plazo de espera funciona.</p>"}, {"t": "Caso 2 · Una oferta demasiado barata", "e": "En la limpieza de seis colegios, con presupuesto base de licitación de 318.000 € IVA incluido y criterio único de precio, se presentan cuatro ofertas: 291.000, 285.500, 279.000 y <b>198.000 €</b>. El PCAP define como anormal la baja que supere en más de 10 puntos porcentuales a la media de las ofertas presentadas.<br><br><b>Se pide:</b> qué debe hacer el órgano de contratación, en qué plazo debe adjudicar y qué pasaría si la empresa justificase la baja con costes salariales inferiores al convenio.", "s": "<p><b>1 · Identificar.</b> La media de las cuatro ofertas es 263.375 €. La oferta de 198.000 € está un 24,8 % por debajo: incursa en presunción de anormalidad conforme al parámetro del pliego (art. 149.2).</p><p><b>2 · Requerir.</b> El art. 149.4 obliga a requerir al licitador para que <b>justifique y desglose razonada y detalladamente</b> el bajo nivel de los precios. Excluirla sin este trámite haría nula la exclusión.</p><p><b>3 · Plazo para adjudicar.</b> Criterio único de precio: <b>quince días</b> desde el siguiente a la apertura (art. 158.1), <b>ampliados en quince días hábiles</b> por seguir los trámites del art. 149.4 (art. 158.3).</p><p><b>4 · Si la baja se sostiene en salarios inferiores al convenio.</b> El rechazo deja de ser una opción: el art. 149.4 obliga a <b>rechazar</b> la oferta cuando se compruebe que es anormalmente baja porque incumple las obligaciones aplicables en materia medioambiental, social o laboral, incluidos los convenios colectivos sectoriales vigentes.</p><p><b>5 · Y si se admite.</b> El art. 107.2 permite exigirle una <b>garantía complementaria</b> de hasta un 5 % adicional, por resolución motivada, precisamente por haber estado incursa en presunción de anormalidad.</p>"}, {"t": "Caso 3 · ¿Qué procedimiento y qué plazos?", "e": "Un ayuntamiento plantea tres licitaciones:<br><b>A)</b> Obra de reforma de un mercado: valor estimado <b>1.850.000 €</b>, criterios 70 % precio (fórmula) y 30 % memoria técnica (juicio de valor).<br><b>B)</b> Servicio de socorrismo: valor estimado <b>178.000 €</b>, criterios 100 % automáticos.<br><b>C)</b> Suministro de mobiliario: valor estimado <b>52.000 €</b>, criterio único precio.<br><br><b>Se pide:</b> di qué procedimiento cabe en cada caso y el plazo mínimo de presentación de ofertas.", "s": "<p><b>A)</b> El valor estimado (1.850.000 €) está por debajo de los 2.000.000 € del art. 159.1.a), pero el <b>juicio de valor es del 30 %</b>, por encima del 25 % del 159.1.b), y una obra no es prestación de carácter intelectual. <b>No cabe el abierto simplificado</b>: hay que ir al <b>abierto ordinario</b> (art. 156). Al no ser SARA en obras, el plazo lo fija el pliego con los mínimos legales. Además, como el juicio de valor (30) es menor que lo automático (70), <b>no</b> hace falta comité de expertos.</p><p><b>B)</b> Servicios por debajo del umbral armonizado y sin juicio de valor: cabe el <b>abierto simplificado</b>. Plazo mínimo <b>quince días</b> desde el siguiente a la publicación en el perfil (art. 159.3).</p><p><b>C)</b> Suministro de 52.000 €: por debajo de los 60.000 € del art. 159.6, cabe el <b>abierto simplificado abreviado</b>: un único sobre, <b>diez días hábiles</b> y sin garantía definitiva. Criterio único de precio, luego la adjudicación debe recaer en <b>quince días</b> desde la apertura (art. 158.1).</p><p><b>La lección:</b> el procedimiento no lo decide solo el importe. En el abierto simplificado hay <b>dos</b> condiciones, y basta que falle una para quedarse fuera.</p>"}, {"t": "Caso · De los sobres a la propuesta", "e": "En el procedimiento abierto del servicio de socorrismo, con tres criterios —60 puntos al precio por fórmula, 30 a la memoria técnica por juicio de valor y 10 a mejoras automáticas—, el plazo de presentación termina el <b>viernes 18 de febrero</b>. Se presentan cinco empresas.<br><br><b>Se pide:</b> ordena los trámites, di hasta cuándo puede abrirse la proposición, si hace falta comité de expertos y qué valor tiene la propuesta de la mesa.", "s": "<p><b>1 · Sobres.</b> Con pluralidad de criterios, la proposición se presenta en <b>dos sobres</b>: uno con lo valorable por <b>juicio de valor</b> —la memoria técnica— y otro con lo valorable por <b>fórmulas</b> —precio y mejoras— (art. 157.2). Y aparte, en sobre <b>distinto</b>, la documentación del art. 140 que la mesa califica primero (art. 157.1).</p><p><b>2 · Plazo de apertura.</b> Máximo <b>veinte días</b> desde el 18 de febrero, es decir, hasta el <b>10 de marzo</b>. Si la proposición va en varios sobres que se abren en actos independientes, basta con haber abierto el <b>primero</b> dentro de ese plazo (art. 157.3).</p><p><b>3 · Orden.</b> Primero se valora el sobre de juicio de valor y solo después se abre el de fórmulas: es la garantía del art. 146.2 contra el ajuste de la nota subjetiva al precio conocido.</p><p><b>4 · ¿Comité de expertos?</b> <b>No.</b> El juicio de valor pesa 30 y los criterios automáticos 70: los automáticos tienen <b>mayor</b> ponderación, así que no concurre el supuesto del art. 146.2. Bastan la mesa y los informes técnicos que estime precisos (art. 157.5).</p><p><b>5 · Acto público.</b> La apertura de la oferta económica se hace en <b>acto público</b>, salvo que se prevea el empleo de medios electrónicos (art. 157.4).</p><p><b>6 · La propuesta.</b> La mesa clasifica y <b>propone</b>, pero su propuesta <b>no crea derecho alguno</b> a favor del propuesto. Si el órgano de contratación no adjudica conforme a ella, solo tiene que <b>motivarlo</b> (art. 157.6). Después vienen el requerimiento de <b>diez días hábiles</b> del art. 150.2 y la adjudicación en <b>cinco días hábiles</b> del art. 150.3.</p>"}];
const SEMAFORO=["Enumero los cinco procedimientos y sé cuáles son los ordinarios — art. 131", "Sé qué prohíbe el art. 132 y a quién hay que denunciar los indicios de colusión", "Sé dónde se publica el anuncio de licitación en cada caso — art. 135", "Distingo criterios de adjudicación de criterios de solvencia — art. 145", "Sé cuándo es obligatorio el comité de expertos y cómo se compone — art. 146", "Sé tramitar una oferta anormalmente baja y cuándo el rechazo es obligatorio — art. 149", "Domino la cadena 10 · 5 · 15 · 10 de los arts. 150, 151 y 153", "Sé qué debe contener la notificación de la adjudicación — art. 151", "Sé cuándo puede formalizarse un contrato y qué penalidad hay si no se firma — art. 153", "Conozco los plazos de presentación en el abierto SARA — art. 156", "Sé los plazos máximos para adjudicar según los criterios — art. 158", "Domino las dos condiciones y los plazos del abierto simplificado y del abreviado — art. 159", "Distingo modificación prevista (204) de no prevista (205) y sé el límite del 20 %", "Sé el plazo de apertura y que la propuesta no crea derecho — art. 157", "Domino las dos fases del procedimiento restringido y la prohibición de negociar — art. 160", "Sé el plazo de apertura y que la propuesta no crea derecho — art. 157", "Domino las dos fases del procedimiento restringido y la prohibición de negociar — art. 160"];
const INTRO_HTML="<section class=\"card\" id=\"intro\"><h2>Tema 10 · Bloque 3 · Adjudicación y formalización</h2><p class=\"small\">El bloque anterior terminaba con el expediente aprobado. Aquí se ve todo lo que pasa después: dónde se anuncia, quién puede ofertar y cómo, cómo se puntúa, qué ocurre con las ofertas sospechosamente baratas, cómo se adjudica y —el momento decisivo— cuándo nace el contrato.</p><div class=\"box ej\"><span class=\"lbl\">La idea que ordena el bloque</span>Entre la apertura de las ofertas y la firma hay una <b>cuenta atrás con cinco números</b>: <b>20</b> días para abrir las proposiciones (157.3) · <b>10</b> días hábiles para que el mejor licitador traiga los papeles y la garantía (150.2) · <b>5</b> días hábiles para adjudicar (150.3) · <b>15</b> días para publicar la adjudicación (151.1) · <b>15</b> días hábiles de espera antes de formalizar si cabe recurso especial (153.3). Si te aprendes esa cuenta atrás, la mitad de las preguntas de este bloque caen solas.</div><div class=\"box warn\"><span class=\"lbl\">Fuentes utilizadas y vigencia</span><ul><li><b>Ley 9/2017, de 8 de noviembre</b>, de Contratos del Sector Público (documento de la biblioteca del proyecto), <b>texto consolidado</b>, transcrito literalmente artículo por artículo.</li><li><b>Aportación externa</b>, marcada donde aparece: la <b>Ley 7/1985</b> reguladora de las Bases del Régimen Local, la <b>Ley 40/2015</b> en materia de delegación de competencias, la <b>Ley General Presupuestaria</b> y el <b>RD Legislativo 1/2013</b> de derechos de las personas con discapacidad, citadas por los propios preceptos.</li><li><b>Verifica siempre la vigencia en el BOE consolidado.</b> Los umbrales de la regulación armonizada se actualizan cada dos años por reglamento delegado de la Comisión Europea.</li><li>Las entidades, fechas y cifras de los ejemplos y casos son <b>ficticias</b>; los preceptos y las cifras legales, reales.</li></ul></div><div class=\"box exc\"><span class=\"lbl\">Esto no es asesoramiento jurídico</span>Es material de estudio. Para un expediente real, acude a la norma consolidada y al informe del órgano competente.</div><div class=\"box\"><span class=\"lbl\">Los cuatro bloques del tema 10</span><ul><li><a href=\"LCSP_28-102_organo_y_objeto.html\"><b>Bloque 1 · El órgano de contratación, las partes y el objeto</b> — arts. 28, 29, 35, 36, 61, 62, 63, 74, 99 a 102</a></li><li><a href=\"LCSP_106-126_expediente.html\"><b>Bloque 2 · Garantías, expediente y pliegos</b> — arts. 106 a 108, 115 a 124 y 126</a></li><li><a href=\"LCSP_131-204_adjudicacion.html\"><b>Bloque 3 · Adjudicación y formalización</b> — arts. 131 a 160 y 204</a></li><li><a href=\"LCSP_44-60_recurso_especial.html\"><b>Bloque 4 · El recurso especial en materia de contratación</b> — arts. 44 a 60</a></li></ul></div></section><section class=\"card\" id=\"mapa\"><h2>El mapa del bloque</h2><p class=\"small\">Los procedimientos, la secuencia de la adjudicación y la formalización.</p><svg viewBox=\"0 0 960 454\" role=\"img\" aria-label=\"Los procedimientos de adjudicación de los contratos del sector público\" style=\"width:100%;height:auto\"><defs><marker id=\"fl16\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr16\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe16\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw16\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"250\" y=\"8\" width=\"460\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"27.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">LOS PROCEDIMIENTOS DE ADJUDICACIÓN · ART. 131</text><rect x=\"20\" y=\"52\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"30\" y=\"66\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"120\" y=\"83\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--acc)\">ABIERTO</text><text x=\"224\" y=\"74\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Todo empresario interesado puede presentar proposición.</text><text x=\"224\" y=\"88\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Es uno de los dos procedimientos ORDINARIOS.</text><text x=\"930\" y=\"74\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">131.2</text><path d=\"M480 107 L 480 115\" stroke=\"var(--acc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl16)\"/><rect x=\"20\" y=\"116\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"30\" y=\"130\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"120\" y=\"147\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--acc)\">RESTRINGIDO</text><text x=\"224\" y=\"138\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Solo pueden presentar proposición los seleccionados por el órgano</text><text x=\"224\" y=\"152\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">tras su solicitud. También ORDINARIO.</text><text x=\"930\" y=\"138\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">131.2</text><path d=\"M480 171 L 480 179\" stroke=\"var(--acc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl16)\"/><rect x=\"20\" y=\"180\" width=\"920\" height=\"40\" rx=\"10\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"30\" y=\"187\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"120\" y=\"204\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--warn)\">NEGOCIADO</text><text x=\"224\" y=\"202\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Con o sin publicidad. Solo en los supuestos tasados de la ley.</text><text x=\"930\" y=\"202\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">131.2</text><path d=\"M480 221 L 480 229\" stroke=\"var(--warn)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl16)\"/><rect x=\"20\" y=\"230\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"30\" y=\"244\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"120\" y=\"261\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--warn)\">DIÁLOGO COMPETITIVO</text><text x=\"224\" y=\"252\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Para contratos especialmente complejos: se dialoga con los</text><text x=\"224\" y=\"266\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">candidatos antes de definir la solución.</text><text x=\"930\" y=\"252\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">131.2</text><path d=\"M480 285 L 480 293\" stroke=\"var(--warn)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl16)\"/><rect x=\"20\" y=\"294\" width=\"920\" height=\"40\" rx=\"10\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"30\" y=\"295\" width=\"180\" height=\"38\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"120\" y=\"311.5\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--warn)\">ASOCIACIÓN PARA</text><text x=\"120\" y=\"324.5\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--warn)\">LA INNOVACIÓN</text><text x=\"224\" y=\"316\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Cuando la solución no existe todavía en el mercado.</text><text x=\"930\" y=\"316\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">131.2</text><path d=\"M480 335 L 480 343\" stroke=\"var(--warn)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl16)\"/><rect x=\"20\" y=\"344\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--panel)\" stroke=\"var(--line)\"/><rect x=\"30\" y=\"358\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--line)\"/><text x=\"120\" y=\"375\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"currentColor\">CONCURSO DE PROYECTOS</text><text x=\"224\" y=\"366\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Vía específica para adquirir planos o proyectos, sobre todo en</text><text x=\"224\" y=\"380\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">arquitectura, urbanismo, ingeniería y proceso de datos.</text><text x=\"930\" y=\"366\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">131.3</text><rect x=\"20\" y=\"408\" width=\"920\" height=\"34\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"480\" y=\"428.328\" text-anchor=\"middle\" font-size=\"9.4\" fill=\"currentColor\">La adjudicación se realiza ORDINARIAMENTE por procedimiento abierto o restringido (art. 131.2). Los demás son excepcionales y requieren que concurra su supuesto habilitante.</text></svg><svg viewBox=\"0 0 960 412\" role=\"img\" aria-label=\"Clasificación de ofertas, requerimiento, adjudicación y publicación\" style=\"width:100%;height:auto\"><defs><marker id=\"fl17\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr17\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe17\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw17\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"250\" y=\"8\" width=\"460\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"27.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">DE LA CLASIFICACIÓN A LA ADJUDICACIÓN · ARTS. 150 Y 151</text><rect x=\"20\" y=\"52\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"30\" y=\"66\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"120\" y=\"83\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--acc)\">CLASIFICAR</text><text x=\"224\" y=\"74\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">La mesa o el órgano clasifica las ofertas por orden decreciente,</text><text x=\"224\" y=\"88\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">aplicando los criterios del pliego.</text><text x=\"930\" y=\"74\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">150.1</text><path d=\"M480 107 L 480 115\" stroke=\"var(--acc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl17)\"/><rect x=\"20\" y=\"116\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"30\" y=\"130\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"120\" y=\"147\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--warn)\">REQUERIR · 10 días hábiles</text><text x=\"224\" y=\"138\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Se requiere al licitador que ha presentado la MEJOR OFERTA para que</text><text x=\"224\" y=\"152\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">presente la documentación justificativa y constituya la GARANTÍA DEFINITIVA.</text><text x=\"930\" y=\"138\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">150.2</text><path d=\"M480 171 L 480 179\" stroke=\"var(--warn)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl17)\"/><rect x=\"20\" y=\"180\" width=\"920\" height=\"40\" rx=\"10\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><rect x=\"30\" y=\"187\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--exc)\"/><text x=\"120\" y=\"204\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--exc)\">SI NO CUMPLE</text><text x=\"224\" y=\"202\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Se entiende que RETIRA su oferta y se requiere al siguiente.</text><text x=\"930\" y=\"202\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">150.2</text><path d=\"M480 221 L 480 229\" stroke=\"var(--exc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl17)\"/><rect x=\"20\" y=\"230\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><rect x=\"30\" y=\"244\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--ej)\"/><text x=\"120\" y=\"261\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--ej)\">ADJUDICAR · 5 días hábiles</text><text x=\"224\" y=\"252\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Dentro de los cinco días hábiles siguientes a la recepción de la</text><text x=\"224\" y=\"266\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">documentación. La resolución debe ser MOTIVADA.</text><text x=\"930\" y=\"252\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">150.3 y 151.1</text><path d=\"M480 285 L 480 293\" stroke=\"var(--ej)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl17)\"/><rect x=\"20\" y=\"294\" width=\"920\" height=\"40\" rx=\"10\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><rect x=\"30\" y=\"301\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--ej)\"/><text x=\"120\" y=\"318\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--ej)\">PUBLICAR · 15 días</text><text x=\"224\" y=\"316\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">La adjudicación se publica en el perfil de contratante.</text><text x=\"930\" y=\"316\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">151.1</text><path d=\"M480 335 L 480 343\" stroke=\"var(--ej)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl17)\"/><rect x=\"20\" y=\"344\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"30\" y=\"352\" width=\"180\" height=\"38\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"120\" y=\"368.5\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--warn)\">NUEVA ADJUDICACIÓN</text><text x=\"120\" y=\"381.5\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--warn)\">10 días hábiles</text><text x=\"224\" y=\"366\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Si por resolución de un recurso especial hay que adjudicar a otro</text><text x=\"224\" y=\"380\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">licitador, se le conceden diez días hábiles para cumplimentar trámites.</text><text x=\"930\" y=\"366\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">150.4</text></svg><svg viewBox=\"0 0 960 496\" role=\"img\" aria-label=\"Plazos y régimen de la formalización de los contratos\" style=\"width:100%;height:auto\"><defs><marker id=\"fl18\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr18\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe18\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw18\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"250\" y=\"8\" width=\"460\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"27.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">LA FORMALIZACIÓN · ART. 153</text><rect x=\"20\" y=\"52\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"30\" y=\"66\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"120\" y=\"83\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--acc)\">REGLA</text><text x=\"224\" y=\"74\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Los contratos se formalizan en DOCUMENTO ADMINISTRATIVO,</text><text x=\"224\" y=\"88\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">salvo los menores. El contratista puede pedir escritura pública a su costa.</text><text x=\"930\" y=\"74\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">153.1 y 153.2</text><path d=\"M480 107 L 480 115\" stroke=\"var(--acc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl18)\"/><rect x=\"20\" y=\"116\" width=\"920\" height=\"68\" rx=\"10\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><rect x=\"30\" y=\"137\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--exc)\"/><text x=\"120\" y=\"154\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--exc)\">SI CABE RECURSO ESPECIAL</text><text x=\"224\" y=\"138\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">NO puede formalizarse antes de que transcurran QUINCE DÍAS HÁBILES</text><text x=\"224\" y=\"152\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">desde que se remita la notificación de la adjudicación a licitadores y candidatos.</text><text x=\"224\" y=\"166\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Las comunidades autónomas pueden ampliarlo, sin exceder de un mes.</text

<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>LCSP · Tema 10 · Bloque 3 · Adjudicación y formalización</title>
<style>

/* ═══════════════════════════════════════════════════════════════
   SISTEMA DE DISEÑO · "Académico Gamificado" · Bloque II
   Temas 8, 9 y 10 · Auxiliar Administrativo
   ═══════════════════════════════════════════════════════════════ */
:root{
  --fs:16px;

  --bg:#faf9f7;
  --bg-grad:radial-gradient(1100px 560px at 12% -8%, #ede9ff 0%, transparent 55%),
            radial-gradient(850px 460px at 96% 0%, #dcf5ee 0%, transparent 50%);
  --surface:#ffffff;
  --surface-2:#f4f3f0;
  --surface-3:#eceae5;
  --line:#e6e3dc;
  --line-strong:#d4d0c7;

  --ink:#15161c;
  --ink-2:#5d616e;
  --ink-3:#8b8f9c;

  --brand:#5b3df5;
  --brand-2:#7c5cff;
  --brand-soft:#efeaff;
  --brand-ring:rgba(91,61,245,.18);

  --legal:#4338ca;  --legal-bg:#eeecff;
  --ej:#059669;     --ej-bg:#e4f7f0;
  --warn:#c2690a;   --warn-bg:#fdf1de;
  --exc:#dc2626;    --exc-bg:#ffeceb;

  --ok:#16a34a; --ok-soft:#e7f7ec;
  --mid:#eab308; --mid-soft:#fdf6dd;
  --off:#a1a1aa; --off-soft:#f1f1f3;

  --sh-1:0 1px 2px rgba(20,20,30,.04), 0 2px 8px rgba(20,20,30,.04);
  --sh-2:0 2px 6px rgba(20,20,30,.05), 0 12px 28px rgba(20,20,30,.07);
  --sh-3:0 8px 20px rgba(91,61,245,.13), 0 24px 56px rgba(20,20,30,.10);
  --sh-glow:0 0 0 4px var(--brand-ring);

  --r-sm:9px; --r-md:14px; --r-lg:20px; --r-full:999px;

  --f-display:"Segoe UI Variable Display",system-ui,-apple-system,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-legal:ui-serif,Georgia,Cambria,"Times New Roman",serif;
  --f-mono:ui-monospace,"SF Mono","Cascadia Mono","Segoe UI Mono",Menlo,monospace;

  --t-h1:clamp(1.02rem,.95rem + .3vw,1.2rem);
  --t-h2:clamp(1.2rem,1.05rem + .6vw,1.55rem);
  --t-h3:clamp(1rem,.95rem + .25vw,1.12rem);
  --t-sm:.86rem;
  --t-xs:.75rem;

  --e-out:cubic-bezier(.22,1,.36,1);
  --e-spring:cubic-bezier(.34,1.56,.64,1);

  /* ── Compatibilidad con SVG y contenido generado ── */
  --panel:var(--surface);
  --ink2:var(--ink-2);
  --acc:var(--brand);
  --acc-soft:var(--brand-soft);
  --g:var(--ok); --y:var(--mid); --r:var(--exc);
}

html[data-theme="dark"]{
  --bg:#0a0b0f;
  --bg-grad:radial-gradient(1100px 560px at 12% -8%, #1c1740 0%, transparent 55%),
            radial-gradient(850px 460px at 96% 0%, #08302b 0%, transparent 50%);
  --surface:#13151b;
  --surface-2:#1a1d25;
  --surface-3:#232733;
  --line:#262a34;
  --line-strong:#343947;

  --ink:#eceef4;
  --ink-2:#9ba2b3;
  --ink-3:#6e7585;

  --brand:#8b6dff;
  --brand-2:#a78bff;
  --brand-soft:#1e1a3d;
  --brand-ring:rgba(139,109,255,.22);

  --legal:#a5b4fc; --legal-bg:#191b3a;
  --ej:#34d399;    --ej-bg:#0c2a24;
  --warn:#fbbf24;  --warn-bg:#2e2110;
  --exc:#fb7185;   --exc-bg:#331119;

  --ok:#4ade80; --ok-soft:#0e2a19;
  --mid:#facc15; --mid-soft:#2c2610;
  --off:#5b6070; --off-soft:#1c1f27;

  --sh-1:0 1px 2px rgba(0,0,0,.3), 0 2px 8px rgba(0,0,0,.25);
  --sh-2:0 2px 6px rgba(0,0,0,.35), 0 12px 28px rgba(0,0,0,.4);
  --sh-3:0 8px 20px rgba(139,109,255,.2), 0 24px 56px rgba(0,0,0,.5);
}

*,*::before,*::after{box-sizing:border-box}
html{font-size:var(--fs);scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);background-image:var(--bg-grad);
  background-attachment:fixed;background-repeat:no-repeat;
  color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.68;
  -webkit-font-smoothing:antialiased;
  transition:background-color .5s var(--e-out),color .3s;
}
::selection{background:var(--brand);color:#fff}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{font-family:var(--f-display);letter-spacing:-.022em;line-height:1.2}
.num{font-variant-numeric:tabular-nums}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:99px;border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3)}

/* ═══ HEADER ═══ */
header.top{
  position:sticky;top:0;z-index:60;
  background:color-mix(in srgb,var(--surface) 80%,transparent);
  backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);
  border-bottom:1px solid var(--line);
}
.top-in{max-width:1280px;margin:0 auto;padding:.65rem 1.1rem;display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.brandwrap{display:flex;align-items:center;gap:.65rem;min-width:0;flex:1}
.mark{
  width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;
  font-weight:800;font-size:.8rem;letter-spacing:-.02em;text-decoration:none;
  box-shadow:0 4px 14px var(--brand-ring);
  transition:transform .3s var(--e-spring),box-shadow .3s;
}
.mark:hover{transform:rotate(-8deg) scale(1.08);box-shadow:var(--sh-3);text-decoration:none}
.top h1{font-size:var(--t-h1);margin:0;font-weight:800;line-height:1.25;min-width:0}
.top h1 .sub{display:block;font-size:var(--t-xs);color:var(--ink-2);font-weight:500;letter-spacing:0;
  margin-top:.1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tools{margin-left:auto;display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}

button,select,input[type=search]{
  font:inherit;font-size:var(--t-sm);font-weight:600;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:var(--r-sm);padding:.4rem .72rem;cursor:pointer;
  position:relative;overflow:hidden;
  transition:transform .18s var(--e-spring),border-color .2s,background .2s,box-shadow .2s,color .2s;
}
button:hover{transform:translateY(-1.5px);border-color:var(--brand);box-shadow:var(--sh-1)}
button:active{transform:translateY(0) scale(.97)}
button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible{outline:none;box-shadow:var(--sh-glow)}
input[type=search]{min-width:190px;cursor:text;font-weight:500}
input[type=search]:focus{border-color:var(--brand)}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--surface-2);padding:2px;gap:2px}
.seg button{border:0;border-radius:calc(var(--r-sm) - 2px);padding:.32rem .68rem;background:transparent;box-shadow:none}
.seg button:hover{transform:none;background:var(--surface)}
.seg button[aria-pressed="true"]{background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;box-shadow:0 2px 8px var(--brand-ring)}

.ripple{position:absolute;border-radius:50%;transform:scale(0);background:currentColor;opacity:.25;animation:rip .55s linear;pointer-events:none}
@keyframes rip{to{transform:scale(3.4);opacity:0}}

.progress{position:absolute;left:0;bottom:-1px;height:2.5px;width:0;
  background:linear-gradient(90deg,var(--brand),var(--legal),var(--ej));transition:width .1s linear}

/* ═══ LAYOUT ═══ */
.layout{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:270px 1fr;gap:1.8rem;padding:1.4rem 1.1rem 5rem}
main{min-width:0}

/* ═══ SIDEBAR ═══ */
nav.side{
  position:sticky;top:76px;align-self:start;max-height:calc(100vh - 96px);overflow:auto;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:.85rem;box-shadow:var(--sh-1);
}
nav.side h2{font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);
  margin:.5rem .4rem .5rem;font-weight:800}
nav.side h2:first-child{margin-top:.1rem}
nav.side a{
  display:flex;align-items:baseline;gap:.5rem;padding:.36rem .55rem;border-radius:var(--r-sm);
  text-decoration:none;color:var(--ink-2);font-size:var(--t-sm);font-weight:500;
  position:relative;transition:background .22s,color .22s,transform .22s var(--e-out);
}
nav.side a:hover{background:var(--surface-2);color:var(--ink);transform:translateX(3px);text-decoration:none}
nav.side a.on{background:var(--brand-soft);color:var(--brand);font-weight:700}
nav.side a.on::before{content:"";position:absolute;left:-.85rem;top:20%;bottom:20%;width:3px;
  border-radius:0 3px 3px 0;background:var(--brand)}
nav.side a b{color:var(--ink-3);font-weight:800;font-size:var(--t-xs);font-variant-numeric:tabular-nums;flex:none;min-width:1.9em}
nav.side a.on b{color:var(--brand)}
.navtoggle{display:none}

/* ═══ TARJETAS ═══ */
section.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:1.35rem 1.5rem;margin-bottom:1.1rem;box-shadow:var(--sh-1);
  transition:box-shadow .3s var(--e-out),border-color .3s;
}
section.card:hover{box-shadow:var(--sh-2)}
section.card>h2{
  margin:0 0 1rem;font-size:var(--t-h2);font-weight:800;
  display:flex;align-items:center;gap:.6rem;
}
section.card>h2::before{
  content:"";width:4px;height:1.05em;border-radius:99px;flex:none;
  background:linear-gradient(180deg,var(--brand),var(--brand-2));
}

/* ═══ ARTÍCULO ═══ */
.art{scroll-margin-top:86px;padding-top:.4rem}
.art + .art{margin-top:1.6rem;padding-top:1.6rem;border-top:1px dashed var(--line)}
.art h2{display:flex;flex-wrap:wrap;gap:.5rem;align-items:baseline;font-size:var(--t-h3);
  margin:0 0 .25rem;font-weight:800;letter-spacing:-.015em}
.art h2 .num{
  color:var(--brand);font-weight:800;font-family:var(--f-display);
  background:var(--brand-soft);padding:.1rem .5rem;border-radius:var(--r-sm);
  font-size:.92em;letter-spacing:-.02em;
}
.ubic{font-size:var(--t-xs);color:var(--ink-3);margin:0 0 .8rem;font-weight:600;
  letter-spacing:.03em;text-transform:uppercase}

/* ═══ IDEA CLAVE ═══ */
.idea{
  background:linear-gradient(100deg,var(--brand-soft),color-mix(in srgb,var(--brand-soft) 40%,transparent));
  border-left:4px solid var(--brand);border-radius:0 var(--r-md) var(--r-md) 0;
  padding:.75rem 1rem;font-weight:650;margin:.7rem 0 1rem;position:relative;
  font-size:.97rem;line-height:1.55;
}

/* ═══ ACORDEÓN ═══ */
details.panel{
  border:1px solid var(--line);border-radius:var(--r-md);margin:.6rem 0;
  background:var(--surface);overflow:hidden;
  transition:border-color .25s,box-shadow .25s,background .25s;
}
details.panel:hover{border-color:var(--line-strong)}
details.panel[open]{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-ring)}
details.panel>summary{
  cursor:pointer;padding:.62rem .9rem;font-weight:700;font-size:.93rem;
  list-style:none;display:flex;align-items:center;gap:.55rem;
  transition:background .2s,color .2s;
}
details.panel>summary:hover{background:var(--surface-2)}
details.panel[open]>summary{background:var(--brand-soft);color:var(--brand)}
details.panel>summary::-webkit-details-marker{display:none}
details.panel>summary::before{
  content:"";width:16px;height:16px;flex:none;border-radius:5px;
  background:var(--brand-soft);position:relative;transition:transform .3s var(--e-spring),background .25s;
}
details.panel>summary::after{
  content:"";position:absolute;width:0;height:0;margin-left:5px;
  border:4px solid transparent;border-left-color:var(--brand);
  transition:transform .3s var(--e-spring);
}
details.panel[open]>summary::before{background:var(--surface)}
details.panel[open]>summary::after{transform:rotate(90deg) translateX(-1px)}
details.panel .body{padding:.3rem 1rem 1rem;font-size:.95rem;animation:slidein .35s var(--e-out)}
@keyframes slidein{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* ═══ TEXTO LEGAL ═══ */
.legal{
  background:var(--legal-bg);border-left:4px solid var(--legal);
  border-radius:0 var(--r-md) var(--r-md) 0;padding:.85rem 1.05rem;
  font-family:var(--f-legal);font-size:.95rem;line-height:1.7;
}
.legal p{margin:.45rem 0}
.legal .lbl{
  font-family:var(--f-body);font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;
  color:var(--legal);font-weight:800;display:block;margin-bottom:.4rem;
}

/* ═══ CAJAS SEMÁNTICAS ═══ */
.box{
  border-left:4px solid var(--line);border-radius:0 var(--r-md) var(--r-md) 0;
  padding:.72rem .95rem;margin:.65rem 0;font-size:.94rem;
  transition:transform .25s var(--e-out),box-shadow .25s;
}
.box:hover{transform:translateX(3px);box-shadow:var(--sh-1)}
.box.ej{background:var(--ej-bg);border-color:var(--ej)}
.box.warn{background:var(--warn-bg);border-color:var(--warn)}
.box.exc{background:var(--exc-bg);border-color:var(--exc)}
.box .lbl{font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;font-weight:800;
  display:block;margin-bottom:.3rem}
.box.ej .lbl{color:var(--ej)}
.box.warn .lbl{color:var(--warn)}
.box.exc .lbl{color:var(--exc)}

.interp{
  border:1px dashed var(--warn);background:color-mix(in srgb,var(--warn-bg) 45%,transparent);
  border-radius:var(--r-md);padding:.65rem .9rem;font-size:.9rem;margin:.6rem 0;
}
.interp .lbl{font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;color:var(--warn);font-weight:800;display:block}

/* ═══ TABLAS ═══ */
table{width:100%;border-collapse:separate;border-spacing:0;font-size:.9rem;margin:.7rem 0;
  border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
th,td{padding:.5rem .68rem;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
td + td, th + th{border-left:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th{background:var(--surface-2);font-size:var(--t-xs);font-weight:800;letter-spacing:.05em;
  text-transform:uppercase;color:var(--ink-2);position:sticky;top:0}
tbody tr{transition:background .18s}
tbody tr:nth-child(even){background:color-mix(in srgb,var(--surface-2) 45%,transparent)}
tbody tr:hover{background:var(--brand-soft)}
th.sortable{cursor:pointer;user-select:none;transition:color .2s,background .2s}
th.sortable:hover{color:var(--brand);background:var(--brand-soft)}
th.sortable::after{content:" ⇅";color:var(--ink-3);font-size:.7rem}

ul,ol{margin:.5rem 0 .5rem 1.2rem;padding:0}
li{margin:.26rem 0}
li::marker{color:var(--brand);font-weight:700}

/* ═══ TOOLTIPS ═══ */
.t{border-bottom:1.5px dotted var(--brand);cursor:help;position:relative;
  transition:background .2s,color .2s}
.t:hover{background:var(--brand-soft);color:var(--brand);border-radius:3px}
#tip{
  position:fixed;z-index:99;max-width:330px;background:var(--ink);color:var(--bg);
  padding:.6rem .78rem;border-radius:var(--r-md);font-size:.82rem;line-height:1.5;
  display:none;box-shadow:0 8px 30px rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.08);
}
html[data-theme="dark"] #tip{background:#f0f1f5;color:#15161c}

/* ═══ FLECHAS DE DIAGRAMA ═══
   Un <path> con stroke pero sin fill toma el valor inicial (negro) y el
   navegador cierra el trazo implícitamente: aparece un triángulo relleno
   entre sus extremos. Forzamos fill:none para dejar solo la línea + la
   punta del <marker>, que sí lleva su color. */
svg path[stroke]:not([fill]){fill:none}
svg polyline:not([fill]){fill:none}
svg line{fill:none}

/* ═══ SVG ═══ */
svg{max-width:100%;height:auto;display:block;margin:.9rem auto}
svg text{font-family:var(--f-body)}

/* ═══ BUSCADOR ═══ */
mark.hit{background:linear-gradient(180deg,transparent 55%,#ffe066 55%);color:inherit;
  border-radius:2px;padding:0 1px;font-weight:600}
html[data-theme="dark"] mark.hit{background:linear-gradient(180deg,transparent 55%,#8a6d00 55%);color:#fff}

/* ═══ UTILIDADES ═══ */
.hide{display:none !important}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.small{font-size:var(--t-sm);color:var(--ink-2)}
.chip{
  display:inline-block;font-size:var(--t-xs);padding:.16rem .55rem;border-radius:var(--r-full);
  background:var(--brand-soft);color:var(--brand);font-weight:800;letter-spacing:.02em;
}

/* ═══ HUECOS RELLENABLES ═══ */
.gap{
  display:inline-block;min-width:5.5em;border-bottom:2px solid var(--brand);
  text-align:center;font-weight:700;color:transparent;cursor:pointer;
  transition:color .3s,background .3s;
}
.gap.on,.gap:hover{color:var(--brand);background:var(--brand-soft);border-radius:4px 4px 0 0}

/* ═══ REVELAR SOLUCIÓN ═══ */
.revelar{
  background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;border-color:transparent;
  font-weight:700;
}
.revelar:hover{box-shadow:var(--sh-3)}
.sol{
  margin-top:.7rem;padding:.8rem 1rem;border-radius:var(--r-md);
  background:var(--ej-bg);border-left:4px solid var(--ej);
  animation:slidein .4s var(--e-out);
}

/* ═══ TEST ═══ */
.opt{
  display:block;padding:.55rem .85rem;margin:.35rem 0;border:1.5px solid var(--line);
  border-radius:var(--r-md);cursor:pointer;background:var(--surface);font-size:.94rem;
  transition:border-color .22s,background .22s,transform .22s var(--e-out);
}
.opt:hover{border-color:var(--brand);background:var(--brand-soft);transform:translateX(4px)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft);font-weight:650}
.opt.ko{border-color:var(--exc);background:var(--exc-bg)}
.opt input{margin-right:.5rem;accent-color:var(--brand)}

#tscore,#semres{
  font-family:var(--f-display);font-weight:800;font-size:1.15rem;letter-spacing:-.02em;
}

/* ═══════════════════════════════════════════════════════════════
   FLASHCARDS 3D · mazo con giro, vuelo de salida y sheen
   ═══════════════════════════════════════════════════════════════ */
#flash{--fc-e:cubic-bezier(.2,.8,.25,1);--fc-h:250px}

/* — Escena — */
.fc-stage{
  perspective:1400px;perspective-origin:50% 45%;
  padding:.4rem 0 .2rem;position:relative;
}
.fc-deck{position:relative;height:var(--fc-h);will-change:transform}

/* — Cartas fantasma del mazo — */
.fc-ghost{
  position:absolute;inset:0;border-radius:var(--r-lg);
  background:var(--surface);border:1px solid var(--line);
  transition:transform .5s var(--fc-e),opacity .5s var(--fc-e);
}
.fc-ghost.g1{transform:translateY(9px) scale(.972);opacity:.75}
.fc-ghost.g2{transform:translateY(18px) scale(.944);opacity:.45}
.fc-deck.empty .fc-ghost{opacity:0;transform:translateY(26px) scale(.9)}

/* — Elevación durante el giro — */
.fc-lift{position:absolute;inset:0;transform-style:preserve-3d}
.fc-lift.lift{animation:fcLift .78s var(--fc-e)}
@keyframes fcLift{
  0%,100%{transform:scale(1) translateY(0)}
  45%{transform:scale(1.055) translateY(-16px)}
}
.fc-lift.out-ok{animation:fcOut .5s cubic-bezier(.5,0,.75,0) forwards}
.fc-lift.out-ko{animation:fcOutKo .5s cubic-bezier(.5,0,.75,0) forwards}
.fc-lift.in{animation:fcIn .48s var(--fc-e)}
@keyframes fcOut{
  0%{transform:translateX(0) rotate(0) scale(1);opacity:1}
  100%{transform:translateX(130%) rotate(17deg) scale(.85);opacity:0}
}
@keyframes fcOutKo{
  0%{transform:translateX(0) rotate(0) scale(1);opacity:1}
  100%{transform:translateX(-130%) rotate(-17deg) scale(.85);opacity:0}
}
@keyframes fcIn{
  0%{transform:translateY(26px) scale(.9);opacity:0}
  100%{transform:translateY(0) scale(1);opacity:1}
}

/* — La carta — */
.fc-card{
  position:absolute;inset:0;transform-style:preserve-3d;
  transition:transform .78s var(--fc-e);
  cursor:pointer;border-radius:var(--r-lg);
}
.fc-card:focus-visible{outline:none}
.fc-card:focus-visible .fc-face{box-shadow:var(--sh-glow),var(--sh-2)}

/* — Caras — */
.fc-face{
  position:absolute;inset:0;border-radius:var(--r-lg);
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  padding:2rem 2.2rem;text-align:center;overflow:hidden;
  box-shadow:var(--sh-2);
  transition:box-shadow .4s var(--fc-e);
}
.fc-card:hover .fc-face{box-shadow:var(--sh-3)}

/* Anverso · pregunta */
.fc-front{
  background:
    radial-gradient(120% 90% at 50% -20%, var(--brand-soft) 0%, transparent 60%),
    var(--surface);
  border:1.5px solid var(--line);color:var(--ink);
}
/* Reverso · respuesta */
.fc-back{
  transform:rotateY(180deg);
  background:linear-gradient(145deg,var(--brand) 0%,#6d4bf7 45%,var(--c5,#0891b2) 130%);
  border:1.5px solid transparent;color:#fff;
}
html[data-theme="dark"] .fc-back{
  background:linear-gradient(145deg,#5f45c9 0%,#4b3aa8 45%,#0e6b85 130%);
}
.fc-back .fc-txt{color:#fff}
.fc-back b,.fc-back strong{color:#fff;font-weight:800}

/* — Sheen que barre al girar — */
.fc-face::after{
  content:"";position:absolute;top:-60%;left:-70%;width:55%;height:220%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.42),transparent);
  transform:rotate(18deg);opacity:0;pointer-events:none;
}
.fc-lift.lift .fc-face::after{animation:fcSheen .78s var(--fc-e)}
@keyframes fcSheen{
  0%{opacity:0;left:-70%}
  35%{opacity:1}
  100%{opacity:0;left:150%}
}

/* — Etiqueta superior — */
.fc-tag{
  position:absolute;top:1rem;left:1.15rem;
  font-size:var(--t-xs);font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  display:inline-flex;align-items:center;gap:.4rem;
}
.fc-front .fc-tag{color:var(--brand)}
.fc-back .fc-tag{color:rgba(255,255,255,.9)}
.fc-tag::before{
  content:"";width:7px;height:7px;border-radius:50%;background:currentColor;
  animation:fcPulse 2.2s ease-in-out infinite;
}
@keyframes fcPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.65)}}

/* — Índice tipo naipe — */
.fc-pip{
  position:absolute;font-family:var(--f-display);font-weight:800;
  font-size:.78rem;letter-spacing:-.02em;opacity:.34;font-variant-numeric:tabular-nums;
}
.fc-pip.tr{top:1rem;right:1.15rem}
.fc-pip.bl{bottom:1rem;left:1.15rem;transform:rotate(180deg)}
.fc-front .fc-pip{color:var(--ink-2)}
.fc-back .fc-pip{color:#fff;opacity:.55}

/* — Texto — */
.fc-txt{
  font-size:clamp(1rem,.9rem + .55vw,1.28rem);font-weight:650;line-height:1.5;
  max-width:44ch;letter-spacing:-.012em;
}
.fc-front .fc-txt{font-family:var(--f-display);font-weight:700}
.fc-back .fc-txt{font-weight:600;line-height:1.6}
.fc-hint{
  position:absolute;bottom:1rem;left:0;right:0;
  font-size:var(--t-xs);font-weight:600;letter-spacing:.02em;
  display:flex;align-items:center;justify-content:center;gap:.4rem;
}
.fc-front .fc-hint{color:var(--ink-3)}
.fc-back .fc-hint{color:rgba(255,255,255,.72)}
.fc-hint .kbd{
  font-family:var(--f-mono);font-size:.68rem;font-weight:700;padding:.1rem .32rem;
  border-radius:5px;border:1px solid currentColor;opacity:.75;
}

/* — Pantalla final — */
.fc-done{
  position:absolute;inset:0;border-radius:var(--r-lg);
  background:linear-gradient(150deg,var(--ok-soft),var(--surface) 70%);
  border:1.5px solid var(--ok);
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  text-align:center;padding:2rem;gap:.35rem;
  animation:fcIn .5s var(--fc-e);box-shadow:var(--sh-2);
}
.fc-done .seal{
  font-size:2.6rem;line-height:1;
  animation:fcSeal .7s cubic-bezier(.2,1.5,.4,1);
}
@keyframes fcSeal{0%{transform:scale(0) rotate(-25deg);opacity:0}60%{transform:scale(1.2) rotate(6deg)}100%{transform:scale(1) rotate(0);opacity:1}}
.fc-done h3{font-size:1.3rem;font-weight:800;margin:.2rem 0 0}
.fc-done p{margin:0;color:var(--ink-2);font-size:var(--t-sm)}

/* — Barra de progreso de la ronda — */
.fc-bar{
  height:6px;border-radius:99px;background:var(--surface-3);
  overflow:hidden;margin:.95rem 0 .8rem;position:relative;
}
.fc-bar i{
  display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--brand),var(--c5,#0891b2));
  transition:width .55s var(--fc-e);
}

/* — Controles — */
.fc-ctrls{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.fc-ctrls button{font-weight:700}
#fcok{border-color:var(--ok);color:var(--ok)}
#fcok:hover{background:var(--ok);color:#fff;border-color:var(--ok)}
#fcko{border-color:var(--warn);color:var(--warn)}
#fcko:hover{background:var(--warn);color:#fff;border-color:var(--warn)}
#fcflip{background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;border-color:transparent}
#fcflip:hover{box-shadow:var(--sh-3)}

.fc-score{display:inline-flex;gap:.45rem;margin-left:auto;align-items:center}
.fc-pill{
  font-size:var(--t-xs);font-weight:800;padding:.24rem .6rem;border-radius:var(--r-full);
  font-variant-numeric:tabular-nums;border:1px solid;
}
.fc-pill.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.fc-pill.ko{color:var(--warn);border-color:var(--warn);background:var(--warn-bg)}
.fc-pill.left{color:var(--ink-2);border-color:var(--line);background:var(--surface-2)}
.fc-pill.bump{animation:fcBump .45s var(--e-spring)}
@keyframes fcBump{0%{transform:scale(1)}45%{transform:scale(1.28)}100%{transform:scale(1)}}

@media(max-width:620px){
  #flash{--fc-h:270px}
  .fc-face{padding:1.7rem 1.3rem}
  .fc-score{margin-left:0;width:100%}
}
@media(prefers-reduced-motion:reduce){
  .fc-card{transition:none}
  .fc-lift.lift,.fc-lift.in,.fc-lift.out-ok,.fc-lift.out-ko,.fc-face::after{animation:none !important}
}
@media print{.fc-stage,.fc-ctrls,.fc-bar{display:none !important}}
/* ═══ RESPUESTA ESTRUCTURADA ═══ */
.fc-face{justify-content:center}
.fc-face.struct{justify-content:flex-start;text-align:left;padding-top:3.1rem;padding-bottom:3.1rem}
.fc-body{
  width:100%;max-width:46ch;margin:0 auto;
  overflow-y:auto;max-height:100%;
  scrollbar-width:thin;
}
.fc-body::-webkit-scrollbar{width:5px}
.fc-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.35);border-radius:99px;border:0}
.fc-front .fc-body::-webkit-scrollbar-thumb{background:var(--line-strong)}

/* — Veredicto Sí / No — */
.fc-verdict{
  display:inline-flex;align-items:center;gap:.35rem;
  font-family:var(--f-display);font-weight:800;font-size:.82rem;
  letter-spacing:.06em;text-transform:uppercase;
  padding:.26rem .72rem;border-radius:var(--r-full);margin-bottom:.85rem;
  border:1.5px solid;animation:fcPopIn .45s var(--e-spring) backwards;animation-delay:.34s;
}
.fc-verdict.si{background:rgba(255,255,255,.16);border-color:rgba(190,255,215,.85);color:#d8ffe9}
.fc-verdict.no{background:rgba(255,255,255,.16);border-color:rgba(255,205,205,.85);color:#ffdedd}
@keyframes fcPopIn{0%{opacity:0;transform:scale(.7) translateY(6px)}100%{opacity:1;transform:none}}

/* — Párrafo — */
.fc-p{margin:0;font-size:clamp(1rem,.92rem + .45vw,1.2rem);font-weight:600;line-height:1.6}
.fc-face.struct .fc-p{font-size:clamp(.96rem,.9rem + .35vw,1.1rem)}

/* — Lista enumerada — */
.fc-list{list-style:none;margin:0;padding:0;display:grid;gap:.5rem;counter-reset:fc}
.fc-list li{
  counter-increment:fc;position:relative;margin:0;
  padding:.42rem .6rem .42rem 2.5rem;border-radius:var(--r-sm);
  background:rgba(255,255,255,.11);
  font-size:clamp(.92rem,.88rem + .3vw,1.04rem);font-weight:600;line-height:1.45;
  animation:fcRow .42s var(--e-out) backwards;
}
.fc-list li::before{
  content:counter(fc);position:absolute;left:.6rem;top:50%;transform:translateY(-50%);
  width:1.6rem;height:1.6rem;border-radius:50%;
  display:grid;place-items:center;
  background:rgba(255,255,255,.9);color:var(--brand);
  font-family:var(--f-display);font-weight:800;font-size:.78rem;
  font-variant-numeric:tabular-nums;
}
.fc-list.alpha li::before{content:counter(fc,lower-alpha)}
.fc-list li:nth-child(1){animation-delay:.36s}
.fc-list li:nth-child(2){animation-delay:.42s}
.fc-list li:nth-child(3){animation-delay:.48s}
.fc-list li:nth-child(4){animation-delay:.54s}
.fc-list li:nth-child(5){animation-delay:.60s}
.fc-list li:nth-child(n+6){animation-delay:.66s}
@keyframes fcRow{0%{opacity:0;transform:translateX(-12px)}100%{opacity:1;transform:none}}

/* — Cláusulas contrapuestas — */
.fc-clauses{display:grid;gap:.45rem}
.fc-clauses p{
  margin:0;padding:.45rem .7rem .45rem .95rem;border-radius:0 var(--r-sm) var(--r-sm) 0;
  background:rgba(255,255,255,.11);border-left:3px solid rgba(255,255,255,.55);
  font-size:clamp(.92rem,.88rem + .3vw,1.04rem);font-weight:600;line-height:1.5;
  animation:fcRow .42s var(--e-out) backwards;
}
.fc-clauses p:nth-child(1){animation-delay:.36s}
.fc-clauses p:nth-child(2){animation-delay:.44s}
.fc-clauses p:nth-child(3){animation-delay:.52s}

/* — Negritas resaltadas en el reverso — */
.fc-back .fc-body b,.fc-back .fc-body strong{
  font-weight:800;background:rgba(255,255,255,.2);
  padding:.03em .3em;border-radius:5px;
  box-decoration-break:clone;-webkit-box-decoration-break:clone;
}

/* — Cita legal al pie — */
.fc-cite{
  position:absolute;bottom:.95rem;left:0;right:0;
  display:inline-flex;align-items:center;justify-content:center;gap:.4rem;
  font-family:var(--f-mono);font-size:.74rem;font-weight:700;letter-spacing:.02em;
  color:rgba(255,255,255,.82);
  animation:fcPopIn .5s var(--e-out) backwards;animation-delay:.5s;
}
.fc-cite::before,.fc-cite::after{
  content:"";height:1px;width:clamp(18px,10%,52px);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.45));
}
.fc-cite::after{background:linear-gradient(90deg,rgba(255,255,255,.45),transparent)}
.fc-cite .s{font-size:.9rem;opacity:.75;font-family:var(--f-legal)}
.fc-front .fc-cite{color:var(--ink-3)}
.fc-front .fc-cite::before{background:linear-gradient(90deg,transparent,var(--line-strong))}
.fc-front .fc-cite::after{background:linear-gradient(90deg,var(--line-strong),transparent)}

/* la pista se oculta si hay cita, para no amontonar */
.fc-back .fc-cite ~ .fc-hint,.fc-back .fc-hint.muted{display:none}

@media(max-width:620px){
  #flash{--fc-h:320px}
  .fc-face.struct{padding-top:2.9rem;padding-bottom:2.8rem}
  .fc-list li{padding-left:2.3rem}
}
@media(prefers-reduced-motion:reduce){
  .fc-verdict,.fc-list li,.fc-clauses p,.fc-cite{animation:none !important}
}

/* ═══ SEMÁFORO ═══ */
.sembtn{
  border-radius:var(--r-full);padding:.32rem .7rem;font-weight:700;font-size:var(--t-sm);
}
.sembtn[data-v="g"]:hover,.sembtn.on[data-v="g"]{background:var(--ok);color:#fff;border-color:var(--ok)}
.sembtn[data-v="y"]:hover,.sembtn.on[data-v="y"]{background:var(--mid);color:#3d2f00;border-color:var(--mid)}
.sembtn[data-v="r"]:hover,.sembtn.on[data-v="r"]{background:var(--exc);color:#fff;border-color:var(--exc)}

/* ═══ CTA DE BLOQUE ═══ */
a.blk{
  display:inline-flex;align-items:center;gap:.5rem;
  background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;
  padding:.5rem .95rem;border-radius:var(--r-sm);font-weight:700;font-size:var(--t-sm);
  text-decoration:none;box-shadow:0 2px 10px var(--brand-ring);
  transition:transform .22s var(--e-spring),box-shadow .25s,gap .25s var(--e-out);
}
a.blk:hover{transform:translateY(-2px);box-shadow:var(--sh-3);gap:.75rem;text-decoration:none}
a.blk::after{content:"→"}
a.blk:active{transform:translateY(0) scale(.98)}

/* ═══ REVEAL ═══ */
.rv{opacity:0;transform:translateY(20px);transition:opacity .6s var(--e-out),transform .6s var(--e-out)}
.rv.in{opacity:1;transform:none}

/* ═══ RESPONSIVE ═══ */
@media(max-width:960px){
  .layout{grid-template-columns:1fr;padding-top:.9rem;gap:1rem}
  nav.side{position:static;max-height:none}
  nav.side.collapsed .navbody{display:none}
  .navtoggle{display:block;width:100%;text-align:left;font-weight:700}
  .grid2{grid-template-columns:1fr}
  .top h1 .sub{white-space:normal}
}
@media(max-width:620px){
  .top-in{padding:.55rem .8rem}
  .tools{width:100%;margin-left:0}
  input[type=search]{flex:1;min-width:0}
  section.card{padding:1.05rem 1rem;border-radius:var(--r-md)}
  table{font-size:.82rem}
  th,td{padding:.4rem .5rem}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
  .rv{opacity:1;transform:none}
}
@media print{
  header.top,nav.side,.tools,.noprint,.progress{display:none !important}
  body{background:#fff;background-image:none;font-size:11pt;color:#000}
  .layout{display:block;max-width:none;padding:0}
  section.card{border:0;padding:0;margin:0 0 1rem;break-inside:avoid;box-shadow:none}
  details.panel{border:0;box-shadow:none}
  details.panel .body{display:block !important}
  details.panel>summary{padding-left:0}
  .art{break-inside:avoid}
  .rv{opacity:1;transform:none}
  a{color:#000;text-decoration:none}
}


/* ═══ ALTURA ADAPTATIVA DE LA TARJETA ═══ */
.fc-deck{transition:height .45s var(--fc-e)}
.fc-body{max-height:none;overflow:visible}
.fc-measure{
  position:absolute;left:0;right:0;top:0;height:auto;
  visibility:hidden;pointer-events:none;z-index:-1;
}
.fc-measure .fc-face{
  position:relative;inset:auto;height:auto;min-height:0;
  box-shadow:none;backface-visibility:visible;transform:none;
}
.fc-measure .fc-body{max-height:none;overflow:visible}
.fc-measure .fc-face::after{display:none}

/* ═══ MOSTRAR / OCULTAR ÍNDICE LATERAL ═══ */
.layout{transition:grid-template-columns .42s var(--e-out)}
.layout.nonav{grid-template-columns:0 1fr;gap:0}
.layout.nonav>nav.side{
  opacity:0;transform:translateX(-14px);pointer-events:none;
  padding:0;border-width:0;overflow:hidden;width:0;min-width:0;
}
nav.side{
  transition:opacity .3s var(--e-out),transform .38s var(--e-out);
  overflow-x:hidden;
}
#navhide .ic{display:inline-block;transition:transform .35s var(--e-spring);font-size:.95em;line-height:1}
#navhide[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
#navhide[aria-pressed="true"] .ic{transform:rotate(90deg)}
@media(max-width:960px){#navhide{display:none}}

/* ═══════════════════════════════════════════════════════════════
   LECTURA EN VOZ ALTA (TTS) del texto legal
   ═══════════════════════════════════════════════════════════════ */
.tts-bar{
  display:flex;align-items:center;gap:.45rem;flex-wrap:wrap;
  margin:.15rem 0 .7rem;
}
.tts-bar button{
  font-size:var(--t-xs);font-weight:700;padding:.3rem .62rem;
  border-radius:var(--r-full);border:1px solid var(--legal);
  background:transparent;color:var(--legal);
  display:inline-flex;align-items:center;gap:.35rem;line-height:1.2;
}
.tts-bar button:hover{background:var(--legal);color:var(--surface);border-color:var(--legal)}
.tts-bar button[hidden]{display:none}
.tts-bar .tts-play.on{background:var(--legal);color:var(--surface)}

/* Ondas de audio mientras lee */
.tts-wave{display:inline-flex;align-items:flex-end;gap:2px;height:11px}
.tts-wave i{
  width:2.5px;background:currentColor;border-radius:2px;height:35%;
  animation:ttsW .9s ease-in-out infinite;
}
.tts-wave i:nth-child(2){animation-delay:.15s}
.tts-wave i:nth-child(3){animation-delay:.3s}
.tts-wave i:nth-child(4){animation-delay:.45s}
@keyframes ttsW{0%,100%{height:32%}50%{height:100%}}

.tts-time{
  font-family:var(--f-mono);font-size:.7rem;font-weight:700;
  color:var(--ink-3);font-variant-numeric:tabular-nums;
}

/* Frase que se está leyendo */
.tts-s{transition:background .25s,color .25s;border-radius:3px}
.tts-s.now{
  background:linear-gradient(180deg,transparent 8%,color-mix(in srgb,var(--legal) 26%,transparent) 8%);
  box-shadow:0 0 0 2px color-mix(in srgb,var(--legal) 16%,transparent);
}
html[data-theme="dark"] .tts-s.now{
  background:linear-gradient(180deg,transparent 8%,color-mix(in srgb,var(--legal) 34%,transparent) 8%);
}
.legal.tts-on{box-shadow:0 0 0 3px color-mix(in srgb,var(--legal) 20%,transparent)}

/* ═══ Reproductor flotante ═══ */
.tts-mini{
  position:fixed;left:50%;bottom:1.1rem;transform:translateX(-50%) translateY(140%);
  z-index:80;display:flex;align-items:center;gap:.6rem;
  background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  border:1px solid var(--line);border-radius:var(--r-full);
  padding:.5rem .7rem .5rem .95rem;box-shadow:var(--sh-3);
  transition:transform .45s var(--e-spring),opacity .3s;opacity:0;pointer-events:none;
  max-width:min(94vw,540px);
}
.tts-mini.show{transform:translateX(-50%) translateY(0);opacity:1;pointer-events:auto}
.tts-mini .lbl{
  font-size:var(--t-xs);font-weight:800;color:var(--legal);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:16ch;
}
.tts-mini button{
  border-radius:50%;width:32px;height:32px;padding:0;display:grid;place-items:center;
  font-size:.8rem;border:1px solid var(--line);flex:none;
}
.tts-mini button.main{
  width:38px;height:38px;font-size:.95rem;
  background:linear-gradient(140deg,var(--legal),var(--brand));color:#fff;border-color:transparent;
}
.tts-mini .bar{
  flex:1;min-width:70px;height:5px;border-radius:99px;background:var(--surface-3);overflow:hidden;
}
.tts-mini .bar i{display:block;height:100%;width:0;background:var(--legal);
  border-radius:99px;transition:width .35s var(--e-out)}

/* ═══ Panel de ajustes de voz ═══ */
.tts-back{
  position:fixed;inset:0;z-index:90;background:rgba(10,10,18,.45);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  display:grid;place-items:center;padding:1rem;
  opacity:0;pointer-events:none;transition:opacity .3s var(--e-out);
}
.tts-back.show{opacity:1;pointer-events:auto}
.tts-panel{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--sh-3);width:min(94vw,470px);max-height:88vh;overflow:auto;
  padding:1.3rem 1.4rem;transform:translateY(16px) scale(.97);
  transition:transform .38s var(--e-spring);
}
.tts-back.show .tts-panel{transform:none}
.tts-panel h3{
  font-size:1.12rem;font-weight:800;margin:0 0 .25rem;
  display:flex;align-items:center;gap:.5rem;
}
.tts-panel .sub{font-size:var(--t-sm);color:var(--ink-2);margin:0 0 1.1rem}
.tts-row{margin-bottom:1.05rem}
.tts-row > label{
  display:block;font-size:var(--t-xs);font-weight:800;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-2);margin-bottom:.4rem;
}
.tts-seg{display:flex;gap:3px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:3px}
.tts-seg button{
  flex:1;border:0;background:transparent;border-radius:calc(var(--r-sm) - 3px);
  padding:.42rem .3rem;font-size:var(--t-sm);font-weight:700;box-shadow:none;
}
.tts-seg button:hover{transform:none;background:var(--surface)}
.tts-seg button[aria-pressed="true"]{
  background:linear-gradient(140deg,var(--legal),var(--brand));color:#fff;
}
.tts-panel select{
  width:100%;padding:.5rem .6rem;border-radius:var(--r-sm);
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  font-size:var(--t-sm);font-weight:600;cursor:pointer;
}
.tts-panel select:focus{border-color:var(--brand);outline:none}
.tts-slider{display:flex;align-items:center;gap:.75rem}
.tts-slider input[type=range]{flex:1;accent-color:var(--legal);cursor:pointer;height:22px}
.tts-val{
  font-family:var(--f-mono);font-weight:800;font-size:var(--t-sm);
  min-width:3.4em;text-align:right;color:var(--legal);font-variant-numeric:tabular-nums;
}
.tts-note{
  font-size:var(--t-xs);color:var(--ink-2);line-height:1.5;
  background:var(--surface-2);border-radius:var(--r-sm);padding:.6rem .75rem;margin:0 0 1rem;
}
.tts-note b{color:var(--ink)}
.tts-acts{display:flex;gap:.5rem;justify-content:flex-end;flex-wrap:wrap}
.tts-acts .prim{
  background:linear-gradient(140deg,var(--legal),var(--brand));color:#fff;border-color:transparent;
}
.tts-badge{
  font-size:.62rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
  padding:.1rem .35rem;border-radius:4px;background:var(--ej-bg);color:var(--ej);margin-left:.35rem;
}


/* — Variante compacta para los apartados desplegables — */
.tts-bar.mini{margin:0 0 .6rem}
.tts-bar.mini button{
  font-size:.7rem;padding:.24rem .55rem;
  border-color:var(--brand);color:var(--brand);
}
.tts-bar.mini button:hover{background:var(--brand);color:var(--surface)}
.tts-bar.mini .tts-play.on{background:var(--brand);color:var(--surface)}
.tts-bar.mini .tts-time{font-size:.66rem}
.idea .tts-bar.mini{margin:.55rem 0 0}
.legal.tts-on,.body.tts-on,.idea.tts-on{
  box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 20%,transparent)
}
.legal.tts-on{box-shadow:0 0 0 3px color-mix(in srgb,var(--legal) 20%,transparent)}


/* aviso de cambio de voz */
.tts-aviso{
  position:fixed;left:50%;bottom:5.2rem;transform:translateX(-50%) translateY(20px);
  z-index:95;max-width:min(92vw,460px);
  background:var(--warn-bg);border:1px solid var(--warn);color:var(--warn);
  border-radius:var(--r-md);padding:.6rem .9rem;font-size:var(--t-sm);font-weight:700;
  box-shadow:var(--sh-2);opacity:0;pointer-events:none;
  transition:opacity .3s var(--e-out),transform .35s var(--e-spring);
}
.tts-aviso.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:620px){
  .tts-mini{left:.6rem;right:.6rem;transform:translateY(140%);max-width:none}
  .tts-mini.show{transform:translateY(0)}
  .tts-mini .lbl{display:none}
}
@media(prefers-reduced-motion:reduce){
  .tts-wave i{animation:none;height:60%}
}
@media print{.tts-bar,.tts-mini,.tts-back{display:none !important}}

<script>
const GLOSARIO={"sara": "Contrato sujeto a regulación armonizada (SARA): el que supera el umbral europeo de los arts. 20 a 23 y queda sometido a publicidad en el DOUE y a recurso especial. Ej.: un suministro de 3.570.000 €.", "modif": "Modificación del contrato: alteración de su contenido durante la vigencia. Es «prevista» si el pliego la anunció (art. 204) y «no prevista» si concurre alguno de los supuestos tasados del art. 205. Ej.: ampliar en un 15 % las horas de socorrismo.", "mesa": "Mesa de contratación: órgano de asistencia técnica especializada que califica la documentación, valora las ofertas y eleva la propuesta de adjudicación. Ej.: la mesa clasifica las cinco ofertas del contrato de socorrismo por orden decreciente.", "juiciovalor": "Criterio sujeto a juicio de valor: el que no puede puntuarse aplicando una fórmula y exige una apreciación técnica motivada. Ej.: la calidad de la memoria técnica de un proyecto de arquitectura.", "automatico": "Criterio evaluable de forma automática: el que se puntúa aplicando una fórmula del pliego a una cifra o porcentaje. Ej.: la puntuación del precio según una fórmula proporcional.", "anormal": "Oferta anormalmente baja: la que, según los parámetros del pliego, resulta sospechosamente barata y obliga a requerir justificación al licitador antes de admitirla o excluirla. Ej.: una baja del 38 % sobre la media en un contrato de limpieza.", "colusoria": "Conducta colusoria: acuerdo o práctica concertada entre empresas para repartirse licitaciones o fijar precios. Ej.: tres constructoras que presentan bajas escalonadas y simétricas en cinco licitaciones seguidas.", "standstill": "Plazo de espera: los quince días hábiles del art. 153.3 durante los cuales no puede formalizarse un contrato susceptible de recurso especial, para que pueda impugnarse antes de que nazca. Ej.: adjudicado el 4 de mayo, no puede firmarse hasta el 25.", "rolece": "ROLECE: Registro Oficial de Licitadores y Empresas Clasificadas del Sector Público, donde constan la capacidad, la solvencia y la ausencia de prohibiciones de contratar. Ej.: en el abierto simplificado hay que estar inscrito antes de que termine el plazo de ofertas.", "recurso": "Recurso especial en materia de contratación: recurso potestativo y gratuito ante un tribunal administrativo específico, previo al contencioso, contra determinados actos de los contratos del art. 44. Ej.: contra el pliego de un contrato de servicios SARA.", "cicvida": "Coste del ciclo de vida: método de valoración que suma al precio de adquisición los costes de uso, mantenimiento y fin de vida del bien o servicio. Ej.: valorar una luminaria por su consumo a diez años, no solo por su precio.", "adjudic": "Adjudicación: acto administrativo motivado por el que el órgano de contratación selecciona la oferta ganadora. No perfecciona el contrato: eso lo hace la formalización (art. 36.1).", "formaliz": "Formalización: firma del documento administrativo en que se plasma el contrato. Es el momento en que el contrato nace (art. 36.1). Ej.: el 2 de junio, tras los quince días hábiles de espera.", "restringido": "Procedimiento restringido: procedimiento ordinario en dos fases —solicitud de participación y, tras la selección por solvencia, proposición—, en el que está prohibida toda negociación. Idóneo para servicios intelectuales complejos.", "solicitud": "Solicitud de participación: escrito con el que una empresa pide ser seleccionada en la primera fase del procedimiento restringido. No es todavía una oferta.", "prima": "Prima o compensación: cantidad que el PCAP puede prever para resarcir los gastos de presentar oferta en contratos de servicios que exijan determinados desarrollos (art. 160.2).", "propuesta": "Propuesta de adjudicación: acto de la mesa de contratación que señala al órgano de contratación qué oferta debería resultar adjudicataria. No crea derecho alguno a favor del propuesto (art. 157.6)."};
const ARTS=[{"n": 131, "t": "Procedimiento de adjudicación", "ubic": "Libro II ▸ Título I ▸ Capítulo I ▸ Sección 2.ª · Adjudicación · Normas generales", "idea": "Cinco procedimientos y un concurso de proyectos; los ordinarios son el abierto y el restringido.", "literal": "<p><b>1.</b> Los contratos que celebren las Administraciones Públicas se adjudicarán con arreglo a las normas de la presente sección.</p><p><b>2.</b> La adjudicación se realizará, ordinariamente utilizando una pluralidad de criterios de adjudicación basados en el principio de mejor relación calidad-precio, y utilizando el procedimiento abierto o el procedimiento restringido, salvo los contratos de concesión de servicios especiales del Anexo IV, que se adjudicarán mediante este último procedimiento. En los supuestos del artículo 168 podrá seguirse el procedimiento negociado sin publicidad; en los casos previstos en el artículo 167 podrá recurrirse al diálogo competitivo o a la licitación con negociación, y en los indicados en el artículo 177 podrá emplearse el procedimiento de asociación para la innovación.</p><p><b>3.</b> Los contratos menores podrán adjudicarse directamente a cualquier empresario con capacidad de obrar y que cuente con la habilitación profesional necesaria para realizar la prestación, cumpliendo con las normas establecidas en el artículo 118.</p><p><b>4.</b> En los contratos relativos a la prestación de asistencia sanitaria en supuestos de urgencia y con un valor estimado inferior a 30.000 euros, no serán de aplicación las disposiciones de esta Ley relativas a la preparación y adjudicación del contrato. Para proceder a la contratación en estos casos bastará con que, además de justificarse la urgencia, se determine el objeto de la prestación, se fije el precio a satisfacer por la asistencia y se designe por el órgano de contratación la empresa a la que corresponderá la ejecución.</p><p><b>5.</b> En los concursos de proyectos se seguirá el procedimiento regulado en la Subsección 7.ª de esta sección.</p>", "dis": "<ul>\n<li><b>Regla (131.1):</b> los contratos se adjudicarán con arreglo a las normas de esta sección, sin perjuicio de las especialidades de cada tipo contractual.</li>\n<li><b>Los procedimientos (131.2):</b> <b>abierto</b>, <b>restringido</b>, <b>negociado</b> con o sin publicidad, <b>diálogo competitivo</b> y <b>asociación para la innovación</b>.</li>\n<li><b>Los ordinarios:</b> «la adjudicación se realizará <b>ordinariamente</b> utilizando el procedimiento <b>abierto</b> o el <b>restringido</b>». Los demás solo en los supuestos previstos.</li>\n<li><b>Concurso de proyectos (131.3):</b> vía específica para la adquisición de <b>planos o proyectos</b>, principalmente en ordenación territorial, urbanismo, arquitectura, ingeniería y procesamiento de datos.</li>\n<li><b>Contratos menores (131.3, último párrafo):</b> podrán adjudicarse <b>directamente</b> a cualquier empresario con capacidad de obrar y con la habilitación profesional necesaria, con arreglo al art. 118.</li>\n</ul>", "llano": "<p>Hay cinco maneras de adjudicar un contrato. Dos son las normales —el abierto, donde se presenta quien quiere, y el restringido, donde primero se selecciona a quién se invita—. Las otras tres son excepcionales y solo se pueden usar si la ley lo permite en ese caso concreto.</p>\n<p>Y aparte, el contrato menor se adjudica <b>directamente</b>.</p>", "porque": "<p>Porque el procedimiento determina el grado de concurrencia, y la concurrencia determina el precio. Cuanto menos abierto es el procedimiento, menos competencia hay y más caro sale, de media, el contrato. Por eso la ley establece una <b>jerarquía</b>: lo ordinario es lo más abierto, y quien quiera apartarse debe acreditar que concurre un supuesto habilitante y <b>justificarlo en el expediente</b> (art. 116.4.a).</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> pedir presupuesto a quien quiera dártelo (abierto) frente a llamar solo a tres empresas de confianza (restringido) o negociar con una sola (negociado).</li>\n<li><b>Real:</b> un ayuntamiento licita el servicio de socorrismo por 178.000 € de valor estimado. Al ser servicios por debajo del umbral armonizado y con criterios mayoritariamente automáticos, elige <b>abierto simplificado</b> (art. 159) y lo justifica en el expediente.</li>\n<li><b>Caso límite:</b> el mismo servicio queda desierto. Si concurre el supuesto correspondiente, podría acudirse al <b>negociado sin publicidad</b>, pero la justificación de que se dan sus requisitos debe constar expresamente.</li>\n</ul>", "noej": "<ul>\n<li><b>No es un procedimiento de adjudicación</b> el <b>abierto simplificado</b>: es una <b>modalidad</b> del abierto (art. 159).</li>\n<li><b>No es un procedimiento</b> el contrato menor: es una forma de adjudicación directa.</li>\n<li><b>No cabe</b> usar el negociado por comodidad o urgencia sentida: hay que acreditar el supuesto legal.</li>\n</ul>", "conex": "<ul>\n<li><b>Arts. 156 a 159:</b> procedimiento abierto y abierto simplificado.</li>\n<li><b>Arts. 160 a 165:</b> procedimiento restringido.</li>\n<li><b>Arts. 166 a 171:</b> procedimiento negociado.</li>\n<li><b>Art. 116.4.a):</b> hay que justificar la elección del procedimiento en el expediente.</li>\n<li><b>Art. 118:</b> contrato menor.</li>\n</ul>", "trampas": "<ul>\n<li>Son <b>cinco</b> procedimientos, no seis: el concurso de proyectos no es un procedimiento de adjudicación de contratos, sino una vía para adquirir planos o proyectos.</li>\n<li><b>Ordinarios</b> = abierto y restringido. El negociado nunca es ordinario.</li>\n<li>El <b>abierto simplificado</b> es una modalidad del abierto, no un sexto procedimiento.</li>\n</ul>", "ancla": "<p><b>A-R-N-D-A:</b> <b>A</b>bierto · <b>R</b>estringido · <b>N</b>egociado · <b>D</b>iálogo competitivo · <b>A</b>sociación para la innovación.</p>\n<p>Y la jerarquía: los dos primeros son la puerta principal; los tres últimos, la puerta de servicio, que solo se abre con llave.</p>", "vis": "<svg viewBox=\"0 0 960 454\" role=\"img\" aria-label=\"Los procedimientos de adjudicación de los contratos del sector público\" style=\"width:100%;height:auto\"><defs><marker id=\"fl1\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr1\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe1\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw1\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"250\" y=\"8\" width=\"460\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"27.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">LOS PROCEDIMIENTOS DE ADJUDICACIÓN · ART. 131</text><rect x=\"20\" y=\"52\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"30\" y=\"66\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"120\" y=\"83\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--acc)\">ABIERTO</text><text x=\"224\" y=\"74\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Todo empresario interesado puede presentar proposición.</text><text x=\"224\" y=\"88\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Es uno de los dos procedimientos ORDINARIOS.</text><text x=\"930\" y=\"74\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">131.2</text><path d=\"M480 107 L 480 115\" stroke=\"var(--acc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl1)\"/><rect x=\"20\" y=\"116\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"30\" y=\"130\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"120\" y=\"147\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--acc)\">RESTRINGIDO</text><text x=\"224\" y=\"138\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Solo pueden presentar proposición los seleccionados por el órgano</text><text x=\"224\" y=\"152\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">tras su solicitud. También ORDINARIO.</text><text x=\"930\" y=\"138\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">131.2</text><path d=\"M480 171 L 480 179\" stroke=\"var(--acc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl1)\"/><rect x=\"20\" y=\"180\" width=\"920\" height=\"40\" rx=\"10\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"30\" y=\"187\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"120\" y=\"204\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--warn)\">NEGOCIADO</text><text x=\"224\" y=\"202\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Con o sin publicidad. Solo en los supuestos tasados de la ley.</text><text x=\"930\" y=\"202\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">131.2</text><path d=\"M480 221 L 480 229\" stroke=\"var(--warn)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl1)\"/><rect x=\"20\" y=\"230\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"30\" y=\"244\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"120\" y=\"261\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--warn)\">DIÁLOGO COMPETITIVO</text><text x=\"224\" y=\"252\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Para contratos especialmente complejos: se dialoga con los</text><text x=\"224\" y=\"266\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">candidatos antes de definir la solución.</text><text x=\"930\" y=\"252\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">131.2</text><path d=\"M480 285 L 480 293\" stroke=\"var(--warn)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl1)\"/><rect x=\"20\" y=\"294\" width=\"920\" height=\"40\" rx=\"10\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"30\" y=\"295\" width=\"180\" height=\"38\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"120\" y=\"311.5\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--warn)\">ASOCIACIÓN PARA</text><text x=\"120\" y=\"324.5\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--warn)\">LA INNOVACIÓN</text><text x=\"224\" y=\"316\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Cuando la solución no existe todavía en el mercado.</text><text x=\"930\" y=\"316\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">131.2</text><path d=\"M480 335 L 480 343\" stroke=\"var(--warn)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl1)\"/><rect x=\"20\" y=\"344\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--panel)\" stroke=\"var(--line)\"/><rect x=\"30\" y=\"358\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--line)\"/><text x=\"120\" y=\"375\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"currentColor\">CONCURSO DE PROYECTOS</text><text x=\"224\" y=\"366\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Vía específica para adquirir planos o proyectos, sobre todo en</text><text x=\"224\" y=\"380\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">arquitectura, urbanismo, ingeniería y proceso de datos.</text><text x=\"930\" y=\"366\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">131.3</text><rect x=\"20\" y=\"408\" width=\"920\" height=\"34\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"480\" y=\"428.328\" text-anchor=\"middle\" font-size=\"9.4\" fill=\"currentColor\">La adjudicación se realiza ORDINARIAMENTE por procedimiento abierto o restringido (art. 131.2). Los demás son excepcionales y requieren que concurra su supuesto habilitante.</text></svg>"}, {"n": 132, "t": "Principios de igualdad, transparencia y libre competencia", "ubic": "Libro II ▸ Título I ▸ Capítulo I ▸ Sección 2.ª · Adjudicación · Normas generales", "idea": "Trato igual, prohibición de amañar el procedimiento y deber de denunciar los indicios ante la CNMC.", "literal": "<p><b>1.</b> Los órganos de contratación darán a los licitadores y candidatos un tratamiento igualitario y no discriminatorio y ajustarán su actuación a los principios de transparencia y proporcionalidad. En ningún caso podrá limitarse la participación por la forma jurídica o el ánimo de lucro en la contratación, salvo en los contratos reservados para entidades recogidas en la disposición adicional cuarta.</p><p><b>2.</b> La contratación no será concebida con la intención de eludir los requisitos de publicidad o los relativos al procedimiento de adjudicación que corresponda, ni de restringir artificialmente la competencia, bien favoreciendo o perjudicando indebidamente a determinados empresarios.</p><p><b>3.</b> Los órganos de contratación velarán en todo el procedimiento de adjudicación por la salvaguarda de la libre competencia. Así, tanto ellos como la Junta Consultiva de Contratación Pública del Estado o, en su caso, los órganos consultivos o equivalentes en materia de contratación pública de las Comunidades Autónomas, y los órganos competentes para resolver el recurso especial a que se refiere el artículo 44 de esta Ley, notificarán a la Comisión Nacional de los Mercados y la Competencia o, en su caso, a las autoridades autonómicas de competencia, cualesquiera hechos de los que tengan conocimiento en el ejercicio de sus funciones que puedan constituir infracción a la legislación de defensa de la competencia. En particular, comunicarán cualquier indicio de acuerdo, decisión o recomendación colectiva, o práctica concertada o conscientemente paralela entre los licitadores, que tenga por objeto, produzca o pueda producir el efecto de impedir, restringir o falsear la competencia en el proceso de contratación.</p>", "dis": "<ul>\n<li><b>132.1 · trato:</b> tratamiento <b>igualitario y no discriminatorio</b>, con sujeción a <b>transparencia</b> y <b>proporcionalidad</b>. «En ningún caso podrá limitarse la participación por la <b>forma jurídica</b> o el <b>ánimo de lucro</b>», salvo los contratos reservados de la disposición adicional cuarta.</li>\n<li><b>132.2 · prohibición:</b> la contratación <b>no será concebida con la intención</b> de eludir los requisitos de publicidad o los del procedimiento, ni de <b>restringir artificialmente la competencia</b> favoreciendo o perjudicando indebidamente a determinados empresarios.</li>\n<li><b>132.3 · deber de comunicación:</b> los órganos de contratación, la <b>Junta Consultiva de Contratación Pública del Estado</b> —o los órganos consultivos autonómicos— y los <b>órganos competentes para resolver el recurso especial</b> notificarán a la <b>CNMC</b> o a la autoridad autonómica de competencia los hechos que puedan constituir infracción de la legislación de defensa de la competencia.</li>\n</ul>", "llano": "<p>Tres reglas. Todos los que se presentan reciben el mismo trato. No se puede diseñar el contrato para que gane uno concreto o para librarse de publicarlo. Y si alguien detecta indicios de pacto entre empresas, tiene que avisar a la autoridad de competencia.</p>", "porque": "<p>Porque los dos grandes fraudes de la contratación pública son simétricos: el que comete la <b>Administración</b> cuando diseña el procedimiento a medida, y el que cometen las <b>empresas</b> cuando pactan entre sí quién gana cada licitación. El art. 132 ataca ambos: el apartado 2 al primero, el apartado 3 al segundo.</p>\n<p>Y la prohibición de discriminar por <b>forma jurídica o ánimo de lucro</b> tiene un destinatario claro: impide excluir de antemano a cooperativas, entidades del tercer sector o, al revés, a empresas mercantiles.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> unas oposiciones cuyo temario coincidiera exactamente con la tesis doctoral de uno de los aspirantes. Formalmente todo correcto; materialmente, amañado.</li>\n<li><b>Real:</b> en la licitación del asfaltado de varias calles, tres empresas presentan ofertas con la misma estructura de costes y bajas escalonadas y simétricas. El órgano de contratación traslada los indicios a la <b>CNMC</b> conforme al art. 132.3 y al art. 150.1.</li>\n<li><b>Caso límite:</b> un pliego reserva un lote a Centros Especiales de Empleo. ¿Vulnera el 132.1? No: es una de las excepciones expresas, la de la <b>disposición adicional cuarta</b>.</li>\n</ul>", "noej": "<ul>\n<li><b>No vulnera la igualdad</b> exigir solvencia proporcionada al objeto: lo prohibido es la exigencia <b>desproporcionada</b> o ajena al objeto.</li>\n<li><b>No es discriminación por forma jurídica</b> exigir la habilitación profesional que la actividad requiera.</li>\n<li><b>No basta</b> con sospechar: el 132.3 obliga a <b>notificar</b> los hechos, y la valoración corresponde a la autoridad de competencia.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 1:</b> principios generales de la contratación pública.</li>\n<li><b>Art. 99.2:</b> prohibición de fraccionar para eludir la publicidad.</li>\n<li><b>Art. 126:</b> prohibición de prescripciones técnicas que favorezcan a un licitador.</li>\n<li><b>Art. 150.1:</b> traslado de indicios de conductas colusorias a la CNMC antes de adjudicar en contratos SARA.</li>\n<li><b>Art. 71:</b> prohibiciones de contratar, entre ellas las derivadas de infracciones de competencia.</li>\n</ul>", "trampas": "<ul>\n<li>«<b>En ningún caso</b> podrá limitarse la participación por la forma jurídica o el ánimo de lucro»: la excepción es <b>solo</b> la disposición adicional cuarta.</li>\n<li>El 132.2 castiga la <b>intención</b>, no el resultado. Aunque el contrato acabe bien adjudicado, si se concibió para eludir la ley, es ilícito.</li>\n<li>Quien notifica a la CNMC no es solo el órgano de contratación: también los <b>tribunales del recurso especial</b> y la Junta Consultiva.</li>\n</ul>", "ancla": "<p><b>«Mismo trato, sin trampas y con chivatazo obligatorio.»</b></p>", "vis": "<svg viewBox=\"0 0 960 267\" role=\"img\" aria-label=\"Principios de igualdad, transparencia y libre competencia en la adjudicación\" style=\"width:100%;height:auto\"><defs><marker id=\"fl2\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr2\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe2\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw2\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"250\" y=\"8\" width=\"460\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"27.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">IGUALDAD, TRANSPARENCIA Y LIBRE COMPETENCIA · ART. 132</text><rect x=\"20\" y=\"52\" width=\"219.5\" height=\"205\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"129.75\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--acc)\">TRATO</text><text x=\"129.75\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Tratamiento IGUALITARIO</text><text x=\"129.75\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">y NO DISCRIMINATORIO</text><text x=\"129.75\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">a licitadores y</text><text x=\"129.75\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">candidatos</text><text x=\"129.75\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"129.75\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Transparencia y</text><text x=\"129.75\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">proporcionalidad</text><text x=\"129.75\" y=\"180\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"129.75\" y=\"193\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 132.1</text><rect x=\"253.5\" y=\"52\" width=\"219.5\" height=\"205\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"363.25\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--ej)\">FORMA JURÍDICA</text><text x=\"363.25\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">NO puede limitarse la</text><text x=\"363.25\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">participación por la</text><text x=\"363.25\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">FORMA JURÍDICA ni por</text><text x=\"363.25\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">el ÁNIMO DE LUCRO</text><text x=\"363.25\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"363.25\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Salvo los contratos</text><text x=\"363.25\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">reservados de la</text><text x=\"363.25\" y=\"180\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">disposición adicional</text><text x=\"363.25\" y=\"193\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">cuarta</text><text x=\"363.25\" y=\"206\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"363.25\" y=\"219\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 132.1</text><rect x=\"487\" y=\"52\" width=\"219.5\" height=\"205\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"596.75\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--exc)\">PROHIBIDO</text><text x=\"596.75\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Concebir la contratación</text><text x=\"596.75\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">para ELUDIR la publicidad</text><text x=\"596.75\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">o el procedimiento</text><text x=\"596.75\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"596.75\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">o para RESTRINGIR</text><text x=\"596.75\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">ARTIFICIALMENTE la</text><text x=\"596.75\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">competencia, favoreciendo</text><text x=\"596.75\" y=\"180\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">o perjudicando a</text><text x=\"596.75\" y=\"193\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">determinados empresarios</text><text x=\"596.75\" y=\"206\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"596.75\" y=\"219\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 132.2</text><rect x=\"720.5\" y=\"52\" width=\"219.5\" height=\"205\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"830.25\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--warn)\">DEBER DE DENUNCIA</text><text x=\"830.25\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Órganos de contratación,</text><text x=\"830.25\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Junta Consultiva y</text><text x=\"830.25\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">tribunales del recurso</text><text x=\"830.25\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">especial NOTIFICAN a la</text><text x=\"830.25\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">CNMC o a la autoridad</text><text x=\"830.25\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">autonómica los hechos</text><text x=\"830.25\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">que puedan constituir</text><text x=\"830.25\" y=\"180\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">infracción de la defensa</text><text x=\"830.25\" y=\"193\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">de la competencia</text><text x=\"830.25\" y=\"206\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"830.25\" y=\"219\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 132.3</text></svg>"}, {"n": 135, "t": "Anuncio de licitación", "ubic": "Libro II ▸ Título I ▸ Capítulo I ▸ Sección 2.ª · Adjudicación · Normas generales", "idea": "Siempre en el perfil de contratante; en el BOE solo el Estado; en el DOUE si es armonizado.", "literal": "<p><b>1.</b> El anuncio de licitación para la adjudicación de contratos de las Administraciones Públicas, a excepción de los procedimientos negociados sin publicidad, se publicará en el perfil de contratante. En los contratos celebrados por la Administración General del Estado, o por las entidades vinculadas a la misma que gocen de la naturaleza de Administraciones Públicas, el anuncio de licitación se publicará además en el «Boletín Oficial del Estado». Cuando los contratos estén sujetos a regulación armonizada la licitación deberá publicarse, además, en el «Diario Oficial de la Unión Europea», debiendo los poderes adjudicadores poder demostrar la fecha de envío del anuncio de licitación. La Oficina de Publicaciones de la Unión Europea confirmará al poder adjudicador la recepción del anuncio y la publicación de la información enviada, indicando la fecha de dicha publicación. Esta confirmación constituirá prueba de la publicación.</p><p><b>2.</b> Cuando el órgano de contratación lo estime conveniente, los procedimientos para la adjudicación de contratos de obras, suministros, servicios, concesiones de obras y concesiones de servicios no sujetos a regulación armonizada podrán ser anunciados, además, en el «Diario Oficial de la Unión Europea».</p><p><b>3.</b> Los anuncios de licitación y los anuncios de información previa a que se refiere la disposición adicional trigésima sexta no se publicarán en los lugares indicados en el primer párrafo del apartado primero anterior antes de su publicación en el «Diario Oficial de la Unión Europea», en el caso en que deban ser publicados en dicho Diario Oficial, debiendo indicar la fecha de aquel envío, de la que los servicios dependientes del órgano de contratación dejarán prueba suficiente en el expediente, y no podrán contener indicaciones distintas a las incluidas en dicho anuncio. No obstante, en todo caso podrán publicarse si el órgano de contratación no ha recibido notificación de su publicación a las 48 horas de la confirmación de la recepción del anuncio enviado.</p><p><b>4.</b> Los anuncios de licitación de contratos contendrán la información recogida en el anexo III.</p><p><b>5.</b> En los contratos de concesión de servicios especiales del anexo IV la convocatoria de licitación se realizará en todo caso mediante el anuncio de información previa a que se refiere la Disposición adicional trigésima sexta.</p>", "dis": "<ul>\n<li><b>Regla (135.1):</b> el anuncio de licitación se publica en el <b>perfil de contratante</b>, <b>a excepción de los procedimientos negociados sin publicidad</b>.</li>\n<li><b>Estado:</b> en los contratos de la <b>Administración General del Estado</b> o de entidades vinculadas con naturaleza de Administraciones Públicas, <b>además</b> en el «Boletín Oficial del Estado».</li>\n<li><b>Si es <span class=\"t\" data-k=\"sara\">SARA</span>:</b> además, en el «<b>Diario Oficial de la Unión Europea</b>». Los poderes adjudicadores deben poder <b>demostrar la fecha de envío</b>, y la confirmación de la Oficina de Publicaciones <b>constituye prueba de la publicación</b>.</li>\n<li><b>Publicidad voluntaria (135.2):</b> los contratos <b>no</b> sujetos a regulación armonizada pueden anunciarse además en el DOUE si el órgano lo estima conveniente.</li>\n<li><b>Orden temporal (135.3):</b> los anuncios de licitación y de información previa <b>no se publicarán</b> a nivel nacional antes de su publicación en el DOUE, salvo el supuesto de falta de publicación por la Oficina de Publicaciones transcurridas 48 horas.</li>\n</ul>", "llano": "<p>El anuncio de que se abre una licitación va siempre al perfil de contratante. Si el contrato es del Estado, también al BOE. Y si es de los grandes —sujetos a regulación armonizada—, también al diario oficial europeo, que además manda: no se puede anunciar en España antes que en Europa.</p>", "porque": "<p>Porque la publicidad europea existe para que una empresa portuguesa o alemana pueda enterarse de una licitación española en las mismas condiciones que una de aquí. Si se publicara antes en el perfil, las empresas nacionales tendrían días de ventaja para preparar la oferta: el art. 135.3 lo impide.</p>\n<p>Y el valor probatorio de la confirmación de la Oficina de Publicaciones resuelve un problema práctico: acreditar desde cuándo corre el plazo.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> una oferta de empleo que se publica primero en el tablón interno y solo después en el portal público: quien está dentro se entera antes.</li>\n<li><b>Real:</b> una diputación licita un suministro SARA de 3.570.000 €. Envía el anuncio al DOUE el 4 de marzo; la Oficina de Publicaciones confirma la publicación el 6 de marzo; ese mismo día se publica en el perfil de contratante. El plazo de 35 días del art. 156.2 corre desde el <b>envío</b>, el 4 de marzo.</li>\n<li><b>Caso límite:</b> el mismo contrato, pero por debajo del umbral. Basta el perfil de contratante; el DOUE sería voluntario (art. 135.2).</li>\n</ul>", "noej": "<ul>\n<li><b>No se publica anuncio de licitación</b> en los procedimientos <b>negociados sin publicidad</b>: es precisamente lo que los define.</li>\n<li><b>No hay que publicar en el BOE</b> los contratos de una entidad local: esa obligación es de la Administración General del Estado y entidades vinculadas.</li>\n<li><b>No basta</b> la publicación nacional en un contrato SARA: sin DOUE, el procedimiento es impugnable.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 63:</b> el perfil de contratante donde se publica.</li>\n<li><b>Arts. 19 a 23:</b> qué contratos están sujetos a regulación armonizada.</li>\n<li><b>Art. 156.2:</b> el plazo de 35 días se cuenta desde el envío del anuncio al DOUE.</li>\n<li><b>Art. 134:</b> anuncio de información previa.</li>\n<li><b>Art. 159.2:</b> en el abierto simplificado basta la publicación en el perfil.</li>\n</ul>", "trampas": "<ul>\n<li>Perfil <b>siempre</b>; BOE <b>solo el Estado</b>; DOUE <b>solo si SARA</b> (o voluntariamente).</li>\n<li>Europa <b>primero</b>: no se puede publicar en España antes que en el DOUE.</li>\n<li>El plazo corre desde el <b>envío</b> del anuncio, no desde su publicación efectiva.</li>\n</ul>", "ancla": "<p>Tres círculos concéntricos: <b>perfil → BOE → DOUE</b>. Cuanto más grande el contrato, más lejos llega el anuncio.</p>", "vis": "<svg viewBox=\"0 0 960 418\" role=\"img\" aria-label=\"Lugares de publicación del anuncio de licitación\" style=\"width:100%;height:auto\"><defs><marker id=\"fl3\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr3\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe3\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw3\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"250\" y=\"8\" width=\"460\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"27.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">DÓNDE SE PUBLICA EL ANUNCIO DE LICITACIÓN · ART. 135</text><rect x=\"20\" y=\"52\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"30\" y=\"66\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"120\" y=\"83\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--acc)\">SIEMPRE</text><text x=\"224\" y=\"74\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">En el PERFIL DE CONTRATANTE. Excepción: los procedimientos</text><text x=\"224\" y=\"88\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">negociados SIN publicidad.</text><text x=\"930\" y=\"74\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">135.1</text><path d=\"M480 107 L 480 115\" stroke=\"var(--acc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl3)\"/><rect x=\"20\" y=\"116\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><rect x=\"30\" y=\"130\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--ej)\"/><text x=\"120\" y=\"147\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--ej)\">ADEMÁS, SI ES DEL ESTADO</text><text x=\"224\" y=\"138\" text-anchor=\"start\" font-s

4\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">DE LA CLASIFICACIÓN A LA ADJUDICACIÓN · ARTS. 150 Y 151</text><rect x=\"20\" y=\"52\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"30\" y=\"66\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"120\" y=\"83\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--acc)\">CLASIFICAR</text><text x=\"224\" y=\"74\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">La mesa o el órgano clasifica las ofertas por orden decreciente,</text><text x=\"224\" y=\"88\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">aplicando los criterios del pliego.</text><text x=\"930\" y=\"74\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">150.1</text><path d=\"M480 107 L 480 115\" stroke=\"var(--acc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl8)\"/><rect x=\"20\" y=\"116\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"30\" y=\"130\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"120\" y=\"147\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--warn)\">REQUERIR · 10 días hábiles</text><text x=\"224\" y=\"138\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Se requiere al licitador que ha presentado la MEJOR OFERTA para que</text><text x=\"224\" y=\"152\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">presente la documentación justificativa y constituya la GARANTÍA DEFINITIVA.</text><text x=\"930\" y=\"138\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">150.2</text><path d=\"M480 171 L 480 179\" stroke=\"var(--warn)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl8)\"/><rect x=\"20\" y=\"180\" width=\"920\" height=\"40\" rx=\"10\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><rect x=\"30\" y=\"187\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--exc)\"/><text x=\"120\" y=\"204\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--exc)\">SI NO CUMPLE</text><text x=\"224\" y=\"202\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Se entiende que RETIRA su oferta y se requiere al siguiente.</text><text x=\"930\" y=\"202\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">150.2</text><path d=\"M480 221 L 480 229\" stroke=\"var(--exc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl8)\"/><rect x=\"20\" y=\"230\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><rect x=\"30\" y=\"244\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--ej)\"/><text x=\"120\" y=\"261\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--ej)\">ADJUDICAR · 5 días hábiles</text><text x=\"224\" y=\"252\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Dentro de los cinco días hábiles siguientes a la recepción de la</text><text x=\"224\" y=\"266\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">documentación. La resolución debe ser MOTIVADA.</text><text x=\"930\" y=\"252\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">150.3 y 151.1</text><path d=\"M480 285 L 480 293\" stroke=\"var(--ej)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl8)\"/><rect x=\"20\" y=\"294\" width=\"920\" height=\"40\" rx=\"10\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><rect x=\"30\" y=\"301\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--ej)\"/><text x=\"120\" y=\"318\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--ej)\">PUBLICAR · 15 días</text><text x=\"224\" y=\"316\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">La adjudicación se publica en el perfil de contratante.</text><text x=\"930\" y=\"316\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">151.1</text><path d=\"M480 335 L 480 343\" stroke=\"var(--ej)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl8)\"/><rect x=\"20\" y=\"344\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"30\" y=\"352\" width=\"180\" height=\"38\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"120\" y=\"368.5\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--warn)\">NUEVA ADJUDICACIÓN</text><text x=\"120\" y=\"381.5\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--warn)\">10 días hábiles</text><text x=\"224\" y=\"366\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Si por resolución de un recurso especial hay que adjudicar a otro</text><text x=\"224\" y=\"380\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">licitador, se le conceden diez días hábiles para cumplimentar trámites.</text><text x=\"930\" y=\"366\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">150.4</text></svg>"}, {"n": 153, "t": "Formalización de los contratos", "ubic": "Libro II ▸ Título I ▸ Capítulo I ▸ Sección 2.ª ▸ Subsección 5.ª · Formalización", "idea": "Documento administrativo, quince días hábiles de espera si cabe recurso especial y cinco para firmar.", "literal": "<p><b>1.</b> Los contratos que celebren las Administraciones Públicas deberán formalizarse en documento administrativo que se ajuste con exactitud a las condiciones de la licitación, constituyendo dicho documento título suficiente para acceder a cualquier registro público. No obstante, el contratista podrá solicitar que el contrato se eleve a escritura pública, corriendo de su cargo los correspondientes gastos. En ningún caso se podrán incluir en el documento en que se formalice el contrato cláusulas que impliquen alteración de los términos de la adjudicación. En los contratos basados en un acuerdo marco o en los contratos específicos dentro de un sistema dinámico de adquisición, no resultará necesaria la formalización del contrato.</p><p><b>2.</b> En el caso de los contratos menores definidos en el artículo 118 se acreditará su existencia con los documentos a los que se refiere dicho artículo.</p><p><b>3.</b> Si el contrato es susceptible de recurso especial en materia de contratación conforme al artículo 44, la formalización no podrá efectuarse antes de que transcurran quince días hábiles desde que se remita la notificación de la adjudicación a los licitadores y candidatos. Las Comunidades Autónomas podrán incrementar este plazo, sin que exceda de un mes. Los servicios dependientes del órgano de contratación requerirán al adjudicatario para que formalice el contrato en plazo no superior a cinco días a contar desde el siguiente a aquel en que hubiera recibido el requerimiento, una vez transcurrido el plazo previsto en el párrafo anterior sin que se hubiera interpuesto recurso que lleve aparejada la suspensión de la formalización del contrato. De igual forma procederá cuando el órgano competente para la resolución del recurso hubiera levantado la suspensión. En los restantes casos, la formalización del contrato deberá efectuarse no más tarde de los quince días hábiles siguientes a aquel en que se realice la notificación de la adjudicación a los licitadores y candidatos en la forma prevista en el artículo 151.</p><p><b>4.</b> Cuando por causas imputables al adjudicatario no se hubiese formalizado el contrato dentro del plazo indicado se le exigirá el importe del 3 por ciento del presupuesto base de licitación, IVA excluido, en concepto de penalidad, que se hará efectivo en primer lugar contra la garantía definitiva, si se hubiera constituido, sin perjuicio de lo establecido en la letra b) del apartado 2 del artículo 71. En este caso, el contrato se adjudicará al siguiente licitador por el orden en que hubieran quedado clasificadas las ofertas, previa presentación de la documentación establecida en el apartado 2 del artículo 150 de la presente Ley, resultando de aplicación los plazos establecidos en el apartado anterior.</p><p><b>5.</b> Si las causas de la no formalización fueren imputables a la Administración, se indemnizará al contratista de los daños y perjuicios que la demora le pudiera ocasionar.</p><p><b>6.</b> Sin perjuicio de lo establecido en los artículos 36.1 y 131.3 para los contratos menores, y en el artículo 36.3 para los contratos basados en un acuerdo marco y los contratos específicos en el marco de un sistema dinámico de adquisición, y salvo que la tramitación del expediente de contratación sea por emergencia de acuerdo con lo previsto en el artículo 120, no podrá procederse a la ejecución del contrato con carácter previo a su formalización.</p>", "dis": "<ul>\n<li><b>Forma de la <span class=\"t\" data-k=\"formaliz\">formalización</span> (153.1):</b> los contratos de las Administraciones Públicas se formalizan en <b>documento administrativo</b> que se ajuste con exactitud a las condiciones de la licitación, y ese documento es <b>título suficiente para acceder a cualquier registro público</b>. El contratista puede pedir su elevación a <b>escritura pública a su costa</b>. «En ningún caso se podrán incluir en el documento cláusulas que impliquen <b>alteración de los términos de la adjudicación</b>». En los contratos basados en acuerdo marco o específicos de un sistema dinámico <b>no es necesaria</b> la formalización.</li>\n<li><b>Contratos menores (153.2):</b> su existencia se acredita con los documentos del art. 118.</li>\n<li><b><span class=\"t\" data-k=\"standstill\">Plazo de espera</span> (153.3):</b> si el contrato es susceptible de <span class=\"t\" data-k=\"recurso\">recurso especial</span> conforme al art. 44, la formalización <b>no podrá efectuarse antes de que transcurran quince días hábiles</b> desde que se <b>remita la notificación de la adjudicación</b> a licitadores y candidatos. Las comunidades autónomas pueden <b>incrementar</b> ese plazo <b>sin que exceda de un mes</b>.</li>\n<li><b>Requerimiento (153.3):</b> transcurrido el plazo, los servicios dependientes del órgano <b>requerirán al adjudicatario</b> para que formalice en plazo <b>no superior a cinco días</b> desde el siguiente a aquel en que hubiera recibido el requerimiento.</li>\n<li><b>Si no cabe recurso especial:</b> la formalización debe efectuarse en plazo <b>no superior a quince días hábiles</b> siguientes a aquel en que se realice la notificación de la adjudicación.</li>\n<li><b>Penalidad (153.4):</b> si por causas imputables al adjudicatario no se formaliza en plazo, se le exige el <b>3 % del presupuesto base de licitación, IVA excluido</b>, en concepto de penalidad, que se hará efectiva en primer lugar contra la garantía definitiva.</li>\n</ul>", "llano": "<p>Firmar el contrato tiene su liturgia. Si el contrato es de los que se pueden recurrir por la vía especial, hay que esperar <b>quince días hábiles</b> desde que se avisó de la adjudicación: ese silencio sirve para que quien quiera recurrir pueda hacerlo antes de que el contrato exista. Pasado ese plazo, se llama al adjudicatario y tiene <b>cinco días</b> para firmar.</p>\n<p>Si no firma por su culpa, paga el 3 % del presupuesto base sin IVA.</p>", "porque": "<p>Porque un recurso contra la adjudicación sirve de poco si el contrato ya está firmado y en ejecución: habría que anular un contrato vivo, con indemnizaciones y servicios interrumpidos. El <b>plazo de espera</b> —el <i>standstill</i> de las directivas europeas— convierte el recurso en un remedio <b>preventivo</b> en vez de reparador.</p>\n<p>Y por eso el art. 36.1 hace nacer el contrato con la formalización: para que durante esos quince días hábiles todavía no haya contrato que anular.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> el plazo de desistimiento de una compra online. Existe para que puedas echarte atrás antes de que la operación sea definitiva.</li>\n<li><b>Real:</b> un contrato de servicios SARA se adjudica el lunes 4 de mayo y la notificación se remite ese mismo día. Los quince días hábiles vencen el <b>25 de mayo</b>. El 26 se requiere al adjudicatario, que dispone de cinco días —hasta el <b>2 de junio</b>— para formalizar.</li>\n<li><b>Caso límite:</b> el adjudicatario no firma alegando que ha subido el coste de los materiales. Es causa imputable a él: penalidad del <b>3 % del presupuesto base sin IVA</b>, ejecutada primero contra la garantía definitiva.</li>\n</ul>", "noej": "<ul>\n<li><b>No hay plazo de espera</b> si el contrato <b>no</b> es susceptible de recurso especial: entonces se formaliza en no más de quince días hábiles desde la notificación.</li>\n<li><b>No es necesaria la formalización</b> en los contratos basados en un acuerdo marco ni en los específicos de un sistema dinámico.</li>\n<li><b>No son diez días</b> el plazo de espera. Son <b>quince días hábiles</b>. Los diez días hábiles son los del art. 150.2 y 150.4.</li>\n<li><b>No puede</b> el documento de formalización alterar los términos de la adjudicación.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 36.1:</b> el contrato se perfecciona con esta formalización.</li>\n<li><b>Art. 44 y 50:</b> recurso especial y plazo de quince días hábiles para interponerlo, que corre en paralelo.</li>\n<li><b>Art. 151.1:</b> la notificación de la adjudicación, desde cuya remisión se cuenta el plazo.</li>\n<li><b>Art. 154:</b> anuncio de formalización.</li>\n<li><b>Art. 35:</b> contenido mínimo del documento contractual.</li>\n<li><b>Art. 118:</b> los contratos menores, exentos de formalización.</li>\n</ul>", "trampas": "<ul>\n<li><b>15 días hábiles</b> de espera, no 10. Es el error más caro del bloque.</li>\n<li>Los <b>cinco días</b> del requerimiento <b>no</b> llevan el adjetivo «hábiles» en la ley.</li>\n<li>El cómputo arranca de la <b>remisión</b> de la notificación, no de su recepción.</li>\n<li>La penalidad es sobre el <b>presupuesto base de licitación</b>, IVA excluido, no sobre el precio de adjudicación.</li>\n</ul>", "ancla": "<p><b>«Quince para esperar, cinco para firmar, tres por ciento si te rajas.»</b></p>\n<p>Imagen: el contrato está en la mesa con la pluma al lado, pero hay un guardia que no deja firmar hasta que pasen quince días hábiles. Ese guardia es el recurso especial.</p>", "vis": "<svg viewBox=\"0 0 960 496\" role=\"img\" aria-label=\"Plazos y régimen de la formalización de los contratos\" style=\"width:100%;height:auto\"><defs><marker id=\"fl9\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr9\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe9\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw9\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"250\" y=\"8\" width=\"460\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"27.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">LA FORMALIZACIÓN · ART. 153</text><rect x=\"20\" y=\"52\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"30\" y=\"66\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"120\" y=\"83\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--acc)\">REGLA</text><text x=\"224\" y=\"74\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Los contratos se formalizan en DOCUMENTO ADMINISTRATIVO,</text><text x=\"224\" y=\"88\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">salvo los menores. El contratista puede pedir escritura pública a su costa.</text><text x=\"930\" y=\"74\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">153.1 y 153.2</text><path d=\"M480 107 L 480 115\" stroke=\"var(--acc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl9)\"/><rect x=\"20\" y=\"116\" width=\"920\" height=\"68\" rx=\"10\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><rect x=\"30\" y=\"137\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--exc)\"/><text x=\"120\" y=\"154\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--exc)\">SI CABE RECURSO ESPECIAL</text><text x=\"224\" y=\"138\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">NO puede formalizarse antes de que transcurran QUINCE DÍAS HÁBILES</text><text x=\"224\" y=\"152\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">desde que se remita la notificación de la adjudicación a licitadores y candidatos.</text><text x=\"224\" y=\"166\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Las comunidades autónomas pueden ampliarlo, sin exceder de un mes.</text><text x=\"930\" y=\"138\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">153.3</text><path d=\"M480 185 L 480 193\" stroke=\"var(--exc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl9)\"/><rect x=\"20\" y=\"194\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"30\" y=\"208\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"120\" y=\"225\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--warn)\">DESPUÉS</text><text x=\"224\" y=\"216\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">El órgano requiere al adjudicatario para formalizar en plazo</text><text x=\"224\" y=\"230\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">NO SUPERIOR A CINCO DÍAS desde el siguiente a la notificación del requerimiento.</text><text x=\"930\" y=\"216\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">153.3</text><path d=\"M480 249 L 480 257\" stroke=\"var(--warn)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl9)\"/><rect x=\"20\" y=\"258\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"30\" y=\"272\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"120\" y=\"289\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--acc)\">SI NO CABE RECURSO</text><text x=\"224\" y=\"280\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">La formalización debe efectuarse en plazo NO SUPERIOR A QUINCE DÍAS</text><text x=\"224\" y=\"294\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">HÁBILES siguientes a aquel en que se notifique la adjudicación.</text><text x=\"930\" y=\"280\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">153.3</text><path d=\"M480 313 L 480 321\" stroke=\"var(--acc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl9)\"/><rect x=\"20\" y=\"322\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><rect x=\"30\" y=\"336\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--exc)\"/><text x=\"120\" y=\"353\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--exc)\">SI NO SE FORMALIZA</text><text x=\"224\" y=\"344\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Por causa imputable al adjudicatario: se le exige el 3 % del presupuesto</text><text x=\"224\" y=\"358\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">base de licitación, IVA excluido, en concepto de penalidad.</text><text x=\"930\" y=\"344\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">153.4</text><path d=\"M480 377 L 480 385\" stroke=\"var(--exc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl9)\"/><rect x=\"20\" y=\"386\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><rect x=\"30\" y=\"400\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--ej)\"/><text x=\"120\" y=\"417\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--ej)\">PUBLICIDAD</text><text x=\"224\" y=\"408\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">La formalización se publica en el perfil de contratante junto con el</text><text x=\"224\" y=\"422\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">contrato, en plazo no superior a quince días tras el perfeccionamiento.</text><text x=\"930\" y=\"408\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">154.1</text><rect x=\"20\" y=\"450\" width=\"920\" height=\"34\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"480\" y=\"470.328\" text-anchor=\"middle\" font-size=\"10.4\" fill=\"currentColor\">No confundir: 15 días HÁBILES de espera (153.3) · 5 días para formalizar tras el requerimiento · 15 días para publicar la adjudicación (151.1).</text></svg>"}, {"n": 156, "t": "Delimitación, plazos para la presentación de proposiciones y plazo de publicación del anuncio", "ubic": "Libro II ▸ Título I ▸ Capítulo I ▸ Sección 2.ª ▸ Subsección 2.ª · Procedimiento abierto", "idea": "En el abierto se presenta quien quiera y no se negocia nada: 35 días si es armonizado, 30 en concesiones.", "literal": "<p><b>1.</b> En el procedimiento abierto todo empresario interesado podrá presentar una proposición, quedando excluida toda negociación de los términos del contrato con los licitadores.</p><p><b>2.</b> En procedimientos abiertos de adjudicación de contratos sujetos a regulación armonizada, el plazo de presentación de proposiciones no será inferior a treinta y cinco días, para los contratos de obras, suministros y servicios, y a treinta días para las concesiones de obras y servicios, contados desde la fecha de envío del anuncio de licitación a la Oficina de Publicaciones de la Unión Europea.</p><p><b>3.</b> En los contratos de obras, suministros y servicios, el plazo general previsto en el apartado anterior podrá reducirse en los siguientes casos:</p><p style=\"margin-left:1.1rem\">a) Si el órgano de contratación hubiese enviado un anuncio de información previa, el plazo general de presentación de proposiciones podrá reducirse a quince días. Esta reducción del plazo solo será admisible cuando el anuncio voluntario de información previa se hubiese enviado para su publicación con una antelación máxima de doce meses y mínima de treinta y cinco días antes de la fecha de envío del anuncio de licitación, siempre que en él se hubiese incluido, de estar disponible, toda la información exigida para este.</p><p style=\"margin-left:1.1rem\">b) Cuando el plazo general de presentación de proposiciones sea impracticable por tratarse de una situación de urgencia, en los términos descritos en el artículo 119, el órgano de contratación podrá fijar otro plazo que no será inferior a quince días contados desde la fecha del envío del anuncio de licitación.</p><p style=\"margin-left:1.1rem\">c) Si el órgano de contratación aceptara la presentación de ofertas por medios electrónicos, podrá reducirse el plazo general de presentación de proposiciones en cinco días.</p><p><b>4.</b> En las concesiones de obras y de servicios solo se podrá reducir el plazo general cuando se dé la circunstancia establecida en la letra c) del apartado anterior.</p><p><b>5.</b> Sin perjuicio de lo establecido en el apartado 3 del artículo 135 respecto de la obligación de publicar previamente en el «Diario Oficial de la Unión Europea», en los procedimientos abiertos la publicación del anuncio de licitación en el perfil de contratante deberá hacerse, en todo caso, con una antelación mínima equivalente al plazo fijado para la presentación de las proposiciones en el apartado siguiente.</p><p><b>6.</b> En los contratos de las Administraciones Públicas que no estén sujetos a regulación armonizada, el plazo de presentación de proposiciones no será inferior a quince días, contados desde el día siguiente al de la publicación del anuncio de licitación del contrato en el perfil de contratante. En los contratos de obras y de concesión de obras y concesión de servicios, el plazo será, como mínimo, de veintiséis días.</p>", "dis": "<ul>\n<li><b>Delimitación (156.1):</b> en el procedimiento abierto <b>todo empresario interesado podrá presentar una proposición</b>, quedando <b>excluida toda negociación</b> de los términos del contrato con los licitadores.</li>\n<li><b>Plazos en contratos SARA (156.2):</b> no inferior a <b>treinta y cinco días</b> en obras, suministros y servicios, y a <b>treinta días</b> en concesiones de obras y de servicios, contados <b>desde la fecha de envío</b> del anuncio de licitación a la Oficina de Publicaciones de la Unión Europea.</li>\n<li><b>Reducciones (156.3):</b>\n <ul><li><b>a)</b> a <b>quince días</b> si se envió <b>anuncio de información previa</b> con antelación máxima de doce meses y mínima de treinta y cinco días respecto del envío del anuncio de licitación, con toda la información exigible;</li>\n <li><b>b)</b> por <b>urgencia</b>, cuando el plazo general sea impracticable;</li>\n <li><b>c)</b> a <b>quince días</b> cuando se acepte la presentación de ofertas por medios electrónicos, en los términos de la ley.</li></ul></li>\n<li><b>Contratos no armonizados:</b> el plazo se fija atendiendo a la complejidad del contrato, con los mínimos que la propia ley establece.</li>\n</ul>", "llano": "<p>El abierto es lo que su nombre dice: puede presentarse cualquiera, y con nadie se negocia nada. Lo único que se discute es el tiempo que se da para preparar la oferta: si el contrato es de los grandes, un mínimo de 35 días desde que el anuncio sale hacia Europa; 30 si es una concesión.</p>\n<p>Ese plazo puede acortarse si se avisó antes con un anuncio previo, si hay urgencia o si se aceptan ofertas electrónicas.</p>", "porque": "<p>Porque preparar una oferta cuesta dinero y tiempo: hay que pedir presupuestos a proveedores, calcular costes laborales y redactar una memoria técnica. Un plazo corto <b>favorece a quien ya lo sabía</b>: el contratista actual o el que fue consultado. Los plazos mínimos son, por eso, una garantía de concurrencia real, no un formalismo.</p>\n<p>Y la exclusión de toda negociación es lo que distingue el abierto del negociado: aquí la oferta es la que es, y no se retoca.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> un anuncio de alquiler con visitas abiertas a todo el mundo frente a enseñar el piso solo a tres conocidos.</li>\n<li><b>Real:</b> el suministro SARA de 3.570.000 € envía el anuncio al DOUE el 4 de marzo. Al no haber anuncio de información previa, el plazo mínimo es de <b>35 días</b>: las proposiciones pueden presentarse hasta el <b>8 de abril</b>.</li>\n<li><b>Caso límite:</b> si la diputación hubiera enviado un anuncio de información previa el 1 de octubre anterior —dentro de los doce meses y con más de 35 días de antelación—, el plazo podría reducirse a <b>quince días</b>.</li>\n</ul>", "noej": "<ul>\n<li><b>No es un procedimiento abierto</b> aquel en el que se negocian los términos con los licitadores: eso es el negociado.</li>\n<li><b>No se cuentan</b> los 35 días desde la publicación en el perfil, sino desde el <b>envío</b> del anuncio al DOUE.</li>\n<li><b>No cabe</b> reducir a quince días por anuncio previo si este se envió con menos de 35 días de antelación.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 131.2:</b> el abierto como procedimiento ordinario.</li>\n<li><b>Art. 135:</b> publicación del anuncio de licitación.</li>\n<li><b>Art. 134:</b> anuncio de información previa.</li>\n<li><b>Art. 158:</b> plazos para adjudicar en el abierto.</li>\n<li><b>Art. 159:</b> abierto simplificado, con plazos propios.</li>\n<li><b>Art. 119:</b> tramitación urgente.</li>\n</ul>", "trampas": "<ul>\n<li><b>35 días</b> en obras, suministros y servicios; <b>30</b> en concesiones. Se invierten a menudo.</li>\n<li>La reducción por anuncio previo lleva a <b>quince días</b>, no a treinta.</li>\n<li>«Queda <b>excluida toda negociación</b>»: es la nota que define el abierto.</li>\n</ul>", "ancla": "<p><b>«Abierto = entra quien quiera y no se regatea.»</b></p>\n<p>Números: <b>35 · 30 · 15</b>. Treinta y cinco lo normal, treinta las concesiones, quince si avisaste antes.</p>", "vis": "<svg viewBox=\"0 0 960 362\" role=\"img\" aria-label=\"Plazos de presentación de proposiciones en el procedimiento abierto\" style=\"width:100%;height:auto\"><defs><marker id=\"fl10\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr10\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe10\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw10\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"250\" y=\"8\" width=\"460\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"27.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">EL PROCEDIMIENTO ABIERTO · PLAZOS DEL ART. 156</text><rect x=\"20\" y=\"52\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"30\" y=\"66\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"120\" y=\"83\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--acc)\">QUÉ ES</text><text x=\"224\" y=\"74\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Todo empresario interesado puede presentar proposición, quedando</text><text x=\"224\" y=\"88\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">EXCLUIDA toda negociación de los términos del contrato con los licitadores.</text><text x=\"930\" y=\"74\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">156.1</text><path d=\"M480 107 L 480 115\" stroke=\"var(--acc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl10)\"/><rect x=\"20\" y=\"116\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"30\" y=\"124\" width=\"180\" height=\"38\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"120\" y=\"140.5\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--warn)\">SARA · OBRAS, SUMINISTROS</text><text x=\"120\" y=\"153.5\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--warn)\">Y SERVICIOS</text><text x=\"224\" y=\"138\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Plazo NO inferior a TREINTA Y CINCO DÍAS desde el envío del anuncio</text><text x=\"224\" y=\"152\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">a la Oficina de Publicaciones de la Unión Europea.</text><text x=\"930\" y=\"138\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">156.2</text><path d=\"M480 171 L 480 179\" stroke=\"var(--warn)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl10)\"/><rect x=\"20\" y=\"180\" width=\"920\" height=\"40\" rx=\"10\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"30\" y=\"187\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"120\" y=\"204\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--warn)\">SARA · CONCESIONES</text><text x=\"224\" y=\"202\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Plazo NO inferior a TREINTA DÍAS.</text><text x=\"930\" y=\"202\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">156.2</text><path d=\"M480 221 L 480 229\" stroke=\"var(--warn)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl10)\"/><rect x=\"20\" y=\"230\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><rect x=\"30\" y=\"238\" width=\"180\" height=\"38\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--ej)\"/><text x=\"120\" y=\"254.5\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--ej)\">REDUCCIÓN POR ANUNCIO</text><text x=\"120\" y=\"267.5\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--ej)\">DE INFORMACIÓN PREVIA</text><text x=\"224\" y=\"252\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Puede reducirse a QUINCE DÍAS, si el anuncio previo se envió con una</text><text x=\"224\" y=\"266\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">antelación máxima de doce meses y mínima de treinta y cinco días.</text><text x=\"930\" y=\"252\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">156.3.a</text><path d=\"M480 285 L 480 293\" stroke=\"var(--ej)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl10)\"/><rect x=\"20\" y=\"294\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><rect x=\"30\" y=\"308\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--ej)\"/><text x=\"120\" y=\"325\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--ej)\">REDUCCIÓN POR URGENCIA</text><text x=\"224\" y=\"316\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Cuando el plazo general sea impracticable por una situación de urgencia</text><text x=\"224\" y=\"330\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">en los términos de la ley.</text><text x=\"930\" y=\"316\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">156.3.b</text></svg>"}, {"n": 157, "t": "Examen de las proposiciones y propuesta de adjudicación", "ubic": "Libro II ▸ Título I ▸ Capítulo I ▸ Sección 2.ª ▸ Subsección 2.ª · Procedimiento abierto", "idea": "La mesa califica, abre en veinte días, valora con informes y propone; la propuesta no da derecho a nada.", "literal": "<p><b>1.</b> La Mesa de contratación calificará la documentación a que se refiere el artículo 140, que deberá presentarse por los licitadores en sobre o archivo electrónico distinto al que contenga la proposición. Posteriormente, el mismo órgano procederá a la apertura y examen de las proposiciones, formulando la correspondiente propuesta de adjudicación al órgano de contratación, una vez ponderados los criterios que deban aplicarse para efectuar la selección del adjudicatario.</p><p><b>2.</b> Cuando, de conformidad con lo establecido en el artículo 145 se utilicen una pluralidad de criterios de adjudicación, los licitadores deberán presentar la proposición en dos sobres o archivos electrónicos: uno con la documentación que deba ser valorada conforme a los criterios cuya ponderación depende de un juicio de valor, y el otro con la documentación que deba ser valorada conforme a criterios cuantificables mediante la mera aplicación de fórmulas.</p><p><b>3.</b> En todo caso la apertura de las proposiciones deberá efectuarse en el plazo máximo de veinte días contado desde la fecha de finalización del plazo para presentar las mismas. Si la proposición se contuviera en más de un sobre o archivo electrónico, de tal forma que estos deban abrirse en varios actos independientes, el plazo anterior se entenderá cumplido cuando se haya abierto, dentro del mismo, el primero de los sobres o archivos electrónicos que componen la proposición.</p><p><b>4.</b> En todo caso, la apertura de la oferta económica se realizará en acto público, salvo cuando se prevea que en la licitación puedan emplearse medios electrónicos.</p><p><b>5.</b> Cuando para la valoración de las proposiciones hayan de tenerse en cuenta criterios distintos al del precio, el órgano competente para ello podrá solicitar, antes de formular su propuesta, cuantos informes técnicos considere precisos. Igualmente, podrán solicitarse estos informes cuando sea necesario verificar que las ofertas cumplen con las especificaciones técnicas del pliego. También se podrán requerir informes a las organizaciones sociales de usuarios destinatarios de la prestación, a las organizaciones representativas del ámbito de actividad al que corresponda el objeto del contrato, a las organizaciones sindicales, a las organizaciones que defiendan la igualdad de género y a otras organizaciones para la verificación de las consideraciones sociales y ambientales.</p><p><b>6.</b> La propuesta de adjudicación no crea derecho alguno en favor del licitador propuesto frente a la Administración. No obstante, cuando el órgano de contratación no adjudique el contrato de acuerdo con la propuesta formulada deberá motivar su decisión.</p>", "dis": "<ul>\n<li><b>Calificación (157.1):</b> la <span class=\"t\" data-k=\"mesa\">Mesa de contratación</span> califica la documentación del art. 140, que debe presentarse en <b>sobre o archivo electrónico distinto</b> del que contiene la proposición. Después abre y examina las proposiciones y formula la <span class=\"t\" data-k=\"propuesta\">propuesta de adjudicación</span> al órgano de contratación, ponderados los criterios.</li>\n<li><b>Dos sobres (157.2):</b> con <b>pluralidad de criterios</b> (art. 145), los licitadores presentan la proposición en <b>dos sobres o archivos</b>: uno con lo valorable por <b>juicio de valor</b> y otro con lo valorable por <b>fórmulas</b>.</li>\n<li><b>Plazo (157.3):</b> la apertura de las proposiciones debe efectuarse en el plazo máximo de <b>veinte días</b> desde la finalización del plazo para presentarlas. Con varios sobres, el plazo se entiende cumplido cuando se haya abierto <b>el primero</b> de ellos.</li>\n<li><b>Publicidad (157.4):</b> la apertura de la <b>oferta económica</b> se realiza en <b>acto público</b>, salvo cuando se prevea que puedan emplearse <b>medios electrónicos</b>.</li>\n<li><b>Informes (157.5):</b> pueden solicitarse cuantos informes técnicos se consideren precisos, y también informes a <b>organizaciones sociales de usuarios</b>, <b>representativas del sector</b>, <b>sindicales</b>, <b>de igualdad de género</b> y otras, para verificar las consideraciones sociales y ambientales.</li>\n<li><b>Efecto (157.6):</b> «La propuesta de adjudicación <b>no crea derecho alguno</b> en favor del licitador propuesto frente a la Administración». Si el órgano no adjudica conforme a ella, <b>deberá motivar su decisión</b>.</li>\n</ul>", "llano": "<p>La mesa de contratación abre primero el sobre de los papeles —capacidad, solvencia, declaraciones— y solo después las ofertas. Tiene veinte días para abrirlas desde que se cerró el plazo. La oferta económica se abre en acto público, salvo licitación electrónica.</p>\n<p>Y un detalle que decide preguntas: la mesa <b>propone</b>, no adjudica. Quien recibe la propuesta no tiene derecho a nada; si el órgano se aparta de ella, solo tiene que motivarlo.</p>", "porque": "<p>Porque separar la documentación administrativa de la oferta —y el juicio de valor del precio— es lo que impide manipular la valoración. Si se supiera quién oferta qué precio antes de puntuar la calidad, la nota subjetiva podría ajustarse al resultado deseado.</p>\n<p>Y el 157.6 protege a la Administración de una lectura excesiva de la mesa: la mesa es un órgano de <b>asistencia</b>. Si su propuesta vinculara, se habría desplazado de hecho la competencia del órgano de contratación.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> un tribunal de oposición propone al aspirante con mejor nota, pero quien nombra es el órgano competente, y si no nombra a ese, tiene que explicar por qué.</li>\n<li><b>Real:</b> en el servicio de socorrismo, el plazo de presentación termina el 18 de febrero. La mesa dispone hasta el <b>10 de marzo</b> —veinte días— para abrir las proposiciones. Califica el sobre A el 20 de febrero, abre el sobre B —juicio de valor— el 25 y el sobre C —precio— en acto público el 3 de marzo.</li>\n<li><b>Caso límite:</b> la mesa propone a la empresa mejor clasificada, pero el órgano de contratación advierte que su oferta incumple una prescripción técnica del PPT. Puede <b>apartarse</b> de la propuesta, y basta con que lo <b>motive</b> (art. 157.6).</li>\n</ul>", "noej": "<ul>\n<li><b>No adjudica la mesa:</b> propone. Adjudica el órgano de contratación (arts. 150 y 151).</li>\n<li><b>No crea derecho</b> la propuesta de adjudicación en favor del propuesto.</li>\n<li><b>No es siempre público</b> el acto de apertura: no lo es cuando se prevea el empleo de medios electrónicos.</li>\n<li><b>No se abren a la vez</b> los sobres cuando hay pluralidad de criterios: primero el de juicio de valor.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 140:</b> documentación que se califica en el primer sobre.</li>\n<li><b>Art. 145 y 146:</b> criterios de adjudicación y orden de valoración.</li>\n<li><b>Art. 150:</b> clasificación de las ofertas y requerimiento.</li>\n<li><b>Art. 149:</b> ofertas anormalmente bajas.</li>\n<li><b>Art. 326:</b> composición y funciones de la mesa de contratación.</li>\n<li><b>Art. 158:</b> plazos máximos para adjudicar.</li>\n</ul>", "trampas": "<ul>\n<li><b>Veinte días</b> para abrir las proposiciones desde que termina el plazo de presentación. Se confunde con los quince del art. 158.1 para adjudicar.</li>\n<li>La propuesta <b>no crea derecho alguno</b>: literal del 157.6.</li>\n<li>Acto público <b>salvo</b> medios electrónicos.</li>\n<li>Los informes pueden pedirse también a <b>sindicatos y organizaciones sociales</b>: una novedad que se pregunta.</li>\n</ul>", "ancla": "<p><b>«La mesa propone, el órgano dispone, y si no dispone lo propuesto, lo explica.»</b></p>\n<p>Cifra: <b>20 días</b> para abrir.</p>", "vis": "<svg viewBox=\"0 0 960 454\" role=\"img\" aria-label=\"Calificación, apertura, informes y propuesta de adjudicación en el procedimiento abierto\" style=\"width:100%;height:auto\"><defs><marker id=\"fl11\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr11\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe11\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw11\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"250\" y=\"8\" width=\"460\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"27.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">EXAMEN DE LAS PROPOSICIONES · ART. 157</text><rect x=\"20\" y=\"52\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"30\" y=\"66\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"120\" y=\"83\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--acc)\">1 · CALIFICAR</text><text x=\"224\" y=\"74\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">La Mesa de contratación califica la documentación del art. 140, que se presenta</text><text x=\"224\" y=\"88\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">en sobre o archivo electrónico DISTINTO del que contiene la proposición.</text><text x=\"930\" y=\"74\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">157.1</text><path d=\"M480 107 L 480 115\" stroke=\"var(--acc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl11)\"/><rect x=\"20\" y=\"116\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"30\" y=\"130\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"120\" y=\"147\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--acc)\">2 · DOS SOBRES</text><text x=\"224\" y=\"138\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Con pluralidad de criterios: un sobre con lo valorable por JUICIO DE VALOR</text><text x=\"224\" y=\"152\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">y otro con lo valorable por FÓRMULAS.</text><text x=\"930\" y=\"138\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">157.2</text><path d=\"M480 171 L 480 179\" stroke=\"var(--acc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl11)\"/><rect x=\"20\" y=\"180\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"30\" y=\"194\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"120\" y=\"211\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--warn)\">3 · ABRIR · 20 DÍAS</text><text x=\"224\" y=\"202\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">La apertura de las proposiciones debe efectuarse en el plazo máximo de</text><text x=\"224\" y=\"216\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">VEINTE DÍAS desde que finalizó el plazo para presentarlas.</text><text x=\"930\" y=\"202\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">157.3</text><path d=\"M480 235 L 480 243\" stroke=\"var(--warn)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl11)\"/><rect x=\"20\" y=\"244\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><rect x=\"30\" y=\"258\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--ej)\"/><text x=\"120\" y=\"275\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--ej)\">4 · ACTO PÚBLICO</text><text x=\"224\" y=\"266\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">La apertura de la OFERTA ECONÓMICA se realiza en acto público,</text><text x=\"224\" y=\"280\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">salvo cuando se prevea el empleo de medios electrónicos.</text><text x=\"930\" y=\"266\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">157.4</text><path d=\"M480 299 L 480 307\" stroke=\"var(--ej)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl11)\"/><rect x=\"20\" y=\"308\" width=\"920\" height=\"68\" rx=\"10\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><rect x=\"30\" y=\"329\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--ej)\"/><text x=\"120\" y=\"346\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--ej)\">5 · INFORMES</text><text x=\"224\" y=\"330\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Pueden solicitarse informes técnicos y también a organizaciones sociales,</text><text x=\"224\" y=\"344\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">sectoriales, sindicales y de igualdad para verificar consideraciones</text><text x=\"224\" y=\"358\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">sociales y ambientales.</text><text x=\"930\" y=\"330\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">157.5</text><path d=\"M480 377 L 480 385\" stroke=\"var(--ej)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl11)\"/><rect x=\"20\" y=\"386\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><rect x=\"30\" y=\"400\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--exc)\"/><text x=\"120\" y=\"417\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--exc)\">6 · PROPUESTA</text><text x=\"224\" y=\"408\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">La propuesta de adjudicación NO CREA DERECHO ALGUNO a favor del licitador</text><text x=\"224\" y=\"422\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">propuesto. Si el órgano no adjudica conforme a ella, DEBE MOTIVARLO.</text><text x=\"930\" y=\"408\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">157.6</text></svg>"}, {"n": 158, "t": "Adjudicación", "ubic": "Libro II ▸ Título I ▸ Capítulo I ▸ Sección 2.ª ▸ Subsección 2.ª · Procedimiento abierto", "idea": "Quince días si el criterio es solo el precio; dos meses si hay varios criterios.", "literal": "<p><b>1.</b> Cuando el único criterio para seleccionar al adjudicatario del contrato sea el del precio, la adjudicación deberá recaer en el plazo máximo de quince días a contar desde el siguiente al de apertura de las proposiciones.</p><p><b>2.</b> Cuando para la adjudicación del contrato deban tenerse en cuenta una pluralidad de criterios, o utilizándose un único criterio sea este el del menor coste del ciclo de vida, el plazo máximo para efectuar la adjudicación será de dos meses a contar desde la apertura de las proposiciones, salvo que se hubiese establecido otro en el pliego de cláusulas administrativas particulares. Si la proposición se contuviera en más de un sobre o archivo electrónico, de tal forma que estos deban abrirse en varios actos independientes, el plazo anterior se computará desde el primer acto de apertura del sobre o archivo electrónico que contenga una parte de la proposición.</p><p><b>3.</b> Los plazos indicados en los apartados anteriores se ampliarán en quince días hábiles cuando sea necesario seguir los trámites a que se refiere el apartado 4 del artículo 149 de la presente Ley.</p><p><b>4.</b> De no producirse la adjudicación dentro de los plazos señalados, los licitadores tendrán derecho a retirar su proposición, y a la devolución de la garantía provisional, de existir esta.</p>", "dis": "<ul>\n<li><b>Criterio único precio (158.1):</b> la adjudicación deberá recaer en el plazo máximo de <b>quince días</b> a contar desde el siguiente al de <b>apertura de las proposiciones</b>.</li>\n<li><b>Pluralidad de criterios (158.2):</b> plazo máximo de <b>dos meses</b> desde la apertura de las proposiciones, <b>salvo que se hubiese establecido otro en el PCAP</b>. El mismo plazo si el criterio único es el <b>menor coste del ciclo de vida</b>.</li>\n<li><b>Varios sobres:</b> si la proposición se contiene en más de un sobre o archivo electrónico que deban abrirse en actos independientes, el plazo se computa desde el <b>primer acto de apertura</b>.</li>\n<li><b>Ampliación (158.3):</b> los plazos se amplían en <b>quince días hábiles</b> cuando sea necesario seguir los trámites del art. 149.4 —justificación de ofertas anormalmente bajas—.</li>\n<li><b>Incumplimiento (158.4):</b> de no producirse la adjudicación dentro de los plazos, los licitadores tienen derecho a <b>retirar su proposición</b> y a la <b>devolución de la garantía provisional</b>, de existir esta.</li>\n</ul>", "llano": "<p>La Administración no puede tener a las empresas esperando indefinidamente. Si solo se valora el precio, tiene quince días para adjudicar. Si hay que valorar más cosas, dos meses. Y si hay que pedir explicaciones por una oferta muy baja, quince días hábiles más.</p>\n<p>Si se pasa del plazo, el licitador puede retirarse y recuperar su garantía.</p>", "porque": "<p>Porque una oferta tiene fecha de caducidad económica: los precios de los proveedores, los costes salariales y la disponibilidad de personal cambian. Obligar a una empresa a mantener su oferta durante un año sería exigirle asumir un riesgo que no puede calcular.</p>\n<p>La consecuencia del incumplimiento no es la nulidad, sino un <b>derecho del licitador</b> a desvincularse: una solución proporcionada que no castiga a los demás.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> un presupuesto de obra con «validez: 30 días». Pasado ese plazo, el que lo hizo no está obligado a mantenerlo.</li>\n<li><b>Real:</b> en un contrato de suministro con criterio único de precio, las proposiciones se abren el 10 de junio. La adjudicación debe recaer, como máximo, el <b>25 de junio</b>. Si una oferta hubiera resultado incursa en presunción de anormalidad, el plazo se ampliaría en <b>quince días hábiles</b>.</li>\n<li><b>Caso límite:</b> en un contrato con tres sobres, el primero se abre el 2 de marzo y el tercero el 20 de abril. Los dos meses se cuentan desde el <b>2 de marzo</b>, no desde el 20 de abril.</li>\n</ul>", "noej": "<ul>\n<li><b>No son quince días hábiles</b> el plazo del 158.1: la ley dice «quince días».</li>\n<li><b>No se cuenta</b> desde la adjudicación provisional —figura que ya no existe—, sino desde la <b>apertura de las proposiciones</b>.</li>\n<li><b>No es nula</b> la adjudicación extemporánea: lo que nace es el derecho del licitador a retirar su proposición.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 145 y 146:</b> criterio único y pluralidad de criterios.</li>\n<li><b>Art. 148:</b> coste del ciclo de vida.</li>\n<li><b>Art. 149.4:</b> los trámites que amplían el plazo en quince días hábiles.</li>\n<li><b>Art. 150:</b> clasificación, requerimiento y adjudicación.</li>\n<li><b>Art. 106:</b> garantía provisional, que se devuelve si el licitador se retira.</li>\n</ul>", "trampas": "<ul>\n<li><b>15 días</b> con criterio único de precio; <b>2 meses</b> con pluralidad de criterios <b>o</b> con criterio único de coste del ciclo de vida.</li>\n<li>La ampliación por oferta anormal sí es de <b>quince días hábiles</b>.</li>\n<li>El PCAP puede fijar <b>otro</b> plazo en el caso de pluralidad de criterios, pero no en el de criterio único de precio.</li>\n</ul>", "ancla": "<p><b>«Precio solo: quince días. Varias cosas: dos meses.»</b></p>\n<p>Y si hay que investigar una baja temeraria, quince días hábiles de propina.</p>", "vis": "<svg viewBox=\"0 0 960 267\" role=\"img\" aria-label=\"Plazos máximos para efectuar la adjudicación en el procedimiento abierto\" style=\"width:100%;height:auto\"><defs><marker id=\"fl12\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr12\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe12\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw12\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"250\" y=\"8\" width=\"460\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"27.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">PLAZOS PARA ADJUDICAR · ART. 158</text><rect x=\"20\" y=\"52\" width=\"172.8\" height=\"205\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"106.4\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--acc)\">CRITERIO ÚNICO: PRECIO</text><text x=\"106.4\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">QUINCE DÍAS</text><text x=\"106.4\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"106.4\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">desde el siguiente al de</text><text x=\"106.4\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">apertura de las</text><text x=\"106.4\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">proposiciones</text><text x=\"106.4\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"106.4\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 158.1</text><rect x=\"206.8\" y=\"52\" width=\"172.8\" height=\"205\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"293.2\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--ej)\">PLURALIDAD DE CRITERIOS</text><text x=\"293.2\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">DOS MESES</text><text x=\"293.2\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"293.2\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">desde la apertura de las</text><text x=\"293.2\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">proposiciones, salvo otro</text><text x=\"293.2\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">plazo en el PCAP</text><text x=\"293.2\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"293.2\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">También si el criterio</text><text x=\"293.2\" y=\"180\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">único es el menor coste</text><text x=\"293.2\" y=\"193\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">del ciclo de vida</text><text x=\"293.2\" y=\"206\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"293.2\" y=\"219\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 158.2</text><rect x=\"393.6\" y=\"52\" width=\"172.8\" height=\"205\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"480\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--warn)\">SI HAY VARIOS SOBRES</text><text x=\"480\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">El plazo se computa desde</text><text x=\"480\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">el PRIMER acto de apertura</text><text x=\"480\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">del sobre o archivo</text><text x=\"480\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">electrónico que contenga</text><text x=\"480\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">una parte de la</text><text x=\"480\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">proposición</text><text x=\"480\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"480\" y=\"180\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 158.2</text><rect x=\"580.4\" y=\"52\" width=\"172.8\" height=\"205\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"666.8\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--warn)\">SI HAY OFERTA ANORMAL</text><text x=\"666.8\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Los plazos se AMPLÍAN en</text><text x=\"666.8\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">QUINCE DÍAS HÁBILES</text><text x=\"666.8\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">cuando haya que seguir</text><text x=\"666.8\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">los trámites del</text><text x=\"666.8\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 149.4</text><text x=\"666.8\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"666.8\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 158.3</text><rect x=\"767.2\" y=\"52\" width=\"172.8\" height=\"205\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"853.6\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--exc)\">SI SE INCUMPLE</text><text x=\"853.6\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Los licitadores tienen</text><text x=\"853.6\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">derecho a RETIRAR su</text><text x=\"853.6\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">proposición y a que se</text><text x=\"853.6\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">les devuelva la garantía</text><text x=\"853.6\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">provisional, de existir</text><text x=\"853.6\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"853.6\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 158.4</text></svg>"}, {"n": 159, "t": "Procedimiento abierto simplificado", "ubic": "Libro II ▸ Título I ▸ Capítulo I ▸ Sección 2.ª ▸ Subsección 2.ª · Procedimiento abierto", "idea": "La vía rápida del abierto: dos condiciones de entrada, plazos cortos y ROLECE obligatorio.", "literal": "<p><b>1.</b> Los órganos de contratación podrán acordar la utilización de un procedimiento abierto simplificado en los contratos de obras, suministro y servicios cuando se cumplan las dos condiciones siguientes:</p><p style=\"margin-left:1.1rem\">a) Que su valor estimado sea igual o inferior a 2.000.000 de euros en el caso de contratos de obras, y en el caso de contratos de suministro y de servicios, que su valor estimado sea inferior a las cantidades establecidas en los artículos 21.1, letra a), y 22.1, letra a), de esta Ley, respectivamente, o a sus correspondientes actualizaciones.</p><p style=\"margin-left:1.1rem\">b) Que entre los criterios de adjudicación previstos en el pliego no haya ninguno evaluable mediante juicio de valor o, de haberlos, su ponderación no supere el veinticinco por ciento del total, salvo en el caso de que el contrato tenga por objeto prestaciones de carácter intelectual, como los servicios de ingeniería y arquitectura, en que su ponderación no podrá superar el cuarenta y cinco por ciento del total.</p><p><b>2.</b> El anuncio de licitación del contrato únicamente precisará de publicación en el perfil de contratante del órgano de contratación. Toda la documentación necesaria para la presentación de la oferta tiene que estar disponible por medios electrónicos desde el día de la publicación del anuncio en dicho perfil de contratante.</p><p><b>3.</b> El plazo para la presentación de proposiciones no podrá ser inferior a quince días a contar desde el siguiente a la publicación en el perfil de contratante del anuncio de licitación. En los contratos de obras el plazo será como mínimo de veinte días.</p><p><b>4.</b> La tramitación del procedimiento se ajustará a las siguientes especialidades:</p><p style=\"margin-left:1.1rem\">a) Todos los licitadores que se presenten a licitaciones realizadas a través de este procedimiento simplificado deberán estar inscritos en el Registro Oficial de Licitadores y Empresas Clasificadas del Sector Público, o cuando proceda de conformidad con lo establecido en el apartado 2 del artículo 96 en el Registro Oficial de la correspondiente Comunidad Autónoma, en la fecha final de presentación de ofertas siempre que no se vea limitada la concurrencia. A estos efectos, también se considerará admisible la proposición del licitador que acredite haber presentado la solicitud de inscripción en el correspondiente Registro junto con la documentación preceptiva para ello, siempre que tal solicitud sea de fecha anterior a la fecha final de presentación de las ofertas. La acreditación de esta circunstancia tendrá lugar mediante la aportación del acuse de recibo de la solicitud emitido por el correspondiente Registro y de una declaración responsable de haber aportado la documentación preceptiva y de no haber recibido requerimiento de subsanación.</p><p style=\"margin-left:1.1rem\">b) No procederá la constitución de garantía provisional por parte de los licitadores.</p><p style=\"margin-left:1.1rem\">c) Las proposiciones deberán presentarse necesaria y únicamente en el registro indicado en el anuncio de licitación. La presentación de la oferta exigirá la declaración responsable del firmante respecto a ostentar la representación de la sociedad que presenta la oferta; a contar con la adecuada solvencia económica, financiera y técnica o, en su caso, la clasificación correspondiente; a contar con las autorizaciones necesarias para ejercer la actividad; a no estar incurso en prohibición de contratar alguna; y se pronunciará sobre la existencia del compromiso a que se refiere el artículo 75.2. A tales efectos, el modelo de oferta que figure como anexo al pliego recogerá esa declaración responsable. Adicionalmente, en el caso de que la empresa fuera extranjera, la declaración responsable incluirá el sometimiento al fuero español. En el supuesto de que la oferta se presentara por una unión temporal de empresarios, deberá acompañar a aquella el compromiso de constitución de la unión.</p><p style=\"margin-left:1.1rem\">d) La oferta se presentará en un único sobre o archivo electrónico en los supuestos en que en el procedimiento no se contemplen criterios de adjudicación cuya cuantificación dependa de un juicio de valor. En caso contrario, la oferta se presentará en dos sobres o archivos electrónicos. La apertura de los sobres o archivos electrónicos conteniendo la proposición se hará por el orden que proceda de conformidad con lo establecido en el artículo 145 en función del método aplicable para valorar los criterios de adjudicación establecidos en los pliegos. La apertura se hará por la mesa de contratación a la que se refiere el apartado 6 del artículo 326 de la presente Ley.</p><p style=\"margin-left:1.1rem\">e) En los supuestos en que en el procedimiento se contemplen criterios de adjudicación cuya cuantificación dependa de un juicio de valor, la valoración de las proposiciones se hará por los servicios técnicos del órgano de contratación en un plazo no superior a siete días, debiendo ser suscritas por el técnico o técnicos que realicen la valoración.</p><p style=\"margin-left:1.1rem\">f) En todo caso, la valoración a la que se refiere la letra anterior deberá estar efectuada con anterioridad a la apertura del sobre o archivo electrónico que contenga la oferta evaluable a través de criterios cuantificables mediante la mera aplicación de fórmulas. Tras la apertura del sobre o archivo electrónico y en la misma sesión la mesa procederá a: 1.º Previa exclusión, en su caso, de las ofertas que no cumplan los requerimientos del pliego, evaluar y clasificar las ofertas. 2.º Realizar la propuesta de adjudicación a favor del candidato con mejor puntuación. 3.º Comprobar en el Registro Oficial de Licitadores y Empresas Clasificadas que la empresa está debidamente constituida, el firmante de la proposición tiene poder bastante para formular la oferta, ostenta la solvencia económica, financiera y técnica o, en su caso la clasificación correspondiente y no está incursa en ninguna prohibición para contratar. Si el licitador hubiera hecho uso de la facultad de acreditar la presentación de la solicitud de inscripción en el correspondiente Registro a que alude el inciso final de la letra a) del apartado 4 de este artículo, la mesa requerirá al licitador para que justifique documentalmente todos los extremos referentes a su aptitud para contratar enunciados en este número. 4.º Requerir a la empresa que ha obtenido la mejor puntuación mediante comunicación electrónica para que constituya la garantía definitiva, así como para que aporte el compromiso al que se refiere el artículo 75.2 y la documentación justificativa de que dispone efectivamente de los medios que se hubiese comprometido a dedicar o adscribir a la ejecución del contrato conforme al artículo 76.2; y todo ello en el plazo de siete días hábiles a contar desde el envío de la comunicación. En el caso de que la oferta del licitador que haya obtenido la mejor puntuación se presuma que es anormalmente baja por darse los supuestos previstos en el artículo 149, la mesa, realizadas las actuaciones recogidas en los puntos 1.º y 2.º anteriores, seguirá el procedimiento previsto en el citado artículo, si bien el plazo máximo para que justifique su oferta el licitador no podrá superar los cinco días hábiles desde el envío de la correspondiente comunicación. Presentada la garantía definitiva y, en los casos en que resulte preceptiva, previa fiscalización del compromiso del gasto por la Intervención en los términos previstos en la Ley 47/2003, de 26 de noviembre, General Presupuestaria, en un plazo no superior a cinco días se procederá a adjudicar el contrato a favor del licitador propuesto como adjudicatario, procediéndose, una vez adjudicado el mismo, a su formalización. En caso de que en el plazo otorgado al efecto el candidato propuesto como adjudicatario no presente la garantía definitiva, se efectuará propuesta de adjudicación a favor del siguiente candidato en puntuación, otorgándole el correspondiente plazo para constituir la citada garantía definitiva. En el supuesto de que el empresario tenga que presentar cualquier otra documentación que no esté inscrita en el Registro de Licitadores, la misma se tendrá que aportar en el plazo de siete días hábiles establecido para presentar la garantía definitiva.</p><p style=\"margin-left:1.1rem\">g) En los casos en que a la licitación se presenten empresarios extranjeros de un Estado miembro de la Unión Europea o signatario del Espacio Económico Europeo, la acreditación de su capacidad, solvencia y ausencia de prohibiciones se podrá realizar bien mediante consulta en la correspondiente lista oficial de operadores económicos autorizados de un Estado miembro, bien mediante la aportación de la documentación acreditativa de los citados extremos, que deberá presentar, en este último caso, en el plazo concedido para la presentación de la garantía definitiva.</p><p style=\"margin-left:1.1rem\">h) En lo no previsto en este artículo se observarán las normas generales aplicables al procedimiento abierto.</p><p><b>5.</b> En los casos de declaración de urgencia del expediente de contratación en el que el procedimiento de adjudicación utilizado sea el procedimiento abierto simplificado regulado en el presente artículo, no se producirá la reducción de plazos a la que se refiere la letra b) del apartado 2 del artículo 119.</p><p><b>6.</b> En contratos de obras de valor estimado inferior a 80.000 euros, y en contratos de suministros y de servicios de valor estimado inferior a 60.000 euros, excepto los que tengan por objeto prestaciones de carácter intelectual a los que no será de aplicación este apartado, el procedimiento abierto simplificado podrá seguir la siguiente tramitación:</p><p style=\"margin-left:1.1rem\">a) El plazo para la presentación de proposiciones no podrá ser inferior a diez días hábiles, a contar desde el siguiente a la publicación del anuncio de licitación en el perfil de contratante. No obstante lo anterior, cuando se trate de compras corrientes de bienes disponibles en el mercado el plazo será de 5 días hábiles.</p><p style=\"margin-left:1.1rem\">b) Se eximirá a los licitadores de la acreditación de la solvencia económica y financiera y técnica o profesional.</p><p style=\"margin-left:1.1rem\">c) La oferta se entregará en un único sobre o archivo electrónico y se evaluará, en todo caso, con arreglo a criterios de adjudicación cuantificables mediante la mera aplicación de fórmulas establecidas en los pliegos.</p><p style=\"margin-left:1.1rem\">d) La valoración de las ofertas se podrá efectuar automáticamente mediante dispositivos informáticos, o con la colaboración de una unidad técnica que auxilie al órgano de contratación. Se garantizará, mediante un dispositivo electrónico, que la apertura de las proposiciones no se realiza hasta que haya finalizado el plazo para su presentación, por lo que no se celebrará acto público de apertura de las mismas.</p><p style=\"margin-left:1.1rem\">e) Las ofertas presentadas y la documentación relativa a la valoración de las mismas serán accesibles de forma abierta por medios informáticos sin restricción alguna desde el momento en que se notifique la adjudicación del contrato.</p><p style=\"margin-left:1.1rem\">f) No se requerirá la constitución de garantía definitiva.</p><p style=\"margin-left:1.1rem\">g) La formalización del contrato podrá efectuarse mediante la firma de aceptación por el contratista de la resolución de adjudicación. En todo lo no previsto en este apartado se aplicará la regulación general del procedimiento abierto simplificado prevista en este artículo.</p>", "dis": "<ul>\n<li><b>Las dos condiciones (159.1):</b>\n <ul><li><b>a)</b> valor estimado <b>igual o inferior a 2.000.000 €</b> en <b>obras</b>; en <b>suministros y servicios</b>, valor estimado <b>inferior a las cantidades de los arts. 21.1.a) y 22.1.a)</b> —los umbrales armonizados— o sus actualizaciones;</li>\n <li><b>b)</b> que entre los criterios de adjudicación <b>no haya ninguno evaluable mediante juicio de valor</b> o, de haberlos, que su ponderación <b>no supere el 25 %</b>, salvo en contratos que tengan por objeto <b>prestaciones de carácter intelectual</b> —ingeniería y arquitectura—, en que el límite es el <b>45 %</b>.</li></ul></li>\n<li><b>Publicidad (159.2):</b> el anuncio de licitación <b>únicamente precisa publicación en el perfil de contratante</b>, y toda la documentación debe estar disponible por medios electrónicos desde el día de la publicación.</li>\n<li><b>Plazos (159.3):</b> el plazo de presentación de proposiciones <b>no podrá ser inferior a quince días</b> desde el siguiente a la publicación en el perfil. En los contratos de <b>obras</b>, como mínimo <b>veinte días</b>.</li>\n<li><b><span class=\"t\" data-k=\"rolece\">ROLECE</span> (159.4.a):</b> todos los licitadores deben estar <b>inscritos en el Registro Oficial de Licitadores y Empresas Clasificadas del Sector Público</b> —o en el registro autonómico equivalente— en la fecha final de presentación de ofertas, siempre que no se vea limitada la concurrencia.</li>\n<li><b>Abreviado (159.6):</b> cuando el valor estimado sea <b>inferior a 80.000 €</b> en obras o a <b>60.000 €</b> en suministros y servicios —salvo prestaciones de carácter intelectual—, se aplican especialidades: entre otras, <b>no se exige garantía definitiva</b>, la oferta se presenta en <b>un único sobre o archivo electrónico</b> y el plazo de presentación es de <b>diez días hábiles</b>, o de <b>cinco días hábiles</b> en contratos de suministros de bienes de adquisición corriente.</li>\n</ul>", "llano": "<p>Es el abierto de siempre, pero más rápido. Solo puede usarse si el contrato no es demasiado grande y si lo que se puntúa «a ojo» pesa poco. A cambio: se anuncia solo en el perfil, el plazo baja a quince días —veinte en obras— y todos los que se presenten tienen que estar ya inscritos en el ROLECE.</p>\n<p>Y hay una versión aún más rápida, el <b>abreviado</b>, para contratos pequeños: un solo sobre, diez días hábiles y sin garantía definitiva.</p>", "porque": "<p>Porque el procedimiento abierto ordinario, pensado para contratos europeos, resultaba desproporcionado para el grueso de la contratación local. La alternativa que se usaba era el contrato menor y el negociado, es decir, <b>menos</b> publicidad. El abierto simplificado se creó para ofrecer una vía ágil <b>sin renunciar a la concurrencia</b>.</p>\n<p>El límite del juicio de valor —25 %— es la contrapartida: se puede ir rápido porque casi todo se puntúa con fórmulas y hay poco margen de apreciación.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> el trámite exprés de renovación del DNI frente a la cita ordinaria. Menos pasos, pero solo si cumples los requisitos de entrada.</li>\n<li><b>Real:</b> el servicio de socorrismo con valor estimado de 178.000 € y criterios 100 % automáticos. Cumple las dos condiciones del 159.1: se anuncia solo en el perfil el 3 de febrero y el plazo de presentación termina el <b>18 de febrero</b>, quince días después.</li>\n<li><b>Caso límite:</b> una obra de 65.000 € de valor estimado. Cabe el <b>abierto simplificado abreviado</b> del 159.6: un solo sobre, diez días hábiles y sin garantía definitiva.</li>\n</ul>", "noej": "<ul>\n<li><b>No cabe</b> el simplificado si el juicio de valor supera el 25 % —o el 45 % en prestaciones intelectuales—, por muy pequeño que sea el contrato.</li>\n<li><b>No es un contrato menor</b>: hay anuncio, plazo de presentación, valoración y adjudicación.</li>\n<li><b>No hay que publicar en el DOUE</b>: por definición está por debajo de los umbrales armonizados en suministros y servicios.</li>\n<li><b>No basta</b> con poder inscribirse en el ROLECE: hay que <b>estar inscrito</b> en la fecha final de presentación de ofertas.</li>\n</ul>", "conex": "<ul>\n<li><b>Arts. 21.1.a) y 22.1.a):</b> los umbrales a los que remite el 159.1.a).</li>\n<li><b>Art. 156:</b> procedimiento abierto ordinario y sus plazos.</li>\n<li><b>Art. 146:</b> criterios sujetos a juicio de valor.</li>\n<li><b>Art. 107:</b> garantía definitiva, no exigible en el abreviado.</li>\n<li><b>Art. 63:</b> perfil de contratante, único lugar de publicación.</li>\n<li><b>Art. 159.4.f):</b> especialidades de la valoración y la adjudicación.</li>\n</ul>", "trampas": "<ul>\n<li>En suministros y servicios el umbral <b>no es una cifra fija</b> en el art. 159: remite a los <b>umbrales SARA</b> de los arts. 21.1.a) y 22.1.a), que se actualizan.</li>\n<li><b>15 días</b> en general, <b>20</b> en obras. Y en el abreviado, <b>10 días hábiles</b>, o <b>5</b> en bienes de adquisición corriente.</li>\n<li><b>25 %</b> de juicio de valor; <b>45 %</b> solo en prestaciones de carácter intelectual.</li>\n<li>El <b>abreviado</b> es el del 159.6, con umbrales de <b>80.000</b> y <b>60.000 €</b>.</li>\n</ul>", "ancla": "<p>Los cuatro números del simplificado: <b>2.000.000 · 25 % · 15 días · 20 en obras</b>.</p>\n<p>Y los del abreviado: <b>80.000 · 60.000 · 10 días hábiles · sin garantía</b>.</p>", "vis": "<svg viewBox=\"0 0 960 341\" role=\"img\" aria-label=\"Requisitos, umbrales y plazos del procedimiento abierto simplificado\" style=\"width:100%;height:auto\"><defs><marker id=\"fl13\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr13\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe13\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw13\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"250\" y=\"8\" width=\"460\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"27.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">EL PROCEDIMIENTO ABIERTO SIMPLIFICADO · ART. 159</text><rect x=\"20\" y=\"52\" width=\"219.5\" height=\"235\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"129.75\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--acc)\">CUÁNDO CABE</text><text x=\"129.75\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">OBRAS: valor estimado</text><text x=\"129.75\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">igual o inferior a</text><text x=\"129.75\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">2.000.000 €</text><text x=\"129.75\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"129.75\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">SUMINISTROS Y SERVICIOS:</text><text x=\"129.75\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">valor estimado inferior</text><text x=\"129.75\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">a los umbrales de los</text><text x=\"129.75\" y=\"180\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">arts. 21.1.a) y 22.1.a)</text><text x=\"129.75\" y=\"193\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">—los umbrales SARA—</text><text x=\"129.75\" y=\"206\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><t

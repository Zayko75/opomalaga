ize=\"9.8\" fill=\"currentColor\">En el «Boletín Oficial del Estado», cuando el contrato lo celebre la</text><text x=\"224\" y=\"152\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Administración General del Estado o entidades vinculadas con naturaleza de AAPP.</text><text x=\"930\" y=\"138\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">135.1</text><path d=\"M480 171 L 480 179\" stroke=\"var(--ej)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl3)\"/><rect x=\"20\" y=\"180\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"30\" y=\"194\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"120\" y=\"211\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--warn)\">ADEMÁS, SI ES SARA</text><text x=\"224\" y=\"202\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">En el «Diario Oficial de la Unión Europea». El poder adjudicador debe</text><text x=\"224\" y=\"216\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">poder demostrar la fecha de envío del anuncio.</text><text x=\"930\" y=\"202\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">135.1</text><path d=\"M480 235 L 480 243\" stroke=\"var(--warn)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl3)\"/><rect x=\"20\" y=\"244\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"30\" y=\"258\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"120\" y=\"275\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--warn)\">PRUEBA DE LA PUBLICACIÓN</text><text x=\"224\" y=\"266\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">La confirmación de recepción y publicación de la Oficina de Publicaciones</text><text x=\"224\" y=\"280\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">de la Unión Europea constituye prueba de la publicación.</text><text x=\"930\" y=\"266\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">135.1</text><path d=\"M480 299 L 480 307\" stroke=\"var(--warn)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl3)\"/><rect x=\"20\" y=\"308\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--panel)\" stroke=\"var(--line)\"/><rect x=\"30\" y=\"322\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--line)\"/><text x=\"120\" y=\"339\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"currentColor\">VOLUNTARIO</text><text x=\"224\" y=\"330\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Los contratos NO sujetos a regulación armonizada pueden anunciarse</text><text x=\"224\" y=\"344\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">además en el DOUE si el órgano lo estima conveniente.</text><text x=\"930\" y=\"330\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">135.2</text><rect x=\"20\" y=\"372\" width=\"920\" height=\"34\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"480\" y=\"392.328\" text-anchor=\"middle\" font-size=\"10.4\" fill=\"currentColor\">En las entidades locales el anuncio va al perfil de contratante; el BOE solo se exige a la Administración General del Estado y entes vinculados.</text></svg>"}, {"n": 145, "t": "Requisitos y clases de criterios de adjudicación del contrato", "ubic": "Libro II ▸ Título I ▸ Capítulo I ▸ Sección 2.ª ▸ Subsección 4.ª · Adjudicación · Criterios y clasificación", "idea": "Se adjudica a la mejor relación calidad-precio, con criterios vinculados al objeto y formulados objetivamente.", "literal": "<p><b>1.</b> La adjudicación de los contratos se realizará utilizando una pluralidad de criterios de adjudicación en base a la mejor relación calidad-precio. Previa justificación en el expediente, los contratos se podrán adjudicar con arreglo a criterios basados en un planteamiento que atienda a la mejor relación coste-eficacia, sobre la base del precio o coste, como el cálculo del coste del ciclo de vida con arreglo al artículo 148.</p><p><b>2.</b> La mejor relación calidad-precio se evaluará con arreglo a criterios económicos y cualitativos. Los criterios cualitativos que establezca el órgano de contratación para evaluar la mejor relación calidad-precio podrán incluir aspectos medioambientales o sociales, vinculados al objeto del contrato en la forma establecida en el apartado 6 de este artículo, que podrán ser, entre otros, los siguientes: 1.º La calidad, incluido el valor técnico, las características estéticas y funcionales, la accesibilidad, el diseño universal o diseño para todas las personas usuarias, las características sociales, medioambientales e innovadoras, y la comercialización y sus condiciones; Las características medioambientales podrán referirse, entre otras, a la reducción del nivel de emisión de gases de efecto invernadero; al empleo de medidas de ahorro y eficiencia energética y a la utilización de energía procedentes de fuentes renovables durante la ejecución del contrato; y al mantenimiento o mejora de los recursos naturales que puedan verse afectados por la ejecución del contrato. Las características sociales del contrato se referirán, entre otras, a las siguientes finalidades: al fomento de la integración social de personas con discapacidad, personas desfavorecidas o miembros de grupos vulnerables entre las personas asignadas a la ejecución del contrato y, en general, la inserción sociolaboral de personas con discapacidad o en situación o riesgo de exclusión social; la subcontratación con Centros Especiales de Empleo o Empresas de Inserción; los planes de igualdad de género que se apliquen en la ejecución del contrato y, en general, la igualdad entre mujeres y hombres; el fomento de la contratación femenina; la conciliación de la vida laboral, personal y familiar; la mejora de las condiciones laborales y salariales; la estabilidad en el empleo; la contratación de un mayor número de personas para la ejecución del contrato; la formación y la protección de la salud y la seguridad en el trabajo; la aplicación de criterios éticos y de responsabilidad social a la prestación contractual; o los criterios referidos al suministro o a la utilización de productos basados en un comercio equitativo durante la ejecución del contrato. 2.º La organización, cualificación y experiencia del personal adscrito al contrato que vaya a ejecutar el mismo, siempre y cuando la calidad de dicho personal pueda afectar de manera significativa a su mejor ejecución. 3.º El servicio posventa y la asistencia técnica y condiciones de entrega tales como la fecha en que esta última debe producirse, el proceso de entrega, el plazo de entrega o ejecución y los compromisos relativos a recambios y seguridad del suministro. Los criterios cualitativos deberán ir acompañados de un criterio relacionado con los costes el cual, a elección del órgano de contratación, podrá ser el precio o un planteamiento basado en la rentabilidad, como el coste del ciclo de vida calculado de conformidad con lo dispuesto en el artículo 148.</p><p><b>3.</b> La aplicación de más de un criterio de adjudicación procederá, en todo caso, en la adjudicación de los siguientes contratos:</p><p style=\"margin-left:1.1rem\">a) Aquellos cuyos proyectos o presupuestos no hayan podido ser establecidos previamente y deban ser presentados por los candidatos o licitadores.</p><p style=\"margin-left:1.1rem\">b) Cuando el órgano de contratación considere que la definición de la prestación es susceptible de ser mejorada por otras soluciones técnicas o por reducciones en su plazo de ejecución.</p><p style=\"margin-left:1.1rem\">c) Aquellos para cuya ejecución facilite el órgano, organismo o entidad contratante materiales o medios auxiliares cuya buena utilización exija garantías especiales por parte de los contratistas.</p><p style=\"margin-left:1.1rem\">d) Aquellos que requieran el empleo de tecnología especialmente avanzada o cuya ejecución sea particularmente compleja.</p><p style=\"margin-left:1.1rem\">e) Contratos de concesión de obras y de concesión de servicios.</p><p style=\"margin-left:1.1rem\">f) Contratos de suministros, salvo que los productos a adquirir estén perfectamente definidos y no sea posible variar los plazos de entrega ni introducir modificaciones de ninguna clase en el contrato, siendo por consiguiente el precio el único factor determinante de la adjudicación.</p><p style=\"margin-left:1.1rem\">g) Contratos de servicios, salvo que las prestaciones estén perfectamente definidas técnicamente y no sea posible variar los plazos de entrega ni introducir modificaciones de ninguna clase en el contrato, siendo por consiguiente el precio el único factor determinante de la adjudicación. En los contratos de servicios que tengan por objeto prestaciones de carácter intelectual, como los servicios de ingeniería y arquitectura, y en los contratos de prestación de servicios sociales si fomentan la integración social de personas desfavorecidas o miembros de grupos vulnerables entre las personas asignadas a la ejecución del contrato, promueven el empleo de personas con dificultades particulares de inserción en el mercado laboral o cuando se trate de los contratos de servicios sociales, sanitarios o educativos a que se refiere la</p>", "dis": "<ul>\n<li><b>Regla (145.1):</b> la adjudicación se realiza utilizando una <b>pluralidad de criterios</b> de adjudicación <b>basados en el principio de mejor relación calidad-precio</b>.</li>\n<li><b>Criterio de coste (145.2):</b> la mejor relación calidad-precio se evalúa con criterios económicos y cualitativos; el <b>coste</b> puede medirse por el precio o por un <b>enfoque que atienda a la rentabilidad</b>, como el <span class=\"t\" data-k=\"cicvida\">coste del ciclo de vida</span> del art. 148.</li>\n<li><b>Criterios cualitativos (145.2):</b> calidad, valor técnico, características estéticas y funcionales, <b>accesibilidad</b> y <b>diseño universal</b>, características <b>sociales</b>, <b>medioambientales</b> e <b>innovadoras</b>, la <b>organización, cualificación y experiencia del personal</b> adscrito cuando su calidad pueda afectar de manera significativa a la ejecución, y el servicio posventa.</li>\n<li><b>Requisitos (145.5):</b> los criterios deben estar <b>vinculados al objeto del contrato</b>, ser <b>formulados de manera objetiva</b> con pleno respeto a los principios de igualdad, no discriminación, transparencia y proporcionalidad, y <b>no conferir al órgano de contratación una libertad de decisión ilimitada</b>. Deben garantizar la posibilidad de que las ofertas sean <b>evaluadas en condiciones de competencia efectiva</b>.</li>\n<li><b>Criterio único (145.3):</b> puede aplicarse un único criterio en los supuestos que el propio artículo enumera, y debe estar relacionado con los costes.</li>\n</ul>", "llano": "<p>Ganar no es solo ser el más barato. La ley quiere que se valore la <b>mejor relación calidad-precio</b>, mezclando el coste con criterios de calidad. Pero esos criterios tienen que tener que ver con lo que se compra, medirse de forma objetiva y no dejar al que puntúa hacer lo que quiera.</p>", "porque": "<p>Porque la adjudicación al precio más bajo produjo durante años servicios de mala calidad y empresas que solo podían cumplir incumpliendo el convenio. La ley invierte la regla: lo normal es <b>varios criterios</b>, y el precio solo es uno de ellos.</p>\n<p>Y el límite de la «libertad de decisión ilimitada» es la traducción de la jurisprudencia europea: un criterio que no permita anticipar cómo se puntuará equivale a discrecionalidad pura y vacía de contenido la publicidad.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> elegir colegio para un hijo. No eliges el más barato: mezclas precio, distancia, proyecto educativo y comedor. Eso es relación calidad-precio.</li>\n<li><b>Real:</b> en el servicio de socorrismo, el PCAP fija 60 puntos al precio mediante fórmula, 20 a la ratio de socorristas por lámina de agua por encima del mínimo, 10 a la formación acreditada del personal adscrito y 10 al plan de emergencias. Todos vinculados al objeto y evaluables con reglas escritas.</li>\n<li><b>Caso límite:</b> un criterio que otorgue 15 puntos a «la calidad general del proyecto, a juicio de la mesa». Vulnera el 145.5: confiere libertad de decisión ilimitada y no permite competencia efectiva.</li>\n</ul>", "noej": "<ul>\n<li><b>No son criterios de adjudicación</b> los de <b>solvencia</b>: la solvencia dice quién <b>puede</b> contratar; los criterios, quién <b>gana</b>. Confundirlos es causa de nulidad.</li>\n<li><b>No cabe</b> valorar la experiencia general de la empresa como criterio de adjudicación; sí la <b>experiencia del personal adscrito</b> cuando la calidad de ese personal afecte significativamente a la ejecución.</li>\n<li><b>No basta</b> con que un criterio sea deseable: debe estar <b>vinculado al objeto</b> del contrato.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 146:</b> aplicación de los criterios y órganos competentes.</li>\n<li><b>Art. 148:</b> coste del ciclo de vida.</li>\n<li><b>Art. 149:</b> ofertas anormalmente bajas.</li>\n<li><b>Arts. 87 a 91:</b> criterios de solvencia, que no deben confundirse con estos.</li>\n<li><b>Art. 116.4.c):</b> los criterios de adjudicación se justifican en el expediente.</li>\n<li><b>Art. 122.2:</b> los criterios se incluyen en el PCAP.</li>\n</ul>", "trampas": "<ul>\n<li>La regla es la <b>pluralidad</b> de criterios; el criterio único es la excepción y debe estar <b>relacionado con los costes</b>.</li>\n<li><b>Solvencia ≠ criterio de adjudicación.</b> Es la confusión que más contratos anula.</li>\n<li>«<b>Libertad de decisión ilimitada</b>»: si el pliego no explica cómo se puntúa, el criterio es nulo.</li>\n</ul>", "ancla": "<p><b>«Vinculados, objetivos y sin cheque en blanco.»</b> Los tres requisitos del 145.5.</p>\n<p>Y para separar solvencia de criterios: la solvencia es el <b>portero</b> de la discoteca; los criterios, el <b>jurado</b> del concurso de baile.</p>", "vis": "<svg viewBox=\"0 0 960 311\" role=\"img\" aria-label=\"Requisitos y clases de los criterios de adjudicación\" style=\"width:100%;height:auto\"><defs><marker id=\"fl4\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr4\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe4\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw4\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"250\" y=\"8\" width=\"460\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"27.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">CRITERIOS DE ADJUDICACIÓN · ART. 145</text><rect x=\"20\" y=\"52\" width=\"219.5\" height=\"205\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"129.75\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--acc)\">LA REGLA</text><text x=\"129.75\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">La adjudicación se hace</text><text x=\"129.75\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">utilizando una PLURALIDAD</text><text x=\"129.75\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">de criterios basados en</text><text x=\"129.75\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">la mejor relación</text><text x=\"129.75\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">CALIDAD-PRECIO</text><text x=\"129.75\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"129.75\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 145.1</text><rect x=\"253.5\" y=\"52\" width=\"219.5\" height=\"205\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"363.25\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--ej)\">CUALITATIVOS</text><text x=\"363.25\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Calidad, valor técnico,</text><text x=\"363.25\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">características estéticas</text><text x=\"363.25\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">y funcionales,</text><text x=\"363.25\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">accesibilidad, diseño</text><text x=\"363.25\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">universal, sociales,</text><text x=\"363.25\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">medioambientales,</text><text x=\"363.25\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">innovación, organización</text><text x=\"363.25\" y=\"180\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">y experiencia del personal</text><rect x=\"487\" y=\"52\" width=\"219.5\" height=\"205\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"596.75\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--ej)\">COSTE</text><text x=\"596.75\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Precio, o un criterio</text><text x=\"596.75\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">basado en la</text><text x=\"596.75\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">RENTABILIDAD, como el</text><text x=\"596.75\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">COSTE DEL CICLO DE VIDA</text><text x=\"596.75\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">del art. 148</text><rect x=\"720.5\" y=\"52\" width=\"219.5\" height=\"205\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"830.25\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--warn)\">CÓMO DEBEN SER</text><text x=\"830.25\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Vinculados al objeto</text><text x=\"830.25\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"830.25\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Formulados de manera</text><text x=\"830.25\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">objetiva, con pleno</text><text x=\"830.25\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">respeto a la igualdad,</text><text x=\"830.25\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">no discriminación,</text><text x=\"830.25\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">transparencia y</text><text x=\"830.25\" y=\"180\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">proporcionalidad</text><text x=\"830.25\" y=\"193\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"830.25\" y=\"206\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">No confieren libertad</text><text x=\"830.25\" y=\"219\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">de decisión ilimitada</text><rect x=\"20\" y=\"267\" width=\"920\" height=\"34\" rx=\"8\" fill=\"var(--panel)\" stroke=\"var(--line)\"/><text x=\"480\" y=\"287.328\" text-anchor=\"middle\" font-size=\"10.4\" fill=\"currentColor\">Los criterios de adjudicación NO pueden ser criterios de solvencia: la solvencia dice quién PUEDE contratar; los criterios, quién GANA.</text></svg>"}, {"n": 146, "t": "Aplicación de los criterios de adjudicación", "ubic": "Libro II ▸ Título I ▸ Capítulo I ▸ Sección 2.ª ▸ Subsección 4.ª · Adjudicación · Criterios y clasificación", "idea": "Preferencia por las fórmulas automáticas y comité de expertos cuando pesa más el juicio de valor.", "literal": "<p><b>1.</b> Sin perjuicio de lo dispuesto en los apartados primero y tercero del artículo anterior, cuando solo se utilice un criterio de adjudicación, este deberá estar relacionado con los costes, pudiendo ser el precio o un criterio basado en la rentabilidad, como el coste del ciclo de vida calculado de acuerdo con lo indicado en el artículo 148.</p><p><b>2.</b> Cuando se utilicen una pluralidad de criterios de adjudicación, en su determinación, siempre y cuando sea posible, se dará preponderancia a aquellos que hagan referencia a características del objeto del contrato que puedan valorarse mediante cifras o porcentajes obtenidos a través de la mera aplicación de las fórmulas establecidas en los pliegos. La aplicación de los criterios de adjudicación se efectuará por los siguientes órganos:</p><p style=\"margin-left:1.1rem\">a) En los procedimientos de adjudicación, abierto o restringido, celebrados por los órganos de las Administraciones Públicas, la valoración de los criterios cuya cuantificación dependa de un juicio de valor corresponderá, en los casos en que proceda por tener atribuida una ponderación mayor que la correspondiente a los criterios evaluables de forma automática, a un comité formado por expertos con cualificación apropiada, que cuente con un mínimo de tres miembros, que podrán pertenecer a los servicios dependientes del órgano de contratación, pero en ningún caso podrán estar adscritos al órgano proponente del contrato, al que corresponderá realizar la evaluación de las ofertas; o encomendar esta a un organismo técnico especializado, debidamente identificado en los pliegos.</p><p style=\"margin-left:1.1rem\">b) En los restantes supuestos, la valoración de los criterios cuya cuantificación dependa de un juicio de valor, así como, en todo caso, la de los criterios evaluables mediante la utilización de fórmulas, se efectuará por la mesa de contratación, si interviene, o por los servicios dependientes del órgano de contratación en caso contrario, a cuyo efecto se podrán solicitar los informes técnicos que considere precisos de conformidad con lo previsto en el artículo 150.1 y 157.5 de la presente Ley. La elección de las fórmulas se tendrán que justificar en el expediente. En todo caso, la evaluación de las ofertas conforme a los criterios cuantificables mediante la mera aplicación de fórmulas se realizará tras efectuar previamente la de aquellos otros criterios en que no concurra esta circunstancia, dejándose constancia documental de ello. La citada evaluación previa se hará pública en el acto en el que se proceda a la apertura del sobre que contenga los elementos de la oferta que se valoraran mediante la mera aplicación de fórmulas. Cuando en los contratos de concesión de obras o de concesión de servicios se prevea la posibilidad de que se efectúen aportaciones públicas a la construcción o explotación así como cualquier tipo de garantías, avales u otro tipo de ayudas a la empresa, en todo caso figurará como un criterio de adjudicación evaluable de forma automática la cuantía de la reducción que oferten los licitadores sobre las aportaciones previstas en el expediente de contratación.</p><p><b>3.</b> Salvo cuando se tome en consideración el precio exclusivamente, deberá precisarse en el pliego de cláusulas administrativas particulares o en el documento descriptivo la ponderación relativa atribuida a cada uno de los criterios de valoración, que podrá expresarse fijando una banda de valores con una amplitud máxima adecuada. En el caso de que el procedimiento de adjudicación se articule en varias fases, se indicará igualmente en cuales de ellas se irán aplicando los distintos criterios, estableciendo un umbral mínimo del 50 por ciento de la puntuación en el conjunto de los criterios cualitativos para continuar en el proceso selectivo. Cuando, por razones objetivas debidamente justificadas, no sea posible ponderar los criterios elegidos, estos se enumerarán por orden decreciente de importancia.</p>", "dis": "<ul>\n<li><b>Criterio único (146.1):</b> debe estar <b>relacionado con los costes</b>: el precio o un criterio basado en la <b>rentabilidad</b>, como el <b>coste del ciclo de vida</b> del art. 148.</li>\n<li><b>Pluralidad (146.2):</b> «siempre y cuando sea posible, se dará <b>preponderancia</b> a aquellos que hagan referencia a características del objeto que puedan <b>valorarse mediante cifras o porcentajes</b> obtenidos a través de la mera aplicación de las <b>fórmulas</b> establecidas en los pliegos».</li>\n<li><b>Comité de expertos:</b> en los procedimientos <b>abierto o restringido</b> de las Administraciones Públicas, cuando los criterios dependientes de un <span class=\"t\" data-k=\"juiciovalor\">juicio de valor</span> tengan una <b>ponderación mayor</b> que la de los <span class=\"t\" data-k=\"automatico\">evaluables de forma automática</span>, su valoración corresponde a un <b>comité de expertos</b> con <b>mínimo de tres miembros</b>, que <b>no podrán estar adscritos al órgano proponente</b> del contrato, o a un <b>organismo técnico especializado</b>.</li>\n<li><b>Orden de valoración:</b> la documentación relativa a los criterios sujetos a juicio de valor se presenta en <b>sobre o archivo independiente</b> y se valora <b>antes</b> de conocer la de los criterios evaluables automáticamente.</li>\n</ul>", "llano": "<p>La ley prefiere que se puntúe con fórmulas: mete el número, sale la puntuación, y no hay discusión. Cuando hay que valorar cosas que no se pueden medir con una fórmula —la calidad de un proyecto—, se puede hacer, pero si eso pesa más que lo automático hay que crear un comité de al menos tres expertos que no dependan de quien propuso el contrato.</p>\n<p>Y el orden importa: primero se valora lo subjetivo, y solo después se abren los precios.</p>", "porque": "<p>Porque conocer el precio antes de puntuar la calidad permite «ajustar» la nota subjetiva para que gane quien se quiera. El <b>sobre separado</b> y el orden de apertura eliminan esa posibilidad: cuando se puntúa el proyecto, todavía no se sabe cuánto pide cada uno.</p>\n<p>Y el <b>comité de expertos</b> externo al órgano proponente evita que quien redactó el pliego sea también quien decide con discrecionalidad quién lo cumple mejor.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> un concurso de cocina donde el jurado prueba los platos sin saber quién los ha hecho. Si lo supiera, la nota podría torcerse.</li>\n<li><b>Real:</b> en un contrato de servicios de arquitectura, el PCAP asigna 55 puntos a la calidad de la propuesta (juicio de valor) y 45 al precio (fórmula). Como el juicio de valor pesa más, la valoración corresponde a un <b>comité de tres expertos</b> ajenos al servicio proponente, y el sobre B se abre y valora antes que el sobre C.</li>\n<li><b>Caso límite:</b> si la ponderación fuera 45 juicio de valor y 55 precio, no sería obligatorio el comité de expertos: bastaría la mesa de contratación. La frontera es la <b>ponderación mayor</b>.</li>\n</ul>", "noej": "<ul>\n<li><b>No es obligatorio el comité de expertos</b> cuando los criterios automáticos pesan igual o más que los sujetos a juicio de valor.</li>\n<li><b>No basta</b> con que los expertos sean externos al ayuntamiento: la ley solo exige que <b>no estén adscritos al órgano proponente</b>; pueden pertenecer a otros servicios del órgano de contratación.</li>\n<li><b>No cabe</b> abrir el sobre del precio antes de valorar los criterios sujetos a juicio de valor.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 145:</b> requisitos y clases de criterios.</li>\n<li><b>Art. 148:</b> coste del ciclo de vida.</li>\n<li><b>Art. 157:</b> examen de las proposiciones y propuesta de adjudicación.</li>\n<li><b>Art. 159.1.b):</b> en el abierto simplificado el juicio de valor no puede superar el 25 % —45 % en servicios intelectuales—.</li>\n<li><b>Art. 326:</b> mesas de contratación.</li>\n</ul>", "trampas": "<ul>\n<li>El comité es de <b>tres miembros como mínimo</b>, no de tres exactamente.</li>\n<li>La prohibición es estar adscrito al <b>órgano proponente</b>, no al órgano de contratación.</li>\n<li>La <b>preponderancia</b> de las fórmulas es un mandato «siempre que sea posible», no una prohibición absoluta del juicio de valor.</li>\n</ul>", "ancla": "<p><b>«Primero lo que se opina, después lo que se calcula.»</b> Ese es el orden de los sobres.</p>\n<p>Y la regla del comité: <b>si lo subjetivo pesa más, que lo juzguen tres de fuera</b>.</p>", "vis": "<svg viewBox=\"0 0 960 282\" role=\"img\" aria-label=\"Aplicación de los criterios de adjudicación y órganos competentes\" style=\"width:100%;height:auto\"><defs><marker id=\"fl5\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr5\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe5\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw5\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"250\" y=\"8\" width=\"460\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"27.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">APLICACIÓN DE LOS CRITERIOS · ART. 146</text><rect x=\"20\" y=\"52\" width=\"219.5\" height=\"220\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"129.75\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--acc)\">CRITERIO ÚNICO</text><text x=\"129.75\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Debe estar RELACIONADO</text><text x=\"129.75\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">CON LOS COSTES</text><text x=\"129.75\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"129.75\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Puede ser el precio o</text><text x=\"129.75\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">un criterio basado en la</text><text x=\"129.75\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">rentabilidad, como el</text><text x=\"129.75\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">coste del ciclo de vida</text><text x=\"129.75\" y=\"180\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">del art. 148</text><text x=\"129.75\" y=\"193\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"129.75\" y=\"206\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 146.1</text><rect x=\"253.5\" y=\"52\" width=\"219.5\" height=\"220\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"363.25\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--ej)\">PLURALIDAD</text><text x=\"363.25\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Se dará PREPONDERANCIA,</text><text x=\"363.25\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">siempre que sea posible,</text><text x=\"363.25\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">a los criterios valorables</text><text x=\"363.25\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">mediante cifras o</text><text x=\"363.25\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">porcentajes obtenidos por</text><text x=\"363.25\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">la mera aplicación de</text><text x=\"363.25\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">fórmulas del pliego</text><text x=\"363.25\" y=\"180\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"363.25\" y=\"193\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 146.2</text><rect x=\"487\" y=\"52\" width=\"219.5\" height=\"220\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"596.75\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--warn)\">JUICIO DE VALOR</text><text x=\"596.75\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Si los criterios sujetos</text><text x=\"596.75\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">a juicio de valor tienen</text><text x=\"596.75\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">MAYOR ponderación que</text><text x=\"596.75\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">los automáticos:</text><text x=\"596.75\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"596.75\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">COMITÉ DE EXPERTOS</text><text x=\"596.75\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">mínimo TRES miembros,</text><text x=\"596.75\" y=\"180\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">no adscritos al órgano</text><text x=\"596.75\" y=\"193\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">proponente del contrato</text><text x=\"596.75\" y=\"206\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"596.75\" y=\"219\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">o un organismo técnico</text><text x=\"596.75\" y=\"232\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">especializado</text><rect x=\"720.5\" y=\"52\" width=\"219.5\" height=\"220\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"830.25\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--exc)\">ORDEN DE VALORACIÓN</text><text x=\"830.25\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">La documentación de los</text><text x=\"830.25\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">criterios sujetos a</text><text x=\"830.25\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">juicio de valor se</text><text x=\"830.25\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">presenta en SOBRE</text><text x=\"830.25\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">SEPARADO y se valora</text><text x=\"830.25\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">ANTES de conocer la</text><text x=\"830.25\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">de los criterios</text><text x=\"830.25\" y=\"180\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">automáticos</text></svg>"}, {"n": 149, "t": "Ofertas anormalmente bajas", "ubic": "Libro II ▸ Título I ▸ Capítulo I ▸ Sección 2.ª ▸ Subsección 4.ª · Adjudicación · Criterios y clasificación", "idea": "Una oferta sospechosamente barata no se rechaza: primero se pide explicación por escrito.", "literal": "<p><b>1.</b> En los casos en que el órgano de contratación presuma que una oferta resulta inviable por haber sido formulada en términos que la hacen anormalmente baja, solo podrá excluirla del procedimiento de licitación previa tramitación del procedimiento que establece este artículo.</p><p><b>2.</b> La mesa de contratación, o en su defecto, el órgano de contratación deberá identificar las ofertas que se encuentran incursas en presunción de anormalidad, debiendo contemplarse en los pliegos, a estos efectos, los parámetros objetivos que deberán permitir identificar los casos en que una oferta se considere anormal. La mesa de contratación, o en su defecto, el órgano de contratación realizará la función descrita en el párrafo anterior con sujeción a los siguientes criterios:</p><p style=\"margin-left:1.1rem\">a) Salvo que en los pliegos se estableciera otra cosa, cuando el único criterio de adjudicación sea el del precio, en defecto de previsión en aquellos se aplicarán los parámetros objetivos que se establezcan reglamentariamente y que, en todo caso, determinarán el umbral de anormalidad por referencia al conjunto de ofertas válidas que se hayan presentado, sin perjuicio de lo establecido en el apartado siguiente.</p><p style=\"margin-left:1.1rem\">b) Cuando se utilicen una pluralidad de criterios de adjudicación, se estará a lo establecido en los pliegos que rigen el contrato, en los cuales se han de establecer los parámetros objetivos que deberán permitir identificar los casos en que una oferta se considere anormal, referidos a la oferta considerada en su conjunto.</p><p><b>3.</b> Cuando hubieren presentado ofertas empresas que pertenezcan a un mismo grupo, en el sentido del artículo 42.1 del Código de Comercio, se tomará únicamente, para aplicar el régimen de identificación de las ofertas incursas en presunción de anormalidad, aquella que fuere más baja, y ello con independencia de que presenten su oferta en solitario o conjuntamente con otra empresa o empresas ajenas al grupo y con las cuales concurran en unión temporal.</p><p><b>4.</b> Cuando la mesa de contratación, o en su defecto el órgano de contratación hubiere identificado una o varias ofertas incursas en presunción de anormalidad, deberá requerir al licitador o licitadores que las hubieren presentado dándoles plazo suficiente para que justifiquen y desglosen razonada y detalladamente el bajo nivel de los precios, o de costes, o cualquier otro parámetro en base al cual se haya definido la anormalidad de la oferta, mediante la presentación de aquella información y documentos que resulten pertinentes a estos efectos. La petición de información que la mesa de contratación o, en su defecto, el órgano de contratación dirija al licitador deberá formularse con claridad de manera que estos estén en condiciones de justificar plena y oportunamente la viabilidad de la oferta. Concretamente, la mesa de contratación o en su defecto el órgano de contratación podrá pedir justificación a estos licitadores sobre aquellas condiciones de la oferta que sean susceptibles de determinar el bajo nivel del precio o costes de la misma y, en particular, en lo que se refiere a los siguientes valores:</p><p style=\"margin-left:1.1rem\">a) El ahorro que permita el procedimiento de fabricación, los servicios prestados o el método de construcción.</p><p style=\"margin-left:1.1rem\">b) Las soluciones técnicas adoptadas y las condiciones excepcionalmente favorables de que disponga para suministrar los productos, prestar los servicios o ejecutar las obras, c) La innovación y originalidad de las soluciones propuestas, para suministrar los productos, prestar los servicios o ejecutar las obras.</p><p style=\"margin-left:1.1rem\">d) El respeto de obligaciones que resulten aplicables en materia medioambiental, social o laboral, y de subcontratación, no siendo justificables precios por debajo de mercado o que incumplan lo establecido en el artículo 201.</p><p style=\"margin-left:1.1rem\">e) O la posible obtención de una ayuda de Estado. En el procedimiento deberá solicitarse el asesoramiento técnico del servicio correspondiente. En todo caso, los órganos de contratación rechazarán las ofertas si comprueban que son anormalmente bajas porque vulneran la normativa sobre subcontratación o no cumplen las obligaciones aplicables en materia medioambiental, social o laboral, nacional o internacional, incluyendo el incumplimiento de los convenios colectivos sectoriales vigentes, en aplicación de lo establecido en el artículo 201. Se entenderá en todo caso que la justificación no explica satisfactoriamente el bajo nivel de los precios o costes propuestos por el licitador cuando esta sea incompleta o se fundamente en hipótesis o prácticas inadecuadas desde el punto de vista técnico, jurídico o económico.</p><p><b>5.</b> En los casos en que se compruebe que una oferta es anormalmente baja debido a que el licitador ha obtenido una ayuda de Estado, solo podrá rechazarse la proposición por esta única causa si aquel no puede acreditar que tal ayuda se ha concedido sin contravenir las disposiciones comunitarias en materia de ayudas públicas. El órgano de contratación que rechace una oferta por esta razón deberá informar de ello a la Comisión Europea, cuando el procedimiento de adjudicación se refiera a un contrato sujeto a regulación armonizada.</p><p><b>6.</b> La mesa de contratación, o en su defecto, el órgano de contratación evaluará toda la información y documentación proporcionada por el licitador en plazo y, en el caso de que se trate de la mesa de contratación, elevará de forma motivada la correspondiente propuesta de aceptación o rechazo al órgano de contratación. En ningún caso se acordará la aceptación de una oferta sin que la propuesta de la mesa de contratación en este sentido esté debidamente motivada. Si el órgano de contratación, considerando la justificación efectuada por el licitador y los informes mencionados en el apartado cuatro, estimase que la información recabada no explica satisfactoriamente el bajo nivel de los precios o costes propuestos por el licitador y que, por lo tanto, la oferta no puede ser cumplida como consecuencia de la inclusión de valores anormales, la excluirá de la clasificación y acordará la adjudicación a favor de la mejor oferta, de acuerdo con el orden en que hayan sido clasificadas conforme a lo señalado en el apartado 1 del artículo 150. En general se rechazarán las ofertas incursas en presunción de anormalidad si están basadas en hipótesis o prácticas inadecuadas desde una perspectiva técnica, económica o jurídica.</p><p><b>7.</b> Cuando una empresa que hubiese estado incursa en presunción de anormalidad hubiera resultado adjudicataria del contrato, el órgano de contratación establecerá mecanismos adecuados para realizar un seguimiento pormenorizado de la ejecución del mismo, con el objetivo de garantizar la correcta ejecución del contrato sin que se produzca una merma en la calidad de los servicios, las obras o los suministros contratados.</p>", "dis": "<ul>\n<li><b>Parámetros de la <span class=\"t\" data-k=\"anormal\">oferta anormalmente baja</span> (149.2):</b> los <b>parámetros objetivos</b> que permitan identificar los casos de anormalidad deben <b>figurar en el pliego</b>. Cuando se utilice un solo criterio, se referirán al <b>precio</b>.</li>\n<li><b>Audiencia (149.4):</b> cuando la mesa o el órgano identifiquen una oferta incursa en presunción de anormalidad, <b>requerirán al licitador</b> para que <b>justifique y desglose razonada y detalladamente</b> el bajo nivel de los precios o costes, mediante la presentación de la información y documentos pertinentes.</li>\n<li><b>Contenido de la justificación:</b> puede referirse al <b>ahorro del procedimiento</b> de fabricación o prestación, las <b>soluciones técnicas</b> adoptadas, las <b>condiciones excepcionalmente favorables</b> de que disponga, la <b>originalidad</b> de la prestación, el respeto de las <b>obligaciones medioambientales, sociales y laborales</b> y la posible obtención de una <b>ayuda de Estado</b>.</li>\n<li><b>Rechazo obligado:</b> se rechazará la oferta si se comprueba que es anormalmente baja porque <b>vulnera la normativa sobre subcontratación</b> o <b>no cumple las obligaciones aplicables en materia medioambiental, social o laboral</b>, incluido el incumplimiento de los convenios colectivos sectoriales vigentes.</li>\n<li><b>Decisión (149.6):</b> si el órgano de contratación, considerando la justificación y los informes, estima que la información <b>no explica satisfactoriamente</b> el bajo nivel de los precios, <b>la oferta será excluida</b>.</li>\n</ul>", "llano": "<p>Cuando una oferta es tan barata que no parece creíble, no se tira a la basura: se llama al licitador y se le pide que explique por escrito cómo puede hacerlo a ese precio. Si lo explica bien, gana. Si no lo explica, se le excluye.</p>\n<p>Y hay un caso en que se rechaza sí o sí: cuando la baja se sostiene incumpliendo el convenio colectivo o la normativa social o medioambiental.</p>", "porque": "<p>Porque una baja temeraria admitida sin más acaba en obras paradas, servicios deficientes y modificados al alza. Pero excluir automáticamente al más barato sería aún peor: penalizaría a la empresa realmente más eficiente.</p>\n<p>El art. 149 resuelve la tensión con un <b>trámite de audiencia</b>. Y la exclusión obligatoria por incumplimiento del convenio convierte la contratación pública en un instrumento de tutela laboral: no se puede ganar un contrato público pagando por debajo del convenio.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> un presupuesto de reforma un 40 % más barato que los demás. No lo descartas de entrada: preguntas qué materiales usa y si tiene los seguros en regla.</li>\n<li><b>Real:</b> en la limpieza de seis colegios con presupuesto base de 318.000 €, una empresa oferta 198.000 €. El pliego fijaba como parámetro de anormalidad una baja superior al 25 % sobre la media. Se le requiere justificación: aporta desglose salarial conforme al convenio provincial, una ratio de horas inferior compatible con el PPT y ahorro por maquinaria propia amortizada. El órgano <b>admite</b> la oferta.</li>\n<li><b>Caso límite:</b> si el desglose salarial arrojase un coste/hora inferior al del convenio, el rechazo <b>no sería facultativo</b>: el art. 149.4 obliga a excluirla.</li>\n</ul>", "noej": "<ul>\n<li><b>No se rechaza automáticamente</b> una oferta por estar incursa en presunción de anormalidad: sin audiencia previa, la exclusión es nula.</li>\n<li><b>No se presume anormal</b> lo que el pliego no haya definido como tal: los parámetros deben figurar en el pliego.</li>\n<li><b>No es lo mismo</b> «anormalmente baja» que «inviable»: la primera es una presunción que admite prueba en contrario.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 107.2:</b> la oferta incursa en presunción de anormalidad justifica la <b>garantía complementaria</b>.</li>\n<li><b>Art. 158.3:</b> los plazos para adjudicar se amplían en <b>quince días hábiles</b> si hay que seguir estos trámites.</li>\n<li><b>Art. 102.3:</b> el precio debe permitir el efectivo cumplimiento del contrato.</li>\n<li><b>Art. 159.4:</b> especialidades del abierto simplificado.</li>\n<li><b>Art. 201:</b> obligaciones en materia medioambiental, social y laboral.</li>\n</ul>", "trampas": "<ul>\n<li>La secuencia es <b>identificar → requerir → informar → decidir</b>. Saltarse el requerimiento invalida la exclusión.</li>\n<li>El rechazo es <b>obligatorio</b> si la baja se sostiene en incumplir subcontratación o normativa social, laboral o medioambiental.</li>\n<li>Los <b>parámetros</b> van en el <b>pliego</b>, no se improvisan en la mesa.</li>\n</ul>", "ancla": "<p><b>«Barato no es delito: no explicarlo, sí.»</b></p>\n<p>Y la excepción sin salida: si la baja se paga con el sueldo de los trabajadores, fuera.</p>", "vis": "<svg viewBox=\"0 0 960 418\" role=\"img\" aria-label=\"Tramitación de las ofertas incursas en presunción de anormalidad\" style=\"width:100%;height:auto\"><defs><marker id=\"fl6\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr6\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe6\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw6\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"250\" y=\"8\" width=\"460\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"27.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">OFERTAS ANORMALMENTE BAJAS · ART. 149</text><rect x=\"20\" y=\"52\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"30\" y=\"66\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"120\" y=\"83\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--acc)\">1 · SE IDENTIFICA</text><text x=\"224\" y=\"74\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Los parámetros objetivos que permiten identificar la anormalidad</text><text x=\"224\" y=\"88\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">deben figurar en el PLIEGO. Con un solo criterio, se refieren al precio.</text><text x=\"930\" y=\"74\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">149.2</text><path d=\"M480 107 L 480 115\" stroke=\"var(--acc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl6)\"/><rect x=\"20\" y=\"116\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"30\" y=\"130\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"120\" y=\"147\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--warn)\">2 · SE PIDE JUSTIFICACIÓN</text><text x=\"224\" y=\"138\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">El órgano requiere al licitador para que justifique y desglose</text><text x=\"224\" y=\"152\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">razonadamente el bajo nivel de los precios o costes.</text><text x=\"930\" y=\"138\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">149.4</text><path d=\"M480 171 L 480 179\" stroke=\"var(--warn)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl6)\"/><rect x=\"20\" y=\"180\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"30\" y=\"194\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"120\" y=\"211\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--warn)\">3 · SE INFORMA</text><text x=\"224\" y=\"202\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">La justificación se pide por escrito y se evalúa con el asesoramiento</text><text x=\"224\" y=\"216\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">técnico del servicio correspondiente.</text><text x=\"930\" y=\"202\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">149.4</text><path d=\"M480 235 L 480 243\" stroke=\"var(--warn)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl6)\"/><rect x=\"20\" y=\"244\" width=\"920\" height=\"40\" rx=\"10\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><rect x=\"30\" y=\"251\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--exc)\"/><text x=\"120\" y=\"268\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--exc)\">4 · SE DECIDE</text><text x=\"224\" y=\"266\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Si la oferta se justifica, se admite. Si no, se RECHAZA.</text><text x=\"930\" y=\"266\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">149.6</text><path d=\"M480 285 L 480 293\" stroke=\"var(--exc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl6)\"/><rect x=\"20\" y=\"294\" width=\"920\" height=\"68\" rx=\"10\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><rect x=\"30\" y=\"315\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--exc)\"/><text x=\"120\" y=\"332\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--exc)\">RECHAZO OBLIGADO</text><text x=\"224\" y=\"316\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Si se comprueba que la oferta es anormalmente baja porque VULNERA</text><text x=\"224\" y=\"330\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">LA NORMATIVA SOBRE SUBCONTRATACIÓN o las obligaciones aplicables</text><text x=\"224\" y=\"344\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">en materia medioambiental, social o laboral.</text><text x=\"930\" y=\"316\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">149.4</text><rect x=\"20\" y=\"372\" width=\"920\" height=\"34\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"480\" y=\"392.328\" text-anchor=\"middle\" font-size=\"10.4\" fill=\"currentColor\">Una oferta anormalmente baja NO se rechaza automáticamente: primero hay que oír al licitador. Rechazarla sin audiencia es el vicio más frecuente.</text></svg>"}, {"n": 150, "t": "Clasificación de las ofertas y adjudicación del contrato", "ubic": "Libro II ▸ Título I ▸ Capítulo I ▸ Sección 2.ª ▸ Subsección 4.ª · Adjudicación · Criterios y clasificación", "idea": "Se clasifican por orden decreciente, se requiere al mejor con diez días hábiles y se adjudica en cinco.", "literal": "<p><b>1.</b> La mesa de contratación o, en su defecto, el órgano de contratación clasificará, por orden decreciente, las proposiciones presentadas para posteriormente elevar la correspondiente propuesta al órgano de contratación, en el caso de que la clasificación se realice por la mesa de contratación. Para realizar la citada clasificación, se atenderá a los criterios de adjudicación señalados en el pliego, pudiéndose solicitar para ello cuantos informes técnicos se estime pertinentes. Cuando el único criterio a considerar sea el precio, se entenderá que la mejor oferta es la que incorpora el precio más bajo. En los contratos sujetos a regulación armonizada que celebren cualquiera de las entidades sujetas a la presente ley, si se apreciasen indicios fundados de conductas colusorias en el procedimiento de contratación en tramitación, en el sentido definido en el artículo 1 de la Ley 15/2007, de 3 de julio, de Defensa de la Competencia, el órgano de contratación, de oficio o a instancia de la mesa de contratación, los trasladará con carácter previo a la adjudicación del contrato a la Comisión Nacional de los Mercados y la Competencia o, en su caso, a la autoridad de competencia autonómica correspondiente con el fin de que, en el plazo de 20 días hábiles, emita un informe sobre el carácter fundado o no de tales indicios. El traslado a que alude el párrafo anterior deberá incluir una explicación detallada sobre los indicios detectados y sobre las razones para considerar su carácter presuntamente colusorio e irá acompañado del expediente de contratación, incluida la totalidad de las ofertas presentadas por todos los licitadores, sin perjuicio del deber de confidencialidad previsto en el art. 133 LCSP. La autoridad de defensa de la competencia podrá solicitar documentación adicional al órgano de contratación siempre que guarde relación con los indicios mencionados en la remisión. En este supuesto, deberá ponerse la documentación requerida a disposición de la autoridad de competencia en un plazo máximo de 3 días hábiles. La remisión de esta documentación a la autoridad de defensa de la competencia correspondiente supondrá la inmediata suspensión de la licitación, la cual no será notificada a los licitadores ni tampoco será objeto de publicación. El órgano de contratación deberá mantener en todo momento la debida confidencialidad de estas actuaciones. Una vez recibido el informe de la autoridad de competencia, si el mismo no concluye que existen tales indicios fundados de conductas colusorias, el órgano de contratación dictará resolución alzando la suspensión, que tampoco será objeto de notificación ni publicación, y continuará con la tramitación del procedimiento de contratación sin la exclusión de ningún licitador por este motivo. En caso de que el informe concluyese que existen indicios fundados de conducta colusoria, el órgano de contratación notificará y publicará la suspensión y remitirá a los licitadores afectados la documentación necesaria para que en un plazo de diez días hábiles aleguen cuanto tengan por conveniente en defensa de sus derechos. El órgano de contratación cuidará de que los licitadores afectados reciban toda la documentación necesaria para el ejercicio de su derecho, pero sin revelar aspectos de las ofertas del resto de licitadores, si ya se hubiesen presentado, y con respeto al deber de confidencialidad previsto en el artículo 133 de esta ley. Una vez evacuado este trámite, el órgano de contratación podrá recabar de la Comisión Nacional de los Mercados y la Competencia o, en su caso, de la autoridad de competencia autonómica correspondiente los informes que juzgue necesarios para resolver, que deberán ser emitidos en el plazo improrrogable de 3 días hábiles. A la vista de los informes obrantes en el procedimiento, de las alegaciones y pruebas de los licitadores afectados y de las medidas que en su caso estos acrediten haber adoptado para evitar futuras infracciones, el órgano de contratación resolverá de forma motivada lo que proceda en el plazo de 10 días hábiles. Si el órgano de contratación resuelve que existen indicios fundados de conductas colusorias excluirá del procedimiento de contratación a los licitadores responsables de dicha conducta y lo notificará a todos los licitadores, alzando la suspensión y continuando el procedimiento de contratación con los licitadores restantes, si los hubiere. Si resuelve que no existen indicios fundados de conducta colusoria, alzará la suspensión y continuará la tramitación del procedimiento de contratación sin la exclusión de ningún licitador por este motivo. En caso de no recibir el informe de la autoridad de competencia en el plazo de 20 días hábiles, el órgano de contratación podrá acordar continuar con la tramitación del procedimiento o iniciar el procedimiento contradictorio establecido en este apartado. En este último caso, si el órgano de contratación recibiera el informe de la autoridad de competencia antes de haber dictado su resolución, no procederá acordar la exclusión de ningún licitador cuando dicho informe no concluya que existen indicios fundados de conducta colusoria. Igualmente, si el órgano de contratación recibiera el informe en el mencionado sentido una vez dictada la resolución que acuerde la exclusión de algún licitador, podrá revocar dicha resolución si así lo considera procedente siempre que aún no se hubiera adjudicado el contrato. El órgano de contratación comunicará la resolución de adjudicación del contrato a la Comisión Nacional de los Mercados y la Competencia o, en su caso, a la autoridad de competencia autonómica correspondiente, por medios electrónicos el mismo día en que se acuerde. Esta comunicación hará decaer cualquier solicitud de informe que no hubiera sido atendida hasta esa fecha, no pudiendo las autoridades de competencia emitir el informe a partir de ese momento.</p><p><b>2.</b> Una vez aceptada la propuesta de la mesa por el órgano de contratación, los servicios correspondientes requerirán al licitador que haya presentado la mejor oferta, de conformidad con lo dispuesto en el artículo 145 para que, dentro del plazo de diez días hábiles, a contar desde el siguiente a aquel en que hubiera recibido el requerimiento, presente la documentación justificativa de las circunstancias a las que se refieren las letras a) a c) del apartado 1 del artículo 140 si no se hubiera aportado con anterioridad, tanto del licitador como de aquellas otras empresas a cuyas capacidades se recurra, sin perjuicio de lo establecido en el segundo párrafo del apartado 3 del citado artículo; de disponer efectivamente de los medios que se hubiese comprometido a dedicar o adscribir a la ejecución del contrato conforme al artículo 76.2; y de haber constituido la garantía definitiva que sea procedente. Los correspondientes certificados podrán ser expedidos por medios electrónicos, informáticos o telemáticos, salvo que se establezca otra cosa en los pliegos. De no cumplimentarse adecuadamente el requerimiento en el plazo señalado, se entenderá que el licitador ha retirado su oferta, procediéndose a exigirle el importe del 3 por ciento del presupuesto base de licitación, IVA excluido, en concepto de penalidad, que se hará efectivo en primer lugar contra la garantía provisional, si se hubiera constituido, sin perjuicio de lo establecido en la letra a) del apartado 2 del artículo 71. En el supuesto señalado en el párrafo anterior, se procederá a recabar la misma documentación al licitador siguiente, por el orden en que hayan quedado clasificadas las ofertas.</p><p><b>3.</b> El órgano de contratación adjudicará el contrato dentro de los cinco días hábiles siguientes a la recepción de la documentación. En los procedimientos negociados, de diálogo competitivo y de asociación para la innovación, la adjudicación concretará y fijará los términos definitivos del contrato. No podrá declararse desierta una licitación cuando exista alguna oferta o proposición que sea admisible de acuerdo con los criterios que figuren en el pliego.</p><p><b>4.</b> Si como consecuencia del contenido de la resolución de un recurso especial del artículo 44 fuera preciso que el órgano de contratación acordase la adjudicación del contrato a otro licitador, se concederá a este un plazo de diez días hábiles para que cumplimente los trámites que resulten oportunos.</p>", "dis": "<ul>\n<li><b>Clasificación (150.1):</b> la <span class=\"t\" data-k=\"mesa\">mesa de contratación</span> o, en su defecto, el órgano de contratación <b>clasifica por orden decreciente</b> las proposiciones, atendiendo a los criterios del pliego y pudiendo solicitar los informes técnicos que estime pertinentes. Con criterio único de precio, la mejor oferta es la del <b>precio más bajo</b>.</li>\n<li><b>Conductas colusorias (150.1):</b> en contratos <b>SARA</b>, si se aprecian indicios fundados de <span class=\"t\" data-k=\"colusoria\">conductas colusorias</span>, el órgano los traslada <b>antes de la adjudicación</b> a la <b>CNMC</b> o a la autoridad autonómica, que emite informe en <b>20 días hábiles</b>; el órgano resuelve motivadamente en <b>10 días hábiles</b>, y si aprecia indicios fundados <b>excluye</b> del procedimiento.</li>\n<li><b>Requerimiento (150.2):</b> se requiere al licitador que ha presentado la <b>mejor oferta</b> para que, en <b>diez días hábiles</b> desde el siguiente a la recepción del requerimiento, presente la <b>documentación justificativa</b> y constituya la <b>garantía definitiva</b>. Si no se cumplimenta adecuadamente, <b>se entenderá que el licitador ha retirado su oferta</b> y se requerirá al siguiente por orden de clasificación.</li>\n<li><b>Adjudicación (150.3):</b> el órgano adjudica <b>dentro de los cinco días hábiles</b> siguientes a la recepción de la documentación.</li>\n<li><b>Nueva adjudicación (150.4):</b> si por resolución de un <b>recurso especial</b> del art. 44 fuera preciso adjudicar a otro licitador, se le concederá un plazo de <b>diez días hábiles</b> para que <b>cumplimente los trámites</b> oportunos.</li>\n</ul>", "llano": "<p>Terminada la valoración, se ordenan las ofertas de mejor a peor. Al primero se le pide que traiga los papeles y la fianza: tiene diez días hábiles. Si no los trae, se entiende que se retira y se llama al siguiente. Cuando llegan los papeles, hay cinco días hábiles para adjudicar.</p>\n<p>Y si después un tribunal estima un recurso y hay que dar el contrato a otro, ese otro tiene también diez días hábiles.</p>", "porque": "<p>Porque entre la valoración y la adjudicación hay que comprobar que quien va a ganar <b>puede</b> ganar: que está al corriente con Hacienda y la Seguridad Social, que no tiene prohibición de contratar y que deposita la garantía. Hacer esa comprobación con <b>todos</b> los licitadores sería absurdo; hacerla solo con el primero es eficiente.</p>\n<p>Y la consecuencia de no cumplir —«se entenderá que ha retirado su oferta»— evita que el procedimiento se bloquee: se pasa al siguiente sin necesidad de declarar nada.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> una lista de espera. Al primero se le llama y se le dan unos días para confirmar; si no responde, se pasa al segundo.</li>\n<li><b>Real:</b> en el servicio de socorrismo se clasifican cinco ofertas. El 4 de mayo se requiere a la mejor clasificada; el plazo de diez días hábiles vence el 19 de mayo. Presenta la documentación el 16 y constituye una garantía de 8.900 €. El órgano adjudica el 22 de mayo, <b>dentro de los cinco días hábiles</b> siguientes.</li>\n<li><b>Caso límite:</b> el 19 de mayo la empresa no ha presentado el certificado de estar al corriente con la Seguridad Social. Se entiende que <b>retira</b> su oferta y se requiere a la segunda clasificada, sin necesidad de un acuerdo de exclusión.</li>\n</ul>", "noej": "<ul>\n<li><b>No es una sanción</b> el efecto del incumplimiento del requerimiento: la ley lo configura como <b>retirada</b> de la oferta.</li>\n<li><b>No son días naturales</b>: el 150.2 y el 150.3 hablan de <b>días hábiles</b>.</li>\n<li><b>No se traslada a la CNMC</b> cualquier sospecha en cualquier contrato: el trámite del 150.1 se refiere a los contratos <b>sujetos a regulación armonizada</b>.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 145 y 146:</b> los criterios con los que se clasifica.</li>\n<li><b>Art. 107:</b> la garantía definitiva que hay que constituir en el requerimiento.</li>\n<li><b>Art. 151:</b> resolución y notificación de la adjudicación.</li>\n<li><b>Art. 153.3:</b> el plazo de espera antes de formalizar.</li>\n<li><b>Art. 44:</b> el recurso especial cuya estimación activa el 150.4.</li>\n<li><b>Art. 132.3:</b> deber de comunicar indicios a la autoridad de competencia.</li>\n</ul>", "trampas": "<ul>\n<li><b>10 días hábiles</b> para la documentación (150.2) y <b>5 días hábiles</b> para adjudicar (150.3). Se confunden con frecuencia.</li>\n<li>Los <b>10 días hábiles</b> del 150.4 —nueva adjudicación tras recurso— se confunden con los <b>15 días hábiles</b> de espera del art. 153.3. Son cosas distintas.</li>\n<li>La clasificación la hace la <b>mesa</b>; la adjudicación, el <b>órgano de contratación</b>.</li>\n</ul>", "ancla": "<p>Cadena de números: <b>10 · 5 · 15 · 10</b>. Diez días hábiles para los papeles · cinco para adjudicar · quince para publicar la adjudicación (art. 151.1) · diez hábiles si hay que readjudicar tras un recurso.</p>", "vis": "<svg viewBox=\"0 0 960 412\" role=\"img\" aria-label=\"Clasificación de ofertas, requerimiento, adjudicación y publicación\" style=\"width:100%;height:auto\"><defs><marker id=\"fl7\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr7\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe7\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw7\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"250\" y=\"8\" width=\"460\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"27.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">DE LA CLASIFICACIÓN A LA ADJUDICACIÓN · ARTS. 150 Y 151</text><rect x=\"20\" y=\"52\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"30\" y=\"66\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"120\" y=\"83\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--acc)\">CLASIFICAR</text><text x=\"224\" y=\"74\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">La mesa o el órgano clasifica las ofertas por orden decreciente,</text><text x=\"224\" y=\"88\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">aplicando los criterios del pliego.</text><text x=\"930\" y=\"74\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">150.1</text><path d=\"M480 107 L 480 115\" stroke=\"var(--acc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl7)\"/><rect x=\"20\" y=\"116\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"30\" y=\"130\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"120\" y=\"147\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--warn)\">REQUERIR · 10 días hábiles</text><text x=\"224\" y=\"138\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Se requiere al licitador que ha presentado la MEJOR OFERTA para que</text><text x=\"224\" y=\"152\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">presente la documentación justificativa y constituya la GARANTÍA DEFINITIVA.</text><text x=\"930\" y=\"138\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">150.2</text><path d=\"M480 171 L 480 179\" stroke=\"var(--warn)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl7)\"/><rect x=\"20\" y=\"180\" width=\"920\" height=\"40\" rx=\"10\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><rect x=\"30\" y=\"187\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--exc)\"/><text x=\"120\" y=\"204\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--exc)\">SI NO CUMPLE</text><text x=\"224\" y=\"202\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Se entiende que RETIRA su oferta y se requiere al siguiente.</text><text x=\"930\" y=\"202\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">150.2</text><path d=\"M480 221 L 480 229\" stroke=\"var(--exc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl7)\"/><rect x=\"20\" y=\"230\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><rect x=\"30\" y=\"244\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--ej)\"/><text x=\"120\" y=\"261\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--ej)\">ADJUDICAR · 5 días hábiles</text><text x=\"224\" y=\"252\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Dentro de los cinco días hábiles siguientes a la recepción de la</text><text x=\"224\" y=\"266\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">documentación. La resolución debe ser MOTIVADA.</text><text x=\"930\" y=\"252\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">150.3 y 151.1</text><path d=\"M480 285 L 480 293\" stroke=\"var(--ej)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl7)\"/><rect x=\"20\" y=\"294\" width=\"920\" height=\"40\" rx=\"10\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><rect x=\"30\" y=\"301\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--ej)\"/><text x=\"120\" y=\"318\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--ej)\">PUBLICAR · 15 días</text><text x=\"224\" y=\"316\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">La adjudicación se publica en el perfil de contratante.</text><text x=\"930\" y=\"316\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">151.1</text><path d=\"M480 335 L 480 343\" stroke=\"var(--ej)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl7)\"/><rect x=\"20\" y=\"344\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"30\" y=\"352\" width=\"180\" height=\"38\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"120\" y=\"368.5\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--warn)\">NUEVA ADJUDICACIÓN</text><text x=\"120\" y=\"381.5\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--warn)\">10 días hábiles</text><text x=\"224\" y=\"366\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Si por resolución de un recurso especial hay que adjudicar a otro</text><text x=\"224\" y=\"380\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">licitador, se le conceden diez días hábiles para cumplimentar trámites.</text><text x=\"930\" y=\"366\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">150.4</text></svg>"}, {"n": 151, "t": "Resolución y notificación de la adjudicación", "ubic": "Libro II ▸ Título I ▸ Capítulo I ▸ Sección 2.ª ▸ Subsección 4.ª · Adjudicación · Criterios y clasificación", "idea": "Resolución motivada, notificada a todos y publicada en el perfil en quince días, con datos suficientes para recurrir.", "literal": "<p><b>1.</b> La resolución de adjudicación deberá ser motivada y se notificará a los candidatos y licitadores, debiendo ser publicada en el perfil de contratante en el plazo de 15 días.</p><p><b>2.</b> Sin perjuicio de lo establecido en el apartado 1 del artículo 155, la notificación y la publicidad a que se refiere el apartado anterior deberán contener la información necesaria que permita a los interesados en el procedimiento de adjudicación interponer recurso suficientemente fundado contra la decisión de adjudicación, y entre ella en todo caso deberá figurar la siguiente:</p><p style=\"margin-left:1.1rem\">a) En relación con los candidatos descartados, la exposición resumida de las razones por las que se haya desestimado su candidatura.</p><p style=\"margin-left:1.1rem\">b) Con respecto a los licitadores excluidos del procedimiento de adjudicación, los motivos por los que no se haya admitido su oferta, incluidos, en los casos contemplados en el artículo 126, apartados 7 y 8, los motivos de la decisión de no equivalencia o de la decisión de que las obras, los suministros o los servicios no se ajustan a los requisitos de rendimiento o a las exigencias funcionales; y un desglose de las valoraciones asignadas a los distintos licitadores, incluyendo al adjudicatario.</p><p style=\"margin-left:1.1rem\">c) En todo caso, el nombre del adjudicatario, las características y ventajas de la proposición del adjudicatario determinantes de que haya sido seleccionada la oferta de este con preferencia respecto de las que hayan presentado los restantes licitadores cuyas ofertas hayan sido admitidas; y, en su caso, el desarrollo de las negociaciones o el diálogo con los licitadores. En la notificación se indicará el plazo en que debe procederse a la formalización del contrato conforme al apartado 3 del artículo 153 de la presente Ley.</p><p><b>3.</b> La notificación se realizará por medios electrónicos de conformidad con lo establecido en la disposición adicional decimoquinta.</p>", "dis": "<ul>\n<li><b>Forma de la <span class=\"t\" data-k=\"adjudic\">adjudicación</span> (151.1):</b> la resolución de adjudicación deberá ser <b>motivada</b> y se <b>notificará</b> a los candidatos y licitadores, debiendo ser <b>publicada en el perfil de contratante en el plazo de 15 días</b>.</li>\n<li><b>Contenido (151.2):</b> la notificación y la publicidad deben contener la información necesaria para permitir <b>interponer recurso suficientemente fundado</b> contra la decisión de adjudicación. En todo caso:\n <ul><li><b>a)</b> respecto de los <b>candidatos descartados</b>, la exposición resumida de las razones de la desestimación de su candidatura;</li>\n <li><b>b)</b> respecto de los <b>licitadores excluidos</b>, los motivos por los que no se admitió su oferta y un <b>desglose de las valoraciones</b> asignadas a los distintos licitadores, incluido el adjudicatario;</li>\n <li><b>c)</b> en todo caso, el <b>nombre del adjudicatario</b>, las <b>características y ventajas</b> de su proposición determinantes de que haya sido seleccionada, y la <b>fecha</b> en que la adjudicación adquirirá eficacia.</li></ul></li>\n<li><b>Medio (151.3):</b> la notificación se hace por <b>medios electrónicos</b>.</li>\n</ul>", "llano": "<p>La adjudicación se comunica a todos los que se presentaron, y se cuelga en el perfil en quince días. Y no basta con decir «ha ganado esta empresa»: hay que decir por qué, con las puntuaciones desglosadas, para que quien no esté de acuerdo pueda recurrir con conocimiento de causa.</p>", "porque": "<p>Porque un recurso solo puede ser efectivo si el recurrente sabe <b>qué</b> recurre. Una notificación que se limitara al nombre del ganador obligaría a recurrir a ciegas. El art. 151.2 impone lo contrario: un <b>desglose</b> de valoraciones y las <b>ventajas concretas</b> que decidieron el contrato.</p>\n<p>Es, en el fondo, la garantía de tutela efectiva trasladada al procedimiento de contratación.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> las notas de una oposición. No se publica solo quién aprueba: se publican las puntuaciones por ejercicio, para poder reclamar.</li>\n<li><b>Real:</b> adjudicado el servicio de socorrismo, la resolución notifica a las cinco empresas la tabla con las puntuaciones de cada criterio, indica que la ganadora obtuvo 94,3 puntos frente a 89,1 de la segunda por una mejor ratio de socorristas, e informa de que cabe recurso especial ante el tribunal administrativo correspondiente. Se publica en el perfil el mismo día.</li>\n<li><b>Caso límite:</b> una empresa fue excluida por defecto en la documentación. La notificación debe expresarle <b>los motivos concretos</b> de la no admisión, no una fórmula genérica.</li>\n</ul>", "noej": "<ul>\n<li><b>No basta</b> con publicar en el perfil: hay que <b>notificar</b> también a candidatos y licitadores.</li>\n<li><b>No es suficiente</b> indicar la puntuación total: el 151.2.b) exige el <b>desglose</b> de las valoraciones.</li>\n<li><b>No son quince días hábiles</b>: el 151.1 dice «en el plazo de 15 días» para la publicación.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 150:</b> la clasificación y el requerimiento previos.</li>\n<li><b>Art. 153.3:</b> el plazo de espera de quince días hábiles se cuenta desde la <b>remisión</b> de esta notificación.</li>\n<li><b>Art. 44 y 50:</b> recurso especial y plazo para interponerlo.</li>\n<li><b>Art. 155:</b> renuncia y desistimiento.</li>\n<li><b>Art. 63:</b> perfil de contratante.</li>\n</ul>", "trampas": "<ul>\n<li><b>Notificar</b> y <b>publicar</b> son dos obligaciones distintas y acumulativas.</li>\n<li>El contenido mínimo son <b>tres letras</b>: descartados, excluidos con desglose, y nombre y ventajas del adjudicatario.</li>\n<li>De aquí arranca el cómputo del art. 153.3: por eso importa la fecha de <b>remisión</b>.</li>\n</ul>", "ancla": "<p><b>«Se dice a quién, por qué y con qué notas.»</b></p>\n<p>Y el número: <b>15 días</b> para publicar la adjudicación en el perfil.</p>", "vis": "<svg viewBox=\"0 0 960 412\" role=\"img\" aria-label=\"Clasificación de ofertas, requerimiento, adjudicación y publicación\" style=\"width:100%;height:auto\"><defs><marker id=\"fl8\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr8\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe8\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw8\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"250\" y=\"8\" width=\"460\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"27.8

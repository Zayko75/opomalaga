sulas administrativas particulares los criterios o normas que se aplicarán cuando, como consecuencia de la aplicación de los criterios de adjudicación, un licitador pueda resultar adjudicatario de un número de lotes que exceda el máximo indicado en el anuncio y en el pliego. Estos criterios o normas en todo caso deberán ser objetivos y no discriminatorios. Salvo lo que disponga el pliego de cláusulas administrativas particulares, a efectos de las limitaciones previstas en las letras a) y b) anteriores, en las uniones de empresarios serán estas y no sus componentes las consideradas candidato o licitador. Podrá reservar alguno o algunos de los lotes para Centros Especiales de Empleo o para empresas de inserción, o un porcentaje mínimo de reserva de la ejecución de estos contratos en el marco de programas de empleo protegido, de conformidad con lo dispuesto en la Disposición adicional cuarta. Igualmente se podrán reservar lotes a favor de las entidades a que se refiere la Disposición adicional cuadragésima octava, en las condiciones establecidas en la citada disposición.</p><p><b>5.</b> Cuando el órgano de contratación hubiera decidido proceder a la división en lotes del objeto del contrato y, además, permitir que pueda adjudicarse más de un lote al mismo licitador, aquel podrá adjudicar a una oferta integradora, siempre y cuando se cumplan todos y cada uno de los requisitos siguientes:</p><p style=\"margin-left:1.1rem\">a) Que esta posibilidad se hubiere establecido en el pliego que rija el contrato y se recoja en el anuncio de licitación. Dicha previsión deberá concretar la combinación o combinaciones que se admitirá, en su caso, así como la solvencia y capacidad exigida en cada una de ellas.</p><p style=\"margin-left:1.1rem\">b) Que se trate de supuestos en que existan varios criterios de adjudicación.</p><p style=\"margin-left:1.1rem\">c) Que previamente se lleve a cabo una evaluación comparativa para determinar si las ofertas presentadas por un licitador concreto para una combinación particular de lotes cumpliría mejor, en conjunto, los criterios de adjudicación establecidos en el pliego con respecto a dichos lotes, que las ofertas presentadas para los lotes separados de que se trate, considerados aisladamente.</p><p style=\"margin-left:1.1rem\">d) Que los empresarios acrediten la solvencia económica, financiera y técnica correspondiente, o, en su caso, la clasificación, al conjunto de lotes por los que licite.</p><p><b>6.</b> Cuando se proceda a la división en lotes, las normas procedimentales y de publicidad que deben aplicarse en la adjudicación de cada lote o prestación diferenciada se determinarán en función del valor acumulado del conjunto, calculado según lo establecido en el artículo 101, salvo que se dé alguna de las excepciones a que se refieren los artículos 20.2, 21.2 y 22.2.</p><p><b>7.</b> En los contratos adjudicados por lotes, y salvo que se establezca otra previsión en el pliego que rija el contrato, cada lote constituirá un contrato, salvo en casos en que se presenten ofertas integradoras, en los que todas las ofertas constituirán un contrato.</p>", "dis": "<ul>\n<li><b>99.1 · determinación:</b> el objeto «deberá ser determinado», y puede definirse por <b>necesidades o funcionalidades</b> concretas, sin cerrarlo a una solución única.</li>\n<li><b>99.2 · prohibición de <span class=\"t\" data-k=\"fraccion\">fraccionamiento</span>:</b> no puede fraccionarse un contrato <b>con la finalidad de disminuir su cuantía y eludir</b> los requisitos de publicidad o los del procedimiento de adjudicación.</li>\n<li><b>99.3 · la regla y su excepción:</b> siempre que la naturaleza o el objeto lo permitan, <b>deberá preverse</b> la división en <span class=\"t\" data-k=\"lote\">lotes</span>. El órgano puede <b>no dividir</b> cuando existan motivos válidos, <b>debidamente justificados en el expediente</b>, salvo en concesión de obras.\n <ul><li><b>a)</b> riesgo de <b>restringir injustificadamente la competencia</b> — exige <b>informe previo de la autoridad de defensa de la competencia</b>.</li>\n <li><b>b)</b> dificultad técnica de la ejecución independiente o necesidad de <b>coordinar</b> las prestaciones.</li></ul></li>\n<li><b>99.4 · limitaciones al licitar por lotes:</b> puede limitarse el número de lotes a los que se <b>puede ofertar</b> (a) y el número de lotes <b>adjudicables</b> a cada licitador (b), indicándolo en el anuncio y en el PCAP.</li>\n<li><b>99.5 · oferta integradora:</b> solo si estaba prevista en el pliego y en el anuncio, hay varios criterios de adjudicación, se hace evaluación comparativa previa y se acredita solvencia para el conjunto de lotes.</li>\n<li><b>99.6 · regla de acumulación:</b> las normas de procedimiento y publicidad se determinan por el <b>valor acumulado del conjunto</b> de lotes, calculado según el art. 101.</li>\n<li><b>99.7:</b> en contratos por lotes, <b>cada lote constituye un contrato</b>, salvo oferta integradora.</li>\n</ul>", "llano": "<p>Tres ideas. Primera: hay que saber exactamente qué se compra. Segunda: está prohibido partir una compra en trozos pequeños solo para que cada trozo caiga por debajo de un umbral y no haya que publicar. Tercera: partir el contrato en lotes <b>sí</b> está bien —y es lo normal— cuando se hace para que puedan entrar empresas pequeñas; lo que no se puede es <b>dejar de partirlo</b> sin explicar por qué.</p>", "porque": "<p>El fraccionamiento fraudulento fue durante décadas la forma más común de escapar de la ley: en vez de licitar una obra de 300.000 €, se firmaban ocho contratos menores. El 99.2 lo prohíbe atendiendo a la <b>finalidad</b>, no al resultado.</p>\n<p>La división en lotes persigue lo contrario: <b>abrir el mercado a la PYME</b>, en coherencia con el art. 28.2. Por eso la ley invierte la carga: no hay que justificar dividir, hay que justificar <b>no dividir</b>.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> comprar la compra semanal en un solo supermercado o repartirla entre la frutería, la carnicería y el súper. Repartir da opción a los pequeños; concentrar es más cómodo pero los deja fuera.</li>\n<li><b>Real:</b> una diputación licita el suministro de material de oficina para 43 centros por un valor estimado de 210.000 €. Divide en <b>tres lotes</b> —papel, consumibles informáticos y mobiliario— y limita a <b>dos</b> los lotes adjudicables a un mismo licitador, indicándolo en el anuncio y en el PCAP, con el criterio de desempate previsto en el pliego (art. 99.4.b).</li>\n<li><b>Caso límite:</b> la misma diputación quiere un único contratista porque la entrega debe coordinarse en un solo almacén. Puede no dividir, pero debe <b>justificarlo</b> en el expediente por la letra b) del 99.3, y ese motivo será revisable en un eventual recurso especial.</li>\n</ul>", "noej": "<ul>\n<li><b>No es fraccionamiento prohibido</b> licitar por separado la obra de un colegio y la de un polideportivo: son objetos distintos, no un objeto único troceado.</li>\n<li><b>No basta</b> con invocar la letra a) del 99.3: exige además <b>informe previo de la autoridad de competencia</b>.</li>\n<li><b>No cabe</b> la oferta integradora si no estaba prevista en el pliego <b>y</b> en el anuncio de licitación.</li>\n<li><b>No se aplica</b> la posibilidad de no dividir en los contratos de <b>concesión de obras</b>: ahí no hay excepción.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 116.4.g):</b> la justificación de la no división en lotes es contenido obligado del expediente.</li>\n<li><b>Art. 101.12:</b> cuando hay lotes separados, se computa el <b>valor global</b> de todos ellos.</li>\n<li><b>Arts. 20.2, 21.2 y 22.2:</b> las excepciones a la regla de acumulación del 99.6.</li>\n<li><b>Art. 118:</b> el contrato menor, principal tentación de fraccionamiento.</li>\n<li><b>Disposición adicional cuarta:</b> reserva de lotes a Centros Especiales de Empleo y empresas de inserción.</li>\n</ul>", "trampas": "<ul>\n<li>La regla es <b>dividir</b>; la excepción, no dividir. Muchas preguntas invierten la regla.</li>\n<li>El 99.2 prohíbe el fraccionamiento <b>con la finalidad de eludir</b>: si no hay esa finalidad, contratar por separado objetos distintos es lícito.</li>\n<li>Limitar los lotes a los que se <b>oferta</b> (a) no es lo mismo que limitar los que se <b>adjudican</b> (b).</li>\n<li>Cada lote es <b>un contrato</b> (99.7), pero el <b>valor estimado</b> se calcula sobre el conjunto (99.6). Parecen contradictorios y no lo son.</li>\n</ul>", "ancla": "<p><b>«Dividir es la regla; no dividir hay que explicarlo. Trocear para esconder está prohibido.»</b></p>\n<p>Diferencia con una imagen: <b>lotes</b> = una tarta cortada a la vista de todos, cada porción con su ganador. <b>Fraccionamiento</b> = esconder trozos de tarta debajo de la mesa para que nadie los vea.</p>", "vis": "<svg viewBox=\"0 0 960 510\" role=\"img\" aria-label=\"Determinación del objeto, prohibición de fraccionamiento y división en lotes\" style=\"width:100%;height:auto\"><defs><marker id=\"fl9\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr9\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe9\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw9\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"250\" y=\"8\" width=\"460\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"27.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">OBJETO DEL CONTRATO · ART. 99</text><rect x=\"20\" y=\"52\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"30\" y=\"66\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"120\" y=\"83\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--acc)\">DETERMINACIÓN</text><text x=\"224\" y=\"74\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">El objeto debe ser determinado. Puede definirse por necesidades</text><text x=\"224\" y=\"88\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">o funcionalidades, sin cerrarlo a una solución única.</text><text x=\"930\" y=\"74\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">99.1</text><path d=\"M480 107 L 480 115\" stroke=\"var(--acc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl9)\"/><rect x=\"20\" y=\"116\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><rect x=\"30\" y=\"130\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--exc)\"/><text x=\"120\" y=\"147\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--exc)\">PROHIBIDO FRACCIONAR</text><text x=\"224\" y=\"138\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">No puede fraccionarse un contrato CON LA FINALIDAD de disminuir</text><text x=\"224\" y=\"152\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">su cuantía y eludir la publicidad o el procedimiento.</text><text x=\"930\" y=\"138\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">99.2</text><path d=\"M480 171 L 480 179\" stroke=\"var(--exc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl9)\"/><rect x=\"20\" y=\"180\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><rect x=\"30\" y=\"194\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--ej)\"/><text x=\"120\" y=\"211\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--ej)\">REGLA: DIVIDIR EN LOTES</text><text x=\"224\" y=\"202\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Siempre que la naturaleza o el objeto lo permitan, deberá preverse</text><text x=\"224\" y=\"216\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">la realización independiente de cada parte mediante lotes.</text><text x=\"930\" y=\"202\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">99.3</text><path d=\"M480 235 L 480 243\" stroke=\"var(--ej)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl9)\"/><rect x=\"20\" y=\"244\" width=\"920\" height=\"82\" rx=\"10\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"30\" y=\"272\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"120\" y=\"289\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--warn)\">EXCEPCIÓN: NO DIVIDIR</text><text x=\"224\" y=\"266\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Solo por motivos válidos justificados en el expediente:</text><text x=\"224\" y=\"280\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">a) riesgo de restringir la competencia + informe de la autoridad de competencia</text><text x=\"224\" y=\"294\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">b) dificultad técnica o necesidad de coordinar las prestaciones.</text><text x=\"224\" y=\"308\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Nunca cabe en concesión de obras.</text><text x=\"930\" y=\"266\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">99.3</text><path d=\"M480 327 L 480 335\" stroke=\"var(--warn)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl9)\"/><rect x=\"20\" y=\"336\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"30\" y=\"350\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"120\" y=\"367\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--acc)\">LÍMITES AL LICITAR</text><text x=\"224\" y=\"358\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Puede limitarse el número de lotes a los que se OFERTA (a)</text><text x=\"224\" y=\"372\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">y el número de lotes ADJUDICABLES a cada licitador (b).</text><text x=\"930\" y=\"358\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">99.4</text><path d=\"M480 391 L 480 399\" stroke=\"var(--acc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl9)\"/><rect x=\"20\" y=\"400\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--panel)\" stroke=\"var(--line)\"/><rect x=\"30\" y=\"414\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--line)\"/><text x=\"120\" y=\"431\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"currentColor\">CÓMPUTO</text><text x=\"224\" y=\"422\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Las normas de procedimiento y publicidad se aplican por el VALOR</text><text x=\"224\" y=\"436\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">ACUMULADO del conjunto, aunque cada lote sea un contrato.</text><text x=\"930\" y=\"422\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">99.6 y 99.7</text><rect x=\"20\" y=\"464\" width=\"920\" height=\"34\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"480\" y=\"484.328\" text-anchor=\"middle\" font-size=\"10.4\" fill=\"currentColor\">Diferencia clave: LOTES = trocear a la vista de todos, para que entren más empresas. FRACCIONAMIENTO = trocear para esconder y esquivar la ley.</text></svg>"}, {"n": 100, "t": "Presupuesto base de licitación", "ubic": "Libro II ▸ Título I ▸ Capítulo I ▸ Sección 1.ª · Preparación · Disposiciones generales", "idea": "El techo máximo de gasto del contrato, IVA incluido, desglosado en costes.", "literal": "<p><b>1.</b> A los efectos de esta Ley, por presupuesto base de licitación se entenderá el límite máximo de gasto que en virtud del contrato puede comprometer el órgano de contratación, incluido el Impuesto sobre el Valor Añadido, salvo disposición en contrario.</p><p><b>2.</b> En el momento de elaborarlo, los órganos de contratación cuidarán de que el presupuesto base de licitación sea adecuado a los precios del mercado. A tal efecto, el presupuesto base de licitación se desglosará indicando en el pliego de cláusulas administrativas particulares o documento regulador de la licitación los costes directos e indirectos y otros eventuales gastos calculados para su determinación. En los contratos en que el coste de los salarios de las personas empleadas para su ejecución formen parte del precio total del contrato, el presupuesto base de licitación indicará de forma desglosada y con desagregación de género y categoría profesional los costes salariales estimados a partir del convenio laboral de referencia.</p><p><b>3.</b> Con carácter previo a la tramitación de un acuerdo marco o de un sistema dinámico de adquisición no será necesario que se apruebe un presupuesto base de licitación.</p>", "dis": "<ul>\n<li><b>Definición del <span class=\"t\" data-k=\"pbl\">presupuesto base de licitación</span> (100.1):</b> «límite máximo de gasto que en virtud del contrato puede comprometer el órgano de contratación, <b>incluido el Impuesto sobre el Valor Añadido</b>, salvo disposición en contrario».</li>\n<li><b>Adecuación al mercado (100.2):</b> debe ser adecuado a los precios de mercado y <b>desglosarse</b> en el PCAP indicando <b>costes directos e indirectos</b> y otros eventuales gastos.</li>\n<li><b>Desglose salarial:</b> cuando el coste de los salarios forme parte del precio total, se indicarán los <b>costes salariales estimados</b> a partir del convenio de referencia, con <b>desagregación de género y categoría profesional</b>.</li>\n<li><b>Excepción (100.3):</b> no es necesario aprobar presupuesto base de licitación con carácter previo a un <b>acuerdo marco</b> o a un <b>sistema dinámico de adquisición</b>.</li>\n</ul>", "llano": "<p>Es la cifra que el órgano de contratación se compromete a no rebasar. Va con IVA, porque es dinero que se paga de verdad, y hay que explicar de dónde sale: cuánto de mano de obra, cuánto de materiales, cuánto de gastos generales.</p>", "porque": "<p>Por dos razones. La primera, presupuestaria: hay que saber cuánto crédito se retiene. La segunda, y más moderna, <b>laboral</b>: al obligar a desglosar los costes salariales conforme al convenio, la ley impide que se liciten servicios intensivos en mano de obra por debajo del coste del convenio, lo que forzaba a las empresas a incumplirlo para ganar.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> el «no gasto más de 1.200 €» que te pones antes de reformar el baño. Ese es tu presupuesto base.</li>\n<li><b>Real:</b> un ayuntamiento licita la limpieza de seis colegios. Presupuesto base de licitación: <b>318.000 € IVA incluido</b> (262.809,92 € de base + 55.190,08 € de IVA). Desglose: 71 % costes salariales según el convenio provincial de limpieza de edificios, con detalle por categoría; 12 % materiales; 9 % gastos generales; 8 % beneficio industrial.</li>\n<li><b>Caso límite:</b> se va a tramitar un acuerdo marco para el suministro eléctrico. No hay que aprobar presupuesto base previo (100.3), porque el gasto se concretará en los contratos basados.</li>\n</ul>", "noej": "<ul>\n<li><b>No es el valor estimado.</b> El valor estimado va <b>sin</b> IVA e incluye prórrogas y modificaciones previstas; el presupuesto base va <b>con</b> IVA y es el techo de gasto.</li>\n<li><b>No es el precio.</b> El precio es lo que resulta de la adjudicación y suele ser <b>inferior</b> al presupuesto base.</li>\n<li><b>No hace falta</b> desglose salarial si los salarios no forman parte del precio total del contrato —por ejemplo, un suministro de material sin instalación—.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 101:</b> valor estimado, la otra cifra del expediente.</li>\n<li><b>Art. 102:</b> precio del contrato.</li>\n<li><b>Art. 116.3:</b> certificado de existencia de crédito, que se dimensiona sobre el presupuesto base.</li>\n<li><b>Art. 149:</b> ofertas anormalmente bajas, que se aprecian por referencia a este presupuesto.</li>\n</ul>", "trampas": "<ul>\n<li><b>CON IVA.</b> Es la diferencia clave con el valor estimado. Si la pregunta dice «sin incluir el IVA», habla del art. 101.</li>\n<li>El desglose por <b>género y categoría profesional</b> se olvida siempre y se pregunta a menudo.</li>\n<li>La excepción del 100.3 es solo para <b>acuerdo marco</b> y <b>sistema dinámico</b>, no para el procedimiento abierto simplificado.</li>\n</ul>", "ancla": "<p><b>PBL = Presupuesto Base de Licitación = «Puede Bajarse, Lo demás no».</b> Es el techo: las ofertas bajan desde ahí.</p>\n<p>Y para no confundirlo: <b>base</b> lleva IVA porque es la base sobre la que se gasta; <b>estimado</b> no lo lleva porque es una estimación para clasificar el contrato, no para pagarlo.</p>", "vis": "<svg viewBox=\"0 0 960 296\" role=\"img\" aria-label=\"Diferencia entre valor estimado, presupuesto base de licitación y precio\" style=\"width:100%;height:auto\"><defs><marker id=\"fl10\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr10\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe10\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw10\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"240\" y=\"8\" width=\"480\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"27.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">LAS TRES CIFRAS DE UN MISMO CONTRATO</text><rect x=\"20\" y=\"52\" width=\"290\" height=\"188\" rx=\"10\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"165\" y=\"76\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"var(--acc)\">VALOR ESTIMADO</text><text x=\"165\" y=\"95\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"var(--ink2)\">art. 101</text><rect x=\"40\" y=\"113\" width=\"250\" height=\"23\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"165\" y=\"129\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"var(--acc)\">SIN IVA</text><text x=\"165\" y=\"146\" text-anchor=\"middle\" font-size=\"9.4\" fill=\"currentColor\">Incluye prórrogas, opciones y</text><text x=\"165\" y=\"159\" text-anchor=\"middle\" font-size=\"9.4\" fill=\"currentColor\">modificaciones al alza previstas.</text><text x=\"165\" y=\"178\" text-anchor=\"middle\" font-size=\"9.6\" font-weight=\"700\" fill=\"var(--acc)\">Decide procedimiento,</text><text x=\"165\" y=\"191\" text-anchor=\"middle\" font-size=\"9.6\" font-weight=\"700\" fill=\"var(--acc)\">umbrales y recurso.</text><rect x=\"330\" y=\"52\" width=\"290\" height=\"188\" rx=\"10\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"475\" y=\"76\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"var(--warn)\">PRESUPUESTO BASE</text><text x=\"475\" y=\"91\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"var(--warn)\">DE LICITACIÓN</text><text x=\"475\" y=\"110\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"var(--ink2)\">art. 100</text><rect x=\"350\" y=\"128\" width=\"250\" height=\"23\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"475\" y=\"144\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"var(--warn)\">CON IVA</text><text x=\"475\" y=\"161\" text-anchor=\"middle\" font-size=\"9.4\" fill=\"currentColor\">Límite máximo de gasto que puede</text><text x=\"475\" y=\"174\" text-anchor=\"middle\" font-size=\"9.4\" fill=\"currentColor\">comprometer el órgano.</text><text x=\"475\" y=\"193\" text-anchor=\"middle\" font-size=\"9.6\" font-weight=\"700\" fill=\"var(--warn)\">Es el techo del gasto</text><text x=\"475\" y=\"206\" text-anchor=\"middle\" font-size=\"9.6\" font-weight=\"700\" fill=\"var(--warn)\">que se aprueba.</text><rect x=\"640\" y=\"52\" width=\"290\" height=\"188\" rx=\"10\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"785\" y=\"76\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"var(--ej)\">PRECIO</text><text x=\"785\" y=\"95\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"var(--ink2)\">art. 102</text><rect x=\"660\" y=\"113\" width=\"250\" height=\"36\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--ej)\"/><text x=\"785\" y=\"129\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"var(--ej)\">CON IVA como</text><text x=\"785\" y=\"142\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"var(--ej)\">partida independiente</text><text x=\"785\" y=\"159\" text-anchor=\"middle\" font-size=\"9.4\" fill=\"currentColor\">Cierto, se abona en función de la</text><text x=\"785\" y=\"172\" text-anchor=\"middle\" font-size=\"9.4\" fill=\"currentColor\">prestación realmente ejecutada.</text><text x=\"785\" y=\"191\" text-anchor=\"middle\" font-size=\"9.6\" font-weight=\"700\" fill=\"var(--ej)\">Es lo que se paga</text><text x=\"785\" y=\"204\" text-anchor=\"middle\" font-size=\"9.6\" font-weight=\"700\" fill=\"var(--ej)\">de verdad.</text><rect x=\"20\" y=\"248\" width=\"920\" height=\"40\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"480\" y=\"271.392\" text-anchor=\"middle\" font-size=\"10.6\" fill=\"currentColor\">Confundirlas es el error que más puntos cuesta: el valor estimado NUNCA lleva IVA; el presupuesto base y el precio, SÍ.</text></svg>"}, {"n": 101, "t": "Valor estimado", "ubic": "Libro II ▸ Título I ▸ Capítulo I ▸ Sección 1.ª · Preparación · Disposiciones generales", "idea": "El importe total sin IVA, con prórrogas y opciones dentro: la cifra que decide qué normas se aplican.", "literal": "<p><b>1.</b> A todos los efectos previstos en esta Ley, el valor estimado de los contratos será determinado como sigue:</p><p style=\"margin-left:1.1rem\">a) En el caso de los contratos de obras, suministros y servicios, el órgano de contratación tomará el importe total, sin incluir el Impuesto sobre el Valor Añadido, pagadero según sus estimaciones.</p><p style=\"margin-left:1.1rem\">b) En el caso de los contratos de concesión de obras y de concesión de servicios, el órgano de contratación tomará el importe neto de la cifra de negocios, sin incluir el Impuesto sobre el Valor Añadido, que según sus estimaciones, generará la empresa concesionaria durante la ejecución del mismo como contraprestación por las obras y los servicios objeto del contrato, así como de los suministros relacionados con estas obras y servicios.</p><p><b>2.</b> En el cálculo del valor estimado deberán tenerse en cuenta, como mínimo, además de los costes derivados de la aplicación de las normativas laborales vigentes, otros costes que se deriven de la ejecución material de los servicios, los gastos generales de estructura y el beneficio industrial. Asimismo deberán tenerse en cuenta:</p><p style=\"margin-left:1.1rem\">a) Cualquier forma de opción eventual y las eventuales prórrogas del contrato.</p><p style=\"margin-left:1.1rem\">b) Cuando se haya previsto abonar primas o efectuar pagos a los candidatos o licitadores, la cuantía de los mismos.</p><p style=\"margin-left:1.1rem\">c) En el caso de que, de conformidad con lo dispuesto en el artículo 204, se haya previsto en el pliego de cláusulas administrativas particulares o en el anuncio de licitación la posibilidad de que el contrato sea modificado, se considerará valor estimado del contrato el importe máximo que este pueda alcanzar, teniendo en cuenta la totalidad de las modificaciones al alza previstas. En los contratos de servicios y de concesión de servicios en los que sea relevante la mano de obra, en la aplicación de la normativa laboral vigente a que se refiere el párrafo anterior se tendrán especialmente en cuenta los costes laborales derivados de los convenios colectivos sectoriales de aplicación.</p><p><b>3.</b> Adicionalmente a lo previsto en el apartado anterior, en el cálculo del valor estimado de los contratos de concesión de obras y de concesión de servicios se tendrán en cuenta, cuando proceda, los siguientes conceptos:</p><p style=\"margin-left:1.1rem\">a) La renta procedente del pago de tasas y multas por los usuarios de las obras o servicios, distintas de las recaudadas en nombre del poder adjudicador.</p><p style=\"margin-left:1.1rem\">b) Los pagos o ventajas financieras, cualquiera que sea su forma, concedidos al concesionario por el poder adjudicador o por cualquier otra autoridad pública, incluida la compensación por el cumplimiento de una obligación de servicio público y subvenciones a la inversión pública.</p><p style=\"margin-left:1.1rem\">c) El valor de los subsidios o ventajas financieras, cualquiera que sea su forma, procedentes de terceros a cambio de la ejecución de la concesión.</p><p style=\"margin-left:1.1rem\">d) El precio de la venta de cualquier activo que forme parte de la concesión.</p><p style=\"margin-left:1.1rem\">e) El valor de todos los suministros y servicios que el poder adjudicador ponga a disposición del concesionario, siempre que sean necesarios para la ejecución de las obras o la prestación de servicios.</p><p><b>4.</b> La elección del método para calcular el valor estimado no podrá efectuarse con la intención de sustraer el contrato a la aplicación de las normas de adjudicación que correspondan.</p><p><b>5.</b> El método de cálculo aplicado por el órgano de contratación para calcular el valor estimado en todo caso deberá figurar en los pliegos de cláusulas administrativas particulares.</p><p><b>6.</b> Cuando un órgano de contratación esté compuesto por unidades funcionales separadas, se tendrá en cuenta el valor total estimado para todas las unidades funcionales individuales. No obstante lo anterior, cuando una unidad funcional separada sea responsable de manera autónoma respecto de su contratación o de determinadas categorías de ella, los valores pueden estimarse al nivel de la unidad de que se trate. En todo caso, se entenderá que se da la circunstancia aludida en el párrafo anterior cuando dicha unidad funcional separada cuente con financiación específica y con competencias respecto a la adjudicación del contrato.</p><p><b>7.</b> La estimación deberá hacerse teniendo en cuenta los precios habituales en el mercado, y estar referida al momento del envío del anuncio de licitación o, en caso de que no se requiera un anuncio de este tipo, al momento en que el órgano de contratación inicie el procedimiento de adjudicación del contrato.</p><p><b>8.</b> En los contratos de obras el cálculo del valor estimado debe tener en cuenta el importe de las mismas así como el valor total estimado de los suministros necesarios para su ejecución que hayan sido puestos a disposición del contratista por el órgano de contratación.</p><p><b>9.</b> En los contratos de suministro que tengan por objeto el arrendamiento financiero, el arrendamiento o la venta a plazos de productos, el valor que se tomará como base para calcular el valor estimado del contrato será el siguiente:</p><p style=\"margin-left:1.1rem\">a) En el caso de contratos de duración determinada, cuando su duración sea igual o inferior a doce meses, el valor total estimado para la duración del contrato; cuando su duración sea superior a doce meses, su valor total, incluido el importe estimado del valor residual.</p><p style=\"margin-left:1.1rem\">b) En el caso de contratos cuya duración no se fije por referencia a un período de tiempo determinado, el valor mensual multiplicado por 48.</p><p><b>10.</b> En los contratos de suministro o de servicios que tengan un carácter de periodicidad, o de contratos que se deban renovar en un período de tiempo determinado, se tomará como base para el cálculo del valor estimado del contrato alguna de las siguientes cantidades:</p><p style=\"margin-left:1.1rem\">a) El valor real total de los contratos sucesivos similares adjudicados durante el ejercicio precedente o durante los doce meses previos, ajustado, cuando sea posible, en función de los cambios de cantidad o valor previstos para los doce meses posteriores al contrato inicial.</p><p style=\"margin-left:1.1rem\">b) El valor estimado total de los contratos sucesivos adjudicados durante los doce meses siguientes a la primera entrega o en el transcurso del ejercicio, si este fuera superior a doce meses.</p><p><b>11.</b> En los contratos de servicios, a los efectos del cálculo de su valor estimado, se tomarán como base, en su caso, las siguientes cantidades:</p><p style=\"margin-left:1.1rem\">a) En los servicios de seguros, la prima pagadera y otras formas de remuneración.</p><p style=\"margin-left:1.1rem\">b) En servicios bancarios y otros servicios financieros, los honorarios, las comisiones, los intereses y otras formas de remuneración.</p><p style=\"margin-left:1.1rem\">c) En los contratos relativos a un proyecto, los honorarios, las comisiones pagaderas y otras formas de remuneración, así como las primas o contraprestaciones que, en su caso, se fijen para los participantes en el concurso.</p><p style=\"margin-left:1.1rem\">d) En los contratos de servicios en que no se especifique un precio total, si tienen una duración determinada igual o inferior a cuarenta y ocho meses, el valor total estimado correspondiente a toda su duración. Si la duración es superior a cuarenta y ocho meses o no se encuentra fijada por referencia a un período de tiempo cierto, el valor mensual multiplicado por 48.</p><p><b>12.</b> Cuando la realización de una obra, la contratación de unos servicios o la obtención de unos suministros destinados a usos idénticos o similares pueda dar lugar a la adjudicación simultánea de contratos por lotes separados, se deberá tener en cuenta el valor global estimado de la totalidad de dichos lotes. Igualmente, cuando una obra o un servicio propuestos puedan derivar en la adjudicación simultánea de contratos de concesión de obras o de concesión de servicios por lotes separados, deberá tenerse en cuenta el valor global estimado de todos los lotes.</p><p><b>13.</b> Para los acuerdos marco y para los sistemas dinámicos de adquisición se tendrá en cuenta el valor máximo estimado, excluido el Impuesto sobre el Valor Añadido, del conjunto de contratos previstos durante la duración total del acuerdo marco o del sistema dinámico de adquisición.</p><p><b>14.</b> En el procedimiento de asociación para la innovación se tendrá en cuenta el valor máximo estimado, excluido el Impuesto sobre el Valor Añadido, de las actividades de investigación y desarrollo que esté previsto que se realicen a lo largo de la duración total de la asociación, y de los suministros, servicios u obras que esté previsto que se ejecuten o adquieran al final de la asociación prevista.</p>", "dis": "<ul>\n<li><b>Regla base del <span class=\"t\" data-k=\"ve\">valor estimado</span> (101.1.a):</b> en obras, suministros y servicios, «el importe total, <b>sin incluir el Impuesto sobre el Valor Añadido</b>, pagadero según sus estimaciones».</li>\n<li><b>Concesiones (101.1.b):</b> el <b>importe neto de la cifra de negocios</b> sin IVA que generará la concesionaria durante la ejecución.</li>\n<li><b>Qué debe incluirse como mínimo (101.2):</b> costes de aplicación de las normativas laborales, costes de ejecución material, <b>gastos generales de estructura</b> y <b>beneficio industrial</b>. Y además:\n <ul><li><b>a)</b> «cualquier forma de <b>opción eventual</b> y las eventuales <b>prórrogas</b> del contrato».</li>\n <li><b>b)</b> las <b>primas o pagos</b> a candidatos o licitadores.</li>\n <li><b>c)</b> si el pliego prevé modificaciones (art. 204), el <b>importe máximo</b> que el contrato pueda alcanzar con todas las modificaciones al alza.</li></ul></li>\n<li><b>Prohibición (101.4):</b> la elección del método no puede hacerse «con la intención de sustraer el contrato a la aplicación de las normas de adjudicación».</li>\n<li><b>Transparencia (101.5):</b> el método de cálculo <b>debe figurar en el PCAP</b>.</li>\n<li><b>Momento (101.7):</b> se refiere al <b>envío del anuncio de licitación</b> o, si no lo hay, al inicio del procedimiento de adjudicación.</li>\n<li><b>Reglas especiales:</b> arrendamiento sin plazo cierto → <b>valor mensual × 48</b> (101.9.b); contratos periódicos → valor real del ejercicio precedente o estimado de los doce meses siguientes (101.10); servicios sin precio total y duración superior a 48 meses → <b>valor mensual × 48</b> (101.11.d); lotes → <b>valor global de todos</b> (101.12).</li>\n</ul>", "llano": "<p>Es la cifra con la que la ley clasifica el contrato. No es lo que se va a pagar: es lo máximo que el contrato podría llegar a costar, sin IVA, contando prórrogas, opciones y las subidas que el pliego ya prevea.</p>\n<p>Se calcula así porque de esa cifra depende todo lo demás: si es un contrato menor, si hay que publicar en el diario europeo, si cabe recurso especial y qué procedimiento se puede usar.</p>", "porque": "<p>Porque si el valor estimado se calculara sobre el periodo inicial y sin prórrogas, bastaría con firmar «un año prorrogable por cuatro» para que un contrato de 500.000 € pareciera de 100.000 y escapara de la publicidad europea. El art. 101 <b>cierra esa puerta</b> obligando a mirar el techo máximo del contrato a lo largo de toda su vida posible.</p>\n<p>Y el 101.4 remata: aunque el cálculo sea aritméticamente defendible, si se eligió el método <b>para</b> esquivar la ley, es ilícito.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> el precio real de un móvil «a plazos» no es la cuota mensual: es la cuota por los meses del contrato, más el pago final si te quedas el teléfono. Eso es el valor estimado.</li>\n<li><b>Real:</b> una diputación licita el <b>renting de 30 vehículos</b>: 48 meses a 1.950 €/mes por vehículo más IVA, prorrogable 12 meses más, con opción de compra final de 60.000 €. Valor estimado = 30 × 1.950 × (48+12) + 60.000 = <b>3.570.000 €</b>. Muy por encima del umbral de suministros: contrato <b>SARA</b>, con publicidad europea y recurso especial.</li>\n<li><b>Caso límite:</b> un contrato de servicios de 14.900 € sin IVA, un año, <b>sin</b> prórrogas ni opciones. Valor estimado 14.900 € &lt; 15.000 €: es <b>contrato menor</b>. Si el mismo contrato previera una prórroga de un año, el valor estimado sería 29.800 € y dejaría de serlo.</li>\n</ul>", "noej": "<ul>\n<li><b>No entra el IVA.</b> Nunca. Ni en la letra a) ni en la b) del 101.1.</li>\n<li><b>No es el presupuesto base de licitación</b>, que sí lo incluye (art. 100.1).</li>\n<li><b>No se computan</b> las modificaciones <b>imprevistas</b> del art. 205: solo las <b>previstas</b> en el pliego conforme al art. 204.</li>\n<li><b>No se calcula lote a lote</b> para decidir el procedimiento: se toma el <b>valor global</b> (101.12 y 99.6).</li>\n</ul>", "conex": "<ul>\n<li><b>Arts. 20 a 23:</b> umbrales de la regulación armonizada, que se comparan con esta cifra.</li>\n<li><b>Art. 118.1:</b> los 40.000 y 15.000 € del contrato menor son de <b>valor estimado</b>.</li>\n<li><b>Art. 44:</b> el recurso especial depende del valor estimado del contrato.</li>\n<li><b>Art. 159:</b> los umbrales del abierto simplificado, también en valor estimado.</li>\n<li><b>Art. 116.4.d):</b> el valor estimado debe justificarse en el expediente «con una indicación de todos los conceptos que lo integran».</li>\n<li><b>Art. 204:</b> modificaciones previstas, cuyo importe máximo entra en el cálculo.</li>\n</ul>", "trampas": "<ul>\n<li>La trampa número uno del examen: dar el importe <b>«IVA incluido»</b>. Divide entre 1,21 antes de comparar con cualquier umbral.</li>\n<li>«<b>Eventuales prórrogas</b>» significa las <b>previstas</b>, aunque no se sepa si se usarán. Se cuentan igual.</li>\n<li>El <b>×48</b> aparece dos veces: arrendamientos sin plazo cierto (101.9.b) y servicios sin precio total de duración indeterminada o superior a 48 meses (101.11.d).</li>\n<li>Momento de referencia: el <b>envío del anuncio</b>, no la fecha de la resolución de inicio.</li>\n</ul>", "ancla": "<p><b>«Sin IVA, con todo lo demás.»</b></p>\n<p>Y para las tres letras del 101.2: <b>O-P-M</b> — <b>O</b>pciones · <b>P</b>rórrogas y <b>P</b>rimas · <b>M</b>odificaciones previstas. Todo lo que <b>pueda</b> pasar, cuenta.</p>", "vis": "<svg viewBox=\"0 0 960 296\" role=\"img\" aria-label=\"Qué entra y qué no entra en el valor estimado del contrato\" style=\"width:100%;height:auto\"><defs><marker id=\"fl11\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr11\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe11\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw11\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"250\" y=\"8\" width=\"460\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"27.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">VALOR ESTIMADO · ART. 101 · LA CIFRA QUE LO DECIDE TODO</text><rect x=\"20\" y=\"52\" width=\"440\" height=\"150\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"240\" y=\"78.68\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--ej)\">SÍ ENTRA EN EL VALOR ESTIMADO</text><text x=\"240\" y=\"91.68\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">Importe total pagadero, SIN IVA (101.1.a)</text><text x=\"240\" y=\"104.68\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">Cualquier forma de opción eventual (101.2.a)</text><text x=\"240\" y=\"117.68\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">Las eventuales prórrogas (101.2.a)</text><text x=\"240\" y=\"130.68\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">Primas o pagos a candidatos y licitadores (101.2.b)</text><text x=\"240\" y=\"143.68\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">El importe máximo de las modificaciones</text><text x=\"240\" y=\"156.68\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">al alza previstas en el pliego (101.2.c)</text><text x=\"240\" y=\"169.68\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">Costes laborales, gastos generales de</text><text x=\"240\" y=\"182.68\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">estructura y beneficio industrial (101.2)</text><rect x=\"500\" y=\"52\" width=\"440\" height=\"150\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"720\" y=\"78.68\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--exc)\">NO ENTRA</text><text x=\"720\" y=\"91.68\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">El IVA. Nunca. En ningún caso.</text><text x=\"720\" y=\"104.68\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\"></text><text x=\"720\" y=\"117.68\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">Cuidado: el PRESUPUESTO BASE DE LICITACIÓN</text><text x=\"720\" y=\"130.68\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">sí incluye el IVA (art. 100.1).</text><text x=\"720\" y=\"143.68\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">Son dos cifras distintas del mismo contrato:</text><text x=\"720\" y=\"156.68\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">· valor estimado → decide procedimiento y umbrales</text><text x=\"720\" y=\"169.68\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">· presupuesto base → es el techo de gasto</text><text x=\"720\" y=\"182.68\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">· precio → lo que se paga de verdad (art. 102)</text><path d=\"M230 204 L 230 226\" stroke=\"var(--ej)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl11)\"/><path d=\"M720 204 L 720 226\" stroke=\"var(--exc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl11)\"/><rect x=\"20\" y=\"228\" width=\"920\" height=\"60\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"480\" y=\"242.18\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--warn)\">PARA QUÉ SIRVE LA CIFRA</text><text x=\"480\" y=\"255.18\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">Determina si el contrato es MENOR (art. 118), si está sujeto a REGULACIÓN ARMONIZADA (arts. 20 a 23),</text><text x=\"480\" y=\"268.18\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">si cabe RECURSO ESPECIAL (art. 44) y si puede usarse el ABIERTO SIMPLIFICADO (art. 159).</text><text x=\"480\" y=\"281.18\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">Elegir el método de cálculo para esquivar esas normas está expresamente prohibido (art. 101.4).</text></svg>"}, {"n": 102, "t": "Precio", "ubic": "Libro II ▸ Título I ▸ Capítulo I ▸ Sección 1.ª · Preparación · Disposiciones generales", "idea": "Precio cierto, en euros, IVA como partida independiente y prohibido el pago aplazado.", "literal": "<p><b>1.</b> Los contratos del sector público tendrán siempre un precio cierto, que se abonará al contratista en función de la prestación realmente ejecutada y de acuerdo con lo pactado. En el precio se entenderá incluido el importe a abonar en concepto de Impuesto sobre el Valor Añadido, que en todo caso se indicará como partida independiente.</p><p><b>2.</b> Con carácter general el precio deberá expresarse en euros, sin perjuicio de que su pago pueda hacerse mediante la entrega de otras contraprestaciones en los casos en que esta u otras Leyes así lo prevean. No obstante lo anterior, en los contratos podrá preverse que la totalidad o parte del precio sea satisfecho en moneda distinta del euro. En este supuesto se expresará en la correspondiente divisa el importe que deba satisfacerse en esa moneda, y se incluirá una estimación en euros del importe total del contrato.</p><p><b>3.</b> Los órganos de contratación cuidarán de que el precio sea adecuado para el efectivo cumplimiento del contrato mediante la correcta estimación de su importe, atendiendo al precio general de mercado, en el momento de fijar el presupuesto base de licitación y la aplicación, en su caso, de las normas sobre ofertas con valores anormales o desproporcionados. En aquellos servicios en los que el coste económico principal sean los costes laborales, deberán considerarse los términos económicos de los convenios colectivos sectoriales, nacionales, autonómicos y provinciales aplicables en el lugar de prestación de los servicios.</p><p><b>4.</b> El precio del contrato podrá formularse tanto en términos de precios unitarios referidos a los distintos componentes de la prestación o a las unidades de la misma que se entreguen o ejecuten, como en términos de precios aplicables a tanto alzado a la totalidad o a parte de las prestaciones del contrato.</p><p><b>5.</b> Los precios fijados en los contratos del sector público podrán ser revisados en los términos previstos en el Capítulo II de este Título, cuando deban ser ajustados, al alza o a la baja, para tener en cuenta las variaciones económicas de costes que acaezcan durante la ejecución del contrato.</p><p><b>6.</b> Los contratos, cuando su naturaleza y objeto lo permitan, podrán incluir cláusulas de variación de precios en función del cumplimiento o incumplimiento de determinados objetivos de plazos o de rendimiento, debiendo establecerse con precisión los supuestos en que se producirán estas variaciones y las reglas para su determinación, de manera que el precio sea determinable en todo caso.</p><p><b>7.</b> Excepcionalmente pueden celebrarse contratos con precios provisionales cuando, tras la tramitación de un procedimiento negociado, de un diálogo competitivo, o de un procedimiento de asociación para la innovación, se ponga de manifiesto que la ejecución del contrato debe comenzar antes de que la determinación del precio sea posible por la complejidad de las prestaciones o la necesidad de utilizar una técnica nueva, o que no existe información sobre los costes de prestaciones análogas y sobre los elementos técnicos o contables que permitan negociar con precisión un precio cierto. En los contratos celebrados con precios provisionales el precio se determinará, dentro de los límites fijados para el precio máximo, en función de los costes en que realmente incurra el contratista y del beneficio que se haya acordado, para lo que, en todo caso, se detallarán en el contrato los siguientes extremos:</p><p style=\"margin-left:1.1rem\">a) El procedimiento para determinar el precio definitivo, con referencia a los costes efectivos y a la fórmula de cálculo del beneficio.</p><p style=\"margin-left:1.1rem\">b) Las reglas contables que el adjudicatario deberá aplicar para determinar el coste de las prestaciones.</p><p style=\"margin-left:1.1rem\">c) Los controles documentales y sobre el proceso de producción que el adjudicador podrá efectuar sobre los elementos técnicos y contables del coste de producción. En los contratos celebrados con precios provisionales no cabrá la revisión de precios.</p><p><b>8.</b> Se prohíbe el pago aplazado del precio en los contratos de las Administraciones Públicas, excepto en los supuestos en que el sistema de pago se establezca mediante la modalidad de arrendamiento financiero o de arrendamiento con opción de compra, así como en los casos en que esta u otra Ley lo autorice expresamente.</p>", "dis": "<ul>\n<li><b>Certeza (102.1):</b> los contratos «tendrán <b>siempre</b> un precio cierto», abonable «en función de la <b>prestación realmente ejecutada</b>». El IVA se entiende incluido y <b>en todo caso se indicará como partida independiente</b>.</li>\n<li><b>Moneda (102.2):</b> con carácter general, en <b>euros</b>; cabe otra divisa si el contrato lo prevé, con estimación en euros del importe total.</li>\n<li><b>Adecuación al mercado (102.3):</b> el órgano cuida de que el precio permita el efectivo cumplimiento; en servicios intensivos en mano de obra, deben considerarse los <b>convenios colectivos</b> aplicables en el lugar de prestación.</li>\n<li><b>Formas (102.4):</b> <b>precios unitarios</b> o <b>a tanto alzado</b>.</li>\n<li><b>Revisión (102.5)</b> y <b>cláusulas de variación</b> por objetivos de plazo o rendimiento (102.6), que deben permitir que el precio sea determinable.</li>\n<li><b>Precios provisionales (102.7):</b> <b>excepcionales</b>, solo tras procedimiento <b>negociado</b>, <b>diálogo competitivo</b> o <b>asociación para la innovación</b>, y exigen detallar en el contrato el procedimiento para fijar el precio definitivo, las reglas contables y los controles. <b>No cabe revisión de precios</b> en ellos.</li>\n<li><b>Prohibición (102.8):</b> se prohíbe el <b>pago aplazado</b> en los contratos de las Administraciones Públicas, salvo arrendamiento financiero, arrendamiento con opción de compra o autorización legal expresa.</li>\n</ul>", "llano": "<p>El contrato tiene que decir cuánto se paga, o al menos cómo se calcula. Se paga por lo que se ha hecho de verdad, no por lo que se dijo que se haría. Y la Administración no puede comprar a plazos: paga cuando recibe.</p>", "porque": "<p>La prohibición del pago aplazado protege el <b>principio de anualidad presupuestaria</b>: si la Administración pudiera comprar hoy y pagar en diez años, el gasto real quedaría fuera del presupuesto del ejercicio y se ocultaría el endeudamiento. Por eso solo se admite en fórmulas —renting, leasing— donde el gasto se devenga periódicamente y sí figura en cada presupuesto.</p>\n<p>Y la referencia a los convenios colectivos evita el precio inviable: el que solo se puede cumplir pagando por debajo del convenio.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> el fontanero que cobra por hora trabajada (precio unitario) frente al que da un presupuesto cerrado por toda la reforma (tanto alzado).</li>\n<li><b>Real:</b> un ayuntamiento adjudica el asfaltado de calles con <b>precios unitarios</b>: 18,40 €/m² de aglomerado y 9,10 €/m de bordillo, con un presupuesto base de 240.000 € IVA incluido. Si finalmente se asfaltan 9.800 m², se paga por esos 9.800, no por los 11.000 previstos.</li>\n<li><b>Caso límite:</b> una diputación quiere renovar toda su flota pagando en cinco anualidades. <b>No</b> puede hacerlo como compraventa aplazada (102.8); sí puede como <b>renting</b> —arrendamiento— o como arrendamiento con opción de compra.</li>\n</ul>", "noej": "<ul>\n<li><b>No es precio cierto</b> «el que resulte de los costes que acredite el contratista», salvo en el supuesto excepcional de precios provisionales del 102.7.</li>\n<li><b>No cabe</b> precio provisional tras un procedimiento <b>abierto</b> o <b>restringido</b>: solo negociado, diálogo competitivo y asociación para la innovación.</li>\n<li><b>No es pago aplazado</b> el pago fraccionado por certificaciones de obra: ahí se paga lo ya ejecutado, no se difiere el precio de lo ya recibido.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 100:</b> presupuesto base de licitación, del que el precio es el resultado tras la baja.</li>\n<li><b>Art. 149:</b> ofertas anormalmente bajas, filtro del precio inviable.</li>\n<li><b>Arts. 103 a 105:</b> revisión de precios, a la que remite el 102.5.</li>\n<li><b>Art. 198:</b> pago del precio y consecuencias de la demora.</li>\n<li><b>Art. 35.f) e i):</b> el precio y las condiciones de pago como contenido mínimo del contrato.</li>\n</ul>", "trampas": "<ul>\n<li>El IVA se indica «<b>como partida independiente</b>» — se paga, pero se ve aparte. No confundir con el valor estimado, que no lo lleva.</li>\n<li>Los <b>precios provisionales</b> son excepcionales y están tasados a <b>tres</b> procedimientos. Y en ellos <b>no hay revisión de precios</b>.</li>\n<li>La prohibición del pago aplazado se predica de los contratos de las <b>Administraciones Públicas</b>, no de todo el sector público.</li>\n</ul>", "ancla": "<p><b>«Cierto, en euros, por lo hecho y al contado.»</b> Cuatro palabras, cuatro apartados.</p>\n<p>Para las excepciones del pago aplazado, la imagen del coche: no puedes <b>comprarlo</b> a plazos, pero sí <b>alquilarlo</b> con opción a quedártelo.</p>", "vis": "<svg viewBox=\"0 0 960 281\" role=\"img\" aria-label=\"Reglas sobre el precio del contrato\" style=\"width:100%;height:auto\"><defs><marker id=\"fl12\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr12\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe12\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw12\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"250\" y=\"8\" width=\"460\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"27.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">EL PRECIO · ART. 102</text><rect x=\"20\" y=\"52\" width=\"172.8\" height=\"175\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"106.4\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--acc)\">CÓMO ES</text><text x=\"106.4\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">CIERTO, o con modo</text><text x=\"106.4\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">de determinarlo</text><text x=\"106.4\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"106.4\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Se abona por la</text><text x=\"106.4\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">PRESTACIÓN REALMENTE</text><text x=\"106.4\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">EJECUTADA</text><text x=\"106.4\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"106.4\" y=\"180\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">IVA incluido, como</text><text x=\"106.4\" y=\"193\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">partida independiente</text><rect x=\"206.8\" y=\"52\" width=\"172.8\" height=\"175\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"293.2\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--ej)\">EN QUÉ</text><text x=\"293.2\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Con carácter general,</text><text x=\"293.2\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">en EUROS</text><text x=\"293.2\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"293.2\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Cabe otra divisa si el</text><text x=\"293.2\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">contrato lo prevé, con</text><text x=\"293.2\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">estimación en euros</text><text x=\"293.2\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">del importe total</text><rect x=\"393.6\" y=\"52\" width=\"172.8\" height=\"175\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"480\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--ej)\">DE QUÉ FORMA</text><text x=\"480\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">PRECIOS UNITARIOS</text><text x=\"480\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">por componentes o</text><text x=\"480\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">unidades</text><text x=\"480\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"480\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">o A TANTO ALZADO</text><text x=\"480\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">por la totalidad o</text><text x=\"480\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">parte de la prestación</text><rect x=\"580.4\" y=\"52\" width=\"172.8\" height=\"175\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"666.8\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--warn)\">EXCEPCIÓN</text><text x=\"666.8\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">PRECIOS PROVISIONALES</text><text x=\"666.8\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">solo tras negociado,</text><text x=\"666.8\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">diálogo competitivo o</text><text x=\"666.8\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">asociación para la</text><text x=\"666.8\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">innovación</text><text x=\"666.8\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"666.8\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">En ellos NO cabe</text><text x=\"666.8\" y=\"180\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">revisión de precios</text><rect x=\"767.2\" y=\"52\" width=\"172.8\" height=\"175\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"853.6\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--exc)\">PROHIBIDO</text><text x=\"853.6\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">EL PAGO APLAZADO</text><text x=\"853.6\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">en los contratos de</text><text x=\"853.6\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">las Administraciones</text><text x=\"853.6\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Públicas</text><text x=\"853.6\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"853.6\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Salvo arrendamiento</text><text x=\"853.6\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">financiero, arrendamiento</text><text x=\"853.6\" y=\"180\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">con opción de compra</text><text x=\"853.6\" y=\"193\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">o ley que lo autorice</text><rect x=\"20\" y=\"237\" width=\"920\" height=\"34\" rx=\"8\" fill=\"var(--panel)\" stroke=\"var(--line)\"/><text x=\"480\" y=\"257.328\" text-anchor=\"middle\" font-size=\"10.4\" fill=\"currentColor\">En servicios donde el coste principal sean los salarios, deben considerarse los convenios colectivos aplicables en el lugar de prestación (art. 102.3).</text></svg>"}];
const PLAZOS=[["1 año", "Duración máxima del contrato menor", "—", "29.8", "Y sin posibilidad de prórroga"], ["2 meses", "Preaviso mínimo para que la prórroga sea obligatoria para el empresario", "Órgano de contratación", "29.2", "El pliego puede exigir más, nunca menos"], ["5 años", "Duración máxima de suministros y servicios de prestación sucesiva", "—", "29.4", "Incluidas las prórrogas"], ["9 meses", "Prórroga excepcional por falta de nuevo contrato", "Órgano de contratación", "29.4", "Exige anuncio del nuevo con 3 meses de antelación"], ["40 / 25 / 10 años", "Duración máxima de las concesiones", "—", "29.6", "Obras / servicios / servicios sanitarios"], ["15 %", "Ampliación máxima del plazo concesional para reequilibrio", "Órgano de contratación", "29.6", "Sobre la duración inicial"], ["× 48", "Multiplicador del valor mensual en contratos sin plazo cierto", "Órgano de contratación", "101.9.b) y 101.11.d)", "Arrendamientos y servicios sin precio total"], ["Sin IVA", "Regla de cálculo del valor estimado", "Órgano de contratación", "101.1", "Con prórrogas, opciones y modificaciones previstas"], ["Con IVA", "Regla del presupuesto base de licitación", "Órgano de contratación", "100.1", "Y el precio, con el IVA como partida independiente"], ["Norma o estatuto", "Título del que nace la competencia para contratar", "Órgano de contratación", "61.1", "Cabe delegar, desconcentrar u otorgar poderes"], ["Obligatorio", "Designación del responsable del contrato", "Órgano de contratación", "62.1", "Puede ser persona física o jurídica, propia o ajena"], ["Vinculada y proporcional", "Exigencia de solvencia económica y técnica", "Órgano de contratación", "74.2", "Se indica en el anuncio y se especifica en el pliego"]];
const FLASH=[["¿Qué debe determinarse con precisión antes de iniciar el procedimiento de adjudicación?", "La <b>naturaleza y extensión de las necesidades</b> a cubrir y la <b>idoneidad del objeto y contenido</b> para satisfacerlas, dejando constancia en la documentación preparatoria (art. 28.1)."], ["¿Con cuánta antelación debe preavisarse la prórroga para que sea obligatoria para el empresario?", "<b>Al menos dos meses</b> antes de la finalización del plazo, salvo que el pliego establezca uno mayor (art. 29.2). Nunca cabe prórroga tácita."], ["¿Cuándo se perfecciona un contrato de un poder adjudicador?", "Con su <b>formalización</b> (art. 36.1). Excepciones: contratos menores y contratos basados en acuerdo marco o específicos de un sistema dinámico, que se perfeccionan con la <b>adjudicación</b> (36.3)."], ["¿Qué debe justificarse cuando NO se divide el contrato en lotes?", "Los <b>motivos válidos</b> del art. 99.3 —riesgo de restringir la competencia, con informe previo de la autoridad de competencia, o dificultad técnica de la ejecución independiente—, debidamente justificados en el expediente, y así lo exige también el art. 116.4.g)."], ["¿Qué entra en el cálculo del valor estimado?", "El importe total <b>sin IVA</b>, incluidas <b>cualquier forma de opción eventual</b>, las <b>eventuales prórrogas</b>, las <b>primas o pagos</b> a licitadores y el <b>importe máximo</b> de las modificaciones al alza previstas (art. 101.1 y 101.2)."], ["¿Qué diferencia hay entre valor estimado y presupuesto base de licitación?", "El <b>valor estimado</b> (art. 101) va <b>sin IVA</b> y sirve para clasificar el contrato. El <b>presupuesto base de licitación</b> (art. 100) va <b>con IVA</b> y es el límite máximo de gasto."], ["¿A quién corresponde la representación en materia contractual y puede delegarse?", "A los <b>órganos de contratación</b>, unipersonales o colegiados, que tengan atribuida esa facultad por <b>norma legal o reglamentaria o disposición estatutaria</b>. Pueden <b>delegar o desconcentrar</b>; en órganos societarios o fundacionales, mediante <b>otorgamiento de poderes</b> (art. 61)."], ["¿Es obligatorio designar responsable del contrato y quién puede serlo?", "<b>Sí</b>: «los órganos de contratación <b>deberán designar</b>». Puede ser persona <b>física o jurídica</b>, <b>vinculada a la entidad o ajena a ella</b>. En obras, el <b>Director Facultativo</b> (art. 62)."], ["¿Qué dos límites tiene la exigencia de solvencia?", "Debe estar <b>vinculada al objeto</b> del contrato y ser <b>proporcional</b> al mismo. Y se indica en el <b>anuncio</b> y se especifica en el <b>pliego</b> (art. 74.2). Cuando la clasificación es exigible, <b>sustituye</b> a la solvencia."]];
const TEST=[{"a": 28, "q": "¿Qué debe motivar el órgano de contratación con carácter previo a iniciar el procedimiento?", "o": [["La naturaleza y extensión de las necesidades y la idoneidad del objeto y contenido para satisfacerlas", 1, "Correcto: es la literalidad del art. 28.1, y debe constar en la documentación preparatoria antes de iniciar el procedimiento."], ["La solvencia económica y técnica del futuro adjudicatario", 0, "La solvencia se acredita en la licitación por el licitador; el art. 28 mira a la necesidad del ente contratante, no al contratista."], ["El precio de mercado y la existencia de crédito", 0, "Son exigencias reales, pero de los arts. 100 y 116.3, no del art. 28."], ["La elección del procedimiento de licitación", 0, "Eso se justifica en el expediente por el art. 116.4.a). El art. 28 responde a por qué se contrata, no a cómo se licita."]]}, {"a": 29, "q": "La prórroga de un contrato del sector público:", "o": [["Es obligatoria para el empresario si se preavisa con al menos dos meses de antelación", 1, "Correcto: art. 29.2. El pliego puede exigir un plazo mayor, nunca menor."], ["Puede producirse por consentimiento tácito de ambas partes", 0, "El art. 29.2 lo prohíbe expresamente: «En ningún caso podrá producirse la prórroga por el consentimiento tácito de las partes»."], ["Es siempre potestativa para el contratista", 0, "Solo lo es en el supuesto del art. 198.6, cuando la Administración se ha demorado en el pago más de seis meses."], ["Cabe también en los contratos menores si queda crédito", 0, "El art. 29.8 lo excluye: el contrato menor no puede durar más de un año ni prorrogarse."]]}, {"a": 36, "q": "Un contrato de servicios adjudicado por una diputación se perfecciona:", "o": [["Con su formalización", 1, "Correcto: art. 36.1. La adjudicación es un acto administrativo previo; el contrato nace con la formalización."], ["Con la notificación de la adjudicación a los licitadores", 0, "La notificación produce efectos procedimentales, pero no perfecciona el contrato."], ["Con la aprobación del expediente", 0, "La aprobación del expediente (art. 117) abre el procedimiento; queda muy lejos de la perfección del contrato."], ["Con el inicio de la ejecución", 0, "La ejecución es posterior a la perfección; confundirlas invierte todo el orden del art. 36."]]}, {"a": 99, "q": "En materia de división en lotes, la regla general de la Ley 9/2017 es:", "o": [["Que deberá preverse la división en lotes siempre que la naturaleza o el objeto lo permitan", 1, "Correcto: art. 99.3. No dividir es la excepción y debe justificarse en el expediente."], ["Que el contrato no se divida, salvo que lo pidan los licitadores", 0, "Es exactamente la regla inversa a la del art. 99.3."], ["Que la división sea siempre obligatoria sin excepción", 0, "El propio 99.3 admite no dividir por motivos válidos, salvo en concesión de obras."], ["Que la división corresponda decidirla a la Intervención", 0, "La decisión es del órgano de contratación; la Intervención fiscaliza, no diseña el objeto."]]}, {"a": 101, "q": "En el cálculo del valor estimado de un contrato NO se incluye:", "o": [["El Impuesto sobre el Valor Añadido", 1, "Correcto: art. 101.1.a). El IVA queda siempre fuera del valor estimado."], ["Las eventuales prórrogas del contrato", 0, "Sí se incluyen: art. 101.2.a)."], ["Cualquier forma de opción eventual", 0, "También se incluye, por el mismo art. 101.2.a)."], ["El importe máximo de las modificaciones al alza previstas en el pliego", 0, "Se incluye por el art. 101.2.c), cuando el pliego prevea la modificación conforme al art. 204."]]}, {"a": 100, "q": "El presupuesto base de licitación:", "o": [["Es el límite máximo de gasto que puede comprometer el órgano de contratación, IVA incluido", 1, "Correcto: art. 100.1. Y debe desglosarse en costes directos, indirectos y otros eventuales gastos."], ["Se calcula siempre sin incluir el IVA", 0, "Eso es el valor estimado (art. 101.1). El presupuesto base lo incluye."], ["Coincide necesariamente con el precio del contrato", 0, "El precio resulta de la adjudicación y suele ser inferior tras la baja."], ["Debe aprobarse siempre antes de un acuerdo marco", 0, "El art. 100.3 dice justo lo contrario: no es necesario con carácter previo a un acuerdo marco ni a un sistema dinámico de adquisición."]]}, {"a": 61, "q": "La competencia para contratar en el sector público:", "o": [["Corresponde a los órganos de contratación, unipersonales o colegiados, que la tengan atribuida por norma o disposición estatutaria", 1, "Correcto: art. 61.1. Y pueden delegarla o desconcentrarla con las formalidades aplicables."], ["Corresponde siempre a un órgano colegiado", 0, "El art. 61.1 admite expresamente órganos unipersonales."], ["Corresponde a la mesa de contratación", 0, "La mesa es órgano de asistencia: califica y propone, no contrata."], ["No puede delegarse en ningún caso", 0, "El art. 61.2 permite la delegación, la desconcentración y el otorgamiento de poderes."]]}, {"a": 62, "q": "El responsable del contrato:", "o": [["Debe designarse en todo caso y puede ser persona física o jurídica, propia o ajena a la entidad", 1, "Correcto: art. 62.1. En obras sus facultades las ejerce el Director Facultativo."], ["Es una figura potestativa", 0, "La ley dice «deberán designar»."], ["Debe ser necesariamente personal funcionario de la entidad", 0, "El art. 62.1 admite expresamente que sea ajeno a la entidad contratante."], ["Coincide siempre con la unidad de seguimiento ordinario del contrato", 0, "El propio art. 62.1 los distingue: se designa «con independencia» de esa unidad."]]}, {"a": 74, "q": "Los requisitos mínimos de solvencia exigidos al empresario:", "o": [["Deben estar vinculados al objeto del contrato y ser proporcionales al mismo", 1, "Correcto: art. 74.2. Se indican en el anuncio y se especifican en el pliego."], ["Los fija libremente la mesa de contratación en el momento de valorar", 0, "Los determina el órgano de contratación y deben constar previamente en el anuncio y en el pliego."], ["Se acumulan a la clasificación cuando esta es exigible", 0, "El art. 74.1 dice que la clasificación <b>sustituye</b> al requisito de solvencia."], ["Son criterios de adjudicación", 0, "La solvencia es un requisito de aptitud; los criterios de adjudicación puntúan las ofertas (art. 145)."]]}];
const CASOS=[{"t": "Caso 1 · De la necesidad al contrato firmado", "e": "El Ayuntamiento de Antequera necesita renovar el alumbrado de tres barrios. Cronología: <b>(1)</b> 12 de enero, el ingeniero municipal firma un informe con 1.840 puntos de luz, 610 incidencias en 2025 y un ahorro estimado del 22 % con LED. <b>(2)</b> 2 de febrero, se consulta a cuatro empresas y a un colegio profesional. <b>(3)</b> 1 de marzo, resolución de inicio del expediente. <b>(4)</b> 15 de marzo, la Junta de Gobierno aprueba el expediente. <b>(5)</b> 30 de abril, se adjudica en 512.000 € más IVA. <b>(6)</b> 25 de mayo, se firma el documento contractual.<br><br><b>Se pide:</b> identifica el artículo de cada hito, di en qué momento nace el contrato y calcula la garantía definitiva.", "s": "<p><b>(1) Art. 28.1</b> — informe de necesidad e idoneidad, en la documentación preparatoria y antes de iniciar el procedimiento.</p><p><b>(2) Art. 115</b> — consulta preliminar del mercado. Debió publicarse en el perfil <b>antes</b> de iniciarla, con el objeto, la fecha y los nombres de los consultados, y el informe de resultados forma parte del expediente y se publica como los pliegos.</p><p><b>(3) Art. 116.1</b> — resolución de inicio del órgano de contratación, motivando la necesidad «en los términos del artículo 28», y <b>publicada en el perfil</b>.</p><p><b>(4) Art. 117.1</b> — resolución motivada que aprueba el expediente, dispone la apertura del procedimiento e implica la aprobación del gasto. También se publica.</p><p><b>(5)</b> La adjudicación <b>no</b> perfecciona el contrato.</p><p><b>(6) Art. 36.1</b> — el contrato <b>nace aquí</b>, con la formalización.</p><p><b>Garantía definitiva (art. 107.1):</b> 5 % de 512.000 € = <b>25.600 €</b>. Sobre el precio ofertado y sin IVA. Al ser obra, el órgano <b>no</b> podría eximir de ella.</p><p><b>Detalle que suele fallarse:</b> entre el (5) y el (6) median 25 días. Si el contrato fuera susceptible de recurso especial, el art. 153.3 impediría formalizar antes de que pasaran quince días hábiles desde la remisión de la notificación de la adjudicación."}, {"t": "Caso · ¿Quién firma, quién vigila y a quién se deja entrar?", "e": "Una diputación va a contratar la redacción del proyecto y la dirección de obra de un centro comarcal, con un valor estimado de <b>240.000 €</b>. Se plantean cuatro cuestiones: <b>(1)</b> el alcalde de un municipio adherido pregunta si puede firmarlo él; <b>(2)</b> el servicio de Arquitectura propone que la vigilancia de la ejecución la lleve una ingeniera externa; <b>(3)</b> el borrador de pliego exige haber redactado <b>cinco proyectos de centros comarcales en la misma provincia</b>; <b>(4)</b> se discute si el valor estimado incluye la dirección de obra o solo el proyecto.<br><br><b>Se pide:</b> resuelve las cuatro con el artículo en la mano.", "s": "<p><b>(1) Art. 61.1.</b> No. La representación en materia contractual corresponde al órgano de contratación <b>de la entidad que contrata</b>, que aquí es la diputación, y su competencia nace de norma legal, reglamentaria o disposición estatutaria. Un alcalde ajeno carece de título. Otra cosa sería una delegación o una encomienda entre entidades, que tienen su propio cauce.</p><p><b>(2) Art. 62.1.</b> Sí puede. El responsable del contrato puede ser persona <b>física o jurídica</b> y estar <b>vinculada a la entidad o ser ajena a ella</b>. Y designarlo no es opcional: la ley dice «deberán designar». Ojo: como el contrato incluye <b>dirección de obra</b>, en la fase de ejecución de la obra las facultades del responsable las ejercerá el <b>Director Facultativo</b> (art. 62.2).</p><p><b>(3) Art. 74.2.</b> La exigencia es impugnable. La solvencia debe estar <b>vinculada al objeto</b> y ser <b>proporcional</b>. Que los proyectos anteriores sean «de centros comarcales» y «en la misma provincia» no acredita mayor capacidad técnica: es una barrera de entrada encubierta. Además, los requisitos deben constar en el <b>anuncio</b> y en el <b>pliego</b>.</p><p><b>(4) Art. 101.1.a) y 101.2.</b> El valor estimado es el <b>importe total sin IVA</b> de todas las prestaciones del contrato: proyecto <b>y</b> dirección de obra, más opciones y prórrogas previstas. Y con 240.000 € de valor estimado, al superar los <b>100.000 €</b> del art. 44.1.a), <b>cabe recurso especial</b> contra ese pliego.</p><p><b>Y una nota de estrategia:</b> dado que se trata de un servicio intelectual de especial complejidad, el <b>procedimiento restringido</b> del art. 160.4 sería especialmente adecuado, e incluso cabría prever <b>primas</b> para los no adjudicatarios (art. 160.2).</p>"}];
const SEMAFORO=["Sé qué hay que determinar y documentar antes de iniciar un procedimiento — art. 28", "Domino los plazos de duración y las reglas de la prórroga — art. 29", "Distingo adjudicación de perfección del contrato y conozco las excepciones — art. 36", "Sé cuándo hay que dividir en lotes y qué hay que justificar si no se divide — art. 99", "Calculo un valor estimado con prórrogas, opciones y modificaciones previstas — art. 101", "Distingo valor estimado, presupuesto base de licitación y precio — arts. 100, 101 y 102", "Sé de dónde nace la competencia para contratar y cómo se delega — art. 61", "Sé que designar responsable del contrato es obligatorio y quién puede serlo — art. 62", "Sé los dos límites de la solvencia y cuándo la sustituye la clasificación — art. 74"];
const INTRO_HTML="<section class=\"card\" id=\"intro\"><h2>Tema 10 · Bloque 1 · El órgano de contratación, las partes y el objeto</h2><p class=\"small\">Antes de que exista expediente hay que responder a cuatro preguntas: <b>quién</b> puede contratar, <b>quién</b> vigilará que se cumpla, <b>a quién</b> se deja concurrir y <b>qué</b> se compra exactamente y por cuánto. Ese es el contenido de este bloque.</p><div class=\"box ej\"><span class=\"lbl\">La idea que ordena el bloque</span>Los artículos de esta página se leen como una cadena: <b>¿por qué contrato?</b> (necesidad e idoneidad, art. 28) → <b>¿quién firma?</b> (órgano de contratación, art. 61) → <b>¿quién vigila?</b> (responsable del contrato, art. 62) → <b>¿quién puede presentarse?</b> (solvencia, art. 74) → <b>¿qué compro?</b> (objeto y lotes, art. 99) → <b>¿cuánto vale?</b> (arts. 100, 101 y 102) → <b>¿cuánto dura y cuándo nace?</b> (arts. 29, 35 y 36). Y todo se publica en el <b>perfil de contratante</b> (art. 63).</div><div class=\"box warn\"><span class=\"lbl\">Fuentes utilizadas y vigencia</span><ul><li><b>Ley 9/2017, de 8 de noviembre</b>, de Contratos del Sector Público (documento de la biblioteca del proyecto), <b>texto consolidado</b>, transcrito literalmente artículo por artículo.</li><li><b>Aportación externa</b>, marcada donde aparece: la <b>Ley 7/1985</b> reguladora de las Bases del Régimen Local, la <b>Ley 40/2015</b> en materia de delegación de competencias, la <b>Ley General Presupuestaria</b> y el <b>RD Legislativo 1/2013</b> de derechos de las personas con discapacidad, citadas por los propios preceptos.</li><li><b>Verifica siempre la vigencia en el BOE consolidado.</b> Los umbrales de la regulación armonizada se actualizan cada dos años por reglamento delegado de la Comisión Europea.</li><li>Las entidades, fechas y cifras de los ejemplos y casos son <b>ficticias</b>; los preceptos y las cifras legales, reales.</li></ul></div><div class=\"box exc\"><span class=\"lbl\">Esto no es asesoramient

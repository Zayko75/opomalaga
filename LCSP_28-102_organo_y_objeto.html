igaciones para las partes distintos de los previstos en los pliegos, concretados, en su caso, en la forma que resulte de la proposición del adjudicatario, o de los precisados en el acto de adjudicación del contrato de acuerdo con lo actuado en el procedimiento, de no existir aquellos.</p>", "dis": "<ul>\n<li><b>Supuesto:</b> los documentos en que se <b>formalizan</b> los contratos de las entidades del sector público.</li>\n<li><b>Salvedad:</b> «salvo que ya se encuentren recogidas en los <span class=\"t\" data-k=\"pliego\">pliegos</span>». No es una duplicación obligatoria.</li>\n<li><b>Las catorce menciones, agrupadas para memorizarlas:</b>\n <ul>\n <li><b>Quién</b> — a) identificación de las partes · b) acreditación de la capacidad de los firmantes.</li>\n <li><b>Qué</b> — c) definición del objeto y tipo · e) enumeración de los documentos que integran el contrato, que puede jerarquizarse para resolver contradicciones.</li>\n <li><b>Con qué reglas</b> — d) legislación aplicable, con mención expresa a la normativa de <b>protección de datos</b>.</li>\n <li><b>Cuánto y cuándo se paga</b> — f) precio cierto o modo de determinarlo · i) condiciones de pago · l) crédito presupuestario o rúbrica contable.</li>\n <li><b>Cuánto dura</b> — g) duración o fechas estimadas de inicio y fin, y las prórrogas si están previstas.</li>\n <li><b>Cómo se entrega</b> — h) condiciones de recepción, entrega o admisión.</li>\n <li><b>Cómo se rompe o se cambia</b> — j) supuestos de modificación · k) supuestos de resolución.</li>\n <li><b>Obligaciones añadidas</b> — m) extensión objetiva y temporal de la confidencialidad · n) obligación de cumplir el convenio colectivo de aplicación durante todo el periodo de ejecución.</li>\n </ul></li>\n<li><b>35.2 · límite:</b> el documento contractual <b>no puede</b> incluir estipulaciones con derechos y obligaciones distintos de los previstos en los pliegos, concretados en su caso por la proposición del adjudicatario o por el acto de adjudicación.</li>\n</ul>", "llano": "<p>El contrato es un papel, y ese papel tiene que decir como mínimo quiénes firman, qué se compra, cuánto cuesta, cuándo se paga, cuánto dura, cómo se entrega, cuándo se puede cambiar y cuándo se puede romper.</p>\n<p>Y una advertencia: ese papel <b>no puede inventar</b> nada que no estuviera ya en los pliegos. Si aparece una cláusula nueva, es nula.</p>", "porque": "<p>Para evitar dos patologías. La primera, el contrato incompleto: si no dice cuándo se paga o cuándo se puede resolver, cualquier conflicto acaba en el juzgado. La segunda, más grave: el contrato que <b>cambia las reglas después de la licitación</b>. Las empresas ofertaron sobre unos pliegos; si el documento final añade obligaciones, la competencia habría sido otra. Por eso el 35.2 cierra la puerta.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> el contrato de alquiler de un piso. Si no pone la renta, la duración y quién paga la comunidad, el conflicto está garantizado.</li>\n<li><b>Real:</b> un ayuntamiento formaliza el suministro de 40 ordenadores por 47.500 € más IVA. El documento identifica a las partes, define el objeto por referencia al PPT, fija el precio y el plazo de entrega en 45 días, remite a la Ley Orgánica 3/2018 en protección de datos, jerarquiza los documentos —contrato, PCAP, PPT, oferta— y recoge la obligación de cumplir el convenio del metal.</li>\n<li><b>Caso límite:</b> el pliego no decía nada sobre confidencialidad y el documento contractual añade un deber de secreto de cinco años. Al ser una obligación <b>nueva</b> no prevista en los pliegos, choca con el art. 35.2.</li>\n</ul>", "noej": "<ul>\n<li><b>No hace falta</b> repetir en el contrato lo que ya está en los pliegos: el 35.1 lo dice expresamente.</li>\n<li><b>No es contenido mínimo</b> la solvencia del contratista ni la clasificación: eso se acredita en la licitación, no se pacta en el contrato.</li>\n<li><b>No cabe</b> jerarquizar los documentos para saltarse el pliego: la jerarquía solo resuelve <b>contradicciones</b> y opera «salvo caso de error manifiesto».</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 36:</b> los contratos se perfeccionan con la formalización, que es donde se plasma este contenido.</li>\n<li><b>Art. 153:</b> plazos y forma de la formalización.</li>\n<li><b>Art. 122:</b> pliego de cláusulas administrativas particulares, cuyo contenido puede absorber estas menciones.</li>\n<li><b>Arts. 203 a 207:</b> el desarrollo de la letra j), los supuestos de modificación.</li>\n<li><b>Arts. 211 y ss.:</b> el desarrollo de la letra k), las causas de resolución.</li>\n</ul>", "trampas": "<ul>\n<li>Son <b>catorce</b> letras, de la a) a la n). Fíjate en que se salta la «ñ»: van a), b)… m), n).</li>\n<li>La letra <b>n)</b> —convenio colectivo— y la <b>d)</b> —protección de datos— son incorporaciones recientes y por eso muy preguntadas.</li>\n<li>«<b>Salvo que ya se encuentren recogidas en los pliegos</b>»: si una opción dice «necesariamente y en todo caso», sospecha.</li>\n</ul>", "ancla": "<p>Historia en seis bloques: <b>quién · qué · con qué reglas · cuánto · cuánto dura · cómo se rompe</b>. Si construyes el contrato contando esa historia, no se te olvida ninguna letra.</p>", "vis": "<svg viewBox=\"0 0 960 251\" role=\"img\" aria-label=\"Las catorce menciones mínimas del documento contractual\" style=\"width:100%;height:auto\"><defs><marker id=\"fl3\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr3\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe3\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw3\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"250\" y=\"8\" width=\"460\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"27.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">LAS CATORCE MENCIONES DEL ART. 35</text><rect x=\"20\" y=\"52\" width=\"141.667\" height=\"145\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"90.8333\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--acc)\">QUIÉN</text><text x=\"90.8333\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">a) identificación</text><text x=\"90.8333\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">de las partes</text><text x=\"90.8333\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"90.8333\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">b) acreditación de</text><text x=\"90.8333\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">la capacidad de</text><text x=\"90.8333\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">los firmantes</text><rect x=\"175.667\" y=\"52\" width=\"141.667\" height=\"145\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"246.5\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--acc)\">QUÉ</text><text x=\"246.5\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">c) objeto y tipo</text><text x=\"246.5\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">de contrato</text><text x=\"246.5\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"246.5\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">e) enumeración de</text><text x=\"246.5\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">los documentos,</text><text x=\"246.5\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">jerarquizable</text><rect x=\"331.333\" y=\"52\" width=\"141.667\" height=\"145\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"402.167\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--warn)\">REGLAS</text><text x=\"402.167\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">d) legislación</text><text x=\"402.167\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">aplicable, con</text><text x=\"402.167\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">mención expresa a</text><text x=\"402.167\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">protección de datos</text><text x=\"402.167\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"402.167\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">m) confidencialidad</text><rect x=\"487\" y=\"52\" width=\"141.667\" height=\"145\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"557.833\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--ej)\">DINERO</text><text x=\"557.833\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">f) precio cierto o</text><text x=\"557.833\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">modo de determinarlo</text><text x=\"557.833\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"557.833\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">i) condiciones de pago</text><text x=\"557.833\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"557.833\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">l) crédito o rúbrica</text><rect x=\"642.667\" y=\"52\" width=\"141.667\" height=\"145\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"713.5\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--ej)\">TIEMPO Y ENTREGA</text><text x=\"713.5\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">g) duración, fechas</text><text x=\"713.5\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">y prórrogas</text><text x=\"713.5\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"713.5\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">h) condiciones de</text><text x=\"713.5\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">recepción, entrega</text><text x=\"713.5\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">o admisión</text><rect x=\"798.333\" y=\"52\" width=\"141.667\" height=\"145\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"869.167\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--exc)\">RUPTURA</text><text x=\"869.167\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">j) supuestos de</text><text x=\"869.167\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">modificación</text><text x=\"869.167\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"869.167\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">k) supuestos de</text><text x=\"869.167\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">resolución</text><text x=\"869.167\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"869.167\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">n) convenio colectivo</text><rect x=\"20\" y=\"207\" width=\"920\" height=\"34\" rx=\"8\" fill=\"var(--panel)\" stroke=\"var(--line)\"/><text x=\"480\" y=\"227.328\" text-anchor=\"middle\" font-size=\"10.4\" fill=\"currentColor\">Salvo que ya se encuentren recogidas en los pliegos (art. 35.1). Y el contrato no puede añadir nada distinto de lo previsto en ellos (art. 35.2).</text></svg>"}, {"n": 36, "t": "Perfección de los contratos", "ubic": "Libro I ▸ Título I ▸ Capítulo III · Perfección y forma del contrato", "idea": "El contrato público nace con la firma de la formalización, no con la adjudicación.", "literal": "<p><b>1.</b> Los contratos que celebren los poderes adjudicadores, a excepción de los contratos menores y de los contratos basados en un acuerdo marco y los contratos específicos en el marco de un sistema dinámico de adquisición a los que se refiere el apartado 3 de este artículo, se perfeccionan con su formalización.</p><p><b>2.</b> Los contratos subvencionados que, de conformidad con lo dispuesto en el artículo 23 de esta Ley, deban considerarse sujetos a regulación armonizada, se perfeccionarán de conformidad con la legislación por la que se rijan. Las partes deberán notificar su formalización al órgano que otorgó la subvención.</p><p><b>3.</b> Los contratos basados en un acuerdo marco y los contratos específicos en el marco de un sistema dinámico de adquisición, se perfeccionan con su adjudicación.</p><p><b>4.</b> Salvo que se indique otra cosa en su clausulado, los contratos del sector público se entenderán celebrados en el lugar donde se encuentre la sede del órgano de contratación.</p>", "dis": "<ul>\n<li><b>Regla general (36.1):</b> los contratos de los <span class=\"t\" data-k=\"pa\">poderes adjudicadores</span> se perfeccionan <b>con su formalización</b>.</li>\n<li><b>Excepciones expresas:</b> los <b>contratos menores</b> y los contratos <b>basados en un acuerdo marco</b> y los <b>específicos en un sistema dinámico de adquisición</b>, que se perfeccionan <b>con la adjudicación</b> (36.3).</li>\n<li><b>Contratos subvencionados SARA (36.2):</b> se perfeccionan conforme a la legislación por la que se rijan, y las partes deben <b>notificar la formalización al órgano que otorgó la subvención</b>.</li>\n<li><b>Lugar (36.4):</b> salvo indicación distinta en el clausulado, se entienden celebrados <b>donde se encuentre la sede del órgano de contratación</b>.</li>\n</ul>", "llano": "<p>En el derecho civil un contrato existe desde que las partes se ponen de acuerdo. En el derecho público de la contratación, no: existe desde que se <b>firma el documento de formalización</b>. Antes hay una adjudicación, que es un acto administrativo, pero todavía no hay contrato.</p>\n<p>Con dos salvedades de sentido práctico: en el contrato menor y en los contratos derivados de un acuerdo marco basta la adjudicación.</p>", "porque": "<p>Porque entre la adjudicación y la formalización hay un plazo deliberado —quince días hábiles en los contratos susceptibles de recurso especial, art. 153.3— pensado para que quien quiera impugnar pueda hacerlo <b>antes</b> de que el contrato exista. Si el contrato naciera con la adjudicación, ese plazo no serviría de nada: habría que anular un contrato ya vivo en vez de impedir que naciera.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> te conceden una hipoteca. La aprobación del banco no es la hipoteca: la hipoteca nace en la notaría.</li>\n<li><b>Real:</b> una diputación adjudica el 4 de mayo un contrato de servicios SARA. El contrato <b>no existe</b> el 4 de mayo. Existirá cuando se firme, y no puede firmarse antes de que pasen quince días hábiles desde la remisión de la notificación (art. 153.3).</li>\n<li><b>Caso límite:</b> un contrato menor de 9.000 € en servicios. Se perfecciona <b>con la adjudicación</b>: no hay formalización en documento administrativo, basta el informe, la aprobación del gasto y la factura (art. 118).</li>\n</ul>", "noej": "<ul>\n<li><b>No se perfecciona con la adjudicación</b> el contrato ordinario de un poder adjudicador, por mucho que la notificación ya se haya practicado.</li>\n<li><b>No es «celebración» sinónimo de «ejecución»</b>: el contrato se celebra —perfecciona— con la formalización y se ejecuta después.</li>\n<li><b>No se perfecciona con la formalización</b> el contrato basado en un acuerdo marco.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 153:</b> formalización, plazos y consecuencias de no formalizar.</li>\n<li><b>Art. 118:</b> contrato menor, excepción del 36.1.</li>\n<li><b>Art. 26.2:</b> preparación y adjudicación de los contratos privados, sometidas al Derecho administrativo.</li>\n<li><b>Art. 44:</b> recurso especial, cuya eficacia depende de que el contrato aún no exista.</li>\n<li><b>Art. 23:</b> contratos subvencionados sujetos a regulación armonizada, a los que remite el 36.2.</li>\n</ul>", "trampas": "<ul>\n<li><b>Adjudicación ≠ perfección.</b> Es la distinción más rentable de este artículo.</li>\n<li>Los <b>menores</b> y los <b>basados en acuerdo marco</b> van al revés que la regla general: con la adjudicación.</li>\n<li>El lugar de celebración es la <b>sede del órgano de contratación</b>, no el domicilio del contratista ni el lugar de ejecución.</li>\n</ul>", "ancla": "<p><b>«Se adjudica de palabra, se nace con la firma.»</b></p>\n<p>Y las dos excepciones, con una imagen: lo <b>pequeño</b> (el menor) y lo <b>derivado</b> (acuerdo marco y sistema dinámico) no necesitan segunda firma, porque la grande ya se dio antes.</p>", "vis": "<svg viewBox=\"0 0 960 295\" role=\"img\" aria-label=\"Momento de perfección de los contratos del sector público\" style=\"width:100%;height:auto\"><defs><marker id=\"fl4\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr4\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe4\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw4\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"250\" y=\"8\" width=\"460\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"27.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">¿CUÁNDO NACE EL CONTRATO?</text><rect x=\"20\" y=\"52\" width=\"219.5\" height=\"175\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"129.75\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--acc)\">REGLA GENERAL</text><text x=\"129.75\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Contratos de los</text><text x=\"129.75\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">poderes adjudicadores</text><text x=\"129.75\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"129.75\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">SE PERFECCIONAN CON</text><text x=\"129.75\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">LA FORMALIZACIÓN</text><text x=\"129.75\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"129.75\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 36.1</text><rect x=\"253.5\" y=\"52\" width=\"219.5\" height=\"175\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"363.25\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--warn)\">EXCEPCIÓN 1</text><text x=\"363.25\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Contratos MENORES</text><text x=\"363.25\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"363.25\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">SE PERFECCIONAN CON</text><text x=\"363.25\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">LA ADJUDICACIÓN</text><text x=\"363.25\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"363.25\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 36.1 y 36.3</text><rect x=\"487\" y=\"52\" width=\"219.5\" height=\"175\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"596.75\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--warn)\">EXCEPCIÓN 2</text><text x=\"596.75\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Contratos basados en</text><text x=\"596.75\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">acuerdo marco y</text><text x=\"596.75\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">específicos de sistema</text><text x=\"596.75\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">dinámico de adquisición</text><text x=\"596.75\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"596.75\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">SE PERFECCIONAN CON</text><text x=\"596.75\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">LA ADJUDICACIÓN</text><text x=\"596.75\" y=\"180\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"596.75\" y=\"193\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 36.3</text><rect x=\"720.5\" y=\"52\" width=\"219.5\" height=\"175\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"830.25\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--exc)\">SUBVENCIONADOS SARA</text><text x=\"830.25\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Se perfeccionan según</text><text x=\"830.25\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">la legislación por la</text><text x=\"830.25\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">que se rijan, y hay que</text><text x=\"830.25\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">NOTIFICAR al órgano</text><text x=\"830.25\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">que otorgó la subvención</text><text x=\"830.25\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"830.25\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 36.2</text><rect x=\"20\" y=\"237\" width=\"920\" height=\"48\" rx=\"8\" fill=\"var(--panel)\" stroke=\"var(--line)\"/><text x=\"480\" y=\"257.828\" text-anchor=\"middle\" font-size=\"10.4\" fill=\"currentColor\">Lugar de celebración: la sede del órgano de contratación, salvo que el clausulado diga otra cosa (art. 36.4).</text><text x=\"480\" y=\"270.828\" text-anchor=\"middle\" font-size=\"10.4\" fill=\"currentColor\">Por qué importa: el plazo de espera del art. 153.3 solo tiene sentido si el contrato AÚN NO existe cuando se puede recurrir.</text></svg>"}, {"n": 61, "t": "Competencia para contratar", "ubic": "Libro I ▸ Título IV ▸ Capítulo I · De las partes en el contrato · Órgano de contratación", "idea": "Contrata quien tenga atribuida esa facultad por norma o estatuto, y puede delegarla.", "literal": "<p><b>1.</b> La representación de las entidades del sector público en materia contractual corresponde a los órganos de contratación, unipersonales o colegiados que, en virtud de norma legal o reglamentaria o disposición estatutaria, tengan atribuida la facultad de celebrar contratos en su nombre.</p><p><b>2.</b> Los órganos de contratación podrán delegar o desconcentrar sus competencias y facultades en esta materia con cumplimiento de las normas y formalidades aplicables en cada caso para la delegación o desconcentración de competencias, en el caso de que se trate de órganos administrativos, o para el otorgamiento de poderes, cuando se trate de órganos societarios o de una fundación.</p>", "dis": "<ul>\n<li><b>Regla (61.1):</b> la representación de las entidades del sector público en materia contractual corresponde a los <span class=\"t\" data-k=\"organo\">órganos de contratación</span>, <b>unipersonales o colegiados</b>.</li>\n<li><b>Título habilitante:</b> han de tener atribuida la facultad de celebrar contratos en su nombre «en virtud de <b>norma legal o reglamentaria</b> o <b>disposición estatutaria</b>».</li>\n<li><b>Delegación y desconcentración (61.2):</b> pueden <b>delegar o desconcentrar</b> sus competencias cumpliendo las normas y formalidades aplicables en cada caso:\n <ul><li>si se trata de <b>órganos administrativos</b>, las de la delegación o desconcentración de competencias;</li>\n <li>si se trata de <b>órganos societarios o de una fundación</b>, las del <b>otorgamiento de poderes</b>.</li></ul></li>\n</ul>", "llano": "<p>No contrata quien quiere: contrata quien tiene atribuida esa facultad por una norma o por los estatutos de la entidad. Puede ser una sola persona —un alcalde— o un órgano colegiado —un pleno o una junta—.</p>\n<p>Y esa facultad se puede pasar a otro, pero con las formas propias de cada tipo de entidad: delegación si es una Administración, poderes si es una sociedad o una fundación.</p>", "porque": "<p>Porque un contrato firmado por quien no tenía competencia es un contrato viciado, y la nulidad afecta al dinero público ya comprometido. Anclar la competencia en una <b>norma</b> o en los <b>estatutos</b> hace que sea verificable desde fuera: cualquier licitador puede comprobar quién podía firmar.</p>\n<p>Y la posibilidad de delegar es imprescindible en organizaciones grandes: sin ella, el alcalde de una ciudad tendría que firmar personalmente cada contrato menor.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> en una empresa, no cualquier empleado puede firmar un pedido: hace falta un poder notarial o una autorización interna que lo diga.</li>\n<li><b>Real:</b> en un ayuntamiento, el <b>alcalde</b> es órgano de contratación para los contratos que no superen determinados umbrales de la disposición adicional segunda de la propia Ley 9/2017; por encima, lo es el <b>Pleno</b>. Y el alcalde puede <b>delegar</b> en la Junta de Gobierno Local, que pasa a ser el órgano de contratación de esos expedientes.</li>\n<li><b>Caso límite:</b> una sociedad mercantil municipal quiere que su director general firme los contratos. No basta con un acuerdo interno: hace falta el <b>otorgamiento de poderes</b> conforme al art. 61.2.</li>\n</ul>", "noej": "<ul>\n<li><b>No es órgano de contratación</b> el servicio que tramita el expediente ni la mesa de contratación: la mesa asiste, no contrata.</li>\n<li><b>No basta</b> una instrucción interna para delegar: hay que cumplir las formalidades de la delegación o del otorgamiento de poderes.</li>\n<li><b>No es una limitación</b> ser órgano colegiado: la ley admite expresamente ambas formas.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 62:</b> el responsable del contrato, designado por el órgano de contratación.</li>\n<li><b>Art. 116.1 y 117.1:</b> el órgano de contratación inicia y aprueba el expediente.</li>\n<li><b>Art. 326:</b> mesas de contratación, órgano de asistencia.</li>\n<li><b>Disposición adicional segunda de la Ley 9/2017:</b> competencias en las entidades locales.</li>\n<li><b>Arts. 9 y 8 de la Ley 40/2015</b> <i>(otra norma de la biblioteca)</i>: régimen general de la delegación de competencias.</li>\n</ul>", "trampas": "<ul>\n<li>La competencia nace de <b>norma legal, reglamentaria o disposición estatutaria</b>. No de un acuerdo informal.</li>\n<li>Cabe <b>delegar y desconcentrar</b>; en entidades societarias o fundacionales, la vía es el <b>poder</b>.</li>\n<li>Órgano de contratación <b>unipersonal o colegiado</b>: las dos formas son válidas.</li>\n</ul>", "ancla": "<p><b>«Contrata quien la norma diga, y puede prestar la firma con las formas de su casa.»</b></p>", "vis": "<svg viewBox=\"0 0 960 371\" role=\"img\" aria-label=\"Competencia para contratar y posibilidad de delegación o desconcentración\" style=\"width:100%;height:auto\"><defs><marker id=\"fl5\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr5\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe5\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw5\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"250\" y=\"8\" width=\"460\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"27.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">EL ÓRGANO DE CONTRATACIÓN · ART. 61</text><rect x=\"20\" y=\"52\" width=\"297.333\" height=\"251\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"168.667\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--acc)\">QUIÉN REPRESENTA</text><text x=\"168.667\" y=\"106\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">La representación de las</text><text x=\"168.667\" y=\"121\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">entidades del sector</text><text x=\"168.667\" y=\"136\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">público en materia</text><text x=\"168.667\" y=\"151\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">contractual corresponde a</text><text x=\"168.667\" y=\"166\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">los ÓRGANOS DE</text><text x=\"168.667\" y=\"181\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">CONTRATACIÓN</text><text x=\"168.667\" y=\"196\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"168.667\" y=\"211\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">UNIPERSONALES o</text><text x=\"168.667\" y=\"226\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">COLEGIADOS</text><text x=\"168.667\" y=\"241\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"168.667\" y=\"256\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 61.1</text><rect x=\"331.333\" y=\"52\" width=\"297.333\" height=\"251\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"480\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--ej)\">DE DÓNDE VIENE</text><text x=\"480\" y=\"91\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--ej)\">SU FACULTAD</text><text x=\"480\" y=\"106\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">De una NORMA LEGAL</text><text x=\"480\" y=\"121\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">o REGLAMENTARIA</text><text x=\"480\" y=\"136\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"480\" y=\"151\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">o de una DISPOSICIÓN</text><text x=\"480\" y=\"166\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">ESTATUTARIA</text><text x=\"480\" y=\"181\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"480\" y=\"196\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">que les atribuya la</text><text x=\"480\" y=\"211\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">facultad de celebrar</text><text x=\"480\" y=\"226\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">contratos en su nombre</text><text x=\"480\" y=\"241\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"480\" y=\"256\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 61.1</text><rect x=\"642.667\" y=\"52\" width=\"297.333\" height=\"251\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"791.333\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--warn)\">PUEDEN DELEGAR</text><text x=\"791.333\" y=\"106\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">DELEGAR o DESCONCENTRAR</text><text x=\"791.333\" y=\"121\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">sus competencias</text><text x=\"791.333\" y=\"136\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"791.333\" y=\"151\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">· órganos administrativos:</text><text x=\"791.333\" y=\"166\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">con las formalidades de la</text><text x=\"791.333\" y=\"181\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">delegación o</text><text x=\"791.333\" y=\"196\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">desconcentración</text><text x=\"791.333\" y=\"211\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"791.333\" y=\"226\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">· órganos societarios o</text><text x=\"791.333\" y=\"241\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">fundacionales: mediante</text><text x=\"791.333\" y=\"256\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">OTORGAMIENTO DE PODERES</text><text x=\"791.333\" y=\"271\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"791.333\" y=\"286\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 61.2</text><rect x=\"20\" y=\"313\" width=\"920\" height=\"48\" rx=\"8\" fill=\"var(--panel)\" stroke=\"var(--line)\"/><text x=\"480\" y=\"333.828\" text-anchor=\"middle\" font-size=\"10.4\" fill=\"currentColor\">En la entidad local el órgano de contratación es el alcalde o presidente, la Junta de Gobierno por delegación, o el Pleno,</text><text x=\"480\" y=\"346.828\" text-anchor=\"middle\" font-size=\"10.4\" fill=\"currentColor\">según la cuantía y la duración, conforme a la disposición adicional segunda de la propia Ley 9/2017.</text></svg>"}, {"n": 62, "t": "Responsable del contrato", "ubic": "Libro I ▸ Título IV ▸ Capítulo I · De las partes en el contrato · Órgano de contratación", "idea": "Alguien tiene que vigilar que el contrato se cumpla, y designarlo es obligatorio.", "literal": "<p><b>1.</b> Con independencia de la unidad encargada del seguimiento y ejecución ordinaria del contrato que figure en los pliegos, los órganos de contratación deberán designar un responsable del contrato al que corresponderá supervisar su ejecución y adoptar las decisiones y dictar las instrucciones necesarias con el fin de asegurar la correcta realización de la prestación pactada, dentro del ámbito de facultades que aquellos le atribuyan. El responsable del contrato podrá ser una persona física o jurídica, vinculada a la entidad contratante o ajena a él.</p><p><b>2.</b> En los contratos de obras, las facultades del responsable del contrato serán ejercidas por el Director Facultativo conforme con lo dispuesto en los artículos 237 a 246.</p><p><b>3.</b> En los casos de concesiones de obra pública y de concesiones de servicios, la Administración designará una persona que actúe en defensa del interés general, para obtener y para verificar el cumplimiento de las obligaciones del concesionario, especialmente en lo que se refiere a la calidad en la prestación del servicio o de la obra.</p>", "dis": "<ul>\n<li><b>Deber (62.1):</b> los órganos de contratación <b>deberán designar</b> un <span class=\"t\" data-k=\"responsable\">responsable del contrato</span>, <b>con independencia</b> de la unidad encargada del seguimiento y ejecución ordinaria que figure en los pliegos.</li>\n<li><b>Funciones:</b> <b>supervisar</b> la ejecución y <b>adoptar las decisiones</b> y <b>dictar las instrucciones</b> necesarias para asegurar la correcta realización de la prestación pactada, dentro del ámbito de facultades que se le atribuyan.</li>\n<li><b>Quién puede serlo:</b> «persona <b>física o jurídica</b>, vinculada a la entidad contratante <b>o ajena a él</b>».</li>\n<li><b>Obras (62.2):</b> sus facultades las ejerce el <b>Director Facultativo</b>, conforme a los arts. 237 a 246.</li>\n<li><b>Concesiones (62.3):</b> en concesiones de obra pública y de servicios, la Administración designa a una persona que actúe <b>en defensa del interés general</b>, para obtener y verificar el cumplimiento de las obligaciones del concesionario, «especialmente en lo que se refiere a la <b>calidad</b> en la prestación del servicio o de la obra».</li>\n</ul>", "llano": "<p>Firmado el contrato, alguien tiene que estar pendiente de que se cumpla. Ese alguien es el responsable del contrato, y nombrarlo no es opcional: la ley dice «deberán designar».</p>\n<p>Puede ser un funcionario, una empresa externa, o incluso una persona jurídica. En las obras ese papel lo hace el director facultativo; en las concesiones, alguien que vele por el interés general y, sobre todo, por la calidad del servicio.</p>", "porque": "<p>Porque el punto débil de la contratación pública no es la adjudicación: es la <b>ejecución</b>. Se dedican meses a valorar ofertas y después nadie comprueba si el servicio se presta con el personal ofertado. El art. 62 pone nombre y apellidos a esa vigilancia.</p>\n<p>Y en las concesiones el matiz es aún más claro: como el usuario paga al concesionario, la Administración deja de ser cliente y podría desentenderse. Por eso el 62.3 exige designar a quien defienda el interés general y controle la <b>calidad</b>.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> el vecino que la comunidad nombra para vigilar la obra del portal y avisar si el pintor no está usando la pintura acordada.</li>\n<li><b>Real:</b> adjudicado el servicio de socorrismo, la resolución designa responsable del contrato al <b>jefe del servicio de Deportes</b>, con facultades para comprobar mensualmente las ratios de socorristas por lámina de agua y para requerir la sustitución del personal que no acredite la titulación exigida en el PPT.</li>\n<li><b>Caso límite:</b> en la concesión de la piscina cubierta, la diputación designa a una <b>ingeniera ajena a la plantilla</b> —persona física externa— como responsable, con el encargo específico de verificar la calidad del agua y los horarios de apertura. El art. 62.1 lo permite expresamente.</li>\n</ul>", "noej": "<ul>\n<li><b>No es la unidad de seguimiento ordinario</b>: la ley distingue expresamente ambas figuras.</li>\n<li><b>No es potestativo</b> designarlo: «deberán designar».</li>\n<li><b>No tiene que ser</b> personal de la entidad: puede ser ajeno a ella, y persona jurídica.</li>\n<li><b>No es el responsable del contrato</b> quien firma la adjudicación: eso es el órgano de contratación (art. 61).</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 61:</b> el órgano de contratación que lo designa.</li>\n<li><b>Arts. 237 a 246:</b> dirección facultativa de las obras.</li>\n<li><b>Art. 190:</b> prerrogativas de la Administración en la ejecución del contrato.</li>\n<li><b>Art. 122.2:</b> el PCAP identifica la unidad encargada del seguimiento ordinario.</li>\n</ul>", "trampas": "<ul>\n<li>«<b>Deberán designar</b>»: es obligatorio, no una facultad.</li>\n<li>Puede ser <b>ajeno</b> a la entidad y <b>persona jurídica</b>. Es la respuesta que más sorprende.</li>\n<li>En <b>obras</b> lo es el <b>Director Facultativo</b>; en <b>concesiones</b>, quien defiende el interés general y la calidad.</li>\n</ul>", "ancla": "<p><b>«Uno firma, otro vigila.»</b> El 61 firma; el 62 vigila.</p>\n<p>Y las tres versiones: <b>ordinario</b> (una persona designada) · <b>obras</b> (director facultativo) · <b>concesiones</b> (defensor del interés general).</p>", "vis": "<svg viewBox=\"0 0 960 298\" role=\"img\" aria-label=\"Designación, funciones y modalidades del responsable del contrato\" style=\"width:100%;height:auto\"><defs><marker id=\"fl6\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr6\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe6\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw6\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"250\" y=\"8\" width=\"460\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"27.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">EL RESPONSABLE DEL CONTRATO · ART. 62</text><rect x=\"20\" y=\"52\" width=\"219.5\" height=\"236\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"129.75\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--exc)\">ES OBLIGATORIO</text><text x=\"129.75\" y=\"91\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Los órganos de contratación</text><text x=\"129.75\" y=\"106\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">DEBERÁN DESIGNAR un</text><text x=\"129.75\" y=\"121\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">responsable del contrato</text><text x=\"129.75\" y=\"136\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"129.75\" y=\"151\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Con independencia de la</text><text x=\"129.75\" y=\"166\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">unidad encargada del</text><text x=\"129.75\" y=\"181\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">seguimiento y ejecución</text><text x=\"129.75\" y=\"196\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">ordinaria que figure en</text><text x=\"129.75\" y=\"211\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">los pliegos</text><text x=\"129.75\" y=\"226\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"129.75\" y=\"241\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 62.1</text><rect x=\"253.5\" y=\"52\" width=\"219.5\" height=\"236\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"363.25\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--acc)\">QUÉ HACE</text><text x=\"363.25\" y=\"91\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">SUPERVISAR la ejecución</text><text x=\"363.25\" y=\"106\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"363.25\" y=\"121\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">ADOPTAR las decisiones y</text><text x=\"363.25\" y=\"136\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">DICTAR las instrucciones</text><text x=\"363.25\" y=\"151\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">necesarias para asegurar</text><text x=\"363.25\" y=\"166\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">la correcta realización de</text><text x=\"363.25\" y=\"181\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">la prestación pactada</text><text x=\"363.25\" y=\"196\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"363.25\" y=\"211\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">dentro del ámbito de</text><text x=\"363.25\" y=\"226\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">facultades que se le</text><text x=\"363.25\" y=\"241\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">atribuyan</text><text x=\"363.25\" y=\"256\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"363.25\" y=\"271\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 62.1</text><rect x=\"487\" y=\"52\" width=\"219.5\" height=\"236\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"596.75\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--ej)\">QUIÉN PUEDE SERLO</text><text x=\"596.75\" y=\"91\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Persona FÍSICA o JURÍDICA</text><text x=\"596.75\" y=\"106\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"596.75\" y=\"121\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">VINCULADA a la entidad</text><text x=\"596.75\" y=\"136\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">contratante o AJENA a ella</text><text x=\"596.75\" y=\"151\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"596.75\" y=\"166\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 62.1</text><rect x=\"720.5\" y=\"52\" width=\"219.5\" height=\"236\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"830.25\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--warn)\">CASOS ESPECIALES</text><text x=\"830.25\" y=\"91\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">OBRAS: sus facultades las</text><text x=\"830.25\" y=\"106\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">ejerce el DIRECTOR</text><text x=\"830.25\" y=\"121\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">FACULTATIVO (arts. 237 a 246)</text><text x=\"830.25\" y=\"136\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"830.25\" y=\"151\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">CONCESIONES de obra y de</text><text x=\"830.25\" y=\"166\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">servicios: la Administración</text><text x=\"830.25\" y=\"181\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">designa a una persona que</text><text x=\"830.25\" y=\"196\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">actúe EN DEFENSA DEL</text><text x=\"830.25\" y=\"211\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">INTERÉS GENERAL, sobre todo</text><text x=\"830.25\" y=\"226\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">en cuanto a la calidad de</text><text x=\"830.25\" y=\"241\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">la prestación</text><text x=\"830.25\" y=\"256\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"830.25\" y=\"271\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 62.2 y 62.3</text></svg>"}, {"n": 63, "t": "Perfil de contratante", "ubic": "Libro I ▸ Título IV ▸ Capítulo V · Publicidad · Perfil de contratante", "idea": "El tablón de anuncios electrónico de cada órgano: si no está publicado ahí, no cuenta.", "literal": "<p><b>1.</b> Los órganos de contratación difundirán exclusivamente a través de Internet su perfil de contratante, como elemento que agrupa la información y documentos relativos a su actividad contractual al objeto de asegurar la transparencia y el acceso público a los mismos. La forma de acceso al perfil de contratante deberá hacerse constar en los pliegos y documentos equivalentes, así como en los anuncios de licitación en todos los casos. La difusión del perfil de contratante no obstará la utilización de otros medios de publicidad adicionales en los casos en que así se establezca. El acceso a la información del perfil de contratante será libre, no requiriendo identificación previa. No obstante, podrá requerirse esta para el acceso a servicios personalizados asociados al contenido del perfil de contratante tales como suscripciones, envío de alertas, comunicaciones electrónicas y envío de ofertas, entre otras. Toda la información contenida en los perfiles de contratante se publicará en formatos abiertos y reutilizables, y permanecerá accesible al público durante un periodo de tiempo no inferior a 5 años, sin perjuicio de que se permita el acceso a expedientes anteriores ante solicitudes de información.</p><p><b>2.</b> El perfil de contratante podrá incluir cualesquiera datos y documentos referentes a la actividad contractual de los órganos de contratación. En cualquier caso, deberá contener tanto la información de tipo general que puede utilizarse para relacionarse con el órgano de contratación como puntos de contacto, números de teléfono y de fax, dirección postal y dirección electrónica, informaciones, anuncios y documentos generales, tales como las instrucciones internas de contratación y modelos de documentos, así como la información particular relativa a los contratos que celebre.</p><p><b>3.</b> En el caso de la información relativa a los contratos, deberá publicarse al menos la siguiente información:</p><p style=\"margin-left:1.1rem\">a) La memoria justificativa del contrato, el informe de insuficiencia de medios en el caso de contratos de servicios, la justificación del procedimiento utilizado para su adjudicación cuando se utilice un procedimiento distinto del abierto o del restringido, el pliego de cláusulas administrativas particulares y el de prescripciones técnicas que hayan de regir el contrato o documentos equivalentes, en su caso, y el documento de aprobación del expediente.</p><p style=\"margin-left:1.1rem\">b) El objeto detallado del contrato, su duración, el presupuesto base de licitación y el importe de adjudicación, incluido el Impuesto sobre el Valor Añadido.</p><p style=\"margin-left:1.1rem\">c) Los anuncios de información previa, de convocatoria de las licitaciones, de adjudicación y de formalización de los contratos, los anuncios de modificación y su justificación, los anuncios de concursos de proyectos y de resultados de concursos de proyectos, con las excepciones establecidas en las normas de los negociados sin publicidad.</p><p style=\"margin-left:1.1rem\">d) Los medios a través de los que, en su caso, se ha publicitado el contrato y los enlaces a esas publicaciones.</p><p style=\"margin-left:1.1rem\">e) El número e identidad de los licitadores participantes en el procedimiento, así como todas las actas de la mesa de contratación relativas al procedimiento de adjudicación o, en el caso de no actuar la mesa, las resoluciones del servicio u órgano de contratación correspondiente, el informe de valoración de los criterios de adjudicación cuantificables mediante un juicio de valor de cada una de las ofertas, en su caso, los informes sobre las ofertas incursas en presunción de anormalidad a que se refiere el artículo 149.4 y, en todo caso, la resolución de adjudicación del contrato. Igualmente serán objeto de publicación en el perfil de contratante la decisión de no adjudicar o celebrar el contrato, el desistimiento del procedimiento de adjudicación, la declaración de desierto, así como la interposición de recursos y la eventual suspensión de los contratos con motivo de la interposición de recursos.</p><p><b>4.</b> La publicación de la información relativa a los contratos menores deberá realizarse al menos trimestralmente. La información a publicar para este tipo de contratos será, al menos, su objeto, duración, el importe de adjudicación, incluido el Impuesto sobre el Valor Añadido, y la identidad del adjudicatario, ordenándose los contratos por la identidad del adjudicatario. Quedan exceptuados de la publicación a la que se refiere el párrafo anterior, aquellos contratos cuyo valor estimado fuera inferior a cinco mil euros, siempre que el sistema de pago utilizado por los poderes adjudicadores fuera el de anticipo de caja fija u otro sistema similar para realizar pagos menores.</p><p><b>5.</b> Deberán ser objeto de publicación en el perfil de contratante, asimismo, los procedimientos anulados, la composición de las mesas de contratación que asistan a los órganos de contratación, así como la designación de los miembros del comité de expertos o de los organismos técnicos especializados para la aplicación de criterios de adjudicación que dependan de un juicio de valor en los procedimientos en los que sean necesarios. En todo caso deberá publicarse el cargo de los miembros de las mesas de contratación y de los comités de expertos, no permitiéndose alusiones genéricas o indeterminadas o que se refieran únicamente a la Administración, organismo o entidad a la que representen o en la que prestasen sus servicios.</p><p><b>6.</b> La formalización de los encargos a medios propios cuyo importe fuera superior a 50.000 euros, IVA excluido, serán objeto, asimismo, de publicación en el perfil de contratante. La información relativa a los encargos de importe superior a 5.000 euros deberá publicarse al menos trimestralmente. La información a publicar para este tipo de encargos será, al menos, su objeto, duración, las tarifas aplicables y la identidad del medio propio destinatario del encargo, ordenándose los encargos por la identidad del medio propio.</p><p><b>7.</b> El sistema informático que soporte el perfil de contratante deberá contar con un dispositivo que permita acreditar fehacientemente el momento de inicio de la difusión pública de la información que se incluya en el mismo.</p><p><b>8.</b> Podrán no publicarse determinados datos relativos a la celebración del contrato en los supuestos que establece el artículo 154.7. En todo caso, cada vez que el órgano de contratación decida excluir alguna información de acuerdo con lo dispuesto en el párrafo anterior, deberá justificarlo en el expediente.</p>", "dis": "<ul>\n<li><b>Función del <span class=\"t\" data-k=\"perfil\">perfil de contratante</span> (63.1):</b> los órganos de contratación difunden <b>exclusivamente</b> a través de internet su perfil de contratante, como elemento que agrupa la información y documentos relativos a su actividad contractual, para <b>asegurar la transparencia y el acceso público</b>.</li>\n<li><b>Alojamiento:</b> en la <b>Plataforma de Contratación del Sector Público</b> o en los servicios de información equivalentes de las comunidades autónomas.</li>\n<li><b>Contenido (63.3), entre otros:</b> la <b>memoria justificativa</b> del contrato, el <b>informe de insuficiencia de medios</b> en servicios, la justificación del procedimiento, los <b>pliegos</b>, el objeto, el <b>presupuesto base de licitación</b>, el <b>valor estimado</b>, los anuncios de licitación y de adjudicación, la <b>formalización</b>, el número de licitadores, los <b>recursos</b> interpuestos, el desistimiento y la renuncia.</li>\n<li><b>Contratos menores (63.4):</b> se publicará, <b>al menos trimestralmente</b>, la información relativa a los contratos menores celebrados, con <b>objeto</b>, <b>duración</b>, <b>importe de adjudicación incluido el IVA</b> e <b>identidad del adjudicatario</b>, ordenados por identidad del adjudicatario.</li>\n<li><b>Sellado de tiempo:</b> los sistemas informáticos deben contar con un dispositivo que permita <b>acreditar fehacientemente el momento de inicio de la difusión</b>.</li>\n</ul>", "llano": "<p>Es el tablón de anuncios electrónico de cada órgano de contratación, y está dentro de la Plataforma de Contratación del Sector Público. Ahí se publica todo: los pliegos, quién se ha presentado, a quién se le ha adjudicado y por cuánto.</p>\n<p>Y una obligación específica: los contratos menores, que no se anuncian antes, hay que publicarlos <b>después</b>, al menos cada tres meses.</p>", "porque": "<p>Porque la publicidad es el único control real de la contratación menor y de la actividad contractual en general. La <b>trazabilidad</b> es lo que permite a cualquiera —un licitador, un periodista, un concejal de la oposición— comprobar si se está fraccionando, si siempre gana el mismo o si se adjudica por debajo de coste.</p>\n<p>El <b>sellado de tiempo</b> no es un detalle técnico: es lo que impide publicar un anuncio con fecha retroactiva para acortar de hecho el plazo de presentación.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> el tablón del portal donde el presidente de la comunidad cuelga los presupuestos y las actas. Si no lo cuelga, nadie puede comprobarlo.</li>\n<li><b>Real:</b> una diputación publica el 15 de abril, en su perfil de la Plataforma, la relación de los <b>147 contratos menores</b> del primer trimestre: objeto, duración, importe con IVA y adjudicatario, ordenados por adjudicatario. Así se aprecia que una empresa concentra 38 contratos por 210.000 €, lo que dispara la comprobación del art. 118.4.</li>\n<li><b>Caso límite:</b> un ayuntamiento publica el pliego en su web municipal, pero no en la Plataforma. La publicación no surte los efectos del art. 63: el perfil se aloja en la Plataforma o en el servicio autonómico equivalente.</li>\n</ul>", "noej": "<ul>\n<li><b>No es el perfil de contratante</b> la web municipal ni el tablón físico del ayuntamiento.</li>\n<li><b>No se publican</b> en el perfil los anuncios de los procedimientos <b>negociados sin publicidad</b> como anuncio de licitación (art. 135.1), aunque sí la formalización y la adjudicación.</li>\n<li><b>No es anual ni mensual</b> la publicación de los contratos menores: es <b>al menos trimestral</b>.</li>\n<li><b>No se publica sin IVA</b> el importe de adjudicación de los menores: el art. 63.4 dice «incluido el Impuesto sobre el Valor Añadido».</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 118.6:</b> remite a este artículo para la publicidad de los contratos menores.</li>\n<li><b>Art. 135:</b> anuncio de licitación, que se publica en el perfil.</li>\n<li><b>Art. 151.1:</b> la adjudicación se publica en el perfil en el plazo de 15 días.</li>\n<li><b>Art. 154:</b> anuncio de formalización.</li>\n<li><b>Art. 116.1 y 117.1:</b> la resolución de inicio y la de aprobación del expediente también se publican en el perfil.</li>\n<li><b>Ley 19/2013 de transparencia</b> <i>(otra norma de la biblioteca)</i>: obligaciones de publicidad activa en materia de contratos.</li>\n</ul>", "trampas": "<ul>\n<li><b>Trimestral</b> y <b>con IVA</b>: las dos trampas del 63.4.</li>\n<li>El perfil se aloja en la <b>Plataforma de Contratación del Sector Público</b>, no en la web propia del ente.</li>\n<li>El sellado de tiempo acredita el <b>inicio de la difusión</b>, no la fecha de la resolución.</li>\n</ul>", "ancla": "<p><b>«Si no está en el perfil, no ha pasado.»</b></p>\n<p>Para el 63.4, la regla de las cuatro OIDA: <b>O</b>bjeto · <b>I</b>mporte con IVA · <b>D</b>uración · <b>A</b>djudicatario. Cada trimestre.</p>", "vis": "<svg viewBox=\"0 0 960 296\" role=\"img\" aria-label=\"Contenido y funciones del perfil de contratante\" style=\"width:100%;height:auto\"><defs><marker id=\"fl7\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr7\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe7\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw7\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"250\" y=\"8\" width=\"460\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"27.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">EL PERFIL DE CONTRATANTE · ART. 63</text><rect x=\"20\" y=\"52\" width=\"219.5\" height=\"190\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"129.75\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--acc)\">QUÉ ES</text><text x=\"129.75\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">El espacio de difusión</text><text x=\"129.75\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">de la actividad</text><text x=\"129.75\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">contractual de cada</text><text x=\"129.75\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">órgano, alojado en la</text><text x=\"129.75\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Plataforma de</text><text x=\"129.75\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Contratación del</text><text x=\"129.75\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Sector Público</text><rect x=\"253.5\" y=\"52\" width=\"219.5\" height=\"190\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"363.25\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--ej)\">QUÉ SE PUBLICA</text><text x=\"363.25\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Memoria justificativa,</text><text x=\"363.25\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">informe de insuficiencia</text><text x=\"363.25\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">de medios, justificación</text><text x=\"363.25\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">del procedimiento,</text><text x=\"363.25\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">pliegos, objeto,</text><text x=\"363.25\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">presupuesto base y</text><text x=\"363.25\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">valor estimado</text><rect x=\"487\" y=\"52\" width=\"219.5\" height=\"190\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"596.75\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--ej)\">Y TAMBIÉN</text><text x=\"596.75\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Anuncios de licitación</text><text x=\"596.75\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">y de adjudicación,</text><text x=\"596.75\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">formalización, medios</text><text x=\"596.75\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">de contacto, número de</text><text x=\"596.75\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">licitadores, recursos</text><text x=\"596.75\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">interpuestos y</text><text x=\"596.75\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">desistimientos</text><rect x=\"720.5\" y=\"52\" width=\"219.5\" height=\"190\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"830.25\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--warn)\">CONTRATOS MENORES</text><text x=\"830.25\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Publicación AL MENOS</text><text x=\"830.25\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">TRIMESTRAL</text><text x=\"830.25\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"830.25\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Objeto, duración,</text><text x=\"830.25\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">importe de adjudicación</text><text x=\"830.25\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">IVA INCLUIDO e</text><text x=\"830.25\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">identidad del</text><text x=\"830.25\" y=\"180\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">adjudicatario</text><text x=\"830.25\" y=\"193\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"830.25\" y=\"206\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 63.4</text><rect x=\"20\" y=\"252\" width=\"920\" height=\"34\" rx=\"8\" fill=\"var(--panel)\" stroke=\"var(--line)\"/><text x=\"480\" y=\"272.328\" text-anchor=\"middle\" font-size=\"10.4\" fill=\"currentColor\">La información del perfil debe estar disponible de forma abierta y con sistemas de sellado de tiempo que acrediten el momento de publicación.</text></svg>"}, {"n": 74, "t": "Exigencia de solvencia", "ubic": "Libro I ▸ Título II ▸ Capítulo II ▸ Sección 1.ª · Aptitud para contratar · Solvencia", "idea": "Para contratar hay que demostrar que se puede: solvencia proporcionada, publicada y vinculada al objeto.", "literal": "<p><b>1.</b> Para celebrar contratos con el sector público los empresarios deberán acreditar estar en posesión de las condiciones mínimas de solvencia económica y financiera y profesional o técnica que se determinen por el órgano de contratación. Este requisito será sustituido por el de la clasificación, cuando esta sea exigible conforme a lo dispuesto en esta Ley.</p><p><b>2.</b> Los requisitos mínimos de solvencia que deba reunir el empresario y la documentación requerida para acreditar los mismos se indicarán en el anuncio de licitación y se especificarán en el pliego del contrato, debiendo estar vinculados a su objeto y ser proporcionales al mismo.</p>", "dis": "<ul>\n<li><b>Regla (74.1):</b> para celebrar contratos con el sector público los empresarios deberán <b>acreditar estar en posesión de las condiciones mínimas de <span class=\"t\" data-k=\"solvencia\">solvencia</span></b>:\n <ul><li><b>económica y financiera</b>, y</li>\n <li><b>profesional o técnica</b>,</li></ul>\n las que <b>determine el órgano de contratación</b>.</li>\n<li><b>Sustitución:</b> «Este requisito será <b>sustituido por el de la <span class=\"t\" data-k=\"clasificacion\">clasificación</span></b>, cuando esta sea exigible conforme a lo dispuesto en esta Ley».</li>\n<li><b>Publicidad (74.2):</b> los requisitos mínimos y la documentación para acreditarlos <b>se indicarán en el anuncio de licitación</b> y <b>se especificarán en el pliego</b>.</li>\n<li><b>Doble límite (74.2):</b> deben estar <b>vinculados al objeto</b> del contrato y ser <b>proporcionales</b> al mismo.</li>\n</ul>", "llano": "<p>Antes de dejar que alguien ejecute un contrato público hay que comprobar que tiene músculo para hacerlo: dinero suficiente y experiencia o medios técnicos. Eso es la solvencia.</p>\n<p>El órgano de contratación decide qué exigir, pero con dos límites: tiene que tener que ver con lo que se contrata y no puede ser desproporcionado. Y hay que publicarlo antes, en el anuncio y en el pliego.</p>", "porque": "<p>Porque una solvencia excesiva es la barrera de entrada más elegante que existe: no excluye a nadie por su nombre, pero deja fuera a todos menos a uno. Exigir cinco años de experiencia en contratos idénticos, o un volumen de negocio diez veces superior al del contrato, elimina a la PYME sin decirlo.</p>\n<p>Por eso el art. 74.2 impone los dos filtros —<b>vinculación</b> y <b>proporcionalidad</b>— y obliga a publicarlos <b>antes</b>, para que puedan discutirse por recurso especial contra el pliego.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> el casero que te pide la nómina antes de alquilarte el piso. Razonable. Pedirte diez nóminas de un sueldo de 6.000 € para un alquiler de 500 € ya no lo es.</li>\n<li><b>Real:</b> en el servicio de limpieza de seis colegios, con un valor estimado anual de 262.809,92 €, el PCAP exige como solvencia técnica «haber ejecutado en los tres últimos años servicios de limpieza de edificios por importe anual igual o superior a 183.966,94 €» —el 70 % de la anualidad— y como solvencia económica un seguro de responsabilidad civil de 300.000 €. Ambas están publicadas en el anuncio y son proporcionales.</li>\n<li><b>Caso límite:</b> el mismo pliego exige haber limpiado <b>colegios públicos de la misma provincia</b>. La vinculación al objeto se rompe: limpiar un colegio no es distinto de limpiar una oficina, y la localización no acredita solvencia. Es un requisito impugnable.</li>\n</ul>", "noej": "<ul>\n<li><b>No es solvencia</b> un criterio de adjudicación: la solvencia es un <b>requisito de aptitud</b> que se cumple o no; el criterio de adjudicación <b>puntúa</b>.</li>\n<li><b>No se acumulan</b> solvencia y clasificación: cuando la clasificación es exigible, <b>sustituye</b> a la acreditación de solvencia.</li>\n<li><b>No vale</b> exigir requisitos que no consten en el anuncio y en el pliego.</li>\n</ul>", "conex": "<ul>\n<li><b>Arts. 87 a 91:</b> medios concretos de acreditar la solvencia económica y técnica.</li>\n<li><b>Arts. 77 a 83:</b> clasificación de las empresas.</li>\n<li><b>Art. 116.4.b) y c):</b> la clasificación exigida y los criterios de solvencia se justifican en el expediente.</li>\n<li><b>Art. 145:</b> criterios de adjudicación, que no deben confundirse con la solvencia.</li>\n<li><b>Art. 44.2.a):</b> el pliego que fija una solvencia desproporcionada es recurrible.</li>\n</ul>", "trampas": "<ul>\n<li><b>Vinculada</b> y <b>proporcional</b>: los dos adjetivos del 74.2 son la clave de casi todas las preguntas.</li>\n<li>La clasificación <b>sustituye</b>, no se suma.</li>\n<li>Se indica en el <b>anuncio</b> y se especifica en el <b>pliego</b>: dos sitios, no uno.</li>\n</ul>", "ancla": "<p><b>«Vinculada y proporcional, publicada antes.»</b></p>\n<p>Y la frontera con los criterios: la solvencia es el <b>portero</b>; los criterios, el <b>jurado</b>.</p>", "vis": "<svg viewBox=\"0 0 960 312\" role=\"img\" aria-label=\"Exigencia, sustitución por la clasificación y límites de la solvencia\" style=\"width:100%;height:auto\"><defs><marker id=\"fl8\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr8\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe8\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw8\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"250\" y=\"8\" width=\"460\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"27.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">LA EXIGENCIA DE SOLVENCIA · ART. 74</text><rect x=\"20\" y=\"52\" width=\"219.5\" height=\"206\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"129.75\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--acc)\">QUÉ HAY QUE ACREDITAR</text><text x=\"129.75\" y=\"91\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Estar en posesión de las</text><text x=\"129.75\" y=\"106\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">CONDICIONES MÍNIMAS DE</text><text x=\"129.75\" y=\"121\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">SOLVENCIA</text><text x=\"129.75\" y=\"136\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"129.75\" y=\"151\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">· económica y financiera</text><text x=\"129.75\" y=\"166\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">· profesional o técnica</text><text x=\"129.75\" y=\"181\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"129.75\" y=\"196\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">determinadas por el órgano</text><text x=\"129.75\" y=\"211\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">de contratación</text><text x=\"129.75\" y=\"226\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"129.75\" y=\"241\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 74.1</text><rect x=\"253.5\" y=\"52\" width=\"219.5\" height=\"206\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"363.25\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--warn)\">CUÁNDO SE SUSTITUYE</text><text x=\"363.25\" y=\"91\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Este requisito SE SUSTITUYE</text><text x=\"363.25\" y=\"106\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">por el de la CLASIFICACIÓN</text><text x=\"363.25\" y=\"121\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">cuando esta sea exigible</text><text x=\"363.25\" y=\"136\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">conforme a la Ley</text><text x=\"363.25\" y=\"151\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"363.25\" y=\"166\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 74.1</text><rect x=\"487\" y=\"52\" width=\"219.5\" height=\"206\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"596.75\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--ej)\">DÓNDE SE PUBLICAN</text><text x=\"596.75\" y=\"91\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Los requisitos mínimos y la</text><text x=\"596.75\" y=\"106\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">documentación para</text><text x=\"596.75\" y=\"121\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">acreditarlos:</text><text x=\"596.75\" y=\"136\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"596.75\" y=\"151\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">· SE INDICAN en el anuncio</text><text x=\"596.75\" y=\"166\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">  de licitación</text><text x=\"596.75\" y=\"181\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">· SE ESPECIFICAN en el</text><text x=\"596.75\" y=\"196\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">  pliego del contrato</text><text x=\"596.75\" y=\"211\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"596.75\" y=\"226\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 74.2</text><rect x=\"720.5\" y=\"52\" width=\"219.5\" height=\"206\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"830.25\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--exc)\">LÍMITE</text><text x=\"830.25\" y=\"91\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Deben estar VINCULADOS</text><text x=\"830.25\" y=\"106\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">al objeto del contrato</text><text x=\"830.25\" y=\"121\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"830.25\" y=\"136\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">y ser PROPORCIONALES</text><text x=\"830.25\" y=\"151\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">al mismo</text><text x=\"830.25\" y=\"166\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"830.25\" y=\"181\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Una solvencia excesiva es</text><text x=\"830.25\" y=\"196\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">una barrera de entrada</text><text x=\"830.25\" y=\"211\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">encubierta</text><text x=\"830.25\" y=\"226\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"830.25\" y=\"241\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 74.2</text><rect x=\"20\" y=\"268\" width=\"920\" height=\"34\" rx=\"8\" fill=\"var(--panel)\" stroke=\"var(--line)\"/><text x=\"480\" y=\"288.328\" text-anchor=\"middle\" font-size=\"10.4\" fill=\"currentColor\">No confundir: la SOLVENCIA dice quién PUEDE contratar; los CRITERIOS DE ADJUDICACIÓN del art. 145 dicen quién GANA.</text></svg>"}, {"n": 99, "t": "Objeto del contrato", "ubic": "Libro II ▸ Título I ▸ Capítulo I ▸ Sección 1.ª · Preparación · Disposiciones generales", "idea": "El objeto debe estar determinado, no se puede trocear para esquivar la ley y, por regla general, hay que dividir en lotes.", "literal": "<p><b>1.</b> El objeto de los contratos del sector público deberá ser determinado. El mismo se podrá definir en atención a las necesidades o funcionalidades concretas que se pretenden satisfacer, sin cerrar el objeto del contrato a una solución única. En especial, se definirán de este modo en aquellos contratos en los que se estime que pueden incorporarse innovaciones tecnológicas, sociales o ambientales que mejoren la eficiencia y sostenibilidad de los bienes, obras o servicios que se contraten.</p><p><b>2.</b> No podrá fraccionarse un contrato con la finalidad de disminuir la cuantía del mismo y eludir así los requisitos de publicidad o los relativos al procedimiento de adjudicación que correspondan.</p><p><b>3.</b> Siempre que la naturaleza o el objeto del contrato lo permitan, deberá preverse la realización independiente de cada una de sus partes mediante su división en lotes, pudiéndose reservar lotes de conformidad con lo dispuesto en la disposición adicional cuarta. No obstante lo anterior, el órgano de contratación podrá no dividir en lotes el objeto del contrato cuando existan motivos válidos, que deberán justificarse debidamente en el expediente, salvo en los casos de contratos de concesión de obras. En todo caso se considerarán motivos válidos, a efectos de justificar la no división en lotes del objeto del contrato, los siguientes:</p><p style=\"margin-left:1.1rem\">a) El hecho de que la división en lotes del objeto del contrato conllevase el riesgo de restringir injustificadamente la competencia. A los efectos de aplicar este criterio, el órgano de contratación deberá solicitar informe previo a la autoridad de defensa de la competencia correspondiente para que se pronuncie sobre la apreciación de dicha circunstancia.</p><p style=\"margin-left:1.1rem\">b) El hecho de que, la realización independiente de las diversas prestaciones comprendidas en el objeto del contrato dificultara la correcta ejecución del mismo desde el punto de vista técnico; o bien que el riesgo para la correcta ejecución del contrato proceda de la naturaleza del objeto del mismo, al implicar la necesidad de coordinar la ejecución de las diferentes prestaciones, cuestión que podría verse imposibilitada por su división en lotes y ejecución por una pluralidad de contratistas diferentes. Ambos extremos deberán ser, en su caso, justificados debidamente en el expediente.</p><p><b>4.</b> Cuando el órgano de contratación proceda a la división en lotes del objeto del contrato, este podrá introducir las siguientes limitaciones, justificándolas debidamente en el expediente:</p><p style=\"margin-left:1.1rem\">a) Podrá limitar el número de lotes para los que un mismo candidato o licitador puede presentar oferta.</p><p style=\"margin-left:1.1rem\">b) También podrá limitar el número de lotes que pueden adjudicarse a cada licitador. Cuando el órgano de contratación considere oportuno introducir alguna de las dos limitaciones a que se refieren las letras a) y b) anteriores, así deberá indicarlo expresamente en el anuncio de licitación y en el pliego de cláusulas administrativas particulares. Cuando se introduzca la limitación a que se refiere la letra b) anterior, además deberán incluirse en los pliegos de cláu

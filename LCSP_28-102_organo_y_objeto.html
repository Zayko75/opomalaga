<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>LCSP · Tema 10 · Bloque 1 · El órgano de contratación, las partes y el objeto</title>
<style>

/* ═══════════════════════════════════════════════════════════════
   SISTEMA DE DISEÑO · "Académico Gamificado" · Bloque II
   Temas 8, 9 y 10 · Auxiliar Administrativo
   ═══════════════════════════════════════════════════════════════ */
:root{
  --fs:16px;

  --bg:#faf9f7;
  --bg-grad:radial-gradient(1100px 560px at 12% -8%, #ede9ff 0%, transparent 55%),
            radial-gradient(850px 460px at 96% 0%, #dcf5ee 0%, transparent 50%);
  --surface:#ffffff;
  --surface-2:#f4f3f0;
  --surface-3:#eceae5;
  --line:#e6e3dc;
  --line-strong:#d4d0c7;

  --ink:#15161c;
  --ink-2:#5d616e;
  --ink-3:#8b8f9c;

  --brand:#5b3df5;
  --brand-2:#7c5cff;
  --brand-soft:#efeaff;
  --brand-ring:rgba(91,61,245,.18);

  --legal:#4338ca;  --legal-bg:#eeecff;
  --ej:#059669;     --ej-bg:#e4f7f0;
  --warn:#c2690a;   --warn-bg:#fdf1de;
  --exc:#dc2626;    --exc-bg:#ffeceb;

  --ok:#16a34a; --ok-soft:#e7f7ec;
  --mid:#eab308; --mid-soft:#fdf6dd;
  --off:#a1a1aa; --off-soft:#f1f1f3;

  --sh-1:0 1px 2px rgba(20,20,30,.04), 0 2px 8px rgba(20,20,30,.04);
  --sh-2:0 2px 6px rgba(20,20,30,.05), 0 12px 28px rgba(20,20,30,.07);
  --sh-3:0 8px 20px rgba(91,61,245,.13), 0 24px 56px rgba(20,20,30,.10);
  --sh-glow:0 0 0 4px var(--brand-ring);

  --r-sm:9px; --r-md:14px; --r-lg:20px; --r-full:999px;

  --f-display:"Segoe UI Variable Display",system-ui,-apple-system,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-legal:ui-serif,Georgia,Cambria,"Times New Roman",serif;
  --f-mono:ui-monospace,"SF Mono","Cascadia Mono","Segoe UI Mono",Menlo,monospace;

  --t-h1:clamp(1.02rem,.95rem + .3vw,1.2rem);
  --t-h2:clamp(1.2rem,1.05rem + .6vw,1.55rem);
  --t-h3:clamp(1rem,.95rem + .25vw,1.12rem);
  --t-sm:.86rem;
  --t-xs:.75rem;

  --e-out:cubic-bezier(.22,1,.36,1);
  --e-spring:cubic-bezier(.34,1.56,.64,1);

  /* ── Compatibilidad con SVG y contenido generado ── */
  --panel:var(--surface);
  --ink2:var(--ink-2);
  --acc:var(--brand);
  --acc-soft:var(--brand-soft);
  --g:var(--ok); --y:var(--mid); --r:var(--exc);
}

html[data-theme="dark"]{
  --bg:#0a0b0f;
  --bg-grad:radial-gradient(1100px 560px at 12% -8%, #1c1740 0%, transparent 55%),
            radial-gradient(850px 460px at 96% 0%, #08302b 0%, transparent 50%);
  --surface:#13151b;
  --surface-2:#1a1d25;
  --surface-3:#232733;
  --line:#262a34;
  --line-strong:#343947;

  --ink:#eceef4;
  --ink-2:#9ba2b3;
  --ink-3:#6e7585;

  --brand:#8b6dff;
  --brand-2:#a78bff;
  --brand-soft:#1e1a3d;
  --brand-ring:rgba(139,109,255,.22);

  --legal:#a5b4fc; --legal-bg:#191b3a;
  --ej:#34d399;    --ej-bg:#0c2a24;
  --warn:#fbbf24;  --warn-bg:#2e2110;
  --exc:#fb7185;   --exc-bg:#331119;

  --ok:#4ade80; --ok-soft:#0e2a19;
  --mid:#facc15; --mid-soft:#2c2610;
  --off:#5b6070; --off-soft:#1c1f27;

  --sh-1:0 1px 2px rgba(0,0,0,.3), 0 2px 8px rgba(0,0,0,.25);
  --sh-2:0 2px 6px rgba(0,0,0,.35), 0 12px 28px rgba(0,0,0,.4);
  --sh-3:0 8px 20px rgba(139,109,255,.2), 0 24px 56px rgba(0,0,0,.5);
}

*,*::before,*::after{box-sizing:border-box}
html{font-size:var(--fs);scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);background-image:var(--bg-grad);
  background-attachment:fixed;background-repeat:no-repeat;
  color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.68;
  -webkit-font-smoothing:antialiased;
  transition:background-color .5s var(--e-out),color .3s;
}
::selection{background:var(--brand);color:#fff}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{font-family:var(--f-display);letter-spacing:-.022em;line-height:1.2}
.num{font-variant-numeric:tabular-nums}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:99px;border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3)}

/* ═══ HEADER ═══ */
header.top{
  position:sticky;top:0;z-index:60;
  background:color-mix(in srgb,var(--surface) 80%,transparent);
  backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);
  border-bottom:1px solid var(--line);
}
.top-in{max-width:1280px;margin:0 auto;padding:.65rem 1.1rem;display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.brandwrap{display:flex;align-items:center;gap:.65rem;min-width:0;flex:1}
.mark{
  width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;
  font-weight:800;font-size:.8rem;letter-spacing:-.02em;text-decoration:none;
  box-shadow:0 4px 14px var(--brand-ring);
  transition:transform .3s var(--e-spring),box-shadow .3s;
}
.mark:hover{transform:rotate(-8deg) scale(1.08);box-shadow:var(--sh-3);text-decoration:none}
.top h1{font-size:var(--t-h1);margin:0;font-weight:800;line-height:1.25;min-width:0}
.top h1 .sub{display:block;font-size:var(--t-xs);color:var(--ink-2);font-weight:500;letter-spacing:0;
  margin-top:.1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tools{margin-left:auto;display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}

button,select,input[type=search]{
  font:inherit;font-size:var(--t-sm);font-weight:600;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:var(--r-sm);padding:.4rem .72rem;cursor:pointer;
  position:relative;overflow:hidden;
  transition:transform .18s var(--e-spring),border-color .2s,background .2s,box-shadow .2s,color .2s;
}
button:hover{transform:translateY(-1.5px);border-color:var(--brand);box-shadow:var(--sh-1)}
button:active{transform:translateY(0) scale(.97)}
button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible{outline:none;box-shadow:var(--sh-glow)}
input[type=search]{min-width:190px;cursor:text;font-weight:500}
input[type=search]:focus{border-color:var(--brand)}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--surface-2);padding:2px;gap:2px}
.seg button{border:0;border-radius:calc(var(--r-sm) - 2px);padding:.32rem .68rem;background:transparent;box-shadow:none}
.seg button:hover{transform:none;background:var(--surface)}
.seg button[aria-pressed="true"]{background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;box-shadow:0 2px 8px var(--brand-ring)}

.ripple{position:absolute;border-radius:50%;transform:scale(0);background:currentColor;opacity:.25;animation:rip .55s linear;pointer-events:none}
@keyframes rip{to{transform:scale(3.4);opacity:0}}

.progress{position:absolute;left:0;bottom:-1px;height:2.5px;width:0;
  background:linear-gradient(90deg,var(--brand),var(--legal),var(--ej));transition:width .1s linear}

/* ═══ LAYOUT ═══ */
.layout{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:270px 1fr;gap:1.8rem;padding:1.4rem 1.1rem 5rem}
main{min-width:0}

/* ═══ SIDEBAR ═══ */
nav.side{
  position:sticky;top:76px;align-self:start;max-height:calc(100vh - 96px);overflow:auto;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:.85rem;box-shadow:var(--sh-1);
}
nav.side h2{font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);
  margin:.5rem .4rem .5rem;font-weight:800}
nav.side h2:first-child{margin-top:.1rem}
nav.side a{
  display:flex;align-items:baseline;gap:.5rem;padding:.36rem .55rem;border-radius:var(--r-sm);
  text-decoration:none;color:var(--ink-2);font-size:var(--t-sm);font-weight:500;
  position:relative;transition:background .22s,color .22s,transform .22s var(--e-out);
}
nav.side a:hover{background:var(--surface-2);color:var(--ink);transform:translateX(3px);text-decoration:none}
nav.side a.on{background:var(--brand-soft);color:var(--brand);font-weight:700}
nav.side a.on::before{content:"";position:absolute;left:-.85rem;top:20%;bottom:20%;width:3px;
  border-radius:0 3px 3px 0;background:var(--brand)}
nav.side a b{color:var(--ink-3);font-weight:800;font-size:var(--t-xs);font-variant-numeric:tabular-nums;flex:none;min-width:1.9em}
nav.side a.on b{color:var(--brand)}
.navtoggle{display:none}

/* ═══ TARJETAS ═══ */
section.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:1.35rem 1.5rem;margin-bottom:1.1rem;box-shadow:var(--sh-1);
  transition:box-shadow .3s var(--e-out),border-color .3s;
}
section.card:hover{box-shadow:var(--sh-2)}
section.card>h2{
  margin:0 0 1rem;font-size:var(--t-h2);font-weight:800;
  display:flex;align-items:center;gap:.6rem;
}
section.card>h2::before{
  content:"";width:4px;height:1.05em;border-radius:99px;flex:none;
  background:linear-gradient(180deg,var(--brand),var(--brand-2));
}

/* ═══ ARTÍCULO ═══ */
.art{scroll-margin-top:86px;padding-top:.4rem}
.art + .art{margin-top:1.6rem;padding-top:1.6rem;border-top:1px dashed var(--line)}
.art h2{display:flex;flex-wrap:wrap;gap:.5rem;align-items:baseline;font-size:var(--t-h3);
  margin:0 0 .25rem;font-weight:800;letter-spacing:-.015em}
.art h2 .num{
  color:var(--brand);font-weight:800;font-family:var(--f-display);
  background:var(--brand-soft);padding:.1rem .5rem;border-radius:var(--r-sm);
  font-size:.92em;letter-spacing:-.02em;
}
.ubic{font-size:var(--t-xs);color:var(--ink-3);margin:0 0 .8rem;font-weight:600;
  letter-spacing:.03em;text-transform:uppercase}

/* ═══ IDEA CLAVE ═══ */
.idea{
  background:linear-gradient(100deg,var(--brand-soft),color-mix(in srgb,var(--brand-soft) 40%,transparent));
  border-left:4px solid var(--brand);border-radius:0 var(--r-md) var(--r-md) 0;
  padding:.75rem 1rem;font-weight:650;margin:.7rem 0 1rem;position:relative;
  font-size:.97rem;line-height:1.55;
}

/* ═══ ACORDEÓN ═══ */
details.panel{
  border:1px solid var(--line);border-radius:var(--r-md);margin:.6rem 0;
  background:var(--surface);overflow:hidden;
  transition:border-color .25s,box-shadow .25s,background .25s;
}
details.panel:hover{border-color:var(--line-strong)}
details.panel[open]{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-ring)}
details.panel>summary{
  cursor:pointer;padding:.62rem .9rem;font-weight:700;font-size:.93rem;
  list-style:none;display:flex;align-items:center;gap:.55rem;
  transition:background .2s,color .2s;
}
details.panel>summary:hover{background:var(--surface-2)}
details.panel[open]>summary{background:var(--brand-soft);color:var(--brand)}
details.panel>summary::-webkit-details-marker{display:none}
details.panel>summary::before{
  content:"";width:16px;height:16px;flex:none;border-radius:5px;
  background:var(--brand-soft);position:relative;transition:transform .3s var(--e-spring),background .25s;
}
details.panel>summary::after{
  content:"";position:absolute;width:0;height:0;margin-left:5px;
  border:4px solid transparent;border-left-color:var(--brand);
  transition:transform .3s var(--e-spring);
}
details.panel[open]>summary::before{background:var(--surface)}
details.panel[open]>summary::after{transform:rotate(90deg) translateX(-1px)}
details.panel .body{padding:.3rem 1rem 1rem;font-size:.95rem;animation:slidein .35s var(--e-out)}
@keyframes slidein{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* ═══ TEXTO LEGAL ═══ */
.legal{
  background:var(--legal-bg);border-left:4px solid var(--legal);
  border-radius:0 var(--r-md) var(--r-md) 0;padding:.85rem 1.05rem;
  font-family:var(--f-legal);font-size:.95rem;line-height:1.7;
}
.legal p{margin:.45rem 0}
.legal .lbl{
  font-family:var(--f-body);font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;
  color:var(--legal);font-weight:800;display:block;margin-bottom:.4rem;
}

/* ═══ CAJAS SEMÁNTICAS ═══ */
.box{
  border-left:4px solid var(--line);border-radius:0 var(--r-md) var(--r-md) 0;
  padding:.72rem .95rem;margin:.65rem 0;font-size:.94rem;
  transition:transform .25s var(--e-out),box-shadow .25s;
}
.box:hover{transform:translateX(3px);box-shadow:var(--sh-1)}
.box.ej{background:var(--ej-bg);border-color:var(--ej)}
.box.warn{background:var(--warn-bg);border-color:var(--warn)}
.box.exc{background:var(--exc-bg);border-color:var(--exc)}
.box .lbl{font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;font-weight:800;
  display:block;margin-bottom:.3rem}
.box.ej .lbl{color:var(--ej)}
.box.warn .lbl{color:var(--warn)}
.box.exc .lbl{color:var(--exc)}

.interp{
  border:1px dashed var(--warn);background:color-mix(in srgb,var(--warn-bg) 45%,transparent);
  border-radius:var(--r-md);padding:.65rem .9rem;font-size:.9rem;margin:.6rem 0;
}
.interp .lbl{font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;color:var(--warn);font-weight:800;display:block}

/* ═══ TABLAS ═══ */
table{width:100%;border-collapse:separate;border-spacing:0;font-size:.9rem;margin:.7rem 0;
  border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
th,td{padding:.5rem .68rem;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
td + td, th + th{border-left:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th{background:var(--surface-2);font-size:var(--t-xs);font-weight:800;letter-spacing:.05em;
  text-transform:uppercase;color:var(--ink-2);position:sticky;top:0}
tbody tr{transition:background .18s}
tbody tr:nth-child(even){background:color-mix(in srgb,var(--surface-2) 45%,transparent)}
tbody tr:hover{background:var(--brand-soft)}
th.sortable{cursor:pointer;user-select:none;transition:color .2s,background .2s}
th.sortable:hover{color:var(--brand);background:var(--brand-soft)}
th.sortable::after{content:" ⇅";color:var(--ink-3);font-size:.7rem}

ul,ol{margin:.5rem 0 .5rem 1.2rem;padding:0}
li{margin:.26rem 0}
li::marker{color:var(--brand);font-weight:700}

/* ═══ TOOLTIPS ═══ */
.t{border-bottom:1.5px dotted var(--brand);cursor:help;position:relative;
  transition:background .2s,color .2s}
.t:hover{background:var(--brand-soft);color:var(--brand);border-radius:3px}
#tip{
  position:fixed;z-index:99;max-width:330px;background:var(--ink);color:var(--bg);
  padding:.6rem .78rem;border-radius:var(--r-md);font-size:.82rem;line-height:1.5;
  display:none;box-shadow:0 8px 30px rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.08);
}
html[data-theme="dark"] #tip{background:#f0f1f5;color:#15161c}

/* ═══ FLECHAS DE DIAGRAMA ═══
   Un <path> con stroke pero sin fill toma el valor inicial (negro) y el
   navegador cierra el trazo implícitamente: aparece un triángulo relleno
   entre sus extremos. Forzamos fill:none para dejar solo la línea + la
   punta del <marker>, que sí lleva su color. */
svg path[stroke]:not([fill]){fill:none}
svg polyline:not([fill]){fill:none}
svg line{fill:none}

/* ═══ SVG ═══ */
svg{max-width:100%;height:auto;display:block;margin:.9rem auto}
svg text{font-family:var(--f-body)}

/* ═══ BUSCADOR ═══ */
mark.hit{background:linear-gradient(180deg,transparent 55%,#ffe066 55%);color:inherit;
  border-radius:2px;padding:0 1px;font-weight:600}
html[data-theme="dark"] mark.hit{background:linear-gradient(180deg,transparent 55%,#8a6d00 55%);color:#fff}

/* ═══ UTILIDADES ═══ */
.hide{display:none !important}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.small{font-size:var(--t-sm);color:var(--ink-2)}
.chip{
  display:inline-block;font-size:var(--t-xs);padding:.16rem .55rem;border-radius:var(--r-full);
  background:var(--brand-soft);color:var(--brand);font-weight:800;letter-spacing:.02em;
}

/* ═══ HUECOS RELLENABLES ═══ */
.gap{
  display:inline-block;min-width:5.5em;border-bottom:2px solid var(--brand);
  text-align:center;font-weight:700;color:transparent;cursor:pointer;
  transition:color .3s,background .3s;
}
.gap.on,.gap:hover{color:var(--brand);background:var(--brand-soft);border-radius:4px 4px 0 0}

/* ═══ REVELAR SOLUCIÓN ═══ */
.revelar{
  background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;border-color:transparent;
  font-weight:700;
}
.revelar:hover{box-shadow:var(--sh-3)}
.sol{
  margin-top:.7rem;padding:.8rem 1rem;border-radius:var(--r-md);
  background:var(--ej-bg);border-left:4px solid var(--ej);
  animation:slidein .4s var(--e-out);
}

/* ═══ TEST ═══ */
.opt{
  display:block;padding:.55rem .85rem;margin:.35rem 0;border:1.5px solid var(--line);
  border-radius:var(--r-md);cursor:pointer;background:var(--surface);font-size:.94rem;
  transition:border-color .22s,background .22s,transform .22s var(--e-out);
}
.opt:hover{border-color:var(--brand);background:var(--brand-soft);transform:translateX(4px)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft);font-weight:650}
.opt.ko{border-color:var(--exc);background:var(--exc-bg)}
.opt input{margin-right:.5rem;accent-color:var(--brand)}

#tscore,#semres{
  font-family:var(--f-display);font-weight:800;font-size:1.15rem;letter-spacing:-.02em;
}

/* ═══════════════════════════════════════════════════════════════
   FLASHCARDS 3D · mazo con giro, vuelo de salida y sheen
   ═══════════════════════════════════════════════════════════════ */
#flash{--fc-e:cubic-bezier(.2,.8,.25,1);--fc-h:250px}

/* — Escena — */
.fc-stage{
  perspective:1400px;perspective-origin:50% 45%;
  padding:.4rem 0 .2rem;position:relative;
}
.fc-deck{position:relative;height:var(--fc-h);will-change:transform}

/* — Cartas fantasma del mazo — */
.fc-ghost{
  position:absolute;inset:0;border-radius:var(--r-lg);
  background:var(--surface);border:1px solid var(--line);
  transition:transform .5s var(--fc-e),opacity .5s var(--fc-e);
}
.fc-ghost.g1{transform:translateY(9px) scale(.972);opacity:.75}
.fc-ghost.g2{transform:translateY(18px) scale(.944);opacity:.45}
.fc-deck.empty .fc-ghost{opacity:0;transform:translateY(26px) scale(.9)}

/* — Elevación durante el giro — */
.fc-lift{position:absolute;inset:0;transform-style:preserve-3d}
.fc-lift.lift{animation:fcLift .78s var(--fc-e)}
@keyframes fcLift{
  0%,100%{transform:scale(1) translateY(0)}
  45%{transform:scale(1.055) translateY(-16px)}
}
.fc-lift.out-ok{animation:fcOut .5s cubic-bezier(.5,0,.75,0) forwards}
.fc-lift.out-ko{animation:fcOutKo .5s cubic-bezier(.5,0,.75,0) forwards}
.fc-lift.in{animation:fcIn .48s var(--fc-e)}
@keyframes fcOut{
  0%{transform:translateX(0) rotate(0) scale(1);opacity:1}
  100%{transform:translateX(130%) rotate(17deg) scale(.85);opacity:0}
}
@keyframes fcOutKo{
  0%{transform:translateX(0) rotate(0) scale(1);opacity:1}
  100%{transform:translateX(-130%) rotate(-17deg) scale(.85);opacity:0}
}
@keyframes fcIn{
  0%{transform:translateY(26px) scale(.9);opacity:0}
  100%{transform:translateY(0) scale(1);opacity:1}
}

/* — La carta — */
.fc-card{
  position:absolute;inset:0;transform-style:preserve-3d;
  transition:transform .78s var(--fc-e);
  cursor:pointer;border-radius:var(--r-lg);
}
.fc-card:focus-visible{outline:none}
.fc-card:focus-visible .fc-face{box-shadow:var(--sh-glow),var(--sh-2)}

/* — Caras — */
.fc-face{
  position:absolute;inset:0;border-radius:var(--r-lg);
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  padding:2rem 2.2rem;text-align:center;overflow:hidden;
  box-shadow:var(--sh-2);
  transition:box-shadow .4s var(--fc-e);
}
.fc-card:hover .fc-face{box-shadow:var(--sh-3)}

/* Anverso · pregunta */
.fc-front{
  background:
    radial-gradient(120% 90% at 50% -20%, var(--brand-soft) 0%, transparent 60%),
    var(--surface);
  border:1.5px solid var(--line);color:var(--ink);
}
/* Reverso · respuesta */
.fc-back{
  transform:rotateY(180deg);
  background:linear-gradient(145deg,var(--brand) 0%,#6d4bf7 45%,var(--c5,#0891b2) 130%);
  border:1.5px solid transparent;color:#fff;
}
html[data-theme="dark"] .fc-back{
  background:linear-gradient(145deg,#5f45c9 0%,#4b3aa8 45%,#0e6b85 130%);
}
.fc-back .fc-txt{color:#fff}
.fc-back b,.fc-back strong{color:#fff;font-weight:800}

/* — Sheen que barre al girar — */
.fc-face::after{
  content:"";position:absolute;top:-60%;left:-70%;width:55%;height:220%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.42),transparent);
  transform:rotate(18deg);opacity:0;pointer-events:none;
}
.fc-lift.lift .fc-face::after{animation:fcSheen .78s var(--fc-e)}
@keyframes fcSheen{
  0%{opacity:0;left:-70%}
  35%{opacity:1}
  100%{opacity:0;left:150%}
}

/* — Etiqueta superior — */
.fc-tag{
  position:absolute;top:1rem;left:1.15rem;
  font-size:var(--t-xs);font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  display:inline-flex;align-items:center;gap:.4rem;
}
.fc-front .fc-tag{color:var(--brand)}
.fc-back .fc-tag{color:rgba(255,255,255,.9)}
.fc-tag::before{
  content:"";width:7px;height:7px;border-radius:50%;background:currentColor;
  animation:fcPulse 2.2s ease-in-out infinite;
}
@keyframes fcPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.65)}}

/* — Índice tipo naipe — */
.fc-pip{
  position:absolute;font-family:var(--f-display);font-weight:800;
  font-size:.78rem;letter-spacing:-.02em;opacity:.34;font-variant-numeric:tabular-nums;
}
.fc-pip.tr{top:1rem;right:1.15rem}
.fc-pip.bl{bottom:1rem;left:1.15rem;transform:rotate(180deg)}
.fc-front .fc-pip{color:var(--ink-2)}
.fc-back .fc-pip{color:#fff;opacity:.55}

/* — Texto — */
.fc-txt{
  font-size:clamp(1rem,.9rem + .55vw,1.28rem);font-weight:650;line-height:1.5;
  max-width:44ch;letter-spacing:-.012em;
}
.fc-front .fc-txt{font-family:var(--f-display);font-weight:700}
.fc-back .fc-txt{font-weight:600;line-height:1.6}
.fc-hint{
  position:absolute;bottom:1rem;left:0;right:0;
  font-size:var(--t-xs);font-weight:600;letter-spacing:.02em;
  display:flex;align-items:center;justify-content:center;gap:.4rem;
}
.fc-front .fc-hint{color:var(--ink-3)}
.fc-back .fc-hint{color:rgba(255,255,255,.72)}
.fc-hint .kbd{
  font-family:var(--f-mono);font-size:.68rem;font-weight:700;padding:.1rem .32rem;
  border-radius:5px;border:1px solid currentColor;opacity:.75;
}

/* — Pantalla final — */
.fc-done{
  position:absolute;inset:0;border-radius:var(--r-lg);
  background:linear-gradient(150deg,var(--ok-soft),var(--surface) 70%);
  border:1.5px solid var(--ok);
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  text-align:center;padding:2rem;gap:.35rem;
  animation:fcIn .5s var(--fc-e);box-shadow:var(--sh-2);
}
.fc-done .seal{
  font-size:2.6rem;line-height:1;
  animation:fcSeal .7s cubic-bezier(.2,1.5,.4,1);
}
@keyframes fcSeal{0%{transform:scale(0) rotate(-25deg);opacity:0}60%{transform:scale(1.2) rotate(6deg)}100%{transform:scale(1) rotate(0);opacity:1}}
.fc-done h3{font-size:1.3rem;font-weight:800;margin:.2rem 0 0}
.fc-done p{margin:0;color:var(--ink-2);font-size:var(--t-sm)}

/* — Barra de progreso de la ronda — */
.fc-bar{
  height:6px;border-radius:99px;background:var(--surface-3);
  overflow:hidden;margin:.95rem 0 .8rem;position:relative;
}
.fc-bar i{
  display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--brand),var(--c5,#0891b2));
  transition:width .55s var(--fc-e);
}

/* — Controles — */
.fc-ctrls{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.fc-ctrls button{font-weight:700}
#fcok{border-color:var(--ok);color:var(--ok)}
#fcok:hover{background:var(--ok);color:#fff;border-color:var(--ok)}
#fcko{border-color:var(--warn);color:var(--warn)}
#fcko:hover{background:var(--warn);color:#fff;border-color:var(--warn)}
#fcflip{background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;border-color:transparent}
#fcflip:hover{box-shadow:var(--sh-3)}

.fc-score{display:inline-flex;gap:.45rem;margin-left:auto;align-items:center}
.fc-pill{
  font-size:var(--t-xs);font-weight:800;padding:.24rem .6rem;border-radius:var(--r-full);
  font-variant-numeric:tabular-nums;border:1px solid;
}
.fc-pill.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.fc-pill.ko{color:var(--warn);border-color:var(--warn);background:var(--warn-bg)}
.fc-pill.left{color:var(--ink-2);border-color:var(--line);background:var(--surface-2)}
.fc-pill.bump{animation:fcBump .45s var(--e-spring)}
@keyframes fcBump{0%{transform:scale(1)}45%{transform:scale(1.28)}100%{transform:scale(1)}}

@media(max-width:620px){
  #flash{--fc-h:270px}
  .fc-face{padding:1.7rem 1.3rem}
  .fc-score{margin-left:0;width:100%}
}
@media(prefers-reduced-motion:reduce){
  .fc-card{transition:none}
  .fc-lift.lift,.fc-lift.in,.fc-lift.out-ok,.fc-lift.out-ko,.fc-face::after{animation:none !important}
}
@media print{.fc-stage,.fc-ctrls,.fc-bar{display:none !important}}
/* ═══ RESPUESTA ESTRUCTURADA ═══ */
.fc-face{justify-content:center}
.fc-face.struct{justify-content:flex-start;text-align:left;padding-top:3.1rem;padding-bottom:3.1rem}
.fc-body{
  width:100%;max-width:46ch;margin:0 auto;
  overflow-y:auto;max-height:100%;
  scrollbar-width:thin;
}
.fc-body::-webkit-scrollbar{width:5px}
.fc-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.35);border-radius:99px;border:0}
.fc-front .fc-body::-webkit-scrollbar-thumb{background:var(--line-strong)}

/* — Veredicto Sí / No — */
.fc-verdict{
  display:inline-flex;align-items:center;gap:.35rem;
  font-family:var(--f-display);font-weight:800;font-size:.82rem;
  letter-spacing:.06em;text-transform:uppercase;
  padding:.26rem .72rem;border-radius:var(--r-full);margin-bottom:.85rem;
  border:1.5px solid;animation:fcPopIn .45s var(--e-spring) backwards;animation-delay:.34s;
}
.fc-verdict.si{background:rgba(255,255,255,.16);border-color:rgba(190,255,215,.85);color:#d8ffe9}
.fc-verdict.no{background:rgba(255,255,255,.16);border-color:rgba(255,205,205,.85);color:#ffdedd}
@keyframes fcPopIn{0%{opacity:0;transform:scale(.7) translateY(6px)}100%{opacity:1;transform:none}}

/* — Párrafo — */
.fc-p{margin:0;font-size:clamp(1rem,.92rem + .45vw,1.2rem);font-weight:600;line-height:1.6}
.fc-face.struct .fc-p{font-size:clamp(.96rem,.9rem + .35vw,1.1rem)}

/* — Lista enumerada — */
.fc-list{list-style:none;margin:0;padding:0;display:grid;gap:.5rem;counter-reset:fc}
.fc-list li{
  counter-increment:fc;position:relative;margin:0;
  padding:.42rem .6rem .42rem 2.5rem;border-radius:var(--r-sm);
  background:rgba(255,255,255,.11);
  font-size:clamp(.92rem,.88rem + .3vw,1.04rem);font-weight:600;line-height:1.45;
  animation:fcRow .42s var(--e-out) backwards;
}
.fc-list li::before{
  content:counter(fc);position:absolute;left:.6rem;top:50%;transform:translateY(-50%);
  width:1.6rem;height:1.6rem;border-radius:50%;
  display:grid;place-items:center;
  background:rgba(255,255,255,.9);color:var(--brand);
  font-family:var(--f-display);font-weight:800;font-size:.78rem;
  font-variant-numeric:tabular-nums;
}
.fc-list.alpha li::before{content:counter(fc,lower-alpha)}
.fc-list li:nth-child(1){animation-delay:.36s}
.fc-list li:nth-child(2){animation-delay:.42s}
.fc-list li:nth-child(3){animation-delay:.48s}
.fc-list li:nth-child(4){animation-delay:.54s}
.fc-list li:nth-child(5){animation-delay:.60s}
.fc-list li:nth-child(n+6){animation-delay:.66s}
@keyframes fcRow{0%{opacity:0;transform:translateX(-12px)}100%{opacity:1;transform:none}}

/* — Cláusulas contrapuestas — */
.fc-clauses{display:grid;gap:.45rem}
.fc-clauses p{
  margin:0;padding:.45rem .7rem .45rem .95rem;border-radius:0 var(--r-sm) var(--r-sm) 0;
  background:rgba(255,255,255,.11);border-left:3px solid rgba(255,255,255,.55);
  font-size:clamp(.92rem,.88rem + .3vw,1.04rem);font-weight:600;line-height:1.5;
  animation:fcRow .42s var(--e-out) backwards;
}
.fc-clauses p:nth-child(1){animation-delay:.36s}
.fc-clauses p:nth-child(2){animation-delay:.44s}
.fc-clauses p:nth-child(3){animation-delay:.52s}

/* — Negritas resaltadas en el reverso — */
.fc-back .fc-body b,.fc-back .fc-body strong{
  font-weight:800;background:rgba(255,255,255,.2);
  padding:.03em .3em;border-radius:5px;
  box-decoration-break:clone;-webkit-box-decoration-break:clone;
}

/* — Cita legal al pie — */
.fc-cite{
  position:absolute;bottom:.95rem;left:0;right:0;
  display:inline-flex;align-items:center;justify-content:center;gap:.4rem;
  font-family:var(--f-mono);font-size:.74rem;font-weight:700;letter-spacing:.02em;
  color:rgba(255,255,255,.82);
  animation:fcPopIn .5s var(--e-out) backwards;animation-delay:.5s;
}
.fc-cite::before,.fc-cite::after{
  content:"";height:1px;width:clamp(18px,10%,52px);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.45));
}
.fc-cite::after{background:linear-gradient(90deg,rgba(255,255,255,.45),transparent)}
.fc-cite .s{font-size:.9rem;opacity:.75;font-family:var(--f-legal)}
.fc-front .fc-cite{color:var(--ink-3)}
.fc-front .fc-cite::before{background:linear-gradient(90deg,transparent,var(--line-strong))}
.fc-front .fc-cite::after{background:linear-gradient(90deg,var(--line-strong),transparent)}

/* la pista se oculta si hay cita, para no amontonar */
.fc-back .fc-cite ~ .fc-hint,.fc-back .fc-hint.muted{display:none}

@media(max-width:620px){
  #flash{--fc-h:320px}
  .fc-face.struct{padding-top:2.9rem;padding-bottom:2.8rem}
  .fc-list li{padding-left:2.3rem}
}
@media(prefers-reduced-motion:reduce){
  .fc-verdict,.fc-list li,.fc-clauses p,.fc-cite{animation:none !important}
}

/* ═══ SEMÁFORO ═══ */
.sembtn{
  border-radius:var(--r-full);padding:.32rem .7rem;font-weight:700;font-size:var(--t-sm);
}
.sembtn[data-v="g"]:hover,.sembtn.on[data-v="g"]{background:var(--ok);color:#fff;border-color:var(--ok)}
.sembtn[data-v="y"]:hover,.sembtn.on[data-v="y"]{background:var(--mid);color:#3d2f00;border-color:var(--mid)}
.sembtn[data-v="r"]:hover,.sembtn.on[data-v="r"]{background:var(--exc);color:#fff;border-color:var(--exc)}

/* ═══ CTA DE BLOQUE ═══ */
a.blk{
  display:inline-flex;align-items:center;gap:.5rem;
  background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;
  padding:.5rem .95rem;border-radius:var(--r-sm);font-weight:700;font-size:var(--t-sm);
  text-decoration:none;box-shadow:0 2px 10px var(--brand-ring);
  transition:transform .22s var(--e-spring),box-shadow .25s,gap .25s var(--e-out);
}
a.blk:hover{transform:translateY(-2px);box-shadow:var(--sh-3);gap:.75rem;text-decoration:none}
a.blk::after{content:"→"}
a.blk:active{transform:translateY(0) scale(.98)}

/* ═══ REVEAL ═══ */
.rv{opacity:0;transform:translateY(20px);transition:opacity .6s var(--e-out),transform .6s var(--e-out)}
.rv.in{opacity:1;transform:none}

/* ═══ RESPONSIVE ═══ */
@media(max-width:960px){
  .layout{grid-template-columns:1fr;padding-top:.9rem;gap:1rem}
  nav.side{position:static;max-height:none}
  nav.side.collapsed .navbody{display:none}
  .navtoggle{display:block;width:100%;text-align:left;font-weight:700}
  .grid2{grid-template-columns:1fr}
  .top h1 .sub{white-space:normal}
}
@media(max-width:620px){
  .top-in{padding:.55rem .8rem}
  .tools{width:100%;margin-left:0}
  input[type=search]{flex:1;min-width:0}
  section.card{padding:1.05rem 1rem;border-radius:var(--r-md)}
  table{font-size:.82rem}
  th,td{padding:.4rem .5rem}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
  .rv{opacity:1;transform:none}
}
@media print{
  header.top,nav.side,.tools,.noprint,.progress{display:none !important}
  body{background:#fff;background-image:none;font-size:11pt;color:#000}
  .layout{display:block;max-width:none;padding:0}
  section.card{border:0;padding:0;margin:0 0 1rem;break-inside:avoid;box-shadow:none}
  details.panel{border:0;box-shadow:none}
  details.panel .body{display:block !important}
  details.panel>summary{padding-left:0}
  .art{break-inside:avoid}
  .rv{opacity:1;transform:none}
  a{color:#000;text-decoration:none}
}


/* ═══ ALTURA ADAPTATIVA DE LA TARJETA ═══ */
.fc-deck{transition:height .45s var(--fc-e)}
.fc-body{max-height:none;overflow:visible}
.fc-measure{
  position:absolute;left:0;right:0;top:0;height:auto;
  visibility:hidden;pointer-events:none;z-index:-1;
}
.fc-measure .fc-face{
  position:relative;inset:auto;height:auto;min-height:0;
  box-shadow:none;backface-visibility:visible;transform:none;
}
.fc-measure .fc-body{max-height:none;overflow:visible}
.fc-measure .fc-face::after{display:none}

/* ═══ MOSTRAR / OCULTAR ÍNDICE LATERAL ═══ */
.layout{transition:grid-template-columns .42s var(--e-out)}
.layout.nonav{grid-template-columns:0 1fr;gap:0}
.layout.nonav>nav.side{
  opacity:0;transform:translateX(-14px);pointer-events:none;
  padding:0;border-width:0;overflow:hidden;width:0;min-width:0;
}
nav.side{
  transition:opacity .3s var(--e-out),transform .38s var(--e-out);
  overflow-x:hidden;
}
#navhide .ic{display:inline-block;transition:transform .35s var(--e-spring);font-size:.95em;line-height:1}
#navhide[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
#navhide[aria-pressed="true"] .ic{transform:rotate(90deg)}
@media(max-width:960px){#navhide{display:none}}

/* ═══════════════════════════════════════════════════════════════
   LECTURA EN VOZ ALTA (TTS) del texto legal
   ═══════════════════════════════════════════════════════════════ */
.tts-bar{
  display:flex;align-items:center;gap:.45rem;flex-wrap:wrap;
  margin:.15rem 0 .7rem;
}
.tts-bar button{
  font-size:var(--t-xs);font-weight:700;padding:.3rem .62rem;
  border-radius:var(--r-full);border:1px solid var(--legal);
  background:transparent;color:var(--legal);
  display:inline-flex;align-items:center;gap:.35rem;line-height:1.2;
}
.tts-bar button:hover{background:var(--legal);color:var(--surface);border-color:var(--legal)}
.tts-bar button[hidden]{display:none}
.tts-bar .tts-play.on{background:var(--legal);color:var(--surface)}

/* Ondas de audio mientras lee */
.tts-wave{display:inline-flex;align-items:flex-end;gap:2px;height:11px}
.tts-wave i{
  width:2.5px;background:currentColor;border-radius:2px;height:35%;
  animation:ttsW .9s ease-in-out infinite;
}
.tts-wave i:nth-child(2){animation-delay:.15s}
.tts-wave i:nth-child(3){animation-delay:.3s}
.tts-wave i:nth-child(4){animation-delay:.45s}
@keyframes ttsW{0%,100%{height:32%}50%{height:100%}}

.tts-time{
  font-family:var(--f-mono);font-size:.7rem;font-weight:700;
  color:var(--ink-3);font-variant-numeric:tabular-nums;
}

/* Frase que se está leyendo */
.tts-s{transition:background .25s,color .25s;border-radius:3px}
.tts-s.now{
  background:linear-gradient(180deg,transparent 8%,color-mix(in srgb,var(--legal) 26%,transparent) 8%);
  box-shadow:0 0 0 2px color-mix(in srgb,var(--legal) 16%,transparent);
}
html[data-theme="dark"] .tts-s.now{
  background:linear-gradient(180deg,transparent 8%,color-mix(in srgb,var(--legal) 34%,transparent) 8%);
}
.legal.tts-on{box-shadow:0 0 0 3px color-mix(in srgb,var(--legal) 20%,transparent)}

/* ═══ Reproductor flotante ═══ */
.tts-mini{
  position:fixed;left:50%;bottom:1.1rem;transform:translateX(-50%) translateY(140%);
  z-index:80;display:flex;align-items:center;gap:.6rem;
  background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  border:1px solid var(--line);border-radius:var(--r-full);
  padding:.5rem .7rem .5rem .95rem;box-shadow:var(--sh-3);
  transition:transform .45s var(--e-spring),opacity .3s;opacity:0;pointer-events:none;
  max-width:min(94vw,540px);
}
.tts-mini.show{transform:translateX(-50%) translateY(0);opacity:1;pointer-events:auto}
.tts-mini .lbl{
  font-size:var(--t-xs);font-weight:800;color:var(--legal);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:16ch;
}
.tts-mini button{
  border-radius:50%;width:32px;height:32px;padding:0;display:grid;place-items:center;
  font-size:.8rem;border:1px solid var(--line);flex:none;
}
.tts-mini button.main{
  width:38px;height:38px;font-size:.95rem;
  background:linear-gradient(140deg,var(--legal),var(--brand));color:#fff;border-color:transparent;
}
.tts-mini .bar{
  flex:1;min-width:70px;height:5px;border-radius:99px;background:var(--surface-3);overflow:hidden;
}
.tts-mini .bar i{display:block;height:100%;width:0;background:var(--legal);
  border-radius:99px;transition:width .35s var(--e-out)}

/* ═══ Panel de ajustes de voz ═══ */
.tts-back{
  position:fixed;inset:0;z-index:90;background:rgba(10,10,18,.45);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  display:grid;place-items:center;padding:1rem;
  opacity:0;pointer-events:none;transition:opacity .3s var(--e-out);
}
.tts-back.show{opacity:1;pointer-events:auto}
.tts-panel{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--sh-3);width:min(94vw,470px);max-height:88vh;overflow:auto;
  padding:1.3rem 1.4rem;transform:translateY(16px) scale(.97);
  transition:transform .38s var(--e-spring);
}
.tts-back.show .tts-panel{transform:none}
.tts-panel h3{
  font-size:1.12rem;font-weight:800;margin:0 0 .25rem;
  display:flex;align-items:center;gap:.5rem;
}
.tts-panel .sub{font-size:var(--t-sm);color:var(--ink-2);margin:0 0 1.1rem}
.tts-row{margin-bottom:1.05rem}
.tts-row > label{
  display:block;font-size:var(--t-xs);font-weight:800;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-2);margin-bottom:.4rem;
}
.tts-seg{display:flex;gap:3px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:3px}
.tts-seg button{
  flex:1;border:0;background:transparent;border-radius:calc(var(--r-sm) - 3px);
  padding:.42rem .3rem;font-size:var(--t-sm);font-weight:700;box-shadow:none;
}
.tts-seg button:hover{transform:none;background:var(--surface)}
.tts-seg button[aria-pressed="true"]{
  background:linear-gradient(140deg,var(--legal),var(--brand));color:#fff;
}
.tts-panel select{
  width:100%;padding:.5rem .6rem;border-radius:var(--r-sm);
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  font-size:var(--t-sm);font-weight:600;cursor:pointer;
}
.tts-panel select:focus{border-color:var(--brand);outline:none}
.tts-slider{display:flex;align-items:center;gap:.75rem}
.tts-slider input[type=range]{flex:1;accent-color:var(--legal);cursor:pointer;height:22px}
.tts-val{
  font-family:var(--f-mono);font-weight:800;font-size:var(--t-sm);
  min-width:3.4em;text-align:right;color:var(--legal);font-variant-numeric:tabular-nums;
}
.tts-note{
  font-size:var(--t-xs);color:var(--ink-2);line-height:1.5;
  background:var(--surface-2);border-radius:var(--r-sm);padding:.6rem .75rem;margin:0 0 1rem;
}
.tts-note b{color:var(--ink)}
.tts-acts{display:flex;gap:.5rem;justify-content:flex-end;flex-wrap:wrap}
.tts-acts .prim{
  background:linear-gradient(140deg,var(--legal),var(--brand));color:#fff;border-color:transparent;
}
.tts-badge{
  font-size:.62rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
  padding:.1rem .35rem;border-radius:4px;background:var(--ej-bg);color:var(--ej);margin-left:.35rem;
}


/* — Variante compacta para los apartados desplegables — */
.tts-bar.mini{margin:0 0 .6rem}
.tts-bar.mini button{
  font-size:.7rem;padding:.24rem .55rem;
  border-color:var(--brand);color:var(--brand);
}
.tts-bar.mini button:hover{background:var(--brand);color:var(--surface)}
.tts-bar.mini .tts-play.on{background:var(--brand);color:var(--surface)}
.tts-bar.mini .tts-time{font-size:.66rem}
.idea .tts-bar.mini{margin:.55rem 0 0}
.legal.tts-on,.body.tts-on,.idea.tts-on{
  box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 20%,transparent)
}
.legal.tts-on{box-shadow:0 0 0 3px color-mix(in srgb,var(--legal) 20%,transparent)}

@media(max-width:620px){
  .tts-mini{left:.6rem;right:.6rem;transform:translateY(140%);max-width:none}
  .tts-mini.show{transform:translateY(0)}
  .tts-mini .lbl{display:none}
}
@media(prefers-reduced-motion:reduce){
  .tts-wave i{animation:none;height:60%}
}
@media print{.tts-bar,.tts-mini,.tts-back{display:none !important}}

<script>
const GLOSARIO={"idoneidad": "Idoneidad del objeto: adecuación de lo que se va a contratar a la necesidad que se quiere satisfacer. Ej.: para atender 610 incidencias anuales de alumbrado, un contrato de suministro de luminarias LED es idóneo; uno de asesoramiento jurídico, no.", "prorroga": "Prórroga: ampliación del plazo de duración de un contrato manteniendo inalteradas sus características. Debe estar prevista, acordarse por el órgano de contratación y preavisarse con dos meses. Ej.: un contrato de 3 años prorrogable por 2.", "prep": "Documentación preparatoria: el conjunto de informes y documentos que se elaboran antes de iniciar el procedimiento de adjudicación y que justifican la decisión de contratar. Ej.: el informe de necesidad del art. 28.1.", "sara": "Contrato sujeto a regulación armonizada (SARA): el que supera el umbral europeo de los arts. 20 a 23 y queda sometido a publicidad en el DOUE y a recurso especial. Ej.: un suministro de 3.570.000 €.", "pliego": "Pliego: documento que fija las condiciones del contrato. El de cláusulas administrativas particulares (PCAP) contiene las reglas jurídicas y económicas; el de prescripciones técnicas (PPT), lo que hay que entregar. Ej.: el PCAP dice cómo se puntúa; el PPT, cuántos GB de RAM debe tener el ordenador.", "pa": "Poder adjudicador: entidad del sector público que, por financiarse mayoritariamente con fondos públicos o estar controlada por ellos, queda sometida a las reglas más exigentes de la ley. Ej.: un ayuntamiento, una diputación, un organismo autónomo local.", "lote": "Lote: cada una de las partes en que se divide el objeto de un contrato para que puedan adjudicarse por separado. Ej.: en un contrato de material de oficina, el lote 1 es papel y el lote 2 consumibles informáticos.", "modif": "Modificación del contrato: alteración de su contenido durante la vigencia. Es «prevista» si el pliego la anunció (art. 204) y «no prevista» si concurre alguno de los supuestos tasados del art. 205. Ej.: ampliar en un 15 % las horas de socorrismo.", "perfil": "Perfil de contratante: espacio en la Plataforma de Contratación del Sector Público donde cada órgano publica su actividad contractual. Ej.: allí se publican la resolución de inicio, los pliegos, las adjudicaciones y los contratos menores.", "ve": "Valor estimado: importe total del contrato sin IVA, incluidas prórrogas, opciones y modificaciones previstas. Ej.: 30 vehículos en renting 48+12 meses a 1.950 €/mes más opción de compra = 3.570.000 €.", "pbl": "Presupuesto base de licitación: límite máximo de gasto que el órgano puede comprometer, IVA incluido. Ej.: 318.000 € IVA incluido en un contrato de limpieza.", "fraccion": "Fraccionamiento: partir artificialmente un contrato para que cada parte quede por debajo de un umbral y eludir la publicidad o el procedimiento. Está prohibido por el art. 99.2. Ej.: ocho contratos menores de 4.900 € para una misma obra de 39.200 €.", "solvencia": "Solvencia: capacidad económica, financiera, técnica o profesional que se exige al licitador para poder contratar. Ej.: haber ejecutado en los tres últimos años servicios análogos por importe igual o superior al anual del contrato.", "clasificacion": "Clasificación: certificación administrativa que acredita de forma automática la solvencia de una empresa en determinados grupos y categorías. Ej.: clasificación en el grupo G, subgrupo 4, categoría 3, para viales.", "organo": "Órgano de contratación: el que, por norma legal, reglamentaria o disposición estatutaria, tiene atribuida la facultad de celebrar contratos en nombre de la entidad. Ej.: el alcalde, la Junta de Gobierno Local por delegación o el Pleno, según la cuantía.", "responsable": "Responsable del contrato: persona física o jurídica, propia o ajena a la entidad, designada obligatoriamente por el órgano de contratación para supervisar la ejecución y dictar instrucciones. Ej.: el jefe del servicio de Deportes en el contrato de socorrismo."};
const ARTS=[{"n": 28, "t": "Necesidad e idoneidad del contrato y eficiencia en la contratación", "ubic": "Libro I ▸ Título I ▸ Capítulo I · Racionalidad y consistencia de la contratación", "idea": "No se contrata porque se quiera: se contrata lo necesario, y hay que dejarlo escrito antes.", "literal": "<p><b>1.</b> Las entidades del sector público no podrán celebrar otros contratos que aquellos que sean necesarios para el cumplimiento y realización de sus fines institucionales. A tal efecto, la naturaleza y extensión de las necesidades que pretenden cubrirse mediante el contrato proyectado, así como la idoneidad de su objeto y contenido para satisfacerlas, cuando se adjudique por un procedimiento abierto, restringido o negociado sin publicidad, deben ser determinadas con precisión, dejando constancia de ello en la documentación preparatoria, antes de iniciar el procedimiento encaminado a su adjudicación.</p><p><b>2.</b> Las entidades del sector público velarán por la eficiencia y el mantenimiento de los términos acordados en la ejecución de los procesos de contratación pública, favorecerán la agilización de trámites, valorarán la incorporación de consideraciones sociales, medioambientales y de innovación como aspectos positivos en los procedimientos de contratación pública y promoverán la participación de la pequeña y mediana empresa y el acceso sin coste a la información, en los términos previstos en la presente Ley.</p><p><b>3.</b> De acuerdo con los principios de necesidad, idoneidad y eficiencia establecidos en este artículo, las entidades del sector público podrán, previo cumplimiento de los requisitos legalmente establecidos, celebrar contratos derivados de proyectos promovidos por la iniciativa privada, en particular con respecto a los contratos de concesión de obras y concesión de servicios, incluidos en su modalidad de sociedad de economía mixta.</p><p><b>4.</b> Las entidades del sector público programarán la actividad de contratación pública, que desarrollarán en un ejercicio presupuestario o períodos plurianuales y darán a conocer su plan de contratación anticipadamente mediante un anuncio de información previa previsto en el artículo 134 que al menos recoja aquellos contratos que quedarán sujetos a una regulación armonizada.</p>", "dis": "<ul>\n<li><b>Supuesto de hecho:</b> cualquier entidad del sector público que vaya a celebrar un contrato.</li>\n<li><b>Prohibición (28.1):</b> no pueden celebrarse otros contratos que los <b>necesarios para el cumplimiento y realización de sus fines institucionales</b>.</li>\n<li><b>Obligación de determinar con precisión</b> dos cosas: la <span class=\"t\" data-k=\"idoneidad\">naturaleza y extensión de las necesidades</span> a cubrir y la <b>idoneidad del objeto y contenido</b> para satisfacerlas.</li>\n<li><b>Cuándo:</b> «<b>antes de iniciar el procedimiento</b> encaminado a su adjudicación».</li>\n<li><b>Dónde:</b> «dejando constancia de ello en la <span class=\"t\" data-k=\"prep\">documentación preparatoria</span>».</li>\n<li><b>Matiz literal que casi nadie lee:</b> el deber de determinar con precisión se enuncia «cuando se adjudique por un procedimiento <b>abierto, restringido o negociado sin publicidad</b>».</li>\n<li><b>28.2 · eficiencia:</b> velar por la eficiencia, agilizar trámites, valorar consideraciones <b>sociales, medioambientales y de innovación</b> y promover la participación de la <b>PYME</b>.</li>\n<li><b>28.4 · programación:</b> se programa la actividad contractual y se da a conocer el plan mediante <b>anuncio de información previa</b> del art. 134, al menos para los contratos <span class=\"t\" data-k=\"sara\">SARA</span>.</li>\n</ul>", "llano": "<p>Antes de sacar nada a licitación hay que responder por escrito a tres preguntas: <b>para qué</b> lo necesito, <b>qué exactamente</b> necesito y <b>por qué esto que voy a comprar sirve</b> para eso. Ese papel se guarda en el expediente y es lo primero que mira quien lo revisa.</p>\n<p>Y una regla de sentido común convertida en ley: un ayuntamiento no puede contratar cosas que no tengan que ver con lo que le toca hacer.</p>", "porque": "<p>Porque el dinero es de todos y la contratación pública es el mayor punto de fuga del gasto. Sin este artículo, el expediente podría empezar por el final: primero se elige a quién se quiere contratar y después se inventa la necesidad. El art. 28 <b>invierte el orden y lo documenta</b>, de modo que la necesidad sea comprobable por la Intervención, por los licitadores y por los tribunales.</p>\n<p>Es además el <b>anclaje</b> de todo el expediente: el art. 116.1 obliga a que la resolución de inicio motive la necesidad «en los términos previstos en el artículo 28».</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> antes de comprar un coche, escribes para qué lo quieres —llevar a tres niños al colegio y cargar material— y por qué un utilitario de dos plazas no te vale. Eso es determinar la necesidad y la idoneidad.</li>\n<li><b>Real:</b> la Diputación de Málaga quiere contratar el <b>mantenimiento del alumbrado de doce carreteras provinciales</b>. En el informe de necesidad hace constar: 4.180 puntos de luz, 312 km, 940 incidencias registradas en 2024, ausencia de brigada propia con capacidad para atenderlas y ahorro estimado del 18 % al sustituir por LED. Eso, firmado y fechado antes de la resolución de inicio, cumple el art. 28.1.</li>\n<li><b>Caso límite:</b> un ayuntamiento contrata el patrocinio de un equipo de fútbol local. ¿Es necesario para sus fines institucionales? Solo si acredita el vínculo con una competencia propia —promoción del deporte, art. 25.2.l) LBRL, <i>norma externa</i>—; si no, el contrato carece de causa habilitante.</li>\n</ul>", "noej": "<ul>\n<li><b>No cumple el art. 28</b> un informe que se limite a decir «se considera necesario contratar el servicio»: no determina ni la <b>extensión</b> de la necesidad ni la <b>idoneidad</b> del objeto.</li>\n<li><b>No cumple</b> la justificación redactada <b>después</b> de la adjudicación, aunque su contenido sea impecable: el artículo exige que sea previa al inicio del procedimiento.</li>\n<li><b>No es el art. 28</b> la justificación de la <b>elección del procedimiento</b>: eso es el art. 116.4.a). El 28 justifica <b>por qué contrato</b>, no <b>cómo lo licito</b>.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 116.1:</b> la resolución de inicio del expediente motiva la necesidad «en los términos previstos en el artículo 28».</li>\n<li><b>Art. 116.4.e):</b> vuelve a exigir que en el expediente se justifique «la necesidad de la Administración a la que se pretende dar satisfacción».</li>\n<li><b>Art. 118.2:</b> en el contrato menor, el informe del órgano de contratación cumple esta misma función.</li>\n<li><b>Art. 134:</b> anuncio de información previa, instrumento de la programación del 28.4.</li>\n<li><b>Art. 1:</b> los principios de libertad de acceso, publicidad, transparencia y eficiente utilización de los fondos, que el art. 28 concreta.</li>\n</ul>", "trampas": "<ul>\n<li><b>Necesidad ≠ idoneidad.</b> La necesidad es del <b>ente</b>; la idoneidad, del <b>objeto</b>. El artículo exige las dos.</li>\n<li>«<b>Antes de iniciar el procedimiento</b>», no antes de adjudicar. Si la pregunta habla de justificar tras la apertura de plicas, es falsa.</li>\n<li>El art. 28 <b>no</b> menciona la eficiencia como principio de las subvenciones ni el mérito y capacidad: si una opción los mezcla, descártala.</li>\n<li>El 28.2 dice «<b>valorarán</b> la incorporación de consideraciones sociales…», no «impondrán». Es un mandato de valoración, no de resultado.</li>\n</ul>", "ancla": "<p><b>N-I-D:</b> <b>N</b>ecesidad · <b>I</b>doneidad · <b>D</b>ocumentación preparatoria. Las tres cosas, y las tres <b>antes</b>.</p>\n<p>Imagen: un cartel en la puerta del despacho de contratación que dice «aquí no se entra sin el papel del 28».</p>", "vis": "<svg viewBox=\"0 0 960 294\" role=\"img\" aria-label=\"Las tres preguntas del artículo 28 antes de iniciar una licitación\" style=\"width:100%;height:auto\"><defs><marker id=\"fl1\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr1\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe1\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw1\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"230\" y=\"8\" width=\"500\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"27.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">ANTES DE LICITAR: LAS TRES PREGUNTAS DEL ART. 28</text><rect x=\"20\" y=\"52\" width=\"290\" height=\"104\" rx=\"10\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"165\" y=\"76\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"var(--acc)\">¿PARA QUÉ?</text><text x=\"165\" y=\"98\" text-anchor=\"middle\" font-size=\"9.6\" fill=\"currentColor\">Solo cabe contratar lo</text><text x=\"165\" y=\"113\" text-anchor=\"middle\" font-size=\"9.6\" fill=\"currentColor\">necesario para los fines</text><text x=\"165\" y=\"128\" text-anchor=\"middle\" font-size=\"9.6\" fill=\"currentColor\">institucionales de la entidad.</text><text x=\"165\" y=\"148\" text-anchor=\"middle\" font-size=\"9.2\" fill=\"var(--ink2)\">art. 28.1</text><rect x=\"330\" y=\"52\" width=\"290\" height=\"104\" rx=\"10\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"475\" y=\"76\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"var(--acc)\">¿QUÉ, EXACTAMENTE?</text><text x=\"475\" y=\"98\" text-anchor=\"middle\" font-size=\"9.6\" fill=\"currentColor\">Naturaleza y extensión de la</text><text x=\"475\" y=\"113\" text-anchor=\"middle\" font-size=\"9.6\" fill=\"currentColor\">necesidad + idoneidad del objeto,</text><text x=\"475\" y=\"128\" text-anchor=\"middle\" font-size=\"9.6\" fill=\"currentColor\">determinadas CON PRECISIÓN.</text><text x=\"475\" y=\"148\" text-anchor=\"middle\" font-size=\"9.2\" fill=\"var(--ink2)\">art. 28.1</text><rect x=\"640\" y=\"52\" width=\"290\" height=\"104\" rx=\"10\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"785\" y=\"76\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"var(--warn)\">¿DÓNDE CONSTA?</text><text x=\"785\" y=\"98\" text-anchor=\"middle\" font-size=\"9.6\" fill=\"currentColor\">En la documentación preparatoria,</text><text x=\"785\" y=\"113\" text-anchor=\"middle\" font-size=\"9.6\" fill=\"currentColor\">ANTES de iniciar el procedimiento</text><text x=\"785\" y=\"128\" text-anchor=\"middle\" font-size=\"9.6\" fill=\"currentColor\">de adjudicación.</text><text x=\"785\" y=\"148\" text-anchor=\"middle\" font-size=\"9.2\" fill=\"var(--ink2)\">art. 28.1</text><path d=\"M480 158 L 480 178\" stroke=\"var(--acc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl1)\"/><rect x=\"20\" y=\"180\" width=\"920\" height=\"54\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"480\" y=\"197.52\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--exc)\">SI FALTA ESTA JUSTIFICACIÓN</text><text x=\"480\" y=\"210.52\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">El expediente nace viciado: falta el presupuesto habilitante de la contratación.</text><text x=\"480\" y=\"223.52\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">Por eso el art. 116.1 obliga a que la resolución de inicio motive la necesidad «en los términos del artículo 28».</text><rect x=\"20\" y=\"244\" width=\"920\" height=\"42\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"480\" y=\"261.86\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"currentColor\">Regla de oro: la necesidad se justifica ANTES; el gasto se aprueba DESPUÉS (art. 117.1).</text><text x=\"480\" y=\"274.86\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"currentColor\">Invertir ese orden es el vicio más habitual en los expedientes reales.</text></svg>"}, {"n": 29, "t": "Plazo de duración de los contratos y de ejecución de la prestación", "ubic": "Libro I ▸ Título I ▸ Capítulo I · Racionalidad y consistencia de la contratación", "idea": "Todo contrato tiene fecha de caducidad, y las prórrogas ni son infinitas ni se dan por sobreentendidas.", "literal": "<p><b>1.</b> La duración de los contratos del sector público deberá establecerse teniendo en cuenta la naturaleza de las prestaciones, las características de su financiación y la necesidad de someter periódicamente a concurrencia la realización de las mismas, sin perjuicio de las normas especiales aplicables a determinados contratos.</p><p><b>2.</b> El contrato podrá prever una o varias prórrogas siempre que sus características permanezcan inalterables durante el período de duración de estas, sin perjuicio de las modificaciones que se puedan introducir de conformidad con lo establecido en los artículos 203 a 207 de la presente Ley. La prórroga se acordará por el órgano de contratación y será obligatoria para el empresario, siempre que su preaviso se produzca al menos con dos meses de antelación a la finalización del plazo de duración del contrato, salvo que en el pliego que rija el contrato se establezca uno mayor. Quedan exceptuados de la obligación de preaviso los contratos cuya duración fuera inferior a dos meses. En ningún caso podrá producirse la prórroga por el consentimiento tácito de las partes. La prórroga del contrato establecida en este apartado no será obligatoria para el contratista en los casos en que en el contrato se dé la causa de resolución establecida en el artículo 198.6 por haberse demorado la Administración en el abono del precio más de seis meses.</p><p><b>3.</b> Cuando se produzca demora en la ejecución de la prestación por parte del empresario, el órgano de contratación podrá conceder una ampliación del plazo de ejecución, sin perjuicio de las penalidades que en su caso procedan, resultando aplicables en el caso de los contratos administrativos lo previsto en los artículos 192 y siguientes de esta Ley.</p><p><b>4.</b> Los contratos de suministros y de servicios de prestación sucesiva tendrán un plazo máximo de duración de cinco años, incluyendo las posibles prórrogas que en aplicación del apartado segundo de este artículo acuerde el órgano de contratación, respetando las condiciones y límites establecidos en las respectivas normas presupuestarias que sean aplicables al ente contratante. Excepcionalmente, en los contratos de suministros y de servicios se podrá establecer un plazo de duración superior al establecido en el párrafo anterior, cuando lo exija el período de recuperación de las inversiones directamente relacionadas con el contrato y estas no sean susceptibles de utilizarse en el resto de la actividad productiva del contratista o su utilización fuera antieconómica, siempre que la amortización de dichas inversiones sea un coste relevante en la prestación del suministro o servicio, circunstancias que deberán ser justificadas en el expediente de contratación con indicación de las inversiones a las que se refiera y de su período de recuperación. El concepto de coste relevante en la prestación del suministro o servicio será objeto de desarrollo reglamentario. El contrato de servicios de mantenimiento que se concierte conjuntamente con el de la compra del bien a mantener, cuando dicho mantenimiento solo pueda ser prestado por razones de exclusividad por la empresa que suministró dicho bien, podrá tener como plazo de duración el de la vida útil del producto adquirido. Asimismo podrá establecerse en los contratos de servicios relativos a los servicios a las personas un plazo de duración mayor cuando ello fuera necesario para la continuidad de aquellos tratamientos a los usuarios en los que el cambio del prestador pudiera repercutir negativamente. No obstante lo establecido en los apartados anteriores, cuando al vencimiento de un contrato no se hubiera formalizado el nuevo contrato que garantice la continuidad de la prestación a realizar por el contratista como consecuencia de incidencias resultantes de acontecimientos imprevisibles para el órgano de contratación producidas en el procedimiento de adjudicación y existan razones de interés público para no interrumpir la prestación, se podrá prorrogar el contrato originario hasta que comience la ejecución del nuevo contrato y en todo caso por un periodo máximo de nueve meses, sin modificar las restantes condiciones del contrato, siempre que el anuncio de licitación del nuevo contrato se haya publicado con una antelación mínima de tres meses respecto de la fecha de finalización del contrato originario o, tratándose de un contrato basado en un acuerdo marco o un contrato específico en el marco un sistema dinámico de adquisición, se hayan enviado las invitaciones a presentar oferta del nuevo contrato basado o específico al menos quince días antes de la finalización del contrato originario.</p><p><b>5.</b> La duración de los contratos de arrendamiento de bienes muebles no podrá exceder, incluyendo las posibles prórrogas que en aplicación del apartado segundo de este artículo acuerde el órgano de contratación, de cinco años.</p><p><b>6.</b> Los contratos de concesión de obras y de concesión de servicios tendrán un plazo de duración limitado, el cual se calculará en función de las obras y de los servicios que constituyan su objeto y se hará constar en el pliego de cláusulas administrativas particulares. Si la concesión de obras o de servicios sobrepasara el plazo de cinco años, la duración máxima de la misma no podrá exceder del tiempo que se calcule razonable para que el concesionario recupere las inversiones realizadas para la explotación de las obras o servicios, junto con un rendimiento sobre el capital invertido, teniendo en cuenta las inversiones necesarias para alcanzar los objetivos contractuales específicos. Las inversiones que se tengan en cuenta a efectos del cálculo incluirán tanto las inversiones iniciales como las realizadas durante la vida de la concesión. En cualquier caso, la duración de los contratos de concesión de obras o de concesión de servicios a la que se refiere el segundo párrafo del presente apartado, no podrá exceder, incluyendo las posibles prórrogas, de:</p><p style=\"margin-left:1.1rem\">a) Cuarenta años para los contratos de concesión de obras, y de concesión de servicios que comprendan la ejecución de obras y la explotación de servicio.</p><p style=\"margin-left:1.1rem\">b) Veinticinco años en los contratos de concesión de servicios que comprendan la explotación de un servicio no relacionado con la prestación de servicios sanitarios.</p><p style=\"margin-left:1.1rem\">c) Diez años en los contratos de concesión de servicios que comprendan la explotación de un servicio cuyo objeto consista en la prestación de servicios sanitarios siempre que no estén comprendidos en la letra a). Los plazos fijados en los pliegos de condiciones solo podrán ser ampliados en un 15 por ciento de su duración inicial para restablecer el equilibrio económico del contrato en las circunstancias previstas en los artículos 270 y 290. No se tendrán en cuenta a efectos del cómputo del plazo de duración de la concesión y del establecido para la ejecución de las obras aquellos períodos en los que estas deban suspenderse por una causa imputable a la Administración concedente o debida a fuerza mayor. Si el concesionario fuera responsable del retraso en la ejecución de las obras se estará a lo dispuesto en el régimen de penalidades contenido en el pliego de cláusulas administrativas particulares y en esta Ley, sin que haya lugar a la ampliación del plazo de la concesión.</p><p><b>7.</b> No obstante lo dispuesto anteriormente, los contratos de servicios que sean complementarios de otros contratos de obras o de suministro podrán tener un plazo de vigencia superior al señalado en el apartado 4 que, en ningún caso, excederá del plazo de duración del contrato principal, salvo en los contratos que comprendan trabajos relacionados con la liquidación del contrato principal, cuyo plazo final excederá al del mismo en el tiempo necesario para realizarlos. Ha de entenderse por contratos complementarios aquellos que tienen una relación de dependencia respecto de otro, el principal, y cuyo objeto se considere necesario para la correcta realización de la prestación o prestaciones a las que se refiera dicho contrato principal. Los contratos de servicios complementarios de un contrato menor de obras podrán tramitarse también como contratos menores, aun cuando su duración exceda del año previsto en el apartado siguiente de este artículo, siempre que cumplan los requisitos previstos en el artículo 118 de esta ley, que su duración no exceda de 30 meses y que el exceso sobre el año de duración venga justificado exclusivamente por la duración del período de garantía establecido en el contrato de obras principal y los trabajos relacionados con la liquidación de dicho contrato principal.</p><p><b>8.</b> Los contratos menores definidos en el apartado primero del artículo 118 no podrán tener una duración superior a un año ni ser objeto de prórroga.</p><p><b>9.</b> El período de recuperación de la inversión a que se refieren los apartados 4 y 6 de este artículo será calculado de acuerdo con lo establecido en el Real Decreto al que se refieren los artículos 4 y 5 de la Ley 2/2015, de 30 de marzo, de desindexación de la economía española.</p>", "dis": "<ul>\n<li><b>Criterio general (29.1):</b> la duración se fija atendiendo a la <b>naturaleza de las prestaciones</b>, a las <b>características de su financiación</b> y a la <b>necesidad de someter periódicamente a concurrencia</b> la prestación.</li>\n<li><b><span class=\"t\" data-k=\"prorroga\">Prórroga</span> (29.2):</b> debe estar <b>prevista</b>; las características han de permanecer <b>inalterables</b>; la acuerda el <b>órgano de contratación</b> y es <b>obligatoria para el empresario</b> si se le preavisa con <b>al menos dos meses</b> de antelación —salvo plazo mayor en el pliego—. <b>Nunca cabe prórroga tácita.</b> Quedan exceptuados del preaviso los contratos de duración inferior a dos meses.</li>\n<li><b>Excepción a la obligatoriedad para el contratista:</b> si concurre la causa de resolución del art. 198.6 por demora de la Administración en el pago superior a <b>seis meses</b>.</li>\n<li><b>Duración máxima ordinaria (29.4):</b> suministros y servicios de prestación sucesiva, <b>cinco años</b> incluidas prórrogas. Excepcionalmente más, si lo exige el período de recuperación de inversiones, justificándolo en el expediente.</li>\n<li><b>Continuidad excepcional (29.4 último párrafo):</b> si al vencer no se ha formalizado el nuevo contrato por incidencias imprevisibles y hay razones de interés público, se prorroga el originario hasta <b>nueve meses</b> como máximo, siempre que el anuncio del nuevo se haya publicado con <b>tres meses</b> de antelación.</li>\n<li><b>Arrendamiento de bienes muebles (29.5):</b> máximo <b>cinco años</b> con prórrogas.</li>\n<li><b>Concesiones (29.6):</b> <b>40 años</b> concesión de obras y de servicios con obras · <b>25 años</b> concesión de servicios no sanitarios · <b>10 años</b> concesión de servicios sanitarios. Ampliables solo un <b>15 %</b> para restablecer el equilibrio económico.</li>\n<li><b>Contrato menor (29.8):</b> duración máxima <b>un año</b> y <b>no</b> puede prorrogarse.</li>\n</ul>", "llano": "<p>Un contrato público no puede durar para siempre, porque cada cierto tiempo hay que volver a abrir la puerta a otras empresas. Por eso la ley pone techos: cinco años en servicios y suministros, un año en los menores, cuarenta como mucho en las grandes concesiones.</p>\n<p>Y si el contrato se va a prorrogar, tiene que estar escrito de antemano y hay que avisar con dos meses. El silencio no prorroga nada.</p>", "porque": "<p>Porque un contrato indefinido es un monopolio encubierto. Si la misma empresa presta el servicio treinta años sin volver a competir, desaparecen la concurrencia y el incentivo a mejorar el precio. El art. 29 traduce a plazos concretos el principio de <b>libertad de acceso a las licitaciones</b> del art. 1.</p>\n<p>Y la <b>prohibición de la prórroga tácita</b> evita el vicio clásico de la contratación pública: el contrato que se va renovando solo, año tras año, porque nadie se acuerda de licitarlo.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> el contrato de la fibra de casa se renueva solo si no dices nada. En lo público es al revés: si nadie dice nada, el contrato se acaba.</li>\n<li><b>Real:</b> un ayuntamiento firma el 1 de marzo de 2023 el servicio de limpieza viaria por <b>tres años prorrogables por dos</b>. Para prorrogarlo desde el 1 de marzo de 2026 debe notificar el preaviso <b>antes del 1 de enero de 2026</b> —dos meses—; la empresa está obligada a aceptarlo. Duración total 3 + 2 = <b>5 años</b>: en el límite del art. 29.4.</li>\n<li><b>Caso límite:</b> el mismo contrato vence y la nueva licitación se ha impugnado. Si el anuncio del nuevo contrato se publicó con tres meses de antelación y hay razones de interés público, cabe prorrogar el originario hasta <b>nueve meses</b> (art. 29.4, último párrafo), sin tocar el resto de condiciones.</li>\n</ul>", "noej": "<ul>\n<li><b>No es prórroga</b> una <span class=\"t\" data-k=\"modif\">modificación del contrato</span>: la prórroga alarga el plazo dejando todo lo demás inalterado; la modificación cambia el contenido (arts. 203 a 207).</li>\n<li><b>No cabe</b> prorrogar un <b>contrato menor</b>, aunque quede crédito y ambas partes quieran (art. 29.8).</li>\n<li><b>No basta</b> con que la prórroga interese a las dos partes: si no estaba <b>prevista</b> en el contrato, no existe.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 118.1 y 29.8:</b> el contrato menor, un año y sin prórroga.</li>\n<li><b>Art. 101.2.a):</b> las prórrogas <b>sí</b> se computan en el valor estimado.</li>\n<li><b>Arts. 203 a 207:</b> modificación del contrato, figura distinta de la prórroga.</li>\n<li><b>Art. 198.6:</b> demora en el pago superior a seis meses como causa de resolución que libera al contratista de la prórroga.</li>\n</ul>", "trampas": "<ul>\n<li><b>Dos meses de preaviso</b>, no un mes. Y el pliego puede exigir más, nunca menos.</li>\n<li>La prórroga es <b>obligatoria para el empresario</b>, no potestativa. Es la respuesta que más se falla.</li>\n<li>Los <b>cinco años</b> del 29.4 son <b>incluyendo</b> las prórrogas, no además de ellas.</li>\n<li>Los plazos de concesión (40/25/10) se confunden entre sí. El <b>10</b> es el de <b>servicios sanitarios</b>.</li>\n</ul>", "ancla": "<p><b>«Dos meses para avisar, cinco años para durar, un año el menor y nunca en silencio.»</b></p>\n<p>Concesiones: <b>40-25-10</b>, de más obra a menos obra. Cuanta más inversión en ladrillo, más años para recuperarla.</p>", "vis": "<svg viewBox=\"0 0 960 440\" role=\"img\" aria-label=\"Duraciones máximas de los contratos y régimen de la prórroga\" style=\"width:100%;height:auto\"><defs><marker id=\"fl2\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr2\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe2\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw2\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"250\" y=\"8\" width=\"460\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"27.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">PLAZOS Y PRÓRROGAS · ART. 29</text><rect x=\"20\" y=\"52\" width=\"920\" height=\"40\" rx=\"10\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><rect x=\"30\" y=\"59\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--exc)\"/><text x=\"120\" y=\"76\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--exc)\">CONTRATO MENOR</text><text x=\"224\" y=\"74\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Máximo un año. NO cabe prórroga.</text><text x=\"930\" y=\"74\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">29.8</text><path d=\"M480 93 L 480 101\" stroke=\"var(--exc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl2)\"/><rect x=\"20\" y=\"102\" width=\"920\" height=\"68\" rx=\"10\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"30\" y=\"117\" width=\"180\" height=\"38\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"120\" y=\"133.5\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--acc)\">SUMINISTROS Y SERVICIOS</text><text x=\"120\" y=\"146.5\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--acc)\">de prestación sucesiva</text><text x=\"224\" y=\"124\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Máximo cinco años INCLUIDAS las prórrogas.</text><text x=\"224\" y=\"138\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Más, solo si lo exige la recuperación de inversiones,</text><text x=\"224\" y=\"152\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">justificado en el expediente.</text><text x=\"930\" y=\"124\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">29.4</text><path d=\"M480 171 L 480 179\" stroke=\"var(--acc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl2)\"/><rect x=\"20\" y=\"180\" width=\"920\" height=\"40\" rx=\"10\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"30\" y=\"181\" width=\"180\" height=\"38\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"120\" y=\"197.5\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--acc)\">ARRENDAMIENTO DE</text><text x=\"120\" y=\"210.5\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--acc)\">BIENES MUEBLES</text><text x=\"224\" y=\"202\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Máximo cinco años con prórrogas.</text><text x=\"930\" y=\"202\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">29.5</text><path d=\"M480 221 L 480 229\" stroke=\"var(--acc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl2)\"/><rect x=\"20\" y=\"230\" width=\"920\" height=\"40\" rx=\"10\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><rect x=\"30\" y=\"237\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--ej)\"/><text x=\"120\" y=\"254\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--ej)\">CONCESIÓN DE OBRAS</text><text x=\"224\" y=\"252\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Cuarenta años. También la de servicios que comprenda obras.</text><text x=\"930\" y=\"252\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">29.6.a</text><path d=\"M480 271 L 480 279\" stroke=\"var(--ej)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl2)\"/><rect x=\"20\" y=\"280\" width=\"920\" height=\"40\" rx=\"10\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><rect x=\"30\" y=\"287\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--ej)\"/><text x=\"120\" y=\"304\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--ej)\">CONCESIÓN DE SERVICIOS</text><text x=\"224\" y=\"302\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Veinticinco años si no es sanitaria; DIEZ si lo es.</text><text x=\"930\" y=\"302\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">29.6.b) y c)</text><path d=\"M480 321 L 480 329\" stroke=\"var(--ej)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl2)\"/><rect x=\"20\" y=\"330\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"30\" y=\"344\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"120\" y=\"361\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--warn)\">PRÓRROGA EXCEPCIONAL</text><text x=\"224\" y=\"352\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Hasta nueve meses si no se ha formalizado el nuevo contrato,</text><text x=\"224\" y=\"366\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">con anuncio del nuevo publicado tres meses antes.</text><text x=\"930\" y=\"352\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">29.4</text><rect x=\"20\" y=\"394\" width=\"920\" height=\"34\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"480\" y=\"414.328\" text-anchor=\"middle\" font-size=\"10.4\" fill=\"currentColor\">Preaviso de la prórroga: DOS MESES como mínimo, salvo plazo mayor en el pliego. Nunca por consentimiento tácito (art. 29.2).</text></svg>"}, {"n": 35, "t": "Contenido mínimo del contrato", "ubic": "Libro I ▸ Título I ▸ Capítulo III · Perfección y forma del contrato", "idea": "Catorce menciones que el documento contractual debe llevar sí o sí, salvo que ya estén en los pliegos.", "literal": "<p><b>1.</b> Los documentos en los que se formalicen los contratos que celebren las entidades del sector público, salvo que ya se encuentren recogidas en los pliegos, deberán incluir, necesariamente, las siguientes menciones:</p><p style=\"margin-left:1.1rem\">a) La identificación de las partes.</p><p style=\"margin-left:1.1rem\">b) La acreditación de la capacidad de los firmantes para suscribir el contrato.</p><p style=\"margin-left:1.1rem\">c) Definición del objeto y tipo del contrato, teniendo en cuenta en la definición del objeto las consideraciones sociales, ambientales y de innovación.</p><p style=\"margin-left:1.1rem\">d) Referencia a la legislación aplicable al contrato, con expresa mención al sometimiento a la normativa nacional y de la Unión Europea en materia de protección de datos.</p><p style=\"margin-left:1.1rem\">e) La enumeración de los documentos que integran el contrato. Si así se expresa en el contrato, esta enumeración podrá estar jerarquizada, ordenándose según el orden de prioridad acordado por las partes, en cuyo supuesto, y salvo caso de error manifiesto, el orden pactado se utilizará para determinar la prevalencia respectiva, en caso de que existan contradicciones entre diversos documentos.</p><p style=\"margin-left:1.1rem\">f) El precio cierto, o el modo de determinarlo.</p><p style=\"margin-left:1.1rem\">g) La duración del contrato o las fechas estimadas para el comienzo de su ejecución y para su finalización, así como la de la prórroga o prórrogas, si estuviesen previstas.</p><p style=\"margin-left:1.1rem\">h) Las condiciones de recepción, entrega o admisión de las prestaciones.</p><p style=\"margin-left:1.1rem\">i) Las condiciones de pago.</p><p style=\"margin-left:1.1rem\">j) Los supuestos en que procede la modificación, en su caso.</p><p style=\"margin-left:1.1rem\">k) Los supuestos en que procede la resolución.</p><p style=\"margin-left:1.1rem\">l) El crédito presupuestario o el programa o rúbrica contable con cargo al que se abonará el precio, en su caso.</p><p style=\"margin-left:1.1rem\">m) La extensión objetiva y temporal del deber de confidencialidad que, en su caso, se imponga al contratista.</p><p style=\"margin-left:1.1rem\">n) La obligación de la empresa contratista de cumplir durante todo el periodo de ejecución de contrato las normas y condiciones fijadas en el convenio colectivo de aplicación.</p><p><b>2.</b> El documento contractual no podrá incluir estipulaciones que establezcan derechos y obl

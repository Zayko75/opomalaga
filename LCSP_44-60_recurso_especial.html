uiriendo la subsanación</b> en tres días hábiles.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> una reclamación devuelta porque la presentaste en el organismo equivocado o fuera de plazo. No se discute si tenías razón.</li>\n<li><b>Real:</b> una empresa recurre el 26 de febrero un pliego cuyo plazo venció el 24. La causa <b>d)</b> es inequívoca y manifiesta: <b>inadmisión</b>.</li>\n<li><b>Caso límite:</b> el escrito lo firma el gerente sin acompañar el poder. No procede inadmitir directamente: procede <b>requerir la subsanación</b> por tres días hábiles (art. 51.2). Solo si no subsana se le tendrá por desistido.</li>\n</ul>", "noej": "<ul>\n<li><b>No es inadmisión</b> la desestimación: la primera no entra en el fondo, la segunda sí.</li>\n<li><b>No cabe</b> inadmitir por un defecto subsanable sin haber requerido antes la subsanación.</li>\n<li><b>No son causas de inadmisión</b> la falta de fundamento del recurso ni la debilidad de la prueba: eso lleva a desestimar.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 44:</b> actos susceptibles de impugnación, cuya ausencia funda la causa c).</li>\n<li><b>Art. 48:</b> legitimación, cuya falta funda la causa b).</li>\n<li><b>Art. 50:</b> plazo, cuyo incumplimiento funda la causa d).</li>\n<li><b>Art. 51.2:</b> subsanación en tres días hábiles.</li>\n<li><b>Art. 57.2:</b> la resolución puede estimar, desestimar o declarar la inadmisión.</li>\n</ul>", "trampas": "<ul>\n<li>Son <b>cuatro</b> causas y están <b>tasadas</b>.</li>\n<li>El estándar es «<b>inequívoco y manifiesto</b>»: si hay duda, se entra en el fondo.</li>\n<li>Un defecto de representación se <b>subsana</b> antes de inadmitir.</li>\n</ul>", "ancla": "<p><b>I-L-A-P:</b> <b>I</b>ncompetencia · <b>L</b>egitimación · <b>A</b>cto no recurrible · <b>P</b>lazo.</p>", "vis": "<svg viewBox=\"0 0 960 206\" role=\"img\" aria-label=\"Supuestos de inadmisión del recurso especial\" style=\"width:100%;height:auto\"><defs><marker id=\"fl9\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr9\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe9\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw9\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"250\" y=\"8\" width=\"460\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"27.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">CUÁNDO SE INADMITE · ART. 55</text><rect x=\"20\" y=\"52\" width=\"219.5\" height=\"100\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"129.75\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--exc)\">a) INCOMPETENCIA</text><text x=\"129.75\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Del órgano para conocer</text><text x=\"129.75\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">del recurso</text><rect x=\"253.5\" y=\"52\" width=\"219.5\" height=\"100\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"363.25\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--exc)\">b) FALTA DE\nLEGITIMACIÓN</text><text x=\"363.25\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Del recurrente, o falta de</text><text x=\"363.25\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">acreditación de la</text><text x=\"363.25\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">representación mediante</text><text x=\"363.25\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">poder suficiente</text><rect x=\"487\" y=\"52\" width=\"219.5\" height=\"100\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"596.75\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--exc)\">c) ACTO NO RECURRIBLE</text><text x=\"596.75\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Haberse interpuesto contra</text><text x=\"596.75\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">actos no susceptibles de</text><text x=\"596.75\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">impugnación conforme</text><text x=\"596.75\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">al art. 44</text><rect x=\"720.5\" y=\"52\" width=\"219.5\" height=\"100\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"830.25\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--exc)\">d) FUERA DE PLAZO</text><text x=\"830.25\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Interposición una vez</text><text x=\"830.25\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">finalizado el plazo</text><text x=\"830.25\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">establecido</text><rect x=\"20\" y=\"162\" width=\"920\" height=\"34\" rx=\"8\" fill=\"var(--panel)\" stroke=\"var(--line)\"/><text x=\"480\" y=\"182.328\" text-anchor=\"middle\" font-size=\"10.4\" fill=\"currentColor\">La inadmisión solo procede cuando el supuesto conste «de modo inequívoco y manifiesto» tras la reclamación y examen del expediente.</text></svg>"}, {"n": 56, "t": "Tramitación del procedimiento", "ubic": "Libro I ▸ Título I ▸ Capítulo V · Del recurso especial en materia de contratación", "idea": "Se rige por la LPAC con especialidades: dos días para el expediente, cinco para alegar, diez de prueba.", "literal": "<p><b>1.</b> El procedimiento para tramitar los recursos especiales en materia de contratación se regirá por las disposiciones de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, con las especialidades que se recogen en los apartados siguientes.</p><p><b>2.</b> Interpuesto el recurso, el órgano competente para la resolución del recurso lo notificará en el mismo día al órgano de contratación con remisión de la copia del escrito de interposición y reclamará el expediente de contratación a la entidad, órgano o servicio que lo hubiese tramitado, quien deberá remitirlo dentro de los dos días hábiles siguientes acompañado del correspondiente informe. Si el recurso se hubiera interpuesto ante el órgano de contratación autor del acto impugnado, este deberá remitirlo al órgano competente para la resolución del recurso dentro de los dos días hábiles siguientes a su recepción acompañado del expediente administrativo y del informe a que se refiere el párrafo anterior.</p><p><b>3.</b> Sin perjuicio de lo dispuesto en el artículo 52 con respecto al acceso al expediente por parte del recurrente, dentro de los cinco días hábiles siguientes a la interposición, el órgano competente para la resolución del recurso dará traslado del mismo a los restantes interesados, concediéndoles un plazo de cinco días hábiles para formular alegaciones, que deberán presentarse necesariamente, en el registro del órgano competente para la resolución del recurso. De forma simultánea a este trámite, decidirá, en el plazo de cinco días hábiles, acerca de las medidas cautelares, si se hubiese solicitado la adopción de alguna en el escrito de interposición del recurso o se hubiera procedido a la acumulación, en el caso de que la solicitud de tales medidas se hubiera realizado con anterioridad a la presentación del recurso. Asimismo en este plazo, resolverá, en su caso, sobre si procede o no el mantenimiento de la suspensión automática prevista en el artículo 53, entendiéndose vigente esta en tanto no se dicte resolución expresa acordando el levantamiento. Si las medidas cautelares se hubieran solicitado después de la interposición del recurso, el órgano competente resolverá sobre ellas en los términos previstos en el párrafo anterior sin suspender el procedimiento principal. En todo caso, las medidas cautelares podrán acordarse de oficio por el órgano competente en cualquier fase del procedimiento dando audiencia sobre ello al órgano de contratación autor del acto impugnado, por plazo de dos días.</p><p><b>4.</b> Los hechos relevantes para la decisión del recurso podrán acreditarse por cualquier medio de prueba admisible en derecho. Cuando los interesados lo soliciten o el órgano encargado de la resolución del recurso no tenga por ciertos los hechos alegados por los interesados o la naturaleza del procedimiento lo exija, podrá acordarse la apertura del período de prueba por plazo de diez días hábiles, a fin de que puedan practicarse cuantas juzgue pertinentes. El órgano competente para la resolución del recurso podrá rechazar las pruebas propuestas por los interesados cuando sean manifiestamente improcedentes o innecesarias, mediante resolución motivada. La práctica de las pruebas se anunciará con antelación suficiente a los interesados.</p><p><b>5.</b> El órgano competente para la resolución del recurso deberá, en todo caso, garantizar la confidencialidad y el derecho a la protección de los secretos comerciales en relación con la información contenida en el expediente de contratación, sin perjuicio de que pueda conocer y tomar en consideración dicha información a la hora de resolver. Corresponderá a dicho órgano resolver acerca de cómo garantizar la confidencialidad y el secreto de la información que obre en el expediente de contratación, sin que por ello, resulten perjudicados los derechos de los demás interesados a la protección jurídica efectiva y al derecho de defensa en el procedimiento.</p>", "dis": "<ul>\n<li><b>Norma supletoria (56.1):</b> el procedimiento se rige por la <b>Ley 39/2015</b> con las especialidades de los apartados siguientes.</li>\n<li><b>Remisión del expediente (56.2):</b> interpuesto el recurso, el órgano competente lo notifica <b>en el mismo día</b> al órgano de contratación y le reclama el expediente, que debe remitirse <b>dentro de los dos días hábiles siguientes</b> acompañado del <b>informe</b> correspondiente. Si el recurso se interpuso ante el órgano de contratación, este lo remite al tribunal en el mismo plazo de <b>dos días hábiles</b>.</li>\n<li><b>Traslado y alegaciones (56.3):</b> dentro de los <b>cinco días hábiles</b> siguientes a la interposición se da traslado a los demás interesados, con un plazo de <b>cinco días hábiles</b> para alegaciones. De forma simultánea, en el mismo plazo de <b>cinco días hábiles</b>, se decide sobre las <b>medidas cautelares</b> y sobre el mantenimiento de la <span class=\"t\" data-k=\"suspauto\">suspensión automática</span> del art. 53, que sigue vigente en tanto no se dicte resolución expresa de levantamiento.</li>\n<li><b>Cautelares de oficio:</b> pueden acordarse en cualquier fase, con audiencia al órgano de contratación por plazo de <b>dos días</b>.</li>\n<li><b>Prueba (56.4):</b> puede acordarse la apertura de un período de prueba por <b>diez días hábiles</b>. El órgano puede rechazar motivadamente las pruebas manifiestamente improcedentes o innecesarias.</li>\n<li><b><span class=\"t\" data-k=\"confid\">Confidencialidad</span> (56.5):</b> el órgano debe garantizar la <b>confidencialidad y la protección de los secretos comerciales</b>, sin perjuicio de conocer esa información para resolver y sin perjudicar el derecho de defensa de los demás interesados.</li>\n</ul>", "llano": "<p>El procedimiento va deprisa. El mismo día en que se recibe el recurso se avisa al órgano de contratación, que tiene dos días hábiles para mandar el expediente y su informe. En cinco días hábiles se da traslado a los demás y se decide sobre las cautelares; los demás tienen otros cinco para alegar. Si hace falta prueba, diez días hábiles.</p>", "porque": "<p>Porque todo el sistema depende de resolver <b>antes</b> de que el contrato se formalice. Un procedimiento con los plazos ordinarios de la LPAC —diez días de alegaciones, quince de audiencia, tres meses para resolver— haría inútil el recurso.</p>\n<p>Y la regla de confidencialidad resuelve una tensión real: el recurrente necesita ver la oferta ganadora para atacarla, pero esa oferta puede contener secretos industriales. La solución es que el tribunal <b>sí</b> los ve y decide cómo proteger ambos intereses.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> una reclamación de consumo con plazos comprimidos porque el producto está a punto de agotarse.</li>\n<li><b>Real:</b> recurso interpuesto el lunes 3. Ese mismo día el tribunal lo notifica al ayuntamiento, que remite el expediente y el informe el miércoles 5 —dos días hábiles—. El viernes 7 se da traslado a los otros cuatro licitadores, que alegan hasta el viernes 14. En ese mismo trámite se decide mantener la suspensión automática.</li>\n<li><b>Caso límite:</b> el recurrente pide que se practique una pericial sobre la viabilidad de la oferta ganadora. El tribunal puede abrir un período de <b>diez días hábiles</b> o rechazarla motivadamente si la considera innecesaria.</li>\n</ul>", "noej": "<ul>\n<li><b>No se aplican</b> los plazos generales de la LPAC en lo que este artículo regula: la LPAC es supletoria.</li>\n<li><b>No se levanta sola</b> la suspensión automática del art. 53: sigue vigente «en tanto no se dicte resolución expresa acordando el levantamiento».</li>\n<li><b>No puede</b> el tribunal negarse a ver la información confidencial: debe conocerla y decidir cómo protegerla.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 53:</b> suspensión automática al recurrir la adjudicación.</li>\n<li><b>Art. 49:</b> medidas cautelares solicitadas antes del recurso.</li>\n<li><b>Art. 57:</b> resolución en cinco días hábiles.</li>\n<li><b>Art. 133:</b> confidencialidad.</li>\n<li><b>Ley 39/2015</b> <i>(otra norma de la biblioteca)</i>: norma supletoria del procedimiento.</li>\n</ul>", "trampas": "<ul>\n<li>Cadena de plazos: <b>mismo día · 2 · 5 · 5 · 10 · 5</b>.</li>\n<li>Los <b>dos días hábiles</b> de remisión del expediente valen tanto si el recurso se presentó ante el tribunal como ante el órgano de contratación.</li>\n<li>La decisión sobre cautelares y sobre el mantenimiento de la suspensión se toma <b>simultáneamente</b> al traslado, en cinco días hábiles.</li>\n</ul>", "ancla": "<p><b>0-2-5-5-10-5:</b> mismo día para avisar · dos para el expediente · cinco para el traslado y las cautelares · cinco para alegar · diez de prueba · cinco para resolver.</p>", "vis": "<svg viewBox=\"0 0 960 462\" role=\"img\" aria-label=\"Plazos del procedimiento del recurso especial en materia de contratación\" style=\"width:100%;height:auto\"><defs><marker id=\"fl10\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr10\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe10\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw10\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"250\" y=\"8\" width=\"460\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"27.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">TRAMITACIÓN DEL RECURSO · ARTS. 56 Y 57</text><rect x=\"20\" y=\"52\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"30\" y=\"66\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"120\" y=\"83\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--acc)\">INTERPOSICIÓN</text><text x=\"224\" y=\"74\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Escrito ante el órgano de contratación o ante el tribunal competente.</text><text x=\"224\" y=\"88\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Anuncio previo, en su caso, y quince días hábiles de plazo.</text><text x=\"930\" y=\"74\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">50 y 51</text><path d=\"M480 107 L 480 115\" stroke=\"var(--acc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl10)\"/><rect x=\"20\" y=\"116\" width=\"920\" height=\"40\" rx=\"10\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"30\" y=\"123\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"120\" y=\"140\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--warn)\">2 DÍAS HÁBILES</text><text x=\"224\" y=\"138\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Remisión del expediente de contratación con el informe correspondiente.</text><text x=\"930\" y=\"138\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">56.2</text><path d=\"M480 157 L 480 165\" stroke=\"var(--warn)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl10)\"/><rect x=\"20\" y=\"166\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"30\" y=\"180\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"120\" y=\"197\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--warn)\">5 DÍAS HÁBILES</text><text x=\"224\" y=\"188\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Traslado a los demás interesados. Y en el mismo plazo se decide sobre</text><text x=\"224\" y=\"202\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">medidas cautelares y sobre el mantenimiento de la suspensión automática.</text><text x=\"930\" y=\"188\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">56.3</text><path d=\"M480 221 L 480 229\" stroke=\"var(--warn)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl10)\"/><rect x=\"20\" y=\"230\" width=\"920\" height=\"40\" rx=\"10\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><rect x=\"30\" y=\"237\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--ej)\"/><text x=\"120\" y=\"254\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--ej)\">5 DÍAS HÁBILES</text><text x=\"224\" y=\"252\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Plazo de los interesados para formular ALEGACIONES.</text><text x=\"930\" y=\"252\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">56.3</text><path d=\"M480 271 L 480 279\" stroke=\"var(--ej)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl10)\"/><rect x=\"20\" y=\"280\" width=\"920\" height=\"40\" rx=\"10\" fill=\"var(--panel)\" stroke=\"var(--line)\"/><rect x=\"30\" y=\"287\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--line)\"/><text x=\"120\" y=\"304\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"currentColor\">PRUEBA · 10 DÍAS HÁBILES</text><text x=\"224\" y=\"302\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Si se acuerda la práctica de prueba, período de diez días hábiles.</text><text x=\"930\" y=\"302\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">56.4</text><path d=\"M480 321 L 480 329\" stroke=\"var(--line)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl10)\"/><rect x=\"20\" y=\"330\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><rect x=\"30\" y=\"344\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--ej)\"/><text x=\"120\" y=\"361\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--ej)\">RESOLUCIÓN · 5 DÍAS HÁBILES</text><text x=\"224\" y=\"352\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Desde recibidas las alegaciones o transcurrido su plazo y el de prueba.</text><text x=\"224\" y=\"366\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Se notifica a continuación a todos los interesados.</text><text x=\"930\" y=\"352\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">57.1</text><path d=\"M480 385 L 480 393\" stroke=\"var(--ej)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl10)\"/><rect x=\"20\" y=\"394\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><rect x=\"30\" y=\"408\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--exc)\"/><text x=\"120\" y=\"425\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--exc)\">SILENCIO · 2 MESES</text><text x=\"224\" y=\"416\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Transcurridos dos meses desde el siguiente a la interposición sin</text><text x=\"224\" y=\"430\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">notificar resolución, se entiende DESESTIMADO a efectos del contencioso.</text><text x=\"930\" y=\"416\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">57.5</text></svg>"}, {"n": 57, "t": "Resolución del recurso especial", "ubic": "Libro I ▸ Título I ▸ Capítulo V · Del recurso especial en materia de contratación", "idea": "Cinco días hábiles para resolver; a los dos meses sin respuesta, se entiende desestimado.", "literal": "<p><b>1.</b> Una vez recibidas las alegaciones de los interesados, o transcurrido el plazo señalado para su formulación, y el de la prueba, en su caso, el órgano competente deberá resolver el recurso dentro de los cinco días hábiles siguientes, notificándose a continuación la resolución a todos los interesados.</p><p><b>2.</b> La resolución del recurso estimará en todo o en parte o desestimará las pretensiones formuladas o declarará su inadmisión, decidiendo motivadamente cuantas cuestiones se hubiesen planteado. En todo caso, la resolución será congruente con la petición y, de ser procedente, se pronunciará sobre la anulación de las decisiones no conformes a derecho adoptadas durante el procedimiento de adjudicación, incluyendo la supresión de las características técnicas, económicas o financieras discriminatorias contenidas en el anuncio de licitación, anuncio indicativo, pliegos, condiciones reguladoras del contrato o cualquier otro documento relacionado con la licitación o adjudicación, así como, si procede, sobre la retroacción de actuaciones. En todo caso la estimación del recurso que conlleve anulación de cláusulas o condiciones de los pliegos o documentación contractual de naturaleza análoga, determinará la anulación de los actos del expediente de contratación relacionados con su aprobación.</p><p><b>3.</b> La resolución deberá acordar el levantamiento de la suspensión del acto de adjudicación si en el momento de dictarla continuase suspendido, así como de las restantes medidas cautelares que se hubieran acordado y la devolución de las garantías cuya constitución se hubiera exigido para la efectividad de las mismas, si procediera.</p><p><b>4.</b> En caso de estimación total o parcial del recurso, el órgano de contratación deberá dar conocimiento al órgano que hubiera dictado la resolución, de las actuaciones adoptadas para dar cumplimiento a la misma.</p><p><b>5.</b> Transcurridos dos meses contados desde el siguiente a la interposición del recurso sin que se haya notificado su resolución, el interesado podrá considerarlo desestimado a los efectos de interponer recurso contencioso-administrativo.</p>", "dis": "<ul>\n<li><b>Plazo (57.1):</b> recibidas las alegaciones o transcurrido su plazo y el de la prueba, el órgano <b>deberá resolver dentro de los cinco días hábiles siguientes</b>, notificándose a continuación a todos los interesados.</li>\n<li><b>Contenido (57.2):</b> la resolución <b>estimará total o parcialmente</b>, <b>desestimará</b> o declarará la <b>inadmisión</b>, decidiendo motivadamente cuantas cuestiones se hubiesen planteado. Será <b>congruente con la petición</b> y se pronunciará, de ser procedente, sobre la <b>anulación de las decisiones no conformes a derecho</b>, incluida la <b>supresión de las características técnicas, económicas o financieras discriminatorias</b>, y sobre la <span class=\"t\" data-k=\"retroacc\">retroacción de actuaciones</span>.</li>\n<li><b>Efecto en cadena:</b> la estimación que conlleve <b>anulación de cláusulas o condiciones de los pliegos</b> determinará la <b>anulación de los actos del expediente relacionados con su aprobación</b>.</li>\n<li><b>Levantamiento (57.3):</b> la resolución debe acordar el <b>levantamiento de la suspensión</b> del acto de adjudicación si continuase suspendido, y de las demás medidas cautelares, con <b>devolución de las garantías</b> exigidas para su efectividad.</li>\n<li><b>Cumplimiento (57.4):</b> en caso de estimación total o parcial, el órgano de contratación debe dar conocimiento al tribunal de las actuaciones adoptadas para cumplirla.</li>\n<li><b>Silencio (57.5):</b> transcurridos <b>dos meses</b> desde el siguiente a la interposición sin notificarse la resolución, el interesado podrá considerarlo <b>desestimado</b> a los efectos de interponer recurso contencioso-administrativo.</li>\n</ul>", "llano": "<p>El tribunal tiene cinco días hábiles para resolver desde que terminan las alegaciones y la prueba. Puede dar la razón entera, en parte, negarla o no entrar en el fondo. Si anula una cláusula del pliego, se caen también los actos que aprobaron ese pliego.</p>\n<p>Y si pasan dos meses sin respuesta, se puede ir al juzgado entendiendo que se ha desestimado.</p>", "porque": "<p>Porque un recurso rápido sin plazo de resolución no sirve de nada. Los cinco días hábiles son el compromiso de agilidad; el silencio negativo a los dos meses es la <b>válvula de escape</b> que impide que la inactividad del tribunal bloquee el acceso a la justicia.</p>\n<p>Y la anulación en cadena del 57.2 es lo que hace útil impugnar un pliego: no basta con anular la cláusula si sobrevive el acuerdo que la aprobó.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> si anulan una pregunta de un examen, hay que rehacer las notas de todos, no solo la de quien reclamó.</li>\n<li><b>Real:</b> el tribunal estima el recurso contra el PCAP del servicio de socorrismo y anula la cláusula que exigía clasificación. Por el art. 57.2, se anulan también los actos del expediente relacionados con la aprobación del pliego, y se ordena la <b>retroacción</b> al momento de su aprobación.</li>\n<li><b>Caso límite:</b> el recurso se interpuso el 3 de febrero y el 4 de abril aún no hay resolución. La empresa puede considerarlo <b>desestimado</b> e interponer contencioso-administrativo (57.5).</li>\n</ul>", "noej": "<ul>\n<li><b>No es un silencio positivo</b>: a los dos meses se entiende <b>desestimado</b>.</li>\n<li><b>No se levanta</b> la suspensión por el mero transcurso del tiempo: hace falta <b>resolución expresa</b>.</li>\n<li><b>No basta</b> con anular la cláusula discriminatoria: la ley obliga a anular también los actos de aprobación del pliego.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 56:</b> tramitación previa.</li>\n<li><b>Art. 53:</b> suspensión automática, que se levanta con esta resolución.</li>\n<li><b>Art. 59:</b> efectos de la resolución y recurso contencioso.</li>\n<li><b>Art. 150.4:</b> si hay que adjudicar a otro licitador, diez días hábiles para cumplimentar trámites.</li>\n<li><b>Art. 122.1:</b> la retroacción de actuaciones por vicios del pliego.</li>\n</ul>", "trampas": "<ul>\n<li><b>Cinco días hábiles</b> para resolver; <b>dos meses</b> para el silencio desestimatorio.</li>\n<li>La resolución <b>debe</b> pronunciarse sobre el levantamiento de la suspensión: no es potestativo.</li>\n<li>La anulación de una cláusula del pliego <b>arrastra</b> los actos de aprobación.</li>\n</ul>", "ancla": "<p><b>«Cinco para resolver, dos meses para rendirse.»</b></p>", "vis": "<svg viewBox=\"0 0 960 462\" role=\"img\" aria-label=\"Plazos del procedimiento del recurso especial en materia de contratación\" style=\"width:100%;height:auto\"><defs><marker id=\"fl11\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr11\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe11\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw11\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"250\" y=\"8\" width=\"460\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"27.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">TRAMITACIÓN DEL RECURSO · ARTS. 56 Y 57</text><rect x=\"20\" y=\"52\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"30\" y=\"66\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"120\" y=\"83\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--acc)\">INTERPOSICIÓN</text><text x=\"224\" y=\"74\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Escrito ante el órgano de contratación o ante el tribunal competente.</text><text x=\"224\" y=\"88\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Anuncio previo, en su caso, y quince días hábiles de plazo.</text><text x=\"930\" y=\"74\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">50 y 51</text><path d=\"M480 107 L 480 115\" stroke=\"var(--acc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl11)\"/><rect x=\"20\" y=\"116\" width=\"920\" height=\"40\" rx=\"10\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"30\" y=\"123\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"120\" y=\"140\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--warn)\">2 DÍAS HÁBILES</text><text x=\"224\" y=\"138\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Remisión del expediente de contratación con el informe correspondiente.</text><text x=\"930\" y=\"138\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">56.2</text><path d=\"M480 157 L 480 165\" stroke=\"var(--warn)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl11)\"/><rect x=\"20\" y=\"166\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"30\" y=\"180\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"120\" y=\"197\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--warn)\">5 DÍAS HÁBILES</text><text x=\"224\" y=\"188\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Traslado a los demás interesados. Y en el mismo plazo se decide sobre</text><text x=\"224\" y=\"202\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">medidas cautelares y sobre el mantenimiento de la suspensión automática.</text><text x=\"930\" y=\"188\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">56.3</text><path d=\"M480 221 L 480 229\" stroke=\"var(--warn)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl11)\"/><rect x=\"20\" y=\"230\" width=\"920\" height=\"40\" rx=\"10\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><rect x=\"30\" y=\"237\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--ej)\"/><text x=\"120\" y=\"254\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--ej)\">5 DÍAS HÁBILES</text><text x=\"224\" y=\"252\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Plazo de los interesados para formular ALEGACIONES.</text><text x=\"930\" y=\"252\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">56.3</text><path d=\"M480 271 L 480 279\" stroke=\"var(--ej)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl11)\"/><rect x=\"20\" y=\"280\" width=\"920\" height=\"40\" rx=\"10\" fill=\"var(--panel)\" stroke=\"var(--line)\"/><rect x=\"30\" y=\"287\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--line)\"/><text x=\"120\" y=\"304\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"currentColor\">PRUEBA · 10 DÍAS HÁBILES</text><text x=\"224\" y=\"302\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Si se acuerda la práctica de prueba, período de diez días hábiles.</text><text x=\"930\" y=\"302\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">56.4</text><path d=\"M480 321 L 480 329\" stroke=\"var(--line)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl11)\"/><rect x=\"20\" y=\"330\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><rect x=\"30\" y=\"344\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--ej)\"/><text x=\"120\" y=\"361\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--ej)\">RESOLUCIÓN · 5 DÍAS HÁBILES</text><text x=\"224\" y=\"352\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Desde recibidas las alegaciones o transcurrido su plazo y el de prueba.</text><text x=\"224\" y=\"366\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Se notifica a continuación a todos los interesados.</text><text x=\"930\" y=\"352\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">57.1</text><path d=\"M480 385 L 480 393\" stroke=\"var(--ej)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl11)\"/><rect x=\"20\" y=\"394\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><rect x=\"30\" y=\"408\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--exc)\"/><text x=\"120\" y=\"425\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--exc)\">SILENCIO · 2 MESES</text><text x=\"224\" y=\"416\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Transcurridos dos meses desde el siguiente a la interposición sin</text><text x=\"224\" y=\"430\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">notificar resolución, se entiende DESESTIMADO a efectos del contencioso.</text><text x=\"930\" y=\"416\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">57.5</text></svg>"}, {"n": 58, "t": "Indemnizaciones y multas", "ubic": "Libro I ▸ Título I ▸ Capítulo V · Del recurso especial en materia de contratación", "idea": "Se puede indemnizar al recurrente y multar de 1.000 a 30.000 € a quien recurre de mala fe.", "literal": "<p><b>1.</b> El órgano competente para la resolución del recurso, a solicitud del interesado, podrá imponer a la entidad contratante la obligación de indemnizar a la persona interesada por los daños y perjuicios que le haya podido ocasionar la infracción legal que hubiese dado lugar al recurso, resarciéndole, cuando menos, de los gastos ocasionados por la preparación de la oferta o la participación en el procedimiento de contratación. La cuantía de la indemnización se fijará atendiendo en lo posible a los criterios establecidos en el Capítulo IV del Título Preliminar de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público.</p><p><b>2.</b> En caso de que el órgano competente aprecie temeridad o mala fe en la interposición del recurso o en la solicitud de medidas cautelares, podrá acordar la imposición de una multa al responsable de la misma. El importe de la multa será de entre 1.000 y 30.000 euros, determinándose su cuantía en función de la mala fe apreciada y el perjuicio ocasionado al órgano de contratación y a los restantes licitadores, así como del cálculo de los beneficios obtenidos. El importe de la multa impuesta se ingresará en todo caso en el Tesoro Público. Las cuantías indicadas en este apartado podrán ser actualizadas por Orden del Ministro de Hacienda y Función Pública. Téngase en cuenta que se declara que el apartado 2 es conforme con el orden constitucional de competencias, siempre que se interprete en los términos establecidos en el fundamento jurídico 6 E) d), por la Sentencia del TC 68/2021, de 18 de marzo. Ref. BOE- A-2021-6614</p>", "dis": "<ul>\n<li><b>Indemnización (58.1):</b> <b>a solicitud del interesado</b>, el órgano competente <b>podrá imponer a la entidad contratante</b> la obligación de <b>indemnizar</b> por los daños y perjuicios causados por la infracción legal que dio lugar al recurso, resarciéndole <b>cuando menos de los gastos ocasionados por la preparación de la oferta o la participación</b> en el procedimiento. La cuantía se fija atendiendo, en lo posible, a los criterios del capítulo IV del título preliminar de la <b>Ley 40/2015</b>.</li>\n<li><b>Multa (58.2):</b> si el órgano aprecia <b>temeridad o mala fe</b> en la interposición del recurso o en la solicitud de medidas cautelares, podrá imponer una <b>multa al responsable</b> de <b>entre 1.000 y 30.000 euros</b>, en función de la mala fe apreciada, del perjuicio ocasionado al órgano de contratación y a los restantes licitadores y del cálculo de los beneficios obtenidos. Su importe se ingresa <b>en el Tesoro Público</b> y las cuantías pueden actualizarse por orden ministerial.</li>\n</ul>", "llano": "<p>Dos caras de la misma moneda. Si la Administración incumplió la ley y eso te causó un daño, el tribunal puede obligarla a indemnizarte, como mínimo lo que te costó preparar la oferta. Y si recurriste solo para molestar o para ganar tiempo, te puede multar entre 1.000 y 30.000 €.</p>", "porque": "<p>Porque el recurso especial suspende procedimientos y paraliza servicios. Sin un desincentivo, se convertiría en una herramienta de sabotaje competitivo: recurrir sistemáticamente para retrasar a los rivales.</p>\n<p>La indemnización, por su parte, evita que la ilegalidad salga gratis: preparar una oferta compleja cuesta miles de euros, y quien los gastó por culpa de un pliego ilegal debe ser resarcido <b>al menos</b> de eso.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> las costas de un pleito temerario, y la devolución de gastos a quien tuvo que reclamar por un error ajeno.</li>\n<li><b>Real:</b> estimado el recurso contra un pliego con prescripciones técnicas que designaban una marca, la empresa recurrente solicita indemnización. El tribunal le reconoce los <b>4.200 €</b> acreditados de redacción de la memoria técnica y avales.</li>\n<li><b>Caso límite:</b> una empresa recurre cinco licitaciones consecutivas del mismo ayuntamiento con idénticos escritos genéricos y sin fundamento, retrasando todas. El tribunal aprecia <b>mala fe</b> e impone una multa de 6.000 €, que se ingresa en el <b>Tesoro Público</b>.</li>\n</ul>", "noej": "<ul>\n<li><b>No se indemniza de oficio</b>: hace falta <b>solicitud del interesado</b>.</li>\n<li><b>No cabe multa</b> por el mero hecho de perder el recurso: hace falta <b>temeridad o mala fe</b>.</li>\n<li><b>No se ingresa</b> la multa en el presupuesto del órgano de contratación: va al <b>Tesoro Público</b>.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 57:</b> resolución en la que se acuerdan.</li>\n<li><b>Art. 49.3:</b> caución por los perjuicios de las medidas cautelares.</li>\n<li><b>Ley 40/2015, capítulo IV del título preliminar</b> <i>(otra norma de la biblioteca)</i>: criterios de cuantificación de la responsabilidad patrimonial.</li>\n<li><b>Art. 59.3:</b> los errores materiales de la resolución pueden rectificarse en cualquier momento.</li>\n</ul>", "trampas": "<ul>\n<li><b>1.000 a 30.000 €</b>: es la horquilla que hay que saber de memoria.</li>\n<li>La indemnización cubre «<b>cuando menos</b>» los gastos de preparación de la oferta: es un mínimo, no un máximo.</li>\n<li>La multa se impone al <b>responsable</b>, y se ingresa en el <b>Tesoro Público</b>.</li>\n</ul>", "ancla": "<p><b>«Mil a treinta mil por recurrir de mala fe; los gastos de la oferta, como mínimo, si te dieron la razón.»</b></p>", "vis": "<svg viewBox=\"0 0 960 297\" role=\"img\" aria-label=\"Contenido y efectos de la resolución del recurso especial\" style=\"width:100%;height:auto\"><defs><marker id=\"fl12\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr12\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe12\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw12\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"250\" y=\"8\" width=\"460\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"27.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">EFECTOS DE LA RESOLUCIÓN · ARTS. 57 A 60</text><rect x=\"20\" y=\"52\" width=\"172.8\" height=\"235\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"106.4\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--acc)\">CONTENIDO</text><text x=\"106.4\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Estima total o</text><text x=\"106.4\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">parcialmente, desestima</text><text x=\"106.4\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">o declara la inadmisión</text><text x=\"106.4\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"106.4\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Congruente con la</text><text x=\"106.4\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">petición y motivada</text><text x=\"106.4\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"106.4\" y=\"180\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Puede anular cláusulas</text><text x=\"106.4\" y=\"193\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">discriminatorias y</text><text x=\"106.4\" y=\"206\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">acordar la RETROACCIÓN</text><text x=\"106.4\" y=\"219\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">de actuaciones</text><text x=\"106.4\" y=\"232\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"106.4\" y=\"245\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 57.2</text><rect x=\"206.8\" y=\"52\" width=\"172.8\" height=\"235\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"293.2\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--ej)\">SUSPENSIÓN</text><text x=\"293.2\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">La resolución acuerda el</text><text x=\"293.2\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">LEVANTAMIENTO de la</text><text x=\"293.2\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">suspensión del acto de</text><text x=\"293.2\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">adjudicación si seguía</text><text x=\"293.2\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">suspendido, y de las</text><text x=\"293.2\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">demás medidas cautelares</text><text x=\"293.2\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"293.2\" y=\"180\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Y la devolución de las</text><text x=\"293.2\" y=\"193\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">garantías exigidas para</text><text x=\"293.2\" y=\"206\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">su efectividad</text><text x=\"293.2\" y=\"219\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"293.2\" y=\"232\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 57.3</text><rect x=\"393.6\" y=\"52\" width=\"172.8\" height=\"235\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"480\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--warn)\">INDEMNIZACIÓN</text><text x=\"480\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">A solicitud del interesado,</text><text x=\"480\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">puede imponerse a la</text><text x=\"480\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">entidad contratante la</text><text x=\"480\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">obligación de indemnizar</text><text x=\"480\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"480\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Al menos, los gastos de</text><text x=\"480\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">preparación de la oferta</text><text x=\"480\" y=\"180\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">o de participación</text><text x=\"480\" y=\"193\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"480\" y=\"206\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 58.1</text><rect x=\"580.4\" y=\"52\" width=\"172.8\" height=\"235\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"666.8\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--exc)\">MULTA</text><text x=\"666.8\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Si hay TEMERIDAD o MALA FE</text><text x=\"666.8\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">en el recurso o en la</text><text x=\"666.8\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">solicitud de medidas</text><text x=\"666.8\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">cautelares:</text><text x=\"666.8\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"666.8\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">MULTA de 1.000 a 30.000 €</text><text x=\"666.8\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"666.8\" y=\"180\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Se ingresa en el</text><text x=\"666.8\" y=\"193\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Tesoro Público</text><text x=\"666.8\" y=\"206\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"666.8\" y=\"219\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 58.2</text><rect x=\"767.2\" y=\"52\" width=\"172.8\" height=\"235\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"853.6\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--acc)\">IMPUGNACIÓN</text><text x=\"853.6\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Solo cabe recurso</text><text x=\"853.6\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">CONTENCIOSO-ADMINISTRATIVO</text><text x=\"853.6\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"853.6\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">La resolución es</text><text x=\"853.6\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">DIRECTAMENTE EJECUTIVA</text><text x=\"853.6\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"853.6\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">NO procede revisión de</text><text x=\"853.6\" y=\"180\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">oficio ni fiscalización</text><text x=\"853.6\" y=\"193\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">por el control interno</text><text x=\"853.6\" y=\"206\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"853.6\" y=\"219\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 59</text></svg>"}, {"n": 59, "t": "Efectos de la resolución del recurso especial", "ubic": "Libro I ▸ Título I ▸ Capítulo V · Del recurso especial en materia de contratación", "idea": "Directamente ejecutiva, solo recurrible ante el contencioso y sin revisión de oficio.", "literal": "<p><b>1.</b> Contra la resolución dictada en este procedimiento solo cabrá la interposición de recurso contencioso-administrativo conforme a lo dispuesto en el artículo 10, letras k) y l) del apartado 1 y en el artículo 11, letra f) de su apartado 1 de la Ley 29/1998, de 13 de julio, reguladora de la Jurisdicción Contencioso-administrativa.</p><p><b>2.</b> Sin perjuicio de lo dispuesto en el apartado anterior, la resolución será directamente ejecutiva.</p><p><b>3.</b> No procederá la revisión de oficio de la resolución ni de ninguno de los actos dictados por los órganos competentes para la resolución del recurso. Tampoco estarán sujetos a fiscalización por los órganos de control interno de las Administraciones a que cada uno de ellos se encuentre adscrito. Los órganos competentes para la resolución del recurso podrán rectificar en cualquier momento, de oficio o a instancia de los interesados, los errores materiales, de hecho o aritméticos existentes en sus actos, incluida la resolución del recurso.</p>", "dis": "<ul>\n<li><b>Impugnación (59.1):</b> contra la resolución <b>solo cabrá</b> la interposición de <b>recurso contencioso-administrativo</b>, conforme a la Ley 29/1998 reguladora de la Jurisdicción Contencioso-administrativa.</li>\n<li><b>Ejecutividad (59.2):</b> la resolución será <span class=\"t\" data-k=\"ejecutiva\">directamente ejecutiva</span>.</li>\n<li><b>Exclusiones (59.3):</b> <b>no procede la revisión de oficio</b> de la resolución ni de ninguno de los actos dictados por los órganos competentes para resolver el recurso. Tampoco están <b>sujetos a fiscalización</b> por los órganos de control interno de las Administraciones a que estén adscritos.</li>\n<li><b>Rectificación:</b> los órganos competentes <b>podrán rectificar en cualquier momento</b>, de oficio o a instancia de los interesados, los <b>errores materiales, de hecho o aritméticos</b> existentes en sus actos, incluida la resolución del recurso.</li>\n</ul>", "llano": "<p>Lo que decide el tribunal se cumple sin más: es directamente ejecutivo. Contra esa decisión solo se puede ir al juzgado de lo contencioso. Ni la Administración puede revisarla de oficio, ni la Intervención puede fiscalizarla.</p>\n<p>Lo único que cabe es corregir erratas y cuentas mal hechas.</p>", "porque": "<p>Porque si el órgano de contratación pudiera revisar de oficio la resolución que le da la razón al recurrente, el tribunal dejaría de ser independiente: quien perdió podría anular al que le venció.</p>\n<p>Y la exclusión de la fiscalización interna preserva lo mismo desde otro ángulo: un tribunal cuyas resoluciones tuvieran que pasar por la Intervención de la Administración a la que está adscrito no sería independiente de ella.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> la decisión de un árbitro externo en un conflicto entre vecinos: no la revisa uno de los vecinos, la revisa un juez.</li>\n<li><b>Real:</b> el tribunal anula la adjudicación y ordena retrotraer actuaciones. El ayuntamiento debe cumplirla de inmediato: es <b>directamente ejecutiva</b>. Si no está de acuerdo, su única vía es el <b>contencioso-administrativo</b>.</li>\n<li><b>Caso límite:</b> la resolución contiene un error en la fecha de un acto. Puede <b>rectificarse en cualquier momento</b>, de oficio o a instancia de parte, sin necesidad de acudir al contencioso.</li>\n</ul>", "noej": "<ul>\n<li><b>No cabe</b> recurso administrativo alguno contra la resolución: solo el contencioso.</li>\n<li><b>No cabe</b> la revisión de oficio del art. 106 LPAC sobre estas resoluciones.</li>\n<li><b>No están sujetas</b> a fiscalización por los órganos de control interno.</li>\n<li><b>No es una rectificación</b> cambiar el sentido de la resolución: solo caben errores materiales, de hecho o aritméticos.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 57:</b> resolución del recurso.</li>\n<li><b>Art. 60:</b> emplazamiento de las partes ante el contencioso.</li>\n<li><b>Art. 44.6:</b> el recurso especial es potestativo y previo al contencioso.</li>\n<li><b>Art. 106 LPAC y art. 109.2 LPAC</b> <i>(otra norma de la biblioteca)</i>: revisión de oficio y rectificación de errores, cuyo régimen se excepciona y se reproduce aquí.</li>\n</ul>", "trampas": "<ul>\n<li><b>Directamente ejecutiva</b>: no hace falta acto de ejecución de la Administración.</li>\n<li><b>Ni revisión de oficio ni fiscalización interna</b>: son las dos exclusiones que garantizan la independencia.</li>\n<li>Sí cabe la <b>rectificación de errores materiales</b>, en cualquier momento.</li>\n</ul>", "ancla": "<p><b>«Se cumple, y si no te gusta, al juzgado.»</b></p>", "vis": "<svg viewBox=\"0 0 960 297\" role=\"img\" aria-label=\"Contenido y efectos de la resolución del recurso especial\" style=\"width:100%;height:auto\"><defs><marker id=\"fl13\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr13\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe13\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw13\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"250\" y=\"8\" width=\"460\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"27.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">EFECTOS DE LA RESOLUCIÓN · ARTS. 57 A 60</text><rect x=\"20\" y=\"52\" width=\"172.8\" height=\"235\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"106.4\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--acc)\">CONTENIDO</text><text x=\"106.4\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Estima total o</text><text x=\"106.4\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">parcialmente, desestima</text><text x=\"106.4\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">o declara la inadmisión</text><text x=\"106.4\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"106.4\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Congruente con la</text><text x=\"106.4\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">petición y motivada</text><text x=\"106.4\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"106.4\" y=\"180\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Puede anular cláusulas</text><text x=\"106.4\" y=\"193\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">discriminatorias y</text><text x=\"106.4\" y=\"206\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">acordar la RETROACCIÓN</text><text x=\"106.4\" y=\"219\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">de actuaciones</text><text x=\"106.4\" y=\"232\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"106.4\" y=\"245\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 57.2</text><rect x=\"206.8\" y=\"52\" width=\"172.8\" height=\"235\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"293.2\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--ej)\">SUSPENSIÓN</text><text x=\"293.2\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">La resolución acuerda el</text><text x=\"293.2\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">LEVANTAMIENTO de la</text><text x=\"293.2\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">suspensión del acto de</text><text x=\"293.2\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">adjudicación si seguía</text><text x=\"293.2\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">suspendido, y de las</text><text x=\"293.2\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">demás medidas cautelares</text><text x=\"293.2\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"293.2\" y=\"180\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Y la devolución de las</text><text x=\"293.2\" y=\"193\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">garantías exigidas para</text><text x=\"293.2\" y=\"206\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">su efectividad</text><text x=\"293.2\" y=\"219\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"293.2\" y=\"232\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 57.3</text><rect x=\"393.6\" y=\"52\" width=\"172.8\" height=\"235\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"480\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--warn)\">INDEMNIZACIÓN</text><text x=\"480\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">A solicitud del interesado,</text><text x=\"480\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">puede imponerse a la</text><text x=\"480\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">entidad contratante la</text><text x=\"480\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">obligación de indemnizar</text><text x=\"480\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"480\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Al menos, los gastos de</text><text x=\"480\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">preparación de la oferta</text><text x=\"480\" y=\"180\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">o de participación</text><text x=\"480\" y=\"193\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"480\" y=\"206\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 58.1</text><rect x=\"580.4\" y=\"52\" width=\"172.8\" height=\"235\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"666.8\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--exc)\">MULTA</text><text x=\"666.8\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Si hay TEMERIDAD o MALA FE</text><text x=\"666.8\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">en el recurso o en la</text><text x=\"666.8\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">solicitud de medidas</text><text x=\"666.8\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">cautelares:</text><text x=\"666.8\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"666.8\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">MULTA de 1.000 a 30.000 €</text><text x=\"666.8\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"666.8\" y=\"180\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Se ingresa en el</text><text x=\"666.8\" y=\"193\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Tesoro Público</text><text x=\"666.8\" y=\"206\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"666.8\" y=\"219\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 58.2</text><rect x=\"767.2\" y=\"52\" width=\"172.8\" height=\"235\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"853.6\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--acc)\">IMPUGNACIÓN</text><text x=\"853.6\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Solo cabe recurso</text><text x=\"853.6\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">CONTENCIOSO-ADMINISTRATIVO</text><text x=\"853.6\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"853.6\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">La resolución es</text><text x=\"853.6\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">DIRECTAMENTE EJECUTIVA</text><text x=\"853.6\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"853.6\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">NO procede revisión de</text><text x=\"853.6\" y=\"180\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">oficio ni fiscalización</text><text x=\"853.6\" y=\"193\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">por el control interno</text><text x=\"853.6\" y=\"206\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"853.6\" y=\"219\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 59</text></svg>"}, {"n": 60, "t": "Emplazamiento de las partes ante los órganos de la jurisdicción contencioso-administrativa", "ubic": "Libro I ▸ Título I ▸ Capítulo V · Del recurso especial en materia de contratación", "idea": "Si se lleva la resolución al juzgado, el tribunal emplaza al órgano de contratación y a los comparecidos.", "literal": "<p><b>1.</b> Cuando contra una resolución del órgano competente para la resolución del recurso se interponga recurso contencioso administrativo, aquel, una vez recibida la diligencia del Tribunal jurisdiccional reclamando el expediente administrativo, procederá a emplazar para su comparecencia ante la Sala correspondiente al órgano de contratación autor del acto que hubiera sido objeto del recurso y a los restantes comparecidos en el procedimiento.</p><p><b>2.</b> El emplazamiento indicado en el párrafo anterior se hará en la forma prevista en el artículo 49 de la Ley 29/1998, de 13 de julio, reguladora de la Jurisdicción Contencioso- administrativa.</p>", "dis": "<ul>\n<li><b>Supuesto (60.1):</b> cuando contra una resolución del órgano competente se interponga <b>recurso contencioso-administrativo</b>, aquel, una vez recibida la <b>diligencia del Tribunal jurisdiccional reclamando el expediente</b>, procederá a <span class=\"t\" data-k=\"emplazam\">emplazar</span> para su comparecencia ante la Sala:\n <ul><li>al <b>órgano de contratación</b> autor del acto objeto del recurso;</li>\n <li>a los <b>restantes comparecidos</b> en el procedimiento.</li></ul></li>\n<li><b>Forma (60.2):</b> el emplazamiento se hará en la forma prevista en el <b>art. 49 de la Ley 29/1998</b>, reguladora de la Jurisdicción Contencioso-administrativa.</li>\n</ul>", "llano": "<p>Si alguien lleva la resolución del tribunal administrativo al juzgado, es el propio tribunal —no el ayuntamiento— quien avisa a todos los que participaron para que puedan personarse y defenderse.</p>", "porque": "<p>Porque el expediente lo tiene el tribunal, no el órgano de contratación, y porque los comparecidos en el recurso especial son quienes tienen interés en el resultado del contencioso. Si nadie los emplazara, se resolvería un pleito sobre sus derechos sin oírlos.</p>\n<p>Es una regla de <b>economía y de tutela</b>: quien tiene la información es quien avisa.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> el administrador de la comunidad que avisa a todos los vecinos cuando uno lleva un acuerdo a los tribunales.</li>\n<li><b>Real:</b> desestimado el recurso especial, la empresa recurre ante el Tribunal Superior de Justicia. Recibida la diligencia reclamando el expediente, el tribunal administrativo <b>emplaza al ayuntamiento</b> y a los otros cuatro licitadores que comparecieron.</li>\n<li><b>Caso límite:</b> un licitador que no compareció en el recurso especial no es emplazado por esta vía; podrá personarse por los cauces generales de la jurisdicción contenciosa.</li>\n</ul>", "noej": "<ul>\n<li><b>No emplaza</b> el órgano de contratación: emplaza el órgano que resolvió el recurso.</li>\n<li><b>No se emplaza</b> a quienes no comparecieron en el procedimiento del recurso especial.</li>\n<li><b>No es un trámite del recurso especial</b> en sentido estricto: opera ya iniciado el contencioso.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 59.1:</b> contra la resolución solo cabe el contencioso.</li>\n<li><b>Art. 49 de la Ley 29/1998</b> <i>(aportación externa)</i>: forma del emplazamiento.</li>\n<li><b>Art. 56.3:</b> los interesados a los que se dio traslado son los «comparecidos» del art. 60.</li>\n</ul>", "trampas": "<ul>\n<li>Emplaza el <b>tribunal administrativo</b>, no el juzgado ni el órgano de contratación.</li>\n<li>El presupuesto es haber recibido la <b>diligencia reclamando el expediente</b>.</li>\n<li>Se emplaza al <b>autor del acto</b> y a los <b>restantes comparecidos</b>.</li>\n</ul>", "ancla": "<p><b>«Quien tiene el expediente, avisa.»</b></p>", "vis": "<svg viewBox=\"0 0 960 320\" role=\"img\" aria-label=\"Emplazamiento de las partes ante la jurisdicción contencioso-administrativa\" style=\"width:100%;height:auto\"><defs><marker id=\"fl14\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr14\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe14\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw14\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"250\" y=\"8\" width=\"460\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"27.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">DEL TRIBUNAL ADMINISTRATIVO AL JUZGADO · ARTS. 59 Y 60</text><rect x=\"20\" y=\"52\" width=\"920\" height=\"40\" rx=\"10\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"30\" y=\"59\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"120\" y=\"76\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--acc)\">RESOLUCIÓN</text><text x=\"224\" y=\"74\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Directamente ejecutiva. Sin revisión de oficio ni fiscalización interna.</text><text x=\"930\" y=\"74\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">59.2 y 59.3</text><path d=\"M480 93 L 480 101\" stroke=\"var(--acc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl14)\"/><rect x=\"20\" y=\"102\" width=\"920\" height=\"40\" rx=\"10\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"30\" y=\"109\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"120\" y=\"126\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--warn)\">ÚNICA VÍA</text><text x=\"224\" y=\"124\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Recurso CONTENCIOSO-ADMINISTRATIVO conforme a la Ley 29/1998.</text><text x=\"930\" y=\"124\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">59.1</text><path d=\"M480 143 L 480 151\" stroke=\"var(--warn)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl14)\"/><rect x=\"20\" y=\"152\" width=\"920\" height=\"40\" rx=\"10\" fill=\"var(--panel)\" stroke=\"var(--line)\"/><rect x=\"30\" y=\"159\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--line)\"/><text x=\"120\" y=\"176\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"currentColor\">DILIGENCIA</text><text x=\"224\" y=\"174\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">El tribunal jurisdiccional reclama el expediente administrativo.</text><text x=\"930\" y=\"174\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">60.1</text><path d=\"M480 193 L 480 201\" stroke=\"var(--line)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl14)\"/><rect x=\"20\" y=\"202\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><rect x=\"30\" y=\"216\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--ej)\"/><text x=\"120\" y=\"233\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--ej)\">EMPLAZAMIENTO</text><text x=\"224\" y=\"224\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">El órgano que resolvió el recurso emplaza para comparecer ante la Sala</text><text x=\"224\" y=\"238\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">al ÓRGANO DE CONTRATACIÓN autor del acto y a los RESTANTES COMPARECIDOS.</text><text x=\"930\" y=\"224\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">60.1</text><path d=\"M480 257 L 480 265\" stroke=\"var(--ej)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl14)\"/><rect x=\"20\" y=\"266\" width=\"920\" height=\"40\" rx=\"10\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><rect x=\"30\" y=\"273\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--ej)\"/><text x=\"120\" y=\"290\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--ej)\">FORMA</text><text x=\"224\" y=\"288\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">En la forma prevista en el art. 49 de la Ley 29/1998.</text><text x=\"930\" y=\"288\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">60.2</text></svg>"}];
const PLAZOS=[["3.000.000 €", "Umbral del recurso especial en obras y en concesiones", "—", "44.1.a) y c)", "Valor estimado SUPERIOR a esa cifra"], ["100.000 €", "Umbral del recurso especial en suministros y servicios", "—", "44.1.a)", "Valor estimado SUPERIOR a esa cifra"], ["15 días hábiles", "Plazo para interponer el recurso especial", "Recurrente", "50.1", "Con cuatro dies a quo distintos según el acto recurrido"], ["3 días hábiles", "Subsanación de defectos del escrito de recurso", "Recurrente", "51.2", "Si no subsana, se le tiene por desistido"], ["5 días hábiles", "Plazo del órgano de contratación para facilitar el acceso al expediente", "Órgano de contratación", "52.2", "La solicitud NO paraliza el plazo para recurrir"], ["10 días", "Acceso al expediente concedido por el tribunal si se incumplió el art. 52.1", "Tribunal", "52.3", "Previo al trámite de alegaciones"], ["Mismo día", "Comunicación de la solicitud de medidas cautelares al órgano de contratación", "Tribunal", "49.2", "Y también la notificación del recurso interpuesto (56.2)"], ["2 días hábiles", "Alegaciones del órgano de contratación sobre las medidas cautelares", "Órgano de contratación", "49.2", "Si no alega, se continúa el procedimiento"], ["5 días hábiles", "Decisión motivada sobre las medidas cautelares", "Tribunal", "49.2", "Contra ella no cabe recurso alguno"], ["2 días hábiles", "Remisión del expediente de contratación y del informe", "Órgano de contratación", "56.2", "Tanto si el recurso se presentó ante el tribunal como ante él"], ["5 días hábiles", "Traslado del recurso a los restantes interesados", "Tribunal", "56.3", "Y en el mismo plazo, decisión sobre cautelares y suspensión"], ["5 días hábiles", "Alegaciones de los restantes interesados", "Interesados", "56.3", "En el registro del órgano competente para resolver"], ["10 días hábiles", "Período de prueba, si se acuerda", "Tribunal", "56.4", "Pueden rechazarse motivadamente las pruebas improcedentes"], ["5 días hábiles", "Resolución del recurso", "Tribunal", "57.1", "Desde recibidas las alegaciones o transcurrido su plazo y el de prueba"], ["2 meses", "Silencio: el recurso se entiende desestimado", "—", "57.5", "Desde el siguiente a la interposición, a efectos del contencioso"], ["1.000 a 30.000 €", "Multa por temeridad o mala fe", "Recurrente", "58.2", "Se ingresa en el Tesoro Público"], ["6 años", "Mandato de los miembros del Tribunal Administrativo Central", "—", "45", "No prorrogable"], ["15 años", "Experiencia profesional exigida a los miembros del Tribunal Central", "—", "45", "En derecho administrativo relacionado con la contratación pública"]];
const FLASH=[["¿A partir de qué importes cabe recurso especial?", "Valor estimado <b>superior a 3.000.000 €</b> en obras y en concesiones de obras o de servicios, y <b>superior a 100.000 €</b> en suministros y servicios (art. 44.1)."], ["Cita tres actos recurribles por esta vía", "Los <b>anuncios de licitación y los pliegos</b>, los <b>actos de trámite cualificados</b> —incluidas siempre la admisión, inadmisión y exclusión— y los <b>acuerdos de adjudicación</b> (art. 44.2)."], ["¿En qué procedimientos NO cabe el recurso especial?", "En los que se sigan por el trámite de <b>emergencia</b> (art. 44.4)."], ["¿Es obligatorio interponerlo antes del contencioso?", "No: es <b>potestativo</b> y <b>gratuito</b>. Cabe acudir directamente al contencioso-administrativo (art. 44.6 y 44.7)."], ["¿Quién resuelve el recurso en una entidad local?", "El <b>órgano independiente que determinen las normas de la comunidad autónoma</b>. Nunca el propio órgano de contratación (art. 46.4)."], ["¿Quién está legitimado?", "Cualquiera cuyos derechos o intereses legítimos, individuales o colectivos, se vean afectados directa o indirectamente; las <b>organizaciones sindicales</b> si el contrato va a ejecutarse incumpliendo obligaciones sociales o laborales; y <b>en todo caso</b> la organización empresarial sectorial (art. 48)."], ["¿Cuál es el plazo para recurrir y desde cuándo se cuenta?", "<b>Quince días hábiles</b>. Desde la publicación del anuncio; desde la publicación del anuncio con indicación de acceso a los pliegos; desde que se tuvo conocimiento, en actos de trámite; y desde la notificación, en la adjudicación (art. 50.1)."], ["¿Puede recurrir los pliegos quien ya presentó oferta?", "Con carácter general <b>no</b>, salvo en los supuestos de <b>nulidad de pleno derecho</b> (art. 50.1.b)."], ["¿La solicitud de acceso al expediente suspende el plazo para recurrir?", "<b>No</b>: «no paralizará en ningún caso el plazo para la interposición» (art. 52.2). El órgano debe facilitar el acceso en cinco días hábiles."], ["¿De cuánto es el plazo de subsanación del escrito de recurso?", "<b>Tres días hábiles</b> desde el siguiente a la notificación; si no subsana, se le tiene por <b>desistido</b> (art. 51.2)."], ["Enumera las cuatro causas de inadmisión", "<b>a)</b> incompetencia del órgano · <b>b)</b> falta de legitimación o de acreditación de la representación · <b>c)</b> acto no susceptible de impugnación · <b>d)</b> interposición fuera de plazo (art. 55)."], ["¿En qué plazo se remite el expediente al tribunal?", "<b>Dos días hábiles</b>, acompañado del informe correspondiente (art. 56.2)."], ["¿En qué plazo se resuelve el recurso y qué pasa si no se resuelve?", "<b>Cinco días hábiles</b> desde recibidas las alegaciones o transcurrido su plazo y el de prueba. Transcurridos <b>dos meses</b> desde el siguiente a la interposición sin resolución notificada, se entiende <b>desestimado</b> (art. 57.1 y 57.5)."], ["¿Qué ocurre si se anula una cláusula de los pliegos?", "Determina también la <b>anulación de los actos del expediente relacionados con su aprobación</b>, y puede acordarse la <b>retroacción de actuaciones</b> (art. 57.2)."], ["¿Qué multa cabe por recurrir de mala fe?", "Entre <b>1.000 y 30.000 euros</b>, en función de la mala fe, del perjuicio causado y de los beneficios obtenidos. Se ingresa en el <b>Tesoro Público</b> (art. 58.2)."], ["¿Qué recursos caben contra la resolución del tribunal?", "Solo el <b>contencioso-administrativo</b>. La resolución es <b>directamente ejecutiva</b> y no cabe revisión de oficio ni fiscalización por el control interno (art. 59)."]];
const TEST=[{"a": 44, "q": "Cabe recurso especial en materia de contratación en los contratos de servicios cuyo valor estimado sea:", "o": [["Superior a 100.000 euros", 1, "Correcto: art. 44.1.a). En obras y concesiones el umbral es de 3.000.000 de euros."], ["Superior a 15.000 euros", 0, "Esa es la frontera del contrato menor de servicios (art. 118.1)."], ["Superior a 3.000.000 de euros", 0, "Ese umbral es el de obras y concesiones."], ["Igual o superior a los umbrales de regulación armonizada", 0, "El recurso especial tiene sus propios umbrales, más bajos que los SARA en servicios."]]}, {"a": 44, "q": "NO cabe recurso especial en materia de contratación:", "o": [["En los procedimientos que se sigan por el trámite de emergencia", 1, "Correcto: art. 44.4."], ["Contra los pliegos", 0, "Los pliegos son el acto recurrible por excelencia (art. 44.2.a)."], ["Contra los acuerdos de adjudicación", 0, "Están expresamente incluidos en el art. 44.2.c)."], ["Contra la exclusión de una oferta por anormalmente baja", 0, "El art. 44.2.b) la considera en todo caso acto recurrible."]]}, {"a": 44, "q": "El recurso especial en materia de contratación es:", "o": [["Potestativo y gratuito", 1, "Correcto: art. 44.6 y 44.7. Puede acudirse directamente al contencioso-administrativo."], ["Obligatorio y gratuito", 0, "No es obligatorio: es potestativo."], ["Potestativo y sujeto a tasa", 0, "La ley lo declara expresamente gratuito."], ["Obligatorio y previo al recurso de alzada", 0, "Contra los mismos actos no procede recurso administrativo ordinario."]]}, {"a": 46, "q": "En la contratación de una diputación provincial, el recurso especial lo resuelve:", "o": [["El órgano independiente que determinen las normas de la comunidad autónoma", 1, "Correcto: art. 46.4. La independencia respecto del órgano que adjudicó es la clave del sistema."], ["El Pleno de la diputación", 0, "Sería el mismo que adjudicó: incompatible con la independencia exigida."], ["Siempre el Tribunal Administrativo Central d

e Recursos Contractuales", 0, "Solo si la comunidad autónoma le atribuye la competencia por convenio (art. 46.2)."], ["El juzgado de lo contencioso-administrativo", 0, "El contencioso interviene después, contra la resolución del tribunal administrativo."]]}, {"a": 48, "q": "Está legitimada para interponer el recurso especial:", "o": [["Cualquier persona cuyos intereses legítimos puedan resultar afectados directa o indirectamente", 1, "Correcto: art. 48. No hace falta haber presentado oferta."], ["Únicamente quien haya presentado oferta en la licitación", 0, "El art. 48 no lo exige; de hecho, quien ya ofertó no puede, en general, recurrir los pliegos (art. 50.1.b)."], ["Solo el adjudicatario", 0, "El adjudicatario es precisamente quien menos interés tiene en recurrir."], ["Cualquier ciudadano, por acción pública", 0, "No existe acción pública en contratación: se exige interés legítimo."]]}, {"a": 49, "q": "Sobre las medidas cautelares solicitadas antes de interponer el recurso:", "o": [["El órgano competente decide de forma motivada en cinco días hábiles, tras dar dos días hábiles de alegaciones al órgano de contratación", 1, "Correcto: art. 49.2. Y contra esa resolución no cabe recurso alguno."], ["Se resuelven en el plazo de un mes", 0, "El plazo es de cinco días hábiles: el sistema está diseñado para ir deprisa."], ["No pueden solicitarse antes de interponer el recurso", 0, "El art. 49.1 las prevé precisamente para antes de la interposición."], ["Contra su resolución cabe recurso de alzada", 0, "El art. 49.2 excluye expresamente cualquier recurso contra ellas."]]}, {"a": 50, "q": "El plazo para interponer el recurso especial es de:", "o": [["Quince días hábiles", 1, "Correcto: art. 50.1, con cuatro reglas distintas de cómputo según el acto recurrido."], ["Un mes", 0, "Un mes es el plazo del recurso de alzada y del de reposición en la LPAC."], ["Quince días naturales", 0, "Son hábiles, no naturales."], ["Diez días hábiles", 0, "Diez días hábiles son los de los arts. 150.2 y 150.4."]]}, {"a": 50, "q": "Una empresa que ya ha presentado su oferta quiere recurrir los pliegos:", "o": [["Con carácter general no se admitirá el recurso, salvo en supuestos de nulidad de pleno derecho", 1, "Correcto: art. 50.1.b). Quien compite bajo unas reglas no puede después impugnarlas."], ["Puede recurrirlos siempre, dentro de los quince días hábiles", 0, "El art. 50.1.b) lo impide con carácter general."], ["Puede recurrirlos solo si no resulta adjudicataria", 0, "La ley no condiciona la admisión al resultado de la licitación."], ["Puede recurrirlos únicamente ante el órgano de contratación", 0, "El problema no es el lugar de presentación, sino la admisibilidad."]]}, {"a": 52, "q": "La solicitud de acceso al expediente antes de recurrir:", "o": [["No paraliza en ningún caso el plazo para interponer el recurso especial", 1, "Correcto: art. 52.2. El órgano de contratación debe facilitar el acceso en cinco días hábiles."], ["Suspende el plazo hasta que se facilite el acceso", 0, "Sería una vía sencilla para retrasar indefinidamente la formalización de cualquier contrato."], ["Amplía el plazo en cinco días hábiles", 0, "La ley no prevé esa ampliación."], ["Debe formularse ante el tribunal administrativo", 0, "Se solicita al órgano de contratación (art. 52.1)."]]}, {"a": 51, "q": "El plazo de subsanación de los defectos del escrito de recurso es de:", "o": [["Tres días hábiles desde el siguiente a la notificación", 1, "Correcto: art. 51.2. Si no subsana, se le tiene por desistido."], ["Diez días hábiles", 0, "Diez días es el plazo general del art. 68.1 LPAC, que aquí se reduce."], ["Cinco días hábiles", 0, "Cinco días hábiles son otros plazos del procedimiento (arts. 49.2, 52.2, 56.3 y 57.1)."], ["Quince días hábiles", 0, "Es el plazo de interposición, no el de subsanación."]]}, {"a": 55, "q": "NO es causa de inadmisión del recurso especial:", "o": [["La falta de fundamento de las pretensiones del recurrente", 1, "Correcto: eso conduce a la desestimación, no a la inadmisión. Las causas del art. 55 son cuatro y tasadas."], ["La incompetencia del órgano para conocer del recurso", 0, "Es la letra a) del art. 55."], ["La falta de legitimación del recurrente", 0, "Es la letra b) del art. 55."], ["La interposición una vez finalizado el plazo", 0, "Es la letra d) del art. 55."]]}, {"a": 56, "q": "El órgano de contratación debe remitir el expediente y su informe al tribunal en el plazo de:", "o": [["Dos días hábiles", 1, "Correcto: art. 56.2, tanto si el recurso se presentó ante el tribunal como ante él mismo."], ["Cinco días hábiles", 0, "Cinco días hábiles es el plazo del traslado a los demás interesados y de sus alegaciones."], ["Diez días hábiles", 0, "Diez días hábiles es el período de prueba, si se acuerda."], ["Un mes", 0, "Ningún plazo de este procedimiento se mide en meses, salvo el silencio de dos meses."]]}, {"a": 57, "q": "Transcurridos dos meses desde el siguiente a la interposición sin notificarse la resolución:", "o": [["El interesado podrá considerarlo desestimado a los efectos de interponer recurso contencioso-administrativo", 1, "Correcto: art. 57.5. Es silencio negativo."], ["El recurso se entiende estimado", 0, "El silencio aquí es desestimatorio."], ["Caduca el procedimiento", 0, "La ley no prevé la caducidad, sino el silencio negativo."], ["Se levanta automáticamente la suspensión", 0, "El levantamiento exige resolución expresa (arts. 56.3 y 57.3)."]]}, {"a": 58, "q": "La multa por temeridad o mala fe en la interposición del recurso:", "o": [["Está comprendida entre 1.000 y 30.000 euros y se ingresa en el Tesoro Público", 1, "Correcto: art. 58.2. Se gradúa por la mala fe, el perjuicio y los beneficios obtenidos."], ["Está comprendida entre 500 y 10.000 euros", 0, "La horquilla del art. 58.2 es de 1.000 a 30.000 euros."], ["Se ingresa en el presupuesto del órgano de contratación", 0, "El importe se ingresa en todo caso en el Tesoro Público."], ["Procede siempre que se desestime el recurso", 0, "Hace falta apreciar temeridad o mala fe: perder no es recurrir de mala fe."]]}, {"a": 59, "q": "Contra la resolución del recurso especial:", "o": [["Solo cabe recurso contencioso-administrativo, y la resolución es directamente ejecutiva", 1, "Correcto: art. 59.1 y 59.2. Tampoco procede revisión de oficio ni fiscalización por el control interno."], ["Cabe recurso de reposición ante el mismo tribunal", 0, "El art. 59.1 excluye cualquier recurso administrativo."], ["Cabe revisión de oficio por el órgano de contratación", 0, "El art. 59.3 lo excluye expresamente."], ["Cabe recurso de alzada ante el órgano superior", 0, "El tribunal no tiene superior jerárquico en esta función."]]}];
const CASOS=[{"t": "Caso 1 · ¿Cabe recurso especial y hasta cuándo?", "e": "Un ayuntamiento publica en su perfil de contratante, el <b>martes 3 de febrero</b>, el anuncio de licitación del servicio de socorrismo, con valor estimado de <b>178.000 €</b>, indicando el enlace a los pliegos. Una empresa considera que el PCAP exige una clasificación improcedente. Otra, que ya presentó oferta el 18 de febrero, quiere impugnar la misma cláusula.<br><br><b>Se pide:</b> di si cabe recurso especial, hasta cuándo puede interponerse y qué ocurre con cada una de las dos empresas.", "s": "<p><b>1 · ¿Cabe?</b> Es un contrato de <b>servicios</b> con valor estimado de 178.000 €, superior a los <b>100.000 €</b> del art. 44.1.a): <b>sí cabe</b>. Y el PCAP es acto recurrible por el art. 44.2.a).</p><p><b>2 · Plazo.</b> Quince días hábiles (art. 50.1). Como el anuncio se publicó el 3 de febrero <b>indicando la forma de acceder a los pliegos</b>, el cómputo arranca el <b>4 de febrero</b> (art. 50.1.b). Descontando sábados, domingos y festivos, vence en torno al <b>24 de febrero</b>.</p><p><b>3 · Primera empresa.</b> No presentó oferta. Está <b>legitimada</b> por el art. 48: la cláusula afecta directamente a su interés legítimo de concurrir. Su recurso es admisible.</p><p><b>4 · Segunda empresa.</b> Presentó oferta el 18 de febrero. El art. 50.1.b) dispone que, con carácter general, <b>no se admitirá</b> el recurso contra los pliegos si el recurrente presentó oferta con carácter previo a la interposición. Solo podría prosperar si invocara una causa de <b>nulidad de pleno derecho</b>.</p><p><b>5 · Y un detalle de estrategia:</b> si la primera empresa quiere además parar la licitación, puede pedir <b>medidas cautelares</b> del art. 49 antes de recurrir. Se resolverán en cinco días hábiles, tras dar dos al ayuntamiento.</p>"}, {"t": "Caso 2 · La cuenta atrás del procedimiento", "e": "Notificada la adjudicación el <b>lunes 16 de mayo</b> y remitida ese mismo día, una empresa interpone recurso especial contra el acuerdo de adjudicación el <b>viernes 20 de mayo</b>, ante el registro del propio ayuntamiento, solicitando además el acceso al expediente el día 18.<br><br><b>Se pide:</b> qué efectos produce la interposición, qué plazos corren para cada actor y cuándo podría formalizarse el contrato.", "s": "<p><b>1 · Efecto inmediato.</b> Al recurrirse el <b>acuerdo de adjudicación</b>, queda <b>suspendida automáticamente</b> la tramitación del expediente (art. 53). No hace falta pedirlo, y solo se levanta por <b>resolución expresa</b> (arts. 56.3 y 57.3).</p><p><b>2 · Acceso al expediente.</b> Solicitado el 18, el ayuntamiento debe facilitarlo en <b>cinco días hábiles</b> (art. 52.2). Pero ese trámite <b>no paralizó</b> el plazo de quince días hábiles para recurrir: por eso la empresa hizo bien en recurrir el 20 sin esperar.</p><p><b>3 · Remisión.</b> Presentado ante el órgano de contratación, este debe remitirlo al tribunal, con el expediente y el informe, en <b>dos días hábiles</b> (art. 56.2).</p><p><b>4 · Traslado y alegaciones.</b> Dentro de los <b>cinco días hábiles</b> siguientes a la interposición, el tribunal da traslado a los demás licitadores, que tienen otros <b>cinco días hábiles</b> para alegar; en ese mismo plazo decide sobre el mantenimiento de la suspensión (art. 56.3).</p><p><b>5 · Resolución.</b> <b>Cinco días hábiles</b> desde recibidas las alegaciones o transcurrido su plazo (art. 57.1). Si pasaran <b>dos meses</b> desde el 21 de mayo sin resolución notificada, la empresa podría considerarlo <b>desestimado</b> e ir al contencioso (art. 57.5).</p><p><b>6 · Formalización.</b> Con independencia del recurso, el art. 153.3 ya impedía formalizar antes de <b>quince días hábiles</b> desde el 16 de mayo. Y ahora, además, rige la suspensión automática: el contrato no puede formalizarse hasta que se levante.</p>"}, {"t": "Caso 3 · Qué puede decidir el tribunal", "e": "El tribunal estima el recurso y declara que la cláusula del PCAP que exigía clasificación empresarial en un contrato de servicios es contraria a derecho. La empresa recurrente había solicitado indemnización por los 4.200 € que le costó preparar la memoria técnica. El ayuntamiento, por su parte, sostiene que el recurso se interpuso solo para retrasar la licitación.<br><br><b>Se pide:</b> qué debe contener la resolución, qué pasa con la indemnización y con la posible multa, y qué puede hacer el ayuntamiento si no está de acuerdo.", "s": "<p><b>1 · Contenido (art. 57.2).</b> La resolución estima el recurso, anula la cláusula discriminatoria y —porque la anulación afecta a los pliegos— determina también la <b>anulación de los actos del expediente relacionados con su aprobación</b>. Procede la <b>retroacción de actuaciones</b> al momento de aprobación del PCAP.</p><p><b>2 · Suspensión (art. 57.3).</b> La resolución debe acordar el <b>levantamiento</b> de la suspensión y de las medidas cautelares que existieran, y la <b>devolución de las garantías</b> constituidas para su efectividad.</p><p><b>3 · Indemnización (art. 58.1).</b> Como fue <b>solicitada</b> por la interesada, el tribunal puede imponer al ayuntamiento la obligación de indemnizar, <b>cuando menos</b> por los gastos de preparación de la oferta: los 4.200 € acreditados encajan exactamente en ese mínimo legal.</p><p><b>4 · Multa (art. 58.2).</b> No procede: el recurso ha sido <b>estimado</b>. La multa de 1.000 a 30.000 € exige apreciar <b>temeridad o mala fe</b>, y difícilmente concurren cuando el recurrente tenía razón.</p><p><b>5 · Vía del ayuntamiento (art. 59).</b> La resolución es <b>directamente ejecutiva</b>. No cabe revisión de oficio ni fiscalización por su Intervención. Su única salida es el <b>recurso contencioso-administrativo</b>; y si lo interpone, será el propio tribunal quien <b>emplace</b> a los comparecidos ante la Sala (art. 60).</p>"}];
const SEMAFORO=["Sé los umbrales del recurso especial y que no coinciden con los SARA — art. 44", "Enumero los actos recurribles y sé qué es un acto de trámite cualificado — art. 44.2", "Sé que es potestativo, gratuito y que no cabe en emergencia — art. 44", "Sé quién resuelve el recurso en el Estado, en las CCAA y en las entidades locales — arts. 45 y 46", "Conozco las tres legitimaciones del art. 48, incluida la sindical", "Distingo medidas cautelares del art. 49 de la suspensión automática del art. 53", "Recito los cuatro dies a quo del plazo de quince días hábiles — art. 50.1", "Sé que quien presentó oferta no puede, en general, recurrir los pliegos — art. 50.1.b)", "Sé qué contiene el escrito y que la subsanación es de tres días hábiles — art. 51", "Sé que el acceso al expediente NO paraliza el plazo — art. 52.2", "Enumero las cuatro causas de inadmisión — art. 55", "Domino la cadena de plazos de la tramitación: 0 · 2 · 5 · 5 · 10 · 5 — arts. 56 y 57", "Sé qué puede decidir la resolución y qué pasa a los dos meses — art. 57", "Sé la horquilla de la multa y el alcance mínimo de la indemnización — art. 58", "Sé que la resolución es directamente ejecutiva y solo recurrible en el contencioso — art. 59"];
const INTRO_HTML="<section class=\"card\" id=\"intro\"><h2>Tema 10 · Bloque 4 · El recurso especial en materia de contratación</h2><p class=\"small\">Los bloques anteriores terminaban con el contrato a punto de firmarse. Este bloque explica el mecanismo que puede <b>pararlo antes de que exista</b>: un recurso rápido, gratuito y resuelto por un tribunal independiente del que adjudicó.</p><div class=\"box ej\"><span class=\"lbl\">La idea que ordena todo el bloque</span>Tres artículos de tres bloques distintos encajan como un mecanismo de relojería: el art. <b>36.1</b> hace que el contrato nazca con la <b>formalización</b>; el art. <b>153.3</b> impide formalizar durante <b>quince días hábiles</b>; y el art. <b>50</b> concede exactamente <b>quince días hábiles</b> para recurrir. Resultado: cuando se recurre, todavía no hay contrato que anular. Todo lo demás de esta página es desarrollo de esa idea.</div><div class=\"box warn\"><span class=\"lbl\">Fuentes utilizadas y vigencia</span><ul><li><b>Ley 9/2017, de 8 de noviembre</b>, de Contratos del Sector Público (documento de la biblioteca del proyecto), arts. 44, 45, 46, 48, 49, 50, 51, 52, 55, 56, 57, 58, 59 y 60, <b>texto consolidado</b>, transcritos literalmente.</li><li><b>Aportación externa</b>, marcada donde aparece: la <b>Ley 29/1998</b> reguladora de la Jurisdicción Contencioso-administrativa, citada por los arts. 59 y 60, y la <b>Ley 7/1985</b> LBRL para el régimen de los municipios de gran población.</li><li>El art. 52.3 contiene incisos declarados <b>no conformes con el orden constitucional de competencias</b> por la STC 68/2021; la nota del BOE se reproduce al pie del precepto, separada del texto articulado.</li><li><b>Verifica siempre la vigencia en el BOE consolidado.</b> Las cuantías de las multas del art. 58.2 pueden actualizarse por orden ministerial.</li><li>Las entidades, fechas y cifras de los ejemplos y casos son <b>ficticias</b>; los preceptos y los plazos, reales.</li></ul></div><div class=\"box\"><span class=\"lbl\">Los cuatro bloques del tema 10</span><ul><li><a href=\"LCSP_28-102_organo_y_objeto.html\"><b>Bloque 1 · El órgano de contratación, las partes y el objeto</b> — arts. 28, 29, 35, 36, 61, 62, 63, 74, 99 a 102</a></li><li><a href=\"LCSP_106-126_expediente.html\"><b>Bloque 2 · Garantías, expediente y pliegos</b> — arts. 106 a 108, 115 a 124 y 126</a></li><li><a href=\"LCSP_131-204_adjudicacion.html\"><b>Bloque 3 · Adjudicación y formalización</b> — arts. 131 a 160 y 204</a></li><li><a href=\"LCSP_44-60_recurso_especial.html\"><b>Bloque 4 · El recurso especial en materia de contratación</b> — arts. 44 a 60</a></li></ul></div><div class=\"box exc\"><span class=\"lbl\">Esto no es asesoramiento jurídico</span>Es material de estudio. Para un recurso real, acude a la norma consolidada y al asesoramiento del órgano competente.</div></section><section class=\"card\" id=\"mapa\"><h2>El mapa del bloque</h2><p class=\"small\">Primero: ¿cabe recurso? Después: ¿cuándo hay que interponerlo? Y por último: ¿cómo se tramita y qué puede decidirse?</p><svg viewBox=\"0 0 960 385\" role=\"img\" aria-label=\"Ámbito del recurso especial en materia de contratación: contratos y actos recurribles\" style=\"width:100%;height:auto\"><defs><marker id=\"fl15\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr15\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe15\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw15\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"250\" y=\"8\" width=\"460\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"48 " y=\"52\" width=\"219.5\" height=\"265\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"363.25\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--acc)\">Y ADEMÁS</text><text x=\"363.25\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Contratos administrativos</text><text x=\"363.25\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">ESPECIALES cuando no</text><text x=\"363.25\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">quepa fijar su precio o</text><text x=\"363.25\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">superen el umbral de</text><text x=\"363.25\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">servicios</text><text x=\"363.25\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"363.25\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Contratos SUBVENCIONADOS</text><text x=\"363.25\" y=\"180\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">del art. 23</text><text x=\"363.25\" y=\"193\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"363.25\" y=\"206\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">ENCARGOS a medios propios</text><text x=\"363.25\" y=\"219\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">según su importe con</text><text x=\"363.25\" y=\"232\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">prórrogas</text><rect x=\"487\" y=\"52\" width=\"219.5\" height=\"265\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"596.75\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--ej)\">ACTOS · art. 44.2</text><text x=\"596.75\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">a) anuncios de licitación,</text><text x=\"596.75\" y=\"102\" text-anc /* ═══ Mejoras de interacción · Bloque II ═══ */
(function(){
"use strict";
var K_THEME="oposi_bII_theme", K_FS="oposi_bII_fs", K_STREAK="oposi_bII_streak";
function load(k,f){try{var v=localStorage.getItem(k);return v?JSON.parse(v):f;}catch(e){return f;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
var root=document.documentElement;

/* Tema persistente (sobrescribe el toggle simple anterior) */
var saved=load(K_THEME,null);
if(saved){root.setAttribute("data-theme",saved);}
else if(window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches){root.setAttribute("data-theme","dark");}

if(bt)bt.onclick=function(){
  var n=root.getAttribute("data-theme")==="dark"?"light":"dark";
  root.setAttribute("data-theme",n);save(K_THEME,n);
};

/* Tamaño de texto persistente */
var fs=load(K_FS,16);
function setFs(v){fs=Math.max(13,Math.min(22,v));root.style.setProperty("--fs",fs+"px");save(K_FS,fs);}
setFs(fs);
var bp=document.getElementById("fs+"),bm=document.getElementById("fs-");

if(bm)bm.onclick=function(){setFs(fs-1);};

(function(){

  var hoy=new Date().toISOString().slice(0,10);
  var s=load(K_STREAK,{last:null,n:0});
  if(s.last!==hoy){
    var ayer=new Date(Date.now()-864e5).toISOString().slice(0,10);
    s.n=(s.last===ayer)?s.n+1:1;s.last=hoy;save(K_STREAK,s);
  }
  el.textContent=s.n;
})();

/* Reveal on scroll para las tarjetas */
function reveal(){
  var els=document.querySelectorAll("section.card:not(.rv)");
  if(!els.length)return;
  if(!("IntersectionObserver" in window)){return;}
  var io=new IntersectionObserver(function(es){
    es.forEach(function(en){if(en.isIntersecting){en.target.classList.add("in");io.unobserve(en.target);}});
  },{threshold:.06,rootMargin:"0px 0px -30px 0px"});
  Array.prototype.forEach.call(els,function(el){el.classList.add("rv");io.observe(el);});
}

/* Sección activa en el índice lateral */
function spy(){
  var links=document.querySelectorAll("nav.side a[href^='#']");
  if(!links.length||!("IntersectionObserver" in window))return;
  var map={};
  Array.prototype.forEach.call(links,function(a){
    var t=document.getElementById(a.getAttribute("href").slice(1));
    if(t)map[t.id]=a;
  });
  var io=new IntersectionObserver(function(es){
    es.forEach(function(en){
      if(en.isIntersecting){
        Array.prototype.forEach.call(links,function(a){a.classList.remove("on");});
        if(map[en.target.id])map[en.target.id].classList.add("on");
      }
    });
  },{rootMargin:"-80px 0px -70% 0px",threshold:0});
  Object.keys(map).forEach(function(id){io.observe(document.getElementById(id));});
}

/* Ripple en botones */
document.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b||b.classList.contains("navtoggle"))return;
  var r=b.getBoundingClientRect(),d=Math.max(r.width,r.height),s=document.createElement("span");
  s.className="ripple";s.style.width=s.style.height=d+"px";
  s.style.left=(e.clientX-r.left-d/2)+"px";s.style.top=(e.clientY-r.top-d/2)+"px";
  b.appendChild(s);setTimeout(function(){if(s.parentNode)s.parentNode.removeChild(s);},560);
});

});

/* El contenido se inyecta por JS: esperamos a que exista */
function init(){reveal();spy();}
if(document.getElementById("main")&&document.getElementById("main").children.length){init();}
else{setTimeout(init,60);}
addEventListener("load",function(){setTimeout(init,80);});
})();


</script>

/* ═══ Parser de respuestas: estructura semántica ═══ */
var FCFMT=(function(){
  var CITA=/\s*\(((?:arts?\.|DA\b|DT\b|disp\.)[^)]*)\)\s*\.?\s*$/i;
  var strip=function(h){return h.replace(/<[^>]+>/g,"");};

  function esc(s){return s;}

  function parse(raw){
    var out={verdict:null,cite:null,kind:"p",items:[],text:""};
    var body=String(raw).trim();

    /* 1 ── Cita legal al final */
    var m=body.match(CITA);
    if(m){out.cite=m[1].replace(/\s+/g," ").trim();body=body.slice(0,m.index).trim();}
    body=body.replace(/[.;,\s]+$/,"");

    /* 2 ── Veredicto Sí / No inicial */
    var v=strip(body).match(/^(Sí|Sí,|No|No,)[.:,]?\s/);
    if(v){
      out.verdict=/^Sí/.test(v[1])?"si":"no";
      body=body.replace(/^(<[^>]+>\s*)*(Sí|No)[.,:]?\s*/,"").trim();
      body=body.replace(/^en\s/,"En ");
    }

    /* 3 ── Enumeración con · */
    var parts=body.split(/\s+·\s+/);
    if(parts.length>=2){
      out.kind="list";
      var letras=parts.filter(function(p){return /^\s*<?[a-h]\)/.test(strip(p));}).length;
      out.marker = letras>=parts.length-1 ? "alpha" : "num";
      out.items=parts.map(function(p){
        return p.replace(/^\s*[a-h]\)\s*/,"").replace(/[.\s]+$/,"").trim();
      }).filter(Boolean);
      return out;
    }

    /* 4 ── Cláusulas contrapuestas con ; */
    var semi=body.split(/;\s+/);
    if(semi.length>=2&&semi.length<=3&&semi.every(function(s){return strip(s).length>14;})){
      out.kind="clauses";
      out.items=semi.map(function(s){return s.replace(/[.\s]+$/,"").trim();});
      return out;
    }

    /* 5 ── Párrafo */
    out.text=body;
    return out;
  }

  function render(raw){
    var d=parse(raw),h="";

    if(d.verdict){
      h+='<span class="fc-verdict '+d.verdict+'">'+(d.verdict==="si"?"✓ Sí":"✗ No")+'</span>';
    }

    if(d.kind==="list"){
      h+='<ol class="fc-list '+d.marker+'">';
      d.items.forEach(function(it){h+='<li>'+it+'</li>';});
      h+='</ol>';
    }else if(d.kind==="clauses"){
      h+='<div class="fc-clauses">';
      d.items.forEach(function(it){h+='<p>'+it+'</p>';});
      h+='</div>';
    }else if(d.text){
      h+='<p class="fc-p">'+d.text+'</p>';
    }

    if(d.cite){
      h+='<span class="fc-cite"><span class="s">§</span>'+d.cite+'</span>';
    }
    return {html:h,struct:(d.kind!=="p"||!!d.verdict||strip(raw).length>150)};
  }
  return {parse:parse,render:render};
})();

    card.style.display="";

    pok.textContent=ok+(ok===1?" sabida":" sabidas");
    pko.textContent=ko+" repasar";

    fill.style.width=(N?done/N*100:0)+"%";

    else if(e.key==="ArrowRight"){e.preventDefault();next(true);}
    else if(e.key==="ArrowLeft"){e.preventDefault();next(false);}
  });

  reset();
  return true;
}

  var tries=0;
  var iv=setInterval(function(){if(boot()||++tries>40)clearInterval(iv);},120);
  addEventListener("load",function(){setTimeout(boot,100);});
}
})();

/* ═══ Altura adaptativa + índice plegable ═══ */
(function(){
"use strict";

/* ── 1 · Índice lateral plegable ── */
function sidebar(){
  var lay=document.querySelector(".layout"),
      side=document.getElementById("side"),
      tools=document.querySelector(".tools");
  if(!lay||!side||!tools||document.getElementById("navhide"))return;

  var K="oposi_bII_nav";
  function get(){try{return localStorage.getItem(K)==="0";}catch(e){return false;}}
  function set(v){try{localStorage.setItem(K,v?"0":"1");}catch(e){}}

  var b=document.createElement("button");
  b.id="navhide";b.type="button";
  b.innerHTML='<span class="ic">☰</span>';
  b.setAttribute("aria-controls","side");
  tools.insertBefore(b,tools.firstChild);

  function apply(hidden,anim){
    if(!anim)lay.style.transition="none";
    lay.classList.toggle("nonav",hidden);
    side.setAttribute("aria-hidden",String(hidden));
    b.setAttribute("aria-pressed",String(hidden));
    b.title=hidden?"Mostrar índice (i)":"Ocultar índice (i)";
    b.setAttribute("aria-label",b.title);
    if(!anim)requestAnimationFrame(function(){lay.style.transition="";});
  }
  apply(get(),false);

  b.onclick=function(){
    var h=!lay.classList.contains("nonav");
    apply(h,true);set(h);
    window.dispatchEvent(new Event("resize"));
  };
  document.addEventListener("keydown",function(e){
    if(e.target.matches("input,textarea,select"))return;
    if(e.key==="i"||e.key==="I"){e.preventDefault();b.click();}
  });
}

/* ── 2 · La tarjeta se adapta a su contenido ── */
function autofit(){
  var stage=document.querySelector(".fc-stage");
  if(!stage||stage.dataset.fit)return;
  var deck=stage.querySelector(".fc-deck"),
      front=stage.querySelector(".fc-front"),
      back=stage.querySelector(".fc-back");
  if(!deck||!front||!back)return;
  stage.dataset.fit="1";

  var meas=document.createElement("div");
  meas.className="fc-measure";meas.setAttribute("aria-hidden","true");
  meas.innerHTML='<div class="fc-face fc-front"><div class="fc-body"><div class="fc-txt"></div></div></div>';
  stage.appendChild(meas);
  var mFace=meas.querySelector(".fc-face"), mTxt=meas.querySelector(".fc-txt");

  function measure(cls,html){
    mFace.className="fc-face "+cls;
    mTxt.innerHTML=html;
    return mFace.offsetHeight;
  }

  function fit(){
    if(deck.classList.contains("empty")){deck.style.height="230px";return;}
    var fT=front.querySelector(".fc-txt"), bT=back.querySelector(".fc-txt");
    if(!fT||!bT)return;
    var h=Math.max(
      measure("fc-front"+(front.classList.contains("struct")?" struct":""),fT.innerHTML),
      measure("fc-back" +(back .classList.contains("struct")?" struct":""),bT.innerHTML),
      230
    );
    deck.style.height=Math.ceil(h+8)+"px";
  }

  /* recalcular cuando cambia la tarjeta, el tamaño de letra o la ventana */
  new MutationObserver(fit).observe(back,{childList:true,subtree:true,attributes:true,attributeFilter:["class"]});
  var t;
  addEventListener("resize",function(){clearTimeout(t);t=setTimeout(fit,120);},{passive:true});
  ["fs+","fs-"].forEach(function(id){
    var el=document.getElementById(id);
    if(el)el.addEventListener("click",function(){setTimeout(fit,60);});
  });
  fit();setTimeout(fit,250);
}

function go(){sidebar();autofit();}
if(document.readyState!=="loading")go();else document.addEventListener("DOMContentLoaded",go);
addEventListener("load",function(){setTimeout(go,120);});
var n=0,iv=setInterval(function(){go();if(++n>25)clearInterval(iv);},150);
})();


</script>
<script>


/* ═══════════════════════════════════════════════════════════════
   TTS · Lectura en voz alta del texto legal
   ═══════════════════════════════════════════════════════════════ */
(function(){
"use strict";
if(!("speechSynthesis" in window))return;

var K="oposi_bII_tts";
function load(){try{return JSON.parse(localStorage.getItem(K))||{};}catch(e){return {};}}
function save(o){try{localStorage.setItem(K,JSON.stringify(o));}catch(e){}}
var cfg=load();
if(cfg.rate==null)cfg.rate=1;
if(cfg.gen==null)cfg.gen="f";

var synth=window.speechSynthesis, voces=[], actual=null, bloques=[];

/* ─────────── 1 · Selección de voz ─────────── */
/* iOS y iPadOS enumeran voces de red (Google, «Online») que en realidad no
   sintetizan: se seleccionan pero no suena nada. Ahí solo valen las locales. */
var IOS=(function(){
  var ua=navigator.userAgent||"";
  if(/iPad|iPhone|iPod/i.test(ua))return true;
  return navigator.platform==="MacIntel"&&(navigator.maxTouchPoints||0)>1;
})();
var descartadas=0;

function esEspanol(v){return /^es\b|^es[-_]/i.test(v.lang||"")||/spanish|español/i.test(v.name||"");}
function esRemota(v){return v.localService===false||/google|online/i.test(v.name||"");}
function reproducible(v){return !IOS||!esRemota(v);}

function calidad(v){
  var n=(v.name||"")+" "+(v.voiceURI||""), p=0;
  if(/natural|neural/i.test(n))p+=100;
  if(/premium|enhanced|eloquence/i.test(n))p+=35;
  if(/^es-ES/i.test(v.lang))p+=12;              /* castellano de España primero */
  if(/microsoft/i.test(n))p+=8;
  if(IOS){
    /* en el iPad y el móvil de Apple mandan las locales */
    if(esRemota(v))p-=500;
    if(v.localService!==false)p+=40;
  }else{
    if(/online/i.test(n))p+=40;
    if(/google/i.test(n))p+=30;
    if(v.localService===false)p+=15;
  }
  return p;
}
var MASC=/(pablo|álvaro|alvaro|jorge|diego|juan|raul|raúl|carlos|miguel|lorenzo|gonzalo|dalton|liam|andr[eé]s|luciano|male|hombre|masculin)/i;
var FEM =/(helena|elvira|laura|mónica|monica|paulina|sabina|esperanza|marisol|ximena|dalia|salome|camila|catalina|isidora|female|mujer|femenin)/i;
function genero(v){
  var n=v.name||"";
  if(MASC.test(n))return "m";
  if(FEM.test(n))return "f";
  return "?";
}
function cargarVoces(){
  var all=synth.getVoices()||[];
  var es=all.filter(esEspanol);
  descartadas=0;
  var utiles=[];
  es.forEach(function(v){ if(reproducible(v))utiles.push(v); else descartadas++; });
  voces=utiles.sort(function(a,b){return calidad(b)-calidad(a);});
  if(!voces.length)voces=all.filter(reproducible).slice(0,12);
  /* si la voz guardada ya no sirve en este aparato, la olvidamos */
  if(cfg.voz){
    var sigue=false;
    for(var i=0;i<voces.length;i++)if(voces[i].voiceURI===cfg.voz)sigue=true;
    if(!sigue&&voces.length){cfg.voz=null;save(cfg);}
  }
  pintarSelector();
}
function elegir(){
  if(cfg.voz){
    for(var i=0;i<voces.length;i++)
      if(voces[i].voiceURI===cfg.voz&&reproducible(voces[i]))return voces[i];
  }
  var g=cfg.gen;
  for(var j=0;j<voces.length;j++)if(genero(voces[j])===g&&reproducible(voces[j]))return voces[j];
  for(var k=0;k<voces.length;k++)if(reproducible(voces[k]))return voces[k];

/* Safari exige que la primera locución nazca de un gesto: la preparamos */
var motorListo=false;
function despertarMotor(){

function avisarVoz(v){

    a.__t=setTimeout(function(){a.classList.remove("show");},6000);
  }catch(e){}
}

/* ─────────── 2 · Naturalidad: expandir lo que el TTS lee mal ─────────── */
var ORD={1:"primera",2:"segunda",3:"tercera",4:"cuarta",5:"quinta",
         6:"sexta",7:"séptima",8:"octava",9:"novena",10:"décima"};
function paraVoz(t){
  return t
    .replace(/\barts?\.\s*/gi,function(m){return /arts/i.test(m)?"artículos ":"artículo ";})
    .replace(/\bapdos?\.\s*/gi,"apartado ")
    .replace(/\bnúms?\.\s*/gi,"número ")
    .replace(/\bpárr\.\s*/gi,"párrafo ")
    .replace(/\bcap\.\s*/gi,"capítulo ")
    .replace(/\bpágs?\.\s*/gi,"página ")
    .replace(/\by\s+ss\./gi,"y siguientes")
    .replace(/\bss\./gi,"siguientes")
    .replace(/\bTRLHL\b/g,"Texto Refundido de la Ley de Haciendas Locales")
    .replace(/\bLCSP\b/g,"Ley de Contratos del Sector Público")
    .replace(/\bLBRL\b/g,"Ley de Bases del Régimen Local")
    .replace(/\bLRJSP\b/g,"Ley de Régimen Jurídico del Sector Público")
    .replace(/\bLPACAP\b/g,"Ley del Procedimiento Administrativo Común")
    .replace(/\bRDLeg\b/gi,"Real Decreto Legislativo")
    .replace(/\bRD\b/g,"Real Decreto")
    .replace(/\bCCAA\b/g,"comunidades autónomas")
    .replace(/\bCA\b/g,"comunidad autónoma")
    .replace(/\bEELL\b/g,"entidades locales")
    .replace(/\bBOE\b/g,"Boletín Oficial del Estado")
    .replace(/\bIVA\b/g,"I.V.A.")
    .replace(/\bSARA\b/g,"sara")
    .replace(/\bDA\s+(\d+)/g,"disposición adicional $1")
    .replace(/\bDT\s+(\d+)/g,"disposición transitoria $1")
    .replace(/(\d+)\.ª/g,function(m,n){return ORD[+n]||(n+"ª");})
    .replace(/(\d+)\.º/g,"$1º")
    /* 3.005,06 → 3005,06 para que lo lea como cifra y no como frase */
    .replace(/(\d)\.(?=\d{3}\b)/g,"$1")
    .replace(/(\d)\.(?=\d{3}\b)/g,"$1")
    .replace(/€/g," euros")
    .replace(/%/g," por ciento")
    .replace(/\bnº\b/gi,"número")
    .replace(/\s*·\s*/g,". ")
    .replace(/\(\s*/g,", ").replace(/\s*\)/g,", ")
    .replace(/\bvid\.\s*/gi,"véase ")
    .replace(/\bcfr\.\s*/gi,"compárese ")
    /* limpieza de puntuación tras las sustituciones */
    .replace(/([.:;!?])(?=[A-ZÁÉÍÓÚÑ¿¡])/g,"$1 ")
    .replace(/\s+([,.;:])/g,"$1")
    .replace(/,\s*([.;:])/g,"$1")
    .replace(/([,.;:])\s*\1+/g,"$1")
    .replace(/,\s*,/g,",")
    .replace(/\s{2,}/g," ")
    .trim();
}

/* ─────────── 3 · Segmentar en frases y envolverlas ─────────── */
var ABBR=/\b(arts?|apdos?|núms?|nums?|págs?|párr|cap|caps|ss|Sr|Sra|Sres|D|Dª|etc|vid|cfr|op|cit|ej|núm|art|fig|tít|secc)\.$/i;
/* Se lee de punto a punto. Solo se parte una frase si es tan larga que el
   motor de voz podría enmudecer, y entonces se busca un punto y coma antes
   que una coma, para que el corte no suene a media idea. */
var MAX_FRASE=500;

function corteBlando(t,desde,tope){
  var i,c;
  for(i=tope-1;i>desde+80;i--){            /* 1º punto y coma o dos puntos */
    c=t[i];
    if((c===";"||c===":")&&/\s/.test(t[i+1]||" "))return i+1;
  }
  for(i=tope-1;i>desde+80;i--){            /* 2º coma */
    if(t[i]===","&&/\s/.test(t[i+1]||" "))return i+1;
  }
  for(i=tope-1;i>desde+80;i--) if(/\s/.test(t[i]))return i+1;
  return tope;
}
function limites(t){
  /* 1ª pasada · solo finales de frase de verdad: punto, admiración, interrogación */
  var brutos=[],ini=0,i;
  for(i=0;i<t.length;i++){
    var c=t[i];
    if(c!=="."&&c!=="!"&&c!=="?")continue;
    var sig=t[i+1]||" ";
    if(!/[\s"»)]/.test(sig)){
      /* los párrafos llegan pegados: «…actuaciones.2. En los pliegos…».
         Ahí sí hay final de frase, aunque falte el espacio. */
      var apartado=/^\d{1,2}\.\s+[A-ZÁÉÍÓÚÑ¿«]/.test(t.slice(i+1,i+9))&&!/\d$/.test(t.slice(0,i));
      if(!apartado)continue;                   /* 3.005 y 168.4 quedan intactos */
    }
    if(ABBR.test(t.slice(Math.max(0,i-9),i+1)))continue;
    if(i+1-ini<40)continue;
    brutos.push(i+1);ini=i+1;
  }
  if(ini<t.length)brutos.push(t.length);
  /* 2ª pasada · solo lo excesivamente largo se reparte */
  var out=[],desde=0;
  for(i=0;i<brutos.length;i++){
    var fin=brutos[i];
    while(fin-desde>MAX_FRASE){
      var c2=corteBlando(t,desde,Math.min(desde+MAX_FRASE,fin));
      if(c2<=desde)break;
      out.push(c2);desde=c2;
    }
    out.push(fin);desde=fin;
  }
  return out;
}
function segmentar(root){
  var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:function(n){
    if(!n.nodeValue||!n.nodeValue.trim())return NodeFilter.FILTER_REJECT;
    if(n.parentElement&&n.parentElement.closest(".lbl,.tts-bar"))return NodeFilter.FILTER_REJECT;
    return NodeFilter.FILTER_ACCEPT;
  }});
  var nodos=[];while(w.nextNode())nodos.push(w.currentNode);
  if(!nodos.length)return [];

  var full="";nodos.forEach(function(n){full+=n.nodeValue;});
  var cortes=limites(full), frases=[],ci=0,pos=0;
  cortes.forEach(function(){frases.push({text:"",spans:[]});});

  nodos.forEach(function(node){
    var txt=node.nodeValue, off=0, frag=document.createDocumentFragment();
    while(off<txt.length){
      var fin=cortes[ci]!=null?cortes[ci]-pos:txt.length;
      if(fin>txt.length)fin=txt.length;
      if(fin<=off)fin=txt.length;
      var trozo=txt.slice(off,fin);
      var sp=document.createElement("span");
      sp.className="tts-s";sp.setAttribute("data-s",ci);sp.textContent=trozo;
      frag.appendChild(sp);
      if(frases[ci]){frases[ci].text+=trozo;frases[ci].spans.push(sp);}
      if(pos+fin>=(cortes[ci]||Infinity))ci++;
      off=fin;
    }
    pos+=txt.length;
    node.parentNode.replaceChild(frag,node);
  });
  return frases.filter(function(f){return f.text.trim().length>1;});
}

/* ─────────── 4 · Reproductor ─────────── */
var mini,miniBar,miniLbl,miniPlay;
function crearMini(){
  mini=document.createElement("div");
  mini.className="tts-mini noprint";
  mini.innerHTML='<span class="lbl"></span>'
    +'<button class="main" data-a="play" title="Pausar o reanudar">⏸</button>'
    +'<span class="bar"><i></i></span>'
    +'<button data-a="prev" title="Frase anterior">↺</button>'
    +'<button data-a="stop" title="Detener">■</button>'
    +'<button data-a="cfg" title="Ajustes de voz">⚙</button>';
  document.body.appendChild(mini);
  miniBar=mini.querySelector(".bar i");miniLbl=mini.querySelector(".lbl");
  miniPlay=mini.querySelector('[data-a="play"]');
  mini.addEventListener("click",function(e){
    var b=e.target.closest("button");if(!b)return;
    var a=b.getAttribute("data-a");
    if(a==="play")pausarReanudar();
    else if(a==="stop")parar();
    else if(a==="prev"){if(actual){actual.i=Math.max(0,actual.i-2);siguiente();}}
    else if(a==="cfg")abrirPanel();
  });
}

function limpiarMarcas(){
  document.querySelectorAll(".tts-s.now").forEach(function(s){s.classList.remove("now");});
}
function parar(){
  if(actual){if(actual.wdIni)clearTimeout(actual.wdIni);if(actual.wdFin)clearTimeout(actual.wdFin);}
  synth.cancel();
  if(actual){
    actual.bloque.classList.remove("tts-on");
    var b=actual.bloque.querySelector(".tts-play");
    if(b){b.classList.remove("on");b.innerHTML=iconoPlay();}
  }
  limpiarMarcas();
  actual=null;
  if(mini)mini.classList.remove("show");
}
function iconoPlay(){return '<span aria-hidden="true">▶</span> Escuchar';}
function iconoOn(){return '<span class="tts-wave" aria-hidden="true"><i></i><i></i><i></i><i></i></span> Leyendo';}

function pausarReanudar(){
  if(!actual)return;
  if(synth.paused){synth.resume();miniPlay.textContent="⏸";}
  else{synth.pause();miniPlay.textContent="▶";}
}

function leer(bloque){
  if(actual&&actual.bloque===bloque){parar();return;}
  parar();
  var datos=bloque.__tts;
  if(!datos||!datos.length)return;
  var voz=elegir();
  actual={bloque:bloque,frases:datos,i:0,voz:voz};
  bloque.classList.add("tts-on");
  var b=bloque.querySelector(".tts-play");
  if(b){b.classList.add("on");b.innerHTML=iconoOn();}
  if(!mini)crearMini();
  var art=bloque.closest(".art");
  var t=art?art.querySelector("h2 .num"):null;
  var sufijo=bloque.__label?" · "+bloque.__label:"";
  miniLbl.textContent=(t?t.textContent:"")+sufijo||"Lectura";
  miniLbl.title=miniLbl.textContent;
  miniPlay.textContent="⏸";
  mini.classList.add("show");
  siguiente();
}

function limpiaWD(){
  if(actual){
    if(actual.wdIni)clearTimeout(actual.wdIni);
    if(actual.wdFin)clearTimeout(actual.wdFin);
    actual.wdIni=actual.wdFin=null;
  }
}
function siguiente(){
  if(!actual)return;
  limpiaWD();
  limpiarMarcas();
  if(actual.i>=actual.frases.length){
    var fin=actual.bloque;
    parar();
    fin.dispatchEvent(new CustomEvent("tts:fin",{bubbles:true}));
    return;
  }
  var f=actual.frases[actual.i];
  var texto=paraVoz(f.text);
  if(!texto||texto.length<2){actual.i++;siguiente();return;}

  f.spans.forEach(function(s){s.classList.add("now");});
  if(f.spans[0]&&actual.i>0){
    try{
      var r=f.spans[0].getBoundingClientRect();
      if((r.top<70||r.bottom>innerHeight-90)&&f.spans[0].scrollIntoView)
        f.spans[0].scrollIntoView({block:"center",behavior:"smooth"});
    }catch(e){}
  }
  miniBar.style.width=((actual.i+1)/actual.frases.length*100)+"%";

  var u=new SpeechSynthesisUtterance(texto);
  if(actual.voz){u.voice=actual.voz;u.lang=actual.voz.lang;}else{u.lang="es-ES";}
  u.rate=cfg.rate;u.pitch=cfg.pitch||1;u.volume=1;

  var avanzado=false;
  function avanzar(){
    if(avanzado)return;avanzado=true;
    limpiaWD();
    if(actual){actual.i++;setTimeout(siguiente,80);}
  }
  u.onstart=function(){
    if(actual&&actual.wdIni){clearTimeout(actual.wdIni);actual.wdIni=null;}
  };
  u.onend=avanzar;
  u.onerror=function(e){
    if(e&&(e.error==="interrupted"||e.error==="canceled"))return;
    avanzar();
  };
  actual.u=u;

  /* si el motor no arranca en 3 s: probamos con una voz local y seguimos */
  actual.wdIni=setTimeout(function(){
    if(!actual||actual.u!==u||avanzado)return;
    if(!actual.reintento){
      actual.reintento=true;
      /* la voz elegida puede no sonar en este aparato: buscamos una local */
      var local=null,i;
      for(i=0;i<voces.length;i++)
        if(voces[i]!==actual.voz&&voces[i].localService!==false&&!esRemota(voces[i])){local=voces[i];break;}
      if(local){
        actual.voz=local;
        cfg.voz=local.voiceURI;save(cfg);
        if(sel)try{sel.value=local.voiceURI;}catch(e){}
        avisarVoz(local);
      }
      try{synth.cancel();}catch(e){}
      setTimeout(function(){
        if(actual&&actual.u===u&&!avanzado){
          var u2=new SpeechSynthesisUtterance(texto);
          if(actual.voz){u2.voice=actual.voz;u2.lang=actual.voz.lang;}else u2.lang="es-ES";
          u2.rate=cfg.rate;u2.pitch=cfg.pitch||1;u2.volume=1;
          u2.onstart=u.onstart;u2.onend=u.onend;u2.onerror=u.onerror;
          actual.u=u2;
          try{synth.speak(u2);}catch(e){avanzar();}
        }
      },140);
    }else{ actual.reintento=false; avanzar(); }
  },3000);

  /* y si no termina en un tiempo razonable para su longitud, pasamos de trozo */
  var estimado=texto.length/(11*(cfg.rate||1))*1000;
  actual.wdFin=setTimeout(function(){
    if(actual&&actual.u===u&&!avanzado){try{synth.cancel();}catch(e){}avanzar();}
  },Math.max(6000,estimado*2.4+3000));

  try{ synth.speak(u); }catch(e){ avanzar(); }
}

/* Con locuciones cortas ya no hace falta el pause/resume periódico, que en
   Chrome llegaba a dejar la voz colgada. Solo vigilamos que no se detenga sola. */
setInterval(function(){
  if(actual&&!synth.speaking&&!synth.paused&&actual.u){
    if(!actual.mudo)actual.mudo=1;else if(++actual.mudo>3){actual.mudo=0;
      try{synth.cancel();}catch(e){}
      if(actual){actual.i++;setTimeout(siguiente,60);}}
  }else if(actual)actual.mudo=0;
},1500);

/* ─────────── 5 · Panel de ajustes ─────────── */
var back,sel;
function crearPanel(){
  back=document.createElement("div");
  back.className="tts-back noprint";
  back.innerHTML=
   '<div class="tts-panel" role="dialog" aria-modal="true" aria-label="Ajustes de voz">'
   +'<h3>🔊 Lectura en voz alta</h3>'
   +'<p class="sub">Ajusta cómo se lee el texto legal. Se recuerda para todos los bloques.</p>'
   +'<div class="tts-row"><label>Tipo de voz</label>'
     +'<div class="tts-seg" id="ttsGen">'
       +'<button data-g="f">👩 Femenina</button>'
       +'<button data-g="m">👨 Masculina</button>'
     +'</div></div>'
   +'<div class="tts-row"><label>Voz concreta</label><select id="ttsVoz"></select></div>'
   +'<div class="tts-row"><label>Velocidad</label>'
     +'<div class="tts-slider"><input type="range" id="ttsRate" min="0.6" max="1.6" step="0.05">'
     +'<span class="tts-val" id="ttsRateV"></span></div></div>'
   +'<div class="tts-row"><label>Tono</label>'
     +'<div class="tts-slider"><input type="range" id="ttsPitch" min="0.7" max="1.3" step="0.05">'
     +'<span class="tts-val" id="ttsPitchV"></span></div></div>'
   +'<p class="tts-note" id="ttsNota"></p>'
   +'<div class="tts-acts">'
     +'<button id="ttsTest">▶ Probar</button>'
     +'<button class="prim" id="ttsOk">Hecho</button>'
   +'</div></div>';
  document.body.appendChild(back);
  sel=back.querySelector("#ttsVoz");

  back.addEventListener("click",function(e){if(e.target===back)cerrarPanel();});
  back.querySelector("#ttsOk").onclick=cerrarPanel;
  back.querySelector("#ttsGen").addEventListener("click",function(e){
    var b=e.target.closest("button[data-g]");if(!b)return;
    cfg.gen=b.getAttribute("data-g");cfg.voz=null;save(cfg);pintarSelector();probar();
  });
  sel.onchange=function(){cfg.voz=sel.value;save(cfg);probar();};
  var r=back.querySelector("#ttsRate"),rv=back.querySelector("#ttsRateV");
  r.value=cfg.rate;rv.textContent=(+cfg.rate).toFixed(2)+"×";
  r.oninput=function(){cfg.rate=+r.value;rv.textContent=cfg.rate.toFixed(2)+"×";save(cfg);};
  r.onchange=probar;
  var p=back.querySelector("#ttsPitch"),pv=back.querySelector("#ttsPitchV");
  p.value=cfg.pitch||1;pv.textContent=(+(cfg.pitch||1)).toFixed(2);
  p.oninput=function(){cfg.pitch=+p.value;pv.textContent=cfg.pitch.toFixed(2);save(cfg);};
  p.onchange=probar;
  back.querySelector("#ttsTest").onclick=probar;
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"&&back.classList.contains("show"))cerrarPanel();
  });
}
function probar(){
  synth.cancel();
  var v=elegir();
  var u=new SpeechSynthesisUtterance("El presupuesto general de la entidad local se aprueba antes del 31 de diciembre.");
  if(v){u.voice=v;u.lang=v.lang;}else u.lang="es-ES";
  u.rate=cfg.rate;u.pitch=cfg.pitch||1;
  synth.speak(u);
}
function pintarSelector(){
  if(!sel)return;
  var g=cfg.gen;
  back.querySelectorAll("#ttsGen button").forEach(function(b){
    b.setAttribute("aria-pressed",String(b.getAttribute("data-g")===g));
  });
  var pref=voces.filter(function(v){return genero(v)===g;});
  var otras=voces.filter(function(v){return genero(v)!==g;});
  function opt(v){
    var nat=/natural|neural|online|premium|enhanced|google/i.test(v.name)?" ★":"";
    return '<option value="'+v.voiceURI+'">'+v.name+nat+"</option>";
  }
  sel.innerHTML=(pref.length?'<optgroup label="'+(g==="f"?"Femeninas":"Masculinas")+'">'+pref.map(opt).join("")+"</optgroup>":"")
    +(otras.length?'<optgroup label="Otras voces en español">'+otras.map(opt).join("")+"</optgroup>":"");
  var v=elegir();
  if(v)sel.value=v.voiceURI;

  var nota=back.querySelector("#ttsNota");
  var hayNat=voces.some(function(x){return /natural|neural|online/i.test(x.name);});
  if(!voces.length){
    nota.innerHTML="⚠️ No se han detectado voces en español en este navegador. Prueba con Microsoft Edge o Chrome.";
  }else if(hayNat){
    nota.innerHTML="✅ Tienes voces <b>neuronales</b> disponibles (marcadas con ★): son las que suenan más humanas.";
  }else{
    nota.innerHTML="💡 Las voces marcadas con ★ suenan mejor. Para conseguir voces <b>neuronales</b> (mucho más naturales), "
      +"abre estas páginas en <b>Microsoft Edge</b>, o instálalas en Windows: <b>Configuración → Hora e idioma → Voz → Agregar voces</b>.";
  }
}
function abrirPanel(){if(!back)crearPanel();pintarSelector();back.classList.add("show");}
function cerrarPanel(){if(back)back.classList.remove("show");synth.cancel();}

/* ─────────── 6 · Inyectar los controles en cada apartado ─────────── */
/* Se excluyen a propósito tres apartados: conexiones con otros preceptos,
   trampas y errores frecuentes, y anclaje memorístico. */
var TTS_EXCLUIR=/(conexion|conexiones|trampas|anclaje)/i;

function ttsBarra(frases,compacta){
  var bar=document.createElement("div");
  bar.className="tts-bar noprint"+(compacta?" mini":"");
  bar.innerHTML='<button class="tts-play" type="button">'+iconoPlay()+"</button>"
    +(compacta?"":'<button class="tts-cfg" type="button" title="Ajustes de voz">⚙ Voz</button>')
    +'<span class="tts-time">'+frases.length+(frases.length===1?" frase":" frases")+"</span>";
  return bar;
}

function ttsPreparar(bl,opts){
  if(bl.getAttribute("data-tts"))return false;
  bl.setAttribute("data-tts","1");
  var frases=segmentar(bl);
  bl.__tts=frases;
  if(!frases.length||bl.textContent.trim().length<40)return false;
  bl.__label=opts.label||"";
  var bar=ttsBarra(frases,opts.compacta);
  if(opts.tras){
    var ref=bl.querySelector(opts.tras);
    if(ref&&ref.nextSibling)bl.insertBefore(bar,ref.nextSibling);
    else bl.insertBefore(bar,bl.firstChild);
  }else if(opts.alFinal){
    bl.appendChild(bar);
  }else{
    bl.insertBefore(bar,bl.firstChild);
  }
  bar.querySelector(".tts-play").onclick=function(e){e.stopPropagation();leer(bl);};
  var cfg=bar.querySelector(".tts-cfg");
  if(cfg)cfg.onclick=function(e){e.stopPropagation();abrirPanel();};
  return true;
}

function montar(){
  var hay=false;
  if(!back)crearPanel();

  /* 6a · Texto legal literal */
  Array.prototype.forEach.call(document.querySelectorAll(".legal:not([data-tts])"),function(bl){
    hay=ttsPreparar(bl,{tras:".lbl",label:"Texto legal"})||hay;
  });

  /* 6b · Idea clave */
  Array.prototype.forEach.call(document.querySelectorAll(".idea:not([data-tts])"),function(bl){
    hay=ttsPreparar(bl,{compacta:true,alFinal:true,label:"Idea clave"})||hay;
  });

  /* 6c · Apartados desplegables, salvo los tres excluidos */
  Array.prototype.forEach.call(document.querySelectorAll("details.panel"),function(p){
    var sum=p.querySelector("summary");
    var body=p.querySelector(".body");
    if(!sum||!body||body.getAttribute("data-tts"))return;
    var t=sum.textContent||"";
    if(TTS_EXCLUIR.test(t)){body.setAttribute("data-tts","skip");return;}
    hay=ttsPreparar(body,{compacta:true,label:t.replace(/[^\wáéíóúüñÁÉÍÓÚÜÑ\s·¿?¡!]/g,"").trim()})||hay;
  });

  /* 6d · Resumen e introducción del bloque */
  ["#resumen","#intro"].forEach(function(sel){
    var sec=document.querySelector(sel);
    if(!sec||sec.getAttribute("data-tts"))return;
    var h=sec.querySelector("h2");
    hay=ttsPreparar(sec,{tras:"h2",label:h?h.textContent:"Resumen"})||hay;
  });

  return hay;
}

/* ─────────── 7 · Arranque ─────────── */
cargarVoces();
if(typeof synth.onvoiceschanged!=="undefined")synth.onvoiceschanged=cargarVoces;
setTimeout(cargarVoces,400);setTimeout(cargarVoces,1400);

var n=0,iv=setInterval(function(){if(montar()||++n>40)clearInterval(iv);},150);
addEventListener("load",function(){setTimeout(montar,200);});
addEventListener("beforeunload",function(){synth.cancel();});
document.addEventListener("keydown",function(e){
  if(e.target.matches("input,textarea,select"))return;
  if(e.key==="Escape"&&actual)parar();
});
})();


</script>
<script>


/* ═══════════════════════════════════════════════════════════════
   AUTOAJUSTE DE DIAGRAMAS SVG
   · El texto que desborda su rectángulo se reparte en líneas.
   · Las filas siguientes se empujan hacia abajo y el rectángulo crece,
     de modo que ninguna línea nueva pise al texto de debajo.
   · Si no hay espacio libre bajo el rectángulo, en lugar de repartir
     se reduce la fuente: nunca se invade el elemento contiguo.
   · Las etiquetas sueltas reciben halo y se pintan sobre las flechas.
   Todas las medidas se toman del elemento ya renderizado.
   ═══════════════════════════════════════════════════════════════ */
(function(){
"use strict";
var NS="http://www.w3.org/2000/svg";
var PAD_X=9, PAD_Y=7, FS_MIN=6.5, MAX_LINEAS=4, INTER=1.16, SEP_MIN=5;

function num(el,a,d){var v=parseFloat(el.getAttribute(a));return isNaN(v)?(d||0):v;}
function ancho(t){try{if(t.getComputedTextLength)return t.getComputedTextLength();}catch(e){}return 0;}
function fs(t){
  var v=parseFloat(t.getAttribute("font-size"));
  if(!isNaN(v))return v;
  try{v=parseFloat(getComputedStyle(t).fontSize);if(!isNaN(v)&&v>0)return v;}catch(e){}
  return 10;
}
function partir(txt,cpp,maxW,n){
  if(txt.length*cpp<=maxW)return [txt];
  var seps=[" · "," — "," – ",", "," "],s,i,k;
  for(s=0;s<seps.length;s++){
    var tr=txt.split(seps[s]);
    if(tr.length<2)continue;
    var lin=[],act="";
    for(i=0;i<tr.length;i++){
      var cand=act?act+seps[s]+tr[i]:tr[i];
      if(act&&cand.length*cpp>maxW){lin.push(act);act=tr[i];}
      else act=cand;
    }
    if(act)lin.push(act);
    var caben=true;
    for(k=0;k<lin.length;k++)if(lin[k].length*cpp>maxW)caben=false;
    if(caben&&lin.length<=n)return lin;
  }
  return null;
}
function pintar(t,lin,size){
  while(t.firstChild)t.removeChild(t.firstChild);
  var x=t.getAttribute("x");
  for(var i=0;i<lin.length;i++){
    var ts=document.createElementNS(NS,"tspan");
    ts.setAttribute("x",x);
    if(i)ts.setAttribute("dy",(size*INTER).toFixed(1));
    ts.textContent=lin[i];
    t.appendChild(ts);
  }
}
function encajar(t,cpp,maxW){
  var sp=t.getElementsByTagName("tspan"),i;
  if(sp.length){
    for(i=0;i<sp.length;i++)
      if(sp[i].textContent.length*cpp>maxW+.5){
        sp[i].setAttribute("textLength",maxW.toFixed(1));
        sp[i].setAttribute("lengthAdjust","spacingAndGlyphs");
      }
  }else if((t.textContent||"").length*cpp>maxW+.5){
    t.setAttribute("textLength",maxW.toFixed(1));
    t.setAttribute("lengthAdjust","spacingAndGlyphs");
  }
}
/* reduce la fuente hasta que el texto quepa en una sola línea */
function encoger(t,txt,cpp,size,maxW){
  var s2=size,c2=cpp;
  while(s2>FS_MIN&&txt.length*c2>maxW){s2-=.5;c2=cpp*(s2/size);}
  t.setAttribute("font-size",s2.toFixed(1));
  encajar(t,c2,maxW);
  return s2;
}

function ajustar(svg){
  var rects=[],texts=[],i;
  var rl=svg.querySelectorAll("rect"),tl=svg.querySelectorAll("text");
  for(i=0;i<rl.length;i++)if(!rl[i].hasAttribute("data-halo"))rects.push(rl[i]);
  for(i=0;i<tl.length;i++)texts.push(tl[i]);
  if(!texts.length)return true;
  var medible=false;
  for(i=0;i<texts.length;i++)
    if((texts[i].textContent||"").trim()&&ancho(texts[i])>0){medible=true;break;}
  if(!medible)return false;

  var porRect=[],sueltos=[];
  function grupo(r){
    for(var j=0;j<porRect.length;j++)if(porRect[j].r===r)return porRect[j];
    var g={r:r,lista:[]};porRect.push(g);return g;
  }
  texts.forEach(function(t){
    if(t.getAttribute("data-fit"))return;
    var x=num(t,"x"),y=num(t,"y"),host=null,area=Infinity;
    rects.forEach(function(r){
      var rx=num(r,"x"),ry=num(r,"y"),rw=num(r,"width"),rh=num(r,"height");
      if(!rw||!rh)return;
      if(x>=rx-1&&x<=rx+rw+1&&y>=ry-1&&y<=ry+rh+1&&rw*rh<area){host=r;area=rw*rh;}
    });
    if(host)grupo(host).lista.push(t); else sueltos.push(t);
  });

  /* espacio libre bajo un rectángulo, hasta el siguiente elemento que le estorbe */
  function hueco(r){
    var rx=num(r,"x"),ry=num(r,"y"),rw=num(r,"width"),rh=num(r,"height");
    var abajo=ry+rh, libre=Infinity;
    rects.forEach(function(o){
      if(o===r)return;
      var ox=num(o,"x"),oy=num(o,"y"),ow=num(o,"width");
      if(oy>=abajo-1&&ox<rx+rw&&ox+ow>rx)libre=Math.min(libre,oy-abajo-SEP_MIN);
    });
    texts.forEach(function(t){
      var tx=num(t,"x"),ty=num(t,"y");
      if(ty>abajo&&tx>rx-40&&tx<rx+rw+40)
        libre=Math.min(libre,ty-fs(t)-abajo-SEP_MIN);
    });
    var vb=(svg.getAttribute("viewBox")||"").split(/[\s,]+/);
    if(vb.length===4)libre=Math.min(libre,parseFloat(vb[1])+parseFloat(vb[3])-abajo-2);
    return Math.max(0,libre);
  }

  /* ─── 1 · Texto dentro de un rectángulo ─── */
  porRect.forEach(function(g){
    var r=g.r, rx=num(r,"x"), ry=num(r,"y"), rw=num(r,"width"), rh=num(r,"height");
    var maxW=rw-PAD_X*2;
    if(maxW<20)return;
    g.lista.forEach(function(t){t.setAttribute("data-fit","1");});
    g.lista.sort(function(a,b){return num(a,"y")-num(b,"y");});

    /* filas: textos a la misma altura */
    var filas=[],act=null;
    g.lista.forEach(function(t){
      var y=num(t,"y");
      if(!act||Math.abs(y-act.y)>3){act={y:y,ts:[]};filas.push(act);}
      act.ts.push(t);
    });

    /* — plan: qué haría falta — */
    var total=0;
    filas.forEach(function(fl){
      fl.extra=0;fl.plan=[];
      fl.ts.forEach(function(t){
        var txt=(t.textContent||"").replace(/\s+/g," ").trim();
        var w=ancho(t);
        if(!txt||!w||w<=maxW){fl.plan.push(null);return;}
        var size=fs(t), cpp=w/txt.length;
        var lin=partir(txt,cpp,maxW,MAX_LINEAS);
        if(lin&&lin.length>1){
          fl.plan.push({t:t,lin:lin,size:size,cpp:cpp,txt:txt});
          fl.extra=Math.max(fl.extra,(lin.length-1)*size*INTER);
        }else fl.plan.push({t:t,lin:null,size:size,cpp:cpp,txt:txt});
      });
      total+=fl.extra;
    });

    /* — ¿cabe ese crecimiento? — */
    var ultima=filas[filas.length-1];
    var colchon=Math.max(0,(ry+rh)-ultima.y-PAD_Y);
    var crecer=Math.max(0,total-colchon);
    var libre=hueco(r);
    var reparte=crecer<=libre;

    var desp=0;
    filas.forEach(function(fl){
      if(desp>0)fl.ts.forEach(function(t){t.setAttribute("y",(num(t,"y")+desp).toFixed(1));});
      fl.plan.forEach(function(p){
        if(!p)return;
        if(p.lin&&reparte){pintar(p.t,p.lin,p.size);encajar(p.t,p.cpp,maxW);}
        else encoger(p.t,p.txt,p.cpp,p.size,maxW);
      });
      if(reparte)desp+=fl.extra;
    });

    if(reparte&&crecer>0)r.setAttribute("height",(rh+crecer).toFixed(1));

    /* comprobación final: ninguna línea puede sobresalir del rectángulo */
    var rh2=num(r,"height"), bajo=ry, i2;
    g.lista.forEach(function(t){
      var size=fs(t), y=num(t,"y"), sp=t.getElementsByTagName("tspan");
      if(sp.length){for(i2=0;i2<sp.length;i2++){
        if(i2)y+=parseFloat(sp[i2].getAttribute("dy"))||0;
        bajo=Math.max(bajo,y+size*0.3);}}
      else bajo=Math.max(bajo,y+size*0.3);
    });
    if(bajo>ry+rh2-1){
      var falta=bajo-(ry+rh2)+3;
      if(falta<=hueco(r))r.setAttribute("height",(rh2+falta).toFixed(1));
      else g.lista.forEach(function(t){
        var txt=(t.textContent||"").replace(/\s+/g," ").trim(), w=ancho(t);
        if(txt&&w)encoger(t,txt,w/txt.length,fs(t),maxW);
      });
    }
  });

  /* ─── 2 · Etiquetas sueltas ─── */
  sueltos.forEach(function(t){
    t.setAttribute("data-fit","1");
    var txt=(t.textContent||"").replace(/\s+/g," ").trim();
    if(!txt)return;
    var w=ancho(t); if(!w)return;
    var size=fs(t), x=num(t,"x"), y=num(t,"y");
    var an=t.getAttribute("text-anchor")||"start";
    var x0=an==="middle"?x-w/2:an==="end"?x-w:x;
    var halo=document.createElementNS(NS,"rect");
    halo.setAttribute("data-halo","1");
    halo.setAttribute("x",(x0-5).toFixed(1));
    halo.setAttribute("y",(y-size*0.92).toFixed(1));
    halo.setAttribute("width",(w+10).toFixed(1));
    halo.setAttribute("height",(size*1.28).toFixed(1));
    halo.setAttribute("rx","4");
    halo.setAttribute("fill","var(--surface)");
    halo.setAttribute("opacity",".93");
    var p=t.parentNode;
    p.appendChild(halo);p.appendChild(t);
  });
  return true;
}

function pasada(){
  var l=document.querySelectorAll("svg:not([data-fit])"),i;
  for(i=0;i<l.length;i++){try{if(ajustar(l[i]))l[i].setAttribute("data-fit","1");}catch(e){}}
}
if(document.readyState!=="loading")requestAnimationFrame(pasada);
else document.addEventListener("DOMContentLoaded",function(){requestAnimationFrame(pasada);});
addEventListener("load",function(){setTimeout(pasada,120);setTimeout(pasada,600);});
document.addEventListener("toggle",function(e){
  if(e.target&&e.target.tagName==="DETAILS")setTimeout(pasada,30);
},true);
var n=0,iv=setInterval(function(){pasada();if(++n>40)clearInterval(iv);},200);
})();


</script>

<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>LCSP · Arts. 44 a 60 · El recurso especial en materia de contratación</title>
<style>

/* ═══════════════════════════════════════════════════════════════
   SISTEMA DE DISEÑO · "Académico Gamificado" · Bloque II
   Temas 8, 9 y 10 · Auxiliar Administrativo
   ═══════════════════════════════════════════════════════════════ */
:root{
  --fs:16px;

  --bg:#faf9f7;
  --bg-grad:radial-gradient(1100px 560px at 12% -8%, #ede9ff 0%, transparent 55%),
            radial-gradient(850px 460px at 96% 0%, #dcf5ee 0%, transparent 50%);
  --surface:#ffffff;
  --surface-2:#f4f3f0;
  --surface-3:#eceae5;
  --line:#e6e3dc;
  --line-strong:#d4d0c7;

  --ink:#15161c;
  --ink-2:#5d616e;
  --ink-3:#8b8f9c;

  --brand:#5b3df5;
  --brand-2:#7c5cff;
  --brand-soft:#efeaff;
  --brand-ring:rgba(91,61,245,.18);

  --legal:#4338ca;  --legal-bg:#eeecff;
  --ej:#059669;     --ej-bg:#e4f7f0;
  --warn:#c2690a;   --warn-bg:#fdf1de;
  --exc:#dc2626;    --exc-bg:#ffeceb;

  --ok:#16a34a; --ok-soft:#e7f7ec;
  --mid:#eab308; --mid-soft:#fdf6dd;
  --off:#a1a1aa; --off-soft:#f1f1f3;

  --sh-1:0 1px 2px rgba(20,20,30,.04), 0 2px 8px rgba(20,20,30,.04);
  --sh-2:0 2px 6px rgba(20,20,30,.05), 0 12px 28px rgba(20,20,30,.07);
  --sh-3:0 8px 20px rgba(91,61,245,.13), 0 24px 56px rgba(20,20,30,.10);
  --sh-glow:0 0 0 4px var(--brand-ring);

  --r-sm:9px; --r-md:14px; --r-lg:20px; --r-full:999px;

  --f-display:"Segoe UI Variable Display",system-ui,-apple-system,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-legal:ui-serif,Georgia,Cambria,"Times New Roman",serif;
  --f-mono:ui-monospace,"SF Mono","Cascadia Mono","Segoe UI Mono",Menlo,monospace;

  --t-h1:clamp(1.02rem,.95rem + .3vw,1.2rem);
  --t-h2:clamp(1.2rem,1.05rem + .6vw,1.55rem);
  --t-h3:clamp(1rem,.95rem + .25vw,1.12rem);
  --t-sm:.86rem;
  --t-xs:.75rem;

  --e-out:cubic-bezier(.22,1,.36,1);
  --e-spring:cubic-bezier(.34,1.56,.64,1);

  /* ── Compatibilidad con SVG y contenido generado ── */
  --panel:var(--surface);
  --ink2:var(--ink-2);
  --acc:var(--brand);
  --acc-soft:var(--brand-soft);
  --g:var(--ok); --y:var(--mid); --r:var(--exc);
}

html[data-theme="dark"]{
  --bg:#0a0b0f;
  --bg-grad:radial-gradient(1100px 560px at 12% -8%, #1c1740 0%, transparent 55%),
            radial-gradient(850px 460px at 96% 0%, #08302b 0%, transparent 50%);
  --surface:#13151b;
  --surface-2:#1a1d25;
  --surface-3:#232733;
  --line:#262a34;
  --line-strong:#343947;

  --ink:#eceef4;
  --ink-2:#9ba2b3;
  --ink-3:#6e7585;

  --brand:#8b6dff;
  --brand-2:#a78bff;
  --brand-soft:#1e1a3d;
  --brand-ring:rgba(139,109,255,.22);

  --legal:#a5b4fc; --legal-bg:#191b3a;
  --ej:#34d399;    --ej-bg:#0c2a24;
  --warn:#fbbf24;  --warn-bg:#2e2110;
  --exc:#fb7185;   --exc-bg:#331119;

  --ok:#4ade80; --ok-soft:#0e2a19;
  --mid:#facc15; --mid-soft:#2c2610;
  --off:#5b6070; --off-soft:#1c1f27;

  --sh-1:0 1px 2px rgba(0,0,0,.3), 0 2px 8px rgba(0,0,0,.25);
  --sh-2:0 2px 6px rgba(0,0,0,.35), 0 12px 28px rgba(0,0,0,.4);
  --sh-3:0 8px 20px rgba(139,109,255,.2), 0 24px 56px rgba(0,0,0,.5);
}

*,*::before,*::after{box-sizing:border-box}
html{font-size:var(--fs);scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);background-image:var(--bg-grad);
  background-attachment:fixed;background-repeat:no-repeat;
  color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.68;
  -webkit-font-smoothing:antialiased;
  transition:background-color .5s var(--e-out),color .3s;
}
::selection{background:var(--brand);color:#fff}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{font-family:var(--f-display);letter-spacing:-.022em;line-height:1.2}
.num{font-variant-numeric:tabular-nums}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:99px;border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3)}

/* ═══ HEADER ═══ */
header.top{
  position:sticky;top:0;z-index:60;
  background:color-mix(in srgb,var(--surface) 80%,transparent);
  backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);
  border-bottom:1px solid var(--line);
}
.top-in{max-width:1280px;margin:0 auto;padding:.65rem 1.1rem;display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.brandwrap{display:flex;align-items:center;gap:.65rem;min-width:0;flex:1}
.mark{
  width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;
  font-weight:800;font-size:.8rem;letter-spacing:-.02em;text-decoration:none;
  box-shadow:0 4px 14px var(--brand-ring);
  transition:transform .3s var(--e-spring),box-shadow .3s;
}
.mark:hover{transform:rotate(-8deg) scale(1.08);box-shadow:var(--sh-3);text-decoration:none}
.top h1{font-size:var(--t-h1);margin:0;font-weight:800;line-height:1.25;min-width:0}
.top h1 .sub{display:block;font-size:var(--t-xs);color:var(--ink-2);font-weight:500;letter-spacing:0;
  margin-top:.1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tools{margin-left:auto;display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}

button,select,input[type=search]{
  font:inherit;font-size:var(--t-sm);font-weight:600;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:var(--r-sm);padding:.4rem .72rem;cursor:pointer;
  position:relative;overflow:hidden;
  transition:transform .18s var(--e-spring),border-color .2s,background .2s,box-shadow .2s,color .2s;
}
button:hover{transform:translateY(-1.5px);border-color:var(--brand);box-shadow:var(--sh-1)}
button:active{transform:translateY(0) scale(.97)}
button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible{outline:none;box-shadow:var(--sh-glow)}
input[type=search]{min-width:190px;cursor:text;font-weight:500}
input[type=search]:focus{border-color:var(--brand)}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--surface-2);padding:2px;gap:2px}
.seg button{border:0;border-radius:calc(var(--r-sm) - 2px);padding:.32rem .68rem;background:transparent;box-shadow:none}
.seg button:hover{transform:none;background:var(--surface)}
.seg button[aria-pressed="true"]{background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;box-shadow:0 2px 8px var(--brand-ring)}

.ripple{position:absolute;border-radius:50%;transform:scale(0);background:currentColor;opacity:.25;animation:rip .55s linear;pointer-events:none}
@keyframes rip{to{transform:scale(3.4);opacity:0}}

.progress{position:absolute;left:0;bottom:-1px;height:2.5px;width:0;
  background:linear-gradient(90deg,var(--brand),var(--legal),var(--ej));transition:width .1s linear}

/* ═══ LAYOUT ═══ */
.layout{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:270px 1fr;gap:1.8rem;padding:1.4rem 1.1rem 5rem}
main{min-width:0}

/* ═══ SIDEBAR ═══ */
nav.side{
  position:sticky;top:76px;align-self:start;max-height:calc(100vh - 96px);overflow:auto;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:.85rem;box-shadow:var(--sh-1);
}
nav.side h2{font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);
  margin:.5rem .4rem .5rem;font-weight:800}
nav.side h2:first-child{margin-top:.1rem}
nav.side a{
  display:flex;align-items:baseline;gap:.5rem;padding:.36rem .55rem;border-radius:var(--r-sm);
  text-decoration:none;color:var(--ink-2);font-size:var(--t-sm);font-weight:500;
  position:relative;transition:background .22s,color .22s,transform .22s var(--e-out);
}
nav.side a:hover{background:var(--surface-2);color:var(--ink);transform:translateX(3px);text-decoration:none}
nav.side a.on{background:var(--brand-soft);color:var(--brand);font-weight:700}
nav.side a.on::before{content:"";position:absolute;left:-.85rem;top:20%;bottom:20%;width:3px;
  border-radius:0 3px 3px 0;background:var(--brand)}
nav.side a b{color:var(--ink-3);font-weight:800;font-size:var(--t-xs);font-variant-numeric:tabular-nums;flex:none;min-width:1.9em}
nav.side a.on b{color:var(--brand)}
.navtoggle{display:none}

/* ═══ TARJETAS ═══ */
section.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:1.35rem 1.5rem;margin-bottom:1.1rem;box-shadow:var(--sh-1);
  transition:box-shadow .3s var(--e-out),border-color .3s;
}
section.card:hover{box-shadow:var(--sh-2)}
section.card>h2{
  margin:0 0 1rem;font-size:var(--t-h2);font-weight:800;
  display:flex;align-items:center;gap:.6rem;
}
section.card>h2::before{
  content:"";width:4px;height:1.05em;border-radius:99px;flex:none;
  background:linear-gradient(180deg,var(--brand),var(--brand-2));
}

/* ═══ ARTÍCULO ═══ */
.art{scroll-margin-top:86px;padding-top:.4rem}
.art + .art{margin-top:1.6rem;padding-top:1.6rem;border-top:1px dashed var(--line)}
.art h2{display:flex;flex-wrap:wrap;gap:.5rem;align-items:baseline;font-size:var(--t-h3);
  margin:0 0 .25rem;font-weight:800;letter-spacing:-.015em}
.art h2 .num{
  color:var(--brand);font-weight:800;font-family:var(--f-display);
  background:var(--brand-soft);padding:.1rem .5rem;border-radius:var(--r-sm);
  font-size:.92em;letter-spacing:-.02em;
}
.ubic{font-size:var(--t-xs);color:var(--ink-3);margin:0 0 .8rem;font-weight:600;
  letter-spacing:.03em;text-transform:uppercase}

/* ═══ IDEA CLAVE ═══ */
.idea{
  background:linear-gradient(100deg,var(--brand-soft),color-mix(in srgb,var(--brand-soft) 40%,transparent));
  border-left:4px solid var(--brand);border-radius:0 var(--r-md) var(--r-md) 0;
  padding:.75rem 1rem;font-weight:650;margin:.7rem 0 1rem;position:relative;
  font-size:.97rem;line-height:1.55;
}

/* ═══ ACORDEÓN ═══ */
details.panel{
  border:1px solid var(--line);border-radius:var(--r-md);margin:.6rem 0;
  background:var(--surface);overflow:hidden;
  transition:border-color .25s,box-shadow .25s,background .25s;
}
details.panel:hover{border-color:var(--line-strong)}
details.panel[open]{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-ring)}
details.panel>summary{
  cursor:pointer;padding:.62rem .9rem;font-weight:700;font-size:.93rem;
  list-style:none;display:flex;align-items:center;gap:.55rem;
  transition:background .2s,color .2s;
}
details.panel>summary:hover{background:var(--surface-2)}
details.panel[open]>summary{background:var(--brand-soft);color:var(--brand)}
details.panel>summary::-webkit-details-marker{display:none}
details.panel>summary::before{
  content:"";width:16px;height:16px;flex:none;border-radius:5px;
  background:var(--brand-soft);position:relative;transition:transform .3s var(--e-spring),background .25s;
}
details.panel>summary::after{
  content:"";position:absolute;width:0;height:0;margin-left:5px;
  border:4px solid transparent;border-left-color:var(--brand);
  transition:transform .3s var(--e-spring);
}
details.panel[open]>summary::before{background:var(--surface)}
details.panel[open]>summary::after{transform:rotate(90deg) translateX(-1px)}
details.panel .body{padding:.3rem 1rem 1rem;font-size:.95rem;animation:slidein .35s var(--e-out)}
@keyframes slidein{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* ═══ TEXTO LEGAL ═══ */
.legal{
  background:var(--legal-bg);border-left:4px solid var(--legal);
  border-radius:0 var(--r-md) var(--r-md) 0;padding:.85rem 1.05rem;
  font-family:var(--f-legal);font-size:.95rem;line-height:1.7;
}
.legal p{margin:.45rem 0}
.legal .lbl{
  font-family:var(--f-body);font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;
  color:var(--legal);font-weight:800;display:block;margin-bottom:.4rem;
}

/* ═══ CAJAS SEMÁNTICAS ═══ */
.box{
  border-left:4px solid var(--line);border-radius:0 var(--r-md) var(--r-md) 0;
  padding:.72rem .95rem;margin:.65rem 0;font-size:.94rem;
  transition:transform .25s var(--e-out),box-shadow .25s;
}
.box:hover{transform:translateX(3px);box-shadow:var(--sh-1)}
.box.ej{background:var(--ej-bg);border-color:var(--ej)}
.box.warn{background:var(--warn-bg);border-color:var(--warn)}
.box.exc{background:var(--exc-bg);border-color:var(--exc)}
.box .lbl{font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;font-weight:800;
  display:block;margin-bottom:.3rem}
.box.ej .lbl{color:var(--ej)}
.box.warn .lbl{color:var(--warn)}
.box.exc .lbl{color:var(--exc)}

.interp{
  border:1px dashed var(--warn);background:color-mix(in srgb,var(--warn-bg) 45%,transparent);
  border-radius:var(--r-md);padding:.65rem .9rem;font-size:.9rem;margin:.6rem 0;
}
.interp .lbl{font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;color:var(--warn);font-weight:800;display:block}

/* ═══ TABLAS ═══ */
table{width:100%;border-collapse:separate;border-spacing:0;font-size:.9rem;margin:.7rem 0;
  border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
th,td{padding:.5rem .68rem;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
td + td, th + th{border-left:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th{background:var(--surface-2);font-size:var(--t-xs);font-weight:800;letter-spacing:.05em;
  text-transform:uppercase;color:var(--ink-2);position:sticky;top:0}
tbody tr{transition:background .18s}
tbody tr:nth-child(even){background:color-mix(in srgb,var(--surface-2) 45%,transparent)}
tbody tr:hover{background:var(--brand-soft)}
th.sortable{cursor:pointer;user-select:none;transition:color .2s,background .2s}
th.sortable:hover{color:var(--brand);background:var(--brand-soft)}
th.sortable::after{content:" ⇅";color:var(--ink-3);font-size:.7rem}

ul,ol{margin:.5rem 0 .5rem 1.2rem;padding:0}
li{margin:.26rem 0}
li::marker{color:var(--brand);font-weight:700}

/* ═══ TOOLTIPS ═══ */
.t{border-bottom:1.5px dotted var(--brand);cursor:help;position:relative;
  transition:background .2s,color .2s}
.t:hover{background:var(--brand-soft);color:var(--brand);border-radius:3px}
#tip{
  position:fixed;z-index:99;max-width:330px;background:var(--ink);color:var(--bg);
  padding:.6rem .78rem;border-radius:var(--r-md);font-size:.82rem;line-height:1.5;
  display:none;box-shadow:0 8px 30px rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.08);
}
html[data-theme="dark"] #tip{background:#f0f1f5;color:#15161c}

/* ═══ FLECHAS DE DIAGRAMA ═══
   Un <path> con stroke pero sin fill toma el valor inicial (negro) y el
   navegador cierra el trazo implícitamente: aparece un triángulo relleno
   entre sus extremos. Forzamos fill:none para dejar solo la línea + la
   punta del <marker>, que sí lleva su color. */
svg path[stroke]:not([fill]){fill:none}
svg polyline:not([fill]){fill:none}
svg line{fill:none}

/* ═══ SVG ═══ */
svg{max-width:100%;height:auto;display:block;margin:.9rem auto}
svg text{font-family:var(--f-body)}

/* ═══ BUSCADOR ═══ */
mark.hit{background:linear-gradient(180deg,transparent 55%,#ffe066 55%);color:inherit;
  border-radius:2px;padding:0 1px;font-weight:600}
html[data-theme="dark"] mark.hit{background:linear-gradient(180deg,transparent 55%,#8a6d00 55%);color:#fff}

/* ═══ UTILIDADES ═══ */
.hide{display:none !important}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.small{font-size:var(--t-sm);color:var(--ink-2)}
.chip{
  display:inline-block;font-size:var(--t-xs);padding:.16rem .55rem;border-radius:var(--r-full);
  background:var(--brand-soft);color:var(--brand);font-weight:800;letter-spacing:.02em;
}

/* ═══ HUECOS RELLENABLES ═══ */
.gap{
  display:inline-block;min-width:5.5em;border-bottom:2px solid var(--brand);
  text-align:center;font-weight:700;color:transparent;cursor:pointer;
  transition:color .3s,background .3s;
}
.gap.on,.gap:hover{color:var(--brand);background:var(--brand-soft);border-radius:4px 4px 0 0}

/* ═══ REVELAR SOLUCIÓN ═══ */
.revelar{
  background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;border-color:transparent;
  font-weight:700;
}
.revelar:hover{box-shadow:var(--sh-3)}
.sol{
  margin-top:.7rem;padding:.8rem 1rem;border-radius:var(--r-md);
  background:var(--ej-bg);border-left:4px solid var(--ej);
  animation:slidein .4s var(--e-out);
}

/* ═══ TEST ═══ */
.opt{
  display:block;padding:.55rem .85rem;margin:.35rem 0;border:1.5px solid var(--line);
  border-radius:var(--r-md);cursor:pointer;background:var(--surface);font-size:.94rem;
  transition:border-color .22s,background .22s,transform .22s var(--e-out);
}
.opt:hover{border-color:var(--brand);background:var(--brand-soft);transform:translateX(4px)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft);font-weight:650}
.opt.ko{border-color:var(--exc);background:var(--exc-bg)}
.opt input{margin-right:.5rem;accent-color:var(--brand)}

#tscore,#semres{
  font-family:var(--f-display);font-weight:800;font-size:1.15rem;letter-spacing:-.02em;
}

/* ═══════════════════════════════════════════════════════════════
   FLASHCARDS 3D · mazo con giro, vuelo de salida y sheen
   ═══════════════════════════════════════════════════════════════ */
#flash{--fc-e:cubic-bezier(.2,.8,.25,1);--fc-h:250px}

/* — Escena — */
.fc-stage{
  perspective:1400px;perspective-origin:50% 45%;
  padding:.4rem 0 .2rem;position:relative;
}
.fc-deck{position:relative;height:var(--fc-h);will-change:transform}

/* — Cartas fantasma del mazo — */
.fc-ghost{
  position:absolute;inset:0;border-radius:var(--r-lg);
  background:var(--surface);border:1px solid var(--line);
  transition:transform .5s var(--fc-e),opacity .5s var(--fc-e);
}
.fc-ghost.g1{transform:translateY(9px) scale(.972);opacity:.75}
.fc-ghost.g2{transform:translateY(18px) scale(.944);opacity:.45}
.fc-deck.empty .fc-ghost{opacity:0;transform:translateY(26px) scale(.9)}

/* — Elevación durante el giro — */
.fc-lift{position:absolute;inset:0;transform-style:preserve-3d}
.fc-lift.lift{animation:fcLift .78s var(--fc-e)}
@keyframes fcLift{
  0%,100%{transform:scale(1) translateY(0)}
  45%{transform:scale(1.055) translateY(-16px)}
}
.fc-lift.out-ok{animation:fcOut .5s cubic-bezier(.5,0,.75,0) forwards}
.fc-lift.out-ko{animation:fcOutKo .5s cubic-bezier(.5,0,.75,0) forwards}
.fc-lift.in{animation:fcIn .48s var(--fc-e)}
@keyframes fcOut{
  0%{transform:translateX(0) rotate(0) scale(1);opacity:1}
  100%{transform:translateX(130%) rotate(17deg) scale(.85);opacity:0}
}
@keyframes fcOutKo{
  0%{transform:translateX(0) rotate(0) scale(1);opacity:1}
  100%{transform:translateX(-130%) rotate(-17deg) scale(.85);opacity:0}
}
@keyframes fcIn{
  0%{transform:translateY(26px) scale(.9);opacity:0}
  100%{transform:translateY(0) scale(1);opacity:1}
}

/* — La carta — */
.fc-card{
  position:absolute;inset:0;transform-style:preserve-3d;
  transition:transform .78s var(--fc-e);
  cursor:pointer;border-radius:var(--r-lg);
}
.fc-card:focus-visible{outline:none}
.fc-card:focus-visible .fc-face{box-shadow:var(--sh-glow),var(--sh-2)}

/* — Caras — */
.fc-face{
  position:absolute;inset:0;border-radius:var(--r-lg);
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  padding:2rem 2.2rem;text-align:center;overflow:hidden;
  box-shadow:var(--sh-2);
  transition:box-shadow .4s var(--fc-e);
}
.fc-card:hover .fc-face{box-shadow:var(--sh-3)}

/* Anverso · pregunta */
.fc-front{
  background:
    radial-gradient(120% 90% at 50% -20%, var(--brand-soft) 0%, transparent 60%),
    var(--surface);
  border:1.5px solid var(--line);color:var(--ink);
}
/* Reverso · respuesta */
.fc-back{
  transform:rotateY(180deg);
  background:linear-gradient(145deg,var(--brand) 0%,#6d4bf7 45%,var(--c5,#0891b2) 130%);
  border:1.5px solid transparent;color:#fff;
}
html[data-theme="dark"] .fc-back{
  background:linear-gradient(145deg,#5f45c9 0%,#4b3aa8 45%,#0e6b85 130%);
}
.fc-back .fc-txt{color:#fff}
.fc-back b,.fc-back strong{color:#fff;font-weight:800}

/* — Sheen que barre al girar — */
.fc-face::after{
  content:"";position:absolute;top:-60%;left:-70%;width:55%;height:220%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.42),transparent);
  transform:rotate(18deg);opacity:0;pointer-events:none;
}
.fc-lift.lift .fc-face::after{animation:fcSheen .78s var(--fc-e)}
@keyframes fcSheen{
  0%{opacity:0;left:-70%}
  35%{opacity:1}
  100%{opacity:0;left:150%}
}

/* — Etiqueta superior — */
.fc-tag{
  position:absolute;top:1rem;left:1.15rem;
  font-size:var(--t-xs);font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  display:inline-flex;align-items:center;gap:.4rem;
}
.fc-front .fc-tag{color:var(--brand)}
.fc-back .fc-tag{color:rgba(255,255,255,.9)}
.fc-tag::before{
  content:"";width:7px;height:7px;border-radius:50%;background:currentColor;
  animation:fcPulse 2.2s ease-in-out infinite;
}
@keyframes fcPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.65)}}

/* — Índice tipo naipe — */
.fc-pip{
  position:absolute;font-family:var(--f-display);font-weight:800;
  font-size:.78rem;letter-spacing:-.02em;opacity:.34;font-variant-numeric:tabular-nums;
}
.fc-pip.tr{top:1rem;right:1.15rem}
.fc-pip.bl{bottom:1rem;left:1.15rem;transform:rotate(180deg)}
.fc-front .fc-pip{color:var(--ink-2)}
.fc-back .fc-pip{color:#fff;opacity:.55}

/* — Texto — */
.fc-txt{
  font-size:clamp(1rem,.9rem + .55vw,1.28rem);font-weight:650;line-height:1.5;
  max-width:44ch;letter-spacing:-.012em;
}
.fc-front .fc-txt{font-family:var(--f-display);font-weight:700}
.fc-back .fc-txt{font-weight:600;line-height:1.6}
.fc-hint{
  position:absolute;bottom:1rem;left:0;right:0;
  font-size:var(--t-xs);font-weight:600;letter-spacing:.02em;
  display:flex;align-items:center;justify-content:center;gap:.4rem;
}
.fc-front .fc-hint{color:var(--ink-3)}
.fc-back .fc-hint{color:rgba(255,255,255,.72)}
.fc-hint .kbd{
  font-family:var(--f-mono);font-size:.68rem;font-weight:700;padding:.1rem .32rem;
  border-radius:5px;border:1px solid currentColor;opacity:.75;
}

/* — Pantalla final — */
.fc-done{
  position:absolute;inset:0;border-radius:var(--r-lg);
  background:linear-gradient(150deg,var(--ok-soft),var(--surface) 70%);
  border:1.5px solid var(--ok);
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  text-align:center;padding:2rem;gap:.35rem;
  animation:fcIn .5s var(--fc-e);box-shadow:var(--sh-2);
}
.fc-done .seal{
  font-size:2.6rem;line-height:1;
  animation:fcSeal .7s cubic-bezier(.2,1.5,.4,1);
}
@keyframes fcSeal{0%{transform:scale(0) rotate(-25deg);opacity:0}60%{transform:scale(1.2) rotate(6deg)}100%{transform:scale(1) rotate(0);opacity:1}}
.fc-done h3{font-size:1.3rem;font-weight:800;margin:.2rem 0 0}
.fc-done p{margin:0;color:var(--ink-2);font-size:var(--t-sm)}

/* — Barra de progreso de la ronda — */
.fc-bar{
  height:6px;border-radius:99px;background:var(--surface-3);
  overflow:hidden;margin:.95rem 0 .8rem;position:relative;
}
.fc-bar i{
  display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--brand),var(--c5,#0891b2));
  transition:width .55s var(--fc-e);
}

/* — Controles — */
.fc-ctrls{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.fc-ctrls button{font-weight:700}
#fcok{border-color:var(--ok);color:var(--ok)}
#fcok:hover{background:var(--ok);color:#fff;border-color:var(--ok)}
#fcko{border-color:var(--warn);color:var(--warn)}
#fcko:hover{background:var(--warn);color:#fff;border-color:var(--warn)}
#fcflip{background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;border-color:transparent}
#fcflip:hover{box-shadow:var(--sh-3)}

.fc-score{display:inline-flex;gap:.45rem;margin-left:auto;align-items:center}
.fc-pill{
  font-size:var(--t-xs);font-weight:800;padding:.24rem .6rem;border-radius:var(--r-full);
  font-variant-numeric:tabular-nums;border:1px solid;
}
.fc-pill.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.fc-pill.ko{color:var(--warn);border-color:var(--warn);background:var(--warn-bg)}
.fc-pill.left{color:var(--ink-2);border-color:var(--line);background:var(--surface-2)}
.fc-pill.bump{animation:fcBump .45s var(--e-spring)}
@keyframes fcBump{0%{transform:scale(1)}45%{transform:scale(1.28)}100%{transform:scale(1)}}

@media(max-width:620px){
  #flash{--fc-h:270px}
  .fc-face{padding:1.7rem 1.3rem}
  .fc-score{margin-left:0;width:100%}
}
@media(prefers-reduced-motion:reduce){
  .fc-card{transition:none}
  .fc-lift.lift,.fc-lift.in,.fc-lift.out-ok,.fc-lift.out-ko,.fc-face::after{animation:none !important}
}
@media print{.fc-stage,.fc-ctrls,.fc-bar{display:none !important}}
/* ═══ RESPUESTA ESTRUCTURADA ═══ */
.fc-face{justify-content:center}
.fc-face.struct{justify-content:flex-start;text-align:left;padding-top:3.1rem;padding-bottom:3.1rem}
.fc-body{
  width:100%;max-width:46ch;margin:0 auto;
  overflow-y:auto;max-height:100%;
  scrollbar-width:thin;
}
.fc-body::-webkit-scrollbar{width:5px}
.fc-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.35);border-radius:99px;border:0}
.fc-front .fc-body::-webkit-scrollbar-thumb{background:var(--line-strong)}

/* — Veredicto Sí / No — */
.fc-verdict{
  display:inline-flex;align-items:center;gap:.35rem;
  font-family:var(--f-display);font-weight:800;font-size:.82rem;
  letter-spacing:.06em;text-transform:uppercase;
  padding:.26rem .72rem;border-radius:var(--r-full);margin-bottom:.85rem;
  border:1.5px solid;animation:fcPopIn .45s var(--e-spring) backwards;animation-delay:.34s;
}
.fc-verdict.si{background:rgba(255,255,255,.16);border-color:rgba(190,255,215,.85);color:#d8ffe9}
.fc-verdict.no{background:rgba(255,255,255,.16);border-color:rgba(255,205,205,.85);color:#ffdedd}
@keyframes fcPopIn{0%{opacity:0;transform:scale(.7) translateY(6px)}100%{opacity:1;transform:none}}

/* — Párrafo — */
.fc-p{margin:0;font-size:clamp(1rem,.92rem + .45vw,1.2rem);font-weight:600;line-height:1.6}
.fc-face.struct .fc-p{font-size:clamp(.96rem,.9rem + .35vw,1.1rem)}

/* — Lista enumerada — */
.fc-list{list-style:none;margin:0;padding:0;display:grid;gap:.5rem;counter-reset:fc}
.fc-list li{
  counter-increment:fc;position:relative;margin:0;
  padding:.42rem .6rem .42rem 2.5rem;border-radius:var(--r-sm);
  background:rgba(255,255,255,.11);
  font-size:clamp(.92rem,.88rem + .3vw,1.04rem);font-weight:600;line-height:1.45;
  animation:fcRow .42s var(--e-out) backwards;
}
.fc-list li::before{
  content:counter(fc);position:absolute;left:.6rem;top:50%;transform:translateY(-50%);
  width:1.6rem;height:1.6rem;border-radius:50%;
  display:grid;place-items:center;
  background:rgba(255,255,255,.9);color:var(--brand);
  font-family:var(--f-display);font-weight:800;font-size:.78rem;
  font-variant-numeric:tabular-nums;
}
.fc-list.alpha li::before{content:counter(fc,lower-alpha)}
.fc-list li:nth-child(1){animation-delay:.36s}
.fc-list li:nth-child(2){animation-delay:.42s}
.fc-list li:nth-child(3){animation-delay:.48s}
.fc-list li:nth-child(4){animation-delay:.54s}
.fc-list li:nth-child(5){animation-delay:.60s}
.fc-list li:nth-child(n+6){animation-delay:.66s}
@keyframes fcRow{0%{opacity:0;transform:translateX(-12px)}100%{opacity:1;transform:none}}

/* — Cláusulas contrapuestas — */
.fc-clauses{display:grid;gap:.45rem}
.fc-clauses p{
  margin:0;padding:.45rem .7rem .45rem .95rem;border-radius:0 var(--r-sm) var(--r-sm) 0;
  background:rgba(255,255,255,.11);border-left:3px solid rgba(255,255,255,.55);
  font-size:clamp(.92rem,.88rem + .3vw,1.04rem);font-weight:600;line-height:1.5;
  animation:fcRow .42s var(--e-out) backwards;
}
.fc-clauses p:nth-child(1){animation-delay:.36s}
.fc-clauses p:nth-child(2){animation-delay:.44s}
.fc-clauses p:nth-child(3){animation-delay:.52s}

/* — Negritas resaltadas en el reverso — */
.fc-back .fc-body b,.fc-back .fc-body strong{
  font-weight:800;background:rgba(255,255,255,.2);
  padding:.03em .3em;border-radius:5px;
  box-decoration-break:clone;-webkit-box-decoration-break:clone;
}

/* — Cita legal al pie — */
.fc-cite{
  position:absolute;bottom:.95rem;left:0;right:0;
  display:inline-flex;align-items:center;justify-content:center;gap:.4rem;
  font-family:var(--f-mono);font-size:.74rem;font-weight:700;letter-spacing:.02em;
  color:rgba(255,255,255,.82);
  animation:fcPopIn .5s var(--e-out) backwards;animation-delay:.5s;
}
.fc-cite::before,.fc-cite::after{
  content:"";height:1px;width:clamp(18px,10%,52px);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.45));
}
.fc-cite::after{background:linear-gradient(90deg,rgba(255,255,255,.45),transparent)}
.fc-cite .s{font-size:.9rem;opacity:.75;font-family:var(--f-legal)}
.fc-front .fc-cite{color:var(--ink-3)}
.fc-front .fc-cite::before{background:linear-gradient(90deg,transparent,var(--line-strong))}
.fc-front .fc-cite::after{background:linear-gradient(90deg,var(--line-strong),transparent)}

/* la pista se oculta si hay cita, para no amontonar */
.fc-back .fc-cite ~ .fc-hint,.fc-back .fc-hint.muted{display:none}

@media(max-width:620px){
  #flash{--fc-h:320px}
  .fc-face.struct{padding-top:2.9rem;padding-bottom:2.8rem}
  .fc-list li{padding-left:2.3rem}
}
@media(prefers-reduced-motion:reduce){
  .fc-verdict,.fc-list li,.fc-clauses p,.fc-cite{animation:none !important}
}

/* ═══ SEMÁFORO ═══ */
.sembtn{
  border-radius:var(--r-full);padding:.32rem .7rem;font-weight:700;font-size:var(--t-sm);
}
.sembtn[data-v="g"]:hover,.sembtn.on[data-v="g"]{background:var(--ok);color:#fff;border-color:var(--ok)}
.sembtn[data-v="y"]:hover,.sembtn.on[data-v="y"]{background:var(--mid);color:#3d2f00;border-color:var(--mid)}
.sembtn[data-v="r"]:hover,.sembtn.on[data-v="r"]{background:var(--exc);color:#fff;border-color:var(--exc)}

/* ═══ CTA DE BLOQUE ═══ */
a.blk{
  display:inline-flex;align-items:center;gap:.5rem;
  background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;
  padding:.5rem .95rem;border-radius:var(--r-sm);font-weight:700;font-size:var(--t-sm);
  text-decoration:none;box-shadow:0 2px 10px var(--brand-ring);
  transition:transform .22s var(--e-spring),box-shadow .25s,gap .25s var(--e-out);
}
a.blk:hover{transform:translateY(-2px);box-shadow:var(--sh-3);gap:.75rem;text-decoration:none}
a.blk::after{content:"→"}
a.blk:active{transform:translateY(0) scale(.98)}

/* ═══ REVEAL ═══ */
.rv{opacity:0;transform:translateY(20px);transition:opacity .6s var(--e-out),transform .6s var(--e-out)}
.rv.in{opacity:1;transform:none}

/* ═══ RESPONSIVE ═══ */
@media(max-width:960px){
  .layout{grid-template-columns:1fr;padding-top:.9rem;gap:1rem}
  nav.side{position:static;max-height:none}
  nav.side.collapsed .navbody{display:none}
  .navtoggle{display:block;width:100%;text-align:left;font-weight:700}
  .grid2{grid-template-columns:1fr}
  .top h1 .sub{white-space:normal}
}
@media(max-width:620px){
  .top-in{padding:.55rem .8rem}
  .tools{width:100%;margin-left:0}
  input[type=search]{flex:1;min-width:0}
  section.card{padding:1.05rem 1rem;border-radius:var(--r-md)}
  table{font-size:.82rem}
  th,td{padding:.4rem .5rem}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
  .rv{opacity:1;transform:none}
}
@media print{
  header.top,nav.side,.tools,.noprint,.progress{display:none !important}
  body{background:#fff;background-image:none;font-size:11pt;color:#000}
  .layout{display:block;max-width:none;padding:0}
  section.card{border:0;padding:0;margin:0 0 1rem;break-inside:avoid;box-shadow:none}
  details.panel{border:0;box-shadow:none}
  details.panel .body{display:block !important}
  details.panel>summary{padding-left:0}
  .art{break-inside:avoid}
  .rv{opacity:1;transform:none}
  a{color:#000;text-decoration:none}
}


/* ═══ ALTURA ADAPTATIVA DE LA TARJETA ═══ */
.fc-deck{transition:height .45s var(--fc-e)}
.fc-body{max-height:none;overflow:visible}
.fc-measure{
  position:absolute;left:0;right:0;top:0;height:auto;
  visibility:hidden;pointer-events:none;z-index:-1;
}
.fc-measure .fc-face{
  position:relative;inset:auto;height:auto;min-height:0;
  box-shadow:none;backface-visibility:visible;transform:none;
}
.fc-measure .fc-body{max-height:none;overflow:visible}
.fc-measure .fc-face::after{display:none}

/* ═══ MOSTRAR / OCULTAR ÍNDICE LATERAL ═══ */
.layout{transition:grid-template-columns .42s var(--e-out)}
.layout.nonav{grid-template-columns:0 1fr;gap:0}
.layout.nonav>nav.side{
  opacity:0;transform:translateX(-14px);pointer-events:none;
  padding:0;border-width:0;overflow:hidden;width:0;min-width:0;
}
nav.side{
  transition:opacity .3s var(--e-out),transform .38s var(--e-out);
  overflow-x:hidden;
}
#navhide .ic{display:inline-block;transition:transform .35s var(--e-spring);font-size:.95em;line-height:1}
#navhide[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
#navhide[aria-pressed="true"] .ic{transform:rotate(90deg)}
@media(max-width:960px){#navhide{display:none}}

/* ═══════════════════════════════════════════════════════════════
   LECTURA EN VOZ ALTA (TTS) del texto legal
   ═══════════════════════════════════════════════════════════════ */
.tts-bar{
  display:flex;align-items:center;gap:.45rem;flex-wrap:wrap;
  margin:.15rem 0 .7rem;
}
.tts-bar button{
  font-size:var(--t-xs);font-weight:700;padding:.3rem .62rem;
  border-radius:var(--r-full);border:1px solid var(--legal);
  background:transparent;color:var(--legal);
  display:inline-flex;align-items:center;gap:.35rem;line-height:1.2;
}
.tts-bar button:hover{background:var(--legal);color:var(--surface);border-color:var(--legal)}
.tts-bar button[hidden]{display:none}
.tts-bar .tts-play.on{background:var(--legal);color:var(--surface)}

/* Ondas de audio mientras lee */
.tts-wave{display:inline-flex;align-items:flex-end;gap:2px;height:11px}
.tts-wave i{
  width:2.5px;background:currentColor;border-radius:2px;height:35%;
  animation:ttsW .9s ease-in-out infinite;
}
.tts-wave i:nth-child(2){animation-delay:.15s}
.tts-wave i:nth-child(3){animation-delay:.3s}
.tts-wave i:nth-child(4){animation-delay:.45s}
@keyframes ttsW{0%,100%{height:32%}50%{height:100%}}

.tts-time{
  font-family:var(--f-mono);font-size:.7rem;font-weight:700;
  color:var(--ink-3);font-variant-numeric:tabular-nums;
}

/* Frase que se está leyendo */
.tts-s{transition:background .25s,color .25s;border-radius:3px}
.tts-s.now{
  background:linear-gradient(180deg,transparent 8%,color-mix(in srgb,var(--legal) 26%,transparent) 8%);
  box-shadow:0 0 0 2px color-mix(in srgb,var(--legal) 16%,transparent);
}
html[data-theme="dark"] .tts-s.now{
  background:linear-gradient(180deg,transparent 8%,color-mix(in srgb,var(--legal) 34%,transparent) 8%);
}
.legal.tts-on{box-shadow:0 0 0 3px color-mix(in srgb,var(--legal) 20%,transparent)}

/* ═══ Reproductor flotante ═══ */
.tts-mini{
  position:fixed;left:50%;bottom:1.1rem;transform:translateX(-50%) translateY(140%);
  z-index:80;display:flex;align-items:center;gap:.6rem;
  background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  border:1px solid var(--line);border-radius:var(--r-full);
  padding:.5rem .7rem .5rem .95rem;box-shadow:var(--sh-3);
  transition:transform .45s var(--e-spring),opacity .3s;opacity:0;pointer-events:none;
  max-width:min(94vw,540px);
}
.tts-mini.show{transform:translateX(-50%) translateY(0);opacity:1;pointer-events:auto}
.tts-mini .lbl{
  font-size:var(--t-xs);font-weight:800;color:var(--legal);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:16ch;
}
.tts-mini button{
  border-radius:50%;width:32px;height:32px;padding:0;display:grid;place-items:center;
  font-size:.8rem;border:1px solid var(--line);flex:none;
}
.tts-mini button.main{
  width:38px;height:38px;font-size:.95rem;
  background:linear-gradient(140deg,var(--legal),var(--brand));color:#fff;border-color:transparent;
}
.tts-mini .bar{
  flex:1;min-width:70px;height:5px;border-radius:99px;background:var(--surface-3);overflow:hidden;
}
.tts-mini .bar i{display:block;height:100%;width:0;background:var(--legal);
  border-radius:99px;transition:width .35s var(--e-out)}

/* ═══ Panel de ajustes de voz ═══ */
.tts-back{
  position:fixed;inset:0;z-index:90;background:rgba(10,10,18,.45);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  display:grid;place-items:center;padding:1rem;
  opacity:0;pointer-events:none;transition:opacity .3s var(--e-out);
}
.tts-back.show{opacity:1;pointer-events:auto}
.tts-panel{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--sh-3);width:min(94vw,470px);max-height:88vh;overflow:auto;
  padding:1.3rem 1.4rem;transform:translateY(16px) scale(.97);
  transition:transform .38s var(--e-spring);
}
.tts-back.show .tts-panel{transform:none}
.tts-panel h3{
  font-size:1.12rem;font-weight:800;margin:0 0 .25rem;
  display:flex;align-items:center;gap:.5rem;
}
.tts-panel .sub{font-size:var(--t-sm);color:var(--ink-2);margin:0 0 1.1rem}
.tts-row{margin-bottom:1.05rem}
.tts-row > label{
  display:block;font-size:var(--t-xs);font-weight:800;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-2);margin-bottom:.4rem;
}
.tts-seg{display:flex;gap:3px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:3px}
.tts-seg button{
  flex:1;border:0;background:transparent;border-radius:calc(var(--r-sm) - 3px);
  padding:.42rem .3rem;font-size:var(--t-sm);font-weight:700;box-shadow:none;
}
.tts-seg button:hover{transform:none;background:var(--surface)}
.tts-seg button[aria-pressed="true"]{
  background:linear-gradient(140deg,var(--legal),var(--brand));color:#fff;
}
.tts-panel select{
  width:100%;padding:.5rem .6rem;border-radius:var(--r-sm);
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  font-size:var(--t-sm);font-weight:600;cursor:pointer;
}
.tts-panel select:focus{border-color:var(--brand);outline:none}
.tts-slider{display:flex;align-items:center;gap:.75rem}
.tts-slider input[type=range]{flex:1;accent-color:var(--legal);cursor:pointer;height:22px}
.tts-val{
  font-family:var(--f-mono);font-weight:800;font-size:var(--t-sm);
  min-width:3.4em;text-align:right;color:var(--legal);font-variant-numeric:tabular-nums;
}
.tts-note{
  font-size:var(--t-xs);color:var(--ink-2);line-height:1.5;
  background:var(--surface-2);border-radius:var(--r-sm);padding:.6rem .75rem;margin:0 0 1rem;
}
.tts-note b{color:var(--ink)}
.tts-acts{display:flex;gap:.5rem;justify-content:flex-end;flex-wrap:wrap}
.tts-acts .prim{
  background:linear-gradient(140deg,var(--legal),var(--brand));color:#fff;border-color:transparent;
}
.tts-badge{
  font-size:.62rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
  padding:.1rem .35rem;border-radius:4px;background:var(--ej-bg);color:var(--ej);margin-left:.35rem;
}


/* — Variante compacta para los apartados desplegables — */
.tts-bar.mini{margin:0 0 .6rem}
.tts-bar.mini button{
  font-size:.7rem;padding:.24rem .55rem;
  border-color:var(--brand);color:var(--brand);
}
.tts-bar.mini button:hover{background:var(--brand);color:var(--surface)}
.tts-bar.mini .tts-play.on{background:var(--brand);color:var(--surface)}
.tts-bar.mini .tts-time{font-size:.66rem}
.idea .tts-bar.mini{margin:.55rem 0 0}
.legal.tts-on,.body.tts-on,.idea.tts-on{
  box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 20%,transparent)
}
.legal.tts-on{box-shadow:0 0 0 3px color-mix(in srgb,var(--legal) 20%,transparent)}


/* aviso de cambio de voz */
.tts-aviso{
  position:fixed;left:50%;bottom:5.2rem;transform:translateX(-50%) translateY(20px);
  z-index:95;max-width:min(92vw,460px);
  background:var(--warn-bg);border:1px solid var(--warn);color:var(--warn);
  border-radius:var(--r-md);padding:.6rem .9rem;font-size:var(--t-sm);font-weight:700;
  box-shadow:var(--sh-2);opacity:0;pointer-events:none;
  transition:opacity .3s var(--e-out),transform .35s var(--e-spring);
}
.tts-aviso.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:620px){
  .tts-mini{left:.6rem;right:.6rem;transform:translateY(140%);max-width:none}
  .tts-mini.show{transform:translateY(0)}
  .tts-mini .lbl{display:none}
}
@media(prefers-reduced-motion:reduce){
  .tts-wave i{animation:none;height:60%}
}
@media print{.tts-bar,.tts-mini,.tts-back{display:none !important}}

<script>
const GLOSARIO={"recurso": "Recurso especial en materia de contratación: recurso potestativo y gratuito, previo al contencioso, ante un tribunal administrativo independiente, contra los actos del art. 44. Ej.: contra el pliego de un servicio de 178.000 € de valor estimado.", "tribunal": "Tribunal administrativo de recursos contractuales: órgano especializado e independiente que resuelve el recurso especial. En el Estado es el Central; en las comunidades autónomas, el que cada una cree o el Central por convenio.", "cautelar": "Medida cautelar: decisión provisional que suspende el procedimiento o la ejecución de un acto para conservar el objeto del recurso. Ej.: suspender una licitación mientras se resuelve el recurso contra el pliego.", "suspauto": "Suspensión automática: la que se produce por ministerio de la ley, sin necesidad de pedirla, cuando se recurre el acuerdo de adjudicación (art. 53). Solo se levanta por resolución expresa.", "tramite": "Acto de trámite cualificado: el acto intermedio del procedimiento que decide directa o indirectamente sobre la adjudicación, impide continuar o produce indefensión o perjuicio irreparable. Ej.: la exclusión de un licitador.", "legitim": "Legitimación: aptitud para recurrir por tener un derecho o interés legítimo afectado. Ej.: la empresa que no pudo presentarse por una cláusula excluyente del pliego.", "inadmis": "Inadmisión: rechazo del recurso sin entrar en el fondo, por una de las cuatro causas del art. 55. Ej.: recurso presentado dos días después de vencer el plazo.", "retroacc": "Retroacción de actuaciones: volver el procedimiento al momento anterior al vicio, conservando lo válido. Ej.: retrotraer al momento de aprobación del pliego para eliminar una cláusula discriminatoria.", "ejecutiva": "Resolución directamente ejecutiva: la que se cumple sin necesidad de un acto posterior de la Administración destinataria. Ej.: la que anula la adjudicación obliga al ayuntamiento a retrotraer sin más trámite.", "emplazam": "Emplazamiento: llamada formal a comparecer ante un órgano judicial. Ej.: el tribunal administrativo emplaza al ayuntamiento y a los licitadores comparecidos cuando el asunto llega al contencioso.", "ve": "Valor estimado: importe total del contrato sin IVA, incluidas prórrogas, opciones y modificaciones previstas. Es la cifra que decide si cabe recurso especial (art. 44.1).", "sara": "Contrato sujeto a regulación armonizada: el que supera el umbral europeo. No coincide con el umbral del recurso especial, que en servicios arranca en 100.000 € de valor estimado.", "confid": "Confidencialidad: deber de no divulgar la información que los licitadores designen como técnica o comercialmente sensible. El tribunal sí puede conocerla para resolver (art. 56.5)."};
const ARTS=[{"n": 44, "t": "Recurso especial en materia de contratación: actos recurribles", "ubic": "Libro I ▸ Título I ▸ Capítulo V · Del recurso especial en materia de contratación", "idea": "Un recurso rápido, gratuito y potestativo contra los actos clave de los contratos grandes.", "literal": "<p><b>1.</b> Serán susceptibles de recurso especial en materia de contratación, los actos y decisiones relacionados en el apartado 2 de este mismo artículo, cuando se refieran a los siguientes contratos que pretendan concertar las Administraciones Públicas o las restantes entidades que ostenten la condición de poderes adjudicadores:</p><p style=\"margin-left:1.1rem\">a) Contratos de obras cuyo valor estimado sea superior a tres millones de euros, y de suministro y servicios, que tenga un valor estimado superior a cien mil euros.</p><p style=\"margin-left:1.1rem\">b) Acuerdos marco y sistemas dinámicos de adquisición que tengan por objeto la celebración de alguno de los contratos tipificados en la letra anterior, así como los contratos basados en cualquiera de ellos.</p><p style=\"margin-left:1.1rem\">c) Concesiones de obras o de servicios cuyo valor estimado supere los tres millones de euros. Serán igualmente recurribles los contratos administrativos especiales, cuando, por sus características no sea posible fijar su precio de licitación o, en otro caso, cuando su valor estimado sea superior a lo establecido para los contratos de servicios. Asimismo serán susceptibles de recurso especial en materia de contratación los contratos subvencionados a que se refiere el artículo 23, y los encargos cuando, por sus características no sea posible fijar su importe o, en otro caso, cuando este, atendida su duración total más las prórrogas, sea igual o superior a lo establecido para los contratos de servicios.</p><p><b>2.</b> Podrán ser objeto del recurso las siguientes actuaciones:</p><p style=\"margin-left:1.1rem\">a) Los anuncios de licitación, los pliegos y los documentos contractuales que establezcan las condiciones que deban regir la contratación.</p><p style=\"margin-left:1.1rem\">b) Los actos de trámite adoptados en el procedimiento de adjudicación, siempre que estos decidan directa o indirectamente sobre la adjudicación, determinen la imposibilidad de continuar el procedimiento o produzcan indefensión o perjuicio irreparable a derechos o intereses legítimos. En todo caso se considerará que concurren las circunstancias anteriores en los actos de la mesa o del órgano de contratación por los que se acuerde la admisión o inadmisión de candidatos o licitadores, o la admisión o exclusión de ofertas, incluidas las ofertas que sean excluidas por resultar anormalmente bajas como consecuencia de la aplicación del artículo 149.</p><p style=\"margin-left:1.1rem\">c) Los acuerdos de adjudicación.</p><p style=\"margin-left:1.1rem\">d) Las modificaciones basadas en el incumplimiento de lo establecido en los artículos 204 y 205 de la presente Ley, por entender que la modificación debió ser objeto de una nueva adjudicación.</p><p style=\"margin-left:1.1rem\">e) La formalización de encargos a medios propios en los casos en que estos no cumplan los requisitos legales.</p><p style=\"margin-left:1.1rem\">f) Los acuerdos de rescate de concesiones.</p><p><b>3.</b> Los defectos de tramitación que afecten a actos distintos de los contemplados en el apartado 2 podrán ser puestos de manifiesto por los interesados al órgano al que corresponda la instrucción del expediente o al órgano de contratación, a efectos de su corrección con arreglo a derecho, y sin perjuicio de que las irregularidades que les afecten puedan ser alegadas por los interesados al recurrir el acto de adjudicación.</p><p><b>4.</b> No se dará este recurso en relación con los procedimientos de adjudicación que se sigan por el trámite de emergencia.</p><p><b>5.</b> Contra las actuaciones mencionadas en el presente artículo como susceptibles de ser impugnadas mediante el recurso especial, no procederá la interposición de recursos administrativos ordinarios.</p><p><b>6.</b> Los actos que se dicten en los procedimientos de adjudicación de contratos de las Administraciones Públicas que no reúnan los requisitos del apartado 1 podrán ser objeto de recurso de conformidad con lo dispuesto en la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas; así como en la Ley 29/1998, de 13 de julio, Reguladora de la Jurisdicción Contencioso-administrativa. En el caso de actuaciones realizadas por poderes adjudicadores que no tengan la condición de Administraciones Públicas, aquellas se impugnarán en vía administrativa de conformidad con lo dispuesto en la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas ante el titular del departamento, órgano, ente u organismo al que esté adscrita la entidad contratante o al que corresponda su tutela. Si la entidad contratante estuviera vinculada a más de una Administración, será competente el órgano correspondiente de la que ostente el control o participación mayoritaria.</p><p><b>7.</b> La interposición del recurso especial en materia de contratación tendrá carácter potestativo y será gratuito para los recurrentes.</p>", "dis": "<ul>\n<li><b>Ámbito del <span class=\"t\" data-k=\"recurso\">recurso especial</span> por contratos (44.1):</b>\n <ul><li><b>a)</b> <b>obras</b> de <span class=\"t\" data-k=\"ve\">valor estimado</span> <b>superior a 3.000.000 €</b>; <b>suministros y servicios</b> de valor estimado <b>superior a 100.000 €</b>;</li>\n <li><b>b)</b> <b>acuerdos marco</b> y <b>sistemas dinámicos</b> que tengan por objeto contratos de la letra anterior, y los contratos <b>basados</b> en ellos;</li>\n <li><b>c)</b> <b>concesiones</b> de obras o de servicios de valor estimado superior a <b>3.000.000 €</b>.</li>\n <li>También los <b>contratos administrativos especiales</b> cuando no quepa fijar su precio o superen el umbral de los servicios; los <b>contratos subvencionados</b> del art. 23; y los <b>encargos</b> a medios propios según su importe, atendida la duración total más las prórrogas.</li></ul></li>\n<li><b>Actos recurribles (44.2):</b>\n <ul><li><b>a)</b> los <b>anuncios de licitación</b>, los <b>pliegos</b> y los documentos contractuales que establezcan las condiciones de la contratación;</li>\n <li><b>b)</b> los <span class=\"t\" data-k=\"tramite\">actos de trámite cualificados</span>: los que decidan directa o indirectamente sobre la adjudicación, determinen la imposibilidad de continuar el procedimiento o produzcan <b>indefensión o perjuicio irreparable</b>. «En todo caso» lo son los acuerdos de <b>admisión o inadmisión de candidatos o licitadores</b> y de <b>admisión o exclusión de ofertas</b>, incluidas las excluidas por anormalmente bajas;</li>\n <li><b>c)</b> los <b>acuerdos de adjudicación</b>;</li>\n <li><b>d)</b> las <b>modificaciones</b> basadas en el incumplimiento de los arts. 204 y 205, por entender que debieron ser objeto de nueva adjudicación;</li>\n <li><b>e)</b> la <b>formalización de encargos a medios propios</b> que no cumplan los requisitos legales;</li>\n <li><b>f)</b> los acuerdos de <b>rescate de concesiones</b>.</li></ul></li>\n<li><b>Defectos no recurribles (44.3):</b> los que afecten a otros actos pueden ponerse de manifiesto ante el instructor o el órgano de contratación, sin perjuicio de alegarlos al recurrir la adjudicación.</li>\n<li><b>Exclusión (44.4):</b> <b>no se da</b> este recurso en los procedimientos que se sigan por el trámite de <b>emergencia</b>.</li>\n<li><b>Régimen (44.6 y 44.7):</b> es <b>potestativo</b> —cabe ir directamente al contencioso— y <b>gratuito</b>; contra los mismos actos no procede recurso administrativo ordinario.</li>\n</ul>", "llano": "<p>Es un recurso especial, con su propio tribunal, para los contratos importantes. Se puede usar contra los pliegos, contra las decisiones que dejan fuera a un licitador y contra la adjudicación. No cuesta dinero y no es obligatorio: quien quiera, puede ir directamente al juzgado.</p>\n<p>Lo que lo hace potente es <b>cuándo</b> actúa: antes de que el contrato exista.</p>", "porque": "<p>Porque la vía ordinaria —recurso de alzada o reposición y después contencioso— tardaba años, y para entonces el contrato ya estaba ejecutado. Las directivas europeas de recursos obligaron a crear un remedio <b>rápido, especializado e independiente</b> que actuara <b>antes</b> de la formalización.</p>\n<p>De ahí las tres piezas que encajan: el plazo de espera del art. 153.3, la perfección con la formalización del art. 36.1 y este recurso. Los tres existen para lo mismo: que se pueda parar un contrato ilegal <b>antes</b> de que nazca.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> reclamar las bases de un concurso antes de que se celebre, en vez de impugnar el resultado cuando ya se han repartido los premios.</li>\n<li><b>Real:</b> una diputación licita un servicio con valor estimado de 178.000 €. Supera los 100.000 € del art. 44.1.a): <b>cabe recurso especial</b>. Una empresa recurre el PCAP por exigir una clasificación improcedente, dentro de los quince días hábiles siguientes a la publicación del anuncio.</li>\n<li><b>Caso límite:</b> el mismo servicio, pero por 95.000 € de valor estimado. <b>No</b> cabe recurso especial: habrá que acudir al recurso administrativo ordinario y, en su caso, al contencioso.</li>\n</ul>", "noej": "<ul>\n<li><b>No cabe</b> el recurso especial en los procedimientos tramitados por <b>emergencia</b> (44.4).</li>\n<li><b>No es recurrible</b> cualquier acto de trámite: solo los <b>cualificados</b> del 44.2.b).</li>\n<li><b>No cabe</b> además el recurso administrativo ordinario contra los mismos actos (44.6).</li>\n<li><b>No es obligatorio</b>: es potestativo, y puede acudirse directamente al contencioso.</li>\n<li><b>No coincide</b> el umbral del recurso especial con el de la <span class=\"t\" data-k=\"sara\">regulación armonizada</span>: en servicios el recurso arranca en <b>100.000 €</b>, muy por debajo del umbral SARA.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 50:</b> plazo de quince días hábiles y su cómputo.</li>\n<li><b>Art. 153.3:</b> el plazo de espera de quince días hábiles antes de formalizar.</li>\n<li><b>Art. 36.1:</b> el contrato se perfecciona con la formalización, no antes.</li>\n<li><b>Art. 150.4:</b> si el recurso obliga a adjudicar a otro licitador, diez días hábiles.</li>\n<li><b>Art. 122.1:</b> los pliegos, acto típicamente recurrible.</li>\n<li><b>Art. 149:</b> la exclusión por oferta anormalmente baja es, en todo caso, acto recurrible.</li>\n</ul>", "trampas": "<ul>\n<li><b>3.000.000 €</b> en obras y concesiones; <b>100.000 €</b> en suministros y servicios. Se confunden con los umbrales SARA, que son otros.</li>\n<li>Es <b>valor estimado</b>, no presupuesto base ni precio de adjudicación.</li>\n<li><b>Potestativo y gratuito</b>: las dos notas que más se preguntan.</li>\n<li>Los actos de trámite han de ser <b>cualificados</b>; pero la admisión, inadmisión y exclusión lo son «<b>en todo caso</b>».</li>\n</ul>", "ancla": "<p>Los tres umbrales: <b>3 · 3 · 0,1</b> millones. Obras tres, concesiones tres, suministros y servicios cien mil.</p>\n<p>Y las dos palabras que definen el recurso: <b>potestativo y gratuito</b>.</p>", "vis": "<svg viewBox=\"0 0 960 385\" role=\"img\" aria-label=\"Ámbito del recurso especial en materia de contratación: contratos y actos recurribles\" style=\"width:100%;height:auto\"><defs><marker id=\"fl1\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr1\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe1\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw1\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"250\" y=\"8\" width=\"460\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"27.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">¿CABE RECURSO ESPECIAL? · ART. 44</text><rect x=\"20\" y=\"52\" width=\"219.5\" height=\"265\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"129.75\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--acc)\">CONTRATOS · art. 44.1</text><text x=\"129.75\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">OBRAS: valor estimado</text><text x=\"129.75\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">superior a 3.000.000 €</text><text x=\"129.75\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"129.75\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">SUMINISTROS y SERVICIOS:</text><text x=\"129.75\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">valor estimado superior</text><text x=\"129.75\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">a 100.000 €</text><text x=\"129.75\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"129.75\" y=\"180\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">CONCESIONES de obras o</text><text x=\"129.75\" y=\"193\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">de servicios: superior</text><text x=\"129.75\" y=\"206\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">a 3.000.000 €</text><text x=\"129.75\" y=\"219\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"129.75\" y=\"232\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Acuerdos marco, sistemas</text><text x=\"129.75\" y=\"245\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">dinámicos y contratos</text><text x=\"129.75\" y=\"258\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">basados en ellos</text><rect x=\"253.5\" y=\"52\" width=\"219.5\" height=\"265\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"363.25\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--acc)\">Y ADEMÁS</text><text x=\"363.25\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Contratos administrativos</text><text x=\"363.25\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">ESPECIALES cuando no</text><text x=\"363.25\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">quepa fijar su precio o</text><text x=\"363.25\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">superen el umbral de</text><text x=\"363.25\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">servicios</text><text x=\"363.25\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"363.25\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Contratos SUBVENCIONADOS</text><text x=\"363.25\" y=\"180\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">del art. 23</text><text x=\"363.25\" y=\"193\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"363.25\" y=\"206\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">ENCARGOS a medios propios</text><text x=\"363.25\" y=\"219\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">según su importe con</text><text x=\"363.25\" y=\"232\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">prórrogas</text><rect x=\"487\" y=\"52\" width=\"219.5\" height=\"265\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"596.75\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--ej)\">ACTOS · art. 44.2</text><text x=\"596.75\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">a) anuncios de licitación,</text><text x=\"596.75\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">PLIEGOS y documentos</text><text x=\"596.75\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">contractuales</text><text x=\"596.75\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"596.75\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">b) actos de TRÁMITE</text><text x=\"596.75\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">cualificados</text><text x=\"596.75\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"596.75\" y=\"180\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">c) acuerdos de</text><text x=\"596.75\" y=\"193\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">ADJUDICACIÓN</text><text x=\"596.75\" y=\"206\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"596.75\" y=\"219\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">d) modificaciones basadas</text><text x=\"596.75\" y=\"232\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">en incumplir el art. 204</text><text x=\"596.75\" y=\"245\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"596.75\" y=\"258\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">e) formalización de</text><text x=\"596.75\" y=\"271\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">encargos a medios propios</text><rect x=\"720.5\" y=\"52\" width=\"219.5\" height=\"265\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"830.25\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--warn)\">CARACTERÍSTICAS</text><text x=\"830.25\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">POTESTATIVO: se puede ir</text><text x=\"830.25\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">directamente al</text><text x=\"830.25\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">contencioso</text><text x=\"830.25\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"830.25\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">GRATUITO</text><text x=\"830.25\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"830.25\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Previo al contencioso</text><text x=\"830.25\" y=\"180\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">si se interpone</text><text x=\"830.25\" y=\"193\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"830.25\" y=\"206\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Sin recurso administrativo</text><text x=\"830.25\" y=\"219\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">ordinario contra los</text><text x=\"830.25\" y=\"232\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">mismos actos</text><rect x=\"20\" y=\"327\" width=\"920\" height=\"48\" rx=\"8\" fill=\"var(--panel)\" stroke=\"var(--line)\"/><text x=\"480\" y=\"347.828\" text-anchor=\"middle\" font-size=\"10.4\" fill=\"currentColor\">Trámite cualificado (44.2.b): el que decide directa o indirectamente sobre la adjudicación, impide continuar o produce indefensión o perjuicio irreparable.</text><text x=\"480\" y=\"360.828\" text-anchor=\"middle\" font-size=\"10.4\" fill=\"currentColor\">En todo caso lo son los acuerdos de admisión o inadmisión de candidatos y de admisión o exclusión de licitadores.</text></svg>"}, {"n": 45, "t": "Órgano competente para la resolución del recurso en la Administración General del Estado", "ubic": "Libro I ▸ Título I ▸ Capítulo V · Del recurso especial en materia de contratación", "idea": "El Tribunal Administrativo Central de Recursos Contractuales: especializado e independiente.", "literal": "<p><b>1.</b> En el ámbito de los poderes adjudicadores del sector público estatal, el conocimiento y resolución de los recursos a que se refiere el artículo anterior estará encomendado al Tribunal Administrativo Central de Recursos Contractuales, órgano especializado que actuará con plena independencia funcional en el ejercicio de sus competencias. Dicho órgano estará adscrito al Ministerio de Hacienda y Función Pública, y estará compuesto por un Presidente y un mínimo de cinco vocales. Cuando el volumen de asuntos sometidos a su conocimiento lo requiera, el número de vocales se incrementará mediante Real Decreto. El Tribunal estará dividido en un mínimo de dos Secciones, que estarán presididas por el propio Presidente del Tribunal, quien podrá delegar el ejercicio de la función en uno de los vocales que integren la Sección, y formadas por uno o más vocales y el Secretario General. El Presidente fijará mediante acuerdo el reparto de atribuciones entre las Secciones y el Pleno, así como la distribución de asuntos entre las Secciones.</p><p><b>2.</b> Podrán ser designados vocales de este Tribunal los funcionarios de carrera de cuerpos y escalas a los que se acceda con título de licenciado o de grado y que hayan desempeñado su actividad profesional por tiempo superior a diez años, preferentemente en el ámbito del derecho administrativo relacionado directamente con la contratación pública.</p><p><b>3.</b> El Presidente del Tribunal deberá ser funcionario de carrera, de cuerpo o escala para cuyo acceso sea requisito necesario el título de licenciado o grado en derecho y haber desempeñado su actividad profesional por tiempo superior a quince años, preferentemente en el ámbito del derecho administrativo relacionado directamente con la contratación pública. En el caso de que los Vocales o el Presidente fueran designados entre funcionarios de carrera incluidos en el ámbito de aplicación del Real Decreto Legislativo 5/2015, de 30 de octubre, por el que se aprueba el texto refundido de la Ley del Estatuto Básico del Empleado Público, estos deberán pertenecer a cuerpos o escalas clasificados en el Subgrupo A1 del artículo 76 de dicha Ley.</p><p><b>4.</b> La designación del Presidente y los Vocales de este Tribunal se realizará por el Gobierno a propuesta conjunta del Ministro de Hacienda y Función Pública y del Ministro de Justicia. Los designados tendrán carácter independiente e inamovible, y no podrán ser removidos de sus puestos sino por las causas siguientes:</p><p style=\"margin-left:1.1rem\">a) Por expiración de su mandato.</p><p style=\"margin-left:1.1rem\">b) Por renuncia aceptada por el Gobierno.</p><p style=\"margin-left:1.1rem\">c) Por pérdida de la nacionalidad española.</p><p style=\"margin-left:1.1rem\">d) Por incumplimiento grave de sus obligaciones.</p><p style=\"margin-left:1.1rem\">e) Por condena mediante sentencia firme a pena privativa de libertad o de inhabilitación absoluta o especial para empleo o cargo público por razón de delito.</p><p style=\"margin-left:1.1rem\">f) Por incapacidad sobrevenida para el ejercicio de su función. La remoción por las causas previstas en las letras c), d), e) y f) anteriores se acordará por el Gobierno previo expediente.</p><p><b>5.</b> La duración del nombramiento efectuado de conformidad con este apartado será de seis años y no podrá prorrogarse. Durante el tiempo en que se hallen prestando servicio en el Tribunal, tanto el Presidente como los Vocales pasarán a la situación de Servicios Especiales dentro de su cuerpo de origen.</p><p><b>6.</b> En cualquier caso, cesado un miembro del Tribunal, este continuará en el ejercicio de sus funciones hasta que tome posesión de su cargo el que lo haya de sustituir.</p><p><b>7.</b> Formará parte del Tribunal, con voz pero sin voto, el Secretario General del mismo. El Tribunal contará con los servicios administrativos precisos para su funcionamiento. El nombramiento del Secretario General y el del personal integrante de los servicios administrativos se harán en los términos previstos en la legislación reguladora de la Función Pública.</p><p><b>8.</b> Serán de aplicación al régimen de constitución y funcionamiento del Tribunal las disposiciones relativas a órganos colegiados contenidas en la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público.</p>", "dis": "<ul>\n<li><b>Creación (45.1):</b> se crea el <span class=\"t\" data-k=\"tribunal\">Tribunal Administrativo Central de Recursos Contractuales</span>, órgano especializado que actúa con <b>plena independencia funcional</b> en el ejercicio de sus competencias.</li>\n<li><b>Composición:</b> presidente y vocales, nombrados por el ministerio competente entre funcionarios de carrera de cuerpos para cuyo acceso se exija titulación de <b>licenciado o grado en Derecho</b> y con más de <b>quince años de experiencia profesional</b> en el ámbito del derecho administrativo relacionado con la contratación pública.</li>\n<li><b>Inamovilidad:</b> el nombramiento es por <b>seis años</b> y no puede prorrogarse; sus miembros son <b>independientes e inamovibles</b> y solo pueden ser removidos por las causas tasadas que el artículo enumera.</li>\n<li><b>Ámbito:</b> resuelve los recursos relativos a los contratos de la Administración General del Estado, de sus organismos y entidades vinculadas, y los de las comunidades autónomas y entidades locales que le atribuyan la competencia mediante convenio.</li>\n</ul>", "llano": "<p>Los recursos no los resuelve quien adjudicó: los resuelve un tribunal administrativo aparte, con juristas de mucha experiencia, nombrados por seis años y que no pueden ser cesados a voluntad. En el Estado, ese tribunal es el Central.</p>", "porque": "<p>Porque un recurso resuelto por el propio órgano que adjudicó no es un recurso: es una segunda opinión del mismo. Las directivas exigen un órgano <b>independiente</b>, y la ley traduce esa exigencia en tres garantías concretas: <b>especialización</b> (quince años de experiencia), <b>mandato tasado</b> (seis años improrrogables) e <b>inamovilidad</b> (remoción solo por causas legales).</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> reclamar una nota ante un tribunal distinto del que te examinó.</li>\n<li><b>Real:</b> una empresa recurre la adjudicación de un contrato del Ministerio de Transportes. Resuelve el <b>Tribunal Administrativo Central de Recursos Contractuales</b>, no el ministerio.</li>\n<li><b>Caso límite:</b> una comunidad autónoma que no ha creado su propio órgano puede <b>atribuir la competencia al Tribunal Central</b> mediante convenio con la Administración General del Estado (art. 46.2).</li>\n</ul>", "noej": "<ul>\n<li><b>No resuelve</b> el órgano de contratación, aunque el recurso pueda presentarse ante él.</li>\n<li><b>No es un órgano judicial</b>: es administrativo, y su resolución es recurrible ante el contencioso.</li>\n<li><b>No es prorrogable</b> el mandato de seis años.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 46:</b> órganos competentes en comunidades autónomas y entidades locales.</li>\n<li><b>Art. 57:</b> resolución del recurso.</li>\n<li><b>Art. 59:</b> contra la resolución solo cabe el contencioso-administrativo.</li>\n<li><b>Art. 132.3:</b> el tribunal comunica a la CNMC los indicios de conductas colusorias.</li>\n</ul>", "trampas": "<ul>\n<li><b>Quince años</b> de experiencia profesional y mandato de <b>seis años</b> improrrogable.</li>\n<li>Actúa con «<b>plena independencia funcional</b>»: es la fórmula literal.</li>\n<li>Una comunidad autónoma puede atribuirle su competencia por <b>convenio</b>, sufragando los gastos.</li>\n</ul>", "ancla": "<p><b>15 y 6:</b> quince años para entrar, seis años de mandato.</p>", "vis": "<svg viewBox=\"0 0 960 341\" role=\"img\" aria-label=\"Órganos competentes para resolver el recurso especial en cada nivel de Administración\" style=\"width:100%;height:auto\"><defs><marker id=\"fl2\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr2\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe2\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw2\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"250\" y=\"8\" width=\"460\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"27.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">¿QUIÉN RESUELVE EL RECURSO?</text><rect x=\"20\" y=\"52\" width=\"297.333\" height=\"235\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"168.667\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--acc)\">ESTADO</text><text x=\"168.667\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">TRIBUNAL ADMINISTRATIVO</text><text x=\"168.667\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">CENTRAL DE RECURSOS</text><text x=\"168.667\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">CONTRACTUALES</text><text x=\"168.667\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"168.667\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Órgano especializado,</text><text x=\"168.667\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">actúa con plena</text><text x=\"168.667\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">independencia funcional</text><text x=\"168.667\" y=\"180\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"168.667\" y=\"193\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Presidente y vocales</text><text x=\"168.667\" y=\"206\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">con más de quince años</text><text x=\"168.667\" y=\"219\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">de experiencia</text><text x=\"168.667\" y=\"232\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"168.667\" y=\"245\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 45</text><rect x=\"331.333\" y=\"52\" width=\"297.333\" height=\"235\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"480\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--ej)\">COMUNIDADES AUTÓNOMAS</text><text x=\"480\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Órgano independiente</text><text x=\"480\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">creado por la propia</text><text x=\"480\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">comunidad autónoma</text><text x=\"480\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"480\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Los miembros gozan de</text><text x=\"480\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">la misma independencia</text><text x=\"480\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">e inamovilidad</text><text x=\"480\" y=\"180\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"480\" y=\"193\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Puede atribuirse la</text><text x=\"480\" y=\"206\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">competencia al Tribunal</text><text x=\"480\" y=\"219\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Central mediante convenio</text><text x=\"480\" y=\"232\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"480\" y=\"245\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 46.1 y 46.2</text><rect x=\"642.667\" y=\"52\" width=\"297.333\" height=\"235\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"791.333\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--warn)\">ENTIDADES LOCALES</text><text x=\"791.333\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">La competencia corresponde</text><text x=\"791.333\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">al ÓRGANO INDEPENDIENTE</text><text x=\"791.333\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">QUE DETERMINE LA</text><text x=\"791.333\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">COMUNIDAD AUTÓNOMA</text><text x=\"791.333\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"791.333\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">En los municipios de gran</text><text x=\"791.333\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">población y en las</text><text x=\"791.333\" y=\"180\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">diputaciones provinciales</text><text x=\"791.333\" y=\"193\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">puede crearse un órgano</text><text x=\"791.333\" y=\"206\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">propio especializado</text><text x=\"791.333\" y=\"219\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"791.333\" y=\"232\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 46.4</text><rect x=\"20\" y=\"297\" width=\"920\" height=\"34\" rx=\"8\" fill=\"var(--panel)\" stroke=\"var(--line)\"/><text x=\"480\" y=\"317.328\" text-anchor=\"middle\" font-size=\"10.4\" fill=\"currentColor\">En todos los casos son órganos independientes y especializados: no resuelve el mismo órgano que adjudicó.</text></svg>"}, {"n": 46, "t": "Órgano competente para la resolución del recurso en las Comunidades Autónomas y Entidades Locales", "ubic": "Libro I ▸ Título I ▸ Capítulo V · Del recurso especial en materia de contratación", "idea": "Cada comunidad crea su tribunal; en las entidades locales resuelve el que determine la comunidad autónoma.", "literal": "<p><b>1.</b> En el ámbito de las Comunidades Autónomas, la competencia para resolver los recursos será establecida por sus normas respectivas, debiendo crear un órgano independiente cuyo titular, o en el caso de que fuera colegiado al menos su Presidente, ostente cualificaciones jurídicas y profesionales que garanticen un adecuado conocimiento de las materias que sean de su competencia. El nombramiento de los miembros de esta instancia independiente y la terminación de su mandato estarán sujetos en lo relativo a la autoridad responsable de su nombramiento, la duración de su mandato y su revocabilidad a condiciones que garanticen su independencia e inamovilidad.</p><p><b>2.</b> Podrán las Comunidades Autónomas, asimismo, atribuir la competencia para la resolución de los recursos al Tribunal Administrativo Central de Recursos Contractuales. A tal efecto, deberán celebrar el correspondiente convenio con la Administración General del Estado, en el que se estipulen las condiciones en que la Comunidad sufragará los gastos derivados de esta asunción de competencias.</p><p><b>3.</b> Las Ciudades Autónomas de Ceuta y Melilla podrán designar sus propios órganos independientes ajustándose a los requisitos establecidos en este apartado para los órganos

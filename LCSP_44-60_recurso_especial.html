 de las Comunidades Autónomas, o bien atribuir la competencia al Tribunal Administrativo Central de Recursos Contractuales celebrando al efecto un convenio en los términos previstos en el apartado anterior.</p><p><b>4.</b> En lo relativo a la contratación en el ámbito de las Corporaciones Locales, la competencia para resolver los recursos será establecida por las normas de las Comunidades Autónomas cuando estas tengan atribuida competencia normativa y de ejecución en materia de régimen local y contratación. En el supuesto de que no exista previsión expresa en la legislación autonómica y sin perjuicio de lo dispuesto en el párrafo siguiente, la competencia para resolver los recursos corresponderá al mismo órgano al que las Comunidades Autónomas en cuyo territorio se integran las Corporaciones Locales hayan atribuido la competencia para resolver los recursos de su ámbito. En todo caso, los Ayuntamientos de los municipios de gran población a los que se refiere el artículo 121 de la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local, y las Diputaciones Provinciales podrán crear un órgano especializado y funcionalmente independiente que ostentará la competencia para resolver los recursos. Su constitución y funcionamiento y los requisitos que deben reunir sus miembros, su nombramiento, remoción y la duración de su mandato se regirá por lo que establezca la legislación autonómica, o, en su defecto, por lo establecido en el artículo 45 de esta Ley. El Pleno de la Corporación será el competente para acordar su creación y nombrar y remover a sus miembros. El resto de los Ayuntamientos podrán atribuir la competencia para resolver el recurso al órgano creado por la Diputación de la provincia a la que pertenezcan.</p><p><b>5.</b> En lo relativo a la contratación en el ámbito de los Territorios Históricos Forales, la competencia para resolver los recursos podrá corresponder a los órganos y Tribunales administrativos forales de Recursos Contractuales.</p><div class=\"box warn\" style=\"margin-top:.7rem\"><span class=\"lbl\">Nota del BOE al pie del precepto · no forma parte del texto articulado</span><p>Téngase en cuenta que se declara inconstitucional y nulo el párrafo segundo del apartado 4 por la Sentencia del TC 68/2021, de 18 de marzo. Ref. BOE-A-2021-6614</p></div>", "dis": "<ul>\n<li><b>Comunidades autónomas (46.1):</b> la competencia la establecen sus normas, <b>debiendo crear un órgano independiente</b> cuyo titular —o al menos el presidente, si es colegiado— tenga cualificaciones jurídicas y profesionales adecuadas. Su nombramiento, duración y revocabilidad deben garantizar <b>independencia e inamovilidad</b>.</li>\n<li><b>Convenio (46.2):</b> las comunidades pueden <b>atribuir la competencia al Tribunal Administrativo Central</b> mediante convenio con la Administración General del Estado, estipulando cómo sufragarán los gastos.</li>\n<li><b>Ceuta y Melilla (46.3):</b> pueden designar sus propios órganos independientes o atribuir la competencia al Tribunal Central por convenio.</li>\n<li><b>Entidades locales (46.4):</b> la competencia será establecida por las <b>normas de las comunidades autónomas</b> cuando tengan atribuida competencia normativa y de ejecución en materia de contratación. En su defecto y en los <b>municipios de gran población</b> y <b>diputaciones provinciales</b>, se contemplan reglas específicas de atribución a órganos independientes.</li>\n</ul>", "llano": "<p>Cada comunidad autónoma tiene que crear su propio tribunal de recursos contractuales, o firmar un convenio para que se los resuelva el Central. Y los recursos de los ayuntamientos y diputaciones los resuelve el órgano que determine su comunidad autónoma, no el propio ayuntamiento.</p>", "porque": "<p>Porque la independencia del órgano que resuelve no es negociable, pero la organización territorial sí. La ley impone el <b>resultado</b> —un órgano independiente— y deja libertad sobre el <b>cómo</b>: crear uno propio o encomendar la función al Central.</p>\n<p>Para las entidades locales, la solución evita algo que sería absurdo: que cada uno de los más de 8.000 municipios tuviera su propio tribunal.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> una federación deportiva autonómica que puede tener su propio comité de competición o adherirse al de la federación nacional.</li>\n<li><b>Real:</b> una empresa recurre el pliego de un contrato de una diputación andaluza. Resuelve el órgano independiente que determine la normativa de la comunidad autónoma, no la propia diputación.</li>\n<li><b>Caso límite:</b> un municipio de gran población puede tener atribuido un órgano especializado propio; un municipio pequeño, nunca.</li>\n</ul>", "noej": "<ul>\n<li><b>No resuelve</b> el Pleno de la corporación ni la Junta de Gobierno: sería el mismo que adjudicó.</li>\n<li><b>No basta</b> con crear un órgano: debe garantizarse su <b>independencia e inamovilidad</b>.</li>\n<li><b>No es automática</b> la competencia del Tribunal Central sobre contratos autonómicos: requiere <b>convenio</b>.</li>\n<li><b>Atención a la STC 68/2021:</b> el <b>párrafo segundo del apartado 4</b> fue declarado <b>inconstitucional y nulo</b>. La nota del BOE aparece al pie del texto legal, separada del articulado. No estudies ese inciso como derecho vigente.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 45:</b> Tribunal Administrativo Central.</li>\n<li><b>Art. 57:</b> resolución del recurso.</li>\n<li><b>Art. 59:</b> efectos y recurso contencioso.</li>\n<li><b>Ley 7/1985 LBRL</b> <i>(aportación externa)</i>: régimen de los municipios de gran población.</li>\n</ul>", "trampas": "<ul>\n<li>Las entidades locales <b>no</b> resuelven sus propios recursos especiales.</li>\n<li>La atribución al Tribunal Central exige <b>convenio</b> y financiación por la comunidad autónoma.</li>\n<li>La exigencia de cualificación se predica del <b>titular</b> o, si es colegiado, <b>al menos del presidente</b>.</li>\n</ul>", "ancla": "<p><b>«Quien adjudica no resuelve.»</b> Es la regla que ordena los arts. 45 y 46 enteros.</p>", "vis": "<svg viewBox=\"0 0 960 341\" role=\"img\" aria-label=\"Órganos competentes para resolver el recurso especial en cada nivel de Administración\" style=\"width:100%;height:auto\"><defs><marker id=\"fl3\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr3\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe3\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw3\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"250\" y=\"8\" width=\"460\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"27.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">¿QUIÉN RESUELVE EL RECURSO?</text><rect x=\"20\" y=\"52\" width=\"297.333\" height=\"235\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"168.667\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--acc)\">ESTADO</text><text x=\"168.667\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">TRIBUNAL ADMINISTRATIVO</text><text x=\"168.667\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">CENTRAL DE RECURSOS</text><text x=\"168.667\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">CONTRACTUALES</text><text x=\"168.667\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"168.667\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Órgano especializado,</text><text x=\"168.667\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">actúa con plena</text><text x=\"168.667\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">independencia funcional</text><text x=\"168.667\" y=\"180\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"168.667\" y=\"193\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Presidente y vocales</text><text x=\"168.667\" y=\"206\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">con más de quince años</text><text x=\"168.667\" y=\"219\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">de experiencia</text><text x=\"168.667\" y=\"232\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"168.667\" y=\"245\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 45</text><rect x=\"331.333\" y=\"52\" width=\"297.333\" height=\"235\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"480\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--ej)\">COMUNIDADES AUTÓNOMAS</text><text x=\"480\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Órgano independiente</text><text x=\"480\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">creado por la propia</text><text x=\"480\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">comunidad autónoma</text><text x=\"480\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"480\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Los miembros gozan de</text><text x=\"480\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">la misma independencia</text><text x=\"480\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">e inamovilidad</text><text x=\"480\" y=\"180\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"480\" y=\"193\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Puede atribuirse la</text><text x=\"480\" y=\"206\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">competencia al Tribunal</text><text x=\"480\" y=\"219\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Central mediante convenio</text><text x=\"480\" y=\"232\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"480\" y=\"245\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 46.1 y 46.2</text><rect x=\"642.667\" y=\"52\" width=\"297.333\" height=\"235\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"791.333\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--warn)\">ENTIDADES LOCALES</text><text x=\"791.333\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">La competencia corresponde</text><text x=\"791.333\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">al ÓRGANO INDEPENDIENTE</text><text x=\"791.333\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">QUE DETERMINE LA</text><text x=\"791.333\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">COMUNIDAD AUTÓNOMA</text><text x=\"791.333\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"791.333\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">En los municipios de gran</text><text x=\"791.333\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">población y en las</text><text x=\"791.333\" y=\"180\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">diputaciones provinciales</text><text x=\"791.333\" y=\"193\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">puede crearse un órgano</text><text x=\"791.333\" y=\"206\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">propio especializado</text><text x=\"791.333\" y=\"219\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"791.333\" y=\"232\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 46.4</text><rect x=\"20\" y=\"297\" width=\"920\" height=\"34\" rx=\"8\" fill=\"var(--panel)\" stroke=\"var(--line)\"/><text x=\"480\" y=\"317.328\" text-anchor=\"middle\" font-size=\"10.4\" fill=\"currentColor\">En todos los casos son órganos independientes y especializados: no resuelve el mismo órgano que adjudicó.</text></svg>"}, {"n": 48, "t": "Legitimación", "ubic": "Libro I ▸ Título I ▸ Capítulo V · Del recurso especial en materia de contratación", "idea": "Puede recurrir quien tenga un interés legítimo afectado; también los sindicatos y la patronal sectorial.", "literal": "<p>Podrá interponer el recurso especial en materia de contratación cualquier persona física o jurídica cuyos derechos o intereses legítimos, individuales o colectivos, se hayan visto perjudicados o puedan resultar afectados, de manera directa o indirecta, por las decisiones objeto del recurso. Estarán también legitimadas para interponer este recurso, contra los actos susceptibles de ser recurridos, las organizaciones sindicales cuando de las actuaciones o decisiones recurribles pudiera deducirse fundadamente que estas implican que en el proceso de ejecución del contrato se incumplan por el empresario las obligaciones sociales o laborales respecto de los trabajadores que participen en la realización de la prestación. En todo caso se entenderá legitimada la organización empresarial sectorial representativa de los intereses afectados.</p>", "dis": "<ul>\n<li><b>Regla general de <span class=\"t\" data-k=\"legitim\">legitimación</span>:</b> puede interponer el recurso «cualquier <b>persona física o jurídica</b> cuyos <b>derechos o intereses legítimos</b>, individuales o colectivos, se hayan visto <b>perjudicados</b> o <b>puedan resultar afectados</b>, de manera <b>directa o indirecta</b>, por las decisiones objeto del recurso».</li>\n<li><b>Organizaciones sindicales:</b> están legitimadas cuando de las actuaciones recurribles pudiera deducirse fundadamente que implican que en la ejecución del contrato el empresario <b>incumpla las obligaciones sociales o laborales</b> respecto de los trabajadores que participen en la prestación.</li>\n<li><b>Organización empresarial sectorial:</b> «<b>en todo caso</b> se entenderá legitimada la organización empresarial sectorial representativa de los intereses afectados».</li>\n</ul>", "llano": "<p>No hace falta haberse presentado a la licitación para recurrir: basta con tener un interés legítimo que pueda verse afectado. Y hay dos legitimaciones añadidas: la de los sindicatos, cuando el contrato se vaya a ejecutar incumpliendo derechos laborales, y la de la patronal del sector, que está legitimada siempre.</p>", "porque": "<p>Porque los pliegos ilegales expulsan a empresas <b>antes</b> de que puedan presentar oferta: exigir que se hubieran presentado para poder recurrir dejaría precisamente sin remedio a las perjudicadas por una cláusula excluyente.</p>\n<p>La legitimación sindical es la novedad de 2017 y tiene un fin claro: permitir atacar la licitación que solo puede ejecutarse pagando por debajo del convenio, sin esperar a que el daño laboral se produzca.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> reclamar contra unas bases de un concurso que te excluyen, aunque no te hayas inscrito precisamente porque te excluían.</li>\n<li><b>Real:</b> el PCAP de un servicio de limpieza exige una clasificación que solo tienen tres empresas del país. Una empresa que no se presentó por ese motivo <b>está legitimada</b> para recurrir el pliego: la cláusula afecta directamente a su interés legítimo de concurrir.</li>\n<li><b>Caso límite:</b> un sindicato recurre la adjudicación porque la oferta ganadora implica ratios de personal incompatibles con el convenio. Está legitimado por el párrafo segundo del art. 48.</li>\n</ul>", "noej": "<ul>\n<li><b>No hace falta</b> haber licitado para estar legitimado, con la salvedad del art. 50.1.b): <b>quien ya presentó oferta</b> no puede, con carácter general, recurrir después los pliegos.</li>\n<li><b>No está legitimado</b> quien invoque un interés meramente hipotético o ajeno al contrato.</li>\n<li><b>No se exige</b> a la organización empresarial sectorial acreditar un perjuicio propio: está legitimada «en todo caso».</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 44:</b> actos recurribles.</li>\n<li><b>Art. 50.1.b):</b> límite a la impugnación de pliegos por quien ya presentó oferta.</li>\n<li><b>Art. 55.b):</b> la falta de legitimación como causa de inadmisión.</li>\n<li><b>Art. 4 LPAC</b> <i>(otra norma de la biblioteca)</i>: concepto de interesado.</li>\n</ul>", "trampas": "<ul>\n<li><b>Interés legítimo</b>, no derecho subjetivo. Y puede ser <b>indirecto</b> y <b>colectivo</b>.</li>\n<li>La legitimación <b>sindical</b> está acotada al incumplimiento de obligaciones sociales o laborales.</li>\n<li>La patronal sectorial lo está «<b>en todo caso</b>»: es legitimación reconocida ex lege.</li>\n</ul>", "ancla": "<p><b>«Cualquiera a quien le afecte, más los sindicatos si hay derechos laborales en juego, más la patronal siempre.»</b></p>", "vis": "<svg viewBox=\"0 0 960 295\" role=\"img\" aria-label=\"Legitimación para interponer el recurso especial en materia de contratación\" style=\"width:100%;height:auto\"><defs><marker id=\"fl4\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr4\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe4\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw4\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"250\" y=\"8\" width=\"460\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"27.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">QUIÉN PUEDE RECURRIR · ART. 48</text><rect x=\"20\" y=\"52\" width=\"297.333\" height=\"175\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"168.667\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--acc)\">REGLA GENERAL</text><text x=\"168.667\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Cualquier persona FÍSICA</text><text x=\"168.667\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">o JURÍDICA cuyos derechos</text><text x=\"168.667\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">o intereses legítimos,</text><text x=\"168.667\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">individuales o colectivos,</text><text x=\"168.667\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">se hayan visto perjudicados</text><text x=\"168.667\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">o puedan resultar afectados</text><text x=\"168.667\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"168.667\" y=\"180\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">de manera DIRECTA</text><text x=\"168.667\" y=\"193\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">o INDIRECTA</text><rect x=\"331.333\" y=\"52\" width=\"297.333\" height=\"175\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"480\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--ej)\">ORGANIZACIONES\nSINDICALES</text><text x=\"480\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Cuando de las actuaciones</text><text x=\"480\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">recurribles pueda deducirse</text><text x=\"480\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">fundadamente que en la</text><text x=\"480\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">ejecución del contrato el</text><text x=\"480\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">empresario INCUMPLIRÁ las</text><text x=\"480\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">obligaciones SOCIALES o</text><text x=\"480\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">LABORALES respecto de los</text><text x=\"480\" y=\"180\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">trabajadores</text><rect x=\"642.667\" y=\"52\" width=\"297.333\" height=\"175\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"791.333\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--warn)\">ORGANIZACIÓN\nEMPRESARIAL SECTORIAL</text><text x=\"791.333\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">EN TODO CASO se entenderá</text><text x=\"791.333\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">legitimada la organización</text><text x=\"791.333\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">empresarial sectorial</text><text x=\"791.333\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">representativa de los</text><text x=\"791.333\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">intereses afectados</text><text x=\"791.333\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"791.333\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Legitimación reconocida</text><text x=\"791.333\" y=\"180\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">directamente por la ley</text><rect x=\"20\" y=\"237\" width=\"920\" height=\"48\" rx=\"8\" fill=\"var(--panel)\" stroke=\"var(--line)\"/><text x=\"480\" y=\"257.828\" text-anchor=\"middle\" font-size=\"10.4\" fill=\"currentColor\">No hace falta haber licitado para estar legitimado. Pero el art. 50.1.b) impide, con carácter general, recurrir los PLIEGOS a quien ya presentó oferta,</text><text x=\"480\" y=\"270.828\" text-anchor=\"middle\" font-size=\"10.4\" fill=\"currentColor\">salvo en los supuestos de nulidad de pleno derecho.</text></svg>"}, {"n": 49, "t": "Solicitud de medidas cautelares", "ubic": "Libro I ▸ Título I ▸ Capítulo V · Del recurso especial en materia de contratación", "idea": "Se pueden pedir antes de recurrir, y la más importante es suspender el procedimiento.", "literal": "<p><b>1.</b> Antes de interponer el recurso especial, las personas legitimadas para ello podrán solicitar ante el órgano competente para resolver el recurso la adopción de medidas cautelares. Tales medidas irán dirigidas a corregir infracciones de procedimiento o impedir que se causen otros perjuicios a los intereses afectados, y podrán estar incluidas, entre ellas, las destinadas a suspender o a hacer que se suspenda el procedimiento de adjudicación del contrato en cuestión o la ejecución de cualquier decisión adoptada por los órganos de contratación.</p><p><b>2.</b> El órgano competente para resolver el recurso deberá adoptar decisión en forma motivada sobre las medidas cautelares dentro de los cinco días hábiles siguientes a la presentación del escrito en que se soliciten. A estos efectos, el órgano que deba resolver, en el mismo día en que se reciba la petición de la medida cautelar, comunicará la misma al órgano de contratación, que dispondrá de un plazo de dos días hábiles, para presentar las alegaciones que considere oportunas referidas a la adopción de las medidas solicitadas o a las propuestas por el propio órgano decisorio. Si transcurrido este plazo no se formulasen alegaciones se continuará el procedimiento. Si antes de dictar resolución se hubiese interpuesto el recurso, el órgano competente para resolverlo acumulará a este la solicitud de medidas cautelares. Contra las resoluciones dictadas en este procedimiento no cabrá recurso alguno, sin perjuicio de los que procedan contra las resoluciones que se dicten en el procedimiento principal.</p><p><b>3.</b> Cuando de la adopción de las medidas cautelares puedan derivarse perjuicios de cualquier naturaleza, la resolución podrá imponer la constitución de caución o garantía suficiente para responder de ellos, sin que aquellas produzcan efectos hasta que dicha caución o garantía sea constituida. Reglamentariamente se determinará la cuantía y forma de la garantía a constituir así como los requisitos para su devolución que en todo caso deberán atender al principio de proporcionalidad y tener en cuenta el sujeto y el objeto afectados.</p><p><b>4.</b> Salvo que se acuerde lo contrario por el órgano competente, la suspensión del procedimiento que pueda acordarse cautelarmente no afectará al plazo concedido para la presentación de ofertas o proposiciones por los interesados.</p><p><b>5.</b> Las medidas cautelares que se soliciten y acuerden con anterioridad a la presentación del recurso especial en materia de contratación decaerán una vez transcurra el plazo establecido para su interposición sin que el interesado lo haya deducido.</p>", "dis": "<ul>\n<li><b>Momento y sujetos (49.1):</b> <b>antes de interponer</b> el recurso, las personas legitimadas pueden solicitar ante el órgano competente para resolverlo la adopción de <span class=\"t\" data-k=\"cautelar\">medidas cautelares</span>.</li>\n<li><b>Finalidad:</b> corregir infracciones de procedimiento o impedir que se causen otros perjuicios. Pueden consistir en <b>suspender</b> el procedimiento de adjudicación o la ejecución de cualquier decisión del órgano de contratación.</li>\n<li><b>Trámite (49.2):</b> el órgano decide de forma <b>motivada</b> dentro de los <b>cinco días hábiles</b> siguientes a la presentación del escrito. El <b>mismo día</b> de recibir la petición la comunica al órgano de contratación, que dispone de <b>dos días hábiles</b> para alegar. Si no alega, se continúa.</li>\n<li><b>Acumulación:</b> si antes de resolver se hubiera interpuesto el recurso, la solicitud se <b>acumula</b> a él.</li>\n<li><b>Irrecurribilidad:</b> contra las resoluciones dictadas en este procedimiento <b>no cabe recurso alguno</b>, sin perjuicio de los que procedan contra las del procedimiento principal.</li>\n<li><b>Caución (49.3):</b> si de las medidas pudieran derivarse perjuicios, la resolución puede imponer la <b>constitución de caución o garantía suficiente</b>.</li>\n</ul>", "llano": "<p>Si alguien ve que un procedimiento va a terminar mal y quiere pararlo antes incluso de recurrir, puede pedir medidas cautelares. La más habitual es suspender la licitación. Se resuelve en cinco días hábiles, tras oír al órgano de contratación durante dos.</p>\n<p>Y si esa suspensión puede causar perjuicios, se le puede exigir una fianza a quien la pidió.</p>", "porque": "<p>Porque hay daños que no se reparan con dinero: si la licitación continúa y el contrato se adjudica y ejecuta, el recurrente ya no puede ganarlo. La medida cautelar <b>conserva el objeto</b> del recurso.</p>\n<p>Y la caución equilibra: pedir una suspensión no puede ser gratis si con ello se paraliza un servicio público y se causa un perjuicio real.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> pedir al juez que paralice una obra mientras se discute si tiene licencia. Si luego resulta que sí la tenía, quien pidió la paralización responde de los daños.</li>\n<li><b>Real:</b> el 3 de febrero se publica el anuncio de un contrato de servicios de 178.000 €. Una empresa solicita el 6 de febrero la suspensión del procedimiento por considerar excluyente una cláusula del PCAP. El tribunal comunica la petición ese mismo día al ayuntamiento, que alega el 10; el 13 de febrero —cinco días hábiles— resuelve motivadamente.</li>\n<li><b>Caso límite:</b> el recurso se interpone el 11 de febrero, antes de que se resuelva la cautelar. Entonces la solicitud <b>se acumula</b> al recurso (49.2).</li>\n</ul>", "noej": "<ul>\n<li><b>No es la suspensión automática</b> del art. 53: esa se produce <i>ex lege</i> cuando se recurre el acuerdo de adjudicación, sin necesidad de pedirla.</li>\n<li><b>No cabe recurso</b> contra la resolución sobre medidas cautelares.</li>\n<li><b>No son gratuitas</b> siempre: puede exigirse caución si de ellas se derivan perjuicios.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 53:</b> suspensión automática del procedimiento al recurrir la adjudicación.</li>\n<li><b>Art. 56.3:</b> decisión sobre cautelares dentro del propio recurso, también en cinco días hábiles.</li>\n<li><b>Art. 57.3:</b> la resolución acuerda el levantamiento de las medidas y la devolución de garantías.</li>\n<li><b>Art. 51.1:</b> las cautelares pueden solicitarse en el propio escrito de interposición.</li>\n</ul>", "trampas": "<ul>\n<li>Se piden <b>antes</b> de interponer el recurso; si se piden después, se resuelven <b>sin suspender</b> el principal.</li>\n<li><b>5 días hábiles</b> para resolver, <b>2 días hábiles</b> de alegaciones del órgano de contratación.</li>\n<li><b>No confundir</b> con la suspensión automática del art. 53.</li>\n</ul>", "ancla": "<p><b>«Mismo día para avisar, dos para alegar, cinco para decidir.»</b></p>", "vis": "<svg viewBox=\"0 0 960 426\" role=\"img\" aria-label=\"Solicitud de medidas cautelares y suspensión automática del expediente\" style=\"width:100%;height:auto\"><defs><marker id=\"fl5\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr5\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe5\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw5\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"250\" y=\"8\" width=\"460\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"27.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">MEDIDAS CAUTELARES Y SUSPENSIÓN · ARTS. 49 Y 53</text><rect x=\"20\" y=\"52\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"30\" y=\"66\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"120\" y=\"83\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--acc)\">QUIÉN Y CUÁNDO</text><text x=\"224\" y=\"74\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Antes de interponer el recurso, las personas legitimadas pueden solicitar</text><text x=\"224\" y=\"88\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">medidas cautelares ante el órgano competente para resolverlo.</text><text x=\"930\" y=\"74\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">49.1</text><path d=\"M480 107 L 480 115\" stroke=\"var(--acc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl5)\"/><rect x=\"20\" y=\"116\" width=\"920\" height=\"68\" rx=\"10\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"30\" y=\"137\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"120\" y=\"154\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--acc)\">PARA QUÉ</text><text x=\"224\" y=\"138\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Corregir infracciones de procedimiento o impedir otros perjuicios.</text><text x=\"224\" y=\"152\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Pueden consistir en SUSPENDER el procedimiento de adjudicación</text><text x=\"224\" y=\"166\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">o la ejecución de cualquier decisión del órgano de contratación.</text><text x=\"930\" y=\"138\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">49.1</text><path d=\"M480 185 L 480 193\" stroke=\"var(--acc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl5)\"/><rect x=\"20\" y=\"194\" width=\"920\" height=\"40\" rx=\"10\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"30\" y=\"201\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"120\" y=\"218\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--warn)\">MISMO DÍA</text><text x=\"224\" y=\"216\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">El órgano que deba resolver comunica la petición al órgano de contratación.</text><text x=\"930\" y=\"216\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">49.2</text><path d=\"M480 235 L 480 243\" stroke=\"var(--warn)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl5)\"/><rect x=\"20\" y=\"244\" width=\"920\" height=\"40\" rx=\"10\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"30\" y=\"251\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"120\" y=\"268\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--warn)\">2 DÍAS HÁBILES</text><text x=\"224\" y=\"266\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Plazo del órgano de contratación para alegar. Si no alega, se continúa.</text><text x=\"930\" y=\"266\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">49.2</text><path d=\"M480 285 L 480 293\" stroke=\"var(--warn)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl5)\"/><rect x=\"20\" y=\"294\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><rect x=\"30\" y=\"308\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--ej)\"/><text x=\"120\" y=\"325\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--ej)\">5 DÍAS HÁBILES</text><text x=\"224\" y=\"316\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Decisión motivada sobre las medidas cautelares desde la presentación</text><text x=\"224\" y=\"330\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">del escrito. Contra ella NO cabe recurso alguno.</text><text x=\"930\" y=\"316\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">49.2</text><path d=\"M480 349 L 480 357\" stroke=\"var(--ej)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl5)\"/><rect x=\"20\" y=\"358\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><rect x=\"30\" y=\"372\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--exc)\"/><text x=\"120\" y=\"389\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--exc)\">SUSPENSIÓN AUTOMÁTICA</text><text x=\"224\" y=\"380\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Si el recurso se interpone contra el ACUERDO DE ADJUDICACIÓN,</text><text x=\"224\" y=\"394\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">queda SUSPENDIDA automáticamente la tramitación del expediente.</text><text x=\"930\" y=\"380\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">53</text></svg>"}, {"n": 50, "t": "Iniciación del procedimiento y plazo", "ubic": "Libro I ▸ Título I ▸ Capítulo V · Del recurso especial en materia de contratación", "idea": "Quince días hábiles, con un dies a quo distinto según lo que se recurra.", "literal": "<p><b>1.</b> El procedimiento de recurso se iniciará mediante escrito que deberá presentarse en el plazo de quince días hábiles. Dicho plazo se computará:</p><p style=\"margin-left:1.1rem\">a) Cuando se interponga contra el anuncio de licitación, el plazo comenzará a contarse a partir del día siguiente al de su publicación en el perfil de contratante.</p><p style=\"margin-left:1.1rem\">b) Cuando el recurso se interponga contra el contenido de los pliegos y demás documentos contractuales, el cómputo se iniciará a partir del día siguiente a aquel en que se haya publicado en el perfil de contratante el anuncio de licitación, siempre que en este se haya indicado la forma en que los interesados pueden acceder a ellos. Cuando no se hiciera esta indicación el plazo comenzará a contar a partir del día siguiente a aquel en que se le hayan entregado al interesado los mismos o este haya podido acceder a su contenido a través del perfil de contratante. En el caso del procedimiento negociado sin publicidad el cómputo del plazo comenzará desde el día siguiente a la remisión de la invitación a los candidatos seleccionados. En los supuestos en que, de conformidad con lo establecido en el artículo 138.2 de la presente Ley, los pliegos no pudieran ser puestos a disposición por medios electrónicos, el plazo se computará a partir del día siguiente en que se hubieran entregado al recurrente. Con carácter general no se admitirá el recurso contra los pliegos y documentos contractuales que hayan de regir una contratación si el recurrente, con carácter previo a su interposición, hubiera presentado oferta o solicitud de participación en la licitación correspondiente, sin perjuicio de lo previsto para los supuestos de nulidad de pleno derecho.</p><p style=\"margin-left:1.1rem\">c) Cuando se interponga contra actos de trámite adoptados en el procedimiento de adjudicación o contra un acto resultante de la aplicación del procedimiento negociado sin publicidad, el cómputo se iniciará a partir del día siguiente a aquel en que se haya tenido conocimiento de la posible infracción.</p><p style=\"margin-left:1.1rem\">d) Cuando se interponga contra la adjudicación del contrato el cómputo se iniciará a partir del día siguiente a aquel en que se haya notificado esta de conformidad con lo dispuesto en la disposición adicional decimoquinta a los candidatos o licitadores que hubieran sido admitidos en el procedimiento.</p><p style=\"margin-left:1.1rem\">e) Cuando el recurso se interponga en relación con alguna modificación basada en el incumplimiento de lo establecido en los artículos 204 y 205 de la presente Ley, por entender que la modificación debió ser objeto de una nueva adjudicación, desde el día siguiente a aquel en que se haya publicado en el perfil de contratante.</p><p style=\"margin-left:1.1rem\">f) Cuando el recurso se interponga contra un encargo a medio propio por no cumplir los requisitos establecidos en el artículo 32 de la presente Ley, desde el día siguiente a aquel en que se haya publicado en el perfil de contratante.</p><p style=\"margin-left:1.1rem\">g) En todos los demás casos, el plazo comenzará a contar desde el día siguiente al de la notificación realizada de conformidad con lo dispuesto en la Disposición adicional decimoquinta.</p><p><b>2.</b> No obstante lo dispuesto en el párrafo anterior, cuando el recurso se funde en alguna de las causas de nulidad previstas en el apartado 2, letras c), d), e) o f) del artículo 39, el plazo de interposición será el siguiente:</p><p style=\"margin-left:1.1rem\">a) Treinta días a contar desde la publicación de la formalización del contrato en la forma prevista en esta Ley, incluyendo las razones justificativas por las que no se ha publicado en forma legal la convocatoria de la licitación o desde la notificación a los candidatos o licitadores afectados, de los motivos del rechazo de su candidatura o de su proposición y de las características de la proposición del adjudicatario que fueron determinantes de la adjudicación a su favor.</p><p style=\"margin-left:1.1rem\">b) En los restantes casos, antes de que transcurran seis meses a contar desde la formalización del contrato.</p>", "dis": "<ul>\n<li><b>Plazo (50.1):</b> el procedimiento se inicia mediante escrito que deberá presentarse en el plazo de <b>quince días hábiles</b>, computado así:\n <ul><li><b>a)</b> contra el <b>anuncio de licitación</b>: desde el día siguiente al de su <b>publicación en el perfil de contratante</b>;</li>\n <li><b>b)</b> contra los <b>pliegos</b> y demás documentos contractuales: desde el día siguiente a aquel en que se publicó el anuncio en el perfil, <b>siempre que en este se haya indicado la forma de acceder a ellos</b>; si no se indicó, desde que se entregaron al interesado o pudo acceder a su contenido. En el <b>negociado sin publicidad</b>, desde el día siguiente a la <b>remisión de la invitación</b>;</li>\n <li><b>c)</b> contra <b>actos de trámite</b> o actos del negociado sin publicidad: desde el día siguiente a aquel en que se haya <b>tenido conocimiento</b> de la posible infracción;</li>\n <li><b>d)</b> contra la <b>adjudicación</b>: desde el día siguiente a aquel en que se haya <b>notificado</b> conforme a la ley.</li></ul></li>\n<li><b>Límite (50.1.b):</b> «con carácter general <b>no se admitirá el recurso contra los pliegos</b> y documentos contractuales si el recurrente, con carácter previo a su interposición, <b>hubiera presentado oferta o solicitud de participación</b>», sin perjuicio de los supuestos de <b>nulidad de pleno derecho</b>.</li>\n<li><b>Anuncio previo (50.2):</b> los interesados pueden anunciar previamente al órgano de contratación su intención de interponer el recurso.</li>\n</ul>", "llano": "<p>Quince días hábiles para recurrir. Lo que cambia es <b>desde cuándo</b> se cuentan: si atacas el anuncio, desde que se publicó; si atacas los pliegos, desde que se publicó el anuncio indicando cómo acceder a ellos; si atacas un trámite, desde que te enteraste; y si atacas la adjudicación, desde que te la notificaron.</p>\n<p>Con una regla que sorprende: si ya presentaste tu oferta, en general <b>ya no puedes</b> recurrir los pliegos.</p>", "porque": "<p>Porque presentar oferta equivale a aceptar las reglas. Permitir recurrir el pliego después de haber competido bajo él sería guardarse una carta: si gano, callo; si pierdo, impugno las bases. El art. 50.1.b) cierra esa puerta, salvo cuando el vicio es de <b>nulidad de pleno derecho</b>, que no se sana con la aquiescencia.</p>\n<p>Y el <i>dies a quo</i> distinto para cada acto responde a un criterio único: el plazo empieza cuando el recurrente <b>pudo conocer</b> el acto.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> no puedes reclamar las reglas de un torneo cuando ya has jugado y perdido; sí antes de inscribirte.</li>\n<li><b>Real:</b> el anuncio se publica en el perfil el <b>3 de febrero</b>, indicando el enlace a los pliegos. El plazo para recurrir el PCAP corre desde el <b>4 de febrero</b> y termina el <b>24 de febrero</b>, quince días hábiles después descontando sábados, domingos y festivos.</li>\n<li><b>Caso límite:</b> esa misma empresa presenta oferta el 18 de febrero y recurre el pliego el 20. Con carácter general, el recurso <b>no se admitirá</b> (art. 50.1.b), salvo que invoque una causa de nulidad de pleno derecho.</li>\n</ul>", "noej": "<ul>\n<li><b>No son quince días naturales</b>: son <b>hábiles</b>.</li>\n<li><b>No se cuenta</b> desde la fecha de la resolución, sino desde la publicación, la entrega, el conocimiento o la notificación, según el caso.</li>\n<li><b>No paraliza</b> el plazo la solicitud de acceso al expediente (art. 52.2).</li>\n<li><b>No cabe</b>, en general, recurrir los pliegos después de haber presentado oferta.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 44:</b> qué actos se pueden recurrir.</li>\n<li><b>Art. 51:</b> forma y lugar de interposición.</li>\n<li><b>Art. 52.2:</b> el acceso al expediente no suspende el plazo.</li>\n<li><b>Art. 55.d):</b> la extemporaneidad como causa de inadmisión.</li>\n<li><b>Art. 153.3:</b> el plazo de espera de quince días hábiles, que corre en paralelo.</li>\n<li><b>Art. 151.2:</b> el contenido de la notificación, que marca el <i>dies a quo</i> de la letra d).</li>\n</ul>", "trampas": "<ul>\n<li><b>Quince días hábiles</b>, y coinciden con el plazo de espera del art. 153.3. No es casualidad: están diseñados para encajar.</li>\n<li>Cuatro <i>dies a quo</i> distintos: <b>publicación · publicación con indicación de acceso · conocimiento · notificación</b>.</li>\n<li>La regla del <b>50.1.b)</b> —quien ofertó no recurre los pliegos— es de las más preguntadas y de las que menos se saben.</li>\n</ul>", "ancla": "<p><b>P-P-C-N:</b> <b>P</b>ublicación (anuncio) · <b>P</b>liegos con indicación de acceso · <b>C</b>onocimiento (trámite) · <b>N</b>otificación (adjudicación).</p>\n<p>Y la frase que resume el 50.1.b): <b>«el que juega, no discute las reglas».</b></p>", "vis": "<svg viewBox=\"0 0 960 432\" role=\"img\" aria-label=\"Cómputo del plazo de quince días hábiles para interponer el recurso especial\" style=\"width:100%;height:auto\"><defs><marker id=\"fl6\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr6\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe6\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw6\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"250\" y=\"8\" width=\"460\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"27.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">EL PLAZO DE QUINCE DÍAS HÁBILES · ART. 50</text><rect x=\"20\" y=\"52\" width=\"920\" height=\"40\" rx=\"10\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"30\" y=\"53\" width=\"180\" height=\"38\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"120\" y=\"69.5\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--acc)\">CONTRA EL ANUNCIO</text><text x=\"120\" y=\"82.5\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--acc)\">DE LICITACIÓN</text><text x=\"224\" y=\"74\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Desde el día siguiente al de su PUBLICACIÓN en el perfil de contratante.</text><text x=\"930\" y=\"74\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">50.1.a</text><path d=\"M480 93 L 480 101\" stroke=\"var(--acc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl6)\"/><rect x=\"20\" y=\"102\" width=\"920\" height=\"68\" rx=\"10\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"30\" y=\"123\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"120\" y=\"140\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--acc)\">CONTRA LOS PLIEGOS</text><text x=\"224\" y=\"124\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Desde el día siguiente a la publicación del anuncio en el perfil,</text><text x=\"224\" y=\"138\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">siempre que en él se indique cómo acceder a ellos.</text><text x=\"224\" y=\"152\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Si no se indicó: desde que se entregaron o se pudo acceder.</text><text x=\"930\" y=\"124\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">50.1.b</text><path d=\"M480 171 L 480 179\" stroke=\"var(--acc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl6)\"/><rect x=\"20\" y=\"180\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"30\" y=\"194\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"120\" y=\"211\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--warn)\">NEGOCIADO SIN PUBLICIDAD</text><text x=\"224\" y=\"202\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Desde el día siguiente a la REMISIÓN DE LA INVITACIÓN a los</text><text x=\"224\" y=\"216\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">candidatos seleccionados.</text><text x=\"930\" y=\"202\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">50.1.b</text><path d=\"M480 235 L 480 243\" stroke=\"var(--warn)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl6)\"/><rect x=\"20\" y=\"244\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"30\" y=\"258\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"120\" y=\"275\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--warn)\">CONTRA ACTOS DE TRÁMITE</text><text x=\"224\" y=\"266\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Desde el día siguiente a aquel en que se haya TENIDO CONOCIMIENTO</text><text x=\"224\" y=\"280\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">de la posible infracción.</text><text x=\"930\" y=\"266\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">50.1.c</text><path d=\"M480 299 L 480 307\" stroke=\"var(--warn)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl6)\"/><rect x=\"20\" y=\"308\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><rect x=\"30\" y=\"322\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--ej)\"/><text x=\"120\" y=\"339\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--ej)\">CONTRA LA ADJUDICACIÓN</text><text x=\"224\" y=\"330\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Desde el día siguiente a aquel en que se haya NOTIFICADO conforme</text><text x=\"224\" y=\"344\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">a la ley, con el contenido del art. 151.2.</text><text x=\"930\" y=\"330\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">50.1.d</text><rect x=\"20\" y=\"372\" width=\"920\" height=\"48\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"480\" y=\"392.828\" text-anchor=\"middle\" font-size=\"10.4\" fill=\"currentColor\">Regla del 50.1.b): con carácter general NO se admite el recurso contra los pliegos si el recurrente ya había presentado oferta o solicitud de participación,</text><text x=\"480\" y=\"405.828\" text-anchor=\"middle\" font-size=\"10.4\" fill=\"currentColor\">salvo en los supuestos de nulidad de pleno derecho.</text></svg>"}, {"n": 51, "t": "Forma y lugar de interposición del recurso especial", "ubic": "Libro I ▸ Título I ▸ Capítulo V · Del recurso especial en materia de contratación", "idea": "Qué hay que poner en el escrito, qué se acompaña y tres días hábiles para subsanar.", "literal": "<p><b>1.</b> En el escrito de interposición se hará constar el acto recurrido, el motivo que fundamente el recurso, los medios de prueba de que pretenda valerse el recurrente y, en su caso, las medidas de la misma naturaleza que las mencionadas en el artículo 49, cuya adopción solicite, acompañándose también:</p><p style=\"margin-left:1.1rem\">a) El documento que acredite la representación del compareciente, salvo si figurase unido a las actuaciones de otro recurso pendiente ante el mismo órgano, en cuyo caso podrá solicitarse que se expida certificación para su unión al procedimiento.</p><p style=\"margin-left:1.1rem\">b) El documento o documentos que acrediten la legitimación del actor cuando la ostente por habérsela transmitido otro por herencia o por cualquier otro título.</p><p style=\"margin-left:1.1rem\">c) La copia o traslado del acto expreso que se recurra, o indicación del expediente en que haya recaído o del boletín oficial o perfil de contratante en que se haya publicado.</p><p style=\"margin-left:1.1rem\">d) El documento o documentos en que funde su derecho.</p><p style=\"margin-left:1.1rem\">e) Una dirección de correo electrónico «habilitada» a la que enviar, de conformidad con la disposición adicional decimoquinta, las comunicaciones y notificaciones.</p><p><b>2.</b> Para la subsanación de los defectos que puedan afectar al escrito de recurso, se requerirá al interesado a fin de que, en un plazo de tres días hábiles desde el siguiente a su notificación, subsane la falta o acompañe los documentos preceptivos, con indicación de que, si así no lo hiciera, se le tendrá por desistido de su petición, quedando suspendida la tramitación del expediente con los efectos previstos en la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas. La presentación de documentación subsanada se hará, necesariamente, en el registro del órgano competente para la resolución del recurso.</p><p><b>3.</b> El escrito de interposición podrá presentarse en los lugares establecidos en el artículo 16.4 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas. Asimismo, podrá presentarse en el registro del órgano de contratación o en el del órgano competente para la resolución del recurso. Los escritos presentados en registros distintos de los dos citados específicamente en el párrafo anterior, deberán comunicarse al Tribunal de manera inmediata y de la forma más rápida posible.</p><p><b>4.</b> El órgano competente para la resolución del recurso hará públicas a través de su página web, mediante resolución de su Presidente, las direcciones de registro en las que debe hacerse la presentación de los escritos para entenderla efectuada ante el propio Tribunal.</p>", "dis": "<ul>\n<li><b>Contenido (51.1):</b> en el escrito se hará constar el <b>acto recurrido</b>, el <b>motivo</b> que fundamenta el recurso, los <b>medios de prueba</b> de que pretenda valerse y, en su caso, las <b>medidas cautelares</b> cuya adopción solicite.</li>\n<li><b>Documentos que se acompañan:</b>\n <ul><li><b>a)</b> el que acredite la <b>representación</b>;</li>\n <li><b>b)</b> los que acrediten la <b>legitimación</b> cuando se ostente por transmisión;</li>\n <li><b>c)</b> la <b>copia del acto</b> recurrido o indicación del expediente, boletín o perfil en que se haya publicado;</li>\n <li><b>d)</b> los documentos en que <b>funde su derecho</b>;</li>\n <li><b>e)</b> una <b>dirección de correo electrónico «habilitada»</b> para las comunicaciones y notificaciones.</li></ul></li>\n<li><b>Subsanación (51.2):</b> se requerirá al interesado para que en <b>tres días hábiles</b> desde el siguiente a la notificación subsane la falta o acompañe los documentos preceptivos, con indicación de que si no lo hiciera <b>se le tendrá por desistido</b>, quedando suspendida la tramitación.</li>\n<li><b>Lugar (51.3):</b> el escrito se presenta en el <b>registro del órgano de contratación</b> o en el del <b>órgano competente para resolver</b>.</li>\n</ul>", "llano": "<p>El escrito tiene que decir qué se recurre, por qué, con qué pruebas y si se piden medidas cautelares. Se acompañan los papeles que acreditan quién eres y en qué te apoyas, y un correo electrónico habilitado para que te notifiquen.</p>\n<p>Si falta algo, te dan <b>tres días hábiles</b>. Si no lo arreglas, te tienen por desistido.</p>", "porque": "<p>Porque un procedimiento que debe resolverse en semanas no puede permitirse plazos de subsanación largos. Los <b>tres días hábiles</b> —frente a los diez del art. 68.1 LPAC— son la traducción procedimental de la urgencia: el recurso especial existe para actuar antes de que el contrato nazca.</p>\n<p>Y la dirección de correo <b>habilitada</b> tiene la misma función: notificar en horas, no en días.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> presentar una reclamación con el DNI, el contrato y el recibo. Si falta el recibo, te dan unos días para traerlo.</li>\n<li><b>Real:</b> una empresa interpone el recurso contra el PCAP el 20 de febrero en el registro del propio ayuntamiento, aportando el poder del firmante, copia del anuncio y una dirección de correo habilitada. Omite el documento en que funda su derecho; se le requiere el 22 y subsana el 24, dentro de los tres días hábiles.</li>\n<li><b>Caso límite:</b> si no hubiera subsanado, se le tendría por <b>desistido</b>, y el plazo de quince días hábiles ya habría vencido: el recurso se perdería definitivamente.</li>\n</ul>", "noej": "<ul>\n<li><b>No son diez días</b> de subsanación como en el art. 68.1 LPAC: son <b>tres días hábiles</b>.</li>\n<li><b>No se presenta</b> solo ante el tribunal: cabe también el <b>registro del órgano de contratación</b>.</li>\n<li><b>No basta</b> un correo cualquiera: la ley exige una dirección de correo electrónico <b>«habilitada»</b>.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 50:</b> plazo de interposición.</li>\n<li><b>Art. 49:</b> medidas cautelares, que pueden pedirse en este escrito.</li>\n<li><b>Art. 52:</b> acceso al expediente.</li>\n<li><b>Art. 55.b):</b> falta de acreditación de la representación como causa de inadmisión.</li>\n<li><b>Art. 68.1 LPAC</b> <i>(otra norma de la biblioteca)</i>: los diez días de subsanación del procedimiento común, que aquí se reducen a tres.</li>\n</ul>", "trampas": "<ul>\n<li><b>Tres días hábiles</b> de subsanación. Es el plazo más corto de todo el bloque.</li>\n<li>El efecto de no subsanar es tenerle por <b>desistido</b>, igual que en la LPAC.</li>\n<li>Cabe presentar el recurso en <b>dos</b> registros: el del órgano de contratación y el del tribunal.</li>\n</ul>", "ancla": "<p><b>«Tres días y a la calle.»</b> Frente a los diez de la LPAC, aquí solo hay tres.</p>", "vis": "<svg viewBox=\"0 0 960 267\" role=\"img\" aria-label=\"Forma de interposición del recurso especial y acceso al expediente\" style=\"width:100%;height:auto\"><defs><marker id=\"fl7\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr7\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe7\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw7\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"250\" y=\"8\" width=\"460\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"27.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">CÓMO SE INTERPONE · ARTS. 51 Y 52</text><rect x=\"20\" y=\"52\" width=\"219.5\" height=\"205\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"129.75\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--acc)\">EN EL ESCRITO</text><text x=\"129.75\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">El acto recurrido</text><text x=\"129.75\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"129.75\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">El motivo que fundamenta</text><text x=\"129.75\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">el recurso</text><text x=\"129.75\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"129.75\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Los medios de prueba</text><text x=\"129.75\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"129.75\" y=\"180\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Las medidas cautelares</text><text x=\"129.75\" y=\"193\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">que se soliciten</text><text x=\"129.75\" y=\"206\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"129.75\" y=\"219\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 51.1</text><rect x=\"253.5\" y=\"52\" width=\"219.5\" height=\"205\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"363.25\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--acc)\">SE ACOMPAÑA</text><text x=\"363.25\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">a) documento de</text><text x=\"363.25\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">representación</text><text x=\"363.25\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">b) documento de</text><text x=\"363.25\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">legitimación derivada</text><text x=\"363.25\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">c) copia del acto</text><text x=\"363.25\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">recurrido o indicación</text><text x=\"363.25\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">del expediente o boletín</text><text x=\"363.25\" y=\"180\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">d) documentos en que</text><text x=\"363.25\" y=\"193\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">funde su derecho</text><text x=\"363.25\" y=\"206\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">e) dirección de correo</text><text x=\"363.25\" y=\"219\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">electrónico habilitada</text><rect x=\"487\" y=\"52\" width=\"219.5\" height=\"205\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"596.75\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--warn)\">SUBSANACIÓN</text><text x=\"596.75\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">TRES DÍAS HÁBILES desde</text><text x=\"596.75\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">el siguiente a la</text><text x=\"596.75\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">notificación del</text><text x=\"596.75\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">requerimiento</text><text x=\"596.75\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"596.75\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Si no subsana: se le tiene</text><text x=\"596.75\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">por DESISTIDO</text><text x=\"596.75\" y=\"180\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"596.75\" y=\"193\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 51.2</text><rect x=\"720.5\" y=\"52\" width=\"219.5\" height=\"205\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"830.25\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--ej)\">ACCESO AL EXPEDIENTE</text><text x=\"830.25\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Se solicita al órgano de</text><text x=\"830.25\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">contratación dentro del</text><text x=\"830.25\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">plazo de interposición</text><text x=\"830.25\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"830.25\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">El órgano debe facilitarlo</text><text x=\"830.25\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">en CINCO DÍAS HÁBILES</text><text x=\"830.25\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"830.25\" y=\"180\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">La solicitud NO paraliza</text><text x=\"830.25\" y=\"193\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">el plazo para recurrir</text><text x=\"830.25\" y=\"206\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"830.25\" y=\"219\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 52.1 y 52.2</text></svg>"}, {"n": 52, "t": "Acceso al expediente", "ubic": "Libro I ▸ Título I ▸ Capítulo V · Del recurso especial en materia de contratación", "idea": "Se puede pedir ver el expediente antes de recurrir, pero el plazo no se para.", "literal": "<p><b>1.</b> Si el interesado desea examinar el expediente de contratación de forma previa a la interposición del recurso especial, deberá solicitarlo al órgano de contratación, el cual tendrá la obligación de ponerlo de manifiesto sin perjuicio de los límites de confidencialidad establecidos en la Ley.</p><p><b>2.</b> Los interesados podrán hacer la solicitud de acceso al expediente dentro del plazo de interposición del recurso especial, debiendo el órgano de contratación facilitar el acceso en los cinco días hábiles siguientes a la recepción de la solicitud. La presentación de esta solicitud no paralizará en ningún caso el plazo para la interposición del recurso especial.</p><p><b>3.</b> El incumplimiento de las previsiones contenidas en el apartado 1 anterior no eximirá a los interesados de la obligación de interponer el recurso especial dentro del plazo legalmente establecido. Ello no obstante, el citado incumplimiento podrá ser alegado por el recurrente en su recurso, en cuyo caso el órgano competente para resolverlo deberá conceder al recurrente el acceso al expediente de contratación en sus oficinas por plazo de diez días, con carácter previo al trámite de alegaciones, para que proceda a completar su recurso. En este supuesto concederá un plazo de dos días hábiles al órgano de contratación para que emita el informe correspondiente y cinco días hábiles a los restantes interesados para que efectúen las alegaciones que tuvieran por conveniente.</p><div class=\"box warn\" style=\"margin-top:.7rem\"><span class=\"lbl\">Nota del BOE al pie del precepto · no forma parte del texto articulado</span><p>Téngase en cuenta que se declara que no son conformes con el orden constitucional de competencias los incisos destacados del apartado 3 [fundamento jurídico 6 E) c)] por la Sentencia del TC 68/2021, de 18 de marzo. Ref. BOE-A-2021-6614</p></div>", "dis": "<ul>\n<li><b>Solicitud (52.1):</b> si el interesado desea examinar el expediente <b>de forma previa</b> a la interposición, debe solicitarlo al <b>órgano de contratación</b>, que tiene la <b>obligación de ponerlo de manifiesto</b>, con los límites de confidencialidad establecidos en la ley.</li>\n<li><b>Plazos (52.2):</b> la solicitud puede hacerse <b>dentro del plazo de interposición</b> del recurso, y el órgano de contratación debe facilitar el acceso en los <b>cinco días hábiles</b> siguientes a su recepción. «La presentación de esta solicitud <b>no paralizará en ningún caso</b> el plazo para la interposición del recurso especial».</li>\n<li><b>Incumplimiento (52.3):</b> no exime de recurrir en plazo, pero puede alegarse en el recurso; en tal caso el órgano competente concederá el acceso en sus oficinas por plazo de <b>diez días</b>, previo al trámite de alegaciones, para completar el recurso, con <b>dos días hábiles</b> de informe del órgano de contratación y <b>cinco días hábiles</b> de alegaciones a los demás interesados.</li>\n</ul>", "llano": "<p>Antes de recurrir puedes pedir ver el expediente, y te lo tienen que enseñar en cinco días hábiles. Pero cuidado: <b>el reloj no se para</b>. Si te dan el expediente el día catorce, sigues teniendo hasta el quince.</p>\n<p>Si no te lo enseñan, tienes que recurrir igual, y luego alegarlo: entonces el tribunal te dará diez días para completar el recurso.</p>", "porque": "<p>Porque el plazo de quince días hábiles está pensado para encajar con el plazo de espera del art. 153.3: si el acceso al expediente lo suspendiera, bastaría con pedirlo para retrasar indefinidamente la formalización de cualquier contrato.</p>\n<p>La compensación es el art. 52.3: el perjuicio de no haber podido ver el expediente se repara <b>después</b>, dentro del propio recurso, no antes ampliando el plazo.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> pedir ver el acta de una reunión antes de impugnarla. Si tardan en dártela, el plazo para impugnar sigue corriendo.</li>\n<li><b>Real:</b> notificada la adjudicación el 16 de mayo, una empresa solicita el 20 el acceso al expediente. El ayuntamiento debe facilitarlo antes del <b>27 de mayo</b> —cinco días hábiles—. El plazo de quince días hábiles para recurrir sigue corriendo desde el 17.</li>\n<li><b>Caso límite:</b> el ayuntamiento no facilita el acceso. La empresa debe recurrir igualmente en plazo y alegarlo; el tribunal le concederá <b>diez días</b> de acceso en sus oficinas antes del trámite de alegaciones.</li>\n</ul>", "noej": "<ul>\n<li><b>No suspende</b> el plazo de interposición. Es la regla que más cara sale.</li>\n<li><b>No exime</b> de recurrir en plazo el incumplimiento del órgano de contratación.</li>\n<li><b>No es ilimitado</b> el acceso: rigen los límites de <b>confidencialidad</b> y secretos comerciales.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 50:</b> plazo de quince días hábiles, que no se paraliza.</li>\n<li><b>Art. 56.5:</b> el órgano que resuelve debe garantizar la confidencialidad y los secretos comerciales.</li>\n<li><b>Art. 133:</b> confidencialidad en la contratación.</li>\n<li><b>Art. 151.2:</b> la notificación debe contener información suficiente para recurrir sin necesidad del expediente completo.</li>\n</ul>", "trampas": "<ul>\n<li>«<b>No paralizará en ningún caso</b>»: literal del 52.2.</li>\n<li><b>Cinco días hábiles</b> para facilitar el acceso; <b>diez días</b> si lo concede después el tribunal.</li>\n<li>El art. 52.3 tiene incisos declarados no conformes con el orden constitucional de competencias por la STC 68/2021: la nota del BOE lo advierte.</li>\n</ul>", "ancla": "<p><b>«Mira el expediente si puedes, pero recurre igual.»</b> El reloj no se para nunca.</p>", "vis": "<svg viewBox=\"0 0 960 267\" role=\"img\" aria-label=\"Forma de interposición del recurso especial y acceso al expediente\" style=\"width:100%;height:auto\"><defs><marker id=\"fl8\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr8\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe8\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw8\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"250\" y=\"8\" width=\"460\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"27.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">CÓMO SE INTERPONE · ARTS. 51 Y 52</text><rect x=\"20\" y=\"52\" width=\"219.5\" height=\"205\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"129.75\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--acc)\">EN EL ESCRITO</text><text x=\"129.75\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">El acto recurrido</text><text x=\"129.75\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"129.75\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">El motivo que fundamenta</text><text x=\"129.75\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">el recurso</text><text x=\"129.75\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"129.75\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Los medios de prueba</text><text x=\"129.75\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"129.75\" y=\"180\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Las medidas cautelares</text><text x=\"129.75\" y=\"193\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">que se soliciten</text><text x=\"129.75\" y=\"206\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"129.75\" y=\"219\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 51.1</text><rect x=\"253.5\" y=\"52\" width=\"219.5\" height=\"205\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"363.25\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--acc)\">SE ACOMPAÑA</text><text x=\"363.25\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">a) documento de</text><text x=\"363.25\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">representación</text><text x=\"363.25\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">b) documento de</text><text x=\"363.25\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">legitimación derivada</text><text x=\"363.25\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">c) copia del acto</text><text x=\"363.25\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">recurrido o indicación</text><text x=\"363.25\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">del expediente o boletín</text><text x=\"363.25\" y=\"180\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">d) documentos en que</text><text x=\"363.25\" y=\"193\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">funde su derecho</text><text x=\"363.25\" y=\"206\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">e) dirección de correo</text><text x=\"363.25\" y=\"219\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">electrónico habilitada</text><rect x=\"487\" y=\"52\" width=\"219.5\" height=\"205\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"596.75\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--warn)\">SUBSANACIÓN</text><text x=\"596.75\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">TRES DÍAS HÁBILES desde</text><text x=\"596.75\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">el siguiente a la</text><text x=\"596.75\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">notificación del</text><text x=\"596.75\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">requerimiento</text><text x=\"596.75\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"596.75\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Si no subsana: se le tiene</text><text x=\"596.75\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">por DESISTIDO</text><text x=\"596.75\" y=\"180\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"596.75\" y=\"193\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 51.2</text><rect x=\"720.5\" y=\"52\" width=\"219.5\" height=\"205\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"830.25\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--ej)\">ACCESO AL EXPEDIENTE</text><text x=\"830.25\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Se solicita al órgano de</text><text x=\"830.25\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">contratación dentro del</text><text x=\"830.25\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">plazo de interposición</text><text x=\"830.25\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"830.25\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">El órgano debe facilitarlo</text><text x=\"830.25\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">en CINCO DÍAS HÁBILES</text><text x=\"830.25\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"830.25\" y=\"180\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">La solicitud NO paraliza</text><text x=\"830.25\" y=\"193\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">el plazo para recurrir</text><text x=\"830.25\" y=\"206\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"830.25\" y=\"219\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 52.1 y 52.2</text></svg>"}, {"n": 55, "t": "Inadmisión", "ubic": "Libro I ▸ Título I ▸ Capítulo V · Del recurso especial en materia de contratación", "idea": "Cuatro causas tasadas y siempre que consten de modo inequívoco y manifiesto.", "literal": "<p>El órgano encargado de resolver el recurso, tras la reclamación y examen del expediente administrativo, podrá declarar su inadmisión cuando constare de modo inequívoco y manifiesto cualquiera de los siguientes supuestos:</p><p style=\"margin-left:1.1rem\">a) La incompetencia del órgano para conocer del recurso.</p><p style=\"margin-left:1.1rem\">b) La falta de legitimación del recurrente o de acreditación de la representación de la persona que interpone el recurso en nombre de otra, mediante poder que sea suficiente a tal efecto.</p><p style=\"margin-left:1.1rem\">c) Haberse interpuesto el recurso contra actos no susceptibles de impugnación de conformidad con lo dispuesto en el artículo 44.</p><p style=\"margin-left:1.1rem\">d) La interposición del recurso, una vez finalizado el plazo establecido para su interposición. Si el órgano encargado de resolverlo apreciara que concurre alguno de ellos, sin perjuicio de lo previsto en el artículo 51.2, dictará resolución acordando la inadmisión del recurso.</p>", "dis": "<ul>\n<li><b>Momento de la <span class=\"t\" data-k=\"inadmis\">inadmisión</span>:</b> el órgano encargado de resolver, <b>tras la reclamación y examen del expediente administrativo</b>, podrá declarar la inadmisión.</li>\n<li><b>Requisito:</b> que la causa conste «de modo <b>inequívoco y manifiesto</b>».</li>\n<li><b>Las cuatro causas:</b>\n <ul><li><b>a)</b> la <b>incompetencia</b> del órgano para conocer del recurso;</li>\n <li><b>b)</b> la <b>falta de legitimación</b> del recurrente o de acreditación de la representación mediante poder suficiente;</li>\n <li><b>c)</b> haberse interpuesto contra <b>actos no susceptibles de impugnación</b> conforme al art. 44;</li>\n <li><b>d)</b> la interposición <b>una vez finalizado el plazo</b> establecido.</li></ul></li>\n<li><b>Efecto:</b> apreciada alguna de ellas, <b>sin perjuicio de la subsanación del art. 51.2</b>, se dictará resolución acordando la inadmisión.</li>\n</ul>", "llano": "<p>Hay cuatro motivos por los que el tribunal puede rechazar el recurso sin entrar en el fondo: que no sea competente, que quien recurre no esté legitimado o no acredite la representación, que el acto no sea de los recurribles y que se haya presentado tarde.</p>\n<p>Y una cautela importante: la causa tiene que ser <b>evidente</b>. Ante la duda, se entra en el fondo.</p>", "porque": "<p>Porque la inadmisión es la forma más rápida de vaciar de contenido un recurso. Al exigir que la causa conste «de modo inequívoco y manifiesto», la ley impide que la inadmisión se convierta en un atajo para no resolver.</p>\n<p>Y la remisión al art. 51.2 es la garantía práctica: un defecto de representación no se resuelve inadmitiendo, sino <b>req

td><td>—<\/td><td>—<\/td><\/tr>\n<tr><td>11<\/td><td>Una concesión de servicios no armonizada que agrupe <b>dos o más servicios públicos<\/b><\/td><td>Órgano de contratación, justificándolo<\/td><td>Municipios de <b>menos de 20.000<\/b> hab. · anualidad media <b>≤ 200.000 €<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Los siete casos de informe jurídico preceptivo del Secretario (ap. 8):<\/b> aprobación de expedientes de contratación · modificación de contratos · revisión de precios · prórrogas · mantenimiento del equilibrio económico · interpretación · resolución.<\/p>", "llano": "<p>Esta disposición adapta la Ley a cómo funciona un ayuntamiento. El dinero lo controla el <b>Interventor<\/b> y la legalidad la informa el <b>Secretario<\/b>.<\/p>\n<p>Un ayuntamiento puede preparar y adjudicar un contrato antes de tener el dinero seguro, siempre que la adjudicación quede condicionada a que llegue.<\/p>\n<p>Los pueblos de menos de 5.000 habitantes tienen atajos: un certificado de que hay crédito en lugar de aprobar el gasto, y obras grandes divididas en proyectos por fases. Los de menos de 20.000 pueden juntar varios servicios en una sola concesión pequeña.<\/p>", "porque": "<p><b>Explicación:<\/b> en la Administración local no hay asesoría jurídica ni intervención delegada como en el Estado. Esas funciones las ejercen los <b>funcionarios con habilitación nacional<\/b> (Secretario e Interventor). La disposición les asigna expresamente las tareas que la Ley atribuye en general a «servicios jurídicos» y «órganos de control».<\/p>\n<p>Las reglas para los municipios pequeños reconocen que tienen pocos medios: por eso se apoyan en la Diputación (supervisión, asistencia) y se les permite simplificar trámites.<\/p>\n<p>La tramitación anticipada responde a que muchas obras locales dependen de subvenciones de otras Administraciones. Sin ella, no podría licitarse hasta tener la subvención concedida y se perdería un ejercicio entero.<\/p>", "ej": "<ul>\n<li><b>Cotidiano:<\/b> firmas con el albañil la reforma de tu cocina «si el banco me concede el préstamo». El contrato existe, pero solo despliega efectos si llega el dinero: eso es una condición suspensiva.<\/li>\n<li><b>Real:<\/b> el Ayuntamiento de Cortijo Alto (3.200 habitantes) pide a la Diputación una subvención para asfaltar caminos rurales (VE 90.000 €). Sin esperar a la resolución, tramita el contrato y lo adjudica <b>bajo la condición suspensiva<\/b> de que se conceda la subvención (ap. 2). Como tiene menos de 5.000 habitantes, la Secretaria-Interventora sustituye la aprobación del gasto por una <b>certificación de existencia de crédito<\/b> (ap. 4).<\/li>\n<li><b>Caso límite:<\/b> Villanueva del Llano tiene exactamente <b>5.000<\/b> habitantes. No puede usar la certificación del ap. 4 ni dividir la obra del ap. 7: la Ley dice «menos de» e «inferior a» 5.000, y 5.000 no es inferior a 5.000.<\/li>\n<\/ul>", "noej": "<ul>\n<li><b>Un contrato menor<\/b> de 9.000 €: el Interventor no tiene que fiscalizar la valoración de sus repercusiones en la estabilidad presupuestaria. El ap. 3 excluye expresamente los menores.<\/li>\n<li><b>Un municipio de 25.000 habitantes<\/b> no puede agrupar dos servicios públicos en una concesión con la regla del ap. 11, aunque la anualidad sea de 150.000 €.<\/li>\n<li><b>El director de obra<\/b> no puede ser el técnico que asiste al Interventor en la recepción. La Ley exige que sea otra persona, distinta también del responsable del contrato.<\/li>\n<li><b>Aplazar 4 años el pago<\/b> de un contrato de servicios no está amparado: el ap. 9 solo habla de adquisición de inmuebles y de títulos de capital.<\/li>\n<\/ul>", "conex": "<ul>\n<li><b>DA 2.ª:<\/b> las dos forman el régimen local de contratación (ap. 1).<\/li>\n<li><b>Art. 117.2:<\/b> la tramitación anticipada general. El ap. 2 la amplía a financiación pendiente de préstamo o subvención.<\/li>\n<li><b>Art. 235:<\/b> supervisión de proyectos. Arts. 99 y 101: prohibición de fraccionar y valor estimado, que siguen rigiendo aunque la obra se divida en proyectos (ap. 7).<\/li>\n<li><b>Art. 228:<\/b> centrales de contratación. <b>TRLHL art. 214.2.d)<\/b>, en tu biblioteca: comprobación material de la inversión.<\/li>\n<li><b>Ley 19/2013<\/b> (en tu biblioteca): su coordinación en el ayuntamiento corresponde al Secretario (ap. 8).<\/li>\n<li><b>Aparente contradicción:<\/b> el ap. 4 permite sustituir la aprobación del gasto por un certificado, y el art. 116 exige aprobar el gasto. Se resuelve por especialidad: la DA 3.ª es la norma especial para municipios de menos de 5.000 habitantes.<\/li>\n<\/ul>", "trampas": "<ul>\n<li><b>Interventor fiscaliza, Secretario informa.<\/b> Es lo que más se pregunta.<\/li>\n<li>El informe jurídico del Secretario es <b>preceptivo<\/b> en siete casos (ap. 8). La prórroga y la revisión de precios están entre ellos.<\/li>\n<li><b>5.000<\/b> habitantes: aps. 4 y 7 (y DA 2.ª.3 y 6). <b>20.000<\/b> habitantes y <b>200.000 €<\/b> de anualidad media: ap. 11.<\/li>\n<li>Ap. 11: solo concesiones de servicios <b>no armonizadas<\/b>, de <b>dos o más<\/b> servicios públicos.<\/li>\n<li>El técnico que asiste en la recepción ≠ director de obra ≠ responsable del contrato.<\/li>\n<li>Gran población: los informes los emite el <b>titular de la asesoría jurídica<\/b>, no el Secretario.<\/li>\n<\/ul>", "ancla": "<p><b>«FIS-INF»:<\/b> el Interventor <b>FIS<\/b>caliza; el Secretario <b>INF<\/b>orma.<\/p>\n<p><b>«PRIMERE»<\/b>, los siete informes del Secretario: <b>P<\/b>rórrogas · <b>R<\/b>esolución · <b>I<\/b>nterpretación · <b>M<\/b>odificación · <b>E<\/b>xpedientes · <b>R<\/b>evisión de precios · <b>E<\/b>quilibrio económico.<\/p>\n<p><b>Cifras: 5.000 · 20.000 · 200.000 · 4 años.<\/b><\/p>", "vis": "<svg viewBox=\"0 0 640 500\" role=\"img\" aria-label=\"Reparto de funciones de la DA 3.ª\" style=\"width:100%;height:auto\"><defs><marker id=\"k7welj\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\"><path d=\"M0 0 L9 4.5 L0 9 z\" fill=\"var(--acc)\"/></marker><marker id=\"k7weljs\" markerWidth=\"9\" markerHeight=\"9\" refX=\"1\" refY=\"4.5\" orient=\"auto\"><path d=\"M9 0 L0 4.5 L9 9 z\" fill=\"var(--acc)\"/></marker></defs><rect x=\"219.1\" y=\"8\" width=\"201.8\" height=\"30\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"320\" y=\"27\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">Quién hace qué en la DA 3.ª</text><rect x=\"12\" y=\"50\" width=\"616\" height=\"52\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"24\" y=\"60\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"99\" y=\"80\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">Interventor</text><text x=\"186\" y=\"72.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Fiscaliza, también las repercusiones en estabilidad (salvo menores)</text><text x=\"186\" y=\"86.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Comprobación material de la inversión · muestreo · técnico ≠ director de obra</text><text x=\"616\" y=\"70\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">DA 3.ª.3</text><rect x=\"12\" y=\"124\" width=\"616\" height=\"52\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"24\" y=\"134\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"99\" y=\"154\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">Secretario</text><text x=\"186\" y=\"146.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Informes jurídicos: PRIMERE (siete casos) · coordina la transparencia</text><text x=\"186\" y=\"160.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Gran población: asesoría jurídica y Órgano de Apoyo a la JGL</text><text x=\"616\" y=\"144\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">DA 3.ª.8</text><rect x=\"12\" y=\"198\" width=\"616\" height=\"52\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><rect x=\"24\" y=\"208\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--ej)\"/><text x=\"99\" y=\"228\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">Diputación</text><text x=\"186\" y=\"220.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Supervisa proyectos si el municipio carece de oficina · asiste a los</text><text x=\"186\" y=\"234.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">pequeños</text><text x=\"616\" y=\"218\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">DA 3.ª.3 y 6</text><rect x=\"12\" y=\"272\" width=\"616\" height=\"52\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"24\" y=\"282\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"99\" y=\"302\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--warn)\">&lt; 5.000 hab.</text><text x=\"186\" y=\"294.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Certificación de existencia de crédito en vez de aprobación del gasto</text><text x=\"186\" y=\"308.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Obra plurianual por proyectos independientes (sin fraccionar: arts. 99 y 101)</text><text x=\"616\" y=\"292\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">DA 3.ª.4 y 7</text><rect x=\"12\" y=\"346\" width=\"616\" height=\"52\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"24\" y=\"356\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"99\" y=\"376\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--warn)\">&lt; 20.000 hab.</text><text x=\"186\" y=\"368.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Concesión no SARA de 2 o más servicios públicos · anualidad media ≤ 200.000</text><text x=\"186\" y=\"382.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">€</text><text x=\"616\" y=\"366\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">DA 3.ª.11</text><rect x=\"12\" y=\"420\" width=\"616\" height=\"72\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><rect x=\"24\" y=\"440\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--exc)\"/><text x=\"99\" y=\"460\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--exc)\">Financiación</text><text x=\"186\" y=\"438.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Tramitación anticipada con condición suspensiva · inmuebles: pago en ≤</text><text x=\"186\" y=\"452.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">4 años</text><text x=\"186\" y=\"466.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Centrales de contratación: estatal, autonómicas, locales, de</text><text x=\"186\" y=\"480.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">asociaciones, AGE</text><text x=\"616\" y=\"440\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">DA 3.ª.2, 9 y 10</text><path d=\"M320 103 L 320 122\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#k7welj)\"/><path d=\"M320 177 L 320 196\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#k7welj)\"/><path d=\"M320 251 L 320 270\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#k7welj)\"/><path d=\"M320 325 L 320 344\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#k7welj)\"/><path d=\"M320 399 L 320 418\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#k7welj)\"/></svg>", "literal": "<p><b>1.<\/b> Las Administraciones Públicas locales aplicarán las reglas contenidas en esta Ley, con las especialidades que se recogen en la disposición adicional anterior y en la presente.<\/p><p><b>2.<\/b> Se podrán tramitar anticipadamente los contratos cuya ejecución material haya de comenzar en el ejercicio siguiente o aquellos cuya financiación dependa de un préstamo, un crédito o una subvención solicitada a otra entidad pública o privada, sometiendo la adjudicación a la condición suspensiva de la efectiva consolidación de los recursos que han de financiar el contrato correspondiente.<\/p><p><b>3.<\/b> Los actos de fiscalización se ejercen por el órgano Interventor de la Entidad local. Esta fiscalización recaerá también sobre la valoración que se incorpore al expediente de contratación sobre las repercusiones de cada nuevo contrato, excepto los contratos menores, en el cumplimiento por la Entidad local de los principios de estabilidad presupuestaria y sostenibilidad financiera que exige el artículo 7.3 de la Ley Orgánica 2/2012, de 27 de abril, de Estabilidad Presupuestaria y Sostenibilidad Financiera. El órgano interventor realizará la comprobación material de la inversión en el ejercicio de la función señalada en el artículo 214.2.d) del Real Decreto Legislativo 2/2004, de 5 de marzo, por el que se aprueba el texto refundido de la Ley Reguladora de las Haciendas Locales, en los términos desarrollados en el artículo 20 del Real Decreto 424/2017, de 28 de abril, por el que se regula el régimen jurídico del control interno en las entidades del Sector Público Local. A efectos de la designación de representante en aquellas inversiones cuyo objeto sea susceptible de comprobación, el órgano interventor podrá aplicar técnicas de muestreo. Podrá estar asistido en la recepción por un técnico especializado en el objeto del contrato, que deberá ser diferente del director de obra y del responsable del contrato. Los servicios de asistencia de las Diputaciones Provinciales asistirán a los pequeños Municipios a estos efectos y los demás previstos en la Ley.<\/p><p><b>4.<\/b> En los contratos celebrados en los municipios de menos de 5.000 habitantes, la aprobación del gasto podrá ser sustituida por una certificación de existencia de crédito que se expedirá por el Secretario Interventor o, en su caso, por el Interventor de la Corporación.<\/p><p><b>5.<\/b> En los contratos de concesión de obras y de servicios, el expediente acreditativo de la conveniencia y oportunidad de la medida que exige el artículo 86.1 de la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local, con el contenido reglamentariamente determinado, se tramitará conjuntamente con el estudio de viabilidad regulado en esta Ley.<\/p><p><b>6.<\/b> Serán de aplicación a los contratos de obras las normas sobre supervisión de proyectos establecidas en el artículo 235. La supervisión podrá efectuarse por las oficinas o unidades competentes de la propia entidad contratante o, en el caso de municipios que carezcan de ellas, por las de la correspondiente Diputación provincial o Administración autonómica uniprovincial. En el acuerdo de aprobación de los proyectos se recogerá expresamente la referencia a la supervisión favorable del mismo.<\/p><p><b>7.<\/b> En los municipios de población inferior a 5.000 habitantes, en los contratos de obras cuya financiación exceda de un presupuesto anual, podrán redactarse proyectos independientes relativos a cada una de las partes de la obra, siempre que estas sean susceptibles de utilización separada en el sentido del uso general o del servicio, o puedan ser sustancialmente definidas. La ejecución de cada uno de los proyectos podrá ser objeto de un contrato diferente, sin perjuicio de la aplicación de los artículos 99 y 101.<\/p><p><b>8.<\/b> Los informes que la Ley asigna a los servicios jurídicos se evacuarán por el Secretario. Será también preceptivo el informe jurídico del Secretario en la aprobación de expedientes de contratación, modificación de contratos, revisión de precios, prórrogas, mantenimiento del equilibrio económico, interpretación y resolución de los contratos. Corresponderá también al Secretario la coordinación de las obligaciones de publicidad e información que se establecen en la Ley 19/2013, de 9 de diciembre, de Transparencia, Acceso a la Información Pública y Buen Gobierno.<\/p><p>Conforme a lo dispuesto en la letra e) de la disposición adicional octava de la Ley 7/1985, de 2 de abril, Reguladoras de las Bases del Régimen Local, en los municipios acogidos al régimen regulado en su Título X, corresponderá al titular de la asesoría jurídica la emisión de los informes atribuidos al Secretario en el presente apartado. La coordinación de las obligaciones de publicidad e información antedichas corresponderá al titular del Órgano de Apoyo a la Junta de Gobierno.<\/p><p><b>9.<\/b> En los contratos que tengan por objeto la adquisición de bienes inmuebles, el importe de la adquisición podrá ser objeto de un aplazamiento de hasta cuatro años, con sujeción a los trámites previstos en la normativa reguladora de las Haciendas Locales para los compromisos de gastos futuros. Este aplazamiento también podrá ser utilizado para la adquisición de títulos representativos de la titularidad del capital de entidades que formen parte del sector público de la Entidad local para su reestructuración.<\/p><p><b>10.<\/b> Las Entidades Locales, sin perjuicio de la posibilidad de adherirse al sistema estatal de contratación centralizada y a las centrales de contratación de las Comunidades Autónomas y de otras Entidades Locales, tal y como prevé el apartado 3 del artículo 228, podrán adherirse también a las centrales de contratación que creen conforme a esta Ley las asociaciones de entidades locales a que se refiere la disposición adicional quinta de la Ley 7/1985, de 2 de abril, así como a las creadas por la Administración General del Estado.<\/p><p><b>11.<\/b> Los Municipios de población inferior a 20.000 habitantes podrán licitar contratos no sujetos a regulación armonizada de concesión de servicios que se refieran a la gestión de dos o más servicios públicos diferentes siempre y cuando la anualidad media del contrato no supere los 200.000 euros, y el órgano de contratación justifique en el expediente de contratación esta decisión en base a la necesidad objetiva de proceder a la gestión unificada de dichos servicios. En todo caso, el pliego de cláusulas administrativas particulares precisará el ámbito funcional y territorial del contrato de concesión de servicios.<\/p>", "n": 3}, {"id": "da4", "lab": "DA 4.ª", "t": "Contratos reservados", "ubic": "Ley 9/2017 ▸ Parte final ▸ Disposiciones adicionales · Cláusula social de la Ley: se conecta con la división en lotes (art. 99.4) y con las condiciones especiales de ejecución (art. 202)", "idea": "Una parte de los contratos se reserva a centros especiales de empleo y empresas de inserción.", "dis": "<ul>\n<li><b>Quién fija la reserva:<\/b> el Consejo de Ministros o el órgano competente de la Comunidad Autónoma o de la Entidad Local, mediante <b>Acuerdo<\/b>. El Acuerdo fija <b>porcentajes mínimos<\/b> y las condiciones mínimas para cumplirlos.<\/li>\n<li><b>Dos formas de reservar:<\/b>\n <ol><li>Reservar el <b>derecho a participar<\/b> en la licitación de ciertos contratos o lotes a <span class=\"t\" data-k=\"cee\">Centros Especiales de Empleo de iniciativa social<\/span> y a <span class=\"t\" data-k=\"insercion\">empresas de inserción<\/span>.<\/li>\n <li>Reservar un porcentaje mínimo de la <b>ejecución<\/b> a <span class=\"t\" data-k=\"protegido\">programas de empleo protegido<\/span>.<\/li><\/ol><\/li>\n<li><b>Requisito:<\/b> el porcentaje de trabajadores con discapacidad o en exclusión social será el de su normativa y, en todo caso, de <b>al menos el 30 %<\/b>.<\/li>\n<li><b>Sector público estatal sin Acuerdo:<\/b> si en un año no se aprobaba, reserva mínima del <b>7 %<\/b>, que sube al <b>10 %<\/b> a los cuatro años. Se calcula sobre el importe global de suministros y servicios de los CPV del anexo VI del ejercicio anterior.<\/li>\n<li><b>Anuncio (ap. 2):<\/b> <b>deberá<\/b> hacer referencia a esta disposición.<\/li>\n<li><b>Garantía (ap. 3):<\/b> <b>no procede<\/b> la garantía definitiva, salvo que el órgano la considere necesaria por motivos excepcionales y lo justifique en el expediente.<\/li>\n<\/ul>\n<div class=\"tw\"><table><thead><tr><th>Cifra<\/th><th>Qué es<\/th><th>Para quién<\/th><\/tr><\/thead><tbody>\n<tr><td><b>30 %<\/b><\/td><td>Mínimo de trabajadores con discapacidad o en exclusión<\/td><td>CEE, empresas de inserción, programas<\/td><\/tr>\n<tr><td><b>1 año<\/b><\/td><td>Plazo para el Acuerdo del Consejo de Ministros<\/td><td>Estado<\/td><\/tr>\n<tr><td><b>7 % → 10 %<\/b><\/td><td>Reserva supletoria (el 10 % a los 4 años)<\/td><td>Sector público estatal<\/td><\/tr>\n<\/tbody><\/table><\/div>", "llano": "<p>Las Administraciones deben apartar una parte de sus contratos para que solo puedan pujar por ellos empresas que dan trabajo a personas con discapacidad o en riesgo de exclusión. Al menos el 30 % de su plantilla tiene que estar en esa situación.<\/p>\n<p>Cada Administración fija su porcentaje. En esas licitaciones el anuncio tiene que decirlo y, normalmente, no se pide garantía definitiva.<\/p>", "porque": "<p><b>Explicación:<\/b> la contratación pública mueve mucho dinero y la Ley la usa también para fines sociales. Un centro especial de empleo difícilmente gana compitiendo con una gran empresa. Reservarle contratos le da un mercado estable y, con él, empleo para personas que de otro modo no lo tendrían.<\/p>\n<p>La exención de garantía definitiva responde a lo mismo: estas entidades suelen tener poco músculo financiero, y exigírsela las expulsaría de la licitación que se les reserva.<\/p>", "ej": "<ul>\n<li><b>Cotidiano:<\/b> las plazas de aparcamiento reservadas. No las puede usar cualquiera, solo quien tiene la tarjeta, y una señal lo advierte. Aquí la «señal» es la referencia obligatoria en el anuncio.<\/li>\n<li><b>Real:<\/b> la Diputación licita el mantenimiento de sus jardines en tres lotes y reserva el <b>lote 3<\/b> (jardines de la sede, 48.000 €) a centros especiales de empleo de iniciativa social y empresas de inserción. El anuncio cita la DA 4.ª. Al adjudicatario no se le pide garantía definitiva, porque la Diputación no ha justificado ningún motivo excepcional.<\/li>\n<li><b>Caso límite:<\/b> se presenta al lote 3 un centro especial de empleo de <b>iniciativa empresarial<\/b> (no social), con el 85 % de su plantilla con discapacidad. Debe quedar fuera: la reserva es para los de <b>iniciativa social<\/b>.<\/li>\n<\/ul>", "noej": "<ul>\n<li><b>Una empresa ordinaria<\/b> que se compromete a contratar a dos personas con discapacidad para ejecutar el contrato: eso es una <b>condición especial de ejecución<\/b> (art. 202), no un contrato reservado.<\/li>\n<li><b>Un contrato «reservado» a empresas del municipio<\/b> no tiene amparo en esta disposición: la reserva es por su fin social, no por el territorio.<\/li>\n<li><b>Una empresa de inserción<\/b> con solo el 20 % de su plantilla en exclusión no cumple el mínimo del 30 %.<\/li>\n<\/ul>", "conex": "<ul>\n<li><b>Art. 99.3 y 99.4:<\/b> la división en lotes permite reservar lotes «de conformidad con lo dispuesto en la disposición adicional cuarta».<\/li>\n<li><b>Art. 107:<\/b> la garantía definitiva del 5 %, que aquí, como regla, no se exige.<\/li>\n<li><b>Art. 202:<\/b> condiciones especiales de ejecución de tipo social. Es otra técnica distinta de la reserva.<\/li>\n<li><b>DA 48.ª:<\/b> otra reserva distinta, para ciertos contratos de servicios sociales, culturales y de salud (art. 99.4 la menciona junto a esta).<\/li>\n<li><b>Comparación:<\/b> el simplificado abreviado (art. 159.6.f) tampoco exige garantía definitiva, y allí sin excepciones. En la DA 4.ª cabe exigirla «por motivos excepcionales».<\/li>\n<\/ul>", "trampas": "<ul>\n<li>Son CEE <b>de iniciativa social<\/b>, no cualquier centro especial de empleo.<\/li>\n<li><b>Al menos el 30 %<\/b> de trabajadores con discapacidad o en exclusión.<\/li>\n<li>Los porcentajes del <b>7 %<\/b> y del <b>10 %<\/b> son la regla supletoria del <b>sector público estatal<\/b>. Las entidades locales fijan el suyo por Acuerdo.<\/li>\n<li>La referencia en el anuncio es <b>obligatoria<\/b> («deberá»).<\/li>\n<li>La garantía definitiva «no procederá», <b>salvo<\/b> motivos excepcionales justificados. No es una prohibición absoluta.<\/li>\n<\/ul>", "ancla": "<p><b>«3-7-10»:<\/b> <b>30<\/b> % de la plantilla · <b>7<\/b> % de reserva · <b>10<\/b> % a los cuatro años.<\/p>\n<p><b>«Reservado, anunciado y sin fianza»:<\/b> el anuncio lo dice y no hay garantía definitiva, salvo excepción motivada.<\/p>", "vis": "<svg viewBox=\"0 0 640 455\" role=\"img\" aria-label=\"Flujo del contrato reservado\" style=\"width:100%;height:auto\"><defs><marker id=\"km75ch\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\"><path d=\"M0 0 L9 4.5 L0 9 z\" fill=\"var(--acc)\"/></marker><marker id=\"km75chs\" markerWidth=\"9\" markerHeight=\"9\" refX=\"1\" refY=\"4.5\" orient=\"auto\"><path d=\"M9 0 L0 4.5 L9 9 z\" fill=\"var(--acc)\"/></marker></defs><rect x=\"189\" y=\"8\" width=\"262\" height=\"30\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"320\" y=\"27\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">Cómo funciona un contrato reservado</text><rect x=\"12\" y=\"50\" width=\"616\" height=\"52\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"24\" y=\"60\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"99\" y=\"80\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">Acuerdo</text><text x=\"186\" y=\"79.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Consejo de Ministros, CA o Entidad Local fija porcentajes mínimos y condiciones</text><text x=\"616\" y=\"70\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">DA 4.ª.1</text><rect x=\"12\" y=\"124\" width=\"616\" height=\"58\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"24\" y=\"137\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"99\" y=\"157\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">Qué se reserva</text><text x=\"186\" y=\"142.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">El derecho a participar (contratos o lotes) a CEE de iniciativa social y</text><text x=\"186\" y=\"156.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">empresas de inserción · o la ejecución en programas de empleo</text><text x=\"186\" y=\"170.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">protegido</text><text x=\"616\" y=\"144\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">DA 4.ª.1 y art. 99.4</text><rect x=\"12\" y=\"204\" width=\"616\" height=\"52\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"24\" y=\"214\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"99\" y=\"234\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--warn)\">Requisito</text><text x=\"186\" y=\"226.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Trabajadores con discapacidad o en exclusión: lo que diga su normativa y ≥ 30</text><text x=\"186\" y=\"240.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">%</text><text x=\"616\" y=\"224\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">DA 4.ª.1</text><rect x=\"12\" y=\"278\" width=\"616\" height=\"52\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><rect x=\"24\" y=\"288\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--ej)\"/><text x=\"99\" y=\"308\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">Anuncio</text><text x=\"186\" y=\"307.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Debe hacer referencia expresa a la DA 4.ª</text><text x=\"616\" y=\"298\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">DA 4.ª.2</text><rect x=\"12\" y=\"352\" width=\"616\" height=\"52\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><rect x=\"24\" y=\"362\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--ej)\"/><text x=\"99\" y=\"382\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">Garantía</text><text x=\"186\" y=\"381.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">No procede la definitiva, salvo motivos excepcionales justificados</text><text x=\"616\" y=\"372\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">DA 4.ª.3</text><rect x=\"12\" y=\"416\" width=\"616\" height=\"31\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"320\" y=\"435\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">Estado sin Acuerdo: 7 %, que sube al 10 % a los 4 años, sobre suministros y servicios del anexo VI</text><path d=\"M320 103 L 320 122\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#km75ch)\"/><path d=\"M320 183 L 320 202\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#km75ch)\"/><path d=\"M320 257 L 320 276\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#km75ch)\"/><path d=\"M320 331 L 320 350\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#km75ch)\"/></svg>", "literal": "<p><b>1.<\/b> Mediante Acuerdo del Consejo de Ministros o del órgano competente en el ámbito de las Comunidades Autónomas y de las Entidades Locales, se fijarán porcentajes mínimos de reserva del derecho a participar en los procedimientos de adjudicación de determinados contratos o de determinados lotes de los mismos a Centros Especiales de Empleo de iniciativa social y a empresas de inserción reguladas, respectivamente, en el texto refundido de la Ley General de derechos de las personas con discapacidad y de su inclusión social, aprobada mediante Real Decreto Legislativo 1/2013, de 29 de noviembre, y en la Ley 44/2007, de 13 de diciembre, para la regulación del régimen de las empresas de inserción, que cumplan con los requisitos establecidos en dicha normativa para tener esta consideración, o un porcentaje mínimo de reserva de la ejecución de estos contratos en el marco de programas de empleo protegido, a condición de que el porcentaje de trabajadores con discapacidad o en situación de exclusión social de los Centros Especiales de Empleo, de las empresas de inserción o de los programas sea el previsto en su normativa de referencia y, en todo caso, al menos del 30 por 100.<\/p><p>En el referido Acuerdo del Consejo de Ministros o del órgano competente en el ámbito de las Comunidades Autónomas y de las Entidades Locales, se fijarán las condiciones mínimas para garantizar el cumplimiento de lo establecido en el párrafo anterior.<\/p><p>El Acuerdo de Consejo de Ministros a que se refiere este apartado deberá adoptarse en el plazo máximo de un año a contar desde la entrada en vigor de esta Ley. Si transcurrido este plazo el Acuerdo de Consejo de Ministros no se hubiera adoptado, los órganos de contratación del sector público estatal deberán aplicar el porcentaje mínimo de reserva de 7 por ciento, que se incrementará hasta un 10 por ciento a los cuatro años de la entrada en vigor de esta Ley, sobre el importe global de los procedimientos de adjudicación de suministros y servicios incluidos en los códigos CPV recogidos en el anexo VI celebrados en el ejercicio anterior a aquel al que se refiera la reserva, en los términos indicados en el primer párrafo de este apartado.<\/p><p><b>2.<\/b> En el anuncio de licitación deberá hacerse referencia a la presente disposición.<\/p><p><b>3.<\/b> En los procedimientos de contratación en los que se aplique la reserva que establece esta disposición adicional no procederá la exigencia de la garantía definitiva a que se refiere el artículo 107 de esta Ley, salvo en los casos en los que el órgano de contratación, por motivos excepcionales, lo considere necesario y así lo justifique motivadamente en el expediente.<\/p>", "n": 4}, {"id": "da5", "lab": "DA 5.ª", "t": "Publicación de anuncios", "ubic": "Ley 9/2017 ▸ Parte final ▸ Disposiciones adicionales · Regla técnica de publicidad europea: completa los arts. 134, 135, 154, 186 y 207.3", "idea": "Los anuncios para el DOUE van en formulario normalizado, por vía electrónica y con la fecha de envío probada.", "dis": "<ul>\n<li><b>Supuesto:<\/b> anuncios que vayan a publicarse en el <span class=\"t\" data-k=\"doue\">Diario Oficial de la Unión Europea<\/span>:\n <ol><li>de información previa;<\/li><li>de publicación de información previa en el perfil;<\/li><li>de licitación;<\/li><li>de formalización;<\/li><li>de concurso de proyectos;<\/li><li>del resultado del concurso de proyectos;<\/li><li>de modificación (arts. 134, 135, 154, 186 y 207.3).<\/li><\/ol><\/li>\n<li><b>Contenido (ap. 1):<\/b> la información del <b>anexo III<\/b>, en los <span class=\"t\" data-k=\"formul\">formularios normalizados<\/span>, incluidos los de corrección de errores.<\/li>\n<li><b>Envío (ap. 2):<\/b> por <b>medios electrónicos<\/b> a la <span class=\"t\" data-k=\"opue\">Oficina de Publicaciones de la UE<\/span>, que <b>confirma la recepción<\/b>. Publicado el anuncio, el órgano recibe una <b>notificación<\/b> que sirve de <b>prueba<\/b> de la publicación. El órgano debe poder <b>demostrar la fecha de envío<\/b>.<\/li>\n<li><b>Publicación nacional (ap. 3):<\/b> el anuncio que se publique en España (salvo el de modificación) debe indicar la fecha de envío a la Oficina de Publicaciones o la de su publicación en el perfil, según proceda.<\/li>\n<\/ul>", "llano": "<p>Cuando un contrato es lo bastante grande para anunciarse en Europa, el anuncio se rellena en un formulario oficial y se manda por internet a la oficina de publicaciones de la UE. Esa oficina acusa recibo y, cuando lo publica, avisa. Ese aviso es la prueba.<\/p>\n<p>La fecha de envío importa mucho, porque varios plazos se cuentan desde ella. Por eso el anuncio que se publica en España tiene que llevar esa fecha.<\/p>", "porque": "<p><b>Explicación:<\/b> en los contratos armonizados, los plazos de presentación se cuentan desde el <b>envío<\/b> del anuncio a la Oficina de Publicaciones (por ejemplo, 35 días en el abierto, art. 156.2). Si no pudiera probarse la fecha de envío, ningún licitador podría saber cuándo termina su plazo y cualquier licitación sería impugnable.<\/p>\n<p>Los formularios normalizados permiten que una empresa de cualquier país de la Unión lea cualquier anuncio con la misma estructura, que es la finalidad del mercado único de contratación.<\/p>", "ej": "<ul>\n<li><b>Cotidiano:<\/b> mandar un burofax con acuse de recibo. Lo importante no es solo enviarlo, sino poder demostrar cuándo lo enviaste y que llegó.<\/li>\n<li><b>Real:<\/b> la Diputación licita un suministro de vehículos con VE de 3.000.000 € (armonizado). El <b>jueves 4 de marzo de 2027<\/b> envía el anuncio por vía electrónica a la Oficina de Publicaciones, que confirma la recepción. El plazo mínimo de ofertas (35 días) se cuenta desde ese envío. El anuncio del perfil indica «enviado al DOUE el 4 de marzo de 2027».<\/li>\n<li><b>Caso límite:<\/b> han pasado 48 horas desde la confirmación de recepción y no llega la notificación de publicación. La Diputación puede publicar ya en el perfil (art. 135.3). En ese anuncio nacional debe constar la fecha de envío a la Oficina de Publicaciones.<\/li>\n<\/ul>", "noej": "<ul>\n<li><b>Un contrato no armonizado<\/b> que solo se anuncia en el perfil: la DA 5.ª no se aplica, porque no hay publicación en el DOUE.<\/li>\n<li><b>El anuncio de modificación<\/b> publicado en España no tiene que incluir la fecha de envío: el ap. 3 lo exceptúa.<\/li>\n<\/ul>", "conex": "<ul>\n<li><b>Art. 135.3:<\/b> no se publica en España antes que en el DOUE, salvo que pasen 48 horas sin notificación.<\/li>\n<li><b>Arts. 156.2, 161.1 y 164.1:<\/b> plazos armonizados que se cuentan desde el <b>envío<\/b> del anuncio o de la invitación.<\/li>\n<li><b>Art. 154.3:<\/b> el anuncio de formalización se envía al DOUE a más tardar 10 días después de la formalización.<\/li>\n<li><b>Arts. 134, 186 y 207.3:<\/b> anuncio previo, concurso de proyectos y modificación.<\/li>\n<\/ul>", "trampas": "<ul>\n<li>Son <b>siete<\/b> tipos de anuncio. El de modificación está en la lista del ap. 1, pero queda fuera de la regla del ap. 3.<\/li>\n<li>La prueba de la <b>publicación<\/b> es la notificación de la Oficina. La fecha de <b>envío<\/b> la tiene que poder demostrar el órgano.<\/li>\n<li>El envío es <b>siempre electrónico<\/b>.<\/li>\n<li>La disposición solo se aplica a anuncios que <b>vayan a publicarse en el DOUE<\/b>.<\/li>\n<\/ul>", "ancla": "<p><b>«Formulario, envío, acuse, aviso»:<\/b> se rellena el formulario normalizado · se envía por vía electrónica · la Oficina acusa recibo · la Oficina avisa de la publicación (prueba).<\/p>\n<p><b>«Manda la fecha de envío».<\/b><\/p>", "vis": "<svg viewBox=\"0 0 640 449\" role=\"img\" aria-label=\"Secuencia de publicación en el DOUE\" style=\"width:100%;height:auto\"><defs><marker id=\"kip8s6\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\"><path d=\"M0 0 L9 4.5 L0 9 z\" fill=\"var(--acc)\"/></marker><marker id=\"kip8s6s\" markerWidth=\"9\" markerHeight=\"9\" refX=\"1\" refY=\"4.5\" orient=\"auto\"><path d=\"M9 0 L0 4.5 L9 9 z\" fill=\"var(--acc)\"/></marker></defs><rect x=\"211.8\" y=\"8\" width=\"216.3\" height=\"30\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"320\" y=\"27\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">El viaje de un anuncio al DOUE</text><rect x=\"12\" y=\"50\" width=\"616\" height=\"52\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"24\" y=\"60\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"99\" y=\"80\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">Redacción</text><text x=\"186\" y=\"79.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Anexo III en formulario normalizado (también los de corrección de errores)</text><text x=\"616\" y=\"70\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">DA 5.ª.1</text><rect x=\"12\" y=\"124\" width=\"616\" height=\"52\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"24\" y=\"134\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"99\" y=\"154\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">Envío</text><text x=\"186\" y=\"153.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Electrónico, a la Oficina de Publicaciones · el órgano debe probar la fecha</text><text x=\"616\" y=\"144\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">DA 5.ª.2</text><rect x=\"12\" y=\"198\" width=\"616\" height=\"52\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><rect x=\"24\" y=\"208\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--ej)\"/><text x=\"99\" y=\"228\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">Acuse</text><text x=\"186\" y=\"220.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">La Oficina confirma la recepción · sin aviso en 48 h, cabe publicar</text><text x=\"186\" y=\"234.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">en España</text><text x=\"616\" y=\"218\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">DA 5.ª.2 y art. 135.3</text><rect x=\"12\" y=\"272\" width=\"616\" height=\"52\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><rect x=\"24\" y=\"282\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--ej)\"/><text x=\"99\" y=\"302\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">Publicación</text><text x=\"186\" y=\"301.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">La notificación de la publicación sirve de prueba</text><text x=\"616\" y=\"292\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">DA 5.ª.2</text><rect x=\"12\" y=\"346\" width=\"616\" height=\"52\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"24\" y=\"356\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"99\" y=\"376\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--warn)\">Anuncio nacional</text><text x=\"186\" y=\"368.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Incluye la fecha de envío a la Oficina o la de publicación en el perfil</text><text x=\"186\" y=\"382.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Excepción: el anuncio de modificación</text><text x=\"616\" y=\"366\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">DA 5.ª.3</text><rect x=\"12\" y=\"410\" width=\"616\" height=\"31\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"320\" y=\"429\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">Los plazos armonizados se cuentan desde el envío (arts. 156.2, 161.1 y 164.1)</text><path d=\"M320 103 L 320 122\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#kip8s6)\"/><path d=\"M320 177 L 320 196\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#kip8s6)\"/><path d=\"M320 251 L 320 270\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#kip8s6)\"/><path d=\"M320 325 L 320 344\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#kip8s6)\"/></svg>", "literal": "<p><b>1.<\/b> Los anuncios de información previa, de publicación de información previa en el perfil de contratante, de licitación, de formalización, de concurso de proyectos, del resultado de concurso de proyectos, y de modificación, a que se refieren los artículos 134, 135, 154 y 186 y el apartado 3 del artículo 207, cuando vayan a ser publicados en el «Diario Oficial de la Unión Europea», incluirán la información mencionada en el Anexo III, según el formato de los formularios normalizados correspondientes, incluidos aquellos destinados a la corrección de errores.<\/p><p><b>2.<\/b> Los órganos de contratación que vayan a publicar en el «Diario Oficial de la Unión Europea» un anuncio de los referidos en el apartado primero, deberán enviarlo por medios electrónicos a la Oficina de Publicaciones de la Unión Europea, la cual confirmará al órgano de contratación la recepción del mismo. Una vez publicado el anuncio en el «Diario Oficial de la Unión Europea» el órgano de contratación recibirá una notificación de la publicación que servirá de prueba de esta última. Asimismo los órganos de contratación deberán poder demostrar la fecha de envío de los anuncios a la Oficina de Publicaciones de la Unión Europea.<\/p><p><b>3.<\/b> Cuando los anuncios a que se refiere el apartado primero, excepto el anuncio de modificación, se publiquen a nivel nacional, estos deberán contener, además de la información indicada en este artículo, la fecha de envío del anuncio a la Oficina de Publicaciones de la Unión Europea o de su publicación en el perfil de contratante del órgano de contratación, según proceda en cada caso.<\/p>", "n": 5}, {"id": "da12", "lab": "DA 12.ª", "t": "Cómputo de plazos", "ubic": "Ley 9/2017 ▸ Parte final ▸ Disposiciones adicionales · Regla transversal: se aplica a todos los plazos por días de la Ley", "idea": "En la LCSP los días son naturales salvo que diga «hábiles»; si el último es inhábil, pasa al siguiente hábil.", "dis": "<div class=\"tw\"><table><thead><tr><th>Pieza<\/th><th>Contenido<\/th><\/tr><\/thead><tbody>\n<tr><td><b>Supuesto<\/b><\/td><td>Cualquier plazo de la LCSP fijado <b>por días<\/b><\/td><\/tr>\n<tr><td><b>Regla<\/b><\/td><td>Son <span class=\"t\" data-k=\"naturales\">días naturales<\/span><\/td><\/tr>\n<tr><td><b>Excepción<\/b><\/td><td>Cuando la Ley indique <b>expresamente<\/b> que se computan solo los <span class=\"t\" data-k=\"habiles\">días hábiles<\/span><\/td><\/tr>\n<tr><td><b>Corrección<\/b><\/td><td>Si el <b>último día<\/b> es inhábil, el plazo se prorroga al primer día hábil siguiente. Vale también para los plazos naturales<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Lo que no dice:<\/b> desde qué día se empieza a contar (lo dice cada artículo: «desde el siguiente a…», «desde el envío…») ni cómo se cuentan los meses. Para lo no previsto, la LCSP remite subsidiariamente a la Ley 39/2015 (DF 4.ª.1).<\/p>", "llano": "<p>Si la Ley de Contratos te da «15 días», cuentas todos los días del calendario, también sábados, domingos y festivos.<\/p>\n<p>Solo saltas los inhábiles cuando la Ley dice «días hábiles».<\/p>\n<p>Y si el último día cae en sábado, domingo o festivo, tienes hasta el siguiente día hábil.<\/p>", "porque": "<p><b>Explicación:<\/b> la contratación necesita plazos cortos y previsibles para empresas de toda la Unión. Las directivas europeas fijan sus plazos mínimos en días, sin distinguir hábiles, y la LCSP se alinea con ellas.<\/p>\n<p>La prórroga del último día evita que un plazo venza un domingo, cuando el registro no atiende y la empresa no podría actuar.<\/p>\n<p>Y elige lo contrario que la Ley 39/2015, que cuenta en días hábiles por defecto, porque el procedimiento común está pensado para el ciudadano, no para la empresa licitadora.<\/p>", "ej": "<ul>\n<li><b>Cotidiano:<\/b> «tienes 15 días para devolver el libro a la biblioteca»: cuentas fines de semana. Pero si el día 15 la biblioteca está cerrada, lo devuelves el siguiente día que abra.<\/li>\n<li><b>Real:<\/b> anuncio de un abierto no armonizado de servicios publicado en el perfil el <b>viernes 5 de marzo de 2027<\/b>. Son 15 días (art. 156.6), naturales: del 6 al 20 de marzo. El 20 es sábado, así que el plazo termina el <b>lunes 22 de marzo<\/b>.<\/li>\n<li><b>Caso límite:<\/b> el requerimiento del art. 150.2 da «diez días <b>hábiles<\/b>». Recibido el lunes 3 de mayo de 2027, termina el <b>lunes 17 de mayo<\/b>. En cambio, los «cinco días» para formalizar del art. 153.3 son naturales: recibido el requerimiento el viernes 11 de junio, el plazo vence el miércoles 16.<\/li>\n<\/ul>", "noej": "<ul>\n<li><b>El recurso de reposición contra un acto de la Ley 39/2015:<\/b> sus plazos por días se rigen por el art. 30.2 de esa ley y son hábiles. La DA 12.ª solo gobierna los plazos de la LCSP.<\/li>\n<li><b>Un plazo en meses<\/b> (por ejemplo, los 2 meses del art. 158.2): la DA 12.ª no lo regula, porque solo habla de plazos «por días».<\/li>\n<\/ul>", "conex": "<ul>\n<li><b>Ley 39/2015, art. 30<\/b> (en tu biblioteca): regla contraria, días hábiles por defecto (30.2), meses de fecha a fecha (30.4) y prórroga del último día inhábil (30.5).<\/li>\n<li><b>DF 4.ª.1 LCSP:<\/b> los procedimientos de la LCSP se rigen por ella y, subsidiariamente, por la Ley 39/2015.<\/li>\n<li><b>Plazos en días hábiles de la LCSP:<\/b> 10 días hábiles del requerimiento (150.2) · 5 para adjudicar (150.3) · 15 de espera antes de formalizar (153.3) · 10 días hábiles de ofertas en el abreviado (159.6.a) · 7 y 5 del simplificado (159.4.f).<\/li>\n<\/ul>", "trampas": "<ul>\n<li><b>LCSP: naturales por defecto. LPAC: hábiles por defecto.<\/b> Es la confusión más cara del tema.<\/li>\n<li>La prórroga del último día inhábil se aplica <b>también<\/b> a los plazos naturales.<\/li>\n<li>La DA 12.ª no fija el día de inicio: hay que leer en cada artículo si cuenta «desde el siguiente», «desde el envío» o «desde la publicación».<\/li>\n<li>Para que un plazo sea hábil, la Ley tiene que decirlo <b>expresamente<\/b>.<\/li>\n<\/ul>", "ancla": "<p><b>«En Contratos, lo natural es lo natural; lo hábil hay que escribirlo».<\/b><\/p>\n<p><b>«Domingo nunca vence»:<\/b> si el último día es inhábil, el plazo pasa al siguiente hábil.<\/p>", "vis": "<svg viewBox=\"0 0 640 375\" role=\"img\" aria-label=\"Árbol de decisión del cómputo de plazos\" style=\"width:100%;height:auto\"><defs><marker id=\"klyyy1\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\"><path d=\"M0 0 L9 4.5 L0 9 z\" fill=\"var(--acc)\"/></marker><marker id=\"klyyy1s\" markerWidth=\"9\" markerHeight=\"9\" refX=\"1\" refY=\"4.5\" orient=\"auto\"><path d=\"M9 0 L0 4.5 L9 9 z\" fill=\"var(--acc)\"/></marker></defs><rect x=\"203.8\" y=\"8\" width=\"232.4\" height=\"30\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"320\" y=\"27\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">Cómo contar un plazo de la LCSP</text><rect x=\"12\" y=\"50\" width=\"616\" height=\"52\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"24\" y=\"60\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"99\" y=\"80\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">1 · ¿En días?</text><text x=\"186\" y=\"79.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Sí: DA 12.ª · en meses o años no la regula (subsidiaria: LPAC, art. 30.4)</text><text x=\"616\" y=\"70\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">DA 12.ª</text><rect x=\"12\" y=\"124\" width=\"616\" height=\"52\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"24\" y=\"134\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"99\" y=\"154\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">2 · ¿Dice «hábiles»?</text><text x=\"186\" y=\"153.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Sí: se saltan sábados, domingos y festivos · no: se cuentan todos los días</text><text x=\"616\" y=\"144\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">DA 12.ª</text><rect x=\"12\" y=\"198\" width=\"616\" height=\"52\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"24\" y=\"208\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"99\" y=\"228\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--warn)\">3 · ¿Desde cuándo?</text><text x=\"186\" y=\"220.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Lo fija cada artículo: el siguiente a publicar, recibir, enviar,</text><text x=\"186\" y=\"234.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">notificar…</text><text x=\"616\" y=\"218\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">p. ej. arts. 150.2 y</text><text x=\"616\" y=\"232\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">156.6</text><rect x=\"12\" y=\"272\" width=\"616\" height=\"52\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><rect x=\"24\" y=\"282\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--ej)\"/><text x=\"99\" y=\"302\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">4 · ¿Último inhábil?</text><text x=\"186\" y=\"301.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Sí: el plazo se prorroga al primer día hábil siguiente, sea natural o hábil</text><text x=\"616\" y=\"292\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">DA 12.ª</text><rect x=\"12\" y=\"336\" width=\"616\" height=\"31\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"320\" y=\"355\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">LCSP: naturales por defecto · Ley 39/2015: hábiles por defecto (art. 30.2)</text><path d=\"M320 103 L 320 122\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#klyyy1)\"/><path d=\"M320 177 L 320 196\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#klyyy1)\"/><path d=\"M320 251 L 320 270\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#klyyy1)\"/></svg>", "literal": "<p>Los plazos establecidos por días en esta Ley se entenderán referidos a días naturales, salvo que en la misma se indique expresamente que solo deben computarse los días hábiles. No obstante, si el último día del plazo fuera inhábil, este se entenderá prorrogado al primer día hábil siguiente.<\/p>", "n": 12}];

const FLASH=[["¿Cuándo es el Alcalde órgano de contratación?", "Cuando el <b>valor estimado<\/b> no supera el <b>10 %<\/b> de los recursos ordinarios <b>ni 6.000.000 €<\/b>, y si es plurianual, si no dura más de <b>4 años<\/b> con prórrogas (DA 2.ª.1)."], ["¿Y en lo patrimonial?", "PBL o valor ≤ <b>10 %<\/b> y ≤ <b>3.000.000 €<\/b> (DA 2.ª.9). Bienes histórico-artísticos: siempre el Pleno."], ["¿Quién contrata en un municipio de gran población?", "La <b>Junta de Gobierno Local<\/b>, cualquiera que sea el importe o la duración. El Pleno aprueba los pliegos generales."], ["¿Quién aprueba los pliegos de cláusulas administrativas generales?", "Siempre el <b>Pleno<\/b> (DA 2.ª.2 y 4)."], ["Vocales obligatorios de la mesa local", "El <b>Secretario<\/b> (o asesoría jurídica) y el <b>Interventor<\/b> (o control económico-presupuestario)."], ["Límites de composición de la mesa local", "Mínimo <b>3<\/b> · electos ≤ <b>1/3<\/b> · <b>nunca<\/b> personal eventual · interinos solo si faltan funcionarios de carrera cualificados."], ["¿Quién debe estar siempre en el comité de expertos local?", "Un <b>técnico jurista especializado en contratación pública<\/b> (DA 2.ª.8)."], ["¿Qué son las Juntas de Contratación?", "Órganos de contratación <b>potestativos<\/b> creados por el <b>Pleno<\/b> para contratos de reparación, conservación, consumibles y servicios. Actúan <b>sin mesa<\/b>."], ["¿Qué permite la tramitación anticipada de la DA 3.ª.2?", "Contratar aunque la ejecución empiece el año siguiente o la financiación dependa de un préstamo, crédito o subvención solicitada. Se adjudica bajo <b>condición suspensiva<\/b>."], ["Interventor frente a Secretario en la DA 3.ª", "El Interventor <b>fiscaliza<\/b>; el Secretario <b>informa<\/b> jurídicamente y coordina la transparencia."], ["Los 7 informes preceptivos del Secretario", "<b>PRIMERE<\/b>: Prórrogas · Resolución · Interpretación · Modificación · Expedientes · Revisión de precios · Equilibrio económico."], ["¿Qué pueden hacer los municipios de menos de 5.000 habitantes con la aprobación del gasto?", "Sustituirla por una <b>certificación de existencia de crédito<\/b> (DA 3.ª.4)."], ["Concesión multiservicio de la DA 3.ª.11", "Municipios de <b>menos de 20.000<\/b> hab. · no armonizada · <b>dos o más<\/b> servicios · anualidad media ≤ <b>200.000 €<\/b> · gestión unificada justificada."], ["¿Quién asiste al Interventor en la recepción?", "Un técnico especializado, <b>distinto del director de obra y del responsable del contrato<\/b>."], ["¿A quién se reservan los contratos de la DA 4.ª?", "A <b>CEE de iniciativa social<\/b> y <b>empresas de inserción<\/b>, o la ejecución a programas de empleo protegido. Mínimo <b>30 %<\/b> de plantilla con discapacidad o en exclusión."], ["Garantía definitiva en un contrato reservado", "<b>No procede<\/b>, salvo motivos excepcionales justificados en el expediente (DA 4.ª.3)."], ["¿Qué debe decir el anuncio de un contrato reservado?", "Debe hacer <b>referencia a la DA 4.ª<\/b>."], ["¿Cómo se envían los anuncios al DOUE?", "Por <b>medios electrónicos<\/b> a la Oficina de Publicaciones, en formulario normalizado (anexo III)."], ["¿Qué prueba la publicación en el DOUE?", "La <b>notificación<\/b> de la publicación que recibe el órgano. Además, el órgano debe poder probar la <b>fecha de envío<\/b>."], ["¿Qué anuncio no necesita indicar la fecha de envío al publicarse en España?", "El <b>anuncio de modificación<\/b> (DA 5.ª.3)."], ["Regla de la DA 12.ª", "Plazos por días = <b>naturales<\/b>, salvo que la Ley diga «hábiles». Si el último es inhábil, al <b>primer día hábil siguiente<\/b>."], ["¿Y en la Ley 39/2015?", "Al revés: los días son <b>hábiles<\/b> por defecto (art. 30.2)."]];
const TEST=[{"a": "DA 2.ª", "q": "Un ayuntamiento de 15.000 habitantes con 12.000.000 € de recursos ordinarios licita un servicio de 3 años más 2 de prórroga, con un VE de 400.000 €. ¿Quién es el órgano de contratación?", "o": [["El Alcalde, porque el VE no llega al 10 %", 0, "Los límites son acumulativos: además del importe, la duración con prórrogas no puede pasar de 4 años."], ["La Junta de Gobierno Local", 0, "Solo en municipios de gran población (DA 2.ª.4)."], ["El Pleno", 1, "Correcto. El importe cabe (≤ 1.200.000 €), pero la duración con prórrogas (5 años) supera los 4 de la DA 2.ª.1."], ["El Alcalde, porque la duración inicial es de 3 años", 0, "La DA 2.ª.1 cuenta las «eventuales prórrogas incluidas»."]]}, {"a": "DA 2.ª", "q": "¿Cuál es el tope absoluto del Alcalde para adquirir un inmueble?", "o": [["6.000.000 €, medido sobre el valor estimado", 0, "Esa es la regla de los contratos de obras, suministros y servicios (DA 2.ª.1)."], ["3.000.000 €, medido sobre el valor estimado", 0, "La cifra es correcta, pero la magnitud no: el ap. 9 remite al presupuesto base de licitación del art. 100.1."], ["No hay tope: solo cuenta el 10 %", 0, "Hay tope absoluto de 3.000.000 €."], ["3.000.000 €, medido sobre el PBL", 1, "Correcto. DA 2.ª.9: PBL (art. 100.1) ≤ 10 % de los recursos ordinarios y ≤ 3.000.000 €."]]}, {"a": "DA 2.ª", "q": "En un municipio de gran población, ¿quién aprueba los pliegos de cláusulas administrativas generales?", "o": [["El Pleno", 1, "Correcto. DA 2.ª.4: la JGL contrata, «siendo el Pleno el competente para aprobar los pliegos de cláusulas administrativas generales»."], ["La Junta de Gobierno Local", 0, "La JGL es el órgano de contratación, pero los pliegos generales se los reserva el Pleno."], ["El Alcalde", 0, "No tiene esa competencia ni en régimen común ni en gran población."], ["La mesa de contratación", 0, "La mesa es un órgano de asistencia: no aprueba pliegos."]]}, {"a": "DA 2.ª", "vf": true, "q": "Un asesor de la Alcaldía nombrado como personal eventual puede ser vocal de la mesa de contratación si está especialmente cualificado.", "ok": false, "fb": "Falso. DA 2.ª.7: «En ningún caso podrá formar parte de las Mesas de contratación ni emitir informes de valoración de las ofertas, personal eventual»."}, {"a": "DA 2.ª", "q": "Una mesa local tiene 9 miembros. ¿Cuántos pueden ser concejales como máximo?", "o": [["4", 0, "4 de 9 supera el tercio."], ["2", 0, "Se puede llegar a 3: el límite es «no más de» un tercio."], ["No hay límite si el presidente es funcionario", 0, "El tope de un tercio se aplica siempre."], ["3", 1, "Correcto. Los electos no pueden superar un tercio del total: 9 / 3 = 3."]]}, {"a": "DA 2.ª", "gap": "jurista", "q": "En las entidades locales, en el comité de expertos deberá formar parte en todo caso un técnico ______ especializado en contratación pública.", "fb": "DA 2.ª.8."}, {"a": "DA 3.ª", "q": "¿Quién emite el informe jurídico preceptivo en la prórroga de un contrato en un municipio de régimen común?", "o": [["El Interventor", 0, "El Interventor fiscaliza; no emite el informe jurídico."], ["El Secretario", 1, "Correcto. DA 3.ª.8: las prórrogas están entre los siete supuestos de informe preceptivo del Secretario."], ["El titular de la asesoría jurídica", 0, "Solo en los municipios de gran población (Título X LRBRL)."], ["Nadie: la prórroga no requiere informe jurídico", 0, "Lo requiere: está en la lista del ap. 8."]]}, {"a": "DA 3.ª", "q": "Un municipio de 4.200 habitantes quiere simplificar la fase de gasto de un contrato. ¿Qué le permite la DA 3.ª?", "o": [["Sustituir la aprobación del gasto por una certificación de existencia de crédito", 1, "Correcto. DA 3.ª.4."], ["Prescindir de la fiscalización previa", 0, "La DA 3.ª.3 mantiene la fiscalización del Interventor."], ["Prescindir de la mesa de contratación", 0, "Eso solo ocurre cuando actúa una Junta de Contratación (DA 2.ª.5)."], ["Aplazar el pago cuatro años", 0, "El aplazamiento del ap. 9 es para la adquisición de inmuebles."]]}, {"a": "DA 3.ª", "q": "¿Qué municipios pueden licitar una concesión de servicios no armonizada que agrupe dos o más servicios públicos?", "o": [["Los de menos de 5.000 habitantes, sin límite de importe", 0, "El umbral de población es 20.000 y hay límite de 200.000 € de anualidad media."], ["Los de menos de 20.000 habitantes, con anualidad media ≤ 200.000 €", 1, "Correcto. DA 3.ª.11."], ["Cualquier municipio, si la concesión es armonizada", 0, "Al revés: solo contratos no sujetos a regulación armonizada."], ["Los de menos de 20.000 habitantes, con un valor estimado total ≤ 200.000 €", 0, "Los 200.000 € son de anualidad media, no de valor total."]]}, {"a": "DA 3.ª", "vf": true, "q": "El Interventor debe fiscalizar también la valoración de las repercusiones en la estabilidad presupuestaria de los contratos menores.", "ok": false, "fb": "Falso. DA 3.ª.3: la fiscalización recae sobre esa valoración «excepto los contratos menores»."}, {"a": "DA 3.ª", "q": "¿Quién puede asistir al Interventor en la recepción de una obra?", "o": [["El director de obra", 0, "La Ley exige que el técnico sea diferente del director de obra."], ["Un técnico especializado distinto del director de obra y del responsable del contrato", 1, "Correcto. DA 3.ª.3."], ["El responsable del contrato", 0, "Tampoco puede ser el responsable del contrato."], ["Un concejal de la Comisión de Hacienda", 0, "Debe ser un técnico especializado en el objeto del contrato."]]}, {"a": "DA 3.ª", "gap": "suspensiva", "q": "En la tramitación anticipada por financiación pendiente, la adjudicación se somete a la condición ______ de la efectiva consolidación de los recursos.", "fb": "DA 3.ª.2."}, {"a": "DA 4.ª", "q": "¿Qué porcentaje mínimo de trabajadores con discapacidad o en exclusión deben tener los beneficiarios de un contrato reservado?", "o": [["Al menos el 7 %", 0, "El 7 % es la reserva supletoria del sector público estatal sobre el volumen de contratación."], ["Al menos el 50 %", 0, "La DA 4.ª fija el mínimo en el 30 %."], ["Al menos el 30 %", 1, "Correcto. DA 4.ª.1: el de su normativa «y, en todo caso, al menos del 30 por 100»."], ["El que fije el pliego, sin mínimo legal", 0, "Hay un mínimo legal del 30 %."]]}, {"a": "DA 4.ª", "q": "En un contrato reservado de la DA 4.ª, la garantía definitiva:", "o": [["Se exige siempre, del 5 %", 0, "La regla es la contraria."], ["No procede, salvo motivos excepcionales justificados", 1, "Correcto. DA 4.ª.3."], ["Nunca puede exigirse", 0, "Puede exigirse por motivos excepcionales motivados en el expediente."], ["Se reduce al 3 %", 0, "La Ley no prevé esa reducción."]]}, {"a": "DA 4.ª", "vf": true, "q": "Un Centro Especial de Empleo de iniciativa empresarial puede presentarse a un lote reservado conforme a la DA 4.ª.", "ok": false, "fb": "Falso. La reserva es para los Centros Especiales de Empleo de iniciativa social."}, {"a": "DA 4.ª", "q": "La reserva del 7 % que sube al 10 % se aplica:", "o": [["A todas las entidades locales", 0, "Las entidades locales fijan su porcentaje por Acuerdo de su órgano competente."], ["A cada contrato individualmente", 0, "Se calcula sobre el importe global de suministros y servicios del ejercicio anterior."], ["A los órganos de contratación del sector público estatal, si no se adoptaba el Acuerdo", 1, "Correcto. Es la regla supletoria estatal de la DA 4.ª.1."], ["Solo a las obras", 0, "Se refiere a suministros y servicios de los CPV del anexo VI."]]}, {"a": "DA 5.ª", "q": "¿Qué sirve de prueba de la publicación de un anuncio en el DOUE?", "o": [["La notificación que la Oficina de Publicaciones envía al órgano", 1, "Correcto. DA 5.ª.2."], ["La confirmación de recepción del anuncio", 0, "La confirmación acredita la recepción, no la publicación."], ["La publicación en el perfil de contratante", 0, "Eso es publicidad nacional, no prueba de la europea."], ["La firma del Secretario en el expediente", 0, "La DA 5.ª no lo prevé."]]}, {"a": "DA 5.ª", "vf": true, "q": "El anuncio de modificación publicado a nivel nacional debe incluir la fecha de envío a la Oficina de Publicaciones de la UE.", "ok": false, "fb": "Falso. DA 5.ª.3 exceptúa expresamente «el anuncio de modificación»."}, {"a": "DA 5.ª", "q": "¿Cómo deben enviarse los anuncios al DOUE?", "o": [["Por correo certificado", 0, "El envío es electrónico."], ["A través del BOE", 0, "Se envían directamente a la Oficina de Publicaciones de la UE."], ["Como el órgano elija", 0, "La Ley impone los medios electrónicos."], ["Por medios electrónicos", 1, "Correcto. DA 5.ª.2."]]}, {"a": "DA 12.ª", "q": "El art. 153.3 da «cinco días» para formalizar. Si el requerimiento se recibe el viernes 11 de junio de 2027, ¿cuándo vence?", "o": [["Viernes 18 de junio", 0, "Cuenta días hábiles, pero la Ley no lo dice."], ["Martes 15 de junio", 0, "Se queda en cuatro días."], ["Miércoles 16 de junio", 1, "Correcto. Son días naturales (DA 12.ª), del 12 al 16. El 16 es hábil."], ["Lunes 14 de junio", 0, "Se queda en tres días."]]}, {"a": "DA 12.ª", "vf": true, "q": "La prórroga al primer día hábil siguiente solo se aplica a los plazos señalados en días hábiles.", "ok": false, "fb": "Falso. Se aplica a cualquier plazo por días de la LCSP. Lo normal es que importe en los naturales, que pueden vencer en fin de semana."}, {"a": "DA 12.ª", "q": "¿Qué regla contraria establece la Ley 39/2015?", "o": [["Que los plazos por días son hábiles por defecto", 1, "Correcto. Art. 30.2 LPAC."], ["Que los plazos por días son naturales por defecto", 0, "Esa es la regla de la LCSP."], ["Que no hay prórroga del último día inhábil", 0, "La LPAC también la prevé (art. 30.5)."], ["Que los plazos se cuentan desde el mismo día de la notificación", 0, "Se cuentan desde el siguiente (art. 30.3)."]]}, {"a": "DA 12.ª", "gap": "naturales", "q": "Los plazos establecidos por días en la LCSP se entenderán referidos a días ______, salvo que se indique expresamente que son hábiles.", "fb": "DA 12.ª."}, {"a": "150.2", "q": "Intercalada (bloque 3): el requerimiento al mejor clasificado del art. 150.2 da un plazo de…", "o": [["10 días naturales", 0, "El art. 150.2 dice «hábiles»."], ["5 días hábiles", 0, "Ese es el plazo para adjudicar (art. 150.3)."], ["15 días", 0, "No es el del requerimiento."], ["10 días hábiles desde el siguiente a la recepción", 1, "Correcto: es uno de los plazos que la Ley declara expresamente hábiles."]]}, {"a": "159", "q": "Intercalada (bloque 3): en la tramitación abreviada del art. 159.6, el plazo mínimo de ofertas es de…", "o": [["10 días hábiles", 1, "Correcto. Art. 159.6.a)."], ["10 días naturales", 0, "El art. 159.6.a) dice «días hábiles»."], ["15 días", 0, "Es el del simplificado ordinario."], ["20 días", 0, "Es el de las obras en el simplificado ordinario."]]}];
const CASOS=[{"t": "Caso 1 · Tres contratos en Sierra Alta", "e": "El Ayuntamiento de Sierra Alta (12.000 habitantes, régimen común) tiene 9.000.000 € de recursos ordinarios en 2027. Tramita: <b>(a)<\/b> un servicio de limpieza viaria de 4 años sin prórroga, con VE de 850.000 €; <b>(b)<\/b> una obra de 1.100.000 €; <b>(c)<\/b> la venta de una parcela municipal valorada en 700.000 €. Además, propone una mesa de seis miembros: presidente concejal, Secretario, Interventor, la arquitecta municipal, otro concejal y el jefe de gabinete de la Alcaldía, que es personal eventual. ¿Quién es el órgano competente en cada caso? ¿Es correcta la mesa?", "s": "<ol><li><b>(a) Alcalde.<\/b> 10 % de 9.000.000 € = 900.000 €. El VE (850.000 €) no lo supera y la duración (4 años) no pasa de cuatro (DA 2.ª.1).<\/li><li><b>(b) Pleno.<\/b> 1.100.000 € supera el 10 % (DA 2.ª.2).<\/li><li><b>(c) Alcalde.<\/b> Enajenación de patrimonio de valor ≤ 10 % (900.000 €) y ≤ 3.000.000 € (DA 2.ª.9).<\/li><li><b>Mesa: incorrecta.<\/b> Tiene dos electos de seis (el presidente y el otro concejal), justo un tercio, así que por ahí cumple. El fallo es el jefe de gabinete: es personal eventual y no puede formar parte de la mesa (DA 2.ª.7). <b>Cuidado con la solución fácil:<\/b> si solo se le quita, quedan cinco miembros con dos electos, y 2 supera el tercio de 5 (1,67). Hay que <b>sustituirlo<\/b> por un funcionario o laboral (seis miembros, dos electos) o quitar también a un concejal.<\/li><\/ol>"}, {"t": "Caso 2 · La subvención que aún no ha llegado", "e": "Cortijo Alto (3.200 habitantes) ha pedido a la Junta de Andalucía una subvención de 120.000 € para reformar el consultorio médico. La resolución se espera para septiembre, pero el Alcalde quiere que la obra empiece en cuanto llegue el dinero. Preguntas: <b>(1)<\/b> ¿Puede licitarse ya? <b>(2)<\/b> ¿Qué documento puede sustituir a la aprobación del gasto? <b>(3)<\/b> ¿Quién supervisa el proyecto si el municipio no tiene oficina técnica? <b>(4)<\/b> ¿Quién emite el informe jurídico de aprobación del expediente?", "s": "<ol><li><b>Sí<\/b>, por tramitación anticipada: la financiación depende de una subvención solicitada a otra entidad. La adjudicación queda sometida a la <b>condición suspensiva<\/b> de que se conceda (DA 3.ª.2).<\/li><li>Una <b>certificación de existencia de crédito<\/b> expedida por la Secretaria-Interventora, porque el municipio tiene menos de 5.000 habitantes (DA 3.ª.4).<\/li><li>Las oficinas de la <b>Diputación provincial<\/b>. El acuerdo de aprobación del proyecto debe recoger la supervisión favorable (DA 3.ª.6).<\/li><li>El <b>Secretario<\/b>. En municipios pequeños suele ser el Secretario-Interventor (DA 3.ª.8).<\/li><\/ol>"}, {"t": "Caso 3 · Un lote reservado y un anuncio europeo", "e": "La Diputación licita, por procedimiento abierto armonizado, el mantenimiento de sus edificios en tres lotes, con un VE total de 2.400.000 €. Reserva el lote 3 (jardinería, 300.000 €) conforme a la DA 4.ª. Envía el anuncio a la Oficina de Publicaciones de la UE el <b>martes 2 de marzo de 2027<\/b>. Preguntas: <b>(1)<\/b> ¿Quién puede presentarse al lote 3? <b>(2)<\/b> ¿Se exige garantía definitiva al adjudicatario del lote 3? <b>(3)<\/b> ¿Desde cuándo se cuenta el plazo de ofertas y qué fecha debe constar en el anuncio del perfil? <b>(4)<\/b> Si el último día del plazo de ofertas cayera en domingo, ¿qué ocurriría?", "s": "<ol><li>Solo los <b>CEE de iniciativa social<\/b> y las <b>empresas de inserción<\/b> que cumplan su normativa, con al menos un 30 % de trabajadores con discapacidad o en exclusión (DA 4.ª.1). El anuncio debe citar la DA 4.ª (ap. 2).<\/li><li><b>No<\/b>, salvo que la Diputación justifique motivos excepcionales (DA 4.ª.3).<\/li><li>Desde el <b>envío<\/b> del anuncio a la Oficina de Publicaciones (art. 156.2). El anuncio del perfil debe indicar esa fecha de envío, el 2 de marzo de 2027 (DA 5.ª.3).<\/li><li>Que el plazo se prorrogaría al <b>primer día hábil siguiente<\/b> (DA 12.ª). Los 35 días del art. 156.2 son naturales, pero la prórroga del último día inhábil también les alcanza.<\/li><\/ol>"}];
const SEMAFORO=["Sé los tres límites del Alcalde como órgano de contratación (10 % · 6 M€ · 4 años) — DA 2.ª.1", "Distingo los límites patrimoniales (PBL · 3 M€) — DA 2.ª.9", "Sé qué es competencia del Pleno, también por duración y los bienes histórico-artísticos — DA 2.ª.2, 3 y 10", "Sé quién contrata en un municipio de gran población — DA 2.ª.4 y 11", "Conozco las Juntas de Contratación — DA 2.ª.5", "Domino la composición de la mesa local (3 · 1/3 · sin eventuales · interinos) — DA 2.ª.7", "Sé cómo se compone el comité de expertos local — DA 2.ª.8", "Sé qué es la tramitación anticipada y la condición suspensiva — DA 3.ª.2", "Distingo qué hace el Interventor y qué hace el Secretario (FIS-INF, PRIMERE) — DA 3.ª.3 y 8", "Conozco las reglas de los municipios de menos de 5.000 y de 20.000 habitantes — DA 3.ª.4, 7 y 11", "Sé a quién se reservan los contratos y con qué requisitos — DA 4.ª", "Sé qué ocurre con la garantía definitiva en un contrato reservado — DA 4.ª.3", "Conozco el envío y la prueba de los anuncios al DOUE — DA 5.ª", "Cuento sin fallar plazos naturales y hábiles en la LCSP — DA 12.ª", "Distingo la regla de la LCSP de la regla de la Ley 39/2015 — DA 12.ª y art. 30 LPAC"];
const MAPAS={"da2": "<!doctype html>\n<html lang=\"es\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>DA 2.ª LCSP<\/title>\n<style>\n  :root { --bg:#fafafa; }\n  html,body { margin:0; height:100%; background:var(--bg); font-family:\"Helvetica Neue\",Helvetica,Arial,sans-serif; }\n  #wrap { position:fixed; inset:0; overflow:hidden; cursor:grab; touch-action:none; }\n  #wrap.drag { cursor:grabbing; }\n  svg { width:100%; height:100%; display:block; }\n  .tools { position:fixed; top:12px; right:12px; display:flex; gap:6px; z-index:2; flex-wrap:wrap; justify-content:flex-end; }\n  .tools button { border:1px solid #ddd; background:#fff; border-radius:18px; padding:6px 12px; font:13px Arial,sans-serif; color:#555; cursor:pointer; }\n  .tools button:hover { background:#f0f0f0; }\n  .hint { position:fixed; left:12px; bottom:10px; font:12px Arial,sans-serif; color:#aaa; }\n  .clickable { cursor:pointer; }\n<\/style>\n<\/head>\n<body>\n<div class=\"tools\">\n  <button id=\"bFit\">Ajustar<\/button>\n  <button id=\"bExp\">Expandir todo<\/button>\n  <button id=\"bSvg\">Descargar SVG<\/button>\n  <button id=\"bPng\">Descargar PNG<\/button>\n<\/div>\n<div class=\"hint\">Arrastra para mover · rueda para zoom · clic en un nodo para plegar/desplegar<\/div>\n<div id=\"wrap\"><svg id=\"svg\" xmlns=\"http://www.w3.org/2000/svg\"><g id=\"vp\"><\/g><\/svg><\/div>\n<script id=\"data\" type=\"application/json\">{\"title\": \"DA 2.ª LCSP\", \"layout\": \"mindmap\", \"root\": {\"text\": \"DA 2.ª\\nCompetencias en las\\nEntidades Locales\", \"shape\": \"pill\", \"children\": [{\"text\": \"Alcalde / Presidente\", \"children\": [{\"text\": \"Contratos (ap. 1)\", \"id\": \"alc\", \"children\": [{\"text\": \"**VE ≤ 10 %** recursos ordinarios\"}, {\"text\": \"y **≤ 6.000.000 €**\"}, {\"text\": \"Plurianuales **≤ 4 años,** prórrogas incluidas\"}]}, {\"text\": \"Patrimonio (ap. 9)\", \"children\": [{\"text\": \"**PBL** (art. 100.1) o valor ≤ 10 %\"}, {\"text\": \"y **≤ 3.000.000 €**\"}]}]}, {\"text\": \"Pleno\", \"children\": [{\"text\": \"Lo que exceda por **valor o duración** (ap. 2)\"}, {\"text\": \"**Pliegos de cláusulas generales** (art. 121)\", \"id\": \"pcag\"}, {\"text\": \"< 5.000 hab.: proyectos de obra **por partes** (ap. 3)\"}, {\"text\": \"Bienes **histórico-artísticos,** cualquier valor (ap. 10)\"}]}, {\"text\": \"Gran población\", \"children\": [{\"text\": \"**Junta de Gobierno Local** (ap. 4 y 11)\"}, {\"text\": \"Cualquier importe o duración\"}, {\"text\": \"Pliegos generales: el Pleno\", \"id\": \"gp\"}]}, {\"text\": \"Juntas de Contratación\", \"children\": [{\"text\": \"**Potestativas;** las crea el Pleno\"}, {\"text\": \"Reparación, conservación, consumibles, servicios\"}, {\"text\": \"Con Secretario e Interventor\"}, {\"text\": \"Actúan **sin mesa**\", \"id\": \"jc\"}]}, {\"text\": \"Mesa (ap. 7)\", \"children\": [{\"text\": \"Preside: miembro de la Corporación o funcionario\"}, {\"text\": \"Vocales: **Secretario** e **Interventor**\"}, {\"text\": \"Mínimo **3;** electos **≤ 1/3**\", \"id\": \"mesa\"}, {\"text\": \"**Nunca** personal eventual\"}, {\"text\": \"Interinos: solo si faltan de carrera\"}]}, {\"text\": \"Comité de expertos (ap. 8)\", \"children\": [{\"text\": \"Funcionarios de carrera o laborales fijos\"}, {\"text\": \"No redactaron la documentación técnica\"}, {\"text\": \"Siempre un **técnico jurista**\"}]}, {\"text\": \"Pequeños municipios\", \"children\": [{\"text\": \"< 5.000 hab.: **centrales de contratación** (ap. 6)\"}, {\"text\": \"Convenio de gestión con la **Diputación**\"}, {\"text\": \"Entes supramunicipales = Diputación (ap. 12)\"}]}]}, \"links\": [{\"from\": \"gp\", \"to\": \"pcag\", \"label\": \"siempre Pleno\"}, {\"from\": \"jc\", \"to\": \"mesa\", \"label\": \"sin mesa\"}]}<\/script>\n<script>\n(function () {\n\"use strict\";\nconst DATA = JSON.parse(document.getElementById(\"data\").textContent);\nconst NS = \"http://www.w3.org/2000/svg\";\nconst FONT = '\"Helvetica Neue\", Helvetica, Arial, sans-serif';\nconst PALETTE = [\"#e8473b\",\"#f5a23a\",\"#e3cf45\",\"#8ccf5f\",\"#46c6c0\",\"#5aa0e6\",\"#c88be0\",\"#a8552e\",\"#ef8aa8\",\"#3fb37f\"];\nconst LAYOUT = DATA.layout === \"timeline\" ? \"timeline\" : \"mindmap\";\nconst svg = document.getElementById(\"svg\"), vp = document.getElementById(\"vp\"), wrap = document.getElementById(\"wrap\");\nconst mctx = document.createElement(\"canvas\").getContext(\"2d\");\n\n/* ---------- color utils ---------- */\nfunction h2r(h){h=h.replace(\"#\",\"\");if(h.length===3)h=h.split(\"\").map(c=>c+c).join(\"\");const n=parseInt(h,16);return[n>>16&255,n>>8&255,n&255];}\nfunction r2h(r,g,b){return\"#\"+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,\"0\")).join(\"\");}\nfunction r2hsl(a){let[r,g,b]=a.map(v=>v/255);const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let h=0,s=0,l=(mx+mn)/2;if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);if(mx===r)h=(g-b)/d+(g<b?6:0);else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;}return[h,s,l];}\nfunction hsl2h(h,s,l){h=((h%360)+360)%360;const c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs((h/60)%2-1)),m=l-c/2;let r,g,b;if(h<60)[r,g,b]=[c,x,0];else if(h<120)[r,g,b]=[x,c,0];else if(h<180)[r,g,b]=[0,c,x];else if(h<240)[r,g,b]=[0,x,c];else if(h<300)[r,g,b]=[x,0,c];else[r,g,b]=[c,0,x];return r2h((r+m)*255,(g+m)*255,(b+m)*255);}\nfunction shift(hex,dh,dl){const[h,s,l]=r2hsl(h2r(hex));return hsl2h(h+dh,s,Math.max(.2,Math.min(.82,l+dl)));}\nfunction darker(hex,t){const a=h2r(hex);return r2h(a[0]*(1-t),a[1]*(1-t),a[2]*(1-t));}\nfunction lighter(hex,t){const a=h2r(hex);return r2h(a[0]+(255-a[0])*t,a[1]+(255-a[1])*t,a[2]+(255-a[2])*t);}\n\n/* ---------- styles per depth ---------- */\nfunction sty(d){\n  if(d===1) return {fs:19,fw:\"bold\",w0:10,w1:7,lh:23,maxw:230,gap:58};\n  if(d===2) return {fs:14.5,fw:\"600\",w0:7,w1:5,lh:18,maxw:250,gap:40};\n  return {fs:13,fw:\"normal\",w0:Math.max(3,5-(d-3)),w1:Math.max(2.4,4-(d-3)),lh:16,maxw:260,gap:32};\n}\nconst ROOT_ST = {fs:18,fw:\"normal\",lh:22,maxw:220};\n\n/* ---------- rich text: **bold**, *italic*, \\n ---------- */\nfunction tokens(t){\n  const out=[];let b=false,i=false;\n  String(t).split(/(\\*\\*|\\*|\\n)/).forEach(p=>{\n    if(p===\"**\")b=!b;else if(p===\"*\")i=!i;else if(p===\"\\n\")out.push({br:1});\n    else p.split(/\\s+/).forEach(w=>{if(w)out.push({w,b,i});});\n  });\n  return out;\n}\nfunction meas(w,st,b,i){mctx.font=(i?\"italic \":\"\")+(b?\"bold\":st.fw)+\" \"+st.fs+\"px \"+FONT;return mctx.measureText(w).width;}\nfunction wrapText(text,st){\n  const toks=tokens(text),lines=[[]];let cur=0;const sp=meas(\" \",st,false,false);\n  for(const t of toks){\n    if(t.br){lines.push([]);cur=0;continue;}\n    const ww=meas(t.w,st,t.b,t.i),L=lines[lines.length-1];\n    if(L.length&&cur+sp+ww>st.maxw){lines.push([t]);cur=ww;}else{if(L.length)cur+=sp;L.push(t);cur+=ww;}\n  }\n  const widths=lines.map(L=>L.reduce((a,t,k)=>a+meas(t.w,st,t.b,t.i)+(k?sp:0),0));\n  return {lines,w:Math.max(10,...widths),h:lines.length*st.lh};\n}\n\n/* ---------- prepare tree ---------- */\nlet uid=0;const byId={};\nfunction prep(n,d,color,isTimeline){\n  n.children=Array.isArray(n.children)?n.children:[];\n  n._id=n.id||(\"n\"+(uid++));byId[n._id]=n;n._d=d;\n  if(n._collapsed===undefined)n._collapsed=!!n.collapsed;\n  if(d>0){n._st=sty(d);if(isTimeline&&d>=2)n._st=Object.assign({},n._st,{fs:14,fw:\"normal\",lh:17});Object.assign(n,wrapText(n.text||\"\",n._st));}\n  n._c=color;\n  n._tc=n.textColor||(isTimeline&&d>1?\"#5a5a5a\":darker(color,.42));\n  const k=n.children.length;\n  n.children.forEach((c,j)=>{\n    let cc;\n    if(d===0)cc=c.color||PALETTE[j%PALETTE.length];\n    else if(isTimeline&&d>=1)cc=c.color||\"#cdcdcd\";\n    else cc=c.color||shift(color,(j-(k-1)/2)*7,d>=2?.03:.01);\n    prep(c,d+1,cc,isTimeline);\n  });\n}\nprep(DATA.root,0,\"#cccccc\",LAYOUT===\"timeline\");\n\n/* ---------- layout helpers ---------- */\nfunction vis(n){return n

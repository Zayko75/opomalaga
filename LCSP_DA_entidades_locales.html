<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LCSP · Bloque 6 · Disposiciones adicionales para entidades locales</title>
<style>

/* ═══════════════════════════════════════════════════════════════
   SISTEMA DE DISEÑO · "Académico Gamificado" · Bloque II
   Temas 8, 9 y 10 · Auxiliar Administrativo
   ═══════════════════════════════════════════════════════════════ */
:root{
  --z:1;              /* A+ / A− · solo agranda el cuerpo de la página */

  --bg:#faf9f7;
  --bg-grad:radial-gradient(1100px 560px at 12% -8%, #ede9ff 0%, transparent 55%),
            radial-gradient(850px 460px at 96% 0%, #dcf5ee 0%, transparent 50%);
  --surface:#ffffff;
  --surface-2:#f4f3f0;
  --surface-3:#eceae5;
  --line:#e6e3dc;
  --line-strong:#d4d0c7;

  --ink:#15161c;
  --ink-2:#5d616e;
  --ink-3:#8b8f9c;

  --brand:#5b3df5;
  --brand-2:#7c5cff;
  --brand-soft:#efeaff;
  --brand-ring:rgba(91,61,245,.18);

  --legal:#4338ca;  --legal-bg:#eeecff;
  --ej:#059669;     --ej-bg:#e4f7f0;
  --warn:#c2690a;   --warn-bg:#fdf1de;
  --exc:#dc2626;    --exc-bg:#ffeceb;

  --ok:#16a34a; --ok-soft:#e7f7ec;
  --mid:#eab308; --mid-soft:#fdf6dd;
  --off:#a1a1aa; --off-soft:#f1f1f3;

  --sh-1:0 1px 2px rgba(20,20,30,.04), 0 2px 8px rgba(20,20,30,.04);
  --sh-2:0 2px 6px rgba(20,20,30,.05), 0 12px 28px rgba(20,20,30,.07);
  --sh-3:0 8px 20px rgba(91,61,245,.13), 0 24px 56px rgba(20,20,30,.10);
  --sh-glow:0 0 0 4px var(--brand-ring);

  --r-sm:9px; --r-md:14px; --r-lg:20px; --r-full:999px;

  --f-display:"Segoe UI Variable Display",system-ui,-apple-system,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-legal:ui-serif,Georgia,Cambria,"Times New Roman",serif;
  --f-mono:ui-monospace,"SF Mono","Cascadia Mono","Segoe UI Mono",Menlo,monospace;

  --t-h1:clamp(1.02rem,.95rem + .3vw,1.2rem);
  --t-h2:clamp(1.2rem,1.05rem + .6vw,1.55rem);
  --t-h3:clamp(1rem,.95rem + .25vw,1.12rem);
  --t-sm:.86rem;
  --t-xs:.75rem;

  --e-out:cubic-bezier(.22,1,.36,1);
  --e-spring:cubic-bezier(.34,1.56,.64,1);

  /* ── Compatibilidad con SVG y contenido generado ── */
  --panel:var(--surface);
  --ink2:var(--ink-2);
  --acc:var(--brand);
  --acc-soft:var(--brand-soft);
  --g:var(--ok); --y:var(--mid); --r:var(--exc);
}

html[data-theme="dark"]{
  --bg:#0a0b0f;
  --bg-grad:radial-gradient(1100px 560px at 12% -8%, #1c1740 0%, transparent 55%),
            radial-gradient(850px 460px at 96% 0%, #08302b 0%, transparent 50%);
  --surface:#13151b;
  --surface-2:#1a1d25;
  --surface-3:#232733;
  --line:#262a34;
  --line-strong:#343947;

  --ink:#eceef4;
  --ink-2:#9ba2b3;
  --ink-3:#6e7585;

  --brand:#8b6dff;
  --brand-2:#a78bff;
  --brand-soft:#1e1a3d;
  --brand-ring:rgba(139,109,255,.22);

  --legal:#a5b4fc; --legal-bg:#191b3a;
  --ej:#34d399;    --ej-bg:#0c2a24;
  --warn:#fbbf24;  --warn-bg:#2e2110;
  --exc:#fb7185;   --exc-bg:#331119;

  --ok:#4ade80; --ok-soft:#0e2a19;
  --mid:#facc15; --mid-soft:#2c2610;
  --off:#5b6070; --off-soft:#1c1f27;

  --sh-1:0 1px 2px rgba(0,0,0,.3), 0 2px 8px rgba(0,0,0,.25);
  --sh-2:0 2px 6px rgba(0,0,0,.35), 0 12px 28px rgba(0,0,0,.4);
  --sh-3:0 8px 20px rgba(139,109,255,.2), 0 24px 56px rgba(0,0,0,.5);
}

*,*::before,*::after{box-sizing:border-box}
html{font-size:16px;scroll-behavior:smooth}
/* A+ y A− agrandan o reducen únicamente el cuerpo: el texto de los
   artículos, las tablas y los diagramas. La cabecera, el índice lateral
   y los botones conservan su tamaño para no descolocar la pantalla. */
main{zoom:var(--z)}
@media print{main{zoom:1}}
body{
  margin:0;background:var(--bg);background-image:var(--bg-grad);
  background-attachment:fixed;background-repeat:no-repeat;
  color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.68;
  -webkit-font-smoothing:antialiased;
  transition:background-color .5s var(--e-out),color .3s;
}
::selection{background:var(--brand);color:#fff}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{font-family:var(--f-display);letter-spacing:-.022em;line-height:1.2}
.num{font-variant-numeric:tabular-nums}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:99px;border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3)}

/* ═══ HEADER ═══ */
header.top{
  position:sticky;top:0;z-index:60;
  background:color-mix(in srgb,var(--surface) 80%,transparent);
  backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);
  border-bottom:1px solid var(--line);
}
/* El título ocupa su propia línea, encima de los botones. Antes competía
   por el ancho con la barra de herramientas y acababa desmigado en una
   columna de una palabra por línea. */
.top-in{max-width:1280px;margin:0 auto;padding:.6rem 1.1rem .55rem;display:flex;flex-direction:column;gap:.5rem;align-items:stretch}
.brandwrap{display:flex;align-items:center;gap:.65rem;min-width:0;width:100%}
.mark{
  width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;
  font-weight:800;font-size:.8rem;letter-spacing:-.02em;text-decoration:none;
  box-shadow:0 4px 14px var(--brand-ring);
  transition:transform .3s var(--e-spring),box-shadow .3s;
}
.mark:hover{transform:rotate(-8deg) scale(1.08);box-shadow:var(--sh-3);text-decoration:none}
.top h1{font-size:var(--t-h1);margin:0;font-weight:800;line-height:1.25;min-width:0;flex:1 1 auto}
/* como mucho dos líneas: si no cabe, se recorta con puntos suspensivos */
.top h1 .tit{
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;text-wrap:balance;
}
.top h1 .sub{display:block;font-size:var(--t-xs);color:var(--ink-2);font-weight:500;letter-spacing:0;
  margin-top:.1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tools{margin-left:0;display:flex;gap:.4rem;flex-wrap:wrap;align-items:center;width:100%}

button,select,input[type=search]{
  font:inherit;font-size:var(--t-sm);font-weight:600;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:var(--r-sm);padding:.4rem .72rem;cursor:pointer;
  position:relative;overflow:hidden;
  transition:transform .18s var(--e-spring),border-color .2s,background .2s,box-shadow .2s,color .2s;
}
button:hover{transform:translateY(-1.5px);border-color:var(--brand);box-shadow:var(--sh-1)}
button:active{transform:translateY(0) scale(.97)}
button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible{outline:none;box-shadow:var(--sh-glow)}
input[type=search]{min-width:190px;cursor:text;font-weight:500}
input[type=search]:focus{border-color:var(--brand)}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--surface-2);padding:2px;gap:2px}
.seg button{border:0;border-radius:calc(var(--r-sm) - 2px);padding:.32rem .68rem;background:transparent;box-shadow:none}
.seg button:hover{transform:none;background:var(--surface)}
.seg button[aria-pressed="true"]{background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;box-shadow:0 2px 8px var(--brand-ring)}

.ripple{position:absolute;border-radius:50%;transform:scale(0);background:currentColor;opacity:.25;animation:rip .55s linear;pointer-events:none}
@keyframes rip{to{transform:scale(3.4);opacity:0}}

.progress{position:absolute;left:0;bottom:-1px;height:2.5px;width:0;
  background:linear-gradient(90deg,var(--brand),var(--legal),var(--ej));transition:width .1s linear}

/* ═══ LAYOUT ═══ */
.layout{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:270px 1fr;gap:1.8rem;padding:1.4rem 1.1rem 5rem}
main{min-width:0}

/* ═══ SIDEBAR ═══ */
nav.side{
  position:sticky;top:76px;align-self:start;max-height:calc(100vh - 96px);overflow:auto;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:.85rem;box-shadow:var(--sh-1);
}
nav.side h2{font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);
  margin:.5rem .4rem .5rem;font-weight:800}
nav.side h2:first-child{margin-top:.1rem}
nav.side a{
  display:flex;align-items:baseline;gap:.5rem;padding:.36rem .55rem;border-radius:var(--r-sm);
  text-decoration:none;color:var(--ink-2);font-size:var(--t-sm);font-weight:500;
  position:relative;transition:background .22s,color .22s,transform .22s var(--e-out);
}
nav.side a:hover{background:var(--surface-2);color:var(--ink);transform:translateX(3px);text-decoration:none}
nav.side a.on{background:var(--brand-soft);color:var(--brand);font-weight:700}
nav.side a.on::before{content:"";position:absolute;left:-.85rem;top:20%;bottom:20%;width:3px;
  border-radius:0 3px 3px 0;background:var(--brand)}
nav.side a b{color:var(--ink-3);font-weight:800;font-size:var(--t-xs);font-variant-numeric:tabular-nums;flex:none;min-width:1.9em}
nav.side a.on b{color:var(--brand)}
.navtoggle{display:none}

/* ═══ TARJETAS ═══ */
section.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:1.35rem 1.5rem;margin-bottom:1.1rem;box-shadow:var(--sh-1);
  transition:box-shadow .3s var(--e-out),border-color .3s;
}
section.card:hover{box-shadow:var(--sh-2)}
section.card>h2{
  margin:0 0 1rem;font-size:var(--t-h2);font-weight:800;
  display:flex;align-items:center;gap:.6rem;
}
section.card>h2::before{
  content:"";width:4px;height:1.05em;border-radius:99px;flex:none;
  background:linear-gradient(180deg,var(--brand),var(--brand-2));
}

/* ═══ ARTÍCULO ═══ */
.art{scroll-margin-top:86px;padding-top:.4rem}
.art + .art{margin-top:1.6rem;padding-top:1.6rem;border-top:1px dashed var(--line)}
.art h2{display:flex;flex-wrap:wrap;gap:.5rem;align-items:baseline;font-size:var(--t-h3);
  margin:0 0 .25rem;font-weight:800;letter-spacing:-.015em}
.art h2 .num{
  color:var(--brand);font-weight:800;font-family:var(--f-display);
  background:var(--brand-soft);padding:.1rem .5rem;border-radius:var(--r-sm);
  font-size:.92em;letter-spacing:-.02em;
}
.ubic{font-size:var(--t-xs);color:var(--ink-3);margin:0 0 .8rem;font-weight:600;
  letter-spacing:.03em;text-transform:uppercase}

/* ═══ IDEA CLAVE ═══ */
.idea{
  background:linear-gradient(100deg,var(--brand-soft),color-mix(in srgb,var(--brand-soft) 40%,transparent));
  border-left:4px solid var(--brand);border-radius:0 var(--r-md) var(--r-md) 0;
  padding:.75rem 1rem;font-weight:650;margin:.7rem 0 1rem;position:relative;
  font-size:.97rem;line-height:1.55;
}

/* ═══ ACORDEÓN ═══ */
details.panel{
  border:1px solid var(--line);border-radius:var(--r-md);margin:.6rem 0;
  background:var(--surface);overflow:hidden;
  transition:border-color .25s,box-shadow .25s,background .25s;
}
details.panel:hover{border-color:var(--line-strong)}
details.panel[open]{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-ring)}
details.panel>summary{
  cursor:pointer;padding:.62rem .9rem;font-weight:700;font-size:.93rem;
  list-style:none;display:flex;align-items:center;gap:.55rem;
  transition:background .2s,color .2s;
}
details.panel>summary:hover{background:var(--surface-2)}
details.panel[open]>summary{background:var(--brand-soft);color:var(--brand)}
details.panel>summary::-webkit-details-marker{display:none}
details.panel>summary::before{
  content:"";width:16px;height:16px;flex:none;border-radius:5px;
  background:var(--brand-soft);position:relative;transition:transform .3s var(--e-spring),background .25s;
}
details.panel>summary::after{
  content:"";position:absolute;width:0;height:0;margin-left:5px;
  border:4px solid transparent;border-left-color:var(--brand);
  transition:transform .3s var(--e-spring);
}
details.panel[open]>summary::before{background:var(--surface)}
details.panel[open]>summary::after{transform:rotate(90deg) translateX(-1px)}
details.panel .body{padding:.3rem 1rem 1rem;font-size:.95rem;animation:slidein .35s var(--e-out)}
@keyframes slidein{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* ═══ TEXTO LEGAL ═══ */
.legal{
  background:var(--legal-bg);border-left:4px solid var(--legal);
  border-radius:0 var(--r-md) var(--r-md) 0;padding:.85rem 1.05rem;
  font-family:var(--f-legal);font-size:.95rem;line-height:1.7;
}
.legal p{margin:.45rem 0}
.legal .lbl{
  font-family:var(--f-body);font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;
  color:var(--legal);font-weight:800;display:block;margin-bottom:.4rem;
}

/* ═══ CAJAS SEMÁNTICAS ═══ */
.box{
  border-left:4px solid var(--line);border-radius:0 var(--r-md) var(--r-md) 0;
  padding:.72rem .95rem;margin:.65rem 0;font-size:.94rem;
  transition:transform .25s var(--e-out),box-shadow .25s;
}
.box:hover{transform:translateX(3px);box-shadow:var(--sh-1)}
.box.ej{background:var(--ej-bg);border-color:var(--ej)}
.box.warn{background:var(--warn-bg);border-color:var(--warn)}
.box.exc{background:var(--exc-bg);border-color:var(--exc)}
.box .lbl{font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;font-weight:800;
  display:block;margin-bottom:.3rem}
.box.ej .lbl{color:var(--ej)}
.box.warn .lbl{color:var(--warn)}
.box.exc .lbl{color:var(--exc)}

.interp{
  border:1px dashed var(--warn);background:color-mix(in srgb,var(--warn-bg) 45%,transparent);
  border-radius:var(--r-md);padding:.65rem .9rem;font-size:.9rem;margin:.6rem 0;
}
.interp .lbl{font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;color:var(--warn);font-weight:800;display:block}

/* ═══ TABLAS ═══ */
table{width:100%;border-collapse:separate;border-spacing:0;font-size:.9rem;margin:.7rem 0;
  border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
th,td{padding:.5rem .68rem;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
td + td, th + th{border-left:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th{background:var(--surface-2);font-size:var(--t-xs);font-weight:800;letter-spacing:.05em;
  text-transform:uppercase;color:var(--ink-2);position:sticky;top:0}
tbody tr{transition:background .18s}
tbody tr:nth-child(even){background:color-mix(in srgb,var(--surface-2) 45%,transparent)}
tbody tr:hover{background:var(--brand-soft)}
th.sortable{cursor:pointer;user-select:none;transition:color .2s,background .2s}
th.sortable:hover{color:var(--brand);background:var(--brand-soft)}
th.sortable::after{content:" ⇅";color:var(--ink-3);font-size:.7rem}

ul,ol{margin:.5rem 0 .5rem 1.2rem;padding:0}
li{margin:.26rem 0}
li::marker{color:var(--brand);font-weight:700}

/* ═══ TOOLTIPS ═══ */
.t{border-bottom:1.5px dotted var(--brand);cursor:help;position:relative;
  transition:background .2s,color .2s}
.t:hover{background:var(--brand-soft);color:var(--brand);border-radius:3px}
#tip{
  position:fixed;z-index:99;max-width:330px;background:var(--ink);color:var(--bg);
  padding:.6rem .78rem;border-radius:var(--r-md);font-size:.82rem;line-height:1.5;
  display:none;box-shadow:0 8px 30px rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.08);
}
html[data-theme="dark"] #tip{background:#f0f1f5;color:#15161c}

/* ═══ FLECHAS DE DIAGRAMA ═══
   Un <path> con stroke pero sin fill toma el valor inicial (negro) y el
   navegador cierra el trazo implícitamente: aparece un triángulo relleno
   entre sus extremos. Forzamos fill:none para dejar solo la línea + la
   punta del <marker>, que sí lleva su color. */
svg path[stroke]:not([fill]){fill:none}
svg polyline:not([fill]){fill:none}
svg line{fill:none}

/* ═══ SVG ═══ */
svg{max-width:100%;height:auto;display:block;margin:.9rem auto}
svg text{font-family:var(--f-body)}

/* ═══ BUSCADOR ═══ */
mark.hit{background:linear-gradient(180deg,transparent 55%,#ffe066 55%);color:inherit;
  border-radius:2px;padding:0 1px;font-weight:600}
html[data-theme="dark"] mark.hit{background:linear-gradient(180deg,transparent 55%,#8a6d00 55%);color:#fff}

/* ═══ UTILIDADES ═══ */
.hide{display:none !important}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.small{font-size:var(--t-sm);color:var(--ink-2)}
.chip{
  display:inline-block;font-size:var(--t-xs);padding:.16rem .55rem;border-radius:var(--r-full);
  background:var(--brand-soft);color:var(--brand);font-weight:800;letter-spacing:.02em;
}

/* ═══ HUECOS RELLENABLES ═══ */
.gap{
  display:inline-block;min-width:5.5em;border-bottom:2px solid var(--brand);
  text-align:center;font-weight:700;color:transparent;cursor:pointer;
  transition:color .3s,background .3s;
}
.gap.on,.gap:hover{color:var(--brand);background:var(--brand-soft);border-radius:4px 4px 0 0}

/* ═══ REVELAR SOLUCIÓN ═══ */
.revelar{
  background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;border-color:transparent;
  font-weight:700;
}
.revelar:hover{box-shadow:var(--sh-3)}
.sol{
  margin-top:.7rem;padding:.8rem 1rem;border-radius:var(--r-md);
  background:var(--ej-bg);border-left:4px solid var(--ej);
  animation:slidein .4s var(--e-out);
}

/* ═══ TEST ═══ */
.opt{
  display:block;padding:.55rem .85rem;margin:.35rem 0;border:1.5px solid var(--line);
  border-radius:var(--r-md);cursor:pointer;background:var(--surface);font-size:.94rem;
  transition:border-color .22s,background .22s,transform .22s var(--e-out);
}
.opt:hover{border-color:var(--brand);background:var(--brand-soft);transform:translateX(4px)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft);font-weight:650}
.opt.ko{border-color:var(--exc);background:var(--exc-bg)}
.opt input{margin-right:.5rem;accent-color:var(--brand)}

#tscore,#semres{
  font-family:var(--f-display);font-weight:800;font-size:1.15rem;letter-spacing:-.02em;
}

/* ═══════════════════════════════════════════════════════════════
   FLASHCARDS 3D · mazo con giro, vuelo de salida y sheen
   ═══════════════════════════════════════════════════════════════ */
#flash{--fc-e:cubic-bezier(.2,.8,.25,1);--fc-h:250px}

/* — Escena — */
.fc-stage{
  perspective:1400px;perspective-origin:50% 45%;
  padding:.4rem 0 .2rem;position:relative;
}
.fc-deck{position:relative;height:var(--fc-h);will-change:transform}

/* — Cartas fantasma del mazo — */
.fc-ghost{
  position:absolute;inset:0;border-radius:var(--r-lg);
  background:var(--surface);border:1px solid var(--line);
  transition:transform .5s var(--fc-e),opacity .5s var(--fc-e);
}
.fc-ghost.g1{transform:translateY(9px) scale(.972);opacity:.75}
.fc-ghost.g2{transform:translateY(18px) scale(.944);opacity:.45}
.fc-deck.empty .fc-ghost{opacity:0;transform:translateY(26px) scale(.9)}

/* — Elevación durante el giro — */
.fc-lift{position:absolute;inset:0;transform-style:preserve-3d}
.fc-lift.lift{animation:fcLift .78s var(--fc-e)}
@keyframes fcLift{
  0%,100%{transform:scale(1) translateY(0)}
  45%{transform:scale(1.055) translateY(-16px)}
}
.fc-lift.out-ok{animation:fcOut .5s cubic-bezier(.5,0,.75,0) forwards}
.fc-lift.out-ko{animation:fcOutKo .5s cubic-bezier(.5,0,.75,0) forwards}
.fc-lift.in{animation:fcIn .48s var(--fc-e)}
@keyframes fcOut{
  0%{transform:translateX(0) rotate(0) scale(1);opacity:1}
  100%{transform:translateX(130%) rotate(17deg) scale(.85);opacity:0}
}
@keyframes fcOutKo{
  0%{transform:translateX(0) rotate(0) scale(1);opacity:1}
  100%{transform:translateX(-130%) rotate(-17deg) scale(.85);opacity:0}
}
@keyframes fcIn{
  0%{transform:translateY(26px) scale(.9);opacity:0}
  100%{transform:translateY(0) scale(1);opacity:1}
}

/* — La carta — */
.fc-card{
  position:absolute;inset:0;transform-style:preserve-3d;
  transition:transform .78s var(--fc-e);
  cursor:pointer;border-radius:var(--r-lg);
}
.fc-card:focus-visible{outline:none}
.fc-card:focus-visible .fc-face{box-shadow:var(--sh-glow),var(--sh-2)}

/* — Caras — */
.fc-face{
  position:absolute;inset:0;border-radius:var(--r-lg);
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  padding:2rem 2.2rem;text-align:center;overflow:hidden;
  box-shadow:var(--sh-2);
  transition:box-shadow .4s var(--fc-e);
}
.fc-card:hover .fc-face{box-shadow:var(--sh-3)}

/* Anverso · pregunta */
.fc-front{
  background:
    radial-gradient(120% 90% at 50% -20%, var(--brand-soft) 0%, transparent 60%),
    var(--surface);
  border:1.5px solid var(--line);color:var(--ink);
}
/* Reverso · respuesta */
.fc-back{
  transform:rotateY(180deg);
  background:linear-gradient(145deg,var(--brand) 0%,#6d4bf7 45%,var(--c5,#0891b2) 130%);
  border:1.5px solid transparent;color:#fff;
}
html[data-theme="dark"] .fc-back{
  background:linear-gradient(145deg,#5f45c9 0%,#4b3aa8 45%,#0e6b85 130%);
}
.fc-back .fc-txt{color:#fff}
.fc-back b,.fc-back strong{color:#fff;font-weight:800}

/* — Sheen que barre al girar — */
.fc-face::after{
  content:"";position:absolute;top:-60%;left:-70%;width:55%;height:220%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.42),transparent);
  transform:rotate(18deg);opacity:0;pointer-events:none;
}
.fc-lift.lift .fc-face::after{animation:fcSheen .78s var(--fc-e)}
@keyframes fcSheen{
  0%{opacity:0;left:-70%}
  35%{opacity:1}
  100%{opacity:0;left:150%}
}

/* — Etiqueta superior — */
.fc-tag{
  position:absolute;top:1rem;left:1.15rem;
  font-size:var(--t-xs);font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  display:inline-flex;align-items:center;gap:.4rem;
}
.fc-front .fc-tag{color:var(--brand)}
.fc-back .fc-tag{color:rgba(255,255,255,.9)}
.fc-tag::before{
  content:"";width:7px;height:7px;border-radius:50%;background:currentColor;
  animation:fcPulse 2.2s ease-in-out infinite;
}
@keyframes fcPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.65)}}

/* — Índice tipo naipe — */
.fc-pip{
  position:absolute;font-family:var(--f-display);font-weight:800;
  font-size:.78rem;letter-spacing:-.02em;opacity:.34;font-variant-numeric:tabular-nums;
}
.fc-pip.tr{top:1rem;right:1.15rem}
.fc-pip.bl{bottom:1rem;left:1.15rem;transform:rotate(180deg)}
.fc-front .fc-pip{color:var(--ink-2)}
.fc-back .fc-pip{color:#fff;opacity:.55}

/* — Texto — */
.fc-txt{
  font-size:clamp(1rem,.9rem + .55vw,1.28rem);font-weight:650;line-height:1.5;
  max-width:44ch;letter-spacing:-.012em;
}
.fc-front .fc-txt{font-family:var(--f-display);font-weight:700}
.fc-back .fc-txt{font-weight:600;line-height:1.6}
.fc-hint{
  position:absolute;bottom:1rem;left:0;right:0;
  font-size:var(--t-xs);font-weight:600;letter-spacing:.02em;
  display:flex;align-items:center;justify-content:center;gap:.4rem;
}
.fc-front .fc-hint{color:var(--ink-3)}
.fc-back .fc-hint{color:rgba(255,255,255,.72)}
.fc-hint .kbd{
  font-family:var(--f-mono);font-size:.68rem;font-weight:700;padding:.1rem .32rem;
  border-radius:5px;border:1px solid currentColor;opacity:.75;
}

/* — Pantalla final — */
.fc-done{
  position:absolute;inset:0;border-radius:var(--r-lg);
  background:linear-gradient(150deg,var(--ok-soft),var(--surface) 70%);
  border:1.5px solid var(--ok);
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  text-align:center;padding:2rem;gap:.35rem;
  animation:fcIn .5s var(--fc-e);box-shadow:var(--sh-2);
}
.fc-done .seal{
  font-size:2.6rem;line-height:1;
  animation:fcSeal .7s cubic-bezier(.2,1.5,.4,1);
}
@keyframes fcSeal{0%{transform:scale(0) rotate(-25deg);opacity:0}60%{transform:scale(1.2) rotate(6deg)}100%{transform:scale(1) rotate(0);opacity:1}}
.fc-done h3{font-size:1.3rem;font-weight:800;margin:.2rem 0 0}
.fc-done p{margin:0;color:var(--ink-2);font-size:var(--t-sm)}

/* — Barra de progreso de la ronda — */
.fc-bar{
  height:6px;border-radius:99px;background:var(--surface-3);
  overflow:hidden;margin:.95rem 0 .8rem;position:relative;
}
.fc-bar i{
  display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--brand),var(--c5,#0891b2));
  transition:width .55s var(--fc-e);
}

/* — Controles — */
.fc-ctrls{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.fc-ctrls button{font-weight:700}
#fcok{border-color:var(--ok);color:var(--ok)}
#fcok:hover{background:var(--ok);color:#fff;border-color:var(--ok)}
#fcko{border-color:var(--warn);color:var(--warn)}
#fcko:hover{background:var(--warn);color:#fff;border-color:var(--warn)}
#fcflip{background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;border-color:transparent}
#fcflip:hover{box-shadow:var(--sh-3)}

.fc-score{display:inline-flex;gap:.45rem;margin-left:auto;align-items:center}
.fc-pill{
  font-size:var(--t-xs);font-weight:800;padding:.24rem .6rem;border-radius:var(--r-full);
  font-variant-numeric:tabular-nums;border:1px solid;
}
.fc-pill.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.fc-pill.ko{color:var(--warn);border-color:var(--warn);background:var(--warn-bg)}
.fc-pill.left{color:var(--ink-2);border-color:var(--line);background:var(--surface-2)}
.fc-pill.bump{animation:fcBump .45s var(--e-spring)}
@keyframes fcBump{0%{transform:scale(1)}45%{transform:scale(1.28)}100%{transform:scale(1)}}

@media(max-width:620px){
  #flash{--fc-h:270px}
  .fc-face{padding:1.7rem 1.3rem}
  .fc-score{margin-left:0;width:100%}
}
@media(prefers-reduced-motion:reduce){
  .fc-card{transition:none}
  .fc-lift.lift,.fc-lift.in,.fc-lift.out-ok,.fc-lift.out-ko,.fc-face::after{animation:none !important}
}
@media print{.fc-stage,.fc-ctrls,.fc-bar{display:none !important}}
/* ═══ RESPUESTA ESTRUCTURADA ═══ */
.fc-face{justify-content:center}
.fc-face.struct{justify-content:flex-start;text-align:left;padding-top:3.1rem;padding-bottom:3.1rem}
.fc-body{
  width:100%;max-width:46ch;margin:0 auto;
  overflow-y:auto;max-height:100%;
  scrollbar-width:thin;
}
.fc-body::-webkit-scrollbar{width:5px}
.fc-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.35);border-radius:99px;border:0}
.fc-front .fc-body::-webkit-scrollbar-thumb{background:var(--line-strong)}

/* — Veredicto Sí / No — */
.fc-verdict{
  display:inline-flex;align-items:center;gap:.35rem;
  font-family:var(--f-display);font-weight:800;font-size:.82rem;
  letter-spacing:.06em;text-transform:uppercase;
  padding:.26rem .72rem;border-radius:var(--r-full);margin-bottom:.85rem;
  border:1.5px solid;animation:fcPopIn .45s var(--e-spring) backwards;animation-delay:.34s;
}
.fc-verdict.si{background:rgba(255,255,255,.16);border-color:rgba(190,255,215,.85);color:#d8ffe9}
.fc-verdict.no{background:rgba(255,255,255,.16);border-color:rgba(255,205,205,.85);color:#ffdedd}
@keyframes fcPopIn{0%{opacity:0;transform:scale(.7) translateY(6px)}100%{opacity:1;transform:none}}

/* — Párrafo — */
.fc-p{margin:0;font-size:clamp(1rem,.92rem + .45vw,1.2rem);font-weight:600;line-height:1.6}
.fc-face.struct .fc-p{font-size:clamp(.96rem,.9rem + .35vw,1.1rem)}

/* — Lista enumerada — */
.fc-list{list-style:none;margin:0;padding:0;display:grid;gap:.5rem;counter-reset:fc}
.fc-list li{
  counter-increment:fc;position:relative;margin:0;
  padding:.42rem .6rem .42rem 2.5rem;border-radius:var(--r-sm);
  background:rgba(255,255,255,.11);
  font-size:clamp(.92rem,.88rem + .3vw,1.04rem);font-weight:600;line-height:1.45;
  animation:fcRow .42s var(--e-out) backwards;
}
.fc-list li::before{
  content:counter(fc);position:absolute;left:.6rem;top:50%;transform:translateY(-50%);
  width:1.6rem;height:1.6rem;border-radius:50%;
  display:grid;place-items:center;
  background:rgba(255,255,255,.9);color:var(--brand);
  font-family:var(--f-display);font-weight:800;font-size:.78rem;
  font-variant-numeric:tabular-nums;
}
.fc-list.alpha li::before{content:counter(fc,lower-alpha)}
.fc-list li:nth-child(1){animation-delay:.36s}
.fc-list li:nth-child(2){animation-delay:.42s}
.fc-list li:nth-child(3){animation-delay:.48s}
.fc-list li:nth-child(4){animation-delay:.54s}
.fc-list li:nth-child(5){animation-delay:.60s}
.fc-list li:nth-child(n+6){animation-delay:.66s}
@keyframes fcRow{0%{opacity:0;transform:translateX(-12px)}100%{opacity:1;transform:none}}

/* — Cláusulas contrapuestas — */
.fc-clauses{display:grid;gap:.45rem}
.fc-clauses p{
  margin:0;padding:.45rem .7rem .45rem .95rem;border-radius:0 var(--r-sm) var(--r-sm) 0;
  background:rgba(255,255,255,.11);border-left:3px solid rgba(255,255,255,.55);
  font-size:clamp(.92rem,.88rem + .3vw,1.04rem);font-weight:600;line-height:1.5;
  animation:fcRow .42s var(--e-out) backwards;
}
.fc-clauses p:nth-child(1){animation-delay:.36s}
.fc-clauses p:nth-child(2){animation-delay:.44s}
.fc-clauses p:nth-child(3){animation-delay:.52s}

/* — Negritas resaltadas en el reverso — */
.fc-back .fc-body b,.fc-back .fc-body strong{
  font-weight:800;background:rgba(255,255,255,.2);
  padding:.03em .3em;border-radius:5px;
  box-decoration-break:clone;-webkit-box-decoration-break:clone;
}

/* — Cita legal al pie — */
.fc-cite{
  position:absolute;bottom:.95rem;left:0;right:0;
  display:inline-flex;align-items:center;justify-content:center;gap:.4rem;
  font-family:var(--f-mono);font-size:.74rem;font-weight:700;letter-spacing:.02em;
  color:rgba(255,255,255,.82);
  animation:fcPopIn .5s var(--e-out) backwards;animation-delay:.5s;
}
.fc-cite::before,.fc-cite::after{
  content:"";height:1px;width:clamp(18px,10%,52px);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.45));
}
.fc-cite::after{background:linear-gradient(90deg,rgba(255,255,255,.45),transparent)}
.fc-cite .s{font-size:.9rem;opacity:.75;font-family:var(--f-legal)}
.fc-front .fc-cite{color:var(--ink-3)}
.fc-front .fc-cite::before{background:linear-gradient(90deg,transparent,var(--line-strong))}
.fc-front .fc-cite::after{background:linear-gradient(90deg,var(--line-strong),transparent)}

/* la pista se oculta si hay cita, para no amontonar */
.fc-back .fc-cite ~ .fc-hint,.fc-back .fc-hint.muted{display:none}

@media(max-width:620px){
  #flash{--fc-h:320px}
  .fc-face.struct{padding-top:2.9rem;padding-bottom:2.8rem}
  .fc-list li{padding-left:2.3rem}
}
@media(prefers-reduced-motion:reduce){
  .fc-verdict,.fc-list li,.fc-clauses p,.fc-cite{animation:none !important}
}

/* ═══ SEMÁFORO ═══ */
.sembtn{
  border-radius:var(--r-full);padding:.32rem .7rem;font-weight:700;font-size:var(--t-sm);
}
.sembtn[data-v="g"]:hover,.sembtn.on[data-v="g"]{background:var(--ok);color:#fff;border-color:var(--ok)}
.sembtn[data-v="y"]:hover,.sembtn.on[data-v="y"]{background:var(--mid);color:#3d2f00;border-color:var(--mid)}
.sembtn[data-v="r"]:hover,.sembtn.on[data-v="r"]{background:var(--exc);color:#fff;border-color:var(--exc)}

/* ═══ CTA DE BLOQUE ═══ */
a.blk{
  display:inline-flex;align-items:center;gap:.5rem;
  background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;
  padding:.5rem .95rem;border-radius:var(--r-sm);font-weight:700;font-size:var(--t-sm);
  text-decoration:none;box-shadow:0 2px 10px var(--brand-ring);
  transition:transform .22s var(--e-spring),box-shadow .25s,gap .25s var(--e-out);
}
a.blk:hover{transform:translateY(-2px);box-shadow:var(--sh-3);gap:.75rem;text-decoration:none}
a.blk::after{content:"→"}
a.blk:active{transform:translateY(0) scale(.98)}

/* ═══ REVEAL ═══ */
.rv{opacity:0;transform:translateY(20px);transition:opacity .6s var(--e-out),transform .6s var(--e-out)}
.rv.in{opacity:1;transform:none}

/* ═══ RESPONSIVE ═══ */
@media(max-width:960px){
  .layout{grid-template-columns:1fr;padding-top:.9rem;gap:1rem}
  nav.side{position:static;max-height:none}
  nav.side.collapsed .navbody{display:none}
  .navtoggle{display:block;width:100%;text-align:left;font-weight:700}
  .grid2{grid-template-columns:1fr}
  .top h1 .sub{white-space:normal}
}
@media(max-width:620px){
  .top-in{padding:.55rem .8rem}
  .tools{width:100%;margin-left:0}
  /* en pantallas estrechas el título se achica un poco y puede llegar a
     tres líneas: preferimos eso a recortarlo y esconder texto */
  .top h1{font-size:.95rem}
  .top h1 .tit{-webkit-line-clamp:3}
  input[type=search]{flex:1;min-width:0}
  section.card{padding:1.05rem 1rem;border-radius:var(--r-md)}
  table{font-size:.82rem}
  th,td{padding:.4rem .5rem}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
  .rv{opacity:1;transform:none}
}
@media print{
  header.top,nav.side,.tools,.noprint,.progress{display:none !important}
  body{background:#fff;background-image:none;font-size:11pt;color:#000}
  .layout{display:block;max-width:none;padding:0}
  section.card{border:0;padding:0;margin:0 0 1rem;break-inside:avoid;box-shadow:none}
  details.panel{border:0;box-shadow:none}
  details.panel .body{display:block !important}
  details.panel>summary{padding-left:0}
  .art{break-inside:avoid}
  .rv{opacity:1;transform:none}
  a{color:#000;text-decoration:none}
}


/* ═══ ALTURA ADAPTATIVA DE LA TARJETA ═══ */
.fc-deck{transition:height .45s var(--fc-e)}
.fc-body{max-height:none;overflow:visible}
.fc-measure{
  position:absolute;left:0;right:0;top:0;height:auto;
  visibility:hidden;pointer-events:none;z-index:-1;
}
.fc-measure .fc-face{
  position:relative;inset:auto;height:auto;min-height:0;
  box-shadow:none;backface-visibility:visible;transform:none;
}
.fc-measure .fc-body{max-height:none;overflow:visible}
.fc-measure .fc-face::after{display:none}

/* ═══ MOSTRAR / OCULTAR ÍNDICE LATERAL ═══ */
.layout{transition:grid-template-columns .42s var(--e-out)}
.layout.nonav{grid-template-columns:0 1fr;gap:0}
.layout.nonav>nav.side{
  opacity:0;transform:translateX(-14px);pointer-events:none;
  padding:0;border-width:0;overflow:hidden;width:0;min-width:0;
}
nav.side{
  transition:opacity .3s var(--e-out),transform .38s var(--e-out);
  overflow-x:hidden;
}
#navhide .ic{display:inline-block;transition:transform .35s var(--e-spring);font-size:.95em;line-height:1}
#navhide[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
#navhide[aria-pressed="true"] .ic{transform:rotate(90deg)}
@media(max-width:960px){#navhide{display:none}}

/* ═══════════════════════════════════════════════════════════════
   LECTURA EN VOZ ALTA (TTS) del texto legal
   ═══════════════════════════════════════════════════════════════ */
.tts-bar{
  display:flex;align-items:center;gap:.45rem;flex-wrap:wrap;
  margin:.15rem 0 .7rem;
}
.tts-bar button{
  font-size:var(--t-xs);font-weight:700;padding:.3rem .62rem;
  border-radius:var(--r-full);border:1px solid var(--legal);
  background:transparent;color:var(--legal);
  display:inline-flex;align-items:center;gap:.35rem;line-height:1.2;
}
.tts-bar button:hover{background:var(--legal);color:var(--surface);border-color:var(--legal)}
.tts-bar button[hidden]{display:none}
.tts-bar .tts-play.on{background:var(--legal);color:var(--surface)}

/* Ondas de audio mientras lee */
.tts-wave{display:inline-flex;align-items:flex-end;gap:2px;height:11px}
.tts-wave i{
  width:2.5px;background:currentColor;border-radius:2px;height:35%;
  animation:ttsW .9s ease-in-out infinite;
}
.tts-wave i:nth-child(2){animation-delay:.15s}
.tts-wave i:nth-child(3){animation-delay:.3s}
.tts-wave i:nth-child(4){animation-delay:.45s}
@keyframes ttsW{0%,100%{height:32%}50%{height:100%}}

.tts-time{
  font-family:var(--f-mono);font-size:.7rem;font-weight:700;
  color:var(--ink-3);font-variant-numeric:tabular-nums;
}

/* Frase que se está leyendo */
.tts-s{transition:background .25s,color .25s;border-radius:3px}
.tts-s.now{
  background:linear-gradient(180deg,transparent 8%,color-mix(in srgb,var(--legal) 26%,transparent) 8%);
  box-shadow:0 0 0 2px color-mix(in srgb,var(--legal) 16%,transparent);
}
html[data-theme="dark"] .tts-s.now{
  background:linear-gradient(180deg,transparent 8%,color-mix(in srgb,var(--legal) 34%,transparent) 8%);
}
.legal.tts-on{box-shadow:0 0 0 3px color-mix(in srgb,var(--legal) 20%,transparent)}

/* ═══ Reproductor flotante ═══ */
.tts-mini{
  position:fixed;left:50%;bottom:1.1rem;transform:translateX(-50%) translateY(140%);
  z-index:80;display:flex;align-items:center;gap:.6rem;
  background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  border:1px solid var(--line);border-radius:var(--r-full);
  padding:.5rem .7rem .5rem .95rem;box-shadow:var(--sh-3);
  transition:transform .45s var(--e-spring),opacity .3s;opacity:0;pointer-events:none;
  max-width:min(94vw,540px);
}
.tts-mini.show{transform:translateX(-50%) translateY(0);opacity:1;pointer-events:auto}
.tts-mini .lbl{
  font-size:var(--t-xs);font-weight:800;color:var(--legal);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:16ch;
}
.tts-mini button{
  border-radius:50%;width:32px;height:32px;padding:0;display:grid;place-items:center;
  font-size:.8rem;border:1px solid var(--line);flex:none;
}
.tts-mini button.main{
  width:38px;height:38px;font-size:.95rem;
  background:linear-gradient(140deg,var(--legal),var(--brand));color:#fff;border-color:transparent;
}
.tts-mini .bar{
  flex:1;min-width:70px;height:5px;border-radius:99px;background:var(--surface-3);overflow:hidden;
}
.tts-mini .bar i{display:block;height:100%;width:0;background:var(--legal);
  border-radius:99px;transition:width .35s var(--e-out)}

/* ═══ Panel de ajustes de voz ═══ */
.tts-back{
  position:fixed;inset:0;z-index:90;background:rgba(10,10,18,.45);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  display:grid;place-items:center;padding:1rem;
  opacity:0;pointer-events:none;transition:opacity .3s var(--e-out);
}
.tts-back.show{opacity:1;pointer-events:auto}
.tts-panel{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--sh-3);width:min(94vw,470px);max-height:88vh;overflow:auto;
  padding:1.3rem 1.4rem;transform:translateY(16px) scale(.97);
  transition:transform .38s var(--e-spring);
}
.tts-back.show .tts-panel{transform:none}
.tts-panel h3{
  font-size:1.12rem;font-weight:800;margin:0 0 .25rem;
  display:flex;align-items:center;gap:.5rem;
}
.tts-panel .sub{font-size:var(--t-sm);color:var(--ink-2);margin:0 0 1.1rem}
.tts-row{margin-bottom:1.05rem}
.tts-row > label{
  display:block;font-size:var(--t-xs);font-weight:800;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-2);margin-bottom:.4rem;
}
.tts-seg{display:flex;gap:3px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:3px}
.tts-seg button{
  flex:1;border:0;background:transparent;border-radius:calc(var(--r-sm) - 3px);
  padding:.42rem .3rem;font-size:var(--t-sm);font-weight:700;box-shadow:none;
}
.tts-seg button:hover{transform:none;background:var(--surface)}
.tts-seg button[aria-pressed="true"]{
  background:linear-gradient(140deg,var(--legal),var(--brand));color:#fff;
}
.tts-panel select{
  width:100%;padding:.5rem .6rem;border-radius:var(--r-sm);
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  font-size:var(--t-sm);font-weight:600;cursor:pointer;
}
.tts-panel select:focus{border-color:var(--brand);outline:none}
.tts-slider{display:flex;align-items:center;gap:.75rem}
.tts-slider input[type=range]{flex:1;accent-color:var(--legal);cursor:pointer;height:22px}
.tts-val{
  font-family:var(--f-mono);font-weight:800;font-size:var(--t-sm);
  min-width:3.4em;text-align:right;color:var(--legal);font-variant-numeric:tabular-nums;
}
.tts-note{
  font-size:var(--t-xs);color:var(--ink-2);line-height:1.5;
  background:var(--surface-2);border-radius:var(--r-sm);padding:.6rem .75rem;margin:0 0 1rem;
}
.tts-note b{color:var(--ink)}
.tts-acts{display:flex;gap:.5rem;justify-content:flex-end;flex-wrap:wrap}
.tts-acts .prim{
  background:linear-gradient(140deg,var(--legal),var(--brand));color:#fff;border-color:transparent;
}
.tts-badge{
  font-size:.62rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
  padding:.1rem .35rem;border-radius:4px;background:var(--ej-bg);color:var(--ej);margin-left:.35rem;
}


/* — Variante compacta para los apartados desplegables — */
.tts-bar.mini{margin:0 0 .6rem}
.tts-bar.mini button{
  font-size:.7rem;padding:.24rem .55rem;
  border-color:var(--brand);color:var(--brand);
}
.tts-bar.mini button:hover{background:var(--brand);color:var(--surface)}
.tts-bar.mini .tts-play.on{background:var(--brand);color:var(--surface)}
.tts-bar.mini .tts-time{font-size:.66rem}
.idea .tts-bar.mini{margin:.55rem 0 0}
.legal.tts-on,.body.tts-on,.idea.tts-on{
  box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 20%,transparent)
}
.legal.tts-on{box-shadow:0 0 0 3px color-mix(in srgb,var(--legal) 20%,transparent)}


/* aviso de cambio de voz */
.tts-aviso{
  position:fixed;left:50%;bottom:5.2rem;transform:translateX(-50%) translateY(20px);
  z-index:95;max-width:min(92vw,460px);
  background:var(--warn-bg);border:1px solid var(--warn);color:var(--warn);
  border-radius:var(--r-md);padding:.6rem .9rem;font-size:var(--t-sm);font-weight:700;
  box-shadow:var(--sh-2);opacity:0;pointer-events:none;
  transition:opacity .3s var(--e-out),transform .35s var(--e-spring);
}
.tts-aviso.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:620px){
  .tts-mini{left:.6rem;right:.6rem;transform:translateY(140%);max-width:none}
  .tts-mini.show{transform:translateY(0)}
  .tts-mini .lbl{display:none}
}
@media(prefers-reduced-motion:reduce){
  .tts-wave i{animation:none;height:60%}
}
@media print{.tts-bar,.tts-mini,.tts-back{display:none !important}}

<script>
const GLOSARIO={"ve": "Valor estimado: importe total del contrato sin IVA, con prórrogas y modificaciones previstas (art. 101). Ej.: 2 años a 50.000 € + 1 de prórroga = 150.000 €.", "pbl": "Presupuesto base de licitación: límite máximo de gasto del contrato, con IVA (art. 100.1). Ej.: 100.000 € + 21 % = 121.000 €.", "record": "Recursos ordinarios del presupuesto: la LCSP no los define. Según el criterio habitual, son los ingresos corrientes de la entidad (capítulos 1 a 5: impuestos, tasas, transferencias corrientes…), sin préstamos ni ingresos de capital. Ej.: un municipio con 9.000.000 € de recursos ordinarios tiene un 10 % de 900.000 €.", "pcag": "Pliegos de cláusulas administrativas generales: pliegos tipo que la entidad aprueba para aplicarlos a muchos contratos (art. 121). En lo local, siempre los aprueba el Pleno. Ej.: un pliego general para todos los contratos de obras del ayuntamiento.", "jgl": "Junta de Gobierno Local: órgano colegiado formado por el Alcalde y concejales nombrados por él. En los municipios de gran población asume la contratación. Ej.: la Junta de Gobierno de Málaga capital.", "granpob": "Municipio de gran población: el sometido al Título X de la Ley 7/1985 (art. 121 LRBRL), como los de más de 250.000 habitantes o las capitales de provincia de más de 175.000. Ej.: Málaga.", "jcontr": "Junta de Contratación: órgano colegiado potestativo, creado por el Pleno, que actúa como órgano de contratación en ciertos contratos de reparación, conservación, consumibles y servicios, sin mesa. Ej.: una junta que adjudica los suministros de material de oficina.", "mesa": "Mesa de contratación: órgano de asistencia que califica la documentación, valora las ofertas y propone la adjudicación (art. 326; en lo local, DA 2.ª.7). Ej.: concejal presidente, Secretario, Interventor y dos técnicos.", "comite": "Comité de expertos: órgano que valora los criterios de juicio de valor cuando pesan más que los de fórmula (art. 146.2.a). En lo local, siempre con un técnico jurista especializado.", "eventual": "Personal eventual: el de confianza o asesoramiento especial nombrado libremente por el cargo político. No puede estar en la mesa ni valorar ofertas. Ej.: el jefe de gabinete de la Alcaldía.", "central": "Central de contratación: organismo que contrata para otros o adquiere de forma centralizada (art. 228). Ej.: la central de una diputación a la que se adhieren los pueblos de la provincia.", "anticipada": "Tramitación anticipada: preparar e incluso adjudicar el contrato antes de que el ejercicio de ejecución haya empezado o de que la financiación esté asegurada (art. 117.2 y DA 3.ª.2).", "suspensiva": "Condición suspensiva: hecho futuro e incierto del que depende que el acto produzca efectos. Ej.: la adjudicación solo surte efecto si se concede la subvención.", "fiscal": "Fiscalización: control previo de legalidad del gasto que ejerce el Interventor antes de que se apruebe. Ej.: el informe de fiscalización de la aprobación del expediente.", "estab": "Estabilidad presupuestaria: equilibrio o superávit en términos de contabilidad nacional (LO 2/2012). El Interventor fiscaliza cómo afecta cada contrato, salvo los menores.", "compmat": "Comprobación material de la inversión: el Interventor (o su representante) comprueba físicamente que la obra o el suministro se ha realizado, normalmente en la recepción.", "rc": "Certificación de existencia de crédito: documento del Interventor (o Secretario-Interventor) que acredita que hay saldo en la aplicación presupuestaria. En municipios de menos de 5.000 habitantes puede sustituir a la aprobación del gasto.", "viab": "Estudio de viabilidad: análisis previo de una concesión que justifica su conveniencia económica y su financiación (art. 247).", "superv": "Supervisión de proyectos: revisión técnica previa del proyecto de obra para comprobar que cumple la normativa (art. 235). Ej.: la oficina de supervisión de la Diputación revisa el proyecto de un pueblo.", "cee": "Centro Especial de Empleo de iniciativa social: empresa cuya plantilla la forman mayoritariamente personas con discapacidad, promovida por entidades sin ánimo de lucro o que reinvierte sus beneficios. Ej.: un centro de una asociación de discapacidad intelectual que hace jardinería.", "insercion": "Empresa de inserción: empresa que contrata a personas en exclusión social para facilitar su acceso al mercado de trabajo ordinario (Ley 44/2007).", "protegido": "Programa de empleo protegido: programa en el que la ejecución del contrato se encarga a trabajadores con discapacidad o en exclusión bajo un régimen de apoyo.", "doue": "Diario Oficial de la Unión Europea: donde se publican los anuncios de los contratos armonizados.", "opue": "Oficina de Publicaciones de la Unión Europea: recibe por vía electrónica los anuncios, confirma la recepción y los publica en el DOUE. Muchos plazos se cuentan desde el envío a ella.", "formul": "Formularios normalizados: modelos oficiales europeos de anuncio con estructura común, con la información del anexo III de la LCSP.", "naturales": "Días naturales: todos los días del calendario, incluidos sábados, domingos y festivos. Regla general de la LCSP (DA 12.ª).", "habiles": "Días hábiles: todos menos sábados, domingos y festivos (art. 30.2 Ley 39/2015). En la LCSP solo se usan cuando la Ley lo dice."};
const LABEL={"ve": "Valor estimado", "pbl": "Presupuesto base de licitación", "record": "Recursos ordinarios", "pcag": "Pliegos de cláusulas administrativas generales", "jgl": "Junta de Gobierno Local", "granpob": "Municipio de gran población", "jcontr": "Junta de Contratación", "mesa": "Mesa de contratación", "comite": "Comité de expertos", "eventual": "Personal eventual", "central": "Central de contratación", "anticipada": "Tramitación anticipada", "suspensiva": "Condición suspensiva", "fiscal": "Fiscalización", "estab": "Estabilidad presupuestaria", "compmat": "Comprobación material de la inversión", "rc": "Certificación de existencia de crédito", "viab": "Estudio de viabilidad", "superv": "Supervisión de proyectos", "cee": "CEE de iniciativa social", "insercion": "Empresa de inserción", "protegido": "Empleo protegido", "doue": "DOUE", "opue": "Oficina de Publicaciones de la UE", "formul": "Formularios normalizados", "naturales": "Días naturales", "habiles": "Días hábiles"};
const ARTS=[{"id": "da2", "lab": "DA 2.ª", "t": "Competencias en materia de contratación en las Entidades Locales", "ubic": "Ley 9/2017 ▸ Parte final ▸ Disposiciones adicionales · La primera de las dos disposiciones dedicadas a las entidades locales; la DA 3.ª completa sus reglas de tramitación", "idea": "En un ayuntamiento contrata el Alcalde, salvo que el contrato sea grande o largo: entonces, el Pleno.", "dis": "<p><b>Supuesto de hecho:<\/b> cualquier contrato que celebre una entidad local (ayuntamiento, diputación, mancomunidad…).<\/p>\n<p><b>Sujetos y consecuencia:<\/b> la disposición reparte la competencia de <b>órgano de contratación<\/b> y fija la composición de la mesa y del comité de expertos.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Órgano<\/th><th>Qué contrata<\/th><th>Límite<\/th><th>Ap.<\/th><\/tr><\/thead><tbody>\n<tr><td><b>Alcalde / Presidente<\/b><\/td><td>Obras, suministros, servicios, concesiones de obras y de servicios, administrativos especiales<\/td><td><span class=\"t\" data-k=\"ve\">Valor estimado<\/span> ≤ 10 % de los <span class=\"t\" data-k=\"record\">recursos ordinarios<\/span> <b>y<\/b> ≤ 6.000.000 €. Plurianuales: ≤ 4 años con prórrogas, y el acumulado de anualidades dentro de los dos límites (10 % referido al primer ejercicio)<\/td><td>1<\/td><\/tr>\n<tr><td><b>Pleno<\/b><\/td><td>Lo que por valor o duración no sea del Alcalde · aprobación de los <span class=\"t\" data-k=\"pcag\">pliegos de cláusulas administrativas generales<\/span> (art. 121)<\/td><td>Sin límite<\/td><td>2<\/td><\/tr>\n<tr><td><b>Pleno<\/b> (municipios &lt; 5.000 hab.)<\/td><td>Autorizar la redacción y licitación de proyectos independientes de las partes de una obra que dure más de un presupuesto anual<\/td><td>Partes separables o definibles<\/td><td>3<\/td><\/tr>\n<tr><td><b><span class=\"t\" data-k=\"jgl\">Junta de Gobierno Local<\/span><\/b> (<span class=\"t\" data-k=\"granpob\">gran población<\/span>)<\/td><td>Todo lo anterior, y también lo patrimonial (ap. 11)<\/td><td>Cualquier importe o duración · los pliegos generales, el Pleno<\/td><td>4 y 11<\/td><\/tr>\n<tr><td><b><span class=\"t\" data-k=\"jcontr\">Juntas de Contratación<\/span><\/b> (potestativas)<\/td><td>Obras de reparación simple, conservación y mantenimiento · suministros consumibles o de fácil deterioro · servicios<\/td><td>Los fija el Pleno (la JGL en gran población) y pueden ser inferiores. Para los servicios, el texto pide VE ≤ 10 % de recursos ordinarios o, si lo supera, previsión en el presupuesto y en las bases de ejecución<\/td><td>5<\/td><\/tr>\n<tr><td><b>Alcalde / Presidente<\/b><\/td><td>Contratos privados, concesiones sobre bienes, adquisición de inmuebles y derechos, enajenación de patrimonio<\/td><td><span class=\"t\" data-k=\"pbl\">PBL<\/span> (art. 100.1) o valor ≤ 10 % <b>y<\/b> ≤ 3.000.000 €<\/td><td>9<\/td><\/tr>\n<tr><td><b>Pleno<\/b><\/td><td>Lo patrimonial que no sea del Alcalde · bienes de valor histórico o artístico<\/td><td>Histórico-artísticos: cualquier valor<\/td><td>10<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Órganos de asistencia:<\/b><\/p>\n<ul>\n<li><b><span class=\"t\" data-k=\"mesa\">Mesa de contratación<\/span> (ap. 7):<\/b> preside un miembro de la Corporación o un funcionario. Vocales obligatorios: el <b>Secretario<\/b> (o el titular de la asesoría jurídica) y el <b>Interventor<\/b> (o el titular del control económico-presupuestario). Más los que designe el órgano entre funcionarios de carrera, personal laboral o electos. Mínimo <b>3<\/b> en total; electos, como mucho <b>1/3<\/b>. Secretario de la mesa: un funcionario. Nunca <span class=\"t\" data-k=\"eventual\">personal eventual<\/span>, ni para valorar. Interinos solo si no hay funcionarios de carrera cualificados y así se acredita. Composición publicada en el perfil. Puede haber mesas permanentes.<\/li>\n<li><b><span class=\"t\" data-k=\"comite\">Comité de expertos<\/span> (ap. 8):<\/b> cualquier funcionario de carrera o laboral fijo cualificado que no haya redactado la documentación técnica, y siempre un <b>técnico jurista especializado en contratación pública<\/b>.<\/li>\n<\/ul>\n<p><b>Pequeños municipios (ap. 6) y diputaciones (ap. 12):<\/b> los de menos de 5.000 habitantes pueden ejercer sus competencias mediante <span class=\"t\" data-k=\"central\">centrales de contratación<\/span> (art. 228) o encomendar la gestión del procedimiento a la Diputación por convenio. Lo que la Ley dice de las diputaciones vale también para los entes supramunicipales de los Estatutos de Autonomía.<\/p>", "llano": "<p>En un ayuntamiento normal, el Alcalde firma los contratos del día a día. Si el contrato es muy grande (más del 10 % de lo que el ayuntamiento ingresa de forma ordinaria en un año, o más de 6 millones) o dura más de cuatro años contando las prórrogas, decide el Pleno.<\/p>\n<p>En las grandes ciudades no hay que hacer cuentas: todo lo contrata la Junta de Gobierno Local.<\/p>\n<p>Para vender, comprar o ceder bienes del ayuntamiento hay otra regla parecida, con un tope de 3 millones en vez de 6.<\/p>\n<p>Y la mesa que estudia las ofertas tiene que llevar siempre al Secretario y al Interventor. Los políticos no pueden pasar de un tercio y el personal de confianza no puede estar.<\/p>", "porque": "<p><b>Explicación:<\/b> la disposición busca equilibrar <b>agilidad<\/b> y <b>control<\/b>. El Alcalde, órgano ejecutivo, resuelve rápido lo ordinario. El Pleno, donde está representada la oposición, decide lo que compromete mucho dinero o ata presupuestos de varios años.<\/p>\n<p>El límite se mide en <b>porcentaje<\/b> de los recursos ordinarios para que escale con el tamaño de cada entidad: el 10 % de un pueblo pequeño es poco dinero; el de una diputación, mucho. El tope absoluto (6 o 3 millones) impide que en las entidades grandes el Alcalde decida solo sobre cifras enormes.<\/p>\n<p>La composición de la mesa protege la <b>imparcialidad técnica<\/b>. Por eso exige control jurídico y económico, limita el peso político a un tercio y excluye al personal de confianza política.<\/p>", "ej": "<ul>\n<li><b>Cotidiano:<\/b> en una comunidad de vecinos, el presidente encarga solo una reparación pequeña. Una derrama grande, o un contrato de mantenimiento a varios años, lo decide la junta de propietarios.<\/li>\n<li><b>Real:<\/b> el Ayuntamiento de Sierra Alta (12.000 habitantes) tiene 9.000.000 € de recursos ordinarios en 2027, así que su 10 % son 900.000 €. Primer contrato: limpieza de edificios por 2 años + 2 de prórroga, con un VE de 640.000 €. Lo adjudica el <b>Alcalde<\/b>: está por debajo de 900.000 € y dura exactamente 4 años. Segundo contrato: el mismo, pero con 3 + 2 años. Lo adjudica el <b>Pleno<\/b>: el importe cabe, pero la duración pasa de cuatro años.<\/li>\n<li><b>Caso límite:<\/b> el Ayuntamiento de Puerto Claro, que no es de gran población, tiene 80.000.000 € de recursos ordinarios, y su 10 % son 8.000.000 €. Un contrato de obra de 6.500.000 € está dentro del 10 %, pero supera los 6.000.000 €. Lo adjudica el <b>Pleno<\/b>, porque los dos límites son acumulativos.<\/li>\n<\/ul>", "noej": "<ul>\n<li><b>Una concesión sobre un bien municipal<\/b> (un quiosco en un parque) no se mide por el ap. 1, sino por el 9: <b>PBL<\/b>, que lleva IVA, y tope de <b>3.000.000 €<\/b>.<\/li>\n<li><b>Una ciudad de gran población<\/b> no aplica ni el 10 % ni los 4 años: contrata siempre la Junta de Gobierno Local.<\/li>\n<li><b>Un asesor de la Alcaldía<\/b> (personal eventual) no puede ser vocal de la mesa ni firmar el informe de valoración, aunque sea experto en la materia.<\/li>\n<li><b>Vender un cuadro declarado de valor artístico<\/b> por 20.000 € no es competencia del Alcalde, aunque la cifra sea pequeña: siempre corresponde al Pleno (ap. 10).<\/li>\n<\/ul>", "conex": "<ul>\n<li><b>Art. 101:<\/b> cómo se calcula el valor estimado que mide el ap. 1, sin IVA y con prórrogas.<\/li>\n<li><b>Art. 100.1:<\/b> el presupuesto base de licitación, con IVA, que mide el ap. 9.<\/li>\n<li><b>Art. 29.4:<\/b> los servicios pueden durar hasta 5 años. Un contrato de 5 años es legal, pero sale del Alcalde y va al Pleno.<\/li>\n<li><b>Art. 326 y art. 159.4.d):<\/b> régimen general de la mesa y mesa del simplificado. Art. 146.2.a): cuándo hace falta comité de expertos.<\/li>\n<li><b>Art. 121:<\/b> los pliegos de cláusulas administrativas generales. Art. 228: centrales de contratación.<\/li>\n<li><b>DA 3.ª:<\/b> completa esta disposición con las reglas de tramitación (fiscalización, informes, pequeños municipios).<\/li>\n<li><b>Aparente contradicción:<\/b> el ap. 1 mide con el <b>valor estimado<\/b> (sin IVA) y el ap. 9, con el <b>PBL<\/b> (con IVA). No es un error: son dos magnitudes distintas para dos tipos de negocio distintos.<\/li>\n<\/ul>", "trampas": "<ul>\n<li><b>«No supere»<\/b> significa ≤. Un contrato que alcanza justo el 10 % sigue siendo del Alcalde.<\/li>\n<li>Los dos límites son <b>acumulativos<\/b>: 10 % <b>y<\/b> 6 millones. Basta con superar uno para que sea del Pleno.<\/li>\n<li>Los 4 años incluyen las <b>prórrogas eventuales<\/b>, no solo la duración inicial.<\/li>\n<li><b>6.000.000 €<\/b> en contratos, <b>3.000.000 €<\/b> en patrimonio. Valor estimado sin IVA frente a PBL con IVA.<\/li>\n<li>En gran población, el <b>Pleno<\/b> conserva los pliegos de cláusulas administrativas <b>generales<\/b>. Los particulares los aprueba el órgano de contratación.<\/li>\n<li>Mesa: el presidente concejal <b>cuenta<\/b> como electo para el tercio. El secretario de la mesa es un funcionario.<\/li>\n<li>Juntas de Contratación: son <b>potestativas<\/b>, las crea el <b>Pleno<\/b> y, cuando actúan, <b>no hay mesa<\/b>.<\/li>\n<\/ul>", "ancla": "<p><b>«Al Alcalde le caben 10-6-4»:<\/b> 10 % de los recursos ordinarios · 6 millones · 4 años con prórrogas. En patrimonio, <b>«10-3 con IVA»<\/b>.<\/p>\n<p><b>Mesa «3-1/3-0»:<\/b> mínimo 3 miembros · electos como mucho 1/3 · cero eventuales.<\/p>\n<p><b>Comité: «el jurista no falta»<\/b>.<\/p>", "vis": "<svg viewBox=\"0 0 640 481\" role=\"img\" aria-label=\"Árbol de decisión de la DA 2.ª\" style=\"width:100%;height:auto\"><defs><marker id=\"ks80ox\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\"><path d=\"M0 0 L9 4.5 L0 9 z\" fill=\"var(--acc)\"/></marker><marker id=\"ks80oxs\" markerWidth=\"9\" markerHeight=\"9\" refX=\"1\" refY=\"4.5\" orient=\"auto\"><path d=\"M9 0 L0 4.5 L9 9 z\" fill=\"var(--acc)\"/></marker></defs><rect x=\"131.3\" y=\"8\" width=\"377.4\" height=\"30\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"320\" y=\"27\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">¿Quién es el órgano de contratación en una entidad local?</text><rect x=\"12\" y=\"50\" width=\"616\" height=\"58\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"24\" y=\"63\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"99\" y=\"83\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">¿Gran población?</text><text x=\"186\" y=\"68.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Sí (art. 121 LRBRL): Junta de Gobierno Local, con cualquier importe o</text><text x=\"186\" y=\"82.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">duración</text><text x=\"186\" y=\"96.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">El Pleno conserva la aprobación de los pliegos de cláusulas generales</text><text x=\"616\" y=\"70\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">DA 2.ª.4 y 11</text><rect x=\"12\" y=\"130\" width=\"616\" height=\"52\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"24\" y=\"140\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"99\" y=\"160\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">¿Contrato o bienes?</text><text x=\"186\" y=\"152.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Contratos públicos: se mide el valor estimado, sin IVA</text><text x=\"186\" y=\"166.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Privados, bienes, inmuebles y enajenaciones: se mide el PBL o el valor</text><text x=\"616\" y=\"150\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">DA 2.ª.1 y 9</text><rect x=\"12\" y=\"204\" width=\"616\" height=\"58\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><rect x=\"24\" y=\"217\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--ej)\"/><text x=\"99\" y=\"237\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">Alcalde o Presidente</text><text x=\"186\" y=\"222.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Contratos: VE ≤ 10 % rec. ordinarios y ≤ 6.000.000 € · ≤ 4 años con</text><text x=\"186\" y=\"236.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">prórrogas</text><text x=\"186\" y=\"250.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Patrimonio: PBL o valor ≤ 10 % recursos ordinarios y ≤ 3.000.000 €</text><text x=\"616\" y=\"224\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">DA 2.ª.1 y 9</text><rect x=\"12\" y=\"284\" width=\"616\" height=\"72\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"24\" y=\"304\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"99\" y=\"324\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--warn)\">Pleno</text><text x=\"186\" y=\"302.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Lo que exceda por valor o duración · pliegos de cláusulas generales</text><text x=\"186\" y=\"316.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">(art. 121)</text><text x=\"186\" y=\"330.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Bienes histórico-artísticos, cualquier valor · &lt; 5.000 hab.: obra por</text><text x=\"186\" y=\"344.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">partes</text><text x=\"616\" y=\"304\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">DA 2.ª.2, 3 y 10</text><rect x=\"12\" y=\"378\" width=\"616\" height=\"52\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><rect x=\"24\" y=\"388\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--exc)\"/><text x=\"99\" y=\"408\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--exc)\">Juntas de Contratación</text><text x=\"186\" y=\"400.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Potestativas, creadas por el Pleno · reparación, conservación, consumibles</text><text x=\"186\" y=\"414.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Con Secretario e Interventor · actúan sin mesa de contratación</text><text x=\"616\" y=\"398\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">DA 2.ª.5</text><rect x=\"12\" y=\"442\" width=\"616\" height=\"31\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"320\" y=\"461\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">Los límites son acumulativos: basta con superar uno para que decida el Pleno</text><path d=\"M320 109 L 320 128\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#ks80ox)\"/><path d=\"M320 183 L 320 202\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#ks80ox)\"/><path d=\"M320 263 L 320 282\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#ks80ox)\"/><path d=\"M320 357 L 320 376\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#ks80ox)\"/></svg><svg viewBox=\"0 0 640 455\" role=\"img\" aria-label=\"Composición de la mesa y del comité\" style=\"width:100%;height:auto\"><defs><marker id=\"k0c34y\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\"><path d=\"M0 0 L9 4.5 L0 9 z\" fill=\"var(--acc)\"/></marker><marker id=\"k0c34ys\" markerWidth=\"9\" markerHeight=\"9\" refX=\"1\" refY=\"4.5\" orient=\"auto\"><path d=\"M9 0 L0 4.5 L9 9 z\" fill=\"var(--acc)\"/></marker></defs><rect x=\"146.3\" y=\"8\" width=\"347.3\" height=\"30\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"320\" y=\"27\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">La mesa y el comité de expertos en una entidad local</text><rect x=\"12\" y=\"50\" width=\"616\" height=\"52\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"24\" y=\"60\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"99\" y=\"80\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">Presidencia</text><text x=\"186\" y=\"79.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Un miembro de la Corporación o un funcionario de la misma</text><text x=\"616\" y=\"70\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">DA 2.ª.7</text><rect x=\"12\" y=\"124\" width=\"616\" height=\"52\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"24\" y=\"134\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"99\" y=\"154\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">Vocales fijos</text><text x=\"186\" y=\"153.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Secretario o asesoría jurídica · Interventor o titular del control económico</text><text x=\"616\" y=\"144\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">DA 2.ª.7</text><rect x=\"12\" y=\"198\" width=\"616\" height=\"58\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><rect x=\"24\" y=\"211\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--ej)\"/><text x=\"99\" y=\"231\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">Otros vocales</text><text x=\"186\" y=\"216.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Funcionarios de carrera, laborales o electos · total ≥ 3 · electos ≤ 1/3</text><text x=\"186\" y=\"230.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Puede entrar personal de la Diputación (municipios, mancomunidades,</text><text x=\"186\" y=\"244.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">consorcios)</text><text x=\"616\" y=\"218\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">DA 2.ª.7</text><rect x=\"12\" y=\"278\" width=\"616\" height=\"52\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><rect x=\"24\" y=\"288\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--exc)\"/><text x=\"99\" y=\"308\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--exc)\">Prohibiciones</text><text x=\"186\" y=\"300.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Nunca personal eventual, ni en la mesa ni en los informes de valoración</text><text x=\"186\" y=\"314.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Interinos solo si faltan funcionarios de carrera cualificados y se acredita</text><text x=\"616\" y=\"298\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">DA 2.ª.7</text><rect x=\"12\" y=\"352\" width=\"616\" height=\"52\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"24\" y=\"362\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"99\" y=\"382\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--warn)\">Comité de expertos</text><text x=\"186\" y=\"374.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Funcionarios de carrera o laborales fijos ajenos a la documentación técnica</text><text x=\"186\" y=\"388.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Siempre con un técnico jurista especializado en contratación pública</text><text x=\"616\" y=\"372\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">DA 2.ª.8</text><rect x=\"12\" y=\"416\" width=\"616\" height=\"31\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"320\" y=\"435\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">Secretario de la mesa: un funcionario · composición publicada en el perfil · mesas permanentes posibles</text><path d=\"M320 103 L 320 122\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#k0c34y)\"/><path d=\"M320 177 L 320 196\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#k0c34y)\"/><path d=\"M320 257 L 320 276\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#k0c34y)\"/><path d=\"M320 331 L 320 350\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#k0c34y)\"/></svg>", "literal": "<p><b>1.<\/b> Corresponden a los Alcaldes y a los Presidentes de las Entidades Locales las competencias como órgano de contratación respecto de los contratos de obras, de suministro, de servicios, los contratos de concesión de obras, los contratos de concesión de servicios y los contratos administrativos especiales, cuando su valor estimado no supere el 10 por ciento de los recursos ordinarios del presupuesto ni, en cualquier caso, la cuantía de seis millones de euros, incluidos los de carácter plurianual cuando su duración no sea superior a cuatro años, eventuales prórrogas incluidas siempre que el importe acumulado de todas sus anualidades no supere ni el porcentaje indicado, referido a los recursos ordinarios del presupuesto del primer ejercicio, ni la cuantía señalada.<\/p><p><b>2.<\/b> Corresponden al Pleno las competencias como órgano de contratación respecto de los contratos mencionados en el apartado anterior que celebre la Entidad Local, cuando por su valor o duración no correspondan al Alcalde o Presidente de la Entidad Local, conforme al apartado anterior. Asimismo, corresponde al Pleno la aprobación de los pliegos de cláusulas administrativas generales a los que se refiere el artículo 121 de esta Ley.<\/p><p><b>3.<\/b> En los municipios de población inferior a 5.000 habitantes es igualmente competencia del Pleno autorizar la redacción y licitación de proyectos independientes relativos a cada una de las partes de una obra cuyo periodo de ejecución exceda al de un presupuesto anual, siempre que estas sean susceptibles de utilización separada en el sentido del uso general o del servicio, o puedan ser sustancialmente definidas.<\/p><p><b>4.<\/b> En los municipios de gran población a que se refiere el artículo 121 de la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local, las competencias del órgano de contratación que se describen en los apartados anteriores se ejercerán por la Junta de Gobierno Local, cualquiera que sea el importe del contrato o la duración del mismo, siendo el Pleno el competente para aprobar los pliegos de cláusulas administrativas generales.<\/p><p><b>5.<\/b> En las Entidades Locales será potestativa la constitución de Juntas de Contratación que actuarán como órganos de contratación en los contratos de obras que tengan por objeto trabajos de reparación simple, de conservación y de mantenimiento, en los contratos de suministro que se refieran a bienes consumibles o de fácil deterioro por el uso, y en los contratos de servicios cuando su valor estimado no supere el 10 por ciento de los recursos ordinarios de la Entidad, o cuando superen este importe las acciones estén previstas en el presupuesto del ejercicio a que corresponda y se realicen de acuerdo con lo dispuesto en las bases de ejecución de este.<\/p><p>Corresponde al Pleno acordar la constitución de las Juntas de Contratación y determinar su composición, debiendo formar parte de las mismas necesariamente el Secretario o el titular del órgano que tenga atribuida la función de asesoramiento jurídico de la Corporación, y el Interventor de la misma. Los límites cuantitativos, que podrán ser inferiores a los señalados en el párrafo anterior, o los referentes a las características de los contratos en los que intervendrá la Junta de Contratación como órgano de contratación, se determinarán, en los municipios de gran población por la Junta de Gobierno Local y en las restantes entidades locales, por el Pleno, a propuesta del Alcalde o del Presidente cuando sea, el órgano que tenga atribuida la competencia sobre dichos contratos, de acuerdo con el apartado 2.<\/p><p>En los casos de actuación de las Juntas de Contratación se prescindirá de la intervención de la Mesa de contratación.<\/p><p><b>6.<\/b> En los municipios de población inferior a 5.000 habitantes las competencias en materia de contratación podrán ser ejercidas por los órganos que, con carácter de centrales de contratación, se constituyan en la forma prevista en el artículo 228 de la presente Ley, mediante acuerdos al efecto.<\/p><p>Asimismo podrán concertarse convenios en virtud de los cuales se encomiende la gestión del procedimiento de contratación a las Diputaciones provinciales o a las Comunidades Autónomas de carácter uniprovincial.<\/p><p><b>7.<\/b> La Mesa de contratación estará presidida por un miembro de la Corporación o un funcionario de la misma, y formarán parte de ella, como vocales, el Secretario o, en su caso, el titular del órgano que tenga atribuida la función de asesoramiento jurídico, y el Interventor, o, en su caso, el titular del órgano que tenga atribuidas la función de control económico-presupuestario, así como aquellos otros que se designen por el órgano de contratación entre el personal funcionario de carrera o personal laboral al servicio de la Corporación, o miembros electos de la misma, sin que su número, en total, sea inferior a tres. Los miembros electos que, en su caso, formen parte de la Mesa de contratación no podrán suponer más de un tercio del total de miembros de la misma. Actuará como Secretario un funcionario de la Corporación.<\/p><p>En las Entidades locales municipales, mancomunidades y consorcios locales, podrán integrarse en la Mesa personal al servicio de las correspondientes Diputaciones Provinciales o Comunidades Autónomas uniprovinciales.<\/p><p>En ningún caso podrá formar parte de las Mesas de contratación ni emitir informes de valoración de las ofertas, personal eventual. Podrá formar parte de la Mesa personal funcionario interino únicamente cuando no existan funcionarios de carrera suficientemente cualificados y así se acredite en el expediente.<\/p><p>La composición de la Mesa se publicará en el perfil de contratante del órgano de contratación correspondiente. Se podrán constituir Mesas de Contratación permanentes.<\/p><p><b>8.<\/b> El comité de expertos a que se refiere la letra a) del apartado 2 del artículo 146 de la presente Ley, para la valoración de los criterios que dependan de un juicio de valor, podrá estar integrado en las Entidades locales por cualquier personal funcionario de carrera o laboral fijo con cualificación apropiada que no haya participado en la redacción de la documentación técnica del contrato de que se trate. En todo caso, entre este personal deberá formar parte un técnico jurista especializado en contratación pública.<\/p><p><b>9.<\/b> En las entidades locales corresponde a los Alcaldes y a los Presidentes de las Entidades Locales la competencia para la celebración de los contratos privados, así como la adjudicación de concesiones sobre los bienes de las mismas y la adquisición de bienes inmuebles y derechos sujetos a la legislación patrimonial cuando el presupuesto base de licitación, en los términos definidos en el artículo 100.1, no supere el 10 por ciento de los recursos ordinarios del presupuesto ni el importe de tres millones de euros, así como la enajenación del patrimonio, cuando su valor no supere el porcentaje ni la cuantía indicados.<\/p><p><b>10.<\/b> Corresponde al Pleno la competencia para celebrar contratos privados, la adjudicación de concesiones sobre los bienes de la Corporación y la adquisición de bienes inmuebles y derechos sujetos a la legislación patrimonial así como la enajenación del patrimonio cuando no estén atribuidas al Alcalde o al Presidente, y de los bienes declarados de valor histórico o artístico cualquiera que sea su valor.<\/p><p><b>11.<\/b> En los municipios de gran población a que se refiere el artículo 121 de la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local, las competencias que se describen en los apartados anteriores se ejercerán por la Junta de Gobierno Local, cualquiera que sea el importe del contrato o la duración del mismo.<\/p><p><b>12.<\/b> Las referencias a las Diputaciones provinciales contenidas en esta Ley también se entenderán efectuadas a los entes locales supramunicipales previstos en los correspondientes Estatutos de Autonomía con competencias en materia de asistencia y de cooperación a los municipios, y de prestación de servicios públicos locales.<\/p>", "n": 2}, {"id": "da3", "lab": "DA 3.ª", "t": "Normas específicas de contratación pública en las Entidades Locales", "ubic": "Ley 9/2017 ▸ Parte final ▸ Disposiciones adicionales · Complementa la DA 2.ª: once reglas de tramitación propias de la Administración local", "idea": "Once especialidades locales: el Interventor fiscaliza, el Secretario informa y los pueblos pequeños simplifican.", "dis": "<div class=\"tw\"><table><thead><tr><th>Ap.<\/th><th>Regla<\/th><th>Quién<\/th><th>Cifra o condición<\/th><\/tr><\/thead><tbody>\n<tr><td>1<\/td><td>Las entidades locales aplican la LCSP con las especialidades de las DA 2.ª y 3.ª<\/td><td>Todas<\/td><td>—<\/td><\/tr>\n<tr><td>2<\/td><td><span class=\"t\" data-k=\"anticipada\">Tramitación anticipada<\/span>: ejecución en el ejercicio siguiente, o financiación pendiente de préstamo, crédito o subvención solicitada<\/td><td>Órgano de contratación<\/td><td>Adjudicación bajo <span class=\"t\" data-k=\"suspensiva\">condición suspensiva<\/span><\/td><\/tr>\n<tr><td>3<\/td><td><span class=\"t\" data-k=\"fiscal\">Fiscalización<\/span>, también de la valoración de las repercusiones en <span class=\"t\" data-k=\"estab\">estabilidad presupuestaria<\/span> · <span class=\"t\" data-k=\"compmat\">comprobación material de la inversión<\/span> · muestreo · asistencia de un técnico en la recepción<\/td><td><b>Interventor<\/b><\/td><td>Excepto contratos menores (valoración de estabilidad) · técnico ≠ director de obra ≠ responsable del contrato<\/td><\/tr>\n<tr><td>4<\/td><td>La aprobación del gasto puede sustituirse por <span class=\"t\" data-k=\"rc\">certificación de existencia de crédito<\/span><\/td><td>Secretario-Interventor o Interventor<\/td><td>Municipios de <b>menos de 5.000<\/b> habitantes<\/td><\/tr>\n<tr><td>5<\/td><td>Concesiones de obras y de servicios: el expediente de conveniencia y oportunidad (art. 86.1 LRBRL) se tramita junto con el <span class=\"t\" data-k=\"viab\">estudio de viabilidad<\/span><\/td><td>—<\/td><td>—<\/td><\/tr>\n<tr><td>6<\/td><td><span class=\"t\" data-k=\"superv\">Supervisión de proyectos<\/span> de obras (art. 235) por oficinas propias o, si faltan, de la Diputación o la CA uniprovincial<\/td><td>—<\/td><td>El acuerdo de aprobación cita la supervisión favorable<\/td><\/tr>\n<tr><td>7<\/td><td>Obras cuya financiación excede un presupuesto anual: proyectos independientes por partes, cada uno un contrato<\/td><td>—<\/td><td><b>Menos de 5.000<\/b> hab. · sin perjuicio de los arts. 99 y 101<\/td><\/tr>\n<tr><td>8<\/td><td>Informes jurídicos y coordinación de la transparencia<\/td><td><b>Secretario<\/b> (gran población: asesoría jurídica y Órgano de Apoyo a la JGL)<\/td><td>Informe preceptivo en 7 casos<\/td><\/tr>\n<tr><td>9<\/td><td>Adquisición de inmuebles (y de títulos de entidades del sector público local): pago aplazado<\/td><td>—<\/td><td>Hasta <b>4 años<\/b><\/td><\/tr>\n<tr><td>10<\/td><td>Adhesión a <span class=\"t\" data-k=\"central\">centrales de contratación<\/span>: estatal, autonómicas, de otras EELL, de asociaciones de EELL y de la AGE<\/

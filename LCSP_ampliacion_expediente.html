<script>
document.getElementById('main').innerHTML="\n<section class=\"card\" id=\"intro\"><h2>Temas 9 y 10 · Ampliación: del artículo 28 al contrato firmado</h2>\n<div class=\"box exc\"><span class=\"lbl\">Por qué existe esta página</span>Los supuestos prácticos reales de la Diputación de Málaga <b>no se detienen en el art. 27</b>. Preguntan por el <b>valor estimado</b> (art. 101), el <b>expediente de contratación</b> (arts. 116 y 117), los <b>contratos menores</b> (art. 118), el <b>procedimiento</b> y los <b>anuncios</b> (arts. 131 y 135), la <b>garantía definitiva</b> (art. 107), la <b>formalización</b> (art. 153) y el <b>recurso especial</b> (arts. 44 y 50). Esta página cubre justo ese tramo, que faltaba.</div>\n<div class=\"box ej\"><span class=\"lbl\">La idea que ordena la ampliación</span>Un contrato administrativo se construye en <b>seis movimientos</b>: <b>por qué</b> (necesidad, art. 28) → <b>cuánto</b> (valor estimado, art. 101) → <b>con qué papeles</b> (expediente, arts. 116-117) → <b>cómo se elige</b> (procedimiento y anuncios, arts. 131-135) → <b>a quién y con qué garantía</b> (adjudicación y art. 107) → <b>cuándo queda cerrado</b> (formalización, art. 153).</div>\n<div class=\"box warn\"><span class=\"lbl\">Fuentes utilizadas y vigencia</span>\n<ul><li><b>Ley 9/2017, de 8 de noviembre</b>, de Contratos del Sector Público (documento 7 de la biblioteca), texto consolidado. Artículos citados y verificados uno a uno.</li>\n<li>Los <b>umbrales</b> de los arts. 20 a 23 y los importes del art. 159 se actualizan por reglamento delegado de la Comisión Europea y orden ministerial: <b>verifícalos en el BOE antes del examen</b>.</li>\n<li><b>Aportación externa</b>: la <b>Ley 47/2003, General Presupuestaria</b>, citada por el art. 116.3 a efectos de fiscalización previa; en las entidades locales esa función es la de los arts. 214 a 218 del TRLHL (documento 5).</li></ul></div>\n</section>\n<section class=\"card\" id=\"ciclo\"><h2>Diagrama general: el ciclo del contrato</h2><p class=\"small\">De la necesidad a la firma. El rombo separa las dos vías: el <b>contrato menor</b>, que es un expediente mínimo, y el <b>expediente ordinario</b>, que es la regla.</p><svg viewBox=\"0 0 960 844\" role=\"img\" aria-label=\"Ciclo completo del contrato administrativo, de la necesidad a la formalización\" style=\"width:100%;height:auto\"><defs><marker id=\"fl\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"260\" y=\"8\" width=\"440\" height=\"40\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"32.16\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"#fff\">EL CICLO DEL CONTRATO ADMINISTRATIVO</text><path d=\"M480 50 L 480 70\" stroke=\"var(--acc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl)\"/><rect x=\"120\" y=\"76\" width=\"720\" height=\"52\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"92.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"var(--acc)\">28 · NECESIDAD E IDONEIDAD</text><text x=\"480\" y=\"105.84\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">no cabe contratar lo que no sirve a los fines institucionales: la necesidad</text><text x=\"480\" y=\"118.84\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">se determina con precisión ANTES de iniciar el procedimiento de adjudicación</text><path d=\"M480 130 L 480 150\" stroke=\"var(--acc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl)\"/><path d=\"M480 158 L 670 196 L 480 234 L 290 196 z\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\" stroke-width=\"2\"/><text x=\"480\" y=\"192.02\" text-anchor=\"middle\" font-size=\"9.5\" font-weight=\"700\" fill=\"var(--warn)\">¿Valor estimado inferior a 40.000 € (obras)</text><text x=\"480\" y=\"207.02\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--ink2)\">o a 15.000 € (suministros y servicios)?</text><path d=\"M670 196 L 830 196 L 830 232\" stroke=\"var(--exc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fr)\"/><rect x=\"600\" y=\"238\" width=\"350\" height=\"100\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"775\" y=\"265.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"var(--exc)\">SÍ · CONTRATO MENOR (118)</text><text x=\"775\" y=\"278.84\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"currentColor\">informe motivando la necesidad y que no se fracciona</text><text x=\"775\" y=\"291.84\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"currentColor\">aprobación del gasto e incorporación de la FACTURA</text><text x=\"775\" y=\"304.84\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"currentColor\">en obras, además, el presupuesto de la obra</text><text x=\"775\" y=\"317.84\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"currentColor\">adjudicación directa · publicidad en el perfil (63.4)</text><text x=\"690\" y=\"188\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"var(--exc)\">SÍ</text><path d=\"M300 232 L 300 262\" stroke=\"var(--acc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl)\"/><text x=\"316\" y=\"254\" text-anchor=\"start\" font-size=\"10\" font-weight=\"700\" fill=\"var(--ej)\">NO</text><rect x=\"20\" y=\"268\" width=\"560\" height=\"112\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"300\" y=\"295.34\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"var(--acc)\">116-117 · EXPEDIENTE DE CONTRATACIÓN</text><text x=\"300\" y=\"308.34\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"currentColor\">lo inicia el órgano de contratación MOTIVANDO la necesidad (art. 28)</text><text x=\"300\" y=\"321.34\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"currentColor\">se incorporan el PCAP y el PPT, el CERTIFICADO DE EXISTENCIA</text><text x=\"300\" y=\"334.34\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"currentColor\">DE CRÉDITO y la fiscalización previa de la Intervención (116.3)</text><text x=\"300\" y=\"347.34\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"currentColor\">116.4 · se justifican: procedimiento · solvencia o clasificación</text><text x=\"300\" y=\"360.34\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"currentColor\">criterios de adjudicación · valor estimado · NO división en lotes</text><path d=\"M300 384 L 300 404\" stroke=\"var(--acc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl)\"/><rect x=\"20\" y=\"410\" width=\"560\" height=\"46\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"300\" y=\"430.34\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"var(--ej)\">117 · APROBACIÓN DEL EXPEDIENTE</text><text x=\"300\" y=\"443.34\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"currentColor\">resolución motivada que aprueba también EL GASTO y abre la licitación</text><path d=\"M300 460 L 300 480\" stroke=\"var(--acc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl)\"/><rect x=\"20\" y=\"486\" width=\"560\" height=\"78\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"300\" y=\"509.34\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"var(--warn)\">131-135 · LICITACIÓN</text><text x=\"300\" y=\"522.34\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"currentColor\">ordinariamente procedimiento ABIERTO o RESTRINGIDO</text><text x=\"300\" y=\"535.34\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"currentColor\">anuncio SIEMPRE en el PERFIL DE CONTRATANTE</text><text x=\"300\" y=\"548.34\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"currentColor\">y además en el DOUE cuando el contrato es SARA</text><path d=\"M300 568 L 300 588\" stroke=\"var(--acc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl)\"/><rect x=\"20\" y=\"594\" width=\"560\" height=\"62\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"300\" y=\"615.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"var(--acc)\">145-151 · ADJUDICACIÓN</text><text x=\"300\" y=\"628.84\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"currentColor\">pluralidad de criterios y mejor relación calidad-precio</text><text x=\"300\" y=\"641.84\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"currentColor\">clasificación de ofertas y requerimiento al mejor clasificado</text><path d=\"M300 660 L 300 680\" stroke=\"var(--acc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl)\"/><rect x=\"20\" y=\"686\" width=\"560\" height=\"46\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"300\" y=\"706.34\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"var(--ej)\">107 · GARANTÍA DEFINITIVA</text><text x=\"300\" y=\"719.34\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">5 % del PRECIO FINAL OFERTADO, excluido el IVA</text><path d=\"M300 736 L 300 756\" stroke=\"var(--acc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl)\"/><rect x=\"20\" y=\"762\" width=\"560\" height=\"64\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"300\" y=\"784.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">153 · FORMALIZACIÓN</text><text x=\"300\" y=\"797.84\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"#fff\">en documento administrativo · si cabe recurso especial no puede</text><text x=\"300\" y=\"810.84\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"#fff\">hacerse antes de 15 DÍAS HÁBILES desde la notificación de la adjudicación</text><rect x=\"600\" y=\"486\" width=\"350\" height=\"178\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"775\" y=\"533.34\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"var(--exc)\">44 y 50 · RECURSO ESPECIAL</text><text x=\"775\" y=\"546.34\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"currentColor\">procede cuando el valor estimado supera:</text><text x=\"775\" y=\"559.34\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"currentColor\">obras: 3.000.000 €</text><text x=\"775\" y=\"572.34\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"currentColor\">suministros y servicios: 100.000 €</text><text x=\"775\" y=\"585.34\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"currentColor\">concesiones: 3.000.000 €</text><text x=\"775\" y=\"598.34\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"currentColor\"></text><text x=\"775\" y=\"611.34\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"currentColor\">plazo de interposición: 15 DÍAS HÁBILES</text><text x=\"775\" y=\"624.34\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"currentColor\">potestativo y gratuito · suspende la formalización</text><rect x=\"600\" y=\"686\" width=\"350\" height=\"140\" rx=\"8\" fill=\"var(--panel)\" stroke=\"var(--line)\"/><text x=\"775\" y=\"720.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"currentColor\">Y no lo olvides</text><text x=\"775\" y=\"733.84\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"currentColor\">99.2 · prohibido FRACCIONAR el contrato para</text><text x=\"775\" y=\"746.84\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"currentColor\">eludir la publicidad o el procedimiento debido</text><text x=\"775\" y=\"759.84\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"currentColor\"></text><text x=\"775\" y=\"772.84\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"currentColor\">1.3 · criterios sociales y medioambientales de</text><text x=\"775\" y=\"785.84\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"currentColor\">manera TRANSVERSAL y PRECEPTIVA siempre que</text><text x=\"775\" y=\"798.84\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"currentColor\">guarden relación con el objeto del contrato</text></svg><div class=\"box ej\"><span class=\"lbl\">Cómo leerlo</span>Fíjate en el orden: <b>crédito antes que pliegos</b>. El certificado de existencia de crédito no es un trámite más; es lo que permite que el expediente exista.</div></section><section class=\"card\" id=\"valor\"><h2>El valor estimado, la cifra que lo decide todo</h2><p class=\"small\">Casi todas las preguntas de contratación de un supuesto práctico dependen de calcular bien esta cifra.</p><svg viewBox=\"0 0 960 440\" role=\"img\" aria-label=\"Qué entra y qué no entra en el valor estimado del contrato\" style=\"width:100%;height:auto\"><defs><marker id=\"fl\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"230\" y=\"8\" width=\"500\" height=\"38\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"31.16\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"#fff\">ART. 101 · EL VALOR ESTIMADO</text><rect x=\"20\" y=\"58\" width=\"450\" height=\"186\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"245\" y=\"116\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"700\" fill=\"var(--ej)\">SÍ se incluye</text><text x=\"245\" y=\"129\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">el importe total pagadero, SIN el IVA</text><text x=\"245\" y=\"142\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">las eventuales PRÓRROGAS y cualquier opción</text><text x=\"245\" y=\"155\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">las MODIFICACIONES previstas en el pliego (art. 204)</text><text x=\"245\" y=\"168\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">las primas o pagos a candidatos y licitadores</text><text x=\"245\" y=\"181\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">los costes laborales, los gastos generales de</text><text x=\"245\" y=\"194\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">estructura y el beneficio industrial</text><rect x=\"490\" y=\"58\" width=\"450\" height=\"186\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"715\" y=\"116\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"700\" fill=\"var(--exc)\">NO se incluye</text><text x=\"715\" y=\"129\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">el Impuesto sobre el Valor Añadido</text><text x=\"715\" y=\"142\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\"></text><text x=\"715\" y=\"155\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">En las concesiones el criterio es distinto: el importe</text><text x=\"715\" y=\"168\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">neto de la CIFRA DE NEGOCIOS que generará el</text><text x=\"715\" y=\"181\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">concesionario durante la ejecución, sin IVA</text><text x=\"715\" y=\"194\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">(art. 101.1.b)</text><rect x=\"20\" y=\"256\" width=\"920\" height=\"84\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"480\" y=\"282.5\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"700\" fill=\"var(--warn)\">Por qué importa tanto</text><text x=\"480\" y=\"295.5\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">El valor estimado decide TRES cosas a la vez: si el contrato es MENOR (art. 118),</text><text x=\"480\" y=\"308.5\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">si está sujeto a REGULACIÓN ARMONIZADA (arts. 19 a 23) y si cabe RECURSO ESPECIAL (art. 44).</text><text x=\"480\" y=\"321.5\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">Calcularlo mal arrastra el error por todo el expediente.</text><rect x=\"20\" y=\"352\" width=\"920\" height=\"76\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"381\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"700\" fill=\"var(--acc)\">Ejemplo tipo de examen</text><text x=\"480\" y=\"394\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">Renting de 30 vehículos · 48 meses sin posibilidad de prórroga · presupuesto de 1.000.000 € sin impuestos</text><text x=\"480\" y=\"407\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">con modificaciones previstas equivalentes al 20 % → VALOR ESTIMADO = 1.000.000 + 200.000 = 1.200.000 €</text></svg></section><section class=\"card\" id=\"escalera\"><h2>La escalera completa de importes</h2><p class=\"small\">Nueve cifras. Cada una abre o cierra un régimen distinto.</p><svg viewBox=\"0 0 960 544\" role=\"img\" aria-label=\"Escalera de importes que decide el régimen de cada contrato\" style=\"width:100%;height:auto\"><defs><marker id=\"fl\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"210\" y=\"8\" width=\"540\" height=\"36\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"30\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"700\" fill=\"#fff\">LA ESCALERA DE IMPORTES DE LA CONTRATACIÓN</text><rect x=\"20\" y=\"52\" width=\"150\" height=\"40\" rx=\"7\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"95\" y=\"77\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"var(--acc)\">15.000 €</text><text x=\"186\" y=\"69\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">contrato MENOR de suministros y de servicios</text><text x=\"186\" y=\"84\" text-anchor=\"start\" font-size=\"9.5\" fill=\"var(--ink2)\">art. 118.1</text><rect x=\"20\" y=\"100\" width=\"195\" height=\"40\" rx=\"7\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"117.5\" y=\"125\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"var(--acc)\">40.000 €</text><text x=\"231\" y=\"117\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">contrato MENOR de obras</text><text x=\"231\" y=\"132\" text-anchor=\"start\" font-size=\"9.5\" fill=\"var(--ink2)\">art. 118.1</text><rect x=\"20\" y=\"148\" width=\"245\" height=\"40\" rx=\"7\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"142.5\" y=\"173\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"var(--warn)\">100.000 €</text><text x=\"281\" y=\"165\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">recurso especial en suministros y servicios</text><text x=\"281\" y=\"180\" text-anchor=\"start\" font-size=\"9.5\" fill=\"var(--ink2)\">art. 44.1.a)</text><rect x=\"20\" y=\"196\" width=\"295\" height=\"40\" rx=\"7\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"167.5\" y=\"221\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"var(--ej)\">140.000 €</text><text x=\"331\" y=\"213\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">SARA de suministros y servicios de la AGE</text><text x=\"331\" y=\"228\" text-anchor=\"start\" font-size=\"9.5\" fill=\"var(--ink2)\">arts. 21.1.a) y 22.1.a)</text><rect x=\"20\" y=\"244\" width=\"345\" height=\"40\" rx=\"7\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"192.5\" y=\"269\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"var(--ej)\">216.000 €</text><text x=\"381\" y=\"261\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">SARA de suministros y servicios del resto: ENTIDADES LOCALES</text><text x=\"381\" y=\"276\" text-anchor=\"start\" font-size=\"9.5\" fill=\"var(--ink2)\">arts. 21.1.b) y 22.1.b)</text><rect x=\"20\" y=\"292\" width=\"395\" height=\"40\" rx=\"7\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"217.5\" y=\"317\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"var(--ej)\">750.000 €</text><text x=\"431\" y=\"309\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">SARA de servicios sociales y otros servicios del anexo IV</text><text x=\"431\" y=\"324\" text-anchor=\"start\" font-size=\"9.5\" fill=\"var(--ink2)\">art. 22.1.c)</text><rect x=\"20\" y=\"340\" width=\"450\" height=\"40\" rx=\"7\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"245\" y=\"365\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"var(--warn)\">2.000.000 €</text><text x=\"486\" y=\"357\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">tope del procedimiento abierto SIMPLIFICADO en obras</text><text x=\"486\" y=\"372\" text-anchor=\"start\" font-size=\"9.5\" fill=\"var(--ink2)\">art. 159.1.a)</text><rect x=\"20\" y=\"388\" width=\"505\" height=\"40\" rx=\"7\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"272.5\" y=\"413\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"var(--warn)\">3.000.000 €</text><text x=\"541\" y=\"405\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">recurso especial en obras y en concesiones</text><text x=\"541\" y=\"420\" text-anchor=\"start\" font-size=\"9.5\" fill=\"var(--ink2)\">arts. 44.1.a) y c)</text><rect x=\"20\" y=\"436\" width=\"560\" height=\"40\" rx=\"7\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"300\" y=\"461\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"var(--exc)\">5.404.000 €</text><text x=\"596\" y=\"453\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">SARA de obras, concesión de obras y concesión de servicios</text><text x=\"596\" y=\"468\" text-anchor=\"start\" font-size=\"9.5\" fill=\"var(--ink2)\">art. 20.1</text><rect x=\"20\" y=\"488\" width=\"920\" height=\"44\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"480\" y=\"506.86\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"currentColor\">Todas las cifras son de VALOR ESTIMADO (art. 101), sin IVA.</text><text x=\"480\" y=\"519.86\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"currentColor\">El contrato menor también se mide por valor estimado, no por el precio de adjudicación.</text></svg><div class=\"box exc\"><span class=\"lbl\">Ojo</span>Los <b>140.000 €</b> son el umbral SARA de la <b>AGE</b>; una entidad local usa <b>216.000 €</b>. Pero el tope del <b>abierto simplificado</b> en suministros y servicios sí remite al umbral del art. 21.1.a) —140.000 €—, no al de la entidad. Son dos usos distintos de la misma cifra.</div></section>";
</script>
<script>
document.getElementById('main').innerHTML+="\n<section class=\"card\" id=\"tablas\"><h2>Tablas de referencia rápida</h2>\n\n<h3 style=\"font-size:1.02rem\">1 · Qué debe contener el expediente de contratación</h3>\n<table><thead><tr><th>Documento</th><th>Qué es</th><th>Artículo</th></tr></thead><tbody>\n<tr><td><b>Inicio motivado</b></td><td>Resolución del órgano de contratación que motiva la <b>necesidad</b> del contrato en los términos del art. 28, publicada en el <b>perfil de contratante</b></td><td>116.1</td></tr>\n<tr><td><b>PCAP</b></td><td>Pliego de <b>cláusulas administrativas particulares</b></td><td>116.3</td></tr>\n<tr><td><b>PPT</b></td><td>Pliego de <b>prescripciones técnicas</b></td><td>116.3</td></tr>\n<tr><td><b>Certificado de existencia de crédito</b></td><td>Acredita que hay consignación suficiente. <b>Es el primer paso material</b>: sin crédito no hay expediente</td><td>116.3</td></tr>\n<tr><td><b>Fiscalización previa</b></td><td>De la Intervención, en su caso</td><td>116.3</td></tr>\n</tbody></table>\n<div class=\"box warn\"><span class=\"lbl\">Las cinco justificaciones del art. 116.4</span>En el expediente <b>se justificará adecuadamente</b>: <b>a)</b> la elección del <b>procedimiento</b> de licitación · <b>b)</b> los criterios de <b>solvencia</b> técnica, económica y financiera, o la <b>clasificación</b> exigida · <b>c)</b> los <b>criterios de adjudicación</b> y las condiciones especiales de ejecución · <b>d)</b> el <b>valor estimado</b> con indicación de los conceptos que lo integran · <b>e)</b> la <b>necesidad</b> a satisfacer y su relación con el objeto, que debe ser <b>directa, clara y proporcional</b> · <b>f)</b> la <b>decisión de no dividir en lotes</b>, en su caso.</div>\n<p class=\"small\">Lo que <b>no</b> se justifica en el expediente son las <b>características técnicas concretas</b> del bien —modelo, marca—: eso va en el <b>pliego de prescripciones técnicas</b>, y con los límites del art. 126 sobre no favorecer a un licitador.</p>\n\n<h3 style=\"font-size:1.02rem;margin-top:1.4rem\">2 · El contrato menor, de un vistazo</h3>\n<table><thead><tr><th>Cuestión</th><th>Regla</th><th>Artículo</th></tr></thead><tbody>\n<tr><td>Umbral</td><td><b>Obras: menos de 40.000 €</b> · <b>Suministros y servicios: menos de 15.000 €</b>, de valor estimado</td><td>118.1</td></tr>\n<tr><td>Trámites</td><td><b>Informe</b> del órgano de contratación motivando la necesidad y que <b>no se altera el objeto</b> para eludir el umbral · <b>aprobación del gasto</b> · incorporación de la <b>factura</b></td><td>118.2 y 118.3</td></tr>\n<tr><td>En obras, además</td><td><b>Presupuesto</b> de las obras, y proyecto cuando lo exijan las disposiciones vigentes; informe de la oficina de supervisión si afecta a estabilidad, seguridad o estanqueidad</td><td>118.4</td></tr>\n<tr><td>Excepción del informe</td><td>No se exige el informe del 118.2 en pagos por <b>anticipos de caja fija</b> u otro sistema similar si el valor estimado <b>no excede de 5.000 €</b></td><td>118.5</td></tr>\n<tr><td>Adjudicación</td><td><b>Directa</b> a cualquier empresario con capacidad de obrar y habilitación profesional</td><td>131.3</td></tr>\n<tr><td>Publicidad</td><td>En el <b>perfil de contratante</b>, en la forma del art. 63.4</td><td>118.6</td></tr>\n<tr><td>Duración</td><td><b>Máximo un año</b> y <b>no puede prorrogarse</b></td><td>29.8</td></tr>\n<tr><td>Solvencia</td><td><b>No se exige</b> acreditar solvencia ni clasificación</td><td>159.6 a sensu contrario y 118</td></tr>\n<tr><td>Formalización</td><td>No hay documento contractual: su existencia se acredita con los documentos del art. 118</td><td>153.2</td></tr>\n<tr><td>Garantía definitiva</td><td><b>No se exige</b> en los contratos menores</td><td>107 y 118</td></tr>\n</tbody></table>\n\n<h3 style=\"font-size:1.02rem;margin-top:1.4rem\">3 · Plazos y porcentajes que se preguntan</h3>\n<table id=\"tplazos\"><thead><tr><th class=\"sortable\">Cifra</th><th class=\"sortable\">A qué se refiere</th><th class=\"sortable\">Artículo</th></tr></thead><tbody>\n<tr><td><b>5 %</b></td><td>Garantía definitiva, sobre el <b>precio final ofertado, excluido el IVA</b></td><td>107.1</td></tr>\n<tr><td><b>3 %</b></td><td>Garantía provisional, cuando excepcionalmente se exija y se motive</td><td>106.1</td></tr>\n<tr><td><b>15 días hábiles</b></td><td>Plazo para interponer el <b>recurso especial</b></td><td>50.1</td></tr>\n<tr><td><b>15 días hábiles</b></td><td>Espera mínima para <b>formalizar</b> cuando cabe recurso especial</td><td>153.3</td></tr>\n<tr><td><b>10 días hábiles</b></td><td>Plazo al licitador para presentar la documentación tras el requerimiento del art. 150.2</td><td>150.2</td></tr>\n<tr><td><b>2 meses</b></td><td>Preaviso mínimo de la <b>prórroga</b>, salvo plazo mayor en el pliego</td><td>29.2</td></tr>\n<tr><td><b>1 año</b></td><td>Duración máxima del <b>contrato menor</b>, sin prórroga</td><td>29.8</td></tr>\n<tr><td><b>5 años</b></td><td>Duración máxima ordinaria de los contratos de <b>suministros y servicios</b> de prestación sucesiva, prórrogas incluidas</td><td>29.4</td></tr>\n<tr><td><b>25 %</b></td><td>Tope de los criterios evaluables mediante <b>juicio de valor</b> en el abierto simplificado (45 % en prestaciones intelectuales)</td><td>159.1.b)</td></tr>\n</tbody></table>\n</section>\n\n<section class=\"card\" id=\"caso1\"><h2>Caso práctico integral 1 · El renting de 30 vehículos</h2>\n<div class=\"box warn\"><span class=\"lbl\">Advertencia</span>Supuesto construido sobre los preceptos reales de la Ley 9/2017. Los umbrales pueden haberse actualizado: verifícalos en el BOE.</div>\n<p><b>El escenario.</b> Una diputación provincial quiere completar su parque móvil con <b>30 vehículos</b> en modalidad de <b>renting</b>, con una duración de <b>48 meses sin posibilidad de prórroga</b>, presupuesto de <b>1.000.000 €</b> sin impuestos y <b>modificaciones previstas equivalentes al 20 %</b> de ese importe.</p>\n\n<h3 style=\"font-size:1.02rem;margin-top:1rem\">Paso 1 · ¿Qué tipo de contrato es?</h3>\n<p><b>Suministro.</b> El art. <b>16.1</b> incluye expresamente «la adquisición, el <b>arrendamiento financiero</b>, o el <b>arrendamiento, con o sin opción de compra</b>, de productos o bienes muebles». El renting es un arrendamiento de bienes muebles: no es un contrato de servicios aunque incluya mantenimiento, porque la prestación principal es la puesta a disposición de los vehículos (art. 18.1.a si hubiera prestaciones mixtas).</p>\n\n<h3 style=\"font-size:1.02rem;margin-top:1rem\">Paso 2 · ¿Cuál es el valor estimado?</h3>\n<div class=\"box ej\"><span class=\"lbl\">El cálculo</span><b>1.000.000 €</b> (importe total sin IVA) <b>+ 200.000 €</b> (modificaciones previstas, art. 101.2.c) <b>= 1.200.000 €</b>.<br>No se suma prórroga alguna porque el enunciado dice <b>sin posibilidad de prórroga</b>. Y el IVA <b>nunca</b> se incluye (art. 101.1.a).</div>\n<p class=\"small\">Si el enunciado hubiera previsto una prórroga de 12 meses, habría que sumarla también (art. 101.2.a). Es el error más frecuente: quedarse en el presupuesto y olvidar prórrogas y modificaciones.</p>\n\n<h3 style=\"font-size:1.02rem;margin-top:1rem\">Paso 3 · ¿Cuál es el primer paso del expediente?</h3>\n<p>Antes de redactar pliegos hay que saber si <b>hay dinero</b>. El art. <b>116.3</b> exige incorporar al expediente el <b>certificado de existencia de crédito</b>; y en el plano presupuestario, el art. <b>173.5 del TRLHL</b> declara <b>nulos de pleno derecho</b> los compromisos de gasto sin crédito. El estudio de mercado o la consulta preliminar (art. 115) es <b>potestativo</b>; los pliegos vienen después.</p>\n\n<h3 style=\"font-size:1.02rem;margin-top:1rem\">Paso 4 · ¿Qué procedimiento?</h3>\n<table><thead><tr><th>Pregunta</th><th>Respuesta</th><th>Artículo</th></tr></thead><tbody>\n<tr><td>¿Es SARA?</td><td><b>Sí</b>: 1.200.000 € supera los <b>216.000 €</b> de los suministros de una entidad local</td><td>21.1.b)</td></tr>\n<tr><td>¿Cabe el abierto simplificado?</td><td><b>No</b>: en suministros el tope es el umbral del art. 21.1.a) —140.000 €—, muy inferior</td><td>159.1.a)</td></tr>\n<tr><td>Procedimiento</td><td><b>Abierto sujeto a regulación armonizada</b></td><td>131.2 y 156</td></tr>\n<tr><td>Anuncio</td><td>Perfil de contratante <b>y además DOUE</b> por ser SARA</td><td>135.1</td></tr>\n<tr><td>¿Recurso especial?</td><td><b>Sí</b>: suministro de valor estimado superior a <b>100.000 €</b></td><td>44.1.a)</td></tr>\n<tr><td>Formalización</td><td>No antes de <b>15 días hábiles</b> desde la notificación de la adjudicación</td><td>153.3</td></tr>\n</tbody></table>\n\n<h3 style=\"font-size:1.02rem;margin-top:1rem\">Paso 5 · Dos preguntas de detalle que caen siempre</h3>\n<details class=\"panel\"><summary>¿Qué hay que motivar en el expediente y qué no?</summary><div class=\"body\"><p>Se justifican los <b>seis extremos</b> del art. <b>116.4</b>: procedimiento, solvencia o clasificación, criterios de adjudicación y condiciones especiales, valor estimado con sus conceptos, la <b>necesidad</b> y su relación directa, clara y proporcional con el objeto, y la <b>no división en lotes</b>. Lo que <b>no</b> se justifica ahí son las características técnicas del vehículo —marca, modelo—: eso es contenido del <b>pliego de prescripciones técnicas</b>.</p></div></details>\n<details class=\"panel\"><summary>¿Qué obliga el art. 1 a incorporar «de manera transversal y preceptiva»?</summary><div class=\"body\"><p><b>Criterios sociales y medioambientales</b>, <b>siempre que guarden relación con el objeto del contrato</b> (art. 1.3). No son criterios «de calidad técnica» ni «tecnológicos»: la ley nombra exactamente esos dos. Y los <b>principios</b> del art. 1.1 son: <b>libertad de acceso</b> a las licitaciones, <b>publicidad y transparencia</b> de los procedimientos, y <b>no discriminación e igualdad de trato</b> entre los licitadores.</p></div></details>\n</section>\n\n<section class=\"card\" id=\"caso2\"><h2>Caso práctico integral 2 · La obra urgente de 40.453 €</h2>\n<div class=\"box warn\"><span class=\"lbl\">Advertencia</span>Supuesto construido sobre los preceptos reales del TRLHL y de la Ley 9/2017.</div>\n<p><b>El escenario.</b> Tras unas lluvias torrenciales, hay que <b>reconstruir las vías de acceso</b> a una localidad. <b>No existe crédito adecuado</b> en el presupuesto y la obra <b>no puede demorarse</b> al ejercicio siguiente. El presupuesto de la obra es de <b>40.453,00 € IVA incluido</b>. Este caso enlaza el tema 8 con los temas 9 y 10.</p>\n\n<h3 style=\"font-size:1.02rem;margin-top:1rem\">Paso 1 · Primero el crédito (tema 8)</h3>\n<table><thead><tr><th>Pregunta</th><th>Respuesta</th><th>Artículo</th></tr></thead><tbody>\n<tr><td>No existe crédito y el gasto no puede demorarse</td><td><b>CRÉDITO EXTRAORDINARIO</b></td><td>177.1 TRLHL</td></tr>\n<tr><td>Si existiera crédito pero fuera insuficiente y no ampliable</td><td><b>SUPLEMENTO DE CRÉDITO</b></td><td>177.1 TRLHL</td></tr>\n<tr><td>Órgano competente</td><td>El <b>PLENO</b>, previo informe de la Intervención, con los trámites del art. 169</td><td>177.2 TRLHL</td></tr>\n<tr><td>Documento contable de la certificación de crédito</td><td><b>«RC»</b> · retención de crédito para gastar</td><td>RD 500/1990 <i>(norma externa)</i></td></tr>\n</tbody></table>\n\n<h3 style=\"font-size:1.02rem;margin-top:1rem\">Paso 2 · Después el contrato (temas 9 y 10)</h3>\n<div class=\"box exc\"><span class=\"lbl\">Cuidado con el IVA</span>El umbral del contrato menor se mide sobre el <b>valor estimado</b>, y el valor estimado <b>excluye el IVA</b> (art. 101.1.a). Con 40.453,00 € <b>IVA incluido</b> al 21 %, la base imponible es <b>33.432,23 €</b>: <b>por debajo de los 40.000 €</b>. Es un <b>contrato menor de obras</b>. Quien compara los 40.453 € con los 40.000 € sin descontar el impuesto falla la pregunta.</div>\n<table><thead><tr><th>Cuestión</th><th>Respuesta</th><th>Artículo</th></tr></thead><tbody>\n<tr><td>Tipo de expediente</td><td><b>Contrato menor de obras</b></td><td>118.1</td></tr>\n<tr><td>Qué exige la tramitación</td><td><b>Informe</b> motivando la necesidad y la no alteración del objeto · <b>aprobación del gasto</b> · <b>factura</b> · y, por ser obra, el <b>presupuesto</b> de las obras</td><td>118.2 a 118.4</td></tr>\n<tr><td>¿Hacen falta pliegos?</td><td><b>No</b>: el PCAP y el PPT son propios del expediente ordinario del art. 116.3</td><td>116.3</td></tr>\n<tr><td>¿Solvencia técnica?</td><td><b>No se exige</b> en los contratos menores</td><td>118</td></tr>\n<tr><td>¿Garantía definitiva?</td><td><b>No se exige</b></td><td>107</td></tr>\n<tr><td>Duración máxima</td><td><b>Un año</b>, sin prórroga</td><td>29.8</td></tr>\n<tr><td>Publicidad</td><td>En el <b>perfil de contratante</b></td><td>118.6 y 63.4</td></tr>\n</tbody></table>\n\n<h3 style=\"font-size:1.02rem;margin-top:1rem\">Paso 3 · Y de vuelta al tema 8: las fases del gasto</h3>\n<p>Adjudicada la obra por 40.453,00 €, el expediente recorre las <b>cuatro fases</b> del art. <b>184.1 del TRLHL</b>. En un contrato menor lo habitual es <b>acumular</b> fases en un solo acto, como permite el art. 184.2:</p>\n<table><thead><tr><th>Documento</th><th>Qué acumula</th><th>Cuándo se usa</th></tr></thead><tbody>\n<tr><td><b>RC</b></td><td>Retención de crédito</td><td>Antes de iniciar: certifica que hay crédito</td></tr>\n<tr><td><b>AD</b></td><td><b>A</b>utorización + <b>D</b>isposición</td><td>Al adjudicar: el gasto queda comprometido con un tercero</td></tr>\n<tr><td><b>ADO</b></td><td>Autorización + Disposición + <b>O</b>bligación</td><td>Cuando se conoce el acreedor y el importe de una vez, con factura</td></tr>\n<tr><td><b>O</b></td><td>Reconocimiento de la obligación</td><td>Con la certificación o factura conformada</td></tr>\n<tr><td><b>P</b></td><td>Ordenación del pago</td><td>Conforme al plan de disposición de fondos (art. 187 TRLHL)</td></tr>\n</tbody></table>\n<p class=\"small\"><i>Aportación externa:</i> la denominación y el uso de los documentos contables no están en el TRLHL, sino en el <b>RD 500/1990</b> y en las Instrucciones de contabilidad local. Verifícalos en el BOE.</p>\n<div class=\"box ej\"><span class=\"lbl\">La lección del caso</span>Un solo hecho —una carretera rota— obliga a manejar a la vez el <b>tema 8</b> (modificación de crédito, órgano competente, documentos contables y fases del gasto) y los <b>temas 9 y 10</b> (tipo de contrato, valor estimado sin IVA, contrato menor y sus trámites). Los supuestos prácticos reales están diseñados exactamente así.</div>\n</section>\n\n<section class=\"card\" id=\"conexiones\"><h2>Diez preguntas de conexión</h2>\n<p class=\"small\">Responde en voz alta antes de desplegar.</p><div id=\"qbox\"></div></section>\n<section class=\"card\" id=\"semaforoA\"><h2>Semáforo</h2><div id=\"sembox\"></div><div id=\"semres\" style=\"margin-top:.8rem\"></div></section>\n";
</script>

 var p=m.parentNode;p.replaceChild(document.createTextNode(m.textContent),m);p.normalize();});}
q.addEventListener('input',function(){
 clearTimeout(timer);timer=setTimeout(function(){

  document.querySelectorAll('section.card').forEach(function(s){
   var found=false;
   var w=document.createTreeWalker(s,NodeFilter.SHOW_TEXT,null);var nodes=[];
   while(w.nextNode()){var nd=w.currentNode;
    if(nd.parentNode.closest('script,style,mark,svg'))continue;

    nd.parentNode.replaceChild(span,nd);});

  });
 },220);});

<script>

/* ═══ Mejoras de interacción · Bloque II ═══ */
(function(){
"use strict";
var K_THEME="oposi_bII_theme", K_FS="oposi_bII_fs", K_STREAK="oposi_bII_streak";
function load(k,f){try{var v=localStorage.getItem(k);return v?JSON.parse(v):f;}catch(e){return f;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
var root=document.documentElement;

/* Tema persistente (sobrescribe el toggle simple anterior) */
var saved=load(K_THEME,null);
if(saved){root.setAttribute("data-theme",saved);}
else if(window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches){root.setAttribute("data-theme","dark");}
var bt=document.getElementById("theme");
if(bt)bt.onclick=function(){
  var n=root.getAttribute("data-theme")==="dark"?"light":"dark";
  root.setAttribute("data-theme",n);save(K_THEME,n);
};

/* Tamaño de texto persistente */
var fs=load(K_FS,16);
function setFs(v){fs=Math.max(13,Math.min(22,v));root.style.setProperty("--fs",fs+"px");save(K_FS,fs);}
setFs(fs);
var bp=document.getElementById("fs+"),bm=document.getElementById("fs-");
if(bp)bp.onclick=function(){setFs(fs+1);};
if(bm)bm.onclick=function(){setFs(fs-1);};

/* Racha compartida con el índice */
(function(){
  var el=document.getElementById("streakN");if(!el)return;
  var hoy=new Date().toISOString().slice(0,10);
  var s=load(K_STREAK,{last:null,n:0});
  if(s.last!==hoy){
    var ayer=new Date(Date.now()-864e5).toISOString().slice(0,10);
    s.n=(s.last===ayer)?s.n+1:1;s.last=hoy;save(K_STREAK,s);
  }
  el.textContent=s.n;
})();

/* Reveal on scroll para las tarjetas */
function reveal(){
  var els=document.querySelectorAll("section.card:not(.rv)");
  if(!els.length)return;
  if(!("IntersectionObserver" in window)){return;}
  var io=new IntersectionObserver(function(es){
    es.forEach(function(en){if(en.isIntersecting){en.target.classList.add("in");io.unobserve(en.target);}});
  },{threshold:.06,rootMargin:"0px 0px -30px 0px"});
  Array.prototype.forEach.call(els,function(el){el.classList.add("rv");io.observe(el);});
}

/* Sección activa en el índice lateral */
function spy(){
  var links=document.querySelectorAll("nav.side a[href^='#']");
  if(!links.length||!("IntersectionObserver" in window))return;
  var map={};
  Array.prototype.forEach.call(links,function(a){
    var t=document.getElementById(a.getAttribute("href").slice(1));
    if(t)map[t.id]=a;
  });
  var io=new IntersectionObserver(function(es){
    es.forEach(function(en){
      if(en.isIntersecting){
        Array.prototype.forEach.call(links,function(a){a.classList.remove("on");});
        if(map[en.target.id])map[en.target.id].classList.add("on");
      }
    });
  },{rootMargin:"-80px 0px -70% 0px",threshold:0});
  Object.keys(map).forEach(function(id){io.observe(document.getElementById(id));});
}

/* Ripple en botones */
document.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b||b.classList.contains("navtoggle"))return;
  var r=b.getBoundingClientRect(),d=Math.max(r.width,r.height),s=document.createElement("span");
  s.className="ripple";s.style.width=s.style.height=d+"px";
  s.style.left=(e.clientX-r.left-d/2)+"px";s.style.top=(e.clientY-r.top-d/2)+"px";
  b.appendChild(s);setTimeout(function(){if(s.parentNode)s.parentNode.removeChild(s);},560);
});

/* Atajos de teclado */
document.addEventListener("keydown",function(e){
  if(e.target.matches("input,textarea"))return;
  if(e.key==="/"){var q=document.getElementById("q");if(q){e.preventDefault();q.focus();}}
  if(e.key==="t"&&bt)bt.click();
});

/* El contenido se inyecta por JS: esperamos a que exista */
function init(){reveal();spy();}
if(document.getElementById("main")&&document.getElementById("main").children.length){init();}
else{setTimeout(init,60);}
addEventListener("load",function(){setTimeout(init,80);});
})();


</script>
<script>


/* ═══ Parser de respuestas: estructura semántica ═══ */
var FCFMT=(function(){
  var CITA=/\s*\(((?:arts?\.|DA\b|DT\b|disp\.)[^)]*)\)\s*\.?\s*$/i;
  var strip=function(h){return h.replace(/<[^>]+>/g,"");};

  function esc(s){return s;}

  function parse(raw){
    var out={verdict:null,cite:null,kind:"p",items:[],text:""};
    var body=String(raw).trim();

    /* 1 ── Cita legal al final */
    var m=body.match(CITA);
    if(m){out.cite=m[1].replace(/\s+/g," ").trim();body=body.slice(0,m.index).trim();}
    body=body.replace(/[.;,\s]+$/,"");

    /* 2 ── Veredicto Sí / No inicial */
    var v=strip(body).match(/^(Sí|Sí,|No|No,)[.:,]?\s/);
    if(v){
      out.verdict=/^Sí/.test(v[1])?"si":"no";
      body=body.replace(/^(<[^>]+>\s*)*(Sí|No)[.,:]?\s*/,"").trim();
      body=body.replace(/^en\s/,"En ");
    }

    /* 3 ── Enumeración con · */
    var parts=body.split(/\s+·\s+/);
    if(parts.length>=2){
      out.kind="list";
      var letras=parts.filter(function(p){return /^\s*<?[a-h]\)/.test(strip(p));}).length;
      out.marker = letras>=parts.length-1 ? "alpha" : "num";
      out.items=parts.map(function(p){
        return p.replace(/^\s*[a-h]\)\s*/,"").replace(/[.\s]+$/,"").trim();
      }).filter(Boolean);
      return out;
    }

    /* 4 ── Cláusulas contrapuestas con ; */
    var semi=body.split(/;\s+/);
    if(semi.length>=2&&semi.length<=3&&semi.every(function(s){return strip(s).length>14;})){
      out.kind="clauses";
      out.items=semi.map(function(s){return s.replace(/[.\s]+$/,"").trim();});
      return out;
    }

    /* 5 ── Párrafo */
    out.text=body;
    return out;
  }

  function render(raw){
    var d=parse(raw),h="";

    if(d.verdict){
      h+='<span class="fc-verdict '+d.verdict+'">'+(d.verdict==="si"?"✓ Sí":"✗ No")+'</span>';
    }

    if(d.kind==="list"){
      h+='<ol class="fc-list '+d.marker+'">';
      d.items.forEach(function(it){h+='<li>'+it+'</li>';});
      h+='</ol>';
    }else if(d.kind==="clauses"){
      h+='<div class="fc-clauses">';
      d.items.forEach(function(it){h+='<p>'+it+'</p>';});
      h+='</div>';
    }else if(d.text){
      h+='<p class="fc-p">'+d.text+'</p>';
    }

    if(d.cite){
      h+='<span class="fc-cite"><span class="s">§</span>'+d.cite+'</span>';
    }
    return {html:h,struct:(d.kind!=="p"||!!d.verdict||strip(raw).length>150)};
  }
  return {parse:parse,render:render};
})();

    order=CARDS.map(function(_,i){return i;});

    card.style.display="";

  function bump(el){el.classList.remove("bump");void el.offsetWidth;el.classList.add("bump");}

  function draw(){
    pok.textContent=ok+(ok===1?" sabida":" sabidas");
    pko.textContent=ko+" repasar";
    var done=N-order.length;
    fill.style.width=(N?done/N*100:0)+"%";

        deck.appendChild(d);
      }
      return;

    if(fi>=order.length)fi=0;
    pleft.textContent=order.length+(order.length===1?" queda":" quedan");

    var c=CARDS[order[fi]];

  function flip(){

    if(busy||!order.length)return;

    lift.classList.remove("lift");
    lift.classList.add(good?"out-ok":"out-ko");

      else{var m=order.splice(fi,1)[0];order.push(m);}

  var x0=null,y0=null;

    if(e.key===" "){e.preventDefault();flip();}
    else if(e.key==="ArrowRight"){e.preventDefault();next(true);}
    else if(e.key==="ArrowLeft"){e.preventDefault();next(false);}
  });

  reset();
  return true;
}
if(!boot()){
  var tries=0;
  var iv=setInterval(function(){if(boot()||++tries>40)clearInterval(iv);},120);
  addEventListener("load",function(){setTimeout(boot,100);});
}
})();

/* ═══ Altura adaptativa + índice plegable ═══ */
(function(){
"use strict";

/* ── 1 · Índice lateral plegable ── */
function sidebar(){
  var lay=document.querySelector(".layout"),
      side=document.getElementById("side"),
      tools=document.querySelector(".tools");
  if(!lay||!side||!tools||document.getElementById("navhide"))return;

  var K="oposi_bII_nav";
  function get(){try{return localStorage.getItem(K)==="0";}catch(e){return false;}}
  function set(v){try{localStorage.setItem(K,v?"0":"1");}catch(e){}}

  var b=document.createElement("button");
  b.id="navhide";b.type="button";
  b.innerHTML='<span class="ic">☰</span>';
  b.setAttribute("aria-controls","side");
  tools.insertBefore(b,tools.firstChild);

  function apply(hidden,anim){
    if(!anim)lay.style.transition="none";
    lay.classList.toggle("nonav",hidden);
    side.setAttribute("aria-hidden",String(hidden));
    b.setAttribute("aria-pressed",String(hidden));
    b.title=hidden?"Mostrar índice (i)":"Ocultar índice (i)";
    b.setAttribute("aria-label",b.title);
    if(!anim)requestAnimationFrame(function(){lay.style.transition="";});
  }
  apply(get(),false);

  b.onclick=function(){
    var h=!lay.classList.contains("nonav");
    apply(h,true);set(h);
    window.dispatchEvent(new Event("resize"));
  };
  document.addEventListener("keydown",function(e){
    if(e.target.matches("input,textarea,select"))return;
    if(e.key==="i"||e.key==="I"){e.preventDefault();b.click();}
  });
}

/* ── 2 · La tarjeta se adapta a su contenido ── */
function autofit(){
  var stage=document.querySelector(".fc-stage");
  if(!stage||stage.dataset.fit)return;
  var deck=stage.querySelector(".fc-deck"),
      front=stage.querySelector(".fc-front"),
      back=stage.querySelector(".fc-back");
  if(!deck||!front||!back)return;
  stage.dataset.fit="1";

  var meas=document.createElement("div");
  meas.className="fc-measure";meas.setAttribute("aria-hidden","true");
  meas.innerHTML='<div class="fc-face fc-front"><div class="fc-body"><div class="fc-txt"></div></div></div>';
  stage.appendChild(meas);
  var mFace=meas.querySelector(".fc-face"), mTxt=meas.querySelector(".fc-txt");

  function measure(cls,html){
    mFace.className="fc-face "+cls;
    mTxt.innerHTML=html;
    return mFace.offsetHeight;
  }

  function fit(){
    if(deck.classList.contains("empty")){deck.style.height="230px";return;}
    var fT=front.querySelector(".fc-txt"), bT=back.querySelector(".fc-txt");
    if(!fT||!bT)return;
    var h=Math.max(
      measure("fc-front"+(front.classList.contains("struct")?" struct":""),fT.innerHTML),
      measure("fc-back" +(back .classList.contains("struct")?" struct":""),bT.innerHTML),
      230
    );
    deck.style.height=Math.ceil(h+8)+"px";
  }

  /* recalcular cuando cambia la tarjeta, el tamaño de letra o la ventana */
  new MutationObserver(fit).observe(back,{childList:true,subtree:true,attributes:true,attributeFilter:["class"]});
  var t;
  addEventListener("resize",function(){clearTimeout(t);t=setTimeout(fit,120);},{passive:true});
  ["fs+","fs-"].forEach(function(id){
    var el=document.getElementById(id);
    if(el)el.addEventListener("click",function(){setTimeout(fit,60);});
  });
  fit();setTimeout(fit,250);
}

function go(){sidebar();autofit();}
if(document.readyState!=="loading")go();else document.addEventListener("DOMContentLoaded",go);
addEventListener("load",function(){setTimeout(go,120);});
var n=0,iv=setInterval(function(){go();if(++n>25)clearInterval(iv);},150);
})();


</script>
<script>


/* ═══════════════════════════════════════════════════════════════
   TTS · Lectura en voz alta del texto legal
   ═══════════════════════════════════════════════════════════════ */
(function(){
"use strict";
if(!("speechSynthesis" in window))return;

var K="oposi_bII_tts";
function load(){try{return JSON.parse(localStorage.getItem(K))||{};}catch(e){return {};}}
function save(o){try{localStorage.setItem(K,JSON.stringify(o));}catch(e){}}
var cfg=load();
if(cfg.rate==null)cfg.rate=1;
if(cfg.gen==null)cfg.gen="f";

var synth=window.speechSynthesis, voces=[], actual=null, bloques=[];

/* ─────────── 1 · Selección de voz ─────────── */
function esEspanol(v){return /^es\b|^es[-_]/i.test(v.lang||"")||/spanish|español/i.test(v.name||"");}
function calidad(v){
  var n=(v.name||"")+" "+(v.voiceURI||""), p=0;
  if(/natural|neural/i.test(n))p+=100;
  if(/online/i.test(n))p+=40;
  if(/premium|enhanced|eloquence/i.test(n))p+=35;
  if(/google/i.test(n))p+=30;
  if(v.localService===false)p+=15;
  if(/microsoft/i.test(n))p+=8;
  if(/^es-ES/i.test(v.lang))p+=12;   /* castellano de España primero */
  return p;
}
var MASC=/(pablo|álvaro|alvaro|jorge|diego|juan|raul|raúl|carlos|miguel|lorenzo|gonzalo|dalton|liam|andr[eé]s|luciano|male|hombre|masculin)/i;
var FEM =/(helena|elvira|laura|mónica|monica|paulina|sabina|esperanza|marisol|ximena|dalia|salome|camila|catalina|isidora|female|mujer|femenin)/i;
function genero(v){
  var n=v.name||"";
  if(MASC.test(n))return "m";
  if(FEM.test(n))return "f";
  return "?";
}
function cargarVoces(){
  var all=synth.getVoices()||[];
  voces=all.filter(esEspanol).sort(function(a,b){return calidad(b)-calidad(a);});
  if(!voces.length)voces=all.slice(0,12);
  pintarSelector();
}
function elegir(){
  if(cfg.voz){
    for(var i=0;i<voces.length;i++)if(voces[i].voiceURI===cfg.voz)return voces[i];
  }
  var g=cfg.gen;
  for(var j=0;j<voces.length;j++)if(genero(voces[j])===g)return voces[j];
  return voces[0]||null;
}

/* ─────────── 2 · Naturalidad: expandir lo que el TTS lee mal ─────────── */
var ORD={1:"primera",2:"segunda",3:"tercera",4:"cuarta",5:"quinta",
         6:"sexta",7:"séptima",8:"octava",9:"novena",10:"décima"};
function paraVoz(t){
  return t
    .replace(/\barts?\.\s*/gi,function(m){return /arts/i.test(m)?"artículos ":"artículo ";})
    .replace(/\bapdos?\.\s*/gi,"apartado ")
    .replace(/\bnúms?\.\s*/gi,"número ")
    .replace(/\bpárr\.\s*/gi,"párrafo ")
    .replace(/\bcap\.\s*/gi,"capítulo ")
    .replace(/\bpágs?\.\s*/gi,"página ")
    .replace(/\by\s+ss\./gi,"y siguientes")
    .replace(/\bss\./gi,"siguientes")
    .replace(/\bTRLHL\b/g,"Texto Refundido de la Ley de Haciendas Locales")
    .replace(/\bLCSP\b/g,"Ley de Contratos del Sector Público")
    .replace(/\bLBRL\b/g,"Ley de Bases del Régimen Local")
    .replace(/\bLRJSP\b/g,"Ley de Régimen Jurídico del Sector Público")
    .replace(/\bLPACAP\b/g,"Ley del Procedimiento Administrativo Común")
    .replace(/\bRDLeg\b/gi,"Real Decreto Legislativo")
    .replace(/\bRD\b/g,"Real Decreto")
    .replace(/\bCCAA\b/g,"comunidades autónomas")
    .replace(/\bCA\b/g,"comunidad autónoma")
    .replace(/\bEELL\b/g,"entidades locales")
    .replace(/\bBOE\b/g,"Boletín Oficial del Estado")
    .replace(/\bIVA\b/g,"I.V.A.")
    .replace(/\bSARA\b/g,"sara")
    .replace(/\bDA\s+(\d+)/g,"disposición adicional $1")
    .replace(/\bDT\s+(\d+)/g,"disposición transitoria $1")
    .replace(/(\d+)\.ª/g,function(m,n){return ORD[+n]||(n+"ª");})
    .replace(/(\d+)\.º/g,"$1º")
    /* 3.005,06 → 3005,06 para que lo lea como cifra y no como frase */
    .replace(/(\d)\.(?=\d{3}\b)/g,"$1")
    .replace(/(\d)\.(?=\d{3}\b)/g,"$1")
    .replace(/€/g," euros")
    .replace(/%/g," por ciento")
    .replace(/\bnº\b/gi,"número")
    .replace(/\s*·\s*/g,". ")
    .replace(/\(\s*/g,", ").replace(/\s*\)/g,", ")
    .replace(/\bvid\.\s*/gi,"véase ")
    .replace(/\bcfr\.\s*/gi,"compárese ")
    /* limpieza de puntuación tras las sustituciones */
    .replace(/([.:;!?])(?=[A-ZÁÉÍÓÚÑ¿¡])/g,"$1 ")
    .replace(/\s+([,.;:])/g,"$1")
    .replace(/,\s*([.;:])/g,"$1")
    .replace(/([,.;:])\s*\1+/g,"$1")
    .replace(/,\s*,/g,",")
    .replace(/\s{2,}/g," ")
    .trim();
}

/* ─────────── 3 · Segmentar en frases y envolverlas ─────────── */
var ABBR=/\b(arts?|apdos?|núms?|nums?|págs?|párr|cap|caps|ss|Sr|Sra|Sres|D|Dª|etc|vid|cfr|op|cit|ej|núm|art|fig|tít|secc)\.$/i;
function limites(t){
  var out=[],ini=0;
  for(var i=0;i<t.length;i++){
    var c=t[i];
    if(c!=="."&&c!=="!"&&c!=="?")continue;
    var sig=t[i+1]||" ";
    if(!/[\s"»)]/.test(sig))continue;             /* 3.005 o art.1 → no cortar */
    if(ABBR.test(t.slice(Math.max(0,i-9),i+1)))continue;
    if(/^\s*[0-9º ª]/.test(t.slice(i+1,i+3)))continue;
    if(i+1-ini<40)continue;                        /* frases demasiado cortas */
    out.push(i+1);ini=i+1;
  }
  if(ini<t.length)out.push(t.length);
  return out;
}
function segmentar(root){
  var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:function(n){
    if(!n.nodeValue||!n.nodeValue.trim())return NodeFilter.FILTER_REJECT;
    if(n.parentElement&&n.parentElement.closest(".lbl,.tts-bar"))return NodeFilter.FILTER_REJECT;
    return NodeFilter.FILTER_ACCEPT;
  }});
  var nodos=[];while(w.nextNode())nodos.push(w.currentNode);
  if(!nodos.length)return [];

  var full="";nodos.forEach(function(n){full+=n.nodeValue;});
  var cortes=limites(full), frases=[],ci=0,pos=0;
  cortes.forEach(function(){frases.push({text:"",spans:[]});});

  nodos.forEach(function(node){
    var txt=node.nodeValue, off=0, frag=document.createDocumentFragment();
    while(off<txt.length){
      var fin=cortes[ci]!=null?cortes[ci]-pos:txt.length;
      if(fin>txt.length)fin=txt.length;
      if(fin<=off)fin=txt.length;
      var trozo=txt.slice(off,fin);
      var sp=document.createElement("span");
      sp.className="tts-s";sp.setAttribute("data-s",ci);sp.textContent=trozo;
      frag.appendChild(sp);
      if(frases[ci]){frases[ci].text+=trozo;frases[ci].spans.push(sp);}
      if(pos+fin>=(cortes[ci]||Infinity))ci++;
      off=fin;
    }
    pos+=txt.length;
    node.parentNode.replaceChild(frag,node);
  });
  return frases.filter(function(f){return f.text.trim().length>1;});
}

/* ─────────── 4 · Reproductor ─────────── */
var mini,miniBar,miniLbl,miniPlay;
function crearMini(){
  mini=document.createElement("div");
  mini.className="tts-mini noprint";
  mini.innerHTML='<span class="lbl"></span>'
    +'<button class="main" data-a="play" title="Pausar o reanudar">⏸</button>'
    +'<span class="bar"><i></i></span>'
    +'<button data-a="prev" title="Frase anterior">↺</button>'
    +'<button data-a="stop" title="Detener">■</button>'
    +'<button data-a="cfg" title="Ajustes de voz">⚙</button>';
  document.body.appendChild(mini);
  miniBar=mini.querySelector(".bar i");miniLbl=mini.querySelector(".lbl");
  miniPlay=mini.querySelector('[data-a="play"]');
  mini.addEventListener("click",function(e){
    var b=e.target.closest("button");if(!b)return;
    var a=b.getAttribute("data-a");
    if(a==="play")pausarReanudar();
    else if(a==="stop")parar();
    else if(a==="prev"){if(actual){actual.i=Math.max(0,actual.i-2);siguiente();}}
    else if(a==="cfg")abrirPanel();
  });
}

function limpiarMarcas(){
  document.querySelectorAll(".tts-s.now").forEach(function(s){s.classList.remove("now");});
}
function parar(){
  synth.cancel();
  if(actual){
    actual.bloque.classList.remove("tts-on");
    var b=actual.bloque.querySelector(".tts-play");
    if(b){b.classList.remove("on");b.innerHTML=iconoPlay();}
  }
  limpiarMarcas();
  actual=null;
  if(mini)mini.classList.remove("show");
}
function iconoPlay(){return '<span aria-hidden="true">▶</span> Escuchar';}
function iconoOn(){return '<span class="tts-wave" aria-hidden="true"><i></i><i></i><i></i><i></i></span> Leyendo';}

function pausarReanudar(){
  if(!actual)return;
  if(synth.paused){synth.resume();miniPlay.textContent="⏸";}
  else{synth.pause();miniPlay.textContent="▶";}
}

function leer(bloque){
  if(actual&&actual.bloque===bloque){parar();return;}
  parar();
  var datos=bloque.__tts;
  if(!datos||!datos.length)return;
  var voz=elegir();
  actual={bloque:bloque,frases:datos,i:0,voz:voz};
  bloque.classList.add("tts-on");
  var b=bloque.querySelector(".tts-play");
  if(b){b.classList.add("on");b.innerHTML=iconoOn();}
  if(!mini)crearMini();
  var art=bloque.closest(".art");
  var t=art?art.querySelector("h2 .num"):null;
  var sufijo=bloque.__label?" · "+bloque.__label:"";
  miniLbl.textContent=(t?t.textContent:"")+sufijo||"Lectura";
  miniLbl.title=miniLbl.textContent;
  miniPlay.textContent="⏸";
  mini.classList.add("show");
  siguiente();
}

function siguiente(){
  if(!actual)return;
  limpiarMarcas();
  if(actual.i>=actual.frases.length){
    var fin=actual.bloque;
    parar();
    fin.dispatchEvent(new CustomEvent("tts:fin",{bubbles:true}));
    return;
  }
  var f=actual.frases[actual.i];
  var texto=paraVoz(f.text);
  if(!texto||texto.length<2){actual.i++;siguiente();return;}

  f.spans.forEach(function(s){s.classList.add("now");});
  if(f.spans[0]&&actual.i>0){
    var r=f.spans[0].getBoundingClientRect();
    if(r.top<70||r.bottom>innerHeight-90)
      f.spans[0].scrollIntoView({block:"center",behavior:"smooth"});
  }
  miniBar.style.width=((actual.i+1)/actual.frases.length*100)+"%";

  var u=new SpeechSynthesisUtterance(texto);
  if(actual.voz){u.voice=actual.voz;u.lang=actual.voz.lang;}else{u.lang="es-ES";}
  u.rate=cfg.rate;u.pitch=cfg.pitch||1;u.volume=1;
  u.onend=function(){if(actual){actual.i++;setTimeout(siguiente,90);}};
  u.onerror=function(e){
    if(e&&e.error==="interrupted")return;
    if(actual){actual.i++;setTimeout(siguiente,120);}
  };
  actual.u=u;
  synth.speak(u);
}

/* Chrome detiene la síntesis larga: lo mantenemos vivo */
setInterval(function(){
  if(actual&&synth.speaking&&!synth.paused){synth.pause();synth.resume();}
},9000);

/* ─────────── 5 · Panel de ajustes ─────────── */
var back,sel;
function crearPanel(){
  back=document.createElement("div");
  back.className="tts-back noprint";
  back.innerHTML=
   '<div class="tts-panel" role="dialog" aria-modal="true" aria-label="Ajustes de voz">'
   +'<h3>🔊 Lectura en voz alta</h3>'
   +'<p class="sub">Ajusta cómo se lee el texto legal. Se recuerda para todos los bloques.</p>'
   +'<div class="tts-row"><label>Tipo de voz</label>'
     +'<div class="tts-seg" id="ttsGen">'
       +'<button data-g="f">👩 Femenina</button>'
       +'<button data-g="m">👨 Masculina</button>'
     +'</div></div>'
   +'<div class="tts-row"><label>Voz concreta</label><select id="ttsVoz"></select></div>'
   +'<div class="tts-row"><label>Velocidad</label>'
     +'<div class="tts-slider"><input type="range" id="ttsRate" min="0.6" max="1.6" step="0.05">'
     +'<span class="tts-val" id="ttsRateV"></span></div></div>'
   +'<div class="tts-row"><label>Tono</label>'
     +'<div class="tts-slider"><input type="range" id="ttsPitch" min="0.7" max="1.3" step="0.05">'
     +'<span class="tts-val" id="ttsPitchV"></span></div></div>'
   +'<p class="tts-note" id="ttsNota"></p>'
   +'<div class="tts-acts">'
     +'<button id="ttsTest">▶ Probar</button>'
     +'<button class="prim" id="ttsOk">Hecho</button>'
   +'</div></div>';
  document.body.appendChild(back);
  sel=back.querySelector("#ttsVoz");

  back.addEventListener("click",function(e){if(e.target===back)cerrarPanel();});
  back.querySelector("#ttsOk").onclick=cerrarPanel;
  back.querySelector("#ttsGen").addEventListener("click",function(e){
    var b=e.target.closest("button[data-g]");if(!b)return;
    cfg.gen=b.getAttribute("data-g");cfg.voz=null;save(cfg);pintarSelector();probar();
  });
  sel.onchange=function(){cfg.voz=sel.value;save(cfg);probar();};
  var r=back.querySelector("#ttsRate"),rv=back.querySelector("#ttsRateV");
  r.value=cfg.rate;rv.textContent=(+cfg.rate).toFixed(2)+"×";
  r.oninput=function(){cfg.rate=+r.value;rv.textContent=cfg.rate.toFixed(2)+"×";save(cfg);};
  r.onchange=probar;
  var p=back.querySelector("#ttsPitch"),pv=back.querySelector("#ttsPitchV");
  p.value=cfg.pitch||1;pv.textContent=(+(cfg.pitch||1)).toFixed(2);
  p.oninput=function(){cfg.pitch=+p.value;pv.textContent=cfg.pitch.toFixed(2);save(cfg);};
  p.onchange=probar;
  back.querySelector("#ttsTest").onclick=probar;
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"&&back.classList.contains("show"))cerrarPanel();
  });
}
function probar(){
  synth.cancel();
  var v=elegir();
  var u=new SpeechSynthesisUtterance("El presupuesto general de la entidad local se aprueba antes del 31 de diciembre.");
  if(v){u.voice=v;u.lang=v.lang;}else u.lang="es-ES";
  u.rate=cfg.rate;u.pitch=cfg.pitch||1;
  synth.speak(u);
}
function pintarSelector(){
  if(!sel)return;
  var g=cfg.gen;
  back.querySelectorAll("#ttsGen button").forEach(function(b){
    b.setAttribute("aria-pressed",String(b.getAttribute("data-g")===g));
  });
  var pref=voces.filter(function(v){return genero(v)===g;});
  var otras=voces.filter(function(v){return genero(v)!==g;});
  function opt(v){
    var nat=/natural|neural|online|premium|enhanced|google/i.test(v.name)?" ★":"";
    return '<option value="'+v.voiceURI+'">'+v.name+nat+"</option>";
  }
  sel.innerHTML=(pref.length?'<optgroup label="'+(g==="f"?"Femeninas":"Masculinas")+'">'+pref.map(opt).join("")+"</optgroup>":"")
    +(otras.length?'<optgroup label="Otras voces en español">'+otras.map(opt).join("")+"</optgroup>":"");
  var v=elegir();
  if(v)sel.value=v.voiceURI;

  var nota=back.querySelector("#ttsNota");
  var hayNat=voces.some(function(x){return /natural|neural|online/i.test(x.name);});
  if(!voces.length){
    nota.innerHTML="⚠️ No se han detectado voces en español en este navegador. Prueba con Microsoft Edge o Chrome.";
  }else if(hayNat){
    nota.innerHTML="✅ Tienes voces <b>neuronales</b> disponibles (marcadas con ★): son las que suenan más humanas.";
  }else{
    nota.innerHTML="💡 Las voces marcadas con ★ suenan mejor. Para conseguir voces <b>neuronales</b> (mucho más naturales), "
      +"abre estas páginas en <b>Microsoft Edge</b>, o instálalas en Windows: <b>Configuración → Hora e idioma → Voz → Agregar voces</b>.";
  }
}
function abrirPanel(){if(!back)crearPanel();pintarSelector();back.classList.add("show");}
function cerrarPanel(){if(back)back.classList.remove("show");synth.cancel();}

/* ─────────── 6 · Inyectar los controles en cada apartado ─────────── */
/* Se excluyen a propósito tres apartados: conexiones con otros preceptos,
   trampas y errores frecuentes, y anclaje memorístico. */
var TTS_EXCLUIR=/(conexion|conexiones|trampas|anclaje)/i;

function ttsBarra(frases,compacta){
  var bar=document.createElement("div");
  bar.className="tts-bar noprint"+(compacta?" mini":"");
  bar.innerHTML='<button class="tts-play" type="button">'+iconoPlay()+"</button>"
    +(compacta?"":'<button class="tts-cfg" type="button" title="Ajustes de voz">⚙ Voz</button>')
    +'<span class="tts-time">'+frases.length+(frases.length===1?" frase":" frases")+"</span>";
  return bar;
}

function ttsPreparar(bl,opts){
  if(bl.getAttribute("data-tts"))return false;
  bl.setAttribute("data-tts","1");
  var frases=segmentar(bl);
  bl.__tts=frases;
  if(!frases.length||bl.textContent.trim().length<40)return false;
  bl.__label=opts.label||"";
  var bar=ttsBarra(frases,opts.compacta);
  if(opts.tras){
    var ref=bl.querySelector(opts.tras);
    if(ref&&ref.nextSibling)bl.insertBefore(bar,ref.nextSibling);
    else bl.insertBefore(bar,bl.firstChild);
  }else if(opts.alFinal){
    bl.appendChild(bar);
  }else{
    bl.insertBefore(bar,bl.firstChild);
  }
  bar.querySelector(".tts-play").onclick=function(e){e.stopPropagation();leer(bl);};
  var cfg=bar.querySelector(".tts-cfg");
  if(cfg)cfg.onclick=function(e){e.stopPropagation();abrirPanel();};
  return true;
}

function montar(){
  var hay=false;
  if(!back)crearPanel();

  /* 6a · Texto legal literal */
  Array.prototype.forEach.call(document.querySelectorAll(".legal:not([data-tts])"),function(bl){
    hay=ttsPreparar(bl,{tras:".lbl",label:"Texto legal"})||hay;
  });

  /* 6b · Idea clave */
  Array.prototype.forEach.call(document.querySelectorAll(".idea:not([data-tts])"),function(bl){
    hay=ttsPreparar(bl,{compacta:true,alFinal:true,label:"Idea clave"})||hay;
  });

  /* 6c · Apartados desplegables, salvo los tres excluidos */
  Array.prototype.forEach.call(document.querySelectorAll("details.panel"),function(p){
    var sum=p.querySelector("summary");
    var body=p.querySelector(".body");
    if(!sum||!body||body.getAttribute("data-tts"))return;
    var t=sum.textContent||"";
    if(TTS_EXCLUIR.test(t)){body.setAttribute("data-tts","skip");return;}
    hay=ttsPreparar(body,{compacta:true,label:t.replace(/[^\wáéíóúüñÁÉÍÓÚÜÑ\s·¿?¡!]/g,"").trim()})||hay;
  });

  /* 6d · Resumen e introducción del bloque */
  ["#resumen","#intro"].forEach(function(sel){
    var sec=document.querySelector(sel);
    if(!sec||sec.getAttribute("data-tts"))return;
    var h=sec.querySelector("h2");
    hay=ttsPreparar(sec,{tras:"h2",label:h?h.textContent:"Resumen"})||hay;
  });

  return hay;
}

/* ─────────── 7 · Arranque ─────────── */
cargarVoces();
if(typeof synth.onvoiceschanged!=="undefined")synth.onvoiceschanged=cargarVoces;
setTimeout(cargarVoces,400);setTimeout(cargarVoces,1400);

var n=0,iv=setInterval(function(){if(montar()||++n>40)clearInterval(iv);},150);
addEventListener("load",function(){setTimeout(montar,200);});
addEventListener("beforeunload",function(){synth.cancel();});
document.addEventListener("keydown",function(e){
  if(e.target.matches("input,textarea,select"))return;
  if(e.key==="Escape"&&actual)parar();
});
})();


</script>
<script>


/* ═══════════════════════════════════════════════════════════════
   AUTOAJUSTE DE DIAGRAMAS SVG
   · El texto que desborda su rectángulo se reparte en líneas.
   · Las filas siguientes se empujan hacia abajo y el rectángulo crece,
     de modo que ninguna línea nueva pise al texto de debajo.
   · Si no hay espacio libre bajo el rectángulo, en lugar de repartir
     se reduce la fuente: nunca se invade el elemento contiguo.
   · Las etiquetas sueltas reciben halo y se pintan sobre las flechas.
   Todas las medidas se toman del elemento ya renderizado.
   ═══════════════════════════════════════════════════════════════ */
(function(){
"use strict";
var NS="http://www.w3.org/2000/svg";
var PAD_X=9, PAD_Y=7, FS_MIN=6.5, MAX_LINEAS=4, INTER=1.16, SEP_MIN=5;

function num(el,a,d){var v=parseFloat(el.getAttribute(a));return isNaN(v)?(d||0):v;}
function ancho(t){try{if(t.getComputedTextLength)return t.getComputedTextLength();}catch(e){}return 0;}
function fs(t){
  var v=parseFloat(t.getAttribute("font-size"));
  if(!isNaN(v))return v;
  try{v=parseFloat(getComputedStyle(t).fontSize);if(!isNaN(v)&&v>0)return v;}catch(e){}
  return 10;
}
function partir(txt,cpp,maxW,n){
  if(txt.length*cpp<=maxW)return [txt];
  var seps=[" · "," — "," – ",", "," "],s,i,k;
  for(s=0;s<seps.length;s++){
    var tr=txt.split(seps[s]);
    if(tr.length<2)continue;
    var lin=[],act="";
    for(i=0;i<tr.length;i++){
      var cand=act?act+seps[s]+tr[i]:tr[i];
      if(act&&cand.length*cpp>maxW){lin.push(act);act=tr[i];}
      else act=cand;
    }
    if(act)lin.push(act);
    var caben=true;
    for(k=0;k<lin.length;k++)if(lin[k].length*cpp>maxW)caben=false;
    if(caben&&lin.length<=n)return lin;
  }
  return null;
}
function pintar(t,lin,size){
  while(t.firstChild)t.removeChild(t.firstChild);
  var x=t.getAttribute("x");
  for(var i=0;i<lin.length;i++){
    var ts=document.createElementNS(NS,"tspan");
    ts.setAttribute("x",x);
    if(i)ts.setAttribute("dy",(size*INTER).toFixed(1));
    ts.textContent=lin[i];
    t.appendChild(ts);
  }
}
function encajar(t,cpp,maxW){
  var sp=t.getElementsByTagName("tspan"),i;
  if(sp.length){
    for(i=0;i<sp.length;i++)
      if(sp[i].textContent.length*cpp>maxW+.5){
        sp[i].setAttribute("textLength",maxW.toFixed(1));
        sp[i].setAttribute("lengthAdjust","spacingAndGlyphs");
      }
  }else if((t.textContent||"").length*cpp>maxW+.5){
    t.setAttribute("textLength",maxW.toFixed(1));
    t.setAttribute("lengthAdjust","spacingAndGlyphs");
  }
}
/* reduce la fuente hasta que el texto quepa en una sola línea */
function encoger(t,txt,cpp,size,maxW){
  var s2=size,c2=cpp;
  while(s2>FS_MIN&&txt.length*c2>maxW){s2-=.5;c2=cpp*(s2/size);}
  t.setAttribute("font-size",s2.toFixed(1));
  encajar(t,c2,maxW);
  return s2;
}

function ajustar(svg){
  var rects=[],texts=[],i;
  var rl=svg.querySelectorAll("rect"),tl=svg.querySelectorAll("text");
  for(i=0;i<rl.length;i++)if(!rl[i].hasAttribute("data-halo"))rects.push(rl[i]);
  for(i=0;i<tl.length;i++)texts.push(tl[i]);
  if(!texts.length)return true;
  var medible=false;
  for(i=0;i<texts.length;i++)
    if((texts[i].textContent||"").trim()&&ancho(texts[i])>0){medible=true;break;}
  if(!medible)return false;

  var porRect=[],sueltos=[];
  function grupo(r){
    for(var j=0;j<porRect.length;j++)if(porRect[j].r===r)return porRect[j];
    var g={r:r,lista:[]};porRect.push(g);return g;
  }
  texts.forEach(function(t){
    if(t.getAttribute("data-fit"))return;
    var x=num(t,"x"),y=num(t,"y"),host=null,area=Infinity;
    rects.forEach(function(r){
      var rx=num(r,"x"),ry=num(r,"y"),rw=num(r,"width"),rh=num(r,"height");
      if(!rw||!rh)return;
      if(x>=rx-1&&x<=rx+rw+1&&y>=ry-1&&y<=ry+rh+1&&rw*rh<area){host=r;area=rw*rh;}
    });
    if(host)grupo(host).lista.push(t); else sueltos.push(t);
  });

  /* espacio libre bajo un rectángulo, hasta el siguiente elemento que le estorbe */
  function hueco(r){
    var rx=num(r,"x"),ry=num(r,"y"),rw=num(r,"width"),rh=num(r,"height");
    var abajo=ry+rh, libre=Infinity;
    rects.forEach(function(o){
      if(o===r)return;
      var ox=num(o,"x"),oy=num(o,"y"),ow=num(o,"width");
      if(oy>=abajo-1&&ox<rx+rw&&ox+ow>rx)libre=Math.min(libre,oy-abajo-SEP_MIN);
    });
    texts.forEach(function(t){
      var tx=num(t,"x"),ty=num(t,"y");
      if(ty>abajo&&tx>rx-40&&tx<rx+rw+40)
        libre=Math.min(libre,ty-fs(t)-abajo-SEP_MIN);
    });
    var vb=(svg.getAttribute("viewBox")||"").split(/[\s,]+/);
    if(vb.length===4)libre=Math.min(libre,parseFloat(vb[1])+parseFloat(vb[3])-abajo-2);
    return Math.max(0,libre);
  }

  /* ─── 1 · Texto dentro de un rectángulo ─── */
  porRect.forEach(function(g){
    var r=g.r, rx=num(r,"x"), ry=num(r,"y"), rw=num(r,"width"), rh=num(r,"height");
    var maxW=rw-PAD_X*2;
    if(maxW<20)return;
    g.lista.forEach(function(t){t.setAttribute("data-fit","1");});
    g.lista.sort(function(a,b){return num(a,"y")-num(b,"y");});

    /* filas: textos a la misma altura */
    var filas=[],act=null;
    g.lista.forEach(function(t){
      var y=num(t,"y");
      if(!act||Math.abs(y-act.y)>3){act={y:y,ts:[]};filas.push(act);}
      act.ts.push(t);
    });

    /* — plan: qué haría falta — */
    var total=0;
    filas.forEach(function(fl){
      fl.extra=0;fl.plan=[];
      fl.ts.forEach(function(t){
        var txt=(t.textContent||"").replace(/\s+/g," ").trim();
        var w=ancho(t);
        if(!txt||!w||w<=maxW){fl.plan.push(null);return;}
        var size=fs(t), cpp=w/txt.length;
        var lin=partir(txt,cpp,maxW,MAX_LINEAS);
        if(lin&&lin.length>1){
          fl.plan.push({t:t,lin:lin,size:size,cpp:cpp,txt:txt});
          fl.extra=Math.max(fl.extra,(lin.length-1)*size*INTER);
        }else fl.plan.push({t:t,lin:null,size:size,cpp:cpp,txt:txt});
      });
      total+=fl.extra;
    });

    /* — ¿cabe ese crecimiento? — */
    var ultima=filas[filas.length-1];
    var colchon=Math.max(0,(ry+rh)-ultima.y-PAD_Y);
    var crecer=Math.max(0,total-colchon);
    var libre=hueco(r);
    var reparte=crecer<=libre;

    var desp=0;
    filas.forEach(function(fl){
      if(desp>0)fl.ts.forEach(function(t){t.setAttribute("y",(num(t,"y")+desp).toFixed(1));});
      fl.plan.forEach(function(p){
        if(!p)return;
        if(p.lin&&reparte){pintar(p.t,p.lin,p.size);encajar(p.t,p.cpp,maxW);}
        else encoger(p.t,p.txt,p.cpp,p.size,maxW);
      });
      if(reparte)desp+=fl.extra;
    });

    if(reparte&&crecer>0)r.setAttribute("height",(rh+crecer).toFixed(1));

    /* comprobación final: ninguna línea puede sobresalir del rectángulo */
    var rh2=num(r,"height"), bajo=ry, i2;
    g.lista.forEach(function(t){
      var size=fs(t), y=num(t,"y"), sp=t.getElementsByTagName("tspan");
      if(sp.length){for(i2=0;i2<sp.length;i2++){
        if(i2)y+=parseFloat(sp[i2].getAttribute("dy"))||0;
        bajo=Math.max(bajo,y+size*0.3);}}
      else bajo=Math.max(bajo,y+size*0.3);
    });
    if(bajo>ry+rh2-1){
      var falta=bajo-(ry+rh2)+3;
      if(falta<=hueco(r))r.setAttribute("height",(rh2+falta).toFixed(1));
      else g.lista.forEach(function(t){
        var txt=(t.textContent||"").replace(/\s+/g," ").trim(), w=ancho(t);
        if(txt&&w)encoger(t,txt,w/txt.length,fs(t),maxW);
      });
    }
  });

  /* ─── 2 · Etiquetas sueltas ─── */
  sueltos.forEach(function(t){
    t.setAttribute("data-fit","1");
    var txt=(t.textContent||"").replace(/\s+/g," ").trim();
    if(!txt)return;
    var w=ancho(t); if(!w)return;
    var size=fs(t), x=num(t,"x"), y=num(t,"y");
    var an=t.getAttribute("text-anchor")||"start";
    var x0=an==="middle"?x-w/2:an==="end"?x-w:x;
    var halo=document.createElementNS(NS,"rect");
    halo.setAttribute("data-halo","1");
    halo.setAttribute("x",(x0-5).toFixed(1));
    halo.setAttribute("y",(y-size*0.92).toFixed(1));
    halo.setAttribute("width",(w+10).toFixed(1));
    halo.setAttribute("height",(size*1.28).toFixed(1));
    halo.setAttribute("rx","4");
    halo.setAttribute("fill","var(--surface)");
    halo.setAttribute("opacity",".93");
    var p=t.parentNode;
    p.appendChild(halo);p.appendChild(t);
  });
  return true;
}

function pasada(){
  var l=document.querySelectorAll("svg:not([data-fit])"),i;
  for(i=0;i<l.length;i++){try{if(ajustar(l[i]))l[i].setAttribute("data-fit","1");}catch(e){}}
}
if(document.readyState!=="loading")requestAnimationFrame(pasada);
else document.addEventListener("DOMContentLoaded",function(){requestAnimationFrame(pasada);});
addEventListener("load",function(){setTimeout(pasada,120);setTimeout(pasada,600);});
document.addEventListener("toggle",function(e){
  if(e.target&&e.target.tagName==="DETAILS")setTimeout(pasada,30);
},true);
var n=0,iv=setInterval(function(){pasada();if(++n>40)clearInterval(iv);},200);
})();


</script>

">arts. 150.1 y 154</text><path d=\"M320 103 L 320 122\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#k2cdt6)\"/><path d=\"M320 177 L 320 196\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#k2cdt6)\"/><path d=\"M320 271 L 320 290\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#k2cdt6)\"/><path d=\"M320 345 L 320 364\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#k2cdt6)\"/></svg><div class=\"box warn\"><span class=\"lbl\">Trampas de examen</span><ul><li>El plazo armonizado se cuenta desde el <b>envío</b> del anuncio a la Oficina de Publicaciones, no desde la publicación en el perfil.</li><li>Con urgencia, el plazo de ofertas SARA <b>no se reduce a la mitad</b>: tiene su propio mínimo de 15 días (art. 119.2.b.2.º).</li><li>Umbrales de la biblioteca: servicios y suministros 140.000 € (AGE) o 216.000 € (resto); obras 5.404.000 € (art. 20). Comprueba su actualización.</li></ul></div><details class=\"panel\"><summary>Art. 156.2 y 3 LCSP</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LCSP</span><p>«el plazo de presentación de proposiciones no será inferior a treinta y cinco días, para los contratos de obras, suministros y servicios, y a treinta días para las concesiones de obras y servicios, contados desde la fecha de envío del anuncio de licitación a la Oficina de Publicaciones de la Unión Europea.»</p><p>«Si el órgano de contratación hubiese enviado un anuncio de información previa, el plazo general de presentación de proposiciones podrá reducirse a quince días.»</p><p>«el órgano de contratación podrá fijar otro plazo que no será inferior a quince días contados desde la fecha del envío del anuncio de licitación.»</p><p>«Si el órgano de contratación aceptara la presentación de ofertas por medios electrónicos, podrá reducirse el plazo general de presentación de proposiciones en cinco días.»</p></div></div></details><details class=\"panel\"><summary>Art. 135.3 LCSP</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LCSP</span><p>«No obstante, en todo caso podrán publicarse si el órgano de contratación no ha recibido notificación de su publicación a las 48 horas de la confirmación de la recepción del anuncio enviado.»</p></div></div></details></section><section class=\"card art\" id=\"simpl\"><h2>Procedimiento abierto simplificado · tramitación ordinaria</h2><p class=\"ubic\">Arts. 159.1-5 y 326.6 LCSP</p><div class=\"idea\">Un abierto más corto para contratos medianos: un solo registro, inscripción previa y todo en una sesión.</div><svg viewBox=\"0 0 640 535\" role=\"img\" aria-label=\"Procedimiento abierto simplificado (art. 159.1-5)\" style=\"width:100%;height:auto\"><defs><marker id=\"kuepgb\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\"><path d=\"M0 0 L9 4.5 L0 9 z\" fill=\"var(--acc)\"/></marker><marker id=\"kuepgbs\" markerWidth=\"9\" markerHeight=\"9\" refX=\"1\" refY=\"4.5\" orient=\"auto\"><path d=\"M9 0 L0 4.5 L9 9 z\" fill=\"var(--acc)\"/></marker></defs><rect x=\"159.2\" y=\"8\" width=\"321.7\" height=\"30\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"320\" y=\"27\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">Procedimiento abierto simplificado (art. 159.1-5)</text><rect x=\"12\" y=\"50\" width=\"616\" height=\"52\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"24\" y=\"60\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"99\" y=\"80\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">Requisitos</text><text x=\"186\" y=\"72.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Obras: VE ≤ 2.000.000 € · suministros y servicios: VE &lt; 140.000 € (art. 22.1.a)</text><text x=\"186\" y=\"86.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Juicio de valor ≤ 25 % del total (≤ 45 % si son prestaciones intelectuales)</text><text x=\"616\" y=\"70\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">art. 159.1</text><rect x=\"12\" y=\"124\" width=\"616\" height=\"52\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"24\" y=\"134\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"99\" y=\"154\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">Anuncio</text><text x=\"186\" y=\"153.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Solo en el perfil · toda la documentación en línea desde ese mismo día</text><text x=\"616\" y=\"144\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">art. 159.2</text><rect x=\"12\" y=\"198\" width=\"616\" height=\"58\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"24\" y=\"211\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"99\" y=\"231\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">Ofertas</text><text x=\"186\" y=\"216.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">≥ 15 días desde el siguiente a la publicación · obras: ≥ 20 días</text><text x=\"186\" y=\"230.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Inscripción registral a la fecha final de ofertas · sin garantía provisional</text><text x=\"186\" y=\"244.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Declaración responsable · 1 sobre (2 si hay juicio de valor)</text><text x=\"616\" y=\"218\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">art. 159.3-4</text><rect x=\"12\" y=\"278\" width=\"616\" height=\"58\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"24\" y=\"291\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"99\" y=\"311\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--warn)\">Valoración</text><text x=\"186\" y=\"296.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Juicio de valor: servicios técnicos en ≤ 7 días, antes de abrir las fórmulas</text><text x=\"186\" y=\"310.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Misma sesión: excluir, clasificar, proponer, comprobar en el registro,</text><text x=\"186\" y=\"324.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">requerir</text><text x=\"616\" y=\"298\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">art. 159.4.e-f</text><rect x=\"12\" y=\"358\" width=\"616\" height=\"52\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"24\" y=\"368\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"99\" y=\"388\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--warn)\">Requerimiento</text><text x=\"186\" y=\"380.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Garantía definitiva y documentos: 7 días hábiles desde el envío</text><text x=\"186\" y=\"394.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Baja anormal: justificación en ≤ 5 días hábiles desde el envío</text><text x=\"616\" y=\"378\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">art. 159.4.f</text><rect x=\"12\" y=\"432\" width=\"616\" height=\"52\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><rect x=\"24\" y=\"442\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--ej)\"/><text x=\"99\" y=\"462\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">Adjudicación</text><text x=\"186\" y=\"461.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">≤ 5 días tras la garantía (previa fiscalización si procede) → formalización</text><text x=\"616\" y=\"452\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">art. 159.4.f</text><rect x=\"12\" y=\"496\" width=\"616\" height=\"31\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"320\" y=\"515\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">Mesa válida con presidente, secretario, asesor jurídico y control económico (326.6) · la urgencia no reduce plazos</text><path d=\"M320 103 L 320 122\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#kuepgb)\"/><path d=\"M320 177 L 320 196\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#kuepgb)\"/><path d=\"M320 257 L 320 276\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#kuepgb)\"/><path d=\"M320 337 L 320 356\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#kuepgb)\"/><path d=\"M320 411 L 320 430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#kuepgb)\"/></svg><div class=\"box warn\"><span class=\"lbl\">Trampas de examen</span><ul><li>El límite de servicios y suministros remite al art. 22.1 <b>letra a)</b>: 140.000 €, también para entidades locales.</li><li>Aquí los 7 días hábiles se cuentan desde el <b>envío</b> de la comunicación, no desde que se recibe.</li><li>La urgencia <b>no</b> reduce a la mitad los plazos del simplificado (arts. 159.5 y 119.2.b.6.º).</li></ul></div><details class=\"panel\"><summary>Art. 159.1-4 LCSP</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LCSP</span><p>«a) Que su valor estimado sea igual o inferior a 2.000.000 de euros en el caso de contratos de obras, y en el caso de contratos de suministro y de servicios, que su valor estimado sea inferior a las cantidades establecidas en los artículos 21.1, letra a), y 22.1, letra a), de esta Ley, respectivamente, o a sus correspondientes actualizaciones.»</p><p>«El plazo para la presentación de proposiciones no podrá ser inferior a quince días a contar desde el siguiente a la publicación en el perfil de contratante del anuncio de licitación. En los contratos de obras el plazo será como mínimo de veinte días.»</p><p>«b) No procederá la constitución de garantía provisional por parte de los licitadores.»</p><p>«la valoración de las proposiciones se hará por los servicios técnicos del órgano de contratación en un plazo no superior a siete días»</p><p>«y todo ello en el plazo de siete días hábiles a contar desde el envío de la comunicación.»</p><p>«el plazo máximo para que justifique su oferta el licitador no podrá superar los cinco días hábiles desde el envío de la correspondiente comunicación.»</p><p>«en un plazo no superior a cinco días se procederá a adjudicar el contrato a favor del licitador propuesto como adjudicatario»</p></div></div></details><details class=\"panel\"><summary>Art. 159.5 LCSP</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LCSP</span><p>«En los casos de declaración de urgencia del expediente de contratación en el que el procedimiento de adjudicación utilizado sea el procedimiento abierto simplificado regulado en el presente artículo, no se producirá la reducción de plazos a la que se refiere la letra b) del apartado 2 del artículo 119.»</p></div></div></details></section><section class=\"card art\" id=\"abrev\"><h2>Abierto simplificado · tramitación abreviada (art. 159.6)</h2><p class=\"ubic\">Arts. 159.6 y 326.1 LCSP</p><div class=\"idea\">El simplificado mínimo: 10 días hábiles, un sobre, solo fórmulas, sin solvencia y sin garantía.</div><svg viewBox=\"0 0 640 475\" role=\"img\" aria-label=\"Tramitación abreviada del simplificado (art. 159.6)\" style=\"width:100%;height:auto\"><defs><marker id=\"k09u13\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\"><path d=\"M0 0 L9 4.5 L0 9 z\" fill=\"var(--acc)\"/></marker><marker id=\"k09u13s\" markerWidth=\"9\" markerHeight=\"9\" refX=\"1\" refY=\"4.5\" orient=\"auto\"><path d=\"M9 0 L0 4.5 L9 9 z\" fill=\"var(--acc)\"/></marker></defs><rect x=\"153.3\" y=\"8\" width=\"333.4\" height=\"30\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"320\" y=\"27\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">Tramitación abreviada del simplificado (art. 159.6)</text><rect x=\"12\" y=\"50\" width=\"616\" height=\"52\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"24\" y=\"60\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"99\" y=\"80\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">Requisitos</text><text x=\"186\" y=\"72.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Obras: VE &lt; 80.000 € · suministros y servicios: VE &lt; 60.000 €</text><text x=\"186\" y=\"86.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Nunca prestaciones de carácter intelectual · solo criterios de fórmula</text><text x=\"616\" y=\"70\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">art. 159.6</text><rect x=\"12\" y=\"124\" width=\"616\" height=\"58\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"24\" y=\"137\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"99\" y=\"157\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">Ofertas</text><text x=\"186\" y=\"142.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">≥ 10 días hábiles desde el siguiente a la publicación en el perfil</text><text x=\"186\" y=\"156.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Compras corrientes de bienes disponibles en el mercado: 5 días hábiles</text><text x=\"186\" y=\"170.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Sin acreditar solvencia · un único sobre</text><text x=\"616\" y=\"144\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">art. 159.6.a-c</text><rect x=\"12\" y=\"204\" width=\"616\" height=\"72\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"24\" y=\"224\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"99\" y=\"244\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--warn)\">Valoración</text><text x=\"186\" y=\"222.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Automática o con una unidad técnica · apertura electrónica sin</text><text x=\"186\" y=\"236.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">acto público</text><text x=\"186\" y=\"250.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Mesa potestativa · ofertas abiertas a todos tras notificar la</text><text x=\"186\" y=\"264.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">adjudicación</text><text x=\"616\" y=\"224\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">arts. 159.6.d-e y 326.1</text><rect x=\"12\" y=\"298\" width=\"616\" height=\"52\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><rect x=\"24\" y=\"308\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--ej)\"/><text x=\"99\" y=\"328\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">Adjudicación</text><text x=\"186\" y=\"327.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Sin garantía definitiva</text><text x=\"616\" y=\"318\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">art. 159.6.f</text><rect x=\"12\" y=\"372\" width=\"616\" height=\"52\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><rect x=\"24\" y=\"382\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--ej)\"/><text x=\"99\" y=\"402\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">Formalización</text><text x=\"186\" y=\"401.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Puede bastar la firma de aceptación de la resolución de adjudicación</text><text x=\"616\" y=\"392\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">art. 159.6.g</text><rect x=\"12\" y=\"436\" width=\"616\" height=\"31\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"320\" y=\"455\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">En lo no previsto: las reglas del simplificado ordinario (art. 159.6, último párrafo)</text><path d=\"M320 103 L 320 122\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#k09u13)\"/><path d=\"M320 183 L 320 202\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#k09u13)\"/><path d=\"M320 277 L 320 296\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#k09u13)\"/><path d=\"M320 351 L 320 370\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#k09u13)\"/></svg><div class=\"box warn\"><span class=\"lbl\">Trampas de examen</span><ul><li>Son <b>días hábiles</b>: es de los pocos plazos de presentación de ofertas que la Ley fija así.</li><li>Los umbrales son <b>&lt; 80.000 €</b> y <b>&lt; 60.000 €</b> (estrictamente inferiores).</li><li>No confundas: el abreviado <b>suprime la garantía definitiva</b>; el simplificado ordinario solo suprime la <b>provisional</b>.</li></ul></div><details class=\"panel\"><summary>Art. 159.6 LCSP</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LCSP</span><p>«En contratos de obras de valor estimado inferior a 80.000 euros, y en contratos de suministros y de servicios de valor estimado inferior a 60.000 euros, excepto los que tengan por objeto prestaciones de carácter intelectual a los que no será de aplicación este apartado»</p><p>«a) El plazo para la presentación de proposiciones no podrá ser inferior a diez días hábiles, a contar desde el siguiente a la publicación del anuncio de licitación en el perfil de contratante. No obstante lo anterior, cuando se trate de compras corrientes de bienes disponibles en el mercado el plazo será de 5 días hábiles.»</p><p>«b) Se eximirá a los licitadores de la acreditación de la solvencia económica y financiera y técnica o profesional.»</p><p>«c) La oferta se entregará en un único sobre o archivo electrónico y se evaluará, en todo caso, con arreglo a criterios de adjudicación cuantificables mediante la mera aplicación de fórmulas establecidas en los pliegos.»</p><p>«por lo que no se celebrará acto público de apertura de las mismas.»</p><p>«f) No se requerirá la constitución de garantía definitiva.»</p><p>«g) La formalización del contrato podrá efectuarse mediante la firma de aceptación por el contratista de la resolución de adjudicación.»</p></div></div></details></section><section class=\"card art\" id=\"restr\"><h2>Procedimiento restringido · no SARA y SARA</h2><p class=\"ubic\">Arts. 160 a 165 LCSP</p><div class=\"idea\">Dos rondas: primero piden participar todos; luego solo ofertan los que el órgano invita por su solvencia.</div><svg viewBox=\"0 0 640 529\" role=\"img\" aria-label=\"Procedimiento restringido · no sujeto a regulación armonizada\" style=\"width:100%;height:auto\"><defs><marker id=\"kcyhbz\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\"><path d=\"M0 0 L9 4.5 L0 9 z\" fill=\"var(--acc)\"/></marker><marker id=\"kcyhbzs\" markerWidth=\"9\" markerHeight=\"9\" refX=\"1\" refY=\"4.5\" orient=\"auto\"><path d=\"M9 0 L0 4.5 L9 9 z\" fill=\"var(--acc)\"/></marker></defs><rect x=\"118.5\" y=\"8\" width=\"403\" height=\"30\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"320\" y=\"27\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">Procedimiento restringido · no sujeto a regulación armonizada</text><rect x=\"12\" y=\"50\" width=\"616\" height=\"58\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"24\" y=\"63\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"99\" y=\"83\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">Anuncio</text><text x=\"186\" y=\"68.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Antes: criterios objetivos de solvencia y número mínimo (y máximo) de</text><text x=\"186\" y=\"82.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">invitados</text><text x=\"186\" y=\"96.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Todo ello figura en el anuncio de licitación</text><text x=\"616\" y=\"70\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">art. 162.1-3</text><rect x=\"12\" y=\"130\" width=\"616\" height=\"52\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"24\" y=\"140\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"99\" y=\"160\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">Solicitudes</text><text x=\"186\" y=\"152.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Cualquier empresa · ≥ 15 días desde la publicación del anuncio</text><text x=\"186\" y=\"166.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Con la documentación del art. 140, salvo la garantía provisional</text><text x=\"616\" y=\"150\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">art. 161.3-4</text><rect x=\"12\" y=\"204\" width=\"616\" height=\"52\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"24\" y=\"214\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"99\" y=\"234\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--warn)\">Selección</text><text x=\"186\" y=\"226.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Por solvencia · mínimo 5 invitados; si cumplen menos, se sigue con esos</text><text x=\"186\" y=\"240.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Nunca se invita a quien no lo pidió o no cumple los criterios</text><text x=\"616\" y=\"224\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">art. 162.2</text><rect x=\"12\" y=\"278\" width=\"616\" height=\"52\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"24\" y=\"288\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"99\" y=\"308\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">Invitación</text><text x=\"186\" y=\"307.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Simultánea y por escrito: fecha límite, criterios y acceso a los pliegos</text><text x=\"616\" y=\"298\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">arts. 162.4 y 163</text><rect x=\"12\" y=\"352\" width=\"616\" height=\"52\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"24\" y=\"362\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"99\" y=\"382\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">Proposiciones</text><text x=\"186\" y=\"381.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">≥ 10 días desde el envío de la invitación · prohibido negociar</text><text x=\"616\" y=\"372\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">arts. 160.3 y 164.2</text><rect x=\"12\" y=\"426\" width=\"616\" height=\"52\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><rect x=\"24\" y=\"436\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--ej)\"/><text x=\"99\" y=\"456\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">Adjudicación</text><text x=\"186\" y=\"455.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Como en el abierto, sin volver a calificar la documentación del art. 140</text><text x=\"616\" y=\"446\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">art. 165</text><rect x=\"12\" y=\"490\" width=\"616\" height=\"31\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"320\" y=\"509\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">Especialmente adecuado para servicios intelectuales complejos: consultoría, arquitectura, ingeniería</text><path d=\"M320 109 L 320 128\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#kcyhbz)\"/><path d=\"M320 183 L 320 202\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#kcyhbz)\"/><path d=\"M320 257 L 320 276\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#kcyhbz)\"/><path d=\"M320 331 L 320 350\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#kcyhbz)\"/><path d=\"M320 405 L 320 424\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#kcyhbz)\"/></svg><svg viewBox=\"0 0 640 406\" role=\"img\" aria-label=\"Procedimiento restringido · variante armonizada\" style=\"width:100%;height:auto\"><defs><marker id=\"k2uaux\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\"><path d=\"M0 0 L9 4.5 L0 9 z\" fill=\"var(--acc)\"/></marker><marker id=\"k2uauxs\" markerWidth=\"9\" markerHeight=\"9\" refX=\"1\" refY=\"4.5\" orient=\"auto\"><path d=\"M9 0 L0 4.5 L9 9 z\" fill=\"var(--acc)\"/></marker></defs><rect x=\"158.8\" y=\"8\" width=\"322.4\" height=\"30\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"320\" y=\"27\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">Procedimiento restringido · variante armonizada</text><rect x=\"12\" y=\"50\" width=\"616\" height=\"52\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"24\" y=\"60\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"99\" y=\"80\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">Solicitudes</text><text x=\"186\" y=\"72.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">≥ 30 días desde el envío del anuncio a la Oficina de Publicaciones de la UE</text><text x=\"186\" y=\"86.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Urgencia (obras, suministros, servicios): ≥ 15 días desde el envío</text><text x=\"616\" y=\"70\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">art. 161.1</text><rect x=\"12\" y=\"124\" width=\"616\" height=\"52\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"24\" y=\"134\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"99\" y=\"154\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--warn)\">Selección</text><text x=\"186\" y=\"153.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Mínimo 5 invitados · invitación simultánea y por escrito</text><text x=\"616\" y=\"144\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">art. 162</text><rect x=\"12\" y=\"198\" width=\"616\" height=\"52\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"24\" y=\"208\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"99\" y=\"228\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">Proposiciones</text><text x=\"186\" y=\"227.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">≥ 30 días desde el envío de la invitación escrita</text><text x=\"616\" y=\"218\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">art. 164.1</text><rect x=\"12\" y=\"272\" width=\"616\" height=\"52\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"24\" y=\"282\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"99\" y=\"302\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--warn)\">Reducciones</text><text x=\"186\" y=\"294.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Información previa: hasta 10 días · urgencia: ≥ 10 días desde la invitación</text><text x=\"186\" y=\"308.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Ofertas electrónicas: −5 días · concesiones: solo la reducción electrónica</text><text x=\"616\" y=\"292\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">art. 164.1</text><rect x=\"12\" y=\"346\" width=\"616\" height=\"52\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><rect x=\"24\" y=\"356\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--ej)\"/><text x=\"99\" y=\"376\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">Adjudicación</text><text x=\"186\" y=\"375.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Como el abierto (art. 165) · formalización también anunciada en el DOUE</text><text x=\"616\" y=\"366\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">arts. 154 y 165</text><path d=\"M320 103 L 320 122\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#k2uaux)\"/><path d=\"M320 177 L 320 196\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#k2uaux)\"/><path d=\"M320 251 L 320 270\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#k2uaux)\"/><path d=\"M320 325 L 320 344\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#k2uaux)\"/></svg><div class=\"box warn\"><span class=\"lbl\">Trampas de examen</span><ul><li>Restringido: mínimo <b>5</b>. Con negociación, diálogo e innovación: mínimo <b>3</b>.</li><li>Las solicitudes cuentan desde la <b>publicación</b> (no SARA) o el <b>envío</b> al DOUE (SARA); las proposiciones, desde el <b>envío de la invitación</b>.</li><li>Pueden preverse primas o compensaciones en servicios que exijan desarrollos (art. 160.2).</li></ul></div><details class=\"panel\"><summary>Arts. 160-165 LCSP</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LCSP</span><p>«En el procedimiento restringido cualquier empresa interesada podrá presentar una solicitud de participación en respuesta a una convocatoria de licitación.»</p><p>«Si se trata de contratos no sujetos a regulación armonizada, el plazo para la presentación de solicitudes de participación será, como mínimo, de quince días, contados desde la publicación del anuncio de licitación.»</p><p>«En cualquier caso, no podrá ser inferior a treinta días, contados a partir de la fecha del envío del anuncio de licitación a la Oficina de Publicaciones de la Unión Europea.»</p><p>«El órgano de contratación señalará el número mínimo de empresarios a los que invitará a participar en el procedimiento, que no podrá ser inferior a cinco.»</p><p>«En cualquier caso no será inferior a treinta días, contados a partir de la fecha de envío de la invitación escrita.»</p><p>«a) Si se hubiese enviado el anuncio de información previa, el plazo general podrá reducirse a diez días.»</p><p>«En los procedimientos restringidos relativos a contratos no sujetos a regulación armonizada, el plazo para la presentación de proposiciones no será inferior a diez días, contados desde la fecha de envío de la invitación.»</p><p>«En la adjudicación del contrato será de aplicación lo previsto en esta Ley para el procedimiento abierto, salvo lo que se refiere a la necesidad de calificar previamente la documentación a que se refiere el artículo 140.»</p></div></div></details></section><section class=\"card art\" id=\"lneg\"><h2>Licitación con negociación (antes, negociado con publicidad)</h2><p class=\"ubic\">Arts. 166, 167, 169 y 171 LCSP</p><div class=\"idea\">Anuncio público, selección como en el restringido y luego negociación hasta las ofertas definitivas.</div><svg viewBox=\"0 0 640 535\" role=\"img\" aria-label=\"Licitación con negociación\" style=\"width:100%;height:auto\"><defs><marker id=\"k6wzla\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\"><path d=\"M0 0 L9 4.5 L0 9 z\" fill=\"var(--acc)\"/></marker><marker id=\"k6wzlas\" markerWidth=\"9\" markerHeight=\"9\" refX=\"1\" refY=\"4.5\" orient=\"auto\"><path d=\"M9 0 L0 4.5 L9 9 z\" fill=\"var(--acc)\"/></marker></defs><rect x=\"221.8\" y=\"8\" width=\"196.5\" height=\"30\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"320\" y=\"27\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">Licitación con negociación</text><rect x=\"12\" y=\"50\" width=\"616\" height=\"58\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"24\" y=\"63\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"99\" y=\"83\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">Supuestos</text><text x=\"186\" y=\"68.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Diseño o adaptación previa · soluciones innovadoras · complejidad o riesgos</text><text x=\"186\" y=\"82.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Especificaciones técnicas no precisables · antes, solo ofertas irregulares</text><text x=\"186\" y=\"96.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Servicios sociales personalísimos con arraigo (continuidad de la atención)</text><text x=\"616\" y=\"70\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">art. 167</text><rect x=\"12\" y=\"130\" width=\"616\" height=\"52\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"24\" y=\"140\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"99\" y=\"160\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">Anuncio</text><text x=\"186\" y=\"152.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Obligatorio · el pliego fija qué se negocia, requisitos mínimos y</text><text x=\"186\" y=\"166.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">criterios</text><text x=\"616\" y=\"150\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">arts. 166.2 y 169.1</text><rect x=\"12\" y=\"204\" width=\"616\" height=\"52\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"24\" y=\"214\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"99\" y=\"234\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">Solicitudes</text><text x=\"186\" y=\"226.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Reglas del restringido: no SARA ≥ 15 días · SARA ≥ 30 días desde el</text><text x=\"186\" y=\"240.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">envío</text><text x=\"616\" y=\"224\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">arts. 161 y 169.2</text><rect x=\"12\" y=\"278\" width=\"616\" height=\"52\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"24\" y=\"288\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"99\" y=\"308\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--warn)\">Selección</text><text x=\"186\" y=\"300.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Si se limita el número: mínimo 3 candidatos · invitación simultánea</text><text x=\"186\" y=\"314.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Ofertas iniciales en SARA: ≥ 30 días desde el envío de la invitación (164.1)</text><text x=\"616\" y=\"298\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">art. 169.2</text><rect x=\"12\" y=\"352\" width=\"616\" height=\"52\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"24\" y=\"362\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"99\" y=\"382\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--warn)\">Negociación</text><text x=\"186\" y=\"374.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Sobre ofertas iniciales y ulteriores · nunca requisitos mínimos ni criterios</text><text x=\"186\" y=\"388.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Igualdad de trato · confidencialidad · fases sucesivas para reducir ofertas</text><text x=\"616\" y=\"372\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">art. 169.3-7</text><rect x=\"12\" y=\"426\" width=\"616\" height=\"58\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><rect x=\"24\" y=\"439\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--ej)\"/><text x=\"99\" y=\"459\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">Ofertas definitivas</text><text x=\"186\" y=\"444.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Fin de la negociación → plazo común → la mesa verifica y valora →</text><text x=\"186\" y=\"458.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">adjudicación</text><text x=\"186\" y=\"472.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">A quien lo pida: información sobre la negociación en ≤ 15 días</text><text x=\"616\" y=\"446\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">arts. 169.8 y 171</text><rect x=\"12\" y=\"496\" width=\"616\" height=\"31\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"320\" y=\"515\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">Mesa de contratación obligatoria (art. 326.1) · queda constancia de invitaciones, ofertas y ventajas</text><path d=\"M320 109 L 320 128\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#k6wzla)\"/><path d=\"M320 183 L 320 202\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#k6wzla)\"/><path d=\"M320 257 L 320 276\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#k6wzla)\"/><path d=\"M320 331 L 320 350\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#k6wzla)\"/><path d=\"M320 405 L 320 424\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#k6wzla)\"/></svg><div class=\"box warn\"><span class=\"lbl\">Trampas de examen</span><ul><li>Los supuestos del art. 167 sirven para dos procedimientos: la licitación con negociación <b>y</b> el diálogo competitivo.</li><li>La <b>oferta definitiva</b> no se negocia: se valora.</li><li>El art. 169.2 remite al art. 164.1 (SARA), no al 164.2. Para las ofertas iniciales de un contrato no armonizado, mira el pliego.</li></ul></div><details class=\"panel\"><summary>Arts. 167 y 169 LCSP</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LCSP</span><p>«Cuando se acuda al procedimiento de licitación con negociación por concurrir las circunstancias previstas en el artículo 167, el órgano de contratación, en todo caso, deberá publicar un anuncio de licitación en la forma prevista en el artículo 135.»</p><p>«Serán de aplicación a la tramitación del procedimiento de licitación con negociación, las normas contenidas en el apartado 1 del artículo 160, y en los artículos 161, 162, 163 y 164.1 relativos al procedimiento restringido.»</p><p>«deberán asegurarse de que el número mínimo de candidatos invitados será de tres.»</p><p>«No se negociarán los requisitos mínimos de la prestación objeto del contrato ni tampoco los criterios de adjudicación.»</p><p>«Cuando el órgano de contratación decida concluir las negociaciones, informará a todos los licitadores y establecerá un plazo común para la presentación de ofertas nuevas o revisadas.»</p></div></div></details><details class=\"panel\"><summary>Art. 171 LCSP</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LCSP</span><p>«comunicará lo antes posible y en todo caso dentro de los quince días siguientes al de recepción de la solicitud por escrito de aquel, el desarrollo de las negociaciones.»</p></div></div></details></section><section class=\"card art\" id=\"nsp\"><h2>Procedimiento negociado sin publicidad</h2><p class=\"ubic\">Arts. 168, 170 y 326.1 LCSP</p><div class=\"idea\">Sin anuncio, se invita directamente, pero solo en los casos tasados del art. 168.</div><svg viewBox=\"0 0 640 415\" role=\"img\" aria-label=\"Procedimiento negociado sin publicidad\" style=\"width:100%;height:auto\"><defs><marker id=\"kofo7p\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\"><path d=\"M0 0 L9 4.5 L0 9 z\" fill=\"var(--acc)\"/></marker><marker id=\"kofo7ps\" markerWidth=\"9\" markerHeight=\"9\" refX=\"1\" refY=\"4.5\" orient=\"auto\"><path d=\"M9 0 L0 4.5 L9 9 z\" fill=\"var(--acc)\"/></marker></defs><rect x=\"182.8\" y=\"8\" width=\"274.5\" height=\"30\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"320\" y=\"27\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">Procedimiento negociado sin publicidad</text><rect x=\"12\" y=\"50\" width=\"616\" height=\"86\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><rect x=\"24\" y=\"77\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--exc)\"/><text x=\"99\" y=\"97\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--exc)\">Supuestos tasados</text><text x=\"186\" y=\"68.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Licitación desierta o inadecuada, sin cambiar condiciones ni subir PBL (a.1.º)</text><text x=\"186\" y=\"82.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Un solo empresario posible (a.2.º) · contrato secreto o reservado (a.3.º)</text><text x=\"186\" y=\"96.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Imperiosa urgencia imprevisible (b.1.º) · solo ofertas irregulares (b.2.º)</text><text x=\"186\" y=\"110.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Suministros: I+D, entregas adicionales, materias primas, liquidaciones (c)</text><text x=\"186\" y=\"124.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Ganador de un concurso de proyectos (d) · repetir obras o servicios ≤ 3 años (e)</text><text x=\"616\" y=\"70\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">art. 168</text><rect x=\"12\" y=\"158\" width=\"616\" height=\"52\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"24\" y=\"168\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"99\" y=\"188\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">Sin anuncio</text><text x=\"186\" y=\"187.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Invitación directa · art. 169 en lo que proceda según los participantes</text><text x=\"616\" y=\"178\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">art. 170.1</text><rect x=\"12\" y=\"232\" width=\"616\" height=\"58\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"24\" y=\"245\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"99\" y=\"265\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--warn)\">Negociación</text><text x=\"186\" y=\"250.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Si solo hay un candidato, se negocia con él siempre que sea posible</text><text x=\"186\" y=\"264.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Mesa potestativa, salvo imperiosa urgencia (168.b.1.º): entonces</text><text x=\"186\" y=\"278.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">obligatoria</text><text x=\"616\" y=\"252\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">arts. 170.2 y 326.1</text><rect x=\"12\" y=\"312\" width=\"616\" height=\"52\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><rect x=\"24\" y=\"322\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--ej)\"/><text x=\"99\" y=\"342\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">Adjudicación</text><text x=\"186\" y=\"341.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Requerimiento, adjudicación y formalización por el tramo común</text><text x=\"616\" y=\"332\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">arts. 150-154</text><rect x=\"12\" y=\"376\" width=\"616\" height=\"31\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"320\" y=\"395\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">No hay negociado sin publicidad por cuantía: solo por los supuestos del art. 168</text><path d=\"M320 137 L 320 156\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#kofo7p)\"/><path d=\"M320 211 L 320 230\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#kofo7p)\"/><path d=\"M320 291 L 320 310\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#kofo7p)\"/></svg><div class=\"box warn\"><span class=\"lbl\">Trampas de examen</span><ul><li>En la licitación desierta no puede <b>subirse el PBL</b> ni cambiarse el sistema de retribución.</li><li>Imperiosa urgencia (168.b.1.º) ≠ tramitación urgente (art. 119): la primera exige hechos imprevisibles que la urgencia ordinaria no basta para atender.</li><li>Repetición de obras o servicios: tiene que estar anunciada en el contrato inicial, incluida en su valor estimado y dentro de 3 años.</li></ul></div><details class=\"panel\"><summary>Art. 168 LCSP</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LCSP</span><p>«No se haya presentado ninguna oferta; ninguna oferta adecuada; ninguna solicitud de participación; o ninguna solicitud de participación adecuada en respuesta a un procedimiento abierto o a un procedimiento restringido, siempre que las condiciones iniciales del contrato no se modifiquen sustancialmente, sin que en ningún caso se pueda incrementar el presupuesto base de licitación ni modificar el sistema de retribución»</p><p>«Una imperiosa urgencia resultante de acontecimientos imprevisibles para el órgano de contratación y no imputables al mismo, demande una pronta ejecución del contrato que no pueda lograrse mediante la aplicación de la tramitación de urgencia regulada en el artículo 119.»</p><p>«y que no hayan transcurrido más de tres años a partir de la celebración del contrato inicial.»</p></div></div></details><details class=\"panel\"><summary>Arts. 170 y 326.1 LCSP</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LCSP</span><p>«lo tramitarán con arreglo a las normas que establece el artículo 169, en todo lo que resulten de aplicación según el número de participantes que concurran en cada caso, a excepción de lo relativo a la publicidad previa.»</p><p>«Cuando únicamente participe un candidato, la mesa de contratación, o en su defecto, el órgano de contratación, siempre y cuando sea posible, deberá negociar con él»</p><p>«En los procedimientos negociados en que no sea necesario publicar anuncios de licitación, la constitución de la mesa será potestativa para el órgano de contratación, salvo cuando se fundamente en la existencia de una imperiosa urgencia prevista en la letra b) 1.º del artículo 168, en el que será obligatoria la constitución de la mesa.»</p></div></div></details></section><section class=\"card art\" id=\"dialogo\"><h2>Diálogo competitivo</h2><p class=\"ubic\">Arts. 172 a 176 y 327 LCSP</p><div class=\"idea\">El órgano sabe qué necesita pero no cómo: dialoga con los candidatos hasta dar con la solución y luego pide ofertas.</div><svg viewBox=\"0 0 640 529\" role=\"img\" aria-label=\"Diálogo competitivo\" style=\"width:100%;height:auto\"><defs><marker id=\"kd1tg9\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\"><path d=\"M0 0 L9 4.5 L0 9 z\" fill=\"var(--acc)\"/></marker><marker id=\"kd1tg9s\" markerWidth=\"9\" markerHeight=\"9\" refX=\"1\" refY=\"4.5\" orient=\"auto\"><path d=\"M9 0 L0 4.5 L9 9 z\" fill=\"var(--acc)\"/></marker></defs><rect x=\"241.5\" y=\"8\" width=\"157\" height=\"30\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"320\" y=\"27\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">Diálogo competitivo</text><rect x=\"12\" y=\"50\" width=\"616\" height=\"52\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"24\" y=\"60\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"99\" y=\"80\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">Supuestos</text><text x=\"186\" y=\"79.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Los mismos que la licitación con negociación (art. 167) · anuncio obligatorio</text><text x=\"616\" y=\"70\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">art. 172.3</text><rect x=\"12\" y=\"124\" width=\"616\" height=\"52\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"24\" y=\"134\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"99\" y=\"154\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">Anuncio</text><text x=\"186\" y=\"146.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Necesidades, requisitos y criterios en el anuncio o en el documento descriptivo,</text><text x=\"186\" y=\"160.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">que no puede modificarse después · plazo de ejecución aproximado</text><text x=\"616\" y=\"144\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">art. 174.1</text><rect x=\"12\" y=\"198\" width=\"616\" height=\"52\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"24\" y=\"208\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"99\" y=\"228\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">Solicitudes</text><text x=\"186\" y=\"220.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Art. 161: SARA ≥ 30 días desde el envío · no SARA ≥ 15 días</text><text x=\"186\" y=\"234.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">SARA: sin reducción por urgencia</text><text x=\"616\" y=\"218\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">arts. 174.2 y 119.2.b.4.º</text><rect x=\"12\" y=\"272\" width=\"616\" height=\"52\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"24\" y=\"282\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"99\" y=\"302\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--warn)\">Selección</text><text x=\"186\" y=\"301.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Si se limita: mínimo 3 candidatos capacitados · la invitación fija el inicio</text><text x=\"616\" y=\"292\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">art. 174.2-3</text><rect x=\"12\" y=\"346\" width=\"616\" height=\"58\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"24\" y=\"359\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"99\" y=\"379\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--warn)\">Diálogo</text><text x=\"186\" y=\"364.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Mesa especial (≥ 1/3 de expertos con voz y voto) · se puede debatir todo</text><text x=\"186\" y=\"378.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Fases · igualdad y confidencialidad · descartado que lo pida: informe en</text><text x=\"186\" y=\"392.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">15 días</text><text x=\"616\" y=\"366\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">arts. 175 y 327</text><rect x=\"12\" y=\"426\" width=\"616\" height=\"52\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><rect x=\"24\" y=\"436\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--ej)\"/><text x=\"99\" y=\"456\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">Ofertas finales</text><text x=\"186\" y=\"448.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Cierre del diálogo → ofertas definitivas → aclaraciones sin cambios sustanciales</text><text x=\"186\" y=\"462.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Mejor relación calidad-precio · con el mejor solo se negocia para confirmar</text><text x=\"616\" y=\"446\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">art. 176</text><rect x=\"12\" y=\"490\" width=\"616\" height=\"31\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"320\" y=\"509\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">Primas o compensaciones posibles para todos o para los primeros clasificados (art. 173)</text><path d=\"M320 103 L 320 122\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#kd1tg9)\"/><path d=\"M320 177 L 320 196\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#kd1tg9)\"/><path d=\"M320 251 L 320 270\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#kd1tg9)\"/><path d=\"M320 325 L 320 344\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#kd1tg9)\"/><path d=\"M320 405 L 320 424\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#kd1tg9)\"/></svg><div class=\"box warn\"><span class=\"lbl\">Trampas de examen</span><ul><li>Lo dirige una <b><span class=\"t\" data-g=\"mesaesp\">mesa especial</span></b>: al menos un tercio de sus miembros son personas especialmente cualificadas (art. 327).</li><li>El <span class=\"t\" data-g=\"docdesc\">documento descriptivo</span> <b>no puede modificarse</b> después.</li><li>Tras elegir la mejor oferta solo se negocia para <b>confirmar</b> compromisos, sin tocar elementos sustanciales.</li></ul></div><details class=\"panel\"><summary>Arts. 172-176 LCSP</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LCSP</span><p>«En el diálogo competitivo, la mesa especial de diálogo competitivo dirige un diálogo con los candidatos seleccionados, previa solicitud de los mismos, a fin de desarrollar una o varias soluciones susceptibles de satisfacer sus necesidades y que servirán de base para que los candidatos elegidos presenten una oferta.»</p><p>«El procedimiento de diálogo competitivo podrá utilizarse en los casos enumerados en el artículo 167 y deberá verse precedido de la publicación de un anuncio de licitación.»</p><p>«Los órganos de contratación darán a conocer sus necesidades y requisitos en el anuncio de licitación y los definirán en dicho anuncio o en un documento descriptivo, que no podrá ser modificado posteriormente.»</p><p>«el órgano de contratación en todo caso deberá asegurase de que el número mínimo de candidatos capacitados para ejecutar el objeto del contrato será de tres.»</p><p>«La mesa evaluará las ofertas presentadas por los licitadores en función de los criterios de adjudicación establecidos en el anuncio de licitación o en el documento descriptivo y seleccionará la oferta que presente la mejor relación calidad precio»</p></div></div></details><details class=\"panel\"><summary>Art. 327 LCSP</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LCSP</span><p>«El número de estas personas será igual o superior a un tercio de los componentes de la Mesa y participarán en las deliberaciones con voz y voto.»</p></div></div></details><details class=\"panel\"><summary>Art. 119.2.b.4.º LCSP</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LCSP</span><p>«Los plazos de presentación de solicitudes en los procedimientos de diálogo competitivo y de asociación para la innovación en contratos de obras, suministros y servicios sujetos a regulación armonizada, no serán susceptibles de reducirse.»</p></div></div></details></section><section class=\"card art\" id=\"innov\"><h2>Asociación para la innovación</h2><p class=\"ubic\">Arts. 177 a 182 y 327 LCSP</p><div class=\"idea\">Se contrata investigar algo que aún no existe y, si sale bien, comprarlo después.</div><svg viewBox=\"0 0 640 523\" role=\"img\" aria-label=\"Asociación para la innovación\" style=\"width:100%;height:auto\"><defs><marker id=\"k48bbs\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\"><path d=\"M0 0 L9 4.5 L0 9 z\" fill=\"var(--acc)\"/></marker><marker id=\"k48bbss\" markerWidth=\"9\" markerHeight=\"9\" refX=\"1\" refY=\"4.5\" orient=\"auto\"><path d=\"M9 0 L0 4.5 L9 9 z\" fill=\"var(--acc)\"/></marker></defs><rect x=\"212.5\" y=\"8\" width=\"214.9\" height=\"30\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"320\" y=\"27\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">Asociación para la innovación</text><rect x=\"12\" y=\"50\" width=\"616\" height=\"52\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"24\" y=\"60\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"99\" y=\"80\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">Finalidad</text><text x=\"186\" y=\"72.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Desarrollar productos, servicios u obras innovadores y comprarlos después</text><text x=\"186\" y=\"86.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">La necesidad no puede cubrirse con lo que ya ofrece el mercado</text><text x=\"616\" y=\"70\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">art. 177.1</text><rect x=\"12\" y=\"124\" width=\"616\" height=\"52\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"24\" y=\"134\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"99\" y=\"154\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">Solicitudes</text><text x=\"186\" y=\"146.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">SARA: ≥ 30 días desde el envío del anuncio</text><text x=\"186\" y=\"160.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">No SARA: ≥ 20 días desde la publicación en el perfil</text><text x=\"616\" y=\"144\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">art. 178.2</text><rect x=\"12\" y=\"198\" width=\"616\" height=\"52\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"24\" y=\"208\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"99\" y=\"228\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--warn)\">Selección</text><text x=\"186\" y=\"227.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Solvencia en I+D e innovación · si se limita: mínimo 3 invitados</text><text x=\"616\" y=\"218\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">art. 178.3</text><rect x=\"12\" y=\"272\" width=\"616\" height=\"52\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"24\" y=\"282\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"99\" y=\"302\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--warn)\">Negociación</text><text x=\"186\" y=\"294.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Proyectos de I+D · se negocian ofertas iniciales y ulteriores, no la definitiva</text><text x=\"186\" y=\"308.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Nunca requisitos mínimos ni criterios · solo mejor relación calidad-precio</text><text x=\"616\" y=\"292\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">art. 179</text><rect x=\"12\" y=\"346\" width=\"616\" height=\"52\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"24\" y=\"356\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"99\" y=\"376\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">Fases de I+D</text><text x=\"186\" y=\"368.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Objetivos intermedios y pago por plazos · al final de cada fase puede resolverse</text><text x=\"186\" y=\"382.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">o reducir socios, sin indemnización (salvo el pago de lo trabajado)</text><text x=\"616\" y=\"366\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">art. 180</text><rect x=\"12\" y=\"420\" width=\"616\" height=\"52\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><rect x=\"24\" y=\"430\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--ej)\"/><text x=\"99\" y=\"450\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">Adquisición</text><text x=\"186\" y=\"442.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Si se alcanzan el rendimiento y los costes acordados</text><text x=\"186\" y=\"456.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Prestaciones sucesivas: como máximo 4 años desde la resolución de adquisición</text><text x=\"616\" y=\"440\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">art. 181</text><rect x=\"12\" y=\"484\" width=\"616\" height=\"31\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"320\" y=\"503\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">Asiste una mesa especial, como en el diálogo competitivo (art. 327)</text><path d=\"M320 103 L 320 122\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#k48bbs)\"/><path d=\"M320 177 L 320 196\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#k48bbs)\"/><path d=\"M320 251 L 320 270\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#k48bbs)\"/><path d=\"M320 325 L 320 344\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#k48bbs)\"/><path d=\"M320 399 L 320 418\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#k48bbs)\"/></svg><div class=\"box warn\"><span class=\"lbl\">Trampas de examen</span><ul><li>Es el único procedimiento con <b>20 días</b> de solicitudes en el no armonizado.</li><li>Solo se adjudica por <b>mejor relación calidad-precio</b> (art. 179.2), nunca solo por precio.</li><li>Resolver la asociación o reducir socios <b>no da derecho a indemnización</b>, si el pliego lo previó.</li></ul></div><details class=\"panel\"><summary>Arts. 177-181 LCSP</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LCSP</span><p>«La asociación para la innovación es un procedimiento que tiene como finalidad el desarrollo de productos, servicios u obras innovadores y la compra ulterior de los suministros, servicios u obras resultantes»</p><p>«El plazo mínimo para la recepción de las solicitudes de participación será de treinta días a partir de la fecha de envío del anuncio de licitación, cuando el contrato esté sujeto a regulación armonizada. En otro caso, dicho plazo no podrá ser inferior a veinte días contados desde la publicación del anuncio de licitación en el perfil de contratante.»</p><p>«siendo tres el número mínimo de empresarios a los que se invitará a negociar.»</p><p>«Los contratos se adjudicarán únicamente con arreglo al criterio de la mejor relación calidad-precio, según lo dispuesto en el artículo 145.2.»</p><p>«En ningún caso, la resolución de la asociación para la innovación o la reducción del número de candidatos participantes dará lugar a indemnización»</p><p>«aquella solo se podrá llevar a cabo durante un periodo máximo de cuatro años a partir de la recepción de la resolución sobre la adquisición de las obras, servicios o suministros»</p></div></div></details></section><section class=\"card art\" id=\"concurso\"><h2>Concurso de proyectos</h2><p class=\"ubic\">Arts. 183 a 187 LCSP</p><div class=\"idea\">Un jurado independiente elige, a ciegas, el mejor proyecto de arquitectura, urbanismo o ingeniería.</div><svg viewBox=\"0 0 640 461\" role=\"img\" aria-label=\"Concurso de proyectos\" style=\"width:100%;height:auto\"><defs><marker id=\"kd5f6k\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\"><path d=\"M0 0 L9 4.5 L0 9 z\" fill=\"var(--acc)\"/></marker><marker id=\"kd5f6ks\" markerWidth=\"9\" markerHeight=\"9\" refX=\"1\" refY=\"4.5\" orient=\"auto\"><path d=\"M9 0 L0 4.5 L9 9 z\" fill=\"var(--acc)\"/></marker></defs><rect x=\"231.8\" y=\"8\" width=\"176.5\" height=\"30\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"320\" y=\"27\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">Concurso de proyectos</text><rect x=\"12\" y=\"50\" width=\"616\" height=\"52\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"24\" y=\"60\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"99\" y=\"80\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">Objeto</text><text x=\"186\" y=\"72.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Proyectos de arquitectura, urbanismo, ingeniería o datos que elige un jurado</text><text x=\"186\" y=\"86.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Dos tipos: dentro de un contrato de servicios, o con premios o pagos</text><text x=\"616\" y=\"70\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">art. 183.1-2</text><rect x=\"12\" y=\"124\" width=\"616\" height=\"52\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"24\" y=\"134\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"99\" y=\"154\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">Anuncio y bases</text><text x=\"186\" y=\"146.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Publicidad del art. 135 · las bases fijan premios o compensaciones</text><text x=\"186\" y=\"160.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Si luego se adjudicará por negociado sin publicidad, lo dice el anuncio</text><text x=\"616\" y=\"144\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">arts. 184 y 186</text><rect x=\"12\" y=\"198\" width=\"616\" height=\"52\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"24\" y=\"208\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"99\" y=\"228\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--warn)\">Participantes</text><text x=\"186\" y=\"220.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Sin límite, o limitados: 1.ª fase de selección con criterios objetivos;</text><text x=\"186\" y=\"234.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">2.ª fase con invitación simultánea y por escrito · mínimo 3 candidatos</text><text x=\"616\" y=\"218\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">art. 185</text><rect x=\"12\" y=\"272\" width=\"616\" height=\"58\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"24\" y=\"285\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"99\" y=\"305\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--warn)\">Jurado</text><text x=\"186\" y=\"290.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Sin mesa · personas independientes · 2/3 con la cualificación, si se</text><text x=\"186\" y=\"304.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">exige una Proyectos anónimos hasta el dictamen · se valora la calidad</text><text x=\"186\" y=\"318.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">de las propuestas</text><text x=\"616\" y=\"292\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">arts. 184.3 y 187</text><rect x=\"12\" y=\"352\" width=\"616\" height=\"58\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><rect x=\"24\" y=\"365\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--ej)\"/><text x=\"99\" y=\"385\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">Decisión</text><text x=\"186\" y=\"370.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Informe del jurado con la clasificación → el órgano adjudica al indicado</text><text x=\"186\" y=\"384.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Premios: plazos del art. 198 desde la notificación · resultados por el</text><text x=\"186\" y=\"398.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">art. 154</text><text x=\"616\" y=\"372\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">arts. 186.3 y 187</text><rect x=\"12\" y=\"422\" width=\"616\" height=\"31\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"320\" y=\"441\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">Supletorio: restringido si se limitan participantes; abierto en otro caso (art. 187.10)</text><path d=\"M320 103 L 320 122\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#kd5f6k)\"/><path d=\"M320 177 L 320 196\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#kd5f6k)\"/><path d=\"M320 251 L 320 270\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#kd5f6k)\"/><path d=\"M320 331 L 320 350\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#kd5f6k)\"/></svg><div class=\"box warn\"><span class=\"lbl\">Trampas de examen</span><ul><li>En el concurso de proyectos <b>no interviene la mesa</b>: decide un jurado.</li><li>Anonimato: no basta quitar el nombre; no puede haber ningún indicio de la autoría.</li><li>Si el jurado está cualificado, lo exigido es <b>al menos dos tercios</b>, no todos.</li></ul></div><details class=\"panel\"><summary>Arts. 183-187 LCSP</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LCSP</span><p>«Son concursos de proyectos los procedimientos encaminados a la obtención de planos o proyectos, principalmente en los campos de la arquitectura, el urbanismo, la ingeniería y el procesamiento de datos, a través de una selección que, tras la correspondiente licitación, se encomienda a un jurado.»</p><p>«El número mínimo de candidatos será de tres.»</p><p>«En los concursos de proyectos no habrá intervención de la mesa de contratación.»</p><p>«Cuando se exija una cualificación profesional específica para participar en un concurso de proyectos, al menos dos tercios de los miembros del jurado deberán poseer dicha cualificación u otra equivalente.»</p><p>«Una vez que el jurado hubiere adoptado una decisión, dará traslado de la misma al órgano de contratación para que este proceda a la adjudicación del concurso de proyectos al participante indicado por el primero.»</p><p>«En lo no previsto por esta Subsección el concurso de los proyectos se regirá por las normas del procedimiento restringido en caso de que se limite el número de participantes, y en caso contrario del procedimiento abierto»</p></div></div></details></section><section class=\"card art\" id=\"urgente\"><h2>Tramitación urgente del expediente</h2><p class=\"ubic\">Art. 119 LCSP</p><div class=\"idea\">El mismo procedimiento, con preferencia y plazos a la mitad, salvo las excepciones de la lista.</div><svg viewBox=\"0 0 640 395\" role=\"img\" aria-label=\"Tramitación urgente (art. 119)\" style=\"width:100%;height:auto\"><defs><marker id=\"khx6vt\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\"><path d=\"M0 0 L9 4.5 L0 9 z\" fill=\"var(--acc)\"/></marker><marker id=\"khx6vts\" markerWidth=\"9\" markerHeight=\"9\" refX=\"1\" refY=\"4.5\" orient=\"auto\"><path d=\"M9 0 L0 4.5 L9 9 z\" fill=\"var(--acc)\"/></marker></defs><rect x=\"214.2\" y=\"8\" width=\"211.7\" height=\"30\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"320\" y=\"27\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">Tramitación urgente (art. 119)</text><rect x=\"12\" y=\"50\" width=\"616\" height=\"52\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"24\" y=\"60\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"99\" y=\"80\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">Declaración</text><text x=\"186\" y=\"79.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Necesidad inaplazable o interés público · declaración motivada del órgano</text><text x=\"616\" y=\"70\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">art. 119.1</text><rect x=\"12\" y=\"124\" width=\"616\" height=\"52\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"24\" y=\"134\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"99\" y=\"154\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--warn)\">Expediente</text><text x=\"186\" y=\"153.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Preferencia · informes y trámites en 5 días (hasta 10 si se justifica)</text><text x=\"616\" y=\"144\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">art. 119.2.a</text><rect x=\"12\" y=\"198\" width=\"616\" height=\"72\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"24\" y=\"218\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"99\" y=\"238\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--warn)\">Licitación</text><text x=\"186\" y=\"216.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Plazos de licitación, adjudicación y formalización a la mitad, salvo:</text><text x=\"186\" y=\"230.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">· la espera de 15 días hábiles antes de formalizar (art. 153.3)</text><text x=\"186\" y=\"244.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">· abierto, restringido y con negociación SARA: sus propias reducciones</text><text x=\"186\" y=\"258.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">· solicitudes de diálogo e innovación SARA, y el simplificado: no se reducen</text><text x=\"616\" y=\"218\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">art. 119.2.b</text><rect x=\"12\" y=\"292\" width=\"616\" height=\"52\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><rect x=\"24\" y=\"302\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--ej)\"/><text x=\"99\" y=\"322\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">Ejecución</text><text x=\"186\" y=\"321.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Inicio en ≤ 1 mes desde la formalización</text><text x=\"616\" y=\"312\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">art. 119.2.c</text><rect x=\"12\" y=\"356\" width=\"616\" height=\"31\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"320\" y=\"375\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">Mismo procedimiento que el ordinario: cambia la tramitación, no el procedimiento</text><path d=\"M320 103 L 320 122\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#khx6vt)\"/><path d=\"M320 177 L 320 196\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#khx6vt)\"/><path d=\"M320 271 L 320 290\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#khx6vt)\"/></svg><div class=\"box warn\"><span class=\"lbl\">Trampas de examen</span><ul><li>Lo que <b>nunca</b> se reduce: los 15 días hábiles de espera antes de formalizar.</li><li>El simplificado no reduce sus plazos por urgencia (arts. 159.5 y 119.2.b.6.º).</li><li>Informes: <b>5 días</b>, prorrogables <b>hasta 10</b>.</li></ul></div><details class=\"panel\"><summary>Art. 119 LCSP</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LCSP</span><p>«Podrán ser objeto de tramitación urgente los expedientes correspondientes a los contratos cuya celebración responda a una necesidad inaplazable o cuya adjudicación sea preciso acelerar por razones de interés público.»</p><p>«que dispondrán de un plazo de cinco días para emitir los respectivos informes o cumplimentar los trámites correspondientes.»</p><p>«En tal caso el plazo quedará prorrogado hasta diez días.»</p><p>«los plazos establecidos en esta Ley para la licitación, adjudicación y formalización del contrato se reducirán a la mitad, salvo los siguientes:»</p><p>«El plazo de quince días hábiles establecido en el apartado 3 del artículo 153, como período de espera antes de la formalización del contrato.»</p><p>«El plazo de inicio de la ejecución del contrato no podrá exceder de un mes, contado desde la formalización.»</p></div></div></details></section><section class=\"card art\" id=\"emerg\"><h2>Tramitación de emergencia</h2><p class=\"ubic\">Art. 120 LCSP</p><div class=\"idea\">Ante una catástrofe se actúa ya: sin expediente ni requisitos formales, y se regulariza después.</div><svg viewBox=\"0 0 640 381\" role=\"img\" aria-label=\"Tramitación de emergencia (art. 120)\" style=\"width:100%;height:auto\"><defs><marker id=\"kf18re\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\"><path d=\"M0 0 L9 4.5 L0 9 z\" fill=\"var(--acc)\"/></marker><marker id=\"kf18res\" markerWidth=\"9\" markerHeight=\"9\" refX=\"1\" refY=\"4.5\" orient=\"auto\"><path d=\"M9 0 L0 4.5 L9 9 z\" fill=\"var(--acc)\"/></marker></defs><rect x=\"192.2\" y=\"8\" width=\"255.6\" height=\"30\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"320\" y=\"27\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">Tramitación de emergencia (art. 120)</text><rect x=\"12\" y=\"50\" width=\"616\" height=\"52\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><rect x=\"24\" y=\"60\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--exc)\"/><text x=\"99\" y=\"80\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--exc)\">Causa</text><text x=\"186\" y=\"72.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Acontecimientos catastróficos, grave peligro o necesidades de defensa</text><text x=\"186\" y=\"86.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">nacional</text><text x=\"616\" y=\"70\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">art. 120.1</text><rect x=\"12\" y=\"124\" width=\"616\" height=\"52\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><rect x=\"24\" y=\"134\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--exc)\"/><text x=\"99\" y=\"154\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--exc)\">Orden</text><text x=\"186\" y=\"146.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Sin expediente: se ordena ejecutar o se contrata libremente, sin requisitos</text><text x=\"186\" y=\"160.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">formales, incluso sin crédito suficiente (se dota después)</text><text x=\"616\" y=\"144\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">art. 120.1.a</text><rect x=\"12\" y=\"198\" width=\"616\" height=\"58\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"24\" y=\"211\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"99\" y=\"231\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--warn)\">Inicio</text><text x=\"186\" y=\"216.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Ejecución en ≤ 1 mes desde el acuerdo; si se excede, procedimiento</text><text x=\"186\" y=\"230.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">ordinario</text><text x=\"186\" y=\"244.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">AGE: se da cuenta al Consejo de Min

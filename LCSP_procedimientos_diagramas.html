<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LCSP · Procedimientos de contratación en diagramas</title>
<style>

/* ═══════════════════════════════════════════════════════════════
   SISTEMA DE DISEÑO · "Académico Gamificado" · Bloque II
   Temas 8, 9 y 10 · Auxiliar Administrativo
   ═══════════════════════════════════════════════════════════════ */
:root{
  --z:1;              /* A+ / A− · solo agranda el cuerpo de la página */

  --bg:#faf9f7;
  --bg-grad:radial-gradient(1100px 560px at 12% -8%, #ede9ff 0%, transparent 55%),
            radial-gradient(850px 460px at 96% 0%, #dcf5ee 0%, transparent 50%);
  --surface:#ffffff;
  --surface-2:#f4f3f0;
  --surface-3:#eceae5;
  --line:#e6e3dc;
  --line-strong:#d4d0c7;

  --ink:#15161c;
  --ink-2:#5d616e;
  --ink-3:#8b8f9c;

  --brand:#5b3df5;
  --brand-2:#7c5cff;
  --brand-soft:#efeaff;
  --brand-ring:rgba(91,61,245,.18);

  --legal:#4338ca;  --legal-bg:#eeecff;
  --ej:#059669;     --ej-bg:#e4f7f0;
  --warn:#c2690a;   --warn-bg:#fdf1de;
  --exc:#dc2626;    --exc-bg:#ffeceb;

  --ok:#16a34a; --ok-soft:#e7f7ec;
  --mid:#eab308; --mid-soft:#fdf6dd;
  --off:#a1a1aa; --off-soft:#f1f1f3;

  --sh-1:0 1px 2px rgba(20,20,30,.04), 0 2px 8px rgba(20,20,30,.04);
  --sh-2:0 2px 6px rgba(20,20,30,.05), 0 12px 28px rgba(20,20,30,.07);
  --sh-3:0 8px 20px rgba(91,61,245,.13), 0 24px 56px rgba(20,20,30,.10);
  --sh-glow:0 0 0 4px var(--brand-ring);

  --r-sm:9px; --r-md:14px; --r-lg:20px; --r-full:999px;

  --f-display:"Segoe UI Variable Display",system-ui,-apple-system,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-legal:ui-serif,Georgia,Cambria,"Times New Roman",serif;
  --f-mono:ui-monospace,"SF Mono","Cascadia Mono","Segoe UI Mono",Menlo,monospace;

  --t-h1:clamp(1.02rem,.95rem + .3vw,1.2rem);
  --t-h2:clamp(1.2rem,1.05rem + .6vw,1.55rem);
  --t-h3:clamp(1rem,.95rem + .25vw,1.12rem);
  --t-sm:.86rem;
  --t-xs:.75rem;

  --e-out:cubic-bezier(.22,1,.36,1);
  --e-spring:cubic-bezier(.34,1.56,.64,1);

  /* ── Compatibilidad con SVG y contenido generado ── */
  --panel:var(--surface);
  --ink2:var(--ink-2);
  --acc:var(--brand);
  --acc-soft:var(--brand-soft);
  --g:var(--ok); --y:var(--mid); --r:var(--exc);
}

html[data-theme="dark"]{
  --bg:#0a0b0f;
  --bg-grad:radial-gradient(1100px 560px at 12% -8%, #1c1740 0%, transparent 55%),
            radial-gradient(850px 460px at 96% 0%, #08302b 0%, transparent 50%);
  --surface:#13151b;
  --surface-2:#1a1d25;
  --surface-3:#232733;
  --line:#262a34;
  --line-strong:#343947;

  --ink:#eceef4;
  --ink-2:#9ba2b3;
  --ink-3:#6e7585;

  --brand:#8b6dff;
  --brand-2:#a78bff;
  --brand-soft:#1e1a3d;
  --brand-ring:rgba(139,109,255,.22);

  --legal:#a5b4fc; --legal-bg:#191b3a;
  --ej:#34d399;    --ej-bg:#0c2a24;
  --warn:#fbbf24;  --warn-bg:#2e2110;
  --exc:#fb7185;   --exc-bg:#331119;

  --ok:#4ade80; --ok-soft:#0e2a19;
  --mid:#facc15; --mid-soft:#2c2610;
  --off:#5b6070; --off-soft:#1c1f27;

  --sh-1:0 1px 2px rgba(0,0,0,.3), 0 2px 8px rgba(0,0,0,.25);
  --sh-2:0 2px 6px rgba(0,0,0,.35), 0 12px 28px rgba(0,0,0,.4);
  --sh-3:0 8px 20px rgba(139,109,255,.2), 0 24px 56px rgba(0,0,0,.5);
}

*,*::before,*::after{box-sizing:border-box}
html{font-size:16px;scroll-behavior:smooth}
/* A+ y A− agrandan o reducen únicamente el cuerpo: el texto de los
   artículos, las tablas y los diagramas. La cabecera, el índice lateral
   y los botones conservan su tamaño para no descolocar la pantalla. */
main{zoom:var(--z)}
@media print{main{zoom:1}}
body{
  margin:0;background:var(--bg);background-image:var(--bg-grad);
  background-attachment:fixed;background-repeat:no-repeat;
  color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.68;
  -webkit-font-smoothing:antialiased;
  transition:background-color .5s var(--e-out),color .3s;
}
::selection{background:var(--brand);color:#fff}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{font-family:var(--f-display);letter-spacing:-.022em;line-height:1.2}
.num{font-variant-numeric:tabular-nums}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:99px;border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3)}

/* ═══ HEADER ═══ */
header.top{
  position:sticky;top:0;z-index:60;
  background:color-mix(in srgb,var(--surface) 80%,transparent);
  backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);
  border-bottom:1px solid var(--line);
}
/* El título ocupa su propia línea, encima de los botones. Antes competía
   por el ancho con la barra de herramientas y acababa desmigado en una
   columna de una palabra por línea. */
.top-in{max-width:1280px;margin:0 auto;padding:.6rem 1.1rem .55rem;display:flex;flex-direction:column;gap:.5rem;align-items:stretch}
.brandwrap{display:flex;align-items:center;gap:.65rem;min-width:0;width:100%}
.mark{
  width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;
  font-weight:800;font-size:.8rem;letter-spacing:-.02em;text-decoration:none;
  box-shadow:0 4px 14px var(--brand-ring);
  transition:transform .3s var(--e-spring),box-shadow .3s;
}
.mark:hover{transform:rotate(-8deg) scale(1.08);box-shadow:var(--sh-3);text-decoration:none}
.top h1{font-size:var(--t-h1);margin:0;font-weight:800;line-height:1.25;min-width:0;flex:1 1 auto}
/* como mucho dos líneas: si no cabe, se recorta con puntos suspensivos */
.top h1 .tit{
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;text-wrap:balance;
}
.top h1 .sub{display:block;font-size:var(--t-xs);color:var(--ink-2);font-weight:500;letter-spacing:0;
  margin-top:.1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tools{margin-left:0;display:flex;gap:.4rem;flex-wrap:wrap;align-items:center;width:100%}

button,select,input[type=search]{
  font:inherit;font-size:var(--t-sm);font-weight:600;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:var(--r-sm);padding:.4rem .72rem;cursor:pointer;
  position:relative;overflow:hidden;
  transition:transform .18s var(--e-spring),border-color .2s,background .2s,box-shadow .2s,color .2s;
}
button:hover{transform:translateY(-1.5px);border-color:var(--brand);box-shadow:var(--sh-1)}
button:active{transform:translateY(0) scale(.97)}
button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible{outline:none;box-shadow:var(--sh-glow)}
input[type=search]{min-width:190px;cursor:text;font-weight:500}
input[type=search]:focus{border-color:var(--brand)}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--surface-2);padding:2px;gap:2px}
.seg button{border:0;border-radius:calc(var(--r-sm) - 2px);padding:.32rem .68rem;background:transparent;box-shadow:none}
.seg button:hover{transform:none;background:var(--surface)}
.seg button[aria-pressed="true"]{background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;box-shadow:0 2px 8px var(--brand-ring)}

.ripple{position:absolute;border-radius:50%;transform:scale(0);background:currentColor;opacity:.25;animation:rip .55s linear;pointer-events:none}
@keyframes rip{to{transform:scale(3.4);opacity:0}}

.progress{position:absolute;left:0;bottom:-1px;height:2.5px;width:0;
  background:linear-gradient(90deg,var(--brand),var(--legal),var(--ej));transition:width .1s linear}

/* ═══ LAYOUT ═══ */
.layout{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:270px 1fr;gap:1.8rem;padding:1.4rem 1.1rem 5rem}
main{min-width:0}

/* ═══ SIDEBAR ═══ */
nav.side{
  position:sticky;top:76px;align-self:start;max-height:calc(100vh - 96px);overflow:auto;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:.85rem;box-shadow:var(--sh-1);
}
nav.side h2{font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);
  margin:.5rem .4rem .5rem;font-weight:800}
nav.side h2:first-child{margin-top:.1rem}
nav.side a{
  display:flex;align-items:baseline;gap:.5rem;padding:.36rem .55rem;border-radius:var(--r-sm);
  text-decoration:none;color:var(--ink-2);font-size:var(--t-sm);font-weight:500;
  position:relative;transition:background .22s,color .22s,transform .22s var(--e-out);
}
nav.side a:hover{background:var(--surface-2);color:var(--ink);transform:translateX(3px);text-decoration:none}
nav.side a.on{background:var(--brand-soft);color:var(--brand);font-weight:700}
nav.side a.on::before{content:"";position:absolute;left:-.85rem;top:20%;bottom:20%;width:3px;
  border-radius:0 3px 3px 0;background:var(--brand)}
nav.side a b{color:var(--ink-3);font-weight:800;font-size:var(--t-xs);font-variant-numeric:tabular-nums;flex:none;min-width:1.9em}
nav.side a.on b{color:var(--brand)}
.navtoggle{display:none}

/* ═══ TARJETAS ═══ */
section.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:1.35rem 1.5rem;margin-bottom:1.1rem;box-shadow:var(--sh-1);
  transition:box-shadow .3s var(--e-out),border-color .3s;
}
section.card:hover{box-shadow:var(--sh-2)}
section.card>h2{
  margin:0 0 1rem;font-size:var(--t-h2);font-weight:800;
  display:flex;align-items:center;gap:.6rem;
}
section.card>h2::before{
  content:"";width:4px;height:1.05em;border-radius:99px;flex:none;
  background:linear-gradient(180deg,var(--brand),var(--brand-2));
}

/* ═══ ARTÍCULO ═══ */
.art{scroll-margin-top:86px;padding-top:.4rem}
.art + .art{margin-top:1.6rem;padding-top:1.6rem;border-top:1px dashed var(--line)}
.art h2{display:flex;flex-wrap:wrap;gap:.5rem;align-items:baseline;font-size:var(--t-h3);
  margin:0 0 .25rem;font-weight:800;letter-spacing:-.015em}
.art h2 .num{
  color:var(--brand);font-weight:800;font-family:var(--f-display);
  background:var(--brand-soft);padding:.1rem .5rem;border-radius:var(--r-sm);
  font-size:.92em;letter-spacing:-.02em;
}
.ubic{font-size:var(--t-xs);color:var(--ink-3);margin:0 0 .8rem;font-weight:600;
  letter-spacing:.03em;text-transform:uppercase}

/* ═══ IDEA CLAVE ═══ */
.idea{
  background:linear-gradient(100deg,var(--brand-soft),color-mix(in srgb,var(--brand-soft) 40%,transparent));
  border-left:4px solid var(--brand);border-radius:0 var(--r-md) var(--r-md) 0;
  padding:.75rem 1rem;font-weight:650;margin:.7rem 0 1rem;position:relative;
  font-size:.97rem;line-height:1.55;
}

/* ═══ ACORDEÓN ═══ */
details.panel{
  border:1px solid var(--line);border-radius:var(--r-md);margin:.6rem 0;
  background:var(--surface);overflow:hidden;
  transition:border-color .25s,box-shadow .25s,background .25s;
}
details.panel:hover{border-color:var(--line-strong)}
details.panel[open]{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-ring)}
details.panel>summary{
  cursor:pointer;padding:.62rem .9rem;font-weight:700;font-size:.93rem;
  list-style:none;display:flex;align-items:center;gap:.55rem;
  transition:background .2s,color .2s;
}
details.panel>summary:hover{background:var(--surface-2)}
details.panel[open]>summary{background:var(--brand-soft);color:var(--brand)}
details.panel>summary::-webkit-details-marker{display:none}
details.panel>summary::before{
  content:"";width:16px;height:16px;flex:none;border-radius:5px;
  background:var(--brand-soft);position:relative;transition:transform .3s var(--e-spring),background .25s;
}
details.panel>summary::after{
  content:"";position:absolute;width:0;height:0;margin-left:5px;
  border:4px solid transparent;border-left-color:var(--brand);
  transition:transform .3s var(--e-spring);
}
details.panel[open]>summary::before{background:var(--surface)}
details.panel[open]>summary::after{transform:rotate(90deg) translateX(-1px)}
details.panel .body{padding:.3rem 1rem 1rem;font-size:.95rem;animation:slidein .35s var(--e-out)}
@keyframes slidein{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* ═══ TEXTO LEGAL ═══ */
.legal{
  background:var(--legal-bg);border-left:4px solid var(--legal);
  border-radius:0 var(--r-md) var(--r-md) 0;padding:.85rem 1.05rem;
  font-family:var(--f-legal);font-size:.95rem;line-height:1.7;
}
.legal p{margin:.45rem 0}
.legal .lbl{
  font-family:var(--f-body);font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;
  color:var(--legal);font-weight:800;display:block;margin-bottom:.4rem;
}

/* ═══ CAJAS SEMÁNTICAS ═══ */
.box{
  border-left:4px solid var(--line);border-radius:0 var(--r-md) var(--r-md) 0;
  padding:.72rem .95rem;margin:.65rem 0;font-size:.94rem;
  transition:transform .25s var(--e-out),box-shadow .25s;
}
.box:hover{transform:translateX(3px);box-shadow:var(--sh-1)}
.box.ej{background:var(--ej-bg);border-color:var(--ej)}
.box.warn{background:var(--warn-bg);border-color:var(--warn)}
.box.exc{background:var(--exc-bg);border-color:var(--exc)}
.box .lbl{font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;font-weight:800;
  display:block;margin-bottom:.3rem}
.box.ej .lbl{color:var(--ej)}
.box.warn .lbl{color:var(--warn)}
.box.exc .lbl{color:var(--exc)}

.interp{
  border:1px dashed var(--warn);background:color-mix(in srgb,var(--warn-bg) 45%,transparent);
  border-radius:var(--r-md);padding:.65rem .9rem;font-size:.9rem;margin:.6rem 0;
}
.interp .lbl{font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;color:var(--warn);font-weight:800;display:block}

/* ═══ TABLAS ═══ */
table{width:100%;border-collapse:separate;border-spacing:0;font-size:.9rem;margin:.7rem 0;
  border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
th,td{padding:.5rem .68rem;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
td + td, th + th{border-left:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th{background:var(--surface-2);font-size:var(--t-xs);font-weight:800;letter-spacing:.05em;
  text-transform:uppercase;color:var(--ink-2);position:sticky;top:0}
tbody tr{transition:background .18s}
tbody tr:nth-child(even){background:color-mix(in srgb,var(--surface-2) 45%,transparent)}
tbody tr:hover{background:var(--brand-soft)}
th.sortable{cursor:pointer;user-select:none;transition:color .2s,background .2s}
th.sortable:hover{color:var(--brand);background:var(--brand-soft)}
th.sortable::after{content:" ⇅";color:var(--ink-3);font-size:.7rem}

ul,ol{margin:.5rem 0 .5rem 1.2rem;padding:0}
li{margin:.26rem 0}
li::marker{color:var(--brand);font-weight:700}

/* ═══ TOOLTIPS ═══ */
.t{border-bottom:1.5px dotted var(--brand);cursor:help;position:relative;
  transition:background .2s,color .2s}
.t:hover{background:var(--brand-soft);color:var(--brand);border-radius:3px}
#tip{
  position:fixed;z-index:99;max-width:330px;background:var(--ink);color:var(--bg);
  padding:.6rem .78rem;border-radius:var(--r-md);font-size:.82rem;line-height:1.5;
  display:none;box-shadow:0 8px 30px rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.08);
}
html[data-theme="dark"] #tip{background:#f0f1f5;color:#15161c}

/* ═══ FLECHAS DE DIAGRAMA ═══
   Un <path> con stroke pero sin fill toma el valor inicial (negro) y el
   navegador cierra el trazo implícitamente: aparece un triángulo relleno
   entre sus extremos. Forzamos fill:none para dejar solo la línea + la
   punta del <marker>, que sí lleva su color. */
svg path[stroke]:not([fill]){fill:none}
svg polyline:not([fill]){fill:none}
svg line{fill:none}

/* ═══ SVG ═══ */
svg{max-width:100%;height:auto;display:block;margin:.9rem auto}
svg text{font-family:var(--f-body)}

/* ═══ BUSCADOR ═══ */
mark.hit{background:linear-gradient(180deg,transparent 55%,#ffe066 55%);color:inherit;
  border-radius:2px;padding:0 1px;font-weight:600}
html[data-theme="dark"] mark.hit{background:linear-gradient(180deg,transparent 55%,#8a6d00 55%);color:#fff}

/* ═══ UTILIDADES ═══ */
.hide{display:none !important}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.small{font-size:var(--t-sm);color:var(--ink-2)}
.chip{
  display:inline-block;font-size:var(--t-xs);padding:.16rem .55rem;border-radius:var(--r-full);
  background:var(--brand-soft);color:var(--brand);font-weight:800;letter-spacing:.02em;
}

/* ═══ HUECOS RELLENABLES ═══ */
.gap{
  display:inline-block;min-width:5.5em;border-bottom:2px solid var(--brand);
  text-align:center;font-weight:700;color:transparent;cursor:pointer;
  transition:color .3s,background .3s;
}
.gap.on,.gap:hover{color:var(--brand);background:var(--brand-soft);border-radius:4px 4px 0 0}

/* ═══ REVELAR SOLUCIÓN ═══ */
.revelar{
  background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;border-color:transparent;
  font-weight:700;
}
.revelar:hover{box-shadow:var(--sh-3)}
.sol{
  margin-top:.7rem;padding:.8rem 1rem;border-radius:var(--r-md);
  background:var(--ej-bg);border-left:4px solid var(--ej);
  animation:slidein .4s var(--e-out);
}

/* ═══ TEST ═══ */
.opt{
  display:block;padding:.55rem .85rem;margin:.35rem 0;border:1.5px solid var(--line);
  border-radius:var(--r-md);cursor:pointer;background:var(--surface);font-size:.94rem;
  transition:border-color .22s,background .22s,transform .22s var(--e-out);
}
.opt:hover{border-color:var(--brand);background:var(--brand-soft);transform:translateX(4px)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft);font-weight:650}
.opt.ko{border-color:var(--exc);background:var(--exc-bg)}
.opt input{margin-right:.5rem;accent-color:var(--brand)}

#tscore,#semres{
  font-family:var(--f-display);font-weight:800;font-size:1.15rem;letter-spacing:-.02em;
}

/* ═══════════════════════════════════════════════════════════════
   FLASHCARDS 3D · mazo con giro, vuelo de salida y sheen
   ═══════════════════════════════════════════════════════════════ */
#flash{--fc-e:cubic-bezier(.2,.8,.25,1);--fc-h:250px}

/* — Escena — */
.fc-stage{
  perspective:1400px;perspective-origin:50% 45%;
  padding:.4rem 0 .2rem;position:relative;
}
.fc-deck{position:relative;height:var(--fc-h);will-change:transform}

/* — Cartas fantasma del mazo — */
.fc-ghost{
  position:absolute;inset:0;border-radius:var(--r-lg);
  background:var(--surface);border:1px solid var(--line);
  transition:transform .5s var(--fc-e),opacity .5s var(--fc-e);
}
.fc-ghost.g1{transform:translateY(9px) scale(.972);opacity:.75}
.fc-ghost.g2{transform:translateY(18px) scale(.944);opacity:.45}
.fc-deck.empty .fc-ghost{opacity:0;transform:translateY(26px) scale(.9)}

/* — Elevación durante el giro — */
.fc-lift{position:absolute;inset:0;transform-style:preserve-3d}
.fc-lift.lift{animation:fcLift .78s var(--fc-e)}
@keyframes fcLift{
  0%,100%{transform:scale(1) translateY(0)}
  45%{transform:scale(1.055) translateY(-16px)}
}
.fc-lift.out-ok{animation:fcOut .5s cubic-bezier(.5,0,.75,0) forwards}
.fc-lift.out-ko{animation:fcOutKo .5s cubic-bezier(.5,0,.75,0) forwards}
.fc-lift.in{animation:fcIn .48s var(--fc-e)}
@keyframes fcOut{
  0%{transform:translateX(0) rotate(0) scale(1);opacity:1}
  100%{transform:translateX(130%) rotate(17deg) scale(.85);opacity:0}
}
@keyframes fcOutKo{
  0%{transform:translateX(0) rotate(0) scale(1);opacity:1}
  100%{transform:translateX(-130%) rotate(-17deg) scale(.85);opacity:0}
}
@keyframes fcIn{
  0%{transform:translateY(26px) scale(.9);opacity:0}
  100%{transform:translateY(0) scale(1);opacity:1}
}

/* — La carta — */
.fc-card{
  position:absolute;inset:0;transform-style:preserve-3d;
  transition:transform .78s var(--fc-e);
  cursor:pointer;border-radius:var(--r-lg);
}
.fc-card:focus-visible{outline:none}
.fc-card:focus-visible .fc-face{box-shadow:var(--sh-glow),var(--sh-2)}

/* — Caras — */
.fc-face{
  position:absolute;inset:0;border-radius:var(--r-lg);
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  padding:2rem 2.2rem;text-align:center;overflow:hidden;
  box-shadow:var(--sh-2);
  transition:box-shadow .4s var(--fc-e);
}
.fc-card:hover .fc-face{box-shadow:var(--sh-3)}

/* Anverso · pregunta */
.fc-front{
  background:
    radial-gradient(120% 90% at 50% -20%, var(--brand-soft) 0%, transparent 60%),
    var(--surface);
  border:1.5px solid var(--line);color:var(--ink);
}
/* Reverso · respuesta */
.fc-back{
  transform:rotateY(180deg);
  background:linear-gradient(145deg,var(--brand) 0%,#6d4bf7 45%,var(--c5,#0891b2) 130%);
  border:1.5px solid transparent;color:#fff;
}
html[data-theme="dark"] .fc-back{
  background:linear-gradient(145deg,#5f45c9 0%,#4b3aa8 45%,#0e6b85 130%);
}
.fc-back .fc-txt{color:#fff}
.fc-back b,.fc-back strong{color:#fff;font-weight:800}

/* — Sheen que barre al girar — */
.fc-face::after{
  content:"";position:absolute;top:-60%;left:-70%;width:55%;height:220%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.42),transparent);
  transform:rotate(18deg);opacity:0;pointer-events:none;
}
.fc-lift.lift .fc-face::after{animation:fcSheen .78s var(--fc-e)}
@keyframes fcSheen{
  0%{opacity:0;left:-70%}
  35%{opacity:1}
  100%{opacity:0;left:150%}
}

/* — Etiqueta superior — */
.fc-tag{
  position:absolute;top:1rem;left:1.15rem;
  font-size:var(--t-xs);font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  display:inline-flex;align-items:center;gap:.4rem;
}
.fc-front .fc-tag{color:var(--brand)}
.fc-back .fc-tag{color:rgba(255,255,255,.9)}
.fc-tag::before{
  content:"";width:7px;height:7px;border-radius:50%;background:currentColor;
  animation:fcPulse 2.2s ease-in-out infinite;
}
@keyframes fcPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.65)}}

/* — Índice tipo naipe — */
.fc-pip{
  position:absolute;font-family:var(--f-display);font-weight:800;
  font-size:.78rem;letter-spacing:-.02em;opacity:.34;font-variant-numeric:tabular-nums;
}
.fc-pip.tr{top:1rem;right:1.15rem}
.fc-pip.bl{bottom:1rem;left:1.15rem;transform:rotate(180deg)}
.fc-front .fc-pip{color:var(--ink-2)}
.fc-back .fc-pip{color:#fff;opacity:.55}

/* — Texto — */
.fc-txt{
  font-size:clamp(1rem,.9rem + .55vw,1.28rem);font-weight:650;line-height:1.5;
  max-width:44ch;letter-spacing:-.012em;
}
.fc-front .fc-txt{font-family:var(--f-display);font-weight:700}
.fc-back .fc-txt{font-weight:600;line-height:1.6}
.fc-hint{
  position:absolute;bottom:1rem;left:0;right:0;
  font-size:var(--t-xs);font-weight:600;letter-spacing:.02em;
  display:flex;align-items:center;justify-content:center;gap:.4rem;
}
.fc-front .fc-hint{color:var(--ink-3)}
.fc-back .fc-hint{color:rgba(255,255,255,.72)}
.fc-hint .kbd{
  font-family:var(--f-mono);font-size:.68rem;font-weight:700;padding:.1rem .32rem;
  border-radius:5px;border:1px solid currentColor;opacity:.75;
}

/* — Pantalla final — */
.fc-done{
  position:absolute;inset:0;border-radius:var(--r-lg);
  background:linear-gradient(150deg,var(--ok-soft),var(--surface) 70%);
  border:1.5px solid var(--ok);
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  text-align:center;padding:2rem;gap:.35rem;
  animation:fcIn .5s var(--fc-e);box-shadow:var(--sh-2);
}
.fc-done .seal{
  font-size:2.6rem;line-height:1;
  animation:fcSeal .7s cubic-bezier(.2,1.5,.4,1);
}
@keyframes fcSeal{0%{transform:scale(0) rotate(-25deg);opacity:0}60%{transform:scale(1.2) rotate(6deg)}100%{transform:scale(1) rotate(0);opacity:1}}
.fc-done h3{font-size:1.3rem;font-weight:800;margin:.2rem 0 0}
.fc-done p{margin:0;color:var(--ink-2);font-size:var(--t-sm)}

/* — Barra de progreso de la ronda — */
.fc-bar{
  height:6px;border-radius:99px;background:var(--surface-3);
  overflow:hidden;margin:.95rem 0 .8rem;position:relative;
}
.fc-bar i{
  display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--brand),var(--c5,#0891b2));
  transition:width .55s var(--fc-e);
}

/* — Controles — */
.fc-ctrls{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.fc-ctrls button{font-weight:700}
#fcok{border-color:var(--ok);color:var(--ok)}
#fcok:hover{background:var(--ok);color:#fff;border-color:var(--ok)}
#fcko{border-color:var(--warn);color:var(--warn)}
#fcko:hover{background:var(--warn);color:#fff;border-color:var(--warn)}
#fcflip{background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;border-color:transparent}
#fcflip:hover{box-shadow:var(--sh-3)}

.fc-score{display:inline-flex;gap:.45rem;margin-left:auto;align-items:center}
.fc-pill{
  font-size:var(--t-xs);font-weight:800;padding:.24rem .6rem;border-radius:var(--r-full);
  font-variant-numeric:tabular-nums;border:1px solid;
}
.fc-pill.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.fc-pill.ko{color:var(--warn);border-color:var(--warn);background:var(--warn-bg)}
.fc-pill.left{color:var(--ink-2);border-color:var(--line);background:var(--surface-2)}
.fc-pill.bump{animation:fcBump .45s var(--e-spring)}
@keyframes fcBump{0%{transform:scale(1)}45%{transform:scale(1.28)}100%{transform:scale(1)}}

@media(max-width:620px){
  #flash{--fc-h:270px}
  .fc-face{padding:1.7rem 1.3rem}
  .fc-score{margin-left:0;width:100%}
}
@media(prefers-reduced-motion:reduce){
  .fc-card{transition:none}
  .fc-lift.lift,.fc-lift.in,.fc-lift.out-ok,.fc-lift.out-ko,.fc-face::after{animation:none !important}
}
@media print{.fc-stage,.fc-ctrls,.fc-bar{display:none !important}}
/* ═══ RESPUESTA ESTRUCTURADA ═══ */
.fc-face{justify-content:center}
.fc-face.struct{justify-content:flex-start;text-align:left;padding-top:3.1rem;padding-bottom:3.1rem}
.fc-body{
  width:100%;max-width:46ch;margin:0 auto;
  overflow-y:auto;max-height:100%;
  scrollbar-width:thin;
}
.fc-body::-webkit-scrollbar{width:5px}
.fc-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.35);border-radius:99px;border:0}
.fc-front .fc-body::-webkit-scrollbar-thumb{background:var(--line-strong)}

/* — Veredicto Sí / No — */
.fc-verdict{
  display:inline-flex;align-items:center;gap:.35rem;
  font-family:var(--f-display);font-weight:800;font-size:.82rem;
  letter-spacing:.06em;text-transform:uppercase;
  padding:.26rem .72rem;border-radius:var(--r-full);margin-bottom:.85rem;
  border:1.5px solid;animation:fcPopIn .45s var(--e-spring) backwards;animation-delay:.34s;
}
.fc-verdict.si{background:rgba(255,255,255,.16);border-color:rgba(190,255,215,.85);color:#d8ffe9}
.fc-verdict.no{background:rgba(255,255,255,.16);border-color:rgba(255,205,205,.85);color:#ffdedd}
@keyframes fcPopIn{0%{opacity:0;transform:scale(.7) translateY(6px)}100%{opacity:1;transform:none}}

/* — Párrafo — */
.fc-p{margin:0;font-size:clamp(1rem,.92rem + .45vw,1.2rem);font-weight:600;line-height:1.6}
.fc-face.struct .fc-p{font-size:clamp(.96rem,.9rem + .35vw,1.1rem)}

/* — Lista enumerada — */
.fc-list{list-style:none;margin:0;padding:0;display:grid;gap:.5rem;counter-reset:fc}
.fc-list li{
  counter-increment:fc;position:relative;margin:0;
  padding:.42rem .6rem .42rem 2.5rem;border-radius:var(--r-sm);
  background:rgba(255,255,255,.11);
  font-size:clamp(.92rem,.88rem + .3vw,1.04rem);font-weight:600;line-height:1.45;
  animation:fcRow .42s var(--e-out) backwards;
}
.fc-list li::before{
  content:counter(fc);position:absolute;left:.6rem;top:50%;transform:translateY(-50%);
  width:1.6rem;height:1.6rem;border-radius:50%;
  display:grid;place-items:center;
  background:rgba(255,255,255,.9);color:var(--brand);
  font-family:var(--f-display);font-weight:800;font-size:.78rem;
  font-variant-numeric:tabular-nums;
}
.fc-list.alpha li::before{content:counter(fc,lower-alpha)}
.fc-list li:nth-child(1){animation-delay:.36s}
.fc-list li:nth-child(2){animation-delay:.42s}
.fc-list li:nth-child(3){animation-delay:.48s}
.fc-list li:nth-child(4){animation-delay:.54s}
.fc-list li:nth-child(5){animation-delay:.60s}
.fc-list li:nth-child(n+6){animation-delay:.66s}
@keyframes fcRow{0%{opacity:0;transform:translateX(-12px)}100%{opacity:1;transform:none}}

/* — Cláusulas contrapuestas — */
.fc-clauses{display:grid;gap:.45rem}
.fc-clauses p{
  margin:0;padding:.45rem .7rem .45rem .95rem;border-radius:0 var(--r-sm) var(--r-sm) 0;
  background:rgba(255,255,255,.11);border-left:3px solid rgba(255,255,255,.55);
  font-size:clamp(.92rem,.88rem + .3vw,1.04rem);font-weight:600;line-height:1.5;
  animation:fcRow .42s var(--e-out) backwards;
}
.fc-clauses p:nth-child(1){animation-delay:.36s}
.fc-clauses p:nth-child(2){animation-delay:.44s}
.fc-clauses p:nth-child(3){animation-delay:.52s}

/* — Negritas resaltadas en el reverso — */
.fc-back .fc-body b,.fc-back .fc-body strong{
  font-weight:800;background:rgba(255,255,255,.2);
  padding:.03em .3em;border-radius:5px;
  box-decoration-break:clone;-webkit-box-decoration-break:clone;
}

/* — Cita legal al pie — */
.fc-cite{
  position:absolute;bottom:.95rem;left:0;right:0;
  display:inline-flex;align-items:center;justify-content:center;gap:.4rem;
  font-family:var(--f-mono);font-size:.74rem;font-weight:700;letter-spacing:.02em;
  color:rgba(255,255,255,.82);
  animation:fcPopIn .5s var(--e-out) backwards;animation-delay:.5s;
}
.fc-cite::before,.fc-cite::after{
  content:"";height:1px;width:clamp(18px,10%,52px);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.45));
}
.fc-cite::after{background:linear-gradient(90deg,rgba(255,255,255,.45),transparent)}
.fc-cite .s{font-size:.9rem;opacity:.75;font-family:var(--f-legal)}
.fc-front .fc-cite{color:var(--ink-3)}
.fc-front .fc-cite::before{background:linear-gradient(90deg,transparent,var(--line-strong))}
.fc-front .fc-cite::after{background:linear-gradient(90deg,var(--line-strong),transparent)}

/* la pista se oculta si hay cita, para no amontonar */
.fc-back .fc-cite ~ .fc-hint,.fc-back .fc-hint.muted{display:none}

@media(max-width:620px){
  #flash{--fc-h:320px}
  .fc-face.struct{padding-top:2.9rem;padding-bottom:2.8rem}
  .fc-list li{padding-left:2.3rem}
}
@media(prefers-reduced-motion:reduce){
  .fc-verdict,.fc-list li,.fc-clauses p,.fc-cite{animation:none !important}
}

/* ═══ SEMÁFORO ═══ */
.sembtn{
  border-radius:var(--r-full);padding:.32rem .7rem;font-weight:700;font-size:var(--t-sm);
}
.sembtn[data-v="g"]:hover,.sembtn.on[data-v="g"]{background:var(--ok);color:#fff;border-color:var(--ok)}
.sembtn[data-v="y"]:hover,.sembtn.on[data-v="y"]{background:var(--mid);color:#3d2f00;border-color:var(--mid)}
.sembtn[data-v="r"]:hover,.sembtn.on[data-v="r"]{background:var(--exc);color:#fff;border-color:var(--exc)}

/* ═══ CTA DE BLOQUE ═══ */
a.blk{
  display:inline-flex;align-items:center;gap:.5rem;
  background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;
  padding:.5rem .95rem;border-radius:var(--r-sm);font-weight:700;font-size:var(--t-sm);
  text-decoration:none;box-shadow:0 2px 10px var(--brand-ring);
  transition:transform .22s var(--e-spring),box-shadow .25s,gap .25s var(--e-out);
}
a.blk:hover{transform:translateY(-2px);box-shadow:var(--sh-3);gap:.75rem;text-decoration:none}
a.blk::after{content:"→"}
a.blk:active{transform:translateY(0) scale(.98)}

/* ═══ REVEAL ═══ */
.rv{opacity:0;transform:translateY(20px);transition:opacity .6s var(--e-out),transform .6s var(--e-out)}
.rv.in{opacity:1;transform:none}

/* ═══ RESPONSIVE ═══ */
@media(max-width:960px){
  .layout{grid-template-columns:1fr;padding-top:.9rem;gap:1rem}
  nav.side{position:static;max-height:none}
  nav.side.collapsed .navbody{display:none}
  .navtoggle{display:block;width:100%;text-align:left;font-weight:700}
  .grid2{grid-template-columns:1fr}
  .top h1 .sub{white-space:normal}
}
@media(max-width:620px){
  .top-in{padding:.55rem .8rem}
  .tools{width:100%;margin-left:0}
  /* en pantallas estrechas el título se achica un poco y puede llegar a
     tres líneas: preferimos eso a recortarlo y esconder texto */
  .top h1{font-size:.95rem}
  .top h1 .tit{-webkit-line-clamp:3}
  input[type=search]{flex:1;min-width:0}
  section.card{padding:1.05rem 1rem;border-radius:var(--r-md)}
  table{font-size:.82rem}
  th,td{padding:.4rem .5rem}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
  .rv{opacity:1;transform:none}
}
/* ── Controles del test intercalado y resultados ── */
.opt.sel{border-color:var(--acc)!important;background:var(--acc-soft)!important}
.ctrl{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin:.6rem 0}
.ctrl .lbl2{font-size:.78rem;color:var(--ink-2);font-weight:600}
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:.5rem;margin:.6rem 0}
.res div{border:1px solid var(--line);border-radius:var(--r-sm);padding:.45rem .6rem;text-align:center}
.res b{display:block;font-size:1.25rem}
.res span{font-size:.75rem;color:var(--ink-2)}
@media print{
  header.top,nav.side,.tools,.noprint,.progress{display:none !important}
  body{background:#fff;background-image:none;font-size:11pt;color:#000}
  .layout{display:block;max-width:none;padding:0}
  section.card{border:0;padding:0;margin:0 0 1rem;break-inside:avoid;box-shadow:none}
  details.panel{border:0;box-shadow:none}
  details.panel .body{display:block !important}
  details.panel>summary{padding-left:0}
  .art{break-inside:avoid}
  .rv{opacity:1;transform:none}
  a{color:#000;text-decoration:none}
}


/* ═══ ALTURA ADAPTATIVA DE LA TARJETA ═══ */
.fc-deck{transition:height .45s var(--fc-e)}
.fc-body{max-height:none;overflow:visible}
.fc-measure{
  position:absolute;left:0;right:0;top:0;height:auto;
  visibility:hidden;pointer-events:none;z-index:-1;
}
.fc-measure .fc-face{
  position:relative;inset:auto;height:auto;min-height:0;
  box-shadow:none;backface-visibility:visible;transform:none;
}
.fc-measure .fc-body{max-height:none;overflow:visible}
.fc-measure .fc-face::after{display:none}

/* ═══ MOSTRAR / OCULTAR ÍNDICE LATERAL ═══ */
.layout{transition:grid-template-columns .42s var(--e-out)}
.layout.nonav{grid-template-columns:0 1fr;gap:0}
.layout.nonav>nav.side{
  opacity:0;transform:translateX(-14px);pointer-events:none;
  padding:0;border-width:0;overflow:hidden;width:0;min-width:0;
}
nav.side{
  transition:opacity .3s var(--e-out),transform .38s var(--e-out);
  overflow-x:hidden;
}
#navhide .ic{display:inline-block;transition:transform .35s var(--e-spring);font-size:.95em;line-height:1}
#navhide[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
#navhide[aria-pressed="true"] .ic{transform:rotate(90deg)}
@media(max-width:960px){#navhide{display:none}}

/* ═══════════════════════════════════════════════════════════════
   LECTURA EN VOZ ALTA (TTS) del texto legal
   ═══════════════════════════════════════════════════════════════ */
.tts-bar{
  display:flex;align-items:center;gap:.45rem;flex-wrap:wrap;
  margin:.15rem 0 .7rem;
}
.tts-bar button{
  font-size:var(--t-xs);font-weight:700;padding:.3rem .62rem;
  border-radius:var(--r-full);border:1px solid var(--legal);
  background:transparent;color:var(--legal);
  display:inline-flex;align-items:center;gap:.35rem;line-height:1.2;
}
.tts-bar button:hover{background:var(--legal);color:var(--surface);border-color:var(--legal)}
.tts-bar button[hidden]{display:none}
.tts-bar .tts-play.on{background:var(--legal);color:var(--surface)}

/* Ondas de audio mientras lee */
.tts-wave{display:inline-flex;align-items:flex-end;gap:2px;height:11px}
.tts-wave i{
  width:2.5px;background:currentColor;border-radius:2px;height:35%;
  animation:ttsW .9s ease-in-out infinite;
}
.tts-wave i:nth-child(2){animation-delay:.15s}
.tts-wave i:nth-child(3){animation-delay:.3s}
.tts-wave i:nth-child(4){animation-delay:.45s}
@keyframes ttsW{0%,100%{height:32%}50%{height:100%}}

.tts-time{
  font-family:var(--f-mono);font-size:.7rem;font-weight:700;
  color:var(--ink-3);font-variant-numeric:tabular-nums;
}

/* Frase que se está leyendo */
.tts-s{transition:background .25s,color .25s;border-radius:3px}
.tts-s.now{
  background:linear-gradient(180deg,transparent 8%,color-mix(in srgb,var(--legal) 26%,transparent) 8%);
  box-shadow:0 0 0 2px color-mix(in srgb,var(--legal) 16%,transparent);
}
html[data-theme="dark"] .tts-s.now{
  background:linear-gradient(180deg,transparent 8%,color-mix(in srgb,var(--legal) 34%,transparent) 8%);
}
.legal.tts-on{box-shadow:0 0 0 3px color-mix(in srgb,var(--legal) 20%,transparent)}

/* ═══ Reproductor flotante ═══ */
.tts-mini{
  position:fixed;left:50%;bottom:1.1rem;transform:translateX(-50%) translateY(140%);
  z-index:80;display:flex;align-items:center;gap:.6rem;
  background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  border:1px solid var(--line);border-radius:var(--r-full);
  padding:.5rem .7rem .5rem .95rem;box-shadow:var(--sh-3);
  transition:transform .45s var(--e-spring),opacity .3s;opacity:0;pointer-events:none;
  max-width:min(94vw,540px);
}
.tts-mini.show{transform:translateX(-50%) translateY(0);opacity:1;pointer-events:auto}
.tts-mini .lbl{
  font-size:var(--t-xs);font-weight:800;color:var(--legal);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:16ch;
}
.tts-mini button{
  border-radius:50%;width:32px;height:32px;padding:0;display:grid;place-items:center;
  font-size:.8rem;border:1px solid var(--line);flex:none;
}
.tts-mini button.main{
  width:38px;height:38px;font-size:.95rem;
  background:linear-gradient(140deg,var(--legal),var(--brand));color:#fff;border-color:transparent;
}
.tts-mini .bar{
  flex:1;min-width:70px;height:5px;border-radius:99px;background:var(--surface-3);overflow:hidden;
}
.tts-mini .bar i{display:block;height:100%;width:0;background:var(--legal);
  border-radius:99px;transition:width .35s var(--e-out)}

/* ═══ Panel de ajustes de voz ═══ */
.tts-back{
  position:fixed;inset:0;z-index:90;background:rgba(10,10,18,.45);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  display:grid;place-items:center;padding:1rem;
  opacity:0;pointer-events:none;transition:opacity .3s var(--e-out);
}
.tts-back.show{opacity:1;pointer-events:auto}
.tts-panel{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--sh-3);width:min(94vw,470px);max-height:88vh;overflow:auto;
  padding:1.3rem 1.4rem;transform:translateY(16px) scale(.97);
  transition:transform .38s var(--e-spring);
}
.tts-back.show .tts-panel{transform:none}
.tts-panel h3{
  font-size:1.12rem;font-weight:800;margin:0 0 .25rem;
  display:flex;align-items:center;gap:.5rem;
}
.tts-panel .sub{font-size:var(--t-sm);color:var(--ink-2);margin:0 0 1.1rem}
.tts-row{margin-bottom:1.05rem}
.tts-row > label{
  display:block;font-size:var(--t-xs);font-weight:800;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-2);margin-bottom:.4rem;
}
.tts-seg{display:flex;gap:3px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:3px}
.tts-seg button{
  flex:1;border:0;background:transparent;border-radius:calc(var(--r-sm) - 3px);
  padding:.42rem .3rem;font-size:var(--t-sm);font-weight:700;box-shadow:none;
}
.tts-seg button:hover{transform:none;background:var(--surface)}
.tts-seg button[aria-pressed="true"]{
  background:linear-gradient(140deg,var(--legal),var(--brand));color:#fff;
}
.tts-panel select{
  width:100%;padding:.5rem .6rem;border-radius:var(--r-sm);
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  font-size:var(--t-sm);font-weight:600;cursor:pointer;
}
.tts-panel select:focus{border-color:var(--brand);outline:none}
.tts-slider{display:flex;align-items:center;gap:.75rem}
.tts-slider input[type=range]{flex:1;accent-color:var(--legal);cursor:pointer;height:22px}
.tts-val{
  font-family:var(--f-mono);font-weight:800;font-size:var(--t-sm);
  min-width:3.4em;text-align:right;color:var(--legal);font-variant-numeric:tabular-nums;
}
.tts-note{
  font-size:var(--t-xs);color:var(--ink-2);line-height:1.5;
  background:var(--surface-2);border-radius:var(--r-sm);padding:.6rem .75rem;margin:0 0 1rem;
}
.tts-note b{color:var(--ink)}
.tts-acts{display:flex;gap:.5rem;justify-content:flex-end;flex-wrap:wrap}
.tts-acts .prim{
  background:linear-gradient(140deg,var(--legal),var(--brand));color:#fff;border-color:transparent;
}
.tts-badge{
  font-size:.62rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
  padding:.1rem .35rem;border-radius:4px;background:var(--ej-bg);color:var(--ej);margin-left:.35rem;
}


/* — Variante compacta para los apartados desplegables — */
.tts-bar.mini{margin:0 0 .6rem}
.tts-bar.mini button{
  font-size:.7rem;padding:.24rem .55rem;
  border-color:var(--brand);color:var(--brand);
}
.tts-bar.mini button:hover{background:var(--brand);color:var(--surface)}
.tts-bar.mini .tts-play.on{background:var(--brand);color:var(--surface)}
.tts-bar.mini .tts-time{font-size:.66rem}
.idea .tts-bar.mini{margin:.55rem 0 0}
.legal.tts-on,.body.tts-on,.idea.tts-on{
  box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 20%,transparent)
}
.legal.tts-on{box-shadow:0 0 0 3px color-mix(in srgb,var(--legal) 20%,transparent)}


/* aviso de cambio de voz */
.tts-aviso{
  position:fixed;left:50%;bottom:5.2rem;transform:translateX(-50%) translateY(20px);
  z-index:95;max-width:min(92vw,460px);
  background:var(--warn-bg);border:1px solid var(--warn);color:var(--warn);
  border-radius:var(--r-md);padding:.6rem .9rem;font-size:var(--t-sm);font-weight:700;
  box-shadow:var(--sh-2);opacity:0;pointer-events:none;
  transition:opacity .3s var(--e-out),transform .35s var(--e-spring);
}
.tts-aviso.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:620px){
  .tts-mini{left:.6rem;right:.6rem;transform:translateY(140%);max-width:none}
  .tts-mini.show{transform:translateY(0)}
  .tts-mini .lbl{display:none}
}
@media(prefers-reduced-motion:reduce){
  .tts-wave i{animation:none;height:60%}
}
@media print{.tts-bar,.tts-mini,.tts-back{display:none !important}}

document.getElementById("main").innerHTML="<section class=\"card\" id=\"intro\"><h2>Los procedimientos de contratación de un vistazo</h2>\n<div class=\"idea\">Un diagrama por procedimiento, y otro por variante cuando el recorrido cambia. Cada banda lleva su plazo y su artículo. Los literales de debajo son la prueba.</div>\n<div class=\"box ej\"><span class=\"lbl\">Cómo repasar con esta página</span><ol>\n<li>Tapa el diagrama y di en voz alta las fases y los plazos. Luego destápalo y compara.</li>\n<li>Usa la <a href=\"#tabla\">tabla comparativa</a> para repasar en horizontal: mismo plazo, distintos procedimientos.</li>\n<li>Termina con el <a href=\"#test\">test intercalado</a> de 14 preguntas.</li></ol></div>\n<div class=\"box warn\"><span class=\"lbl\">Antes de empezar</span>Verifica la vigencia en el BOE consolidado. Los literales proceden del texto de la Ley 9/2017 de la biblioteca (última modificación: 26 de diciembre de 2025), y cada uno se ha comprobado automáticamente contra el PDF. Salvo que se diga «hábiles», los días son <span class=\"t\" data-g=\"habiles\">naturales</span> (DA 12.ª). SARA = sujeto a <span class=\"t\" data-g=\"sara\">regulación armonizada</span>. DOUE = <span class=\"t\" data-g=\"doue\">Diario Oficial de la Unión Europea</span>.</div>\n</section><section class=\"card art\" id=\"mapa\"><h2>Mapa general · qué procedimiento y cuándo</h2><p class=\"ubic\">LCSP, Libro II, Título I, Capítulo I, Sección 2.ª · arts. 131 a 187</p><div class=\"idea\">Abierto y restringido son la regla; los demás solo caben en los casos que la Ley enumera.</div><svg viewBox=\"0 0 640 455\" role=\"img\" aria-label=\"Los procedimientos de adjudicación de la LCSP\" style=\"width:100%;height:auto\"><defs><marker id=\"kukpso\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\"><path d=\"M0 0 L9 4.5 L0 9 z\" fill=\"var(--acc)\"/></marker><marker id=\"kukpsos\" markerWidth=\"9\" markerHeight=\"9\" refX=\"1\" refY=\"4.5\" orient=\"auto\"><path d=\"M9 0 L0 4.5 L9 9 z\" fill=\"var(--acc)\"/></marker></defs><rect x=\"162.2\" y=\"8\" width=\"315.6\" height=\"30\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"320\" y=\"27\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">Los procedimientos de adjudicación de la LCSP</text><rect x=\"12\" y=\"50\" width=\"616\" height=\"52\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"24\" y=\"60\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"99\" y=\"80\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">Regla general</text><text x=\"186\" y=\"79.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Procedimiento abierto o restringido, con varios criterios (mejor calidad-precio)</text><text x=\"616\" y=\"70\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">art. 131.2</text><rect x=\"12\" y=\"124\" width=\"616\" height=\"52\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"24\" y=\"134\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"99\" y=\"154\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">Abierto simplificado</text><text x=\"186\" y=\"153.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Abierto más ágil por cuantía y peso del juicio de valor · variante abreviada</text><text x=\"616\" y=\"144\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">art. 159</text><rect x=\"12\" y=\"198\" width=\"616\" height=\"58\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"24\" y=\"211\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"99\" y=\"231\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--warn)\">Con negociación</text><text x=\"186\" y=\"216.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Licitación con negociación y diálogo competitivo: solo en los casos del</text><text x=\"186\" y=\"230.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">art. 167</text><text x=\"186\" y=\"244.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Negociado sin publicidad: solo en los casos del art. 168</text><text x=\"616\" y=\"218\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">arts. 167-168</text><rect x=\"12\" y=\"278\" width=\"616\" height=\"52\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><rect x=\"24\" y=\"288\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--ej)\"/><text x=\"99\" y=\"308\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">Especiales</text><text x=\"186\" y=\"300.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Asociación para la innovación (art. 177) · concurso de proyectos</text><text x=\"186\" y=\"314.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">(arts. 183-187)</text><text x=\"616\" y=\"298\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">art. 131.2 y 5</text><rect x=\"12\" y=\"352\" width=\"616\" height=\"52\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><rect x=\"24\" y=\"362\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--exc)\"/><text x=\"99\" y=\"382\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--exc)\">Sin procedimiento</text><text x=\"186\" y=\"381.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Contrato menor: adjudicación directa con el expediente del art. 118</text><text x=\"616\" y=\"372\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">art. 131.3</text><rect x=\"12\" y=\"416\" width=\"616\" height=\"31\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"320\" y=\"435\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">Urgencia y emergencia no son procedimientos: son formas de tramitar el expediente (arts. 119 y 120)</text><path d=\"M320 103 L 320 122\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#kukpso)\"/><path d=\"M320 177 L 320 196\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#kukpso)\"/><path d=\"M320 257 L 320 276\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#kukpso)\"/><path d=\"M320 331 L 320 350\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#kukpso)\"/></svg><div class=\"box warn\"><span class=\"lbl\">Trampas de examen</span><ul><li>El <b>simplificado</b> no es un procedimiento distinto del abierto: es un «procedimiento abierto simplificado».</li><li>El contrato menor no se «adjudica por procedimiento»: se adjudica <b>directamente</b> (art. 131.3).</li><li>Urgente ≠ emergencia. La urgente sigue el mismo procedimiento con plazos más cortos. La de emergencia prescinde del expediente.</li></ul></div><details class=\"panel\"><summary>Art. 131.2 y 3 LCSP</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LCSP</span><p>«La adjudicación se realizará, ordinariamente utilizando una pluralidad de criterios de adjudicación basados en el principio de mejor relación calidad-precio, y utilizando el procedimiento abierto o el procedimiento restringido»</p><p>«En los supuestos del artículo 168 podrá seguirse el procedimiento negociado sin publicidad; en los casos previstos en el artículo 167 podrá recurrirse al diálogo competitivo o a la licitación con negociación, y en los indicados en el artículo 177 podrá emplearse el procedimiento de asociación para la innovación.»</p><p>«Los contratos menores podrán adjudicarse directamente a cualquier empresario con capacidad de obrar y que cuente con la habilitación profesional necesaria para realizar la prestación, cumpliendo con las normas establecidas en el artículo 118.»</p></div></div></details></section><section class=\"card art\" id=\"comun\"><h2>Tramo final común · de la clasificación al anuncio de formalización</h2><p class=\"ubic\">Arts. 150 a 154 LCSP · se aplica a todos los procedimientos salvo especialidades</p><div class=\"idea\">Todos los procedimientos terminan igual: requerir al mejor, adjudicar, esperar si cabe recurso, firmar y publicar.</div><svg viewBox=\"0 0 640 461\" role=\"img\" aria-label=\"Tramo final común a los procedimientos\" style=\"width:100%;height:auto\"><defs><marker id=\"ke301p\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\"><path d=\"M0 0 L9 4.5 L0 9 z\" fill=\"var(--acc)\"/></marker><marker id=\"ke301ps\" markerWidth=\"9\" markerHeight=\"9\" refX=\"1\" refY=\"4.5\" orient=\"auto\"><path d=\"M9 0 L0 4.5 L9 9 z\" fill=\"var(--acc)\"/></marker></defs><rect x=\"183.1\" y=\"8\" width=\"273.7\" height=\"30\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"320\" y=\"27\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">Tramo final común a los procedimientos</text><rect x=\"12\" y=\"50\" width=\"616\" height=\"52\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"24\" y=\"60\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"99\" y=\"80\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">Clasificación</text><text x=\"186\" y=\"72.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">La mesa (o el órgano) ordena las ofertas de mayor a menor y propone</text><text x=\"186\" y=\"86.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Solo precio: la mejor oferta es la de precio más bajo</text><text x=\"616\" y=\"70\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">art. 150.1</text><rect x=\"12\" y=\"124\" width=\"616\" height=\"58\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"24\" y=\"137\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"99\" y=\"157\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--warn)\">Requerimiento</text><text x=\"186\" y=\"142.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Al mejor clasificado: documentación y garantía definitiva (5 % precio</text><text x=\"186\" y=\"156.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">sin IVA) 10 días hábiles desde el siguiente a recibirlo · si no: 3 % del</text><text x=\"186\" y=\"170.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">PBL sin IVA</text><text x=\"616\" y=\"144\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">arts. 107.1 y 150.2</text><rect x=\"12\" y=\"204\" width=\"616\" height=\"52\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><rect x=\"24\" y=\"214\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--ej)\"/><text x=\"99\" y=\"234\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">Adjudicación</text><text x=\"186\" y=\"226.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">En los 5 días hábiles siguientes a recibir la documentación</text><text x=\"186\" y=\"240.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Motivada · se notifica y se publica en el perfil en 15 días</text><text x=\"616\" y=\"224\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">arts. 150.3 y 151.1</text><rect x=\"12\" y=\"278\" width=\"616\" height=\"58\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><rect x=\"24\" y=\"291\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--exc)\"/><text x=\"99\" y=\"311\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--exc)\">Formalización</text><text x=\"186\" y=\"296.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Con recurso especial: no antes de 15 días hábiles desde remitir la notificación;</text><text x=\"186\" y=\"310.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">luego requerimiento y firma en ≤ 5 días · si no cabe recurso: ≤ 15 días hábiles</text><text x=\"186\" y=\"324.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">desde la notificación · no firma por su culpa: 3 % del PBL sin IVA</text><text x=\"616\" y=\"298\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">art. 153</text><rect x=\"12\" y=\"358\" width=\"616\" height=\"52\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><rect x=\"24\" y=\"368\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--ej)\"/><text x=\"99\" y=\"388\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">Publicación</text><text x=\"186\" y=\"380.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Anuncio de formalización en el perfil ≤ 15 días tras el perfeccionamiento</text><text x=\"186\" y=\"394.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">SARA: también en el DOUE (envío a más tardar 10 días tras la formalización)</text><text x=\"616\" y=\"378\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">art. 154</text><rect x=\"12\" y=\"422\" width=\"616\" height=\"31\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"320\" y=\"441\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">No se ejecuta antes de formalizar (art. 153.6), salvo contratos menores, basados en acuerdo marco y emergencia</text><path d=\"M320 103 L 320 122\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#ke301p)\"/><path d=\"M320 183 L 320 202\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#ke301p)\"/><path d=\"M320 257 L 320 276\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#ke301p)\"/><path d=\"M320 337 L 320 356\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#ke301p)\"/></svg><div class=\"box warn\"><span class=\"lbl\">Trampas de examen</span><ul><li>Requerimiento de documentación: <b>10 días hábiles</b> desde el siguiente a la recepción. En el simplificado son <b>7 días hábiles desde el envío</b>.</li><li>Espera de 15 días hábiles: cuenta desde que se <b>remite</b> la notificación, no desde que se recibe.</li><li>Las dos penalidades del 3 % (retirada y no formalización) se calculan sobre el <b>PBL sin IVA</b>, no sobre la oferta.</li></ul></div><details class=\"panel\"><summary>Arts. 150, 151 y 153 LCSP</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LCSP</span><p>«dentro del plazo de diez días hábiles, a contar desde el siguiente a aquel en que hubiera recibido el requerimiento»</p><p>«El órgano de contratación adjudicará el contrato dentro de los cinco días hábiles siguientes a la recepción de la documentación.»</p><p>«La resolución de adjudicación deberá ser motivada y se notificará a los candidatos y licitadores, debiendo ser publicada en el perfil de contratante en el plazo de 15 días.»</p><p>«la formalización no podrá efectuarse antes de que transcurran quince días hábiles desde que se remita la notificación de la adjudicación a los licitadores y candidatos.»</p><p>«En los restantes casos, la formalización del contrato deberá efectuarse no más tarde de los quince días hábiles siguientes a aquel en que se realice la notificación de la adjudicación a los licitadores y candidatos en la forma prevista en el artículo 151.»</p><p>«Cuando por causas imputables al adjudicatario no se hubiese formalizado el contrato dentro del plazo indicado se le exigirá el importe del 3 por ciento del presupuesto base de licitación, IVA excluido»</p></div></div></details><details class=\"panel\"><summary>Art. 154 LCSP</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LCSP</span><p>«La formalización de los contratos deberá publicarse, junto con el correspondiente contrato, en un plazo no superior a quince días tras el perfeccionamiento del contrato en el perfil de contratante del órgano de contratación.»</p><p>«El órgano de contratación, cuando proceda, enviará el anuncio de formalización al «Diario Oficial de la Unión Europea» a más tardar 10 días después de la formalización del contrato.»</p></div></div></details></section><section class=\"card art\" id=\"menor\"><h2>Contrato menor · adjudicación directa</h2><p class=\"ubic\">Arts. 29.8, 36.1, 63.4, 118, 131.3 y 153.2 LCSP</p><div class=\"idea\">Contrato pequeño, adjudicado a dedo con un expediente mínimo, de un año como mucho y sin prórroga.</div><svg viewBox=\"0 0 640 426\" role=\"img\" aria-label=\"Contrato menor\" style=\"width:100%;height:auto\"><defs><marker id=\"kfvi0o\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\"><path d=\"M0 0 L9 4.5 L0 9 z\" fill=\"var(--acc)\"/></marker><marker id=\"kfvi0os\" markerWidth=\"9\" markerHeight=\"9\" refX=\"1\" refY=\"4.5\" orient=\"auto\"><path d=\"M9 0 L0 4.5 L9 9 z\" fill=\"var(--acc)\"/></marker></defs><rect x=\"254\" y=\"8\" width=\"132.1\" height=\"30\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"320\" y=\"27\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">Contrato menor</text><rect x=\"12\" y=\"50\" width=\"616\" height=\"52\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"24\" y=\"60\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"99\" y=\"80\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">Umbral</text><text x=\"186\" y=\"79.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Valor estimado sin IVA: obras &lt; 40.000 € · suministros y servicios &lt; 15.000 €</text><text x=\"616\" y=\"70\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">art. 118.1</text><rect x=\"12\" y=\"124\" width=\"616\" height=\"72\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"24\" y=\"144\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"99\" y=\"164\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">Expediente</text><text x=\"186\" y=\"142.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Informe motivado: necesidad + que no se altera el objeto para eludir</text><text x=\"186\" y=\"156.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">umbrales</text><text x=\"186\" y=\"170.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Aprobación del gasto y factura · obras: presupuesto y, si procede, proyecto</text><text x=\"186\" y=\"184.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Pago por anticipo de caja fija y VE ≤ 5.000 €: no hace falta el informe</text><text x=\"616\" y=\"144\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">art. 118.2-5</text><rect x=\"12\" y=\"218\" width=\"616\" height=\"52\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><rect x=\"24\" y=\"228\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--ej)\"/><text x=\"99\" y=\"248\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">Adjudicación</text><text x=\"186\" y=\"247.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Directa, a un empresario con capacidad de obrar y habilitación profesional</text><text x=\"616\" y=\"238\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">art. 131.3</text><rect x=\"12\" y=\"292\" width=\"616\" height=\"52\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><rect x=\"24\" y=\"302\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--ej)\"/><text x=\"99\" y=\"322\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">Sin formalizar</text><text x=\"186\" y=\"314.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">El expediente del art. 118 acredita el contrato · excepción a la</text><text x=\"186\" y=\"328.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">perfección por formalización · duración ≤ 1 año y sin prórroga</text><text x=\"616\" y=\"312\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">arts. 29.8, 36.1, 153.2</text><rect x=\"12\" y=\"366\" width=\"616\" height=\"52\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"24\" y=\"376\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"99\" y=\"396\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--warn)\">Publicidad</text><text x=\"186\" y=\"388.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Al menos trimestral: objeto, duración, importe con IVA y adjudicatario</text><text x=\"186\" y=\"402.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Exentos: VE &lt; 5.000 € pagados por anticipo de caja fija u otro similar</text><text x=\"616\" y=\"386\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">art. 63.4</text><path d=\"M320 103 L 320 122\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#kfvi0o)\"/><path d=\"M320 197 L 320 216\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#kfvi0o)\"/><path d=\"M320 271 L 320 290\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#kfvi0o)\"/><path d=\"M320 345 L 320 364\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#kfvi0o)\"/></svg><div class=\"box warn\"><span class=\"lbl\">Trampas de examen</span><ul><li>Los umbrales se miden sobre el <b>valor estimado</b>, sin IVA: un suministro de 14.000 € + IVA (16.940 €) sigue siendo menor.</li><li>El texto vigente ya no limita los menores por contratista: exige justificar que no se altera el objeto. El tope real es la prohibición de fraccionar (art. 99.2).</li><li>Ojo al 5.000: el informe se dispensa con VE <b>≤ 5.000 €</b> (art. 118.5); la publicación, con VE <b>&lt; 5.000 €</b> (art. 63.4). En ambos casos, pagando por anticipo de caja fija.</li><li>Obras: cuando afecten a la estabilidad, la seguridad o la estanqueidad, hace falta además el informe de supervisión (art. 118.4).</li></ul></div><details class=\"panel\"><summary>Art. 118 LCSP</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LCSP</span><p>«1. Se consideran contratos menores los contratos de valor estimado inferior a 40.000 euros, cuando se trate de contratos de obras, o a 15.000 euros, cuando se trate de contratos de suministro o de servicios»</p><p>«2. En los contratos menores la tramitación del expediente exigirá la emisión de un informe del órgano de contratación justificando de manera motivada la necesidad del contrato y que no se está alterando su objeto con el fin de evitar la aplicación de los umbrales descritos en el apartado anterior.»</p><p>«3. Asimismo se requerirá la aprobación del gasto y la incorporación al mismo de la factura correspondiente»</p><p>«4. En el contrato menor de obras, deberá añadirse, además, el presupuesto de las obras, sin perjuicio de que deba existir el correspondiente proyecto cuando sea requerido por las disposiciones vigentes.»</p></div></div></details><details class=\"panel\"><summary>Arts. 29.8 y 63.4 LCSP</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LCSP</span><p>«Los contratos menores definidos en el apartado primero del artículo 118 no podrán tener una duración superior a un año ni ser objeto de prórroga.»</p><p>«La publicación de la información relativa a los contratos menores deberá realizarse al menos trimestralmente.»</p></div></div></details></section><section class=\"card art\" id=\"abierto\"><h2>Procedimiento abierto · contrato no armonizado</h2><p class=\"ubic\">Arts. 135, 145-146, 149 y 156-158 LCSP</p><div class=\"idea\">Cualquiera puede ofertar, nadie negocia: se abre, se valora, se clasifica y se adjudica.</div><svg viewBox=\"0 0 640 512\" role=\"img\" aria-label=\"Procedimiento abierto · no sujeto a regulación armonizada\" style=\"width:100%;height:auto\"><defs><marker id=\"ky9lw1\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\"><path d=\"M0 0 L9 4.5 L0 9 z\" fill=\"var(--acc)\"/></marker><marker id=\"ky9lw1s\" markerWidth=\"9\" markerHeight=\"9\" refX=\"1\" refY=\"4.5\" orient=\"auto\"><path d=\"M9 0 L0 4.5 L9 9 z\" fill=\"var(--acc)\"/></marker></defs><rect x=\"129.8\" y=\"8\" width=\"380.3\" height=\"30\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"320\" y=\"27\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">Procedimiento abierto · no sujeto a regulación armonizada</text><rect x=\"12\" y=\"50\" width=\"616\" height=\"52\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"24\" y=\"60\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"99\" y=\"80\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">Anuncio</text><text x=\"186\" y=\"72.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">En el perfil de contratante (la AGE, además, en el BOE)</text><text x=\"186\" y=\"86.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Cualquier empresario puede ofertar · prohibida toda negociación</text><text x=\"616\" y=\"70\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">arts. 135.1 y 156.1</text><rect x=\"12\" y=\"124\" width=\"616\" height=\"72\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"24\" y=\"144\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"99\" y=\"164\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">Ofertas</text><text x=\"186\" y=\"142.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">≥ 15 días desde el siguiente a la publicación · obras y concesiones: ≥</text><text x=\"186\" y=\"156.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">26 días</text><text x=\"186\" y=\"170.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Documentación del art. 140 aparte · con varios criterios: 2 sobres</text><text x=\"186\" y=\"184.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">más</text><text x=\"616\" y=\"144\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">arts. 156.6 y 157.1-2</text><rect x=\"12\" y=\"218\" width=\"616\" height=\"52\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"24\" y=\"228\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"99\" y=\"248\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--warn)\">Apertura</text><text x=\"186\" y=\"240.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">≤ 20 días desde el fin del plazo (basta abrir el primer sobre)</text><text x=\"186\" y=\"254.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Económica en acto público, salvo medios electrónicos</text><text x=\"616\" y=\"238\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">art. 157.3-4</text><rect x=\"12\" y=\"292\" width=\"616\" height=\"58\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"24\" y=\"305\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"99\" y=\"325\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--warn)\">Valoración</text><text x=\"186\" y=\"310.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Mesa obligatoria · juicio de valor antes que fórmulas · comité de</text><text x=\"186\" y=\"324.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">expertos si el juicio de valor pesa más · baja anormal: audiencia</text><text x=\"186\" y=\"338.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">antes de excluir</text><text x=\"616\" y=\"312\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">arts. 146.2, 149, 326</text><rect x=\"12\" y=\"372\" width=\"616\" height=\"58\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><rect x=\"24\" y=\"385\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--ej)\"/><text x=\"99\" y=\"405\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">Plazo para adjudicar</text><text x=\"186\" y=\"390.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Solo precio: 15 días desde el siguiente a la apertura</text><text x=\"186\" y=\"404.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Varios criterios: 2 meses desde la 1.ª apertura · +15 días hábiles si art. 149.4</text><text x=\"186\" y=\"418.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Superado el plazo, los licitadores pueden retirar su oferta</text><text x=\"616\" y=\"392\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">art. 158</text><rect x=\"12\" y=\"452\" width=\"616\" height=\"52\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><rect x=\"24\" y=\"462\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--ej)\"/><text x=\"99\" y=\"482\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">Tramo final</text><text x=\"186\" y=\"474.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Requerimiento 10 días hábiles → adjudicación 5 días hábiles →</text><text x=\"186\" y=\"488.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">formalización</text><text x=\"616\" y=\"472\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">arts. 150-154</text><path d=\"M320 103 L 320 122\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#ky9lw1)\"/><path d=\"M320 197 L 320 216\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#ky9lw1)\"/><path d=\"M320 271 L 320 290\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#ky9lw1)\"/><path d=\"M320 351 L 320 370\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#ky9lw1)\"/><path d=\"M320 431 L 320 450\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#ky9lw1)\"/></svg><div class=\"box warn\"><span class=\"lbl\">Trampas de examen</span><ul><li>Los 15 días son <b>naturales</b> (DA 12.ª) y cuentan desde el día <b>siguiente</b> a la publicación.</li><li>Plazo para adjudicar con solo precio: <b>15 días</b>. Con varios criterios: <b>2 meses</b>, salvo que el pliego fije otro.</li><li>Para el plazo de apertura basta abrir el <b>primer</b> sobre dentro de los 20 días.</li></ul></div><details class=\"panel\"><summary>Arts. 156-158 LCSP</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LCSP</span><p>«En el procedimiento abierto todo empresario interesado podrá presentar una proposición, quedando excluida toda negociación de los términos del contrato con los licitadores.»</p><p>«En los contratos de las Administraciones Públicas que no estén sujetos a regulación armonizada, el plazo de presentación de proposiciones no será inferior a quince días, contados desde el día siguiente al de la publicación del anuncio de licitación del contrato en el perfil de contratante. En los contratos de obras y de concesión de obras y concesión de servicios, el plazo será, como mínimo, de veintiséis días.»</p><p>«En todo caso la apertura de las proposiciones deberá efectuarse en el plazo máximo de veinte días contado desde la fecha de finalización del plazo para presentar las mismas.»</p><p>«En todo caso, la apertura de la oferta económica se realizará en acto público, salvo cuando se prevea que en la licitación puedan emplearse medios electrónicos.»</p><p>«Cuando el único criterio para seleccionar al adjudicatario del contrato sea el del precio, la adjudicación deberá recaer en el plazo máximo de quince días a contar desde el siguiente al de apertura de las proposiciones.»</p><p>«el plazo máximo para efectuar la adjudicación será de dos meses a contar desde la apertura de las proposiciones, salvo que se hubiese establecido otro en el pliego de cláusulas administrativas particulares.»</p><p>«Los plazos indicados en los apartados anteriores se ampliarán en quince días hábiles cuando sea necesario seguir los trámites a que se refiere el apartado 4 del artículo 149 de la presente Ley.»</p><p>«De no producirse la adjudicación dentro de los plazos señalados, los licitadores tendrán derecho a retirar su proposición»</p></div></div></details><details class=\"panel\"><summary>Art. 146.2 LCSP · orden de valoración</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LCSP</span><p>«En todo caso, la evaluación de las ofertas conforme a los criterios cuantificables mediante la mera aplicación de fórmulas se realizará tras efectuar previamente la de aquellos otros criterios en que no concurra esta circunstancia, dejándose constancia documental de ello.»</p></div></div></details></section><section class=\"card art\" id=\"abiertosara\"><h2>Procedimiento abierto · variante armonizada</h2><p class=\"ubic\">Arts. 135, 154 y 156.2-4 LCSP</p><div class=\"idea\">Lo mismo que el abierto, pero el anuncio va primero al DOUE y los plazos se alargan.</div><svg viewBox=\"0 0 640 432\" role=\"img\" aria-label=\"Procedimiento abierto · sujeto a regulación armonizada\" style=\"width:100%;height:auto\"><defs><marker id=\"k2cdt6\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\"><path d=\"M0 0 L9 4.5 L0 9 z\" fill=\"var(--acc)\"/></marker><marker id=\"k2cdt6s\" markerWidth=\"9\" markerHeight=\"9\" refX=\"1\" refY=\"4.5\" orient=\"auto\"><path d=\"M9 0 L0 4.5 L9 9 z\" fill=\"var(--acc)\"/></marker></defs><rect x=\"138.7\" y=\"8\" width=\"362.7\" height=\"30\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"320\" y=\"27\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">Procedimiento abierto · sujeto a regulación armonizada</text><rect x=\"12\" y=\"50\" width=\"616\" height=\"52\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"24\" y=\"60\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"99\" y=\"80\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">Anuncio</text><text x=\"186\" y=\"72.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Primero al DOUE · en el perfil no antes de su publicación allí, salvo que no</text><text x=\"186\" y=\"86.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">haya aviso a las 48 h de confirmarse la recepción</text><text x=\"616\" y=\"70\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">art. 135.1 y 3</text><rect x=\"12\" y=\"124\" width=\"616\" height=\"52\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"24\" y=\"134\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"99\" y=\"154\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">Ofertas</text><text x=\"186\" y=\"146.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">≥ 35 días desde el envío del anuncio a la Oficina de Publicaciones de la UE</text><text x=\"186\" y=\"160.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Concesiones de obras y de servicios: ≥ 30 días</text><text x=\"616\" y=\"144\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">art. 156.2</text><rect x=\"12\" y=\"198\" width=\"616\" height=\"72\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"24\" y=\"218\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"99\" y=\"238\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--warn)\">Reducciones</text><text x=\"186\" y=\"216.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Anuncio de información previa (enviado entre 35 días y 12 meses antes): 15</text><text x=\"186\" y=\"230.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">días</text><text x=\"186\" y=\"244.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Urgencia: no menos de 15 días desde el envío · ofertas electrónicas: −5 días</text><text x=\"186\" y=\"258.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Concesiones: solo cabe la reducción por medios electrónicos</text><text x=\"616\" y=\"218\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">art. 156.3-4</text><rect x=\"12\" y=\"292\" width=\"616\" height=\"52\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><rect x=\"24\" y=\"302\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--ej)\"/><text x=\"99\" y=\"322\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">Como el no SARA</text><text x=\"186\" y=\"321.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Apertura ≤ 20 días · adjudicación en 15 días o 2 meses · tramo común</text><text x=\"616\" y=\"312\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">arts. 157-158</text><rect x=\"12\" y=\"366\" width=\"616\" height=\"58\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><rect x=\"24\" y=\"379\" width=\"150\" height=\"32\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--exc)\"/><text x=\"99\" y=\"399\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--exc)\">Especialidades</text><text x=\"186\" y=\"384.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Indicios de colusión: informe de la autoridad de competencia en 20 días</text><text x=\"186\" y=\"398.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">hábiles</text><text x=\"186\" y=\"412.5\" text-anchor=\"start\" font-size=\"10\" fill=\"currentColor\">Anuncio de formalización en el perfil y en el DOUE (envío ≤ 10 días)</text><text x=\"616\" y=\"386\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\

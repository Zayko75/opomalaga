<script>
document.getElementById('main').innerHTML="<section class=\"card\" id=\"intro\"><h2>Tema 10 · Bloque 5 · Seis supuestos prácticos del ciclo del gasto</h2><p class=\"small\">Los cuatro bloques anteriores explican la ley artículo por artículo. Este la pone a andar, y lo hace <b>con el formato del examen</b>: seis supuestos, cada uno con un enunciado breve, la cronología del expediente y <b>diez preguntas de opción múltiple</b> con corrección razonada. Sesenta preguntas en total, el mismo número que traen los tres exámenes reales de la convocatoria.</p><div class=\"box ej\"><span class=\"lbl\">La idea que ordena el bloque</span>La contratación pública y el gasto público son <b>dos relatos del mismo expediente</b>. Uno lo cuenta la Ley 9/2017 —necesidad, expediente, licitación, adjudicación, formalización, ejecución—; el otro lo cuenta el TRLHL con el RD 500/1990 —retención, autorización, disposición, obligación, pago—. Las tres equivalencias que hay que saber son: <b>aprobar el expediente = autorizar (A)</b>; <b>adjudicar = comprometer (D)</b>; <b>certificación o factura conformada = reconocer la obligación (O)</b>. Con eso resuelves la mayoría de las preguntas de este bloque.</div><div class=\"box warn\"><span class=\"lbl\">Fuentes utilizadas y vigencia</span><ul><li><b>Ley 9/2017, de 8 de noviembre</b>, de Contratos del Sector Público, <b>texto consolidado</b> (documento de la biblioteca del proyecto).</li><li><b>Real Decreto Legislativo 2/2004</b>, texto refundido de la Ley Reguladora de las Haciendas Locales, arts. 174, 184 a 189, 214 y 219 (documento de la biblioteca).</li><li><b>Real Decreto 500/1990</b>, de 20 de abril, arts. 31, 52 a 67, que define las fases del gasto (documento de la biblioteca).</li><li><b>Aportación externa</b>: la <b>Ley 3/2004</b>, de lucha contra la morosidad, citada por el art. 198.4 LCSP para los intereses de demora y los costes de cobro.</li><li><b>Verifica siempre la vigencia en el BOE consolidado.</b> Los umbrales de la regulación armonizada de los arts. 20 a 23 se actualizan cada dos años por reglamento delegado de la Comisión Europea; los umbrales del contrato menor y los del recurso especial los fija la ley y no se actualizan por esa vía.</li><li>Las entidades, fechas, cifras y empresas de los supuestos son <b>ficticias</b>; los preceptos, los plazos y los porcentajes, reales. Los importes se han construido para que los cálculos salgan redondos y puedan comprobarse a mano.</li></ul></div><div class=\"box exc\"><span class=\"lbl\">Esto no es asesoramiento jurídico</span>Es material de estudio. Para un expediente real, acude a la norma consolidada, a las bases de ejecución de tu entidad y al informe del órgano competente. Las bases de ejecución concretan muchos extremos que aquí se dan por supuestos: niveles de vinculación jurídica de los créditos, órganos con competencia delegada y documentos que justifican el reconocimiento de la obligación en cada tipo de gasto (art. 59.2 del RD 500/1990).</div><div class=\"box\"><span class=\"lbl\">Los cinco bloques del tema 10</span><ul><li><a href=\"LCSP_28-102_organo_y_objeto.html\"><b>Bloque 1 · El órgano de contratación, las partes y el objeto</b> — arts. 28, 29, 35, 36, 61, 62, 63, 74, 99 a 102</a></li><li><a href=\"LCSP_106-126_expediente.html\"><b>Bloque 2 · Garantías, expediente y pliegos</b> — arts. 106 a 108, 115 a 124 y 126</a></li><li><a href=\"LCSP_131-204_adjudicacion.html\"><b>Bloque 3 · Adjudicación y formalización</b> — arts. 131 a 160 y 204</a></li><li><a href=\"LCSP_44-60_recurso_especial.html\"><b>Bloque 4 · El recurso especial en materia de contratación</b> — arts. 44 a 60</a></li><li><b>Bloque 5 · Supuestos prácticos del ciclo del gasto</b> — estás aquí</li></ul></div><div class=\"box\"><span class=\"lbl\">Cómo estudiar este bloque</span>Lee el enunciado, consulta la tabla del ciclo si la necesitas y <b>responde las diez preguntas antes de desplegar nada</b>. Cada corrección explica no solo por qué la correcta lo es, sino <b>por qué falla cada una de las otras tres</b>: ahí está casi todo el valor. Si en un supuesto fallas más de tres, vuelve a la tabla del ciclo antes de pasar al siguiente.</div><div class=\"box warn\"><span class=\"lbl\">Nivel</span>Las preguntas están calibradas al nivel de los <b>exámenes reales de Auxiliar Administrativo</b> que ya has trabajado: identificar el trámite, el órgano, el plazo, la cifra o la fase del gasto. No hay cálculos encadenados ni valoraciones jurídicas complejas. Lo que sí hay, y es deliberado, son las <b>trampas habituales</b>: importes con IVA frente a valor estimado, días hábiles frente a naturales, y umbrales que se parecen pero no coinciden.</div></section><section class=\"card\" id=\"ciclo\"><h2>El esqueleto común: RC · A · D · O · P</h2><p class=\"small\">Los seis supuestos recorren este mismo camino. Cámbiale el tipo de contrato y lo único que varía son los trámites previos y la forma de acreditar la prestación.</p><svg viewBox=\"0 0 960 858\" role=\"img\" aria-label=\"El ciclo completo del gasto público en un contrato: de la necesidad al pago\" style=\"width:100%;height:auto\"><defs><marker id=\"fl_g1\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr_g1\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe_g1\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw_g1\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"250\" y=\"8\" width=\"460\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"27.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">EL CICLO DEL GASTO EN UN CONTRATO PÚBLICO</text><rect x=\"20\" y=\"52\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--panel)\" stroke=\"var(--line)\"/><rect x=\"30\" y=\"66\" width=\"230\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--line)\"/><text x=\"145\" y=\"83\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"currentColor\">0 · NECESIDAD</text><text x=\"274\" y=\"74\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Informe que determina con precisión la naturaleza y extensión de la necesidad</text><text x=\"274\" y=\"88\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">y la idoneidad del objeto. Es previo a todo.</text><text x=\"930\" y=\"83\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">LCSP 28.1</text><path d=\"M480 107 L 480 115\" stroke=\"var(--line)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl_g1)\"/><rect x=\"20\" y=\"116\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"30\" y=\"124\" width=\"230\" height=\"38\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"145\" y=\"140.5\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--acc)\">RC · RETENCIÓN</text><text x=\"145\" y=\"153.5\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--acc)\">DE CRÉDITO</text><text x=\"274\" y=\"138\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Certificación de existencia de saldo suficiente, que produce una RESERVA</text><text x=\"274\" y=\"152\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">por el mismo importe. Se une al expediente como certificado de crédito.</text><text x=\"930\" y=\"141\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">RD 500/1990, 31</text><text x=\"930\" y=\"153\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">LCSP 116.3</text><path d=\"M480 171 L 480 179\" stroke=\"var(--acc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl_g1)\"/><rect x=\"20\" y=\"180\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"30\" y=\"194\" width=\"230\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"145\" y=\"211\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--warn)\">Fiscalización previa</text><text x=\"274\" y=\"202\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">La Intervención fiscaliza el expediente antes de su aprobación.</text><text x=\"274\" y=\"216\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Los CONTRATOS MENORES no están sometidos a intervención previa.</text><text x=\"930\" y=\"211\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">TRLHL 214 y 219</text><path d=\"M480 235 L 480 243\" stroke=\"var(--warn)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl_g1)\"/><rect x=\"20\" y=\"244\" width=\"920\" height=\"68\" rx=\"10\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"30\" y=\"265\" width=\"230\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"145\" y=\"282\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--acc)\">A · AUTORIZACIÓN</text><text x=\"274\" y=\"266\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Acto por el que se acuerda la realización del gasto por cuantía cierta o</text><text x=\"274\" y=\"280\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">aproximada. Es INTERNO: no crea relaciones con terceros.</text><text x=\"274\" y=\"294\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Se produce al aprobar el expediente y disponer la apertura del procedimiento.</text><text x=\"930\" y=\"276\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">RD 500/1990, 54</text><text x=\"930\" y=\"288\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">LCSP 117.1</text><path d=\"M480 313 L 480 321\" stroke=\"var(--acc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl_g1)\"/><rect x=\"20\" y=\"322\" width=\"920\" height=\"40\" rx=\"10\" fill=\"var(--panel)\" stroke=\"var(--line)\"/><rect x=\"30\" y=\"329\" width=\"230\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--line)\"/><text x=\"145\" y=\"346\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"currentColor\">Licitación</text><text x=\"274\" y=\"344\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Anuncio, presentación de ofertas, mesa, valoración y clasificación.</text><text x=\"930\" y=\"346\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">LCSP 135, 156 y 157</text><path d=\"M480 363 L 480 371\" stroke=\"var(--line)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl_g1)\"/><rect x=\"20\" y=\"372\" width=\"920\" height=\"68\" rx=\"10\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><rect x=\"30\" y=\"387\" width=\"230\" height=\"38\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--ej)\"/><text x=\"145\" y=\"403.5\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--ej)\">D · DISPOSICIÓN</text><text x=\"145\" y=\"416.5\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--ej)\">O COMPROMISO</text><text x=\"274\" y=\"394\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Acto por el que se acuerda con un TERCERO la realización del gasto por importe</text><text x=\"274\" y=\"408\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">EXACTAMENTE DETERMINADO. Tiene relevancia jurídica frente a él.</text><text x=\"274\" y=\"422\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Se produce con la ADJUDICACIÓN del contrato.</text><text x=\"930\" y=\"404\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">RD 500/1990, 56</text><text x=\"930\" y=\"416\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">LCSP 150 y 151</text><path d=\"M480 441 L 480 449\" stroke=\"var(--ej)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl_g1)\"/><rect x=\"20\" y=\"450\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"30\" y=\"464\" width=\"230\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"145\" y=\"481\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--warn)\">Formalización</text><text x=\"274\" y=\"472\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">El contrato NACE aquí. Si cabe recurso especial, no antes de quince días</text><text x=\"274\" y=\"486\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">hábiles desde la remisión de la notificación de la adjudicación.</text><text x=\"930\" y=\"481\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">LCSP 36.1 y 153.3</text><path d=\"M480 505 L 480 513\" stroke=\"var(--warn)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl_g1)\"/><rect x=\"20\" y=\"514\" width=\"920\" height=\"68\" rx=\"10\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><rect x=\"30\" y=\"529\" width=\"230\" height=\"38\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--ej)\"/><text x=\"145\" y=\"545.5\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--ej)\">O · RECONOCIMIENTO</text><text x=\"145\" y=\"558.5\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--ej)\">DE LA OBLIGACIÓN</text><text x=\"274\" y=\"536\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Acto por el que se declara la existencia de un crédito EXIGIBLE contra la</text><text x=\"274\" y=\"550\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">entidad. Exige acreditar documentalmente la prestación: certificación de obra</text><text x=\"274\" y=\"564\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">conformada o factura conformada, con recepción o conformidad.</text><text x=\"930\" y=\"546\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">RD 500/1990, 58 y 59</text><text x=\"930\" y=\"558\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">LCSP 198.4 y 210.2</text><path d=\"M480 583 L 480 591\" stroke=\"var(--ej)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl_g1)\"/><rect x=\"20\" y=\"592\" width=\"920\" height=\"68\" rx=\"10\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><rect x=\"30\" y=\"607\" width=\"230\" height=\"38\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--exc)\"/><text x=\"145\" y=\"623.5\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--exc)\">P · ORDENACIÓN</text><text x=\"145\" y=\"636.5\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--exc)\">DEL PAGO</text><text x=\"274\" y=\"614\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Acto por el que el ordenador de pagos —el presidente de la entidad local—</text><text x=\"274\" y=\"628\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">expide la orden de pago contra la Tesorería, conforme al plan de disposición</text><text x=\"274\" y=\"642\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">de fondos.</text><text x=\"930\" y=\"630\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">TRLHL 186 y 187</text><path d=\"M480 661 L 480 669\" stroke=\"var(--exc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl_g1)\"/><rect x=\"20\" y=\"670\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><rect x=\"30\" y=\"684\" width=\"230\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--exc)\"/><text x=\"145\" y=\"701\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--exc)\">Pago material</text><text x=\"274\" y=\"692\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Salida efectiva de fondos. La Administración debe pagar dentro de los TREINTA</text><text x=\"274\" y=\"706\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">DÍAS siguientes a la aprobación de la certificación o a la conformidad.</text><text x=\"930\" y=\"701\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">LCSP 198.4</text><path d=\"M480 725 L 480 733\" stroke=\"var(--exc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl_g1)\"/><rect x=\"20\" y=\"734\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--panel)\" stroke=\"var(--line)\"/><rect x=\"30\" y=\"748\" width=\"230\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--line)\"/><text x=\"145\" y=\"765\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"currentColor\">Extinción</text><text x=\"274\" y=\"756\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Recepción o conformidad, plazo de garantía, informe favorable, devolución</text><text x=\"274\" y=\"770\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">de la garantía definitiva y liquidación del contrato.</text><text x=\"930\" y=\"765\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">LCSP 210 y 243</text><rect x=\"20\" y=\"798\" width=\"920\" height=\"48\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"480\" y=\"818.828\" text-anchor=\"middle\" font-size=\"9.9\" fill=\"currentColor\">Regla de acumulación (RD 500/1990, art. 67): un mismo acto puede abarcar varias fases —AD, ADO, ADOP—, con los mismos efectos que si se acordaran por separado.</text><text x=\"480\" y=\"831.828\" text-anchor=\"middle\" font-size=\"10.4\" fill=\"currentColor\">En el contrato menor lo habitual es un único documento ADO: se autoriza, se compromete y se reconoce la obligación en un solo acto, con la factura.</text></svg><p class=\"small\" style=\"margin-top:1rem\">Y estos son los documentos contables que se expiden en cada momento:</p><svg viewBox=\"0 0 960 296\" role=\"img\" aria-label=\"Documentos contables del ciclo del gasto y momento de su expedición\" style=\"width:100%;height:auto\"><defs><marker id=\"fl_g2\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr_g2\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe_g2\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw_g2\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"250\" y=\"8\" width=\"460\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"27.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">QUÉ DOCUMENTO CONTABLE SE EXPIDE EN CADA MOMENTO</text><rect x=\"20\" y=\"52\" width=\"172.8\" height=\"176\" rx=\"8\" fill=\"var(--panel)\" stroke=\"var(--line)\"/><text x=\"106.4\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"currentColor\">RC</text><text x=\"106.4\" y=\"91\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Retención de crédito</text><text x=\"106.4\" y=\"106\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"106.4\" y=\"121\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Al iniciar el expediente</text><text x=\"106.4\" y=\"136\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">y certificar que hay</text><text x=\"106.4\" y=\"151\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">saldo suficiente</text><text x=\"106.4\" y=\"166\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"106.4\" y=\"181\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">RD 500/1990, art. 31</text><rect x=\"206.8\" y=\"52\" width=\"172.8\" height=\"176\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"293.2\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--acc)\">A</text><text x=\"293.2\" y=\"91\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Autorización</text><text x=\"293.2\" y=\"106\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"293.2\" y=\"121\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Al aprobar el expediente</text><text x=\"293.2\" y=\"136\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">y disponer la apertura</text><text x=\"293.2\" y=\"151\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">del procedimiento</text><text x=\"293.2\" y=\"166\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"293.2\" y=\"181\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">LCSP art. 117.1</text><rect x=\"393.6\" y=\"52\" width=\"172.8\" height=\"176\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"480\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--ej)\">D</text><text x=\"480\" y=\"91\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Disposición</text><text x=\"480\" y=\"106\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"480\" y=\"121\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Al adjudicar el contrato</text><text x=\"480\" y=\"136\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">por importe exactamente</text><text x=\"480\" y=\"151\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">determinado</text><text x=\"480\" y=\"166\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"480\" y=\"181\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">LCSP arts. 150 y 151</text><rect x=\"580.4\" y=\"52\" width=\"172.8\" height=\"176\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"666.8\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--warn)\">O</text><text x=\"666.8\" y=\"91\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Reconocimiento de la</text><text x=\"666.8\" y=\"106\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">obligación</text><text x=\"666.8\" y=\"121\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"666.8\" y=\"136\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Con la certificación de</text><text x=\"666.8\" y=\"151\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">obra o la factura</text><text x=\"666.8\" y=\"166\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">conformada tras la</text><text x=\"666.8\" y=\"181\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">recepción</text><text x=\"666.8\" y=\"196\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"666.8\" y=\"211\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">RD 500/1990, art. 58</text><rect x=\"767.2\" y=\"52\" width=\"172.8\" height=\"176\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"853.6\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--exc)\">P</text><text x=\"853.6\" y=\"91\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Ordenación del pago</text><text x=\"853.6\" y=\"106\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"853.6\" y=\"121\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Orden de pago expedida</text><text x=\"853.6\" y=\"136\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">por el presidente contra</text><text x=\"853.6\" y=\"151\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">la Tesorería</text><text x=\"853.6\" y=\"166\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"853.6\" y=\"181\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">TRLHL art. 186</text><rect x=\"20\" y=\"238\" width=\"920\" height=\"48\" rx=\"8\" fill=\"var(--panel)\" stroke=\"var(--line)\"/><text x=\"480\" y=\"258.828\" text-anchor=\"middle\" font-size=\"10.4\" fill=\"currentColor\">Documentos acumulados: AD (autorización y disposición) · ADO (las tres) · ADOP (las cuatro, con la propuesta de pago).</text><text x=\"480\" y=\"271.828\" text-anchor=\"middle\" font-size=\"10.4\" fill=\"currentColor\">El contrato menor se tramita normalmente con un único ADO, o incluso ADOP, porque no hay licitación que separe la A de la D.</text></svg><div class=\"box ej\"><span class=\"lbl\">Las tres equivalencias que hay que memorizar</span><ul><li><b>Aprobar el expediente</b> (art. 117.1 LCSP) <b>=</b> autorizar el gasto, <b>fase A</b> (art. 54 RD 500/1990). Acto <b>interno</b>, cuantía cierta <b>o aproximada</b>.</li><li><b>Adjudicar</b> (arts. 150 y 151 LCSP) <b>=</b> comprometer el gasto, <b>fase D</b> (art. 56 RD 500/1990). Acto con relevancia <b>frente a terceros</b>, importe <b>exactamente determinado</b>.</li><li><b>Certificación u factura conformada tras la recepción</b> (arts. 198 y 210 LCSP) <b>=</b> reconocer la obligación, <b>fase O</b> (arts. 58 y 59 RD 500/1990). Nace un crédito <b>exigible</b>.</li></ul></div></section><section class=\"card\" id=\"tipos\"><h2>Los seis supuestos, de un vistazo</h2><p class=\"small\">Antes de entrar, quédate con qué hace especial a cada tipo. Todo lo demás es común.</p><svg viewBox=\"0 0 960 342\" role=\"img\" aria-label=\"Comparación de los seis tipos de contrato y sus especialidades en el ciclo del gasto\" style=\"width:100%;height:auto\"><defs><marker id=\"fl_g3\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr_g3\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe_g3\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw_g3\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"250\" y=\"8\" width=\"460\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"27.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">LOS SEIS SUPUESTOS, DE UN VISTAZO</text><rect x=\"20\" y=\"52\" width=\"141.667\" height=\"236\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"90.8333\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--acc)\">1 · OBRAS</text><text x=\"90.8333\" y=\"106\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Proyecto, supervisión</text><text x=\"90.8333\" y=\"121\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">y replanteo previos</text><text x=\"90.8333\" y=\"136\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"90.8333\" y=\"151\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Certificaciones</text><text x=\"90.8333\" y=\"166\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">MENSUALES</text><text x=\"90.8333\" y=\"181\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"90.8333\" y=\"196\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Recepción + garantía</text><text x=\"90.8333\" y=\"211\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">mínima de UN AÑO</text><text x=\"90.8333\" y=\"226\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"90.8333\" y=\"241\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Certificación final en</text><text x=\"90.8333\" y=\"256\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">3 meses desde la</text><text x=\"90.8333\" y=\"271\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">recepción</text><rect x=\"175.667\" y=\"52\" width=\"141.667\" height=\"236\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"246.5\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--warn)\">2 · CONCESIÓN</text><text x=\"246.5\" y=\"91\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--warn)\">DE OBRAS</text><text x=\"246.5\" y=\"106\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Estudio de viabilidad</text><text x=\"246.5\" y=\"121\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">previo</text><text x=\"246.5\" y=\"136\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"246.5\" y=\"151\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">RIESGO OPERACIONAL</text><text x=\"246.5\" y=\"166\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">del concesionario</text><text x=\"246.5\" y=\"181\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"246.5\" y=\"196\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Aportación pública</text><text x=\"246.5\" y=\"211\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">posible: subvención o</text><text x=\"246.5\" y=\"226\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">préstamo reintegrable</text><text x=\"246.5\" y=\"241\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"246.5\" y=\"256\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Hasta 40 años</text><rect x=\"331.333\" y=\"52\" width=\"141.667\" height=\"236\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"402.167\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--warn)\">3 · CONCESIÓN</text><text x=\"402.167\" y=\"91\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--warn)\">DE SERVICIOS</text><text x=\"402.167\" y=\"106\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Riesgo operacional</text><text x=\"402.167\" y=\"121\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"402.167\" y=\"136\" text-anchor=\"middle\" font-size=\"9.3\" fill=\"currentColor\">Tarifas de los usuarios:</text><text x=\"402.167\" y=\"151\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">prestación patrimonial</text><text x=\"402.167\" y=\"166\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">pública no tributaria</text><text x=\"402.167\" y=\"181\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"402.167\" y=\"196\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Puede haber canon a</text><text x=\"402.167\" y=\"211\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">favor de la entidad</text><text x=\"402.167\" y=\"226\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"402.167\" y=\"241\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">25 años; 10 si es</text><text x=\"402.167\" y=\"256\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">sanitario</text><rect x=\"487\" y=\"52\" width=\"141.667\" height=\"236\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"557.833\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--ej)\">4 · SERVICIOS</text><text x=\"557.833\" y=\"106\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Informe de</text><text x=\"557.833\" y=\"121\" text-anchor=\"middle\" font-size=\"9.3\" fill=\"currentColor\">INSUFICIENCIA DE MEDIOS</text><text x=\"557.833\" y=\"136\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"557.833\" y=\"151\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Tracto sucesivo:</text><text x=\"557.833\" y=\"166\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">factura mensual</text><text x=\"557.833\" y=\"181\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">conformada</text><text x=\"557.833\" y=\"196\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"557.833\" y=\"211\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Máximo 5 años</text><text x=\"557.833\" y=\"226\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">incluidas prórrogas</text><rect x=\"642.667\" y=\"52\" width=\"141.667\" height=\"236\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"713.5\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--ej)\">5 · SUMINISTROS</text><text x=\"713.5\" y=\"106\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Entrega y recepción</text><text x=\"713.5\" y=\"121\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">formal</text><text x=\"713.5\" y=\"136\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"713.5\" y=\"151\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Acto formal y positivo</text><text x=\"713.5\" y=\"166\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">dentro del mes</text><text x=\"713.5\" y=\"181\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">siguiente a la entrega</text><text x=\"713.5\" y=\"196\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"713.5\" y=\"211\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Plazo de garantía</text><text x=\"713.5\" y=\"226\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">desde la recepción</text><rect x=\"798.333\" y=\"52\" width=\"141.667\" height=\"236\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"869.167\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--exc)\">6 · CONTRATO</text><text x=\"869.167\" y=\"91\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--exc)\">MENOR</text><text x=\"869.167\" y=\"106\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">&lt; 40.000 € obras</text><text x=\"869.167\" y=\"121\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">&lt; 15.000 € suministros</text><text x=\"869.167\" y=\"136\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">y servicios</text><text x=\"869.167\" y=\"151\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"869.167\" y=\"166\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Informe, aprobación</text><text x=\"869.167\" y=\"181\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">del gasto y factura</text><text x=\"869.167\" y=\"196\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"869.167\" y=\"211\" text-anchor=\"middle\" font-size=\"9.3\" fill=\"currentColor\">SIN intervención previa</text><text x=\"869.167\" y=\"226\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"869.167\" y=\"241\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Un año, sin prórroga</text><text x=\"869.167\" y=\"256\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"869.167\" y=\"271\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Publicidad trimestral</text><rect x=\"20\" y=\"298\" width=\"920\" height=\"34\" rx=\"8\" fill=\"var(--panel)\" stroke=\"var(--line)\"/><text x=\"480\" y=\"318.328\" text-anchor=\"middle\" font-size=\"10.4\" fill=\"currentColor\">Todos recorren el mismo esqueleto RC → A → D → O → P. Lo que cambia es CÓMO se acredita la prestación en la fase O y qué trámites previos exige cada tipo.</text></svg></section>";

<script>
document.getElementById('main').innerHTML+="<section class=\"card\" id=\"s1\"><h2>Supuesto 1 · Contrato de obras</h2><div class=\"box\"><span class=\"lbl\">Enunciado</span>El <b>Ayuntamiento de Alhaurín de la Torre</b> va a contratar la <b>reforma del centro de día municipal</b>. El presupuesto base de licitación asciende a <b>726.000 € IVA incluido</b> (600.000 € de base y 126.000 € de IVA). El plazo de ejecución es de <b>ocho meses</b> y la obra se ejecuta íntegramente dentro del mismo ejercicio presupuestario. La obra se adjudica finalmente por <b>540.000 € más IVA</b>.</div><details class=\"panel\" open><summary><b>El ciclo del gasto en este contrato</b></summary><div class=\"body\"><table class=\"t\"><thead><tr><th>Trámite</th><th>Fase</th><th>Artículo</th></tr></thead><tbody><tr><td>Informe de necesidad e idoneidad</td><td><b>—</b></td><td>art. 28.1 LCSP</td></tr><tr><td>Redacción del proyecto, informe de supervisión y aprobación del proyecto</td><td><b>—</b></td><td>arts. 231 y 235 LCSP</td></tr><tr><td>Acta de replanteo del proyecto</td><td><b>—</b></td><td>art. 236 LCSP</td></tr><tr><td>Resolución de inicio del expediente, publicada en el perfil de contratante</td><td><b>—</b></td><td>art. 116.1 LCSP</td></tr><tr><td>Certificado de existencia de crédito</td><td><b>RC</b></td><td>art. 116.3 LCSP y art. 31 RD 500/1990</td></tr><tr><td>Fiscalización previa de la Intervención</td><td><b>—</b></td><td>art. 214 TRLHL</td></tr><tr><td>Resolución que aprueba el expediente, abre el procedimiento y aprueba el gasto</td><td><b>A</b></td><td>art. 117.1 LCSP y art. 54 RD 500/1990</td></tr><tr><td>Licitación, mesa de contratación y clasificación de ofertas</td><td><b>—</b></td><td>arts. 157 y 150 LCSP</td></tr><tr><td>Constitución de la garantía definitiva y adjudicación</td><td><b>D</b></td><td>arts. 107 y 150 LCSP y art. 56 RD 500/1990</td></tr><tr><td>Formalización del contrato</td><td><b>—</b></td><td>arts. 36.1 y 153 LCSP</td></tr><tr><td>Certificación mensual de obra, conformada</td><td><b>O</b></td><td>arts. 240 y 198 LCSP y art. 58 RD 500/1990</td></tr><tr><td>Orden de pago del presidente y pago material</td><td><b>P</b></td><td>arts. 186 y 187 TRLHL</td></tr><tr><td>Recepción, plazo de garantía y devolución de la garantía definitiva</td><td><b>—</b></td><td>art. 243 LCSP</td></tr></tbody></table></div></details><p class=\"small\" style=\"margin-top:.8rem\">Responde las diez preguntas y comprueba después cada una. Si fallas más de tres, vuelve a la tabla de arriba antes de seguir.</p><div class=\"box\"><span class=\"lbl\">Pregunta 1</span>El Ayuntamiento va a contratar la reforma. Con carácter previo a iniciar el expediente debe constar un informe que determine con precisión la naturaleza y extensión de las necesidades. Ese informe es el de:<div style=\"margin-left:.9rem\">a) Necesidad e idoneidad del contrato</div><div style=\"margin-left:.9rem\">b) Insuficiencia de medios</div><div style=\"margin-left:.9rem\">c) Supervisión del proyecto</div><div style=\"margin-left:.9rem\">d) Fiscalización previa</div></div><details class=\"panel\"><summary>Respuesta razonada</summary><div class=\"body\"><b>a) Correcta.</b> El art. <b>28.1 LCSP</b> exige determinar con precisión la naturaleza y extensión de las necesidades y la idoneidad del objeto, dejando constancia en la documentación preparatoria <b>antes</b> de iniciar el procedimiento.<br><b>b)</b> El informe de insuficiencia de medios solo se exige en los contratos de <b>servicios</b> (art. 116.4.f).<br><b>c)</b> La supervisión es un informe <b>técnico sobre el proyecto</b> (art. 235), no sobre la necesidad.<br><b>d)</b> La fiscalización previa la hace la <b>Intervención</b> y es posterior, sobre el expediente ya formado.</div></details><div class=\"box\"><span class=\"lbl\">Pregunta 2</span>El presupuesto base de licitación es de <b>726.000 € IVA incluido</b>. La base imponible es, por tanto, de 600.000 €. Antes de aprobar el proyecto, el informe de la oficina de supervisión:<div style=\"margin-left:.9rem\">a) Es preceptivo, porque el presupuesto base de licitación es igual o superior a 500.000 € IVA excluido</div><div style=\"margin-left:.9rem\">b) Es facultativo, porque no llega al millón de euros</div><div style=\"margin-left:.9rem\">c) No procede en los contratos de obras</div><div style=\"margin-left:.9rem\">d) Solo se pide si lo acuerda el Pleno</div></div><details class=\"panel\"><summary>Respuesta razonada</summary><div class=\"body\"><b>a) Correcta.</b> El art. <b>235 LCSP</b>: antes de aprobar el proyecto, cuando el presupuesto base de licitación sea <b>igual o superior a 500.000 €, IVA excluido</b>, el informe de supervisión es <b>preceptivo</b>. Aquí la base son 600.000 €.<br><b>b)</b> El umbral no es de un millón: son 500.000 € sin IVA.<br><b>c)</b> Al contrario: la supervisión es propia de los contratos de obras.<br><b>d)</b> No depende de acuerdo alguno: lo impone la ley.</div></details><div class=\"box\"><span class=\"lbl\">Pregunta 3</span>El replanteo del proyecto consiste en comprobar:<div style=\"margin-left:.9rem\">a) La realidad geométrica de la obra y la disponibilidad de los terrenos</div><div style=\"margin-left:.9rem\">b) La solvencia económica de las empresas licitadoras</div><div style=\"margin-left:.9rem\">c) La existencia de crédito en la aplicación presupuestaria</div><div style=\"margin-left:.9rem\">d) El cumplimiento del convenio colectivo por el contratista</div></div><details class=\"panel\"><summary>Respuesta razonada</summary><div class=\"body\"><b>a) Correcta.</b> Art. <b>236.1 LCSP</b>. Y se hace <b>aprobado el proyecto y previamente a la aprobación del expediente</b> de contratación.<br><b>b)</b> La solvencia se acredita en la licitación (art. 74).<br><b>c)</b> Eso lo acredita el <b>certificado de existencia de crédito</b> (art. 116.3).<br><b>d)</b> Es una obligación del contratista durante la ejecución, ajena al replanteo.</div></details><div class=\"box\"><span class=\"lbl\">Pregunta 4</span>El certificado de existencia de crédito que se une al expediente se corresponde con la fase de:<div style=\"margin-left:.9rem\">a) Retención de crédito (RC)</div><div style=\"margin-left:.9rem\">b) Autorización (A)</div><div style=\"margin-left:.9rem\">c) Disposición (D)</div><div style=\"margin-left:.9rem\">d) Ordenación del pago (P)</div></div><details class=\"panel\"><summary>Respuesta razonada</summary><div class=\"body\"><b>a) Correcta.</b> El art. <b>31 del RD 500/1990</b> define la retención de crédito como la certificación de existencia de saldo suficiente, que produce por el mismo importe una <b>reserva</b> para ese gasto.<br><b>b)</b> La autorización llega después, al aprobar el expediente.<br><b>c)</b> La disposición se produce con la adjudicación.<br><b>d)</b> La ordenación del pago es la última fase, ya en ejecución.</div></details><div class=\"box\"><span class=\"lbl\">Pregunta 5</span>La resolución que aprueba el expediente de contratación y dispone la apertura del procedimiento de adjudicación:<div style=\"margin-left:.9rem\">a) Implica también la aprobación del gasto y debe publicarse en el perfil de contratante</div><div style=\"margin-left:.9rem\">b) Requiere siempre un acuerdo separado de aprobación del gasto</div><div style=\"margin-left:.9rem\">c) No necesita publicarse</div><div style=\"margin-left:.9rem\">d) Corresponde en todo caso al Pleno de la corporación</div></div><details class=\"panel\"><summary>Respuesta razonada</summary><div class=\"body\"><b>a) Correcta.</b> Art. <b>117.1 LCSP</b>. Esa aprobación del gasto es la <b>fase A</b> del art. 54 del RD 500/1990: acto interno, por cuantía cierta o aproximada.<br><b>b)</b> La regla general es justo la contraria: un solo acto.<br><b>c)</b> El art. 117.1 exige expresamente su publicación en el perfil.<br><b>d)</b> Corresponde al <b>órgano de contratación</b>, que en la entidad local puede ser el alcalde, la Junta de Gobierno por delegación o el Pleno según la cuantía (disposición adicional segunda).</div></details><div class=\"box\"><span class=\"lbl\">Pregunta 6</span>La obra se adjudica por 540.000 € más IVA. El acto de adjudicación constituye la fase de:<div style=\"margin-left:.9rem\">a) Disposición o compromiso del gasto (D)</div><div style=\"margin-left:.9rem\">b) Autorización (A)</div><div style=\"margin-left:.9rem\">c) Reconocimiento de la obligación (O)</div><div style=\"margin-left:.9rem\">d) Retención de crédito (RC)</div></div><details class=\"panel\"><summary>Respuesta razonada</summary><div class=\"body\"><b>a) Correcta.</b> El art. <b>56 del RD 500/1990</b>: la disposición es el acto por el que se acuerda con un <b>tercero</b> la realización del gasto por un importe <b>exactamente determinado</b>. Eso es lo que ocurre al adjudicar (arts. 150 y 151 LCSP).<br><b>b)</b> La autorización ya se produjo al aprobar el expediente.<br><b>c)</b> El reconocimiento de la obligación exige que la prestación se haya realizado.<br><b>d)</b> La retención es previa a todo.</div></details><div class=\"box\"><span class=\"lbl\">Pregunta 7</span>Adjudicada la obra en 540.000 € más IVA, la garantía definitiva que debe constituir el adjudicatario asciende a:<div style=\"margin-left:.9rem\">a) 27.000 €</div><div style=\"margin-left:.9rem\">b) 32.670 €</div><div style=\"margin-left:.9rem\">c) 36.300 €</div><div style=\"margin-left:.9rem\">d) 30.000 €</div></div><details class=\"panel\"><summary>Respuesta razonada</summary><div class=\"body\"><b>a) Correcta.</b> El art. <b>107.1 LCSP</b> fija la garantía definitiva en el <b>5 % del precio final ofertado, excluido el IVA</b>: 5 % de 540.000 = <b>27.000 €</b>.<br><b>b)</b> Sería el 5 % del precio <b>con</b> IVA (653.400 €). La base de cálculo excluye el IVA.<br><b>c)</b> Sería el 5 % del presupuesto base de licitación con IVA. La base es el precio <b>ofertado</b>.<br><b>d)</b> Sería el 5 % del presupuesto base sin IVA, no del precio adjudicado.<br><b>Y recuerda:</b> en los contratos de <b>obras</b> el órgano de contratación <b>nunca</b> puede eximir de la garantía definitiva (art. 107.1).</div></details><div class=\"box\"><span class=\"lbl\">Pregunta 8</span>Durante la ejecución, las certificaciones de obra se expiden:<div style=\"margin-left:.9rem\">a) Mensualmente, en los diez primeros días siguientes al mes al que correspondan</div><div style=\"margin-left:.9rem\">b) Trimestralmente, junto con la publicación en el perfil de contratante</div><div style=\"margin-left:.9rem\">c) Una sola vez, al terminar la obra</div><div style=\"margin-left:.9rem\">d) Cuando lo solicite el contratista, sin plazo</div></div><details class=\"panel\"><summary>Respuesta razonada</summary><div class=\"body\"><b>a) Correcta.</b> Art. <b>240.1 LCSP</b>, salvo prevención en contrario en el pliego. Sus abonos tienen el concepto de <b>pagos a cuenta</b>, sujetos a las rectificaciones de la medición final.<br><b>b)</b> Lo trimestral es la publicación de los <b>contratos menores</b> (art. 63.4).<br><b>c)</b> Al terminar se aprueba la <b>certificación final</b>, distinta de las mensuales.<br><b>d)</b> La ley fija el plazo: no queda a instancia de parte.</div></details><div class=\"box\"><span class=\"lbl\">Pregunta 9</span>Aprobada y conformada la certificación mensual, la Administración debe abonar el precio en el plazo de:<div style=\"margin-left:.9rem\">a) Treinta días siguientes a la aprobación de la certificación</div><div style=\"margin-left:.9rem\">b) Quince días hábiles</div><div style=\"margin-left:.9rem\">c) Dos meses</div><div style=\"margin-left:.9rem\">d) Sesenta días</div></div><details class=\"panel\"><summary>Respuesta razonada</summary><div class=\"body\"><b>a) Correcta.</b> Art. <b>198.4 LCSP</b>. Si se demora, debe abonar <b>intereses de demora</b> y la indemnización por costes de cobro de la Ley 3/2004 <i>(norma externa)</i>. Antes de ese pago hay que reconocer la obligación —<b>fase O</b>— y expedir la orden de pago —<b>fase P</b>—.<br><b>b)</b> Quince días hábiles es el plazo de espera antes de formalizar cuando cabe recurso especial (art. 153.3).<br><b>c)</b> Dos meses es el plazo máximo para adjudicar con pluralidad de criterios (art. 158.2).<br><b>d)</b> Sesenta días es el plazo para devolver la garantía y liquidar tras el informe favorable de la garantía (art. 243.3).</div></details><div class=\"box\"><span class=\"lbl\">Pregunta 10</span>Recibida la obra, el plazo de garantía que fije el pliego de cláusulas administrativas particulares:<div style=\"margin-left:.9rem\">a) No podrá ser inferior a un año, salvo casos especiales</div><div style=\"margin-left:.9rem\">b) Será siempre de seis meses</div><div style=\"margin-left:.9rem\">c) No existe en el contrato de obras</div><div style=\"margin-left:.9rem\">d) Lo fija libremente el contratista</div></div><details class=\"panel\"><summary>Respuesta razonada</summary><div class=\"body\"><b>a) Correcta.</b> Art. <b>243.3 LCSP</b>. Dentro de los <b>quince días anteriores</b> a su cumplimiento, el director facultativo redacta un informe; si es favorable, se devuelve la garantía y se liquida el contrato en el plazo de <b>sesenta días</b>.<br><b>b)</b> No hay un plazo fijo de seis meses: hay un <b>mínimo</b> de un año.<br><b>c)</b> Existe y es una de las notas propias del contrato de obras.<br><b>d)</b> Lo fija el <b>PCAP</b>, atendiendo a la naturaleza y complejidad de la obra.</div></details></section>";
</script>
<script>
document.getElementById('main').innerHTML+="<section class=\"card\" id=\"s2\"><h2>Supuesto 2 · Contrato de concesión de obras</h2><div class=\"box\"><span class=\"lbl\">Enunciado</span>La <b>Diputación Provincial de Málaga</b> quiere <b>construir y explotar un aparcamiento subterráneo</b> bajo un recinto de su titularidad. El concesionario financiará la obra y la explotará <b>cobrando una tarifa a los usuarios</b> durante <b>treinta años</b>. Como la obra tiene interés social, la diputación decide <b>aportar 500.000 €</b> a su construcción, cantidad que figura en el pliego como cuantía máxima.</div><details class=\"panel\" open><summary><b>El ciclo del gasto en este contrato</b></summary><div class=\"body\"><table class=\"t\"><thead><tr><th>Trámite</th><th>Fase</th><th>Artículo</th></tr></thead><tbody><tr><td>Estudio de viabilidad de las obras</td><td><b>—</b></td><td>art. 247.1 LCSP</td></tr><tr><td>Anteproyecto o proyecto y pliegos</td><td><b>—</b></td><td>arts. 248 y 250 LCSP</td></tr><tr><td>Resolución de inicio del expediente, publicada en el perfil</td><td><b>—</b></td><td>art. 116.1 LCSP</td></tr><tr><td>Certificado de existencia de crédito de la aportación municipal</td><td><b>RC</b></td><td>art. 116.3 LCSP y art. 31 RD 500/1990</td></tr><tr><td>Compromiso de gasto plurianual, si la aportación se reparte en varios años</td><td><b>—</b></td><td>art. 174 TRLHL</td></tr><tr><td>Fiscalización previa</td><td><b>—</b></td><td>art. 214 TRLHL</td></tr><tr><td>Aprobación del expediente y del gasto por la cuantía máxima del pliego</td><td><b>A</b></td><td>art. 117.1 LCSP y art. 54 RD 500/1990</td></tr><tr><td>Adjudicación: la aportación queda fijada en el importe ofertado</td><td><b>D</b></td><td>arts. 150, 151 y 266.1 LCSP</td></tr><tr><td>Formalización</td><td><b>—</b></td><td>arts. 36.1 y 153 LCSP</td></tr><tr><td>Abono de la aportación conforme al pliego, previa acreditación</td><td><b>O</b></td><td>art. 266.1 LCSP y art. 58 RD 500/1990</td></tr><tr><td>Orden de pago y pago material</td><td><b>P</b></td><td>arts. 186 y 187 TRLHL</td></tr><tr><td>Explotación por el concesionario y reversión final de la obra</td><td><b>—</b></td><td>arts. 14 y 265 LCSP</td></tr></tbody></table></div></details><p class=\"small\" style=\"margin-top:.8rem\">Responde las diez preguntas y comprueba después cada una. Si fallas más de tres, vuelve a la tabla de arriba antes de seguir.</p><div class=\"box\"><span class=\"lbl\">Pregunta 1</span>Con carácter previo a la decisión misma de construir y explotar unas obras en régimen de concesión, la Administración debe acordar la realización de:<div style=\"margin-left:.9rem\">a) Un estudio de viabilidad</div><div style=\"margin-left:.9rem\">b) Un plan estratégico de subvenciones</div><div style=\"margin-left:.9rem\">c) Un informe de insuficiencia de medios</div><div style=\"margin-left:.9rem\">d) Un anticipo de caja fija</div></div><details class=\"panel\"><summary>Respuesta razonada</summary><div class=\"body\"><b>a) Correcta.</b> Art. <b>247.1 LCSP</b>: «con carácter previo a la decisión de construir y explotar en régimen de concesión unas obras, el órgano que corresponda acordará la realización de un <b>estudio de viabilidad</b>».<br><b>b)</b> El plan estratégico es propio de las <b>subvenciones</b> (art. 8.1 de la Ley 38/2003).<br><b>c)</b> El informe de insuficiencia de medios es propio de los contratos de <b>servicios</b>.<br><b>d)</b> El anticipo de caja fija es un sistema de <b>pago</b>, no un trámite preparatorio.</div></details><div class=\"box\"><span class=\"lbl\">Pregunta 2</span>En el contrato de concesión de obras, el riesgo operacional lo asume:<div style=\"margin-left:.9rem\">a) El concesionario, en todo caso</div><div style=\"margin-left:.9rem\">b) La Administración concedente</div><div style=\"margin-left:.9rem\">c) Los usuarios de la obra</div><div style=\"margin-left:.9rem\">d) Se reparte al 50 % entre ambas partes</div></div><details class=\"panel\"><summary>Respuesta razonada</summary><div class=\"body\"><b>a) Correcta.</b> Art. <b>265.1 LCSP</b>: las obras serán financiadas total o parcialmente por el concesionario, «que <b>en todo caso</b> asumirá el riesgo operacional».<br><b>b)</b> Si el riesgo lo asumiera la Administración, el negocio dejaría de ser una concesión.<br><b>c)</b> Los usuarios pagan la tarifa; no asumen el riesgo del negocio.<br><b>d)</b> La ley no prevé ese reparto por mitades.</div></details><div class=\"box\"><span class=\"lbl\">Pregunta 3</span>La retribución que abonan los usuarios por la utilización de las obras se denomina tarifa y tiene la naturaleza de:<div style=\"margin-left:.9rem\">a) Prestación patrimonial de carácter público no tributario</div><div style=\"margin-left:.9rem\">b) Tasa</div><div style=\"margin-left:.9rem\">c) Precio privado</div><div style=\"margin-left:.9rem\">d) Contribución especial</div></div><details class=\"panel\"><summary>Respuesta razonada</summary><div class=\"body\"><b>a) Correcta.</b> Art. <b>267.1 LCSP</b>, literal.<br><b>b)</b> No es una tasa: la percibe el <b>concesionario</b>, no la entidad local.<br><b>c)</b> Tampoco es un precio privado: la ley la califica expresamente como prestación patrimonial de carácter <b>público</b>.<br><b>d)</b> La contribución especial es un tributo local con hecho imponible distinto.</div></details><div class=\"box\"><span class=\"lbl\">Pregunta 4</span>Las tarifas que abonan los usuarios son fijadas:<div style=\"margin-left:.9rem\">a) Por el órgano de contratación en el acuerdo de adjudicación, y tienen carácter de máximas</div><div style=\"margin-left:.9rem\">b) Libremente por el concesionario</div><div style=\"margin-left:.9rem\">c) Por el Pleno mediante ordenanza fiscal</div><div style=\"margin-left:.9rem\">d) Por la Intervención al fiscalizar el expediente</div></div><details class=\"panel\"><summary>Respuesta razonada</summary><div class=\"body\"><b>a) Correcta.</b> Art. <b>267.2 LCSP</b>. Al ser <b>máximas</b>, el concesionario puede aplicar tarifas inferiores si lo estima conveniente.<br><b>b)</b> Solo puede bajarlas, no fijarlas libremente.<br><b>c)</b> La ordenanza fiscal es el cauce de las <b>tasas</b>, y esto no lo es.<br><b>d)</b> La Intervención fiscaliza; no fija tarifas.</div></details><div class=\"box\"><span class=\"lbl\">Pregunta 5</span>La aportación municipal de 500.000 € a la construcción de la obra:<div style=\"margin-left:.9rem\">a) Es posible siempre que se respete el principio de asunción del riesgo operacional por el concesionario</div><div style=\"margin-left:.9rem\">b) Está prohibida en las concesiones</div><div style=\"margin-left:.9rem\">c) Convierte automáticamente el contrato en un contrato de obras</div><div style=\"margin-left:.9rem\">d) Solo puede consistir en la entrega de bienes inmuebles</div></div><details class=\"panel\"><summary>Respuesta razonada</summary><div class=\"body\"><b>a) Correcta.</b> Art. <b>265.2 LCSP</b>: cuando existan razones de rentabilidad económica o social, la Administración podrá aportar recursos públicos en forma de <b>subvenciones o préstamos reintegrables</b>, «debiendo respetarse en todo caso el principio de asunción del riesgo operacional».<br><b>b)</b> No está prohibida: está condicionada.<br><b>c)</b> Solo cambiaría la calificación si desapareciera el riesgo operacional.<br><b>d)</b> El art. 266.2 admite aportaciones <b>no dinerarias</b>, pero no las impone como única forma.</div></details><div class=\"box\"><span class=\"lbl\">Pregunta 6</span>Esa aportación municipal de 500.000 €, desde el punto de vista presupuestario:<div style=\"margin-left:.9rem\">a) Es un gasto que recorre las fases RC, A, D, O y P</div><div style=\"margin-left:.9rem\">b) Es un ingreso de derecho público</div><div style=\"margin-left:.9rem\">c) No tiene reflejo presupuestario</div><div style=\"margin-left:.9rem\">d) Se contabiliza como una tasa</div></div><details class=\"panel\"><summary>Respuesta razonada</summary><div class=\"body\"><b>a) Correcta.</b> Es dinero que sale del presupuesto municipal: certificado de crédito (<b>RC</b>), aprobación del gasto (<b>A</b>), adjudicación (<b>D</b>), acreditación del avance de obra (<b>O</b>) y orden de pago (<b>P</b>).<br><b>b)</b> Ingreso sería el <b>canon</b>, si el pliego lo previera (art. 267.4 y 289.3).<br><b>c)</b> Todo gasto público tiene reflejo presupuestario.<br><b>d)</b> Las tasas son ingresos tributarios, no gastos.</div></details><div class=\"box\"><span class=\"lbl\">Pregunta 7</span>La duración máxima de un contrato de concesión de obras, incluidas las prórrogas, es de:<div style=\"margin-left:.9rem\">a) Cuarenta años</div><div style=\"margin-left:.9rem\">b) Veinticinco años</div><div style=\"margin-left:.9rem\">c) Diez años</div><div style=\"margin-left:.9rem\">d) Cinco años</div></div><details class=\"panel\"><summary>Respuesta razonada</summary><div class=\"body\"><b>a) Correcta.</b> Art. <b>29.6.a) LCSP</b>.<br><b>b)</b> Veinticinco años es el máximo de la <b>concesión de servicios</b> no sanitaria (29.6.b).<br><b>c)</b> Diez años, la concesión de servicios que comprenda servicios <b>sanitarios</b> (29.6.c).<br><b>d)</b> Cinco años es el límite de los <b>servicios y suministros</b> de prestación sucesiva (29.4).</div></details><div class=\"box\"><span class=\"lbl\">Pregunta 8</span>El importe de la garantía definitiva en un contrato de concesión de obras:<div style=\"margin-left:.9rem\">a) Lo fija en cada caso el órgano de contratación en el pliego, en función de la naturaleza, importancia y duración de la concesión</div><div style=\"margin-left:.9rem\">b) Es siempre el 5 % del precio ofertado sin IVA</div><div style=\"margin-left:.9rem\">c) Es siempre el 3 % del presupuesto base de licitación</div><div style=\"margin-left:.9rem\">d) No se exige nunca en las concesiones</div></div><details class=\"panel\"><summary>Respuesta razonada</summary><div class=\"body\"><b>a) Correcta.</b> Art. <b>107.4 LCSP</b>.<br><b>b)</b> El 5 % es la regla general de los demás contratos (art. 107.1).<br><b>c)</b> El 3 % del presupuesto base es el techo de la garantía <b>provisional</b> (art. 106.2).<br><b>d)</b> Sí se exige: lo que varía es su importe.</div></details><div class=\"box\"><span class=\"lbl\">Pregunta 9</span>Si el valor estimado de la concesión supera los seis millones de euros, el órgano de contratación en la entidad local es:<div style=\"margin-left:.9rem\">a) El Pleno de la corporación</div><div style=\"margin-left:.9rem\">b) El alcalde o presidente</div><div style=\"margin-left:.9rem\">c) La Junta de Gobierno Local, siempre</div><div style=\"margin-left:.9rem\">d) El interventor</div></div><details class=\"panel\"><summary>Respuesta razonada</summary><div class=\"body\"><b>a) Correcta.</b> Disposición adicional segunda, apartado 2: corresponde al <b>Pleno</b> cuando por su valor o duración no corresponda al alcalde o presidente.<br><b>b)</b> El alcalde es competente cuando el valor estimado no supere el <b>10 % de los recursos ordinarios</b> ni los <b>6.000.000 €</b> (apartado 1).<br><b>c)</b> La Junta de Gobierno solo lo es si tiene la competencia <b>delegada</b>.<br><b>d)</b> El interventor fiscaliza; nunca es órgano de contratación.</div></details><div class=\"box\"><span class=\"lbl\">Pregunta 10</span>Al extinguirse la concesión, las obras:<div style=\"margin-left:.9rem\">a) Revierten a la Administración concedente</div><div style=\"margin-left:.9rem\">b) Pasan a ser propiedad del concesionario</div><div style=\"margin-left:.9rem\">c) Se subastan entre los usuarios</div><div style=\"margin-left:.9rem\">d) Se derriban salvo acuerdo en contrario</div></div><details class=\"panel\"><summary>Respuesta razonada</summary><div class=\"body\"><b>a) Correcta.</b> La reversión es una nota característica de la concesión: la obra vuelve a la Administración en el estado de conservación y funcionamiento previsto en el pliego.<br><b>b)</b> El concesionario tiene el <b>derecho a explotar</b> la obra durante el plazo concesional, no su propiedad.<br><b>c) y d)</b> No tienen amparo legal alguno.</div></details></section>";
</script>
<script>
document.getElementById('main').innerHTML+="<section class=\"card\" id=\"s3\"><h2>Supuesto 3 · Contrato de concesión de servicios</h2><div class=\"box\"><span class=\"lbl\">Enunciado</span>El <b>Ayuntamiento de Ronda</b> saca a licitación la <b>explotación de la piscina cubierta municipal</b>, ya construida, por un plazo de <b>ocho años</b>. El concesionario cobrará <b>tarifas a los usuarios</b> y asumirá el personal y el mantenimiento. El pliego prevé además una <b>aportación municipal de 60.000 € anuales</b> destinada a los grupos de mayores y de personas con discapacidad, y un <b>canon de 12.000 € anuales</b> a favor del ayuntamiento por la explotación de la cafetería.</div><details class=\"panel\" open><summary><b>El ciclo del gasto en este contrato</b></summary><div class=\"body\"><table class=\"t\"><thead><tr><th>Trámite</th><th>Fase</th><th>Artículo</th></tr></thead><tbody><tr><td>Informe de necesidad y memoria justificativa</td><td><b>—</b></td><td>art. 28.1 LCSP</td></tr><tr><td>Pliegos, con las tarifas, su revisión y el canon</td><td><b>—</b></td><td>art. 285.1.b) LCSP</td></tr><tr><td>Resolución de inicio del expediente, publicada en el perfil</td><td><b>—</b></td><td>art. 116.1 LCSP</td></tr><tr><td>Certificado de existencia de crédito de la aportación del primer año</td><td><b>RC</b></td><td>art. 116.3 LCSP y art. 31 RD 500/1990</td></tr><tr><td>Compromiso de gasto plurianual por las anualidades siguientes</td><td><b>—</b></td><td>art. 174 TRLHL</td></tr><tr><td>Fiscalización previa</td><td><b>—</b></td><td>art. 214 TRLHL</td></tr><tr><td>Aprobación del expediente y del gasto</td><td><b>A</b></td><td>art. 117.1 LCSP y art. 54 RD 500/1990</td></tr><tr><td>Adjudicación y compromiso de todas las anualidades</td><td><b>D</b></td><td>arts. 150 y 151 LCSP y art. 56 RD 500/1990</td></tr><tr><td>Formalización e inicio de la explotación</td><td><b>—</b></td><td>arts. 36.1 y 153 LCSP</td></tr><tr><td>Factura de la aportación, conformada por el responsable del contrato</td><td><b>O</b></td><td>art. 62 LCSP y arts. 58 y 59 RD 500/1990</td></tr><tr><td>Orden de pago y pago material en treinta días</td><td><b>P</b></td><td>art. 198.4 LCSP y arts. 186 y 187 TRLHL</td></tr><tr><td>Liquidación anual del canon: es un ingreso, no un gasto</td><td><b>—</b></td><td>art. 289.3 LCSP</td></tr></tbody></table></div></details><p class=\"small\" style=\"margin-top:.8rem\">Responde las diez preguntas y comprueba después cada una. Si fallas más de tres, vuelve a la tabla de arriba antes de seguir.</p><div class=\"box\"><span class=\"lbl\">Pregunta 1</span>La duración máxima de un contrato de concesión de servicios que no comprenda servicios sanitarios es de:<div style=\"margin-left:.9rem\">a) Veinticinco años</div><div style=\"margin-left:.9rem\">b) Cuarenta años</div><div style=\"margin-left:.9rem\">c) Diez años</div><div style=\"margin-left:.9rem\">d) Cinco años</div></div><details class=\"panel\"><summary>Respuesta razonada</summary><div class=\"body\"><b>a) Correcta.</b> Art. <b>29.6.b) LCSP</b>.<br><b>b)</b> Cuarenta años es el máximo de la concesión de <b>obras</b> (29.6.a).<br><b>c)</b> Diez años, si comprende la explotación de un servicio <b>sanitario</b> (29.6.c).<br><b>d)</b> Cinco años es el límite de los <b>contratos de servicios</b> de prestación sucesiva (29.4), que es un contrato distinto.</div></details><div class=\"box\"><span class=\"lbl\">Pregunta 2</span>Las tarifas que los usuarios abonan al concesionario por el uso de la piscina:<div style=\"margin-left:.9rem\">a) Las percibe el concesionario y no son ingreso presupuestario del ayuntamiento</div><div style=\"margin-left:.9rem\">b) Se ingresan íntegramente en la tesorería municipal</div><div style=\"margin-left:.9rem\">c) Son una tasa municipal</div><div style=\"margin-left:.9rem\">d) Constituyen un gasto para el ayuntamiento</div></div><details class=\"panel\"><summary>Respuesta razonada</summary><div class=\"body\"><b>a) Correcta.</b> Son la contraprestación económica del concesionario y tienen la naturaleza de <b>prestación patrimonial de carácter público no tributario</b> (art. <b>289.2 LCSP</b>).<br><b>b)</b> Si las ingresara el ayuntamiento, el concesionario no soportaría el riesgo de la explotación.<br><b>c)</b> No son tasa: no las percibe la entidad local.<br><b>d)</b> El gasto del ayuntamiento es la <b>aportación</b>, no las tarifas.</div></details><div class=\"box\"><span class=\"lbl\">Pregunta 3</span>El canon de 12.000 € anuales que el concesionario abona al ayuntamiento por la explotación de la cafetería es:<div style=\"margin-left:.9rem\">a) Un ingreso del ayuntamiento</div><div style=\"margin-left:.9rem\">b) Un gasto del ayuntamiento</div><div style=\"margin-left:.9rem\">c) Una tarifa</div><div style=\"margin-left:.9rem\">d) Una garantía definitiva</div></div><details class=\"panel\"><summary>Respuesta razonada</summary><div class=\"body\"><b>a) Correcta.</b> El art. <b>289.3 LCSP</b> permite que el PCAP establezca un <b>canon o participación</b> a favor de la Administración concedente. Es dinero que <b>entra</b>, de modo que no recorre el ciclo del gasto sino el de los derechos.<br><b>b)</b> Justo lo contrario.<br><b>c)</b> Las tarifas las pagan los <b>usuarios</b> al concesionario.<br><b>d)</b> La garantía definitiva es una fianza, no un pago periódico.</div></details><div class=\"box\"><span class=\"lbl\">Pregunta 4</span>La aportación municipal de 60.000 € anuales vinculada a los usos sociales:<div style=\"margin-left:.9rem\">a) Es un gasto del ayuntamiento y recorre las fases RC, A, D, O y P</div><div style=\"margin-left:.9rem\">b) Es un ingreso de derecho público</div><div style=\"margin-left:.9rem\">c) Se paga con cargo al canon que abona el concesionario</div><div style=\"margin-left:.9rem\">d) No necesita crédito presupuestario</div></div><details class=\"panel\"><summary>Respuesta razonada</summary><div class=\"body\"><b>a) Correcta.</b> Es dinero que sale del presupuesto y sigue el circuito completo del gasto.<br><b>b)</b> Ingreso es el canon.<br><b>c)</b> Gastos e ingresos no se compensan: rige el principio de <b>presupuesto bruto</b>.<br><b>d)</b> Sin crédito no puede comprometerse gasto alguno.</div></details><div class=\"box\"><span class=\"lbl\">Pregunta 5</span>¿Dónde se fijan las condiciones de prestación del servicio, las tarifas, su revisión y el canon?<div style=\"margin-left:.9rem\">a) En los pliegos de cláusulas administrativas particulares y de prescripciones técnicas</div><div style=\"margin-left:.9rem\">b) En el acta de replanteo</div><div style=\"margin-left:.9rem\">c) En la factura mensual</div><div style=\"margin-left:.9rem\">d) En el informe de fiscalización</div></div><details class=\"panel\"><summary>Respuesta razonada</summary><div class=\"body\"><b>a) Correcta.</b> Art. <b>285.1.b) LCSP</b>.<br><b>b)</b> El acta de replanteo es propia del contrato de <b>obras</b> (art. 236).<br><b>c)</b> La factura documenta un pago concreto, no las condiciones del contrato.<br><b>d)</b> El informe de fiscalización controla, no regula.</div></details><div class=\"box\"><span class=\"lbl\">Pregunta 6</span>El contrato dura ocho años, de modo que la aportación municipal se extiende a varios ejercicios. Además del certificado de crédito del año en curso, hay que tramitar:<div style=\"margin-left:.9rem\">a) Un compromiso de gasto de carácter plurianual</div><div style=\"margin-left:.9rem\">b) Un crédito extraordinario</div><div style=\"margin-left:.9rem\">c) Un anticipo de caja fija</div><div style=\"margin-left:.9rem\">d) Una generación de crédito</div></div><details class=\"panel\"><summary>Respuesta razonada</summary><div class=\"body\"><b>a) Correcta.</b> Art. <b>174 TRLHL</b>. La ejecución debe iniciarse en el propio ejercicio y el contrato encaja en la letra b) de su apartado 2: contrato de tracto sucesivo que no puede estipularse por un año.<br><b>b)</b> El crédito extraordinario se tramita cuando <b>no existe crédito</b> para un gasto específico y determinado (art. 177.1 TRLHL).<br><b>c)</b> El anticipo de caja fija es un sistema de pago de gastos menores.<br><b>d)</b> La generación de crédito nace de <b>ingresos no tributarios</b> (art. 181 TRLHL).</div></details><div class=\"box\"><span class=\"lbl\">Pregunta 7</span>Con carácter general, el número de ejercicios a los que pueden aplicarse los gastos plurianuales de inversión no será superior a:<div style=\"margin-left:.9rem\">a) Cuatro</div><div style=\"margin-left:.9rem\">b) Dos</div><div style=\"margin-left:.9rem\">c) Ocho</div><div style=\"margin-left:.9rem\">d) Diez</div></div><details class=\"panel\"><summary>Respuesta razonada</summary><div class=\"body\"><b>a) Correcta.</b> Art. <b>174.3 TRLHL</b>. Y los porcentajes máximos del crédito del año en que se comprometió son <b>70 %</b> en el ejercicio inmediato siguiente, <b>60 %</b> en el segundo y <b>50 %</b> en el tercero y el cuarto.<br><b>b)</b> Dos no es ningún límite del art. 174 TRLHL.<br><b>c) y d)</b> El Pleno puede ampliar el número de anualidades en <b>casos excepcionales</b> (art. 174.5 TRLHL), pero la regla general son cuatro.</div></details><div class=\"box\"><span class=\"lbl\">Pregunta 8</span>La factura de la aportación, una vez conformada por el responsable del contrato, permite dictar el acuerdo de:<div style=\"margin-left:.9rem\">a) Reconocimiento de la obligación (fase O)</div><div style=\"margin-left:.9rem\">b) Autorización del gasto (fase A)</div><div style=\"margin-left:.9rem\">c) Retención de crédito (fase RC)</div><div style=\"margin-left:.9rem\">d) Disposición del gasto (fase D)</div></div><details class=\"panel\"><summary>Respuesta razonada</summary><div class=\"body\"><b>a) Correcta.</b> El art. <b>58 del RD 500/1990</b> define el reconocimiento de la obligación como el acto por el que se declara la existencia de un <b>crédito exigible</b>. Y el art. 59.1 exige acreditar previamente la <b>realización de la prestación</b>: eso hace la conformidad.<br><b>b) y c)</b> Ya se produjeron antes de licitar.<br><b>d)</b> Se produjo con la adjudicación.</div></details><div class=\"box\"><span class=\"lbl\">Pregunta 9</span>En la entidad local, ¿a quién competen las funciones de ordenación de pagos?<div style=\"margin-left:.9rem\">a) Al presidente de la entidad local</div><div style=\"margin-left:.9rem\">b) Al interventor</div><div style=\"margin-left:.9rem\">c) Al tesorero</div><div style=\"margin-left:.9rem\">d) Al Pleno</div></div><details class=\"panel\"><summary>Respuesta razonada</summary><div class=\"body\"><b>a) Correcta.</b> Art. <b>186.1 TRLHL</b>. La expedición de las órdenes de pago debe acomodarse al <b>plan de disposición de fondos</b> (art. 187 TRLHL).<br><b>b)</b> El interventor fiscaliza el pago, pero no lo ordena.<br><b>c)</b> El tesorero materializa el pago; no lo ordena.<br><b>d)</b> El Pleno aprueba el presupuesto, no ordena pagos.</div></details><div class=\"box\"><span class=\"lbl\">Pregunta 10</span>Si el ayuntamiento, por razones de interés público, modificara las tarifas del servicio y esa modificación afectara al régimen financiero del contrato:<div style=\"margin-left:.9rem\">a) Deberá restablecerse el equilibrio económico del contrato</div><div style=\"margin-left:.9rem\">b) El concesionario no tendrá derecho a nada</div><div style=\"margin-left:.9rem\">c) El contrato quedará automáticamente resuelto</div><div style=\"margin-left:.9rem\">d) Deberá convocarse una nueva licitación</div></div><details class=\"panel\"><summary>Respuesta razonada</summary><div class=\"body\"><b>a) Correcta.</b> Art. <b>290.2 y 290.4.a) LCSP</b>: cuando las modificaciones afecten al régimen financiero, debe compensarse a la parte correspondiente para mantener el equilibrio de los supuestos económicos considerados básicos en la adjudicación. Si la compensación es económica, se abre un <b>nuevo ciclo de gasto</b>.<br><b>b)</b> Solo si los acuerdos <b>carecen de trascendencia económica</b> (art. 290.3).<br><b>c)</b> La modificación no resuelve el contrato.<br><b>d)</b> Tampoco obliga a licitar de nuevo, salvo que la modificación excediera de lo permitido.</div></details></section>";
</script>

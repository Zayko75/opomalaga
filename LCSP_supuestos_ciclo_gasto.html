document.getElementById('main').innerHTML+="<section class=\"card\" id=\"s4\"><h2>Supuesto 4 · Contrato de servicios</h2><div class=\"box\"><span class=\"lbl\">Enunciado</span>El <b>Ayuntamiento de Vélez-Málaga</b> licita el <b>servicio de limpieza de nueve colegios públicos</b> por <b>dos años, prorrogables por otros dos</b>. El presupuesto base de licitación anual asciende a <b>121.000 € IVA incluido</b> (100.000 € de base y 21.000 € de IVA). El único criterio de adjudicación es el precio. El contrato se adjudica por <b>92.000 € anuales sin IVA</b>.</div><details class=\"panel\" open><summary><b>El ciclo del gasto en este contrato</b></summary><div class=\"body\"><table class=\"t\"><thead><tr><th>Trámite</th><th>Fase</th><th>Artículo</th></tr></thead><tbody><tr><td>Informe de necesidad e idoneidad</td><td><b>—</b></td><td>art. 28.1 LCSP</td></tr><tr><td>Informe de insuficiencia de medios</td><td><b>—</b></td><td>art. 116.4.f) LCSP</td></tr><tr><td>Resolución de inicio del expediente, publicada en el perfil</td><td><b>—</b></td><td>art. 116.1 LCSP</td></tr><tr><td>Certificado de existencia de crédito y compromiso plurianual</td><td><b>RC</b></td><td>art. 116.3 LCSP, art. 174 TRLHL y art. 31 RD 500/1990</td></tr><tr><td>Fiscalización previa</td><td><b>—</b></td><td>art. 214 TRLHL</td></tr><tr><td>Aprobación del expediente, apertura del procedimiento y del gasto</td><td><b>A</b></td><td>art. 117.1 LCSP y art. 54 RD 500/1990</td></tr><tr><td>Anuncio en el perfil y presentación de ofertas</td><td><b>—</b></td><td>arts. 135.1 y 159.3 LCSP</td></tr><tr><td>Apertura de proposiciones y clasificación</td><td><b>—</b></td><td>arts. 157 y 150.1 LCSP</td></tr><tr><td>Requerimiento de diez días hábiles y garantía definitiva del 5 %</td><td><b>—</b></td><td>arts. 150.2 y 107.1 LCSP</td></tr><tr><td>Adjudicación en cinco días hábiles y publicación en quince días</td><td><b>D</b></td><td>arts. 150.3 y 151.1 LCSP y art. 56 RD 500/1990</td></tr><tr><td>Formalización</td><td><b>—</b></td><td>arts. 36.1 y 153 LCSP</td></tr><tr><td>Factura mensual conformada por el responsable del contrato</td><td><b>O</b></td><td>arts. 62 y 198.4 LCSP y art. 58 RD 500/1990</td></tr><tr><td>Orden de pago y pago en treinta días</td><td><b>P</b></td><td>art. 198.4 LCSP y arts. 186 y 187 TRLHL</td></tr></tbody></table></div></details><p class=\"small\" style=\"margin-top:.8rem\">Responde las diez preguntas y comprueba después cada una. Si fallas más de tres, vuelve a la tabla de arriba antes de seguir.</p><div class=\"box\"><span class=\"lbl\">Pregunta 1</span>En el expediente de un contrato de servicios debe justificarse un informe que no se exige en obras ni en suministros. Es el informe de:<div style=\"margin-left:.9rem\">a) Insuficiencia de medios</div><div style=\"margin-left:.9rem\">b) Supervisión del proyecto</div><div style=\"margin-left:.9rem\">c) Viabilidad</div><div style=\"margin-left:.9rem\">d) Fiscalización plena</div></div><details class=\"panel\"><summary>Respuesta razonada</summary><div class=\"body\"><b>a) Correcta.</b> Art. <b>116.4.f) LCSP</b>: «en los contratos de servicios, el informe de insuficiencia de medios». Es la letra f) de las siete del art. 116.4.<br><b>b)</b> La supervisión es propia del contrato de <b>obras</b> (art. 235).<br><b>c)</b> El estudio de viabilidad es propio de la <b>concesión de obras</b> (art. 247).<br><b>d)</b> La fiscalización la realiza la Intervención y no es un contenido del art. 116.4.</div></details><div class=\"box\"><span class=\"lbl\">Pregunta 2</span>El contrato se licita por dos años, con dos prórrogas previstas de un año cada una, y un presupuesto anual de 100.000 € sin IVA. El valor estimado es:<div style=\"margin-left:.9rem\">a) 400.000 €</div><div style=\"margin-left:.9rem\">b) 200.000 €</div><div style=\"margin-left:.9rem\">c) 100.000 €</div><div style=\"margin-left:.9rem\">d) 484.000 €</div></div><details class=\"panel\"><summary>Respuesta razonada</summary><div class=\"body\"><b>a) Correcta.</b> El art. <b>101.2.a) LCSP</b> obliga a incluir «cualquier forma de opción eventual y las <b>eventuales prórrogas</b>»: 100.000 × 4 años = <b>400.000 €</b>.<br><b>b)</b> Sería el valor de los dos años iniciales, olvidando las prórrogas.<br><b>c)</b> Sería una sola anualidad.<br><b>d)</b> Incluye el IVA, que <b>nunca</b> entra en el valor estimado (art. 101.1.a).</div></details><div class=\"box\"><span class=\"lbl\">Pregunta 3</span>La duración total del contrato, prórrogas incluidas, es de cuatro años. Respecto del límite legal:<div style=\"margin-left:.9rem\">a) Es correcta: el máximo en servicios de prestación sucesiva es de cinco años, incluidas las prórrogas</div><div style=\"margin-left:.9rem\">b) Es incorrecta: el máximo es de dos años</div><div style=\"margin-left:.9rem\">c) Es correcta porque los contratos de servicios no tienen límite de duración</div><div style=\"margin-left:.9rem\">d) Es incorrecta: el máximo es de un año</div></div><details class=\"panel\"><summary>Respuesta razonada</summary><div class=\"body\"><b>a) Correcta.</b> Art. <b>29.4 LCSP</b>. Excepcionalmente cabe más si lo exige el período de recuperación de inversiones, justificándolo en el expediente.<br><b>b)</b> No hay tal límite de dos años.<br><b>c)</b> Sí lo tienen, y precisamente para someter periódicamente la prestación a concurrencia (art. 29.1).<br><b>d)</b> Un año, sin prórroga, es el límite del <b>contrato menor</b> (art. 29.8).</div></details><div class=\"box\"><span class=\"lbl\">Pregunta 4</span>Con un valor estimado de 400.000 €, contra los pliegos de este contrato de servicios:<div style=\"margin-left:.9rem\">a) Cabe recurso especial en materia de contratación, porque supera los 100.000 €</div><div style=\"margin-left:.9rem\">b) No cabe recurso especial, porque no llega a 3.000.000 €</div><div style=\"margin-left:.9rem\">c) Solo cabe recurso de reposición</div><div style=\"margin-left:.9rem\">d) No cabe recurso alguno</div></div><details class=\"panel\"><summary>Respuesta razonada</summary><div class=\"body\"><b>a) Correcta.</b> Art. <b>44.1.a) LCSP</b>: cabe en suministros y servicios de valor estimado <b>superior a 100.000 €</b>. Y los pliegos son acto recurrible (art. 44.2.a).<br><b>b)</b> Los 3.000.000 € son el umbral de <b>obras</b> y <b>concesiones</b>.<br><b>c)</b> Contra los actos susceptibles de recurso especial <b>no procede</b> recurso administrativo ordinario (art. 44.6).<br><b>d)</b> Siempre cabe alguna vía de impugnación.</div></details><div class=\"box\"><span class=\"lbl\">Pregunta 5</span>Como cabe recurso especial, la formalización del contrato:<div style=\"margin-left:.9rem\">a) No podrá efectuarse antes de que transcurran quince días hábiles desde que se remita la notificación de la adjudicación</div><div style=\"margin-left:.9rem\">b) Debe efectuarse el mismo día de la adjudicación</div><div style=\"margin-left:.9rem\">c) No podrá efectuarse antes de diez días hábiles</div><div style=\"margin-left:.9rem\">d) No está sujeta a plazo alguno</div></div><details class=\"panel\"><summary>Respuesta razonada</summary><div class=\"body\"><b>a) Correcta.</b> Art. <b>153.3 LCSP</b>. Transcurrido ese plazo, se requiere al adjudicatario para formalizar en plazo <b>no superior a cinco días</b>.<br><b>b)</b> Eso vaciaría de contenido el recurso especial: el contrato ya existiría.<br><b>c)</b> Diez días hábiles son los del requerimiento de documentación del art. 150.2.<br><b>d)</b> Sí lo está.</div></details><div class=\"box\"><span class=\"lbl\">Pregunta 6</span>El contrato se adjudica por 92.000 € anuales sin IVA, es decir, 368.000 € por los cuatro años. La garantía definitiva se calcula sobre:<div style=\"margin-left:.9rem\">a) El precio final ofertado, excluido el IVA</div><div style=\"margin-left:.9rem\">b) El presupuesto base de licitación, IVA incluido</div><div style=\"margin-left:.9rem\">c) El valor estimado del contrato</div><div style=\"margin-left:.9rem\">d) La anualidad corriente con IVA</div></div><details class=\"panel\"><summary>Respuesta razonada</summary><div class=\"body\"><b>a) Correcta.</b> Art. <b>107.1 LCSP</b>: el <b>5 % del precio final ofertado, excluido el IVA</b>.<br><b>b)</b> El presupuesto base es el techo de gasto, no la base de cálculo de la garantía.<br><b>c)</b> El valor estimado sirve para clasificar el contrato, no para calcular la garantía.<br><b>d)</b> Ni es una sola anualidad ni se incluye el IVA.</div></details><div class=\"box\"><span class=\"lbl\">Pregunta 7</span>Durante la ejecución, ¿qué documento acredita la prestación y permite reconocer la obligación cada mes?<div style=\"margin-left:.9rem\">a) La factura conformada por el responsable del contrato</div><div style=\"margin-left:.9rem\">b) La certificación mensual de obra</div><div style=\"margin-left:.9rem\">c) El acta de replanteo</div><div style=\"margin-left:.9rem\">d) El certificado de existencia de crédito</div></div><details class=\"panel\"><summary>Respuesta razonada</summary><div class=\"body\"><b>a) Correcta.</b> El art. <b>59.1 del RD 500/1990</b> exige acreditar documentalmente la <b>realización de la prestación</b> antes de reconocer la obligación, y en los servicios eso lo hace la conformidad de quien supervisa la ejecución: el <b>responsable del contrato</b> del art. 62 LCSP.<br><b>b)</b> Las certificaciones son propias del contrato de <b>obras</b> (art. 240).<br><b>c)</b> El acta de replanteo también es de obras.<br><b>d)</b> El certificado de crédito es previo y acredita que hay dinero, no que el servicio se haya prestado.</div></details><div class=\"box\"><span class=\"lbl\">Pregunta 8</span>Conformada la factura, la Administración debe abonar el precio en el plazo de:<div style=\"margin-left:.9rem\">a) Treinta días siguientes a la conformidad</div><div style=\"margin-left:.9rem\">b) Quince días</div><div style=\"margin-left:.9rem\">c) Dos meses</div><div style=\"margin-left:.9rem\">d) Tres meses</div></div><details class=\"panel\"><summary>Respuesta razonada</summary><div class=\"body\"><b>a) Correcta.</b> Art. <b>198.4 LCSP</b>. Y el contratista debe haber presentado la factura en el registro correspondiente en el plazo de <b>treinta días</b> desde la prestación del servicio para que empiece a devengarse el interés de demora.<br><b>b), c) y d)</b> No son plazos de pago del art. 198.4.</div></details><div class=\"box\"><span class=\"lbl\">Pregunta 9</span>Una de las ofertas presentadas resulta incursa en presunción de anormalidad. El órgano de contratación debe:<div style=\"margin-left:.9rem\">a) Requerir al licitador para que justifique y desglose el bajo nivel de los precios o costes</div><div style=\"margin-left:.9rem\">b) Excluirla automáticamente</div><div style=\"margin-left:.9rem\">c) Admitirla sin más trámite</div><div style=\"margin-left:.9rem\">d) Adjudicarle el contrato por ser la más barata</div></div><details class=\"panel\"><summary>Respuesta razonada</summary><div class=\"body\"><b>a) Correcta.</b> Art. <b>149.4 LCSP</b>. Solo si la justificación no explica satisfactoriamente el bajo nivel de los precios se excluye la oferta.<br><b>b)</b> La exclusión sin audiencia previa es nula.<br><b>c)</b> Tampoco: la presunción obliga a comprobar.<br><b>d)</b> Menos aún: hay que verificar antes que la oferta es viable.</div></details><div class=\"box\"><span class=\"lbl\">Pregunta 10</span>Si de esa justificación resulta que la oferta no cubre los costes salariales del convenio colectivo del sector, el órgano de contratación:<div style=\"margin-left:.9rem\">a) Deberá rechazar la oferta</div><div style=\"margin-left:.9rem\">b) Podrá admitirla si el licitador se compromete a cumplir el convenio</div><div style=\"margin-left:.9rem\">c) Deberá admitirla y exigir una garantía complementaria</div><div style=\"margin-left:.9rem\">d) Deberá elevar consulta a la Junta Consultiva</div></div><details class=\"panel\"><summary>Respuesta razonada</summary><div class=\"body\"><b>a) Correcta.</b> Art. <b>149.4 LCSP</b>: se rechazará la oferta cuando se compruebe que es anormalmente baja porque <b>vulnera la normativa sobre subcontratación</b> o <b>no cumple las obligaciones aplicables en materia medioambiental, social o laboral</b>, incluido el incumplimiento de los convenios colectivos sectoriales vigentes.<br><b>b)</b> El compromiso no sana la inviabilidad económica de la oferta.<br><b>c)</b> La garantía complementaria del art. 107.2 procede cuando la oferta anormal <b>se admite</b>, no cuando debe rechazarse.<br><b>d)</b> No hay consulta preceptiva en este trámite.</div></details></section>";
</script>
<script>
document.getElementById('main').innerHTML+="<section class=\"card\" id=\"s5\"><h2>Supuesto 5 · Contrato de suministro</h2><div class=\"box\"><span class=\"lbl\">Enunciado</span>La <b>Diputación Provincial de Málaga</b> licita el <b>suministro de 120 equipos informáticos</b> para sus centros comarcales. El presupuesto base de licitación es de <b>96.800 € IVA incluido</b> (80.000 € de base y 16.800 € de IVA) y el plazo de entrega, de <b>45 días</b> desde la formalización. El contrato se adjudica por <b>76.000 € sin IVA</b> y los equipos se entregan el 18 de mayo.</div><details class=\"panel\" open><summary><b>El ciclo del gasto en este contrato</b></summary><div class=\"body\"><table class=\"t\"><thead><tr><th>Trámite</th><th>Fase</th><th>Artículo</th></tr></thead><tbody><tr><td>Informe de necesidad e idoneidad</td><td><b>—</b></td><td>art. 28.1 LCSP</td></tr><tr><td>Resolución de inicio del expediente, publicada en el perfil</td><td><b>—</b></td><td>art. 116.1 LCSP</td></tr><tr><td>Certificado de existencia de crédito</td><td><b>RC</b></td><td>art. 116.3 LCSP y art. 31 RD 500/1990</td></tr><tr><td>Pliegos de cláusulas administrativas particulares y de prescripciones técnicas</td><td><b>—</b></td><td>arts. 122 y 124 LCSP</td></tr><tr><td>Fiscalización previa</td><td><b>—</b></td><td>art. 214 TRLHL</td></tr><tr><td>Aprobación del expediente, apertura del procedimiento y del gasto</td><td><b>A</b></td><td>art. 117.1 LCSP y art. 54 RD 500/1990</td></tr><tr><td>Licitación, apertura de proposiciones y clasificación</td><td><b>—</b></td><td>arts. 157 y 150.1 LCSP</td></tr><tr><td>Requerimiento de diez días hábiles y garantía definitiva del 5 %</td><td><b>—</b></td><td>arts. 150.2 y 107.1 LCSP</td></tr><tr><td>Adjudicación y publicación en el perfil en quince días</td><td><b>D</b></td><td>arts. 150.3 y 151.1 LCSP y art. 56 RD 500/1990</td></tr><tr><td>Formalización</td><td><b>—</b></td><td>arts. 36.1 y 153 LCSP</td></tr><tr><td>Entrega de los bienes en el tiempo y lugar fijados</td><td><b>—</b></td><td>art. 300.1 LCSP</td></tr><tr><td>Acto formal de recepción o conformidad dentro del mes siguiente</td><td><b>O</b></td><td>art. 210.2 LCSP y art. 58 RD 500/1990</td></tr><tr><td>Orden de pago y pago en treinta días</td><td><b>P</b></td><td>art. 198.4 LCSP y arts. 186 y 187 TRLHL</td></tr><tr><td>Plazo de garantía desde la recepción y devolución de la garantía definitiva</td><td><b>—</b></td><td>art. 210.3 LCSP</td></tr></tbody></table></div></details><p class=\"small\" style=\"margin-top:.8rem\">Responde las diez preguntas y comprueba después cada una. Si fallas más de tres, vuelve a la tabla de arriba antes de seguir.</p><div class=\"box\"><span class=\"lbl\">Pregunta 1</span>El valor estimado del contrato es de 80.000 €. Respecto del contrato menor:<div style=\"margin-left:.9rem\">a) No es un contrato menor, porque en suministros el umbral es de 15.000 € de valor estimado</div><div style=\"margin-left:.9rem\">b) Sí es un contrato menor, porque no llega a 40.000 €</div><div style=\"margin-left:.9rem\">c) Sí es un contrato menor, porque no llega a 100.000 €</div><div style=\"margin-left:.9rem\">d) No es un contrato menor, porque los suministros nunca pueden serlo</div></div><details class=\"panel\"><summary>Respuesta razonada</summary><div class=\"body\"><b>a) Correcta.</b> Art. <b>118.1 LCSP</b>: son contratos menores los de valor estimado <b>inferior a 40.000 €</b> en <b>obras</b> y <b>a 15.000 €</b> en <b>suministros o servicios</b>. Con 80.000 € no lo es.<br><b>b)</b> Los 40.000 € son el umbral de obras.<br><b>c)</b> Los 100.000 € son el umbral del <b>recurso especial</b> en suministros y servicios (art. 44.1.a).<br><b>d)</b> Sí pueden serlo, por debajo de 15.000 € de valor estimado.</div></details><div class=\"box\"><span class=\"lbl\">Pregunta 2</span>El certificado de existencia de crédito se une al expediente conforme al artículo:<div style=\"margin-left:.9rem\">a) 116.3 LCSP, junto con los pliegos y la fiscalización previa</div><div style=\"margin-left:.9rem\">b) 116.4 LCSP, junto con la justificación del procedimiento</div><div style=\"margin-left:.9rem\">c) 117.1 LCSP, junto con la aprobación del gasto</div><div style=\"margin-left:.9rem\">d) 118.3 LCSP, junto con la factura</div></div><details class=\"panel\"><summary>Respuesta razonada</summary><div class=\"body\"><b>a) Correcta.</b> El art. <b>116.3 LCSP</b> enumera lo que se <b>incorpora</b> al expediente: PCAP y PPT, certificado de existencia de crédito y fiscalización previa de la Intervención.<br><b>b)</b> El art. 116.4 enumera lo que se <b>justifica</b>, no lo que se incorpora.<br><b>c)</b> El art. 117.1 regula la resolución de aprobación.<br><b>d)</b> El art. 118.3 es el expediente del contrato <b>menor</b>.</div></details><div class=\"box\"><span class=\"lbl\">Pregunta 3</span>El contrato se adjudica en 76.000 € sin IVA. La garantía definitiva asciende a:<div style=\"margin-left:.9rem\">a) 3.800 €</div><div style=\"margin-left:.9rem\">b) 4.598 €</div><div style=\"margin-left:.9rem\">c) 4.000 €</div><div style=\"margin-left:.9rem\">d) 2.280 €</div></div><details class=\"panel\"><summary>Respuesta razonada</summary><div class=\"body\"><b>a) Correcta.</b> 5 % de 76.000 € = <b>3.800 €</b> (art. <b>107.1 LCSP</b>: 5 % del precio final ofertado, <b>excluido el IVA</b>).<br><b>b)</b> Sería el 5 % del precio con IVA.<br><b>c)</b> Sería el 5 % del presupuesto base sin IVA, no del precio adjudicado.<br><b>d)</b> Sería el 3 %, que es el techo de la garantía <b>provisional</b> (art. 106.2).</div></details><div class=\"box\"><span class=\"lbl\">Pregunta 4</span>La garantía definitiva puede prestarse:<div style=\"margin-left:.9rem\">a) En efectivo o en valores de Deuda Pública, mediante aval o mediante contrato de seguro de caución</div><div style=\"margin-left:.9rem\">b) Únicamente en efectivo</div><div style=\"margin-left:.9rem\">c) Mediante pagaré del adjudicatario</div><div style=\"margin-left:.9rem\">d) Mediante compromiso escrito de la empresa matriz</div></div><details class=\"panel\"><summary>Respuesta razonada</summary><div class=\"body\"><b>a) Correcta.</b> Art. <b>108.1 LCSP</b>. Y si el PCAP lo prevé, también mediante <b>retención en el precio</b> (art. 108.2). Su acreditación puede hacerse por medios electrónicos (108.3).<br><b>b)</b> El efectivo es solo una de las tres formas.<br><b>c) y d)</b> No figuran entre las formas admisibles, que son de enumeración cerrada.</div></details><div class=\"box\"><span class=\"lbl\">Pregunta 5</span>El contratista entrega los 120 equipos el 18 de mayo. El acto formal de recepción o conformidad debe producirse:<div style=\"margin-left:.9rem\">a) Dentro del mes siguiente a la entrega, o en el plazo que fije el pliego por razón de sus características</div><div style=\"margin-left:.9rem\">b) En el plazo de tres meses</div><div style=\"margin-left:.9rem\">c) En el mismo momento de la entrega, siempre</div><div style=\"margin-left:.9rem\">d) Cuando lo decida el contratista</div></div><details class=\"panel\"><summary>Respuesta razonada</summary><div class=\"body\"><b>a) Correcta.</b> Art. <b>210.2 LCSP</b>: la constatación del cumplimiento exige un <b>acto formal y positivo</b> de recepción o conformidad dentro del mes siguiente a la entrega o realización del objeto del contrato.<br><b>b)</b> Tres meses es el plazo para aprobar la <b>certificación final</b> en obras (art. 243.1).<br><b>c)</b> El art. 300.3 contempla precisamente que la recepción sea <b>posterior</b> a la entrega.<br><b>d)</b> Es un acto de la Administración, no del contratista.</div></details><div class=\"box\"><span class=\"lbl\">Pregunta 6</span>Entre la entrega de los bienes y el acto formal de recepción, la responsabilidad de la custodia corresponde:<div style=\"margin-left:.9rem\">a) A la Administración</div><div style=\"margin-left:.9rem\">b) Al contratista</div><div style=\"margin-left:.9rem\">c) A la empresa aseguradora</div><div style=\"margin-left:.9rem\">d) A nadie: el riesgo se extingue con la entrega</div></div><details class=\"panel\"><summary>Respuesta razonada</summary><div class=\"body\"><b>a) Correcta.</b> Art. <b>300.3 LCSP</b>: cuando el acto formal de recepción sea posterior a la entrega, «la Administración será responsable de la custodia de los mismos durante el tiempo que medie entre una y otra».<br><b>b)</b> Antes de la entrega sí responde el contratista (art. 300.2), pero no después.<br><b>c)</b> El seguro cubre el daño; no desplaza la responsabilidad legal de custodia.<br><b>d)</b> El riesgo no desaparece: cambia de titular.</div></details><div class=\"box\"><span class=\"lbl\">Pregunta 7</span>En la recepción se comprueba que veinte equipos no cumplen las prescripciones técnicas. Respecto de esos veinte equipos:<div style=\"margin-left:.9rem\">a) No puede reconocerse la obligación, porque no se ha acreditado la realización de la prestación</div><div style=\"margin-left:.9rem\">b) Debe reconocerse la obligación, porque ya existe factura</div><div style=\"margin-left:.9rem\">c) Debe pagarse y reclamar después la diferencia</div><div style=\"margin-left:.9rem\">d) Debe pagarse el 50 % del importe</div></div><details class=\"panel\"><summary>Respuesta razonada</summary><div class=\"body\"><b>a) Correcta.</b> El art. <b>59.1 del RD 500/1990</b> exige acreditar documentalmente la <b>realización de la prestación</b> antes de reconocer la obligación, y el art. 210.2 LCSP exige un acto <b>formal y positivo</b> de recepción. Sin fase O no hay orden de pago ni pago.<br><b>b)</b> La factura sola no acredita que la prestación se haya realizado conforme a lo pactado.<br><b>c) y d)</b> No tienen amparo legal. Sí puede recibirse y abonarse la parte conforme.</div></details><div class=\"box\"><span class=\"lbl\">Pregunta 8</span>El plazo de garantía del contrato de suministro se cuenta:<div style=\"margin-left:.9rem\">a) Desde la fecha de recepción o conformidad</div><div style=\"margin-left:.9rem\">b) Desde la fecha de entrega</div><div style=\"margin-left:.9rem\">c) Desde la formalización del contrato</div><div style=\"margin-left:.9rem\">d) Desde la adjudicación</div></div><details class=\"panel\"><summary>Respuesta razonada</summary><div class=\"body\"><b>a) Correcta.</b> Art. <b>210.3 LCSP</b>. Transcurrido sin objeciones, queda extinguida la responsabilidad del contratista y procede devolver la garantía definitiva.<br><b>b)</b> Entrega y recepción son actos distintos; el plazo corre desde la segunda.<br><b>c) y d)</b> Son momentos anteriores a la ejecución.</div></details><div class=\"box\"><span class=\"lbl\">Pregunta 9</span>La resolución de adjudicación debe publicarse en el perfil de contratante en el plazo de:<div style=\"margin-left:.9rem\">a) Quince días</div><div style=\"margin-left:.9rem\">b) Diez días hábiles</div><div style=\"margin-left:.9rem\">c) Cinco días hábiles</div><div style=\"margin-left:.9rem\">d) Un mes</div></div><details class=\"panel\"><summary>Respuesta razonada</summary><div class=\"body\"><b>a) Correcta.</b> Art. <b>151.1 LCSP</b>. Además debe <b>notificarse</b> a candidatos y licitadores: son dos obligaciones distintas y acumulativas.<br><b>b)</b> Diez días hábiles es el plazo del requerimiento de documentación al mejor licitador (art. 150.2).<br><b>c)</b> Cinco días hábiles es el plazo para adjudicar desde que se recibe esa documentación (art. 150.3).<br><b>d)</b> No es un plazo de este artículo.</div></details><div class=\"box\"><span class=\"lbl\">Pregunta 10</span>Ordenar el pago de la factura conformada corresponde, en la entidad local, a:<div style=\"margin-left:.9rem\">a) El presidente de la entidad local</div><div style=\"margin-left:.9rem\">b) El interventor</div><div style=\"margin-left:.9rem\">c) La mesa de contratación</div><div style=\"margin-left:.9rem\">d) El responsable del contrato</div></div><details class=\"panel\"><summary>Respuesta razonada</summary><div class=\"body\"><b>a) Correcta.</b> Art. <b>186.1 TRLHL</b>: competen al presidente las funciones de ordenación de pagos, acomodándose al <b>plan de disposición de fondos</b> (art. 187).<br><b>b)</b> El interventor realiza la intervención <b>formal y material del pago</b> (art. 214.2.b y c), pero no lo ordena.<br><b>c)</b> La mesa asiste en la licitación y se agota con la propuesta de adjudicación.<br><b>d)</b> El responsable del contrato <b>conforma</b> la prestación; no ordena pagos.</div></details></section>";
</script>
<script>
document.getElementById('main').innerHTML+="<section class=\"card\" id=\"s6\"><h2>Supuesto 6 · Contrato menor</h2><div class=\"box\"><span class=\"lbl\">Enunciado</span>El <b>Ayuntamiento de Antequera</b> necesita tres cosas en el mismo mes:<br><b>A)</b> reparar la <b>cubierta</b> de un aula del colegio Reina Sofía, por <b>42.350 € IVA incluido</b>, trabajo que <b>afecta a la estanqueidad</b> de la obra;<br><b>B)</b> contratar una <b>asistencia técnica</b> urbanística por <b>17.545 € IVA incluido</b>;<br><b>C)</b> comprar <b>material de oficina</b> por <b>605 € IVA incluido</b>, con pago por el sistema de <b>anticipos de caja fija</b>.</div><details class=\"panel\" open><summary><b>El ciclo del gasto en este contrato</b></summary><div class=\"body\"><table class=\"t\"><thead><tr><th>Trámite</th><th>Fase</th><th>Artículo</th></tr></thead><tbody><tr><td>Informe del órgano de contratación: necesidad y no alteración del objeto</td><td><b>—</b></td><td>art. 118.2 LCSP</td></tr><tr><td>En el menor de obras, presupuesto de las obras y, en su caso, informe de supervisión</td><td><b>—</b></td><td>art. 118.4 LCSP</td></tr><tr><td>Certificado de existencia de crédito</td><td><b>RC</b></td><td>art. 31 RD 500/1990</td></tr><tr><td>NO hay fiscalización previa: los contratos menores están excluidos</td><td><b>—</b></td><td>art. 219.1 TRLHL</td></tr><tr><td>Resolución que aprueba el gasto y adjudica directamente</td><td><b>A + D</b></td><td>arts. 118.3 y 131.3 LCSP y arts. 54, 56 y 67 RD 500/1990</td></tr><tr><td>Ejecución y presentación de la factura, conformada</td><td><b>O</b></td><td>art. 118.3 LCSP y arts. 58 y 59 RD 500/1990</td></tr><tr><td>Orden de pago y pago en treinta días</td><td><b>P</b></td><td>art. 198.4 LCSP y arts. 186 y 187 TRLHL</td></tr><tr><td>Publicación al menos trimestral en el perfil de contratante</td><td><b>—</b></td><td>arts. 118.6 y 63.4 LCSP</td></tr></tbody></table></div></details><p class=\"small\" style=\"margin-top:.8rem\">Responde las diez preguntas y comprueba después cada una. Si fallas más de tres, vuelve a la tabla de arriba antes de seguir.</p><div class=\"box\"><span class=\"lbl\">Pregunta 1</span>El presupuesto de la reparación de la cubierta es de 42.350 € IVA incluido, es decir, 35.000 € de base. Ese contrato:<div style=\"margin-left:.9rem\">a) Es un contrato menor de obras, porque su valor estimado es inferior a 40.000 €</div><div style=\"margin-left:.9rem\">b) No es un contrato menor, porque supera los 40.000 €</div><div style=\"margin-left:.9rem\">c) No es un contrato menor, porque en obras el umbral es de 15.000 €</div><div style=\"margin-left:.9rem\">d) Es un contrato menor solo si se divide en dos anualidades</div></div><details class=\"panel\"><summary>Respuesta razonada</summary><div class=\"body\"><b>a) Correcta.</b> El umbral del art. <b>118.1 LCSP</b> se mide sobre el <b>valor estimado</b>, que va <b>sin IVA</b> (art. 101.1.a): 35.000 € &lt; 40.000 €.<br><b>b)</b> Compara el importe <b>con</b> IVA. Es el error más repetido.<br><b>c)</b> Los 15.000 € son el umbral de suministros y servicios.<br><b>d)</b> Fraccionar para rebajar la cuantía está prohibido por el art. 99.2.</div></details><div class=\"box\"><span class=\"lbl\">Pregunta 2</span>La asistencia técnica se presupuesta en 17.545 € IVA incluido, esto es, 14.500 € de base. Ese contrato de servicios:<div style=\"margin-left:.9rem\">a) Es un contrato menor, porque su valor estimado es inferior a 15.000 €</div><div style=\"margin-left:.9rem\">b) No es un contrato menor, porque supera los 15.000 €</div><div style=\"margin-left:.9rem\">c) Es un contrato menor solo si dura menos de seis meses</div><div style=\"margin-left:.9rem\">d) No es un contrato menor, porque los servicios exigen siempre licitación</div></div><details class=\"panel\"><summary>Respuesta razonada</summary><div class=\"body\"><b>a) Correcta.</b> 14.500 € &lt; 15.000 €. Y fíjate en que la ley dice «<b>inferior a</b>»: 15.000 € exactos ya no sería menor.<br><b>b)</b> Vuelve a comparar con IVA.<br><b>c)</b> La duración máxima del menor es de un año, pero no es un requisito de calificación por debajo de ese año.<br><b>d)</b> Los servicios pueden ser contrato menor por debajo del umbral.</div></details><div class=\"box\"><span class=\"lbl\">Pregunta 3</span>La tramitación del expediente de un contrato menor exige:<div style=\"margin-left:.9rem\">a) Informe del órgano de contratación, aprobación del gasto e incorporación de la factura</div><div style=\"margin-left:.9rem\">b) Pliego de cláusulas administrativas particulares y anuncio de licitación</div><div style=\"margin-left:.9rem\">c) Tres ofertas y acta de la mesa de contratación</div><div style=\"margin-left:.9rem\">d) Estudio de viabilidad y proyecto</div></div><details class=\"panel\"><summary>Respuesta razonada</summary><div class=\"body\"><b>a) Correcta.</b> Arts. <b>118.2 y 118.3 LCSP</b>. El informe debe justificar de manera motivada la <b>necesidad</b> del contrato y <b>que no se está alterando su objeto</b> para eludir los umbrales.<br><b>b)</b> En el contrato menor no hay pliegos ni anuncio de licitación.<br><b>c)</b> La ley no exige tres ofertas ni mesa de contratación; algunas bases de ejecución pueden pedirlas, pero no la LCSP.<br><b>d)</b> El estudio de viabilidad es de la concesión de obras.</div></details><div class=\"box\"><span class=\"lbl\">Pregunta 4</span>Como la reparación de la cubierta afecta a la estanqueidad de la obra, en el expediente deberá incorporarse además:<div style=\"margin-left:.9rem\">a) El informe de las oficinas o unidades de supervisión</div><div style=\"margin-left:.9rem\">b) El informe de insuficiencia de medios</div><div style=\"margin-left:.9rem\">c) El acta de recepción</div><div style=\"margin-left:.9rem\">d) La declaración responsable del contratista sobre el convenio colectivo</div></div><details class=\"panel\"><summary>Respuesta razonada</summary><div class=\"body\"><b>a) Correcta.</b> Art. <b>118.4 LCSP</b>: en el contrato menor de obras debe añadirse el presupuesto de las obras y solicitarse el informe de supervisión del art. 235 «<b>cuando el trabajo afecte a la estabilidad, seguridad o estanqueidad de la obra</b>».<br><b>b)</b> Es propio de los contratos de <b>servicios</b> (art. 116.4.f).<br><b>c)</b> El acta de recepción es posterior, y en el menor la existencia del contrato se acredita con los documentos del art. 118 (art. 153.2).<br><b>d)</b> No es un contenido del expediente del contrato menor.</div></details><div class=\"box\"><span class=\"lbl\">Pregunta 5</span>Respecto de la fiscalización previa de la Intervención, los contratos menores:<div style=\"margin-left:.9rem\">a) No están sometidos a intervención previa</div><div style=\"margin-left:.9rem\">b) Están sometidos a fiscalización previa plena</div><div style=\"margin-left:.9rem\">c) Están sometidos solo si superan los 15.000 €</div><div style=\"margin-left:.9rem\">d) Están sometidos únicamente cuando se paguen por anticipos de caja fija</div></div><details class=\"panel\"><summary>Respuesta razonada</summary><div class=\"body\"><b>a) Correcta.</b> Art. <b>219.1 TRLHL</b>: no están sometidos a intervención previa los gastos de material no inventariable, los <b>contratos menores</b>, los de carácter periódico y de tracto sucesivo una vez intervenido el período inicial, y los gastos menores de 3.005,06 € pagados por anticipos de caja fija.<br><b>Ojo:</b> lo que desaparece es la fiscalización <b>previa</b>. Sigue exigiéndose la <b>existencia de crédito</b> y se mantienen la intervención formal y material del <b>pago</b> (art. 214.2).<br><b>b), c) y d)</b> Contradicen el art. 219.1.</div></details><div class=\"box\"><span class=\"lbl\">Pregunta 6</span>La duración de un contrato menor:<div style=\"margin-left:.9rem\">a) No puede ser superior a un año ni ser objeto de prórroga</div><div style=\"margin-left:.9rem\">b) No puede ser superior a dos años</div><div style=\"margin-left:.9rem\">c) Puede prorrogarse una vez por otro año</div><div style=\"margin-left:.9rem\">d) No tiene límite temporal</div></div><details class=\"panel\"><summary>Respuesta razonada</summary><div class=\"body\"><b>a) Correcta.</b> Art. <b>29.8 LCSP</b>: los contratos menores definidos en el art. 118.1 «no podrán tener una duración superior a un año ni ser objeto de prórroga».<br><b>b), c) y d)</b> Contradicen el precepto. Es una de las respuestas más preguntadas.</div></details><div class=\"box\"><span class=\"lbl\">Pregunta 7</span>Los contratos menores se publican en el perfil de contratante:<div style=\"margin-left:.9rem\">a) Al menos trimestralmente, con el importe de adjudicación incluido el IVA</div><div style=\"margin-left:.9rem\">b) Mensualmente y con el importe sin IVA</div><div style=\"margin-left:.9rem\">c) Anualmente, junto con la liquidación del presupuesto</div><div style=\"margin-left:.9rem\">d) No se publican</div></div><details class=\"panel\"><summary>Respuesta razonada</summary><div class=\"body\"><b>a) Correcta.</b> Arts. <b>118.6 y 63.4 LCSP</b>: se publica el objeto, la duración, el <b>importe de adjudicación incluido el IVA</b> y la identidad del adjudicatario, ordenados por identidad del adjudicatario.<br><b>b)</b> Ni la periodicidad ni la base son correctas.<br><b>c)</b> La periodicidad legal es al menos trimestral.<br><b>d)</b> Sí se publican: es el principal control de esta figura.</div></details><div class=\"box\"><span class=\"lbl\">Pregunta 8</span>En el contrato menor, al no existir licitación, lo habitual es tramitar un único documento contable que acumula la autorización, la disposición y el reconocimiento de la obligación. Ese documento es:<div style=\"margin-left:.9rem\">a) ADO</div><div style=\"margin-left:.9rem\">b) RC</div><div style=\"margin-left:.9rem\">c) AD</div><div style=\"margin-left:.9rem\">d) P</div></div><details class=\"panel\"><summary>Respuesta razonada</summary><div class=\"body\"><b>a) Correcta.</b> El art. <b>67 del RD 500/1990</b> y el art. <b>184.2 TRLHL</b> permiten que un mismo acto abarque varias fases, con los mismos efectos que si se acordaran por separado. <b>ADO</b> = autorización + disposición + obligación.<br><b>b)</b> RC es la retención de crédito, previa a todas.<br><b>c)</b> AD acumula solo autorización y disposición.<br><b>d)</b> P es la ordenación del pago, que si también se acumula da lugar al documento <b>ADOP</b>.</div></details><div class=\"box\"><span class=\"lbl\">Pregunta 9</span>El contrato menor se perfecciona:<div style=\"margin-left:.9rem\">a) Con su adjudicación</div><div style=\"margin-left:.9rem\">b) Con su formalización en documento administrativo</div><div style=\"margin-left:.9rem\">c) Con la conformidad de la factura</div><div style=\"margin-left:.9rem\">d) Con la publicación trimestral en el perfil</div></div><details class=\"panel\"><summary>Respuesta razonada</summary><div class=\"body\"><b>a) Correcta.</b> Es la excepción del art. <b>36.1 LCSP</b>, y el art. 153.2 añade que en los contratos menores su existencia se acredita con los documentos del art. 118.<br><b>b)</b> La formalización es la regla general de los demás contratos.<br><b>c)</b> La conformidad da lugar al reconocimiento de la obligación, ya en ejecución.<br><b>d)</b> La publicación es posterior y solo cumple una función de transparencia.</div></details><div class=\"box\"><span class=\"lbl\">Pregunta 10</span>En el contrato menor, la garantía definitiva:<div style=\"margin-left:.9rem\">a) No se exige</div><div style=\"margin-left:.9rem\">b) Es del 5 % del precio ofertado sin IVA</div><div style=\"margin-left:.9rem\">c) Es del 3 % del presupuesto base de licitación</div><div style=\"margin-left:.9rem\">d) Es del 10 % en los contratos de obras</div></div><details class=\"panel\"><summary>Respuesta razonada</summary><div class=\"body\"><b>a) Correcta.</b> El expediente del contrato menor es el del art. 118 y no incluye garantía definitiva: no hay licitación ni requerimiento del art. 150.2.<br><b>b)</b> Es la regla general de los contratos licitados (art. 107.1).<br><b>c)</b> El 3 % del presupuesto base es el techo de la garantía <b>provisional</b> (art. 106.2).<br><b>d)</b> El 10 % es el techo de la garantía definitiva más la complementaria (art. 107.2).</div></details><div class=\"box ej\"><span class=\"lbl\">Nota sobre el apartado C</span>El art. <b>118.5 LCSP</b> exime del <b>informe del apartado 2</b> —el de necesidad y no alteración del objeto— a los contratos cuyo pago se verifique por <b>anticipos de caja fija</b> u otro sistema similar, siempre que el valor estimado <b>no exceda de 5.000 €</b>. Aquí la base son 500 €, de modo que basta con la aprobación del gasto y la factura. Y recuerda que esos gastos menores tampoco están sometidos a intervención previa (art. 219.1 TRLHL).</div></section>";
</script>
<script>
document.getElementById('main').innerHTML+="<section class=\"card\" id=\"cuadro\"><h2>Cuadro comparativo de los seis supuestos</h2><table class=\"t\"><thead><tr><th>Tipo</th><th>Trámite previo propio</th><th>Cómo se acredita la prestación</th><th>Duración máxima</th><th>Garantía definitiva</th></tr></thead><tbody><tr><td><b>Obras</b></td><td>Proyecto, <b>supervisión</b> si ≥ 500.000 € sin IVA y <b>replanteo</b> antes de aprobar el expediente (arts. 231, 235 y 236)</td><td><b>Certificación mensual</b> conformada, en los diez primeros días del mes siguiente (art. 240.1)</td><td>La del proyecto; certificación final en <b>3 meses</b> desde la recepción y garantía <b>mínima de 1 año</b> (art. 243)</td><td><b>5 %</b> del precio ofertado sin IVA. <b>Nunca cabe exención</b> (art. 107.1)</td></tr><tr><td><b>Concesión de obras</b></td><td><b>Estudio de viabilidad</b> previo a la decisión misma de concesionar (art. 247)</td><td>Las <b>aportaciones públicas</b> se abonan durante o tras la ejecución de las obras, conforme al pliego (art. 266.1)</td><td><b>40 años</b> (art. 29.6.a)</td><td>La fija el PCAP según naturaleza, importancia y duración (art. 107.4)</td></tr><tr><td><b>Concesión de servicios</b></td><td>Pliegos con tarifas, su revisión y el canon (art. 285.1.b)</td><td>Facturación de la <b>aportación</b>, si la hay, conformada por el responsable. Las tarifas las cobra el concesionario</td><td><b>25 años</b>; <b>10</b> si comprende servicios sanitarios (art. 29.6.b y c)</td><td>La fija el PCAP (art. 107.4)</td></tr><tr><td><b>Servicios</b></td><td><b>Informe de insuficiencia de medios</b> (art. 116.4.f)</td><td><b>Factura mensual conformada</b> por el responsable del contrato (arts. 62 y 198.4)</td><td><b>5 años</b> incluidas prórrogas (art. 29.4)</td><td><b>5 %</b> del precio ofertado sin IVA (art. 107.1)</td></tr><tr><td><b>Suministros</b></td><td>Ninguno específico más allá del expediente común</td><td><b>Acto formal y positivo de recepción o conformidad</b> dentro del mes siguiente a la entrega (art. 210.2)</td><td><b>5 años</b> en prestación sucesiva (art. 29.4)</td><td><b>5 %</b> del precio ofertado sin IVA (art. 107.1)</td></tr><tr><td><b>Contrato menor</b></td><td>Informe de necesidad y de no alteración del objeto (art. 118.2); en obras, presupuesto y supervisión si afecta a estabilidad, seguridad o estanqueidad (art. 118.4)</td><td><b>Factura</b> incorporada al expediente (art. 118.3)</td><td><b>1 año</b> y <b>sin prórroga</b> (art. 29.8)</td><td>No se exige</td></tr></tbody></table><div class=\"box warn\"><span class=\"lbl\">La columna que más se falla</span>La de «cómo se acredita la prestación», porque es la que decide cuándo puede producirse la <b>fase O</b>. Sin acreditación documental de la prestación no hay reconocimiento de la obligación (art. 59.1 RD 500/1990), y sin fase O no hay orden de pago ni pago.</div></section><section class=\"card\" id=\"plazos\"><h2>Los plazos del ciclo del gasto, todos juntos</h2><table class=\"t\"><thead><tr><th>Plazo</th><th>Trámite</th><th>Precepto</th></tr></thead><tbody><tr><td><b>10 días hábiles</b></td><td>Documentación y garantía definitiva del mejor licitador</td><td>art. 150.2 LCSP</td></tr><tr><td><b>5 días hábiles</b></td><td>Adjudicación desde la recepción de la documentación</td><td>art. 150.3 LCSP</td></tr><tr><td><b>20 días</b></td><td>Apertura de las proposiciones desde el fin del plazo de presentación</td><td>art. 157.3 LCSP</td></tr><tr><td><b>15 días</b></td><td>Publicación de la adjudicación en el perfil de contratante</td><td>art. 151.1 LCSP</td></tr><tr><td><b>15 días hábiles</b></td><td>Espera antes de formalizar, si cabe recurso especial</td><td>art. 153.3 LCSP</td></tr><tr><td><b>5 días</b></td><td>Formalización tras el requerimiento</td><td>art. 153.3 LCSP</td></tr><tr><td><b>Primeros 10 días del mes</b></td><td>Expedición de las certificaciones de obra del mes anterior</td><td>art. 240.1 LCSP</td></tr><tr><td><b>1 mes</b></td><td>Acto formal de recepción o conformidad desde la entrega o realización</td><td>art. 210.2 LCSP</td></tr><tr><td><b>30 días</b></td><td>Plazo del contratista para presentar la factura desde la entrega o prestación</td><td>art. 198.4 LCSP</td></tr><tr><td><b>30 días</b></td><td>Obligación de la Administración de abonar el precio desde la aprobación de la certificación o la conformidad</td><td>art. 198.4 LCSP</td></tr><tr><td><b>90 %</b></td><td>Umbral de abonos a cuenta acumulados que obliga a comunicar a la Intervención para la comprobación material</td><td>art. 198.2 LCSP</td></tr><tr><td><b>3 meses</b></td><td>Aprobación de la certificación final de obra desde la recepción</td><td>art. 243.1 LCSP</td></tr><tr><td><b>1 año</b></td><td>Plazo de garantía mínimo en obras</td><td>art. 243.3 LCSP</td></tr><tr><td><b>15 días antes</b></td><td>Informe del director facultativo sobre el estado de las obras, antes de que venza la garantía</td><td>art. 243.3 LCSP</td></tr><tr><td><b>60 días</b></td><td>Devolución de la garantía, liquidación y pago de obligaciones pendientes tras informe favorable</td><td>art. 243.3 LCSP</td></tr><tr><td><b>70-60-50-50 %</b></td><td>Límites del gasto plurianual en los cuatro ejercicios siguientes</td><td>art. 174.3 TRLHL</td></tr><tr><td><b>Trimestral</b></td><td>Publicación de los contratos menores, con importe IVA incluido</td><td>arts. 63.4 y 118.6 LCSP</td></tr></tbody></table></section><section class=\"card\" id=\"conexiones\"><h2>Diez preguntas de conexión</h2><p class=\"small\">Responde en voz alta <b>antes</b> de desplegar. Estas son las preguntas que enlazan la Ley 9/2017 con el TRLHL, que es justo donde se decide un supuesto práctico.</p><div id=\"qbox\"></div></section><section class=\"card\" id=\"sem\"><h2>Semáforo: qué dominas y qué no</h2><p class=\"small\">Marca cada destreza. Lo que quede en rojo es tu plan de estudio de esta semana.</p><div id=\"sembox\"></div><div id=\"semres\" style=\"margin-top:.8rem\"></div></section>";
</script>

window.addEventListener('scroll',function(){

/* ═══ Mejoras de interacción · Bloque II ═══ */
(function(){
"use strict";
var K_THEME="oposi_bII_theme", K_FS="oposi_bII_fs", K_STREAK="oposi_bII_streak";
function load(k,f){try{var v=localStorage.getItem(k);return v?JSON.parse(v):f;}catch(e){return f;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
var root=document.documentElement;

/* Tema persistente (sobrescribe el toggle simple anterior) */

else if(window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches){root.setAttribute("data-theme","dark");}

};

  save(K_FS,fs);
}
setFs(fs);

(function(){

  var s=load(K_STREAK,{last:null,n:0});
  if(s.last!==hoy){
    var ayer=new Date(Date.now()-864e5).toISOString().slice(0,10);

  }

/* Reveal on scroll para las tarjetas */
function reveal(){
  var els=document.querySelectorAll("section.card:not(.rv)");
  if(!els.length)return;
  if(!("IntersectionObserver" in window)){return;}
  var io=new IntersectionObserver(function(es){
    es.forEach(function(en){if(en.isIntersecting){en.target.classList.add("in");io.unobserve(en.target);}});
  },{threshold:.06,rootMargin:"0px 0px -30px 0px"});
  Array.prototype.forEach.call(els,function(el){el.classList.add("rv");io.observe(el);});
}

/* Sección activa en el índice lateral */
function spy(){
  var links=document.querySelectorAll("nav.side a[href^='#']");
  if(!links.length||!("IntersectionObserver" in window))return;
  var map={};
  Array.prototype.forEach.call(links,function(a){
    var t=document.getElementById(a.getAttribute("href").slice(1));
    if(t)map[t.id]=a;
  });
  var io=new IntersectionObserver(function(es){
    es.forEach(function(en){
      if(en.isIntersecting){
        Array.prototype.forEach.call(links,function(a){a.classList.remove("on");});
        if(map[en.target.id])map[en.target.id].classList.add("on");
      }
    });
  },{rootMargin:"-80px 0px -70% 0px",threshold:0});
  Object.keys(map).forEach(function(id){io.observe(document.getElementById(id));});
}

/* Ripple en botones */
document.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b||b.classList.contains("navtoggle"))return;

});

else{setTimeout(init,60);}
addEventListener("load",function(){setTimeout(init,80);});
})();

/* ═══ Parser de respuestas: estructura semántica ═══ */
var FCFMT=(function(){
  var CITA=/\s*\(((?:arts?\.|DA\b|DT\b|disp\.)[^)]*)\)\s*\.?\s*$/i;
  var strip=function(h){return h.replace(/<[^>]+>/g,"");};

  function esc(s){return s;}

  function parse(raw){
    var out={verdict:null,cite:null,kind:"p",items:[],text:""};
    var body=String(raw).trim();

    /* 1 ── Cita legal al final */
    var m=body.match(CITA);
    if(m){out.cite=m[1].replace(/\s+/g," ").trim();body=body.slice(0,m.index).trim();}
    body=body.replace(/[.;,\s]+$/,"");

    /* 2 ── Veredicto Sí / No inicial */
    var v=strip(body).match(/^(Sí|Sí,|No|No,)[.:,]?\s/);
    if(v){
      out.verdict=/^Sí/.test(v[1])?"si":"no";
      body=body.replace(/^(<[^>]+>\s*)*(Sí|No)[.,:]?\s*/,"").trim();
      body=body.replace(/^en\s/,"En ");
    }

    /* 3 ── Enumeración con · */
    var parts=body.split(/\s+·\s+/);
    if(parts.length>=2){
      out.kind="list";
      var letras=parts.filter(function(p){return /^\s*<?[a-h]\)/.test(strip(p));}).length;
      out.marker = letras>=parts.length-1 ? "alpha" : "num";
      out.items=parts.map(function(p){
        return p.replace(/^\s*[a-h]\)\s*/,"").replace(/[.\s]+$/,"").trim();
      }).filter(Boolean);
      return out;
    }

    /* 4 ── Cláusulas contrapuestas con ; */
    var semi=body.split(/;\s+/);
    if(semi.length>=2&&semi.length<=3&&semi.every(function(s){return strip(s).length>14;})){
      out.kind="clauses";
      out.items=semi.map(function(s){return s.replace(/[.\s]+$/,"").trim();});
      return out;
    }

    /* 5 ── Párrafo */
    out.text=body;
    return out;
  }

  function render(raw){
    var d=parse(raw),h="";

    if(d.verdict){
      h+='<span class="fc-verdict '+d.verdict+'">'+(d.verdict==="si"?"✓ Sí":"✗ No")+'</span>';
    }

    if(d.kind==="list"){
      h+='<ol class="fc-list '+d.marker+'">';
      d.items.forEach(function(it){h+='<li>'+it+'</li>';});
      h+='</ol>';
    }else if(d.kind==="clauses"){
      h+='<div class="fc-clauses">';
      d.items.forEach(function(it){h+='<p>'+it+'</p>';});
      h+='</div>';
    }else if(d.text){
      h+='<p class="fc-p">'+d.text+'</p>';
    }

    if(d.cite){
      h+='<span class="fc-cite"><span class="s">§</span>'+d.cite+'</span>';
    }
    return {html:h,struct:(d.kind!=="p"||!!d.verdict||strip(raw).length>150)};
  }
  return {parse:parse,render:render};
})();

/* ═══ FLASHCARDS 3D ═══ */
(function(){
"use strict";
function boot(){
  var sec=document.getElementById("flash");
  if(!sec||sec.dataset.fc3d)return false;
  if(typeof FLASH==="undefined"||!FLASH||!FLASH.length)return false;
  sec.dataset.fc3d="1";

  var CARDS=FLASH, N=CARDS.length;
  var order,fi,ok,ko,back,busy;

  /* — Estructura — */

  var intro=document.createElement("p");

    +'<span class="fc-hint" style="position:static;display:inline;color:inherit">'
    +'<span class="kbd">espacio</span> girar · <span class="kbd">→</span> lo sabía · <span class="kbd">←</span> repasar</span>';

  stage.innerHTML=
    '<div class="fc-deck" id="fcdeck">'
    +'<span class="fc-ghost g2"></span><span class="fc-ghost g1"></span>'
    +'<div class="fc-lift" id="fclift">'
      +'<div class="fc-card" id="fcbox" tabindex="0" role="button" aria-label="Tarjeta. Pulsa para girar">'
        +'<div class="fc-face fc-front">'
          +'<span class="fc-tag">Pregunta</span><span class="fc-pip tr"></span><span class="fc-pip bl"></span>'
          +'<div class="fc-txt"></div>'
          +'<span class="fc-hint">Pulsa para girar</span>'
        +'</div>'
        +'<div class="fc-face fc-back">'
          +'<span class="fc-tag">Respuesta</span><span class="fc-pip tr"></span><span class="fc-pip bl"></span>'
          +'<div class="fc-txt"></div>'
          +'<span class="fc-hint">¿La sabías?</span>'
        +'</div>'
      +'</div>'
    +'</div></div>';
  sec.appendChild(stage);

  var bar=document.createElement("div");
  bar.className="fc-bar";bar.innerHTML="<i></i>";
  sec.appendChild(bar);

  var ctr=document.createElement("div");
  ctr.className="fc-ctrls noprint";
  ctr.innerHTML='<button id="fcflip">⟲ Girar</button>'
    +'<button id="fcok">✔ Lo sabía</button>'
    +'<button id="fcko">↻ Repasar</button>'
    +'<button id="fcreset">Reiniciar</button>'
    +'<span class="fc-score">'
      +'<span class="fc-pill ok" id="fcpok">0 sabidas</span>'
      +'<span class="fc-pill ko" id="fcpko">0 repasar</span>'
      +'<span class="fc-pill left" id="fccount">0</span>'
    +'</span>';
  sec.appendChild(ctr);

  var deck=stage.querySelector("#fcdeck"), lift=stage.querySelector("#fclift"),
      card=stage.querySelector("#fcbox"),
      front=stage.querySelector(".fc-front"), backf=stage.querySelector(".fc-back"),
      fill=bar.querySelector("i"),
      pok=ctr.querySelector("#fcpok"), pko=ctr.querySelector("#fcpko"),
      pleft=ctr.querySelector("#fccount");
  var rot=0;

  function reset(){
    order=CARDS.map(function(_,i){return i;});
    fi=0;ok=0;ko=0;back=false;busy=false;rot=0;
    card.style.transition="none";card.style.transform="rotateY(0deg)";
    void card.offsetWidth;card.style.transition="";
    deck.classList.remove("empty");
    var d=stage.querySelector(".fc-done");if(d)d.remove();
    card.style.display="";
    draw();
  }

  function bump(el){el.classList.remove("bump");void el.offsetWidth;el.classList.add("bump");}

  function draw(){
    pok.textContent=ok+(ok===1?" sabida":" sabidas");
    pko.textContent=ko+" repasar";
    var done=N-order.length;
    fill.style.width=(N?done/N*100:0)+"%";

    if(!order.length){
      pleft.textContent="0 quedan";
      deck.classList.add("empty");
      card.style.display="none";
      if(!stage.querySelector(".fc-done")){
        var d=document.createElement("div");
        d.className="fc-done";
        d.innerHTML='<span class="seal">🏆</span><h3>Ronda completada</h3>'
          +'<p>'+ok+' de '+N+' a la primera'+(ko?' · '+ko+' necesitaron repaso':'')+'</p>';
        deck.appendChild(d);
      }
      return;
    }
    if(fi>=order.length)fi=0;
    pleft.textContent=order.length+(order.length===1?" queda":" quedan");

    var c=CARDS[order[fi]];
    front.querySelector(".fc-txt").innerHTML='<p class="fc-p">'+c[0]+'</p>';
    var r=FCFMT.render(c[1]);
    backf.querySelector(".fc-txt").innerHTML=r.html;
    backf.classList.toggle("struct",r.struct);
    var hint=backf.querySelector(".fc-hint");
    if(hint)hint.classList.toggle("muted",/fc-cite/.test(r.html));
    var pip=(done+1)+"/"+N;
    Array.prototype.forEach.call(stage.querySelectorAll(".fc-pip"),function(p){p.textContent=pip;});
  }

  function flip(){
    if(busy||!order.length)return;
    back=!back;rot+=180;
    card.style.transform="rotateY("+rot+"deg)";
    card.setAttribute("aria-label",back?"Respuesta. Pulsa para volver":"Pregunta. Pulsa para girar");
    lift.classList.remove("lift");void lift.offsetWidth;lift.classList.add("lift");
  }

  function next(good){
    if(busy||!order.length)return;
    busy=true;
    if(good){ok++;bump(pok);}else{ko++;bump(pko);}
    lift.classList.remove("lift");
    lift.classList.add(good?"out-ok":"out-ko");
    setTimeout(function(){
      if(good){order.splice(fi,1);}
      else{var m=order.splice(fi,1)[0];order.push(m);}
      back=false;rot=0;
      card.style.transition="none";card.style.transform="rotateY(0deg)";
      void card.offsetWidth;card.style.transition="";
      draw();
      lift.classList.remove("out-ok","out-ko");
      lift.classList.add("in");
      setTimeout(function(){lift.classList.remove("in");busy=false;},480);
    },460);
  }

  card.onclick=flip;
  card.onkeydown=function(e){
    if(e.key===" "||e.key==="Enter"){e.preventDefault();flip();}
    if(e.key==="ArrowRight"){e.preventDefault();next(true);}
    if(e.key==="ArrowLeft"){e.preventDefault();next(false);}
  };
  ctr.querySelector("#fcflip").onclick=flip;
  ctr.querySelector("#fcok").onclick=function(){next(true);};
  ctr.querySelector("#fcko").onclick=function(){next(false);};
  ctr.querySelector("#fcreset").onclick=reset;

  /* Deslizar en táctil */
  var x0=null,y0=null;
  card.addEventListener("touchstart",function(e){x0=e.touches[0].clientX;y0=e.touches[0].clientY;},{passive:true});
  card.addEventListener("touchend",function(e){
    if(x0===null)return;
    var dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0;
    if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)){next(dx>0);}
    x0=y0=null;
  },{passive:true});

  /* Atajos globales cuando el mazo está a la vista */
  document.addEventListener("keydown",function(e){
    if(e.target.matches("input,textarea,select"))return;
    var r=stage.getBoundingClientRect();
    if(r.bottom<80||r.top>innerHeight-80)return;
    if(e.key===" "){e.preventDefault();flip();}
    else if(e.key==="ArrowRight"){e.preventDefault();next(true);}
    else if(e.key==="ArrowLeft"){e.preventDefault();next(false);}
  });

  reset();
  return true;
}
if(!boot()){
  var tries=0;
  var iv=setInterval(function(){if(boot()||++tries>40)clearInterval(iv);},120);
  addEventListener("load",function(){setTimeout(boot,100);});
}
})();

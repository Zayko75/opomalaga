<script>
document.getElementById('main').innerHTML+="<section class=\"card\" id=\"s1\"><h2>Supuesto 1 · Contrato de obras</h2><div class=\"box\"><span class=\"lbl\">El caso</span>El <b>Ayuntamiento de Alhaurín de la Torre</b> (Málaga), con unos recursos ordinarios del presupuesto de <b>38.400.000 €</b>, necesita <b>reformar y ampliar el centro de día municipal</b>. La memoria del arquitecto municipal cifra el presupuesto de ejecución material en 723.140,50 €; aplicados el 13 % de gastos generales y el 6 % de beneficio industrial, el <b>presupuesto base de licitación</b> asciende a <b>1.041.000,00 € IVA incluido</b> (860.330,58 € de base + 180.669,42 € de IVA). El plazo de ejecución es de <b>14 meses</b>, a caballo entre 2026 y 2027, y el pliego no prevé modificaciones ni prórrogas.</div><div class=\"box warn\"><span class=\"lbl\">Se pide</span>Recorre el ciclo completo del gasto: quién es el órgano de contratación, qué trámites previos exige un contrato de obras, en qué momento se producen las fases <b>RC · A · D · O · P</b>, qué documento acredita la prestación, qué garantía se constituye y cuándo se extingue el contrato. Calcula el valor estimado y la garantía definitiva.</div><details class=\"panel\"><summary><b>Solución paso a paso</b></summary><div class=\"body\"><h3 style=\"font-size:1rem;margin:.4rem 0\">1 · Antes del expediente</h3><div class=\"box legal\"><span class=\"lbl\">Preceptos aplicables</span><b>Art. 28.1 LCSP</b> — informe de necesidad e idoneidad. <b>Art. 231.1</b> — el contrato de obras exige la previa <b>elaboración, supervisión, aprobación y replanteo</b> del proyecto. <b>Art. 235</b> — informe de la oficina de supervisión, <b>preceptivo</b> porque el presupuesto base de licitación (860.330,58 € sin IVA) es <b>igual o superior a 500.000 € IVA excluido</b>. <b>Art. 236</b> — el replanteo comprueba la <b>realidad geométrica</b> de la obra y la <b>disponibilidad de los terrenos</b>, y se hace <b>aprobado el proyecto y antes de aprobar el expediente</b>.</div><ul><li><b>Informe de necesidad</b> del área de Servicios Sociales: 214 plazas actuales frente a 310 solicitudes en lista de espera, y falta de accesibilidad de la planta primera.</li><li><b>Proyecto</b> redactado y firmado por técnico competente, con estudio de seguridad y salud.</li><li><b>Informe de supervisión</b> favorable, de carácter <b>preceptivo</b> por superar el umbral del art. 235.</li><li><b>Aprobación del proyecto</b> por el órgano de contratación (art. 231.1).</li><li><b>Acta de replanteo</b> previo: los terrenos son de titularidad municipal y están libres (art. 236.1 y 236.4). El proyecto se incorpora al expediente.</li></ul><h3 style=\"font-size:1rem;margin:.8rem 0 .4rem\">2 · Órgano de contratación y valor estimado</h3><div class=\"box ej\"><span class=\"lbl\">Cálculo</span><b>Valor estimado</b> (art. 101.1.a): importe total <b>sin IVA</b> y sin prórrogas ni modificaciones previstas = <b>860.330,58 €</b>.<br><b>¿Quién contrata?</b> Disposición adicional segunda, apartado 1: el alcalde es órgano de contratación cuando el valor estimado no supere el <b>10 % de los recursos ordinarios</b> —3.840.000 €— ni <b>6.000.000 €</b>. 860.330,58 € está muy por debajo de ambos límites: <b>el alcalde</b>, o la Junta de Gobierno Local si tiene la competencia delegada (art. 61.2).<br><b>¿Es SARA?</b> No: el umbral armonizado de obras es muy superior. <b>¿Cabe recurso especial?</b> <b>No</b>: el art. 44.1.a) lo reserva a las obras de valor estimado <b>superior a 3.000.000 €</b>. Consecuencia práctica importante: <b>no rige el plazo de espera de quince días hábiles</b> del art. 153.3.<br><b>¿Procedimiento?</b> Valor estimado ≤ 2.000.000 € y ponderación de los criterios sujetos a <b>juicio de valor no superior al 25 %</b>: se cumplen las dos condiciones del art. 159.1 y cabe el <b>abierto simplificado</b>, con plazo mínimo de <b>veinte días</b> en obras (art. 159.3).</div><h3 style=\"font-size:1rem;margin:.8rem 0 .4rem\">3 · El expediente y las fases RC y A</h3><table class=\"t\"><thead><tr><th>Fecha</th><th>Trámite</th><th>Fase</th><th>Precepto</th></tr></thead><tbody><tr><td>12 de enero de 2026</td><td>Resolución de inicio del expediente, motivando la necesidad, <b>publicada en el perfil de contratante</b></td><td>—</td><td>art. 116.1 LCSP</td></tr><tr><td>14 de enero</td><td><b>Certificado de existencia de crédito</b> en la aplicación 231.632.00, con reserva por el importe del gasto</td><td><b>RC</b></td><td>art. 116.3 LCSP · art. 31 RD 500/1990</td></tr><tr><td>16 de enero</td><td>Incorporación del <b>PCAP</b> y del <b>PPT</b>, y justificación de las siete letras del art. 116.4: procedimiento, clasificación, solvencia y criterios, valor estimado, necesidad y no división en lotes</td><td>—</td><td>arts. 116.3, 116.4, 122 y 124</td></tr><tr><td>20 de enero</td><td><b>Fiscalización previa</b> de la Intervención, con informe favorable</td><td>—</td><td>art. 214.2.a) TRLHL</td></tr><tr><td>23 de enero</td><td>Resolución que <b>aprueba el expediente</b>, <b>dispone la apertura</b> del procedimiento e <b>implica la aprobación del gasto</b>. Publicada en el perfil</td><td><b>A</b></td><td>art. 117.1 LCSP · art. 54 RD 500/1990</td></tr></tbody></table><div class=\"box warn\"><span class=\"lbl\">Detalle plurianual</span>La obra dura 14 meses y salta al ejercicio 2027. Hay que tramitar el <b>compromiso de gasto plurianual</b> del art. <b>174 TRLHL</b>: la ejecución se inicia en el propio ejercicio, se trata de una <b>inversión</b> —letra a) del art. 174.2— y el gasto imputado a 2027 no puede exceder del <b>70 %</b> del crédito correspondiente de 2026 en esa aplicación. La Intervención lo comprueba expresamente al fiscalizar (art. 219.2.a TRLHL).</div><h3 style=\"font-size:1rem;margin:.8rem 0 .4rem\">4 · Licitación y fase D</h3><table class=\"t\"><thead><tr><th>Fecha</th><th>Trámite</th><th>Fase</th><th>Precepto</th></tr></thead><tbody><tr><td>26 de enero</td><td>Anuncio de licitación en el <b>perfil de contratante</b>. Al ser abierto simplificado, no se publica en el BOE ni en el DOUE</td><td>—</td><td>arts. 135.1 y 159.2</td></tr><tr><td>16 de febrero</td><td>Fin del plazo de presentación, respetando el mínimo de <b>veinte días</b> en obras contado desde el siguiente a la publicación</td><td>—</td><td>art. 159.3</td></tr><tr><td>24 de febrero</td><td>La mesa califica la documentación, abre las proposiciones dentro de los <b>veinte días</b> siguientes y formula propuesta</td><td>—</td><td>art. 157.1 y 157.3</td></tr><tr><td>26 de febrero</td><td>Clasificación por orden decreciente y <b>requerimiento</b> al mejor licitador: <b>diez días hábiles</b> para documentación y garantía definitiva</td><td>—</td><td>art. 150.1 y 150.2</td></tr><tr><td>11 de marzo</td><td>Constitución de la <b>garantía definitiva</b> mediante aval bancario</td><td>—</td><td>arts. 107.1 y 108.1.b)</td></tr><tr><td>16 de marzo</td><td><b>Adjudicación</b> por resolución motivada, dentro de los <b>cinco días hábiles</b> siguientes. Notificada a todos y publicada en el perfil en <b>quince días</b></td><td><b>D</b></td><td>arts. 150.3 y 151 · art. 56 RD 500/1990</td></tr><tr><td>27 de marzo</td><td><b>Formalización</b> en documento administrativo. Como <b>no</b> cabe recurso especial, basta con formalizar en plazo no superior a <b>quince días hábiles</b> desde la notificación</td><td>—</td><td>arts. 36.1 y 153.1 y 153.3</td></tr></tbody></table><div class=\"box ej\"><span class=\"lbl\">Garantía definitiva</span>La obra se adjudica en <b>774.297,52 € sin IVA</b> (baja del 10 %). Garantía definitiva = <b>5 % del precio final ofertado, excluido el IVA</b> = <b>38.714,88 €</b> (art. 107.1). Y una advertencia: en los contratos de <b>obras</b> el órgano <b>no puede eximir</b> de garantía definitiva, aunque lo justifique en el PCAP (art. 107.1, último inciso).</div><h3 style=\"font-size:1rem;margin:.8rem 0 .4rem\">5 · Ejecución: fases O y P, mes a mes</h3><div class=\"box legal\"><span class=\"lbl\">Preceptos aplicables</span><b>Art. 237</b> — comprobación del replanteo. <b>Art. 240.1</b> — la Administración expide <b>mensualmente</b>, en los <b>primeros diez días</b> siguientes al mes al que correspondan, certificaciones de la obra ejecutada, cuyos abonos son <b>pagos a cuenta</b> sujetos a rectificación en la medición final. <b>Art. 198.4</b> — obligación de abonar el precio dentro de los <b>treinta días</b> siguientes a la <b>aprobación de las certificaciones</b>.</div><ul><li><b>Acta de comprobación del replanteo</b>: la ejecución empieza a contar desde el día siguiente.</li><li><b>Certificación mensual n.º 5</b>, por 64.500 € más IVA, expedida por el director facultativo en los primeros diez días de junio y <b>conformada</b> por el responsable del contrato (art. 62).</li><li>El contratista presenta la <b>factura electrónica</b> en el registro correspondiente dentro de los <b>treinta días</b> siguientes (art. 198.4).</li><li>La Intervención fiscaliza y se dicta el acuerdo de <b>reconocimiento de la obligación</b>: <b>fase O</b> (art. 58 RD 500/1990; art. 189.1 TRLHL).</li><li>El <b>presidente de la corporación</b> expide la <b>orden de pago</b> conforme al plan de disposición de fondos: <b>fase P</b> (arts. 186 y 187 TRLHL).</li><li><b>Pago material</b> por la Tesorería dentro de los treinta días desde la aprobación de la certificación. Superado el plazo, se devengan <b>intereses de demora</b> y la indemnización por costes de cobro de la Ley 3/2004 <i>(norma externa)</i>.</li></ul><div class=\"box warn\"><span class=\"lbl\">Detalle que suele preguntarse</span>Cuando el importe acumulado de los abonos a cuenta alcance o supere el <b>90 % del precio del contrato</b>, al expediente de pago debe acompañarse la <b>comunicación a la Intervención</b> para su eventual asistencia a la recepción, en ejercicio de sus funciones de <b>comprobación material de la inversión</b> (art. 198.2 LCSP y art. 214.2.d) TRLHL).</div><h3 style=\"font-size:1rem;margin:.8rem 0 .4rem\">6 · Extinción</h3><table class=\"t\"><thead><tr><th>Trámite</th><th>Plazo</th><th>Precepto</th></tr></thead><tbody><tr><td><b>Recepción</b> de las obras, con acta, concurriendo el facultativo designado por la Administración, el director de obra y el contratista</td><td>A la terminación</td><td>art. 243.1 y 243.2</td></tr><tr><td>Aprobación de la <b>certificación final</b>, abonada a cuenta de la liquidación</td><td><b>Tres meses</b> desde la recepción</td><td>art. 243.1</td></tr><tr><td><b>Plazo de garantía</b>, fijado en el PCAP</td><td><b>No inferior a un año</b>, salvo casos especiales</td><td>art. 243.3</td></tr><tr><td>Informe del director facultativo sobre el estado de las obras</td><td>Dentro de los <b>quince días anteriores</b> al fin del plazo de garantía</td><td>art. 243.3</td></tr><tr><td>Si el informe es favorable: <b>devolución de la garantía</b>, <b>liquidación</b> y pago de obligaciones pendientes</td><td><b>Sesenta días</b></td><td>art. 243.3</td></tr></tbody></table><div class=\"box exc\"><span class=\"lbl\">Los tres errores más frecuentes en este supuesto</span><ul><li>Calcular la garantía definitiva sobre el <b>presupuesto base</b> o con IVA. Se calcula sobre el <b>precio final ofertado sin IVA</b>.</li><li>Aplicar el plazo de espera de <b>quince días hábiles</b> del art. 153.3. Aquí <b>no cabe recurso especial</b> (valor estimado inferior a 3.000.000 €), luego no hay plazo de espera.</li><li>Situar el replanteo <b>después</b> de aprobar el expediente. El art. 236.1 lo sitúa <b>aprobado el proyecto y previamente</b> a la aprobación del expediente.</li></ul></div></div></details></section>";
</script>
<script>
document.getElementById('main').innerHTML+="<section class=\"card\" id=\"s2\"><h2>Supuesto 2 · Contrato de concesión de obras</h2><div class=\"box\"><span class=\"lbl\">El caso</span>La <b>Diputación Provincial de Málaga</b> quiere construir y explotar un <b>aparcamiento subterráneo de 420 plazas</b> bajo un recinto ferial de su titularidad. El estudio económico estima una inversión de <b>9.800.000 € sin IVA</b> y unos ingresos por tarifas de usuarios de 1.150.000 € anuales. La diputación decide aportar <b>2.000.000 €</b> a la construcción, repartidos en dos anualidades, y el pliego fija un plazo concesional de <b>32 años</b>.</div><div class=\"box warn\"><span class=\"lbl\">Se pide</span>Explica qué trámite es imprescindible <b>antes</b> de decidir siquiera si se concesiona; dónde está aquí el gasto público y cómo se tramita su ciclo; por qué el plazo de 32 años es válido; y qué diferencia sustancial hay respecto del supuesto anterior.</div><details class=\"panel\"><summary><b>Solución paso a paso</b></summary><div class=\"body\"><h3 style=\"font-size:1rem;margin:.4rem 0\">1 · Lo primero no es el proyecto: es el estudio de viabilidad</h3><div class=\"box legal\"><span class=\"lbl\">Art. 247.1 LCSP</span>«Con carácter previo a la decisión de construir y explotar en régimen de concesión unas obras, el órgano que corresponda de la Administración concedente <b>acordará la realización de un estudio de viabilidad</b> de las mismas.»</div><p class=\"small\">El art. 247.2 enumera su contenido mínimo. Los apartados que decidirán preguntas de examen son:</p><ul><li><b>b)</b> justificación de las <b>ventajas cuantitativas y cualitativas</b> que aconsejan usar la concesión de obras <b>frente a otros tipos contractuales</b>, con indicación de las variables sobre el <b>impacto de la concesión en la estabilidad presupuestaria</b>;</li><li><b>c)</b> previsiones sobre la <b>demanda de uso</b> y sobre la <b>rentabilidad</b> de la concesión;</li><li><b>g)</b> <b>riesgos operativos y tecnológicos</b> en la construcción y explotación;</li><li><b>h)</b> <b>coste de la inversión</b> y sistema de financiación propuesto.</li></ul><p class=\"small\">Después vendrán, en su caso, el <b>anteproyecto</b> de construcción y explotación (art. 248) y el <b>proyecto</b>, y los pliegos con el contenido reforzado del art. 250.</p><h3 style=\"font-size:1rem;margin:.8rem 0 .4rem\">2 · Lo que define este contrato: el riesgo operacional</h3><div class=\"box ej\"><span class=\"lbl\">Por qué esto no es un contrato de obras</span>En el supuesto 1 el ayuntamiento pagaba el 100 % de la obra por certificaciones. Aquí la contraprestación del concesionario consiste, total o parcialmente, en el <b>derecho a explotar la obra</b> (art. 14.1), y ese derecho lleva aparejada la asunción del <b>riesgo operacional</b>: el concesionario no tiene garantizado recuperar las inversiones ni cubrir los costes, porque depende de cuántos usuarios aparquen. El art. <b>265.1</b> es tajante: las obras serán financiadas, total o parcialmente, por el concesionario, «que <b>en todo caso</b> asumirá el riesgo operacional».</div><div class=\"box exc\"><span class=\"lbl\">Consecuencia contable</span>Si la Administración eliminara el riesgo —por ejemplo, garantizando un número mínimo de usuarios o pagando una cantidad fija con independencia de la demanda—, el negocio dejaría de ser concesión y sería un <b>contrato de obras</b> o de servicios, con dos efectos inmediatos: la inversión pasaría a computar íntegramente como <b>gasto e inversión de la entidad</b> y el contrato tendría que licitarse con otro régimen. Es exactamente lo que el estudio de viabilidad debe analizar en su letra b).</div><h3 style=\"font-size:1rem;margin:.8rem 0 .4rem\">3 · Dónde está el gasto público y cómo se tramita</h3><div class=\"box legal\"><span class=\"lbl\">Arts. 265.2 y 266 LCSP</span>Cuando existan razones de <b>rentabilidad económica o social</b> o singulares exigencias del fin público, la Administración <b>podrá aportar recursos públicos</b>, en forma de <b>subvenciones o préstamos reintegrables</b>, respetando en todo caso el principio de asunción del riesgo operacional. Y el art. 266.1: las aportaciones se realizan <b>durante la fase de ejecución de las obras</b> o <b>una vez concluidas</b>, y su importe lo fijan los licitadores en sus ofertas <b>dentro de la cuantía máxima que establezca el pliego</b>.</div><p class=\"small\">Aquí el gasto público son esos <b>2.000.000 €</b> de aportación a la construcción. Su ciclo es el mismo de siempre, con dos particularidades:</p><table class=\"t\"><thead><tr><th>Trámite</th><th>Fase</th><th>Precepto</th></tr></thead><tbody><tr><td>Estudio de viabilidad, sometido a información pública y aprobado por el órgano de contratación</td><td>—</td><td>art. 247</td></tr><tr><td>Resolución de inicio del expediente, publicada en el perfil</td><td>—</td><td>art. 116.1</td></tr><tr><td><b>Certificado de existencia de crédito</b> por la anualidad de 2026 y <b>compromiso de gasto plurianual</b> para las siguientes</td><td><b>RC</b></td><td>art. 116.3 LCSP · art. 174 TRLHL · art. 31 RD 500/1990</td></tr><tr><td>Fiscalización previa, que comprueba expresamente el cumplimiento del art. 174 TRLHL en los compromisos plurianuales</td><td>—</td><td>art. 219.2.a) TRLHL</td></tr><tr><td>Aprobación del expediente, apertura del procedimiento y <b>aprobación del gasto</b> por la <b>cuantía máxima</b> de aportación prevista en el pliego</td><td><b>A</b></td><td>art. 117.1 LCSP · art. 54 RD 500/1990</td></tr><tr><td><b>Adjudicación</b>: la aportación queda fijada en el importe <b>exacto</b> ofertado por el adjudicatario, dentro del máximo</td><td><b>D</b></td><td>arts. 150 y 151 · art. 266.1 · art. 56 RD 500/1990</td></tr><tr><td>Ejecución de la obra: la aportación se abona conforme al calendario del pliego, previa acreditación del avance</td><td><b>O</b></td><td>art. 266.1 · art. 58 RD 500/1990</td></tr><tr><td>Orden de pago del presidente y pago material por la Tesorería</td><td><b>P</b></td><td>arts. 186 y 187 TRLHL</td></tr></tbody></table><div class=\"box warn\"><span class=\"lbl\">Matiz de la fase A</span>Fíjate en la secuencia: el gasto se <b>autoriza</b> por la <b>cuantía máxima</b> del pliego, porque en ese momento aún no se sabe cuánto pedirá el adjudicatario; y se <b>compromete</b> por el importe <b>exactamente determinado</b> de la oferta. Es la ilustración más clara de la diferencia entre las fases A y D del art. 54 y 56 del RD 500/1990: «cuantía cierta <b>o aproximada</b>» frente a «importe <b>exactamente determinado</b>».</div><h3 style=\"font-size:1rem;margin:.8rem 0 .4rem\">4 · Órgano de contratación, plazo y retribución</h3><ul><li><b>Órgano de contratación:</b> el valor estimado de una concesión se calcula por el <b>importe neto de la cifra de negocios</b> que generará la concesionaria durante toda la ejecución, sin IVA (art. 101.1.b). Con 1.150.000 € anuales durante 32 años, ese importe supera con holgura los 6.000.000 € de la disposición adicional segunda: la competencia es del <b>Pleno</b> de la diputación.</li><li><b>Recurso especial:</b> <b>sí cabe</b>. El art. 44.1.c) lo admite en concesiones de obras de valor estimado superior a <b>3.000.000 €</b>. Por tanto <b>sí rige</b> el plazo de espera de <b>quince días hábiles</b> antes de formalizar (art. 153.3).</li><li><b>Plazo:</b> 32 años es válido. El art. 29.6.a) fija el máximo en <b>cuarenta años</b> para las concesiones de obras. Y la duración debe calcularse en función del tiempo razonable para que el concesionario recupere las inversiones con un rendimiento sobre el capital invertido.</li><li><b>Retribución:</b> las <b>tarifas</b> que abonan los usuarios son <b>prestación patrimonial de carácter público no tributario</b> y las fija el órgano de contratación <b>en el acuerdo de adjudicación</b>, con carácter de <b>máximas</b> (art. 267.1 y 267.2).</li></ul><h3 style=\"font-size:1rem;margin:.8rem 0 .4rem\">5 · A lo largo de la vida de la concesión</h3><ul><li><b>Equilibrio económico</b> (art. 270): debe mantenerse en los términos del contrato. Se restablece cuando la Administración modifica el contrato por razones de interés público, cuando actuaciones de la propia Administración concedente lo alteran directamente o cuando concurren los supuestos de fuerza mayor previstos en la ley. Si el restablecimiento se articula mediante <b>aportación económica</b>, vuelve a activarse un ciclo de gasto completo, con su RC previa.</li><li><b>Reversión</b>: al extinguirse la concesión, las obras revierten a la Administración, que debe recibirlas en el estado de conservación y funcionamiento previsto.</li><li><b>Garantía definitiva</b>: en las concesiones, su importe lo fija <b>en cada caso</b> el órgano de contratación en el PCAP, atendiendo a la naturaleza, importancia y duración de la concesión, y no por el 5 % general (art. 107.4).</li></ul><div class=\"box exc\"><span class=\"lbl\">Los tres errores más frecuentes en este supuesto</span><ul><li>Empezar por el proyecto. Antes está el <b>estudio de viabilidad</b> del art. 247, que es específico de la concesión de obras.</li><li>Pensar que si hay aportación pública desaparece la concesión. No: el art. 265.2 la admite <b>siempre que se respete el riesgo operacional</b>.</li><li>Calcular la garantía definitiva como el 5 % del precio. En concesiones se fija <b>caso a caso en el PCAP</b> (art. 107.4).</li></ul></div></div></details></section>";
</script>
<script>
document.getElementById('main').innerHTML+="<section class=\"card\" id=\"s3\"><h2>Supuesto 3 · Contrato de concesión de servicios</h2><div class=\"box\"><span class=\"lbl\">El caso</span>El <b>Ayuntamiento de Ronda</b> saca a licitación la <b>explotación de la piscina cubierta municipal</b> —construida ya y de titularidad municipal— por un plazo de <b>ocho años prorrogable dos</b>. El concesionario cobrará <b>tarifas a los usuarios</b> (abonos, entradas y cursos) y asumirá el personal, los suministros y el mantenimiento. Como las tarifas sociales no cubren el coste de los grupos de mayores y de personas con discapacidad, el pliego prevé una <b>aportación municipal de 95.000 € anuales</b> vinculada a esos usos, y a la vez un <b>canon anual de 12.000 €</b> a favor del ayuntamiento por la explotación de la cafetería.</div><div class=\"box warn\"><span class=\"lbl\">Se pide</span>Determina si el riesgo operacional sobrevive con esa aportación; identifica los <b>dos</b> flujos económicos y a cuál de ellos se aplica el ciclo del gasto; y sitúa las fases RC, A, D, O y P a lo largo de los ocho años.</div><details class=\"panel\"><summary><b>Solución paso a paso</b></summary><div class=\"body\"><h3 style=\"font-size:1rem;margin:.4rem 0\">1 · Calificación: ¿concesión de servicios o contrato de servicios?</h3><div class=\"box ej\"><span class=\"lbl\">La prueba del riesgo</span>La frontera no está en quién presta el servicio ni en quién cobra, sino en <b>quién soporta el riesgo</b>. Aquí el concesionario cobra de los usuarios y sus ingresos dependen de cuántos abonados haya: si la piscina se vacía, pierde dinero. La aportación municipal de 95.000 € está <b>vinculada a usos concretos</b> y no garantiza la recuperación de la inversión ni la cobertura de los costes de explotación. <b>El riesgo operacional subsiste</b>, luego es una <b>concesión de servicios</b>.</div><div class=\"box exc\"><span class=\"lbl\">Dónde se rompería</span>Si el pliego garantizase al adjudicatario unos ingresos mínimos o le pagase una cantidad fija por disponibilidad con independencia de los usuarios, el riesgo desaparecería y el negocio sería un <b>contrato de servicios</b>. Cambia todo: régimen de pago, duración máxima —<b>cinco años</b> en servicios de tracto sucesivo, art. 29.4— y forma de acreditar la prestación.</div><h3 style=\"font-size:1rem;margin:.8rem 0 .4rem\">2 · Los dos flujos: uno es gasto y el otro es ingreso</h3><table class=\"t\"><thead><tr><th>Flujo</th><th>Naturaleza</th><th>Régimen</th><th>Precepto</th></tr></thead><tbody><tr><td><b>Tarifas</b> que pagan los usuarios al concesionario</td><td>Contraprestación económica del concesionario</td><td><b>Prestación patrimonial de carácter público no tributario.</b> No entra en el presupuesto municipal: no hay gasto ni ingreso para el ayuntamiento</td><td>art. 289.1 y 289.2</td></tr><tr><td><b>Aportación municipal</b> de 95.000 € anuales</td><td><b>GASTO</b> del ayuntamiento</td><td>Recorre el ciclo completo RC · A · D · O · P</td><td>arts. 184 y 185 TRLHL</td></tr><tr><td><b>Canon</b> de 12.000 € anuales por la cafetería</td><td><b>INGRESO</b> del ayuntamiento</td><td>No es gasto: es un derecho a liquidar y recaudar. El PCAP fija su forma y condiciones</td><td>arts. 285.1.b) y 289.3</td></tr></tbody></table><div class=\"box warn\"><span class=\"lbl\">La trampa del supuesto</span>Un mismo contrato puede generar simultáneamente <b>gasto</b> e <b>ingreso</b> para la entidad. El ciclo RC-A-D-O-P se aplica <b>solo al gasto</b>: los 95.000 € anuales. El canon sigue el circuito de los <b>derechos</b>: reconocimiento del derecho, liquidación, contracción en cuentas y recaudación.</div><h3 style=\"font-size:1rem;margin:.8rem 0 .4rem\">3 · El ciclo del gasto, año a año</h3><table class=\"t\"><thead><tr><th>Momento</th><th>Trámite</th><th>Fase</th><th>Precepto</th></tr></thead><tbody><tr><td>Antes de licitar</td><td>Informe de necesidad e idoneidad y <b>memoria justificativa</b>; los pliegos deben fijar las condiciones de prestación, las tarifas, su revisión y el canon</td><td>—</td><td>arts. 28.1 y 285.1</td></tr><tr><td>Antes de licitar</td><td><b>Certificado de existencia de crédito</b> por la anualidad de 2026 y <b>compromiso plurianual</b> por las restantes. Al ser un contrato de tracto sucesivo que no puede estipularse por un año, encaja en la letra b) del art. 174.2</td><td><b>RC</b></td><td>art. 116.3 LCSP · art. 174 TRLHL</td></tr><tr><td>Aprobación</td><td>Resolución que aprueba el expediente, abre el procedimiento y <b>aprueba el gasto</b> por el importe máximo de la aportación</td><td><b>A</b></td><td>art. 117.1 · art. 54 RD 500/1990</td></tr><tr><td>Adjudicación</td><td>La aportación queda fijada en el importe exacto ofertado. Se compromete el gasto de todas las anualidades</td><td><b>D</b></td><td>arts. 150 y 151 · art. 56 RD 500/1990</td></tr><tr><td>Formalización</td><td>El contrato nace. El concesionario inicia la explotación en la fecha prevista</td><td>—</td><td>arts. 36.1 y 153</td></tr><tr><td>Cada mes o trimestre</td><td>El concesionario acredita los usos subvencionados y presenta factura; el <b>responsable del contrato</b> conforma; se reconoce la obligación</td><td><b>O</b></td><td>art. 62 LCSP · arts. 58 y 59 RD 500/1990</td></tr><tr><td>Cada mes o trimestre</td><td>Orden de pago del presidente y pago material dentro de los <b>treinta días</b> desde la conformidad</td><td><b>P</b></td><td>art. 198.4 LCSP · arts. 186 y 187 TRLHL</td></tr></tbody></table><h3 style=\"font-size:1rem;margin:.8rem 0 .4rem\">4 · Duración, órgano y garantías</h3><ul><li><b>Duración:</b> ocho años más dos de prórroga = <b>diez años</b>. Válido: el art. 29.6.b) fija el máximo en <b>veinticinco años</b> para las concesiones de servicios que no comprendan la explotación de un servicio sanitario. Y no se aplica el límite de cinco años del art. 29.4, que es propio de los <b>contratos de servicios</b>.</li><li><b>Valor estimado:</b> el <b>importe neto de la cifra de negocios</b> que generará la concesionaria durante toda la ejecución, sin IVA, incluidas las prórrogas previstas y las aportaciones públicas (arts. 101.1.b y 101.3.b). Es una cifra muy superior a la mera suma de las aportaciones municipales.</li><li><b>Recurso especial:</b> depende de ese valor estimado. Si supera los <b>3.000.000 €</b>, cabe recurso especial (art. 44.1.c) y rige el plazo de espera de quince días hábiles.</li><li><b>Garantía definitiva:</b> como en la concesión de obras, su importe lo fija el órgano de contratación en el PCAP atendiendo a la naturaleza, importancia y duración de la concesión (art. 107.4).</li></ul><h3 style=\"font-size:1rem;margin:.8rem 0 .4rem\">5 · Un incidente típico: el equilibrio económico</h3><div class=\"box legal\"><span class=\"lbl\">Art. 290.4 LCSP</span>Se deberá restablecer el equilibrio económico del contrato, en beneficio de la parte que corresponda, cuando la Administración <b>modifique</b> las características del servicio o las tarifas por razones de interés público, y cuando <b>actuaciones de la Administración concedente</b>, por su carácter obligatorio para el concesionario, determinen de forma directa la <b>ruptura sustancial de la economía del contrato</b>.</div><p class=\"small\">Si el ayuntamiento impusiera, por acuerdo plenario, la gratuidad de la piscina para los menores de 14 años, estaríamos ante una modificación de las tarifas por razones de interés público. Procedería el restablecimiento del equilibrio, y la compensación económica que se acordara <b>abre un nuevo ciclo de gasto</b>: RC, autorización, compromiso, reconocimiento y pago. En cambio, si el acuerdo municipal <b>careciera de trascendencia económica</b>, el concesionario no tendría derecho a indemnización (art. 290.3).</p><div class=\"box exc\"><span class=\"lbl\">Los tres errores más frecuentes en este supuesto</span><ul><li>Aplicar el límite de <b>cinco años</b> del art. 29.4. Ese es el de los <b>contratos de servicios</b>; en concesiones el techo es de 25 años —10 si es sanitario—.</li><li>Tratar las <b>tarifas de los usuarios</b> como ingreso presupuestario municipal. No lo son: las percibe el concesionario y son prestación patrimonial pública <b>no tributaria</b>.</li><li>Olvidar que aportación y canon conviven: uno es gasto y el otro ingreso, y solo el primero recorre el ciclo RC-A-D-O-P.</li></ul></div></div></details></section>";
</script>
<script>
document.getElementById('main').innerHTML+="<section class=\"card\" id=\"s4\"><h2>Supuesto 4 · Contrato de servicios</h2><div class=\"box\"><span class=\"lbl\">El caso</span>El <b>Ayuntamiento de Vélez-Málaga</b> licita el <b>servicio de limpieza de nueve colegios públicos y tres edificios administrativos</b>, con una duración de <b>dos años prorrogables por otros dos</b>. El presupuesto base de licitación anual es de <b>318.000 € IVA incluido</b> (262.809,92 € de base más 55.190,08 € de IVA). El pliego prevé un solo criterio, el precio, y un umbral de anormalidad para las bajas superiores en más de diez puntos porcentuales a la media de las ofertas.</div><div class=\"box warn\"><span class=\"lbl\">Se pide</span>Calcula el valor estimado y di si cabe recurso especial; identifica el informe específico que exige un contrato de servicios; explica cómo se acredita la prestación mes a mes; y resuelve qué ocurre si una oferta es anormalmente baja porque no cubre el convenio colectivo.</div><details class=\"panel\"><summary><b>Solución paso a paso</b></summary><div class=\"body\"><h3 style=\"font-size:1rem;margin:.4rem 0\">1 · Valor estimado y consecuencias</h3><div class=\"box ej\"><span class=\"lbl\">Cálculo</span>Las <b>prórrogas previstas se computan</b> (art. 101.2.a). Valor estimado = 262.809,92 € × 4 años = <b>1.051.239,68 €</b>.<br><b>Recurso especial:</b> <b>sí</b>. El art. 44.1.a) lo admite en servicios de valor estimado superior a <b>100.000 €</b>. Y ese umbral, ojo, <b>no coincide</b> con el de la regulación armonizada.<br><b>Consecuencia inmediata:</b> rige el <b>plazo de espera de quince días hábiles</b> del art. 153.3 antes de poder formalizar.<br><b>Órgano de contratación:</b> con 1.051.239,68 € de valor estimado y cuatro años de duración, sigue estando por debajo del 10 % de los recursos ordinarios y de los 6.000.000 €, de modo que corresponde al <b>alcalde</b> —o a la Junta de Gobierno por delegación— conforme a la disposición adicional segunda, apartado 1.<br><b>Duración:</b> 2 + 2 = <b>cuatro años</b>. Dentro del máximo de <b>cinco años</b> del art. 29.4 para los servicios de prestación sucesiva, prórrogas incluidas.</div><h3 style=\"font-size:1rem;margin:.8rem 0 .4rem\">2 · El trámite que solo tienen los servicios</h3><div class=\"box legal\"><span class=\"lbl\">Art. 116.4.f) LCSP</span>En el expediente se justificará adecuadamente «<b>en los contratos de servicios, el informe de insuficiencia de medios</b>».</div><p class=\"small\">Es la letra f) de las siete del art. 116.4 y <b>solo</b> se exige en los contratos de servicios: no en obras, ni en suministros, ni en concesiones. Debe explicar por qué la plantilla municipal no puede asumir la prestación —falta de personal, de maquinaria o de especialización— y firmarlo el responsable del área.</p><p class=\"small\">Las otras seis letras se justifican igualmente: <b>a)</b> elección del procedimiento; <b>b)</b> clasificación exigida; <b>c)</b> criterios de solvencia y de adjudicación y condiciones especiales de ejecución; <b>d)</b> valor estimado con todos sus conceptos, incluidos los costes laborales; <b>e)</b> la necesidad; <b>g)</b> la no división en lotes, si se opta por no dividir.</p><h3 style=\"font-size:1rem;margin:.8rem 0 .4rem\">3 · Las fases del gasto</h3><table class=\"t\"><thead><tr><th>Fecha</th><th>Trámite</th><th>Fase</th><th>Precepto</th></tr></thead><tbody><tr><td>3 de febrero</td><td>Resolución de inicio, publicada en el perfil; informe de necesidad y de insuficiencia de medios</td><td>—</td><td>arts. 28.1, 116.1 y 116.4.f)</td></tr><tr><td>5 de febrero</td><td><b>Certificado de existencia de crédito</b> por la anualidad corriente y <b>compromiso plurianual</b> por las tres restantes: contrato de tracto sucesivo que no puede estipularse por un año</td><td><b>RC</b></td><td>art. 116.3 LCSP · art. 174.2.b) TRLHL</td></tr><tr><td>10 de febrero</td><td>Fiscalización previa favorable</td><td>—</td><td>art. 214.2.a) TRLHL</td></tr><tr><td>12 de febrero</td><td>Aprobación del expediente, apertura del procedimiento y <b>aprobación del gasto</b></td><td><b>A</b></td><td>art. 117.1 · art. 54 RD 500/1990</td></tr><tr><td>13 de febrero</td><td>Anuncio en el perfil de contratante</td><td>—</td><td>art. 135.1</td></tr><tr><td>28 de febrero</td><td>Fin del plazo de presentación: <b>quince días</b> en el abierto simplificado de servicios</td><td>—</td><td>art. 159.3</td></tr><tr><td>4 de marzo</td><td>Apertura de proposiciones —dentro de los veinte días— y clasificación</td><td>—</td><td>arts. 157.3 y 150.1</td></tr><tr><td>6 al 20 de marzo</td><td>Requerimiento de <b>diez días hábiles</b>: documentación y <b>garantía definitiva del 5 %</b> del precio ofertado sin IVA</td><td>—</td><td>arts. 150.2 y 107.1</td></tr><tr><td>25 de marzo</td><td><b>Adjudicación</b> en cinco días hábiles, notificada y publicada</td><td><b>D</b></td><td>arts. 150.3 y 151 · art. 56 RD 500/1990</td></tr><tr><td>17 de abril</td><td><b>Formalización</b>, no antes de quince días hábiles desde la remisión de la notificación, y en plazo no superior a cinco días desde el requerimiento</td><td>—</td><td>art. 153.3</td></tr><tr><td>Cada mes</td><td>Factura electrónica, <b>conformidad</b> del responsable del contrato y <b>reconocimiento de la obligación</b></td><td><b>O</b></td><td>art. 62 y 198.4 LCSP · arts. 58 y 59 RD 500/1990</td></tr><tr><td>Cada mes</td><td>Orden de pago y pago material dentro de los <b>treinta días</b> desde la conformidad</td><td><b>P</b></td><td>art. 198.4 LCSP · arts. 186 y 187 TRLHL</td></tr></tbody></table><div class=\"box warn\"><span class=\"lbl\">Cómo se acredita la prestación en un servicio</span>No hay certificaciones de obra. La prestación se acredita con la <b>factura conformada</b> por quien puede dar fe de que el servicio se ha prestado: el <b>responsable del contrato</b> del art. 62. El art. 59.1 del RD 500/1990 exige acreditar documentalmente ante el órgano competente «<b>la realización de la prestación o el derecho del acreedor</b>» antes de reconocer la obligación, y el art. 59.2 remite a las <b>bases de ejecución del presupuesto</b> para concretar qué documentos lo justifican en cada tipo de gasto.</div><h3 style=\"font-size:1rem;margin:.8rem 0 .4rem\">4 · El incidente: una oferta anormalmente baja</h3><p class=\"small\">Se presentan cuatro ofertas: 244.000, 239.500, 234.000 y <b>166.000 €</b> sin IVA. La media es 220.875 €; la última está un 24,8 % por debajo, de modo que queda <b>incursa en presunción de anormalidad</b> conforme al parámetro del pliego (art. 149.2).</p><ul><li><b>No se rechaza automáticamente.</b> El art. 149.4 obliga a <b>requerir al licitador</b> para que justifique y desglose razonada y detalladamente el bajo nivel de los precios o costes.</li><li>La empresa aporta el desglose y de él resulta un <b>coste/hora inferior al del convenio colectivo</b> del sector.</li><li>Entonces el rechazo deja de ser una opción: el art. 149.4 obliga a <b>rechazar</b> la oferta cuando se compruebe que es anormalmente baja porque <b>incumple las obligaciones aplicables en materia medioambiental, social o laboral</b>, incluidos los convenios colectivos sectoriales vigentes.</li><li>Efecto en los plazos: los plazos para adjudicar del art. 158 se <b>amplían en quince días hábiles</b> por haber tenido que seguir los trámites del art. 149.4 (art. 158.3).</li><li>Y si la oferta se hubiera admitido, el órgano podría exigir una <b>garantía complementaria</b> de hasta otro 5 % por haber estado incursa en presunción de anormalidad (art. 107.2).</li></ul><div class=\"box exc\"><span class=\"lbl\">Los tres errores más frecuentes en este supuesto</span><ul><li>Calcular el valor estimado sobre una sola anualidad. Las <b>prórrogas previstas se computan</b> (art. 101.2.a): 4 años, no 2.</li><li>Olvidar el <b>informe de insuficiencia de medios</b>. Es la letra f) del art. 116.4 y solo aparece en los contratos de servicios.</li><li>Excluir la oferta anormal sin audiencia previa. Sin el requerimiento del art. 149.4, la exclusión es nula.</li></ul></div></div></details></section>";
</script>
<script>
document.getElementById('main').innerHTML+="<section class=\"card\" id=\"s5\"><h2>Supuesto 5 · Contrato de suministro</h2><div class=\"box\"><span class=\"lbl\">El caso</span>La <b>Diputación Provincial de Málaga</b> licita el <b>suministro e instalación de 240 equipos informáticos</b> para sus centros comarcales, con entrega en dos lotes territoriales y un plazo de entrega de <b>60 días</b> desde la formalización. El presupuesto base de licitación es de <b>289.000 € IVA incluido</b> (238.842,98 € de base más 50.157,02 € de IVA). El contrato es de ejecución única, sin prórrogas, y el PPT exige un rendimiento mínimo del procesador, 16 GB de memoria y accesibilidad conforme a la normativa de discapacidad.</div><div class=\"box warn\"><span class=\"lbl\">Se pide</span>Sitúa las fases del gasto en un contrato que se ejecuta de una sola vez; explica cómo se acredita aquí la prestación y en qué plazo; y resuelve qué ocurre si en la recepción se detecta que veinte equipos no cumplen el PPT.</div><details class=\"panel\"><summary><b>Solución paso a paso</b></summary><div class=\"body\"><h3 style=\"font-size:1rem;margin:.4rem 0\">1 · Preparación y fases RC y A</h3><div class=\"box ej\"><span class=\"lbl\">Datos que decide el supuesto</span><b>Valor estimado</b> (art. 101.1.a) = 238.842,98 € sin IVA, sin prórrogas ni opciones.<br><b>¿Cabe recurso especial?</b> <b>Sí</b>: supera los <b>100.000 €</b> del art. 44.1.a) para suministros. Rige el plazo de espera de quince días hábiles del art. 153.3.<br><b>¿Es SARA?</b> Hay que compararlo con el umbral del art. 21.1.a), que se actualiza cada dos años por reglamento delegado de la Comisión Europea: <b>verifica la cifra vigente en el BOE consolidado</b>. De la respuesta depende que haya que publicar en el <b>DOUE</b> (art. 135.1) y que el plazo mínimo de presentación sea de <b>treinta y cinco días</b> desde el envío del anuncio (art. 156.2).<br><b>Lotes:</b> el contrato se divide en dos lotes territoriales, que es la <b>regla general</b> del art. 99.3. Pero el <b>valor estimado</b> se calcula sobre el <b>conjunto</b> de los lotes (arts. 99.6 y 101.12), y cada lote constituye un contrato distinto (art. 99.7).</div><table class=\"t\"><thead><tr><th>Trámite</th><th>Fase</th><th>Precepto</th></tr></thead><tbody><tr><td>Informe de necesidad e idoneidad. En suministros <b>no</b> hace falta informe de insuficiencia de medios</td><td>—</td><td>art. 28.1 · <i>a contrario</i>, art. 116.4.f)</td></tr><tr><td>Resolución de inicio del expediente, publicada en el perfil</td><td>—</td><td>art. 116.1</td></tr><tr><td><b>Certificado de existencia de crédito</b>: al ser de ejecución única dentro del ejercicio, <b>no</b> hay compromiso plurianual</td><td><b>RC</b></td><td>art. 116.3 · art. 31 RD 500/1990</td></tr><tr><td>PCAP y PPT, y justificación de las siete letras del art. 116.4</td><td>—</td><td>arts. 116.3, 116.4, 122 y 124</td></tr><tr><td>Fiscalización previa favorable</td><td>—</td><td>art. 214.2.a) TRLHL</td></tr><tr><td>Aprobación del expediente, apertura del procedimiento y <b>aprobación del gasto</b></td><td><b>A</b></td><td>art. 117.1 · art. 54 RD 500/1990</td></tr></tbody></table><h3 style=\"font-size:1rem;margin:.8rem 0 .4rem\">2 · Adjudicación: fase D</h3><ul><li>Clasificación por orden decreciente y <b>requerimiento</b> de diez días hábiles al mejor licitador de cada lote (art. 150.1 y 150.2).</li><li><b>Garantía definitiva del 5 %</b> del precio final ofertado sin IVA (art. 107.1). Puede constituirse en efectivo o valores de Deuda Pública, mediante aval o mediante seguro de caución (art. 108.1), y su acreditación puede hacerse por medios electrónicos (art. 108.3).</li><li><b>Adjudicación</b> por resolución motivada dentro de los <b>cinco días hábiles</b> siguientes a la recepción de la documentación; notificada a todos y publicada en el perfil en <b>quince días</b> (arts. 150.3 y 151.1). Aquí se produce la <b>fase D</b>: el gasto queda comprometido por importe exactamente determinado.</li><li><b>Formalización</b> no antes de quince días hábiles desde la remisión de la notificación —cabe recurso especial— y después, requerimiento y cinco días para firmar (art. 153.3).</li></ul><h3 style=\"font-size:1rem;margin:.8rem 0 .4rem\">3 · Lo específico del suministro: entrega y recepción</h3><div class=\"box legal\"><span class=\"lbl\">Arts. 300 y 210 LCSP</span><b>Art. 300.1</b> — el contratista está obligado a entregar los bienes «<b>en el tiempo y lugar fijados en el contrato</b>» y conforme a las prescripciones técnicas y cláusulas administrativas. <b>Art. 300.3</b> — cuando el acto formal de recepción sea <b>posterior</b> a la entrega, la Administración es responsable de la <b>custodia</b> de los bienes en ese intervalo. <b>Art. 210.2</b> — la constatación del cumplimiento exige un <b>acto formal y positivo de recepción o conformidad dentro del mes siguiente</b> a la entrega, o en el plazo que fije el PCAP por razón de sus características.</div><div class=\"box ej\"><span class=\"lbl\">La secuencia real</span><b>18 de mayo</b> · el contratista entrega los 240 equipos en el almacén provincial. Desde ese momento y hasta la recepción, la <b>custodia</b> es de la diputación (art. 300.3).<br><b>4 de junio</b> · <b>acto formal de recepción</b>, dentro del mes siguiente a la entrega, con asistencia del responsable del contrato y del técnico del servicio de Informática. Se levanta acta. Si el importe lo exige, se comunica a la <b>Intervención</b> para su eventual asistencia en ejercicio de la <b>comprobación material de la inversión</b> (art. 198.2 LCSP y art. 214.2.d) TRLHL).<br><b>Recepción conforme → factura conformada → fase O.</b> Y desde la conformidad corren los <b>treinta días</b> del art. 198.4 para pagar.<br><b>Plazo de garantía</b>: se cuenta <b>desde la fecha de recepción o conformidad</b> y, transcurrido sin objeciones, se extingue la responsabilidad del contratista y se devuelve la garantía definitiva (art. 210.3).</div><h3 style=\"font-size:1rem;margin:.8rem 0 .4rem\">4 · El incidente: veinte equipos no cumplen el PPT</h3><ul><li>El <b>art. 210.2</b> exige un acto <b>formal y positivo</b>. Si los bienes no se ajustan a la prestación contratada, <b>no procede la recepción</b>: se hace constar en el acta y se dan al contratista las instrucciones precisas para que subsane.</li><li><b>Sin recepción no hay fase O.</b> No puede reconocerse la obligación de los veinte equipos rechazados, porque el art. 59.1 del RD 500/1990 exige acreditar previamente <b>la realización de la prestación</b>. Y sin fase O no hay orden de pago ni pago.</li><li>Sí puede recibirse y pagarse <b>la parte conforme</b> —220 equipos—, mediante recepción parcial si el PCAP la prevé, ya que el art. 198.2 admite el pago parcial mediante abonos a cuenta.</li><li>Si el contratista no subsana, entran en juego las <b>penalidades por demora</b> y, en su caso, la <b>resolución</b> del contrato, con incautación de la garantía definitiva en los términos legalmente previstos.</li><li>Y un detalle: el <b>plazo de treinta días</b> del art. 198.4 no empieza a correr con la entrega, sino con la <b>conformidad</b>. Rechazada la recepción, no hay mora de la Administración.</li></ul><div class=\"box exc\"><span class=\"lbl\">Los tres errores más frecuentes en este supuesto</span><ul><li>Confundir <b>entrega</b> con <b>recepción</b>. La entrega es un hecho del contratista; la recepción, un <b>acto formal y positivo</b> de la Administración dentro del mes siguiente (art. 210.2).</li><li>Reconocer la obligación con la sola factura. Hace falta acreditar la prestación: <b>recepción o conformidad</b> previa (art. 59.1 RD 500/1990).</li><li>Contar el plazo de garantía desde la entrega. Se cuenta <b>desde la recepción o conformidad</b> (art. 210.3).</li></ul></div></div></details></section>";
</script>
<script>
document.getElementById('main').innerHTML+="<section class=\"card\" id=\"s6\"><h2>Supuesto 6 · Contrato menor</h2><div class=\"box\"><span class=\"lbl\">El caso</span>El <b>Ayuntamiento de Antequera</b> necesita tres cosas distintas en el mismo mes:<br><b>A)</b> Reparar la cubierta de un aula del colegio Reina Sofía. Presupuesto de la empresa: <b>40.453,00 € IVA incluido</b>. La reparación afecta a la <b>estanqueidad</b> de la obra.<br><b>B)</b> Contratar la asistencia técnica para la revisión de un plan urbanístico por <b>17.800 € IVA incluido</b>.<br><b>C)</b> Comprar material de oficina por <b>860 € IVA incluido</b>, con pago a través del sistema de <b>anticipos de caja fija</b>.<br>Ese mismo año, la empresa que reparará la cubierta ya ha recibido de este ayuntamiento dos contratos menores de obra por 18.000 € y 12.000 €.</div><div class=\"box warn\"><span class=\"lbl\">Se pide</span>Califica cada uno de los tres supuestos, di qué trámites exige el expediente, cómo se comprime el ciclo del gasto en el contrato menor y qué comprobación adicional impone el art. 118.4.</div><details class=\"panel\"><summary><b>Solución paso a paso</b></summary><div class=\"body\"><h3 style=\"font-size:1rem;margin:.4rem 0\">1 · Calificación: la cifra es de valor estimado, sin IVA</h3><table class=\"t\"><thead><tr><th></th><th>Importe con IVA</th><th>Valor estimado (÷ 1,21)</th><th>Umbral</th><th>¿Menor?</th></tr></thead><tbody><tr><td><b>A</b> · obras</td><td>40.453,00 €</td><td><b>33.432,23 €</b></td><td>&lt; 40.000 €</td><td><b>Sí</b></td></tr><tr><td><b>B</b> · servicios</td><td>17.800,00 €</td><td><b>14.710,74 €</b></td><td>&lt; 15.000 €</td><td><b>Sí</b>, por poco</td></tr><tr><td><b>C</b> · suministro</td><td>860,00 €</td><td><b>710,74 €</b></td><td>&lt; 15.000 €</td><td><b>Sí</b></td></tr></tbody></table><div class=\"box warn\"><span class=\"lbl\">La trampa número uno</span>Los umbrales del art. 118.1 se miden sobre el <b>valor estimado</b>, que va <b>sin IVA</b> (art. 101.1.a). Si compararas los 40.453 € con los 40.000 € concluirías —mal— que no es contrato menor. Y la ley dice «<b>inferior a</b>»: 40.000 € exactos ya no sería menor.</div><h3 style=\"font-size:1rem;margin:.8rem 0 .4rem\">2 · Qué exige el expediente de cada uno</h3><div class=\"box legal\"><span class=\"lbl\">Art. 118 LCSP</span><b>118.2</b> — informe del órgano de contratación justificando de manera motivada la <b>necesidad</b> del contrato y <b>que no se está alterando su objeto</b> para evitar la aplicación de los umbrales. <b>118.3</b> — <b>aprobación del gasto</b> e <b>incorporación de la factura</b>. <b>118.4</b> — en el contrato menor <b>de obras</b>, además, el <b>presupuesto de las obras</b>, el <b>proyecto</b> cuando lo exijan las disposiciones vigentes, y el <b>informe de la oficina de supervisión</b> del art. 235 «<b>cuando el trabajo afecte a la estabilidad, seguridad o estanqueidad de la obra</b>». <b>118.5</b> — lo dispuesto en el apartado 2 <b>no se aplica</b> a los contratos cuyo pago se verifique a través de <b>anticipos de caja fija</b> u otro sistema similar, siempre que el valor estimado no exceda de <b>5.000 €</b>. <b>118.6</b> — se publicarán en la forma del art. 63.4.</div><table class=\"t\"><thead><tr><th></th><th>Informe 118.2</th><th>Aprobación del gasto</th><th>Factura</th><th>Extras</th></tr></thead><tbody><tr><td><b>A</b></td><td>Sí</td><td>Sí</td><td>Sí</td><td><b>Presupuesto de las obras</b> y, al afectar a la <b>estanqueidad</b>, <b>informe de supervisión preceptivo</b> (art. 118.4)</td></tr><tr><td><b>B</b></td><td>Sí</td><td>Sí</td><td>Sí</td><td>—</td></tr><tr><td><b>C</b></td><td><b>No</b>, por el art. 118.5: pago por anticipos de caja fija y valor estimado inferior a 5.000 €</td><td>Sí</td><td>Sí</td><td>—</td></tr></tbody></table><h3 style=\"font-size:1rem;margin:.8rem 0 .4rem\">3 · El ciclo del gasto, comprimido</h3><div class=\"box ej\"><span class=\"lbl\">Cómo se resuelve en la práctica</span>En el contrato menor no hay licitación, de modo que <b>no hay nada que separe la autorización de la disposición</b>: no existe un intervalo entre «decido gastar» y «pacto con este tercero». Por eso el art. <b>67 del RD 500/1990</b> permite que un mismo acto administrativo abarque varias fases, y lo habitual es tramitar un único documento contable <b>ADO</b> —autorización, disposición y reconocimiento de la obligación— o incluso <b>ADOP</b> si se incorpora la propuesta de pago.</div><table class=\"t\"><thead><tr><th>Trámite</th><th>Fase</th><th>Precepto</th></tr></thead><tbody><tr><td>Informe del órgano de contratación: necesidad y no alteración del objeto</td><td>—</td><td>art. 118.2</td></tr><tr><td>Certificado de existencia de crédito / retención</td><td><b>RC</b></td><td>art. 31 RD 500/1990</td></tr><tr><td><b>No hay fiscalización previa</b>: los contratos menores están expresamente excluidos de intervención previa</td><td>—</td><td><b>art. 219.1 TRLHL</b></td></tr><tr><td>Resolución que aprueba el gasto y adjudica directamente</td><td><b>A + D</b></td><td>arts. 118.3 y 131.3 · arts. 54, 56 y 67 RD 500/1990</td></tr><tr><td>Ejecución y presentación de la <b>factura</b>, conformada por el responsable</td><td><b>O</b></td><td>arts. 118.3 y 62 LCSP · arts. 58 y 59 RD 500/1990</td></tr><tr><td>Orden de pago y pago material dentro de los <b>treinta días</b> desde la conformidad</td><td><b>P</b></td><td>art. 198.4 LCSP · arts. 186 y 187 TRLHL</td></tr><tr><td>Publicación <b>al menos trimestral</b> en el perfil de contratante: objeto, duración, <b>importe de adjudicación con IVA</b> e identidad del adjudicatario</td><td>—</td><td>arts. 118.6 y 63.4</td></tr></tbody></table><div class=\"box warn\"><span class=\"lbl\">La ausencia de fiscalización previa no es ausencia de control</b></span>El art. 219.1 TRLHL excluye de intervención previa los contratos menores, pero eso <b>no</b> exime de la <b>existencia de crédito</b> ni del <b>control financiero posterior</b> ni de la <b>intervención formal y material del pago</b> (art. 214.2.b y 214.2.c). Lo que desaparece es la fiscalización crítica <b>previa</b> del expediente, no todo el control.</div><h3 style=\"font-size:1rem;margin:.8rem 0 .4rem\">4 · La comprobación del art. 118.4 y el fraccionamiento</h3><p class=\"small\">La empresa que va a reparar la cubierta ya tiene dos contratos menores de obra de este ayuntamiento por 18.000 € y 12.000 €. Sumado el nuevo, acumula <b>18.000 + 12.000 + 33.432,23 = 63.432,23 €</b> en contratos menores de obra en el mismo ejercicio.</p><div class=\"box exc\"><span class=\"lbl\">Qué hay que hacer</span>Este dato debe examinarse a la luz del art. <b>99.2</b>: está prohibido fraccionar un contrato «<b>con la finalidad de disminuir la cuantía del mismo y eludir</b>» los requisitos de publicidad o de procedimiento. La clave es si los tres encargos responden a <b>una misma obra</b> troceada o a <b>obras distintas e independientes</b> —cubiertas de tres colegios diferentes, por ejemplo—. Si fueran partes de una misma actuación, el fraccionamiento sería ilícito y habría que licitar el conjunto. Y en todo caso, la <b>publicidad trimestral</b> del art. 63.4, ordenada por identidad del adjudicatario, es precisamente el mecanismo que permite detectar esa concentración desde fuera.</div><h3 style=\"font-size:1rem;margin:.8rem 0 .4rem\">5 · Los límites que no se pueden saltar</h3><ul><li><b>Duración máxima un año</b> y <b>prohibida la prórroga</b> (art. 29.8). No cabe un contrato menor «de dos años» ni renovarlo.</li><li><b>Perfección con la adjudicación</b>, no con la formalización: el contrato menor es excepción a la regla del art. 36.1, y su existencia se acredita con los documentos del art. 118 (art. 153.2).</li><li><b>Adjudicación directa</b> a cualquier empresario con capacidad de obrar y con la habilitación profesional necesaria (art. 131.3, último párrafo). No hace falta que esté inscrito en el ROLECE.</li><li><b>No cabe recurso especial</b>: los umbrales del art. 44.1 están muy por encima.</li><li><b>No hay garantía definitiva</b> ni pliegos: el expediente es el del art. 118 y nada más.</li></ul><div class=\"box exc\"><span class=\"lbl\">Los tres errores más frecuentes en este supuesto</span><ul><li>Comparar el importe <b>con IVA</b> con los umbrales de 40.000 y 15.000 €. Son de <b>valor estimado</b>.</li><li>Someter el contrato menor a <b>fiscalización previa</b>. El art. 219.1 TRLHL lo excluye expresamente.</li><li>Publicar los menores <b>sin IVA</b>. El art. 63.4 exige el importe de adjudicación <b>incluido el Impuesto sobre el Valor Añadido</b>.</li></ul></div></div></details></section>";
</script>
<script>
document.getElementById('main').innerHTML+="<section class=\"card\" id=\"cuadro\"><h2>Cuadro comparativo de los seis supuestos</h2><table class=\"t\"><thead><tr><th>Tipo</th><th>Trámite previo propio</th><th>Cómo se acredita la prestación</th><th>Duración máxima</th><th>Garantía definitiva</th></tr></thead><tbody><tr><td><b>Obras</b></td><td>Proyecto, <b>supervisión</b> si ≥ 500.000 € sin IVA y <b>replanteo</b> antes de aprobar el expediente (arts. 231, 235 y 236)</td><td><b>Certificación mensual</b> conformada, en los diez primeros días del mes siguiente (art. 240.1)</td><td>La del proyecto; certificación final en <b>3 meses</b> desde la recepción y garantía <b>mínima de 1 año</b> (art. 243)</td><td><b>5 %</b> del precio ofertado sin IVA. <b>Nunca cabe exención</b> (art. 107.1)</td></tr><tr><td><b>Concesión de obras</b></td><td><b>Estudio de viabilidad</b> previo a la decisión misma de concesionar (art. 247)</td><td>Las <b>aportaciones públicas</b> se abonan durante o tras la ejecución de las obras, conforme al pliego (art. 266.1)</td><td><b>40 años</b> (art. 29.6.a)</td><td>La fija el PCAP según naturaleza, importancia y duración (art. 107.4)</td></tr><tr><td><b>Concesión de servicios</b></td><td>Pliegos con tarifas, su revisión y el canon (art. 285.1.b)</td><td>Facturación de la <b>aportación</b>, si la hay, conformada por el responsable. Las tarifas las cobra el concesionario</td><td><b>25 años</b>; <b>10</b> si comprende servicios sanitarios (art. 29.6.b y c)</td><td>La fija el PCAP (art. 107.4)</td></tr><tr><td><b>Servicios</b></td><td><b>Informe de insuficiencia de medios</b> (art. 116.4.f)</td><td><b>Factura mensual conformada</b> por el responsable del contrato (arts. 62 y 198.4)</td><td><b>5 años</b> incluidas prórrogas (art. 29.4)</td><td><b>5 %</b> del precio ofertado sin IVA (art. 107.1)</td></tr><tr><td><b>Suministros</b></td><td>Ninguno específico más allá del expediente común</td><td><b>Acto formal y positivo de recepción o conformidad</b> dentro del mes siguiente a la entrega (art. 210.2)</td><td><b>5 años</b> en prestación sucesiva (art. 29.4)</td><td><b>5 %</b> del precio ofertado sin IVA (art. 107.1)</td></tr><tr><td><b>Contrato menor</b></td><td>Informe de necesidad y de no alteración del objeto (art. 118.2); en obras, presupuesto y supervisión si afecta a estabilidad, seguridad o estanqueidad (art. 118.4)</td><td><b>Factura</b> incorporada al expediente (art. 118.3)</td><td><b>1 año</b> y <b>sin prórroga</b> (art. 29.8)</td><td>No se exige</td></tr></tbody></table><div class=\"box warn\"><span class=\"lbl\">La columna que más se falla</span>La de «cómo se acredita la prestación», porque es la que decide cuándo puede producirse la <b>fase O</b>. Sin acreditación documental de la prestación no hay reconocimiento de la obligación (art. 59.1 RD 500/1990), y sin fase O no hay orden de pago ni pago.</div></section><section class=\"card\" id=\"plazos\"><h2>Los plazos del ciclo del gasto, todos juntos</h2><table class=\"t\"><thead><tr><th>Plazo</th><th>Trámite</th><th>Precepto</th></tr></thead><tbody><tr><td><b>10 días hábiles</b></td><td>Documentación y garantía definitiva del mejor licitador</td><td>art. 150.2 LCSP</td></tr><tr><td><b>5 días hábiles</b></td><td>Adjudicación desde la recepción de la documentación</td><td>art. 150.3 LCSP</td></tr><tr><td><b>20 días</b></td><td>Apertura de las proposiciones desde el fin del plazo de presentación</td><td>art. 157.3 LCSP</td></tr><tr><td><b>15 días</b></td><td>Publicación de la adjudicación en el perfil de contratante</td><td>art. 151.1 LCSP</td></tr><tr><td><b>15 días hábiles</b></td><td>Espera antes de formalizar, si cabe recurso especial</td><td>art. 153.3 LCSP</td></tr><tr><td><b>5 días</b></td><td>Formalización tras el requerimiento</td><td>art. 153.3 LCSP</td></tr><tr><td><b>Primeros 10 días del mes</b></td><td>Expedición de las certificaciones de obra del mes anterior</td><td>art. 240.1 LCSP</td></tr><tr><td><b>1 mes</b></td><td>Acto formal de recepción o conformidad desde la entrega o realización</td><td>art. 210.2 LCSP</td></tr><tr><td><b>30 días</b></td><td>Plazo del contratista para presentar la factura desde la entrega o prestación</td><td>art. 198.4 LCSP</td></tr><tr><td><b>30 días</b></td><td>Obligación de la Administración de abonar el precio desde la aprobación de la certificación o la conformidad</td><td>art. 198.4 LCSP</td></tr><tr><td><b>90 %</b></td><td>Umbral de abonos a cuenta acumulados que obliga a comunicar a la Intervención para la comprobación material</td><td>art. 198.2 LCSP</td></tr><tr><td><b>3 meses</b></td><td>Aprobación de la certificación final de obra desde la recepción</td><td>art. 243.1 LCSP</td></tr><tr><td><b>1 año</b></td><td>Plazo de garantía mínimo en obras</td><td>art. 243.3 LCSP</td></tr><tr><td><b>15 días antes</b></td><td>Informe del director facultativo sobre el estado de las obras, antes de que venza la garantía</td><td>art. 243.3 LCSP</td></tr><tr><td><b>60 días</b></td><td>Devolución de la garantía, liquidación y pago de obligaciones pendientes tras informe favorable</td><td>art. 243.3 LCSP</td></tr><tr><td><b>70-60-50-50 %</b></td><td>Límites del gasto plurianual en los cuatro ejercicios siguientes</td><td>art. 174.3 TRLHL</td></tr><tr><td><b>Trimestral</b></td><td>Publicación de los contratos menores, con importe IVA incluido</td><td>arts. 63.4 y 118.6 LCSP</td></tr></tbody></table></section><section class=\"card\" id=\"conexiones\"><h2>Diez preguntas de conexión</h2><p class=\"small\">Responde en voz alta <b>antes</b> de desplegar. Estas son las preguntas que enlazan la Ley 9/2017 con el TRLHL, que es justo donde se decide un supuesto práctico.</p><div id=\"qbox\"></div></section><section class=\"card\" id=\"sem\"><h2>Semáforo: qué dominas y qué no</h2><p class=\"small\">Marca cada destreza. Lo que quede en rojo es tu plan de estudio de esta semana.</p><div id=\"sembox\"></div><div id=\"semres\" style=\"margin-top:.8rem\"></div></section>";

/* Reveal on scroll para las tarjetas */
function reveal(){
  var els=document.querySelectorAll("section.card:not(.rv)");
  if(!els.length)return;
  if(!("IntersectionObserver" in window)){return;}
  var io=new IntersectionObserver(function(es){
    es.forEach(function(en){if(en.isIntersecting){en.target.classList.add("in");io.unobserve(en.target);}});
  },{threshold:.06,rootMargin:"0px 0px -30px 0px"});
  Array.prototype.forEach.call(els,function(el){el.classList.add("rv");io.observe(el);});
}

/* Sección activa en el índice lateral */
function spy(){
  var links=document.querySelectorAll("nav.side a[href^='#']");
  if(!links.length||!("IntersectionObserver" in window))return;
  var map={};
  Array.prototype.forEach.call(links,function(a){
    var t=document.getElementById(a.getAttribute("href").slice(1));
    if(t)map[t.id]=a;
  });
  var io=new IntersectionObserver(function(es){
    es.forEach(function(en){
      if(en.isIntersecting){
        Array.prototype.forEach.call(links,function(a){a.classList.remove("on");});
        if(map[en.target.id])map[en.target.id].classList.add("on");
      }
    });
  },{rootMargin:"-80px 0px -70% 0px",threshold:0});
  Object.keys(map).forEach(function(id){io.observe(document.getElementById(id));});
}

/* Ripple en botones */
document.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b||b.classList.contains("navtoggle"))return;
  var r=b.getBoundingClientRect(),d=Math.max(r.width,r.height),s=document.createElement("span");
  s.className="ripple";s.style.width=s.style.height=d+"px";
  s.style.left=(e.clientX-r.left-d/2)+"px";s.style.top=(e.clientY-r.top-d/2)+"px";
  b.appendChild(s);setTimeout(function(){if(s.parentNode)s.parentNode.removeChild(s);},560);
});

/* Atajos de teclado */
document.addEventListener("keydown",function(e){
  if(e.target.matches("input,textarea"))return;
  if(e.key==="/"){var q=document.getElementById("q");if(q){e.preventDefault();q.focus();}}
  if(e.key==="t"&&bt)bt.click();
});

/* El contenido se inyecta por JS: esperamos a que exista */
function init(){reveal();spy();}
if(document.getElementById("main")&&document.getElementById("main").children.length){init();}
else{setTimeout(init,60);}
addEventListener("load",function(){setTimeout(init,80);});
})();

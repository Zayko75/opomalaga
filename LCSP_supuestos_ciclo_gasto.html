document.getElementById('main').innerHTML="<section class=\"card\" id=\"intro\"><h2>Tema 10 · Bloque 5 · Seis supuestos prácticos del ciclo del gasto</h2><p class=\"small\">Los cuatro bloques anteriores explican la ley artículo por artículo. Este la pone a andar. Seis expedientes completos —uno por cada tipo de contrato— recorridos de principio a fin: desde el informe de necesidad hasta la devolución de la garantía, con las fases contables <b>RC · A · D · O · P</b> situadas en su sitio exacto y el precepto que ampara cada paso.</p><div class=\"box ej\"><span class=\"lbl\">La idea que ordena el bloque</span>La contratación pública y el gasto público son <b>dos relatos del mismo expediente</b>. Uno lo cuenta la Ley 9/2017 —necesidad, expediente, licitación, adjudicación, formalización, ejecución—; el otro lo cuenta el TRLHL con el RD 500/1990 —retención, autorización, disposición, obligación, pago—. Los seis supuestos enseñan a leerlos <b>en paralelo</b>: la aprobación del expediente <b>es</b> la autorización del gasto; la adjudicación <b>es</b> la disposición; la certificación o la factura conformada <b>son</b> el reconocimiento de la obligación.</div><div class=\"box warn\"><span class=\"lbl\">Fuentes utilizadas y vigencia</span><ul><li><b>Ley 9/2017, de 8 de noviembre</b>, de Contratos del Sector Público, <b>texto consolidado</b> (documento de la biblioteca del proyecto).</li><li><b>Real Decreto Legislativo 2/2004</b>, texto refundido de la Ley Reguladora de las Haciendas Locales, arts. 174, 184 a 189, 214 y 219 (documento de la biblioteca).</li><li><b>Real Decreto 500/1990</b>, de 20 de abril, arts. 31, 52 a 67, que define las fases del gasto (documento de la biblioteca).</li><li><b>Aportación externa</b>: la <b>Ley 3/2004</b>, de lucha contra la morosidad, citada por el art. 198.4 LCSP para los intereses de demora y los costes de cobro.</li><li><b>Verifica siempre la vigencia en el BOE consolidado.</b> Los umbrales de la regulación armonizada de los arts. 20 a 23 se actualizan cada dos años por reglamento delegado de la Comisión Europea; los umbrales del contrato menor y los del recurso especial los fija la ley y no se actualizan por esa vía.</li><li>Las entidades, fechas, cifras y empresas de los supuestos son <b>ficticias</b>; los preceptos, los plazos y los porcentajes, reales. Los importes se han construido para que los cálculos salgan redondos y puedan comprobarse a mano.</li></ul></div><div class=\"box exc\"><span class=\"lbl\">Esto no es asesoramiento jurídico</span>Es material de estudio. Para un expediente real, acude a la norma consolidada, a las bases de ejecución de tu entidad y al informe del órgano competente. Las bases de ejecución concretan muchos extremos que aquí se dan por supuestos: niveles de vinculación jurídica de los créditos, órganos con competencia delegada y documentos que justifican el reconocimiento de la obligación en cada tipo de gasto (art. 59.2 del RD 500/1990).</div><div class=\"box\"><span class=\"lbl\">Los cinco bloques del tema 10</span><ul><li><a href=\"LCSP_28-102_organo_y_objeto.html\"><b>Bloque 1 · El órgano de contratación, las partes y el objeto</b> — arts. 28, 29, 35, 36, 61, 62, 63, 74, 99 a 102</a></li><li><a href=\"LCSP_106-126_expediente.html\"><b>Bloque 2 · Garantías, expediente y pliegos</b> — arts. 106 a 108, 115 a 124 y 126</a></li><li><a href=\"LCSP_131-204_adjudicacion.html\"><b>Bloque 3 · Adjudicación y formalización</b> — arts. 131 a 160 y 204</a></li><li><a href=\"LCSP_44-60_recurso_especial.html\"><b>Bloque 4 · El recurso especial en materia de contratación</b> — arts. 44 a 60</a></li><li><b>Bloque 5 · Supuestos prácticos del ciclo del gasto</b> — estás aquí</li></ul></div><div class=\"box\"><span class=\"lbl\">Cómo estudiar este bloque</span>Lee primero el enunciado y <b>resuélvelo tú</b>. Solo después despliega la solución. Si abres la solución sin intentarlo, la página deja de servir para lo único que sirve: comprobar si sabrías hacerlo en el examen.</div></section><section class=\"card\" id=\"ciclo\"><h2>El esqueleto común: RC · A · D · O · P</h2><p class=\"small\">Los seis supuestos recorren este mismo camino. Cámbiale el tipo de contrato y lo único que varía son los trámites previos y la forma de acreditar la prestación.</p><svg viewBox=\"0 0 960 858\" role=\"img\" aria-label=\"El ciclo completo del gasto público en un contrato: de la necesidad al pago\" style=\"width:100%;height:auto\"><defs><marker id=\"fl_g1\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr_g1\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe_g1\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw_g1\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"250\" y=\"8\" width=\"460\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"27.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">EL CICLO DEL GASTO EN UN CONTRATO PÚBLICO</text><rect x=\"20\" y=\"52\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--panel)\" stroke=\"var(--line)\"/><rect x=\"30\" y=\"66\" width=\"230\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--line)\"/><text x=\"145\" y=\"83\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"currentColor\">0 · NECESIDAD</text><text x=\"274\" y=\"74\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Informe que determina con precisión la naturaleza y extensión de la necesidad</text><text x=\"274\" y=\"88\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">y la idoneidad del objeto. Es previo a todo.</text><text x=\"930\" y=\"83\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">LCSP 28.1</text><path d=\"M480 107 L 480 115\" stroke=\"var(--line)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl_g1)\"/><rect x=\"20\" y=\"116\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"30\" y=\"124\" width=\"230\" height=\"38\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"145\" y=\"140.5\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--acc)\">RC · RETENCIÓN</text><text x=\"145\" y=\"153.5\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--acc)\">DE CRÉDITO</text><text x=\"274\" y=\"138\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Certificación de existencia de saldo suficiente, que produce una RESERVA</text><text x=\"274\" y=\"152\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">por el mismo importe. Se une al expediente como certificado de crédito.</text><text x=\"930\" y=\"141\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">RD 500/1990, 31</text><text x=\"930\" y=\"153\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">LCSP 116.3</text><path d=\"M480 171 L 480 179\" stroke=\"var(--acc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl_g1)\"/><rect x=\"20\" y=\"180\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"30\" y=\"194\" width=\"230\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"145\" y=\"211\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--warn)\">Fiscalización previa</text><text x=\"274\" y=\"202\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">La Intervención fiscaliza el expediente antes de su aprobación.</text><text x=\"274\" y=\"216\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Los CONTRATOS MENORES no están sometidos a intervención previa.</text><text x=\"930\" y=\"211\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">TRLHL 214 y 219</text><path d=\"M480 235 L 480 243\" stroke=\"var(--warn)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl_g1)\"/><rect x=\"20\" y=\"244\" width=\"920\" height=\"68\" rx=\"10\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"30\" y=\"265\" width=\"230\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"145\" y=\"282\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--acc)\">A · AUTORIZACIÓN</text><text x=\"274\" y=\"266\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Acto por el que se acuerda la realización del gasto por cuantía cierta o</text><text x=\"274\" y=\"280\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">aproximada. Es INTERNO: no crea relaciones con terceros.</text><text x=\"274\" y=\"294\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Se produce al aprobar el expediente y disponer la apertura del procedimiento.</text><text x=\"930\" y=\"276\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">RD 500/1990, 54</text><text x=\"930\" y=\"288\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">LCSP 117.1</text><path d=\"M480 313 L 480 321\" stroke=\"var(--acc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl_g1)\"/><rect x=\"20\" y=\"322\" width=\"920\" height=\"40\" rx=\"10\" fill=\"var(--panel)\" stroke=\"var(--line)\"/><rect x=\"30\" y=\"329\" width=\"230\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--line)\"/><text x=\"145\" y=\"346\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"currentColor\">Licitación</text><text x=\"274\" y=\"344\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Anuncio, presentación de ofertas, mesa, valoración y clasificación.</text><text x=\"930\" y=\"346\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">LCSP 135, 156 y 157</text><path d=\"M480 363 L 480 371\" stroke=\"var(--line)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl_g1)\"/><rect x=\"20\" y=\"372\" width=\"920\" height=\"68\" rx=\"10\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><rect x=\"30\" y=\"387\" width=\"230\" height=\"38\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--ej)\"/><text x=\"145\" y=\"403.5\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--ej)\">D · DISPOSICIÓN</text><text x=\"145\" y=\"416.5\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--ej)\">O COMPROMISO</text><text x=\"274\" y=\"394\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Acto por el que se acuerda con un TERCERO la realización del gasto por importe</text><text x=\"274\" y=\"408\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">EXACTAMENTE DETERMINADO. Tiene relevancia jurídica frente a él.</text><text x=\"274\" y=\"422\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Se produce con la ADJUDICACIÓN del contrato.</text><text x=\"930\" y=\"404\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">RD 500/1990, 56</text><text x=\"930\" y=\"416\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">LCSP 150 y 151</text><path d=\"M480 441 L 480 449\" stroke=\"var(--ej)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl_g1)\"/><rect x=\"20\" y=\"450\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"30\" y=\"464\" width=\"230\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"145\" y=\"481\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--warn)\">Formalización</text><text x=\"274\" y=\"472\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">El contrato NACE aquí. Si cabe recurso especial, no antes de quince días</text><text x=\"274\" y=\"486\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">hábiles desde la remisión de la notificación de la adjudicación.</text><text x=\"930\" y=\"481\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">LCSP 36.1 y 153.3</text><path d=\"M480 505 L 480 513\" stroke=\"var(--warn)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl_g1)\"/><rect x=\"20\" y=\"514\" width=\"920\" height=\"68\" rx=\"10\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><rect x=\"30\" y=\"529\" width=\"230\" height=\"38\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--ej)\"/><text x=\"145\" y=\"545.5\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--ej)\">O · RECONOCIMIENTO</text><text x=\"145\" y=\"558.5\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--ej)\">DE LA OBLIGACIÓN</text><text x=\"274\" y=\"536\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Acto por el que se declara la existencia de un crédito EXIGIBLE contra la</text><text x=\"274\" y=\"550\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">entidad. Exige acreditar documentalmente la prestación: certificación de obra</text><text x=\"274\" y=\"564\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">conformada o factura conformada, con recepción o conformidad.</text><text x=\"930\" y=\"546\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">RD 500/1990, 58 y 59</text><text x=\"930\" y=\"558\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">LCSP 198.4 y 210.2</text><path d=\"M480 583 L 480 591\" stroke=\"var(--ej)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl_g1)\"/><rect x=\"20\" y=\"592\" width=\"920\" height=\"68\" rx=\"10\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><rect x=\"30\" y=\"607\" width=\"230\" height=\"38\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--exc)\"/><text x=\"145\" y=\"623.5\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--exc)\">P · ORDENACIÓN</text><text x=\"145\" y=\"636.5\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--exc)\">DEL PAGO</text><text x=\"274\" y=\"614\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Acto por el que el ordenador de pagos —el presidente de la entidad local—</text><text x=\"274\" y=\"628\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">expide la orden de pago contra la Tesorería, conforme al plan de disposición</text><text x=\"274\" y=\"642\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">de fondos.</text><text x=\"930\" y=\"630\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">TRLHL 186 y 187</text><path d=\"M480 661 L 480 669\" stroke=\"var(--exc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl_g1)\"/><rect x=\"20\" y=\"670\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><rect x=\"30\" y=\"684\" width=\"230\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--exc)\"/><text x=\"145\" y=\"701\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--exc)\">Pago material</text><text x=\"274\" y=\"692\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Salida efectiva de fondos. La Administración debe pagar dentro de los TREINTA</text><text x=\"274\" y=\"706\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">DÍAS siguientes a la aprobación de la certificación o a la conformidad.</text><text x=\"930\" y=\"701\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">LCSP 198.4</text><path d=\"M480 725 L 480 733\" stroke=\"var(--exc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl_g1)\"/><rect x=\"20\" y=\"734\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--panel)\" stroke=\"var(--line)\"/><rect x=\"30\" y=\"748\" width=\"230\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--line)\"/><text x=\"145\" y=\"765\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"currentColor\">Extinción</text><text x=\"274\" y=\"756\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Recepción o conformidad, plazo de garantía, informe favorable, devolución</text><text x=\"274\" y=\"770\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">de la garantía definitiva y liquidación del contrato.</text><text x=\"930\" y=\"765\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">LCSP 210 y 243</text><rect x=\"20\" y=\"798\" width=\"920\" height=\"48\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"480\" y=\"818.828\" text-anchor=\"middle\" font-size=\"9.9\" fill=\"currentColor\">Regla de acumulación (RD 500/1990, art. 67): un mismo acto puede abarcar varias fases —AD, ADO, ADOP—, con los mismos efectos que si se acordaran por separado.</text><text x=\"480\" y=\"831.828\" text-anchor=\"middle\" font-size=\"10.4\" fill=\"currentColor\">En el contrato menor lo habitual es un único documento ADO: se autoriza, se compromete y se reconoce la obligación en un solo acto, con la factura.</text></svg><p class=\"small\" style=\"margin-top:1rem\">Y estos son los documentos contables que se expiden en cada momento:</p><svg viewBox=\"0 0 960 296\" role=\"img\" aria-label=\"Documentos contables del ciclo del gasto y momento de su expedición\" style=\"width:100%;height:auto\"><defs><marker id=\"fl_g2\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr_g2\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe_g2\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw_g2\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"250\" y=\"8\" width=\"460\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"27.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">QUÉ DOCUMENTO CONTABLE SE EXPIDE EN CADA MOMENTO</text><rect x=\"20\" y=\"52\" width=\"172.8\" height=\"176\" rx=\"8\" fill=\"var(--panel)\" stroke=\"var(--line)\"/><text x=\"106.4\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"currentColor\">RC</text><text x=\"106.4\" y=\"91\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Retención de crédito</text><text x=\"106.4\" y=\"106\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"106.4\" y=\"121\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Al iniciar el expediente</text><text x=\"106.4\" y=\"136\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">y certificar que hay</text><text x=\"106.4\" y=\"151\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">saldo suficiente</text><text x=\"106.4\" y=\"166\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"106.4\" y=\"181\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">RD 500/1990, art. 31</text><rect x=\"206.8\" y=\"52\" width=\"172.8\" height=\"176\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"293.2\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--acc)\">A</text><text x=\"293.2\" y=\"91\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Autorización</text><text x=\"293.2\" y=\"106\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"293.2\" y=\"121\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Al aprobar el expediente</text><text x=\"293.2\" y=\"136\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">y disponer la apertura</text><text x=\"293.2\" y=\"151\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">del procedimiento</text><text x=\"293.2\" y=\"166\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"293.2\" y=\"181\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">LCSP art. 117.1</text><rect x=\"393.6\" y=\"52\" width=\"172.8\" height=\"176\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"480\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--ej)\">D</text><text x=\"480\" y=\"91\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Disposición</text><text x=\"480\" y=\"106\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"480\" y=\"121\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Al adjudicar el contrato</text><text x=\"480\" y=\"136\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">por importe exactamente</text><text x=\"480\" y=\"151\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">determinado</text><text x=\"480\" y=\"166\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"480\" y=\"181\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">LCSP arts. 150 y 151</text><rect x=\"580.4\" y=\"52\" width=\"172.8\" height=\"176\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"666.8\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--warn)\">O</text><text x=\"666.8\" y=\"91\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Reconocimiento de la</text><text x=\"666.8\" y=\"106\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">obligación</text><text x=\"666.8\" y=\"121\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"666.8\" y=\"136\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Con la certificación de</text><text x=\"666.8\" y=\"151\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">obra o la factura</text><text x=\"666.8\" y=\"166\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">conformada tras la</text><text x=\"666.8\" y=\"181\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">recepción</text><text x=\"666.8\" y=\"196\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"666.8\" y=\"211\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">RD 500/1990, art. 58</text><rect x=\"767.2\" y=\"52\" width=\"172.8\" height=\"176\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"853.6\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--exc)\">P</text><text x=\"853.6\" y=\"91\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Ordenación del pago</text><text x=\"853.6\" y=\"106\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"853.6\" y=\"121\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Orden de pago expedida</text><text x=\"853.6\" y=\"136\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">por el presidente contra</text><text x=\"853.6\" y=\"151\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">la Tesorería</text><text x=\"853.6\" y=\"166\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"853.6\" y=\"181\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">TRLHL art. 186</text><rect x=\"20\" y=\"238\" width=\"920\" height=\"48\" rx=\"8\" fill=\"var(--panel)\" stroke=\"var(--line)\"/><text x=\"480\" y=\"258.828\" text-anchor=\"middle\" font-size=\"10.4\" fill=\"currentColor\">Documentos acumulados: AD (autorización y disposición) · ADO (las tres) · ADOP (las cuatro, con la propuesta de pago).</text><text x=\"480\" y=\"271.828\" text-anchor=\"middle\" font-size=\"10.4\" fill=\"currentColor\">El contrato menor se tramita normalmente con un único ADO, o incluso ADOP, porque no hay licitación que separe la A de la D.</text></svg><div class=\"box ej\"><span class=\"lbl\">Las tres equivalencias que hay que memorizar</span><ul><li><b>Aprobar el expediente</b> (art. 117.1 LCSP) <b>=</b> autorizar el gasto, <b>fase A</b> (art. 54 RD 500/1990). Acto <b>interno</b>, cuantía cierta <b>o aproximada</b>.</li><li><b>Adjudicar</b> (arts. 150 y 151 LCSP) <b>=</b> comprometer el gasto, <b>fase D</b> (art. 56 RD 500/1990). Acto con relevancia <b>frente a terceros</b>, importe <b>exactamente determinado</b>.</li><li><b>Certificación u factura conformada tras la recepción</b> (arts. 198 y 210 LCSP) <b>=</b> reconocer la obligación, <b>fase O</b> (arts. 58 y 59 RD 500/1990). Nace un crédito <b>exigible</b>.</li></ul></div></section><section class=\"card\" id=\"tipos\"><h2>Los seis supuestos, de un vistazo</h2><p class=\"small\">Antes de entrar, quédate con qué hace especial a cada tipo. Todo lo demás es común.</p><svg viewBox=\"0 0 960 342\" role=\"img\" aria-label=\"Comparación de los seis tipos de contrato y sus especialidades en el ciclo del gasto\" style=\"width:100%;height:auto\"><defs><marker id=\"fl_g3\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr_g3\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe_g3\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw_g3\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"250\" y=\"8\" width=\"460\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"27.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">LOS SEIS SUPUESTOS, DE UN VISTAZO</text><rect x=\"20\" y=\"52\" width=\"141.667\" height=\"236\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"90.8333\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--acc)\">1 · OBRAS</text><text x=\"90.8333\" y=\"106\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Proyecto, supervisión</text><text x=\"90.8333\" y=\"121\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">y replanteo previos</text><text x=\"90.8333\" y=\"136\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"90.8333\" y=\"151\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Certificaciones</text><text x=\"90.8333\" y=\"166\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">MENSUALES</text><text x=\"90.8333\" y=\"181\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"90.8333\" y=\"196\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Recepción + garantía</text><text x=\"90.8333\" y=\"211\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">mínima de UN AÑO</text><text x=\"90.8333\" y=\"226\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"90.8333\" y=\"241\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Certificación final en</text><text x=\"90.8333\" y=\"256\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">3 meses desde la</text><text x=\"90.8333\" y=\"271\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">recepción</text><rect x=\"175.667\" y=\"52\" width=\"141.667\" height=\"236\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"246.5\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--warn)\">2 · CONCESIÓN</text><text x=\"246.5\" y=\"91\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--warn)\">DE OBRAS</text><text x=\"246.5\" y=\"106\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Estudio de viabilidad</text><text x=\"246.5\" y=\"121\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">previo</text><text x=\"246.5\" y=\"136\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"246.5\" y=\"151\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">RIESGO OPERACIONAL</text><text x=\"246.5\" y=\"166\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">del concesionario</text><text x=\"246.5\" y=\"181\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"246.5\" y=\"196\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Aportación pública</text><text x=\"246.5\" y=\"211\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">posible: subvención o</text><text x=\"246.5\" y=\"226\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">préstamo reintegrable</text><text x=\"246.5\" y=\"241\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"246.5\" y=\"256\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Hasta 40 años</text><rect x=\"331.333\" y=\"52\" width=\"141.667\" height=\"236\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"402.167\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--warn)\">3 · CONCESIÓN</text><text x=\"402.167\" y=\"91\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--warn)\">DE SERVICIOS</text><text x=\"402.167\" y=\"106\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Riesgo operacional</text><text x=\"402.167\" y=\"121\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"402.167\" y=\"136\" text-anchor=\"middle\" font-size=\"9.3\" fill=\"currentColor\">Tarifas de los usuarios:</text><text x=\"402.167\" y=\"151\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">prestación patrimonial</text><text x=\"402.167\" y=\"166\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">pública no tributaria</text><text x=\"402.167\" y=\"181\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"402.167\" y=\"196\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Puede haber canon a</text><text x=\"402.167\" y=\"211\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">favor de la entidad</text><text x=\"402.167\" y=\"226\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"402.167\" y=\"241\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">25 años; 10 si es</text><text x=\"402.167\" y=\"256\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">sanitario</text><rect x=\"487\" y=\"52\" width=\"141.667\" height=\"236\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"557.833\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--ej)\">4 · SERVICIOS</text><text x=\"557.833\" y=\"106\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Informe de</text><text x=\"557.833\" y=\"121\" text-anchor=\"middle\" font-size=\"9.3\" fill=\"currentColor\">INSUFICIENCIA DE MEDIOS</text><text x=\"557.833\" y=\"136\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"557.833\" y=\"151\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Tracto sucesivo:</text><text x=\"557.833\" y=\"166\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">factura mensual</text><text x=\"557.833\" y=\"181\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">conformada</text><text x=\"557.833\" y=\"196\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"557.833\" y=\"211\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Máximo 5 años</text><text x=\"557.833\" y=\"226\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">incluidas prórrogas</text><rect x=\"642.667\" y=\"52\" width=\"141.667\" height=\"236\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"713.5\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--ej)\">5 · SUMINISTROS</text><text x=\"713.5\" y=\"106\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Entrega y recepción</text><text x=\"713.5\" y=\"121\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">formal</text><text x=\"713.5\" y=\"136\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"713.5\" y=\"151\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Acto formal y positivo</text><text x=\"713.5\" y=\"166\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">dentro del mes</text><text x=\"713.5\" y=\"181\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">siguiente a la entrega</text><text x=\"713.5\" y=\"196\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"713.5\" y=\"211\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Plazo de garantía</text><text x=\"713.5\" y=\"226\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">desde la recepción</text><rect x=\"798.333\" y=\"52\" width=\"141.667\" height=\"236\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"869.167\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--exc)\">6 · CONTRATO</text><text x=\"869.167\" y=\"91\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--exc)\">MENOR</text><text x=\"869.167\" y=\"106\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">&lt; 40.000 € obras</text><text x=\"869.167\" y=\"121\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">&lt; 15.000 € suministros</text><text x=\"869.167\" y=\"136\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">y servicios</text><text x=\"869.167\" y=\"151\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"869.167\" y=\"166\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Informe, aprobación</text><text x=\"869.167\" y=\"181\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">del gasto y factura</text><text x=\"869.167\" y=\"196\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"869.167\" y=\"211\" text-anchor=\"middle\" font-size=\"9.3\" fill=\"currentColor\">SIN intervención previa</text><text x=\"869.167\" y=\"226\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"869.167\" y=\"241\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Un año, sin prórroga</text><text x=\"869.167\" y=\"256\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"869.167\" y=\"271\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Publicidad trimestral</text><rect x=\"20\" y=\"298\" width=\"920\" height=\"34\" rx=\"8\" fill=\"var(--panel)\" stroke=\"var(--line)\"/><text x=\"480\" y=\"318.328\" text-anchor=\"middle\" font-size=\"10.4\" fill=\"currentColor\">Todos recorren el mismo esqueleto RC → A → D → O → P. Lo que cambia es CÓMO se acredita la prestación en la fase O y qué trámites previos exige cada tipo.</text></svg></section>";

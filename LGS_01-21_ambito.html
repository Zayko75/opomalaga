<text x="180" y="70" text-anchor="middle" font-size="10" fill="#fff">se aplica con preferencia</text>
<text x="320" y="60" text-anchor="middle" font-size="16" fill="var(--ink2)">▸</text>
<rect x="350" y="30" width="220" height="52" rx="8" fill="var(--acc-soft)" stroke="var(--acc)"/>
<text x="460" y="52" text-anchor="middle" font-size="11" font-weight="700" fill="var(--acc)">LGS</text>
<text x="460" y="70" text-anchor="middle" font-size="10" fill="currentColor">en lo que no se oponga</text>
</svg>`},
{n:7,t:"Responsabilidad financiera derivada de la gestión de fondos procedentes de la Unión Europea",ubic:"Título Preliminar (Disposiciones generales) ▸ Capítulo I (Del ámbito de aplicación de la ley)",idea:"Quien causa una corrección financiera europea, la paga.",literal:`<p>1. Las Administraciones públicas o sus órganos o entidades gestoras que, de acuerdo con sus respectivas competencias, realicen actuaciones de gestión y control de las ayudas financiadas por cuenta de Fondos procedentes de la Unión Europea, asumirán las responsabilidades que se deriven de dichas actuaciones, incluidas las que sobrevengan por decisiones de los órganos de la Unión Europea, y especialmente en lo relativo al proceso de liquidación de cuentas y a la aplicación de la disciplina presupuestaria por parte de la Comisión Europea, de acuerdo con los siguientes regímenes:</p><p>a) (Anulado)</p><p>b) En los casos distintos de los previstos en la letra a) anterior, la determinación de la responsabilidad se realizará con arreglo a los trámites establecidos en el Título II de esta Ley.</p><p>Los órganos de la Administración General del Estado y las entidades dependientes o vinculadas a la misma que sean competentes para la coordinación de cada uno de los fondos o instrumentos europeos, o en su defecto, para proponer o coordinar los pagos de las ayudas de cada fondo o instrumento, previa audiencia de las entidades afectadas mencionadas en el apartado anterior, resolverán acerca de la determinación de las referidas responsabilidades financieras. De dichas resoluciones se dará traslado al órgano o entidad competente para la gestión del fondo en cada caso para hacerlas efectivas.</p><p>En defecto de pago voluntario, las compensaciones o retenciones que deban realizarse como consecuencia de las actuaciones señaladas en el apartado anterior se llevarán a cabo mediante la deducción de sus importes en los futuros libramientos que se realicen por cuenta de los citados fondos e instrumentos financieros de la Unión Europea, de acuerdo con la respectiva naturaleza de cada uno de ellos y, en su defecto, con las cantidades que deba satisfacer el Estado a la Administración o entidad responsable por cualquier concepto, presupuestario o no presupuestario, siempre que no se trate de recursos del sistema de financiación, de acuerdo con lo previsto en la normativa aplicable.</p><p>2. La derivación de responsabilidad a sujetos distintos de los previstos en el apartado anterior se hará conforme a lo establecido en la letra b) del apartado anterior.</p>`,dis:`<ul>
<li><b>Principio:</b> las Administraciones y entidades que gestionen fondos de la Unión asumen las <b>responsabilidades financieras</b> derivadas de su gestión ante las instituciones europeas.</li>
<li><b>Mecanismo:</b> las correcciones financieras impuestas por la Unión se imputan a <b>quien las haya causado</b>, con los procedimientos de compensación y deducción previstos.</li>
</ul>`,llano:`<p>Si Europa detecta que un fondo se ha gestionado mal y exige devolver dinero, no lo paga el Estado en abstracto: lo paga la Administración o el ente que provocó el problema.</p>`,porque:`<p>Sin esta regla, el coste de una mala gestión local o autonómica recaería sobre el conjunto, lo que eliminaría el incentivo a gestionar bien. Es una traducción del principio de <b>responsabilidad por los propios actos</b> al reparto interno de las consecuencias financieras.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> en un piso compartido, la multa por una fiesta la paga quien la organizó, no todos.</li>
<li><b>Real:</b> una corrección financiera del FEDER por gastos no elegibles certificados por un ayuntamiento se le repercute a ese ayuntamiento.</li>
</ul>`,noej:`<ul>
<li><b>No es una sanción</b>: es la asunción del coste de la corrección financiera.</li>
</ul>`,conex:`<ul>
<li><b>Art. 6 LGS:</b> régimen jurídico de las subvenciones con fondos europeos.</li>
<li><b>Arts. 36 a 43 LGS:</b> régimen del reintegro, que puede activarse en paralelo.</li>
</ul>`,trampas:`<ul>
<li>La responsabilidad se imputa a <b>quien causa</b> la corrección, no a quien tramita el pago.</li>
</ul>`,ancla:`<p><b>"El que la lía, la paga."</b> Regla de oro de los fondos europeos.</p>`,vis:`<svg viewBox="0 0 640 115" role="img" aria-label="Responsabilidad financiera por fondos europeos">
<rect x="40" y="30" width="200" height="52" rx="8" fill="var(--exc-bg)" stroke="var(--exc)"/>
<text x="140" y="52" text-anchor="middle" font-size="11" font-weight="700" fill="var(--exc)">Corrección financiera</text>
<text x="140" y="70" text-anchor="middle" font-size="10" fill="currentColor">impuesta por la Unión</text>
<text x="280" y="60" text-anchor="middle" font-size="16" fill="var(--ink2)">→</text>
<rect x="320" y="30" width="280" height="52" rx="8" fill="var(--warn-bg)" stroke="var(--warn)"/>
<text x="460" y="52" text-anchor="middle" font-size="11" font-weight="700" fill="var(--warn)">La asume la Administración o entidad</text>
<text x="460" y="70" text-anchor="middle" font-size="10" fill="currentColor">que la haya causado por su gestión</text>
</svg>`},
{n:8,t:"Principios generales",ubic:"Título Preliminar (Disposiciones generales) ▸ Capítulo II (Disposiciones comunes a las subvenciones públicas)",idea:"Plan estratégico previo y seis principios que rigen toda la gestión subvencional.",literal:`<p>1. Los órganos de las Administraciones públicas o cualesquiera entes que propongan el establecimiento de subvenciones, con carácter previo, deberán concretar en un plan estratégico de subvenciones los objetivos y efectos que se pretenden con su aplicación, el plazo necesario para su consecución, los costes previsibles y sus fuentes de financiación, supeditándose en todo caso al cumplimiento de los objetivos de estabilidad presupuestaria.</p><p>Las bases reguladoras de cada subvención harán referencia al Plan estratégico de subvenciones en el que se integran, señalando de qué modo contribuyen al logro de sus objetivos; en otro caso, deberá motivarse por qué es necesario establecer la nueva subvención, incluso aun no habiendo sido prevista en el Plan, y la forma en que afecta a su cumplimiento.</p><p>2. Cuando los objetivos que se pretenden conseguir afecten al mercado, su orientación debe dirigirse a corregir fallos claramente identificados y sus efectos deben ser mínimamente distorsionadores.</p><p>3. La gestión de las subvenciones a que se refiere esta ley se realizará de acuerdo con los siguientes principios:</p><p>a) Publicidad, transparencia, concurrencia, objetividad, igualdad y no discriminación.</p><p>b) Eficacia en el cumplimiento de los objetivos fijados por la Administración otorgante.</p><p>c) Eficiencia en la asignación y utilización de los recursos públicos.</p>`,dis:`<ul>
<li><b>8.1 — <span class="t" data-k="plan">plan estratégico de subvenciones</span>:</b> con carácter <b>previo</b> al establecimiento de subvenciones hay que concretar <b>objetivos y efectos</b>, el <b>plazo</b> necesario, los <b>costes previsibles</b> y sus <b>fuentes de financiación</b>, supeditándose al cumplimiento de los objetivos de estabilidad presupuestaria. Las bases reguladoras deben <b>referirse al plan</b> en el que se integran o motivar por qué es necesaria la nueva subvención.</li>
<li><b>8.2 — efectos sobre el mercado:</b> cuando los objetivos afecten al mercado, deben dirigirse a <b>corregir fallos claramente identificados</b> y sus efectos han de ser <b>mínimamente distorsionadores</b>.</li>
<li><b>8.3 — principios de gestión:</b>
<ol><li><b>a)</b> publicidad, transparencia, <b>concurrencia</b>, objetividad, igualdad y no discriminación;</li>
<li><b>b)</b> <b>eficacia</b> en el cumplimiento de los objetivos fijados por la Administración otorgante;</li>
<li><b>c)</b> <b>eficiencia</b> en la asignación y utilización de los recursos públicos.</li></ol></li>
</ul>`,llano:`<p>Antes de crear una subvención hay que pensarla: qué se quiere conseguir, cuánto va a costar y de dónde sale el dinero. Eso es el plan estratégico. Y una vez creada, la gestión se rige por seis principios que son los mismos que rigen la contratación: publicidad, transparencia, concurrencia, objetividad, igualdad y no discriminación, más eficacia y eficiencia.</p>`,porque:`<p>El plan estratégico es la respuesta a un vicio histórico: subvencionar por inercia, repitiendo cada año las mismas ayudas sin evaluar si sirven para algo. Y el apartado 2 introduce una idea económica poco frecuente en nuestras leyes: la subvención <b>distorsiona el mercado</b>, y por eso solo se justifica cuando corrige un fallo identificado y lo hace con el menor daño posible.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> antes de apuntarte a un gimnasio, decidir para qué, cuánto tiempo y cuánto puedes pagar.</li>
<li><b>Real:</b> el plan estratégico de subvenciones 2026-2028 de un ayuntamiento fija como objetivo reducir el abandono escolar, con 300.000 € anuales y financiación con recursos propios y de la Diputación.</li>
<li><b>Caso límite:</b> una subvención no prevista en el plan: cabe, pero las bases deben <b>motivar</b> por qué es necesaria y cómo afecta al cumplimiento del plan (art. 8.1, segundo párrafo).</li>
</ul>`,noej:`<ul>
<li><b>No es</b> el plan estratégico una norma jurídica ni crea derechos: es un instrumento de planificación.</li>
<li><b>No basta</b> la eficacia: la ley exige también <b>eficiencia</b>, que es una relación entre resultado y recursos.</li>
</ul>`,conex:`<ul>
<li><b>Art. 17.3 LGS:</b> contenido mínimo de las bases reguladoras, que deben referirse al plan.</li>
<li><b>Art. 166 TRLHL</b> (documento 5): anexos del presupuesto con planes y programas.</li>
<li><b>Art. 1 de la Ley 9/2017</b> (documento 7): principios equivalentes en contratación.</li>
<li><b>LO 2/2012</b> <i>(norma externa a la biblioteca)</i>: objetivos de estabilidad a los que se supedita el plan.</li>
</ul>`,trampas:`<ul>
<li>El plan estratégico es <b>previo</b> al establecimiento de la subvención.</li>
<li>Los principios de la letra a) son <b>seis</b>: publicidad, transparencia, concurrencia, objetividad, igualdad y no discriminación.</li>
<li><b>Eficacia</b> (cumplir objetivos) y <b>eficiencia</b> (asignar bien los recursos) son principios distintos.</li>
</ul>`,ancla:`<p><b>"Piensa antes (plan), reparte bien (concurrencia) y mide después (eficacia y eficiencia)."</b><br>Los seis de la letra a): <b>P-T-C-O-I-N</b>.</p>`,vis:`<svg viewBox="0 0 640 170" role="img" aria-label="Plan estratégico y principios de gestión">

<rect x="325" y="70" width="140" height="60" rx="8" fill="var(--warn-bg)" stroke="var(--warn)"/><text x="395" y="92" font-size="11" font-weight="700" fill="var(--warn)">b) Eficacia</text><text x="395" y="112">en los objetivos</text>

</svg>`},
{n:9,t:"Requisitos para el otorgamiento de las subvenciones",ubic:"Título Preliminar (Disposiciones generales) ▸ Capítulo II (Disposiciones comunes a las subvenciones públicas)",idea:"Antes de conceder: bases aprobadas y publicadas, competencia, crédito, procedimiento, fiscalización y gasto.",literal:`<p>1. En aquellos casos en los que, de acuerdo con los artículos 87 a 89 del Tratado Constitutivo de la Unión Europea, deban comunicarse los proyectos para el establecimiento, la concesión o la modificación de una subvención, las Administraciones públicas o cualesquiera entes deberán comunicar a la Comisión de la Unión Europea los oportunos proyectos de acuerdo con el artículo 10 de la Ley 30/1992, de 26 de noviembre, de Régimen Jurídico de las Administraciones Públicas y del Procedimiento Administrativo Común, y en los términos que se establezcan reglamentariamente, al objeto que se declare la compatibilidad de las mismas. En estos casos, no se podrá hacer efectiva una subvención en tanto no sea considerada compatible con el mercado común.</p><p>2. Con carácter previo al otorgamiento de las subvenciones, deberán aprobarse las normas que establezcan las bases reguladoras de concesión en los términos establecidos en esta ley.</p><p>3. Las bases reguladoras de cada tipo de subvención se publicarán en el "Boletín Oficial del Estado" o en el diario oficial correspondiente.</p><p>4. Adicionalmente, el otorgamiento de una subvención debe cumplir los siguientes requisitos:</p><p>a) La competencia del órgano administrativo concedente.</p><p>b) La existencia de crédito adecuado y suficiente para atender las obligaciones de contenido económico que se derivan de la concesión de la subvención.</p><p>c) La tramitación del procedimiento de concesión de acuerdo con las normas que resulten de aplicación.</p><p>d) La fiscalización previa de los actos administrativos de contenido económico, en los términos previstos en las leyes.</p><p>e) La aprobación del gasto por el órgano competente para ello.</p>`,dis:`<ul>
<li><b>9.1 — ayudas de Estado:</b> cuando proceda, comunicación previa de los proyectos a la <b>Comisión Europea</b>.</li>
<li><b>9.2 — bases previas:</b> con carácter previo al otorgamiento deben <b>aprobarse las bases reguladoras</b>.</li>
<li><b>9.3 — publicación:</b> las bases se publican en el <b>BOE o en el diario oficial correspondiente</b>.</li>
<li><b>9.4 — cinco requisitos adicionales del otorgamiento:</b>
<ol><li><b>a)</b> <b>competencia</b> del órgano concedente;</li>
<li><b>b)</b> existencia de <b>crédito adecuado y suficiente</b>;</li>
<li><b>c)</b> tramitación del <b>procedimiento</b> de concesión;</li>
<li><b>d)</b> <b>fiscalización previa</b> de los actos de contenido económico;</li>
<li><b>e)</b> <b>aprobación del gasto</b> por el órgano competente.</li></ol></li>
</ul>`,llano:`<p>Antes de firmar una subvención hay que tener cinco cosas en regla: que quien firma sea competente, que haya dinero, que se haya seguido el procedimiento, que el interventor lo haya fiscalizado y que el gasto esté aprobado. Y antes de todo eso, las bases aprobadas y publicadas en el diario oficial.</p>`,porque:`<p>Es la <b>lista de comprobación de la legalidad</b> de toda subvención, y coincide punto por punto con la lógica presupuestaria del tema 8: crédito adecuado y suficiente (art. 172 TRLHL), fiscalización previa (art. 214 TRLHL) y aprobación del gasto (fase A del art. 184 TRLHL). Publicar las bases antes de conceder es lo que hace posible la concurrencia: nadie puede competir por lo que no conoce.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> las bases de un concurso publicadas antes de que se presenten los participantes.</li>
<li><b>Real:</b> un ayuntamiento aprueba en enero las bases de las ayudas al deporte base, las publica en el BOP, aprueba el gasto por 80.000 € con fiscalización previa favorable y convoca en febrero.</li>
<li><b>Caso límite:</b> conceder una subvención sin crédito adecuado y suficiente: además de infringir el art. 9.4.b) LGS, el compromiso sería <b>nulo de pleno derecho</b> por el art. 173.5 TRLHL.</li>
</ul>`,noej:`<ul>
<li><b>No basta</b> aprobar las bases: hay que <b>publicarlas</b> en el diario oficial.</li>
<li><b>No sustituye</b> la convocatoria a las bases reguladoras, salvo que estas se incluyan en ella por su especificidad (art. 23.2.a).</li>
</ul>`,conex:`<ul>
<li><b>Art. 17 LGS:</b> quién aprueba las bases y con qué contenido.</li>
<li><b>Arts. 172 y 173.5 TRLHL</b> (documento 5): crédito limitativo y nulidad del gasto sin crédito.</li>
<li><b>Arts. 214 y 219 TRLHL:</b> función interventora y fiscalización previa.</li>
<li><b>Art. 184.1.a) TRLHL:</b> aprobación del gasto.</li>
</ul>`,trampas:`<ul>
<li>Los requisitos del 9.4 son <b>cinco</b> y se preguntan en bloque.</li>
<li>Las bases se publican en el <b>BOE o diario oficial correspondiente</b>: en las entidades locales, el boletín de la provincia.</li>
<li>La comunicación a la Comisión Europea del 9.1 solo procede en el marco de las <b>ayudas de Estado</b>.</li>
</ul>`,ancla:`<p><b>Antes de conceder: "C-C-P-F-G"</b> — <b>C</b>ompetencia · <b>C</b>rédito · <b>P</b>rocedimiento · <b>F</b>iscalización · <b>G</b>asto aprobado. Y antes de todo: <b>bases aprobadas y publicadas</b>.</p>`,vis:`<svg viewBox="0 0 640 165" role="img" aria-label="Requisitos previos al otorgamiento de subvenciones">

<g font-size="10" text-anchor="middle" fill="currentColor">

<rect x="268" y="62" width="120" height="56" rx="8" fill="var(--panel)" stroke="var(--line)"/><text x="328" y="84" font-weight="700">c) Procedimiento</text><text x="328" y="102">tramitado</text>
<rect x="396" y="62" width="120" height="56" rx="8" fill="var(--panel)" stroke="var(--line)"/><text x="456" y="84" font-weight="700">d) Fiscalización</text><text x="456" y="102">previa</text>
<rect x="524" y="62" width="104" height="56" rx="8" fill="var(--panel)" stroke="var(--line)"/><text x="576" y="84" font-weight="700">e) Gasto</text><text x="576" y="102">aprobado</text>
</g>
<text x="320" y="148" text-anchor="middle" font-size="10" fill="var(--ink2)">Coincide con la disciplina presupuestaria del tema 8: arts. 172, 184 y 214 TRLHL</text>
</svg>`},
{n:10,t:"Órganos competentes para la concesión de subvenciones",ubic:"Título Preliminar (Disposiciones generales) ▸ Capítulo II (Disposiciones comunes a las subvenciones públicas)",idea:"En el Estado conceden ministros y directores; en lo local, quien diga el régimen local.",literal:`<p>1. Los Ministros y los Secretarios de Estado en la Administración General del Estado y los presidentes o directores de los organismos y las entidades públicas vinculados o dependientes de la Administración General del Estado, cualquiera que sea el régimen jurídico a que hayan de sujetar su actuación, son los órganos competentes para conceder subvenciones, en sus respectivos ámbitos, previa consignación presupuestaria para este fin.</p><p>2. No obstante lo dispuesto en el apartado anterior, la concesión de subvenciones de cuantía superior a 12 millones de euros requerirá la previa autorización del Consejo de Ministros o, en el caso de que así lo establezca la normativa reguladora de la subvención, de la Comisión Delegada del Gobierno para Asuntos Económicos.</p><p>En el caso de subvenciones concedidas en régimen de concurrencia competitiva, la autorización a que se refiere el párrafo anterior deberá obtenerse antes de la aprobación de la convocatoria cuya cuantía supere el citado límite.</p><p>En el caso de convocatorias que, en aplicación de lo dispuesto en el artículo 23.2 b) de esta Ley y 58.2 de su Reglamento, fijen, además de la cuantía total máxima, una cuantía adicional, el importe indicado en el primer párrafo de este apartado debe entenderse por</p><p>referencia al global que resulte de la cuantía máxima y la cuantía adicional prevista. Este importe global se reflejará en la propuesta de acuerdo que se someta a autorización, de forma que, una vez adoptado el acuerdo, la autorización se entenderá efectuada hasta ese importe. De no reflejarse en la propuesta de acuerdo la cuantía adicional será necesario recabar nueva autorización del Consejo de Ministros.</p><p>La referida autorización no implicará la aprobación del gasto, que, en todo caso, corresponderá al órgano competente.</p><p>3. Las facultades para conceder subvenciones, a que se refiere este artículo, podrán ser objeto de desconcentración mediante real decreto acordado en Consejo de Ministros.</p><p>4. La competencia para conceder subvenciones en las corporaciones locales corresponde a los órganos que tengan atribuidas tales funciones en la legislación de régimen local.</p>`,dis:`<ul>
<li><b>10.1 — AGE:</b> son competentes los <b>Ministros y Secretarios de Estado</b> y los <b>presidentes o directores</b> de los organismos y entidades públicas vinculados o dependientes.</li>
<li><b>10.2 — autorización del Consejo de Ministros:</b> las subvenciones de cuantía <b>superior a 12 millones de euros</b> requieren <b>autorización previa</b> del Consejo de Ministros o, si lo prevé la normativa reguladora, de la Comisión Delegada del Gobierno para Asuntos Económicos. En concurrencia competitiva, la autorización debe obtenerse <b>antes de aprobar la convocatoria</b>. La autorización <b>no implica</b> la aprobación del gasto.</li>
<li><b>10.3 — desconcentración:</b> las facultades pueden desconcentrarse por <b>real decreto</b> acordado en Consejo de Ministros.</li>
<li><b>10.4 — corporaciones locales:</b> la competencia corresponde a los <b>órganos que la tengan atribuida en la legislación de régimen local</b>.</li>
</ul>`,llano:`<p>En la Administración del Estado conceden los ministros y los responsables de los organismos, y si la subvención pasa de doce millones hace falta permiso previo del Consejo de Ministros. En los ayuntamientos no lo dice esta ley: hay que ir a la legislación de régimen local para saber si concede el alcalde, la Junta de Gobierno o el Pleno.</p>`,porque:`<p>La <b>autorización previa</b> del Consejo de Ministros funciona como un filtro político para las decisiones de mayor impacto presupuestario, sin sustituir al órgano gestor: por eso la ley aclara que no implica la aprobación del gasto. Y la remisión al régimen local respeta la <b>autonomía organizativa</b> de las entidades locales, que tienen su propio reparto competencial.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> en una empresa, el gerente firma hasta cierto importe y por encima hace falta el visto bueno del consejo.</li>
<li><b>Real:</b> una convocatoria estatal de ayudas por 15 M€ necesita autorización del Consejo de Ministros <b>antes</b> de aprobarse la convocatoria.</li>
<li><b>Caso límite:</b> en un ayuntamiento, la competencia depende de la cuantía y de lo que digan las bases de ejecución y la legislación local: la LGS no la fija.</li>
</ul>`,noej:`<ul>
<li><b>No fija</b> esta ley la competencia en las entidades locales: se remite al régimen local.</li>
<li><b>No equivale</b> la autorización del Consejo de Ministros a la aprobación del gasto.</li>
</ul>`,conex:`<ul>
<li><b>Art. 9.4.a) LGS:</b> la competencia como requisito del otorgamiento.</li>
<li><b>Ley 7/1985, LBRL</b> <i>(norma externa a la biblioteca)</i>: reparto competencial en las corporaciones locales.</li>
<li><b>Art. 185 TRLHL</b> (documento 5): competencias en materia de gestión de gastos.</li>
</ul>`,trampas:`<ul>
<li>La cifra: <b>superior a 12 millones de euros</b>.</li>
<li>En concurrencia competitiva, la autorización se obtiene <b>antes de aprobar la convocatoria</b>, no antes de conceder.</li>
<li>En las entidades locales rige la <b>legislación de régimen local</b>, no el art. 10.1.</li>
</ul>`,ancla:`<p><b>12 millones = permiso del Consejo de Ministros.</b> Y en lo local: <b>"pregunta a la LBRL"</b>.</p>`,vis:`<svg viewBox="0 0 640 145" role="img" aria-label="Órganos competentes para conceder subvenciones">

{n:11,t:"Beneficiarios",ubic:"Título Preliminar (Disposiciones generales) ▸ Capítulo II (Disposiciones comunes a las subvenciones públicas)",idea:"Beneficiario es quien hace la actividad o está en la situación que legitima la ayuda.",literal:`<p>1. Tendrá la consideración de beneficiario de subvenciones la persona que haya de realizar la actividad que fundamentó su otorgamiento o que se encuentre en la situación que legitima su concesión.</p><p>2. Cuando el beneficiario sea una persona jurídica, y siempre que así se prevea en las bases reguladoras, los miembros asociados del beneficiario que se comprometan a efectuar la totalidad o parte de las actividades que fundamentan la concesión de la subvención en nombre y por cuenta del primero tendrán igualmente la consideración de beneficiarios.</p><p>3. Cuando se prevea expresamente en las bases reguladoras, podrán acceder a la condición de beneficiario las agrupaciones de personas físicas o jurídicas, públicas o privadas, las comunidades de bienes o cualquier otro tipo de unidad económica o patrimonio separado que, aun careciendo de personalidad jurídica, puedan llevar a cabo los proyectos, actividades o comportamientos o se encuentren en la situación que motiva la concesión de la subvención.</p><p>Cuando se trate de agrupaciones de personas físicas o jurídicas, públicas o privadas sin personalidad, deberán hacerse constar expresamente, tanto en la solicitud como en la resolución de concesión, los compromisos de ejecución asumidos por cada miembro de la agrupación, así como el importe de subvención a aplicar por cada uno de ellos, que tendrán igualmente la consideración de beneficiarios. En cualquier caso, deberá nombrarse un representante o apoderado único de la agrupación, con poderes bastantes para cumplir las obligaciones que, como beneficiario, corresponden a la agrupación. No podrá disolverse la agrupación hasta que haya transcurrido el plazo de prescripción previsto en los artículos 39 y 65 de esta ley.</p>`,dis:`<ul>
<li><b>11.1 — concepto:</b> la persona que <b>haya de realizar la actividad</b> que fundamentó el otorgamiento o que <b>se encuentre en la situación</b> que legitima su concesión.</li>
<li><b>11.2 — miembros asociados:</b> si el beneficiario es persona jurídica y así lo prevén las bases, tienen también la consideración de beneficiarios los <b>miembros asociados</b> que se comprometan a efectuar la actividad en nombre y por cuenta de aquel.</li>
<li><b>11.3 — entes sin personalidad:</b> cuando lo prevean expresamente las bases, pueden ser beneficiarios las <b>agrupaciones de personas físicas o jurídicas</b>, las <b>comunidades de bienes</b> o cualquier otra unidad económica o patrimonio separado sin personalidad. Deben hacerse constar <b>en la solicitud y en la resolución</b> los <b>compromisos de ejecución</b> de cada miembro y el <b>importe</b> aplicable a cada uno, que también son beneficiarios. Debe nombrarse un <b>representante o apoderado único</b> y la agrupación <b>no podrá disolverse</b> hasta que transcurra el plazo de prescripción de los arts. 39 y 65.</li>
</ul>`,llano:`<p>Beneficiario no es solo quien cobra: es quien tiene que hacer lo subvencionado o quien está en la situación que justifica la ayuda. La ley permite además que se agrupen varios sin crear una entidad nueva, pero entonces cada uno responde de su parte, hay que nombrar un representante y el grupo no se puede deshacer hasta que prescriba todo.</p>`,porque:`<p>Admitir agrupaciones sin personalidad es una <b>facilidad práctica</b> —proyectos conjuntos entre varias entidades pequeñas— pero abría un riesgo: que al terminar el proyecto la agrupación se disolviera y no hubiera a quién exigir el reintegro. De ahí las tres cautelas: compromisos individualizados, representante único y prohibición de disolverse antes de la prescripción.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> tres amigos que piden juntos un crédito: el banco quiere saber qué parte asume cada uno.</li>
<li><b>Real:</b> tres asociaciones vecinales presentan un proyecto conjunto de dinamización: en la solicitud y en la resolución consta que la primera ejecuta el 50 % y percibe 5.000 €, y las otras el 25 % y 2.500 € cada una.</li>
<li><b>Caso límite:</b> una de las tres incurre en una prohibición del art. 13.2: <b>ninguna</b> puede acceder a la condición de beneficiaria, porque el art. 13.2.i) lo impide para toda la agrupación.</li>
</ul>`,noej:`<ul>
<li><b>No cabe</b> que una agrupación sin personalidad sea beneficiaria si las bases no lo prevén expresamente.</li>
<li><b>No es beneficiario</b> el mero perceptor material del pago si no asume la actividad ni está en la situación legitimadora.</li>
</ul>`,conex:`<ul>
<li><b>Art. 13.2.i) LGS:</b> las prohibiciones alcanzan a toda la agrupación si concurren en un miembro.</li>
<li><b>Art. 30.6 LGS:</b> obligaciones de justificación de los miembros.</li>
<li><b>Art. 40.2 LGS:</b> responsabilidad solidaria de los miembros frente al reintegro.</li>
</ul>`,trampas:`<ul>
<li>Dos vías para ser beneficiario: <b>realizar la actividad</b> o <b>encontrarse en la situación</b>.</li>
<li>Las agrupaciones exigen previsión expresa en las bases, <b>compromisos y importes individualizados</b> y <b>representante único</b>.</li>
<li>La agrupación no puede disolverse hasta que transcurra el <b>plazo de prescripción</b> de los arts. 39 y 65.</li>
</ul>`,ancla:`<p><b>"Beneficiario = quien hace o quien está."</b> Y si sois varios sin sociedad: <b>reparto por escrito, un portavoz y nada de disolverse</b>.</p>`,vis:`<svg viewBox="0 0 640 150" role="img" aria-label="Concepto de beneficiario">
<rect x="60" y="25" width="230" height="56" rx="8" fill="var(--acc-soft)" stroke="var(--acc)"/>

<text x="175" y="66" text-anchor="middle" font-size="10" fill="currentColor">que fundamentó el otorgamiento</text>
<text x="320" y="55" text-anchor="middle" font-size="14" fill="var(--ink2)">o</text>
<rect x="350" y="25" width="230" height="56" rx="8" fill="var(--ej-bg)" stroke="var(--ej)"/>
<text x="465" y="47" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ej)">Quien está en la situación</text>
<text x="465" y="66" text-anchor="middle" font-size="10" fill="currentColor">que legitima su concesión</text>
<rect x="90" y="96" width="460" height="44" rx="8" fill="var(--warn-bg)" stroke="var(--warn)"/>
<text x="320" y="115" text-anchor="middle" font-size="11" font-weight="700" fill="var(--warn)">Agrupaciones sin personalidad (11.3)</text>
<text x="320" y="132" text-anchor="middle" font-size="10" fill="currentColor">compromisos e importes por miembro · representante único · no disolverse hasta la prescripción</text>
</svg>`},
{n:12,t:"Entidades colaboradoras",ubic:"Título Preliminar (Disposiciones generales) ▸ Capítulo II (Disposiciones comunes a las subvenciones públicas)",idea:"La entidad colaboradora entrega los fondos o gestiona, en nombre del órgano concedente.",literal:`<p>1. Será entidad colaboradora aquella que, actuando en nombre y por cuenta del órgano concedente a todos los efectos relacionados con la subvención, entregue y distribuya los fondos públicos a los beneficiarios cuando así se establezca en las bases reguladoras, o colabore en la gestión de la subvención sin que se produzca la previa entrega y distribución de los fondos recibidos. Estos fondos, en ningún caso, se considerarán integrantes de su patrimonio.</p><p>Igualmente tendrán esta condición los que habiendo sido denominados beneficiarios conforme a la normativa comunitaria tengan encomendadas, exclusivamente, las funciones enumeradas en el párrafo anterior.</p><p>2. Podrán ser consideradas entidades colaboradoras los organismos y demás entes públicos, las sociedades mercantiles participadas íntegra o mayoritariamente por las Administraciones públicas, organismos o entes de derecho público y las asociaciones a que se refiere la disposición adicional quinta de la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local, así como las demás personas jurídicas públicas o privadas que reúnan las condiciones de solvencia y eficacia que se establezcan.</p><p>3. Las comunidades autónomas y las corporaciones locales podrán actuar como entidades colaboradoras de las subvenciones concedidas por la Administración General del Estado, sus organismos públicos y demás entes que tengan que ajustar su actividad al derecho público. De igual forma, y en los mismos términos, la Administración General del</p><p>Estado y sus organismos públicos podrán actuar como entidades colaboradoras respecto de las subvenciones concedidas por las comunidades autónomas y corporaciones locales.</p>`,dis:`<ul>
<li><b>12.1 — concepto:</b> la que, <b>actuando en nombre y por cuenta del órgano concedente</b>, <b>entrega y distribuye los fondos</b> a los beneficiarios cuando así lo establezcan las bases, <b>o colabora en la gestión</b> sin que se produzca la previa entrega de fondos. También lo son quienes, denominados beneficiarios por la normativa comunitaria, tengan encomendadas exclusivamente esas funciones.</li>
<li><b>12.2 — quiénes pueden serlo:</b> organismos y demás entes públicos · <b>sociedades mercantiles participadas íntegra o mayoritariamente</b> por Administraciones u entes públicos · las <b>asociaciones de la disposición adicional quinta de la LBRL</b> · y las demás personas jurídicas públicas o privadas que reúnan las condiciones de solvencia y eficacia que se establezcan.</li>
<li><b>12.3 — colaboración entre Administraciones:</b> las comunidades autónomas y las corporaciones locales pueden actuar como colaboradoras de subvenciones estatales, y a la inversa.</li>
</ul>`,llano:`<p>A veces quien reparte el dinero no es quien lo concede. La entidad colaboradora es un intermediario que actúa en nombre del órgano concedente: puede limitarse a repartir los fondos o a ayudar en la gestión. No es beneficiaria: no se queda el dinero.</p>`,porque:`<p>La figura existe por eficiencia: una Administración puede no tener capilaridad para llegar a miles de beneficiarios, y una entidad especializada —o la Administración más cercana— lo hace mejor. Pero como maneja fondos públicos ajenos, la ley le impone <b>obligaciones propias</b> (art. 15), un <b>convenio</b> obligatorio (art. 16) y las <b>mismas prohibiciones</b> que a los beneficiarios (art. 13).</p>`,ej:`<ul>
<li><b>Cotidiano:</b> el amigo al que le das el dinero del regalo común para que lo compre y te enseñe el tique.</li>
<li><b>Real:</b> una diputación concede ayudas de emergencia social y encarga a los ayuntamientos, como entidades colaboradoras, la entrega a los beneficiarios y la comprobación de requisitos.</li>
<li><b>Caso límite:</b> una entidad que solo comprueba requisitos y no recibe fondos <b>sigue siendo</b> entidad colaboradora: el art. 12.1 admite la colaboración sin previa entrega de fondos.</li>
</ul>`,noej:`<ul>
<li><b>No es entidad colaboradora</b> el proveedor contratado por el beneficiario: es un tercero, y su relación se rige por el art. 29 (subcontratación).</li>
<li><b>No es beneficiaria</b> la entidad colaboradora, aunque reciba materialmente los fondos.</li>
</ul>`,conex:`<ul>
<li><b>Art. 15 LGS:</b> obligaciones de la entidad colaboradora.</li>
<li><b>Art. 16 LGS:</b> convenio de colaboración obligatorio y su contenido.</li>
<li><b>Art. 13 LGS:</b> mismos requisitos y prohibiciones que para el beneficiario.</li>
</ul>`,trampas:`<ul>
<li>Dos modalidades: <b>entregar y distribuir fondos</b> o <b>colaborar en la gestión sin recibirlos</b>.</li>
<li>Las sociedades mercantiles han de estar participadas <b>íntegra o mayoritariamente</b>.</li>
<li>Actúa siempre <b>en nombre y por cuenta del órgano concedente</b>.</li>
</ul>`,ancla:`<p><b>"Reparte pero no se queda."</b> La colaboradora es la mano del concedente, no la del beneficiario.</p>`,vis:`<svg viewBox="0 0 640 130" role="img" aria-label="Papel de la entidad colaboradora">

{n:13,t:"Requisitos para obtener la condición de beneficiario o entidad colaboradora",ubic:"Título Preliminar (Disposiciones generales) ▸ Capítulo II (Disposiciones comunes a las subvenciones públicas)",idea:"Diez prohibiciones cierran el paso a quien no puede ser beneficiario ni colaborador.",literal:`<p>1. Podrán obtener la condición de beneficiario o entidad colaboradora las personas o entidades que se encuentren en la situación que fundamenta la concesión de la subvención o en las que concurran las circunstancias previstas en las bases reguladoras y en la convocatoria.</p><p>2. No podrán obtener la condición de beneficiario o entidad colaboradora de las subvenciones reguladas en esta ley las personas o entidades en quienes concurra alguna de las circunstancias siguientes, salvo que por la naturaleza de la subvención se exceptúe por su normativa reguladora:</p><p>a) Haber sido condenadas mediante sentencia firme a la pena de pérdida de la posibilidad de obtener subvenciones o ayudas públicas o por delitos de prevaricación, cohecho, malversación de caudales públicos, tráfico de influencias, fraudes y exacciones ilegales o delitos urbanísticos.</p><p>b) Haber solicitado la declaración de concurso voluntario, haber sido declarados insolventes en cualquier procedimiento, hallarse declarados en concurso, salvo que en éste haya adquirido la eficacia un convenio, estar sujetos a intervención judicial o haber sido inhabilitados conforme a la Ley 22/2003, de 9 de julio, Concursal, sin que haya concluido el período de inhabilitación fijado en la sentencia de calificación del concurso.</p><p>c) Haber dado lugar, por causa de la que hubiesen sido declarados culpables, a la resolución firme de cualquier contrato celebrado con la Administración.</p><p>d) Estar incursa la persona física, los administradores de las sociedades mercantiles o aquellos que ostenten la representación legal de otras personas jurídicas, en alguno de los supuestos de la Ley 3/2015, de 30 de marzo, reguladora del ejercicio del alto cargo de la Administración General del Estado, de la Ley 53/1984, de 26 de diciembre, de incompatibilidades del Personal al Servicio de las Administraciones Públicas, o tratarse de cualquiera de los cargos electivos regulados en la Ley Orgánica 5/1985, de 19 de junio, del Régimen Electoral General, en los términos establecidos en la misma o en la normativa autonómica que regule estas materias.</p><p>e) No hallarse al corriente en el cumplimiento de las obligaciones tributarias o frente a la Seguridad Social impuestas por las disposiciones vigentes, en la forma que se determine reglamentariamente.</p><p>f) Tener la residencia fiscal en un país o territorio calificado reglamentariamente como paraíso fiscal.</p><p>g) No hallarse al corriente de pago de obligaciones por reintegro de subvenciones en los términos que reglamentariamente se determinen.</p><p>h) Haber sido sancionado mediante resolución firme con la pérdida de la posibilidad de obtener subvenciones conforme a ésta u otras leyes que así lo establezcan.</p><p>i) No podrán acceder a la condición de beneficiarios las agrupaciones previstas en el artículo 11.3, párrafo segundo cuando concurra alguna de las prohibiciones anteriores en cualquiera de sus miembros.</p><p>j) Las prohibiciones de obtener subvenciones afectarán también a aquellas empresas de las que, por razón de las personas que las rigen o de otras circunstancias, pueda presumirse que son continuación o que derivan, por transformación, fusión o sucesión, de otras empresas en las que hubiesen concurrido aquéllas.</p><p>3. En ningún caso podrán obtener la condición de beneficiario o entidad colaboradora de las subvenciones reguladas en esta ley las asociaciones incursas en las causas de prohibición previstas en los apartados 5 y 6 del artículo 4 de la Ley Orgánica 1/2002, de 22 de marzo, reguladora del Derecho de Asociación.</p><p>Tampoco podrán obtener la condición de beneficiario o entidad colaboradora las asociaciones respecto de las que se hubiera suspendido el procedimiento administrativo de inscripción por encontrarse indicios racionales de ilicitud penal, en aplicación de lo dispuesto en el artículo 30.4 de la Ley Orgánica 1/2002, en tanto no recaiga resolución judicial firme en cuya virtud pueda practicarse la inscripción en el correspondiente registro.</p><p>3 bis. Para subvenciones de importe superior a 30.000 euros, las personas físicas y jurídicas, distintas de las entidades de derecho público, con ánimo de lucro sujetas a la Ley 3/2004, de 29 de diciembre, por la que se establecen medidas de lucha contra la morosidad en las operaciones comerciales, deberán acreditar cumplir, en los términos dispuestos en este apartado, los plazos de pago que se establecen en la citada Ley para obtener la condición de beneficiario o entidad colaboradora. Cualquier financiación que permita el cobro anticipado de la empresa proveedora se considerará válida a efectos del cumplimiento de este apartado, siempre y cuando su coste corra a cargo del cliente y se haga sin posibilidad de recurso al proveedor en caso de impago.</p><p>Salvo que las bases reguladoras prevean otro plazo o momento de acreditación, ésta se efectuará en el plazo de 10 días hábiles desde la notificación de la propuesta de resolución provisional a los interesados para los que se propone la concesión de la subvención.</p><p>En el caso de que se prescinda del trámite de audiencia por no figurar en el procedimiento ni ser tenidos en cuenta otros hechos ni otras alegaciones y pruebas que las aducidas por los interesados, la acreditación se efectuará en el plazo de 10 días desde la notificación del requerimiento dirigido al efecto por el órgano instructor previo a la propuesta de resolución definitiva.</p><p>No obstante, si la certificación de auditor o el informe de procedimientos acordados no pudiere obtenerse antes de la terminación del plazo establecido para su presentación, se aportará justificante de haber solicitado dicho medio de acreditación y una vez obtenido se presentará inmediatamente y, en todo caso, antes de la resolución de concesión.</p><p>La acreditación del nivel de cumplimiento establecido se realizará por los siguientes medios de prueba:</p><p>a) Las personas físicas y jurídicas que, de acuerdo con la normativa contable pueden presentar cuenta de pérdidas y ganancias abreviada, mediante certificación suscrita por la persona física o, en el caso de personas jurídicas, por el órgano de administración o equivalente, con poder de representación suficiente, en la que afirmen alcanzar el nivel de cumplimiento de los plazos de pago previstos en la citada Ley 3/2004, de 29 de diciembre. Podrán también acreditar dicha circunstancia por alguno de los medios de prueba previstos en la letra b) siguiente y con sujeción a su regulación</p><p>b) Las personas jurídicas que, de acuerdo con la normativa contable no pueden presentar cuenta de pérdidas y ganancias abreviada, mediante:</p><p>1.º Certificación emitida por auditor inscrito en el Registro Oficial de Auditores de Cuentas que contenga una trascripción desglosada de la información en materia de pagos descrita en la memoria de las últimas cuentas anuales auditadas, cuando de ellas se desprenda que se alcanza el nivel de cumplimiento de los plazos de pago establecidos en la Ley 3/2004, de 29 de diciembre, determinado en este apartado, en base a la información requerida por la disposición adicional tercera de la Ley 15/2010, de 5 de julio, de modificación de la Ley 3/2004, de 29 de diciembre.</p><p>Esta certificación será válida hasta que resulten auditadas las cuentas anuales del ejercicio siguiente.</p><p>2.º En el caso de que no sea posible emitir el certificado al que se refiere el número anterior, «Informe de Procedimientos Acordados», elaborado por un auditor inscrito en el Registro Oficial de Auditores de Cuentas, que, en base a la revisión de una muestra representativa de las facturas pendientes de pago a proveedores de la sociedad a una fecha de referencia, concluya sin la detección de excepciones al cumplimiento de los plazos de pago de la Ley 3/2004, de 29 de diciembre, o en el caso de que se detectasen, éstas no impidan alcanzar el nivel de cumplimiento requerido en el último párrafo de este apartado.</p><p>A los efectos de esta Ley, se entenderá cumplido el requisito exigido en este apartado cuando el nivel de cumplimiento de los plazos de pago previstos en la Ley 3/2004, de 29 de diciembre, sea igual o superior al porcentaje previsto en la disposición final sexta, letra d), apartado segundo, de la Ley 18/2022, de 28 de septiembre, de creación y crecimiento de empresas.</p><p>4. Las prohibiciones contenidas en los párrafos b), d), e), f), g), h), i) y j) del apartado 2 y en los apartados 3 y 3 bis de este artículo se apreciarán de forma automática y subsistirán mientras concurran las circunstancias que, en cada caso, las determinen.</p><p>5. Las prohibiciones contenidas en los párrafos a) y h) del apartado 2 de este artículo se apreciarán de forma automática. El alcance de la prohibición será el que determine la sentencia o resolución firme. En su defecto, el alcance se fijará de acuerdo con el procedimiento determinado reglamentariamente, sin que pueda exceder de cinco años en caso de que la prohibición no derive de sentencia firme.</p><p>6. La apreciación y alcance de la prohibición contenida en el párrafo c) del apartado 2 de este artículo se determinará de acuerdo con lo establecido en el artículo 21, en relación con el artículo 20.c) del texto refundido de la Ley de Contratos de las Administraciones Públicas, aprobado por el Real Decreto Legislativo 2/2002, de 16 de junio.</p><p>7. La justificación por parte de las personas o entidades de no estar incursos en las prohibiciones para obtener la condición de beneficiario o entidad colaboradora, señaladas en los apartados 2 y 3 de este artículo, podrá realizarse mediante testimonio judicial, certificados telemáticos o transmisiones de datos, de acuerdo con lo establecido en la normativa reglamentaria que regule la utilización de técnicas electrónicas, informáticas y telemáticas por la Administración General del Estado o de las comunidades autónomas, o certificación administrativa, según los casos, y cuando dicho documento no pueda ser expedido por la autoridad competente, podrá ser sustituido por una declaración responsable otorgada ante una autoridad administrativa o notario público.</p>`,dis:`<table><thead><tr><th>Letra</th><th>Prohibición (art. 13.2)</th></tr></thead><tbody>
<tr><td><b>a)</b></td><td>Condena firme a pérdida de la posibilidad de obtener subvenciones o por <b>prevaricación, cohecho, malversación, tráfico de influencias, fraudes y exacciones ilegales o delitos urbanísticos</b></td></tr>
<tr><td><b>b)</b></td><td>Situaciones <b>concursales</b>: concurso voluntario solicitado, insolvencia declarada, concurso, intervención judicial o inhabilitación concursal</td></tr>
<tr><td><b>c)</b></td><td>Haber dado lugar, por causa de la que hubiesen sido declarados culpables, a la <b>resolución firme de un contrato</b> con la Administración</td></tr>
<tr><td><b>d)</b></td><td>Estar incurso en supuestos de la <b>Ley 3/2015</b> de alto cargo, la <b>Ley 53/1984</b> de incompatibilidades o la normativa electoral</td></tr>
<tr><td><b>e)</b></td><td>No hallarse <b>al corriente</b> de obligaciones <b>tributarias o con la Seguridad Social</b></td></tr>
<tr><td><b>f)</b></td><td>Tener la <b>residencia fiscal</b> en un país o territorio calificado como <b>paraíso fiscal</b></td></tr>
<tr><td><b>g)</b></td><td>No hallarse al corriente de pago de obligaciones por <b>reintegro</b> de subvenciones</td></tr>
<tr><td><b>h)</b></td><td>Haber sido <b>sancionado</b> con la pérdida de la posibilidad de obtener subvenciones</td></tr>
<tr><td><b>i)</b></td><td>Las <b>agrupaciones</b> del art. 11.3 cuando la prohibición concurra en <b>cualquiera de sus miembros</b></td></tr>
<tr><td><b>j)</b></td><td>Empresas que sean <b>continuación o deriven</b> por transformación, fusión o sucesión de otras en las que concurrieran las prohibiciones</td></tr>
</tbody></table>
<ul>
<li><b>13.3 — asociaciones:</b> nunca podrán serlo las incursas en las causas de prohibición de los apartados 5 y 6 del art. 4 de la <b>LO 1/2002</b> del Derecho de Asociación, ni aquellas cuya inscripción esté suspendida por indicios racionales de ilicitud penal.</li>
<li><b>13.3 bis — morosidad:</b> en subvenciones <b>superiores a 30.000 €</b>, las personas con ánimo de lucro sujetas a la <b>Ley 3/2004</b> deben acreditar el cumplimiento de los plazos de pago. Plazo de acreditación: <b>10 días hábiles</b> desde la notificación de la propuesta de resolución provisional.</li>
<li><b>13.4 y 13.5 — apreciación:</b> las prohibiciones de las letras b), d), e), f), g), h), i) y j) y las de los apartados 3 y 3 bis se aprecian <b>de forma automática</b> y subsisten mientras concurran las circunstancias; las de las letras a) y h) también, con el alcance que fije la sentencia o resolución.</li>
<li><b>13.7 — justificación:</b> mediante <b>testimonio judicial, certificados telemáticos o transmisiones de datos</b>; cuando no sea posible, mediante <b>declaración responsable</b> ante autoridad administrativa, notario o secretario de asociación.</li>
</ul>`,llano:`<p>No cualquiera puede recibir dinero público. La ley cierra la puerta a quien ha sido condenado por corrupción, está en concurso, debe a Hacienda o a la Seguridad Social, no ha devuelto un reintegro pendiente, tiene su residencia fiscal en un paraíso o ha sido sancionado con esa prohibición. Y si el que falla es un miembro de una agrupación, caen todos.</p>`,porque:`<p>Es el equivalente subvencional de las <b>prohibiciones de contratar</b>: el dinero público no puede acabar en manos de quien ha demostrado que no es fiable en su relación con la Administración. La regla de la letra <b>e)</b> —estar al corriente— tiene además una lógica elemental de coherencia: no se entrega dinero a quien simultáneamente lo debe.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> un club que no admite socios que dejaron cuotas sin pagar.</li>
<li><b>Real:</b> una asociación solicita 8.000 € y no está al corriente con la Seguridad Social: no puede obtener la condición de beneficiaria (art. 13.2.e), y así debe acreditarlo antes de la propuesta de resolución (art. 14.1.e).</li>
<li><b>Caso límite:</b> subvención de 45.000 € a una empresa: además de las prohibiciones generales, debe acreditar el cumplimiento de los plazos de pago de la Ley 3/2004 en el plazo de <b>10 días hábiles</b> desde la propuesta provisional (art. 13.3 bis).</li>
</ul>`,noej:`<ul>
<li><b>No opera</b> la prohibición si la propia normativa reguladora la exceptúa por la naturaleza de la subvención (inciso inicial del 13.2).</li>
<li><b>No basta</b> con no tener deudas: hay que <b>acreditarlo</b> en la forma reglamentaria.</li>
</ul>`,conex:`<ul>
<li><b>Art. 11.3 LGS:</b> agrupaciones, a las que se extiende la prohibición por la letra i).</li>
<li><b>Art. 14.1.e) LGS:</b> obligación de acreditar estar al corriente antes de la propuesta de resolución.</li>
<li><b>Art. 20.2 LGS:</b> las prohibiciones de las letras a) y h) se inscriben en la BDNS durante 10 años desde la finalización del plazo.</li>
<li><b>Art. 71 de la Ley 9/2017</b> (documento 7): prohibiciones de contratar, con lógica paralela.</li>
</ul>`,trampas:`<ul>
<li>Son <b>diez</b> letras. Las más preguntadas: <b>e)</b> estar al corriente, <b>f)</b> paraíso fiscal y <b>g)</b> reintegros pendientes.</li>
<li>La letra <b>i)</b> contagia la prohibición a <b>toda la agrupación</b>.</li>
<li>El umbral de la morosidad es <b>30.000 €</b> y el plazo de acreditación, <b>10 días hábiles</b>.</li>
<li>Cuidado con la remisión del 13.6 al <b>RDLeg 2/2002</b> de contratos: es una <b>cita desfasada</b>; hoy rige la Ley 9/2017.</li>
</ul>`,ancla:`<p><b>Las tres deudas que te dejan fuera:</b> con <b>Hacienda</b>, con la <b>Seguridad Social</b> y por <b>reintegros</b>. Y las tres condenas: <b>penal, contractual y sancionadora</b>.</p>`,vis:`<svg viewBox="0 0 640 175" role="img" aria-label="Prohibiciones para ser beneficiario o entidad colaboradora">

<rect x="429" y="56" width="196" height="56" rx="8" fill="var(--panel)" stroke="var(--line)"/><text x="527" y="78" font-weight="700">Situación de la entidad</text><text x="527" y="96">b) concurso · d) incompatibilidades · f) paraíso</text>
</g>

{n:14,t:"Obligaciones de los beneficiarios",ubic:"Título Preliminar (Disposiciones generales) ▸ Capítulo II (Disposiciones comunes a las subvenciones públicas)",idea:"Nueve obligaciones del beneficiario: cumplir, justificar, someterse, comunicar y conservar.",literal:`<p>1. Son obligaciones del beneficiario:</p><p>a) Cumplir el objetivo, ejecutar el proyecto, realizar la actividad o adoptar el comportamiento que fundamenta la concesión de las subvenciones.</p><p>b) Justificar ante el órgano concedente o la entidad colaboradora, en su caso, el cumplimiento de los requisitos y condiciones, así como la realización de la actividad y el cumplimiento de la finalidad que determinen la concesión o disfrute de la subvención.</p><p>c) Someterse a las actuaciones de comprobación, a efectuar por el órgano concedente o la entidad colaboradora, en su caso, así como cualesquiera otras de comprobación y control financiero que puedan realizar los órganos de control competentes, tanto nacionales como comunitarios, aportando cuanta información le sea requerida en el ejercicio de las actuaciones anteriores.</p><p>d) Comunicar al órgano concedente o la entidad colaboradora la obtención de otras subvenciones, ayudas, ingresos o recursos que financien las actividades subvencionadas.</p><p>Esta comunicación deberá efectuarse tan pronto como se conozca y, en todo caso, con anterioridad a la justificación de la aplicación dada a los fondos percibidos.</p><p>e) Acreditar con anterioridad a dictarse la propuesta de resolución de concesión que se halla al corriente en el cumplimiento de sus obligaciones tributarias y frente a la Seguridad Social, en la forma que se determine reglamentariamente, y sin perjuicio de lo establecido en la disposición adicional decimoctava de la Ley 30/1992, de 26 de noviembre, de Régimen Jurídico de las Administraciones Públicas y del Procedimiento Administrativo Común.</p><p>f) Disponer de los libros contables, registros diligenciados y demás documentos debidamente auditados en los términos exigidos por la legislación mercantil y sectorial aplicable al beneficiario en cada caso, así como cuantos estados contables y registros específicos sean exigidos por las bases reguladoras de las subvenciones, con la finalidad de garantizar el adecuado ejercicio de las facultades de comprobación y control.</p><p>g) Conservar los documentos justificativos de la aplicación de los fondos recibidos, incluidos los documentos electrónicos, en tanto puedan ser objeto de las actuaciones de comprobación y control.</p><p>h) Adoptar las medidas de difusión contenidas en el apartado 4 del artículo 18 de esta ley.</p><p>i) Proceder al reintegro de los fondos percibidos en los supuestos contemplados en el artículo 37 de esta ley.</p><p>2. La rendición de cuentas de los perceptores de subvenciones, a que se refiere el artículo 34.3 de la Ley 7/1988, de 5 de abril, de funcionamiento del Tribunal de Cuentas, se instrumentará a través del cumplimiento de la obligación de justificación al órgano</p><p>concedente o entidad colaboradora, en su caso, de la subvención, regulada en el párrafo b) del apartado 1 de este artículo.</p>`,dis:`<table><thead><tr><th>Letra</th><th>Obligación del beneficiario (art. 14.1)</th></tr></thead><tbody>
<tr><td><b>a)</b></td><td><b>Cumplir</b> el objetivo, ejecutar el proyecto, realizar la actividad o adoptar el comportamiento que fundamenta la concesión</td></tr>
<tr><td><b>b)</b></td><td><b>Justificar</b> ante el órgano concedente o la entidad colaboradora el cumplimiento de requisitos y condiciones y la realización de la actividad</td></tr>
<tr><td><b>c)</b></td><td><b>Someterse</b> a las actuaciones de comprobación y a las de control financiero, nacionales o comunitarias</td></tr>
<tr><td><b>d)</b></td><td><b>Comunicar</b> la obtención de otras subvenciones, ayudas, ingresos o recursos, tan pronto como se conozca y, en todo caso, <b>antes de la justificación</b></td></tr>
<tr><td><b>e)</b></td><td><b>Acreditar</b>, con anterioridad a dictarse la propuesta de resolución de concesión, hallarse <b>al corriente</b> con Hacienda y la Seguridad Social</td></tr>
<tr><td><b>f)</b></td><td>Disponer de <b>libros contables y registros diligenciados</b> conforme a la legislación aplicable</td></tr>
<tr><td><b>g)</b></td><td><b>Conservar</b> los documentos justificativos, incluidos los electrónicos, mientras puedan ser objeto de comprobación y control</td></tr>
<tr><td><b>h)</b></td><td>Adoptar las <b>medidas de difusión</b> del art. 18.4</td></tr>
<tr><td><b>i)</b></td><td><b>Reintegrar</b> los fondos en los supuestos del art. 37</td></tr>
</tbody></table>
<p><b>14.2:</b> la <b>rendición de cuentas</b> de los perceptores ante el Tribunal de Cuentas se instrumenta a través del cumplimiento de la obligación de justificación de la letra b).</p>`,llano:`<p>Recibir una subvención no es cobrar y olvidarse. Hay que hacer lo prometido, demostrarlo, dejarse comprobar, avisar si te dan más dinero de otro sitio, estar al día con Hacienda y la Seguridad Social, llevar las cuentas, guardar los papeles, decir públicamente que la actividad está subvencionada y devolver el dinero si procede.</p>`,porque:`<p>Las obligaciones dibujan el <b>equilibrio</b> de la subvención: no hay contraprestación, pero sí una carga. La letra <b>d)</b> es la que protege la regla del art. 19.3 (no superar el coste de la actividad) y la <b>g)</b> es la que hace posible el control financiero años después. La letra <b>h)</b> responde a una idea democrática: quien recibe dinero público debe decirlo.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> una beca que exige aprobar, entregar el expediente y devolverla si abandonas.</li>
<li><b>Real:</b> una asociación subvencionada con 10.000 € para un festival incluye el escudo municipal en los carteles (letra h), presenta cuenta justificativa (b) y comunica que ha obtenido además 3.000 € de la Diputación (d).</li>
<li><b>Caso límite:</b> si la suma de ambas ayudas superara el coste del festival, procedería minorar o reintegrar por aplicación del art. 19.3.</li>
</ul>`,noej:`<ul>
<li><b>No basta</b> con gastar el dinero: hay que <b>justificar</b> la realización de la actividad y la finalidad.</li>
<li><b>No se agota</b> la obligación de comunicar en el momento de solicitar: rige durante toda la vida de la subvención.</li>
</ul>`,conex:`<ul>
<li><b>Art. 30 LGS:</b> justificación de las subvenciones públicas.</li>
<li><b>Art. 19.3 LGS:</b> límite del importe: no superar el coste de la actividad.</li>
<li><b>Art. 37 LGS:</b> causas de reintegro.</li>
<li><b>Art. 189.2 TRLHL</b> (documento 5): en el ámbito local, acreditación previa y justificación posterior.</li>
</ul>`,trampas:`<ul>
<li>La letra <b>e)</b> exige acreditar estar al corriente <b>antes de la propuesta de resolución de concesión</b>, no en el pago.</li>
<li>La letra <b>d)</b> impone comunicar <b>tan pronto como se conozca</b> y siempre <b>antes de justificar</b>.</li>
<li>La obligación de <b>conservar</b> dura mientras quepa comprobación y control, no un plazo fijo en la ley.</li>
</ul>`,ancla:`<p><b>"Haz, demuestra, déjate mirar, avisa y guarda."</b> Cinco verbos que resumen las nueve letras.</p>`,vis:`<svg viewBox="0 0 640 160" role="img" aria-label="Obligaciones del beneficiario">
<g font-size="10" text-anchor="middle" fill="currentColor">
<rect x="15" y="30" width="145" height="52" rx="8" fill="var(--acc-soft)" stroke="var(--acc)"/><text x="87" y="52" font-size="11" font-weight="700" fill="var(--acc)">a) Cumplir</text><text x="87" y="70">la actividad</text>
<rect x="172" y="30" width="145" height="52" rx="8" fill="var(--ej-bg)" stroke="var(--ej)"/><text x="244" y="52" font-size="11" font-weight="700" fill="var(--ej)">b) Justificar</text><text x="244" y="70">ante el concedente</text>
<rect x="329" y="30" width="145" height="52" rx="8" fill="var(--warn-bg)" stroke="var(--warn)"/><text x="401" y="52" font-size="11" font-weight="700" fill="var(--warn)">c) Someterse</text><text x="401" y="70">a comprobación y control</text>
<rect x="486" y="30" width="139" height="52" rx="8" fill="var(--panel)" stroke="var(--line)"/><text x="555" y="52" font-size="11" font-weight="700">d) Comunicar</text><text x="555" y="70">otras ayudas</text>
<rect x="60" y="94" width="145" height="52" rx="8" fill="var(--panel)" stroke="var(--line)"/><text x="132" y="116" font-size="11" font-weight="700">e) Estar al corriente</text><text x="132" y="134">antes de la propuesta</text>
<rect x="217" y="94" width="145" height="52" rx="8" fill="var(--panel)" stroke="var(--line)"/><text x="289" y="116" font-size="11" font-weight="700">f) y g) Contabilidad</text><text x="289" y="134">y conservación</text>
<rect x="374" y="94" width="145" height="52" rx="8" fill="var(--panel)" stroke="var(--line)"/><text x="446" y="116" font-size="11" font-weight="700">h) Difusión</text><text x="446" y="134">del carácter público</text>
<rect x="531" y="94" width="94" height="52" rx="8" fill="var(--exc-bg)" stroke="var(--exc)"/><text x="578" y="116" font-size="11" font-weight="700" fill="var(--exc)">i) Reintegro</text><text x="578" y="134">art. 37</text>
</g>
</svg>`},
{n:15,t:"Obligaciones de las entidades colaboradoras",ubic:"Título Preliminar (Disposiciones generales) ▸ Capítulo II (Disposiciones comunes a las subvenciones públicas)",idea:"La colaboradora entrega, comprueba, justifica y se somete al control.",literal:`<p>1. Son obligaciones de la entidad colaboradora:</p><p>a) Entregar a los beneficiarios los fondos recibidos de acuerdo con los criterios establecidos en las bases reguladoras de la subvención y en el convenio suscrito con la entidad concedente.</p><p>b) Comprobar, en su caso, el cumplimiento y efectividad de las condiciones o requisitos determinantes para su otorgamiento, así como la realización de la actividad y el cumplimiento de la finalidad que determinen la concesión o disfrute de la subvención.</p><p>c) Justificar la entrega de los fondos percibidos ante el órgano concedente de la subvención y, en su caso, entregar la justificación presentada por los beneficiarios.</p><p>d) Someterse a las actuaciones de comprobación que respecto de la gestión de dichos fondos pueda efectuar el órgano concedente, así como cualesquiera otras de comprobación y control financiero que puedan realizar los órganos de control competentes, tanto nacionales como comunitarios, aportando cuanta información le sea requerida en el ejercicio de las actuaciones anteriores.</p><p>2. Cuando la Administración General del Estado, sus organismos públicos o las comunidades autónomas actúen como entidades colaboradoras, las actuaciones de comprobación y control a que se hace referencia en el párrafo d) del apartado anterior se llevarán a cabo por los correspondientes órganos dependientes de las mismas, sin perjuicio de las competencias de los órganos de control comunitarios y de las del Tribunal de Cuentas.</p>`,dis:`<ol>
<li><b>a)</b> <b>Entregar</b> a los beneficiarios los fondos recibidos conforme a las bases y al convenio.</li>
<li><b>b)</b> <b>Comprobar</b>, en su caso, el cumplimiento y efectividad de las condiciones o requisitos, la realización de la actividad y el cumplimiento de la finalidad.</li>
<li><b>c)</b> <b>Justificar</b> la entrega de los fondos ante el órgano concedente y, en su caso, entregar la justificación presentada por los beneficiarios.</li>
<li><b>d)</b> <b>Someterse</b> a las actuaciones de comprobación del órgano concedente y a las de control financiero, nacionales o comunitarias.</li>
</ol>
<p><b>15.2:</b> cuando actúen como colaboradoras la AGE, sus organismos o las comunidades autónomas, las actuaciones de comprobación y control de la letra d) las llevan a cabo <b>sus propios órganos</b>, sin perjuicio de las competencias del órgano concedente.</p>`,llano:`<p>La colaboradora tiene cuatro deberes que reflejan los del beneficiario pero desde el otro lado: repartir bien, comprobar que quien recibe cumple, rendir cuentas de lo repartido y dejarse controlar.</p>`,porque:`<p>La colaboradora maneja dinero que no es suyo y que no va a gastar ella: por eso sus obligaciones son de <b>intermediación y verificación</b>, no de ejecución. Comprobar es la más delicada: se convierte en un primer filtro de control que después revisará el órgano concedente.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> quien reparte el dinero de una colecta y luego enseña a todos en qué se ha ido.</li>
<li><b>Real:</b> un ayuntamiento actúa como colaborador de una línea provincial de ayudas: entrega los fondos a las familias beneficiarias, comprueba los requisitos y remite a la Diputación la justificación.</li>
</ul>`,noej:`<ul>
<li><b>No le corresponde</b> a la colaboradora conceder la subvención ni resolver el procedimiento.</li>
<li><b>No sustituye</b> su comprobación al control del órgano concedente (art. 32.2).</li>
</ul>`,conex:`<ul>
<li><b>Art. 12 LGS:</b> concepto y sujetos que pueden serlo.</li>
<li><b>Art. 16 LGS:</b> convenio de colaboración, donde se detallan estas obligaciones.</li>
<li><b>Art. 32.2 LGS:</b> comprobaciones que realiza en nombre del órgano concedente.</li>
</ul>`,trampas:`<ul>
<li>Son <b>cuatro</b> obligaciones, no nueve como las del beneficiario.</li>
<li>La comprobación de la letra b) se hace <b>en nombre y por cuenta</b> del órgano concedente.</li>
</ul>`,ancla:`<p><b>"Entrega, comprueba, justifica y se deja controlar."</b></p>`,vis:`<svg viewBox="0 0 640 125" role="img" aria-label="Obligaciones de la entidad colaboradora">
<g font-size="10" text-anchor="middle" fill="currentColor">
<rect x="15" y="35" width="145" height="52" rx="8" fill="var(--acc-soft)" stroke="var(--acc)"/><text x="87" y="57" font-size="11" font-weight="700" fill="var(--acc)">a) Entregar</text><text x="87" y="75">los fondos</text>
<rect x="172" y="35" width="145" height="52" rx="8" fill="var(--ej-bg)" stroke="var(--ej)"/><text x="244" y="57" font-size="11" font-weight="700" fill="var(--ej)">b) Comprobar</text><text x="244" y="75">requisitos y actividad</text>
<rect x="329" y="35" width="145" height="52" rx="8" fill="var(--warn-bg)" stroke="var(--warn)"/><text x="401" y="57" font-size="11" font-weight="700" fill="var(--warn)">c) Justificar</text><text x="401" y="75">la entrega de fondos</text>
<rect x="486" y="35" width="139" height="52" rx="8" fill="var(--panel)" stroke="var(--line)"/><text x="555" y="57" font-size="11" font-weight="700">d) Someterse</text><text x="555" y="75">al control</text>
</g>
<text x="320" y="112" text-anchor="middle" font-size="10" fill="var(--ink2)">Siempre en nombre y por cuenta del órgano concedente</text>
</svg>`},
{n:16,t:"Convenios y contratos con Entidades Colaboradoras",ubic:"Título Preliminar (Disposiciones generales) ▸ Capítulo II (Disposiciones comunes a las subvenciones públicas)",idea:"Convenio obligatorio con la colaboradora: máximo cuatro años y contenido tasado.",literal:`<p>1. Se formalizará un convenio de colaboración entre el órgano administrativo concedente y la entidad colaboradora en el que se regularán las condiciones y obligaciones asumidas por ésta.</p><p>2. El convenio de colaboración no podrá tener un plazo de vigencia superior a cuatro años, si bien podrá preverse en el mismo su modificación y su prórroga por mutuo acuerdo de las partes antes de la finalización de aquél, sin que la duración total de las prórrogas pueda ser superior a la vigencia del período inicial y sin que en conjunto la duración total del convenio de colaboración pueda exceder de seis años.</p><p>No obstante, cuando la subvención tenga por objeto la subsidiación de préstamos, la vigencia del convenio podrá prolongarse hasta la total cancelación de los préstamos.</p><p>3. El convenio de colaboración deberá contener, como mínimo, los siguientes extremos:</p><p>a) Definición del objeto de la colaboración y de la entidad colaboradora.</p><p>b) Identificación de la normativa reguladora especial de las subvenciones que van a ser gestionadas por la entidad colaboradora.</p><p>c) Plazo de duración del convenio de colaboración.</p><p>d) Medidas de garantía que sea preciso constituir a favor del órgano administrativo concedente, medios de constitución y procedimiento de cancelación.</p><p>e) Requisitos que debe cumplir y hacer cumplir la entidad colaboradora en las diferentes fases del procedimiento de gestión de las subvenciones.</p><p>f) En caso de colaboración en la distribución de los fondos públicos, determinación del período de entrega de los fondos a la entidad colaboradora y de las condiciones de depósito de los fondos recibidos hasta su entrega posterior a los beneficiarios.</p><p>g) En caso de colaboración en la distribución de los fondos públicos, condiciones de entrega a los beneficiarios de las subvenciones concedidas por el órgano administrativo concedente.</p><p>h) Forma de justificación por parte de los beneficiarios del cumplimiento de las condiciones para el otorgamiento de las subvenciones y requisitos para la verificación de la misma.</p><p>i) Plazo y forma de la presentación de la justificación de las subvenciones aportada por los beneficiarios y, en caso de colaboración en la distribución de los fondos públicos, de acreditación por parte de la entidad colaboradora de la entrega de los fondos a los beneficiarios.</p><p>j) Determinación de los libros y registros contables específicos que debe llevar la entidad colaboradora para facilitar la adecuada justificación de la subvención y la comprobación del cumplimiento de las condiciones establecidas.</p><p>k) Obligación de reintegro de los fondos en el supuesto de incumplimiento de los requisitos y obligaciones establecidas para la concesión de la subvención y, en todo caso, en los supuestos regulados en el artículo 37 de esta ley.</p><p>l) Obligación de la entidad colaboradora de someterse a las actuaciones de comprobación y control previstas en el párrafo d) del apartado 1 del artículo 15 de esta ley.</p><p>m) Compensación económica que en su caso se fije a favor de la entidad colaboradora.</p><p>4. Cuando las comunidades autónomas o las corporaciones locales actúen como entidades colaboradoras, la Administración General del Estado o los organismos públicos vinculados o dependientes de la misma suscribirán con aquéllas los correspondientes convenios en los que se determinen los requisitos para la distribución y entrega de los fondos, los criterios de justificación y de rendición de cuentas.</p><p>De igual forma, y en los mismos términos, se procederá cuando la Administración General del Estado o los organismos públicos vinculados o dependientes de la misma actúen como entidades colaboradoras respecto de las subvenciones concedidas por las comunidades autónomas o las corporaciones locales.</p><p>5. En el supuesto de que las entidades colaboradoras sean personas sujetas a derecho privado se seleccionarán previamente mediante un procedimiento sometido a los principios de publicidad, concurrencia, igualdad y no discriminación y la colaboración se formalizará mediante convenio.</p><p>6. Cuando en virtud del objeto de la colaboración sea de aplicación plena la Ley 30/2007, de 30 de octubre, de Contratos del Sector Público la selección de las entidades colaboradoras se realizará conforme a los preceptos establecidos en dicha Ley. En este supuesto, el contrato, que incluirá necesariamente el contenido mínimo previsto en el apartado 3 ó 4 de este artículo así como el que resulte preceptivo de acuerdo con la normativa reguladora de los contratos públicos, deberá hacer mención expresa al sometimiento del contratista al resto de las obligaciones impuestas a las entidades colaboradoras por esta Ley.</p><p>Téngase en cuenta que se declara inconstitucional la disposición final 11 de la Ley 2/2008,</p><p>de 23 de diciembre. Ref. BOE-A-2008-20744. que da redacción al título y a los apartados 5 y 6</p><p>de este artículo, con los efectos establecidos en el fundamento jurídico 3.j), por Sentencia del</p><p>TC 206/2013, de 5 de diciembre. Ref. BOE-A-2014-223.</p>`,dis:`<ul>
<li><b>16.1 — instrumento:</b> se formaliza un <b>convenio de colaboración</b> entre el órgano concedente y la entidad colaboradora.</li>
<li><b>16.2 — duración:</b> no puede tener un plazo de vigencia superior a <b>cuatro años</b>; cabe <b>modificación y prórroga</b> por mutuo acuerdo antes de su finalización, sin que la duración total de las prórrogas pueda superar la vigencia del periodo inicial.</li>
<li><b>16.3 — contenido mínimo:</b> definición del objeto · identificación de las partes · plazo de duración · medidas de garantía · requisitos de la entidad · <b>plazo y forma de justificación</b> · disponibilidad de los fondos y régimen de su entrega · condiciones de reintegro y su obligación · sometimiento a comprobación y control (letras l y k).</li>
<li><b>16.5 — selección de colaboradoras privadas:</b> se seleccionan previamente mediante <b>procedimiento sometido a publicidad, concurrencia, igualdad y no discriminación</b>, y la colaboración se formaliza en convenio.</li>
<li><b>16.6 — si procede la legislación de contratos:</b> la selección se realiza conforme a ella; el contrato incluirá necesariamente el contenido mínimo del apartado 3.</li>
</ul>
<div class="interp"><span class="lbl">Interpretación / contexto — aportación externa</span>El texto consolidado advierte que la <b>STC 206/2013</b> declaró inconstitucional la disposición que dio redacción al título y a los apartados 5 y 6 de este artículo, y la <b>STC 33/2018</b> afectó a parte del art. 17.3.b). Además, la remisión del 16.6 a la <b>Ley 30/2007</b> debe entenderse hecha hoy a la <b>Ley 9/2017</b> (documento 7 de la biblioteca).</div>`,llano:`<p>Con la entidad colaboradora hay que firmar siempre un convenio, que no puede durar más de cuatro años y que debe decir exactamente qué hace, cómo justifica y cuándo devuelve. Si la colaboradora es privada, antes hay que seleccionarla con publicidad y concurrencia: no se elige a dedo.</p>`,porque:`<p>El convenio cumple aquí una función de <b>garantía</b>: como la colaboradora maneja fondos ajenos, todo lo que se le exige debe estar escrito antes. El límite de cuatro años evita relaciones perpetuas sin competencia, y la selección con publicidad impide que la figura se use para adjudicar a un tercero sin concurrencia lo que en el fondo es una gestión remunerada.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> el contrato con quien administra tu comunidad: por escrito, con plazo y con obligación de rendir cuentas.</li>
<li><b>Real:</b> una diputación firma un convenio de cuatro años con una entidad bancaria para el pago de ayudas de emergencia, previa selección con publicidad y concurrencia.</li>
<li><b>Caso límite:</b> si el objeto de la colaboración exige aplicar plenamente la legislación de contratos, la selección se hace por esa vía, pero el contrato debe incluir el contenido mínimo del art. 16.3.</li>
</ul>`,noej:`<ul>
<li><b>No cabe</b> designar directamente a una entidad privada como colaboradora sin procedimiento previo con publicidad y concurrencia.</li>
<li><b>No puede</b> el convenio superar los cuatro años, ni las prórrogas exceder de la vigencia inicial.</li>
</ul>`,conex:`<ul>
<li><b>Arts. 12 y 15 LGS:</b> concepto y obligaciones de la colaboradora.</li>
<li><b>Arts. 47 a 53 LRJSP</b> (documento 2): régimen general de los convenios y su duración máxima.</li>
<li><b>Ley 9/2017</b> (documento 7): régimen aplicable cuando la colaboración deba articularse como contrato.</li>
</ul>`,trampas:`<ul>
<li>La duración máxima es de <b>cuatro años</b>, prorrogables sin superar la vigencia inicial.</li>
<li>El convenio es <b>obligatorio</b>: no es una opción.</li>
<li>Las colaboradoras privadas se seleccionan con <b>publicidad, concurrencia, igualdad y no discriminación</b>.</li>
</ul>`,ancla:`<p><b>"Colaboradora, convenio; convenio, cuatro años."</b> Y si es privada, <b>primero concurso, después convenio</b>.</p>`,vis:`<svg viewBox="0 0 640 145" role="img" aria-label="Convenio con la entidad colaboradora">
<rect x="140" y="15" width="360" height="36" rx="8" fill="var(--acc-soft)" stroke="var(--acc)"/>
<text x="320" y="38" text-anchor="middle" font-size="12" font-weight="700" fill="var(--acc)">CONVENIO DE COLABORACIÓN obligatorio</text>
<g font-size="10" text-anchor="middle" fill="currentColor">
<rect x="30" y="66" width="170" height="58" rx="8" fill="var(--ej-bg)" stroke="var(--ej)"/><text x="115" y="88" font-size="11" font-weight="700" fill="var(--ej)">Máximo 4 años</text><text x="115" y="107">prórrogas ≤ vigencia inicial</text>
<rect x="235" y="66" width="170" height="58" rx="8" fill="var(--panel)" stroke="var(--line)"/><text x="320" y="88" font-size="11" font-weight="700">Contenido mínimo</text><text x="320" y="107">objeto, plazos, justificación, reintegro</text>
<rect x="440" y="66" width="170" height="58" rx="8" fill="var(--warn-bg)" stroke="var(--warn)"/><text x="525" y="88" font-size="11" font-weight="700" fill="var(--warn)">Si es privada</text><text x="525" y="107">selección con publicidad y concurrencia</text>
</g>
</svg>`},
{n:17,t:"Bases reguladoras de la concesión de las subvenciones",ubic:"Título Preliminar (Disposiciones generales) ▸ Capítulo II (Disposiciones comunes a las subvenciones públicas)",idea:"Las bases fijan las reglas del juego; en lo local van en las bases de ejecución u ordenanza.",literal:`<p>1. En el ámbito de la Administración General del Estado, así como de los organismos públicos y restantes entidades de derecho público con personalidad jurídica propia vinculadas o dependientes de aquélla, los ministros correspondientes establecerán las oportunas bases reguladoras de la concesión.</p><p>Las citadas bases se aprobarán por orden ministerial, de acuerdo con el procedimiento previsto en el artículo 24 de la Ley 50/1997, de 27 de noviembre, del Gobierno, y previo informe de los servicios jurídicos y de la Intervención Delegada correspondiente, y serán objeto de publicación en el "Boletín Oficial del Estado".</p><p>No será necesaria la promulgación de orden ministerial cuando las normas sectoriales específicas de cada subvención incluyan las citadas bases reguladoras con el alcance previsto en el apartado 3 de este artículo.</p><p>2. Las bases reguladoras de las subvenciones de las corporaciones locales se deberán aprobar en el marco de las bases de ejecución del presupuesto, a través de una ordenanza</p><p>general de subvenciones o mediante una ordenanza específica para las distintas modalidades de subvenciones.</p><p>3. La norma reguladora de las bases de concesión de las subvenciones concretará, como mínimo, los siguientes extremos:</p><p>a) Definición del objeto de la subvención.</p><p>b) Requisitos que deberán reunir los beneficiarios para la obtención de la subvención y, en su caso, los miembros de las entidades contempladas en el apartado 2 y segundo párrafo del apartado 3 del artículo 11 de esta Ley; diario oficial en el que se publicará el extracto de la convocatoria, por conducto de la BDNS, una vez que se haya presentado ante ésta el texto de la convocatoria y la información requerida para su publicación; y forma y plazo en que deben presentarse las solicitudes.</p><p>Téngase en cuenta que se declara la inconstitucionalidad del inciso destacado en negrita</p><p>del apartado 3.b) por Sentencia del TC 33/2018, de 12 de abril, que no será de aplicación a las</p><p>Comunidades Autónomas, sin perjuicio de su aplicación a las demás Administraciones sujetas a</p><p>la Ley General de Subvenciones, según establece su fundamento jurídico 11. Ref. BOE-</p><p>A-2018-6825</p><p>c) Condiciones de solvencia y eficacia que hayan de reunir las personas jurídicas a las que se refiere el apartado 2 del artículo 12 de esta ley.</p><p>d) Procedimiento de concesión de la subvención.</p><p>e) Criterios objetivos de otorgamiento de la subvención y, en su caso, ponderación de los mismos.</p><p>f) Cuantía individualizada de la subvención o criterios para su determinación.</p><p>g) Órganos competentes para la ordenación, instrucción y resolución del procedimiento de concesión de la subvención y el plazo en que será notificada la resolución.</p><p>h) Determinación, en su caso, de los libros y registros contables específicos para garantizar la adecuada justificación de la subvención.</p><p>i) Plazo y forma de justificación por parte del beneficiario o de la entidad colaboradora, en su caso, del cumplimiento de la finalidad para la que se concedió la subvención y de la aplicación de los fondos percibidos.</p><p>j) Medidas de garantía que, en su caso, se considere preciso constituir a favor del órgano concedente, medios de constitución y procedimiento de cancelación.</p><p>k) Posibilidad de efectuar pagos anticipados y abonos a cuenta, así como el régimen de garantías que, en su caso, deberán aportar los beneficiarios.</p><p>l) Circunstancias que, como consecuencia de la alteración de las condiciones tenidas en cuenta para la concesión de la subvención, podrán dar lugar a la modificación de la resolución.</p><p>m) Compatibilidad o incompatibilidad con otras subvenciones, ayudas, ingresos o recursos para la misma finalidad, procedentes de cualesquiera Administraciones o entes públicos o privados, nacionales, de la Unión Europea o de organismos internacionales.</p><p>n) Criterios de graduación de los posibles incumplimientos de condiciones impuestas con motivo de la concesión de las subvenciones. Estos criterios resultarán de aplicación para determinar la cantidad que finalmente haya de percibir el beneficiario o, en su caso, el importe a reintegrar, y deberán responder al principio de proporcionalidad.</p>`,dis:`<ul>
<li><b>17.1 — AGE:</b> las establecen los <b>ministros</b> mediante <b>orden ministerial</b>, previo informe de los <b>servicios jurídicos</b> y de la <b>Intervención Delegada</b>, y se publican en el BOE. No hace falta orden cuando las normas sectoriales ya incluyan las bases con el alcance del apartado 3.</li>
<li><b>17.2 — corporaciones locales:</b> las bases se aprueban <b>en el marco de las bases de ejecución del presupuesto</b>, <b>a través de una ordenanza general de subvenciones</b> o <b>mediante una ordenanza específica</b>.</li>
<li><b>17.3 — contenido mínimo:</b> definición del objeto · requisitos de los beneficiarios y forma de acreditarlos · condiciones de solvencia y eficacia de las personas jurídicas del art. 12.2 · procedimiento de concesión · criterios de valoración · <b>órganos competentes</b> para ordenación, instrucción y resolución y <b>plazo de notificación</b> · determinación de la cuantía · <b>pagos anticipados y abonos a cuenta</b> y régimen de garantías · plazo y forma de justificación · circunstancias de modificación de la resolución · compatibilidad con otras ayudas · <b>criterios de graduación de los incumplimientos</b>.</li>
</ul>`,llano:`<p>Las bases reguladoras son el reglamento de cada línea de ayudas: quién puede pedirla, con qué criterios se reparte, cuánto se da, cómo se justifica y qué pasa si se incumple a medias. En los ayuntamientos no se aprueban por orden: van en las bases de ejecución del presupuesto o en una ordenanza.</p>`,porque:`<p>Publicar las bases <b>antes</b> de convocar es lo que hace real la concurrencia: todos compiten con las mismas reglas conocidas. Y los <b>criterios de graduación</b> de la letra n) resuelven un problema práctico enorme: sin ellos, cualquier incumplimiento parcial obligaría a reintegrar el 100 %, lo que sería desproporcionado.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> las bases de un concurso publicadas con antelación: quién puede participar, cómo se puntúa y qué premio hay.</li>
<li><b>Real:</b> un ayuntamiento aprueba su <b>ordenanza general de subvenciones</b> y, en las bases de ejecución de cada presupuesto, concreta las líneas y sus criterios.</li>
<li><b>Caso límite:</b> una asociación justifica el 80 % de la actividad. Si las bases contienen criterios de graduación, se minora proporcionalmente; si no los contienen, la consecuencia natural es el reintegro total, lo que muestra por qué la letra n) es tan importante.</li>
</ul>`,noej:`<ul>
<li><b>No es lo mismo</b> bases reguladoras que convocatoria: las bases fijan el régimen; la convocatoria abre el plazo y compromete el crédito.</li>
<li><b>No se aprueban</b> las bases locales por orden ministerial ni por decreto de alcaldía: van por ordenanza o bases de ejecución.</li>
</ul>`,conex:`<ul>
<li><b>Art. 9.2 y 9.3 LGS:</b> aprobación y publicación previas de las bases.</li>
<li><b>Art. 23.2 LGS:</b> contenido de la convocatoria, que desarrolla las bases.</li>
<li><b>Art. 165.1 TRLHL</b> (documento 5): las bases de ejecución del presupuesto, cauce local de aprobación.</li>
<li><b>Art. 8.1 LGS:</b> las bases deben referirse al plan estratégico.</li>
</ul>`,trampas:`<ul>
<li>En las corporaciones locales: <b>bases de ejecución del presupuesto, ordenanza general u ordenanza específica</b>.</li>
<li>En la AGE, informe previo de <b>servicios jurídicos</b> y de la <b>Intervención Delegada</b>.</li>
<li>La letra <b>n)</b> —criterios de graduación de incumplimientos— es contenido <b>mínimo obligatorio</b>.</li>
</ul>`,ancla:`<p><b>"Bases antes, convocatoria después."</b> Y en lo local, las bases viven en el <b>presupuesto o en la ordenanza</b>.</p>`,vis:`<svg viewBox="0 0 640 150" role="img" aria-label="Aprobación de las bases reguladoras">
<rect x="30" y="25" width="260" height="66" rx="8" fill="var(--acc-soft)" stroke="var(--acc)"/>
<text x="160" y="47" text-anchor="middle" font-size="11" font-weight="700" fill="var(--acc)">Administración del Estado</text>
<text x="160" y="66" text-anchor="middle" font-size="10" fill="currentColor">orden ministerial, previo informe de</text>
<text x="160" y="81" text-anchor="middle" font-size="10" fill="currentColor">servicios jurídicos e Intervención Delegada</text>
<rect x="350" y="25" width="260" height="66" rx="8" fill="var(--ej-bg)" stroke="var(--ej)"/>
<text x="480" y="47" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ej)">Corporaciones locales</text>
<text x="480" y="66" text-anchor="middle" font-size="10" fill="currentColor">bases de ejecución del presupuesto,</text>
<text x="480" y="81" text-anchor="middle" font-size="10" fill="currentColor">ordenanza general u ordenanza específica</text>
<rect x="120" y="104" width="400" height="36" rx="8" fill="var(--warn-bg)" stroke="var(--warn)"/>
<text x="320" y="126" text-anchor="middle" font-size="10" fill="var(--warn)">Contenido mínimo tasado, incluidos los criterios de graduación de los incumplimientos</text>
</svg>`},
{n:18,t:"Publicidad de las subvenciones",ubic:"Título Preliminar (Disposiciones generales) ▸ Capítulo II (Disposiciones comunes a las subvenciones públicas)",idea:"La publicidad se hace por la BDNS, y el beneficiario debe difundir el origen público.",literal:`<p>1. La Base de Datos Nacional de Subvenciones operará como sistema nacional de publicidad de subvenciones.</p><p>2. A tales efectos, las administraciones concedentes deberán remitir a la Base de Datos Nacional de Subvenciones información sobre las convocatorias y las resoluciones de concesión recaídas en los términos establecidos en el artículo 20.</p><p>3. Los beneficiarios deberán dar publicidad de las subvenciones y ayudas percibidas en los términos y condiciones establecidos en la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno. En el caso de que se haga</p><p>uso de la previsión contenida en el artículo 5.4 de la citada Ley, la Base de Datos Nacional de Subvenciones servirá de medio electrónico para el cumplimiento de las obligaciones de publicidad.</p><p>4. Los beneficiarios deberán dar la adecuada publicidad del carácter público de la financiación de programas, actividades, inversiones o actuaciones de cualquier tipo que sean objeto de subvención, en los términos reglamentariamente establecidos.</p>`,dis:`<ul>
<li><b>18.1:</b> la <span class="t" data-k="bdns">BDNS</span> opera como <b>sistema nacional de publicidad de subvenciones</b>.</li>
<li><b>18.2:</b> las administraciones concedentes deben remitir a la BDNS información sobre las <b>convocatorias</b> y las <b>resoluciones de concesión</b>, en los términos del art. 20.</li>
<li><b>18.3:</b> los beneficiarios deben dar publicidad de las subvenciones percibidas en los términos de la <b>Ley 19/2013</b> de transparencia; si se usa la previsión del art. 5.4 de esa ley, la BDNS sirve de medio electrónico.</li>
<li><b>18.4:</b> los beneficiarios deben dar la <b>adecuada publicidad del carácter público de la financiación</b> de lo subvencionado, en los términos reglamentarios.</li>
</ul>`,llano:`<p>La publicidad va por dos vías. La Administración publica lo que convoca y lo que concede en una base de datos nacional. Y el beneficiario, por su parte, tiene que decir en carteles, folletos o web que aquello está pagado con dinero público.</p>`,porque:`<p>Centralizar la publicidad en la BDNS resolvió un problema real: antes cada Administración publicaba donde quería y era imposible saber cuánto había recibido un mismo beneficiario de distintas fuentes. La obligación de difusión del apartado 4 tiene otra lógica: hacer <b>visible</b> el destino del dinero público ante los ciudadanos que lo financian.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> el cartel de una obra que indica quién la financia.</li>
<li><b>Real:</b> un ayuntamiento comunica a la BDNS el texto de la convocatoria y, tras resolver, la relación de beneficiarios e importes; la asociación beneficiaria incorpora el logotipo municipal en el programa de sus actividades.</li>
<li><b>Caso límite:</b> el incumplimiento de las medidas de difusión del art. 18.4 es causa de reintegro por la vía del art. 37.1.d), en relación con el art. 14.1.h).</li>
</ul>`,noej:`<ul>
<li><b>No sustituye</b> la publicación en la web municipal a la remisión a la BDNS.</li>
<li><b>No corresponde</b> al beneficiario publicar en la BDNS: su deber es la difusión del carácter público y, en su caso, la publicidad de la Ley 19/2013.</li>
</ul>`,conex:`<ul>
<li><b>Art. 20 LGS:</b> régimen completo de la BDNS.</li>
<li><b>Art. 14.1.h) LGS:</b> obligación del beneficiario de adoptar las medidas de difusión.</li>
<li><b>Art. 15 y 16 de la Ley 1/2014 de Andalucía</b> (documento 9): publicidad activa de subvenciones y de información económica.</li>
<li><b>Ley 19/2013</b> <i>(norma externa a la biblioteca)</i>: obligaciones de publicidad de los beneficiarios.</li>
</ul>`,trampas:`<ul>
<li>Dos publicidades distintas: la <b>institucional</b> (BDNS, apartados 1 y 2) y la <b>del beneficiario</b> (apartados 3 y 4).</li>
<li>Se remiten a la BDNS tanto las <b>convocatorias</b> como las <b>resoluciones de concesión</b>.</li>
</ul>`,ancla:`<p><b>"La Administración publica en la BDNS; el beneficiario lo pone en el cartel."</b></p>`,vis:`<svg viewBox="0 0 640 135" role="img" aria-label="Publicidad de las subvenciones">
<rect x="30" y="30" width="270" height="66" rx="8" fill="var(--acc-soft)" stroke="var(--acc)"/>

<text x="165" y="72" text-anchor="middle" font-size="10" fill="currentColor">remite convocatorias y concesiones</text>
<text x="165" y="87" text-anchor="middle" font-size="10" fill="var(--acc)">a la BDNS</text>
<rect x="340" y="30" width="270" height="66" rx="8" fill="var(--ej-bg)" stroke="var(--ej)"/>
<text x="475" y="52" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ej)">Beneficiario</text>
<text x="475" y="72" text-anchor="middle" font-size="10" fill="currentColor">publicidad conforme a la Ley 19/2013</text>
<text x="475" y="87" text-anchor="middle" font-size="10" fill="currentColor">y difusión del carácter público</text>
<text x="320" y="122" text-anchor="middle" font-size="10" fill="var(--ink2)">La BDNS opera como Sistema Nacional de Publicidad de Subvenciones</text>
</svg>`},
{n:19,t:"Financiación de las actividades subvencionadas",ubic:"Título Preliminar (Disposiciones generales) ▸ Capítulo II (Disposiciones comunes a las subvenciones públicas)",idea:"La subvención nunca puede superar el coste, y los rendimientos financieros la incrementan.",literal:`<p>1. La normativa reguladora de la subvención podrá exigir un importe de financiación propia para cubrir la actividad subvencionada. La aportación de fondos propios al proyecto o acción subvencionada habrá de ser acreditada en los términos previstos en el artículo 30 de esta ley.</p><p>2. La normativa reguladora de la subvención determinará el régimen de compatibilidad o incompatibilidad para la percepción de otras subvenciones, ayudas, ingresos o recursos para la misma finalidad, procedentes de cualesquiera Administraciones o entes públicos o privados, nacionales, de la Unión Europea o de organismos internacionales, sin perjuicio de lo dispuesto en el apartado siguiente.</p><p>3. El importe de las subvenciones en ningún caso podrá ser de tal cuantía que, aisladamente o en concurrencia con otras subvenciones, ayudas, ingresos o recursos, supere el coste de la actividad subvencionada.</p><p>4. Toda alteración de las condiciones tenidas en cuenta para la concesión de la subvención, y en todo caso la obtención concurrente de otras aportaciones fuera de los casos permitidos en las normas reguladoras, podrá dar lugar a la modificación de la resolución de concesión, en los términos establecidos en la normativa reguladora de la subvención.</p><p>5. Los rendimientos financieros que se generen por los fondos librados a los beneficiarios incrementarán el importe de la subvención concedida y se aplicarán igualmente a la actividad subvencionada, salvo que, por razones debidamente motivadas, se disponga lo contrario en las bases reguladoras de la subvención.</p><p>Este apartado no será de aplicación en los supuestos en que el beneficiario sea una Administración pública.</p>`,dis:`<ul>
<li><b>19.1 — financiación propia:</b> la normativa reguladora <b>podrá exigir</b> un importe de financiación propia, que se acredita conforme al art. 30.</li>
<li><b>19.2 — compatibilidad:</b> la normativa reguladora <b>determinará el régimen</b> de compatibilidad o incompatibilidad con otras subvenciones, ayudas, ingresos o recursos.</li>
<li><b>19.3 — límite absoluto:</b> el importe <b>en ningún caso</b> podrá ser de tal cuantía que, aisladamente o en concurrencia con otras ayudas, <b>supere el coste de la actividad subvencionada</b>.</li>
<li><b>19.4 — alteración de condiciones:</b> toda alteración de las condiciones tenidas en cuenta y, en todo caso, la obtención concurrente de otras aportaciones fuera de los casos permitidos, <b>podrá dar lugar a la modificación</b> de la resolución de concesión.</li>
<li><b>19.5 — rendimientos financieros:</b> los generados por los fondos librados <b>incrementan el importe</b> de la subvención y se aplican a la actividad, salvo que las bases dispongan lo contrario por razones motivadas.</li>
</ul>`,llano:`<p>Una subvención puede cubrir todo el coste, pero nunca más: si sumando otras ayudas se pasa del coste real, hay exceso y hay que devolverlo. Y si el dinero recibido genera intereses en el banco, esos intereses también son de la subvención y hay que dedicarlos a la actividad.</p>`,porque:`<p>El límite del apartado 3 es la regla antienriquecimiento: la subvención es un instrumento de fomento, no una fuente de lucro. De ahí la obligación de comunicar otras ayudas del art. 14.1.d): sin esa información, la Administración no puede comprobar si se ha superado el coste. Y los rendimientos financieros se atribuyen a la subvención porque proceden de dinero público que aún no se ha aplicado a su fin.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> si dos familiares te dan dinero para el mismo viaje y sobra, lo lógico es devolver lo que sobra.</li>
<li><b>Real:</b> actividad con coste de 20.000 €, subvención municipal de 15.000 € y ayuda provincial de 8.000 €: el total (23.000 €) supera el coste, luego hay un exceso de 3.000 € que debe minorarse o reintegrarse.</li>
<li><b>Caso límite:</b> los 120 € de intereses generados por los fondos en la cuenta de la asociación incrementan la subvención y deben aplicarse a la actividad, salvo previsión motivada en contra en las bases.</li>
</ul>`,noej:`<ul>
<li><b>No prohíbe</b> la ley que la subvención cubra el 100 % del coste: prohíbe superarlo.</li>
<li><b>No decide</b> el beneficiario sobre la compatibilidad: la fija la normativa reguladora.</li>
</ul>`,conex:`<ul>
<li><b>Art. 14.1.d) LGS:</b> obligación de comunicar otras ayudas.</li>
<li><b>Art. 34 LGS:</b> pagos y su régimen.</li>
<li><b>Art. 37.1.h) LGS:</b> exceso obtenido sobre el coste de la actividad como causa de reintegro.</li>
<li><b>Art. 30.4 LGS:</b> acreditación del importe, procedencia y aplicación de otros fondos.</li>
</ul>`,trampas:`<ul>
<li>El límite es el <b>coste de la actividad</b>, no el importe solicitado.</li>
<li>Los <b>rendimientos financieros</b> incrementan la subvención, salvo disposición motivada en contrario.</li>
<li>La alteración de condiciones <b>podrá</b> dar lugar a modificación de la resolución: no la produce automáticamente.</li>
</ul>`,ancla:`<p><b>"Hasta el coste, sí; por encima del coste, jamás."</b> Y los intereses del dinero, <b>a la actividad</b>.</p>`,vis:`<svg viewBox="0 0 640 150" role="img" aria-label="Límite del importe de la subvención">
<rect x="60" y="35" width="200" height="80" rx="8" fill="var(--ej-bg)" stroke="var(--ej)"/>
<text x="160" y="58" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ej)">Coste de la actividad</text>
<text x="160" y="80" text-anchor="middle" font-size="10" fill="currentColor">límite absoluto de todas</text>
<text x="160" y="96" text-anchor="middle" font-size="10" fill="currentColor">las ayudas sumadas</text>
<text x="320" y="80" text-anchor="middle" font-size="18" fill="var(--exc)">≥</text>
<rect x="380" y="35" width="200" height="80" rx="8" fill="var(--acc-soft)" stroke="var(--acc)"/>
<text x="480" y="58" text-anchor="middle" font-size="11" font-weight="700" fill="var(--acc)">Subvención</text>
<text x="480" y="80" text-anchor="middle" font-size="10" fill="currentColor">+ otras subvenciones, ayudas,</text>
<text x="480" y="96" text-anchor="middle" font-size="10" fill="currentColor">ingresos o recursos</text>
<text x="320" y="138" text-anchor="middle" font-size="10" fill="var(--warn)">Los rendimientos financieros de los fondos librados incrementan la subvención (19.5)</text>
</svg>`},
{n:20,t:"Base de Datos Nacional de Subvenciones (BDNS)",ubic:"Título Preliminar (Disposiciones generales) ▸ Capítulo II (Disposiciones comunes a las subvenciones públicas)",idea:"La BDNS es el registro nacional que gestiona la IGAE y publica convocatorias y concesiones.",literal:`<p>1. La Base de Datos Nacional de Subvenciones tiene por finalidades promover la transparencia, servir como instrumento para la planificación de las políticas públicas, mejorar la gestión y colaborar en la lucha contra el fraude de subvenciones y ayudas públicas.</p><p>2. La Base de Datos recogerá información de las subvenciones; reglamentariamente podrá establecerse la inclusión de otras ayudas cuando su registro contribuya a los fines de la Base de Datos, al cumplimiento de las exigencias de la Unión Europea o a la coordinación de las políticas de cooperación internacional y demás políticas públicas de fomento.</p><p>El contenido de la Base de Datos incluirá, al menos, referencia a las bases reguladoras de la subvención, convocatoria, programa y crédito presupuestario al que se imputan, objeto o finalidad de la subvención, identificación de los beneficiarios, importe de las subvenciones otorgadas y efectivamente percibidas, resoluciones de reintegros y sanciones impuestas.</p><p>Igualmente contendrá la identificación de las personas o entidades incursas en las prohibiciones contempladas en las letras a) y h) del apartado 2 del artículo 13. La inscripción permanecerá registrada en la BDNS hasta que transcurran 10 años desde la fecha de finalización del plazo de prohibición.</p><p>3. La Intervención General de la Administración del Estado es el órgano responsable de la administración y custodia de la BDNS y adoptará las medidas necesarias para garantizar la confidencialidad y seguridad de la información.</p><p>4. Estarán obligados a suministrar información las administraciones, organismos y entidades contemplados en el artículo 3; los consorcios, mancomunidades u otras personificaciones públicas creadas por varias Administraciones Públicas regulados en el artículo 5; las entidades que según ésta u otras leyes deban suministrar información a la base de datos y los organismos que reglamentariamente se determinen en relación a la gestión de fondos de la Unión Europea y otras ayudas públicas.</p><p>Serán responsables de suministrar la información de forma exacta, completa, en plazo y respetando el modo de envío establecido:</p><p>a) En el sector público estatal, los titulares de los órganos, organismos y demás entidades que concedan las subvenciones y ayudas contempladas en la Base de Datos.</p><p>b) En las Comunidades Autónomas, la Intervención General de la Comunidad Autónoma u órgano que designe la propia Comunidad Autónoma.</p><p>c) En las Entidades Locales, la Intervención u órgano que designe la propia Entidad Local.</p><p>La prohibición de obtener subvenciones prevista en las letras a) y h) del apartado 2 del artículo 13, será comunicada a la BDNS por el Tribunal que haya dictado la sentencia o por la autoridad que haya impuesto la sanción administrativa; la comunicación deberá concretar las fechas de inicio y finalización de la prohibición recaída; para los casos en que no sea así, se instrumentará reglamentariamente el sistema para su determinación y registro en la Base de Datos.</p><p>La cesión de datos de carácter personal que, en virtud de los párrafos precedentes, debe efectuarse a la Intervención General de la Administración del Estado no requerirá el consentimiento del afectado. En este ámbito no será de aplicación lo dispuesto en el apartado 1 del artículo 21 de la Ley Orgánica 15/1999, de 13 de diciembre, de Protección de Datos de Carácter Personal.</p><p>5. La información incluida en la Base de Datos Nacional de Subvenciones tendrá carácter reservado, sin que pueda ser cedida o comunicada a terceros, salvo que la cesión tenga por objeto:</p><p>a) La colaboración con las Administraciones Públicas y los órganos de la Unión Europea para la planificación de las políticas públicas, la mejora de la gestión, la protección de los intereses financieros de la Unión Europea y de la Hacienda Pública y, en particular, la lucha contra el fraude de subvenciones y ayudas públicas.</p><p>b) La investigación o persecución de delitos públicos por los órganos jurisdiccionales o el Ministerio Público.</p><p>c) La colaboración con las Administraciones tributaria y de la Seguridad Social en el ámbito de sus competencias.</p><p>d) La colaboración con las comisiones parlamentarias de investigación en el marco legalmente establecido.</p><p>e) La colaboración con el Tribunal de Cuentas u órganos de fiscalización externa de las Comunidades Autónomas en el ejercicio de sus funciones.</p><p>f) La colaboración con la Comisión de Vigilancia de Actividades de Financiación del Terrorismo en el ejercicio de sus funciones de acuerdo con lo previsto en el artículo 8 de la Ley 12/2003, de 21 de mayo, de Bloqueo de la Financiación del Terrorismo.</p><p>g) La colaboración con el Servicio Ejecutivo de la Comisión de Prevención del Blanqueo de Capitales e Infracciones Monetarias en el cumplimiento de las funciones que le atribuye el artículo 45.4 de la Ley 10/2010, de 28 de abril, de prevención del blanqueo de capitales y la financiación del terrorismo.</p><p>h) La colaboración con el Defensor del Pueblo e instituciones análogas de las Comunidades Autónomas en el ejercicio de sus funciones.</p><p>i) La colaboración con la Comisión Nacional de Defensa de los Mercados y la Competencia para el análisis de las ayudas públicas desde la perspectiva de la competencia.</p><p>En estos casos, la cesión de datos será realizada preferentemente mediante la utilización de medios electrónicos, debiendo garantizar la identificación de los destinatarios y la adecuada motivación de su acceso.</p><p>Se podrá denegar al interesado el derecho de acceso, rectificación y cancelación cuando el mismo obstaculice las actuaciones administrativas tendentes a asegurar el cumplimiento de las obligaciones en materia de subvenciones y, en todo caso, cuando el afectado esté siendo objeto de actuaciones de comprobación o control.</p><p>6. Dentro de las posibilidades de cesión previstas en cada caso, se instrumentará la interrelación de la Base de Datos Nacional de Subvenciones con otras bases de datos, para la mejora en la lucha contra el fraude fiscal, de Seguridad Social o de subvenciones y Ayudas de Estado u otras ayudas. En cualquier caso, deberá asegurarse el acceso,</p><p>integridad, disponibilidad, autenticidad, confidencialidad, trazabilidad y conservación de los datos cedidos.</p><p>7. Las autoridades y el personal al servicio de las Administraciones Públicas que tengan conocimiento de los datos contenidos en la base de datos estarán obligados al más estricto y completo secreto profesional respecto a los mismos. Con independencia de las responsabilidades penales o civiles que pudieren corresponder, la infracción de este particular deber de secreto se considerará siempre falta disciplinaria muy grave.</p><p>8. En aplicación de los principios recogidos en la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, la BDNS operará como Sistema Nacional de Publicidad de Subvenciones y Ayudas Públicas. A tales efectos, y para garantizar el derecho de los ciudadanos a conocer todas las subvenciones y ayudas públicas convocadas en cada momento y para contribuir a los principios de publicidad y transparencia, la Intervención General de la Administración del Estado publicará en su página web los siguientes contenidos:</p><p>a) las convocatorias de subvenciones y ayudas públicas; a tales efectos, en todas las convocatorias sujetas a esta ley, las administraciones concedentes comunicarán a la Base de Datos Nacional de Subvenciones el texto de la convocatoria y la información requerida por la Base de Datos. En el sector público estatal y local y en aquellas comunidades autónomas que no opten por prescindir de este procedimiento, la BDNS dará traslado al diario oficial correspondiente del extracto de la convocatoria, para su publicación, que tendrá carácter gratuito. La convocatoria de una subvención sin seguir el procedimiento indicado será causa de anulabilidad de la convocatoria.</p><p>Cuando una convocatoria contemple la concesión de subvenciones o ayudas públicas con diferentes regímenes jurídicos, se publicarán separadamente en el Sistema Nacional de Publicidad de Subvenciones y Ayudas Públicas tantas convocatorias como regímenes jurídicos se hayan previsto.</p><p>b) las subvenciones y demás ayudas públicas concedidas; para su publicación, las administraciones concedentes deberán remitir a la Base de Datos Nacional de Subvenciones las subvenciones y demás ayudas públicas concedidas con indicación según cada caso, de la convocatoria, el programa y crédito presupuestario al que se imputen, beneficiario, cantidad concedida y objetivo o finalidad de la subvención con expresión de los distintos programas o proyectos subvencionados, así como las devoluciones o reintegros exigidos. Igualmente deberá informarse, cuando corresponda, sobre el compromiso asumido por los miembros contemplados en el apartado 2 y en el segundo párrafo del apartado 3 del artículo 11. No serán publicadas las subvenciones concedidas cuando la publicación de los datos del beneficiario en razón del objeto de la subvención pueda ser contraria al respeto y salvaguarda del honor, a la intimidad personal o familiar de las personas físicas en virtud de lo establecido en la Ley Orgánica 1/1982, de 5 de mayo, de protección civil del derecho al honor, a la intimidad personal y familiar y a la propia imagen, y haya sido previsto en su normativa reguladora. El tratamiento de los datos de carácter personal se adecuará a lo establecido en la Ley Orgánica 3/2018, de 5 de diciembre, de Protección de Datos Personales y garantía de los derechos digitales.</p><p>c) La información que publiquen las entidades sin ánimo de lucro utilizando la BDNS como medio electrónico previsto en el segundo párrafo del artículo 5.4 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, en los términos que reglamentariamente se establezcan.</p><p>Los responsables de suministrar la información conforme al apartado 4 de este artículo deberán comunicar a la BDNS la información necesaria para dar cumplimiento a lo previsto en este apartado.</p><p>9. La Base de Datos Nacional de Subvenciones podrá suministrar información pública sobre las sanciones firmes impuestas por infracciones muy graves. En concreto, se publicará el nombre y apellidos o la denominación o razón social del sujeto infractor, la infracción cometida, la sanción que se hubiese impuesto y la subvención a la que se refiere, siempre que así se recoja expresamente en la sanción impuesta y durante el tiempo que así se establezca.</p><p>10. La Intervención General de la Administración del Estado dictará las Instrucciones oportunas para concretar los datos y documentos integrantes de la Base de Datos Nacional</p><p>de Subvenciones, los plazos y procedimientos de remisión de la información, incluidos los electrónicos, así como la información que sea objeto de publicación para conocimiento general y el plazo de su publicación, que se fijarán de modo que se promueva el ejercicio de sus derechos por parte de los interesados.</p>`,dis:`<ul>
<li><b>20.1 — finalidades:</b> promover la <b>transparencia</b>, servir a la <b>planificación</b> de políticas públicas, <b>mejorar la gestión</b> y colaborar en la <b>lucha contra el fraude</b>.</li>
<li><b>20.2 — contenido:</b> información de las subvenciones y la <b>identificación de las personas incursas en las prohibiciones</b> de las letras a) y h) del art. 13.2, que permanece registrada <b>hasta que transcurran 10 años</b> desde la finalización del plazo de prohibición.</li>
<li><b>20.3 — órgano responsable:</b> la <span class="t" data-k="igae">Intervención General de la Administración del Estado</span>, que garantiza confidencialidad y seguridad.</li>
<li><b>20.4 — obligados a suministrar información:</b> las administraciones y entidades del art. 3, los consorcios y mancomunidades del art. 5 y demás entidades. En las <b>entidades locales</b>, el responsable es <b>la Intervención u órgano que designe la propia entidad local</b>.</li>
<li><b>20.5 a 20.7 — carácter reservado</b> de la información, cesiones tasadas y deber de secreto profesional.</li>
<li><b>20.8 — publicidad:</b> la BDNS opera como <b>Sistema Nacional de Publicidad de Subvenciones</b> y publica las <b>convocatorias</b> y las <b>subvenciones y ayudas concedidas</b>.</li>
<li><b>20.9 — sanciones:</b> puede suministrar información pública sobre las sanciones firmes por <b>infracciones muy graves</b>.</li>
</ul>`,llano:`<p>La BDNS es el gran registro nacional de subvenciones. La lleva la Intervención General del Estado y en cada ayuntamiento el responsable de enviar la información es el interventor o quien designe la entidad. Ahí se publican las convocatorias y quién ha recibido qué, y ahí figuran también los que tienen prohibido recibir subvenciones.</p>`,porque:`<p>Antes de la BDNS no existía forma de saber si un mismo beneficiario acumulaba ayudas de varias Administraciones, lo que hacía casi imposible aplicar el límite del art. 19.3 y detectar el fraude. Concentrar la información en la IGAE resuelve el problema y convierte la publicidad en un instrumento de <b>control</b>, no solo de transparencia.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> un registro central donde se anotan todas las ayudas que recibe una misma persona, para que no cobre dos veces por lo mismo.</li>
<li><b>Real:</b> la interventora de un ayuntamiento remite a la BDNS el texto de cada convocatoria y, tras resolver, los datos de los beneficiarios y los importes concedidos.</li>
<li><b>Caso límite:</b> una persona sancionada con la pérdida de la posibilidad de obtener subvenciones figura en la BDNS y su inscripción permanece <b>10 años</b> desde que termina el plazo de la prohibición.</li>
</ul>`,noej:`<ul>
<li><b>No es</b> la BDNS un boletín oficial: es una base de datos que además opera como sistema de publicidad.</li>
<li><b>No depende</b> de cada Administración su gestión: el órgano responsable es la <b>IGAE</b>.</li>
</ul>`,conex:`<ul>
<li><b>Art. 18 LGS:</b> la BDNS como sistema nacional de publicidad.</li>
<li><b>Art. 13.2.a) y h) LGS:</b> prohibiciones que se inscriben.</li>
<li><b>Art. 3.2 LGS:</b> los entes en régimen privado también quedan sujetos a la información del art. 20.</li>
<li><b>Art. 16 de la Ley 1/2014 de Andalucía</b> (documento 9): publicidad activa de la información económica.</li>
</ul>`,trampas:`<ul>
<li>El órgano responsable es la <b>IGAE</b>; en las entidades locales, el responsable de suministrar es la <b>Intervención u órgano designado</b>.</li>
<li>La inscripción de las prohibiciones permanece <b>10 años</b> desde la finalización del plazo de prohibición.</li>
<li>La información tiene carácter <b>reservado</b>, con cesiones tasadas.</li>
</ul>`,ancla:`<p><b>BDNS = la IGAE lo guarda, el interventor lo envía, todos lo consultan.</b> Cuatro finalidades: <b>transparencia, planificación, gestión y antifraude</b>.</p>`,vis:`<svg viewBox="0 0 640 165" role="img" aria-label="Base de Datos Nacional de Subvenciones">

{n:21,t:"Régimen de garantías",ubic:"Título Preliminar (Disposiciones generales) ▸ Capítulo II (Disposiciones comunes a las subvenciones públicas)",idea:"El régimen de garantías se remite íntegramente al reglamento.",literal:`<p>El régimen de las garantías, medios de constitución, depósito y cancelación que tengan que constituir los beneficiarios o las entidades colaboradoras se establecerá reglamentariamente.</p>`,dis:`<ul>
<li><b>Contenido:</b> el <b>régimen</b> de las garantías, sus <b>medios de constitución</b>, su <b>depósito</b> y su <b>cancelación</b> se establecerá <b>reglamentariamente</b>.</li>
<li><b>Sujetos:</b> las que tengan que constituir los <b>beneficiarios</b> o las <b>entidades colaboradoras</b>.</li>
<li><b>Dónde está hoy:</b> en el <b>RD 887/2006</b>, Reglamento de la LGS <i>(norma externa a la biblioteca)</i>.</li>
</ul>`,llano:`<p>Un artículo puramente remisorio: la ley no dice qué garantías hay que dar ni cómo, solo que lo dirá el reglamento. Es el precepto más corto del tema y, precisamente por eso, fácil de preguntar.</p>`,porque:`<p>Las garantías son materia técnica y cambiante —avales, seguros de caución, depósitos— y su detalle envejece rápido. Remitir al reglamento permite adaptarlas sin tocar la ley. La conexión práctica es directa: sin garantías reguladas no puede haber <b>pagos anticipados</b> (art. 34.4).</p>`,ej:`<ul>
<li><b>Cotidiano:</b> la fianza del alquiler: la ley dice que hay fianza; el detalle, otra norma.</li>
<li><b>Real:</b> las bases de una convocatoria municipal prevén pagos anticipados del 50 % con aval bancario, conforme al régimen de garantías reglamentario.</li>
</ul>`,noej:`<ul>
<li><b>No fija</b> la ley importes ni tipos de garantía.</li>
<li><b>No se exigen</b> garantías siempre: solo cuando lo prevea la normativa reguladora, señaladamente en pagos anticipados y a cuenta.</li>
</ul>`,conex:`<ul>
<li><b>Art. 34.4 LGS:</b> pagos anticipados y a cuenta, cuyo régimen de garantías debe preverse expresamente.</li>
<li><b>Art. 17.3.k) LGS:</b> las bases deben contemplar el régimen de garantías.</li>
<li><b>RD 887/2006</b> <i>(norma externa a la biblioteca)</i>: desarrollo del régimen de garantías.</li>
</ul>`,trampas:`<ul>
<li>Alcanza a beneficiarios <b>y</b> entidades colaboradoras.</li>
<li>Es una remisión <b>reglamentaria</b>: la ley no regula nada más.</li>
</ul>`,ancla:`<p><b>"Garantías: lo dice el reglamento."</b> Una línea, cuatro palabras clave: régimen, constitución, depósito y cancelación.</p>`,vis:`<svg viewBox="0 0 640 120" role="img" aria-label="Remisión reglamentaria del régimen de garantías">
<rect x="90" y="30" width="200" height="52" rx="8" fill="var(--acc-soft)" stroke="var(--acc)"/>
<text x="190" y="52" text-anchor="middle" font-size="11" font-weight="700" fill="var(--acc)">Art. 21 LGS</text>
<text x="190" y="70" text-anchor="middle" font-size="10" fill="currentColor">remisión al reglamento</text>
<text x="320" y="60" text-anchor="middle" font-size="16" fill="var(--ink2)">→</text>
<rect x="350" y="30" width="230" height="52" rx="8" fill="var(--warn-bg)" stroke="var(--warn)"/>
<text x="465" y="52" text-anchor="middle" font-size="11" font-weight="700" fill="var(--warn)">RD 887/2006</text>
<text x="465" y="70" text-anchor="middle" font-size="10" fill="currentColor">régimen, constitución, depósito y cancelación</text>
<text x="320" y="108" text-anchor="middle" font-size="10" fill="var(--ink2)">Aportación externa: norma no incluida en la biblioteca del proyecto</text>
</svg>`}];

<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>LGS · Arts. 1-21 · Ámbito de aplicación y disposiciones comunes</title>
<style>

/* ═══════════════════════════════════════════════════════════════
   SISTEMA DE DISEÑO · "Académico Gamificado" · Bloque II
   Temas 8, 9 y 10 · Auxiliar Administrativo
   ═══════════════════════════════════════════════════════════════ */
:root{
  --fs:16px;

  --bg:#faf9f7;
  --bg-grad:radial-gradient(1100px 560px at 12% -8%, #ede9ff 0%, transparent 55%),
            radial-gradient(850px 460px at 96% 0%, #dcf5ee 0%, transparent 50%);
  --surface:#ffffff;
  --surface-2:#f4f3f0;
  --surface-3:#eceae5;
  --line:#e6e3dc;
  --line-strong:#d4d0c7;

  --ink:#15161c;
  --ink-2:#5d616e;
  --ink-3:#8b8f9c;

  --brand:#5b3df5;
  --brand-2:#7c5cff;
  --brand-soft:#efeaff;
  --brand-ring:rgba(91,61,245,.18);

  --legal:#4338ca;  --legal-bg:#eeecff;
  --ej:#059669;     --ej-bg:#e4f7f0;
  --warn:#c2690a;   --warn-bg:#fdf1de;
  --exc:#dc2626;    --exc-bg:#ffeceb;

  --ok:#16a34a; --ok-soft:#e7f7ec;
  --mid:#eab308; --mid-soft:#fdf6dd;
  --off:#a1a1aa; --off-soft:#f1f1f3;

  --sh-1:0 1px 2px rgba(20,20,30,.04), 0 2px 8px rgba(20,20,30,.04);
  --sh-2:0 2px 6px rgba(20,20,30,.05), 0 12px 28px rgba(20,20,30,.07);
  --sh-3:0 8px 20px rgba(91,61,245,.13), 0 24px 56px rgba(20,20,30,.10);
  --sh-glow:0 0 0 4px var(--brand-ring);

  --r-sm:9px; --r-md:14px; --r-lg:20px; --r-full:999px;

  --f-display:"Segoe UI Variable Display",system-ui,-apple-system,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-legal:ui-serif,Georgia,Cambria,"Times New Roman",serif;
  --f-mono:ui-monospace,"SF Mono","Cascadia Mono","Segoe UI Mono",Menlo,monospace;

  --t-h1:clamp(1.02rem,.95rem + .3vw,1.2rem);
  --t-h2:clamp(1.2rem,1.05rem + .6vw,1.55rem);
  --t-h3:clamp(1rem,.95rem + .25vw,1.12rem);
  --t-sm:.86rem;
  --t-xs:.75rem;

  --e-out:cubic-bezier(.22,1,.36,1);
  --e-spring:cubic-bezier(.34,1.56,.64,1);

  /* ── Compatibilidad con SVG y contenido generado ── */
  --panel:var(--surface);
  --ink2:var(--ink-2);
  --acc:var(--brand);
  --acc-soft:var(--brand-soft);
  --g:var(--ok); --y:var(--mid); --r:var(--exc);
}

html[data-theme="dark"]{
  --bg:#0a0b0f;
  --bg-grad:radial-gradient(1100px 560px at 12% -8%, #1c1740 0%, transparent 55%),
            radial-gradient(850px 460px at 96% 0%, #08302b 0%, transparent 50%);
  --surface:#13151b;
  --surface-2:#1a1d25;
  --surface-3:#232733;
  --line:#262a34;
  --line-strong:#343947;

  --ink:#eceef4;
  --ink-2:#9ba2b3;
  --ink-3:#6e7585;

  --brand:#8b6dff;
  --brand-2:#a78bff;
  --brand-soft:#1e1a3d;
  --brand-ring:rgba(139,109,255,.22);

  --legal:#a5b4fc; --legal-bg:#191b3a;
  --ej:#34d399;    --ej-bg:#0c2a24;
  --warn:#fbbf24;  --warn-bg:#2e2110;
  --exc:#fb7185;   --exc-bg:#331119;

  --ok:#4ade80; --ok-soft:#0e2a19;
  --mid:#facc15; --mid-soft:#2c2610;
  --off:#5b6070; --off-soft:#1c1f27;

  --sh-1:0 1px 2px rgba(0,0,0,.3), 0 2px 8px rgba(0,0,0,.25);
  --sh-2:0 2px 6px rgba(0,0,0,.35), 0 12px 28px rgba(0,0,0,.4);
  --sh-3:0 8px 20px rgba(139,109,255,.2), 0 24px 56px rgba(0,0,0,.5);
}

*,*::before,*::after{box-sizing:border-box}
html{font-size:var(--fs);scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);background-image:var(--bg-grad);
  background-attachment:fixed;background-repeat:no-repeat;
  color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.68;
  -webkit-font-smoothing:antialiased;
  transition:background-color .5s var(--e-out),color .3s;
}
::selection{background:var(--brand);color:#fff}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{font-family:var(--f-display);letter-spacing:-.022em;line-height:1.2}
.num{font-variant-numeric:tabular-nums}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:99px;border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3)}

/* ═══ HEADER ═══ */
header.top{
  position:sticky;top:0;z-index:60;
  background:color-mix(in srgb,var(--surface) 80%,transparent);
  backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);
  border-bottom:1px solid var(--line);
}
.top-in{max-width:1280px;margin:0 auto;padding:.65rem 1.1rem;display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.brandwrap{display:flex;align-items:center;gap:.65rem;min-width:0;flex:1}
.mark{
  width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;
  font-weight:800;font-size:.8rem;letter-spacing:-.02em;text-decoration:none;
  box-shadow:0 4px 14px var(--brand-ring);
  transition:transform .3s var(--e-spring),box-shadow .3s;
}
.mark:hover{transform:rotate(-8deg) scale(1.08);box-shadow:var(--sh-3);text-decoration:none}
.top h1{font-size:var(--t-h1);margin:0;font-weight:800;line-height:1.25;min-width:0}
.top h1 .sub{display:block;font-size:var(--t-xs);color:var(--ink-2);font-weight:500;letter-spacing:0;
  margin-top:.1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tools{margin-left:auto;display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}

button,select,input[type=search]{
  font:inherit;font-size:var(--t-sm);font-weight:600;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:var(--r-sm);padding:.4rem .72rem;cursor:pointer;
  position:relative;overflow:hidden;
  transition:transform .18s var(--e-spring),border-color .2s,background .2s,box-shadow .2s,color .2s;
}
button:hover{transform:translateY(-1.5px);border-color:var(--brand);box-shadow:var(--sh-1)}
button:active{transform:translateY(0) scale(.97)}
button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible{outline:none;box-shadow:var(--sh-glow)}
input[type=search]{min-width:190px;cursor:text;font-weight:500}
input[type=search]:focus{border-color:var(--brand)}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--surface-2);padding:2px;gap:2px}
.seg button{border:0;border-radius:calc(var(--r-sm) - 2px);padding:.32rem .68rem;background:transparent;box-shadow:none}
.seg button:hover{transform:none;background:var(--surface)}
.seg button[aria-pressed="true"]{background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;box-shadow:0 2px 8px var(--brand-ring)}

.ripple{position:absolute;border-radius:50%;transform:scale(0);background:currentColor;opacity:.25;animation:rip .55s linear;pointer-events:none}
@keyframes rip{to{transform:scale(3.4);opacity:0}}

.progress{position:absolute;left:0;bottom:-1px;height:2.5px;width:0;
  background:linear-gradient(90deg,var(--brand),var(--legal),var(--ej));transition:width .1s linear}

/* ═══ LAYOUT ═══ */
.layout{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:270px 1fr;gap:1.8rem;padding:1.4rem 1.1rem 5rem}
main{min-width:0}

/* ═══ SIDEBAR ═══ */
nav.side{
  position:sticky;top:76px;align-self:start;max-height:calc(100vh - 96px);overflow:auto;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:.85rem;box-shadow:var(--sh-1);
}
nav.side h2{font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);
  margin:.5rem .4rem .5rem;font-weight:800}
nav.side h2:first-child{margin-top:.1rem}
nav.side a{
  display:flex;align-items:baseline;gap:.5rem;padding:.36rem .55rem;border-radius:var(--r-sm);
  text-decoration:none;color:var(--ink-2);font-size:var(--t-sm);font-weight:500;
  position:relative;transition:background .22s,color .22s,transform .22s var(--e-out);
}
nav.side a:hover{background:var(--surface-2);color:var(--ink);transform:translateX(3px);text-decoration:none}
nav.side a.on{background:var(--brand-soft);color:var(--brand);font-weight:700}
nav.side a.on::before{content:"";position:absolute;left:-.85rem;top:20%;bottom:20%;width:3px;
  border-radius:0 3px 3px 0;background:var(--brand)}
nav.side a b{color:var(--ink-3);font-weight:800;font-size:var(--t-xs);font-variant-numeric:tabular-nums;flex:none;min-width:1.9em}
nav.side a.on b{color:var(--brand)}
.navtoggle{display:none}

/* ═══ TARJETAS ═══ */
section.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:1.35rem 1.5rem;margin-bottom:1.1rem;box-shadow:var(--sh-1);
  transition:box-shadow .3s var(--e-out),border-color .3s;
}
section.card:hover{box-shadow:var(--sh-2)}
section.card>h2{
  margin:0 0 1rem;font-size:var(--t-h2);font-weight:800;
  display:flex;align-items:center;gap:.6rem;
}
section.card>h2::before{
  content:"";width:4px;height:1.05em;border-radius:99px;flex:none;
  background:linear-gradient(180deg,var(--brand),var(--brand-2));
}

/* ═══ ARTÍCULO ═══ */
.art{scroll-margin-top:86px;padding-top:.4rem}
.art + .art{margin-top:1.6rem;padding-top:1.6rem;border-top:1px dashed var(--line)}
.art h2{display:flex;flex-wrap:wrap;gap:.5rem;align-items:baseline;font-size:var(--t-h3);
  margin:0 0 .25rem;font-weight:800;letter-spacing:-.015em}
.art h2 .num{
  color:var(--brand);font-weight:800;font-family:var(--f-display);
  background:var(--brand-soft);padding:.1rem .5rem;border-radius:var(--r-sm);
  font-size:.92em;letter-spacing:-.02em;
}
.ubic{font-size:var(--t-xs);color:var(--ink-3);margin:0 0 .8rem;font-weight:600;
  letter-spacing:.03em;text-transform:uppercase}

/* ═══ IDEA CLAVE ═══ */
.idea{
  background:linear-gradient(100deg,var(--brand-soft),color-mix(in srgb,var(--brand-soft) 40%,transparent));
  border-left:4px solid var(--brand);border-radius:0 var(--r-md) var(--r-md) 0;
  padding:.75rem 1rem;font-weight:650;margin:.7rem 0 1rem;position:relative;
  font-size:.97rem;line-height:1.55;
}

/* ═══ ACORDEÓN ═══ */
details.panel{
  border:1px solid var(--line);border-radius:var(--r-md);margin:.6rem 0;
  background:var(--surface);overflow:hidden;
  transition:border-color .25s,box-shadow .25s,background .25s;
}
details.panel:hover{border-color:var(--line-strong)}
details.panel[open]{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-ring)}
details.panel>summary{
  cursor:pointer;padding:.62rem .9rem;font-weight:700;font-size:.93rem;
  list-style:none;display:flex;align-items:center;gap:.55rem;
  transition:background .2s,color .2s;
}
details.panel>summary:hover{background:var(--surface-2)}
details.panel[open]>summary{background:var(--brand-soft);color:var(--brand)}
details.panel>summary::-webkit-details-marker{display:none}
details.panel>summary::before{
  content:"";width:16px;height:16px;flex:none;border-radius:5px;
  background:var(--brand-soft);position:relative;transition:transform .3s var(--e-spring),background .25s;
}
details.panel>summary::after{
  content:"";position:absolute;width:0;height:0;margin-left:5px;
  border:4px solid transparent;border-left-color:var(--brand);
  transition:transform .3s var(--e-spring);
}
details.panel[open]>summary::before{background:var(--surface)}
details.panel[open]>summary::after{transform:rotate(90deg) translateX(-1px)}
details.panel .body{padding:.3rem 1rem 1rem;font-size:.95rem;animation:slidein .35s var(--e-out)}
@keyframes slidein{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* ═══ TEXTO LEGAL ═══ */
.legal{
  background:var(--legal-bg);border-left:4px solid var(--legal);
  border-radius:0 var(--r-md) var(--r-md) 0;padding:.85rem 1.05rem;
  font-family:var(--f-legal);font-size:.95rem;line-height:1.7;
}
.legal p{margin:.45rem 0}
.legal .lbl{
  font-family:var(--f-body);font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;
  color:var(--legal);font-weight:800;display:block;margin-bottom:.4rem;
}

/* ═══ CAJAS SEMÁNTICAS ═══ */
.box{
  border-left:4px solid var(--line);border-radius:0 var(--r-md) var(--r-md) 0;
  padding:.72rem .95rem;margin:.65rem 0;font-size:.94rem;
  transition:transform .25s var(--e-out),box-shadow .25s;
}
.box:hover{transform:translateX(3px);box-shadow:var(--sh-1)}
.box.ej{background:var(--ej-bg);border-color:var(--ej)}
.box.warn{background:var(--warn-bg);border-color:var(--warn)}
.box.exc{background:var(--exc-bg);border-color:var(--exc)}
.box .lbl{font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;font-weight:800;
  display:block;margin-bottom:.3rem}
.box.ej .lbl{color:var(--ej)}
.box.warn .lbl{color:var(--warn)}
.box.exc .lbl{color:var(--exc)}

.interp{
  border:1px dashed var(--warn);background:color-mix(in srgb,var(--warn-bg) 45%,transparent);
  border-radius:var(--r-md);padding:.65rem .9rem;font-size:.9rem;margin:.6rem 0;
}
.interp .lbl{font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;color:var(--warn);font-weight:800;display:block}

/* ═══ TABLAS ═══ */
table{width:100%;border-collapse:separate;border-spacing:0;font-size:.9rem;margin:.7rem 0;
  border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
th,td{padding:.5rem .68rem;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
td + td, th + th{border-left:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th{background:var(--surface-2);font-size:var(--t-xs);font-weight:800;letter-spacing:.05em;
  text-transform:uppercase;color:var(--ink-2);position:sticky;top:0}
tbody tr{transition:background .18s}
tbody tr:nth-child(even){background:color-mix(in srgb,var(--surface-2) 45%,transparent)}
tbody tr:hover{background:var(--brand-soft)}
th.sortable{cursor:pointer;user-select:none;transition:color .2s,background .2s}
th.sortable:hover{color:var(--brand);background:var(--brand-soft)}
th.sortable::after{content:" ⇅";color:var(--ink-3);font-size:.7rem}

ul,ol{margin:.5rem 0 .5rem 1.2rem;padding:0}
li{margin:.26rem 0}
li::marker{color:var(--brand);font-weight:700}

/* ═══ TOOLTIPS ═══ */
.t{border-bottom:1.5px dotted var(--brand);cursor:help;position:relative;
  transition:background .2s,color .2s}
.t:hover{background:var(--brand-soft);color:var(--brand);border-radius:3px}
#tip{
  position:fixed;z-index:99;max-width:330px;background:var(--ink);color:var(--bg);
  padding:.6rem .78rem;border-radius:var(--r-md);font-size:.82rem;line-height:1.5;
  display:none;box-shadow:0 8px 30px rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.08);
}
html[data-theme="dark"] #tip{background:#f0f1f5;color:#15161c}

/* ═══ FLECHAS DE DIAGRAMA ═══
   Un <path> con stroke pero sin fill toma el valor inicial (negro) y el
   navegador cierra el trazo implícitamente: aparece un triángulo relleno
   entre sus extremos. Forzamos fill:none para dejar solo la línea + la
   punta del <marker>, que sí lleva su color. */
svg path[stroke]:not([fill]){fill:none}
svg polyline:not([fill]){fill:none}
svg line{fill:none}

/* ═══ SVG ═══ */
svg{max-width:100%;height:auto;display:block;margin:.9rem auto}
svg text{font-family:var(--f-body)}

/* ═══ BUSCADOR ═══ */
mark.hit{background:linear-gradient(180deg,transparent 55%,#ffe066 55%);color:inherit;
  border-radius:2px;padding:0 1px;font-weight:600}
html[data-theme="dark"] mark.hit{background:linear-gradient(180deg,transparent 55%,#8a6d00 55%);color:#fff}

/* ═══ UTILIDADES ═══ */
.hide{display:none !important}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.small{font-size:var(--t-sm);color:var(--ink-2)}
.chip{
  display:inline-block;font-size:var(--t-xs);padding:.16rem .55rem;border-radius:var(--r-full);
  background:var(--brand-soft);color:var(--brand);font-weight:800;letter-spacing:.02em;
}

/* ═══ HUECOS RELLENABLES ═══ */
.gap{
  display:inline-block;min-width:5.5em;border-bottom:2px solid var(--brand);
  text-align:center;font-weight:700;color:transparent;cursor:pointer;
  transition:color .3s,background .3s;
}
.gap.on,.gap:hover{color:var(--brand);background:var(--brand-soft);border-radius:4px 4px 0 0}

/* ═══ REVELAR SOLUCIÓN ═══ */
.revelar{
  background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;border-color:transparent;
  font-weight:700;
}
.revelar:hover{box-shadow:var(--sh-3)}
.sol{
  margin-top:.7rem;padding:.8rem 1rem;border-radius:var(--r-md);
  background:var(--ej-bg);border-left:4px solid var(--ej);
  animation:slidein .4s var(--e-out);
}

/* ═══ TEST ═══ */
.opt{
  display:block;padding:.55rem .85rem;margin:.35rem 0;border:1.5px solid var(--line);
  border-radius:var(--r-md);cursor:pointer;background:var(--surface);font-size:.94rem;
  transition:border-color .22s,background .22s,transform .22s var(--e-out);
}
.opt:hover{border-color:var(--brand);background:var(--brand-soft);transform:translateX(4px)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft);font-weight:650}
.opt.ko{border-color:var(--exc);background:var(--exc-bg)}
.opt input{margin-right:.5rem;accent-color:var(--brand)}

#tscore,#semres{
  font-family:var(--f-display);font-weight:800;font-size:1.15rem;letter-spacing:-.02em;
}

/* ═══════════════════════════════════════════════════════════════
   FLASHCARDS 3D · mazo con giro, vuelo de salida y sheen
   ═══════════════════════════════════════════════════════════════ */
#flash{--fc-e:cubic-bezier(.2,.8,.25,1);--fc-h:250px}

/* — Escena — */
.fc-stage{
  perspective:1400px;perspective-origin:50% 45%;
  padding:.4rem 0 .2rem;position:relative;
}
.fc-deck{position:relative;height:var(--fc-h);will-change:transform}

/* — Cartas fantasma del mazo — */
.fc-ghost{
  position:absolute;inset:0;border-radius:var(--r-lg);
  background:var(--surface);border:1px solid var(--line);
  transition:transform .5s var(--fc-e),opacity .5s var(--fc-e);
}
.fc-ghost.g1{transform:translateY(9px) scale(.972);opacity:.75}
.fc-ghost.g2{transform:translateY(18px) scale(.944);opacity:.45}
.fc-deck.empty .fc-ghost{opacity:0;transform:translateY(26px) scale(.9)}

/* — Elevación durante el giro — */
.fc-lift{position:absolute;inset:0;transform-style:preserve-3d}
.fc-lift.lift{animation:fcLift .78s var(--fc-e)}
@keyframes fcLift{
  0%,100%{transform:scale(1) translateY(0)}
  45%{transform:scale(1.055) translateY(-16px)}
}
.fc-lift.out-ok{animation:fcOut .5s cubic-bezier(.5,0,.75,0) forwards}
.fc-lift.out-ko{animation:fcOutKo .5s cubic-bezier(.5,0,.75,0) forwards}
.fc-lift.in{animation:fcIn .48s var(--fc-e)}
@keyframes fcOut{
  0%{transform:translateX(0) rotate(0) scale(1);opacity:1}
  100%{transform:translateX(130%) rotate(17deg) scale(.85);opacity:0}
}
@keyframes fcOutKo{
  0%{transform:translateX(0) rotate(0) scale(1);opacity:1}
  100%{transform:translateX(-130%) rotate(-17deg) scale(.85);opacity:0}
}
@keyframes fcIn{
  0%{transform:translateY(26px) scale(.9);opacity:0}
  100%{transform:translateY(0) scale(1);opacity:1}
}

/* — La carta — */
.fc-card{
  position:absolute;inset:0;transform-style:preserve-3d;
  transition:transform .78s var(--fc-e);
  cursor:pointer;border-radius:var(--r-lg);
}
.fc-card:focus-visible{outline:none}
.fc-card:focus-visible .fc-face{box-shadow:var(--sh-glow),var(--sh-2)}

/* — Caras — */
.fc-face{
  position:absolute;inset:0;border-radius:var(--r-lg);
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  padding:2rem 2.2rem;text-align:center;overflow:hidden;
  box-shadow:var(--sh-2);
  transition:box-shadow .4s var(--fc-e);
}
.fc-card:hover .fc-face{box-shadow:var(--sh-3)}

/* Anverso · pregunta */
.fc-front{
  background:
    radial-gradient(120% 90% at 50% -20%, var(--brand-soft) 0%, transparent 60%),
    var(--surface);
  border:1.5px solid var(--line);color:var(--ink);
}
/* Reverso · respuesta */
.fc-back{
  transform:rotateY(180deg);
  background:linear-gradient(145deg,var(--brand) 0%,#6d4bf7 45%,var(--c5,#0891b2) 130%);
  border:1.5px solid transparent;color:#fff;
}
html[data-theme="dark"] .fc-back{
  background:linear-gradient(145deg,#5f45c9 0%,#4b3aa8 45%,#0e6b85 130%);
}
.fc-back .fc-txt{color:#fff}
.fc-back b,.fc-back strong{color:#fff;font-weight:800}

/* — Sheen que barre al girar — */
.fc-face::after{
  content:"";position:absolute;top:-60%;left:-70%;width:55%;height:220%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.42),transparent);
  transform:rotate(18deg);opacity:0;pointer-events:none;
}
.fc-lift.lift .fc-face::after{animation:fcSheen .78s var(--fc-e)}
@keyframes fcSheen{
  0%{opacity:0;left:-70%}
  35%{opacity:1}
  100%{opacity:0;left:150%}
}

/* — Etiqueta superior — */
.fc-tag{
  position:absolute;top:1rem;left:1.15rem;
  font-size:var(--t-xs);font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  display:inline-flex;align-items:center;gap:.4rem;
}
.fc-front .fc-tag{color:var(--brand)}
.fc-back .fc-tag{color:rgba(255,255,255,.9)}
.fc-tag::before{
  content:"";width:7px;height:7px;border-radius:50%;background:currentColor;
  animation:fcPulse 2.2s ease-in-out infinite;
}
@keyframes fcPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.65)}}

/* — Índice tipo naipe — */
.fc-pip{
  position:absolute;font-family:var(--f-display);font-weight:800;
  font-size:.78rem;letter-spacing:-.02em;opacity:.34;font-variant-numeric:tabular-nums;
}
.fc-pip.tr{top:1rem;right:1.15rem}
.fc-pip.bl{bottom:1rem;left:1.15rem;transform:rotate(180deg)}
.fc-front .fc-pip{color:var(--ink-2)}
.fc-back .fc-pip{color:#fff;opacity:.55}

/* — Texto — */
.fc-txt{
  font-size:clamp(1rem,.9rem + .55vw,1.28rem);font-weight:650;line-height:1.5;
  max-width:44ch;letter-spacing:-.012em;
}
.fc-front .fc-txt{font-family:var(--f-display);font-weight:700}
.fc-back .fc-txt{font-weight:600;line-height:1.6}
.fc-hint{
  position:absolute;bottom:1rem;left:0;right:0;
  font-size:var(--t-xs);font-weight:600;letter-spacing:.02em;
  display:flex;align-items:center;justify-content:center;gap:.4rem;
}
.fc-front .fc-hint{color:var(--ink-3)}
.fc-back .fc-hint{color:rgba(255,255,255,.72)}
.fc-hint .kbd{
  font-family:var(--f-mono);font-size:.68rem;font-weight:700;padding:.1rem .32rem;
  border-radius:5px;border:1px solid currentColor;opacity:.75;
}

/* — Pantalla final — */
.fc-done{
  position:absolute;inset:0;border-radius:var(--r-lg);
  background:linear-gradient(150deg,var(--ok-soft),var(--surface) 70%);
  border:1.5px solid var(--ok);
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  text-align:center;padding:2rem;gap:.35rem;
  animation:fcIn .5s var(--fc-e);box-shadow:var(--sh-2);
}
.fc-done .seal{
  font-size:2.6rem;line-height:1;
  animation:fcSeal .7s cubic-bezier(.2,1.5,.4,1);
}
@keyframes fcSeal{0%{transform:scale(0) rotate(-25deg);opacity:0}60%{transform:scale(1.2) rotate(6deg)}100%{transform:scale(1) rotate(0);opacity:1}}
.fc-done h3{font-size:1.3rem;font-weight:800;margin:.2rem 0 0}
.fc-done p{margin:0;color:var(--ink-2);font-size:var(--t-sm)}

/* — Barra de progreso de la ronda — */
.fc-bar{
  height:6px;border-radius:99px;background:var(--surface-3);
  overflow:hidden;margin:.95rem 0 .8rem;position:relative;
}
.fc-bar i{
  display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--brand),var(--c5,#0891b2));
  transition:width .55s var(--fc-e);
}

/* — Controles — */
.fc-ctrls{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.fc-ctrls button{font-weight:700}
#fcok{border-color:var(--ok);color:var(--ok)}
#fcok:hover{background:var(--ok);color:#fff;border-color:var(--ok)}
#fcko{border-color:var(--warn);color:var(--warn)}
#fcko:hover{background:var(--warn);color:#fff;border-color:var(--warn)}
#fcflip{background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;border-color:transparent}
#fcflip:hover{box-shadow:var(--sh-3)}

.fc-score{display:inline-flex;gap:.45rem;margin-left:auto;align-items:center}
.fc-pill{
  font-size:var(--t-xs);font-weight:800;padding:.24rem .6rem;border-radius:var(--r-full);
  font-variant-numeric:tabular-nums;border:1px solid;
}
.fc-pill.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.fc-pill.ko{color:var(--warn);border-color:var(--warn);background:var(--warn-bg)}
.fc-pill.left{color:var(--ink-2);border-color:var(--line);background:var(--surface-2)}
.fc-pill.bump{animation:fcBump .45s var(--e-spring)}
@keyframes fcBump{0%{transform:scale(1)}45%{transform:scale(1.28)}100%{transform:scale(1)}}

@media(max-width:620px){
  #flash{--fc-h:270px}
  .fc-face{padding:1.7rem 1.3rem}
  .fc-score{margin-left:0;width:100%}
}
@media(prefers-reduced-motion:reduce){
  .fc-card{transition:none}
  .fc-lift.lift,.fc-lift.in,.fc-lift.out-ok,.fc-lift.out-ko,.fc-face::after{animation:none !important}
}
@media print{.fc-stage,.fc-ctrls,.fc-bar{display:none !important}}
/* ═══ RESPUESTA ESTRUCTURADA ═══ */
.fc-face{justify-content:center}
.fc-face.struct{justify-content:flex-start;text-align:left;padding-top:3.1rem;padding-bottom:3.1rem}
.fc-body{
  width:100%;max-width:46ch;margin:0 auto;
  overflow-y:auto;max-height:100%;
  scrollbar-width:thin;
}
.fc-body::-webkit-scrollbar{width:5px}
.fc-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.35);border-radius:99px;border:0}
.fc-front .fc-body::-webkit-scrollbar-thumb{background:var(--line-strong)}

/* — Veredicto Sí / No — */
.fc-verdict{
  display:inline-flex;align-items:center;gap:.35rem;
  font-family:var(--f-display);font-weight:800;font-size:.82rem;
  letter-spacing:.06em;text-transform:uppercase;
  padding:.26rem .72rem;border-radius:var(--r-full);margin-bottom:.85rem;
  border:1.5px solid;animation:fcPopIn .45s var(--e-spring) backwards;animation-delay:.34s;
}
.fc-verdict.si{background:rgba(255,255,255,.16);border-color:rgba(190,255,215,.85);color:#d8ffe9}
.fc-verdict.no{background:rgba(255,255,255,.16);border-color:rgba(255,205,205,.85);color:#ffdedd}
@keyframes fcPopIn{0%{opacity:0;transform:scale(.7) translateY(6px)}100%{opacity:1;transform:none}}

/* — Párrafo — */
.fc-p{margin:0;font-size:clamp(1rem,.92rem + .45vw,1.2rem);font-weight:600;line-height:1.6}
.fc-face.struct .fc-p{font-size:clamp(.96rem,.9rem + .35vw,1.1rem)}

/* — Lista enumerada — */
.fc-list{list-style:none;margin:0;padding:0;display:grid;gap:.5rem;counter-reset:fc}
.fc-list li{
  counter-increment:fc;position:relative;margin:0;
  padding:.42rem .6rem .42rem 2.5rem;border-radius:var(--r-sm);
  background:rgba(255,255,255,.11);
  font-size:clamp(.92rem,.88rem + .3vw,1.04rem);font-weight:600;line-height:1.45;
  animation:fcRow .42s var(--e-out) backwards;
}
.fc-list li::before{
  content:counter(fc);position:absolute;left:.6rem;top:50%;transform:translateY(-50%);
  width:1.6rem;height:1.6rem;border-radius:50%;
  display:grid;place-items:center;
  background:rgba(255,255,255,.9);color:var(--brand);
  font-family:var(--f-display);font-weight:800;font-size:.78rem;
  font-variant-numeric:tabular-nums;
}
.fc-list.alpha li::before{content:counter(fc,lower-alpha)}
.fc-list li:nth-child(1){animation-delay:.36s}
.fc-list li:nth-child(2){animation-delay:.42s}
.fc-list li:nth-child(3){animation-delay:.48s}
.fc-list li:nth-child(4){animation-delay:.54s}
.fc-list li:nth-child(5){animation-delay:.60s}
.fc-list li:nth-child(n+6){animation-delay:.66s}
@keyframes fcRow{0%{opacity:0;transform:translateX(-12px)}100%{opacity:1;transform:none}}

/* — Cláusulas contrapuestas — */
.fc-clauses{display:grid;gap:.45rem}
.fc-clauses p{
  margin:0;padding:.45rem .7rem .45rem .95rem;border-radius:0 var(--r-sm) var(--r-sm) 0;
  background:rgba(255,255,255,.11);border-left:3px solid rgba(255,255,255,.55);
  font-size:clamp(.92rem,.88rem + .3vw,1.04rem);font-weight:600;line-height:1.5;
  animation:fcRow .42s var(--e-out) backwards;
}
.fc-clauses p:nth-child(1){animation-delay:.36s}
.fc-clauses p:nth-child(2){animation-delay:.44s}
.fc-clauses p:nth-child(3){animation-delay:.52s}

/* — Negritas resaltadas en el reverso — */
.fc-back .fc-body b,.fc-back .fc-body strong{
  font-weight:800;background:rgba(255,255,255,.2);
  padding:.03em .3em;border-radius:5px;
  box-decoration-break:clone;-webkit-box-decoration-break:clone;
}

/* — Cita legal al pie — */
.fc-cite{
  position:absolute;bottom:.95rem;left:0;right:0;
  display:inline-flex;align-items:center;justify-content:center;gap:.4rem;
  font-family:var(--f-mono);font-size:.74rem;font-weight:700;letter-spacing:.02em;
  color:rgba(255,255,255,.82);
  animation:fcPopIn .5s var(--e-out) backwards;animation-delay:.5s;
}
.fc-cite::before,.fc-cite::after{
  content:"";height:1px;width:clamp(18px,10%,52px);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.45));
}
.fc-cite::after{background:linear-gradient(90deg,rgba(255,255,255,.45),transparent)}
.fc-cite .s{font-size:.9rem;opacity:.75;font-family:var(--f-legal)}
.fc-front .fc-cite{color:var(--ink-3)}
.fc-front .fc-cite::before{background:linear-gradient(90deg,transparent,var(--line-strong))}
.fc-front .fc-cite::after{background:linear-gradient(90deg,var(--line-strong),transparent)}

/* la pista se oculta si hay cita, para no amontonar */
.fc-back .fc-cite ~ .fc-hint,.fc-back .fc-hint.muted{display:none}

@media(max-width:620px){
  #flash{--fc-h:320px}
  .fc-face.struct{padding-top:2.9rem;padding-bottom:2.8rem}
  .fc-list li{padding-left:2.3rem}
}
@media(prefers-reduced-motion:reduce){
  .fc-verdict,.fc-list li,.fc-clauses p,.fc-cite{animation:none !important}
}

/* ═══ SEMÁFORO ═══ */
.sembtn{
  border-radius:var(--r-full);padding:.32rem .7rem;font-weight:700;font-size:var(--t-sm);
}
.sembtn[data-v="g"]:hover,.sembtn.on[data-v="g"]{background:var(--ok);color:#fff;border-color:var(--ok)}
.sembtn[data-v="y"]:hover,.sembtn.on[data-v="y"]{background:var(--mid);color:#3d2f00;border-color:var(--mid)}
.sembtn[data-v="r"]:hover,.sembtn.on[data-v="r"]{background:var(--exc);color:#fff;border-color:var(--exc)}

/* ═══ CTA DE BLOQUE ═══ */
a.blk{
  display:inline-flex;align-items:center;gap:.5rem;
  background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;
  padding:.5rem .95rem;border-radius:var(--r-sm);font-weight:700;font-size:var(--t-sm);
  text-decoration:none;box-shadow:0 2px 10px var(--brand-ring);
  transition:transform .22s var(--e-spring),box-shadow .25s,gap .25s var(--e-out);
}
a.blk:hover{transform:translateY(-2px);box-shadow:var(--sh-3);gap:.75rem;text-decoration:none}
a.blk::after{content:"→"}
a.blk:active{transform:translateY(0) scale(.98)}

/* ═══ REVEAL ═══ */
.rv{opacity:0;transform:translateY(20px);transition:opacity .6s var(--e-out),transform .6s var(--e-out)}
.rv.in{opacity:1;transform:none}

/* ═══ RESPONSIVE ═══ */
@media(max-width:960px){
  .layout{grid-template-columns:1fr;padding-top:.9rem;gap:1rem}
  nav.side{position:static;max-height:none}
  nav.side.collapsed .navbody{display:none}
  .navtoggle{display:block;width:100%;text-align:left;font-weight:700}
  .grid2{grid-template-columns:1fr}
  .top h1 .sub{white-space:normal}
}
@media(max-width:620px){
  .top-in{padding:.55rem .8rem}
  .tools{width:100%;margin-left:0}
  input[type=search]{flex:1;min-width:0}
  section.card{padding:1.05rem 1rem;border-radius:var(--r-md)}
  table{font-size:.82rem}
  th,td{padding:.4rem .5rem}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
  .rv{opacity:1;transform:none}
}
@media print{
  header.top,nav.side,.tools,.noprint,.progress{display:none !important}
  body{background:#fff;background-image:none;font-size:11pt;color:#000}
  .layout{display:block;max-width:none;padding:0}
  section.card{border:0;padding:0;margin:0 0 1rem;break-inside:avoid;box-shadow:none}
  details.panel{border:0;box-shadow:none}
  details.panel .body{display:block !important}
  details.panel>summary{padding-left:0}
  .art{break-inside:avoid}
  .rv{opacity:1;transform:none}
  a{color:#000;text-decoration:none}
}


/* ═══ ALTURA ADAPTATIVA DE LA TARJETA ═══ */
.fc-deck{transition:height .45s var(--fc-e)}
.fc-body{max-height:none;overflow:visible}
.fc-measure{
  position:absolute;left:0;right:0;top:0;height:auto;
  visibility:hidden;pointer-events:none;z-index:-1;
}
.fc-measure .fc-face{
  position:relative;inset:auto;height:auto;min-height:0;
  box-shadow:none;backface-visibility:visible;transform:none;
}
.fc-measure .fc-body{max-height:none;overflow:visible}
.fc-measure .fc-face::after{display:none}

/* ═══ MOSTRAR / OCULTAR ÍNDICE LATERAL ═══ */
.layout{transition:grid-template-columns .42s var(--e-out)}
.layout.nonav{grid-template-columns:0 1fr;gap:0}
.layout.nonav>nav.side{
  opacity:0;transform:translateX(-14px);pointer-events:none;
  padding:0;border-width:0;overflow:hidden;width:0;min-width:0;
}
nav.side{
  transition:opacity .3s var(--e-out),transform .38s var(--e-out);
  overflow-x:hidden;
}
#navhide .ic{display:inline-block;transition:transform .35s var(--e-spring);font-size:.95em;line-height:1}
#navhide[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
#navhide[aria-pressed="true"] .ic{transform:rotate(90deg)}
@media(max-width:960px){#navhide{display:none}}

/* ═══════════════════════════════════════════════════════════════
   LECTURA EN VOZ ALTA (TTS) del texto legal
   ═══════════════════════════════════════════════════════════════ */
.tts-bar{
  display:flex;align-items:center;gap:.45rem;flex-wrap:wrap;
  margin:.15rem 0 .7rem;
}
.tts-bar button{
  font-size:var(--t-xs);font-weight:700;padding:.3rem .62rem;
  border-radius:var(--r-full);border:1px solid var(--legal);
  background:transparent;color:var(--legal);
  display:inline-flex;align-items:center;gap:.35rem;line-height:1.2;
}
.tts-bar button:hover{background:var(--legal);color:var(--surface);border-color:var(--legal)}
.tts-bar button[hidden]{display:none}
.tts-bar .tts-play.on{background:var(--legal);color:var(--surface)}

/* Ondas de audio mientras lee */
.tts-wave{display:inline-flex;align-items:flex-end;gap:2px;height:11px}
.tts-wave i{
  width:2.5px;background:currentColor;border-radius:2px;height:35%;
  animation:ttsW .9s ease-in-out infinite;
}
.tts-wave i:nth-child(2){animation-delay:.15s}
.tts-wave i:nth-child(3){animation-delay:.3s}
.tts-wave i:nth-child(4){animation-delay:.45s}
@keyframes ttsW{0%,100%{height:32%}50%{height:100%}}

.tts-time{
  font-family:var(--f-mono);font-size:.7rem;font-weight:700;
  color:var(--ink-3);font-variant-numeric:tabular-nums;
}

/* Frase que se está leyendo */
.tts-s{transition:background .25s,color .25s;border-radius:3px}
.tts-s.now{
  background:linear-gradient(180deg,transparent 8%,color-mix(in srgb,var(--legal) 26%,transparent) 8%);
  box-shadow:0 0 0 2px color-mix(in srgb,var(--legal) 16%,transparent);
}
html[data-theme="dark"] .tts-s.now{
  background:linear-gradient(180deg,transparent 8%,color-mix(in srgb,var(--legal) 34%,transparent) 8%);
}
.legal.tts-on{box-shadow:0 0 0 3px color-mix(in srgb,var(--legal) 20%,transparent)}

/* ═══ Reproductor flotante ═══ */
.tts-mini{
  position:fixed;left:50%;bottom:1.1rem;transform:translateX(-50%) translateY(140%);
  z-index:80;display:flex;align-items:center;gap:.6rem;
  background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  border:1px solid var(--line);border-radius:var(--r-full);
  padding:.5rem .7rem .5rem .95rem;box-shadow:var(--sh-3);
  transition:transform .45s var(--e-spring),opacity .3s;opacity:0;pointer-events:none;
  max-width:min(94vw,540px);
}
.tts-mini.show{transform:translateX(-50%) translateY(0);opacity:1;pointer-events:auto}
.tts-mini .lbl{
  font-size:var(--t-xs);font-weight:800;color:var(--legal);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:16ch;
}
.tts-mini button{
  border-radius:50%;width:32px;height:32px;padding:0;display:grid;place-items:center;
  font-size:.8rem;border:1px solid var(--line);flex:none;
}
.tts-mini button.main{
  width:38px;height:38px;font-size:.95rem;
  background:linear-gradient(140deg,var(--legal),var(--brand));color:#fff;border-color:transparent;
}
.tts-mini .bar{
  flex:1;min-width:70px;height:5px;border-radius:99px;background:var(--surface-3);overflow:hidden;
}
.tts-mini .bar i{display:block;height:100%;width:0;background:var(--legal);
  border-radius:99px;transition:width .35s var(--e-out)}

/* ═══ Panel de ajustes de voz ═══ */
.tts-back{
  position:fixed;inset:0;z-index:90;background:rgba(10,10,18,.45);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  display:grid;place-items:center;padding:1rem;
  opacity:0;pointer-events:none;transition:opacity .3s var(--e-out);
}
.tts-back.show{opacity:1;pointer-events:auto}
.tts-panel{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--sh-3);width:min(94vw,470px);max-height:88vh;overflow:auto;
  padding:1.3rem 1.4rem;transform:translateY(16px) scale(.97);
  transition:transform .38s var(--e-spring);
}
.tts-back.show .tts-panel{transform:none}
.tts-panel h3{
  font-size:1.12rem;font-weight:800;margin:0 0 .25rem;
  display:flex;align-items:center;gap:.5rem;
}
.tts-panel .sub{font-size:var(--t-sm);color:var(--ink-2);margin:0 0 1.1rem}
.tts-row{margin-bottom:1.05rem}
.tts-row > label{
  display:block;font-size:var(--t-xs);font-weight:800;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-2);margin-bottom:.4rem;
}
.tts-seg{display:flex;gap:3px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:3px}
.tts-seg button{
  flex:1;border:0;background:transparent;border-radius:calc(var(--r-sm) - 3px);
  padding:.42rem .3rem;font-size:var(--t-sm);font-weight:700;box-shadow:none;
}
.tts-seg button:hover{transform:none;background:var(--surface)}
.tts-seg button[aria-pressed="true"]{
  background:linear-gradient(140deg,var(--legal),var(--brand));color:#fff;
}
.tts-panel select{
  width:100%;padding:.5rem .6rem;border-radius:var(--r-sm);
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  font-size:var(--t-sm);font-weight:600;cursor:pointer;
}
.tts-panel select:focus{border-color:var(--brand);outline:none}

}


/* — Variante compacta para los apartados desplegables — */

.idea .tts-bar.mini{margin:.55rem 0 0}
.legal.tts-on,.body.tts-on,.idea.tts-on{

@media(max-width:620px){

<script>
const GLOSARIO={
 "presupuesto":"Documento contable y jurídico, aprobado por el Pleno, que fija el techo de gasto de un ejercicio y estima los ingresos con los que se financia. Ej.: el presupuesto de Utrera para 2026 autoriza gastar como máximo 78 M€.",
 "credito":"Crédito presupuestario: la cantidad máxima de dinero autorizada para una finalidad concreta. Ej.: 120.000 € en la aplicación de 'mantenimiento de colegios'.",
 "obligacion":"Obligación reconocida: la deuda que el Ayuntamiento admite formalmente que debe pagar, una vez comprobado que el servicio o suministro se ha prestado. Ej.: aprobada la factura del proveedor, nace la obligación.",
 "derecho":"Derecho liquidado: el importe concreto que un tercero debe a la entidad local, una vez cuantificado. Ej.: liquidado el IBI de un inmueble en 340 €, ese es el derecho.",
 "oa":"Organismo autónomo: ente con personalidad jurídica propia creado por la entidad local para gestionar un servicio (patronatos de deportes, de cultura, gerencias de urbanismo). Depende del Ayuntamiento pero tiene su propio presupuesto.",
 "sociedad":"Sociedad mercantil local: empresa con forma de S.A. o S.L. cuyo capital pertenece a la entidad local (p. ej. la empresa municipal de aguas). No aprueba 'presupuesto', sino estados de previsión de gastos e ingresos.",
 "bases":"Bases de ejecución: el 'reglamento de uso' del presupuesto. Adaptan las normas presupuestarias generales a la organización concreta de la entidad. Ej.: fijan qué órgano autoriza gastos de hasta 3.000 €.",
 "estabilidad":"Estabilidad presupuestaria: exigencia de que las cuentas públicas no incurran en déficit estructural. Ej.: un ayuntamiento no puede presupuestar más gasto no financiero que ingresos no financieros.",
 "afectacion":"No afectación: regla general de que todos los ingresos financian todo el gasto, sin que un ingreso concreto quede reservado a un gasto concreto. Ej.: lo recaudado por el IBI no está reservado a pagar el alumbrado.",
 "bruto":"Principio de presupuesto bruto (o de integridad): derechos y obligaciones se anotan por su importe total, sin compensar unos con otros. Ej.: no se puede anotar la subvención 'ya descontados' los gastos del programa.",
 "nivelacion":"Nivelación presupuestaria: que el total de ingresos previstos cubra el total de gastos autorizados; es decir, aprobar sin déficit inicial.",
 "aplicacion":"Aplicación presupuestaria: la 'casilla' exacta donde vive cada euro de gasto, formada al cruzar la clasificación por programas con la económica. Ej.: 323/22103 (funcionamiento de centros docentes / combustibles).",
 "vinculacion":"Nivel de vinculación jurídica: el nivel de agregación en el que el crédito es realmente limitativo; por debajo de él se puede mover el gasto sin tramitar una modificación de crédito (art. 172 TRLHL).",
 "intervencion":"Intervención: el órgano de control interno de la entidad local, con función de fiscalización previa del gasto y de informe preceptivo del presupuesto. Lo desempeña un funcionario de habilitación nacional.",
 "pleno":"Pleno: órgano colegiado formado por todos los concejales o diputados. Es el único competente para aprobar el presupuesto.",
 "bop":"Boletín Oficial de la Provincia: diario oficial donde las entidades locales publican sus anuncios y acuerdos con efectos frente a terceros.",
 "prorroga":"Prórroga presupuestaria: si el 1 de enero no ha entrado en vigor el presupuesto nuevo, sigue rigiendo automáticamente el anterior con sus créditos iniciales.",
 "interesado":"Interesado: quien está legitimado para intervenir en un procedimiento. En el presupuesto, la ley define expresamente quiénes lo son (art. 170.1).",
 "liquidacion":"Liquidación del presupuesto: cierre contable del ejercicio, que determina los derechos y obligaciones pendientes, el remanente de tesorería y el resultado presupuestario.",
 "tcuentas":"Tribunal de Cuentas: órgano fiscalizador externo de las cuentas y la gestión económica del sector público, dependiente de las Cortes Generales.",
 "conten":"Recurso contencioso-administrativo: impugnación ante los juzgados y tribunales de lo contencioso-administrativo, es decir, ya fuera de la propia Administración.",
 "subvencion":"Subvención: disposición dineraria sin contraprestación directa, sujeta al cumplimiento de un objetivo o actividad, y destinada al fomento de una actividad de utilidad pública o interés social o a la promoción de una finalidad pública (art. 2.1 LGS).","contraprestacion":"Sin contraprestación directa: el beneficiario no entrega a cambio un bien o un servicio a la Administración. Es lo que distingue la subvención del contrato.","fomento":"Actividad de fomento: técnica de intervención administrativa que estimula conductas de interés general mediante incentivos, en lugar de imponerlas (policía) o prestarlas directamente (servicio público).","beneficiario":"Beneficiario: la persona que ha de realizar la actividad que fundamentó el otorgamiento de la subvención o que se encuentra en la situación que legitima su concesión (art. 11.1 LGS).","colaboradora":"Entidad colaboradora: la que, actuando en nombre y por cuenta del órgano concedente, entrega y distribuye los fondos a los beneficiarios o colabora en la gestión sin que se produzca la previa entrega de fondos (art. 12.1 LGS).","bases":"Bases reguladoras: norma que fija los requisitos, criterios y régimen de una línea de subvenciones. En las corporaciones locales se aprueban en el marco de las bases de ejecución del presupuesto o mediante ordenanza (art. 17.2 LGS).","convocatoria":"Convocatoria: acto que abre el procedimiento de concesión, fija el crédito disponible y el plazo de solicitud, y desarrolla las bases reguladoras.","plan":"Plan estratégico de subvenciones: documento previo al establecimiento de subvenciones donde se concretan objetivos, efectos, plazo, costes previsibles y fuentes de financiación (art. 8.1 LGS).","bdns":"Base de Datos Nacional de Subvenciones (BDNS): registro estatal, administrado por la IGAE, que opera como Sistema Nacional de Publicidad de Subvenciones (arts. 18 y 20 LGS).","prohibiciones":"Prohibiciones para ser beneficiario: circunstancias tasadas del art. 13.2 LGS que impiden obtener la condición de beneficiario o de entidad colaboradora.","concurrencia":"Concurrencia: principio conforme al cual las subvenciones se otorgan comparando solicitudes en condiciones de igualdad, y no de forma discrecional.","reintegro":"Reintegro: devolución de la subvención percibida más los intereses de demora cuando concurre alguna de las causas del art. 37 LGS."
};
const ARTS=[{n:1,t:"Objeto",ubic:"Título Preliminar (Disposiciones generales) ▸ Capítulo I (Del ámbito de aplicación de la ley)",idea:"Regula el régimen jurídico general de las subvenciones de las Administraciones públicas.",literal:`<p>Esta ley tiene por objeto la regulación del régimen jurídico general de las subvenciones otorgadas por las Administraciones públicas.</p>`,dis:`<ul>
<li><b>Objeto único:</b> la regulación del <b>régimen jurídico general</b> de las subvenciones otorgadas por las Administraciones públicas.</li>
<li><b>Carácter:</b> es una ley <b>general y básica</b> en gran parte de su articulado (véase su disposición final primera), aplicable por tanto a las entidades locales.</li>
</ul>
<div class="box ej"><span class="lbl">Norma utilizada</span><b>Ley 38/2003, de 17 de noviembre, General de Subvenciones</b> (documento 8 de la biblioteca), texto consolidado con última modificación de <b>2 de agosto de 2024</b>. Su desarrollo reglamentario es el <b>RD 887/2006</b>, <i>norma no incluida en la biblioteca</i>.</div>`,llano:`<p>Un artículo de una línea que hace mucho trabajo: antes de 2003 cada Administración subvencionaba a su manera. Esta ley pone reglas comunes para todo el dinero público que se entrega sin pedir nada material a cambio.</p>`,porque:`<p>La actividad de <span class="t" data-k="fomento">fomento</span> mueve miles de millones y era, hasta esta ley, el terreno menos regulado de la actividad administrativa: sin procedimiento común, sin publicidad obligatoria y sin control homogéneo. La LGS extiende a las subvenciones la misma lógica que la legislación de contratos había impuesto a las compras públicas: <b>publicidad, concurrencia y control</b>.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> el reglamento común de una beca: antes cada facultad la daba a su criterio; ahora hay unas reglas iguales para todas.</li>
<li><b>Real:</b> una convocatoria municipal de ayudas a asociaciones vecinales se rige por esta ley aunque la conceda un ayuntamiento de 3.000 habitantes.</li>
</ul>`,noej:`<ul>
<li><b>No regula</b> los contratos públicos: para eso está la Ley 9/2017 (documento 7 de la biblioteca).</li>
<li><b>No regula</b> las prestaciones de la Seguridad Social, expresamente excluidas del concepto de subvención (art. 2.4).</li>
</ul>`,conex:`<ul>
<li><b>Art. 3 LGS:</b> a qué Administraciones se aplica.</li>
<li><b>Disposición final primera LGS:</b> qué preceptos son legislación básica.</li>
<li><b>Art. 189.2 TRLHL</b> (documento 5): acreditación previa y justificación posterior en las subvenciones locales.</li>
</ul>`,trampas:`<ul>
<li>Regula el <b>régimen jurídico general</b>, no todas las subvenciones: hay exclusiones (art. 4) y supuestos que no son subvención (art. 2.4).</li>
</ul>`,ancla:`<p><b>"Una ley para todo el dinero que se da sin pedir nada a cambio."</b></p>`,vis:`<svg viewBox="0 0 640 120" role="img" aria-label="Objeto de la Ley General de Subvenciones">
<rect x="120" y="25" width="400" height="60" rx="10" fill="var(--acc)" stroke="var(--acc)"/>
<text x="320" y="50" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">LEY 38/2003, GENERAL DE SUBVENCIONES</text>
<text x="320" y="72" text-anchor="middle" font-size="11" fill="#fff">régimen jurídico general de las subvenciones de las Administraciones públicas</text>
<text x="320" y="106" text-anchor="middle" font-size="10" fill="var(--ink2)">Desarrollo reglamentario: RD 887/2006 (norma externa a la biblioteca)</text>
</svg>`},
{n:2,t:"Concepto de subvención",ubic:"Título Preliminar (Disposiciones generales) ▸ Capítulo I (Del ámbito de aplicación de la ley)",idea:"Tres requisitos hacen que una entrega de dinero sea subvención; hay supuestos que nunca lo son.",literal:`<p>1. Se entiende por subvención, a los efectos de esta ley, toda disposición dineraria realizada por cualesquiera de los sujetos contemplados en el artículo 3 de esta ley, a favor de personas públicas o privadas, y que cumpla los siguientes requisitos:</p><p>a) Que la entrega se realice sin contraprestación directa de los beneficiarios.</p><p>b) Que la entrega esté sujeta al cumplimiento de un determinado objetivo, la ejecución de un proyecto, la realización de una actividad, la adopción de un comportamiento singular, ya realizados o por desarrollar, o la concurrencia de una situación, debiendo el beneficiario cumplir las obligaciones materiales y formales que se hubieran establecido.</p><p>c) Que el proyecto, la acción, conducta o situación financiada tenga por objeto el fomento de una actividad de utilidad pública o interés social o de promoción de una finalidad pública.</p><p>2. No están comprendidas en el ámbito de aplicación de esta ley las aportaciones dinerarias entre diferentes Administraciones públicas, para financiar globalmente la actividad de la Administración a la que vayan destinadas, y las que se realicen entre los distintos agentes de una Administración cuyos presupuestos se integren en los Presupuestos Generales de la Administración a la que pertenezcan, tanto si se destinan a financiar globalmente su actividad como a la realización de actuaciones concretas a desarrollar en el marco de las funciones que tenga atribuidas, siempre que no resulten de una convocatoria pública.</p><p>3. Tampoco estarán comprendidas en el ámbito de aplicación de esta ley las aportaciones dinerarias que en concepto de cuotas, tanto ordinarias como extraordinarias, realicen las entidades que integran la Administración local a favor de las asociaciones a que se refiere la disposición adicional quinta de la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local.</p><p>4. No tienen carácter de subvenciones los siguientes supuestos:</p><p>a) Las prestaciones contributivas y no contributivas del Sistema de la Seguridad Social.</p><p>b) Las pensiones asistenciales por ancianidad a favor de los españoles no residentes en España, en los términos establecidos en su normativa reguladora.</p><p>c) También quedarán excluidas, en la medida en que resulten asimilables al régimen de prestaciones no contributivas del Sistema de Seguridad Social, las prestaciones asistenciales y los subsidios económicos a favor de españoles no residentes en España, así como las prestaciones a favor de los afectados por el virus de inmunodeficiencia humana y de los minusválidos.</p><p>d) Las prestaciones a favor de los afectados por el síndrome tóxico y las ayudas sociales a las personas con hemofilia u otras coagulopatías congénitas que hayan desarrollado la hepatitis C reguladas en la Ley 14/2002, de 5 de junio.</p><p>e) Las prestaciones derivadas del sistema de clases pasivas del Estado, pensiones de guerra y otras pensiones y prestaciones por razón de actos de terrorismo.</p><p>f) Las prestaciones reconocidas por el Fondo de Garantía Salarial.</p><p>g) Los beneficios fiscales y beneficios en la cotización a la Seguridad Social.</p><p>h) El crédito oficial, salvo en los supuestos en que la Administración pública subvencione al prestatario la totalidad o parte de los intereses u otras contraprestaciones de la operación de crédito.</p><p>i) Las ayudas económicas a las víctimas de violencia de género concedidas según lo establecido en el artículo 27 de la Ley Orgánica 1/2004, de 28 de diciembre, de Medidas de Protección Integral contra la Violencia de Género, a las víctimas de violencias sexuales concedidas según lo establecido en el artículo 41 de la Ley Orgánica de garantía integral de la libertad sexual y en la Ley 35/1995, de 11 de diciembre, de ayudas y asistencia a las víctimas de delitos violentos y contra la libertad sexual.</p>`,dis:`<div class="box ej"><span class="lbl">Los tres requisitos del art. 2.1 — han de darse los tres</span>
<ol><li><b>a)</b> entrega <b>sin contraprestación directa</b> de los beneficiarios;</li>
<li><b>b)</b> sujeta al cumplimiento de un <b>objetivo, proyecto, actividad, comportamiento singular</b> —ya realizados o por desarrollar— o a la <b>concurrencia de una situación</b>, con obligaciones materiales y formales para el beneficiario;</li>
<li><b>c)</b> que lo financiado tenga por objeto el <b>fomento de una actividad de utilidad pública o interés social o la promoción de una finalidad pública</b>.</li></ol></div>
<table><thead><tr><th>Apdo.</th><th>Qué queda fuera</th></tr></thead><tbody>
<tr><td><b>2.2</b></td><td>Aportaciones dinerarias <b>entre Administraciones</b> para financiar globalmente su actividad, y las que se realicen entre agentes de una misma Administración</td></tr>
<tr><td><b>2.3</b></td><td>Cuotas, ordinarias o extraordinarias, de las entidades locales a las <b>asociaciones de la disposición adicional quinta de la LBRL</b> (por ejemplo, la FEMP)</td></tr>
<tr><td><b>2.4</b></td><td><b>No tienen carácter de subvención:</b> prestaciones contributivas y no contributivas de la Seguridad Social · pensiones asistenciales por ancianidad · prestaciones asimilables · síndrome tóxico y hemofilia con hepatitis C · clases pasivas, pensiones de guerra y terrorismo · FOGASA · <b>beneficios fiscales y en la cotización</b> · <b>crédito oficial</b>, salvo que se subvencionen los intereses · ayudas a víctimas de violencia de género y sexual</td></tr>
</tbody></table>`,llano:`<p>Para que algo sea subvención tienen que darse tres cosas a la vez: que te den dinero sin que entregues nada a cambio, que ese dinero vaya atado al cumplimiento de algo, y que sirva a un fin de interés general. Si falta una, no es subvención. Y hay una lista de cosas que, aunque se parezcan, la ley dice expresamente que no lo son: las pensiones, el paro, las desgravaciones fiscales.</p>`,porque:`<p>La definición separa la subvención de sus dos vecinos peligrosos: del <b>contrato</b>, porque en el contrato sí hay contraprestación directa; y de la <b>prestación social</b>, porque esta responde a un derecho subjetivo del ciudadano y no a una política de fomento. Sin esa frontera, o se contrataría sin licitar llamándolo subvención, o se sometería a concurrencia competitiva el cobro de una pensión.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> no es lo mismo que te paguen por pintar una pared (contrato) que te den dinero para que pintes la tuya y mejore la calle (subvención).</li>
<li><b>Real:</b> un ayuntamiento concede 12.000 € a un club deportivo para su escuela de base: sin contraprestación, atado a una actividad concreta y con finalidad de interés social. Es subvención.</li>
<li><b>Caso límite:</b> el mismo ayuntamiento paga 12.000 € a una empresa por organizar un torneo municipal: hay <b>contraprestación directa</b> a favor del ayuntamiento, luego es un <b>contrato de servicios</b> (Ley 9/2017), no una subvención.</li>
</ul>`,noej:`<ul>
<li><b>No es subvención</b> una bonificación en el IBI: es un <b>beneficio fiscal</b> (art. 2.4.g).</li>
<li><b>No es subvención</b> la transferencia del ayuntamiento a su patronato para financiar globalmente su actividad (art. 2.2).</li>
<li><b>No es subvención</b> la cuota que el ayuntamiento paga a la FEMP (art. 2.3).</li>
</ul>`,conex:`<ul>
<li><b>Art. 4 LGS:</b> exclusiones del ámbito de aplicación, distintas de los supuestos que no son subvención.</li>
<li><b>Art. 2.1 de la Ley 9/2017</b> (documento 7): concepto de contrato oneroso, la figura de contraste.</li>
<li><b>Art. 165.2 TRLHL</b> (documento 5): ingresos afectados, frecuentemente de origen subvencional.</li>
</ul>`,trampas:`<ul>
<li>Los tres requisitos del 2.1 son <b>cumulativos</b>.</li>
<li>Distingue: el <b>art. 2.4</b> dice que ciertos supuestos <b>no son subvención</b>; el <b>art. 4</b> excluye del ámbito de la ley cosas que sí lo son.</li>
<li>El <b>crédito oficial</b> no es subvención <b>salvo</b> que la Administración subvencione los intereses u otras contraprestaciones.</li>
<li>La entrega puede referirse a actividades <b>ya realizadas</b>, no solo futuras.</li>
</ul>`,ancla:`<p><b>Las tres patas: SIN contraprestación · CON obligación · PARA interés general.</b> Si falla una pata, la mesa no es subvención.</p>`,vis:`<svg viewBox="0 0 640 175" role="img" aria-label="Requisitos del concepto de subvención">
<g font-size="10" text-anchor="middle" fill="currentColor">
<rect x="20" y="30" width="185" height="66" rx="8" fill="var(--acc-soft)" stroke="var(--acc)"/><text x="112" y="53" font-size="11" font-weight="700" fill="var(--acc)">a) Sin contraprestación</text><text x="112" y="73">directa del beneficiario</text><text x="112" y="88" fill="var(--ink2)">frente al contrato</text>
<rect x="225" y="30" width="190" height="66" rx="8" fill="var(--ej-bg)" stroke="var(--ej)"/><text x="320" y="53" font-size="11" font-weight="700" fill="var(--ej)">b) Sujeta a un fin</text><text x="320" y="73">objetivo, proyecto, actividad,</text><text x="320" y="88">conducta o situación</text>
<rect x="435" y="30" width="185" height="66" rx="8" fill="var(--warn-bg)" stroke="var(--warn)"/><text x="527" y="53" font-size="11" font-weight="700" fill="var(--warn)">c) Finalidad pública</text><text x="527" y="73">utilidad pública, interés</text><text x="527" y="88">social o finalidad pública</text>
</g>

<text x="320" y="132" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">= SUBVENCIÓN (art. 2.1)</text>
<text x="320" y="162" text-anchor="middle" font-size="10" fill="var(--exc)">Nunca lo son: pensiones y prestaciones de la Seguridad Social · beneficios fiscales · crédito oficial (art. 2.4)</text>
</svg>`},
{n:3,t:"Ámbito de aplicación subjetivo",ubic:"Título Preliminar (Disposiciones generales) ▸ Capítulo I (Del ámbito de aplicación de la ley)",idea:"Se aplica al Estado, comunidades autónomas y entidades locales, y a sus entes públicos.",literal:`<p>Las subvenciones otorgadas por las Administraciones públicas se ajustarán a las prescripciones de esta ley.</p><p>1. Se entiende por Administraciones públicas a los efectos de esta ley:</p><p>a) La Administración General del Estado.</p><p>b) Las entidades que integran la Administración local.</p><p>c) La Administración de las comunidades autónomas.</p><p>2. Deberán asimismo ajustarse a esta ley las subvenciones otorgadas por los organismos y demás entidades de derecho público con personalidad jurídica propia vinculadas o dependientes de cualquiera de las Administraciones públicas en la medida en que las subvenciones que otorguen sean consecuencia del ejercicio de potestades administrativas.</p><p>Serán de aplicación los principios de gestión contenidos en esta ley y los de información a que se hace referencia en el artículo 20 al resto de las entregas dinerarias sin contraprestación, que realicen los entes del párrafo anterior que se rijan por derecho privado. En todo caso, las aportaciones gratuitas habrán de tener relación directa con el objeto de la actividad contenido en la norma de creación o en sus estatutos.</p><p>3. Los preceptos de esta ley serán de aplicación a la actividad subvencional de las Administraciones de las comunidades autónomas, así como a los organismos públicos y las restantes entidades de derecho público con personalidad jurídica propia vinculadas o dependientes de las mismas, de acuerdo con lo establecido en la disposición final primera.</p><p>4. Será igualmente aplicable esta ley a las siguientes subvenciones:</p><p>a) Las establecidas en materias cuya regulación plena o básica corresponda al Estado y cuya gestión sea competencia total o parcial de otras Administraciones públicas.</p><p>b) Aquellas en cuya tramitación intervengan órganos de la Administración General del Estado o de las entidades de derecho público vinculadas o dependientes de aquélla, conjuntamente con otras Administraciones, en cuanto a las fases del procedimiento que corresponda gestionar a dichos órganos.</p>`,dis:`<ul>
<li><b>3.1 — Administraciones públicas:</b> la <b>AGE</b>, las <b>entidades que integran la Administración local</b> y la <b>Administración de las comunidades autónomas</b>.</li>
<li><b>3.2 — entes instrumentales:</b> los organismos y demás entidades de derecho público con personalidad propia vinculados o dependientes, <b>en la medida en que las subvenciones que otorguen sean consecuencia del ejercicio de potestades administrativas</b>. A las restantes entregas dinerarias sin contraprestación de entes que se rijan por derecho privado se les aplican los <b>principios de gestión</b> de la ley y los de <b>información del art. 20</b>, y las aportaciones han de tener relación directa con su objeto estatutario.</li>
<li><b>3.3 — comunidades autónomas:</b> aplicación conforme a la <b>disposición final primera</b> (títulos competenciales).</li>
<li><b>3.4 — supuestos añadidos:</b> a) subvenciones en materias de regulación estatal plena o básica gestionadas por otras Administraciones; b) aquellas en cuya tramitación intervengan órganos estatales junto con otras Administraciones, en las fases que les corresponda gestionar.</li>
</ul>`,llano:`<p>La ley alcanza a las tres Administraciones territoriales y a sus organismos. Con los entes que actúan en derecho privado la ley es más suave: no se les aplica entera, pero sí sus principios y la obligación de informar a la base de datos nacional.</p>`,porque:`<p>El criterio no es la forma jurídica del ente, sino si la ayuda es <b>consecuencia del ejercicio de potestades administrativas</b>. Así se evita que crear una sociedad o una fundación sirva para repartir dinero público sin reglas. Y la extensión de los principios a las entregas en régimen privado cierra la última rendija: el dinero puede salir por vías distintas, pero la transparencia se mantiene.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> las normas de la casa se aplican también a los hijos que ya viven fuera pero siguen usando la tarjeta familiar.</li>
<li><b>Real:</b> un patronato municipal de cultura que convoca ayudas a grupos de teatro aplica la LGS íntegramente (art. 3.2, primer párrafo).</li>
<li><b>Caso límite:</b> una sociedad mercantil municipal que entrega fondos a una entidad social sin ejercer potestades administrativas: se le aplican los <b>principios de gestión</b> y la obligación de informar a la BDNS, no toda la ley.</li>
</ul>`,noej:`<ul>
<li><b>No basta</b> con ser ente público para que se aplique toda la ley: hace falta que la subvención derive del ejercicio de potestades administrativas.</li>
<li><b>No quedan</b> las entregas en derecho privado libres de reglas: rigen los principios y el art. 20.</li>
</ul>`,conex:`<ul>
<li><b>Art. 20 LGS:</b> obligación de suministrar información a la BDNS.</li>
<li><b>Art. 8.3 LGS:</b> los principios de gestión que se extienden a esas entregas.</li>
<li><b>Art. 3 de la Ley 9/2017</b> (documento 7): los tres círculos del sector público, con lógica paralela.</li>
<li><b>Arts. 84 y ss. LRJSP</b> (documento 2): composición del sector público institucional.</li>
</ul>`,trampas:`<ul>
<li>El orden del 3.1: <b>AGE, entidades locales y comunidades autónomas</b> — así, literalmente.</li>
<li>La clave del 3.2 es el <b>ejercicio de potestades administrativas</b>.</li>
<li>A los entes en régimen privado se les aplican <b>los principios y el art. 20</b>, no la ley completa.</li>
</ul>`,ancla:`<p><b>"Si mandas como Administración, ley entera; si actúas como empresa, principios y BDNS."</b></p>`,vis:`<svg viewBox="0 0 640 165" role="img" aria-label="Ámbito subjetivo de la Ley General de Subvenciones">

{n:4,t:"Exclusiones del ámbito de aplicación de la ley",ubic:"Título Preliminar (Disposiciones generales) ▸ Capítulo I (Del ámbito de aplicación de la ley)",idea:"Cuatro exclusiones: premios sin solicitud, electorales, partidos y grupos políticos.",literal:`<p>Quedan excluidos del ámbito de aplicación de esta ley:</p><p>a) Los premios que se otorguen sin la previa solicitud del beneficiario.</p><p>b) Las subvenciones previstas en la Ley Orgánica 5/1985, de 19 de junio, del Régimen Electoral General.</p><p>c) Las subvenciones reguladas en la Ley Orgánica 3/1987, de 2 de julio, de Financiación de los Partidos Políticos.</p><p>d) Las subvenciones a los grupos parlamentarios de las Cámaras de las Cortes Generales, en los términos previstos en los Reglamentos del Congreso de los Diputados y del Senado, así como las subvenciones a los grupos parlamentarios de las Asambleas autonómicas y a los grupos políticos de las corporaciones locales, según establezca su propia normativa.</p>`,dis:`<table><thead><tr><th>Letra</th><th>Queda excluido</th><th>Norma que lo regula</th></tr></thead><tbody>
<tr><td><b>a)</b></td><td>Los <b>premios</b> que se otorguen <b>sin la previa solicitud</b> del beneficiario</td><td>Su propia convocatoria</td></tr>
<tr><td><b>b)</b></td><td>Subvenciones previstas en la <b>LO 5/1985, del Régimen Electoral General</b></td><td>LOREG</td></tr>
<tr><td><b>c)</b></td><td>Subvenciones reguladas en la <b>LO 3/1987, de Financiación de los Partidos Políticos</b></td><td>Su ley específica</td></tr>
<tr><td><b>d)</b></td><td>Subvenciones a los <b>grupos parlamentarios</b> de las Cortes y de las Asambleas autonómicas y a los <b>grupos políticos de las corporaciones locales</b></td><td>Reglamentos de las Cámaras y normativa propia</td></tr>
</tbody></table>`,llano:`<p>Cuatro cosas quedan fuera del alcance de la ley. La más práctica para una entidad local es la última: lo que el ayuntamiento asigna a los grupos políticos municipales no se rige por la Ley de Subvenciones, sino por su propia normativa. Y los premios solo quedan fuera si se conceden sin que nadie los haya pedido.</p>`,porque:`<p>Cada exclusión responde a una razón distinta: los <b>premios sin solicitud</b> carecen de procedimiento a instancia de parte; las <b>subvenciones electorales y a partidos</b> tienen leyes orgánicas propias que responden a exigencias constitucionales de pluralismo; y las asignaciones a los <b>grupos políticos</b> son un instrumento de funcionamiento institucional, no de fomento.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> un premio sorpresa que te dan sin haberte presentado a nada.</li>
<li><b>Real:</b> la asignación económica que un ayuntamiento entrega cada mes a los grupos políticos municipales: excluida por el art. 4.d).</li>
<li><b>Caso límite:</b> un certamen literario municipal al que hay que presentar obra: hay <b>solicitud previa</b>, luego <b>no</b> está excluido y se rige por la LGS.</li>
</ul>`,noej:`<ul>
<li><b>No está excluido</b> un premio con convocatoria a la que los interesados concurren: la exclusión exige ausencia de solicitud previa.</li>
<li><b>No están excluidas</b> las subvenciones a asociaciones vinculadas a partidos, si no encajan en las letras b), c) o d).</li>
</ul>`,conex:`<ul>
<li><b>Art. 2.4 LGS:</b> supuestos que no son subvención, distintos de estas exclusiones.</li>
<li><b>Art. 3.4 de la Ley 9/2017</b> (documento 7): obligaciones de los partidos políticos como poderes adjudicadores en contratos SARA.</li>
<li><b>Art. 11.5 de la Ley 9/2017:</b> exclusión de los servicios de campañas políticas.</li>
</ul>`,trampas:`<ul>
<li>La letra a) exige que <b>no haya solicitud previa</b> del beneficiario.</li>
<li>Son <b>cuatro</b> letras y la d) incluye tres destinatarios: grupos parlamentarios estatales, autonómicos y grupos políticos locales.</li>
</ul>`,ancla:`<p><b>"P-E-P-G":</b> <b>P</b>remios sin solicitud · <b>E</b>lectorales · <b>P</b>artidos · <b>G</b>rupos políticos.</p>`,vis:`<svg viewBox="0 0 640 130" role="img" aria-label="Exclusiones del ámbito de la ley">

<rect x="172" y="35" width="145" height="60" rx="8" fill="var(--exc-bg)" stroke="var(--exc)"/><text x="244" y="60" font-size="11" font-weight="700" fill="var(--exc)">b) Electorales</text><text x="244" y="80">LO 5/1985</text>
<rect x="329" y="35" width="145" height="60" rx="8" fill="var(--exc-bg)" stroke="var(--exc)"/><text x="401" y="60" font-size="11" font-weight="700" fill="var(--exc)">c) Partidos</text><text x="401" y="80">LO 3/1987</text>
<rect x="486" y="35" width="139" height="60" rx="8" fill="var(--exc-bg)" stroke="var(--exc)"/><text x="555" y="60" font-size="11" font-weight="700" fill="var(--exc)">d) Grupos</text><text x="555" y="80">parlamentarios y políticos</text>
</g>
<text x="320" y="118" text-anchor="middle" font-size="10" fill="var(--ink2)">Se rigen por su propia normativa, no por la LGS</text>
</svg>`},
{n:5,t:"Régimen jurídico de las subvenciones",ubic:"Título Preliminar (Disposiciones generales) ▸ Capítulo I (Del ámbito de aplicación de la ley)",idea:"Rigen esta ley y el derecho administrativo; en su defecto, el derecho privado.",literal:`<p>1. Las subvenciones se regirán, en los términos establecidos en el artículo 3, por esta ley y sus disposiciones de desarrollo, las restantes normas de derecho administrativo, y, en su defecto, se aplicarán las normas de derecho privado.</p><p>2. Las subvenciones que se otorguen por consorcios, mancomunidades u otras personificaciones públicas creadas por varias Administraciones públicas u organismos o</p><p>entes dependientes de ellas y las subvenciones que deriven de convenios formalizados entre éstas se regularán de acuerdo con lo establecido en el instrumento jurídico de creación o en el propio convenio que, en todo caso, deberán ajustarse a las disposiciones contenidas en esta ley.</p>`,dis:`<ul>
<li><b>5.1 — orden de fuentes:</b> <b>1)</b> esta ley y sus disposiciones de desarrollo · <b>2)</b> las restantes normas de <b>derecho administrativo</b> · <b>3)</b> en su defecto, las normas de <b>derecho privado</b>.</li>
<li><b>5.2 — entes creados por varias Administraciones:</b> las subvenciones de <b>consorcios, mancomunidades u otras personificaciones públicas</b> creadas por varias Administraciones, y las que deriven de <b>convenios</b> entre ellas, se regulan por el <b>instrumento de creación o el propio convenio</b>, que <b>en todo caso deberán ajustarse a esta ley</b>.</li>
</ul>`,llano:`<p>Primero manda esta ley y su reglamento; si algo no está previsto, el resto del derecho administrativo; y solo al final, el derecho privado. Los consorcios y mancomunidades pueden tener sus propias reglas, pero no pueden contradecir la ley.</p>`,porque:`<p>El orden de prelación deja claro que la subvención es una institución <b>administrativa</b>, no un negocio privado de liberalidad. Y la coletilla del apartado 2 —"en todo caso deberán ajustarse"— impide que la creación de un ente común sirva para diseñar un régimen subvencional a la carta.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> el reglamento de una comunidad de propietarios: primero la ley, luego los estatutos, y solo después la costumbre.</li>
<li><b>Real:</b> un consorcio de residuos formado por diez municipios regula sus ayudas en sus estatutos, pero el régimen de reintegro y de justificación no puede apartarse de la LGS.</li>
</ul>`,noej:`<ul>
<li><b>No cabe</b> aplicar directamente el derecho privado: solo en defecto de norma administrativa.</li>
</ul>`,conex:`<ul>
<li><b>Art. 20.4 LGS:</b> los consorcios y mancomunidades del art. 5 están obligados a suministrar información a la BDNS.</li>
<li><b>Arts. 47 a 53 LRJSP</b> (documento 2): régimen de los convenios.</li>
<li><b>Art. 25.2 de la Ley 9/2017</b> (documento 7): orden de fuentes paralelo en los contratos administrativos.</li>
</ul>`,trampas:`<ul>
<li>Tres escalones: <b>LGS → resto del derecho administrativo → derecho privado</b>.</li>
<li>La regla del 5.2 se aplica también a las subvenciones <b>derivadas de convenios</b> entre Administraciones.</li>
</ul>`,ancla:`<p><b>"Ley, administrativo y, si no hay nada, privado."</b> Y los entes comunes: reglas propias, pero <b>ajustadas a la ley</b>.</p>`,vis:`<svg viewBox="0 0 640 130" role="img" aria-label="Orden de fuentes de las subvenciones">

</svg>`},
{n:6,t:"Régimen jurídico de las subvenciones financiadas con cargo a fondos de la Unión Europea",ubic:"Título Preliminar (Disposiciones generales) ▸ Capítulo I (Del ámbito de aplicación de la ley)",idea:"Las subvenciones de fondos europeos se rigen antes por el derecho de la Unión.",literal:`<p>1. Las subvenciones financiadas con cargo a fondos de la Unión Europea se regirán por las normas comunitarias aplicables en cada caso y por las normas nacionales de desarrollo o transposición de aquéllas.</p><p>2. Los procedimientos de concesión y de control de las subvenciones regulados en esta ley tendrán carácter supletorio respecto de las normas de aplicación directa a las subvenciones financiadas con cargo a fondos de la Unión Europea.</p>`,dis:`<ul>
<li><b>Prelación:</b> las subvenciones financiadas con cargo a <b>fondos de la Unión Europea</b> se rigen por las <b>normas comunitarias</b> aplicables en cada caso y por las normas nacionales de desarrollo o transposición.</li>
<li><b>Papel de la LGS:</b> los procedimientos de concesión y control son los de esta ley <b>en lo que no se oponga</b> a la normativa comunitaria.</li>
</ul>`,llano:`<p>Cuando el dinero viene de Europa, mandan las reglas europeas. La ley española se aplica en todo lo que no las contradiga, sobre todo en la parte de procedimiento y control.</p>`,porque:`<p>Es la aplicación del <b>principio de primacía</b> del derecho de la Unión. Los fondos europeos llevan aparejadas condiciones de elegibilidad, auditoría y corrección financiera propias, y un Estado no puede rebajarlas aplicando su ley interna.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> si juegas con dinero prestado, aceptas las condiciones de quien te lo presta.</li>
<li><b>Real:</b> una ayuda municipal cofinanciada por el FEDER debe respetar las reglas europeas de elegibilidad del gasto y de publicidad, aunque la LGS diga otra cosa.</li>
</ul>`,noej:`<ul>
<li><b>No desplaza</b> el derecho europeo a la LGS en bloque: esta se aplica en lo no contradictorio.</li>
</ul>`,conex:`<ul>
<li><b>Art. 7 LGS:</b> responsabilidad financiera derivada de la gestión de fondos europeos.</li>
<li><b>Art. 9.1 LGS:</b> comunicación previa a la Comisión Europea de los proyectos de subvención.</li>
</ul>`,trampas:`<ul>
<li>La LGS no desaparece: rige <b>en lo que no se oponga</b> a la normativa de la Unión.</li>
</ul>`,ancla:`<p><b>"Dinero europeo, reglas europeas."</b></p>`,vis:`<svg viewBox="0 0 640 115" role="img" aria-label="Subvenciones financiadas con fondos europeos">
<rect x="70" y="30" width="220" height="52" rx="8" fill="var(--acc)" stroke="var(--acc)"/>

<script>
const PLAZOS=[["12 millones €", "Cuantía que exige autorización previa del Consejo de Ministros", "AGE", "10.2 LGS", "Antes de aprobar la convocatoria en concurrencia competitiva"], ["30.000 €", "Umbral a partir del cual las empresas acreditan cumplir los plazos de pago", "Beneficiario", "13.3 bis LGS", "Ley 3/2004 de morosidad"], ["10 días hábiles", "Plazo para acreditar el cumplimiento de los plazos de pago", "Beneficiario", "13.3 bis LGS", "Desde la notificación de la propuesta provisional"], ["10 años", "Permanencia en la BDNS de las prohibiciones de las letras a) y h)", "IGAE", "20.2 LGS", "Desde la finalización del plazo de prohibición"], ["4 años", "Duración máxima del convenio con la entidad colaboradora", "Órgano concedente", "16.2 LGS", "Prórrogas no superiores a la vigencia inicial"], ["Coste de la actividad", "Límite absoluto del importe de la subvención sumadas todas las ayudas", "Beneficiario", "19.3 LGS", "Aisladamente o en concurrencia"], ["Antes de la propuesta", "Momento de acreditar estar al corriente con Hacienda y la Seguridad Social", "Beneficiario", "14.1.e) LGS", "Propuesta de resolución de concesión"], ["Antes de justificar", "Plazo límite para comunicar la obtención de otras ayudas", "Beneficiario", "14.1.d) LGS", "Y tan pronto como se conozca"], ["Previo", "Momento del plan estratégico de subvenciones", "Administración", "8.1 LGS", "Con carácter previo al establecimiento de la subvención"], ["Previa", "Aprobación y publicación de las bases reguladoras", "Administración", "9.2 y 9.3 LGS", "BOE o diario oficial correspondiente"]];
const FLASH=[["¿Cuál es el objeto de la Ley 38/2003?", "La regulación del <b>régimen jurídico general</b> de las subvenciones otorgadas por las Administraciones públicas (art. 1)."], ["Los tres requisitos del concepto de subvención", "a) entrega <b>sin contraprestación directa</b> · b) sujeta al cumplimiento de un objetivo, proyecto, actividad, conducta o situación · c) con <b>finalidad de fomento</b> de utilidad pública, interés social o promoción de una finalidad pública (art. 2.1)."], ["Cita cuatro supuestos que NO tienen carácter de subvención", "Prestaciones de la Seguridad Social · pensiones asistenciales por ancianidad · <b>beneficios fiscales y en la cotización</b> · <b>crédito oficial</b>, salvo que se subvencionen los intereses (art. 2.4)."], ["¿Qué se entiende por Administraciones públicas en la LGS?", "La AGE, las entidades que integran la Administración local y la Administración de las comunidades autónomas (art. 3.1)."], ["¿Cuándo se aplica la ley a los entes instrumentales?", "Cuando las subvenciones que otorguen sean <b>consecuencia del ejercicio de potestades administrativas</b>; si actúan en derecho privado, se les aplican los principios de gestión y el art. 20 (art. 3.2)."], ["Las cuatro exclusiones del art. 4", "Premios sin previa solicitud · subvenciones electorales (LO 5/1985) · financiación de partidos (LO 3/1987) · grupos parlamentarios y grupos políticos locales."], ["Orden de fuentes de las subvenciones", "LGS y su desarrollo · restantes normas de derecho administrativo · en su defecto, derecho privado (art. 5.1)."], ["¿Qué es el plan estratégico de subvenciones?", "Documento <b>previo</b> donde se concretan objetivos, efectos, plazo, costes previsibles y fuentes de financiación (art. 8.1)."], ["Los principios de gestión del art. 8.3", "Publicidad, transparencia, concurrencia, objetividad, igualdad y no discriminación · <b>eficacia</b> en los objetivos · <b>eficiencia</b> en los recursos."], ["Los cinco requisitos del art. 9.4", "Competencia del órgano · crédito adecuado y suficiente · tramitación del procedimiento · fiscalización previa · aprobación del gasto."], ["¿Dónde se publican las bases reguladoras?", "En el <b>BOE o en el diario oficial correspondiente</b> (art. 9.3)."], ["¿Qué subvenciones estatales exigen autorización del Consejo de Ministros?", "Las de cuantía <b>superior a 12 millones de euros</b>; en concurrencia competitiva, antes de aprobar la convocatoria (art. 10.2)."], ["¿Quién es competente para conceder en las corporaciones locales?", "Los órganos que tengan atribuidas tales funciones en la <b>legislación de régimen local</b> (art. 10.4)."], ["¿Quién es beneficiario?", "Quien haya de <b>realizar la actividad</b> que fundamentó el otorgamiento o quien se encuentre en la <b>situación</b> que legitima su concesión (art. 11.1)."], ["Requisitos de las agrupaciones sin personalidad", "Previsión expresa en las bases · compromisos e importes de cada miembro en solicitud y resolución · <b>representante único</b> · no disolverse hasta la prescripción (art. 11.3)."], ["¿Qué es una entidad colaboradora?", "La que, en nombre y por cuenta del órgano concedente, <b>entrega y distribuye los fondos</b> o colabora en la gestión sin recibirlos (art. 12.1)."], ["Cita cinco prohibiciones para ser beneficiario", "Condena por delitos de corrupción · concurso · resolución culpable de contrato · no estar al corriente con Hacienda o la Seguridad Social · residencia fiscal en paraíso fiscal · reintegros pendientes · sanción firme (art. 13.2)."], ["¿Qué ocurre si la prohibición concurre en un miembro de una agrupación?", "No puede acceder a la condición de beneficiaria <b>ninguna</b> de las agrupaciones del art. 11.3 (art. 13.2.i)."], ["Las obligaciones del beneficiario", "Cumplir · justificar · someterse a comprobación y control · comunicar otras ayudas · estar al corriente · llevar contabilidad · conservar documentos · dar difusión · reintegrar (art. 14.1)."], ["¿Cuándo debe acreditar el beneficiario estar al corriente?", "Con anterioridad a dictarse la <b>propuesta de resolución de concesión</b> (art. 14.1.e)."], ["Obligaciones de la entidad colaboradora", "Entregar los fondos · comprobar · justificar la entrega · someterse a comprobación y control (art. 15.1)."], ["Duración máxima del convenio de colaboración", "<b>Cuatro años</b>, con prórrogas que no superen la vigencia del periodo inicial (art. 16.2)."], ["¿Cómo se aprueban las bases reguladoras en las corporaciones locales?", "En el marco de las <b>bases de ejecución del presupuesto</b>, mediante <b>ordenanza general</b> o <b>ordenanza específica</b> (art. 17.2)."], ["¿Qué límite absoluto tiene el importe de la subvención?", "No puede superar, aisladamente o en concurrencia con otras ayudas, el <b>coste de la actividad subvencionada</b> (art. 19.3)."], ["¿Qué ocurre con los rendimientos financieros de los fondos librados?", "<b>Incrementan</b> el importe de la subvención y se aplican a la actividad, salvo disposición motivada en contra en las bases (art. 19.5)."], ["¿Quién es el órgano responsable de la BDNS y quién suministra en las entidades locales?", "La <b>IGAE</b> es responsable; en las entidades locales suministra la <b>Intervención u órgano que designe</b> la entidad (art. 20.3 y 20.4)."], ["¿Dónde se regula el régimen de garantías?", "<b>Reglamentariamente</b> (art. 21); hoy, en el RD 887/2006, norma externa a la biblioteca."]];
const TEST=[{"a": 2, "q": "Para que una entrega dineraria sea subvención se exige:", "o": [["que sea sin contraprestación directa, sujeta a un fin y con finalidad de utilidad pública o interés social", 1, "Correcto: los tres requisitos cumulativos del art. 2.1 LGS."], ["únicamente que la conceda una Administración pública", 0, "El sujeto no basta: hacen falta los tres requisitos objetivos."], ["que exista contraprestación del beneficiario", 0, "Al contrario: la ausencia de contraprestación directa es lo que la distingue del contrato."], ["que se conceda en régimen de concurrencia competitiva", 0, "El procedimiento no forma parte del concepto."]]}, {"a": 2, "q": "Los beneficios fiscales tienen la consideración de subvención a efectos de la Ley 38/2003.", "vf": true, "ok": false, "fb": "<b>Falso.</b> El art. 2.4.g) LGS excluye expresamente los beneficios fiscales y los beneficios en la cotización a la Seguridad Social del concepto de subvención."}, {"a": 3, "q": "Las subvenciones otorgadas por un organismo autónomo local se rigen íntegramente por la LGS:", "o": [["cuando sean consecuencia del ejercicio de potestades administrativas", 1, "Correcto: art. 3.2 LGS. Si actúa en derecho privado, se le aplican los principios de gestión y el art. 20."], ["en todo caso, por su condición de ente público", 0, "El criterio es funcional, no orgánico."], ["nunca: solo se aplica a las Administraciones territoriales", 0, "El art. 3.2 los incluye expresamente."], ["solo si superan los 12 millones de euros", 0, "Esa cifra es la del art. 10.2, referida a la autorización del Consejo de Ministros."]]}, {"a": 4, "q": "¿Cuál de estas está excluida del ámbito de aplicación de la LGS?", "o": [["la subvención a los grupos políticos de una corporación local", 1, "Correcto: art. 4.d) LGS."], ["la subvención a una asociación vecinal para actividades culturales", 0, "Está plenamente sujeta a la ley."], ["un certamen literario municipal con presentación de obras", 0, "Hay solicitud previa, luego no encaja en el art. 4.a)."], ["una ayuda al alquiler concedida por un ayuntamiento", 0, "Sujeta a la ley."]]}, {"a": 8, "q": "Completa: «Los órganos que propongan el establecimiento de subvenciones deberán concretar, con carácter previo, en un ______ los objetivos y efectos que se pretenden».", "gap": "plan estratégico", "fb": "<b>Plan estratégico de subvenciones</b> (art. 8.1 LGS), con objetivos, efectos, plazo, costes previsibles y fuentes de financiación."}, {"a": 8, "q": "¿Cuál NO es un principio de gestión del art. 8.3 LGS?", "o": [["la libre designación del beneficiario por el órgano concedente", 1, "Correcto: sería lo contrario de los principios de concurrencia, objetividad e igualdad."], ["publicidad, transparencia y concurrencia", 0, "Sí lo son: letra a)."], ["eficacia en el cumplimiento de los objetivos", 0, "Sí lo es: letra b)."], ["eficiencia en la asignación y utilización de los recursos públicos", 0, "Sí lo es: letra c)."]]}, {"a": 9, "q": "Entre los requisitos previos al otorgamiento de una subvención figura:", "o": [["la existencia de crédito adecuado y suficiente", 1, "Correcto: art. 9.4.b) LGS, en línea con los arts. 172 y 173.5 del TRLHL."], ["la autorización del Tribunal de Cuentas", 0, "No interviene en la concesión."], ["el informe favorable de la BDNS", 0, "La BDNS registra y publica; no informa expedientes."], ["la aceptación previa del beneficiario", 0, "No es un requisito del art. 9.4."]]}, {"a": 10, "q": "La concesión de subvenciones estatales de cuantía superior a 12 millones de euros requiere:", "o": [["autorización previa del Consejo de Ministros o, en su caso, de la Comisión Delegada del Gobierno para Asuntos Económicos", 1, "Correcto: art. 10.2 LGS. La autorización no implica la aprobación del gasto."], ["informe previo del Tribunal de Cuentas", 0, "No está previsto."], ["aprobación por real decreto", 0, "El real decreto se exige para la desconcentración (art. 10.3)."], ["autorización de la Comisión Europea en todo caso", 0, "Solo cuando proceda por el régimen de ayudas de Estado (art. 9.1)."]]}, {"a": 11, "q": "Pueden ser beneficiarias las agrupaciones de personas sin personalidad jurídica:", "o": [["cuando se prevea expresamente en las bases reguladoras, con compromisos e importes por miembro y representante único", 1, "Correcto: art. 11.3 LGS."], ["siempre, por aplicación directa de la ley", 0, "Se exige previsión expresa en las bases."], ["nunca: se exige personalidad jurídica", 0, "La ley lo admite expresamente."], ["solo si se constituyen en sociedad antes del pago", 0, "No se exige transformarse."]]}, {"a": 12, "q": "La entidad colaboradora:", "o": [["actúa en nombre y por cuenta del órgano concedente, entregando los fondos o colaborando en la gestión", 1, "Correcto: art. 12.1 LGS."], ["es un tipo especial de beneficiario", 0, "No lo es: no realiza la actividad subvencionada ni se queda los fondos."], ["solo puede ser una entidad pública", 0, "También personas jurídicas privadas que reúnan las condiciones exigidas."], ["sustituye al órgano concedente en la resolución del procedimiento", 0, "No resuelve: colabora en la gestión."]]}, {"a": 13, "q": "¿Cuál de estas circunstancias NO impide obtener la condición de beneficiario?", "o": [["tener domicilio social fuera del municipio que concede la subvención", 1, "Correcto: no figura entre las prohibiciones del art. 13.2 y, además, sería discriminatorio."], ["no hallarse al corriente de obligaciones tributarias o con la Seguridad Social", 0, "Sí lo impide: letra e)."], ["tener la residencia fiscal en un paraíso fiscal", 0, "Sí lo impide: letra f)."], ["no estar al corriente de pago de obligaciones por reintegro de subvenciones", 0, "Sí lo impide: letra g)."]]}, {"a": 13, "q": "Completa: «Las prohibiciones afectarán también a las agrupaciones del artículo 11.3 cuando concurra alguna de ellas en ______ de sus miembros».", "gap": "cualquiera", "fb": "En <b>cualquiera</b> de sus miembros (art. 13.2.i LGS): la prohibición contagia a toda la agrupación."}, {"a": 14, "q": "El beneficiario debe comunicar la obtención de otras subvenciones o ingresos:", "o": [["tan pronto como se conozca y, en todo caso, con anterioridad a la justificación", 1, "Correcto: art. 14.1.d) LGS."], ["únicamente al presentar la solicitud", 0, "La obligación rige durante toda la vida de la subvención."], ["solo si superan el 50 % del coste", 0, "No hay umbral."], ["no existe tal obligación", 0, "Es una obligación expresa del art. 14.1.d)."]]}, {"a": 16, "q": "El convenio con la entidad colaboradora no podrá tener una vigencia superior a:", "o": [["cuatro años", 1, "Correcto: art. 16.2 LGS, con prórrogas que no superen la vigencia inicial."], ["dos años", 0, "No es el plazo del precepto."], ["seis años", 0, "No es el plazo del precepto."], ["el que libremente acuerden las partes", 0, "La ley fija un máximo."]]}, {"a": 17, "q": "En las corporaciones locales, las bases reguladoras de las subvenciones se aprueban:", "o": [["en el marco de las bases de ejecución del presupuesto, por ordenanza general o por ordenanza específica", 1, "Correcto: art. 17.2 LGS."], ["por orden ministerial", 0, "Esa es la vía de la Administración General del Estado (art. 17.1)."], ["por decreto de alcaldía en todo caso", 0, "No es el cauce previsto."], ["por convenio con los beneficiarios", 0, "El convenio es instrumento de la concesión directa o de la colaboración."]]}, {"a": 19, "q": "El importe de una subvención puede superar el coste de la actividad si así lo prevén las bases.", "vf": true, "ok": false, "fb": "<b>Falso.</b> El art. 19.3 LGS lo prohíbe <b>en ningún caso</b>, ni aisladamente ni en concurrencia con otras subvenciones, ayudas, ingresos o recursos."}, {"a": 19, "q": "Los rendimientos financieros generados por los fondos librados al beneficiario:", "o": [["incrementan el importe de la subvención y se aplican a la actividad subvencionada", 1, "Correcto: art. 19.5 LGS, salvo disposición motivada en contrario en las bases."], ["pertenecen al beneficiario en todo caso", 0, "Solo si las bases lo disponen motivadamente."], ["deben reintegrarse siempre de inmediato", 0, "La regla general es su aplicación a la actividad."], ["no están regulados en la ley", 0, "Lo están en el art. 19.5."]]}, {"a": 20, "q": "El órgano responsable de la administración y custodia de la BDNS es:", "o": [["la Intervención General de la Administración del Estado", 1, "Correcto: art. 20.3 LGS."], ["el Tribunal de Cuentas", 0, "Es órgano de fiscalización externa, no gestor de la BDNS."], ["cada Administración concedente", 0, "Estas suministran información, no la custodian."], ["el Ministerio de Política Territorial", 0, "No es el órgano designado por la ley."]]}, {"a": 20, "q": "En las entidades locales, el responsable de suministrar información a la BDNS es:", "o": [["la Intervención u órgano que designe la propia entidad local", 1, "Correcto: art. 20.4 LGS."], ["el alcalde en todo caso", 0, "La ley designa a la Intervención o al órgano que se designe."], ["la Diputación provincial", 0, "No actúa como intermediaria a estos efectos."], ["el propio beneficiario", 0, "El beneficiario tiene deberes de difusión, no de suministro a la BDNS."]]}, {"a": 21, "q": "El régimen de garantías de beneficiarios y entidades colaboradoras:", "o": [["se establecerá reglamentariamente", 1, "Correcto: art. 21 LGS; hoy, en el RD 887/2006."], ["se fija en la propia ley con carácter exhaustivo", 0, "La ley se limita a remitir al reglamento."], ["lo determina libremente el beneficiario", 0, "No."], ["solo se exige en subvenciones superiores a 30.000 euros", 0, "Esa cifra corresponde al art. 13.3 bis sobre morosidad."]]}];
const CASOS=[{"t": "Caso 1 · ¿Subvención, contrato o ninguna de las dos?", "e": "Un ayuntamiento realiza estas cinco operaciones: <b>(1)</b> entrega 15.000 € a un club de atletismo para su escuela deportiva; <b>(2)</b> paga 15.000 € a una empresa por organizar la carrera popular; <b>(3)</b> bonifica el 50 % del IBI a familias numerosas; <b>(4)</b> transfiere 200.000 € a su patronato de cultura para financiar globalmente su actividad; <b>(5)</b> paga la cuota anual a la FEMP. <b>Califica cada una e indica la norma aplicable.</b>", "s": "<p><b>(1) Subvención.</b> Concurren los tres requisitos del art. 2.1 LGS: sin contraprestación directa, sujeta a una actividad y con finalidad de interés social. Norma: <b>Ley 38/2003</b>.</p><p><b>(2) Contrato de servicios.</b> Hay <b>contraprestación directa</b> a favor del ayuntamiento, de modo que falta el requisito del art. 2.1.a) LGS. Norma: <b>Ley 9/2017</b>, arts. 17 y 25 (documento 7 de la biblioteca).</p><p><b>(3) No es subvención.</b> Es un <b>beneficio fiscal</b>, expresamente excluido por el art. 2.4.g) LGS. Norma: ordenanza fiscal y <b>TRLHL</b> (documento 5).</p><p><b>(4) Fuera del ámbito de la ley.</b> Aportación dineraria entre agentes de una misma Administración para financiar globalmente su actividad (art. 2.2 LGS). Se instrumenta como transferencia presupuestaria: capítulo 4 de la <b>Orden EHA/3565/2008</b>.</p><p><b>(5) Fuera del ámbito.</b> Cuota a una asociación de la disposición adicional quinta de la LBRL (art. 2.3 LGS).</p><p><b>Conclusión:</b> solo la primera se tramita por el procedimiento de la LGS. Confundir la segunda con una subvención supondría adjudicar sin licitación un contrato de servicios.</p>"}, {"t": "Caso 2 · La solicitud que no puede prosperar", "e": "En una convocatoria municipal de 40.000 € concurren: <b>(a)</b> una asociación que debe 900 € a la Seguridad Social; <b>(b)</b> una agrupación de tres entidades, una de las cuales fue sancionada con la pérdida de la posibilidad de obtener subvenciones; <b>(c)</b> una empresa que solicita 35.000 € y no acredita el cumplimiento de los plazos de pago de la Ley 3/2004; <b>(d)</b> una fundación que no devolvió un reintegro de 2024. <b>Resuelve cada caso.</b>", "s": "<p><b>(a) No puede</b> obtener la condición de beneficiaria: art. 13.2.e) LGS, por no hallarse al corriente con la Seguridad Social. Además, el art. 14.1.e) exige acreditarlo <b>antes de la propuesta de resolución de concesión</b>. Si regulariza antes de ese momento, podría continuar.</p><p><b>(b) No puede</b> ninguna de las tres: el art. 13.2.i) LGS extiende la prohibición a toda la agrupación cuando concurre en <b>cualquiera</b> de sus miembros. La sanción, además, figura inscrita en la BDNS durante 10 años (art. 20.2).</p><p><b>(c) Debe acreditarlo</b>: al superar los <b>30.000 €</b> y ser empresa con ánimo de lucro sujeta a la Ley 3/2004, el art. 13.3 bis LGS le exige acreditar el cumplimiento de los plazos de pago en <b>10 días hábiles</b> desde la notificación de la propuesta provisional. Si no lo hace, no puede ser beneficiaria.</p><p><b>(d) No puede:</b> art. 13.2.g) LGS, por no hallarse al corriente de pago de obligaciones por reintegro.</p><p><b>Nota de gestión:</b> todas estas circunstancias se aprecian de <b>forma automática</b> (art. 13.4) y subsisten mientras concurran.</p>"}, {"t": "Caso 3 · Cuando la suma pasa del coste", "e": "Una asociación organiza un festival con un coste real de 18.000 €. Recibe 12.000 € del ayuntamiento y, después, 9.000 € de la Diputación. Los fondos municipales generan 150 € de intereses en la cuenta de la entidad. La asociación no comunica la segunda ayuda hasta el momento de justificar. <b>Analiza la situación.</b>", "s": "<p><b>1) Exceso sobre el coste.</b> 12.000 + 9.000 = 21.000 € frente a un coste de 18.000 €. El art. 19.3 LGS lo prohíbe <b>en ningún caso</b>: hay un exceso de <b>3.000 €</b>, que es causa de reintegro por el art. 37.1.h) LGS.</p><p><b>2) Comunicación tardía.</b> El art. 14.1.d) LGS obliga a comunicar la obtención de otras ayudas <b>tan pronto como se conozca</b> y, en todo caso, antes de la justificación. Comunicarlo justo al justificar cumple el límite último, pero incumple la primera exigencia si la asociación conocía antes la concesión provincial.</p><p><b>3) Los intereses.</b> Los 150 € <b>incrementan</b> el importe de la subvención y deben aplicarse a la actividad, salvo que las bases dispusieran motivadamente lo contrario (art. 19.5 LGS).</p><p><b>4) Consecuencia.</b> Procede minorar o, si ya se pagó, exigir el reintegro del exceso más los intereses de demora. Si las bases contienen <b>criterios de graduación</b> (art. 17.3.n LGS), se aplicarán para determinar la cantidad final.</p><p><b>5) Justificación.</b> Al haber otras fuentes de financiación, la cuenta justificativa debe acreditar <b>importe, procedencia y aplicación</b> de todos los fondos (art. 30.4 LGS).</p>"}];

const INTRO_HTML="<section class=\"card\" id=\"intro\"><h2>Tema 11 · Ámbito de aplicación y disposiciones comunes</h2><p class=\"small\">Primera parte de la Ley 38/2003: qué es una subvención (art. 2), a quién alcanza la ley (art. 3), qué queda fuera (art. 4) y las reglas comunes a todas las subvenciones — principios, requisitos, beneficiarios, prohibiciones, obligaciones, bases y publicidad (arts. 8 a 21).</p><div class=\"box ej\"><span class=\"lbl\">La idea que ordena todo el tema</span>Para saber si estamos ante una subvención sujeta a la ley hay que responder <b>tres preguntas en cadena</b>: <b>1)</b> ¿cumple los tres requisitos del art. 2.1? · <b>2)</b> ¿la concede un sujeto del art. 3 en ejercicio de potestades administrativas? · <b>3)</b> ¿no está excluida por el art. 4 ni entre los supuestos del art. 2.4? Si supera las tres, se aplican las disposiciones comunes del Capítulo II.</div><div class=\"box warn\"><span class=\"lbl\">Fuentes utilizadas y vigencia</span><ul><li><b>Ley 38/2003, de 17 de noviembre, General de Subvenciones</b> (documento 8 de la biblioteca), texto consolidado con última modificación de <b>2 de agosto de 2024</b>.</li><li>Concordancias con la <b>Ley 9/2017</b> de contratos (documento 7), el <b>TRLHL</b> (documento 5) y la <b>Ley 1/2014</b> de transparencia de Andalucía (documento 9).</li><li><b>Aportación externa</b> (normas no incluidas en la biblioteca): <b>RD 887/2006</b>, Reglamento de la LGS, al que remiten los arts. 13.2.e), 21 y 30 · <b>Ley 19/2013</b> de transparencia, citada por el art. 18.3 · <b>Ley 7/1985 (LBRL)</b>, para la competencia del art. 10.4 y las asociaciones del art. 2.3. Verifica su texto vigente en el BOE.</li><li><b>Citas desfasadas del texto:</b> el art. 9.1 se refiere a los arts. 87 a 89 del Tratado Constitutivo (hoy <b>arts. 107 a 109 del TFUE</b>) y a la Ley 30/1992 (hoy <b>Ley 39/2015</b>); el art. 13.6 cita el texto refundido de contratos de 2002 (hoy <b>Ley 9/2017</b>); el art. 16.6 cita la Ley 30/2007 (hoy <b>Ley 9/2017</b>).</li></ul></div><svg viewBox=\"0 0 660 215\" role=\"img\" aria-label=\"Mapa conceptual del tema 11\"><rect x=\"205\" y=\"8\" width=\"250\" height=\"36\" rx=\"9\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"330\" y=\"31\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"#fff\">¿SE APLICA LA LGS?</text><line x1=\"330\" y1=\"44\" x2=\"330\" y2=\"60\" stroke=\"var(--acc)\" stroke-width=\"2\"/><line x1=\"130\" y1=\"60\" x2=\"530\" y2=\"60\" stroke=\"var(--acc)\" stroke-width=\"2\"/><line x1=\"130\" y1=\"60\" x2=\"130\" y2=\"78\" stroke=\"var(--acc)\" stroke-width=\"2\"/><line x1=\"330\" y1=\"60\" x2=\"330\" y2=\"78\" stroke=\"var(--acc)\" stroke-width=\"2\"/><line x1=\"530\" y1=\"60\" x2=\"530\" y2=\"78\" stroke=\"var(--acc)\" stroke-width=\"2\"/><rect x=\"25\" y=\"78\" width=\"210\" height=\"122\" rx=\"9\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"130\" y=\"100\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"var(--acc)\">1 · QUÉ ES</text><text x=\"130\" y=\"124\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">art. 1 · objeto</text><text x=\"130\" y=\"146\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">art. 2 · concepto</text><text x=\"130\" y=\"168\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">art. 4 · exclusiones</text><text x=\"130\" y=\"190\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--ink2)\">arts. 5 a 7 · régimen y fondos UE</text><rect x=\"245\" y=\"78\" width=\"170\" height=\"122\" rx=\"9\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"330\" y=\"100\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"var(--ej)\">2 · A QUIÉN</text><text x=\"330\" y=\"124\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">art. 3 · ámbito subjetivo</text><text x=\"330\" y=\"146\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">art. 11 · beneficiarios</text><text x=\"330\" y=\"168\" text-anch const RESUMEN_HTML="<section class=\"card\" id=\"resumen\"><h2>Resumen ejecutivo</h2><p class=\"small\"><b>Norma:</b> Ley 38/2003, General de Subvenciones, Título Preliminar (arts. 1 a 21).</p><table><tbody><tr><th style=\"width:60px\">1</th><td>Objeto: <b>régimen jurídico general</b> de las subvenciones de las Administraciones públicas.</td></tr><tr><th>2</th><td>Concepto: <b>sin contraprestación</b> + <b>sujeta a un fin</b> + <b>finalidad pública</b>. No son subvención: prestaciones de la Seguridad Social, beneficios fiscales, crédito oficial…</td></tr><tr><th>3</th><td>Ámbito: AGE, entidades locales y CCAA; entes instrumentales si actúan con <b>potestades administrativas</b>; si no, principios y art. 20.</td></tr><tr><th>4</th><td>Exclusiones: premios sin solicitud · electorales · partidos · grupos parlamentarios y políticos.</td></tr><tr><th>5-7</th><td>Fuentes: LGS → derecho administrativo → derecho privado. Fondos europeos: normativa de la Unión y responsabilidad de quien causa la corrección.</td></tr><tr><th>8</th><td><b>Plan estratégico</b> previo. Principios: publicidad, transparencia, concurrencia, objetividad, igualdad y no discriminación · eficacia · eficiencia.</td></tr><tr><th>9</th><td>Requisitos previos: bases aprobadas y publicadas + <b>competencia, crédito, procedimiento, fiscalización y aprobación del gasto</b>.</td></tr><tr><th>10</th><td>Conceden ministros y directores; más de <b>12 M€</b>, autorización del Consejo de Ministros. En lo local, la <b>legislación de régimen local</b>.</td></tr><tr><th>11-12</th><td><b>Beneficiario</b>: quien realiza la actividad o está en la situación. <b>Colaboradora</b>: entrega fondos o colabora, en nombre del concedente.</td></tr><tr><th>13</th><td>Diez prohibiciones: condenas, concurso, resolución culpable de contrato, incompatibilidades, deudas tributarias y con la Seguridad Social, paraíso fiscal, reintegros, sanción, agrupaciones y empresas continuadoras. Morosidad: <b>30.000 €</b> y <b>10 días hábiles</b>.</td></tr><tr><th>14-15</th><td>Beneficiario: cumplir, justificar, someterse, comunicar, estar al corriente, contabilidad, conservar, difundir y reintegrar. Colaboradora: entregar, comprobar, justificar y someterse.</td></tr><tr><th>16-17</th><td>Convenio de colaboración: máximo <b>4 años</b>. Bases reguladoras: en lo local, <b>bases de ejecución u ordenanza</b>, con contenido mínimo tasado.</td></tr><tr><th>18-21</th><td>Publicidad por la <b>BDNS</b> (responsable: <b>IGAE</b>) y difusión por el beneficiario. La subvención <b>nunca supera el coste</b>; los rendimientos financieros la incrementan. Garantías: <b>reglamento</b>.</td></tr></tbody></table><h2 style=\"margin-top:1.2rem\">Calendario de repaso espaciado</h2><table><thead><tr><th>Momento</th><th>Fecha</th><th>Qué hacer</th></tr></thead><tbody id=\"calbody\"></tbody></table></section>";

(function(){
"use strict";
var K_THEME="oposi_bII_theme", K_FS="oposi_bII_fs", K_STREAK="oposi_bII_streak";
function load(k,f){try{var v=localStorage.getItem(k);return v?JSON.parse(v):f;}catch(e){return f;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
var root=document.documentElement;

/* Tema persistente (sobrescribe el toggle simple anterior) */

};

var fs=load(K_FS,16);

  var s=load(K_STREAK,{last:null,n:0});
  if(s.last!==hoy){
    var ayer=new Date(Date.now()-864e5).toISOString().slice(0,10);
    s.n=(s.last===ayer)?s.n+1:1;s.last=hoy;save(K_STREAK,s);
  }

/* Reveal on scroll para las tarjetas */
function reveal(){
  var els=document.querySelectorAll("section.card:not(.rv)");
  if(!els.length)return;
  if(!("IntersectionObserver" in window)){return;}
  var io=new IntersectionObserver(function(es){
    es.forEach(function(en){if(en.isIntersecting){en.target.classList.add("in");io.unobserve(en.target);}});
  },{threshold:.06,rootMargin:"0px 0px -30px 0px"});
  Array.prototype.forEach.call(els,function(el){el.classList.add("rv");io.observe(el);});
}

/* Sección activa en el índice lateral */
function spy(){
  var links=document.querySelectorAll("nav.side a[href^='#']");
  if(!links.length||!("IntersectionObserver" in window))return;
  var map={};
  Array.prototype.forEach.call(links,function(a){
    var t=document.getElementById(a.getAttribute("href").slice(1));
    if(t)map[t.id]=a;
  });
  var io=new IntersectionObserver(function(es){
    es.forEach(function(en){
      if(en.isIntersecting){
        Array.prototype.forEach.call(links,function(a){a.classList.remove("on");});
        if(map[en.target.id])map[en.target.id].classList.add("on");
      }
    });
  },{rootMargin:"-80px 0px -70% 0px",threshold:0});
  Object.keys(map).forEach(function(id){io.observe(document.getElementById(id));});
}

/* Ripple en botones */
document.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b||b.classList.contains("navtoggle"))return;
  var r=b.getBoundingClientRect(),d=Math.max(r.width,r.height),s=document.createElement("span");
  s.className="ripple";s.style.width=s.style.height=d+"px";
  s.style.left=(e.clientX-r.left-d/2)+"px";s.style.top=(e.clientY-r.top-d/2)+"px";
  b.appendChild(s);setTimeout(function(){if(s.parentNode)s.parentNode.removeChild(s);},560);
});

addEventListener("load",function(){setTimeout(init,80);});
})();

/* ═══ Parser de respuestas: estructura semántica ═══ */
var FCFMT=(function(){
  var CITA=/\s*\(((?:arts?\.|DA\b|DT\b|disp\.)[^)]*)\)\s*\.?\s*$/i;
  var strip=function(h){return h.replace(/<[^>]+>/g,"");};

  function esc(s){return s;}

  function parse(raw){
    var out={verdict:null,cite:null,kind:"p",items:[],text:""};
    var body=String(raw).trim();

    /* 1 ── Cita legal al final */
    var m=body.match(CITA);
    if(m){out.cite=m[1].replace(/\s+/g," ").trim();body=body.slice(0,m.index).trim();}
    body=body.replace(/[.;,\s]+$/,"");

    /* 2 ── Veredicto Sí / No inicial */
    var v=strip(body).match(/^(Sí|Sí,|No|No,)[.:,]?\s/);
    if(v){
      out.verdict=/^Sí/.test(v[1])?"si":"no";
      body=body.replace(/^(<[^>]+>\s*)*(Sí|No)[.,:]?\s*/,"").trim();
      body=body.replace(/^en\s/,"En ");
    }

    /* 3 ── Enumeración con · */
    var parts=body.split(/\s+·\s+/);
    if(parts.length>=2){
      out.kind="list";
      var letras=parts.filter(function(p){return /^\s*<?[a-h]\)/.test(strip(p));}).length;
      out.marker = letras>=parts.length-1 ? "alpha" : "num";
      out.items=parts.map(function(p){
        return p.replace(/^\s*[a-h]\)\s*/,"").replace(/[.\s]+$/,"").trim();
      }).filter(Boolean);
      return out;
    }

    /* 4 ── Cláusulas contrapuestas con ; */
    var semi=body.split(/;\s+/);
    if(semi.length>=2&&semi.length<=3&&semi.every(function(s){return strip(s).length>14;})){
      out.kind="clauses";
      out.items=semi.map(function(s){return s.replace(/[.\s]+$/,"").trim();});
      return out;
    }

    /* 5 ── Párrafo */
    out.text=body;
    return out;
  }

  function render(raw){
    var d=parse(raw),h="";

    if(d.verdict){
      h+='<span class="fc-verdict '+d.verdict+'">'+(d.verdict==="si"?"✓ Sí":"✗ No")+'</span>';
    }

    if(d.kind==="list"){
      h+='<ol class="fc-list '+d.marker+'">';
      d.items.forEach(function(it){h+='<li>'+it+'</li>';});
      h+='</ol>';
    }else if(d.kind==="clauses"){
      h+='<div class="fc-clauses">';
      d.items.forEach(function(it){h+='<p>'+it+'</p>';});
      h+='</div>';
    }else if(d.text){
      h+='<p class="fc-p">'+d.text+'</p>';
    }

    if(d.cite){
      h+='<span class="fc-cite"><span class="s">§</span>'+d.cite+'</span>';
    }
    return {html:h,struct:(d.kind!=="p"||!!d.verdict||strip(raw).length>150)};
  }
  return {parse:parse,render:render};
})();

  var deck=stage.querySelector("#fcdeck"), lift=stage.querySelector("#fclift"),
      card=stage.querySelector("#fcbox"),
      front=stage.querySelector(".fc-front"), backf=stage.querySelector(".fc-back"),
      fill=bar.querySelector("i"),
      pok=ctr.querySelector("#fcpok"), pko=ctr.querySelector("#fcpko"),
      pleft=ctr.querySelector("#fccount");
  var rot=0;

  function reset(){
    order=CARDS.map(function(_,i){return i;});
    fi=0;ok=0;ko=0;back=false;busy=false;rot=0;
    card.style.transition="none";card.style.transform="rotateY(0deg)";
    void card.offsetWidth;card.style.transition="";
    deck.classList.remove("empty");
    var d=stage.querySelector(".fc-done");if(d)d.remove();
    card.style.display="";
    draw();
  }

  function bump(el){el.classList.remove("bump");void el.offsetWidth;el.classList.add("bump");}

  function draw(){
    pok.textContent=ok+(ok===1?" sabida":" sabidas");
    pko.textContent=ko+" repasar";
    var done=N-order.length;
    fill.style.width=(N?done/N*100:0)+"%";

    if(!order.length){
      pleft.textContent="0 quedan";
      deck.classList.add("empty");
      card.style.display="none";
      if(!stage.querySelector(".fc-done")){
        var d=document.createElement("div");
        d.className="fc-done";
        d.innerHTML='<span class="seal">🏆</span><h3>Ronda completada</h3>'
          +'<p>'+ok+' de '+N+' a la primera'+(ko?' · '+ko+' necesitaron repaso':'')+'</p>';
        deck.appendChild(d);
      }
      return;
    }
    if(fi>=order.length)fi=0;
    pleft.textContent=order.length+(order.length===1?" queda":" quedan");

    var c=CARDS[order[fi]];
    front.querySelector(".fc-txt").innerHTML='<p class="fc-p">'+c[0]+'</p>';
    var r=FCFMT.render(c[1]);
    backf.querySelector(".fc-txt").innerHTML=r.html;
    backf.classList.toggle("struct",r.struct);
    var hint=backf.querySelector(".fc-hint");
    if(hint)hint.classList.toggle("muted",/fc-cite/.test(r.html));
    var pip=(done+1)+"/"+N;
    Array.prototype.forEach.call(stage.querySelectorAll(".fc-pip"),function(p){p.textContent=pip;});
  }

  function flip(){
    if(busy||!order.length)return;
    back=!back;rot+=180;
    card.style.transform="rotateY("+rot+"deg)";
    card.setAttribute("aria-label",back?"Respuesta. Pulsa para volver":"Pregunta. Pulsa para girar");
    lift.classList.remove("lift");void lift.offsetWidth;lift.classList.add("lift");
  }

  function next(good){
    if(busy||!order.length)return;
    busy=true;
    if(good){ok++;bump(pok);}else{ko++;bump(pko);}
    lift.classList.remove("lift");
    lift.classList.add(good?"out-ok":"out-ko");
    setTimeout(function(){
      if(good){order.splice(fi,1);}
      else{var m=order.splice(fi,1)[0];order.push(m);}
      back=false;rot=0;
      card.style.transition="none";card.style.transform="rotateY(0deg)";
      void card.offsetWidth;card.style.transition="";
      draw();
      lift.classList.remove("out-ok","out-ko");
      lift.classList.add("in");
      setTimeout(function(){lift.classList.remove("in");busy=false;},480);
    },460);
  }

  card.onclick=flip;
  card.onkeydown=function(e){
    if(e.key===" "||e.key==="Enter"){e.preventDefault();flip();}
    if(e.key==="ArrowRight"){e.preventDefault();next(true);}
    if(e.key==="ArrowLeft"){e.preventDefault();next(false);}
  };
  ctr.querySelector("#fcflip").onclick=flip;
  ctr.querySelector("#fcok").onclick=function(){next(true);};
  ctr.querySelector("#fcko").onclick=function(){next(false);};
  ctr.querySelector("#fcreset").onclick=reset;

  /* Deslizar en táctil */
  var x0=null,y0=null;
  card.addEventListener("touchstart",function(e){x0=e.touches[0].clientX;y0=e.touches[0].clientY;},{passive:true});
  card.addEventListener("touchend",function(e){
    if(x0===null)return;
    var dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0;
    if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)){next(dx>0);}
    x0=y0=null;
  },{passive:true});

  /* Atajos globales cuando el mazo está a la vista */
  document.addEventListener("keydown",function(e){
    if(e.target.matches("input,textarea,select"))return;
    var r=stage.getBoundingClientRect();
    if(r.bottom<80||r.top>innerHeight-80)return;
    if(e.key===" "){e.preventDefault();flip();}
    else if(e.key==="ArrowRight"){e.preventDefault();next(true);}
    else if(e.key==="ArrowLeft"){e.preventDefault();next(false);}
  });

  reset();
  return true;
}
if(!boot()){
  var tries=0;
  var iv=setInterval(function(){if(boot()||++tries>40)clearInterval(iv);},120);
  addEventListener("load",function(){setTimeout(boot,100);});
}
})();


</script>
<script>


/* ═══ Altura adaptativa + índice plegable ═══ */
(function(){
"use strict";

/* ── 1 · Índice lateral plegable ── */
function sidebar(){
  var lay=document.querySelector(".layout"),
      side=document.getElementById("side"),
      tools=document.querySelector(".tools");
  if(!lay||!side||!tools||document.getElementById("navhide"))return;

  var K="oposi_bII_nav";
  function get(){try{return localStorage.getItem(K)==="0";}catch(e){return false;}}
  function set(v){try{localStorage.setItem(K,v?"0":"1");}catch(e){}}

  var b=document.createElement("button");
  b.id="navhide";b.type="button";
  b.innerHTML='<span class="ic">☰</span>';
  b.setAttribute("aria-controls","side");
  tools.insertBefore(b,tools.firstChild);

  function apply(hidden,anim){
    if(!anim)lay.style.transition="none";
    lay.classList.toggle("nonav",hidden);
    side.setAttribute("aria-hidden",String(hidden));
    b.setAttribute("aria-pressed",String(hidden));
    b.title=hidden?"Mostrar índice (i)":"Ocultar índice (i)";
    b.setAttribute("aria-label",b.title);
    if(!anim)requestAnimationFrame(function(){lay.style.transition="";});
  }
  apply(get(),false);

  b.onclick=function(){
    var h=!lay.classList.contains("nonav");
    apply(h,true);set(h);
    window.dispatchEvent(new Event("resize"));
  };
  document.addEventListener("keydown",function(e){
    if(e.target.matches("input,textarea,select"))return;
    if(e.key==="i"||e.key==="I"){e.preventDefault();b.click();}
  });
}

/* ── 2 · La tarjeta se adapta a su contenido ── */
function autofit(){
  var stage=document.querySelector(".fc-stage");
  if(!stage||stage.dataset.fit)return;
  var deck=stage.querySelector(".fc-deck"),
      front=stage.querySelector(".fc-front"),
      back=stage.querySelector(".fc-back");
  if(!deck||!front||!back)return;
  stage.dataset.fit="1";

  var meas=document.createElement("div");
  meas.className="fc-measure";meas.setAttribute("aria-hidden","true");
  meas.innerHTML='<div class="fc-face fc-front"><div class="fc-body"><div class="fc-txt"></div></div></div>';
  stage.appendChild(meas);
  var mFace=meas.querySelector(".fc-face"), mTxt=meas.querySelector(".fc-txt");

  function measure(cls,html){
    mFace.className="fc-face "+cls;
    mTxt.innerHTML=html;
    return mFace.offsetHeight;
  }

  function fit(){
    if(deck.classList.contains("empty")){deck.style.height="230px";return;}
    var fT=front.querySelector(".fc-txt"), bT=back.querySelector(".fc-txt");
    if(!fT||!bT)return;
    var h=Math.max(
      measure("fc-front"+(front.classList.contains("struct")?" struct":""),fT.innerHTML),
      measure("fc-back" +(back .classList.contains("struct")?" struct":""),bT.innerHTML),
      230
    );
    deck.style.height=Math.ceil(h+8)+"px";
  }

  /* recalcular cuando cambia la tarjeta, el tamaño de letra o la ventana */
  new MutationObserver(fit).observe(back,{childList:true,subtree:true,attributes:true,attributeFilter:["class"]});
  var t;
  addEventListener("resize",function(){clearTimeout(t);t=setTimeout(fit,120);},{passive:true});
  ["fs+","fs-"].forEach(function(id){
    var el=document.getElementById(id);
    if(el)el.addEventListener("click",function(){setTimeout(fit,60);});
  });
  fit();setTimeout(fit,250);
}

function go(){sidebar();autofit();}
if(document.readyState!=="loading")go();else document.addEventListener("DOMContentLoaded",go);
addEventListener("load",function(){setTimeout(go,120);});
var n=0,iv=setInterval(function(){go();if(++n>25)clearInterval(iv);},150);
})();


</script>
<script>


/* ═══════════════════════════════════════════════════════════════
   TTS · Lectura en voz alta del texto legal
   ═══════════════════════════════════════════════════════════════ */
(function(){
"use strict";
if(!("speechSynthesis" in window))return;

var K="oposi_bII_tts";
function load(){try{return JSON.parse(localStorage.getItem(K))||{};}catch(e){return {};}}
function save(o){try{localStorage.setItem(K,JSON.stringify(o));}catch(e){}}
var cfg=load();
if(cfg.rate==null)cfg.rate=1;
if(cfg.gen==null)cfg.gen="f";

var synth=window.speechSynthesis, voces=[], actual=null, bloques=[];

/* ─────────── 1 · Selección de voz ─────────── */
function esEspanol(v){return /^es\b|^es[-_]/i.test(v.lang||"")||/spanish|español/i.test(v.name||"");}
function calidad(v){
  var n=(v.name||"")+" "+(v.voiceURI||""), p=0;
  if(/natural|neural/i.test(n))p+=100;
  if(/online/i.test(n))p+=40;
  if(/premium|enhanced|eloquence/i.test(n))p+=35;
  if(/google/i.test(n))p+=30;
  if(v.localService===false)p+=15;
  if(/microsoft/i.test(n))p+=8;
  if(/^es-ES/i.test(v.lang))p+=12;   /* castellano de España primero */
  return p;
}
var MASC=/(pablo|álvaro|alvaro|jorge|diego|juan|raul|raúl|carlos|miguel|lorenzo|gonzalo|dalton|liam|andr[eé]s|luciano|male|hombre|masculin)/i;
var FEM =/(helena|elvira|laura|mónica|monica|paulina|sabina|esperanza|marisol|ximena|dalia|salome|camila|catalina|isidora|female|mujer|femenin)/i;
function genero(v){
  var n=v.name||"";
  if(MASC.test(n))return "m";
  if(FEM.test(n))return "f";
  return "?";
}
function cargarVoces(){
  var all=synth.getVoices()||[];
  voces=all.filter(esEspanol).sort(function(a,b){return calidad(b)-calidad(a);});
  if(!voces.length)voces=all.slice(0,12);
  pintarSelector();
}
function elegir(){
  if(cfg.voz){
    for(var i=0;i<voces.length;i++)if(voces[i].voiceURI===cfg.voz)return voces[i];
  }
  var g=cfg.gen;
  for(var j=0;j<voces.length;j++)if(genero(voces[j])===g)return voces[j];
  return voces[0]||null;
}

/* ─────────── 2 · Naturalidad: expandir lo que el TTS lee mal ─────────── */
var ORD={1:"primera",2:"segunda",3:"tercera",4:"cuarta",5:"quinta",
         6:"sexta",7:"séptima",8:"octava",9:"novena",10:"décima"};
function paraVoz(t){
  return t
    .replace(/\barts?\.\s*/gi,function(m){return /arts/i.test(m)?"artículos ":"artículo ";})
    .replace(/\bapdos?\.\s*/gi,"apartado ")
    .replace(/\bnúms?\.\s*/gi,"número ")
    .replace(/\bpárr\.\s*/gi,"párrafo ")
    .replace(/\bcap\.\s*/gi,"capítulo ")
    .replace(/\bpágs?\.\s*/gi,"página ")
    .replace(/\by\s+ss\./gi,"y siguientes")
    .replace(/\bss\./gi,"siguientes")
    .replace(/\bTRLHL\b/g,"Texto Refundido de la Ley de Haciendas Locales")
    .replace(/\bLCSP\b/g,"Ley de Contratos del Sector Público")
    .replace(/\bLBRL\b/g,"Ley de Bases del Régimen Local")
    .replace(/\bLRJSP\b/g,"Ley de Régimen Jurídico del Sector Público")
    .replace(/\bLPACAP\b/g,"Ley del Procedimiento Administrativo Común")
    .replace(/\bRDLeg\b/gi,"Real Decreto Legislativo")
    .replace(/\bRD\b/g,"Real Decreto")
    .replace(/\bCCAA\b/g,"comunidades autónomas")
    .replace(/\bCA\b/g,"comunidad autónoma")
    .replace(/\bEELL\b/g,"entidades locales")
    .replace(/\bBOE\b/g,"Boletín Oficial del Estado")
    .replace(/\bIVA\b/g,"I.V.A.")
    .replace(/\bSARA\b/g,"sara")
    .replace(/\bDA\s+(\d+)/g,"disposición adicional $1")
    .replace(/\bDT\s+(\d+)/g,"disposición transitoria $1")
    .replace(/(\d+)\.ª/g,function(m,n){return ORD[+n]||(n+"ª");})
    .replace(/(\d+)\.º/g,"$1º")
    /* 3.005,06 → 3005,06 para que lo lea como cifra y no como frase */
    .replace(/(\d)\.(?=\d{3}\b)/g,"$1")
    .replace(/(\d)\.(?=\d{3}\b)/g,"$1")
    .replace(/€/g," euros")
    .replace(/%/g," por ciento")
    .replace(/\bnº\b/gi,"número")
    .replace(/\s*·\s*/g,". ")
    .replace(/\(\s*/g,", ").replace(/\s*\)/g,", ")
    .replace(/\bvid\.\s*/gi,"véase ")
    .replace(/\bcfr\.\s*/gi,"compárese ")
    /* limpieza de puntuación tras las sustituciones */
    .replace(/([.:;!?])(?=[A-ZÁÉÍÓÚÑ¿¡])/g,"$1 ")
    .replace(/\s+([,.;:])/g,"$1")
    .replace(/,\s*([.;:])/g,"$1")
    .replace(/([,.;:])\s*\1+/g,"$1")
    .replace(/,\s*,/g,",")
    .replace(/\s{2,}/g," ")
    .trim();
}

/* ─────────── 3 · Segmentar en frases y envolverlas ─────────── */
var ABBR=/\b(arts?|apdos?|núms?|nums?|págs?|párr|cap|caps|ss|Sr|Sra|Sres|D|Dª|etc|vid|cfr|op|cit|ej|núm|art|fig|tít|secc)\.$/i;
function limites(t){
  var out=[],ini=0;
  for(var i=0;i<t.length;i++){
    var c=t[i];
    if(c!=="."&&c!=="!"&&c!=="?")continue;
    var sig=t[i+1]||" ";
    if(!/[\s"»)]/.test(sig))continue;             /* 3.005 o art.1 → no cortar */
    if(ABBR.test(t.slice(Math.max(0,i-9),i+1)))continue;
    if(/^\s*[0-9º ª]/.test(t.slice(i+1,i+3)))continue;
    if(i+1-ini<40)continue;                        /* frases demasiado cortas */
    out.push(i+1);ini=i+1;
  }
  if(ini<t.length)out.push(t.length);
  return out;
}
function segmentar(root){
  var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:function(n){
    if(!n.nodeValue||!n.nodeValue.trim())return NodeFilter.FILTER_REJECT;
    if(n.parentElement&&n.parentElement.closest(".lbl,.tts-bar"))return NodeFilter.FILTER_REJECT;
    return NodeFilter.FILTER_ACCEPT;
  }});
  var nodos=[];while(w.nextNode())nodos.push(w.currentNode);
  if(!nodos.length)return [];

  var full="";nodos.forEach(function(n){full+=n.nodeValue;});
  var cortes=limites(full), frases=[],ci=0,pos=0;
  cortes.forEach(function(){frases.push({text:"",spans:[]});});

  nodos.forEach(function(node){
    var txt=node.nodeValue, off=0, frag=document.createDocumentFragment();
    while(off<txt.length){
      var fin=cortes[ci]!=null?cortes[ci]-pos:txt.length;
      if(fin>txt.length)fin=txt.length;
      if(fin<=off)fin=txt.length;
      var trozo=txt.slice(off,fin);
      var sp=document.createElement("span");
      sp.className="tts-s";sp.setAttribute("data-s",ci);sp.textContent=trozo;
      frag.appendChild(sp);
      if(frases[ci]){frases[ci].text+=trozo;frases[ci].spans.push(sp);}
      if(pos+fin>=(cortes[ci]||Infinity))ci++;
      off=fin;
    }
    pos+=txt.length;
    node.parentNode.replaceChild(frag,node);
  });
  return frases.filter(function(f){return f.text.trim().length>1;});
}

/* ─────────── 4 · Reproductor ─────────── */
var mini,miniBar,miniLbl,miniPlay;
function crearMini(){
  mini=document.createElement("div");
  mini.className="tts-mini noprint";
  mini.innerHTML='<span class="lbl"></span>'
    +'<button class="main" data-a="play" title="Pausar o reanudar">⏸</button>'
    +'<span class="bar"><i></i></span>'
    +'<button data-a="prev" title="Frase anterior">↺</button>'
    +'<button data-a="stop" title="Detener">■</button>'
    +'<button data-a="cfg" title="Ajustes de voz">⚙</button>';
  document.body.appendChild(mini);
  miniBar=mini.querySelector(".bar i");miniLbl=mini.querySelector(".lbl");
  miniPlay=mini.querySelector('[data-a="play"]');
  mini.addEventListener("click",function(e){
    var b=e.target.closest("button");if(!b)return;
    var a=b.getAttribute("data-a");
    if(a==="play")pausarReanudar();
    else if(a==="stop")parar();
    else if(a==="prev"){if(actual){actual.i=Math.max(0,actual.i-2);siguiente();}}
    else if(a==="cfg")abrirPanel();
  });
}

function limpiarMarcas(){
  document.querySelectorAll(".tts-s.now").forEach(function(s){s.classList.remove("now");});
}
function parar(){
  synth.cancel();
  if(actual){
    actual.bloque.classList.remove("tts-on");
    var b=actual.bloque.querySelector(".tts-play");
    if(b){b.classList.remove("on");b.innerHTML=iconoPlay();}
  }
  limpiarMarcas();
  actual=null;
  if(mini)mini.classList.remove("show");
}
function iconoPlay(){return '<span aria-hidden="true">▶</span> Escuchar';}
function iconoOn(){return '<span class="tts-wave" aria-hidden="true"><i></i><i></i><i></i><i></i></span> Leyendo';}

function pausarReanudar(){
  if(!actual)return;
  if(synth.paused){synth.resume();miniPlay.textContent="⏸";}
  else{synth.pause();miniPlay.textContent="▶";}
}

function leer(bloque){
  if(actual&&actual.bloque===bloque){parar();return;}
  parar();
  var datos=bloque.__tts;
  if(!datos||!datos.length)return;
  var voz=elegir();
  actual={bloque:bloque,frases:datos,i:0,voz:voz};
  bloque.classList.add("tts-on");
  var b=bloque.querySelector(".tts-play");
  if(b){b.classList.add("on");b.innerHTML=iconoOn();}
  if(!mini)crearMini();
  var art=bloque.closest(".art");
  var t=art?art.querySelector("h2 .num"):null;
  var sufijo=bloque.__label?" · "+bloque.__label:"";
  miniLbl.textContent=(t?t.textContent:"")+sufijo||"Lectura";
  miniLbl.title=miniLbl.textContent;
  miniPlay.textContent="⏸";
  mini.classList.add("show");
  siguiente();
}

function siguiente(){
  if(!actual)return;
  limpiarMarcas();
  if(actual.i>=actual.frases.length){
    var fin=actual.bloque;
    parar();
    fin.dispatchEvent(new CustomEvent("tts:fin",{bubbles:true}));
    return;
  }
  var f=actual.frases[actual.i];
  var texto=paraVoz(f.text);
  if(!texto||texto.length<2){actual.i++;siguiente();return;}

  f.spans.forEach(function(s){s.classList.add("now");});
  if(f.spans[0]&&actual.i>0){
    var r=f.spans[0].getBoundingClientRect();
    if(r.top<70||r.bottom>innerHeight-90)
      f.spans[0].scrollIntoView({block:"center",behavior:"smooth"});
  }
  miniBar.style.width=((actual.i+1)/actual.frases.length*100)+"%";

  var u=new SpeechSynthesisUtterance(texto);
  if(actual.voz){u.voice=actual.voz;u.lang=actual.voz.lang;}else{u.lang="es-ES";}
  u.rate=cfg.rate;u.pitch=cfg.pitch||1;u.volume=1;
  u.onend=function(){if(actual){actual.i++;setTimeout(siguiente,90);}};
  u.onerror=function(e){
    if(e&&e.error==="interrupted")return;
    if(actual){actual.i++;setTimeout(siguiente,120);}
  };
  actual.u=u;
  synth.speak(u);
}

/* Chrome detiene la síntesis larga: lo mantenemos vivo */
setInterval(function(){
  if(actual&&synth.speaking&&!synth.paused){synth.pause();synth.resume();}
},9000);

/* ─────────── 5 · Panel de ajustes ─────────── */
var back,sel;
function crearPanel(){
  back=document.createElement("div");
  back.className="tts-back noprint";
  back.innerHTML=
   '<div class="tts-panel" role="dialog" aria-modal="true" aria-label="Ajustes de voz">'
   +'<h3>🔊 Lectura en voz alta</h3>'
   +'<p class="sub">Ajusta cómo se lee el texto legal. Se recuerda para todos los bloques.</p>'
   +'<div class="tts-row"><label>Tipo de voz</label>'
     +'<div class="tts-seg" id="ttsGen">'
       +'<button data-g="f">👩 Femenina</button>'
       +'<button data-g="m">👨 Masculina</button>'
     +'</div></div>'
   +'<div class="tts-row"><label>Voz concreta</label><select id="ttsVoz"></select></div>'
   +'<div class="tts-row"><label>Velocidad</label>'
     +'<div class="tts-slider"><input type="range" id="ttsRate" min="0.6" max="1.6" step="0.05">'
     +'<span class="tts-val" id="ttsRateV"></span></div></div>'
   +'<div class="tts-row"><label>Tono</label>'
     +'<div class="tts-slider"><input type="range" id="ttsPitch" min="0.7" max="1.3" step="0.05">'
     +'<span class="tts-val" id="ttsPitchV"></span></div></div>'
   +'<p class="tts-note" id="ttsNota"></p>'
   +'<div class="tts-acts">'
     +'<button id="ttsTest">▶ Probar</button>'
     +'<button class="prim" id="ttsOk">Hecho</button>'
   +'</div></div>';
  document.body.appendChild(back);
  sel=back.querySelector("#ttsVoz");

  back.addEventListener("click",function(e){if(e.target===back)cerrarPanel();});
  back.querySelector("#ttsOk").onclick=cerrarPanel;
  back.querySelector("#ttsGen").addEventListener("click",function(e){
    var b=e.target.closest("button[data-g]");if(!b)return;
    cfg.gen=b.getAttribute("data-g");cfg.voz=null;save(cfg);pintarSelector();probar();
  });
  sel.onchange=function(){cfg.voz=sel.value;save(cfg);probar();};
  var r=back.querySelector("#ttsRate"),rv=back.querySelector("#ttsRateV");
  r.value=cfg.rate;rv.textContent=(+cfg.rate).toFixed(2)+"×";
  r.oninput=function(){cfg.rate=+r.value;rv.textContent=cfg.rate.toFixed(2)+"×";save(cfg);};
  r.onchange=probar;
  var p=back.querySelector("#ttsPitch"),pv=back.querySelector("#ttsPitchV");
  p.value=cfg.pitch||1;pv.textContent=(+(cfg.pitch||1)).toFixed(2);
  p.oninput=function(){cfg.pitch=+p.value;pv.textContent=cfg.pitch.toFixed(2);save(cfg);};
  p.onchange=probar;
  back.querySelector("#ttsTest").onclick=probar;
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"&&back.classList.contains("show"))cerrarPanel();
  });
}
function probar(){
  synth.cancel();
  var v=elegir();
  var u=new SpeechSynthesisUtterance("El presupuesto general de la entidad local se aprueba antes del 31 de diciembre.");
  if(v){u.voice=v;u.lang=v.lang;}else u.lang="es-ES";
  u.rate=cfg.rate;u.pitch=cfg.pitch||1;
  synth.speak(u);
}
function pintarSelector(){
  if(!sel)return;
  var g=cfg.gen;
  back.querySelectorAll("#ttsGen button").forEach(function(b){
    b.setAttribute("aria-pressed",String(b.getAttribute("data-g")===g));
  });
  var pref=voces.filter(function(v){return genero(v)===g;});
  var otras=voces.filter(function(v){return genero(v)!==g;});
  function opt(v){
    var nat=/natural|neural|online|premium|enhanced|google/i.test(v.name)?" ★":"";
    return '<option value="'+v.voiceURI+'">'+v.name+nat+"</option>";
  }
  sel.innerHTML=(pref.length?'<optgroup label="'+(g==="f"?"Femeninas":"Masculinas")+'">'+pref.map(opt).join("")+"</optgroup>":"")
    +(otras.length?'<optgroup label="Otras voces en español">'+otras.map(opt).join("")+"</optgroup>":"");
  var v=elegir();
  if(v)sel.value=v.voiceURI;

  var nota=back.querySelector("#ttsNota");
  var hayNat=voces.some(function(x){return /natural|neural|online/i.test(x.name);});
  if(!voces.length){
    nota.innerHTML="⚠️ No se han detectado voces en español en este navegador. Prueba con Microsoft Edge o Chrome.";
  }else if(hayNat){
    nota.innerHTML="✅ Tienes voces <b>neuronales</b> disponibles (marcadas con ★): son las que suenan más humanas.";
  }else{
    nota.innerHTML="💡 Las voces marcadas con ★ suenan mejor. Para conseguir voces <b>neuronales</b> (mucho más naturales), "
      +"abre estas páginas en <b>Microsoft Edge</b>, o instálalas en Windows: <b>Configuración → Hora e idioma → Voz → Agregar voces</b>.";
  }
}
function abrirPanel(){if(!back)crearPanel();pintarSelector();back.classList.add("show");}
function cerrarPanel(){if(back)back.classList.remove("show");synth.cancel();}

/* ─────────── 6 · Inyectar los controles en cada apartado ─────────── */
/* Se excluyen a propósito tres apartados: conexiones con otros preceptos,
   trampas y errores frecuentes, y anclaje memorístico. */
var TTS_EXCLUIR=/(conexion|conexiones|trampas|anclaje)/i;

function ttsBarra(frases,compacta){
  var bar=document.createElement("div");
  bar.className="tts-bar noprint"+(compacta?" mini":"");
  bar.innerHTML='<button class="tts-play" type="button">'+iconoPlay()+"</button>"
    +(compacta?"":'<button class="tts-cfg" type="button" title="Ajustes de voz">⚙ Voz</button>')
    +'<span class="tts-time">'+frases.length+(frases.length===1?" frase":" frases")+"</span>";
  return bar;
}

function ttsPreparar(bl,opts){
  if(bl.getAttribute("data-tts"))return false;
  bl.setAttribute("data-tts","1");
  var frases=segmentar(bl);
  bl.__tts=frases;
  if(!frases.length||bl.textContent.trim().length<40)return false;
  bl.__label=opts.label||"";
  var bar=ttsBarra(frases,opts.compacta);
  if(opts.tras){
    var ref=bl.querySelector(opts.tras);
    if(ref&&ref.nextSibling)bl.insertBefore(bar,ref.nextSibling);
    else bl.insertBefore(bar,bl.firstChild);
  }else if(opts.alFinal){
    bl.appendChild(bar);
  }else{
    bl.insertBefore(bar,bl.firstChild);
  }
  bar.querySelector(".tts-play").onclick=function(e){e.stopPropagation();leer(bl);};
  var cfg=bar.querySelector(".tts-cfg");
  if(cfg)cfg.onclick=function(e){e.stopPropagation();abrirPanel();};
  return true;
}

function montar(){
  var hay=false;
  if(!back)crearPanel();

  /* 6a · Texto legal literal */
  Array.prototype.forEach.call(document.querySelectorAll(".legal:not([data-tts])"),function(bl){
    hay=ttsPreparar(bl,{tras:".lbl",label:"Texto legal"})||hay;
  });

  /* 6b · Idea clave */
  Array.prototype.forEach.call(document.querySelectorAll(".idea:not([data-tts])"),function(bl){
    hay=ttsPreparar(bl,{compacta:true,alFinal:true,label:"Idea clave"})||hay;
  });

  /* 6c · Apartados desplegables, salvo los tres excluidos */
  Array.prototype.forEach.call(document.querySelectorAll("details.panel"),function(p){
    var sum=p.querySelector("summary");
    var body=p.querySelector(".body");
    if(!sum||!body||body.getAttribute("data-tts"))return;
    var t=sum.textContent||"";
    if(TTS_EXCLUIR.test(t)){body.setAttribute("data-tts","skip");return;}
    hay=ttsPreparar(body,{compacta:true,label:t.replace(/[^\wáéíóúüñÁÉÍÓÚÜÑ\s·¿?¡!]/g,"").trim()})||hay;
  });

  /* 6d · Resumen e introducción del bloque */
  ["#resumen","#intro"].forEach(function(sel){
    var sec=document.querySelector(sel);
    if(!sec||sec.getAttribute("data-tts"))return;
    var h=sec.querySelector("h2");
    hay=ttsPreparar(sec,{tras:"h2",label:h?h.textContent:"Resumen"})||hay;
  });

  return hay;
}

/* ─────────── 7 · Arranque ─────────── */
cargarVoces();
if(typeof synth.onvoiceschanged!=="undefined")synth.onvoiceschanged=cargarVoces;
setTimeout(cargarVoces,400);setTimeout(cargarVoces,1400);

var n=0,iv=setInterval(function(){if(montar()||++n>40)clearInterval(iv);},150);
addEventListener("load",function(){setTimeout(montar,200);});
addEventListener("beforeunload",function(){synth.cancel();});
document.addEventListener("keydown",function(e){
  if(e.target.matches("input,textarea,select"))return;
  if(e.key==="Escape"&&actual)parar();
});
})();


</script>

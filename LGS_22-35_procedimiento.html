{n:27,t:"Reformulación de las solicitudes",ubic:"Título I ▸ Capítulo II (Del procedimiento de concesión en régimen de concurrencia competitiva)",idea:"Si te dan menos de lo pedido, puedes ajustar el proyecto sin cambiar su objeto.",literal:`<p>1. Cuando la subvención tenga por objeto la financiación de actividades a desarrollar por el solicitante y el importe de la subvención de la propuesta de resolución provisional sea inferior al que figura en la solicitud presentada, se podrá instar del beneficiario, si así se ha previsto en las bases reguladoras, la reformulación de su solicitud para ajustar los compromisos y condiciones a la subvención otorgable.</p><p>2. Una vez que la solicitud merezca la conformidad del órgano colegiado, se remitirá con todo lo actuado al órgano competente para que dicte la resolución.</p><p>3. En cualquier caso, la reformulación de solicitudes deberá respetar el objeto, condiciones y finalidad de la subvención, así como los criterios de valoración establecidos respecto de las solicitudes o peticiones.</p>`,dis:`<ul>
<li><b>27.1 — supuesto:</b> cuando la subvención tenga por objeto financiar actividades a desarrollar por el solicitante y el importe de la <b>propuesta provisional sea inferior</b> al solicitado, se podrá instar la <span class="t" data-k="reformulacion">reformulación</span> de la solicitud <b>si así lo prevén las bases</b>, para ajustar los compromisos y condiciones a la subvención otorgable.</li>
<li><b>27.2 — trámite:</b> una vez que la solicitud reformulada merece la conformidad del <b>órgano colegiado</b>, se remite con lo actuado al órgano competente para que resuelva.</li>
<li><b>27.3 — límites:</b> la reformulación debe <b>respetar el objeto, condiciones y finalidad</b> de la subvención y los <b>criterios de valoración</b> aplicados.</li>
</ul>`,llano:`<p>Pides 20.000 € y te proponen 12.000. Con la reformulación puedes rehacer el proyecto para que encaje con esos 12.000, sin cambiar de qué va ni saltarte los criterios con los que te puntuaron. Solo cabe si las bases lo permiten.</p>`,porque:`<p>Sin reformulación, el beneficiario quedaría atrapado: obligado a ejecutar un proyecto de 20.000 € con 12.000, o a renunciar. Ahora bien, el límite del apartado 3 es esencial: si se pudiera cambiar el objeto, se estaría subvencionando algo <b>distinto de lo valorado</b>, lo que rompería la igualdad con el resto de solicitantes.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> ajustar el presupuesto de una reforma cuando el banco te concede menos préstamo: haces menos metros, no otra casa.</li>
<li><b>Real:</b> una asociación solicita 20.000 € para diez talleres; la propuesta provisional es de 12.000 €. Reformula a seis talleres, manteniendo el objeto y la finalidad.</li>
<li><b>Caso límite:</b> si en la reformulación cambiara el tipo de actividad —de talleres a un festival—, no cabría: se vulneraría el art. 27.3.</li>
</ul>`,noej:`<ul>
<li><b>No cabe</b> reformular si las bases no lo prevén.</li>
<li><b>No puede</b> la reformulación alterar el objeto ni los criterios de valoración.</li>
<li><b>No procede</b> cuando la subvención no financia actividades a desarrollar por el solicitante.</li>
</ul>`,conex:`<ul>
<li><b>Art. 23.2.j) LGS:</b> la convocatoria debe indicar la posibilidad de reformulación.</li>
<li><b>Art. 24.4 LGS:</b> propuesta provisional, momento en que se abre la reformulación.</li>
<li><b>Art. 19.4 LGS:</b> alteración de condiciones y modificación de la resolución.</li>
</ul>`,trampas:`<ul>
<li>Requiere <b>previsión en las bases</b> y que el importe propuesto sea <b>inferior</b> al solicitado.</li>
<li>La conformidad la presta el <b>órgano colegiado</b>.</li>
<li>Debe respetar <b>objeto, condiciones, finalidad y criterios de valoración</b>.</li>
</ul>`,ancla:`<p><b>"Menos dinero, menos proyecto; nunca otro proyecto."</b></p>`,vis:`<svg viewBox="0 0 640 140" role="img" aria-label="Reformulación de solicitudes">

{n:28,t:"Concesión directa",ubic:"Título I ▸ Capítulo III (Del procedimiento de concesión directa)",idea:"La directa se instrumenta por convenio o resolución, y la excepcional por real decreto.",literal:`<p>1. La resolución de concesión y, en su caso, los convenios a través de los cuales se canalicen estas subvenciones establecerán las condiciones y compromisos aplicables de conformidad con lo dispuesto en esta ley.</p><p>Los convenios serán el instrumento habitual para canalizar las subvenciones previstas nominativamente en los Presupuestos Generales del Estado, o en los de las corporaciones locales, sin perjuicio de lo que a este respecto establezca su normativa reguladora.</p><p>2. El Gobierno aprobará por real decreto, a propuesta del ministro competente y previo informe del Ministerio de Hacienda, las normas especiales reguladoras de las subvenciones reguladas en el párrafo c) del apartado 2 del artículo 22 de esta ley.</p><p>3. El real decreto a que se hace referencia en el apartado anterior deberá ajustarse a las previsiones contenidas en esta ley, salvo en lo que afecte a la aplicación de los principios de publicidad y concurrencia, y contendrá como mínimo los siguientes extremos:</p><p>a) Definición del objeto de las subvenciones, con indicación del carácter singular de las mismas y las razones que acreditan el interés público, social, económico o humanitario y aquéllas que justifican la dificultad de su convocatoria pública.</p><p>b) Régimen jurídico aplicable.</p><p>c) Beneficiarios y modalidades de ayuda.</p><p>d) Procedimiento de concesión y régimen de justificación de la aplicación dada a las subvenciones por los beneficiarios y, en su caso, entidades colaboradoras.</p>`,dis:`<ul>
<li><b>28.1 — instrumento:</b> la <b>resolución de concesión</b> y, en su caso, los <b>convenios</b> establecen las condiciones y compromisos aplicables. Los <b>convenios</b> son el <b>instrumento habitual</b> para canalizar las subvenciones <b>previstas nominativamente</b> en los presupuestos del Estado o de las <b>corporaciones locales</b>.</li>
<li><b>28.2 — supuestos excepcionales:</b> las subvenciones del art. 22.2.c) exigen que el <b>Gobierno apruebe por real decreto</b>, a propuesta del ministro competente y previo informe del Ministerio de Hacienda, sus <b>normas especiales reguladoras</b>.</li>
<li><b>28.3 — contenido mínimo de ese real decreto:</b> a) definición del <b>objeto</b>, con indicación del carácter singular y de las razones de interés público, social, económico o humanitario y las que justifican la dificultad de convocatoria pública; b) <b>régimen jurídico</b> aplicable; c) <b>beneficiarios</b> y modalidades de ayuda; d) <b>procedimiento de concesión</b> y régimen de justificación.</li>
</ul>`,llano:`<p>Cuando la subvención se da directamente, hay que dejar por escrito las condiciones: normalmente en un convenio, que es la forma habitual de canalizar las subvenciones que ya están con nombre en el presupuesto. Y en el supuesto más delicado —el de las razones excepcionales— hace falta además una norma que las regule y que explique por qué no se pudo convocar públicamente.</p>`,porque:`<p>La concesión directa elimina la concurrencia, así que la ley la compensa con <b>formalización y motivación</b>: el convenio fija por escrito lo que en la concurrencia fijaban las bases. Y exigir un real decreto en el supuesto excepcional obliga a que la decisión suba de nivel y quede públicamente justificada, lo que dificulta el uso abusivo de la vía.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> un acuerdo escrito cuando no hay concurso: si no compites, al menos que quede claro qué se espera de cada parte.</li>
<li><b>Real:</b> el presupuesto municipal consigna nominativamente 25.000 € a una fundación asistencial; la subvención se canaliza mediante <b>convenio</b> que fija actividades, plazos y justificación (art. 28.1).</li>
<li><b>Caso límite:</b> ayudas estatales por una catástrofe: al amparo del art. 22.2.c), requieren <b>real decreto</b> con el contenido mínimo del art. 28.3.</li>
</ul>`,noej:`<ul>
<li><b>No es</b> el convenio una alternativa libre a la convocatoria: solo cabe en los supuestos del art. 22.2.</li>
<li><b>No basta</b> alegar interés público: hay que <b>acreditarlo</b> y justificar la dificultad de la convocatoria.</li>
</ul>`,conex:`<ul>
<li><b>Art. 22.2 LGS:</b> los tres supuestos de concesión directa.</li>
<li><b>Art. 65 del RD 887/2006</b> <i>(norma externa a la biblioteca)</i>: procedimiento de concesión directa de las subvenciones nominativas en el ámbito local.</li>
<li><b>Arts. 47 a 53 LRJSP</b> (documento 2): régimen de los convenios.</li>
<li><b>Art. 6.1 de la Ley 9/2017</b> (documento 7): los convenios cuyo contenido sea el de un contrato no quedan excluidos de la ley de contratos.</li>
</ul>`,trampas:`<ul>
<li>El <b>convenio</b> es el instrumento habitual de las subvenciones <b>nominativas</b>.</li>
<li>El <b>real decreto</b> solo se exige para el supuesto del art. 22.2.<b>c)</b>.</li>
<li>El contenido mínimo del real decreto tiene <b>cuatro</b> letras.</li>
</ul>`,ancla:`<p><b>"Nominativa, convenio; excepcional, real decreto."</b></p>`,vis:`<svg viewBox="0 0 640 150" role="img" aria-label="Instrumentos de la concesión directa">

</svg>`},
{n:29,t:"Subcontratación de las actividades subvencionadas por los beneficiarios",ubic:"Título I ▸ Capítulo IV (Del procedimiento de gestión y justificación de la subvención pública)",idea:"Subcontratar solo si lo permiten las bases, con límites y sin personas vinculadas.",literal:`<p>1. A los efectos de esta ley, se entiende que un beneficiario subcontrata cuando concierta con terceros la ejecución total o parcial de la actividad que constituye el objeto de la subvención. Queda fuera de este concepto la contratación de aquellos gastos en que tenga que incurrir el beneficiario para la realización por sí mismo de la actividad subvencionada.</p><p>2. El beneficiario únicamente podrá subcontratar, total o parcialmente, la actividad cuando la normativa reguladora de la subvención así lo prevea. La actividad subvencionada que el beneficiario subcontrate con terceros no excederá del porcentaje que se fije en las bases reguladoras de la subvención. En el supuesto de que tal previsión no figure, el beneficiario podrá subcontratar hasta un porcentaje que no exceda del 50 por ciento del importe de la actividad subvencionada.</p><p>En ningún caso podrán subcontratarse actividades que, aumentando el coste de la actividad subvencionada, no aporten valor añadido al contenido de la misma.</p><p>3. Cuando la actividad concertada con terceros exceda del 20 por ciento del importe de la subvención y dicho importe sea superior a 60.000 euros, la subcontratación estará sometida al cumplimiento de los siguientes requisitos:</p><p>a) Que el contrato se celebre por escrito.</p><p>b) Que la celebración del mismo se autorice previamente por la entidad concedente de la subvención en la forma que se determine en las bases reguladoras.</p><p>4. No podrá fraccionarse un contrato con el objeto de disminuir la cuantía del mismo y eludir el cumplimiento de los requisitos exigidos en el apartado anterior.</p><p>5. Los contratistas quedarán obligados sólo ante el beneficiario, que asumirá la total responsabilidad de la ejecución de la actividad subvencionada frente a la Administración.</p><p>6. A efectos de lo previsto en el apartado anterior, los beneficiarios serán responsables de que en la ejecución de la actividad subvencionada concertada con terceros se respeten los límites que se establezcan en la normativa reguladora de la subvención en cuanto a la</p><p>naturaleza y cuantía de gastos subvencionables, y los contratistas estarán sujetos al deber de colaboración previsto en el artículo 46 de esta ley para permitir la adecuada verificación del cumplimiento de dichos límites.</p><p>7. En ningún caso podrá concertarse por el beneficiario la ejecución total o parcial de las actividades subvencionadas con:</p><p>a) Personas o entidades incursas en alguna de las prohibiciones del artículo 13 de esta ley.</p><p>b) Personas o entidades que hayan percibido otras subvenciones para la realización de la actividad objeto de contratación.</p><p>c) Intermediarios o asesores en los que los pagos se definan como un porcentaje de coste total de la operación, a menos que dicho pago esté justificado con referencia al valor de mercado del trabajo realizado o los servicios prestados.</p><p>d) Personas o entidades vinculadas con el beneficiario, salvo que concurran las siguientes circunstancias:</p><p>1.ª Que se obtenga la previa autorización expresa del órgano concedente.</p><p>2.ª Que el importe subvencionable no exceda del coste incurrido por la entidad vinculada. La acreditación del coste se realizará en la justificación en los mismos términos establecidos para la acreditación de los gastos del beneficiario.</p><p>e) Personas o entidades solicitantes de ayuda o subvención en la misma convocatoria y programa, que no hayan obtenido subvención por no reunir los requisitos o no alcanzar la valoración suficiente.</p>`,dis:`<ul>
<li><b>29.1 — concepto:</b> hay <span class="t" data-k="subcontratar">subcontratación</span> cuando el beneficiario <b>concierta con terceros la ejecución total o parcial</b> de la actividad subvencionada. <b>Queda fuera</b> la contratación de los gastos en que deba incurrir para realizarla <b>por sí mismo</b>.</li>
<li><b>29.2 — habilitación y límite:</b> solo cabe si la <b>normativa reguladora lo prevé</b>, y sin exceder del <b>porcentaje que fijen las bases</b>; si no lo fijan, el límite es el que establece la ley para ese supuesto.</li>
<li><b>29.3 — requisitos reforzados:</b> cuando lo concertado <b>exceda del 20 % del importe</b> de la subvención <b>y</b> dicho importe sea <b>superior a 60.000 €</b>: contrato <b>por escrito</b> y <b>autorización previa</b> del órgano concedente.</li>
<li><b>29.4 — antifraude:</b> no podrá <b>fraccionarse</b> un contrato para eludir esos requisitos.</li>
<li><b>29.5 y 29.6 — responsabilidad:</b> los contratistas quedan obligados <b>solo ante el beneficiario</b>, que asume la <b>total responsabilidad</b> frente a la Administración; los contratistas están sujetos al <b>deber de colaboración</b> del art. 46.</li>
<li><b>29.7 — prohibiciones:</b> no cabe subcontratar con personas incursas en las prohibiciones del art. 13 · con quienes hayan percibido otras subvenciones para la misma actividad · con intermediarios o asesores cuyos pagos se definan como porcentaje del coste, salvo justificación · y con <b>personas o entidades vinculadas</b>, salvo <b>autorización previa expresa</b> del órgano concedente y que el importe no exceda del coste incurrido.</li>
</ul>`,llano:`<p>El beneficiario puede encargar a otro que haga la actividad, pero solo si las bases lo permiten y dentro del porcentaje que fijen. Si el encargo pasa del 20 % y de 60.000 €, hace falta contrato escrito y permiso previo. Y no vale contratar con quien está vetado ni, en principio, con empresas del propio grupo.</p>`,porque:`<p>La subcontratación es útil pero peligrosa: permite que el dinero acabe en manos elegidas por el beneficiario sin ningún control. Los dos umbrales acumulativos —<b>20 % y 60.000 €</b>— concentran el control donde el riesgo es relevante, y la prohibición de las <b>personas vinculadas</b> impide el circuito cerrado en el que la subvención se factura a una empresa del mismo dueño.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> te encargan un trabajo y pides ayuda a otro: si es una parte pequeña, nadie se opone; si delegas casi todo, quien te contrató querrá saberlo.</li>
<li><b>Real:</b> subvención de 200.000 € para un programa formativo; la asociación subcontrata la impartición por 50.000 € (25 % y más de 60.000 €): necesita <b>contrato escrito y autorización previa</b> (art. 29.3).</li>
<li><b>Caso límite:</b> subcontratar con una empresa cuyo administrador es el presidente de la asociación: solo cabe con <b>autorización previa expresa</b> y si el importe no excede del <b>coste incurrido</b> por la entidad vinculada (art. 29.7.d).</li>
</ul>`,noej:`<ul>
<li><b>No es subcontratación</b> comprar los materiales o contratar los suministros necesarios para hacer la actividad uno mismo.</li>
<li><b>No cabe</b> fraccionar el contrato para bajar del umbral.</li>
<li><b>No responde</b> el contratista ante la Administración: responde el beneficiario.</li>
</ul>`,conex:`<ul>
<li><b>Art. 13 LGS:</b> prohibiciones que se extienden a los subcontratistas.</li>
<li><b>Art. 46 LGS:</b> deber de colaboración en el control financiero.</li>
<li><b>Art. 31.3 LGS:</b> exigencia de tres ofertas cuando el gasto supera el importe del contrato menor.</li>
<li><b>Art. 215 de la Ley 9/2017</b> (documento 7): subcontratación en los contratos públicos, con lógica paralela.</li>
</ul>`,trampas:`<ul>
<li>Los dos requisitos del 29.3 son <b>acumulativos</b>: más del <b>20 %</b> <b>y</b> más de <b>60.000 €</b>.</li>
<li>La subcontratación exige <b>previsión en la normativa reguladora</b>: no se presume permitida.</li>
<li>El beneficiario asume la <b>total responsabilidad</b> frente a la Administración.</li>
<li>Con personas vinculadas: <b>autorización previa expresa</b> y límite del <b>coste incurrido</b>.</li>
</ul>`,ancla:`<p><b>"20 y 60": más del 20 % y más de 60.000 € → papel y permiso.</b><br>Y la regla de oro: <b>el que responde es el beneficiario</b>.</p>`,vis:`<svg viewBox="0 0 640 165" role="img" aria-label="Régimen de la subcontratación">

{n:30,t:"Justificación de las subvenciones públicas",ubic:"Título I ▸ Capítulo IV (Del procedimiento de gestión y justificación de la subvención pública)",idea:"Justificar es obligatorio: cuenta justificativa y, en su defecto, tres meses.",literal:`<p>1. La justificación del cumplimiento de las condiciones impuestas y de la consecución de los objetivos previstos en el acto de concesión de la subvención se documentará de la manera que se determine reglamentariamente, pudiendo revestir la forma de cuenta justificativa del gasto realizado o acreditarse dicho gasto por módulos o mediante la presentación de estados contables, según se disponga en la normativa reguladora.</p><p>2. La rendición de la cuenta justificativa constituye un acto obligatorio del beneficiario o de la entidad colaboradora, en la que se deben incluir, bajo responsabilidad del declarante, los justificantes de gasto o cualquier otro documento con validez jurídica que permitan acreditar el cumplimiento del objeto de la subvención pública. La forma de la cuenta justificativa y el plazo de rendición de la misma vendrán determinados por las correspondientes bases reguladoras de las subvenciones públicas.</p><p>A falta de previsión de las bases reguladoras, la cuenta deberá incluir declaración de las actividades realizadas que han sido financiadas con la subvención y su coste, con el desglose de cada uno de los gastos incurridos, y su presentación se realizará, como máximo, en el plazo de tres meses desde la finalización del plazo para la realización de la actividad.</p><p>3. Los gastos se acreditarán mediante facturas y demás documentos de valor probatorio equivalente con validez en el tráfico jurídico mercantil o con eficacia administrativa, en los términos establecidos reglamentariamente.</p><p>La acreditación de los gastos también podrá efectuarse mediante facturas electrónicas, siempre que cumplan los requisitos exigidos para su aceptación en el ámbito tributario.</p><p>Reglamentariamente, se establecerá un sistema de validación y estampillado de justificantes de gasto que permita el control de la concurrencia de subvenciones.</p><p>4. Cuando las actividades hayan sido financiadas, además de con la subvención, con fondos propios u otras subvenciones o recursos, deberá acreditarse en la justificación el importe, procedencia y aplicación de tales fondos a las actividades subvencionadas.</p><p>5. En el supuesto de adquisición de bienes inmuebles, además de los justificantes establecidos en el apartado 3 de este artículo, debe aportarse certificado de tasador independiente debidamente acreditado e inscrito en el correspondiente registro oficial.</p><p>6. Los miembros de las entidades previstas en el apartado 2 y segundo párrafo del apartado 3 del artículo 11 de esta ley vendrán obligados a cumplir los requisitos de justificación respecto de las actividades realizadas en nombre y por cuenta del beneficiario,</p><p>del modo en que se determina en los apartados anteriores. Esta documentación formará parte de la justificación que viene obligado a rendir el beneficiario que solicitó la subvención.</p><p>7. Las subvenciones que se concedan en atención a la concurrencia de una determinada situación en el perceptor no requerirán otra justificación que la acreditación por cualquier medio admisible en derecho de dicha situación previamente a la concesión, sin perjuicio de los controles que pudieran establecerse para verificar su existencia.</p><p>8. El incumplimiento de la obligación de justificación de la subvención en los términos establecidos en este capítulo o la justificación insuficiente de la misma llevará aparejado el reintegro en las condiciones previstas en el artículo 37 de esta ley.</p>`,dis:`<ul>
<li><b>30.1 — forma:</b> la justificación se documenta como se determine reglamentariamente, pudiendo revestir la forma de <span class="t" data-k="cuenta">cuenta justificativa</span> del gasto realizado o acreditarse por <b>módulos</b> o mediante la presentación de <b>estados contables</b>.</li>
<li><b>30.2 — cuenta justificativa:</b> su rendición es un <b>acto obligatorio</b> del beneficiario o de la entidad colaboradora. A falta de previsión en las bases, debe incluir <b>declaración de las actividades realizadas</b> y su coste, con desglose de cada gasto, y presentarse <b>como máximo en el plazo de tres meses</b> desde la finalización del plazo para realizar la actividad.</li>
<li><b>30.3 — acreditación:</b> los gastos se acreditan mediante <b>facturas y demás documentos de valor probatorio equivalente</b> con validez en el tráfico mercantil o eficacia administrativa.</li>
<li><b>30.4 — otras fuentes:</b> si la actividad se financió además con fondos propios u otras ayudas, debe acreditarse <b>importe, procedencia y aplicación</b>.</li>
<li><b>30.5 — inmuebles:</b> en su adquisición, además, <b>certificado de tasador independiente</b> acreditado e inscrito en el registro oficial.</li>
<li><b>30.7 — subvenciones por situación:</b> las concedidas en atención a la concurrencia de una situación no requieren otra justificación que la <b>acreditación previa de dicha situación</b>.</li>
<li><b>30.8 — consecuencia:</b> el incumplimiento de la obligación de justificar o la justificación insuficiente llevan aparejado el <b>reintegro</b> conforme al art. 37.</li>
</ul>`,llano:`<p>Cobrar una subvención obliga a demostrar qué se hizo y cuánto costó. Lo normal es presentar una cuenta justificativa con las facturas. Si las bases no dicen otra cosa, hay tres meses desde que termina el plazo de la actividad. Si no justificas o justificas mal, hay que devolver el dinero.</p>`,porque:`<p>La justificación es la <b>contrapartida</b> de que no haya contraprestación: la Administración no recibe un bien ni un servicio, así que su única garantía es comprobar que la actividad se hizo y que el dinero se aplicó a ella. Por eso la ley califica la rendición de la cuenta como <b>acto obligatorio</b> y anuda su incumplimiento al reintegro.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> el dinero que te dan para un viaje de estudios y del que luego tienes que enseñar los tiques.</li>
<li><b>Real:</b> una asociación recibe 10.000 € para actividades que finalizan el 31 de octubre; si las bases callan, debe presentar la cuenta justificativa <b>antes del 31 de enero</b> siguiente.</li>
<li><b>Caso límite:</b> subvención concedida por encontrarse en situación de vulnerabilidad: basta la <b>acreditación previa de la situación</b>, sin cuenta justificativa (art. 30.7).</li>
</ul>`,noej:`<ul>
<li><b>No basta</b> con acreditar el pago: hay que acreditar la <b>realización de la actividad</b> y su coste.</li>
<li><b>No sustituye</b> la conformidad de la entidad colaboradora a la comprobación del órgano concedente (art. 32).</li>
</ul>`,conex:`<ul>
<li><b>Art. 14.1.b) LGS:</b> obligación de justificar del beneficiario.</li>
<li><b>Art. 32 LGS:</b> comprobación de la justificación.</li>
<li><b>Art. 37.1.c) LGS:</b> incumplimiento de la obligación de justificación como causa de reintegro.</li>
<li><b>Art. 189.2 TRLHL</b> (documento 5): justificación de la aplicación de los fondos en el ámbito local.</li>
</ul>`,trampas:`<ul>
<li>El plazo supletorio es de <b>tres meses</b> desde la finalización del plazo para realizar la actividad, y solo <b>a falta de previsión</b> en las bases.</li>
<li>La rendición de la cuenta es un <b>acto obligatorio</b>, no una carga potestativa.</li>
<li>En inmuebles se exige <b>certificado de tasador independiente</b>.</li>
<li>La justificación <b>insuficiente</b> también da lugar a reintegro.</li>
</ul>`,ancla:`<p><b>"Tres meses, cuenta y facturas."</b> Y si la subvención era por estar en una situación, basta con haberla acreditado antes.</p>`,vis:`<svg viewBox="0 0 640 155" role="img" aria-label="Justificación de las subvenciones">
<defs><marker id="j1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="var(--acc)"/></marker></defs>

</svg>`},
{n:31,t:"Gastos subvencionables",ubic:"Título I ▸ Capítulo IV (Del procedimiento de gestión y justificación de la subvención pública)",idea:"Gasto subvencionable: necesario, en plazo, pagado y con tres ofertas si es grande.",literal:`<p>1. Se consideran gastos subvencionables, a los efectos previstos en esta ley, aquellos que de manera indubitada respondan a la naturaleza de la actividad subvencionada, resulten estrictamente necesarios y se realicen en el plazo establecido por las diferentes bases reguladoras de las subvenciones. Cuando no se haya establecido un plazo concreto, los gastos deberán realizarse antes de que finalice el año natural en que se haya concedido la subvención.</p><p>En ningún caso el coste de adquisición de los gastos subvencionables podrá ser superior al valor de mercado.</p><p>2. Salvo disposición expresa en contrario en las bases reguladoras de las subvenciones, se considerará gasto realizado el que ha sido efectivamente pagado con anterioridad a la finalización del período de justificación determinado por la normativa reguladora de la subvención.</p><p>Cuando el beneficiario de la subvención sea una empresa, los gastos subvencionables en los que haya incurrido en sus operaciones comerciales deberán haber sido abonados en los plazos de pago previstos en la normativa sectorial que le sea de aplicación o, en su defecto, en los establecidos en la Ley 3/2004, de 29 de diciembre, por la que se establecen medidas de lucha contra la morosidad en las operaciones comerciales.</p><p>3. Cuando el importe del gasto subvencionable supere las cuantías establecidas en la Ley 30/2007, de 30 de octubre, de Contratos del Sector público para el contrato menor, el beneficiario deberá solicitar como mínimo tres ofertas de diferentes proveedores, con carácter previo a la contracción del compromiso para la obra, la prestación del servicio o la entrega del bien, salvo que por sus especiales características no exista en el mercado suficiente número de entidades que los realicen, presten o suministren, o salvo que el gasto se hubiere realizado con anterioridad a la subvención.</p><p>La elección entre las ofertas presentadas, que deberán aportarse en la justificación, o, en su caso, en la solicitud de subvención, se realizará conforme a criterios de eficiencia y economía, debiendo justificarse expresamente en una memoria la elección cuando no recaiga en la propuesta económica más ventajosa.</p><p>4. En el supuesto de adquisición, construcción, rehabilitación y mejora de bienes inventariables, se seguirán las siguientes reglas:</p><p>a) Las bases reguladoras fijarán el período durante el cual el beneficiario deberá destinar los bienes al fin concreto para el que se concedió la subvención, que no podrá ser inferior a cinco años en caso de bienes inscribibles en un registro público, ni a dos años para el resto de bienes.</p><p>En el caso de bienes inscribibles en un registro público, deberá hacerse constar en la escritura esta circunstancia, así como el importe de la subvención concedida, debiendo ser objeto estos extremos de inscripción en el registro público correspondiente.</p><p>b) El incumplimiento de la obligación de destino referida en el párrafo anterior, que se producirá en todo caso con la enajenación o el gravamen del bien, será causa de reintegro, en los términos establecidos en el capítulo II del título II de esta ley, quedando el bien afecto al pago del reintegro cualquiera que sea su poseedor, salvo que resulte ser un tercero protegido por la fe pública registral o se justifique la adquisición de los bienes con buena fe y justo título o en establecimiento mercantil o industrial, en caso de bienes muebles no inscribibles.</p><p>5. No se considerará incumplida la obligación de destino referida en el anterior apartado 4 cuando:</p><p>a) Tratándose de bienes no inscribibles en un registro público, fueran sustituidos por otros que sirvan en condiciones análogas al fin para el que se concedió la subvención y este uso se mantenga hasta completar el período establecido, siempre que la sustitución haya sido autorizada por la Administración concedente.</p><p>b) Tratándose de bienes inscribibles en un registro público, el cambio de destino, enajenación o gravamen sea autorizado por la Administración concedente. En este supuesto, el adquirente asumirá la obligación de destino de los bienes por el período restante y, en caso de incumplimiento de la misma, del reintegro de la subvención.</p><p>6. Las bases reguladoras de las subvenciones establecerán, en su caso, las reglas especiales que se consideren oportunas en materia de amortización de los bienes inventariables. No obstante, el carácter subvencionable del gasto de amortización estará sujeto a las siguientes condiciones:</p><p>a) Que las subvenciones no hayan contribuido a la compra de los bienes.</p><p>b) Que la amortización se calcule de conformidad con las normas de contabilidad generalmente aceptadas.</p><p>c) Que el coste se refiera exclusivamente al período subvencionable.</p><p>7. Los gastos financieros, los gastos de asesoría jurídica o financiera, los gastos notariales y registrales y los gastos periciales para la realización del proyecto subvencionado y los de administración específicos son subvencionables si están directamente relacionados con la actividad subvencionada y son indispensables para la adecuada preparación o ejecución de la misma, y siempre que así se prevea en las bases reguladoras. Con carácter excepcional, los gastos de garantía bancaria podrán ser subvencionados cuando así lo prevea la normativa reguladora de la subvención.</p><p>En ningún caso serán gastos subvencionables:</p><p>a) Los intereses deudores de las cuentas bancarias.</p><p>b) Intereses, recargos y sanciones administrativas y penales.</p><p>c) Los gastos de procedimientos judiciales.</p><p>8. Los tributos son gasto subvencionable cuando el beneficiario de la subvención los abona efectivamente. En ningún caso se consideran gastos subvencionables los impuestos indirectos cuando sean susceptibles de recuperación o compensación ni los impuestos personales sobre la renta.</p><p>9. Los costes indirectos habrán de imputarse por el beneficiario a la actividad subvencionada en la parte que razonablemente corresponda de acuerdo con principios y normas de contabilidad generalmente admitidas y, en todo caso, en la medida en que tales costes correspondan al período en que efectivamente se realiza la actividad.</p>`,dis:`<ul>
<li><b>31.1 — concepto:</b> gastos que <b>de manera indubitada respondan a la naturaleza</b> de la actividad, resulten <b>estrictamente necesarios</b> y se realicen <b>en el plazo</b> de las bases. Si estas no lo fijan, el plazo es el establecido en la propia ley.</li>
<li><b>31.2 — gasto realizado:</b> salvo disposición expresa, se considera realizado el <b>efectivamente pagado</b> con anterioridad a la finalización del periodo de justificación. Si el beneficiario es <b>empresa</b>, los gastos comerciales deben haberse abonado en los <b>plazos de pago</b> de la normativa sectorial o, en su defecto, de la <b>Ley 3/2004</b>.</li>
<li><b>31.3 — tres ofertas:</b> cuando el gasto supere las cuantías del <b>contrato menor</b> de la legislación de contratos, el beneficiario debe solicitar <b>como mínimo tres ofertas</b> de distintos proveedores con carácter previo, salvo que por sus características no exista mercado suficiente. La elección se justifica por <b>criterios de eficiencia y economía</b>, con <b>memoria</b> si no recae en la oferta más ventajosa.</li>
<li><b>31.4 — bienes inventariables:</b> las bases fijan el <b>periodo de destino</b> al fin, que <b>no podrá ser inferior a 5 años</b> en bienes inscribibles en registro público ni a <b>2 años</b> para el resto. En los inscribibles debe constar en escritura e inscribirse. El incumplimiento —que se produce en todo caso con la <b>enajenación o gravamen</b>— es causa de reintegro, quedando el bien afecto al pago.</li>
<li><b>31.7 y 31.8:</b> son subvencionables los gastos financieros, de asesoría jurídica o financiera, notariales, registrales y periciales si están <b>directamente relacionados</b> y son <b>indispensables</b>. Los <b>tributos</b> lo son cuando el beneficiario los abona efectivamente; <b>nunca</b> los impuestos indirectos <b>recuperables o compensables</b> ni los impuestos personales sobre la renta.</li>
<li><b>31.9 — costes indirectos:</b> se imputan en la parte que razonablemente corresponda conforme a principios contables y al periodo en que se realiza la actividad.</li>
</ul>`,llano:`<p>No todo gasto vale. Tiene que ser claramente de la actividad, imprescindible, hecho en plazo y pagado antes de justificar. Si la compra es grande —por encima del contrato menor— hay que pedir tres presupuestos. Si se compran bienes duraderos, hay que mantenerlos destinados al fin cinco años si son registrables y dos si no. Y el IVA solo cuenta si no te lo puedes deducir.</p>`,porque:`<p>La regla de las <b>tres ofertas</b> traslada al beneficiario privado una exigencia de eficiencia propia de la contratación pública: si el dinero es público, no se puede pagar de más por comodidad. Y el <b>periodo de destino</b> evita el fraude clásico de subvencionar la compra de un bien que se revende al año siguiente: por eso el bien queda <b>afecto al pago del reintegro</b> cualquiera que sea su poseedor.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> pedir tres presupuestos antes de una obra en casa y quedarte con el mejor, no con el del cuñado.</li>
<li><b>Real:</b> una asociación subvencionada compra equipamiento por 22.000 €: como supera el umbral del contrato menor, debe pedir <b>tres ofertas</b> y justificar su elección en una memoria si no elige la más barata.</li>
<li><b>Real (destino):</b> un local adquirido con subvención debe destinarse al fin durante <b>al menos cinco años</b>, y así debe constar en escritura e inscribirse.</li>
<li><b>Caso límite:</b> el IVA soportado por una entidad que puede deducírselo <b>no</b> es gasto subvencionable (art. 31.8).</li>
</ul>`,noej:`<ul>
<li><b>No es subvencionable</b> un gasto realizado fuera del plazo de ejecución, aunque esté pagado.</li>
<li><b>No lo son</b> los impuestos indirectos recuperables ni los impuestos personales sobre la renta.</li>
<li><b>No se exige</b> tres ofertas por debajo del umbral del contrato menor.</li>
</ul>`,conex:`<ul>
<li><b>Art. 30 LGS:</b> justificación de estos gastos.</li>
<li><b>Art. 118 de la Ley 9/2017</b> (documento 7): cuantías del contrato menor, a las que remite el art. 31.3.</li>
<li><b>Art. 37.1 LGS:</b> el incumplimiento del destino como causa de reintegro.</li>
<li><b>Art. 29 LGS:</b> subcontratación, cuando el gasto implica encargar la actividad a terceros.</li>
</ul>`,trampas:`<ul>
<li>Los plazos de destino: <b>5 años</b> registrables y <b>2 años</b> el resto.</li>
<li>La regla de las <b>tres ofertas</b> se activa al superar la cuantía del <b>contrato menor</b> de la legislación de contratos, no una cifra propia de la LGS.</li>
<li>El texto remite a la <b>Ley 30/2007</b>: hoy, <b>Ley 9/2017</b>.</li>
<li>Gasto realizado = <b>efectivamente pagado</b> antes de que termine el periodo de justificación, salvo disposición expresa.</li>
</ul>`,ancla:`<p><b>"Necesario, en plazo y pagado."</b> Tres ofertas si es grande; <b>5 y 2</b> años de destino; y el <b>IVA solo si no se recupera</b>.</p>`,vis:`<svg viewBox="0 0 640 175" role="img" aria-label="Requisitos del gasto subvencionable">

{n:32,t:"Comprobación de subvenciones",ubic:"Título I ▸ Capítulo IV (Del procedimiento de gestión y justificación de la subvención pública)",idea:"El órgano concedente comprueba la justificación, la actividad y la finalidad.",literal:`<p>1. El órgano concedente comprobará la adecuada justificación de la subvención, así como la realización de la actividad y el cumplimiento de la finalidad que determinen la concesión o disfrute de la subvención.</p><p>2. La entidad colaboradora, en su caso, realizará, en nombre y por cuenta del órgano concedente, las comprobaciones previstas en el párrafo b) del apartado 1 del artículo 15 de esta ley.</p>`,dis:`<ul>
<li><b>32.1:</b> el <b>órgano concedente</b> comprobará la <b>adecuada justificación</b>, la <b>realización de la actividad</b> y el <b>cumplimiento de la finalidad</b>.</li>
<li><b>32.2:</b> la <b>entidad colaboradora</b>, en su caso, realiza <b>en nombre y por cuenta</b> del órgano concedente las comprobaciones del art. 15.1.b).</li>
</ul>`,llano:`<p>Presentar la justificación no cierra el círculo: alguien tiene que mirarla. Ese alguien es el órgano que concedió la subvención, y si hay entidad colaboradora, esta comprueba en su nombre.</p>`,porque:`<p>Sin comprobación, la justificación sería un trámite formal. La ley distingue tres objetos de comprobación —<b>justificación, realización y finalidad</b>— porque no son lo mismo: se puede justificar documentalmente un gasto que no corresponde a la actividad, o realizar la actividad sin cumplir la finalidad perseguida.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> entregar los tiques del viaje no basta: quien te dio el dinero querrá saber que el viaje se hizo.</li>
<li><b>Real:</b> el técnico municipal revisa la cuenta justificativa del festival, comprueba los carteles y las actas de asistencia y emite informe de conformidad.</li>
</ul>`,noej:`<ul>
<li><b>No sustituye</b> esta comprobación al <b>control financiero</b> de los arts. 44 y siguientes.</li>
<li><b>No corresponde</b> a la entidad colaboradora comprobar por cuenta propia: lo hace en nombre del concedente.</li>
</ul>`,conex:`<ul>
<li><b>Art. 15.1.b) LGS:</b> obligación de comprobar de la entidad colaboradora.</li>
<li><b>Art. 30 LGS:</b> la justificación que se comprueba.</li>
<li><b>Arts. 44 y ss. LGS:</b> control financiero de subvenciones.</li>
<li><b>Art. 214 TRLHL</b> (documento 5): comprobación material de la aplicación de las subvenciones por la Intervención.</li>
</ul>`,trampas:`<ul>
<li>Son <b>tres</b> objetos: justificación, realización de la actividad y cumplimiento de la finalidad.</li>
<li>La comprobación de la colaboradora es <b>en nombre y por cuenta</b> del órgano concedente.</li>
</ul>`,ancla:`<p><b>"¿Está justificado, se hizo y sirvió para lo que era?"</b> Tres preguntas, un artículo.</p>`,vis:`<svg viewBox="0 0 640 120" role="img" aria-label="Comprobación de subvenciones">

{n:33,t:"Comprobación de valores",ubic:"Título I ▸ Capítulo IV (Del procedimiento de gestión y justificación de la subvención pública)",idea:"La Administración puede comprobar el valor de mercado y cabe tasación pericial contradictoria.",literal:`<p>1. La Administración podrá comprobar el valor de mercado de los gastos subvencionados empleando uno o varios de los siguientes medios:</p><p>a) Precios medios de mercado.</p><p>b) Cotizaciones en mercados nacionales y extranjeros.</p><p>c) Estimación por referencia a los valores que figuren en los registros oficiales de carácter fiscal.</p><p>d) Dictamen de peritos de la Administración.</p><p>e) Tasación pericial contradictoria.</p><p>f) Cualesquiera otros medios de prueba admitidos en derecho.</p><p>2. El valor comprobado por la Administración servirá de base para el cálculo de la subvención y se notificará, debidamente motivado y con expresión de los medios y criterios empleados, junto con la resolución del acto que contiene la liquidación de la subvención.</p><p>3. El beneficiario podrá, en todo caso, promover la tasación pericial contradictoria, en corrección de los demás procedimientos de comprobación de valores señalados en el apartado 1 de este artículo, dentro del plazo del primer recurso que proceda contra la resolución del procedimiento en el que la Administración ejerza la facultad prevista en el apartado anterior.</p><p>La presentación de la solicitud de tasación pericial contradictoria determinará la suspensión de la ejecución del procedimiento resuelto y del plazo para interponer recurso contra éste.</p><p>4. Si la diferencia entre el valor comprobado por la Administración y la tasación practicada por el perito del beneficiario es inferior a 120.000 euros y al 10 por ciento del valor comprobado por la Administración, la tasación del perito del beneficiario servirá de base para el cálculo de la subvención. En caso contrario, deberá designarse un perito tercero en los términos que se determinen reglamentariamente.</p><p>Los honorarios del perito del beneficiario serán satisfechos por éste. Cuando la tasación practicada por el perito tercero fuese inferior al valor justificado por el beneficiario, todos los gastos de la pericia serán abonados por éste, y, por el contrario, caso de ser superior, serán de cuenta de la Administración.</p><p>La valoración del perito tercero servirá de base para la determinación del importe de la subvención.</p>`,dis:`<ul>
<li><b>33.1:</b> la Administración puede <b>comprobar el valor de mercado</b> de los gastos subvencionados empleando uno o varios de los medios que enumera el precepto.</li>
<li><b>33.2:</b> el valor comprobado <b>sirve de base para el cálculo</b> de la subvención y se notifica motivado, con expresión de medios y criterios, junto con la resolución que contiene la <b>liquidación</b>.</li>
<li><b>33.3:</b> el beneficiario puede promover <b>tasación pericial contradictoria</b> dentro del plazo del primer recurso que proceda. Su solicitud <b>suspende</b> la ejecución del procedimiento y el plazo para recurrir.</li>
<li><b>33.4 — regla del doble umbral:</b> si la diferencia entre el valor comprobado por la Administración y la tasación del perito del beneficiario es <b>inferior a 120.000 €</b> <b>y</b> al <b>10 % del valor comprobado</b>, prevalece la <b>tasación del perito del beneficiario</b>; en caso contrario, se designa <b>perito tercero</b>.</li>
</ul>`,llano:`<p>Si la Administración sospecha que un gasto está inflado, puede comprobar cuánto vale realmente en el mercado y calcular la subvención sobre ese valor. El beneficiario puede defenderse con su propio perito. Si las dos valoraciones están cerca —menos de 120.000 € y menos del 10 % de diferencia—, gana la del beneficiario; si no, decide un tercero.</p>`,porque:`<p>Sin esta facultad, bastaría con presentar facturas por importes sobrevalorados para multiplicar la subvención. La <b>tasación pericial contradictoria</b> equilibra el sistema: la Administración no puede imponer su valoración sin contradicción. Y el doble umbral evita procedimientos largos y costosos por discrepancias menores.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> una aseguradora que valora el daño y te permite traer tu propio perito.</li>
<li><b>Real:</b> valor comprobado por la Administración 200.000 €; tasación del perito del beneficiario 185.000 €. La diferencia es de 15.000 €: inferior a 120.000 € e inferior al 10 % del valor comprobado (20.000 €). Se cumplen <b>ambos</b> límites, luego prevalece la <b>tasación del beneficiario</b>.</li>
<li><b>Caso límite:</b> si la tasación del beneficiario fuera de 160.000 €, la diferencia (40.000 €) superaría el 10 % y habría que acudir a <b>perito tercero</b>.</li>
</ul>`,noej:`<ul>
<li><b>No cabe</b> promover la tasación fuera del plazo del primer recurso que proceda.</li>
<li><b>No basta</b> con superar uno de los dos umbrales: han de cumplirse <b>ambos</b> para que prevalezca la tasación del beneficiario.</li>
</ul>`,conex:`<ul>
<li><b>Art. 31 LGS:</b> gastos subvencionables cuyo valor se comprueba.</li>
<li><b>Art. 30.5 LGS:</b> certificado de tasador independiente en la adquisición de inmuebles.</li>
<li><b>Art. 37 LGS:</b> reintegro del exceso resultante de la comprobación.</li>
</ul>`,trampas:`<ul>
<li>Los dos umbrales del 33.4 son <b>acumulativos</b>: <b>120.000 €</b> y <b>10 %</b>.</li>
<li>La solicitud de tasación <b>suspende</b> la ejecución y el plazo de recurso.</li>
<li>El valor comprobado sirve de base para el <b>cálculo de la subvención</b>, no solo para el reintegro.</li>
</ul>`,ancla:`<p><b>"120.000 y 10 %."</b> Si la diferencia queda por debajo de ambos, <b>gana tu perito</b>.</p>`,vis:`<svg viewBox="0 0 640 150" role="img" aria-label="Comprobación de valores y tasación pericial contradictoria">

{n:34,t:"Procedimiento de aprobación del gasto y pago",ubic:"Título I ▸ Capítulo V (Del procedimiento de gestión presupuestaria)",idea:"Primero se aprueba el gasto, después se paga previa justificación; nunca a quien debe.",literal:`<p>1. Con carácter previo a la convocatoria de la subvención o a la concesión directa de la misma, deberá efectuarse la aprobación del gasto en los términos previstos en la Ley General Presupuestaria o en las normas presupuestarias de las restantes Administraciones públicas.</p><p>2. La resolución de concesión de la subvención conllevará el compromiso del gasto correspondiente.</p><p>3. El pago de la subvención se realizará previa justificación, por el beneficiario, de la realización de la actividad, proyecto, objetivo o adopción del comportamiento para el que se concedió en los términos establecidos en la normativa reguladora de la subvención.</p><p>Se producirá la pérdida del derecho al cobro total o parcial de la subvención en el supuesto de falta de justificación o de concurrencia de alguna de las causas previstas en el artículo 37 de esta ley.</p><p>4. Cuando la naturaleza de la subvención así lo justifique, podrán realizarse pagos a cuenta. Dichos abonos a cuenta podrán suponer la realización de pagos fraccionados que responderán al ritmo de ejecución de las acciones subvencionadas, abonándose por cuantía equivalente a la justificación presentada.</p><p>También se podrán realizar pagos anticipados que supondrán entregas de fondos con carácter previo a la justificación, como financiación necesaria para poder llevar a cabo las actuaciones inherentes a la subvención. Dicha posibilidad y el régimen de garantías deberán preverse expresamente en la normativa reguladora de la subvención.</p><p>En ningún caso podrán realizarse pagos anticipados a beneficiarios cuando se haya solicitado la declaración de concurso voluntario, haber sido declarados insolventes en cualquier procedimiento, hallarse declarado en concurso, salvo que en éste haya adquirido la eficacia un convenio, estar sujetos a intervención judicial o haber sido inhabilitados conforme a la Ley 22/2003, de 9 de julio, Concursal, sin que haya concluido el período de inhabilitación fijado en la sentencia de calificación del concurso.</p><p>La realización de pagos a cuenta o pagos anticipados, así como el régimen de garantías, deberán preverse expresamente en la normativa reguladora de la subvención.</p><p>5. No podrá realizarse el pago de la subvención en tanto el beneficiario no se halle al corriente en el cumplimiento de sus obligaciones tributarias y frente a la Seguridad Social o sea deudor por resolución de procedencia de reintegro.</p>`,dis:`<ul>
<li><b>34.1 — aprobación del gasto:</b> con carácter <b>previo a la convocatoria o a la concesión directa</b>, debe aprobarse el gasto conforme a la normativa presupuestaria.</li>
<li><b>34.2 — compromiso:</b> la <b>resolución de concesión</b> conlleva el <b>compromiso del gasto</b>.</li>
<li><b>34.3 — regla del pago:</b> el pago se realiza <b>previa justificación</b> por el beneficiario. La falta de justificación o la concurrencia de causas del art. 37 produce la <b>pérdida del derecho al cobro</b> total o parcial.</li>
<li><b>34.4 — excepciones:</b>
<ul><li><span class="t" data-k="acuenta">pagos a cuenta</span>: fraccionados, al ritmo de ejecución y por cuantía equivalente a la justificación presentada;</li>
<li><span class="t" data-k="anticipado">pagos anticipados</span>: entregas de fondos <b>previas a la justificación</b> como financiación necesaria. Exigen <b>previsión expresa</b> en la normativa reguladora y <b>régimen de garantías</b>;</li>
<li><b>prohibición:</b> no caben pagos anticipados a beneficiarios en situaciones concursales o de insolvencia.</li></ul></li>
<li><b>34.5 — no pagar a quien debe:</b> no podrá realizarse el pago mientras el beneficiario <b>no se halle al corriente</b> con Hacienda y la Seguridad Social o sea <b>deudor por resolución de procedencia de reintegro</b>.</li>
</ul>`,llano:`<p>El orden es: primero se aprueba el gasto, luego se concede —y eso compromete el dinero—, y por último se paga, pero solo después de justificar. Hay dos excepciones: pagar a plazos según se va ejecutando, o adelantar el dinero si las bases lo permiten y con garantías. Y en ningún caso se paga a quien tiene deudas con Hacienda, con la Seguridad Social o por un reintegro.</p>`,porque:`<p>El pago previa justificación protege el interés público: se paga por lo hecho, no por lo prometido. Pero muchas entidades sociales no tienen tesorería para adelantar la actividad, y por eso la ley admite anticipos: la <b>garantía</b> compensa el riesgo. Y la prohibición del apartado 5 evita el contrasentido de pagar con una mano a quien debe con la otra.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> pagar la reforma al terminar, salvo que el albañil pida un adelanto y te dé un aval.</li>
<li><b>Real:</b> las bases de una convocatoria municipal prevén un pago anticipado del 50 % con dispensa de garantías para entidades sin ánimo de lucro, y el 50 % restante tras la justificación.</li>
<li><b>Caso límite:</b> una asociación beneficiaria tiene una deuda por reintegro de una subvención anterior: <b>no puede pagársele</b> mientras no la salde (art. 34.5).</li>
</ul>`,noej:`<ul>
<li><b>No cabe</b> el pago anticipado si la normativa reguladora no lo prevé expresamente.</li>
<li><b>No procede</b> el pago anticipado a beneficiarios en concurso o insolvencia.</li>
<li><b>No es</b> el pago a cuenta un anticipo: responde a justificación ya presentada.</li>
</ul>`,conex:`<ul>
<li><b>Art. 17.3.k) LGS:</b> las bases deben prever los pagos anticipados y el régimen de garantías.</li>
<li><b>Art. 21 LGS:</b> régimen de garantías, remitido al reglamento.</li>
<li><b>Arts. 184 y 189 TRLHL</b> (documento 5): fases del gasto y requisitos previos a la orden de pago.</li>
<li><b>Art. 37 LGS:</b> causas que producen la pérdida del derecho al cobro.</li>
</ul>`,trampas:`<ul>
<li>La aprobación del gasto es <b>previa a la convocatoria</b>, no a la resolución.</li>
<li><b>Pago a cuenta</b> (tras justificación parcial) frente a <b>pago anticipado</b> (antes de justificar): no son lo mismo.</li>
<li>El impedimento del 34.5 alcanza también al <b>deudor por resolución de procedencia de reintegro</b>.</li>
</ul>`,ancla:`<p><b>"Apruebo, concedo, justifico y pago."</b> Y las dos excepciones: <b>a cuenta</b> (voy pagando lo hecho) y <b>anticipado</b> (adelanto con garantía).</p>`,vis:`<svg viewBox="0 0 640 165" role="img" aria-label="Procedimiento de aprobación del gasto y pago">

{n:35,t:"Retención de pagos",ubic:"Título I ▸ Capítulo V (Del procedimiento de gestión presupuestaria)",idea:"Iniciado el reintegro, cabe suspender cautelarmente los pagos pendientes.",literal:`<p>1. Una vez acordado el inicio del procedimiento de reintegro, como medida cautelar, el órgano concedente puede acordar, a iniciativa propia o de una decisión de la Comisión Europea o a propuesta de la Intervención General de la Administración del Estado o de la autoridad pagadora, la suspensión de los libramientos de pago de las cantidades pendientes de abonar al beneficiario o entidad colaboradora, sin superar, en ningún caso, el importe que fijen la propuesta o resolución de inicio del expediente de reintegro, con los intereses de demora devengados hasta aquel momento.</p><p>2. La imposición de esta medida cautelar debe acordarse por resolución motivada, que debe notificarse al interesado, con indicación de los recursos pertinentes.</p><p>3. En todo caso, procederá la suspensión si existen indicios racionales que permitan prever la imposibilidad de obtener el resarcimiento, o si éste puede verse frustrado o gravemente dificultado, y, en especial, si el perceptor hace actos de ocultación, gravamen o disposición de sus bienes.</p><p>4. La retención de pagos estará sujeta, en cualquiera de los supuestos anteriores, al siguiente régimen jurídico:</p><p>a) Debe ser proporcional a la finalidad que se pretende conseguir, y, en ningún caso, debe adoptarse si puede producir efectos de difícil o imposible reparación.</p><p>b) Debe mantenerse hasta que se dicte la resolución que pone fin al expediente de reintegro, y no puede superar el período máximo que se fije para su tramitación, incluidas prórrogas.</p><p>c) No obstante lo dispuesto en el párrafo anterior, debe levantarse cuando desaparezcan las circunstancias que la originaron o cuando el interesado proponga la sustitución de esta medida cautelar por la constitución de una garantía que se considere suficiente.</p>`,dis:`<ul>
<li><b>35.1 — medida cautelar:</b> una vez <b>acordado el inicio del procedimiento de reintegro</b>, el órgano concedente puede acordar —de oficio, por decisión de la Comisión Europea o a propuesta de la IGAE o de la autoridad pagadora— la <b>suspensión de los libramientos de pago</b> de las cantidades pendientes sin superar, en ningún caso, el importe objeto de reintegro más los intereses y recargos.</li>
<li><b>35.2 — forma:</b> se acuerda por <b>resolución motivada</b>, que se notifica al interesado con indicación de los recursos.</li>
<li><b>35.3 — supuestos:</b> procede <b>en todo caso</b> si existen indicios racionales que permitan prever la <b>imposibilidad de obtener el resarcimiento</b>, o si este puede verse frustrado o gravemente dificultado, y en especial si el perceptor realiza <b>actos de ocultación, gravamen o disposición</b> de sus bienes.</li>
<li><b>35.4:</b> la retención se sujeta al régimen jurídico que el propio precepto detalla.</li>
</ul>`,llano:`<p>Si se ha abierto un expediente para exigir la devolución de una subvención, la Administración puede congelar los pagos que aún le debe a ese beneficiario, hasta cubrir lo que se le reclama. Es una medida cautelar: se acuerda por escrito, motivada y con recursos.</p>`,porque:`<p>Sin esta medida, la Administración podría estar pagando con una mano lo que reclama con la otra, y el reintegro se volvería ilusorio si el beneficiario vacía su patrimonio. Es la traducción subvencional del <b>periculum in mora</b>: se asegura el resultado del procedimiento mientras se tramita.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> retener el último pago de una obra mientras se discute un defecto.</li>
<li><b>Real:</b> iniciado un reintegro de 18.000 € contra una entidad, el ayuntamiento suspende cautelarmente el libramiento de otra subvención pendiente por 25.000 €, limitando la retención a 18.000 € más intereses.</li>
<li><b>Caso límite:</b> si la entidad comienza a vender sus bienes, procede la suspensión de forma reforzada por el art. 35.3.</li>
</ul>`,noej:`<ul>
<li><b>No cabe</b> antes de acordar el inicio del procedimiento de reintegro.</li>
<li><b>No puede</b> superar el importe objeto de reintegro más intereses y recargos.</li>
<li><b>No es</b> una sanción: es una medida cautelar.</li>
</ul>`,conex:`<ul>
<li><b>Arts. 36 a 43 LGS:</b> régimen del reintegro y su procedimiento.</li>
<li><b>Art. 34.5 LGS:</b> prohibición de pagar a quien es deudor por reintegro.</li>
<li><b>Art. 56 de la Ley 39/2015</b> (documento 1): medidas provisionales en el procedimiento administrativo.</li>
</ul>`,trampas:`<ul>
<li>Exige que ya se haya <b>acordado el inicio</b> del procedimiento de reintegro.</li>
<li>El límite cuantitativo: <b>el importe objeto de reintegro más intereses y recargos</b>.</li>
<li>Puede acordarse a iniciativa propia, por decisión de la <b>Comisión Europea</b> o a propuesta de la <b>IGAE</b> o de la autoridad pagadora.</li>
</ul>`,ancla:`<p><b>"Si te voy a reclamar, no te sigo pagando."</b> Medida cautelar, motivada y con límite.</p>`,vis:`<svg viewBox="0 0 640 140" role="img" aria-label="Retención de pagos como medida cautelar">

<script>
const PLAZOS=[["6 meses", "Plazo máximo para resolver y notificar la concesión", "Órgano concedente", "25.4 LGS", "Desde la publicación de la convocatoria; silencio desestimatorio"], ["10 días", "Plazo de subsanación de la solicitud", "Solicitante", "23.5 LGS", "Máximo e improrrogable; en otro caso, desistimiento"], ["10 días", "Plazo de alegaciones tras la propuesta de resolución provisional", "Interesados", "24.4 LGS", "Cabe prescindir del trámite en el supuesto legal"], ["10 días", "Plazo de emisión de los informes solicitados en la instrucción", "Órganos informantes", "24.3.a) LGS", "Salvo que se solicite otro plazo"], ["3 meses", "Plazo supletorio para presentar la cuenta justificativa", "Beneficiario", "30.2 LGS", "Desde la finalización del plazo para realizar la actividad"], ["20 % y 60.000 €", "Umbrales acumulativos que exigen contrato escrito y autorización previa en subcontratación", "Beneficiario", "29.3 LGS", "Prohibido fraccionar para eludirlos"], ["5 años / 2 años", "Periodo mínimo de destino de los bienes inventariables", "Beneficiario", "31.4.a) LGS", "Registrables / resto de bienes"], ["Contrato menor", "Umbral a partir del cual hay que pedir tres ofertas", "Beneficiario", "31.3 LGS", "Cuantías de la legislación de contratos"], ["120.000 € y 10 %", "Umbrales acumulativos que hacen prevalecer la tasación del perito del beneficiario", "Beneficiario", "33.4 LGS", "En otro caso, perito tercero"], ["Previo", "Momento de aprobación del gasto", "Órgano concedente", "34.1 LGS", "Antes de la convocatoria o de la concesión directa"]];
const FLASH=[["¿Cuál es el procedimiento ordinario de concesión?", "La <b>concurrencia competitiva</b>: comparación de solicitudes, prelación conforme a criterios previos y adjudicación dentro del crédito disponible (art. 22.1)."], ["Los tres supuestos de concesión directa", "Subvenciones <b>nominativas</b> en los presupuestos · las impuestas por <b>norma de rango legal</b> · con carácter <b>excepcional</b>, las de interés público, social, económico o humanitario (art. 22.2)."], ["¿Qué es una subvención nominativa?", "Aquella en que al menos la <b>dotación presupuestaria y el beneficiario</b> aparecen determinados en los estados de gasto del presupuesto (art. 22.2.a)."], ["¿Cómo se inicia el procedimiento de concesión?", "<b>Siempre de oficio</b>, mediante convocatoria aprobada por el órgano competente (art. 23.1 y 23.2)."], ["¿Qué plazo hay para subsanar la solicitud?", "<b>10 días</b>, máximo e improrrogable; en otro caso se tiene por desistido previa resolución (art. 23.5)."], ["¿Quién formula la propuesta de concesión?", "El <b>órgano colegiado</b>, a través del <b>órgano instructor</b> (art. 22.1)."], ["Las dos propuestas del procedimiento", "<b>Provisional</b>, con 10 días de alegaciones, y <b>definitiva</b>, con solicitantes, cuantía y criterios (art. 24.4)."], ["¿Crean derecho las propuestas de resolución?", "<b>No</b>: no crean derecho alguno mientras no se notifique la resolución de concesión (art. 24.6)."], ["¿Cuándo puede prescindirse del trámite de audiencia?", "Cuando no figuren en el procedimiento ni se tengan en cuenta otros hechos, alegaciones y pruebas que las aducidas por los interesados; la propuesta será entonces definitiva (art. 24.4)."], ["Plazo máximo para resolver y notificar", "<b>Seis meses</b> desde la publicación de la convocatoria, salvo norma con rango de ley o normativa de la Unión (art. 25.4)."], ["¿Qué efecto tiene el silencio?", "<b>Desestimatorio</b>: legitima al interesado para entender desestimada su solicitud (art. 25.5)."], ["¿Qué es la reformulación de solicitudes?", "El ajuste de la solicitud cuando el importe propuesto es <b>inferior</b> al solicitado, si las bases lo prevén, respetando objeto, condiciones, finalidad y criterios (art. 27)."], ["¿Cómo se canalizan las subvenciones nominativas?", "Habitualmente mediante <b>convenio</b> (art. 28.1)."], ["¿Qué exige el supuesto excepcional del art. 22.2.c)?", "<b>Real decreto</b> del Gobierno con las normas especiales reguladoras, previo informe del Ministerio de Hacienda (art. 28.2)."], ["¿Cuándo hay subcontratación?", "Cuando el beneficiario <b>concierta con terceros</b> la ejecución total o parcial de la actividad. No lo es contratar los gastos para realizarla por sí mismo (art. 29.1)."], ["¿Qué requisitos exige subcontratar más del 20 % y por más de 60.000 €?", "<b>Contrato por escrito</b> y <b>autorización previa</b> del órgano concedente (art. 29.3)."], ["¿Puede subcontratarse con personas vinculadas?", "Solo con <b>autorización previa expresa</b> y si el importe no excede del <b>coste incurrido</b> por la entidad vinculada (art. 29.7.d)."], ["Plazo supletorio de la cuenta justificativa", "<b>Tres meses</b> desde la finalización del plazo para realizar la actividad, a falta de previsión en las bases (art. 30.2)."], ["¿Cuándo hay que pedir tres ofertas?", "Cuando el gasto subvencionable supere las cuantías del <b>contrato menor</b> de la legislación de contratos (art. 31.3)."], ["Periodo de destino de los bienes inventariables", "No inferior a <b>5 años</b> en bienes inscribibles en registro público ni a <b>2 años</b> para el resto (art. 31.4.a)."], ["¿Es subvencionable el IVA?", "No cuando sea <b>recuperable o compensable</b>; tampoco los impuestos personales sobre la renta (art. 31.8)."], ["¿Qué comprueba el órgano concedente?", "La adecuada <b>justificación</b>, la <b>realización de la actividad</b> y el <b>cumplimiento de la finalidad</b> (art. 32.1)."], ["Regla del art. 33.4", "Si la diferencia entre el valor comprobado y la tasación del perito del beneficiario es inferior a <b>120.000 €</b> y al <b>10 %</b>, prevalece la del beneficiario; si no, perito tercero."], ["¿Cuándo se aprueba el gasto?", "Con carácter <b>previo a la convocatoria</b> o a la concesión directa (art. 34.1). La resolución de concesión conlleva el compromiso del gasto."], ["Diferencia entre pago a cuenta y pago anticipado", "El <b>pago a cuenta</b> responde a justificación ya presentada; el <b>anticipado</b> se entrega antes de justificar y exige previsión expresa y garantías (art. 34.4)."], ["¿A quién no puede pagarse?", "A quien no se halle al corriente con Hacienda y la Seguridad Social o sea <b>deudor por resolución de procedencia de reintegro</b> (art. 34.5)."], ["¿Qué permite el art. 35?", "Suspender cautelarmente los libramientos de pago pendientes una vez acordado el inicio del procedimiento de reintegro, sin superar el importe a reintegrar más intereses y recargos."]];
const TEST=[{"a": 22, "q": "El procedimiento ordinario de concesión de subvenciones es:", "o": [["la concurrencia competitiva", 1, "Correcto: art. 22.1 LGS. La concesión directa es excepcional y tasada."], ["la concesión directa", 0, "Solo cabe en los tres supuestos del art. 22.2."], ["el sorteo entre solicitantes", 0, "No está previsto en la ley."], ["el prorrateo entre todos los solicitantes", 0, "El prorrateo es excepcional y exige previsión en las bases."]]}, {"a": 22, "q": "¿Cuál NO es un supuesto de concesión directa?", "o": [["la urgencia apreciada por el órgano gestor sin más motivación", 1, "Correcto: la letra c) exige acreditar razones de interés público, social, económico o humanitario y la dificultad de convocatoria pública."], ["las subvenciones previstas nominativamente en los presupuestos", 0, "Sí lo es: letra a)."], ["aquellas cuyo otorgamiento venga impuesto por norma de rango legal", 0, "Sí lo es: letra b)."], ["las excepcionales por razones humanitarias debidamente acreditadas", 0, "Sí lo es: letra c)."]]}, {"a": 23, "q": "El procedimiento de concesión de subvenciones se inicia:", "o": [["siempre de oficio, mediante convocatoria", 1, "Correcto: art. 23.1 y 23.2 LGS."], ["a solicitud del interesado", 0, "La solicitud se presenta dentro de una convocatoria ya iniciada de oficio."], ["de oficio o a instancia de parte, indistintamente", 0, "La ley dice «siempre de oficio»."], ["por acuerdo del órgano colegiado", 0, "El órgano colegiado interviene en la instrucción, no en el inicio."]]}, {"a": 23, "q": "Completa: «Si la solicitud no reúne los requisitos, se requerirá al interesado para que la subsane en el plazo máximo e improrrogable de ______ días».", "gap": "10", "fb": "<b>10 días</b> (art. 23.5 LGS), con advertencia de que en otro caso se le tendrá por desistido previa resolución."}, {"a": 24, "q": "Las propuestas de resolución provisional y definitiva:", "o": [["no crean derecho alguno frente a la Administración mientras no se notifique la resolución de concesión", 1, "Correcto: art. 24.6 LGS."], ["equivalen a la concesión de la subvención", 0, "No: solo la resolución concede."], ["son irrecurribles por ser actos de trámite cualificados", 0, "No es lo que dice el precepto: la clave es que no crean derecho."], ["obligan al pago inmediato del importe propuesto", 0, "El pago exige resolución y, además, justificación previa (art. 34.3)."]]}, {"a": 24, "q": "Puede prescindirse del trámite de audiencia cuando no figuren ni se tengan en cuenta otros hechos, alegaciones o pruebas que las aducidas por los interesados.", "vf": true, "ok": true, "fb": "<b>Verdadero</b> (art. 24.4 LGS). En ese caso, la propuesta de resolución formulada tendrá el carácter de definitiva."}, {"a": 25, "q": "El plazo máximo para resolver y notificar el procedimiento de concesión es de:", "o": [["seis meses desde la publicación de la convocatoria", 1, "Correcto: art. 25.4 LGS, salvo norma con rango de ley o normativa de la Unión."], ["tres meses desde la presentación de la solicitud", 0, "No es el plazo ni el dies a quo del precepto."], ["un mes desde la propuesta de resolución definitiva", 0, "No está previsto así."], ["el que libremente fije la convocatoria", 0, "La convocatoria lo indica, pero dentro del máximo legal."]]}, {"a": 25, "q": "El vencimiento del plazo máximo sin notificar la resolución produce:", "o": [["la desestimación de la solicitud por silencio administrativo", 1, "Correcto: art. 25.5 LGS."], ["la concesión por silencio positivo", 0, "No: el silencio es desestimatorio."], ["la caducidad automática del procedimiento", 0, "El efecto que la ley anuda es el silencio desestimatorio."], ["la obligación de repetir la convocatoria", 0, "No está previsto."]]}, {"a": 27, "q": "La reformulación de solicitudes procede cuando:", "o": [["el importe de la propuesta provisional es inferior al solicitado y las bases lo prevén", 1, "Correcto: art. 27.1 LGS."], ["el beneficiario desea cambiar el objeto del proyecto", 0, "Prohibido: la reformulación debe respetar objeto, condiciones y finalidad (art. 27.3)."], ["han transcurrido seis meses sin resolución", 0, "Ese supuesto produce silencio desestimatorio."], ["lo solicita el órgano colegiado por su cuenta", 0, "Se insta del beneficiario tras la propuesta provisional."]]}, {"a": 28, "q": "El instrumento habitual para canalizar las subvenciones previstas nominativamente en los presupuestos es:", "o": [["el convenio", 1, "Correcto: art. 28.1 LGS."], ["la convocatoria pública", 0, "La convocatoria corresponde a la concurrencia competitiva."], ["el contrato administrativo", 0, "Confundiría subvención y contrato."], ["la resolución de la Comisión Europea", 0, "No procede."]]}, {"a": 29, "q": "La subcontratación exige contrato por escrito y autorización previa cuando:", "o": [["excede del 20 % del importe de la subvención y dicho importe supera los 60.000 euros", 1, "Correcto: art. 29.3 LGS. Ambos requisitos son acumulativos."], ["excede del 20 % del importe, cualquiera que sea la cuantía", 0, "Falta el segundo umbral de 60.000 €."], ["supera los 60.000 euros, cualquiera que sea el porcentaje", 0, "Falta el umbral del 20 %."], ["en todo caso, cualquiera que sea su cuantía", 0, "No: la ley fija umbrales."]]}, {"a": 29, "q": "El beneficiario puede subcontratar libremente aunque la normativa reguladora no lo prevea.", "vf": true, "ok": false, "fb": "<b>Falso.</b> El art. 29.2 LGS solo permite subcontratar <b>cuando la normativa reguladora así lo prevea</b> y dentro del porcentaje que fijen las bases."}, {"a": 30, "q": "A falta de previsión en las bases, la cuenta justificativa se presenta como máximo en el plazo de:", "o": [["tres meses desde la finalización del plazo para realizar la actividad", 1, "Correcto: art. 30.2 LGS."], ["un mes desde el cobro de la subvención", 0, "No es el plazo legal."], ["seis meses desde la concesión", 0, "No es el plazo legal."], ["el que decida el beneficiario", 0, "El plazo es legal y supletorio."]]}, {"a": 31, "q": "Cuando el gasto subvencionable supera las cuantías del contrato menor, el beneficiario debe:", "o": [["solicitar como mínimo tres ofertas de diferentes proveedores con carácter previo", 1, "Correcto: art. 31.3 LGS, con memoria justificativa si no elige la más ventajosa."], ["licitar conforme a la Ley 9/2017", 0, "El beneficiario no es poder adjudicador por el hecho de recibir la subvención."], ["solicitar autorización al órgano concedente", 0, "Esa exigencia es la del art. 29.3 en subcontratación."], ["nada especial: elige libremente", 0, "La ley impone las tres ofertas."]]}, {"a": 31, "q": "El periodo mínimo de destino de los bienes inscribibles en un registro público es de:", "o": [["cinco años", 1, "Correcto: art. 31.4.a) LGS; dos años para el resto de bienes."], ["dos años", 0, "Ese es el plazo del resto de bienes."], ["diez años", 0, "No es el plazo legal."], ["el que fijen libremente las bases sin mínimo", 0, "Las bases lo fijan, pero con los mínimos legales."]]}, {"a": 32, "q": "La comprobación de la subvención alcanza a:", "o": [["la adecuada justificación, la realización de la actividad y el cumplimiento de la finalidad", 1, "Correcto: art. 32.1 LGS."], ["solo a la corrección formal de las facturas", 0, "Insuficiente: también actividad y finalidad."], ["exclusivamente al control financiero posterior", 0, "Ese es otro régimen (arts. 44 y ss.)."], ["a la solvencia económica del beneficiario", 0, "No es el objeto de este artículo."]]}, {"a": 33, "q": "Completa: «Si la diferencia entre el valor comprobado y la tasación del perito del beneficiario es inferior a ______ euros y al 10 por ciento del valor comprobado, prevalecerá la tasación del perito del beneficiario».", "gap": "120.000", "fb": "<b>120.000 euros</b> (art. 33.4 LGS). Ambos límites son acumulativos."}, {"a": 34, "q": "La aprobación del gasto debe efectuarse:", "o": [["con carácter previo a la convocatoria o a la concesión directa", 1, "Correcto: art. 34.1 LGS."], ["tras la resolución de concesión", 0, "La resolución conlleva el compromiso, no la aprobación."], ["en el momento del pago", 0, "Sería tardío."], ["solo en subvenciones superiores a 60.000 euros", 0, "No hay umbral."]]}, {"a": 34, "q": "Pueden realizarse pagos anticipados a un beneficiario declarado en concurso.", "vf": true, "ok": false, "fb": "<b>Falso.</b> El art. 34.4 LGS lo prohíbe expresamente para beneficiarios en situaciones concursales o de insolvencia."}, {"a": 35, "q": "La retención de pagos del art. 35 LGS:", "o": [["es una medida cautelar que procede una vez acordado el inicio del procedimiento de reintegro", 1, "Correcto: art. 35.1 LGS, sin superar el importe a reintegrar más intereses y recargos."], ["es una sanción accesoria", 0, "No es sanción: es medida cautelar."], ["procede desde la simple sospecha, sin expediente", 0, "Exige que se haya acordado el inicio del procedimiento de reintegro."], ["puede alcanzar cualquier importe sin límite", 0, "Tiene el límite del importe objeto de reintegro más intereses y recargos."]]}];
const CASOS=[{"t": "Caso 1 · Del anuncio al pago", "e": "Un ayuntamiento publica el 1 de marzo de 2026 una convocatoria de 60.000 € para asociaciones culturales. Una entidad solicita 20.000 €; la propuesta provisional le asigna 12.000 €; presenta alegaciones y reformula; se resuelve el 10 de julio concediéndole 12.000 €. La actividad termina el 31 de octubre y las bases nada dicen sobre el plazo de justificación. <b>Reconstruye el procedimiento con sus plazos e indica la norma en cada paso.</b>", "s": "<p><b>1) Inicio.</b> De oficio mediante convocatoria (art. 23.1 y 23.2 <b>LGS</b>), que debe contener créditos, cuantía máxima, plazos, requisitos y criterios de valoración. Antes: aprobación del gasto (art. 34.1 LGS) y bases aprobadas y publicadas (art. 9.2 y 9.3 LGS).</p><p><b>2) Instrucción.</b> Evaluación por el instructor, informe del <b>órgano colegiado</b> y propuesta provisional motivada con <b>10 días</b> de alegaciones (art. 24 LGS).</p><p><b>3) Reformulación.</b> Como la propuesta (12.000 €) es inferior a lo solicitado (20.000 €) y las bases lo prevén, cabe reformular respetando objeto, condiciones, finalidad y criterios (art. 27 LGS).</p><p><b>4) Resolución.</b> El 10 de julio, dentro de los <b>seis meses</b> desde la publicación de la convocatoria, que vencían el 1 de septiembre (art. 25.4 LGS). De no haber resuelto, silencio <b>desestimatorio</b> (art. 25.5).</p><p><b>5) Justificación.</b> A falta de previsión en las bases, la cuenta justificativa debe presentarse en el plazo máximo de <b>tres meses</b> desde el fin de la actividad: hasta el <b>31 de enero de 2027</b> (art. 30.2 LGS).</p><p><b>6) Pago.</b> Previa justificación (art. 34.3 LGS) y siempre que la entidad esté al corriente con Hacienda y la Seguridad Social y no sea deudora por reintegro (art. 34.5 LGS).</p><p><b>7) Publicidad.</b> Convocatoria y concesión se comunican a la <b>BDNS</b> (arts. 18 y 20 LGS), y en la entidad local el responsable de suministrar es la <b>Intervención</b> u órgano designado.</p>"}, {"t": "Caso 2 · Subcontratar, comprar y justificar", "e": "Una asociación recibe 150.000 € para un programa formativo. Encarga a una empresa la impartición por 45.000 €; compra equipamiento por 25.000 € a un único proveedor; incluye en la justificación 3.200 € de IVA que se deduce; y adquiere un local por 60.000 € que revende a los dos años. <b>Analiza cada operación.</b>", "s": "<p><b>1) La subcontratación.</b> Los 45.000 € suponen el <b>30 %</b> de la subvención, por encima del umbral del 20 %, pero <b>no superan los 60.000 €</b>. Como el art. 29.3 <b>LGS</b> exige que concurran <b>ambos</b> umbrales, no se activan el contrato escrito ni la autorización previa. Sí se exige, en todo caso, que la normativa reguladora permita subcontratar y que se respete el porcentaje fijado en las bases (art. 29.2 LGS).</p><p><b>2) La compra de equipamiento.</b> 25.000 € supera la cuantía del contrato menor de la legislación de contratos, luego debió solicitar <b>tres ofertas</b> previas y justificar la elección; si no recae en la más ventajosa, con memoria (art. 31.3 LGS). Haber acudido a un único proveedor es un incumplimiento.</p><p><b>3) El IVA deducible.</b> No es gasto subvencionable: el art. 31.8 LGS excluye los impuestos indirectos <b>susceptibles de recuperación o compensación</b>. Procede minorar 3.200 €.</p><p><b>4) El local.</b> Al ser bien inscribible en registro público, el periodo de destino no puede ser inferior a <b>cinco años</b> (art. 31.4.a LGS). La <b>enajenación</b> a los dos años produce en todo caso el incumplimiento de la obligación de destino y es causa de <b>reintegro</b>, quedando el bien afecto al pago cualquiera que sea su poseedor.</p><p><b>Conclusión:</b> procede iniciar reintegro parcial, con posible retención cautelar de pagos pendientes (art. 35 LGS).</p>"}, {"t": "Caso 3 · Concurrencia o convenio", "e": "Un ayuntamiento quiere apoyar a tres entidades: <b>(a)</b> a la Cruz Roja local, con 20.000 € consignados nominativamente en el presupuesto; <b>(b)</b> a las asociaciones deportivas del municipio, con una bolsa de 40.000 €; <b>(c)</b> a una familia afectada por un incendio, con 3.000 € de ayuda urgente. <b>Determina el procedimiento aplicable en cada caso.</b>", "s": "<p><b>(a) Concesión directa</b> por el art. 22.2.a) <b>LGS</b>: subvención prevista <b>nominativamente</b> en el presupuesto, con dotación y beneficiario determinados en los estados de gasto. Instrumento habitual: <b>convenio</b> (art. 28.1 LGS), que debe fijar condiciones, compromisos y régimen de justificación.</p><p><b>(b) Concurrencia competitiva</b> (art. 22.1 LGS): convocatoria pública con criterios de valoración previos, prelación y adjudicación dentro del crédito disponible. Las bases se aprueban en el marco de las <b>bases de ejecución del presupuesto</b> o por <b>ordenanza</b> (art. 17.2 LGS).</p><p><b>(c) Concesión directa excepcional</b> por el art. 22.2.c) LGS: hay razones <b>humanitarias</b> que dificultan la convocatoria pública, pero deben quedar <b>acreditadas</b> en el expediente. En el ámbito estatal exigiría real decreto (art. 28.2); en el local, la vía habitual es la prevista en la ordenanza y en el reglamento de la LGS.</p><p><b>Advertencia común:</b> en los tres casos rigen las disposiciones comunes del tema 11 — prohibiciones del art. 13, obligaciones del art. 14, límite del coste del art. 19.3 y publicidad en la <b>BDNS</b> (arts. 18 y 20 LGS).</p>"}];

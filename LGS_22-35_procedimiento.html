<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>LGS · Arts. 22-35 · Procedimientos de concesión y gestión</title>
<style>

/* ═══════════════════════════════════════════════════════════════
   SISTEMA DE DISEÑO · "Académico Gamificado" · Bloque II
   Temas 8, 9 y 10 · Auxiliar Administrativo
   ═══════════════════════════════════════════════════════════════ */
:root{
  --fs:16px;

  --bg:#faf9f7;
  --bg-grad:radial-gradient(1100px 560px at 12% -8%, #ede9ff 0%, transparent 55%),
            radial-gradient(850px 460px at 96% 0%, #dcf5ee 0%, transparent 50%);
  --surface:#ffffff;
  --surface-2:#f4f3f0;
  --surface-3:#eceae5;
  --line:#e6e3dc;
  --line-strong:#d4d0c7;

  --ink:#15161c;
  --ink-2:#5d616e;
  --ink-3:#8b8f9c;

  --brand:#5b3df5;
  --brand-2:#7c5cff;
  --brand-soft:#efeaff;
  --brand-ring:rgba(91,61,245,.18);

  --legal:#4338ca;  --legal-bg:#eeecff;
  --ej:#059669;     --ej-bg:#e4f7f0;
  --warn:#c2690a;   --warn-bg:#fdf1de;
  --exc:#dc2626;    --exc-bg:#ffeceb;

  --ok:#16a34a; --ok-soft:#e7f7ec;
  --mid:#eab308; --mid-soft:#fdf6dd;
  --off:#a1a1aa; --off-soft:#f1f1f3;

  --sh-1:0 1px 2px rgba(20,20,30,.04), 0 2px 8px rgba(20,20,30,.04);
  --sh-2:0 2px 6px rgba(20,20,30,.05), 0 12px 28px rgba(20,20,30,.07);
  --sh-3:0 8px 20px rgba(91,61,245,.13), 0 24px 56px rgba(20,20,30,.10);
  --sh-glow:0 0 0 4px var(--brand-ring);

  --r-sm:9px; --r-md:14px; --r-lg:20px; --r-full:999px;

  --f-display:"Segoe UI Variable Display",system-ui,-apple-system,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-legal:ui-serif,Georgia,Cambria,"Times New Roman",serif;
  --f-mono:ui-monospace,"SF Mono","Cascadia Mono","Segoe UI Mono",Menlo,monospace;

  --t-h1:clamp(1.02rem,.95rem + .3vw,1.2rem);
  --t-h2:clamp(1.2rem,1.05rem + .6vw,1.55rem);
  --t-h3:clamp(1rem,.95rem + .25vw,1.12rem);
  --t-sm:.86rem;
  --t-xs:.75rem;

  --e-out:cubic-bezier(.22,1,.36,1);
  --e-spring:cubic-bezier(.34,1.56,.64,1);

  /* ── Compatibilidad con SVG y contenido generado ── */
  --panel:var(--surface);
  --ink2:var(--ink-2);
  --acc:var(--brand);
  --acc-soft:var(--brand-soft);
  --g:var(--ok); --y:var(--mid); --r:var(--exc);
}

html[data-theme="dark"]{
  --bg:#0a0b0f;
  --bg-grad:radial-gradient(1100px 560px at 12% -8%, #1c1740 0%, transparent 55%),
            radial-gradient(850px 460px at 96% 0%, #08302b 0%, transparent 50%);
  --surface:#13151b;
  --surface-2:#1a1d25;
  --surface-3:#232733;
  --line:#262a34;
  --line-strong:#343947;

  --ink:#eceef4;
  --ink-2:#9ba2b3;
  --ink-3:#6e7585;

  --brand:#8b6dff;
  --brand-2:#a78bff;
  --brand-soft:#1e1a3d;
  --brand-ring:rgba(139,109,255,.22);

  --legal:#a5b4fc; --legal-bg:#191b3a;
  --ej:#34d399;    --ej-bg:#0c2a24;
  --warn:#fbbf24;  --warn-bg:#2e2110;
  --exc:#fb7185;   --exc-bg:#331119;

  --ok:#4ade80; --ok-soft:#0e2a19;
  --mid:#facc15; --mid-soft:#2c2610;
  --off:#5b6070; --off-soft:#1c1f27;

  --sh-1:0 1px 2px rgba(0,0,0,.3), 0 2px 8px rgba(0,0,0,.25);
  --sh-2:0 2px 6px rgba(0,0,0,.35), 0 12px 28px rgba(0,0,0,.4);
  --sh-3:0 8px 20px rgba(139,109,255,.2), 0 24px 56px rgba(0,0,0,.5);
}

*,*::before,*::after{box-sizing:border-box}
html{font-size:var(--fs);scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);background-image:var(--bg-grad);
  background-attachment:fixed;background-repeat:no-repeat;
  color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.68;
  -webkit-font-smoothing:antialiased;
  transition:background-color .5s var(--e-out),color .3s;
}
::selection{background:var(--brand);color:#fff}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{font-family:var(--f-display);letter-spacing:-.022em;line-height:1.2}
.num{font-variant-numeric:tabular-nums}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:99px;border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3)}

/* ═══ HEADER ═══ */
header.top{
  position:sticky;top:0;z-index:60;
  background:color-mix(in srgb,var(--surface) 80%,transparent);
  backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);
  border-bottom:1px solid var(--line);
}
.top-in{max-width:1280px;margin:0 auto;padding:.65rem 1.1rem;display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.brandwrap{display:flex;align-items:center;gap:.65rem;min-width:0;flex:1}
.mark{
  width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;
  font-weight:800;font-size:.8rem;letter-spacing:-.02em;text-decoration:none;
  box-shadow:0 4px 14px var(--brand-ring);
  transition:transform .3s var(--e-spring),box-shadow .3s;
}
.mark:hover{transform:rotate(-8deg) scale(1.08);box-shadow:var(--sh-3);text-decoration:none}
.top h1{font-size:var(--t-h1);margin:0;font-weight:800;line-height:1.25;min-width:0}
.top h1 .sub{display:block;font-size:var(--t-xs);color:var(--ink-2);font-weight:500;letter-spacing:0;
  margin-top:.1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tools{margin-left:auto;display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}

button,select,input[type=search]{
  font:inherit;font-size:var(--t-sm);font-weight:600;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:var(--r-sm);padding:.4rem .72rem;cursor:pointer;
  position:relative;overflow:hidden;
  transition:transform .18s var(--e-spring),border-color .2s,background .2s,box-shadow .2s,color .2s;
}
button:hover{transform:translateY(-1.5px);border-color:var(--brand);box-shadow:var(--sh-1)}
button:active{transform:translateY(0) scale(.97)}
button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible{outline:none;box-shadow:var(--sh-glow)}
input[type=search]{min-width:190px;cursor:text;font-weight:500}
input[type=search]:focus{border-color:var(--brand)}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--surface-2);padding:2px;gap:2px}
.seg button{border:0;border-radius:calc(var(--r-sm) - 2px);padding:.32rem .68rem;background:transparent;box-shadow:none}
.seg button:hover{transform:none;background:var(--surface)}
.seg button[aria-pressed="true"]{background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;box-shadow:0 2px 8px var(--brand-ring)}

.ripple{position:absolute;border-radius:50%;transform:scale(0);background:currentColor;opacity:.25;animation:rip .55s linear;pointer-events:none}
@keyframes rip{to{transform:scale(3.4);opacity:0}}

.progress{position:absolute;left:0;bottom:-1px;height:2.5px;width:0;
  background:linear-gradient(90deg,var(--brand),var(--legal),var(--ej));transition:width .1s linear}

/* ═══ LAYOUT ═══ */
.layout{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:270px 1fr;gap:1.8rem;padding:1.4rem 1.1rem 5rem}
main{min-width:0}

/* ═══ SIDEBAR ═══ */
nav.side{
  position:sticky;top:76px;align-self:start;max-height:calc(100vh - 96px);overflow:auto;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:.85rem;box-shadow:var(--sh-1);
}
nav.side h2{font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);
  margin:.5rem .4rem .5rem;font-weight:800}
nav.side h2:first-child{margin-top:.1rem}
nav.side a{
  display:flex;align-items:baseline;gap:.5rem;padding:.36rem .55rem;border-radius:var(--r-sm);
  text-decoration:none;color:var(--ink-2);font-size:var(--t-sm);font-weight:500;
  position:relative;transition:background .22s,color .22s,transform .22s var(--e-out);
}
nav.side a:hover{background:var(--surface-2);color:var(--ink);transform:translateX(3px);text-decoration:none}
nav.side a.on{background:var(--brand-soft);color:var(--brand);font-weight:700}
nav.side a.on::before{content:"";position:absolute;left:-.85rem;top:20%;bottom:20%;width:3px;
  border-radius:0 3px 3px 0;background:var(--brand)}
nav.side a b{color:var(--ink-3);font-weight:800;font-size:var(--t-xs);font-variant-numeric:tabular-nums;flex:none;min-width:1.9em}
nav.side a.on b{color:var(--brand)}
.navtoggle{display:none}

/* ═══ TARJETAS ═══ */
section.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:1.35rem 1.5rem;margin-bottom:1.1rem;box-shadow:var(--sh-1);
  transition:box-shadow .3s var(--e-out),border-color .3s;
}
section.card:hover{box-shadow:var(--sh-2)}
section.card>h2{
  margin:0 0 1rem;font-size:var(--t-h2);font-weight:800;
  display:flex;align-items:center;gap:.6rem;
}
section.card>h2::before{
  content:"";width:4px;height:1.05em;border-radius:99px;flex:none;
  background:linear-gradient(180deg,var(--brand),var(--brand-2));
}

/* ═══ ARTÍCULO ═══ */
.art{scroll-margin-top:86px;padding-top:.4rem}
.art + .art{margin-top:1.6rem;padding-top:1.6rem;border-top:1px dashed var(--line)}
.art h2{display:flex;flex-wrap:wrap;gap:.5rem;align-items:baseline;font-size:var(--t-h3);
  margin:0 0 .25rem;font-weight:800;letter-spacing:-.015em}
.art h2 .num{
  color:var(--brand);font-weight:800;font-family:var(--f-display);
  background:var(--brand-soft);padding:.1rem .5rem;border-radius:var(--r-sm);
  font-size:.92em;letter-spacing:-.02em;
}
.ubic{font-size:var(--t-xs);color:var(--ink-3);margin:0 0 .8rem;font-weight:600;
  letter-spacing:.03em;text-transform:uppercase}

/* ═══ IDEA CLAVE ═══ */
.idea{
  background:linear-gradient(100deg,var(--brand-soft),color-mix(in srgb,var(--brand-soft) 40%,transparent));
  border-left:4px solid var(--brand);border-radius:0 var(--r-md) var(--r-md) 0;
  padding:.75rem 1rem;font-weight:650;margin:.7rem 0 1rem;position:relative;
  font-size:.97rem;line-height:1.55;
}

/* ═══ ACORDEÓN ═══ */
details.panel{
  border:1px solid var(--line);border-radius:var(--r-md);margin:.6rem 0;
  background:var(--surface);overflow:hidden;
  transition:border-color .25s,box-shadow .25s,background .25s;
}
details.panel:hover{border-color:var(--line-strong)}
details.panel[open]{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-ring)}
details.panel>summary{
  cursor:pointer;padding:.62rem .9rem;font-weight:700;font-size:.93rem;
  list-style:none;display:flex;align-items:center;gap:.55rem;
  transition:background .2s,color .2s;
}
details.panel>summary:hover{background:var(--surface-2)}
details.panel[open]>summary{background:var(--brand-soft);color:var(--brand)}
details.panel>summary::-webkit-details-marker{display:none}
details.panel>summary::before{
  content:"";width:16px;height:16px;flex:none;border-radius:5px;
  background:var(--brand-soft);position:relative;transition:transform .3s var(--e-spring),background .25s;
}
details.panel>summary::after{
  content:"";position:absolute;width:0;height:0;margin-left:5px;
  border:4px solid transparent;border-left-color:var(--brand);
  transition:transform .3s var(--e-spring);
}
details.panel[open]>summary::before{background:var(--surface)}
details.panel[open]>summary::after{transform:rotate(90deg) translateX(-1px)}
details.panel .body{padding:.3rem 1rem 1rem;font-size:.95rem;animation:slidein .35s var(--e-out)}
@keyframes slidein{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* ═══ TEXTO LEGAL ═══ */
.legal{
  background:var(--legal-bg);border-left:4px solid var(--legal);
  border-radius:0 var(--r-md) var(--r-md) 0;padding:.85rem 1.05rem;
  font-family:var(--f-legal);font-size:.95rem;line-height:1.7;
}
.legal p{margin:.45rem 0}
.legal .lbl{
  font-family:var(--f-body);font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;
  color:var(--legal);font-weight:800;display:block;margin-bottom:.4rem;
}

/* ═══ CAJAS SEMÁNTICAS ═══ */
.box{
  border-left:4px solid var(--line);border-radius:0 var(--r-md) var(--r-md) 0;
  padding:.72rem .95rem;margin:.65rem 0;font-size:.94rem;
  transition:transform .25s var(--e-out),box-shadow .25s;
}
.box:hover{transform:translateX(3px);box-shadow:var(--sh-1)}
.box.ej{background:var(--ej-bg);border-color:var(--ej)}
.box.warn{background:var(--warn-bg);border-color:var(--warn)}
.box.exc{background:var(--exc-bg);border-color:var(--exc)}
.box .lbl{font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;font-weight:800;
  display:block;margin-bottom:.3rem}
.box.ej .lbl{color:var(--ej)}
.box.warn .lbl{color:var(--warn)}
.box.exc .lbl{color:var(--exc)}

.interp{
  border:1px dashed var(--warn);background:color-mix(in srgb,var(--warn-bg) 45%,transparent);
  border-radius:var(--r-md);padding:.65rem .9rem;font-size:.9rem;margin:.6rem 0;
}
.interp .lbl{font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;color:var(--warn);font-weight:800;display:block}

/* ═══ TABLAS ═══ */
table{width:100%;border-collapse:separate;border-spacing:0;font-size:.9rem;margin:.7rem 0;
  border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
th,td{padding:.5rem .68rem;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
td + td, th + th{border-left:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th{background:var(--surface-2);font-size:var(--t-xs);font-weight:800;letter-spacing:.05em;
  text-transform:uppercase;color:var(--ink-2);position:sticky;top:0}
tbody tr{transition:background .18s}
tbody tr:nth-child(even){background:color-mix(in srgb,var(--surface-2) 45%,transparent)}
tbody tr:hover{background:var(--brand-soft)}
th.sortable{cursor:pointer;user-select:none;transition:color .2s,background .2s}
th.sortable:hover{color:var(--brand);background:var(--brand-soft)}
th.sortable::after{content:" ⇅";color:var(--ink-3);font-size:.7rem}

ul,ol{margin:.5rem 0 .5rem 1.2rem;padding:0}
li{margin:.26rem 0}
li::marker{color:var(--brand);font-weight:700}

/* ═══ TOOLTIPS ═══ */
.t{border-bottom:1.5px dotted var(--brand);cursor:help;position:relative;
  transition:background .2s,color .2s}
.t:hover{background:var(--brand-soft);color:var(--brand);border-radius:3px}
#tip{
  position:fixed;z-index:99;max-width:330px;background:var(--ink);color:var(--bg);
  padding:.6rem .78rem;border-radius:var(--r-md);font-size:.82rem;line-height:1.5;
  display:none;box-shadow:0 8px 30px rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.08);
}
html[data-theme="dark"] #tip{background:#f0f1f5;color:#15161c}

/* ═══ FLECHAS DE DIAGRAMA ═══
   Un <path> con stroke pero sin fill toma el valor inicial (negro) y el
   navegador cierra el trazo implícitamente: aparece un triángulo relleno
   entre sus extremos. Forzamos fill:none para dejar solo la línea + la
   punta del <marker>, que sí lleva su color. */
svg path[stroke]:not([fill]){fill:none}
svg polyline:not([fill]){fill:none}
svg line{fill:none}

/* ═══ SVG ═══ */
svg{max-width:100%;height:auto;display:block;margin:.9rem auto}
svg text{font-family:var(--f-body)}

/* ═══ BUSCADOR ═══ */
mark.hit{background:linear-gradient(180deg,transparent 55%,#ffe066 55%);color:inherit;
  border-radius:2px;padding:0 1px;font-weight:600}
html[data-theme="dark"] mark.hit{background:linear-gradient(180deg,transparent 55%,#8a6d00 55%);color:#fff}

/* ═══ UTILIDADES ═══ */
.hide{display:none !important}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.small{font-size:var(--t-sm);color:var(--ink-2)}
.chip{
  display:inline-block;font-size:var(--t-xs);padding:.16rem .55rem;border-radius:var(--r-full);
  background:var(--brand-soft);color:var(--brand);font-weight:800;letter-spacing:.02em;
}

/* ═══ HUECOS RELLENABLES ═══ */
.gap{
  display:inline-block;min-width:5.5em;border-bottom:2px solid var(--brand);
  text-align:center;font-weight:700;color:transparent;cursor:pointer;
  transition:color .3s,background .3s;
}
.gap.on,.gap:hover{color:var(--brand);background:var(--brand-soft);border-radius:4px 4px 0 0}

/* ═══ REVELAR SOLUCIÓN ═══ */
.revelar{
  background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;border-color:transparent;
  font-weight:700;
}
.revelar:hover{box-shadow:var(--sh-3)}
.sol{
  margin-top:.7rem;padding:.8rem 1rem;border-radius:var(--r-md);
  background:var(--ej-bg);border-left:4px solid var(--ej);
  animation:slidein .4s var(--e-out);
}

/* ═══ TEST ═══ */
.opt{
  display:block;padding:.55rem .85rem;margin:.35rem 0;border:1.5px solid var(--line);
  border-radius:var(--r-md);cursor:pointer;background:var(--surface);font-size:.94rem;
  transition:border-color .22s,background .22s,transform .22s var(--e-out);
}
.opt:hover{border-color:var(--brand);background:var(--brand-soft);transform:translateX(4px)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft);font-weight:650}
.opt.ko{border-color:var(--exc);background:var(--exc-bg)}
.opt input{margin-right:.5rem;accent-color:var(--brand)}

#tscore,#semres{
  font-family:var(--f-display);font-weight:800;font-size:1.15rem;letter-spacing:-.02em;
}

/* ═══════════════════════════════════════════════════════════════
   FLASHCARDS 3D · mazo con giro, vuelo de salida y sheen
   ═══════════════════════════════════════════════════════════════ */
#flash{--fc-e:cubic-bezier(.2,.8,.25,1);--fc-h:250px}

/* — Escena — */
.fc-stage{
  perspective:1400px;perspective-origin:50% 45%;
  padding:.4rem 0 .2rem;position:relative;
}
.fc-deck{position:relative;height:var(--fc-h);will-change:transform}

/* — Cartas fantasma del mazo — */
.fc-ghost{
  position:absolute;inset:0;border-radius:var(--r-lg);
  background:var(--surface);border:1px solid var(--line);
  transition:transform .5s var(--fc-e),opacity .5s var(--fc-e);
}
.fc-ghost.g1{transform:translateY(9px) scale(.972);opacity:.75}
.fc-ghost.g2{transform:translateY(18px) scale(.944);opacity:.45}
.fc-deck.empty .fc-ghost{opacity:0;transform:translateY(26px) scale(.9)}

/* — Elevación durante el giro — */
.fc-lift{position:absolute;inset:0;transform-style:preserve-3d}
.fc-lift.lift{animation:fcLift .78s var(--fc-e)}
@keyframes fcLift{
  0%,100%{transform:scale(1) translateY(0)}
  45%{transform:scale(1.055) translateY(-16px)}
}
.fc-lift.out-ok{animation:fcOut .5s cubic-bezier(.5,0,.75,0) forwards}
.fc-lift.out-ko{animation:fcOutKo .5s cubic-bezier(.5,0,.75,0) forwards}
.fc-lift.in{animation:fcIn .48s var(--fc-e)}
@keyframes fcOut{
  0%{transform:translateX(0) rotate(0) scale(1);opacity:1}
  100%{transform:translateX(130%) rotate(17deg) scale(.85);opacity:0}
}
@keyframes fcOutKo{
  0%{transform:translateX(0) rotate(0) scale(1);opacity:1}
  100%{transform:translateX(-130%) rotate(-17deg) scale(.85);opacity:0}
}
@keyframes fcIn{
  0%{transform:translateY(26px) scale(.9);opacity:0}
  100%{transform:translateY(0) scale(1);opacity:1}
}

/* — La carta — */
.fc-card{
  position:absolute;inset:0;transform-style:preserve-3d;
  transition:transform .78s var(--fc-e);
  cursor:pointer;border-radius:var(--r-lg);
}
.fc-card:focus-visible{outline:none}
.fc-card:focus-visible .fc-face{box-shadow:var(--sh-glow),var(--sh-2)}

/* — Caras — */
.fc-face{
  position:absolute;inset:0;border-radius:var(--r-lg);
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  padding:2rem 2.2rem;text-align:center;overflow:hidden;
  box-shadow:var(--sh-2);
  transition:box-shadow .4s var(--fc-e);
}
.fc-card:hover .fc-face{box-shadow:var(--sh-3)}

/* Anverso · pregunta */
.fc-front{
  background:
    radial-gradient(120% 90% at 50% -20%, var(--brand-soft) 0%, transparent 60%),
    var(--surface);
  border:1.5px solid var(--line);color:var(--ink);
}
/* Reverso · respuesta */
.fc-back{
  transform:rotateY(180deg);
  background:linear-gradient(145deg,var(--brand) 0%,#6d4bf7 45%,var(--c5,#0891b2) 130%);
  border:1.5px solid transparent;color:#fff;
}
html[data-theme="dark"] .fc-back{
  background:linear-gradient(145deg,#5f45c9 0%,#4b3aa8 45%,#0e6b85 130%);
}
.fc-back .fc-txt{color:#fff}
.fc-back b,.fc-back strong{color:#fff;font-weight:800}

/* — Sheen que barre al girar — */
.fc-face::after{
  content:"";position:absolute;top:-60%;left:-70%;width:55%;height:220%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.42),transparent);
  transform:rotate(18deg);opacity:0;pointer-events:none;
}
.fc-lift.lift .fc-face::after{animation:fcSheen .78s var(--fc-e)}
@keyframes fcSheen{
  0%{opacity:0;left:-70%}
  35%{opacity:1}
  100%{opacity:0;left:150%}
}

/* — Etiqueta superior — */
.fc-tag{
  position:absolute;top:1rem;left:1.15rem;
  font-size:var(--t-xs);font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  display:inline-flex;align-items:center;gap:.4rem;
}
.fc-front .fc-tag{color:var(--brand)}
.fc-back .fc-tag{color:rgba(255,255,255,.9)}
.fc-tag::before{
  content:"";width:7px;height:7px;border-radius:50%;background:currentColor;
  animation:fcPulse 2.2s ease-in-out infinite;
}
@keyframes fcPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.65)}}

/* — Índice tipo naipe — */
.fc-pip{
  position:absolute;font-family:var(--f-display);font-weight:800;
  font-size:.78rem;letter-spacing:-.02em;opacity:.34;font-variant-numeric:tabular-nums;
}
.fc-pip.tr{top:1rem;right:1.15rem}
.fc-pip.bl{bottom:1rem;left:1.15rem;transform:rotate(180deg)}
.fc-front .fc-pip{color:var(--ink-2)}
.fc-back .fc-pip{color:#fff;opacity:.55}

/* — Texto — */
.fc-txt{
  font-size:clamp(1rem,.9rem + .55vw,1.28rem);font-weight:650;line-height:1.5;
  max-width:44ch;letter-spacing:-.012em;
}
.fc-front .fc-txt{font-family:var(--f-display);font-weight:700}
.fc-back .fc-txt{font-weight:600;line-height:1.6}
.fc-hint{
  position:absolute;bottom:1rem;left:0;right:0;
  font-size:var(--t-xs);font-weight:600;letter-spacing:.02em;
  display:flex;align-items:center;justify-content:center;gap:.4rem;
}
.fc-front .fc-hint{color:var(--ink-3)}
.fc-back .fc-hint{color:rgba(255,255,255,.72)}
.fc-hint .kbd{
  font-family:var(--f-mono);font-size:.68rem;font-weight:700;padding:.1rem .32rem;
  border-radius:5px;border:1px solid currentColor;opacity:.75;
}

/* — Pantalla final — */
.fc-done{
  position:absolute;inset:0;border-radius:var(--r-lg);
  background:linear-gradient(150deg,var(--ok-soft),var(--surface) 70%);
  border:1.5px solid var(--ok);
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  text-align:center;padding:2rem;gap:.35rem;
  animation:fcIn .5s var(--fc-e);box-shadow:var(--sh-2);
}
.fc-done .seal{
  font-size:2.6rem;line-height:1;
  animation:fcSeal .7s cubic-bezier(.2,1.5,.4,1);
}
@keyframes fcSeal{0%{transform:scale(0) rotate(-25deg);opacity:0}60%{transform:scale(1.2) rotate(6deg)}100%{transform:scale(1) rotate(0);opacity:1}}
.fc-done h3{font-size:1.3rem;font-weight:800;margin:.2rem 0 0}
.fc-done p{margin:0;color:var(--ink-2);font-size:var(--t-sm)}

/* — Barra de progreso de la ronda — */
.fc-bar{
  height:6px;border-radius:99px;background:var(--surface-3);
  overflow:hidden;margin:.95rem 0 .8rem;position:relative;
}
.fc-bar i{
  display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--brand),var(--c5,#0891b2));
  transition:width .55s var(--fc-e);
}

/* — Controles — */
.fc-ctrls{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.fc-ctrls button{font-weight:700}
#fcok{border-color:var(--ok);color:var(--ok)}
#fcok:hover{background:var(--ok);color:#fff;border-color:var(--ok)}
#fcko{border-color:var(--warn);color:var(--warn)}
#fcko:hover{background:var(--warn);color:#fff;border-color:var(--warn)}
#fcflip{background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;border-color:transparent}
#fcflip:hover{box-shadow:var(--sh-3)}

.fc-score{display:inline-flex;gap:.45rem;margin-left:auto;align-items:center}
.fc-pill{
  font-size:var(--t-xs);font-weight:800;padding:.24rem .6rem;border-radius:var(--r-full);
  font-variant-numeric:tabular-nums;border:1px solid;
}
.fc-pill.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.fc-pill.ko{color:var(--warn);border-color:var(--warn);background:var(--warn-bg)}
.fc-pill.left{color:var(--ink-2);border-color:var(--line);background:var(--surface-2)}
.fc-pill.bump{animation:fcBump .45s var(--e-spring)}
@keyframes fcBump{0%{transform:scale(1)}45%{transform:scale(1.28)}100%{transform:scale(1)}}

@media(max-width:620px){
  #flash{--fc-h:270px}
  .fc-face{padding:1.7rem 1.3rem}
  .fc-score{margin-left:0;width:100%}
}
@media(prefers-reduced-motion:reduce){
  .fc-card{transition:none}
  .fc-lift.lift,.fc-lift.in,.fc-lift.out-ok,.fc-lift.out-ko,.fc-face::after{animation:none !important}
}
@media print{.fc-stage,.fc-ctrls,.fc-bar{display:none !important}}
/* ═══ RESPUESTA ESTRUCTURADA ═══ */
.fc-face{justify-content:center}
.fc-face.struct{justify-content:flex-start;text-align:left;padding-top:3.1rem;padding-bottom:3.1rem}
.fc-body{
  width:100%;max-width:46ch;margin:0 auto;
  overflow-y:auto;max-height:100%;
  scrollbar-width:thin;
}
.fc-body::-webkit-scrollbar{width:5px}
.fc-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.35);border-radius:99px;border:0}
.fc-front .fc-body::-webkit-scrollbar-thumb{background:var(--line-strong)}

/* — Veredicto Sí / No — */
.fc-verdict{
  display:inline-flex;align-items:center;gap:.35rem;
  font-family:var(--f-display);font-weight:800;font-size:.82rem;
  letter-spacing:.06em;text-transform:uppercase;
  padding:.26rem .72rem;border-radius:var(--r-full);margin-bottom:.85rem;
  border:1.5px solid;animation:fcPopIn .45s var(--e-spring) backwards;animation-delay:.34s;
}
.fc-verdict.si{background:rgba(255,255,255,.16);border-color:rgba(190,255,215,.85);color:#d8ffe9}
.fc-verdict.no{background:rgba(255,255,255,.16);border-color:rgba(255,205,205,.85);color:#ffdedd}
@keyframes fcPopIn{0%{opacity:0;transform:scale(.7) translateY(6px)}100%{opacity:1;transform:none}}

/* — Párrafo — */
.fc-p{margin:0;font-size:clamp(1rem,.92rem + .45vw,1.2rem);font-weight:600;line-height:1.6}
.fc-face.struct .fc-p{font-size:clamp(.96rem,.9rem + .35vw,1.1rem)}

/* — Lista enumerada — */
.fc-list{list-style:none;margin:0;padding:0;display:grid;gap:.5rem;counter-reset:fc}
.fc-list li{
  counter-increment:fc;position:relative;margin:0;
  padding:.42rem .6rem .42rem 2.5rem;border-radius:var(--r-sm);
  background:rgba(255,255,255,.11);
  font-size:clamp(.92rem,.88rem + .3vw,1.04rem);font-weight:600;line-height:1.45;
  animation:fcRow .42s var(--e-out) backwards;
}
.fc-list li::before{
  content:counter(fc);position:absolute;left:.6rem;top:50%;transform:translateY(-50%);
  width:1.6rem;height:1.6rem;border-radius:50%;
  display:grid;place-items:center;
  background:rgba(255,255,255,.9);color:var(--brand);
  font-family:var(--f-display);font-weight:800;font-size:.78rem;
  font-variant-numeric:tabular-nums;
}
.fc-list.alpha li::before{content:counter(fc,lower-alpha)}
.fc-list li:nth-child(1){animation-delay:.36s}
.fc-list li:nth-child(2){animation-delay:.42s}
.fc-list li:nth-child(3){animation-delay:.48s}
.fc-list li:nth-child(4){animation-delay:.54s}
.fc-list li:nth-child(5){animation-delay:.60s}
.fc-list li:nth-child(n+6){animation-delay:.66s}
@keyframes fcRow{0%{opacity:0;transform:translateX(-12px)}100%{opacity:1;transform:none}}

/* — Cláusulas contrapuestas — */
.fc-clauses{display:grid;gap:.45rem}
.fc-clauses p{
  margin:0;padding:.45rem .7rem .45rem .95rem;border-radius:0 var(--r-sm) var(--r-sm) 0;
  background:rgba(255,255,255,.11);border-left:3px solid rgba(255,255,255,.55);
  font-size:clamp(.92rem,.88rem + .3vw,1.04rem);font-weight:600;line-height:1.5;
  animation:fcRow .42s var(--e-out) backwards;
}
.fc-clauses p:nth-child(1){animation-delay:.36s}
.fc-clauses p:nth-child(2){animation-delay:.44s}
.fc-clauses p:nth-child(3){animation-delay:.52s}

/* — Negritas resaltadas en el reverso — */
.fc-back .fc-body b,.fc-back .fc-body strong{
  font-weight:800;background:rgba(255,255,255,.2);
  padding:.03em .3em;border-radius:5px;
  box-decoration-break:clone;-webkit-box-decoration-break:clone;
}

/* — Cita legal al pie — */
.fc-cite{
  position:absolute;bottom:.95rem;left:0;right:0;
  display:inline-flex;align-items:center;justify-content:center;gap:.4rem;
  font-family:var(--f-mono);font-size:.74rem;font-weight:700;letter-spacing:.02em;
  color:rgba(255,255,255,.82);
  animation:fcPopIn .5s var(--e-out) backwards;animation-delay:.5s;
}
.fc-cite::before,.fc-cite::after{
  content:"";height:1px;width:clamp(18px,10%,52px);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.45));
}
.fc-cite::after{background:linear-gradient(90deg,rgba(255,255,255,.45),transparent)}
.fc-cite .s{font-size:.9rem;opacity:.75;font-family:var(--f-legal)}
.fc-front .fc-cite{color:var(--ink-3)}
.fc-front .fc-cite::before{background:linear-gradient(90deg,transparent,var(--line-strong))}
.fc-front .fc-cite::after{background:linear-gradient(90deg,var(--line-strong),transparent)}

/* la pista se oculta si hay cita, para no amontonar */
.fc-back .fc-cite ~ .fc-hint,.fc-back .fc-hint.muted{display:none}

@media(max-width:620px){
  #flash{--fc-h:320px}
  .fc-face.struct{padding-top:2.9rem;padding-bottom:2.8rem}
  .fc-list li{padding-left:2.3rem}
}
@media(prefers-reduced-motion:reduce){
  .fc-verdict,.fc-list li,.fc-clauses p,.fc-cite{animation:none !important}
}

/* ═══ SEMÁFORO ═══ */
.sembtn{
  border-radius:var(--r-full);padding:.32rem .7rem;font-weight:700;font-size:var(--t-sm);
}
.sembtn[data-v="g"]:hover,.sembtn.on[data-v="g"]{background:var(--ok);color:#fff;border-color:var(--ok)}
.sembtn[data-v="y"]:hover,.sembtn.on[data-v="y"]{background:var(--mid);color:#3d2f00;border-color:var(--mid)}
.sembtn[data-v="r"]:hover,.sembtn.on[data-v="r"]{background:var(--exc);color:#fff;border-color:var(--exc)}

/* ═══ CTA DE BLOQUE ═══ */
a.blk{
  display:inline-flex;align-items:center;gap:.5rem;
  background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;
  padding:.5rem .95rem;border-radius:var(--r-sm);font-weight:700;font-size:var(--t-sm);
  text-decoration:none;box-shadow:0 2px 10px var(--brand-ring);
  transition:transform .22s var(--e-spring),box-shadow .25s,gap .25s var(--e-out);
}
a.blk:hover{transform:translateY(-2px);box-shadow:var(--sh-3);gap:.75rem;text-decoration:none}
a.blk::after{content:"→"}
a.blk:active{transform:translateY(0) scale(.98)}

/* ═══ REVEAL ═══ */
.rv{opacity:0;transform:translateY(20px);transition:opacity .6s var(--e-out),transform .6s var(--e-out)}
.rv.in{opacity:1;transform:none}

/* ═══ RESPONSIVE ═══ */
@media(max-width:960px){
  .layout{grid-template-columns:1fr;padding-top:.9rem;gap:1rem}
  nav.side{position:static;max-height:none}
  nav.side.collapsed .navbody{display:none}
  .navtoggle{display:block;width:100%;text-align:left;font-weight:700}
  .grid2{grid-template-columns:1fr}
  .top h1 .sub{white-space:normal}
}
@media(max-width:620px){
  .top-in{padding:.55rem .8rem}
  .tools{width:100%;margin-left:0}
  input[type=search]{flex:1;min-width:0}
  section.card{padding:1.05rem 1rem;border-radius:var(--r-md)}
  table{font-size:.82rem}
  th,td{padding:.4rem .5rem}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
  .rv{opacity:1;transform:none}
}
@media print{
  header.top,nav.side,.tools,.noprint,.progress{display:none !important}
  body{background:#fff;background-image:none;font-size:11pt;color:#000}
  .layout{display:block;max-width:none;padding:0}
  section.card{border:0;padding:0;margin:0 0 1rem;break-inside:avoid;box-shadow:none}
  details.panel{border:0;box-shadow:none}
  details.panel .body{display:block !important}
  details.panel>summary{padding-left:0}
  .art{break-inside:avoid}
  .rv{opacity:1;transform:none}
  a{color:#000;text-decoration:none}
}


/* ═══ ALTURA ADAPTATIVA DE LA TARJETA ═══ */
.fc-deck{transition:height .45s var(--fc-e)}
.fc-body{max-height:none;overflow:visible}
.fc-measure{
  position:absolute;left:0;right:0;top:0;height:auto;
  visibility:hidden;pointer-events:none;z-index:-1;
}
.fc-measure .fc-face{
  position:relative;inset:auto;height:auto;min-height:0;
  box-shadow:none;backface-visibility:visible;transform:none;
}
.fc-measure .fc-body{max-height:none;overflow:visible}
.fc-measure .fc-face::after{display:none}

/* ═══ MOSTRAR / OCULTAR ÍNDICE LATERAL ═══ */
.layout{transition:grid-template-columns .42s var(--e-out)}
.layout.nonav{grid-template-columns:0 1fr;gap:0}
.layout.nonav>nav.side{
  opacity:0;transform:translateX(-14px);pointer-events:none;
  padding:0;border-width:0;overflow:hidden;width:0;min-width:0;
}
nav.side{
  transition:opacity .3s var(--e-out),transform .38s var(--e-out);
  overflow-x:hidden;
}
#navhide .ic{display:inline-block;transition:transform .35s var(--e-spring);font-size:.95em;line-height:1}
#navhide[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
#navhide[aria-pressed="true"] .ic{transform:rotate(90deg)}
@media(max-width:960px){#navhide{display:none}}

/* ═══════════════════════════════════════════════════════════════
   LECTURA EN VOZ ALTA (TTS) del texto legal
   ═══════════════════════════════════════════════════════════════ */
.tts-bar{
  display:flex;align-items:center;gap:.45rem;flex-wrap:wrap;
  margin:.15rem 0 .7rem;
}
.tts-bar button{
  font-size:var(--t-xs);font-weight:700;padding:.3rem .62rem;
  border-radius:var(--r-full);border:1px solid var(--legal);
  background:transparent;color:var(--legal);
  display:inline-flex;align-items:center;gap:.35rem;line-height:1.2;
}
.tts-bar button:hover{background:var(--legal);color:var(--surface);border-color:var(--legal)}
.tts-bar button[hidden]{display:none}
.tts-bar .tts-play.on{background:var(--legal);color:var(--surface)}

/* Ondas de audio mientras lee */
.tts-wave{display:inline-flex;align-items:flex-end;gap:2px;height:11px}
.tts-wave i{
  width:2.5px;background:currentColor;border-radius:2px;height:35%;
  animation:ttsW .9s ease-in-out infinite;
}
.tts-wave i:nth-child(2){animation-delay:.15s}
.tts-wave i:nth-child(3){animation-delay:.3s}
.tts-wave i:nth-child(4){animation-delay:.45s}
@keyframes ttsW{0%,100%{height:32%}50%{height:100%}}

.tts-time{
  font-family:var(--f-mono);font-size:.7rem;font-weight:700;
  color:var(--ink-3);font-variant-numeric:tabular-nums;
}

/* Frase que se está leyendo */
.tts-s{transition:background .25s,color .25s;border-radius:3px}
.tts-s.now{
  background:linear-gradient(180deg,transparent 8%,color-mix(in srgb,var(--legal) 26%,transparent) 8%);
  box-shadow:0 0 0 2px color-mix(in srgb,var(--legal) 16%,transparent);
}
html[data-theme="dark"] .tts-s.now{
  background:linear-gradient(180deg,transparent 8%,color-mix(in srgb,var(--legal) 34%,transparent) 8%);
}
.legal.tts-on{box-shadow:0 0 0 3px color-mix(in srgb,var(--legal) 20%,transparent)}

/* ═══ Reproductor flotante ═══ */
.tts-mini{
  position:fixed;left:50%;bottom:1.1rem;transform:translateX(-50%) translateY(140%);
  z-index:80;display:flex;align-items:center;gap:.6rem;
  background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  border:1px solid var(--line);border-radius:var(--r-full);
  padding:.5rem .7rem .5rem .95rem;box-shadow:var(--sh-3);
  transition:transform .45s var(--e-spring),opacity .3s;opacity:0;pointer-events:none;
  max-width:min(94vw,540px);
}
.tts-mini.show{transform:translateX(-50%) translateY(0);opacity:1;pointer-events:auto}
.tts-mini .lbl{
  font-size:var(--t-xs);font-weight:800;color:var(--legal);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:16ch;
}
.tts-mini button{
  border-radius:50%;width:32px;height:32px;padding:0;display:grid;place-items:center;
  font-size:.8rem;border:1px solid var(--line);flex:none;
}
.tts-mini button.main{
  width:38px;height:38px;font-size:.95rem;
  background:linear-gradient(140deg,var(--legal),var(--brand));color:#fff;border-color:transparent;
}
.tts-mini .bar{
  flex:1;min-width:70px;height:5px;border-radius:99px;background:var(--surface-3);overflow:hidden;
}
.tts-mini .bar i{display:block;height:100%;width:0;background:var(--legal);
  border-radius:99px;transition:width .35s var(--e-out)}

/* ═══ Panel de ajustes de voz ═══ */
.tts-back{
  position:fixed;inset:0;z-index:90;background:rgba(10,10,18,.45);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  display:grid;place-items:center;padding:1rem;
  opacity:0;pointer-events:none;transition:opacity .3s var(--e-out);
}
.tts-back.show{opacity:1;pointer-events:auto}
.tts-panel{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--sh-3);width:min(94vw,470px);max-height:88vh;overflow:auto;
  padding:1.3rem 1.4rem;transform:translateY(16px) scale(.97);
  transition:transform .38s var(--e-spring);
}
.tts-back.show .tts-panel{transform:none}
.tts-panel h3{
  font-size:1.12rem;font-weight:800;margin:0 0 .25rem;
  display:flex;align-items:center;gap:.5rem;
}
.tts-panel .sub{font-size:var(--t-sm);color:var(--ink-2);margin:0 0 1.1rem}
.tts-row{margin-bottom:1.05rem}
.tts-row > label{
  display:block;font-size:var(--t-xs);font-weight:800;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-2);margin-bottom:.4rem;
}
.tts-seg{display:flex;gap:3px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:3px}
.tts-seg button{
  flex:1;border:0;background:transparent;border-radius:calc(var(--r-sm) - 3px);
  padding:.42rem .3rem;font-size:var(--t-sm);font-weight:700;box-shadow:none;
}
.tts-seg button:hover{transform:none;background:var(--surface)}
.tts-seg button[aria-pressed="true"]{
  background:linear-gradient(140deg,var(--legal),var(--brand));color:#fff;
}
.tts-panel select{
  width:100%;padding:.5rem .6rem;border-radius:var(--r-sm);
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  font-size:var(--t-sm);font-weight:600;cursor:pointer;
}
.tts-panel select:focus{border-color:var(--brand);outline:none}
.tts-slider{display:flex;align-items:center;gap:.75rem}

.tts-note b{color:var(--ink)}
.tts-acts{display:flex;gap:.5rem;justify-content:flex-end;flex-wrap:wrap}

/* — Variante compacta para los apartados desplegables — */

}

@media(max-width:620px){

@media(prefers-reduced-motion:reduce){
  .tts-wave i{animation:none;height:60%}
}
@media print{.tts-bar,.tts-mini,.tts-back{display:none !important}}

<script>
const GLOSARIO={
 "presupuesto":"Documento contable y jurídico, aprobado por el Pleno, que fija el techo de gasto de un ejercicio y estima los ingresos con los que se financia. Ej.: el presupuesto de Utrera para 2026 autoriza gastar como máximo 78 M€.",
 "credito":"Crédito presupuestario: la cantidad máxima de dinero autorizada para una finalidad concreta. Ej.: 120.000 € en la aplicación de 'mantenimiento de colegios'.",
 "obligacion":"Obligación reconocida: la deuda que el Ayuntamiento admite formalmente que debe pagar, una vez comprobado que el servicio o suministro se ha prestado. Ej.: aprobada la factura del proveedor, nace la obligación.",
 "derecho":"Derecho liquidado: el importe concreto que un tercero debe a la entidad local, una vez cuantificado. Ej.: liquidado el IBI de un inmueble en 340 €, ese es el derecho.",
 "oa":"Organismo autónomo: ente con personalidad jurídica propia creado por la entidad local para gestionar un servicio (patronatos de deportes, de cultura, gerencias de urbanismo). Depende del Ayuntamiento pero tiene su propio presupuesto.",
 "sociedad":"Sociedad mercantil local: empresa con forma de S.A. o S.L. cuyo capital pertenece a la entidad local (p. ej. la empresa municipal de aguas). No aprueba 'presupuesto', sino estados de previsión de gastos e ingresos.",
 "bases":"Bases de ejecución: el 'reglamento de uso' del presupuesto. Adaptan las normas presupuestarias generales a la organización concreta de la entidad. Ej.: fijan qué órgano autoriza gastos de hasta 3.000 €.",
 "estabilidad":"Estabilidad presupuestaria: exigencia de que las cuentas públicas no incurran en déficit estructural. Ej.: un ayuntamiento no puede presupuestar más gasto no financiero que ingresos no financieros.",
 "afectacion":"No afectación: regla general de que todos los ingresos financian todo el gasto, sin que un ingreso concreto quede reservado a un gasto concreto. Ej.: lo recaudado por el IBI no está reservado a pagar el alumbrado.",
 "bruto":"Principio de presupuesto bruto (o de integridad): derechos y obligaciones se anotan por su importe total, sin compensar unos con otros. Ej.: no se puede anotar la subvención 'ya descontados' los gastos del programa.",
 "nivelacion":"Nivelación presupuestaria: que el total de ingresos previstos cubra el total de gastos autorizados; es decir, aprobar sin déficit inicial.",
 "aplicacion":"Aplicación presupuestaria: la 'casilla' exacta donde vive cada euro de gasto, formada al cruzar la clasificación por programas con la económica. Ej.: 323/22103 (funcionamiento de centros docentes / combustibles).",
 "vinculacion":"Nivel de vinculación jurídica: el nivel de agregación en el que el crédito es realmente limitativo; por debajo de él se puede mover el gasto sin tramitar una modificación de crédito (art. 172 TRLHL).",
 "intervencion":"Intervención: el órgano de control interno de la entidad local, con función de fiscalización previa del gasto y de informe preceptivo del presupuesto. Lo desempeña un funcionario de habilitación nacional.",
 "pleno":"Pleno: órgano colegiado formado por todos los concejales o diputados. Es el único competente para aprobar el presupuesto.",
 "bop":"Boletín Oficial de la Provincia: diario oficial donde las entidades locales publican sus anuncios y acuerdos con efectos frente a terceros.",
 "prorroga":"Prórroga presupuestaria: si el 1 de enero no ha entrado en vigor el presupuesto nuevo, sigue rigiendo automáticamente el anterior con sus créditos iniciales.",
 "interesado":"Interesado: quien está legitimado para intervenir en un procedimiento. En el presupuesto, la ley define expresamente quiénes lo son (art. 170.1).",
 "liquidacion":"Liquidación del presupuesto: cierre contable del ejercicio, que determina los derechos y obligaciones pendientes, el remanente de tesorería y el resultado presupuestario.",
 "tcuentas":"Tribunal de Cuentas: órgano fiscalizador externo de las cuentas y la gestión económica del sector público, dependiente de las Cortes Generales.",
 "conten":"Recurso contencioso-administrativo: impugnación ante los juzgados y tribunales de lo contencioso-administrativo, es decir, ya fuera de la propia Administración.",
 "concurrencia2":"Concurrencia competitiva: procedimiento ordinario en el que las solicitudes se comparan entre sí conforme a criterios previamente fijados, se establece una prelación y se adjudican las mejor valoradas dentro del crédito disponible (art. 22.1 LGS).","directa":"Concesión directa: procedimiento excepcional sin comparación de solicitudes, admisible solo en los tres supuestos del art. 22.2 LGS.","nominativa":"Subvención nominativa: la prevista nominativamente en los presupuestos, con dotación y beneficiario determinados en los estados de gasto. Se canaliza habitualmente mediante convenio.","prorrateo":"Prorrateo: reparto proporcional del importe global máximo entre los beneficiarios, solo posible si las bases reguladoras lo prevén expresamente.","instructor":"Órgano instructor: el designado en la convocatoria para ordenar el procedimiento, pedir informes, evaluar solicitudes y formular las propuestas de resolución.","colegiado":"Órgano colegiado: el que, a la vista de la evaluación, emite informe y a través del instructor formula la propuesta de concesión al órgano concedente.","provisional":"Propuesta de resolución provisional: acto de trámite motivado que se notifica a los interesados y abre un plazo de 10 días de alegaciones. No crea derecho alguno.","reformulacion":"Reformulación: ajuste de la solicitud por el beneficiario cuando la subvención propuesta es inferior a la pedida, para adaptar los compromisos al importe.","cuenta":"Cuenta justificativa: documento en el que el beneficiario acredita las actividades realizadas, su coste y el desglose de los gastos, con los justificantes correspondientes.","subcontratar":"Subcontratación: concertar con terceros la ejecución total o parcial de la actividad subvencionada. No incluye los gastos necesarios para que el beneficiario la realice por sí mismo.","anticipado":"Pago anticipado: entrega de fondos con carácter previo a la justificación, como financiación necesaria para realizar la actividad. Exige previsión expresa y régimen de garantías.","acuenta":"Pago a cuenta: pago fraccionado que responde al ritmo de ejecución, por cuantía equivalente a la justificación presentada."
};
const ARTS=[{n:22,t:"Procedimientos de concesión",ubic:"Título I (Procedimientos de concesión y gestión de las subvenciones) ▸ Capítulo I (Del procedimiento de concesión)",idea:"Lo ordinario es competir; la concesión directa solo cabe en tres supuestos.",literal:`<p>1. El procedimiento ordinario de concesión de subvenciones se tramitará en régimen de concurrencia competitiva. A efectos de esta ley, tendrá la consideración de concurrencia competitiva el procedimiento mediante el cual la concesión de las subvenciones se realiza mediante la comparación de las solicitudes presentadas, a fin de establecer una prelación entre las mismas de acuerdo con los criterios de valoración previamente fijados en las bases reguladoras y en la convocatoria, y adjudicar, con el límite fijado en la convocatoria dentro del crédito disponible, aquellas que hayan obtenido mayor valoración en aplicación de los citados criterios.</p><p>En este supuesto, y sin perjuicio de las especialidades que pudieran derivarse de la capacidad de autoorganización de las Administraciones públicas, la propuesta de concesión se formulará al órgano concedente por un órgano colegiado a través del órgano instructor. La composición del órgano colegiado será la que establezcan las correspondientes bases reguladoras.</p><p>Excepcionalmente, siempre que así se prevea en las bases reguladoras, el órgano competente procederá al prorrateo, entre los beneficiarios de la subvención, del importe global máximo destinado a las subvenciones.</p><p>2. Podrán concederse de forma directa las siguientes subvenciones:</p><p>a) Las previstas nominativamente en los Presupuestos Generales del Estado, de las Comunidades Autónomas o de las Entidades Locales, en los términos recogidos en los convenios y en la normativa reguladora de estas subvenciones.</p><p>A efectos de lo establecido en el párrafo anterior, se entiende por subvención prevista nominativamente en los Presupuestos Generales del Estado aquella en que al menos su dotación presupuestaria y beneficiario aparezcan determinados en los estados de gasto del Presupuesto. El objeto de estas subvenciones deberá quedar determinado expresamente en el correspondiente convenio de colaboración o resolución de concesión que, en todo caso, deberá ser congruente con la clasificación funcional y económica del correspondiente crédito presupuestario.</p><p>b) Aquellas cuyo otorgamiento o cuantía venga impuesto a la Administración por una norma de rango legal, que seguirán el procedimiento de concesión que les resulte de aplicación de acuerdo con su propia normativa.</p><p>c) Con carácter excepcional, aquellas otras subvenciones en que se acrediten razones de interés público, social, económico o humanitario, u otras debidamente justificadas que dificulten su convocatoria pública.</p><p>3. No podrán otorgarse subvenciones por cuantía superior a la que se determine en la convocatoria.</p>`,dis:`<ul>
<li><b>22.1 — procedimiento ordinario:</b> la <span class="t" data-k="concurrencia2">concurrencia competitiva</span>. Consiste en <b>comparar las solicitudes</b> presentadas para establecer una <b>prelación</b> conforme a los criterios de valoración fijados en las bases y en la convocatoria, y adjudicar, con el límite fijado en la convocatoria <b>dentro del crédito disponible</b>, las que hayan obtenido mayor valoración.
<ul><li>La propuesta la formula al órgano concedente un <b><span class="t" data-k="colegiado">órgano colegiado</span></b> a través del <span class="t" data-k="instructor">órgano instructor</span>.</li>
<li><b>Excepcionalmente</b>, y si las bases lo prevén, cabe el <span class="t" data-k="prorrateo">prorrateo</span> del importe global máximo entre los beneficiarios.</li></ul></li>
<li><b>22.2 — concesión directa, tres supuestos:</b>
<ol><li><b>a)</b> las previstas <b>nominativamente</b> en los presupuestos del Estado, de las comunidades autónomas o de las <b>entidades locales</b>: aquellas en que al menos su <b>dotación presupuestaria y beneficiario</b> aparecen determinados en los estados de gasto;</li>
<li><b>b)</b> aquellas cuyo otorgamiento o cuantía <b>venga impuesto por norma de rango legal</b>;</li>
<li><b>c)</b> con <b>carácter excepcional</b>, aquellas en que se acrediten razones de <b>interés público, social, económico o humanitario</b>, u otras debidamente justificadas que dificulten su convocatoria pública.</li></ol></li>
<li><b>22.3:</b> no podrán otorgarse subvenciones por cuantía superior a la determinada en la convocatoria.</li>
</ul>`,llano:`<p>La regla es competir: se publica una convocatoria, se presentan todos, se puntúa y se reparte por orden hasta agotar el dinero. Solo se puede dar a dedo en tres casos: cuando la subvención figura con nombre y apellidos en el presupuesto, cuando lo impone una ley, o cuando concurren razones excepcionales debidamente acreditadas.</p>`,porque:`<p>La concurrencia es la traducción procedimental de los principios del art. 8.3: sin comparación no hay igualdad ni objetividad posibles. La concesión directa se admite porque hay situaciones en las que competir no tiene sentido —una subvención nominativa ya la decidió el Pleno al aprobar el presupuesto— pero se configura como <b>excepción tasada</b> y, en la letra c), con carga de motivación reforzada.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> repartir plazas de un curso por nota (concurrencia) frente a reservar una plaza por convenio con una entidad concreta (directa).</li>
<li><b>Real:</b> convocatoria municipal de 60.000 € para asociaciones culturales, con criterios de valoración y prelación: concurrencia competitiva.</li>
<li><b>Real (directa):</b> el presupuesto municipal consigna nominativamente 20.000 € a la Cruz Roja local: concesión directa por el art. 22.2.a), canalizada por convenio (art. 28.1).</li>
<li><b>Caso límite:</b> una ayuda de emergencia por un incendio: cabe la letra c), pero hay que <b>acreditar</b> las razones y la dificultad de convocatoria pública.</li>
</ul>`,noej:`<ul>
<li><b>No es concesión directa</b> conceder sin convocatoria por simple comodidad o urgencia no acreditada.</li>
<li><b>No basta</b> con que la subvención aparezca en el presupuesto: para ser nominativa deben estar determinados <b>dotación y beneficiario</b>.</li>
<li><b>No cabe</b> el prorrateo si las bases no lo prevén.</li>
</ul>`,conex:`<ul>
<li><b>Art. 28 LGS:</b> régimen de la concesión directa y convenios.</li>
<li><b>Art. 8.3.a) LGS:</b> principios de publicidad, concurrencia e igualdad.</li>
<li><b>Art. 17.3 LGS:</b> criterios de valoración en las bases.</li>
<li><b>Art. 168.1 TRLHL</b> (documento 5): las subvenciones nominativas se reflejan en el estado de gastos del presupuesto.</li>
</ul>`,trampas:`<ul>
<li>El ordinario es la <b>concurrencia competitiva</b>; la directa es <b>excepción tasada</b> en tres supuestos.</li>
<li>El <b>prorrateo</b> exige previsión expresa en las bases y es excepcional.</li>
<li>La propuesta la formula el <b>órgano colegiado</b> a través del <b>instructor</b>, no el instructor por sí solo.</li>
<li>En la letra a), la nominatividad exige <b>dotación y beneficiario</b> determinados.</li>
</ul>`,ancla:`<p><b>"Compiten todos, salvo tres:"</b> <b>N</b>ominativa · <b>L</b>egal · <b>E</b>xcepcional (interés público, social, económico o humanitario). Regla <b>N-L-E</b>.</p>`,vis:`<svg viewBox="0 0 640 175" role="img" aria-label="Procedimientos de concesión de subvenciones">
<rect x="200" y="10" width="240" height="34" rx="8" fill="var(--acc)" stroke="var(--acc)"/>
<text x="320" y="32" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">PROCEDIMIENTOS DE CONCESIÓN</text>
<line x1="320" y1="44" x2="320" y2="58" stroke="var(--acc)" stroke-width="2"/>
<line x1="165" y1="58" x2="475" y2="58" stroke="var(--acc)" stroke-width="2"/>
<line x1="165" y1="58" x2="165" y2="74" stroke="var(--acc)" stroke-width="2"/><line x1="475" y1="58" x2="475" y2="74" stroke="var(--acc)" stroke-width="2"/>
<rect x="30" y="76" width="270" height="80" rx="8" fill="var(--ej-bg)" stroke="var(--ej)"/>
<text x="165" y="98" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ej)">ORDINARIO: concurrencia competitiva</text>
<text x="165" y="118" text-anchor="middle" font-size="10" fill="currentColor">comparación · prelación · criterios previos</text>
<text x="165" y="136" text-anchor="middle" font-size="10" fill="currentColor">dentro del crédito disponible</text>
<rect x="340" y="76" width="270" height="80" rx="8" fill="var(--warn-bg)" stroke="var(--warn)"/>
<text x="475" y="98" text-anchor="middle" font-size="12" font-weight="700" fill="var(--warn)">EXCEPCIONAL: concesión directa</text>
<text x="475" y="118" text-anchor="middle" font-size="10" fill="currentColor">a) nominativa · b) impuesta por ley</text>
<text x="475" y="136" text-anchor="middle" font-size="10" fill="currentColor">c) interés público, social, económico o humanitario</text>
</svg>`},
{n:23,t:"Iniciación",ubic:"Título I ▸ Capítulo II (Del procedimiento de concesión en régimen de concurrencia competitiva)",idea:"Siempre se inicia de oficio por convocatoria, con trece extremos y diez días para subsanar.",literal:`<p>1. El procedimiento para la concesión de subvenciones se inicia siempre de oficio.</p><p>2. La iniciación de oficio se realizará siempre mediante convocatoria aprobada por el órgano competente, que desarrollará el procedimiento para la concesión de las subvenciones convocadas según lo establecido en este capítulo y de acuerdo con los principios de la Ley 30/1992, de 26 de noviembre, de Régimen Jurídico de las Administraciones Públicas y del Procedimiento Administrativo Común. La convocatoria deberá publicarse en la BDNS y un extracto de la misma, en el "Boletín Oficial del Estado" de acuerdo con el procedimiento establecido en el artículo 20.8. La convocatoria tendrá necesariamente el siguiente contenido:</p><p>a) Indicación de la disposición que establezca, en su caso, las bases reguladoras y del diario oficial en que está publicada, salvo que en atención a su especificidad éstas se incluyan en la propia convocatoria.</p><p>b) Créditos presupuestarios a los que se imputa la subvención y cuantía total máxima de las subvenciones convocadas dentro de los créditos disponibles o, en su defecto, cuantía estimada de las subvenciones.</p><p>c) Objeto, condiciones y finalidad de la concesión de la subvención.</p><p>d) Expresión de que la concesión se efectúa mediante un régimen de concurrencia competitiva.</p><p>e) Requisitos para solicitar la subvención y forma de acreditarlos.</p><p>f) Indicación de los órganos competentes para la instrucción y resolución del procedimiento.</p><p>g) Plazo de presentación de solicitudes, a las que serán de aplicación las previsiones contenidas en el apartado 3 de este artículo.</p><p>h) Plazo de resolución y notificación.</p><p>i) Documentos e informaciones que deben acompañarse a la petición.</p><p>j) En su caso, posibilidad de reformulación de solicitudes de conformidad con lo dispuesto en el artículo 27 de esta ley.</p><p>k) Indicación de si la resolución pone fin a la vía administrativa y, en caso contrario, órgano ante el que ha de interponerse recurso de alzada.</p><p>l) Criterios de valoración de las solicitudes.</p><p>m) Medio de notificación o publicación, de conformidad con lo previsto en el artículo 59 de la Ley 30/1992, de 26 de noviembre, de Régimen Jurídico de las Administraciones Públicas y del Procedimiento Administrativo Común.</p><p>3. Las solicitudes de los interesados acompañarán los documentos e informaciones determinados en la norma o convocatoria, salvo que los documentos exigidos ya estuvieran en poder de cualquier órgano de la Administración actuante, en cuyo caso el solicitante podrá acogerse a lo establecido en el párrafo f) del artículo 35 de la Ley 30/1992, de 26 de noviembre, de Régimen Jurídico de las Administraciones Públicas y del Procedimiento Administrativo Común, siempre que se haga constar la fecha y el órgano o dependencia en que fueron presentados o, en su caso, emitidos, y cuando no hayan transcurrido más de cinco años desde la finalización del procedimiento al que correspondan.</p><p>En los supuestos de imposibilidad material de obtener el documento, el órgano competente podrá requerir al solicitante su presentación, o, en su defecto, la acreditación por otros medios de los requisitos a que se refiere el documento, con anterioridad a la formulación de la propuesta de resolución.</p><p>La presentación telemática de solicitudes y documentación complementaria se realizará en los términos previstos en la disposición adicional decimoctava de la Ley 30/1992, de 26 de noviembre, de Régimen Jurídico de las Administraciones Públicas y del Procedimiento Administrativo Común.</p><p>A efectos de lo previsto en el apartado 3 de la citada disposición adicional decimoctava, la presentación de la solicitud por parte del beneficiario conllevará la autorización al órgano</p><p>gestor para recabar los certificados a emitir por la Agencia Estatal de Administración Tributaria y por la Tesorería General de la Seguridad Social.</p><p>4. A efectos de lo dispuesto en los apartados anteriores, la normativa reguladora de la subvención podrá admitir la sustitución de la presentación de determinados documentos por una declaración responsable del solicitante. En este caso, con anterioridad a la propuesta de resolución de concesión de la subvención se deberá requerir la presentación de la documentación que acredite la realidad de los datos contenidos en la citada declaración, en un plazo no superior a 15 días.</p><p>5. Si la solicitud no reúne los requisitos establecidos en la norma de convocatoria, el órgano competente requerirá al interesado para que la subsane en el plazo máximo e improrrogable de 10 días, indicándole que si no lo hiciese se le tendrá por desistido de su solicitud, previa resolución que deberá ser dictada en los términos previstos en el artículo 71 de la Ley 30/1992, de 26 de noviembre, de Régimen Jurídico de las Administraciones Públicas y del Procedimiento Administrativo Común.</p>`,dis:`<ul>
<li><b>23.1:</b> el procedimiento se inicia <b>siempre de oficio</b>.</li>
<li><b>23.2 — convocatoria:</b> aprobada por el órgano competente, debe contener, entre otros extremos: a) <b>bases reguladoras</b> y diario oficial en que se publicaron · b) <b>créditos presupuestarios</b> y <b>cuantía total máxima</b> · c) objeto, condiciones y finalidad · d) expresión de que se concede en <b>concurrencia competitiva</b> · e) requisitos y forma de acreditarlos · f) <b>órganos competentes</b> para instrucción y resolución · g) <b>plazo de presentación</b> de solicitudes · h) <b>plazo de resolución y notificación</b> · i) documentos que deben acompañarse · j) posibilidad de <b>reformulación</b> · k) si la resolución <b>pone fin a la vía administrativa</b> y, en su caso, recurso de alzada · l) <b>criterios de valoración</b> · m) medio de notificación o publicación.</li>
<li><b>23.3 y 23.4 — documentación:</b> se acompañan los documentos exigidos, salvo que ya obren en poder de la Administración; cabe sustituir determinados documentos por <b>declaración responsable</b>, con requerimiento previo a la propuesta de resolución.</li>
<li><b>23.5 — subsanación:</b> si la solicitud no reúne los requisitos, se requiere al interesado para que subsane en el plazo <b>máximo e improrrogable de 10 días</b>, con advertencia de que en otro caso se le tendrá por <b>desistido</b>, previa resolución.</li>
</ul>`,llano:`<p>Nadie puede pedir una subvención antes de que la Administración la convoque: el procedimiento se inicia siempre de oficio. La convocatoria es el documento que lo dice todo — cuánto dinero hay, quién puede pedirlo, con qué criterios se reparte y en qué plazo. Y si presentas la solicitud incompleta, tienes diez días para arreglarla; si no, se entiende que desistes.</p>`,porque:`<p>Que el inicio sea siempre de oficio garantiza que exista <b>crédito y planificación</b> antes de generar expectativas. El contenido tasado de la convocatoria es la condición de la igualdad: todos los solicitantes deben conocer de antemano las mismas reglas y los mismos criterios de valoración, porque no se pueden inventar después de ver las solicitudes.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> las bases de una oposición: plazo, requisitos, temario y baremo publicados antes de que nadie se inscriba.</li>
<li><b>Real:</b> convocatoria municipal de ayudas al deporte base: 60.000 € del crédito 341/48000, plazo de 20 días naturales, criterios de valoración por número de licencias y por categorías femeninas.</li>
<li><b>Caso límite:</b> una solicitud sin el certificado de estar al corriente: se requiere subsanación por <b>10 días improrrogables</b>; si no se atiende, resolución de desistimiento (art. 23.5).</li>
</ul>`,noej:`<ul>
<li><b>No cabe</b> iniciar el procedimiento a solicitud del interesado sin convocatoria previa.</li>
<li><b>No puede</b> la convocatoria alterar los criterios de valoración de las bases: los desarrolla.</li>
<li><b>No es</b> prorrogable el plazo de subsanación de 10 días.</li>
</ul>`,conex:`<ul>
<li><b>Art. 17 LGS:</b> bases reguladoras que la convocatoria desarrolla.</li>
<li><b>Art. 20.8.a) LGS:</b> comunicación del texto de la convocatoria a la BDNS.</li>
<li><b>Arts. 68 y 73 de la Ley 39/2015</b> (documento 1): subsanación de solicitudes y trámites.</li>
<li><b>Art. 27 LGS:</b> reformulación, que la convocatoria debe prever.</li>
</ul>`,trampas:`<ul>
<li>Inicio <b>siempre de oficio</b>: es una de las preguntas más frecuentes.</li>
<li>El plazo de subsanación es de <b>10 días, máximo e improrrogable</b>, y su incumplimiento produce <b>desistimiento previa resolución</b>.</li>
<li>La convocatoria debe indicar la <b>cuantía total máxima</b> y los <b>créditos presupuestarios</b>.</li>
<li>Ojo: el texto cita la <b>Ley 30/1992</b>; hoy debe entenderse hecha la remisión a la <b>Ley 39/2015</b>.</li>
</ul>`,ancla:`<p><b>"De oficio, por convocatoria y con todo escrito."</b> Y el número que hay que retener: <b>10 días improrrogables</b> para subsanar.</p>`,vis:`<svg viewBox="0 0 640 160" role="img" aria-label="Iniciación del procedimiento de concesión">

{n:24,t:"Instrucción",ubic:"Título I ▸ Capítulo II (Del procedimiento de concesión en régimen de concurrencia competitiva)",idea:"El instructor evalúa, el órgano colegiado informa y se formulan dos propuestas.",literal:`<p>1. La instrucción del procedimiento de concesión de subvenciones corresponde al órgano que se designe en la convocatoria.</p><p>2. El órgano competente para la instrucción realizará de oficio cuantas actuaciones estime necesarias para la determinación, conocimiento y comprobación de los datos en virtud de los cuales debe formularse la propuesta de resolución.</p><p>3. Las actividades de instrucción comprenderán:</p><p>a) Petición de cuantos informes estime necesarios para resolver o que sean exigidos por las normas que regulan la subvención. En la petición se hará constar, en su caso, el carácter determinante de aquellos informes que sean preceptivos. El plazo para su emisión será de 10 días, salvo que el órgano instructor, atendiendo a las características del informe solicitado o del propio procedimiento, solicite su emisión en un plazo menor o mayor, sin que en este último caso pueda exceder de dos meses.</p><p>Cuando en el plazo señalado no se haya emitido el informe calificado por disposición legal expresa como preceptivo y determinante, o, en su caso, vinculante, podrá interrumpirse el plazo de los trámites sucesivos.</p><p>b) Evaluación de las solicitudes o peticiones, efectuada conforme con los criterios, formas y prioridades de valoración establecidos en la norma reguladora de la subvención o, en su caso, en la convocatoria.</p><p>La norma reguladora de la subvención podrá contemplar la posibilidad de establecer una fase de preevaluación en la que se verificará el cumplimiento de las condiciones impuestas para adquirir la condición de beneficiario de la subvención.</p><p>4. Una vez evaluadas las solicitudes, el órgano colegiado al que se refiere el apartado 1 del artículo 22 de esta ley deberá emitir informe en el que se concrete el resultado de la evaluación efectuada.</p><p>El órgano instructor, a la vista del expediente y del informe del órgano colegiado, formulará la propuesta de resolución provisional, debidamente motivada, que deberá notificarse a los interesados en la forma que establezca la convocatoria, y se concederá un plazo de 10 días para presentar alegaciones.</p><p>Se podrá prescindir del trámite de audiencia cuando no figuren en procedimiento ni sean tenidos en cuenta otros hechos ni otras alegaciones y pruebas que las aducidas por los interesados. En este caso, la propuesta de resolución formulada tendrá el carácter de definitiva.</p><p>Examinadas las alegaciones aducidas en su caso por los interesados, se formulará la propuesta de resolución definitiva, que deberá expresar el solicitante o la relación de solicitantes para los que se propone la concesión de la subvención, y su cuantía, especificando su evaluación y los criterios de valoración seguidos para efectuarla.</p><p>El expediente de concesión de subvenciones contendrá el informe del órgano instructor en el que conste que de la información que obra en su poder se desprende que los beneficiarios cumplen todos los requisitos necesarios para acceder a las mismas.</p><p>5. La propuesta de resolución definitiva, cuando resulte procedente de acuerdo con las bases reguladoras, se notificará a los interesados que hayan sido propuestos como beneficiarios en la fase de instrucción, para que en el plazo previsto en dicha normativa comuniquen su aceptación.</p><p>6. Las propuestas de resolución provisional y definitiva no crean derecho alguno a favor del beneficiario propuesto, frente a la Administración, mientras no se le haya notificado la resolución de concesión.</p>`,dis:`<ul>
<li><b>24.1 y 24.2:</b> instruye el <b>órgano designado en la convocatoria</b>, que realiza de oficio cuantas actuaciones sean necesarias.</li>
<li><b>24.3 — actividades de instrucción:</b> a) <b>petición de informes</b>, con plazo de emisión de <b>10 días</b> salvo que se solicite otro; b) <b>evaluación</b> de las solicitudes conforme a los criterios de las bases o la convocatoria, con posible fase de <b>preevaluación</b> del cumplimiento de las condiciones para ser beneficiario.</li>
<li><b>24.4 — la cadena de propuestas:</b>
<ol><li>el <b>órgano colegiado</b> emite <b>informe</b> con el resultado de la evaluación;</li>
<li>el instructor formula la <b><span class="t" data-k="provisional">propuesta de resolución provisional</span></b>, motivada, que se notifica y abre <b>10 días</b> de alegaciones;</li>
<li>cabe <b>prescindir del trámite de audiencia</b> cuando no figuren ni se tengan en cuenta otros hechos ni otras alegaciones y pruebas que las aducidas por los interesados: entonces la propuesta es <b>definitiva</b>;</li>
<li>examinadas las alegaciones, se formula la <b>propuesta de resolución definitiva</b>, que expresa el solicitante o la relación de solicitantes propuestos, la cuantía y los criterios seguidos.</li></ol></li>
<li><b>24.5:</b> cuando proceda según las bases, se notifica la propuesta definitiva para que los propuestos comuniquen su <b>aceptación</b>.</li>
<li><b>24.6 — regla capital:</b> las propuestas provisional y definitiva <b>no crean derecho alguno</b> a favor del beneficiario propuesto mientras no se le haya notificado la resolución de concesión.</li>
</ul>`,llano:`<p>El instructor pide los informes que hagan falta y puntúa las solicitudes. Un órgano colegiado revisa esa evaluación y emite informe. Con eso se hace una propuesta provisional que se notifica para que quien quiera alegue en diez días, y después una definitiva. Y una advertencia que hay que subrayar: estar en la propuesta no da derecho a nada hasta que llega la resolución.</p>`,porque:`<p>La intervención del <b>órgano colegiado</b> es una garantía de objetividad: separa a quien tramita de quien valora. El <b>trámite de audiencia</b> permite corregir errores antes de resolver, y su supresión solo se admite cuando no hay nada nuevo que oír, porque entonces sería un trámite vacío. La regla del apartado 6 evita litigios: hasta la resolución, la Administración puede rectificar sin lesionar derechos adquiridos.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> las listas provisionales de admitidos en un proceso selectivo: puedes reclamar, pero no eres admitido hasta la lista definitiva.</li>
<li><b>Real:</b> en una convocatoria de ayudas al estudio, la comisión de valoración emite informe, el instructor publica propuesta provisional el 3 de marzo, se alega hasta el 17 y el 25 se formula la definitiva.</li>
<li><b>Caso límite:</b> si en el expediente no hay más hechos ni pruebas que las aportadas por los interesados, se puede prescindir del trámite de audiencia y la propuesta será directamente <b>definitiva</b> (art. 24.4).</li>
</ul>`,noej:`<ul>
<li><b>No crea derecho</b> figurar en la propuesta, ni siquiera en la definitiva.</li>
<li><b>No puede</b> el instructor sustituir al órgano colegiado en la evaluación cuando las bases lo prevén.</li>
<li><b>No es</b> el informe del órgano colegiado un mero trámite: debe concretar el resultado de la evaluación.</li>
</ul>`,conex:`<ul>
<li><b>Art. 22.1 LGS:</b> órgano colegiado que formula la propuesta a través del instructor.</li>
<li><b>Art. 27 LGS:</b> reformulación tras la propuesta provisional.</li>
<li><b>Art. 13.3 bis LGS:</b> acreditación de plazos de pago en 10 días hábiles desde la propuesta provisional.</li>
<li><b>Art. 82 de la Ley 39/2015</b> (documento 1): trámite de audiencia y supuestos en que puede prescindirse.</li>
</ul>`,trampas:`<ul>
<li><b>Dos</b> propuestas: provisional y definitiva. Ninguna crea derecho.</li>
<li>El plazo de alegaciones y el de emisión de informes es de <b>10 días</b> en ambos casos.</li>
<li>La preevaluación es <b>potestativa</b> y se refiere a las condiciones para adquirir la condición de beneficiario.</li>
</ul>`,ancla:`<p><b>"Evalúa el instructor, informa el colegiado, propone provisional, oye, propone definitiva."</b><br>Y el aviso: <b>propuesta ≠ derecho</b>.</p>`,vis:`<svg viewBox="0 0 640 175" role="img" aria-label="Instrucción del procedimiento de concesión">

{n:25,t:"Resolución",ubic:"Título I ▸ Capítulo II (Del procedimiento de concesión en régimen de concurrencia competitiva)",idea:"Resolución motivada en seis meses como máximo; el silencio es desestimatorio.",literal:`<p>1. Una vez aprobada la propuesta de resolución definitiva, y de acuerdo con lo previsto en el artículo 89 de la Ley 30/1992, de 26 de noviembre, de Régimen Jurídico de las Administraciones Públicas y del Procedimiento Administrativo Común, y, en su caso, en la correspondiente norma o convocatoria, el órgano competente resolverá el procedimiento.</p><p>2. La resolución se motivará de conformidad con lo que dispongan las bases reguladoras de la subvención debiendo, en todo caso, quedar acreditados en el procedimiento los fundamentos de la resolución que se adopte.</p><p>3. La resolución, además de contener el solicitante o relación de solicitantes a los que se concede la subvención, hará constar, en su caso, de manera expresa, la desestimación del resto de las solicitudes.</p><p>4. El plazo máximo para resolver y notificar la resolución del procedimiento no podrá exceder de seis meses, salvo que una norma con rango de ley establezca un plazo mayor o así venga previsto en la normativa de la Unión Europea. El plazo se computará a partir de la publicación de la correspondiente convocatoria, salvo que la misma posponga sus efectos a una fecha posterior.</p><p>En el supuesto de subvenciones tramitadas por otras Administraciones públicas en las que corresponda la resolución a la Administración General del Estado o a las entidades de derecho público vinculadas o dependientes de ésta, este plazo se computará a partir del momento en que el órgano otorgante disponga de la propuesta o de la documentación que la norma reguladora de la subvención determine.</p><p>5. El vencimiento del plazo máximo sin haberse notificado la resolución legitima a los interesados para entender desestimada por silencio administrativo la solicitud de concesión de la subvención.</p>`,dis:`<ul>
<li><b>25.1 y 25.2:</b> el órgano competente resuelve el procedimiento; la resolución se <b>motiva</b> conforme a las bases, debiendo quedar acreditados los fundamentos de la resolución.</li>
<li><b>25.3 — contenido:</b> además de los solicitantes a los que se concede, hará constar <b>de manera expresa la desestimación del resto</b> de solicitudes.</li>
<li><b>25.4 — plazo:</b> el plazo máximo para resolver y notificar <b>no podrá exceder de seis meses</b>, salvo que una <b>norma con rango de ley</b> establezca uno mayor o así lo prevea la normativa de la Unión Europea. Se computa <b>a partir de la publicación de la convocatoria</b>, salvo que esta posponga sus efectos.</li>
<li><b>25.5 — silencio:</b> el vencimiento del plazo sin notificación legitima a entender <b>desestimada por silencio administrativo</b> la solicitud.</li>
</ul>`,llano:`<p>La Administración tiene seis meses como máximo para resolver y notificar, contados desde que se publica la convocatoria. Si no contesta, hay que entender que dice que no. Y la resolución no puede limitarse a decir a quién se le da: tiene que decir expresamente a quién no.</p>`,porque:`<p>El <b>silencio negativo</b> es coherente con la naturaleza de la subvención: el crédito es limitado y no cabe entender concedido lo que agotaría el presupuesto. Y la exigencia de <b>desestimación expresa</b> del resto no es un formalismo: es lo que permite al no beneficiario conocer su posición en la prelación y recurrir con fundamento.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> una lista de admitidos que también publica quién queda fuera, para que cada uno sepa dónde está.</li>
<li><b>Real:</b> convocatoria publicada el 1 de marzo de 2026: el plazo máximo para resolver y notificar vence el <b>1 de septiembre de 2026</b>. Si el 15 de septiembre no hay notificación, el solicitante puede entender desestimada su solicitud e interponer el recurso que proceda.</li>
<li><b>Caso límite:</b> una norma con rango de ley puede fijar un plazo mayor; una ordenanza municipal, no.</li>
</ul>`,noej:`<ul>
<li><b>No cabe</b> ampliar el plazo por reglamento o por la propia convocatoria más allá de seis meses.</li>
<li><b>No es</b> el silencio positivo: la falta de resolución <b>desestima</b>.</li>
<li><b>No basta</b> resolver: hay que <b>notificar</b> dentro del plazo.</li>
</ul>`,conex:`<ul>
<li><b>Art. 26 LGS:</b> notificación de la resolución.</li>
<li><b>Arts. 21, 24 y 25 de la Ley 39/2015</b> (documento 1): obligación de resolver, silencio y su régimen general.</li>
<li><b>Art. 23.2.h) LGS:</b> la convocatoria debe indicar el plazo de resolución y notificación.</li>
<li><b>Art. 24.6 LGS:</b> hasta la notificación de la resolución no hay derecho.</li>
</ul>`,trampas:`<ul>
<li><b>Seis meses</b> para resolver <b>y notificar</b>, computados desde la <b>publicación de la convocatoria</b>.</li>
<li>Solo una <b>norma con rango de ley</b> (o el derecho de la Unión) puede ampliar el plazo.</li>
<li>El silencio es <b>desestimatorio</b>.</li>
<li>La resolución debe desestimar <b>expresamente</b> el resto de solicitudes.</li>
</ul>`,ancla:`<p><b>"Seis meses desde la convocatoria y, si no contesta, no."</b> Y la resolución dice <b>quién sí y quién no</b>.</p>`,vis:`<svg viewBox="0 0 640 150" role="img" aria-label="Plazo de resolución y silencio administrativo">

</svg>`},
{n:26,t:"Notificación de la resolución",ubic:"Título I ▸ Capítulo II (Del procedimiento de concesión en régimen de concurrencia competitiva)",idea:"La resolución se notifica conforme a las reglas generales del procedimiento administrativo.",literal:`<p>La resolución del procedimiento se notificará a los interesados de acuerdo con lo previsto en el artículo 58 de la Ley 30/1992, de 26 de noviembre, de Régimen Jurídico de las Administraciones Públicas y del Procedimiento Administrativo Común. La práctica de dicha notificación o publicación se ajustará a las disposiciones contenidas en el artículo 59 de la citada ley.</p>`,dis:`<ul>
<li><b>Remisión:</b> la resolución se notifica a los interesados <b>de acuerdo con la legislación de procedimiento administrativo común</b>.</li>
<li><b>Nota de vigencia:</b> el texto cita el <b>art. 58 de la Ley 30/1992</b>; hoy la remisión debe entenderse hecha a los <b>arts. 40 a 46 de la Ley 39/2015</b> (documento 1 de la biblioteca), sobre notificación y publicación.</li>
<li><b>Alternativa habitual:</b> en convocatorias con multiplicidad de interesados, la <b>publicación</b> sustituye a la notificación individual, conforme al art. 45 de la Ley 39/2015.</li>
</ul>`,llano:`<p>Un artículo puramente remisorio: la subvención no tiene reglas propias de notificación, se aplican las generales. En la práctica, cuando hay muchos solicitantes se publica en lugar de notificar uno a uno.</p>`,porque:`<p>No tendría sentido duplicar en la LGS un régimen ya completo en la ley de procedimiento. La remisión asegura además que las <b>garantías del interesado</b> —contenido de la notificación, plazos, recursos— sean las mismas que en cualquier otro procedimiento administrativo.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> las normas de aviso de un concurso: se publican en el tablón porque son cientos de participantes.</li>
<li><b>Real:</b> las bases de una convocatoria municipal prevén que la resolución se publique en el tablón de anuncios de la sede electrónica, sustituyendo a la notificación individual.</li>
</ul>`,noej:`<ul>
<li><b>No crea</b> este artículo un régimen especial de notificación.</li>
<li><b>No cabe</b> sustituir la notificación por publicación si la convocatoria no lo prevé y no concurre el supuesto legal.</li>
</ul>`,conex:`<ul>
<li><b>Arts. 40 a 46 de la Ley 39/2015</b> (documento 1): notificación y publicación.</li>
<li><b>Art. 23.2.m) LGS:</b> la convocatoria debe indicar el medio de notificación o publicación.</li>
<li><b>Arts. 41 a 43 de la Ley 39/2015:</b> notificación electrónica, hoy la regla para personas jurídicas.</li>
</ul>`,trampas:`<ul>
<li>Es una <b>remisión</b>: la cita a la Ley 30/1992 está desfasada.</li>
<li>La convocatoria debe haber indicado el <b>medio</b> de notificación o publicación (art. 23.2.m).</li>
</ul>`,ancla:`<p><b>"Se notifica como todo lo demás."</b> Y si son muchos, <b>se publica</b>.</p>`,vis:`<svg viewBox="0 0 640 115" role="img" aria-label="Notificación de la resolución">

 intervenciones del Fondo Europeo Agrícola de Garantía distintas de las mencionadas en el apartado anterior y por las intervenciones del Fondo Europeo de Desarrollo Rural, la Intervención General de la Administración del Estado será el organismo de certificación público en el ámbito nacional responsable de la coordinación de los organismos de certificación de ámbito autonómico a que se refiere el artículo 12.1 del Reglamento (UE) 2021/2116, y realizará las funciones y cometidos que se le asignen por la correspondiente normativa nacional a estos efectos.</p><p><b>4.</b> Los órganos de control de las Administraciones públicas, en aplicación de la normativa europea, podrán llevar a cabo, además, controles y verificaciones de los procedimientos de gestión de los distintos órganos gestores que intervengan en la concesión y gestión y pago de las ayudas cofinanciadas con fondos europeos que permitan garantizar la correcta gestión financiera de los fondos europeos.</p><p><b>5.</b> La Intervención General de la Administración del Estado y los órganos de control del resto de las Administraciones públicas deberán acreditar ante el órgano competente los gastos en que hubieran incurrido como consecuencia de la realización de controles de fondos europeos, a efectos de su financiación de acuerdo con lo establecido en la normativa europea reguladora de gastos subvencionables con cargo a dichos fondos.</p>", "dis": "<ul>\n<li><b>Coordinación (45.1):</b> en las ayudas financiadas total o parcialmente con <b>fondos europeos</b>, la <b>Intervención General de la Administración del Estado</b> es el órgano competente para establecer, conforme a la normativa europea y nacional, la <b>necesaria coordinación de controles</b>, manteniendo a esos solos efectos las relaciones con los órganos de la <b>Comisión Europea</b>, de los entes territoriales y de la Administración General del Estado.</li>\n<li><b>FEAGA (45.2):</b> en las ayudas financiadas por el <b>Fondo Europeo Agrícola de Garantía</b>, la IGAE realiza las funciones de coordinación de los controles efectuados en aplicación del reglamento europeo correspondiente.</li>\n<li><b>Alcance:</b> el artículo articula la relación entre el control nacional y el europeo, sin desplazar las competencias de control financiero del art. 44.</li>\n</ul>", "llano": "<p>Cuando la subvención lleva dinero europeo, hay dos niveles de control: el español y el de la Comisión. Alguien tiene que coordinarlos para que no se dupliquen ni se dejen huecos, y ese alguien es la Intervención General.</p>", "porque": "<p>Porque la Unión Europea exige a los Estados garantizar que sus fondos se gastan correctamente y responde ante ellos el Estado, no cada Administración por separado. Sin un punto único de coordinación, la Comisión tendría que relacionarse con miles de órganos gestores.</p>\n<p>Y para el beneficiario tiene una consecuencia práctica: puede ser controlado por varias instancias, y el reintegro puede acordarlo también un órgano de la Unión (art. 41.2).</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> una obra financiada por dos bancos: cada uno quiere revisar el avance, y alguien tiene que coordinar las visitas para no parar la obra tres veces.</li>\n<li><b>Real:</b> una diputación gestiona un programa de empleo cofinanciado por el Fondo Social Europeo. Además del control de su propia Intervención, la actuación queda sujeta a la coordinación de controles de la IGAE con la Comisión Europea.</li>\n<li><b>Caso límite:</b> si el reintegro lo acuerdan directamente los órganos de la Unión Europea, lo ejecuta el órgano al que corresponda la gestión del recurso (art. 41.2), no el concedente.</li>\n</ul>", "noej": "<ul>\n<li><b>No sustituye</b> al control financiero del art. 44: lo coordina con el europeo.</li>\n<li><b>No convierte</b> a la IGAE en órgano concedente ni en órgano de reintegro.</li>\n<li><b>No se aplica</b> a las subvenciones puramente nacionales.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 44:</b> control financiero ordinario.</li>\n<li><b>Art. 41.2 y 41.3:</b> reintegros acordados por órganos de la Unión Europea.</li>\n<li><b>Art. 38.3:</b> destino de los reintegros de fondos europeos.</li>\n<li><b>Art. 6:</b> régimen de las subvenciones financiadas con cargo a fondos de la Unión Europea.</li>\n</ul>", "trampas": "<ul>\n<li>La IGAE <b>coordina</b>; no controla en exclusiva ni desplaza a los órganos territoriales.</li>\n<li>El artículo cita expresamente el <b>FEAGA</b>: es el ejemplo típico de examen.</li>\n</ul>", "ancla": "<p><b>«Dinero europeo, control doble y una sola ventanilla de coordinación.»</b></p>", "vis": "<svg viewBox=\"0 0 960 371\" role=\"img\" aria-label=\"Objeto, contenido y competencia del control financiero de subvenciones\" style=\"width:100%;height:auto\"><defs><marker id=\"fl10\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr10\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe10\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw10\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"250\" y=\"8\" width=\"460\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"27.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">EL CONTROL FINANCIERO DE SUBVENCIONES · ARTS. 44 Y 45</text><rect x=\"20\" y=\"52\" width=\"219.5\" height=\"265\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"129.75\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--acc)\">QUÉ VERIFICA</text><text x=\"129.75\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"cur stados financieros</text><text x=\"363.25\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"363.25\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Examen de operaciones</text><text x=\"363.25\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">individualizadas</text><text x=\"363.25\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"363.25\" y=\"180\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Comprobación material</text><text x=\"363.25\" y=\"193\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">de inversiones</text><text x=\"363.25\" y=\"206\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"363.25\" y=\"219\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Y cualesquiera otras</text><text x=\"363.25\" y=\"232\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">comprobaciones</text><text x=\"363.25\" y=\"245\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">pertinentes</text><text x=\"363.25\" y=\"258\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"363.25\" y=\"271\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 44.4</text><rect x=\"487\" y=\"52\" width=\"219.5\" height=\"265\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"596.75\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--warn)\">QUIÉN LO EJERCE</text><text x=\"596.75\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">La INTERVENCIÓN GENERAL</text><text x=\"596.75\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">DE LA ADMINISTRACIÓN</text><text x=\"596.75\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">DEL ESTADO en el ámbito</text><text x=\"596.75\" y=\"128\" text-anchor=\"middle\" f const PLAZOS=[["4 años", "Prescripción del derecho a reconocer o liquidar el reintegro", "Administración", "39.1", "Desde que venció el plazo para justificar, como regla general"], ["12 meses", "Plazo máximo para resolver y notificar el procedimiento de reintegro", "Órgano concedente", "42.4", "Desde el acuerdo de iniciación. Si se agota, CADUCIDAD"], ["Interés legal + 25 %", "Interés de demora en materia de subvenciones", "Beneficiario", "38.2", "Salvo que la Ley de Presupuestos establezca otro"], ["Desde el pago", "Cómputo del interés de demora", "—", "37.1", "Hasta el acuerdo de reintegro o hasta el ingreso, si es anterior"], ["Siempre de oficio", "Iniciación del procedimiento de reintegro", "Órgano concedente", "42.2", "Iniciativa propia, orden superior, petición razonada, denuncia o informe de control"], ["En todo caso", "Derecho de audiencia del interesado", "Interesado", "42.3", "Garantía indisponible del procedimiento"], ["Fin de la vía administrativa", "Efecto de la resolución de reintegro", "—", "42.5", "Cabe reposición potestativa o contencioso directo"], ["Nulidad", "Carencia o insuficiencia de crédito en la concesión", "—", "36.1.b)", "Las demás infracciones son causa de anulabilidad"], ["Solidaria", "Responsabilidad de miembros, representantes de incapaces y cotitulares", "—", "40.2", "Los cotitulares, en proporción a su participación"], ["Subsidiaria", "Responsabilidad de administradores y representantes legales", "—", "40.3", "Y en todo caso los de personas jurídicas que cesaron"], ["6 verificaciones", "Objeto del control financiero", "IGAE", "44.2", "Obtención, cumplimiento, justificación, realidad, financiación y hechos no declarados"], ["4 formas", "Contenido del control financiero", "IGAE", "44.4", "Registros contables, operaciones individualizadas, comprobación material y otras"]];
const FLASH=[["¿Cuáles son las causas de nulidad de la resolución de concesión?", "Las causas de nulidad de pleno derecho del procedimiento administrativo común y la <b>carencia o insuficiencia de crédito</b> (art. 36.1). Las demás infracciones son causa de <b>anulabilidad</b>."], ["¿Cabe revisión de oficio si concurre una causa de reintegro?", "<b>No.</b> El art. 36.5 lo excluye expresamente: el reintegro desplaza a la revisión de oficio."], ["Enumera las causas de reintegro del art. 37.1", "<b>a)</b> obtención falseando u ocultando · <b>b)</b> incumplimiento total o parcial del fin · <b>c)</b> no justificar o justificar insuficientemente · <b>d)</b> no adoptar las medidas de difusión · <b>e)</b> obstruir la comprobación y el control · <b>f)</b> incumplir obligaciones y compromisos · <b>g)</b> los demás supuestos de la normativa reguladora."], ["¿Desde cuándo se cuenta el interés de demora del reintegro?", "Desde el <b>momento del pago</b> de la subvención hasta la fecha en que se acuerde la procedencia del reintegro, o hasta el ingreso si es anterior (art. 37.1)."], ["¿Cuál es el interés de demora aplicable en materia de subvenciones?", "El <b>interés legal del dinero incrementado en un 25 %</b>, salvo que la Ley de Presupuestos Generales del Estado establezca otro (art. 38.2)."], ["¿Qué naturaleza tienen las cantidades a reintegrar?", "<b>Ingresos de derecho público</b>, y los procedimientos para su exigencia tienen <b>siempre carácter administrativo</b> (art. 38.1 y 38.4)."], ["¿En qué plazo prescribe el derecho a exigir el reintegro y desde cuándo?", "<b>Cuatro años</b>, computados como regla desde que <b>venció el plazo para presentar la justificación</b>; desde la concesión solo en el supuesto del art. 30.7; y desde el vencimiento del deber cuando se impusieron condiciones que debían mantenerse (art. 39)."], ["¿Qué interrumpe la prescripción?", "Cualquier acción de la Administración con <b>conocimiento formal</b> del beneficiario; la interposición de recursos, la remisión del tanto de culpa a la jurisdicción penal o la denuncia al Ministerio Fiscal; y cualquier actuación fehaciente del beneficiario conducente a la liquidación o al reintegro (art. 39.3)."], ["¿Quiénes responden solidariamente del reintegro?", "Los <b>miembros</b> de agrupaciones y entidades sin personalidad por las actividades comprometidas, los <b>representantes legales</b> de beneficiarios sin capacidad de obrar y los <b>cotitulares</b> de comunidades de bienes en proporción a su participación (art. 40.2)."], ["¿Y subsidiariamente?", "Los <b>administradores</b> de sociedades mercantiles y representantes legales de otras personas jurídicas que no hicieran lo que les incumbía, adoptaran acuerdos que hicieran posible el incumplimiento o lo consintieran; y <b>en todo caso</b> los representantes de personas jurídicas que cesaron en su actividad (art. 40.3)."], ["¿Quién es competente para exigir el reintegro?", "El <b>órgano concedente</b> (art. 41.1). La Intervención informa mediante el control financiero, pero no resuelve."], ["¿En qué plazo hay que resolver el procedimiento de reintegro y qué ocurre si se agota?", "<b>Doce meses</b> desde el acuerdo de iniciación. Si transcurre sin notificarse resolución, se produce la <b>caducidad</b>, y <b>no se considera interrumpida la prescripción</b> por lo actuado (art. 42.4)."], ["¿La conformidad del órgano gestor cierra el asunto?", "<b>No.</b> Su pronunciamiento se entiende «<b>sin perjuicio</b>» de las actuaciones de control financiero de la Intervención (art. 43)."], ["¿Qué verifica el control financiero de subvenciones?", "La correcta <b>obtención</b>, el <b>cumplimiento</b> de las obligaciones, la adecuada <b>justificación</b>, la <b>realidad y regularidad</b> de las operaciones, la correcta <b>financiación</b> y la existencia de <b>hechos no declarados</b> (art. 44.2)."]];
const TEST=[{"a": 36, "q": "La carencia o insuficiencia de crédito en la resolución de concesión de una subvención es causa de:", "o": [["Nulidad", 1, "Correcto: art. 36.1.b). Las demás infracciones del ordenamiento son causa de anulabilidad."], ["Anulabilidad", 0, "La anulabilidad la reservan el art. 36.2 a las demás infracciones del ordenamiento jurídico."], ["Reintegro", 0, "El reintegro presupone una concesión válida y un incumplimiento posterior."], ["Caducidad del procedimiento", 0, "La caducidad del art. 42.4 afecta al procedimiento de reintegro, no a la concesión."]]}, {"a": 36, "q": "Si concurre alguna de las causas de reintegro del art. 37:", "o": [["No procederá la revisión de oficio del acto de concesión", 1, "Correcto: art. 36.5. El reintegro desplaza a la revisión de oficio."], ["Deberá tramitarse siempre la revisión de oficio", 0, "Es exactamente lo contrario de lo que dispone el art. 36.5."], ["Deberá declararse la lesividad del acto", 0, "La lesividad es la vía de los actos anulables del art. 36.3, no la del reintegro."], ["Procederá la nulidad de pleno derecho", 0, "El reintegro no convierte en nula una concesión válida."]]}, {"a": 37, "q": "NO es causa de reintegro del art. 37.1:", "o": [["La disolución voluntaria de la entidad beneficiaria", 1, "Correcto: no figura entre las causas del art. 37.1. La disolución tiene efectos en el art. 40.4 sobre la transmisión de obligaciones pendientes, pero no es por sí sola causa de reintegro."], ["La justificación insuficiente", 0, "Es la letra c) del art. 37.1."], ["El incumplimiento de las medidas de difusión del art. 18.4", 0, "Es la letra d) del art. 37.1."], ["La resistencia a las actuaciones de control financiero", 0, "Es la letra e) del art. 37.1."]]}, {"a": 37, "q": "El interés de demora en el reintegro se exige:", "o": [["Desde el momento del pago de la subvención", 1, "Correcto: art. 37.1, hasta la fecha del acuerdo de reintegro o del ingreso, si es anterior."], ["Desde el acuerdo de iniciación del procedimiento de reintegro", 0, "El beneficiario ha dispuesto del dinero desde antes: por eso el cómputo arranca en el pago."], ["Desde la notificación de la resolución de reintegro", 0, "Sería tanto como regalar el uso del dinero durante todo el procedimiento."], ["Desde que venció el plazo de justificación", 0, "Ese es el dies a quo de la prescripción (art. 39.2.a), no el del interés."]]}, {"a": 38, "q": "El interés de demora aplicable en materia de subvenciones es:", "o": [["El interés legal del dinero incrementado en un 25 por ciento", 1, "Correcto: art. 38.2, salvo que la Ley de Presupuestos Generales del Estado establezca otro."], ["El interés legal del dinero", 0, "La ley añade expresamente el incremento del 25 %."], ["El interés de demora tributario", 0, "La Ley 38/2003 fija su propia regla."], ["Un 25 por ciento del importe a reintegrar", 0, "El 25 % incrementa el tipo de interés, no el principal."]]}, {"a": 39, "q": "El derecho de la Administración a reconocer o liquidar el reintegro prescribe:", "o": [["A los cuatro años", 1, "Correcto: art. 39.1, computados como regla desde que venció el plazo para justificar."], ["A los cinco años", 0, "Cinco años es un plazo frecuente en otras normas, pero no el del art. 39.1."], ["A los doce meses", 0, "Doce meses es el plazo de resolución del procedimiento, no de prescripción del derecho."], ["A los diez años", 0, "No es ningún plazo de esta ley."]]}, {"a": 39, "q": "Como regla general, el plazo de prescripción del reintegro se computa:", "o": [["Desde el momento en que venció el plazo para presentar la justificación", 1, "Correcto: art. 39.2.a). Desde la concesión solo en el supuesto del art. 30.7."], ["Desde el momento de la concesión", 0, "Solo en el supuesto previsto en el apartado 7 del art. 30."], ["Desde el pago de la subvención", 0, "Ese es el dies a quo del interés de demora, no de la prescripción."], ["Desde que la Administración tiene conocimiento del incumplimiento", 0, "La ley fija reglas objetivas, no basadas en el conocimiento."]]}, {"a": 40, "q": "Los administradores de una sociedad mercantil beneficiaria que consintieron el incumplimiento responden del reintegro:", "o": [["Subsidiariamente", 1, "Correcto: art. 40.3. La responsabilidad solidaria del 40.2 se reserva a miembros, representantes de incapaces y cotitulares."], ["Solidariamente", 0, "La solidaridad del art. 40.2 no alcanza a los administradores de sociedades mercantiles."], ["No responden en ningún caso", 0, "El art. 40.3 los declara expresamente responsables subsidiarios."], ["Solo si la sociedad se disuelve", 0, "La disolución tiene su propia regla en el art. 40.4."]]}, {"a": 41, "q": "La competencia para exigir el reintegro corresponde:", "o": [["Al órgano concedente", 1, "Correcto: art. 41.1, cuando aprecie la existencia de alguno de los supuestos del art. 37."], ["A la Intervención General", 0, "La Intervención ejerce el control financiero (art. 44), pero no resuelve el reintegro."], ["Al Tribunal de Cuentas", 0, "Sus funciones son de fiscalización externa, no de resolución del reintegro."], ["Al Pleno de la corporación en todo caso", 0, "La competencia sigue al órgano que concedió, sea cual sea."]]}, {"a": 42, "q": "El procedimiento de reintegro:", "o": [["Se inicia siempre de oficio y su plazo máximo de resolución es de doce meses desde el acuerdo de iniciación", 1, "Correcto: art. 42.2 y 42.4. Si se agota, caduca."], ["Puede iniciarse a solicitud del beneficiario", 0, "El art. 42.2 lo configura como procedimiento siempre de oficio."], ["Tiene un plazo de resolución de tres meses", 0, "El plazo específico de esta ley es de doce meses."], ["No admite la caducidad", 0, "El art. 42.4 la prevé expresamente."]]}, {"a": 42, "q": "Si caduca el procedimiento de reintegro:", "o": [["No se considera interrumpida la prescripción por las actuaciones realizadas hasta ese momento", 1, "Correcto: art. 42.4. Es la consecuencia más gravosa de dejar caducar el procedimiento."], ["Se entiende desestimado el reintegro", 0, "La caducidad no resuelve el fondo del asunto."], ["Prescribe automáticamente el derecho de la Administración", 0, "La prescripción sigue su propio plazo de cuatro años; lo que se pierde es el efecto interruptivo."], ["El beneficiario queda liberado definitivamente", 0, "Puede iniciarse un nuevo procedimiento si el derecho no ha prescrito."]]}, {"a": 43, "q": "El pronunciamiento favorable del órgano gestor sobre la aplicación de los fondos:", "o": [["Se entiende sin perjuicio de las actuaciones de control financiero de la Intervención", 1, "Correcto: art. 43. La conformidad del gestor no blinda al beneficiario."], ["Impide cualquier control posterior", 0, "Sería tanto como vaciar de contenido el control financiero."], ["Sustituye al control financiero", 0, "Son controles de naturaleza y alcance distintos, y son acumulativos."], ["Solo puede revisarse por el Tribunal de Cuentas", 0, "La Intervención conserva íntegramente su competencia de control financiero."]]}, {"a": 44, "q": "El control financiero de subvenciones en el ámbito estatal lo ejerce:", "o": [["La Intervención General de la Administración del Estado, sin perjuicio de las funciones del Tribunal de Cuentas", 1, "Correcto: art. 44.3."], ["El órgano concedente", 0, "El órgano concedente comprueba la justificación (art. 32); el control financiero es independiente."], ["Exclusivamente el Tribunal de Cuentas", 0, "El art. 44.3 atribuye la competencia a la IGAE, sin perjuicio de las funciones del Tribunal."], ["La Agencia Estatal de Administración Tributaria", 0, "No tiene atribuida esta competencia en la Ley 38/2003."]]}, {"a": 44, "q": "El control financiero puede consistir, entre otras actuaciones, en:", "o": [["La comprobación material de las inversiones financiadas", 1, "Correcto: art. 44.4. No se limita al examen documental."], ["La imposición directa de sanciones", 0, "Las sanciones tienen su propio procedimiento en los arts. 52 y siguientes."], ["La resolución del procedimiento de reintegro", 0, "Eso corresponde al órgano concedente (art. 41.1)."], ["La revocación de las bases reguladoras", 0, "No es una actuación de control financiero."]]}];
const CASOS=[{"t": "Caso 1 · Todo el camino de un reintegro", "e": "El 3 de marzo de 2021 una diputación concede a una asociación <b>18.000 €</b> para un programa de refuerzo escolar de 300 horas, con plazo de justificación hasta el <b>31 de enero de 2022</b>. La asociación imparte 270 horas, no coloca el cartel de financiación y presenta la justificación fuera de plazo. El 12 de septiembre de 2024 la diputación notifica formalmente el acuerdo de iniciación del procedimiento de reintegro. Las bases contenían criterios de graduación.<br><br><b>Se pide:</b> identifica las causas, di si la Administración llega a tiempo, calcula qué debe devolverse y hasta cuándo puede resolverse.", "s": "<p><b>1 · Causas de reintegro (art. 37.1).</b> Concurren tres: <b>b)</b> incumplimiento parcial de la actividad —270 de 300 horas—; <b>c)</b> incumplimiento de la obligación de justificación en plazo; y <b>d)</b> incumplimiento de las medidas de difusión del art. 18.4.</p><p><b>2 · Vía correcta.</b> No cabe revisión de oficio: concurren causas de reintegro y el art. 36.5 la excluye.</p><p><b>3 · Prescripción (art. 39).</b> El plazo de cuatro años se cuenta desde que venció el plazo de justificación, el <b>1 de febrero de 2022</b>: prescribiría el 1 de febrero de 2026. La notificación formal del 12 de septiembre de 2024 <b>interrumpe</b> la prescripción (art. 39.3.a). La Administración llega sobradamente a tiempo.</p><p><b>4 · Cuantía.</b> Como el cumplimiento se aproxima de modo significativo al total y las bases contienen <b>criterios de graduación</b>, procede el <b>reintegro parcial</b> del art. 37.2. Con una graduación proporcional al 10 % de horas no impartidas: <b>1.800 €</b>, más el interés de demora <b>desde el pago</b> de la subvención (art. 37.1), al interés legal <b>incrementado en un 25 %</b> (art. 38.2).</p><p><b>5 · Plazo del procedimiento (art. 42.4).</b> Doce meses desde el acuerdo de iniciación: hasta el <b>12 de septiembre de 2025</b>. Si no se notifica resolución antes, el procedimiento <b>caduca</b> y, además, <b>no se considera interrumpida la prescripción</b> por lo actuado.</p><p><b>6 · Y quién resuelve.</b> El <b>órgano concedente</b> (art. 41.1), con audiencia del interesado (art. 42.3). La resolución <b>pone fin a la vía administrativa</b> (art. 42.5).</p>"}, {"t": "Caso 2 · ¿Anular o reintegrar?", "e": "Una diputación detecta dos irregularidades en el mismo ejercicio:<br><b>A)</b> Una subvención de 40.000 € para un festival concedida en octubre con cargo a una aplicación que solo tenía 12.000 € de crédito, sin modificación presupuestaria.<br><b>B)</b> Una subvención de 25.000 € correctamente concedida y con crédito suficiente, cuyo beneficiario se niega a facilitar sus libros contables al control financiero.<br><br><b>Se pide:</b> di qué vía procede en cada caso y por qué no puede elegirse la otra.", "s": "<p><b>A) Vía de la invalidez.</b> La <b>carencia o insuficiencia de crédito</b> es causa de <b>nulidad</b> por el art. 36.1.b). El acto nació viciado, no hay incumplimiento del beneficiario. Procede la <b>revisión de oficio</b> (art. 36.3) y, declarada la nulidad, la <b>obligación de devolver</b> las cantidades percibidas (art. 36.4).</p><p><b>B) Vía del reintegro.</b> La negativa a las actuaciones de control financiero es causa de reintegro por el art. <b>37.1.e)</b>. Y aquí opera el cierre del art. <b>36.5</b>: concurriendo una causa de reintegro, <b>no procede la revisión de oficio</b> del acto de concesión. Hay que tramitar el procedimiento del art. 42, resuelto por el órgano concedente.</p><p><b>Por qué importa la distinción.</b> No es un formalismo: la nulidad de pleno derecho no está sujeta a plazo, mientras que el reintegro prescribe a los <b>cuatro años</b>. Permitir a la Administración elegir la vía sería permitirle esquivar la prescripción. Por eso el art. 36.5 no le deja elegir.</p><p><b>Un matiz sobre B.</b> La negativa al control es causa de reintegro <b>por sí sola</b>, con independencia de que la actividad subvencionada se hubiera realizado correctamente: lo que se protege es la posibilidad misma de verificarlo.</p>"}, {"t": "Caso 3 · ¿Quién paga si la asociación desaparece?", "e": "Tres asociaciones se agrupan para ejecutar un programa cultural y reciben <b>45.000 €</b>, comprometiéndose cada una a una parte. Una de ellas, constituida como sociedad mercantil, no ejecuta su parte —valorada en 15.000 €— y cesa en su actividad sin justificar. El órgano gestor había dado por buena la justificación global en marzo; en noviembre, un control financiero detecta el incumplimiento.<br><br><b>Se pide:</b> di si el visto bueno del gestor impide actuar, quién responde y con qué carácter.", "s": "<p><b>1 · El visto bueno no cierra nada (art. 43).</b> El pronunciamiento del órgano gestor sobre la aplicación de los fondos se entiende «<b>sin perjuicio</b>» de las actuaciones de control financiero. El control de noviembre es plenamente válido y puede desembocar en reintegro.</p><p><b>2 · Obligado principal (art. 40.1).</b> El beneficiario incumplidor debe reintegrar la parte correspondiente más los intereses de demora, obligación <b>independiente</b> de las sanciones que procedan.</p><p><b>3 · Responsabilidad solidaria (art. 40.2).</b> Los <b>miembros</b> de la agrupación responden solidariamente <b>en relación con las actividades subvencionadas que se hubieran comprometido a efectuar</b>. Es decir, respecto de los 15.000 € de la parte incumplida, no de los 45.000 €.</p><p><b>4 · Responsabilidad subsidiaria (art. 40.3).</b> Al tratarse de una sociedad mercantil que <b>ha cesado en sus actividades</b>, sus representantes legales responden subsidiariamente <b>en todo caso</b>, sin necesidad de acreditar que adoptaron acuerdos concretos.</p><p><b>5 · Y si se hubiera disuelto y liquidado (art. 40.4).</b> Las obligaciones de reintegro pendientes se transmiten a los socios o partícipes, que responden solidariamente hasta el <b>límite del valor de la cuota de liquidación</b> que les corresponda.</p>"}];
const SEMAFORO=["Distingo invalidez de la concesión (art. 36) de reintegro (art. 37)", "Sé que la insuficiencia de crédito es causa de NULIDAD, no de anulabilidad", "Sé que si hay causa de reintegro NO cabe revisión de oficio — art. 36.5", "Enumero las siete causas de reintegro del art. 37.1", "Sé cuándo procede el reintegro parcial y qué lo hace posible — art. 37.2", "Sé desde cuándo se cuenta el interés de demora y a qué tipo — arts. 37.1 y 38.2", "Sé que las cantidades a reintegrar son ingresos de derecho público — art. 38.1", "Domino el plazo de prescripción y sus tres dies a quo — art. 39", "Conozco las tres causas de interrupción de la prescripción — art. 39.3", "Distingo responsabilidad solidaria de subsidiaria en el reintegro — art. 40", "Sé quién es competente para exigir el reintegro — art. 41", "Sé el plazo de doce meses, la caducidad y su efecto sobre la prescripción — art. 42", "Sé que el visto bueno del órgano gestor no impide el control financiero — art. 43", "Enumero las seis verificaciones del control financiero — art. 44.2"];
const INTRO_HTML="<section class=\"card\" id=\"intro\"><h2>Tema 11-12 · Bloque 3 · Reintegro y control financiero</h2><p class=\"small\">Los bloques anteriores terminaban con la subvención concedida, pagada y justificada. Aquí empieza la otra mitad de la película: qué pasa cuando algo salió mal. Y lo primero es distinguir dos cosas que se confunden constantemente: que la subvención <b>naciera mal</b> y que el beneficiario <b>se portara mal</b>.</p><div class=\"box ej\"><span class=\"lbl\">La idea que ordena todo el bloque</span>Dos caminos que nunca se cruzan. Si el vicio está en el <b>acto de concesión</b> —por ejemplo, no había crédito— se va por la <b>invalidez</b> del art. 36: revisión de oficio o lesividad. Si el vicio está en la <b>conducta posterior</b> del beneficiario, se va por el <b>reintegro</b> de los arts. 37 a 42. Y el art. <b>36.5</b> cierra el sistema: si hay causa de reintegro, <b>no</b> cabe revisión de oficio. La Administración no elige.</div><div class=\"box warn\"><span class=\"lbl\">Fuentes utilizadas y vigencia</span><ul><li><b>Ley 38/2003, de 17 de noviembre</b>, General de Subvenciones (documento de la biblioteca del proyecto), arts. 36 a 45, <b>texto consolidado</b>, transcritos literalmente.</li><li><b>Advertencia sobre las remisiones:</b> el texto consolidado sigue citando la <b>Ley 30/1992</b>. Debe leerse referida a la <b>Ley 39/2015</b> —arts. 47, 48, 82, 95, 106 y 107— que es la norma vigente y también está en la biblioteca del proyecto.</li><li><b>Aportación externa</b>: la <b>Ley General Presupuestaria</b>, a la que remite el art. 38.1, y el <b>Reglamento (UE) 2021/2116</b>, citado por el art. 45.2.</li><li><b>Verifica siempre la vigencia en el BOE consolidado.</b> El interés de demora del art. 38.2 puede ser modificado cada año por la Ley de Presupuestos Generales del Estado.</li><li>Las entidades, fechas y cifras de los ejemplos y casos son <b>ficticias</b>; los preceptos y los plazos, reales.</li></ul></div><div class=\"box exc\"><span class=\"lbl\">Esto no es asesoramiento jurídico</span>Es material de estudio. Para un expediente real, acude a la norma consolidada y al informe del órgano competente.</div></section><section class=\"card\" id=\"mapa\"><h2>El mapa del bloque</h2><p class=\"small\">Primero, la bifurcación entre invalidez y reintegro. Después, las causas, los plazos y el procedimiento.</p><svg viewBox=\"0 0 960 295\" role=\"img\" aria-label=\"Causas de nulidad y anulabilidad de la resolución de concesión de una subvención\" style=\"width:100%;height:auto\"><defs><marker id=\"fl11\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr11\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe11\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw11\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"250\" y=\"8\" width=\"460\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"27.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">INVALIDEZ DE LA RESOLUCIÓN DE CONCESIÓN · ART. 36</text><rect x=\"20\" y=\"52\" width=\"219.5\" height=\"175\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"129.75\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--exc)\">NULIDAD</text><text x=\"129.75\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">a) Las causas de nulidad</text><text x=\"129.75\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">de pleno derecho del</text><text x=\"129.75\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">procedimiento administrativo</text><text x=\"129.75\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">común</text><text x=\"129.75\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"129.75\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">b) La CARENCIA O</text><text x=\"129.75\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">INSUFICIENCIA DE CRÉDITO</text><text x=\"129.75\" y=\"180\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"129.75\" y=\"193\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 36.1</text><rect x=\"253.5\" y=\"52\" width=\"219.5\" height=\"175\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"363.25\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--warn)\">ANULABILIDAD</text><text x=\"363.25\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Las DEMÁS infracciones</text><text x=\"363.25\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">del ordenamiento jurídico</text><text x=\"363.25\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"363.25\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">y en especial las de las</text><text x=\"363.25\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">reglas de la propia Ley</text><text x=\"363.25\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">38/2003</text><text x=\"363.25\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"363.25\" y=\"180\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 36.2</text><rect x=\"487\" y=\"52\" width=\"219.5\" height=\"175\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"596.75\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--acc)\">QUÉ HACE LA\nADMINISTRACIÓN</text><text x=\"596.75\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">REVISIÓN DE OFICIO</text><text x=\"596.75\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"596.75\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">o, en su caso, declaración</text><text x=\"596.75\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">de LESIVIDAD y ulterior</text><text x=\"596.75\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">impugnación</text><text x=\"596.75\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"596.75\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 36.3</text><rect x=\"720.5\" y=\"52\" width=\"219.5\" height=\"175\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"830.25\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--ej)\">EFECTO</text><text x=\"830.25\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">La declaración judicial o</text><text x=\"830.25\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">administrativa de nulidad</text><text x=\"830.25\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">o anulación lleva consigo</text><text x=\"830.25\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">la OBLIGACIÓN DE DEVOLVER</text><text x=\"830.25\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">las cantidades percibidas</text><text x=\"830.25\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"830.25\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 36.4</text><rect x=\"20\" y=\"237\" width=\"920\" height=\"48\" rx=\"8\" fill=\"var(--panel)\" stroke=\"var(--line)\"/><text x=\"480\" y=\"257.828\" text-anchor=\"middle\" font-size=\"10.4\" fill=\"currentColor\">Regla de deslinde del art. 36.5: NO procede la revisión de oficio del acto de concesión cuando concurra alguna de las causas de REINTEGRO del art. 37.</text><text x=\"480\" y=\"270.828\" text-anchor=\"middle\" font-size=\"10.4\" fill=\"currentColor\">Invalidez y reintegro son dos caminos distintos, y el reintegro desplaza a la revisión de oficio.</text></svg><svg viewBox=\"0 0 960 532\" role=\"img\" aria-label=\"Causas por las que procede el reintegro de una subvención\" style=\"width:100%;height:auto\"><defs><marker id=\"fl12\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr12\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe12\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw12\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"250\" y=\"8\" width=\"460\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"27.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">LAS CAUSAS DE REINTEGRO · ART. 37.1</text><rect x=\"20\" y=\"52\" width=\"920\" height=\"40\" rx=\"10\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><rect x=\"30\" y=\"59\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--exc)\"/><text x=\"120\" y=\"76\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--exc)\">a) OBTENCIÓN FRAUDULENTA</text><text x=\"224\" y=\"74\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Falsear las condiciones requeridas u ocultar las que lo habrían impedido.</text><text x=\"930\" y=\"74\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">37.1.a</text><path d=\"M480 93 L 480 101\" stroke=\"var(--exc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl12)\"/><rect x=\"20\" y=\"102\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><rect x=\"30\" y=\"116\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--exc)\"/><text x=\"120\" y=\"133\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--exc)\">b) INCUMPLIMIENTO DEL FIN</text><text x=\"224\" y=\"124\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Total o parcial del objetivo, la actividad o el proyecto, o no adoptar</text><text x=\"224\" y=\"138\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">el comportamiento que fundamenta la concesión.</text><text x=\"930\" y=\"124\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">37.1.b</text><path d=\"M480 157 L 480 165\" stroke=\"var(--exc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl12)\"/><rect x=\"20\" y=\"166\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"30\" y=\"180\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"120\" y=\"197\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--warn)\">c) NO JUSTIFICAR</text><text x=\"224\" y=\"188\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Incumplimiento de la obligación de justificación o justificación</text><text x=\"224\" y=\"202\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">insuficiente, en los términos del art. 30.</text><text x=\"930\" y=\"188\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">37.1.c</text><path d=\"M480 221 L 480 229\" stroke=\"var(--warn)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl12)\"/><rect x=\"20\" y=\"230\" width=\"920\" height=\"40\" rx=\"10\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"30\" y=\"237\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"120\" y=\"254\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--warn)\">d) NO DAR PUBLICIDAD</text><text x=\"224\" y=\"252\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Incumplir las medidas de difusión del art. 18.4.</text><text x=\"930\" y=\"252\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">37.1.d</text><path d=\"M480 271 L 480 279\" stroke=\"var(--warn)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl12)\"/><rect x=\"20\" y=\"280\" width=\"920\" height=\"68\" rx=\"10\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"30\" y=\"301\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"120\" y=\"318\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--warn)\">e) OBSTRUIR EL CONTROL</text><text x=\"224\" y=\"302\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Resistencia, excusa, obstrucción o negativa a las actuaciones de</text><text x=\"224\" y=\"316\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">comprobación y control financiero de los arts. 14 y 15, y el incumplimiento</text><text x=\"224\" y=\"330\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">contable o registral que impida verificar el empleo de los fondos.</text><text x=\"930\" y=\"302\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">37.1.e</text><path d=\"M480 349 L 480 357\" stroke=\"var(--warn)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl12)\"/><rect x=\"20\" y=\"358\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"30\" y=\"366\" width=\"180\" height=\"38\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"120\" y=\"382.5\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--acc)\">f) INCUMPLIR OBLIGACIONES</text><text x=\"120\" y=\"395.5\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--acc)\">Y COMPROMISOS</text><text x=\"224\" y=\"380\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Los impuestos por la Administración o asumidos por el beneficiario,</text><text x=\"224\" y=\"394\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">siempre que afecten al modo de conseguir los objetivos.</text><text x=\"930\" y=\"380\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">37.1.f</text><path d=\"M480 413 L 480 421\" stroke=\"var(--acc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl12)\"/><rect x=\"20\" y=\"422\" width=\"920\" height=\"40\" rx=\"10\" fill=\"var(--panel)\" stroke=\"var(--line)\"/><rect x=\"30\" y=\"429\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--line)\"/><text x=\"120\" y=\"446\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"currentColor\">g) OTROS</text><text x=\"224\" y=\"444\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Los demás supuestos previstos en la normativa reguladora de la subvención.</text><text x=\"930\" y=\"444\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">37.1.g</text><rect x=\"20\" y=\"472\" width=\"920\" height=\"48\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"480\" y=\"492.828\" text-anchor=\"middle\" font-size=\"10.4\" fill=\"currentColor\">El reintegro no es una sanción: es la devolución de lo percibido más el INTERÉS DE DEMORA desde el pago de la subvención.</text><text x=\"480\" y=\"505.828\" text-anchor=\"middle\" font-size=\"10.4\" fill=\"currentColor\">Y es independiente de las sanciones que en su caso resulten exigibles (art. 40.1).</text></svg><svg viewBox=\"0 0 960 454\" role=\"img\" aria-label=\"Competencia, iniciación, plazos y caducidad del procedimiento de reintegro\" style=\"width:100%;height:auto\"><defs><marker id=\"fl13\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr13\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe13\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw13\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"250\" y=\"8\" width=\"460\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"27.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">EL PROCEDIMIENTO DE REINTEGRO · ARTS. 41 Y 42</text><rect x=\"20\" y=\"52\" width=\"920\" height=\"40\" rx=\"10\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"30\" y=\"59\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"120\" y=\"76\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--acc)\">QUIÉN</text><text x=\"224\" y=\"74\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">El ÓRGANO CONCEDENTE es el competente para exigir el reintegro.</text><text x=\"930\" y=\"74\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">41.1</text><path d=\"M480 93 L 480 101\" stroke=\"var(--acc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl13)\"/><rect x=\"20\" y=\"102\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"30\" y=\"116\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"120\" y=\"133\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--acc)\">CÓMO SE INICIA</text><text x=\"224\" y=\"124\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">SIEMPRE DE OFICIO: por propia iniciativa, por orden superior, a petición</text><text x=\"224\" y=\"138\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">razonada de otros órganos, por denuncia o por informe de control financiero.</text><text x=\"930\" y=\"124\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">42.2</text><path d=\"M480 157 L 480 165\" stroke=\"var(--acc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl13)\"/><rect x=\"20\" y=\"166\" width=\"920\" height=\"40\" rx=\"10\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><rect x=\"30\" y=\"173\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--ej)\"/><text x=\"120\" y=\"190\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--ej)\">GARANTÍA</text><text x=\"224\" y=\"188\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Se garantiza en todo caso el derecho del interesado a la AUDIENCIA.</text><text x=\"930\" y=\"188\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">42.3</text><path d=\"M480 207 L 480 215\" stroke=\"var(--ej)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl13)\"/><rect x=\"20\" y=\"216\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"30\" y=\"230\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"120\" y=\"247\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--warn)\">PLAZO · 12 MESES</text><text x=\"224\" y=\"238\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Para resolver y notificar, desde la fecha del acuerdo de iniciación.</text><text x=\"224\" y=\"252\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Suspendible y ampliable conforme al procedimiento administrativo común.</text><text x=\"930\" y=\"238\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">42.4</text><path d=\"M480 271 L 480 279\" stroke=\"var(--warn)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl13)\"/><rect x=\"20\" y=\"280\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><rect x=\"30\" y=\"294\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--exc)\"/><text x=\"120\" y=\"311\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--exc)\">SI SE PASA EL PLAZO</text><text x=\"224\" y=\"302\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">CADUCIDAD del procedimiento, sin que se considere interrumpida la</text><text x=\"224\" y=\"316\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">prescripción por las actuaciones realizadas hasta ese momento.</text><text x=\"930\" y=\"302\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">42.4</text><path d=\"M480 335 L 480 343\" stroke=\"var(--exc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl13)\"/><rect x=\"20\" y=\"344\" width=\"920\" height=\"40\" rx=\"10\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><rect x=\"30\" y=\"351\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--ej)\"/><text x=\"120\" y=\"368\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--ej)\">EFECTO DE LA RESOLUCIÓN</text><text x=\"224\" y=\"366\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">PONE FIN A LA VÍA ADMINISTRATIVA.</text><text x=\"930\" y=\"366\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">42.5</text><rect x=\"20\" y=\"394\" width=\"920\" height=\"48\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"480\" y=\"414.828\" text-anchor=\"middle\" font-size=\"10.4\" fill=\"currentColor\">Las cantidades a reintegrar son INGRESOS DE DERECHO PÚBLICO y el procedimiento tiene SIEMPRE carácter administrativo (art. 38.1 y 38.4).</text><text x=\"480\" y=\"427.828\" text-anchor=\"middle\" font-size=\"10.4\" fill=\"currentColor\">Interés de demora: el interés legal del dinero incrementado en un 25 %, salvo que la Ley de Presupuestos establezca otro (art. 38.2).</text></svg></section>";

/* Reveal on scroll para las tarjetas */
function reveal(){
  var els=document.querySelectorAll("section.card:not(.rv)");
  if(!els.length)return;
  if(!("IntersectionObserver" in window)){return;}
  var io=new IntersectionObserver(function(es){
    es.forEach(function(en){if(en.isIntersecting){en.target.classList.add("in");io.unobserve(en.target);}});
  },{threshold:.06,rootMargin:"0px 0px -30px 0px"});
  Array.prototype.forEach.call(els,function(el){el.classList.add("rv");io.observe(el);});
}

/* Sección activa en el índice lateral */
function spy(){
  var links=document.querySelectorAll("nav.side a[href^='#']");
  if(!links.length||!("IntersectionObserver" in window))return;
  var map={};
  Array.prototype.forEach.call(links,function(a){
    var t=document.getElementById(a.getAttribute("href").slice(1));
    if(t)map[t.id]=a;
  });
  var io=new IntersectionObserver(function(es){
    es.forEach(function(en){
      if(en.isIntersecting){
        Array.prototype.forEach.call(links,function(a){a.classList.remove("on");});
        if(map[en.target.id])map[en.target.id].classList.add("on");
      }
    });
  },{rootMargin:"-80px 0px -70% 0px",threshold:0});

}

/* ═══ Parser de respuestas: estructura semántica ═══ */
var FCFMT=(function(){
  var CITA=/\s*\(((?:arts?\.|DA\b|DT\b|disp\.)[^)]*)\)\s*\.?\s*$/i;
  var strip=function(h){return h.replace(/<[^>]+>/g,"");};

  function esc(s){return s;}

  function parse(raw){
    var out={verdict:null,cite:null,kind:"p",items:[],text:""};
    var body=String(raw).trim();

    /* 1 ── Cita legal al final */
    var m=body.match(CITA);
    if(m){out.cite=m[1].replace(/\s+/g," ").trim();body=body.slice(0,m.index).trim();}
    body=body.replace(/[.;,\s]+$/,"");

    /* 2 ── Veredicto Sí / No inicial */
    var v=strip(body).match(/^(Sí|Sí,|No|No,)[.:,]?\s/);
    if(v){
      out.verdict=/^Sí/.test(v[1])?"si":"no";
      body=body.replace(/^(<[^>]+>\s*)*(Sí|No)[.,:]?\s*/,"").trim();
      body=body.replace(/^en\s/,"En ");
    }

    /* 3 ── Enumeración con · */
    var parts=body.split(/\s+·\s+/);
    if(parts.length>=2){
      out.kind="list";
      var letras=parts.filter(function(p){return /^\s*<?[a-h]\)/.test(strip(p));}).length;
      out.marker = letras>=parts.length-1 ? "alpha" : "num";
      out.items=parts.map(function(p){
        return p.replace(/^\s*[a-h]\)\s*/,"").replace(/[.\s]+$/,"").trim();
      }).filter(Boolean);
      return out;
    }

    /* 4 ── Cláusulas contrapuestas con ; */
    var semi=body.split(/;\s+/);
    if(semi.length>=2&&semi.length<=3&&semi.every(function(s){return strip(s).length>14;})){
      out.kind="clauses";
      out.items=semi.map(function(s){return s.replace(/[.\s]+$/,"").trim();});
      return out;
    }

    /* 5 ── Párrafo */
    out.text=body;
    return out;
  }

  function render(raw){
    var d=parse(raw),h="";

    if(d.verdict){
      h+='<span class="fc-verdict '+d.verdict+'">'+(d.verdict==="si"?"✓ Sí":"✗ No")+'</span>';
    }

    if(d.kind==="list"){
      h+='<ol class="fc-list '+d.marker+'">';
      d.items.forEach(function(it){h+='<li>'+it+'</li>';});
      h+='</ol>';
    }else if(d.kind==="clauses"){
      h+='<div class="fc-clauses">';
      d.items.forEach(function(it){h+='<p>'+it+'</p>';});
      h+='</div>';
    }else if(d.text){
      h+='<p class="fc-p">'+d.text+'</p>';
    }

    if(d.cite){
      h+='<span class="fc-cite"><span class="s">§</span>'+d.cite+'</span>';
    }
    return {html:h,struct:(d.kind!=="p"||!!d.verdict||strip(raw).length>150)};
  }
  return {parse:parse,render:render};
})();

(function(){

          +'<span class="fc-tag">Pregunta</span><span class="fc-pip tr"></span><span class="fc-pip bl"></span>'

  var ctr=document.createElement("div");

  ctr.innerHTML='<button id="fcflip">⟲ Girar</button>'

    +'<span class="fc-score">'
      +'<span class="fc-pill ok" id="fcpok">0 sabidas</span>'
      +'<span class="fc-pill ko" id="fcpko">0 repasar</span>'
      +'<span class="fc-pill left" id="fccount">0</span>'

  sec.appendChild(ctr);

  var deck=stage.querySelector("#fcdeck"), lift=stage.querySelector("#fclift"),
      card=stage.querySelector("#fcbox"),
      front=stage.querySelector(".fc-front"), backf=stage.querySelector(".fc-back"),
      fill=bar.querySelector("i"),
      pok=ctr.querySelector("#fcpok"), pko=ctr.querySelector("#fcpko"),
      pleft=ctr.querySelector("#fccount");
  var rot=0;

  function reset(){
    order=CARDS.map(function(_,i){return i;});
    fi=0;ok=0;ko=0;back=false;busy=false;rot=0;
    card.style.transition="none";card.style.transform="rotateY(0deg)";
    void card.offsetWidth;card.style.transition="";
    deck.classList.remove("empty");
    var d=stage.querySelector(".fc-done");if(d)d.remove();
    card.style.display="";
    draw();
  }

  function bump(el){el.classList.remove("bump");void el.offsetWidth;el.classList.add("bump");}

  function draw(){
    pok.textContent=ok+(ok===1?" sabida":" sabidas");
    pko.textContent=ko+" repasar";
    var done=N-order.length;
    fill.style.width=(N?done/N*100:0)+"%";

    if(!order.length){

      if(!stage.querySelector(".fc-done")){
        var d=document.createElement("div");

          +'<p>'+ok+' de '+N+' a la primera'+(ko?' · '+ko+' necesitaron repaso':'')+'</p>';
        deck.appendChild(d);
      }
      return;
    }
    if(fi>=order.length)fi=0;
    pleft.textContent=order.length+(order.length===1?" queda":" quedan");

    var c=CARDS[order[fi]];
    front.querySelector(".fc-txt").innerHTML='<p class="fc-p">'+c[0]+'</p>';
    var r=FCFMT.render(c[1]);
    backf.querySelector(".fc-txt").innerHTML=r.html;
    backf.classList.toggle("struct",r.struct);
    var hint=backf.querySelector(".fc-hint");
    if(hint)hint.classList.toggle("muted",/fc-cite/.test(r.html));
    var pip=(done+1)+"/"+N;
    Array.prototype.forEach.call(stage.querySelectorAll(".fc-pip"),function(p){p.textContent=pip;});
  }

  function flip(){
    if(busy||!order.length)return;
    back=!back;rot+=180;
    card.style.transform="rotateY("+rot+"deg)";
    card.setAttribute("aria-label",back?"Respuesta. Pulsa para volver":"Pregunta. Pulsa para girar");
    lift.classList.remove("lift");void lift.offsetWidth;lift.classList.add("lift");
  }

  function next(good){
    if(busy||!order.length)return;
    busy=true;
    if(good){ok++;bump(pok);}else{ko++;bump(pko);}
    lift.classList.remove("lift");
    lift.classList.add(good?"out-ok":"out-ko");
    setTimeout(function(){
      if(good){order.splice(fi,1);}
      else{var m=order.splice(fi,1)[0];order.push(m);}
      back=false;rot=0;
      card.style.transition="none";card.style.transform="rotateY(0deg)";
      void card.offsetWidth;card.style.transition="";
      draw();
      lift.classList.remove("out-ok","out-ko");
      lift.classList.add("in");
      setTimeout(function(){lift.classList.remove("in");busy=false;},480);
    },460);
  }

  card.onclick=flip;
  card.onkeydown=function(e){
    if(e.key===" "||e.key==="Enter"){e.preventDefault();flip();}
    if(e.key==="ArrowRight"){e.preventDefault();next(true);}
    if(e.key==="ArrowLeft"){e.preventDefault();next(false);}
  };
  ctr.querySelector("#fcflip").onclick=flip;
  ctr.querySelector("#fcok").onclick=function(){next(true);};
  ctr.querySelector("#fcko").onclick=function(){next(false);};
  ctr.querySelector("#fcreset").onclick=reset;

  /* Deslizar en táctil */
  var x0=null,y0=null;
  card.addEventListener("touchstart",function(e){x0=e.touches[0].clientX;y0=e.touches[0].clientY;},{passive:true});
  card.addEventListener("touchend",function(e){
    if(x0===null)return;
    var dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0;

    else if(e.key==="ArrowLeft"){e.preventDefault();next(false);}
  });

  reset();
  return true;
}
if(!boot()){
  var tries=0;
  var iv=setInterval(function(){if(boot()||++tries>40)clearInterval(iv);},120);
  addEventListener("load",function(){setTimeout(boot,100);});
}
})();

/* ═══ Altura adaptativa + índice plegable ═══ */
(function(){

/* ── 1 · Índice lateral plegable ── */
function sidebar(){

  var K="oposi_bII_nav";

  var b=document.createElement("button");

  function apply(hidden,anim){
    if(!anim)lay.style.transition="none";
    lay.classList.toggle("nonav",hidden);

    b.setAttribute("aria-pressed",String(hidden));

  b.onclick=function(){

  document.addEventListener("keydown",function(e){

/* ── 2 · La tarjeta se adapta a su contenido ── */
function autofit(){
  var stage=document.querySelector(".fc-stage");
  if(!stage||stage.dataset.fit)return;
  var deck=stage.querySelector(".fc-deck"),
      front=stage.querySelector(".fc-front"),
      back=stage.querySelector(".fc-back");

  var meas=document.createElement("div");

  stage.appendChild(meas);
  var mFace=meas.querySelector(".fc-face"), mTxt=meas.querySelector(".fc-txt");

  function measure(cls,html){
    mFace.className="fc-face "+cls;
    mTxt.innerHTML=html;
    return mFace.offsetHeight;
  }

  function fit(){
    if(deck.classList.contains("empty")){deck.style.height="230px";return;}
    var fT=front.querySelector(".fc-txt"), bT=back.querySelector(".fc-txt");
    if(!fT||!bT)return;

      measure("fc-back" +(back .classList.contains("struct")?" struct":""),bT.innerHTML),
      230
    );
    deck.style.height=Math.ceil(h+8)+"px";
  }

  /* recalcular cuando cambia la tarjeta, el tamaño de letra o la ventana */
  new MutationObserver(fit).observe(back,{childList:true,subtree:true,attributes:true,attributeFilter:["class"]});
  var t;

    var el=document.getElementById(id);
    if(el)el.addEventListener("click",function(){setTimeout(fit,60);});
  });
  fit();setTimeout(fit,250);
}

addEventListener("load",function(){setTimeout(go,120);});
var n=0,iv=setInterval(function(){go();if(++n>25)clearInterval(iv);},150);
})();

(function(){
"use strict";
if(!("speechSynthesis" in window))return;

var K="oposi_bII_tts";
function load(){try{return JSON.parse(localStorage.getItem(K))||{};}catch(e){return {};}}

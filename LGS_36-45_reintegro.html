 text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">El INTERÉS LEGAL DEL</text><text x=\"363.25\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">DINERO incrementado</text><text x=\"363.25\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">en un 25 POR CIENTO</text><text x=\"363.25\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"363.25\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Salvo que la Ley de</text><text x=\"363.25\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Presupuestos Generales</text><text x=\"363.25\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">del Estado establezca</text><text x=\"363.25\" y=\"180\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">otro diferente</text><text x=\"363.25\" y=\"193\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"363.25\" y=\"206\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 38.2</text><rect x=\"487\" y=\"52\" width=\"219.5\" height=\"190\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"596.75\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--ej)\">FONDOS EUROPEOS</text><text x=\"596.75\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">El destino de los</text><text x=\"596.75\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">reintegros de fondos de</text><text x=\"596.75\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">la Unión Europea tendrá</text><text x=\"596.75\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">el tratamiento que</text><text x=\"596.75\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">determine la normativa</text><text x=\"596.75\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">comunitaria</text><text x=\"596.75\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"596.75\" y=\"180\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 38.3</text><rect x=\"720.5\" y=\"52\" width=\"219.5\" height=\"190\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"830.25\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--exc)\">PROCEDIMIENTO</text><text x=\"830.25\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Los procedimientos para</text><text x=\"830.25\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">la exigencia del reintegro</text><text x=\"830.25\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">tendrán SIEMPRE carácter</text><text x=\"830.25\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">ADMINISTRATIVO</text><text x=\"830.25\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"830.25\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Nunca vía civil</text><text x=\"830.25\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"830.25\" y=\"180\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 38.4</text><rect x=\"20\" y=\"252\" width=\"920\" height=\"34\" rx=\"8\" fill=\"var(--panel)\" stroke=\"var(--line)\"/><text x=\"480\" y=\"272.328\" text-anchor=\"middle\" font-size=\"10.4\" fill=\"currentColor\">Y recuerda el art. 37.1: el interés de demora se cuenta DESDE EL PAGO de la subvención, no desde el acuerdo de reintegro.</text></svg>"}, {"n": 39, "t": "Prescripción", "ubic": "Título II · Del reintegro de subvenciones ▸ Capítulo I · Del reintegro", "idea": "Cuatro años, y el reloj empieza cuando venció el plazo para justificar.", "literal": "<p><b>1.</b> Prescribirá a los cuatro años el derecho de la Administración a reconocer o liquidar el reintegro.</p><p><b>2.</b> Este plazo se computará, en cada caso:</p><p style=\"margin-left:1.1rem\">a) Desde el momento en que venció el plazo para presentar la justificación por parte del beneficiario o entidad colaboradora.</p><p style=\"margin-left:1.1rem\">b) Desde el momento de la concesión, en el supuesto previsto en el apartado 7 del artículo 30.</p><p style=\"margin-left:1.1rem\">c) En el supuesto de que se hubieran establecido condiciones u obligaciones que debieran ser cumplidas o mantenidas por parte del beneficiario o entidad colaboradora durante un período determinado de tiempo, desde el momento en que venció dicho plazo.</p><p><b>3.</b> El cómputo del plazo de prescripción se interrumpirá:</p><p style=\"margin-left:1.1rem\">a) Por cualquier acción de la Administración, realizada con conocimiento formal del beneficiario o de la entidad colaboradora, conducente a determinar la existencia de alguna de las causas de reintegro.</p><p style=\"margin-left:1.1rem\">b) Por la interposición de recursos de cualquier clase, por la remisión del tanto de culpa a la jurisdicción penal o por la presentación de denuncia ante el Ministerio Fiscal, así como por las actuaciones realizadas con conocimiento formal del beneficiario o de la entidad colaboradora en el curso de dichos recursos.</p><p style=\"margin-left:1.1rem\">c) Por cualquier actuación fehaciente del beneficiario o de la entidad colaboradora conducente a la liquidación de la subvención o del reintegro.</p>", "dis": "<ul>\n<li><b>Plazo de <span class=\"t\" data-k=\"prescrip\">prescripción</span> (39.1):</b> «Prescribirá a los <b>cuatro años</b> el derecho de la Administración a <b>reconocer o liquidar</b> el reintegro».</li>\n<li><b>Cómputo (39.2):</b>\n <ul><li><b>a)</b> desde el momento en que <b>venció el plazo para presentar la justificación</b> por el beneficiario o entidad colaboradora;</li>\n <li><b>b)</b> desde el momento de la <b>concesión</b>, en el supuesto del art. <b>30.7</b>;</li>\n <li><b>c)</b> si se establecieron <b>condiciones u obligaciones que debieran mantenerse durante un período</b>, desde el momento en que venció ese plazo.</li></ul></li>\n<li><b>Interrupción (39.3):</b>\n <ul><li><b>a)</b> cualquier <b>acción de la Administración</b>, con <b>conocimiento formal</b> del beneficiario, conducente a determinar la existencia de alguna causa de reintegro;</li>\n <li><b>b)</b> la <b>interposición de recursos</b> de cualquier clase, la remisión del tanto de culpa a la jurisdicción penal, la denuncia ante el <b>Ministerio Fiscal</b> y las actuaciones realizadas en el curso de dichos recursos con conocimiento formal del beneficiario;</li>\n <li><b>c)</b> cualquier <b>actuación fehaciente del beneficiario</b> conducente a la liquidación de la subvención o del reintegro.</li></ul></li>\n</ul>", "llano": "<p>La Administración tiene cuatro años para reclamar. Y ese plazo no empieza el día en que se concedió la subvención: empieza, como regla, el día en que <b>venció el plazo para justificarla</b>.</p>\n<p>Cualquier actuación seria —una notificación de la Administración, un recurso, un pago parcial del beneficiario— pone el contador a cero.</p>", "porque": "<p>Porque hasta que no vence el plazo de justificación no se sabe si hay incumplimiento: exigir a la Administración que actúe antes sería absurdo. La prescripción empieza cuando <b>nace la posibilidad de actuar</b>.</p>\n<p>Y la interrupción con «conocimiento formal» del beneficiario protege a este: una actuación interna del expediente, que él no conoce, no puede reabrirle un plazo que creía cerrado.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> la garantía de un electrodoméstico no cuenta desde que se fabricó, sino desde que lo compraste.</li>\n<li><b>Real:</b> subvención de 12.000 € concedida el 3 de marzo de 2021, con plazo de justificación hasta el <b>31 de enero de 2022</b>. El beneficiario no justifica. Los cuatro años se cuentan desde el <b>1 de febrero de 2022</b>: la Administración puede reconocer el reintegro hasta el <b>1 de febrero de 2026</b>.</li>\n<li><b>Caso límite:</b> el 12 de septiembre de 2024 la diputación notifica formalmente el inicio de actuaciones de comprobación. El plazo <b>se interrumpe</b> y vuelve a contar de cero: cuatro años más desde esa fecha.</li>\n</ul>", "noej": "<ul>\n<li><b>No se cuenta</b> desde la concesión como regla general: solo en el supuesto del art. 30.7.</li>\n<li><b>No interrumpe</b> la prescripción una actuación interna de la que el beneficiario no tenga <b>conocimiento formal</b>.</li>\n<li><b>No es caducidad</b>: la caducidad es del <b>procedimiento</b> de reintegro a los doce meses (art. 42.4); esto es la prescripción del <b>derecho</b>.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 30:</b> justificación de la subvención, y su apartado 7 para la letra b) del cómputo.</li>\n<li><b>Art. 37:</b> causas de reintegro cuya existencia se trata de determinar.</li>\n<li><b>Art. 42.4:</b> caducidad del procedimiento a los doce meses, sin que se considere interrumpida la prescripción.</li>\n<li><b>Art. 65 y ss.:</b> prescripción de infracciones y sanciones, con plazos distintos.</li>\n</ul>", "trampas": "<ul>\n<li><b>Cuatro años</b> y el <i>dies a quo</i> es el <b>vencimiento del plazo de justificación</b>.</li>\n<li>El art. 42.4 avisa: si el procedimiento caduca, <b>no</b> se considera interrumpida la prescripción por las actuaciones realizadas hasta ese momento. Es decir, la caducidad hace perder también el efecto interruptivo.</li>\n<li>Prescribe el derecho a <b>reconocer o liquidar</b>: la prescripción del derecho a <b>cobrar</b> lo ya liquidado se rige por la normativa presupuestaria.</li>\n</ul>", "ancla": "<p><b>«Cuatro años desde que debiste justificar.»</b></p>\n<p>Y las tres interrupciones: <b>la Administración te avisa · alguien recurre · tú pagas o liquidas</b>.</p>", "vis": "<svg viewBox=\"0 0 960 386\" role=\"img\" aria-label=\"Plazo de prescripción del derecho a exigir el reintegro y sus causas de interrupción\" style=\"width:100%;height:auto\"><defs><marker id=\"fl4\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr4\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe4\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw4\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"250\" y=\"8\" width=\"460\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"27.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">PRESCRIPCIÓN DEL REINTEGRO · ART. 39</text><rect x=\"20\" y=\"52\" width=\"297.333\" height=\"280\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"168.667\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--acc)\">EL PLAZO</text><text x=\"168.667\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">CUATRO AÑOS</text><text x=\"168.667\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"168.667\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">el derecho de la</text><text x=\"168.667\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Administración a</text><text x=\"168.667\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">RECONOCER O LIQUIDAR</text><text x=\"168.667\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">el reintegro</text><text x=\"168.667\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"168.667\" y=\"180\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 39.1</text><rect x=\"331.333\" y=\"52\" width=\"297.333\" height=\"280\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"480\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--warn)\">¿DESDE CUÁNDO?</text><text x=\"480\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">a) Desde que venció el</text><text x=\"480\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">plazo para presentar la</text><text x=\"480\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">JUSTIFICACIÓN</text><text x=\"480\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"480\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">b) Desde la CONCESIÓN,</text><text x=\"480\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">en el supuesto del</text><text x=\"480\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 30.7</text><text x=\"480\" y=\"180\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"480\" y=\"193\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">c) Si había condiciones</text><text x=\"480\" y=\"206\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">que mantener, desde que</text><text x=\"480\" y=\"219\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">venció ese deber</text><text x=\"480\" y=\"232\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"480\" y=\"245\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 39.2</text><rect x=\"642.667\" y=\"52\" width=\"297.333\" height=\"280\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"791.333\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--ej)\">SE INTERRUMPE</text><text x=\"791.333\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">a) Por actuación de la</text><text x=\"791.333\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Administración con</text><text x=\"791.333\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">conocimiento formal del</text><text x=\"791.333\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">beneficiario, conducente</text><text x=\"791.333\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">a determinar, asegurar,</text><text x=\"791.333\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">comprobar, liquidar o</text><text x=\"791.333\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">exigir el reintegro</text><text x=\"791.333\" y=\"180\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"791.333\" y=\"193\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">b) Por interposición de</text><text x=\"791.333\" y=\"206\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">recursos, remisión al</text><text x=\"791.333\" y=\"219\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Ministerio Fiscal o</text><text x=\"791.333\" y=\"232\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">actuaciones judiciales</text><text x=\"791.333\" y=\"245\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"791.333\" y=\"258\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">c) Por actuación del</text><text x=\"791.333\" y=\"271\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">beneficiario conducente</text><text x=\"791.333\" y=\"284\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">al pago o reintegro</text><rect x=\"20\" y=\"342\" width=\"920\" height=\"34\" rx=\"8\" fill=\"var(--panel)\" stroke=\"var(--line)\"/><text x=\"480\" y=\"362.328\" text-anchor=\"middle\" font-size=\"10.4\" fill=\"currentColor\">La trampa: la regla general NO es «desde la concesión», sino «desde que venció el plazo para justificar».</text></svg>"}, {"n": 40, "t": "Obligados al reintegro", "ubic": "Título II · Del reintegro de subvenciones ▸ Capítulo I · Del reintegro", "idea": "Responden el beneficiario y la entidad colaboradora; solidariamente los miembros y cotitulares; subsidiariamente los administradores.", "literal": "<p><b>1.</b> Los beneficiarios y entidades colaboradoras, en los casos contemplados en el artículo 37 de esta ley, deberán reintegrar la totalidad o parte de las cantidades percibidas más los correspondientes intereses de demora, sin perjuicio de lo dispuesto en el párrafo b) del apartado 5 del artículo 31 de esta ley en el ámbito estatal. Esta obligación será independiente de las sanciones que, en su caso, resulten exigibles.</p><p><b>2.</b> Los miembros de las personas y entidades contempladas en el apartado 2 y en el segundo párrafo del apartado 3 del artículo 11 de esta ley responderán solidariamente de la obligación de reintegro del beneficiario en relación a las actividades subvencionadas que se hubieran comprometido a efectuar. Responderán solidariamente de la obligación de reintegro los representantes legales del beneficiario cuando éste careciera de capacidad de obrar. Responderán solidariamente los miembros, partícipes o cotitulares de las entidades a que se refiere el apartado 3 del artículo 11 en proporción a sus respectivas participaciones, cuando se trate de comunidades de bienes o cualquier otro tipo de unidad económica o patrimonio separado.</p><p><b>3.</b> Responderán subsidiariamente de la obligación de reintegro los administradores de las sociedades mercantiles, o aquellos que ostenten la representación legal de otras personas jurídicas, que no realizasen los actos necesarios que fueran de su incumbencia para el cumplimiento de las obligaciones infringidas, adoptasen acuerdos que hicieran posibles los incumplimientos o consintieran el de quienes de ellos dependan. Asimismo, los que ostenten la representación legal de las personas jurídicas, de acuerdo con las disposiciones legales o estatutarias que les resulten de aplicación, que hayan cesado en sus actividades responderán subsidiariamente en todo caso de las obligaciones de reintegro de éstas.</p><p><b>4.</b> En el caso de sociedades o entidades disueltas y liquidadas, sus obligaciones de reintegro pendientes se transmitirán a los socios o partícipes en el capital que responderán de ellas solidariamente y hasta el límite del valor de la cuota de liquidación que se les hubiera adjudicado.</p><p><b>5.</b> En caso de fallecimiento del obligado al reintegro, la obligación de satisfacer las cantidades pendientes de restitución se transmitirá a sus causahabientes, sin perjuicio de lo que establezca el derecho civil común, foral o especial aplicable a la sucesión para determinados supuestos, en particular para el caso de aceptación de la herencia a beneficio de inventario.</p>", "dis": "<ul>\n<li><b>Obligados principales (40.1):</b> los <span class=\"t\" data-k=\"beneficiario\">beneficiarios</span> y las <span class=\"t\" data-k=\"colaboradora\">entidades colaboradoras</span> deberán reintegrar la totalidad o parte de lo percibido más los intereses de demora. «Esta obligación será <b>independiente de las sanciones</b> que, en su caso, resulten exigibles».</li>\n<li><b>Responsables <span class=\"t\" data-k=\"solidaria\">solidarios</span> (40.2):</b>\n <ul><li>los <b>miembros</b> de las agrupaciones y entidades del art. 11.2 y 11.3, en relación con las actividades subvencionadas que se hubieran comprometido a efectuar;</li>\n <li>los <b>representantes legales</b> del beneficiario cuando este careciera de capacidad de obrar;</li>\n <li>los <b>miembros, partícipes o cotitulares</b> de comunidades de bienes u otras unidades económicas o patrimonios separados, <b>en proporción a sus respectivas participaciones</b>.</li></ul></li>\n<li><b>Responsables <span class=\"t\" data-k=\"subsidiaria\">subsidiarios</span> (40.3):</b> los <b>administradores de sociedades mercantiles</b> o representantes legales de otras personas jurídicas que <b>no realizasen los actos necesarios</b> de su incumbencia, <b>adoptasen acuerdos</b> que hicieran posibles los incumplimientos o <b>consintieran</b> el de quienes de ellos dependan. Y, <b>en todo caso</b>, los representantes legales de personas jurídicas que hayan <b>cesado en sus actividades</b>.</li>\n<li><b>Sociedades disueltas (40.4):</b> sus obligaciones de reintegro pendientes se transmiten a socios o partícipes, que responden solidariamente hasta el límite del valor de la cuota de liquidación que les corresponda.</li>\n</ul>", "llano": "<p>Quien devuelve es, en principio, el que cobró: el beneficiario o la entidad colaboradora. Pero si es una agrupación, responden también sus miembros; si es una comunidad de bienes, sus cotitulares en proporción a su parte; y si es una sociedad cuyos administradores dejaron que se incumpliera, responden ellos de forma subsidiaria.</p>", "porque": "<p>Porque sin esta extensión, bastaría con constituir una asociación efímera, cobrar la subvención, no justificarla y disolverla. La responsabilidad solidaria y subsidiaria persigue el dinero <b>más allá de la persona jurídica</b>, exactamente igual que hace la normativa tributaria con las deudas de las sociedades.</p>\n<p>Y la independencia respecto de las sanciones evita el argumento de que devolver ya es castigo suficiente: son cosas distintas.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> el avalista de un préstamo: si el titular no paga, paga él.</li>\n<li><b>Real:</b> tres asociaciones se agrupan para un programa cultural y reciben 45.000 €. Una de ellas no ejecuta su parte. Sus miembros responden <b>solidariamente</b> del reintegro <b>en relación con las actividades que se comprometieron a efectuar</b> (art. 40.2), no de todo el importe.</li>\n<li><b>Caso límite:</b> una sociedad mercantil beneficiaria cesa en su actividad sin justificar. Sus representantes legales responden <b>subsidiariamente en todo caso</b> (art. 40.3, párrafo segundo), sin necesidad de probar que adoptaron acuerdos concretos.</li>\n</ul>", "noej": "<ul>\n<li><b>No responden solidariamente</b> los administradores de una sociedad mercantil: su responsabilidad es <b>subsidiaria</b>.</li>\n<li><b>No responden</b> los miembros de una agrupación por la totalidad, sino por las actividades que se comprometieron a efectuar.</li>\n<li><b>No sustituye</b> el reintegro a la sanción: son obligaciones independientes.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 11:</b> beneficiarios, agrupaciones y entidades sin personalidad, a los que remite el 40.2.</li>\n<li><b>Art. 37:</b> causas de reintegro.</li>\n<li><b>Art. 41:</b> órgano competente para exigirlo.</li>\n<li><b>Arts. 52 a 69:</b> infracciones y sanciones, independientes del reintegro.</li>\n</ul>", "trampas": "<ul>\n<li><b>Solidaria</b> para miembros, representantes de incapaces y cotitulares. <b>Subsidiaria</b> para administradores. Es la distinción que se pregunta.</li>\n<li>Los cotitulares responden <b>en proporción a sus participaciones</b>.</li>\n<li>Los representantes de personas jurídicas que <b>cesaron</b> responden subsidiariamente <b>en todo caso</b>.</li>\n</ul>", "ancla": "<p><b>«Solidarios los de dentro; subsidiarios los que mandaban.»</b></p>", "vis": "<svg viewBox=\"0 0 960 357\" role=\"img\" aria-label=\"Obligados al reintegro y responsables solidarios y subsidiarios\" style=\"width:100%;height:auto\"><defs><marker id=\"fl5\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr5\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe5\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw5\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"250\" y=\"8\" width=\"460\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"27.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">QUIÉN RESPONDE DEL REINTEGRO · ART. 40</text><rect x=\"20\" y=\"52\" width=\"297.333\" height=\"295\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"168.667\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--acc)\">OBLIGADOS PRINCIPALES</text><text x=\"168.667\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Los BENEFICIARIOS y las</text><text x=\"168.667\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">ENTIDADES COLABORADORAS</text><text x=\"168.667\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"168.667\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Devuelven la totalidad o</text><text x=\"168.667\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">parte de lo percibido más</text><text x=\"168.667\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">los intereses de demora</text><text x=\"168.667\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"168.667\" y=\"180\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Obligación INDEPENDIENTE</text><text x=\"168.667\" y=\"193\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">de las sanciones</text><text x=\"168.667\" y=\"206\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"168.667\" y=\"219\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 40.1</text><rect x=\"331.333\" y=\"52\" width=\"297.333\" height=\"295\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"480\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--warn)\">RESPONSABLES\nSOLIDARIOS</text><text x=\"480\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Los miembros de las</text><text x=\"480\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">agrupaciones y entidades</text><text x=\"480\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">sin personalidad, por las</text><text x=\"480\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">actividades que se</text><text x=\"480\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">comprometieron a hacer</text><text x=\"480\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"480\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Los representantes legales</text><text x=\"480\" y=\"180\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">del beneficiario sin</text><text x=\"480\" y=\"193\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">capacidad de obrar</text><text x=\"480\" y=\"206\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"480\" y=\"219\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Los cotitulares de</text><text x=\"480\" y=\"232\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">comunidades de bienes,</text><text x=\"480\" y=\"245\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">en proporción a su parte</text><text x=\"480\" y=\"258\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"480\" y=\"271\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 40.2</text><rect x=\"642.667\" y=\"52\" width=\"297.333\" height=\"295\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"791.333\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--exc)\">RESPONSABLES\nSUBSIDIARIOS</text><text x=\"791.333\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Los administradores de</text><text x=\"791.333\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">sociedades mercantiles y</text><text x=\"791.333\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">representantes legales de</text><text x=\"791.333\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">otras personas jurídicas</text><text x=\"791.333\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">que no hicieran lo que les</text><text x=\"791.333\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">incumbía, adoptaran</text><text x=\"791.333\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">acuerdos que hicieran</text><text x=\"791.333\" y=\"180\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">posible el incumplimiento</text><text x=\"791.333\" y=\"193\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">o consintieran el de sus</text><text x=\"791.333\" y=\"206\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">dependientes</text><text x=\"791.333\" y=\"219\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"791.333\" y=\"232\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Y los representantes de</text><text x=\"791.333\" y=\"245\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">personas jurídicas que</text><text x=\"791.333\" y=\"258\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">hayan cesado en su</text><text x=\"791.333\" y=\"271\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">actividad</text><text x=\"791.333\" y=\"284\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"791.333\" y=\"297\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 40.3</text></svg>"}, {"n": 41, "t": "Competencia para la resolución del procedimiento de reintegro", "ubic": "Título II · Del reintegro de subvenciones ▸ Capítulo II · Del procedimiento de reintegro", "idea": "Lo exige el mismo órgano que concedió la subvención.", "literal": "<p><b>1.</b> El órgano concedente será el competente para exigir del beneficiario o entidad colaboradora el reintegro de subvenciones mediante la resolución del procedimiento regulado en este capítulo, cuando aprecie la existencia de alguno de los supuestos de reintegro de cantidades percibidas establecidos en el artículo 37 de esta ley.</p><p><b>2.</b> Si el reintegro es acordado por los órganos de la Unión Europea, el órgano a quien corresponda la gestión del recurso ejecutará dichos acuerdos.</p><p><b>3.</b> Cuando la subvención haya sido concedida por la Comisión Europea u otra institución comunitaria y la obligación de restituir surgiera como consecuencia de la actuación fiscalizadora, distinta del control financiero de subvenciones regulado en el título III de esta ley, correspondiente a las instituciones españolas habilitadas legalmente para la realización de estas actuaciones, el acuerdo de reintegro será dictado por el órgano gestor nacional de la subvención. El mencionado acuerdo se dictará de oficio o a propuesta de otras instituciones y órganos de la Administración habilitados legalmente para fiscalizar fondos públicos.</p>", "dis": "<ul>\n<li><b>Regla (41.1):</b> «El <b>órgano concedente</b> será el competente para exigir del beneficiario o entidad colaboradora el reintegro de subvenciones mediante la resolución del procedimiento regulado en este capítulo, cuando aprecie la existencia de alguno de los supuestos de reintegro del artículo 37».</li>\n<li><b>Reintegro acordado por la Unión Europea (41.2):</b> lo ejecuta el órgano a quien corresponda la gestión del recurso.</li>\n<li><b>Subvención concedida por la Comisión (41.3):</b> si la obligación de restituir surge de una actuación fiscalizadora de instituciones españolas distinta del control financiero del título III, el acuerdo de reintegro lo dicta el <b>órgano gestor nacional</b> de la subvención, de oficio o a propuesta de otros órganos habilitados.</li>\n</ul>", "llano": "<p>Quien da, quita. El órgano que concedió la subvención es el que tramita y resuelve el reintegro. No hace falta un órgano especial ni la intervención de otra Administración.</p>", "porque": "<p>Porque el órgano concedente es el que conoce el expediente, las bases, la finalidad y los compromisos. Atribuir el reintegro a un órgano distinto obligaría a reconstruir todo el expediente desde fuera.</p>\n<p>Y hay una lógica de responsabilidad: quien decidió entregar el dinero es quien debe responder de recuperarlo.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> el banco que te concedió el préstamo es el que te lo reclama, no otro banco.</li>\n<li><b>Real:</b> la subvención del programa de refuerzo escolar la concedió la Junta de Gobierno Local por delegación del alcalde. Es la <b>Junta de Gobierno Local</b> quien debe resolver el procedimiento de reintegro.</li>\n<li><b>Caso límite:</b> el incumplimiento lo detecta la Intervención en un control financiero. El informe de control <b>inicia</b> el procedimiento (art. 42.2), pero quien lo <b>resuelve</b> sigue siendo el órgano concedente.</li>\n</ul>", "noej": "<ul>\n<li><b>No resuelve</b> la Intervención, aunque su informe de control financiero pueda iniciar el procedimiento.</li>\n<li><b>No resuelve</b> el Pleno por el hecho de que el importe sea elevado: resuelve el <b>órgano concedente</b>.</li>\n<li><b>No cabe</b> exigir el reintegro sin apreciar previamente alguno de los supuestos del art. 37.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 37:</b> los supuestos que ha de apreciar el órgano concedente.</li>\n<li><b>Art. 42:</b> procedimiento y plazos.</li>\n<li><b>Art. 44:</b> control financiero, cuyo informe puede desencadenar el procedimiento.</li>\n<li><b>Art. 10:</b> órganos competentes para conceder subvenciones.</li>\n</ul>", "trampas": "<ul>\n<li>El órgano competente es el <b>concedente</b>, no el pagador ni el fiscalizador.</li>\n<li>La <b>Intervención</b> no resuelve: informa.</li>\n</ul>", "ancla": "<p><b>«Quien concede, exige.»</b></p>", "vis": "<svg viewBox=\"0 0 960 237\" role=\"img\" aria-label=\"Órganos competentes para exigir el reintegro y coordinación con el control financiero\" style=\"width:100%;height:auto\"><defs><marker id=\"fl6\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr6\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe6\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw6\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"250\" y=\"8\" width=\"460\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"27.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">QUIÉN EXIGE EL REINTEGRO · ARTS. 41 Y 43</text><rect x=\"20\" y=\"52\" width=\"219.5\" height=\"175\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"129.75\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--acc)\">REGLA</text><text x=\"129.75\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">El ÓRGANO CONCEDENTE</text><text x=\"129.75\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"129.75\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Es el competente para</text><text x=\"129.75\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">exigir el reintegro cuando</text><text x=\"129.75\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">aprecie alguno de los</text><text x=\"129.75\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">supuestos del art. 37</text><text x=\"129.75\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"129.75\" y=\"180\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 41.1</text><rect x=\"253.5\" y=\"52\" width=\"219.5\" height=\"175\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"363.25\" y=\"76\" text-anchor=\"middle\" font-size=\"8.5\" font-weight=\"700\" fill=\"var(--warn)\">REINTEGRO ACORDADO\nPOR LA UNIÓN EUROPEA</text><text x=\"363.25\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Lo EJECUTA el órgano a</text><text x=\"363.25\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">quien corresponda la</text><text x=\"363.25\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">gestión del recurso</text><text x=\"363.25\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"363.25\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 41.2</text><rect x=\"487\" y=\"52\" width=\"219.5\" height=\"175\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"596.75\" y=\"76\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--warn)\">SUBVENCIÓN DE LA\nCOMISIÓN EUROPEA</text><text x=\"596.75\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Si la obligación de</text><text x=\"596.75\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">restituir surge de una</text><text x=\"596.75\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">actuación fiscalizadora</text><text x=\"596.75\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">española distinta del</text><text x=\"596.75\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">control financiero,</text><text x=\"596.75\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">el acuerdo lo dicta el</text><text x=\"596.75\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">ÓRGANO GESTOR NACIONAL</text><text x=\"596.75\" y=\"180\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"596.75\" y=\"193\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 41.3</text><rect x=\"720.5\" y=\"52\" width=\"219.5\" height=\"175\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"830.25\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--exc)\">Y OJO</text><text x=\"830.25\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">El pronunciamiento del</text><text x=\"830.25\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">ÓRGANO GESTOR sobre la</text><text x=\"830.25\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">aplicación de los fondos</text><text x=\"830.25\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">se entiende SIN PERJUICIO</text><text x=\"830.25\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">del control financiero de</text><text x=\"830.25\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">la Intervención</text><text x=\"830.25\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"830.25\" y=\"180\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 43</text></svg>"}, {"n": 42, "t": "Procedimiento de reintegro", "ubic": "Título II · Del reintegro de subvenciones ▸ Capítulo II · Del procedimiento de reintegro", "idea": "Siempre de oficio, con audiencia, doce meses para resolver y caducidad si se agota el plazo.", "literal": "<p><b>1.</b> El procedimiento de reintegro de subvenciones se regirá por las disposiciones generales sobre procedimientos administrativos contenidas en el título VI de la Ley 30/1992, de 26 de noviembre, de Régimen Jurídico de las Administraciones Públicas y del Procedimiento Administrativo Común, sin perjuicio de las especialidades que se establecen en esta ley y en sus disposiciones de desarrollo.</p><p><b>2.</b> El procedimiento de reintegro de subvenciones se iniciará de oficio por acuerdo del órgano competente, bien por propia iniciativa, bien como consecuencia de orden superior, a petición razonada de otros órganos o por denuncia. También se iniciará a consecuencia del informe de control financiero emitido por la Intervención General de la Administración del Estado.</p><p><b>3.</b> En la tramitación del procedimiento se garantizará, en todo caso, el derecho del interesado a la audiencia.</p><p><b>4.</b> El plazo máximo para resolver y notificar la resolución del procedimiento de reintegro será de 12 meses desde la fecha del acuerdo de iniciación. Dicho plazo podrá suspenderse y ampliarse de acuerdo con lo previsto en los apartados 5 y 6 del artículo 42 de la Ley 30/1992, de 26 de noviembre, de Régimen Jurídico de las Administraciones Públicas y del Procedimiento Administrativo Común. Si transcurre el plazo para resolver sin que se haya notificado resolución expresa, se producirá la caducidad del procedimiento, sin perjuicio de continuar las actuaciones hasta su terminación y sin que se considere interrumpida la prescripción por las actuaciones realizadas hasta la finalización del citado plazo.</p><p><b>5.</b> La resolución del procedimiento de reintegro pondrá fin a la vía administrativa.</p>", "dis": "<ul>\n<li><b>Régimen (42.1):</b> se rige por las disposiciones generales sobre procedimientos administrativos, con las especialidades de esta ley y sus normas de desarrollo.</li>\n<li><b>Iniciación (42.2):</b> <b>siempre de oficio</b>, por acuerdo del órgano competente: por <b>propia iniciativa</b>, por <b>orden superior</b>, a <b>petición razonada</b> de otros órganos, por <b>denuncia</b> o como consecuencia del <b>informe de control financiero</b>.</li>\n<li><b>Audiencia (42.3):</b> «en la tramitación del procedimiento se garantizará, <b>en todo caso</b>, el derecho del interesado a la <b>audiencia</b>».</li>\n<li><b>Plazo (42.4):</b> el plazo máximo para <b>resolver y notificar</b> es de <b>12 meses</b> desde la fecha del <b>acuerdo de iniciación</b>. Puede suspenderse y ampliarse conforme al procedimiento administrativo común.</li>\n<li><b><span class=\"t\" data-k=\"caducidad\">Caducidad</span> (42.4):</b> si transcurre el plazo sin notificarse resolución expresa se produce la <b>caducidad</b> del procedimiento, «sin perjuicio de continuar las actuaciones hasta su terminación y <b>sin que se considere interrumpida la prescripción</b> por las actuaciones realizadas hasta la finalización del citado plazo».</li>\n<li><b>Efecto (42.5):</b> la resolución <b>pone fin a la vía administrativa</b>.</li>\n</ul>", "llano": "<p>El reintegro nunca lo pide el beneficiario: siempre lo inicia la Administración. Hay que darle audiencia, y hay doce meses para resolver y notificar. Si se pasan, el procedimiento caduca.</p>\n<p>Y ojo con el detalle más dañino: si caduca, <b>tampoco se interrumpió la prescripción</b>. Es decir, esos doce meses no cuentan.</p>", "porque": "<p>Porque un procedimiento que puede terminar exigiendo miles de euros no puede quedar abierto indefinidamente. La caducidad es la garantía del beneficiario frente a la inactividad.</p>\n<p>Y la advertencia sobre la prescripción es la sanción a la Administración descuidada: si deja caducar, no puede alegar que al menos ganó tiempo. Puede volver a iniciar el procedimiento, pero solo si el derecho no ha prescrito contando <b>como si nada hubiera pasado</b>.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> un expediente sancionador de tráfico que caduca: hay que empezar de nuevo, y el plazo para sancionar sigue corriendo como si no se hubiera abierto.</li>\n<li><b>Real:</b> el 12 de septiembre de 2024 se acuerda iniciar el reintegro de 18.000 €. El plazo máximo vence el <b>12 de septiembre de 2025</b>. Si no se notifica resolución antes, el procedimiento <b>caduca</b>.</li>\n<li><b>Caso límite:</b> el plazo de justificación había vencido el 1 de febrero de 2022, así que la prescripción de cuatro años vencía el 1 de febrero de 2026. Si el procedimiento caduca en septiembre de 2025 y no se considera interrumpida la prescripción, la Administración tiene todavía margen —hasta febrero de 2026— para iniciar uno nuevo. Si hubiera caducado en 2026, habría perdido el derecho.</li>\n</ul>", "noej": "<ul>\n<li><b>No se inicia a instancia de parte</b>: el procedimiento es siempre de oficio.</li>\n<li><b>No caduca a los tres meses</b> como los procedimientos de la LPAC sin plazo específico: aquí el plazo es de <b>doce meses</b>.</li>\n<li><b>No agota</b> la caducidad el derecho de la Administración: puede iniciar otro procedimiento si el derecho no ha prescrito.</li>\n<li><b>No cabe</b> prescindir de la audiencia: se garantiza «en todo caso».</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 41:</b> competencia del órgano concedente.</li>\n<li><b>Art. 39:</b> prescripción de cuatro años, que la caducidad no interrumpe.</li>\n<li><b>Art. 44:</b> control financiero, cuyo informe puede iniciar el procedimiento.</li>\n<li><b>Art. 82 LPAC</b> <i>(otra norma de la biblioteca)</i>: trámite de audiencia.</li>\n<li><b>Art. 25.1.b) y 95 LPAC</b> <i>(otra norma de la biblioteca)</i>: caducidad de los procedimientos iniciados de oficio.</li>\n</ul>", "trampas": "<ul>\n<li><b>12 meses</b> desde el <b>acuerdo de iniciación</b>, no desde el incumplimiento ni desde el informe de control.</li>\n<li>La caducidad <b>no interrumpe</b> la prescripción: es la frase que hay que subrayar.</li>\n<li>La resolución <b>pone fin a la vía administrativa</b>: cabe reposición potestativa o contencioso directo.</li>\n</ul>", "ancla": "<p><b>«De oficio, con audiencia, doce meses y, si caduca, como si nada.»</b></p>", "vis": "<svg viewBox=\"0 0 960 454\" role=\"img\" aria-label=\"Competencia, iniciación, plazos y caducidad del procedimiento de reintegro\" style=\"width:100%;height:auto\"><defs><marker id=\"fl7\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr7\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe7\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw7\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"250\" y=\"8\" width=\"460\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"27.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">EL PROCEDIMIENTO DE REINTEGRO · ARTS. 41 Y 42</text><rect x=\"20\" y=\"52\" width=\"920\" height=\"40\" rx=\"10\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"30\" y=\"59\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"120\" y=\"76\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--acc)\">QUIÉN</text><text x=\"224\" y=\"74\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">El ÓRGANO CONCEDENTE es el competente para exigir el reintegro.</text><text x=\"930\" y=\"74\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">41.1</text><path d=\"M480 93 L 480 101\" stroke=\"var(--acc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl7)\"/><rect x=\"20\" y=\"102\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"30\" y=\"116\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"120\" y=\"133\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--acc)\">CÓMO SE INICIA</text><text x=\"224\" y=\"124\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">SIEMPRE DE OFICIO: por propia iniciativa, por orden superior, a petición</text><text x=\"224\" y=\"138\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">razonada de otros órganos, por denuncia o por informe de control financiero.</text><text x=\"930\" y=\"124\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">42.2</text><path d=\"M480 157 L 480 165\" stroke=\"var(--acc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl7)\"/><rect x=\"20\" y=\"166\" width=\"920\" height=\"40\" rx=\"10\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><rect x=\"30\" y=\"173\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--ej)\"/><text x=\"120\" y=\"190\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--ej)\">GARANTÍA</text><text x=\"224\" y=\"188\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Se garantiza en todo caso el derecho del interesado a la AUDIENCIA.</text><text x=\"930\" y=\"188\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">42.3</text><path d=\"M480 207 L 480 215\" stroke=\"var(--ej)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl7)\"/><rect x=\"20\" y=\"216\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"30\" y=\"230\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"120\" y=\"247\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--warn)\">PLAZO · 12 MESES</text><text x=\"224\" y=\"238\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Para resolver y notificar, desde la fecha del acuerdo de iniciación.</text><text x=\"224\" y=\"252\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Suspendible y ampliable conforme al procedimiento administrativo común.</text><text x=\"930\" y=\"238\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">42.4</text><path d=\"M480 271 L 480 279\" stroke=\"var(--warn)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl7)\"/><rect x=\"20\" y=\"280\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><rect x=\"30\" y=\"294\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--exc)\"/><text x=\"120\" y=\"311\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--exc)\">SI SE PASA EL PLAZO</text><text x=\"224\" y=\"302\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">CADUCIDAD del procedimiento, sin que se considere interrumpida la</text><text x=\"224\" y=\"316\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">prescripción por las actuaciones realizadas hasta ese momento.</text><text x=\"930\" y=\"302\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">42.4</text><path d=\"M480 335 L 480 343\" stroke=\"var(--exc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl7)\"/><rect x=\"20\" y=\"344\" width=\"920\" height=\"40\" rx=\"10\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><rect x=\"30\" y=\"351\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--ej)\"/><text x=\"120\" y=\"368\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--ej)\">EFECTO DE LA RESOLUCIÓN</text><text x=\"224\" y=\"366\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">PONE FIN A LA VÍA ADMINISTRATIVA.</text><text x=\"930\" y=\"366\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">42.5</text><rect x=\"20\" y=\"394\" width=\"920\" height=\"48\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"480\" y=\"414.828\" text-anchor=\"middle\" font-size=\"10.4\" fill=\"currentColor\">Las cantidades a reintegrar son INGRESOS DE DERECHO PÚBLICO y el procedimiento tiene SIEMPRE carácter administrativo (art. 38.1 y 38.4).</text><text x=\"480\" y=\"427.828\" text-anchor=\"middle\" font-size=\"10.4\" fill=\"currentColor\">Interés de demora: el interés legal del dinero incrementado en un 25 %, salvo que la Ley de Presupuestos establezca otro (art. 38.2).</text></svg>"}, {"n": 43, "t": "Coordinación de actuaciones", "ubic": "Título II · Del reintegro de subvenciones ▸ Capítulo II · Del procedimiento de reintegro", "idea": "Lo que diga el órgano gestor no cierra la puerta al control financiero de la Intervención.", "literal": "<p>El pronunciamiento del órgano gestor respecto a la aplicación de los fondos por los perceptores de subvenciones se entenderá sin perjuicio de las actuaciones de control financiero que competen a la Intervención General de la Administración del Estado.</p>", "dis": "<ul>\n<li><b>Regla única:</b> «El <b>pronunciamiento del órgano gestor</b> respecto a la aplicación de los fondos por los perceptores de subvenciones se entenderá <b>sin perjuicio</b> de las <span class=\"t\" data-k=\"controlfin\">actuaciones de control financiero</span> que competen a la Intervención General de la Administración del Estado».</li>\n<li><b>Consecuencia:</b> la conformidad del órgano gestor con la justificación presentada <b>no impide</b> que un control financiero posterior detecte irregularidades y desemboque en un reintegro.</li>\n</ul>", "llano": "<p>Que el departamento que gestiona la subvención dé por buena la justificación no significa que el asunto esté cerrado. La Intervención puede revisarlo después por su cuenta, y si encuentra algo, se exige el reintegro igual.</p>", "porque": "<p>Porque el órgano gestor comprueba <b>documentalmente</b> y sobre la marcha; el control financiero se hace <b>después</b>, con técnicas de auditoría y acceso a la contabilidad del beneficiario. Son controles de naturaleza distinta y con alcances distintos.</p>\n<p>Si el visto bueno del gestor blindara al beneficiario, el control financiero sería inútil: bastaría con superar la primera comprobación.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> que Hacienda te devuelva la declaración no significa que no pueda revisarte después.</li>\n<li><b>Real:</b> el servicio de Cultura da por justificada una subvención de 18.000 € en marzo de 2024. En noviembre, un control financiero detecta que dos facturas por 5.400 € correspondían a otra actividad. Procede el reintegro de esa cantidad más intereses, pese al pronunciamiento favorable anterior.</li>\n<li><b>Caso límite:</b> el beneficiario alega confianza legítima por el visto bueno del gestor. El art. 43 lo desactiva expresamente: ese pronunciamiento se entiende «sin perjuicio» del control financiero.</li>\n</ul>", "noej": "<ul>\n<li><b>No es cosa juzgada</b> la conformidad del órgano gestor.</li>\n<li><b>No sustituye</b> el control financiero a la comprobación del gestor: son acumulativos.</li>\n<li><b>No impide</b> el control financiero posterior que el expediente esté archivado.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 32:</b> comprobación de subvenciones por el órgano concedente.</li>\n<li><b>Art. 44:</b> objeto y competencia del control financiero.</li>\n<li><b>Art. 37.1.e):</b> obstruir el control financiero es causa de reintegro.</li>\n<li><b>Arts. 214 a 220 TRLHL</b> <i>(otra norma de la biblioteca)</i>: la función interventora y el control financiero en las entidades locales.</li>\n</ul>", "trampas": "<ul>\n<li>«<b>Sin perjuicio</b>» es la clave: ni excluye ni sustituye.</li>\n<li>Es un artículo de una sola frase y por eso se pregunta: se olvida con facilidad.</li>\n</ul>", "ancla": "<p><b>«El visto bueno del gestor no es un salvoconducto.»</b></p>", "vis": "<svg viewBox=\"0 0 960 237\" role=\"img\" aria-label=\"Órganos competentes para exigir el reintegro y coordinación con el control financiero\" style=\"width:100%;height:auto\"><defs><marker id=\"fl8\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr8\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe8\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw8\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"250\" y=\"8\" width=\"460\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"27.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">QUIÉN EXIGE EL REINTEGRO · ARTS. 41 Y 43</text><rect x=\"20\" y=\"52\" width=\"219.5\" height=\"175\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"129.75\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--acc)\">REGLA</text><text x=\"129.75\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">El ÓRGANO CONCEDENTE</text><text x=\"129.75\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"129.75\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Es el competente para</text><text x=\"129.75\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">exigir el reintegro cuando</text><text x=\"129.75\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">aprecie alguno de los</text><text x=\"129.75\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">supuestos del art. 37</text><text x=\"129.75\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"129.75\" y=\"180\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 41.1</text><rect x=\"253.5\" y=\"52\" width=\"219.5\" height=\"175\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"363.25\" y=\"76\" text-anchor=\"middle\" font-size=\"8.5\" font-weight=\"700\" fill=\"var(--warn)\">REINTEGRO ACORDADO\nPOR LA UNIÓN EUROPEA</text><text x=\"363.25\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Lo EJECUTA el órgano a</text><text x=\"363.25\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">quien corresponda la</text><text x=\"363.25\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">gestión del recurso</text><text x=\"363.25\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"363.25\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 41.2</text><rect x=\"487\" y=\"52\" width=\"219.5\" height=\"175\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"596.75\" y=\"76\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--warn)\">SUBVENCIÓN DE LA\nCOMISIÓN EUROPEA</text><text x=\"596.75\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Si la obligación de</text><text x=\"596.75\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">restituir surge de una</text><text x=\"596.75\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">actuación fiscalizadora</text><text x=\"596.75\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">española distinta del</text><text x=\"596.75\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">control financiero,</text><text x=\"596.75\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">el acuerdo lo dicta el</text><text x=\"596.75\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">ÓRGANO GESTOR NACIONAL</text><text x=\"596.75\" y=\"180\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"596.75\" y=\"193\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 41.3</text><rect x=\"720.5\" y=\"52\" width=\"219.5\" height=\"175\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"830.25\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--exc)\">Y OJO</text><text x=\"830.25\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">El pronunciamiento del</text><text x=\"830.25\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">ÓRGANO GESTOR sobre la</text><text x=\"830.25\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">aplicación de los fondos</text><text x=\"830.25\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">se entiende SIN PERJUICIO</text><text x=\"830.25\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">del control financiero de</text><text x=\"830.25\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">la Intervención</text><text x=\"830.25\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"830.25\" y=\"180\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 43</text></svg>"}, {"n": 44, "t": "Objeto y competencia para el ejercicio del control financiero de subvenciones", "ubic": "Título III · Del control financiero de subvenciones ▸ Capítulo I · Disposiciones generales", "idea": "Seis cosas que se verifican, cuatro formas de hacerlo y una competencia: la Intervención.", "literal": "<p><b>1.</b> El control financiero de subvenciones se ejercerá respecto de beneficiarios y, en su caso, entidades colaboradoras por razón de las subvenciones de la Administración General del Estado y organismos y entidades vinculados o dependientes de aquélla, otorgadas con cargo a los Presupuestos Generales del Estado o a los fondos de la Unión Europea.</p><p><b>2.</b> El control financiero de subvenciones tendrá como objeto verificar:</p><p style=\"margin-left:1.1rem\">a) La adecuada y correcta obtención de la subvención por parte del beneficiario.</p><p style=\"margin-left:1.1rem\">b) El cumplimiento por parte de beneficiarios y entidades colaboradoras de sus obligaciones en la gestión y aplicación de la subvención.</p><p style=\"margin-left:1.1rem\">c) La adecuada y correcta justificación de la subvención por parte de beneficiarios y entidades colaboradoras.</p><p style=\"margin-left:1.1rem\">d) La realidad y la regularidad de las operaciones que, de acuerdo con la justificación presentada por beneficiarios y entidades colaboradoras, han sido financiadas con la subvención.</p><p style=\"margin-left:1.1rem\">e) La adecuada y correcta financiación de las actividades subvencionadas, en los términos establecidos en el apartado 3 del artículo 19 de este ley.</p><p style=\"margin-left:1.1rem\">f) La existencia de hechos, circunstancias o situaciones no declaradas a la Administración por beneficiarios y entidades colaboradoras y que pudieran afectar a la financiación de las actividades subvencionadas, a la adecuada y correcta obtención, utilización, disfrute o justificación de la subvención, así como a la realidad y regularidad de las operaciones con ella financiadas.</p><p><b>3.</b> La competencia para el ejercicio del control financiero de subvenciones corresponderá a la Intervención General de la Administración del Estado, sin perjuicio de las funciones que la Constitución y las leyes atribuyan al Tribunal de Cuentas y de lo dispuesto en el artículo 6 de esta ley.</p><p><b>4.</b> El control financiero de subvenciones podrá consistir en:</p><p style=\"margin-left:1.1rem\">a) El examen de registros contables, cuentas o estados financieros y la documentación que los soporte, de beneficiarios y entidades colaboradoras.</p><p style=\"margin-left:1.1rem\">b) El examen de operaciones individualizadas y concretas relacionadas o que pudieran afectar a las subvenciones concedidas.</p><p style=\"margin-left:1.1rem\">c) La comprobación de aspectos parciales y concretos de una serie de actos relacionados o que pudieran afectar a las subvenciones concedidas.</p><p style=\"margin-left:1.1rem\">d) La comprobación material de las inversiones financiadas.</p><p style=\"margin-left:1.1rem\">e) Las actuaciones concretas de control que deban realizarse conforme con lo que en cada caso establezca la normativa reguladora de la subvención y, en su caso, la resolución de concesión.</p><p style=\"margin-left:1.1rem\">f) Cualesquiera otras comprobaciones que resulten necesarias en atención a las características especiales de las actividades subvencionadas.</p><p><b>5.</b> El control financiero podrá extenderse a las personas físicas o jurídicas a las que se encuentren asociados los beneficiarios, así como a cualquier otra persona susceptible de presentar un interés en la consecución de los objetivos, en la realización de las actividades, en la ejecución de los proyectos o en la adopción de los comportamientos.</p>", "dis": "<ul>\n<li><b>Ámbito (44.1):</b> se ejerce respecto de <b>beneficiarios</b> y, en su caso, <b>entidades colaboradoras</b>, por razón de las subvenciones de la Administración General del Estado y sus organismos, otorgadas con cargo a los Presupuestos Generales del Estado o a fondos de la Unión Europea.</li>\n<li><b>Objeto (44.2) · seis verificaciones:</b>\n <ul><li><b>a)</b> la adecuada y correcta <b>obtención</b> de la subvención;</li>\n <li><b>b)</b> el <b>cumplimiento de las obligaciones</b> en la gestión y aplicación;</li>\n <li><b>c)</b> la adecuada y correcta <b>justificación</b>;</li>\n <li><b>d)</b> la <b>realidad y regularidad de las operaciones</b> financiadas;</li>\n <li><b>e)</b> la adecuada y correcta <b>financiación</b> de las actividades (art. 19.3);</li>\n <li><b>f)</b> la existencia de <b>hechos, circunstancias o situaciones no declaradas</b> que pudieran afectar a lo anterior.</li></ul></li>\n<li><b>Competencia (44.3):</b> corresponde a la <span class=\"t\" data-k=\"igae\">Intervención General de la Administración del Estado</span>, sin perjuicio de las funciones del <b>Tribunal de Cuentas</b> y de lo dispuesto en el art. 6.</li>\n<li><b>Contenido (44.4):</b> examen de <b>registros contables, cuentas o estados financieros</b> y su documentación; examen de <b>operaciones individualizadas</b>; <b>comprobación material</b> de inversiones financiadas; y cualesquiera otras comprobaciones que resulten necesarias.</li>\n</ul>", "llano": "<p>El control financiero es la auditoría de la subvención. Verifica seis cosas: que se obtuvo bien, que se cumplieron las obligaciones, que se justificó bien, que las operaciones son reales, que la financiación es correcta y que no hay nada escondido.</p>\n<p>Y lo hace la Intervención, no el departamento que concedió la ayuda.</p>", "porque": "<p>Porque el que gestiona no puede ser el único que controla. La comprobación del órgano gestor es <b>documental y de trámite</b>; el control financiero es <b>independiente y con técnicas de auditoría</b>, y puede llegar a la contabilidad del beneficiario y a la comprobación física de las inversiones.</p>\n<p>Es la misma lógica de separación que en la contratación pública separa al órgano de contratación del tribunal de recursos.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> la diferencia entre que el jefe revise tu informe de gastos y que lo audite el departamento financiero con las facturas y los extractos bancarios delante.</li>\n<li><b>Real:</b> un control financiero sobre una subvención de 60.000 € para la compra de maquinaria examina las facturas y los pagos, cruza la contabilidad del beneficiario y realiza una <b>comprobación material</b>: comprueba físicamente que la maquinaria existe y está en las instalaciones subvencionadas (art. 44.4).</li>\n<li><b>Caso límite:</b> el beneficiario se niega a facilitar sus libros contables. Esa negativa es, por sí sola, <b>causa de reintegro</b> por el art. 37.1.e), con independencia de que la actividad se hubiera realizado.</li>\n</ul>", "noej": "<ul>\n<li><b>No lo ejerce</b> el órgano concedente: lo ejerce la Intervención.</li>\n<li><b>No excluye</b> las funciones del <b>Tribunal de Cuentas</b>.</li>\n<li><b>No se limita</b> al examen documental: incluye la <b>comprobación material</b> de las inversiones.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 43:</b> el pronunciamiento del gestor no cierra el control financiero.</li>\n<li><b>Art. 45:</b> control de las ayudas financiadas con fondos europeos.</li>\n<li><b>Art. 37.1.e):</b> obstruir el control es causa de reintegro.</li>\n<li><b>Arts. 14 y 15:</b> obligaciones de beneficiarios y entidades colaboradoras de someterse al control.</li>\n<li><b>Arts. 214 a 220 TRLHL</b> <i>(otra norma de la biblioteca)</i>: función interventora y control financiero en las entidades locales.</li>\n</ul>", "trampas": "<ul>\n<li>Son <b>seis</b> verificaciones —letras a) a f)— y <b>cuatro</b> formas de control.</li>\n<li>La competencia estatal es de la <b>IGAE</b>; en las entidades locales, la función equivalente es de la <b>Intervención</b> por el TRLHL.</li>\n<li>«<b>Sin perjuicio</b> de las funciones del Tribunal de Cuentas»: no hay exclusividad.</li>\n</ul>", "ancla": "<p><b>O-C-J-R-F-N:</b> <b>O</b>btención · <b>C</b>umplimiento · <b>J</b>ustificación · <b>R</b>ealidad de las operaciones · <b>F</b>inanciación · lo <b>N</b>o declarado.</p>", "vis": "<svg viewBox=\"0 0 960 371\" role=\"img\" aria-label=\"Objeto, contenido y competencia del control financiero de subvenciones\" style=\"width:100%;height:auto\"><defs><marker id=\"fl9\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr9\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe9\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw9\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"250\" y=\"8\" width=\"460\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"27.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">EL CONTROL FINANCIERO DE SUBVENCIONES · ARTS. 44 Y 45</text><rect x=\"20\" y=\"52\" width=\"219.5\" height=\"265\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"129.75\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--acc)\">QUÉ VERIFICA</text><text x=\"129.75\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">a) obtención adecuada</text><text x=\"129.75\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">y correcta</text><text x=\"129.75\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">b) cumplimiento de las</text><text x=\"129.75\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">obligaciones</text><text x=\"129.75\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">c) justificación adecuada</text><text x=\"129.75\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">d) realidad y regularidad</text><text x=\"129.75\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">de las operaciones</text><text x=\"129.75\" y=\"180\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">e) financiación correcta</text><text x=\"129.75\" y=\"193\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">de la actividad</text><text x=\"129.75\" y=\"206\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">f) hechos no declarados</text><text x=\"129.75\" y=\"219\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">que puedan afectar</text><text x=\"129.75\" y=\"232\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"129.75\" y=\"245\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 44.2</text><rect x=\"253.5\" y=\"52\" width=\"219.5\" height=\"265\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"363.25\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--ej)\">EN QUÉ CONSISTE</text><text x=\"363.25\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Examen de registros</text><text x=\"363.25\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">contables, cuentas y</text><text x=\"363.25\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">estados financieros</text><text x=\"363.25\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"363.25\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Examen de operaciones</text><text x=\"363.25\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">individualizadas</text><text x=\"363.25\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"363.25\" y=\"180\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Comprobación material</text><text x=\"363.25\" y=\"193\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">de inversiones</text><text x=\"363.25\" y=\"206\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"363.25\" y=\"219\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Y cualesquiera otras</text><text x=\"363.25\" y=\"232\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">comprobaciones</text><text x=\"363.25\" y=\"245\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">pertinentes</text><text x=\"363.25\" y=\"258\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"363.25\" y=\"271\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 44.4</text><rect x=\"487\" y=\"52\" width=\"219.5\" height=\"265\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"596.75\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--warn)\">QUIÉN LO EJERCE</text><text x=\"596.75\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">La INTERVENCIÓN GENERAL</text><text x=\"596.75\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">DE LA ADMINISTRACIÓN</text><text x=\"596.75\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">DEL ESTADO en el ámbito</text><text x=\"596.75\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">estatal</text><text x=\"596.75\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"596.75\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Sin perjuicio de las</text><text x=\"596.75\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">funciones del TRIBUNAL</text><text x=\"596.75\" y=\"180\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">DE CUENTAS</text><text x=\"596.75\" y=\"193\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"596.75\" y=\"206\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 44.3</text><rect x=\"720.5\" y=\"52\" width=\"219.5\" height=\"265\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"830.25\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--exc)\">FONDOS EUROPEOS</text><text x=\"830.25\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Control específico del</text><text x=\"830.25\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 45, con las</text><text x=\"830.25\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">especialidades derivadas</text><text x=\"830.25\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">de la normativa de la</text><text x=\"830.25\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Unión Europea</text><text x=\"830.25\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"830.25\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 45</text><rect x=\"20\" y=\"327\" width=\"920\" height=\"34\" rx=\"8\" fill=\"var(--panel)\" stroke=\"var(--line)\"/><text x=\"480\" y=\"347.328\" text-anchor=\"middle\" font-size=\"10.4\" fill=\"currentColor\">En las entidades locales la función equivalente corresponde a la Intervención, conforme a los arts. 214 a 220 del TRLHL (otra norma de la biblioteca).</text></svg>"}, {"n": 45, "t": "Control de ayudas y subvenciones financiadas total o parcialmente con cargo a fondos europeos", "ubic": "Título III · Del control financiero de subvenciones ▸ Capítulo I · Disposiciones generales", "idea": "Cuando hay dinero europeo, la Intervención coordina los controles con la Comisión.", "literal": "<p><b>1.</b> En las ayudas y subvenciones financiadas total o parcialmente con cargo a fondos europeos, la Intervención General de la Administración del Estado será el órgano competente para establecer, de acuerdo con la normativa europea y nacional vigente, la necesaria coordinación de controles, manteniendo a estos solos efectos las necesarias relaciones con los órganos correspondientes de la Comisión Europea, de los entes territoriales y de la Administración General del Estado.</p><p><b>2.</b> En las ayudas financiadas por el Fondo Europeo Agrícola de Garantía Agraria a que se refiere el capítulo III del título IV del Reglamento (UE) 2021/2116 del Parlamento Europeo y del Consejo, de 2 de diciembre de 2021, sobre la financiación, la gestión y el seguimiento de la política agrícola común y por el que se deroga el Reglamento (UE) n.º 1306/2013, relativo al control de las operaciones, la Intervención General de la Administración del Estado realizará las funciones de coordinación de los controles efectuados en aplicación del mencionado capítulo. Los mencionados controles previstos en el Reglamento (UE) 2021/2116 se realizarán, de acuerdo con sus respectivas competencias, por los siguientes órganos y entidades de ámbito nacional y autonómico:</p><p style=\"margin-left:1.1rem\">a) La Agencia Estatal de Administración Tributaria.</p><p style=\"margin-left:1.1rem\">b) La Intervención General de la Administración del Estado.</p><p style=\"margin-left:1.1rem\">c) Los órganos de control interno de las Administraciones de las comunidades autónomas. Asimismo, la Intervención General de la Administración del Estado:</p><p style=\"margin-left:1.1rem\">a) Elaborará los planes anuales de control en coordinación con los órganos de control de ámbito nacional y autonómico y los remitirá a la Comisión Europea.</p><p style=\"margin-left:1.1rem\">b) Será el órgano encargado de la relación con los servicios correspondientes de la Comisión Europea, centralizará la información relativa a su cumplimiento y elaborará y remitirá a la Comisión Europea el informe anual sobre su aplicación, según lo previsto en el artículo 80 del mencionado Reglamento.</p><p style=\"margin-left:1.1rem\">c) Efectuará los controles previstos en el plan anual cuando razones de orden territorial o de otra índole así lo aconsejen.</p><p><b>3.</b> En las ayudas financiadas por las

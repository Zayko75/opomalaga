<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>LGS · Arts. 36 a 45 · Reintegro y control financiero de subvenciones</title>
<style>

/* ═══════════════════════════════════════════════════════════════
   SISTEMA DE DISEÑO · "Académico Gamificado" · Bloque II
   Temas 8, 9 y 10 · Auxiliar Administrativo
   ═══════════════════════════════════════════════════════════════ */
:root{
  --fs:16px;

  --bg:#faf9f7;
  --bg-grad:radial-gradient(1100px 560px at 12% -8%, #ede9ff 0%, transparent 55%),
            radial-gradient(850px 460px at 96% 0%, #dcf5ee 0%, transparent 50%);
  --surface:#ffffff;
  --surface-2:#f4f3f0;
  --surface-3:#eceae5;
  --line:#e6e3dc;
  --line-strong:#d4d0c7;

  --ink:#15161c;
  --ink-2:#5d616e;
  --ink-3:#8b8f9c;

  --brand:#5b3df5;
  --brand-2:#7c5cff;
  --brand-soft:#efeaff;
  --brand-ring:rgba(91,61,245,.18);

  --legal:#4338ca;  --legal-bg:#eeecff;
  --ej:#059669;     --ej-bg:#e4f7f0;
  --warn:#c2690a;   --warn-bg:#fdf1de;
  --exc:#dc2626;    --exc-bg:#ffeceb;

  --ok:#16a34a; --ok-soft:#e7f7ec;
  --mid:#eab308; --mid-soft:#fdf6dd;
  --off:#a1a1aa; --off-soft:#f1f1f3;

  --sh-1:0 1px 2px rgba(20,20,30,.04), 0 2px 8px rgba(20,20,30,.04);
  --sh-2:0 2px 6px rgba(20,20,30,.05), 0 12px 28px rgba(20,20,30,.07);
  --sh-3:0 8px 20px rgba(91,61,245,.13), 0 24px 56px rgba(20,20,30,.10);
  --sh-glow:0 0 0 4px var(--brand-ring);

  --r-sm:9px; --r-md:14px; --r-lg:20px; --r-full:999px;

  --f-display:"Segoe UI Variable Display",system-ui,-apple-system,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-legal:ui-serif,Georgia,Cambria,"Times New Roman",serif;
  --f-mono:ui-monospace,"SF Mono","Cascadia Mono","Segoe UI Mono",Menlo,monospace;

  --t-h1:clamp(1.02rem,.95rem + .3vw,1.2rem);
  --t-h2:clamp(1.2rem,1.05rem + .6vw,1.55rem);
  --t-h3:clamp(1rem,.95rem + .25vw,1.12rem);
  --t-sm:.86rem;
  --t-xs:.75rem;

  --e-out:cubic-bezier(.22,1,.36,1);
  --e-spring:cubic-bezier(.34,1.56,.64,1);

  /* ── Compatibilidad con SVG y contenido generado ── */
  --panel:var(--surface);
  --ink2:var(--ink-2);
  --acc:var(--brand);
  --acc-soft:var(--brand-soft);
  --g:var(--ok); --y:var(--mid); --r:var(--exc);
}

html[data-theme="dark"]{
  --bg:#0a0b0f;
  --bg-grad:radial-gradient(1100px 560px at 12% -8%, #1c1740 0%, transparent 55%),
            radial-gradient(850px 460px at 96% 0%, #08302b 0%, transparent 50%);
  --surface:#13151b;
  --surface-2:#1a1d25;
  --surface-3:#232733;
  --line:#262a34;
  --line-strong:#343947;

  --ink:#eceef4;
  --ink-2:#9ba2b3;
  --ink-3:#6e7585;

  --brand:#8b6dff;
  --brand-2:#a78bff;
  --brand-soft:#1e1a3d;
  --brand-ring:rgba(139,109,255,.22);

  --legal:#a5b4fc; --legal-bg:#191b3a;
  --ej:#34d399;    --ej-bg:#0c2a24;
  --warn:#fbbf24;  --warn-bg:#2e2110;
  --exc:#fb7185;   --exc-bg:#331119;

  --ok:#4ade80; --ok-soft:#0e2a19;
  --mid:#facc15; --mid-soft:#2c2610;
  --off:#5b6070; --off-soft:#1c1f27;

  --sh-1:0 1px 2px rgba(0,0,0,.3), 0 2px 8px rgba(0,0,0,.25);
  --sh-2:0 2px 6px rgba(0,0,0,.35), 0 12px 28px rgba(0,0,0,.4);
  --sh-3:0 8px 20px rgba(139,109,255,.2), 0 24px 56px rgba(0,0,0,.5);
}

*,*::before,*::after{box-sizing:border-box}
html{font-size:var(--fs);scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);background-image:var(--bg-grad);
  background-attachment:fixed;background-repeat:no-repeat;
  color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.68;
  -webkit-font-smoothing:antialiased;
  transition:background-color .5s var(--e-out),color .3s;
}
::selection{background:var(--brand);color:#fff}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{font-family:var(--f-display);letter-spacing:-.022em;line-height:1.2}
.num{font-variant-numeric:tabular-nums}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:99px;border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3)}

/* ═══ HEADER ═══ */
header.top{
  position:sticky;top:0;z-index:60;
  background:color-mix(in srgb,var(--surface) 80%,transparent);
  backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);
  border-bottom:1px solid var(--line);
}
.top-in{max-width:1280px;margin:0 auto;padding:.65rem 1.1rem;display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.brandwrap{display:flex;align-items:center;gap:.65rem;min-width:0;flex:1}
.mark{
  width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;
  font-weight:800;font-size:.8rem;letter-spacing:-.02em;text-decoration:none;
  box-shadow:0 4px 14px var(--brand-ring);
  transition:transform .3s var(--e-spring),box-shadow .3s;
}
.mark:hover{transform:rotate(-8deg) scale(1.08);box-shadow:var(--sh-3);text-decoration:none}
.top h1{font-size:var(--t-h1);margin:0;font-weight:800;line-height:1.25;min-width:0}
.top h1 .sub{display:block;font-size:var(--t-xs);color:var(--ink-2);font-weight:500;letter-spacing:0;
  margin-top:.1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tools{margin-left:auto;display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}

button,select,input[type=search]{
  font:inherit;font-size:var(--t-sm);font-weight:600;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:var(--r-sm);padding:.4rem .72rem;cursor:pointer;
  position:relative;overflow:hidden;
  transition:transform .18s var(--e-spring),border-color .2s,background .2s,box-shadow .2s,color .2s;
}
button:hover{transform:translateY(-1.5px);border-color:var(--brand);box-shadow:var(--sh-1)}
button:active{transform:translateY(0) scale(.97)}
button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible{outline:none;box-shadow:var(--sh-glow)}
input[type=search]{min-width:190px;cursor:text;font-weight:500}
input[type=search]:focus{border-color:var(--brand)}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--surface-2);padding:2px;gap:2px}
.seg button{border:0;border-radius:calc(var(--r-sm) - 2px);padding:.32rem .68rem;background:transparent;box-shadow:none}
.seg button:hover{transform:none;background:var(--surface)}
.seg button[aria-pressed="true"]{background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;box-shadow:0 2px 8px var(--brand-ring)}

.ripple{position:absolute;border-radius:50%;transform:scale(0);background:currentColor;opacity:.25;animation:rip .55s linear;pointer-events:none}
@keyframes rip{to{transform:scale(3.4);opacity:0}}

.progress{position:absolute;left:0;bottom:-1px;height:2.5px;width:0;
  background:linear-gradient(90deg,var(--brand),var(--legal),var(--ej));transition:width .1s linear}

/* ═══ LAYOUT ═══ */
.layout{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:270px 1fr;gap:1.8rem;padding:1.4rem 1.1rem 5rem}
main{min-width:0}

/* ═══ SIDEBAR ═══ */
nav.side{
  position:sticky;top:76px;align-self:start;max-height:calc(100vh - 96px);overflow:auto;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:.85rem;box-shadow:var(--sh-1);
}
nav.side h2{font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);
  margin:.5rem .4rem .5rem;font-weight:800}
nav.side h2:first-child{margin-top:.1rem}
nav.side a{
  display:flex;align-items:baseline;gap:.5rem;padding:.36rem .55rem;border-radius:var(--r-sm);
  text-decoration:none;color:var(--ink-2);font-size:var(--t-sm);font-weight:500;
  position:relative;transition:background .22s,color .22s,transform .22s var(--e-out);
}
nav.side a:hover{background:var(--surface-2);color:var(--ink);transform:translateX(3px);text-decoration:none}
nav.side a.on{background:var(--brand-soft);color:var(--brand);font-weight:700}
nav.side a.on::before{content:"";position:absolute;left:-.85rem;top:20%;bottom:20%;width:3px;
  border-radius:0 3px 3px 0;background:var(--brand)}
nav.side a b{color:var(--ink-3);font-weight:800;font-size:var(--t-xs);font-variant-numeric:tabular-nums;flex:none;min-width:1.9em}
nav.side a.on b{color:var(--brand)}
.navtoggle{display:none}

/* ═══ TARJETAS ═══ */
section.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:1.35rem 1.5rem;margin-bottom:1.1rem;box-shadow:var(--sh-1);
  transition:box-shadow .3s var(--e-out),border-color .3s;
}
section.card:hover{box-shadow:var(--sh-2)}
section.card>h2{
  margin:0 0 1rem;font-size:var(--t-h2);font-weight:800;
  display:flex;align-items:center;gap:.6rem;
}
section.card>h2::before{
  content:"";width:4px;height:1.05em;border-radius:99px;flex:none;
  background:linear-gradient(180deg,var(--brand),var(--brand-2));
}

/* ═══ ARTÍCULO ═══ */
.art{scroll-margin-top:86px;padding-top:.4rem}
.art + .art{margin-top:1.6rem;padding-top:1.6rem;border-top:1px dashed var(--line)}
.art h2{display:flex;flex-wrap:wrap;gap:.5rem;align-items:baseline;font-size:var(--t-h3);
  margin:0 0 .25rem;font-weight:800;letter-spacing:-.015em}
.art h2 .num{
  color:var(--brand);font-weight:800;font-family:var(--f-display);
  background:var(--brand-soft);padding:.1rem .5rem;border-radius:var(--r-sm);
  font-size:.92em;letter-spacing:-.02em;
}
.ubic{font-size:var(--t-xs);color:var(--ink-3);margin:0 0 .8rem;font-weight:600;
  letter-spacing:.03em;text-transform:uppercase}

/* ═══ IDEA CLAVE ═══ */
.idea{
  background:linear-gradient(100deg,var(--brand-soft),color-mix(in srgb,var(--brand-soft) 40%,transparent));
  border-left:4px solid var(--brand);border-radius:0 var(--r-md) var(--r-md) 0;
  padding:.75rem 1rem;font-weight:650;margin:.7rem 0 1rem;position:relative;
  font-size:.97rem;line-height:1.55;
}

/* ═══ ACORDEÓN ═══ */
details.panel{
  border:1px solid var(--line);border-radius:var(--r-md);margin:.6rem 0;
  background:var(--surface);overflow:hidden;
  transition:border-color .25s,box-shadow .25s,background .25s;
}
details.panel:hover{border-color:var(--line-strong)}
details.panel[open]{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-ring)}
details.panel>summary{
  cursor:pointer;padding:.62rem .9rem;font-weight:700;font-size:.93rem;
  list-style:none;display:flex;align-items:center;gap:.55rem;
  transition:background .2s,color .2s;
}
details.panel>summary:hover{background:var(--surface-2)}
details.panel[open]>summary{background:var(--brand-soft);color:var(--brand)}
details.panel>summary::-webkit-details-marker{display:none}
details.panel>summary::before{
  content:"";width:16px;height:16px;flex:none;border-radius:5px;
  background:var(--brand-soft);position:relative;transition:transform .3s var(--e-spring),background .25s;
}
details.panel>summary::after{
  content:"";position:absolute;width:0;height:0;margin-left:5px;
  border:4px solid transparent;border-left-color:var(--brand);
  transition:transform .3s var(--e-spring);
}
details.panel[open]>summary::before{background:var(--surface)}
details.panel[open]>summary::after{transform:rotate(90deg) translateX(-1px)}
details.panel .body{padding:.3rem 1rem 1rem;font-size:.95rem;animation:slidein .35s var(--e-out)}
@keyframes slidein{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* ═══ TEXTO LEGAL ═══ */
.legal{
  background:var(--legal-bg);border-left:4px solid var(--legal);
  border-radius:0 var(--r-md) var(--r-md) 0;padding:.85rem 1.05rem;
  font-family:var(--f-legal);font-size:.95rem;line-height:1.7;
}
.legal p{margin:.45rem 0}
.legal .lbl{
  font-family:var(--f-body);font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;
  color:var(--legal);font-weight:800;display:block;margin-bottom:.4rem;
}

/* ═══ CAJAS SEMÁNTICAS ═══ */
.box{
  border-left:4px solid var(--line);border-radius:0 var(--r-md) var(--r-md) 0;
  padding:.72rem .95rem;margin:.65rem 0;font-size:.94rem;
  transition:transform .25s var(--e-out),box-shadow .25s;
}
.box:hover{transform:translateX(3px);box-shadow:var(--sh-1)}
.box.ej{background:var(--ej-bg);border-color:var(--ej)}
.box.warn{background:var(--warn-bg);border-color:var(--warn)}
.box.exc{background:var(--exc-bg);border-color:var(--exc)}
.box .lbl{font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;font-weight:800;
  display:block;margin-bottom:.3rem}
.box.ej .lbl{color:var(--ej)}
.box.warn .lbl{color:var(--warn)}
.box.exc .lbl{color:var(--exc)}

.interp{
  border:1px dashed var(--warn);background:color-mix(in srgb,var(--warn-bg) 45%,transparent);
  border-radius:var(--r-md);padding:.65rem .9rem;font-size:.9rem;margin:.6rem 0;
}
.interp .lbl{font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;color:var(--warn);font-weight:800;display:block}

/* ═══ TABLAS ═══ */
table{width:100%;border-collapse:separate;border-spacing:0;font-size:.9rem;margin:.7rem 0;
  border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
th,td{padding:.5rem .68rem;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
td + td, th + th{border-left:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th{background:var(--surface-2);font-size:var(--t-xs);font-weight:800;letter-spacing:.05em;
  text-transform:uppercase;color:var(--ink-2);position:sticky;top:0}
tbody tr{transition:background .18s}
tbody tr:nth-child(even){background:color-mix(in srgb,var(--surface-2) 45%,transparent)}
tbody tr:hover{background:var(--brand-soft)}
th.sortable{cursor:pointer;user-select:none;transition:color .2s,background .2s}
th.sortable:hover{color:var(--brand);background:var(--brand-soft)}
th.sortable::after{content:" ⇅";color:var(--ink-3);font-size:.7rem}

ul,ol{margin:.5rem 0 .5rem 1.2rem;padding:0}
li{margin:.26rem 0}
li::marker{color:var(--brand);font-weight:700}

/* ═══ TOOLTIPS ═══ */
.t{border-bottom:1.5px dotted var(--brand);cursor:help;position:relative;
  transition:background .2s,color .2s}
.t:hover{background:var(--brand-soft);color:var(--brand);border-radius:3px}
#tip{
  position:fixed;z-index:99;max-width:330px;background:var(--ink);color:var(--bg);
  padding:.6rem .78rem;border-radius:var(--r-md);font-size:.82rem;line-height:1.5;
  display:none;box-shadow:0 8px 30px rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.08);
}
html[data-theme="dark"] #tip{background:#f0f1f5;color:#15161c}

/* ═══ FLECHAS DE DIAGRAMA ═══
   Un <path> con stroke pero sin fill toma el valor inicial (negro) y el
   navegador cierra el trazo implícitamente: aparece un triángulo relleno
   entre sus extremos. Forzamos fill:none para dejar solo la línea + la
   punta del <marker>, que sí lleva su color. */
svg path[stroke]:not([fill]){fill:none}
svg polyline:not([fill]){fill:none}
svg line{fill:none}

/* ═══ SVG ═══ */
svg{max-width:100%;height:auto;display:block;margin:.9rem auto}
svg text{font-family:var(--f-body)}

/* ═══ BUSCADOR ═══ */
mark.hit{background:linear-gradient(180deg,transparent 55%,#ffe066 55%);color:inherit;
  border-radius:2px;padding:0 1px;font-weight:600}
html[data-theme="dark"] mark.hit{background:linear-gradient(180deg,transparent 55%,#8a6d00 55%);color:#fff}

/* ═══ UTILIDADES ═══ */
.hide{display:none !important}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.small{font-size:var(--t-sm);color:var(--ink-2)}
.chip{
  display:inline-block;font-size:var(--t-xs);padding:.16rem .55rem;border-radius:var(--r-full);
  background:var(--brand-soft);color:var(--brand);font-weight:800;letter-spacing:.02em;
}

/* ═══ HUECOS RELLENABLES ═══ */
.gap{
  display:inline-block;min-width:5.5em;border-bottom:2px solid var(--brand);
  text-align:center;font-weight:700;color:transparent;cursor:pointer;
  transition:color .3s,background .3s;
}
.gap.on,.gap:hover{color:var(--brand);background:var(--brand-soft);border-radius:4px 4px 0 0}

/* ═══ REVELAR SOLUCIÓN ═══ */
.revelar{
  background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;border-color:transparent;
  font-weight:700;
}
.revelar:hover{box-shadow:var(--sh-3)}
.sol{
  margin-top:.7rem;padding:.8rem 1rem;border-radius:var(--r-md);
  background:var(--ej-bg);border-left:4px solid var(--ej);
  animation:slidein .4s var(--e-out);
}

/* ═══ TEST ═══ */
.opt{
  display:block;padding:.55rem .85rem;margin:.35rem 0;border:1.5px solid var(--line);
  border-radius:var(--r-md);cursor:pointer;background:var(--surface);font-size:.94rem;
  transition:border-color .22s,background .22s,transform .22s var(--e-out);
}
.opt:hover{border-color:var(--brand);background:var(--brand-soft);transform:translateX(4px)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft);font-weight:650}
.opt.ko{border-color:var(--exc);background:var(--exc-bg)}
.opt input{margin-right:.5rem;accent-color:var(--brand)}

#tscore,#semres{
  font-family:var(--f-display);font-weight:800;font-size:1.15rem;letter-spacing:-.02em;
}

/* ═══════════════════════════════════════════════════════════════
   FLASHCARDS 3D · mazo con giro, vuelo de salida y sheen
   ═══════════════════════════════════════════════════════════════ */
#flash{--fc-e:cubic-bezier(.2,.8,.25,1);--fc-h:250px}

/* — Escena — */
.fc-stage{
  perspective:1400px;perspective-origin:50% 45%;
  padding:.4rem 0 .2rem;position:relative;
}
.fc-deck{position:relative;height:var(--fc-h);will-change:transform}

/* — Cartas fantasma del mazo — */
.fc-ghost{
  position:absolute;inset:0;border-radius:var(--r-lg);
  background:var(--surface);border:1px solid var(--line);
  transition:transform .5s var(--fc-e),opacity .5s var(--fc-e);
}
.fc-ghost.g1{transform:translateY(9px) scale(.972);opacity:.75}
.fc-ghost.g2{transform:translateY(18px) scale(.944);opacity:.45}
.fc-deck.empty .fc-ghost{opacity:0;transform:translateY(26px) scale(.9)}

/* — Elevación durante el giro — */
.fc-lift{position:absolute;inset:0;transform-style:preserve-3d}
.fc-lift.lift{animation:fcLift .78s var(--fc-e)}
@keyframes fcLift{
  0%,100%{transform:scale(1) translateY(0)}
  45%{transform:scale(1.055) translateY(-16px)}
}
.fc-lift.out-ok{animation:fcOut .5s cubic-bezier(.5,0,.75,0) forwards}
.fc-lift.out-ko{animation:fcOutKo .5s cubic-bezier(.5,0,.75,0) forwards}
.fc-lift.in{animation:fcIn .48s var(--fc-e)}
@keyframes fcOut{
  0%{transform:translateX(0) rotate(0) scale(1);opacity:1}
  100%{transform:translateX(130%) rotate(17deg) scale(.85);opacity:0}
}
@keyframes fcOutKo{
  0%{transform:translateX(0) rotate(0) scale(1);opacity:1}
  100%{transform:translateX(-130%) rotate(-17deg) scale(.85);opacity:0}
}
@keyframes fcIn{
  0%{transform:translateY(26px) scale(.9);opacity:0}
  100%{transform:translateY(0) scale(1);opacity:1}
}

/* — La carta — */
.fc-card{
  position:absolute;inset:0;transform-style:preserve-3d;
  transition:transform .78s var(--fc-e);
  cursor:pointer;border-radius:var(--r-lg);
}
.fc-card:focus-visible{outline:none}
.fc-card:focus-visible .fc-face{box-shadow:var(--sh-glow),var(--sh-2)}

/* — Caras — */
.fc-face{
  position:absolute;inset:0;border-radius:var(--r-lg);
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  padding:2rem 2.2rem;text-align:center;overflow:hidden;
  box-shadow:var(--sh-2);
  transition:box-shadow .4s var(--fc-e);
}
.fc-card:hover .fc-face{box-shadow:var(--sh-3)}

/* Anverso · pregunta */
.fc-front{
  background:
    radial-gradient(120% 90% at 50% -20%, var(--brand-soft) 0%, transparent 60%),
    var(--surface);
  border:1.5px solid var(--line);color:var(--ink);
}
/* Reverso · respuesta */
.fc-back{
  transform:rotateY(180deg);
  background:linear-gradient(145deg,var(--brand) 0%,#6d4bf7 45%,var(--c5,#0891b2) 130%);
  border:1.5px solid transparent;color:#fff;
}
html[data-theme="dark"] .fc-back{
  background:linear-gradient(145deg,#5f45c9 0%,#4b3aa8 45%,#0e6b85 130%);
}
.fc-back .fc-txt{color:#fff}
.fc-back b,.fc-back strong{color:#fff;font-weight:800}

/* — Sheen que barre al girar — */
.fc-face::after{
  content:"";position:absolute;top:-60%;left:-70%;width:55%;height:220%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.42),transparent);
  transform:rotate(18deg);opacity:0;pointer-events:none;
}
.fc-lift.lift .fc-face::after{animation:fcSheen .78s var(--fc-e)}
@keyframes fcSheen{
  0%{opacity:0;left:-70%}
  35%{opacity:1}
  100%{opacity:0;left:150%}
}

/* — Etiqueta superior — */
.fc-tag{
  position:absolute;top:1rem;left:1.15rem;
  font-size:var(--t-xs);font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  display:inline-flex;align-items:center;gap:.4rem;
}
.fc-front .fc-tag{color:var(--brand)}
.fc-back .fc-tag{color:rgba(255,255,255,.9)}
.fc-tag::before{
  content:"";width:7px;height:7px;border-radius:50%;background:currentColor;
  animation:fcPulse 2.2s ease-in-out infinite;
}
@keyframes fcPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.65)}}

/* — Índice tipo naipe — */
.fc-pip{
  position:absolute;font-family:var(--f-display);font-weight:800;
  font-size:.78rem;letter-spacing:-.02em;opacity:.34;font-variant-numeric:tabular-nums;
}
.fc-pip.tr{top:1rem;right:1.15rem}
.fc-pip.bl{bottom:1rem;left:1.15rem;transform:rotate(180deg)}
.fc-front .fc-pip{color:var(--ink-2)}
.fc-back .fc-pip{color:#fff;opacity:.55}

/* — Texto — */
.fc-txt{
  font-size:clamp(1rem,.9rem + .55vw,1.28rem);font-weight:650;line-height:1.5;
  max-width:44ch;letter-spacing:-.012em;
}
.fc-front .fc-txt{font-family:var(--f-display);font-weight:700}
.fc-back .fc-txt{font-weight:600;line-height:1.6}
.fc-hint{
  position:absolute;bottom:1rem;left:0;right:0;
  font-size:var(--t-xs);font-weight:600;letter-spacing:.02em;
  display:flex;align-items:center;justify-content:center;gap:.4rem;
}
.fc-front .fc-hint{color:var(--ink-3)}
.fc-back .fc-hint{color:rgba(255,255,255,.72)}
.fc-hint .kbd{
  font-family:var(--f-mono);font-size:.68rem;font-weight:700;padding:.1rem .32rem;
  border-radius:5px;border:1px solid currentColor;opacity:.75;
}

/* — Pantalla final — */
.fc-done{
  position:absolute;inset:0;border-radius:var(--r-lg);
  background:linear-gradient(150deg,var(--ok-soft),var(--surface) 70%);
  border:1.5px solid var(--ok);
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  text-align:center;padding:2rem;gap:.35rem;
  animation:fcIn .5s var(--fc-e);box-shadow:var(--sh-2);
}
.fc-done .seal{
  font-size:2.6rem;line-height:1;
  animation:fcSeal .7s cubic-bezier(.2,1.5,.4,1);
}
@keyframes fcSeal{0%{transform:scale(0) rotate(-25deg);opacity:0}60%{transform:scale(1.2) rotate(6deg)}100%{transform:scale(1) rotate(0);opacity:1}}
.fc-done h3{font-size:1.3rem;font-weight:800;margin:.2rem 0 0}
.fc-done p{margin:0;color:var(--ink-2);font-size:var(--t-sm)}

/* — Barra de progreso de la ronda — */
.fc-bar{
  height:6px;border-radius:99px;background:var(--surface-3);
  overflow:hidden;margin:.95rem 0 .8rem;position:relative;
}
.fc-bar i{
  display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--brand),var(--c5,#0891b2));
  transition:width .55s var(--fc-e);
}

/* — Controles — */
.fc-ctrls{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.fc-ctrls button{font-weight:700}
#fcok{border-color:var(--ok);color:var(--ok)}
#fcok:hover{background:var(--ok);color:#fff;border-color:var(--ok)}
#fcko{border-color:var(--warn);color:var(--warn)}
#fcko:hover{background:var(--warn);color:#fff;border-color:var(--warn)}
#fcflip{background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;border-color:transparent}
#fcflip:hover{box-shadow:var(--sh-3)}

.fc-score{display:inline-flex;gap:.45rem;margin-left:auto;align-items:center}
.fc-pill{
  font-size:var(--t-xs);font-weight:800;padding:.24rem .6rem;border-radius:var(--r-full);
  font-variant-numeric:tabular-nums;border:1px solid;
}
.fc-pill.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.fc-pill.ko{color:var(--warn);border-color:var(--warn);background:var(--warn-bg)}
.fc-pill.left{color:var(--ink-2);border-color:var(--line);background:var(--surface-2)}
.fc-pill.bump{animation:fcBump .45s var(--e-spring)}
@keyframes fcBump{0%{transform:scale(1)}45%{transform:scale(1.28)}100%{transform:scale(1)}}

@media(max-width:620px){
  #flash{--fc-h:270px}
  .fc-face{padding:1.7rem 1.3rem}
  .fc-score{margin-left:0;width:100%}
}
@media(prefers-reduced-motion:reduce){
  .fc-card{transition:none}
  .fc-lift.lift,.fc-lift.in,.fc-lift.out-ok,.fc-lift.out-ko,.fc-face::after{animation:none !important}
}
@media print{.fc-stage,.fc-ctrls,.fc-bar{display:none !important}}
/* ═══ RESPUESTA ESTRUCTURADA ═══ */
.fc-face{justify-content:center}
.fc-face.struct{justify-content:flex-start;text-align:left;padding-top:3.1rem;padding-bottom:3.1rem}
.fc-body{
  width:100%;max-width:46ch;margin:0 auto;
  overflow-y:auto;max-height:100%;
  scrollbar-width:thin;
}
.fc-body::-webkit-scrollbar{width:5px}
.fc-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.35);border-radius:99px;border:0}
.fc-front .fc-body::-webkit-scrollbar-thumb{background:var(--line-strong)}

/* — Veredicto Sí / No — */
.fc-verdict{
  display:inline-flex;align-items:center;gap:.35rem;
  font-family:var(--f-display);font-weight:800;font-size:.82rem;
  letter-spacing:.06em;text-transform:uppercase;
  padding:.26rem .72rem;border-radius:var(--r-full);margin-bottom:.85rem;
  border:1.5px solid;animation:fcPopIn .45s var(--e-spring) backwards;animation-delay:.34s;
}
.fc-verdict.si{background:rgba(255,255,255,.16);border-color:rgba(190,255,215,.85);color:#d8ffe9}
.fc-verdict.no{background:rgba(255,255,255,.16);border-color:rgba(255,205,205,.85);color:#ffdedd}
@keyframes fcPopIn{0%{opacity:0;transform:scale(.7) translateY(6px)}100%{opacity:1;transform:none}}

/* — Párrafo — */
.fc-p{margin:0;font-size:clamp(1rem,.92rem + .45vw,1.2rem);font-weight:600;line-height:1.6}
.fc-face.struct .fc-p{font-size:clamp(.96rem,.9rem + .35vw,1.1rem)}

/* — Lista enumerada — */
.fc-list{list-style:none;margin:0;padding:0;display:grid;gap:.5rem;counter-reset:fc}
.fc-list li{
  counter-increment:fc;position:relative;margin:0;
  padding:.42rem .6rem .42rem 2.5rem;border-radius:var(--r-sm);
  background:rgba(255,255,255,.11);
  font-size:clamp(.92rem,.88rem + .3vw,1.04rem);font-weight:600;line-height:1.45;
  animation:fcRow .42s var(--e-out) backwards;
}
.fc-list li::before{
  content:counter(fc);position:absolute;left:.6rem;top:50%;transform:translateY(-50%);
  width:1.6rem;height:1.6rem;border-radius:50%;
  display:grid;place-items:center;
  background:rgba(255,255,255,.9);color:var(--brand);
  font-family:var(--f-display);font-weight:800;font-size:.78rem;
  font-variant-numeric:tabular-nums;
}
.fc-list.alpha li::before{content:counter(fc,lower-alpha)}
.fc-list li:nth-child(1){animation-delay:.36s}
.fc-list li:nth-child(2){animation-delay:.42s}
.fc-list li:nth-child(3){animation-delay:.48s}
.fc-list li:nth-child(4){animation-delay:.54s}
.fc-list li:nth-child(5){animation-delay:.60s}
.fc-list li:nth-child(n+6){animation-delay:.66s}
@keyframes fcRow{0%{opacity:0;transform:translateX(-12px)}100%{opacity:1;transform:none}}

/* — Cláusulas contrapuestas — */
.fc-clauses{display:grid;gap:.45rem}
.fc-clauses p{
  margin:0;padding:.45rem .7rem .45rem .95rem;border-radius:0 var(--r-sm) var(--r-sm) 0;
  background:rgba(255,255,255,.11);border-left:3px solid rgba(255,255,255,.55);
  font-size:clamp(.92rem,.88rem + .3vw,1.04rem);font-weight:600;line-height:1.5;
  animation:fcRow .42s var(--e-out) backwards;
}
.fc-clauses p:nth-child(1){animation-delay:.36s}
.fc-clauses p:nth-child(2){animation-delay:.44s}
.fc-clauses p:nth-child(3){animation-delay:.52s}

/* — Negritas resaltadas en el reverso — */
.fc-back .fc-body b,.fc-back .fc-body strong{
  font-weight:800;background:rgba(255,255,255,.2);
  padding:.03em .3em;border-radius:5px;
  box-decoration-break:clone;-webkit-box-decoration-break:clone;
}

/* — Cita legal al pie — */
.fc-cite{
  position:absolute;bottom:.95rem;left:0;right:0;
  display:inline-flex;align-items:center;justify-content:center;gap:.4rem;
  font-family:var(--f-mono);font-size:.74rem;font-weight:700;letter-spacing:.02em;
  color:rgba(255,255,255,.82);
  animation:fcPopIn .5s var(--e-out) backwards;animation-delay:.5s;
}
.fc-cite::before,.fc-cite::after{
  content:"";height:1px;width:clamp(18px,10%,52px);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.45));
}
.fc-cite::after{background:linear-gradient(90deg,rgba(255,255,255,.45),transparent)}
.fc-cite .s{font-size:.9rem;opacity:.75;font-family:var(--f-legal)}
.fc-front .fc-cite{color:var(--ink-3)}
.fc-front .fc-cite::before{background:linear-gradient(90deg,transparent,var(--line-strong))}
.fc-front .fc-cite::after{background:linear-gradient(90deg,var(--line-strong),transparent)}

/* la pista se oculta si hay cita, para no amontonar */
.fc-back .fc-cite ~ .fc-hint,.fc-back .fc-hint.muted{display:none}

@media(max-width:620px){
  #flash{--fc-h:320px}
  .fc-face.struct{padding-top:2.9rem;padding-bottom:2.8rem}
  .fc-list li{padding-left:2.3rem}
}
@media(prefers-reduced-motion:reduce){
  .fc-verdict,.fc-list li,.fc-clauses p,.fc-cite{animation:none !important}
}

/* ═══ SEMÁFORO ═══ */
.sembtn{
  border-radius:var(--r-full);padding:.32rem .7rem;font-weight:700;font-size:var(--t-sm);
}
.sembtn[data-v="g"]:hover,.sembtn.on[data-v="g"]{background:var(--ok);color:#fff;border-color:var(--ok)}
.sembtn[data-v="y"]:hover,.sembtn.on[data-v="y"]{background:var(--mid);color:#3d2f00;border-color:var(--mid)}
.sembtn[data-v="r"]:hover,.sembtn.on[data-v="r"]{background:var(--exc);color:#fff;border-color:var(--exc)}

/* ═══ CTA DE BLOQUE ═══ */
a.blk{
  display:inline-flex;align-items:center;gap:.5rem;
  background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;
  padding:.5rem .95rem;border-radius:var(--r-sm);font-weight:700;font-size:var(--t-sm);
  text-decoration:none;box-shadow:0 2px 10px var(--brand-ring);
  transition:transform .22s var(--e-spring),box-shadow .25s,gap .25s var(--e-out);
}
a.blk:hover{transform:translateY(-2px);box-shadow:var(--sh-3);gap:.75rem;text-decoration:none}
a.blk::after{content:"→"}
a.blk:active{transform:translateY(0) scale(.98)}

/* ═══ REVEAL ═══ */
.rv{opacity:0;transform:translateY(20px);transition:opacity .6s var(--e-out),transform .6s var(--e-out)}
.rv.in{opacity:1;transform:none}

/* ═══ RESPONSIVE ═══ */
@media(max-width:960px){
  .layout{grid-template-columns:1fr;padding-top:.9rem;gap:1rem}
  nav.side{position:static;max-height:none}
  nav.side.collapsed .navbody{display:none}
  .navtoggle{display:block;width:100%;text-align:left;font-weight:700}
  .grid2{grid-template-columns:1fr}
  .top h1 .sub{white-space:normal}
}
@media(max-width:620px){
  .top-in{padding:.55rem .8rem}
  .tools{width:100%;margin-left:0}
  input[type=search]{flex:1;min-width:0}
  section.card{padding:1.05rem 1rem;border-radius:var(--r-md)}
  table{font-size:.82rem}
  th,td{padding:.4rem .5rem}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
  .rv{opacity:1;transform:none}
}
@media print{
  header.top,nav.side,.tools,.noprint,.progress{display:none !important}
  body{background:#fff;background-image:none;font-size:11pt;color:#000}
  .layout{display:block;max-width:none;padding:0}
  section.card{border:0;padding:0;margin:0 0 1rem;break-inside:avoid;box-shadow:none}
  details.panel{border:0;box-shadow:none}
  details.panel .body{display:block !important}
  details.panel>summary{padding-left:0}
  .art{break-inside:avoid}
  .rv{opacity:1;transform:none}
  a{color:#000;text-decoration:none}
}


/* ═══ ALTURA ADAPTATIVA DE LA TARJETA ═══ */
.fc-deck{transition:height .45s var(--fc-e)}
.fc-body{max-height:none;overflow:visible}
.fc-measure{
  position:absolute;left:0;right:0;top:0;height:auto;
  visibility:hidden;pointer-events:none;z-index:-1;
}
.fc-measure .fc-face{
  position:relative;inset:auto;height:auto;min-height:0;
  box-shadow:none;backface-visibility:visible;transform:none;
}
.fc-measure .fc-body{max-height:none;overflow:visible}
.fc-measure .fc-face::after{display:none}

/* ═══ MOSTRAR / OCULTAR ÍNDICE LATERAL ═══ */
.layout{transition:grid-template-columns .42s var(--e-out)}
.layout.nonav{grid-template-columns:0 1fr;gap:0}
.layout.nonav>nav.side{
  opacity:0;transform:translateX(-14px);pointer-events:none;
  padding:0;border-width:0;overflow:hidden;width:0;min-width:0;
}
nav.side{
  transition:opacity .3s var(--e-out),transform .38s var(--e-out);
  overflow-x:hidden;
}
#navhide .ic{display:inline-block;transition:transform .35s var(--e-spring);font-size:.95em;line-height:1}
#navhide[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
#navhide[aria-pressed="true"] .ic{transform:rotate(90deg)}
@media(max-width:960px){#navhide{display:none}}

/* ═══════════════════════════════════════════════════════════════
   LECTURA EN VOZ ALTA (TTS) del texto legal
   ═══════════════════════════════════════════════════════════════ */
.tts-bar{
  display:flex;align-items:center;gap:.45rem;flex-wrap:wrap;
  margin:.15rem 0 .7rem;
}
.tts-bar button{
  font-size:var(--t-xs);font-weight:700;padding:.3rem .62rem;
  border-radius:var(--r-full);border:1px solid var(--legal);
  background:transparent;color:var(--legal);
  display:inline-flex;align-items:center;gap:.35rem;line-height:1.2;
}
.tts-bar button:hover{background:var(--legal);color:var(--surface);border-color:var(--legal)}
.tts-bar button[hidden]{display:none}
.tts-bar .tts-play.on{background:var(--legal);color:var(--surface)}

/* Ondas de audio mientras lee */
.tts-wave{display:inline-flex;align-items:flex-end;gap:2px;height:11px}
.tts-wave i{
  width:2.5px;background:currentColor;border-radius:2px;height:35%;
  animation:ttsW .9s ease-in-out infinite;
}
.tts-wave i:nth-child(2){animation-delay:.15s}
.tts-wave i:nth-child(3){animation-delay:.3s}
.tts-wave i:nth-child(4){animation-delay:.45s}
@keyframes ttsW{0%,100%{height:32%}50%{height:100%}}

.tts-time{
  font-family:var(--f-mono);font-size:.7rem;font-weight:700;
  color:var(--ink-3);font-variant-numeric:tabular-nums;
}

/* Frase que se está leyendo */
.tts-s{transition:background .25s,color .25s;border-radius:3px}
.tts-s.now{
  background:linear-gradient(180deg,transparent 8%,color-mix(in srgb,var(--legal) 26%,transparent) 8%);
  box-shadow:0 0 0 2px color-mix(in srgb,var(--legal) 16%,transparent);
}
html[data-theme="dark"] .tts-s.now{
  background:linear-gradient(180deg,transparent 8%,color-mix(in srgb,var(--legal) 34%,transparent) 8%);
}
.legal.tts-on{box-shadow:0 0 0 3px color-mix(in srgb,var(--legal) 20%,transparent)}

/* ═══ Reproductor flotante ═══ */
.tts-mini{
  position:fixed;left:50%;bottom:1.1rem;transform:translateX(-50%) translateY(140%);
  z-index:80;display:flex;align-items:center;gap:.6rem;
  background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  border:1px solid var(--line);border-radius:var(--r-full);
  padding:.5rem .7rem .5rem .95rem;box-shadow:var(--sh-3);
  transition:transform .45s var(--e-spring),opacity .3s;opacity:0;pointer-events:none;
  max-width:min(94vw,540px);
}
.tts-mini.show{transform:translateX(-50%) translateY(0);opacity:1;pointer-events:auto}
.tts-mini .lbl{
  font-size:var(--t-xs);font-weight:800;color:var(--legal);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:16ch;
}
.tts-mini button{
  border-radius:50%;width:32px;height:32px;padding:0;display:grid;place-items:center;
  font-size:.8rem;border:1px solid var(--line);flex:none;
}
.tts-mini button.main{
  width:38px;height:38px;font-size:.95rem;
  background:linear-gradient(140deg,var(--legal),var(--brand));color:#fff;border-color:transparent;
}
.tts-mini .bar{
  flex:1;min-width:70px;height:5px;border-radius:99px;background:var(--surface-3);overflow:hidden;
}
.tts-mini .bar i{display:block;height:100%;width:0;background:var(--legal);
  border-radius:99px;transition:width .35s var(--e-out)}

/* ═══ Panel de ajustes de voz ═══ */
.tts-back{
  position:fixed;inset:0;z-index:90;background:rgba(10,10,18,.45);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  display:grid;place-items:center;padding:1rem;
  opacity:0;pointer-events:none;transition:opacity .3s var(--e-out);
}
.tts-back.show{opacity:1;pointer-events:auto}
.tts-panel{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--sh-3);width:min(94vw,470px);max-height:88vh;overflow:auto;
  padding:1.3rem 1.4rem;transform:translateY(16px) scale(.97);
  transition:transform .38s var(--e-spring);
}
.tts-back.show .tts-panel{transform:none}
.tts-panel h3{
  font-size:1.12rem;font-weight:800;margin:0 0 .25rem;
  display:flex;align-items:center;gap:.5rem;
}
.tts-panel .sub{font-size:var(--t-sm);color:var(--ink-2);margin:0 0 1.1rem}
.tts-row{margin-bottom:1.05rem}
.tts-row > label{
  display:block;font-size:var(--t-xs);font-weight:800;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-2);margin-bottom:.4rem;
}
.tts-seg{display:flex;gap:3px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:3px}
.tts-seg button{
  flex:1;border:0;background:transparent;border-radius:calc(var(--r-sm) - 3px);
  padding:.42rem .3rem;font-size:var(--t-sm);font-weight:700;box-shadow:none;
}
.tts-seg button:hover{transform:none;background:var(--surface)}
.tts-seg button[aria-pressed="true"]{
  background:linear-gradient(140deg,var(--legal),var(--brand));color:#fff;
}
.tts-panel select{
  width:100%;padding:.5rem .6rem;border-radius:var(--r-sm);
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  font-size:var(--t-sm);font-weight:600;cursor:pointer;
}
.tts-panel select:focus{border-color:var(--brand);outline:none}
.tts-slider{display:flex;align-items:center;gap:.75rem}
.tts-slider input[type=range]{flex:1;accent-color:var(--legal);cursor:pointer;height:22px}
.tts-val{
  font-family:var(--f-mono);font-weight:800;font-size:var(--t-sm);
  min-width:3.4em;text-align:right;color:var(--legal);font-variant-numeric:tabular-nums;
}
.tts-note{
  font-size:var(--t-xs);color:var(--ink-2);line-height:1.5;

}
.tts-note b{color:var(--ink)}
.tts-acts{display:flex;gap:.5rem;justify-content:flex-end;flex-wrap:wrap}
.tts-acts .prim{
  background:linear-gradient(140deg,var(--legal),var(--brand));color:#fff;border-color:transparent;
}
.tts-badge{
  font-size:.62rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
  padding:.1rem .35rem;border-radius:4px;background:var(--ej-bg);color:var(--ej);margin-left:.35rem;
}


/* — Variante compacta para los apartados desplegables — */
.tts-bar.mini{margin:0 0 .6rem}

}

.legal.tts-on,.body.tts-on,.idea.tts-on{

}
.legal.tts-on{box-shadow:0 0 0 3px color-mix(in srgb,var(--legal) 20%,transparent)}

@media(max-width:620px){
  .tts-mini{left:.6rem;right:.6rem;transform:translateY(140%);max-width:none}

  .tts-mini .lbl{display:none}
}
@media(prefers-reduced-motion:reduce){
  .tts-wave i{animation:none;height:60%}
}
@media print{.tts-bar,.tts-mini,.tts-back{display:none !important}}

<script>
const GLOSARIO={"reintegro": "Reintegro: obligación de devolver la subvención percibida, más el interés de demora, cuando concurre alguna de las causas del art. 37. No es una sanción y es independiente de ellas. Ej.: devolver 1.800 € por impartir 270 de las 300 horas comprometidas.", "beneficiario": "Beneficiario: persona o entidad que recibe la subvención y realiza la actividad que fundamentó su otorgamiento. Ej.: la asociación que imparte el programa de refuerzo escolar.", "colaboradora": "Entidad colaboradora: la que, actuando en nombre del órgano concedente, entrega los fondos a los beneficiarios o colabora en la gestión sin recibir la subvención. Responde del reintegro junto al beneficiario.", "demora": "Interés de demora en subvenciones: el interés legal del dinero incrementado en un 25 %, salvo que la Ley de Presupuestos fije otro. Se cuenta desde el pago de la subvención (arts. 37.1 y 38.2).", "prescrip": "Prescripción: extinción del derecho de la Administración a reconocer o liquidar el reintegro por el transcurso de cuatro años. Ej.: vencido el plazo de justificación el 1 de febrero de 2022, prescribe el 1 de febrero de 2026.", "caducidad": "Caducidad: terminación del procedimiento de reintegro por transcurrir doce meses desde el acuerdo de iniciación sin notificar resolución. Y no se considera interrumpida la prescripción por lo actuado (art. 42.4).", "solidaria": "Responsabilidad solidaria: la Administración puede dirigirse indistintamente contra cualquiera de los obligados por el total. Ej.: los cotitulares de una comunidad de bienes, en proporción a su participación.", "subsidiaria": "Responsabilidad subsidiaria: solo se exige tras declarar fallido al obligado principal. Ej.: los administradores de una sociedad mercantil que consintieron el incumplimiento.", "controlfin": "Control financiero de subvenciones: verificación posterior, con técnicas de auditoría, de la obtención, aplicación y justificación de la subvención. Lo ejerce la Intervención, no el órgano concedente.", "revision": "Revisión de oficio: potestad de la Administración de anular por sí misma sus propios actos nulos de pleno derecho. No procede sobre el acto de concesión cuando concurre una causa de reintegro (art. 36.5).", "lesividad": "Declaración de lesividad: paso previo a impugnar ante el contencioso los propios actos anulables favorables al interesado. Es la vía del art. 36.3 cuando la concesión es anulable, no nula.", "graduacion": "Criterios de graduación: reglas de las bases reguladoras que permiten un reintegro parcial cuando el cumplimiento se aproxima de modo significativo al total (arts. 17.3.n) y 37.2).", "igae": "IGAE: Intervención General de la Administración del Estado, órgano competente para el control financiero de subvenciones en el ámbito estatal y para coordinar los controles de fondos europeos."};
const ARTS=[{"n": 36, "t": "Invalidez de la resolución de concesión", "ubic": "Título II · Del reintegro de subvenciones ▸ Capítulo I · Del reintegro", "idea": "Si la concesión nació mal, se revisa de oficio y hay que devolver el dinero; salvo que proceda reintegro.", "literal": "<p><b>1.</b> Son causas de nulidad de la resolución de concesión:</p><p style=\"margin-left:1.1rem\">a) Las indicadas en el artículo 62.1 de la Ley 30/1992, de 26 de noviembre, de Régimen Jurídico de las Administraciones Públicas y del Procedimiento Administrativo Común.</p><p style=\"margin-left:1.1rem\">b) La carencia o insuficiencia de crédito, de conformidad con lo establecido en el artículo 60 de la Ley General Presupuestaria y las demás normas de igual carácter de las Administraciones públicas sujetas a esta ley.</p><p><b>2.</b> Son causas de anulabilidad de la resolución de concesión las demás infracciones del ordenamiento jurídico, y, en especial, de las reglas contenidas en esta ley, de conformidad con lo dispuesto en el artículo 63 de la Ley 30/1992, de 26 de noviembre, de Régimen Jurídico de las Administraciones Públicas y del Procedimiento Administrativo Común.</p><p><b>3.</b> Cuando el acto de concesión incurriera en alguno de los supuestos mencionados en los apartados anteriores, el órgano concedente procederá a su revisión de oficio o, en su caso, a la declaración de lesividad y ulterior impugnación, de conformidad con lo establecido en los artículos 102 y 103 de la Ley 30/1992, de 26 de noviembre, de Régimen Jurídico de las Administraciones Públicas y del Procedimiento Administrativo Común.</p><p><b>4.</b> La declaración judicial o administrativa de nulidad o anulación llevará consigo la obligación de devolver las cantidades percibidas.</p><p><b>5.</b> No procederá la revisión de oficio del acto de concesión cuando concurra alguna de las causas de reintegro contempladas en el artículo siguiente.</p>", "dis": "<ul>\n<li><b>Nulidad (36.1):</b> <b>a)</b> las causas de nulidad de pleno derecho del procedimiento administrativo común; <b>b)</b> la <b>carencia o insuficiencia de crédito</b>.</li>\n<li><b>Anulabilidad (36.2):</b> las <b>demás infracciones del ordenamiento jurídico</b> y, en especial, de las reglas de esta ley.</li>\n<li><b>Reacción (36.3):</b> el órgano concedente procederá a la <span class=\"t\" data-k=\"revision\">revisión de oficio</span> o, en su caso, a la <span class=\"t\" data-k=\"lesividad\">declaración de lesividad</span> y ulterior impugnación.</li>\n<li><b>Efecto (36.4):</b> la declaración judicial o administrativa de nulidad o anulación «llevará consigo la <b>obligación de devolver las cantidades percibidas</b>».</li>\n<li><b>Regla de deslinde (36.5):</b> «<b>No procederá la revisión de oficio</b> del acto de concesión cuando concurra alguna de las <b>causas de reintegro</b> contempladas en el artículo siguiente».</li>\n</ul>", "llano": "<p>Una cosa es que la subvención se concediera mal desde el principio —por ejemplo, sin crédito— y otra que se concediera bien y el beneficiario incumpliera después. Lo primero se arregla anulando la concesión; lo segundo, exigiendo el reintegro.</p>\n<p>Y la ley lo ordena expresamente: si hay causa de reintegro, <b>no</b> se revisa de oficio.</p>", "porque": "<p>Porque son dos patologías distintas con dos remedios distintos, y confundirlas produce nulidades en cadena. La revisión de oficio ataca al <b>acto</b>; el reintegro, al <b>comportamiento posterior</b> del beneficiario.</p>\n<p>El art. 36.5 evita además un abuso: usar la revisión de oficio —que no tiene plazo en los casos de nulidad— para recuperar dinero cuando el cauce correcto, el reintegro, ya habría prescrito a los cuatro años.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> una beca concedida por error a quien no cumplía los requisitos (hay que anular la concesión) frente a una beca bien concedida a quien luego abandonó el curso (hay que exigir la devolución).</li>\n<li><b>Real:</b> una diputación concede en octubre una subvención de 40.000 € para un festival, pero la aplicación presupuestaria solo tenía 12.000 € y no se tramitó modificación de crédito. Es <b>nulidad</b> por la letra b) del art. 36.1: procede la revisión de oficio y la devolución de lo percibido.</li>\n<li><b>Caso límite:</b> la misma subvención, con crédito suficiente, pero el beneficiario no justifica en plazo. <b>No</b> se revisa de oficio: concurre la causa de reintegro del art. 37.1.c) y hay que ir por esa vía (art. 36.5).</li>\n</ul>", "noej": "<ul>\n<li><b>No es causa de nulidad</b> cualquier infracción de la ley: solo las de nulidad de pleno derecho y la falta o insuficiencia de crédito. Las demás son <b>anulables</b>.</li>\n<li><b>No cabe</b> la revisión de oficio si concurre una causa de reintegro.</li>\n<li><b>No es un reintegro</b> la devolución derivada de la anulación: es la consecuencia natural de que el acto desaparezca.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 37:</b> causas de reintegro, que desplazan la revisión de oficio.</li>\n<li><b>Art. 34.1:</b> exigencia de crédito adecuado y suficiente para la concesión.</li>\n<li><b>Arts. 106 y 107 LPAC</b> <i>(otra norma de la biblioteca)</i>: revisión de oficio y declaración de lesividad, a los que el art. 36.3 remite en su redacción actualizada.</li>\n<li><b>Art. 47 LPAC</b> <i>(otra norma de la biblioteca)</i>: causas de nulidad de pleno derecho.</li>\n</ul>", "trampas": "<ul>\n<li>La <b>insuficiencia de crédito</b> es causa de <b>nulidad</b>, no de anulabilidad. Es la respuesta que más se falla.</li>\n<li>El texto consolidado cita todavía la <b>Ley 30/1992</b>: hay que leerla referida a la <b>Ley 39/2015</b>.</li>\n<li>«No procederá la revisión de oficio… cuando concurra alguna de las causas de reintegro»: el <b>reintegro desplaza</b> a la revisión.</li>\n</ul>", "ancla": "<p><b>«Si nació mal, se anula. Si se portó mal, se reintegra. Nunca las dos.»</b></p>", "vis": "<svg viewBox=\"0 0 960 295\" role=\"img\" aria-label=\"Causas de nulidad y anulabilidad de la resolución de concesión de una subvención\" style=\"width:100%;height:auto\"><defs><marker id=\"fl1\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr1\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe1\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw1\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"250\" y=\"8\" width=\"460\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"27.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">INVALIDEZ DE LA RESOLUCIÓN DE CONCESIÓN · ART. 36</text><rect x=\"20\" y=\"52\" width=\"219.5\" height=\"175\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"129.75\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--exc)\">NULIDAD</text><text x=\"129.75\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">a) Las causas de nulidad</text><text x=\"129.75\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">de pleno derecho del</text><text x=\"129.75\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">procedimiento administrativo</text><text x=\"129.75\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">común</text><text x=\"129.75\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"129.75\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">b) La CARENCIA O</text><text x=\"129.75\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">INSUFICIENCIA DE CRÉDITO</text><text x=\"129.75\" y=\"180\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"129.75\" y=\"193\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 36.1</text><rect x=\"253.5\" y=\"52\" width=\"219.5\" height=\"175\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"363.25\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--warn)\">ANULABILIDAD</text><text x=\"363.25\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Las DEMÁS infracciones</text><text x=\"363.25\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">del ordenamiento jurídico</text><text x=\"363.25\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"363.25\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">y en especial las de las</text><text x=\"363.25\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">reglas de la propia Ley</text><text x=\"363.25\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">38/2003</text><text x=\"363.25\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"363.25\" y=\"180\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 36.2</text><rect x=\"487\" y=\"52\" width=\"219.5\" height=\"175\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"596.75\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--acc)\">QUÉ HACE LA\nADMINISTRACIÓN</text><text x=\"596.75\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">REVISIÓN DE OFICIO</text><text x=\"596.75\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"596.75\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">o, en su caso, declaración</text><text x=\"596.75\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">de LESIVIDAD y ulterior</text><text x=\"596.75\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">impugnación</text><text x=\"596.75\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"596.75\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 36.3</text><rect x=\"720.5\" y=\"52\" width=\"219.5\" height=\"175\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"830.25\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--ej)\">EFECTO</text><text x=\"830.25\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">La declaración judicial o</text><text x=\"830.25\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">administrativa de nulidad</text><text x=\"830.25\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">o anulación lleva consigo</text><text x=\"830.25\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">la OBLIGACIÓN DE DEVOLVER</text><text x=\"830.25\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">las cantidades percibidas</text><text x=\"830.25\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"830.25\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 36.4</text><rect x=\"20\" y=\"237\" width=\"920\" height=\"48\" rx=\"8\" fill=\"var(--panel)\" stroke=\"var(--line)\"/><text x=\"480\" y=\"257.828\" text-anchor=\"middle\" font-size=\"10.4\" fill=\"currentColor\">Regla de deslinde del art. 36.5: NO procede la revisión de oficio del acto de concesión cuando concurra alguna de las causas de REINTEGRO del art. 37.</text><text x=\"480\" y=\"270.828\" text-anchor=\"middle\" font-size=\"10.4\" fill=\"currentColor\">Invalidez y reintegro son dos caminos distintos, y el reintegro desplaza a la revisión de oficio.</text></svg>"}, {"n": 37, "t": "Causas de reintegro", "ubic": "Título II · Del reintegro de subvenciones ▸ Capítulo I · Del reintegro", "idea": "Siete supuestos en los que hay que devolver lo cobrado más el interés de demora.", "literal": "<p><b>1.</b> También procederá el reintegro de las cantidades percibidas y la exigencia del interés de demora correspondiente desde el momento del pago de la subvención hasta la fecha en que se acuerde la procedencia del reintegro, o la fecha en que el deudor ingrese el reintegro si es anterior a ésta, en los siguientes casos:</p><p style=\"margin-left:1.1rem\">a) Obtención de la subvención falseando las condiciones requeridas para ello u ocultando aquéllas que lo hubieran impedido.</p><p style=\"margin-left:1.1rem\">b) Incumplimiento total o parcial del objetivo, de la actividad, del proyecto o la no adopción del comportamiento que fundamentan la concesión de la subvención.</p><p style=\"margin-left:1.1rem\">c) Incumplimiento de la obligación de justificación o la justificación insuficiente, en los términos establecidos en el artículo 30 de esta ley, y en su caso, en las normas reguladoras de la subvención.</p><p style=\"margin-left:1.1rem\">d) Incumplimiento de la obligación de adoptar las medidas de difusión contenidas en el apartado 4 del artículo 18 de esta ley.</p><p style=\"margin-left:1.1rem\">e) Resistencia, excusa, obstrucción o negativa a las actuaciones de comprobación y control financiero previstas en los artículos 14 y 15 de esta ley, así como el incumplimiento de las obligaciones contables, registrales o de conservación de documentos cuando de ello se derive la imposibilidad de verificar el empleo dado a los fondos percibidos, el cumplimiento del objetivo, la realidad y regularidad de las actividades subvencionadas, o la concurrencia de subvenciones, ayudas, ingresos o recursos para la misma finalidad, procedentes de cualesquiera Administraciones o entes públicos o privados, nacionales, de la Unión Europea o de organismos internacionales.</p><p style=\"margin-left:1.1rem\">f) Incumplimiento de las obligaciones impuestas por la Administración a las entidades colaboradoras y beneficiarios, así como de los compromisos por éstos asumidos, con motivo de la concesión de la subvención, siempre que afecten o se refieran al modo en que se han de conseguir los objetivos, realizar la actividad, ejecutar el proyecto o adoptar el comportamiento que fundamenta la concesión de la subvención.</p><p style=\"margin-left:1.1rem\">g) Incumplimiento de las obligaciones impuestas por la Administración a las entidades colaboradoras y beneficiarios, así como de los compromisos por éstos asumidos, con motivo de la concesión de la subvención, distintos de los anteriores, cuando de ello se derive la imposibilidad de verificar el empleo dado a los fondos percibidos, el cumplimiento del objetivo, la realidad y regularidad de las actividades subvencionadas, o la concurrencia de subvenciones, ayudas, ingresos o recursos para la misma finalidad, procedentes de cualesquiera Administraciones o entes públicos o privados, nacionales, de la Unión Europea o de organismos internacionales.</p><p style=\"margin-left:1.1rem\">h) La adopción, en virtud de lo establecido en los artículos 87 a 89 del Tratado de la Unión Europea, de una decisión de la cual se derive una necesidad de reintegro.</p><p style=\"margin-left:1.1rem\">i) En los demás supuestos previstos en la normativa reguladora de la subvención.</p><p><b>2.</b> Cuando el cumplimiento por el beneficiario o, en su caso, entidad colaboradora se aproxime de modo significativo al cumplimiento total y se acredite por éstos una actuación inequívocamente tendente a la satisfacción de sus compromisos, la cantidad a reintegrar vendrá determinada por la aplicación de los criterios enunciados en el párrafo n) del apartado 3 del artículo 17 de esta ley o, en su caso, las establecidas en la normativa autonómica reguladora de la subvención.</p><p><b>3.</b> Igualmente, en el supuesto contemplado en el apartado 3 del artículo 19 de esta ley procederá el reintegro del exceso obtenido sobre el coste de la actividad subvencionada, así como la exigencia del interés de demora correspondiente.</p>", "dis": "<ul>\n<li><b>Efecto (37.1):</b> procede el <span class=\"t\" data-k=\"reintegro\">reintegro</span> de las cantidades percibidas <b>y la exigencia del interés de demora</b> desde el momento del <b>pago de la subvención</b> hasta la fecha en que se acuerde la procedencia del reintegro —o hasta el ingreso, si es anterior—.</li>\n<li><b>Las causas:</b>\n <ul><li><b>a)</b> obtención de la subvención <b>falseando</b> las condiciones u <b>ocultando</b> las que lo hubieran impedido;</li>\n <li><b>b)</b> <b>incumplimiento total o parcial</b> del objetivo, la actividad o el proyecto, o no adopción del comportamiento que fundamenta la concesión;</li>\n <li><b>c)</b> incumplimiento de la obligación de <b>justificación</b> o justificación <b>insuficiente</b> (art. 30);</li>\n <li><b>d)</b> incumplimiento de las <b>medidas de difusión</b> del art. 18.4;</li>\n <li><b>e)</b> <b>resistencia, excusa, obstrucción o negativa</b> a las actuaciones de comprobación y control financiero (arts. 14 y 15), y el incumplimiento contable, registral o de conservación de documentos que impida verificar el empleo de los fondos o la concurrencia de otras subvenciones;</li>\n <li><b>f)</b> incumplimiento de las <b>obligaciones impuestas</b> por la Administración o de los <b>compromisos asumidos</b>, cuando afecten al modo de conseguir los objetivos;</li>\n <li><b>g)</b> los <b>demás supuestos</b> previstos en la normativa reguladora de la subvención.</li></ul></li>\n<li><b>Reintegro parcial (37.2):</b> cuando el cumplimiento se aproxime de modo significativo al total y se acredite una actuación inequívocamente tendente a la satisfacción de los compromisos, la cantidad a reintegrar se determinará por aplicación de los <span class=\"t\" data-k=\"graduacion\">criterios de graduación</span> de las bases reguladoras.</li>\n<li><b>Exceso (37.3):</b> también procede el reintegro del <b>exceso</b> obtenido sobre el coste de la actividad y del <b>exceso de financiación</b>, más el interés de demora.</li>\n</ul>", "llano": "<p>Siete motivos para tener que devolver el dinero: mentir para conseguirlo, no hacer lo que se prometió, no justificar, no dar la publicidad debida, impedir el control, incumplir compromisos y lo que digan las bases.</p>\n<p>Y hay que devolver con <b>intereses desde el día en que se cobró</b>, no desde que se descubre el incumplimiento.</p>", "porque": "<p>Porque la subvención es dinero entregado <b>sin contraprestación</b> pero <b>con una finalidad</b>. Si la finalidad no se cumple, el título que justificaba la entrega desaparece y el dinero debe volver.</p>\n<p>El interés de demora desde el pago no es un castigo: es la constatación de que el beneficiario ha dispuesto de dinero público que no le correspondía durante todo ese tiempo.</p>\n<p>Y el reintegro <b>parcial</b> del 37.2 introduce proporcionalidad: quien cumplió el 90 % no debe devolver el 100 %.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> el anticipo de una reforma que no se hace: hay que devolverlo, y si el dinero estuvo un año en la cuenta de quien lo cobró, con intereses.</li>\n<li><b>Real:</b> una asociación recibe 18.000 € para un programa de refuerzo escolar de 300 horas. Imparte 270 y no coloca el cartel con la financiación de la diputación. Concurren la letra <b>b)</b> —incumplimiento parcial— y la <b>d)</b> —medidas de difusión—. Si las bases graduaban el incumplimiento, el reintegro sería <b>parcial</b> (37.2): 10 % del importe, 1.800 € más intereses.</li>\n<li><b>Caso límite:</b> la misma asociación recibe además 6.000 € de otra Administración para lo mismo, de modo que la financiación total supera el coste de la actividad. Procede el reintegro del <b>exceso</b> por el art. 37.3, aunque el programa se haya cumplido íntegramente.</li>\n</ul>", "noej": "<ul>\n<li><b>No es una sanción:</b> el reintegro es la devolución de lo indebidamente percibido, y es <b>independiente</b> de las sanciones que procedan (art. 40.1).</li>\n<li><b>No procede</b> el reintegro total si el cumplimiento se aproxima significativamente al total y las bases prevén criterios de graduación (37.2).</li>\n<li><b>No se cuentan</b> los intereses desde la resolución de reintegro, sino desde el <b>pago</b> de la subvención.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 30:</b> justificación de la subvención, cuyo incumplimiento es la letra c).</li>\n<li><b>Art. 18.4:</b> medidas de difusión, cuya omisión es la letra d).</li>\n<li><b>Arts. 14 y 15:</b> obligaciones de beneficiarios y entidades colaboradoras, cuya obstrucción es la letra e).</li>\n<li><b>Art. 17.3.n):</b> los criterios de graduación de los incumplimientos van en las bases reguladoras.</li>\n<li><b>Art. 19.3:</b> el importe de la subvención no puede superar el coste de la actividad, base del art. 37.3.</li>\n<li><b>Art. 36.5:</b> si concurre causa de reintegro, no cabe revisión de oficio.</li>\n</ul>", "trampas": "<ul>\n<li><b>Siete letras</b>, de la a) a la g).</li>\n<li>Los intereses corren <b>desde el pago</b> de la subvención.</li>\n<li>El <b>reintegro parcial</b> exige que las bases contengan criterios de graduación: si no los contienen, el margen desaparece.</li>\n<li>La letra <b>d)</b> —no dar publicidad a la financiación pública— parece menor y es causa autónoma de reintegro.</li>\n</ul>", "ancla": "<p><b>F-I-J-P-O-C-N:</b> <b>F</b>alsear · <b>I</b>ncumplir el fin · no <b>J</b>ustificar · no dar <b>P</b>ublicidad · <b>O</b>bstruir el control · incumplir <b>C</b>ompromisos · los que digan las <b>N</b>ormas reguladoras.</p>", "vis": "<svg viewBox=\"0 0 960 532\" role=\"img\" aria-label=\"Causas por las que procede el reintegro de una subvención\" style=\"width:100%;height:auto\"><defs><marker id=\"fl2\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr2\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe2\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw2\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"250\" y=\"8\" width=\"460\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"27.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">LAS CAUSAS DE REINTEGRO · ART. 37.1</text><rect x=\"20\" y=\"52\" width=\"920\" height=\"40\" rx=\"10\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><rect x=\"30\" y=\"59\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--exc)\"/><text x=\"120\" y=\"76\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--exc)\">a) OBTENCIÓN FRAUDULENTA</text><text x=\"224\" y=\"74\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Falsear las condiciones requeridas u ocultar las que lo habrían impedido.</text><text x=\"930\" y=\"74\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">37.1.a</text><path d=\"M480 93 L 480 101\" stroke=\"var(--exc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl2)\"/><rect x=\"20\" y=\"102\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><rect x=\"30\" y=\"116\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--exc)\"/><text x=\"120\" y=\"133\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--exc)\">b) INCUMPLIMIENTO DEL FIN</text><text x=\"224\" y=\"124\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Total o parcial del objetivo, la actividad o el proyecto, o no adoptar</text><text x=\"224\" y=\"138\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">el comportamiento que fundamenta la concesión.</text><text x=\"930\" y=\"124\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">37.1.b</text><path d=\"M480 157 L 480 165\" stroke=\"var(--exc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl2)\"/><rect x=\"20\" y=\"166\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"30\" y=\"180\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"120\" y=\"197\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--warn)\">c) NO JUSTIFICAR</text><text x=\"224\" y=\"188\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Incumplimiento de la obligación de justificación o justificación</text><text x=\"224\" y=\"202\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">insuficiente, en los términos del art. 30.</text><text x=\"930\" y=\"188\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">37.1.c</text><path d=\"M480 221 L 480 229\" stroke=\"var(--warn)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl2)\"/><rect x=\"20\" y=\"230\" width=\"920\" height=\"40\" rx=\"10\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"30\" y=\"237\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"120\" y=\"254\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--warn)\">d) NO DAR PUBLICIDAD</text><text x=\"224\" y=\"252\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Incumplir las medidas de difusión del art. 18.4.</text><text x=\"930\" y=\"252\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">37.1.d</text><path d=\"M480 271 L 480 279\" stroke=\"var(--warn)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl2)\"/><rect x=\"20\" y=\"280\" width=\"920\" height=\"68\" rx=\"10\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"30\" y=\"301\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"120\" y=\"318\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--warn)\">e) OBSTRUIR EL CONTROL</text><text x=\"224\" y=\"302\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Resistencia, excusa, obstrucción o negativa a las actuaciones de</text><text x=\"224\" y=\"316\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">comprobación y control financiero de los arts. 14 y 15, y el incumplimiento</text><text x=\"224\" y=\"330\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">contable o registral que impida verificar el empleo de los fondos.</text><text x=\"930\" y=\"302\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">37.1.e</text><path d=\"M480 349 L 480 357\" stroke=\"var(--warn)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl2)\"/><rect x=\"20\" y=\"358\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"30\" y=\"366\" width=\"180\" height=\"38\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"120\" y=\"382.5\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--acc)\">f) INCUMPLIR OBLIGACIONES</text><text x=\"120\" y=\"395.5\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--acc)\">Y COMPROMISOS</text><text x=\"224\" y=\"380\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Los impuestos por la Administración o asumidos por el beneficiario,</text><text x=\"224\" y=\"394\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">siempre que afecten al modo de conseguir los objetivos.</text><text x=\"930\" y=\"380\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">37.1.f</text><path d=\"M480 413 L 480 421\" stroke=\"var(--acc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl2)\"/><rect x=\"20\" y=\"422\" width=\"920\" height=\"40\" rx=\"10\" fill=\"var(--panel)\" stroke=\"var(--line)\"/><rect x=\"30\" y=\"429\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--line)\"/><text x=\"120\" y=\"446\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"currentColor\">g) OTROS</text><text x=\"224\" y=\"444\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Los demás supuestos previstos en la normativa reguladora de la subvención.</text><text x=\"930\" y=\"444\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">37.1.g</text><rect x=\"20\" y=\"472\" width=\"920\" height=\"48\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"480\" y=\"492.828\" text-anchor=\"middle\" font-size=\"10.4\" fill=\"currentColor\">El reintegro no es una sanción: es la devolución de lo percibido más el INTERÉS DE DEMORA desde el pago de la subvención.</text><text x=\"480\" y=\"505.828\" text-anchor=\"middle\" font-size=\"10.4\" fill=\"currentColor\">Y es independiente de las sanciones que en su caso resulten exigibles (art. 40.1).</text></svg>"}, {"n": 38, "t": "Naturaleza de los créditos a reintegrar y de los procedimientos para su exigencia", "ubic": "Título II · Del reintegro de subvenciones ▸ Capítulo I · Del reintegro", "idea": "Ingresos de derecho público, procedimiento siempre administrativo e interés legal más un 25 %.", "literal": "<p><b>1.</b> Las cantidades a reintegrar tendrán la consideración de ingresos de derecho público, resultando de aplicación para su cobranza lo previsto en la Ley General Presupuestaria.</p><p><b>2.</b> El interés de demora aplicable en materia de subvenciones será el interés legal del dinero incrementado en un 25 por ciento, salvo que la Ley de Presupuestos Generales del Estado establezca otro diferente.</p><p><b>3.</b> El destino de los reintegros de los fondos de la Unión Europea tendrá el tratamiento que en su caso determine la normativa comunitaria.</p><p><b>4.</b> Los procedimientos para la exigencia del reintegro de las subvenciones, tendrán siempre carácter administrativo.</p>", "dis": "<ul>\n<li><b>Naturaleza (38.1):</b> las cantidades a reintegrar tienen la consideración de <b>ingresos de derecho público</b>, y para su cobranza se aplica lo previsto en la <b>Ley General Presupuestaria</b>.</li>\n<li><b><span class=\"t\" data-k=\"demora\">Interés de demora</span> (38.2):</b> «el interés de demora aplicable en materia de subvenciones será el <b>interés legal del dinero incrementado en un 25 por ciento</b>, salvo que la Ley de Presupuestos Generales del Estado establezca otro diferente».</li>\n<li><b>Fondos europeos (38.3):</b> el destino de los reintegros de fondos de la Unión Europea tendrá el tratamiento que determine la normativa comunitaria.</li>\n<li><b>Procedimiento (38.4):</b> los procedimientos para la exigencia del reintegro «tendrán <b>siempre carácter administrativo</b>».</li>\n</ul>", "llano": "<p>Lo que hay que devolver es dinero público, y se cobra como se cobran los tributos: por la vía administrativa, con apremio si hace falta. Y se devuelve con un interés especial: el interés legal del dinero <b>más un 25 %</b>.</p>", "porque": "<p>Porque si el reintegro fuera un crédito civil, la Administración tendría que demandar al beneficiario y esperar años. Calificarlo como <b>ingreso de derecho público</b> le permite usar la vía de apremio: embargar sin necesidad de sentencia.</p>\n<p>Y el recargo del 25 % sobre el interés legal cumple una función preventiva: hace que retener dinero público indebidamente sea más caro que un préstamo bancario.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> la diferencia entre que te reclame una deuda un particular —que tiene que demandarte— y que te la reclame Hacienda, que puede embargarte directamente.</li>\n<li><b>Real:</b> una subvención de 18.000 € pagada el 1 de marzo de 2023, cuyo reintegro se acuerda el 1 de marzo de 2025. Si el interés legal del período fuera del 3,25 %, el aplicable sería <b>3,25 × 1,25 = 4,0625 %</b>, y el interés de demora se calcularía sobre esos dos años desde el pago.</li>\n<li><b>Caso límite:</b> si la Ley de Presupuestos Generales del Estado fijara un interés de demora distinto para el ejercicio, se aplicaría ese, no el resultado de la fórmula general (38.2).</li>\n</ul>", "noej": "<ul>\n<li><b>No es un crédito civil</b>: es un ingreso de derecho público.</li>\n<li><b>No cabe</b> exigir el reintegro por la vía civil: el procedimiento es <b>siempre</b> administrativo.</li>\n<li><b>No es el interés legal a secas</b>: es el interés legal <b>incrementado en un 25 %</b>.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 37.1:</b> el interés de demora se exige desde el pago de la subvención.</li>\n<li><b>Art. 42:</b> procedimiento administrativo de reintegro.</li>\n<li><b>Art. 41:</b> competencia del órgano concedente.</li>\n<li><b>Ley General Presupuestaria</b> <i>(aportación externa)</i>: régimen de cobranza de los ingresos de derecho público.</li>\n</ul>", "trampas": "<ul>\n<li><b>Interés legal + 25 %</b>, no «un 25 % de recargo» sobre la deuda.</li>\n<li>La Ley de Presupuestos puede fijar otro: la fórmula es <b>supletoria</b>.</li>\n<li>«<b>Siempre</b> carácter administrativo»: no hay excepción.</li>\n</ul>", "ancla": "<p><b>«Público, administrativo y legal más 25.»</b> Tres palabras y una cifra.</p>", "vis": "<svg viewBox=\"0 0 960 296\" role=\"img\" aria-label=\"Naturaleza de las cantidades a reintegrar, interés de demora y carácter del procedimiento\" style=\"width:100%;height:auto\"><defs><marker id=\"fl3\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr3\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe3\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw3\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"250\" y=\"8\" width=\"460\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"27.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">NATURALEZA DEL CRÉDITO A REINTEGRAR · ART. 38</text><rect x=\"20\" y=\"52\" width=\"219.5\" height=\"190\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"129.75\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--acc)\">QUÉ SON</text><text x=\"129.75\" y=\"89\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">INGRESOS DE DERECHO</text><text x=\"129.75\" y=\"102\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">PÚBLICO</text><text x=\"129.75\" y=\"115\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"129.75\" y=\"128\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Para su cobranza se aplica</text><text x=\"129.75\" y=\"141\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">la Ley General</text><text x=\"129.75\" y=\"154\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">Presupuestaria: cabe la</text><text x=\"129.75\" y=\"167\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">vía de apremio</text><text x=\"129.75\" y=\"180\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\"></text><text x=\"129.75\" y=\"193\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">art. 38.1</text><rect x=\"253.5\" y=\"52\" width=\"219.5\" height=\"190\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"363.25\" y=\"76\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--warn)\">INTERÉS DE DEMORA</text><text x=\"363.25\" y=\"89\"

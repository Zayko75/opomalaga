<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Ley 39/2015 · LPAC · Arts. 112 a 126 · Los recursos administrativos: alzada, reposición y revisión</title>
<style>

/* ═══════════════════════════════════════════════════════════════
   SISTEMA DE DISEÑO · "Académico Gamificado" · Bloque II
   Temas 8, 9 y 10 · Auxiliar Administrativo
   ═══════════════════════════════════════════════════════════════ */
:root{
  --fs:16px;

  --bg:#faf9f7;
  --bg-grad:radial-gradient(1100px 560px at 12% -8%, #ede9ff 0%, transparent 55%),
            radial-gradient(850px 460px at 96% 0%, #dcf5ee 0%, transparent 50%);
  --surface:#ffffff;
  --surface-2:#f4f3f0;
  --surface-3:#eceae5;
  --line:#e6e3dc;
  --line-strong:#d4d0c7;

  --ink:#15161c;
  --ink-2:#5d616e;
  --ink-3:#8b8f9c;

  --brand:#5b3df5;
  --brand-2:#7c5cff;
  --brand-soft:#efeaff;
  --brand-ring:rgba(91,61,245,.18);

  --legal:#4338ca;  --legal-bg:#eeecff;
  --ej:#059669;     --ej-bg:#e4f7f0;
  --warn:#c2690a;   --warn-bg:#fdf1de;
  --exc:#dc2626;    --exc-bg:#ffeceb;

  --ok:#16a34a; --ok-soft:#e7f7ec;
  --mid:#eab308; --mid-soft:#fdf6dd;
  --off:#a1a1aa; --off-soft:#f1f1f3;

  --sh-1:0 1px 2px rgba(20,20,30,.04), 0 2px 8px rgba(20,20,30,.04);
  --sh-2:0 2px 6px rgba(20,20,30,.05), 0 12px 28px rgba(20,20,30,.07);
  --sh-3:0 8px 20px rgba(91,61,245,.13), 0 24px 56px rgba(20,20,30,.10);
  --sh-glow:0 0 0 4px var(--brand-ring);

  --r-sm:9px; --r-md:14px; --r-lg:20px; --r-full:999px;

  --f-display:"Segoe UI Variable Display",system-ui,-apple-system,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-legal:ui-serif,Georgia,Cambria,"Times New Roman",serif;
  --f-mono:ui-monospace,"SF Mono","Cascadia Mono","Segoe UI Mono",Menlo,monospace;

  --t-h1:clamp(1.02rem,.95rem + .3vw,1.2rem);
  --t-h2:clamp(1.2rem,1.05rem + .6vw,1.55rem);
  --t-h3:clamp(1rem,.95rem + .25vw,1.12rem);
  --t-sm:.86rem;
  --t-xs:.75rem;

  --e-out:cubic-bezier(.22,1,.36,1);
  --e-spring:cubic-bezier(.34,1.56,.64,1);

  /* ── Compatibilidad con SVG y contenido generado ── */
  --panel:var(--surface);
  --ink2:var(--ink-2);
  --acc:var(--brand);
  --acc-soft:var(--brand-soft);
  --g:var(--ok); --y:var(--mid); --r:var(--exc);
}

html[data-theme="dark"]{
  --bg:#0a0b0f;
  --bg-grad:radial-gradient(1100px 560px at 12% -8%, #1c1740 0%, transparent 55%),
            radial-gradient(850px 460px at 96% 0%, #08302b 0%, transparent 50%);
  --surface:#13151b;
  --surface-2:#1a1d25;
  --surface-3:#232733;
  --line:#262a34;
  --line-strong:#343947;

  --ink:#eceef4;
  --ink-2:#9ba2b3;
  --ink-3:#6e7585;

  --brand:#8b6dff;
  --brand-2:#a78bff;
  --brand-soft:#1e1a3d;
  --brand-ring:rgba(139,109,255,.22);

  --legal:#a5b4fc; --legal-bg:#191b3a;
  --ej:#34d399;    --ej-bg:#0c2a24;
  --warn:#fbbf24;  --warn-bg:#2e2110;
  --exc:#fb7185;   --exc-bg:#331119;

  --ok:#4ade80; --ok-soft:#0e2a19;
  --mid:#facc15; --mid-soft:#2c2610;
  --off:#5b6070; --off-soft:#1c1f27;

  --sh-1:0 1px 2px rgba(0,0,0,.3), 0 2px 8px rgba(0,0,0,.25);
  --sh-2:0 2px 6px rgba(0,0,0,.35), 0 12px 28px rgba(0,0,0,.4);
  --sh-3:0 8px 20px rgba(139,109,255,.2), 0 24px 56px rgba(0,0,0,.5);
}

*,*::before,*::after{box-sizing:border-box}
html{font-size:var(--fs);scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);background-image:var(--bg-grad);
  background-attachment:fixed;background-repeat:no-repeat;
  color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.68;
  -webkit-font-smoothing:antialiased;
  transition:background-color .5s var(--e-out),color .3s;
}
::selection{background:var(--brand);color:#fff}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{font-family:var(--f-display);letter-spacing:-.022em;line-height:1.2}
.num{font-variant-numeric:tabular-nums}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:99px;border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3)}

/* ═══ HEADER ═══ */
header.top{
  position:sticky;top:0;z-index:60;
  background:color-mix(in srgb,var(--surface) 80%,transparent);
  backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);
  border-bottom:1px solid var(--line);
}
.top-in{max-width:1280px;margin:0 auto;padding:.65rem 1.1rem;display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.brandwrap{display:flex;align-items:center;gap:.65rem;min-width:0;flex:1}
.mark{
  width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;
  font-weight:800;font-size:.8rem;letter-spacing:-.02em;text-decoration:none;
  box-shadow:0 4px 14px var(--brand-ring);
  transition:transform .3s var(--e-spring),box-shadow .3s;
}
.mark:hover{transform:rotate(-8deg) scale(1.08);box-shadow:var(--sh-3);text-decoration:none}
.top h1{font-size:var(--t-h1);margin:0;font-weight:800;line-height:1.25;min-width:0}
.top h1 .sub{display:block;font-size:var(--t-xs);color:var(--ink-2);font-weight:500;letter-spacing:0;
  margin-top:.1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tools{margin-left:auto;display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}

button,select,input[type=search]{
  font:inherit;font-size:var(--t-sm);font-weight:600;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:var(--r-sm);padding:.4rem .72rem;cursor:pointer;
  position:relative;overflow:hidden;
  transition:transform .18s var(--e-spring),border-color .2s,background .2s,box-shadow .2s,color .2s;
}
button:hover{transform:translateY(-1.5px);border-color:var(--brand);box-shadow:var(--sh-1)}
button:active{transform:translateY(0) scale(.97)}
button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible{outline:none;box-shadow:var(--sh-glow)}
input[type=search]{min-width:190px;cursor:text;font-weight:500}
input[type=search]:focus{border-color:var(--brand)}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--surface-2);padding:2px;gap:2px}
.seg button{border:0;border-radius:calc(var(--r-sm) - 2px);padding:.32rem .68rem;background:transparent;box-shadow:none}
.seg button:hover{transform:none;background:var(--surface)}
.seg button[aria-pressed="true"]{background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;box-shadow:0 2px 8px var(--brand-ring)}

.ripple{position:absolute;border-radius:50%;transform:scale(0);background:currentColor;opacity:.25;animation:rip .55s linear;pointer-events:none}
@keyframes rip{to{transform:scale(3.4);opacity:0}}

.progress{position:absolute;left:0;bottom:-1px;height:2.5px;width:0;
  background:linear-gradient(90deg,var(--brand),var(--legal),var(--ej));transition:width .1s linear}

/* ═══ LAYOUT ═══ */
.layout{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:270px 1fr;gap:1.8rem;padding:1.4rem 1.1rem 5rem}
main{min-width:0}

/* ═══ SIDEBAR ═══ */
nav.side{
  position:sticky;top:76px;align-self:start;max-height:calc(100vh - 96px);overflow:auto;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:.85rem;box-shadow:var(--sh-1);
}
nav.side h2{font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);
  margin:.5rem .4rem .5rem;font-weight:800}
nav.side h2:first-child{margin-top:.1rem}
nav.side a{
  display:flex;align-items:baseline;gap:.5rem;padding:.36rem .55rem;border-radius:var(--r-sm);
  text-decoration:none;color:var(--ink-2);font-size:var(--t-sm);font-weight:500;
  position:relative;transition:background .22s,color .22s,transform .22s var(--e-out);
}
nav.side a:hover{background:var(--surface-2);color:var(--ink);transform:translateX(3px);text-decoration:none}
nav.side a.on{background:var(--brand-soft);color:var(--brand);font-weight:700}
nav.side a.on::before{content:"";position:absolute;left:-.85rem;top:20%;bottom:20%;width:3px;
  border-radius:0 3px 3px 0;background:var(--brand)}
nav.side a b{color:var(--ink-3);font-weight:800;font-size:var(--t-xs);font-variant-numeric:tabular-nums;flex:none;min-width:1.9em}
nav.side a.on b{color:var(--brand)}
.navtoggle{display:none}

/* ═══ TARJETAS ═══ */
section.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:1.35rem 1.5rem;margin-bottom:1.1rem;box-shadow:var(--sh-1);
  transition:box-shadow .3s var(--e-out),border-color .3s;
}
section.card:hover{box-shadow:var(--sh-2)}
section.card>h2{
  margin:0 0 1rem;font-size:var(--t-h2);font-weight:800;
  display:flex;align-items:center;gap:.6rem;
}
section.card>h2::before{
  content:"";width:4px;height:1.05em;border-radius:99px;flex:none;
  background:linear-gradient(180deg,var(--brand),var(--brand-2));
}

/* ═══ ARTÍCULO ═══ */
.art{scroll-margin-top:86px;padding-top:.4rem}
.art + .art{margin-top:1.6rem;padding-top:1.6rem;border-top:1px dashed var(--line)}
.art h2{display:flex;flex-wrap:wrap;gap:.5rem;align-items:baseline;font-size:var(--t-h3);
  margin:0 0 .25rem;font-weight:800;letter-spacing:-.015em}
.art h2 .num{
  color:var(--brand);font-weight:800;font-family:var(--f-display);
  background:var(--brand-soft);padding:.1rem .5rem;border-radius:var(--r-sm);
  font-size:.92em;letter-spacing:-.02em;
}
.ubic{font-size:var(--t-xs);color:var(--ink-3);margin:0 0 .8rem;font-weight:600;
  letter-spacing:.03em;text-transform:uppercase}

/* ═══ IDEA CLAVE ═══ */
.idea{
  background:linear-gradient(100deg,var(--brand-soft),color-mix(in srgb,var(--brand-soft) 40%,transparent));
  border-left:4px solid var(--brand);border-radius:0 var(--r-md) var(--r-md) 0;
  padding:.75rem 1rem;font-weight:650;margin:.7rem 0 1rem;position:relative;
  font-size:.97rem;line-height:1.55;
}

/* ═══ ACORDEÓN ═══ */
details.panel{
  border:1px solid var(--line);border-radius:var(--r-md);margin:.6rem 0;
  background:var(--surface);overflow:hidden;
  transition:border-color .25s,box-shadow .25s,background .25s;
}
details.panel:hover{border-color:var(--line-strong)}
details.panel[open]{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-ring)}
details.panel>summary{
  cursor:pointer;padding:.62rem .9rem;font-weight:700;font-size:.93rem;
  list-style:none;display:flex;align-items:center;gap:.55rem;
  transition:background .2s,color .2s;
}
details.panel>summary:hover{background:var(--surface-2)}
details.panel[open]>summary{background:var(--brand-soft);color:var(--brand)}
details.panel>summary::-webkit-details-marker{display:none}
details.panel>summary::before{
  content:"";width:16px;height:16px;flex:none;border-radius:5px;
  background:var(--brand-soft);position:relative;transition:transform .3s var(--e-spring),background .25s;
}
details.panel>summary::after{
  content:"";position:absolute;width:0;height:0;margin-left:5px;
  border:4px solid transparent;border-left-color:var(--brand);
  transition:transform .3s var(--e-spring);
}
details.panel[open]>summary::before{background:var(--surface)}
details.panel[open]>summary::after{transform:rotate(90deg) translateX(-1px)}
details.panel .body{padding:.3rem 1rem 1rem;font-size:.95rem;animation:slidein .35s var(--e-out)}
@keyframes slidein{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* ═══ TEXTO LEGAL ═══ */
.legal{
  background:var(--legal-bg);border-left:4px solid var(--legal);
  border-radius:0 var(--r-md) var(--r-md) 0;padding:.85rem 1.05rem;
  font-family:var(--f-legal);font-size:.95rem;line-height:1.7;
}
.legal p{margin:.45rem 0}
.legal .lbl{
  font-family:var(--f-body);font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;
  color:var(--legal);font-weight:800;display:block;margin-bottom:.4rem;
}

/* ═══ CAJAS SEMÁNTICAS ═══ */
.box{
  border-left:4px solid var(--line);border-radius:0 var(--r-md) var(--r-md) 0;
  padding:.72rem .95rem;margin:.65rem 0;font-size:.94rem;
  transition:transform .25s var(--e-out),box-shadow .25s;
}
.box:hover{transform:translateX(3px);box-shadow:var(--sh-1)}
.box.ej{background:var(--ej-bg);border-color:var(--ej)}
.box.warn{background:var(--warn-bg);border-color:var(--warn)}
.box.exc{background:var(--exc-bg);border-color:var(--exc)}
.box .lbl{font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;font-weight:800;
  display:block;margin-bottom:.3rem}
.box.ej .lbl{color:var(--ej)}
.box.warn .lbl{color:var(--warn)}
.box.exc .lbl{color:var(--exc)}

.interp{
  border:1px dashed var(--warn);background:color-mix(in srgb,var(--warn-bg) 45%,transparent);
  border-radius:var(--r-md);padding:.65rem .9rem;font-size:.9rem;margin:.6rem 0;
}
.interp .lbl{font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;color:var(--warn);font-weight:800;display:block}

/* ═══ TABLAS ═══ */
table{width:100%;border-collapse:separate;border-spacing:0;font-size:.9rem;margin:.7rem 0;
  border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
th,td{padding:.5rem .68rem;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
td + td, th + th{border-left:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th{background:var(--surface-2);font-size:var(--t-xs);font-weight:800;letter-spacing:.05em;
  text-transform:uppercase;color:var(--ink-2);position:sticky;top:0}
tbody tr{transition:background .18s}
tbody tr:nth-child(even){background:color-mix(in srgb,var(--surface-2) 45%,transparent)}
tbody tr:hover{background:var(--brand-soft)}
th.sortable{cursor:pointer;user-select:none;transition:color .2s,background .2s}
th.sortable:hover{color:var(--brand);background:var(--brand-soft)}
th.sortable::after{content:" ⇅";color:var(--ink-3);font-size:.7rem}

ul,ol{margin:.5rem 0 .5rem 1.2rem;padding:0}
li{margin:.26rem 0}
li::marker{color:var(--brand);font-weight:700}

/* ═══ TOOLTIPS ═══ */
.t{border-bottom:1.5px dotted var(--brand);cursor:help;position:relative;
  transition:background .2s,color .2s}
.t:hover{background:var(--brand-soft);color:var(--brand);border-radius:3px}
#tip{
  position:fixed;z-index:99;max-width:330px;background:var(--ink);color:var(--bg);
  padding:.6rem .78rem;border-radius:var(--r-md);font-size:.82rem;line-height:1.5;
  display:none;box-shadow:0 8px 30px rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.08);
}
html[data-theme="dark"] #tip{background:#f0f1f5;color:#15161c}

/* ═══ FLECHAS DE DIAGRAMA ═══
   Un <path> con stroke pero sin fill toma el valor inicial (negro) y el
   navegador cierra el trazo implícitamente: aparece un triángulo relleno
   entre sus extremos. Forzamos fill:none para dejar solo la línea + la
   punta del <marker>, que sí lleva su color. */
svg path[stroke]:not([fill]){fill:none}
svg polyline:not([fill]){fill:none}
svg line{fill:none}

/* ═══ SVG ═══ */
svg{max-width:100%;height:auto;display:block;margin:.9rem auto}
svg text{font-family:var(--f-body)}

/* ═══ BUSCADOR ═══ */
mark.hit{background:linear-gradient(180deg,transparent 55%,#ffe066 55%);color:inherit;
  border-radius:2px;padding:0 1px;font-weight:600}
html[data-theme="dark"] mark.hit{background:linear-gradient(180deg,transparent 55%,#8a6d00 55%);color:#fff}

/* ═══ UTILIDADES ═══ */
.hide{display:none !important}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.small{font-size:var(--t-sm);color:var(--ink-2)}
.chip{
  display:inline-block;font-size:var(--t-xs);padding:.16rem .55rem;border-radius:var(--r-full);
  background:var(--brand-soft);color:var(--brand);font-weight:800;letter-spacing:.02em;
}

/* ═══ HUECOS RELLENABLES ═══ */
.gap{
  display:inline-block;min-width:5.5em;border-bottom:2px solid var(--brand);
  text-align:center;font-weight:700;color:transparent;cursor:pointer;
  transition:color .3s,background .3s;
}
.gap.on,.gap:hover{color:var(--brand);background:var(--brand-soft);border-radius:4px 4px 0 0}

/* ═══ REVELAR SOLUCIÓN ═══ */
.revelar{
  background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;border-color:transparent;
  font-weight:700;
}
.revelar:hover{box-shadow:var(--sh-3)}
.sol{
  margin-top:.7rem;padding:.8rem 1rem;border-radius:var(--r-md);
  background:var(--ej-bg);border-left:4px solid var(--ej);
  animation:slidein .4s var(--e-out);
}

/* ═══ TEST ═══ */
.opt{
  display:block;padding:.55rem .85rem;margin:.35rem 0;border:1.5px solid var(--line);
  border-radius:var(--r-md);cursor:pointer;background:var(--surface);font-size:.94rem;
  transition:border-color .22s,background .22s,transform .22s var(--e-out);
}
.opt:hover{border-color:var(--brand);background:var(--brand-soft);transform:translateX(4px)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft);font-weight:650}
.opt.ko{border-color:var(--exc);background:var(--exc-bg)}
.opt input{margin-right:.5rem;accent-color:var(--brand)}

#tscore,#semres{
  font-family:var(--f-display);font-weight:800;font-size:1.15rem;letter-spacing:-.02em;
}

/* ═══════════════════════════════════════════════════════════════
   FLASHCARDS 3D · mazo con giro, vuelo de salida y sheen
   ═══════════════════════════════════════════════════════════════ */
#flash{--fc-e:cubic-bezier(.2,.8,.25,1);--fc-h:250px}

/* — Escena — */
.fc-stage{
  perspective:1400px;perspective-origin:50% 45%;
  padding:.4rem 0 .2rem;position:relative;
}
.fc-deck{position:relative;height:var(--fc-h);will-change:transform}

/* — Cartas fantasma del mazo — */
.fc-ghost{
  position:absolute;inset:0;border-radius:var(--r-lg);
  background:var(--surface);border:1px solid var(--line);
  transition:transform .5s var(--fc-e),opacity .5s var(--fc-e);
}
.fc-ghost.g1{transform:translateY(9px) scale(.972);opacity:.75}
.fc-ghost.g2{transform:translateY(18px) scale(.944);opacity:.45}
.fc-deck.empty .fc-ghost{opacity:0;transform:translateY(26px) scale(.9)}

/* — Elevación durante el giro — */
.fc-lift{position:absolute;inset:0;transform-style:preserve-3d}
.fc-lift.lift{animation:fcLift .78s var(--fc-e)}
@keyframes fcLift{
  0%,100%{transform:scale(1) translateY(0)}
  45%{transform:scale(1.055) translateY(-16px)}
}
.fc-lift.out-ok{animation:fcOut .5s cubic-bezier(.5,0,.75,0) forwards}
.fc-lift.out-ko{animation:fcOutKo .5s cubic-bezier(.5,0,.75,0) forwards}
.fc-lift.in{animation:fcIn .48s var(--fc-e)}
@keyframes fcOut{
  0%{transform:translateX(0) rotate(0) scale(1);opacity:1}
  100%{transform:translateX(130%) rotate(17deg) scale(.85);opacity:0}
}
@keyframes fcOutKo{
  0%{transform:translateX(0) rotate(0) scale(1);opacity:1}
  100%{transform:translateX(-130%) rotate(-17deg) scale(.85);opacity:0}
}
@keyframes fcIn{
  0%{transform:translateY(26px) scale(.9);opacity:0}
  100%{transform:translateY(0) scale(1);opacity:1}
}

/* — La carta — */
.fc-card{
  position:absolute;inset:0;transform-style:preserve-3d;
  transition:transform .78s var(--fc-e);
  cursor:pointer;border-radius:var(--r-lg);
}
.fc-card:focus-visible{outline:none}
.fc-card:focus-visible .fc-face{box-shadow:var(--sh-glow),var(--sh-2)}

/* — Caras — */
.fc-face{
  position:absolute;inset:0;border-radius:var(--r-lg);
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  padding:2rem 2.2rem;text-align:center;overflow:hidden;
  box-shadow:var(--sh-2);
  transition:box-shadow .4s var(--fc-e);
}
.fc-card:hover .fc-face{box-shadow:var(--sh-3)}

/* Anverso · pregunta */
.fc-front{
  background:
    radial-gradient(120% 90% at 50% -20%, var(--brand-soft) 0%, transparent 60%),
    var(--surface);
  border:1.5px solid var(--line);color:var(--ink);
}
/* Reverso · respuesta */
.fc-back{
  transform:rotateY(180deg);
  background:linear-gradient(145deg,var(--brand) 0%,#6d4bf7 45%,var(--c5,#0891b2) 130%);
  border:1.5px solid transparent;color:#fff;
}
html[data-theme="dark"] .fc-back{
  background:linear-gradient(145deg,#5f45c9 0%,#4b3aa8 45%,#0e6b85 130%);
}
.fc-back .fc-txt{color:#fff}
.fc-back b,.fc-back strong{color:#fff;font-weight:800}

/* — Sheen que barre al girar — */
.fc-face::after{
  content:"";position:absolute;top:-60%;left:-70%;width:55%;height:220%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.42),transparent);
  transform:rotate(18deg);opacity:0;pointer-events:none;
}
.fc-lift.lift .fc-face::after{animation:fcSheen .78s var(--fc-e)}
@keyframes fcSheen{
  0%{opacity:0;left:-70%}
  35%{opacity:1}
  100%{opacity:0;left:150%}
}

/* — Etiqueta superior — */
.fc-tag{
  position:absolute;top:1rem;left:1.15rem;
  font-size:var(--t-xs);font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  display:inline-flex;align-items:center;gap:.4rem;
}
.fc-front .fc-tag{color:var(--brand)}
.fc-back .fc-tag{color:rgba(255,255,255,.9)}
.fc-tag::before{
  content:"";width:7px;height:7px;border-radius:50%;background:currentColor;
  animation:fcPulse 2.2s ease-in-out infinite;
}
@keyframes fcPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.65)}}

/* — Índice tipo naipe — */
.fc-pip{
  position:absolute;font-family:var(--f-display);font-weight:800;
  font-size:.78rem;letter-spacing:-.02em;opacity:.34;font-variant-numeric:tabular-nums;
}
.fc-pip.tr{top:1rem;right:1.15rem}
.fc-pip.bl{bottom:1rem;left:1.15rem;transform:rotate(180deg)}
.fc-front .fc-pip{color:var(--ink-2)}
.fc-back .fc-pip{color:#fff;opacity:.55}

/* — Texto — */
.fc-txt{
  font-size:clamp(1rem,.9rem + .55vw,1.28rem);font-weight:650;line-height:1.5;
  max-width:44ch;letter-spacing:-.012em;
}
.fc-front .fc-txt{font-family:var(--f-display);font-weight:700}
.fc-back .fc-txt{font-weight:600;line-height:1.6}
.fc-hint{
  position:absolute;bottom:1rem;left:0;right:0;
  font-size:var(--t-xs);font-weight:600;letter-spacing:.02em;
  display:flex;align-items:center;justify-content:center;gap:.4rem;
}
.fc-front .fc-hint{color:var(--ink-3)}
.fc-back .fc-hint{color:rgba(255,255,255,.72)}
.fc-hint .kbd{
  font-family:var(--f-mono);font-size:.68rem;font-weight:700;padding:.1rem .32rem;
  border-radius:5px;border:1px solid currentColor;opacity:.75;
}

/* — Pantalla final — */
.fc-done{
  position:absolute;inset:0;border-radius:var(--r-lg);
  background:linear-gradient(150deg,var(--ok-soft),var(--surface) 70%);
  border:1.5px solid var(--ok);
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  text-align:center;padding:2rem;gap:.35rem;
  animation:fcIn .5s var(--fc-e);box-shadow:var(--sh-2);
}
.fc-done .seal{
  font-size:2.6rem;line-height:1;
  animation:fcSeal .7s cubic-bezier(.2,1.5,.4,1);
}
@keyframes fcSeal{0%{transform:scale(0) rotate(-25deg);opacity:0}60%{transform:scale(1.2) rotate(6deg)}100%{transform:scale(1) rotate(0);opacity:1}}
.fc-done h3{font-size:1.3rem;font-weight:800;margin:.2rem 0 0}
.fc-done p{margin:0;color:var(--ink-2);font-size:var(--t-sm)}

/* — Barra de progreso de la ronda — */
.fc-bar{
  height:6px;border-radius:99px;background:var(--surface-3);
  overflow:hidden;margin:.95rem 0 .8rem;position:relative;
}
.fc-bar i{
  display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--brand),var(--c5,#0891b2));
  transition:width .55s var(--fc-e);
}

/* — Controles — */
.fc-ctrls{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.fc-ctrls button{font-weight:700}
#fcok{border-color:var(--ok);color:var(--ok)}
#fcok:hover{background:var(--ok);color:#fff;border-color:var(--ok)}
#fcko{border-color:var(--warn);color:var(--warn)}
#fcko:hover{background:var(--warn);color:#fff;border-color:var(--warn)}
#fcflip{background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;border-color:transparent}
#fcflip:hover{box-shadow:var(--sh-3)}

.fc-score{display:inline-flex;gap:.45rem;margin-left:auto;align-items:center}
.fc-pill{
  font-size:var(--t-xs);font-weight:800;padding:.24rem .6rem;border-radius:var(--r-full);
  font-variant-numeric:tabular-nums;border:1px solid;
}
.fc-pill.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.fc-pill.ko{color:var(--warn);border-color:var(--warn);background:var(--warn-bg)}
.fc-pill.left{color:var(--ink-2);border-color:var(--line);background:var(--surface-2)}
.fc-pill.bump{animation:fcBump .45s var(--e-spring)}
@keyframes fcBump{0%{transform:scale(1)}45%{transform:scale(1.28)}100%{transform:scale(1)}}

@media(max-width:620px){
  #flash{--fc-h:270px}
  .fc-face{padding:1.7rem 1.3rem}
  .fc-score{margin-left:0;width:100%}
}
@media(prefers-reduced-motion:reduce){
  .fc-card{transition:none}
  .fc-lift.lift,.fc-lift.in,.fc-lift.out-ok,.fc-lift.out-ko,.fc-face::after{animation:none !important}
}
@media print{.fc-stage,.fc-ctrls,.fc-bar{display:none !important}}
/* ═══ RESPUESTA ESTRUCTURADA ═══ */
.fc-face{justify-content:center}
.fc-face.struct{justify-content:flex-start;text-align:left;padding-top:3.1rem;padding-bottom:3.1rem}
.fc-body{
  width:100%;max-width:46ch;margin:0 auto;
  overflow-y:auto;max-height:100%;
  scrollbar-width:thin;
}
.fc-body::-webkit-scrollbar{width:5px}
.fc-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.35);border-radius:99px;border:0}
.fc-front .fc-body::-webkit-scrollbar-thumb{background:var(--line-strong)}

/* — Veredicto Sí / No — */
.fc-verdict{
  display:inline-flex;align-items:center;gap:.35rem;
  font-family:var(--f-display);font-weight:800;font-size:.82rem;
  letter-spacing:.06em;text-transform:uppercase;
  padding:.26rem .72rem;border-radius:var(--r-full);margin-bottom:.85rem;
  border:1.5px solid;animation:fcPopIn .45s var(--e-spring) backwards;animation-delay:.34s;
}
.fc-verdict.si{background:rgba(255,255,255,.16);border-color:rgba(190,255,215,.85);color:#d8ffe9}
.fc-verdict.no{background:rgba(255,255,255,.16);border-color:rgba(255,205,205,.85);color:#ffdedd}
@keyframes fcPopIn{0%{opacity:0;transform:scale(.7) translateY(6px)}100%{opacity:1;transform:none}}

/* — Párrafo — */
.fc-p{margin:0;font-size:clamp(1rem,.92rem + .45vw,1.2rem);font-weight:600;line-height:1.6}
.fc-face.struct .fc-p{font-size:clamp(.96rem,.9rem + .35vw,1.1rem)}

/* — Lista enumerada — */
.fc-list{list-style:none;margin:0;padding:0;display:grid;gap:.5rem;counter-reset:fc}
.fc-list li{
  counter-increment:fc;position:relative;margin:0;
  padding:.42rem .6rem .42rem 2.5rem;border-radius:var(--r-sm);
  background:rgba(255,255,255,.11);
  font-size:clamp(.92rem,.88rem + .3vw,1.04rem);font-weight:600;line-height:1.45;
  animation:fcRow .42s var(--e-out) backwards;
}
.fc-list li::before{
  content:counter(fc);position:absolute;left:.6rem;top:50%;transform:translateY(-50%);
  width:1.6rem;height:1.6rem;border-radius:50%;
  display:grid;place-items:center;
  background:rgba(255,255,255,.9);color:var(--brand);
  font-family:var(--f-display);font-weight:800;font-size:.78rem;
  font-variant-numeric:tabular-nums;
}
.fc-list.alpha li::before{content:counter(fc,lower-alpha)}
.fc-list li:nth-child(1){animation-delay:.36s}
.fc-list li:nth-child(2){animation-delay:.42s}
.fc-list li:nth-child(3){animation-delay:.48s}
.fc-list li:nth-child(4){animation-delay:.54s}
.fc-list li:nth-child(5){animation-delay:.60s}
.fc-list li:nth-child(n+6){animation-delay:.66s}
@keyframes fcRow{0%{opacity:0;transform:translateX(-12px)}100%{opacity:1;transform:none}}

/* — Cláusulas contrapuestas — */
.fc-clauses{display:grid;gap:.45rem}
.fc-clauses p{
  margin:0;padding:.45rem .7rem .45rem .95rem;border-radius:0 var(--r-sm) var(--r-sm) 0;
  background:rgba(255,255,255,.11);border-left:3px solid rgba(255,255,255,.55);
  font-size:clamp(.92rem,.88rem + .3vw,1.04rem);font-weight:600;line-height:1.5;
  animation:fcRow .42s var(--e-out) backwards;
}
.fc-clauses p:nth-child(1){animation-delay:.36s}
.fc-clauses p:nth-child(2){animation-delay:.44s}
.fc-clauses p:nth-child(3){animation-delay:.52s}

/* — Negritas resaltadas en el reverso — */
.fc-back .fc-body b,.fc-back .fc-body strong{
  font-weight:800;background:rgba(255,255,255,.2);
  padding:.03em .3em;border-radius:5px;
  box-decoration-break:clone;-webkit-box-decoration-break:clone;
}

/* — Cita legal al pie — */
.fc-cite{
  position:absolute;bottom:.95rem;left:0;right:0;
  display:inline-flex;align-items:center;justify-content:center;gap:.4rem;
  font-family:var(--f-mono);font-size:.74rem;font-weight:700;letter-spacing:.02em;
  color:rgba(255,255,255,.82);
  animation:fcPopIn .5s var(--e-out) backwards;animation-delay:.5s;
}
.fc-cite::before,.fc-cite::after{
  content:"";height:1px;width:clamp(18px,10%,52px);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.45));
}
.fc-cite::after{background:linear-gradient(90deg,rgba(255,255,255,.45),transparent)}
.fc-cite .s{font-size:.9rem;opacity:.75;font-family:var(--f-legal)}
.fc-front .fc-cite{color:var(--ink-3)}
.fc-front .fc-cite::before{background:linear-gradient(90deg,transparent,var(--line-strong))}
.fc-front .fc-cite::after{background:linear-gradient(90deg,var(--line-strong),transparent)}

/* la pista se oculta si hay cita, para no amontonar */
.fc-back .fc-cite ~ .fc-hint,.fc-back .fc-hint.muted{display:none}

@media(max-width:620px){
  #flash{--fc-h:320px}
  .fc-face.struct{padding-top:2.9rem;padding-bottom:2.8rem}
  .fc-list li{padding-left:2.3rem}
}
@media(prefers-reduced-motion:reduce){
  .fc-verdict,.fc-list li,.fc-clauses p,.fc-cite{animation:none !important}
}

/* ═══ SEMÁFORO ═══ */
.sembtn{
  border-radius:var(--r-full);padding:.32rem .7rem;font-weight:700;font-size:var(--t-sm);
}
.sembtn[data-v="g"]:hover,.sembtn.on[data-v="g"]{background:var(--ok);color:#fff;border-color:var(--ok)}
.sembtn[data-v="y"]:hover,.sembtn.on[data-v="y"]{background:var(--mid);color:#3d2f00;border-color:var(--mid)}
.sembtn[data-v="r"]:hover,.sembtn.on[data-v="r"]{background:var(--exc);color:#fff;border-color:var(--exc)}

/* ═══ CTA DE BLOQUE ═══ */
a.blk{
  display:inline-flex;align-items:center;gap:.5rem;
  background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;
  padding:.5rem .95rem;border-radius:var(--r-sm);font-weight:700;font-size:var(--t-sm);
  text-decoration:none;box-shadow:0 2px 10px var(--brand-ring);
  transition:transform .22s var(--e-spring),box-shadow .25s,gap .25s var(--e-out);
}
a.blk:hover{transform:translateY(-2px);box-shadow:var(--sh-3);gap:.75rem;text-decoration:none}
a.blk::after{content:"→"}
a.blk:active{transform:translateY(0) scale(.98)}

/* ═══ REVEAL ═══ */
.rv{opacity:0;transform:translateY(20px);transition:opacity .6s var(--e-out),transform .6s var(--e-out)}
.rv.in{opacity:1;transform:none}

/* ═══ RESPONSIVE ═══ */
@media(max-width:960px){
  .layout{grid-template-columns:1fr;padding-top:.9rem;gap:1rem}
  nav.side{position:static;max-height:none}
  nav.side.collapsed .navbody{display:none}
  .navtoggle{display:block;width:100%;text-align:left;font-weight:700}
  .grid2{grid-template-columns:1fr}
  .top h1 .sub{white-space:normal}
}
@media(max-width:620px){
  .top-in{padding:.55rem .8rem}
  .tools{width:100%;margin-left:0}
  input[type=search]{flex:1;min-width:0}
  section.card{padding:1.05rem 1rem;border-radius:var(--r-md)}
  table{font-size:.82rem}
  th,td{padding:.4rem .5rem}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
  .rv{opacity:1;transform:none}
}
@media print{
  header.top,nav.side,.tools,.noprint,.progress{display:none !important}
  body{background:#fff;background-image:none;font-size:11pt;color:#000}
  .layout{display:block;max-width:none;padding:0}
  section.card{border:0;padding:0;margin:0 0 1rem;break-inside:avoid;box-shadow:none}
  details.panel{border:0;box-shadow:none}
  details.panel .body{display:block !important}
  details.panel>summary{padding-left:0}
  .art{break-inside:avoid}
  .rv{opacity:1;transform:none}
  a{color:#000;text-decoration:none}
}


/* ═══ ALTURA ADAPTATIVA DE LA TARJETA ═══ */
.fc-deck{transition:height .45s var(--fc-e)}
.fc-body{max-height:none;overflow:visible}
.fc-measure{
  position:absolute;left:0;right:0;top:0;height:auto;
  visibility:hidden;pointer-events:none;z-index:-1;
}
.fc-measure .fc-face{
  position:relative;inset:auto;height:auto;min-height:0;
  box-shadow:none;backface-visibility:visible;transform:none;
}
.fc-measure .fc-body{max-height:none;overflow:visible}
.fc-measure .fc-face::after{display:none}

/* ═══ MOSTRAR / OCULTAR ÍNDICE LATERAL ═══ */
.layout{transition:grid-template-columns .42s var(--e-out)}
.layout.nonav{grid-template-columns:0 1fr;gap:0}
.layout.nonav>nav.side{
  opacity:0;transform:translateX(-14px);pointer-events:none;
  padding:0;border-width:0;overflow:hidden;width:0;min-width:0;
}
nav.side{
  transition:opacity .3s var(--e-out),transform .38s var(--e-out);
  overflow-x:hidden;
}
#navhide .ic{display:inline-block;transition:transform .35s var(--e-spring);font-size:.95em;line-height:1}
#navhide[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
#navhide[aria-pressed="true"] .ic{transform:rotate(90deg)}
@media(max-width:960px){#navhide{display:none}}

/* ═══════════════════════════════════════════════════════════════
   LECTURA EN VOZ ALTA (TTS) del texto legal
   ═══════════════════════════════════════════════════════════════ */
.tts-bar{
  display:flex;align-items:center;gap:.45rem;flex-wrap:wrap;
  margin:.15rem 0 .7rem;
}
.tts-bar button{
  font-size:var(--t-xs);font-weight:700;padding:.3rem .62rem;
  border-radius:var(--r-full);border:1px solid var(--legal);
  background:transparent;color:var(--legal);
  display:inline-flex;align-items:center;gap:.35rem;line-height:1.2;
}
.tts-bar button:hover{background:var(--legal);color:var(--surface);border-color:var(--legal)}
.tts-bar button[hidden]{display:none}
.tts-bar .tts-play.on{background:var(--legal);color:var(--surface)}

/* Ondas de audio mientras lee */
.tts-wave{display:inline-flex;align-items:flex-end;gap:2px;height:11px}
.tts-wave i{
  width:2.5px;background:currentColor;border-radius:2px;height:35%;
  animation:ttsW .9s ease-in-out infinite;
}
.tts-wave i:nth-child(2){animation-delay:.15s}
.tts-wave i:nth-child(3){animation-delay:.3s}
.tts-wave i:nth-child(4){animation-delay:.45s}
@keyframes ttsW{0%,100%{height:32%}50%{height:100%}}

.tts-time{
  font-family:var(--f-mono);font-size:.7rem;font-weight:700;
  color:var(--ink-3);font-variant-numeric:tabular-nums;
}

/* Frase que se está leyendo */
.tts-s{transition:background .25s,color .25s;border-radius:3px}
.tts-s.now{
  background:linear-gradient(180deg,transparent 8%,color-mix(in srgb,var(--legal) 26%,transparent) 8%);
  box-shadow:0 0 0 2px color-mix(in srgb,var(--legal) 16%,transparent);
}
html[data-theme="dark"] .tts-s.now{
  background:linear-gradient(180deg,transparent 8%,color-mix(in srgb,var(--legal) 34%,transparent) 8%);
}
.legal.tts-on{box-shadow:0 0 0 3px color-mix(in srgb,var(--legal) 20%,transparent)}

/* ═══ Reproductor flotante ═══ */
.tts-mini{
  position:fixed;left:50%;bottom:1.1rem;transform:translateX(-50%) translateY(140%);
  z-index:80;display:flex;align-items:center;gap:.6rem;
  background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  border:1px solid var(--line);border-radius:var(--r-full);
  padding:.5rem .7rem .5rem .95rem;box-shadow:var(--sh-3);
  transition:transform .45s var(--e-spring),opacity .3s;opacity:0;pointer-events:none;
  max-width:min(94vw,540px);
}
.tts-mini.show{transform:translateX(-50%) translateY(0);opacity:1;pointer-events:auto}
.tts-mini .lbl{
  font-size:var(--t-xs);font-weight:800;color:var(--legal);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:16ch;
}
.tts-mini button{
  border-radius:50%;width:32px;height:32px;padding:0;display:grid;place-items:center;
  font-size:.8rem;border:1px solid var(--line);flex:none;
}
.tts-mini button.main{
  width:38px;height:38px;font-size:.95rem;
  background:linear-gradient(140deg,var(--legal),var(--brand));color:#fff;border-color:transparent;
}
.tts-mini .bar{
  flex:1;min-width:70px;height:5px;border-radius:99px;background:var(--surface-3);overflow:hidden;
}
.tts-mini .bar i{display:block;height:100%;width:0;background:var(--legal);
  border-radius:99px;transition:width .35s var(--e-out)}

/* ═══ Panel de ajustes de voz ═══ */
.tts-back{
  position:fixed;inset:0;z-index:90;background:rgba(10,10,18,.45);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  display:grid;place-items:center;padding:1rem;
  opacity:0;pointer-events:none;transition:opacity .3s var(--e-out);
}
.tts-back.show{opacity:1;pointer-events:auto}
.tts-panel{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--sh-3);width:min(94vw,470px);max-height:88vh;overflow:auto;
  padding:1.3rem 1.4rem;transform:translateY(16px) scale(.97);
  transition:transform .38s var(--e-spring);
}
.tts-back.show .tts-panel{transform:none}
.tts-panel h3{
  font-size:1.12rem;font-weight:800;margin:0 0 .25rem;
  display:flex;align-items:center;gap:.5rem;
}
.tts-panel .sub{font-size:var(--t-sm);color:var(--ink-2);margin:0 0 1.1rem}
.tts-row{margin-bottom:1.05rem}
.tts-row > label{
  display:block;font-size:var(--t-xs);font-weight:800;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-2);margin-bottom:.4rem;
}
.tts-seg{display:flex;gap:3px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:3px}
.tts-seg button{
  flex:1;border:0;background:transparent;border-radius:calc(var(--r-sm) - 3px);
  padding:.42rem .3rem;font-size:var(--t-sm);font-weight:700;box-shadow:none;
}
.tts-seg button:hover{transform:none;background:var(--surface)}
.tts-seg button[aria-pressed="true"]{
  background:linear-gradient(140deg,var(--legal),var(--brand));color:#fff;
}
.tts-panel select{
  width:100%;padding:.5rem .6rem;border-radius:var(--r-sm);
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  font-size:var(--t-sm);font-weight:600;cursor:pointer;
}
.tts-panel select:focus{border-color:var(--brand);outline:none}
.tts-slider{display:flex;align-items:center;gap:.75rem}

.tts-val{

}

}

.tts-acts{display:flex;gap:.5rem;justify-content:flex-end;flex-wrap:wrap}

.tts-badge{

  padding:.1rem .35rem;border-radius:4px;background:var(--ej-bg);color:var(--ej);margin-left:.35rem;
}


/* — Variante compacta para los apartados desplegables — */
.tts-bar.mini{margin:0 0 .6rem}

}
.tts-bar.mini button:hover{background:var(--brand);color:var(--surface)}

.legal.tts-on,.body.tts-on,.idea.tts-on{

}

@media(max-width:620px){

  .tts-mini .lbl{display:none}
}
@media(prefers-reduced-motion:reduce){
  .tts-wave i{animation:none;height:60%}
}
@media print{.tts-bar,.tts-mini,.tts-back{display:none !important}}

const GLOSARIO={"interesado": "Interesado: quien está legitimado para promover un procedimiento o intervenir en él porque es titular de derechos o intereses legítimos afectados por la decisión (art. 4 de la Ley 39/2015).", "conten": "Recurso contencioso-administrativo: impugnación ante los juzgados y tribunales de lo contencioso-administrativo, es decir, ya fuera de la propia Administración.", "silencio": "Silencio administrativo: efecto que la ley anuda a la falta de resolución expresa en plazo. Puede ser estimatorio (positivo) o desestimatorio (negativo) según el procedimiento.", "habil": "Días hábiles: se excluyen del cómputo los sábados, los domingos y los declarados festivos (art. 30.2 de la Ley 39/2015).", "pleno": "Pleno: órgano colegiado formado por todos los concejales o diputados de la entidad local.", "alzada": "Recurso de alzada: recurso ordinario que se interpone ante el superior jerárquico contra actos que no ponen fin a la vía administrativa. Es obligatorio para agotar esa vía.", "reposicion": "Recurso potestativo de reposición: recurso ante el mismo órgano que dictó el acto, cuando este ya pone fin a la vía administrativa. Se puede usar o ir directamente al juez.", "revextra": "Recurso extraordinario de revisión: recurso excepcional contra actos firmes en vía administrativa, solo por las cuatro causas del art. 125.1.", "tramite": "Acto de trámite: el que se dicta a lo largo del procedimiento sin decidir el fondo. Solo es recurrible si es cualificado, en los términos del art. 112.1.", "cualificado": "Acto de trámite cualificado: el que decide directa o indirectamente el fondo, impide continuar el procedimiento, produce indefensión o causa perjuicio irreparable. Sí es recurrible.", "legitimacion": "Legitimación: condición de quien puede recurrir por ser titular de derechos o intereses legítimos afectados. Su ausencia es causa de inadmisión (art. 116.b).", "reformatio": "Reformatio in peius: agravamiento de la situación inicial del recurrente al resolver su propio recurso. Está expresamente prohibida por el art. 119.3.", "congruencia": "Congruencia: correspondencia entre lo pedido y lo resuelto. La resolución del recurso debe ser congruente con las peticiones del recurrente.", "retroaccion": "Retroacción de actuaciones: devolución del procedimiento al momento en que se cometió el vicio de forma, para repetir desde ahí (art. 119.2).", "firmeza": "Firmeza en vía administrativa: situación del acto que ya no admite recurso administrativo ordinario, por agotamiento de la vía o por transcurso del plazo.", "presunto": "Acto presunto: el que se entiende producido por silencio administrativo al vencer el plazo máximo sin resolución expresa.", "caucion": "Caución o garantía: fianza que puede exigirse al acordar la suspensión, para responder de los perjuicios que esta pueda causar (art. 117.4).", "autonomia": "Órganos con autonomía funcional: tribunales y órganos de selección de personal y otros que actúan sin dependencia jerárquica; a efectos de la alzada se considera superior al órgano al que estén adscritos.", "errorhecho": "Error de hecho: equivocación sobre un dato objetivo que resulta de los propios documentos del expediente, sin necesidad de interpretación jurídica."};
const LABELS={"interesado": "Interesado", "conten": "Recurso contencioso-administrativo", "silencio": "Silencio administrativo", "habil": "Días hábiles", "pleno": "Pleno", "alzada": "Recurso de alzada", "reposicion": "Recurso de reposición", "revextra": "Recurso extraordinario de revisión", "tramite": "Acto de trámite", "cualificado": "Acto de trámite cualificado", "legitimacion": "Legitimación", "reformatio": "Reformatio in peius", "congruencia": "Congruencia", "retroaccion": "Retroacción", "firmeza": "Firmeza", "presunto": "Acto presunto", "caucion": "Caución", "autonomia": "Autonomía funcional", "errorhecho": "Error de hecho"};
</script>
<script>
const ARTS=[{"n": 112, "t": "Objeto y clases", "ubic": "Título V (De la revisión de los actos en vía administrativa) ▸ Capítulo II ▸ Sección 1.ª (Principios generales)", "idea": "Dos recursos ordinarios; los actos de trámite solo si son cualificados.", "literal": "<p>1. Contra las resoluciones y los actos de trámite, si estos últimos deciden directa o indirectamente el fondo del asunto, determinan la imposibilidad de continuar el procedimiento, producen indefensión o perjuicio irreparable a derechos e intereses legítimos, podrán interponerse por los interesados los recursos de alzada y potestativo de reposición, que cabrá fundar en cualquiera de los motivos de nulidad o anulabilidad previstos en los artículos 47 y 48 de esta Ley. La oposición a los restantes actos de trámite podrá alegarse por los interesados para su consideración en la resolución que ponga fin al procedimiento.</p><p>2. Las leyes podrán sustituir el recurso de alzada, en supuestos o ámbitos sectoriales determinados, y cuando la especificidad de la materia así lo justifique, por otros procedimientos de impugnación, reclamación, conciliación, mediación y arbitraje, ante órganos colegiados o Comisiones específicas no sometidas a instrucciones jerárquicas, con respeto a los principios, garantías y plazos que la presente Ley reconoce a las personas y a los interesados en todo procedimiento administrativo. En las mismas condiciones, el recurso de reposición podrá ser sustituido por los procedimientos a que se refiere el párrafo anterior, respetando su carácter potestativo para el interesado. La aplicación de estos procedimientos en el ámbito de la Administración Local no podrá suponer el desconocimiento de las facultades resolutorias reconocidas a los órganos representativos electos establecidos por la Ley.</p><p>3. Contra las disposiciones administrativas de carácter general no cabrá recurso en vía administrativa. Los recursos contra un acto administrativo que se funden únicamente en la nulidad de alguna disposición administrativa de carácter general podrán interponerse directamente ante el órgano que dictó dicha disposición.</p><p>4. Las reclamaciones económico-administrativas se ajustarán a los procedimientos establecidos por su legislación específica.</p>", "dis": "<ul>\n<li><b>112.1 — qué se recurre:</b> las <b>resoluciones</b> y los <b><span class=\"t\" data-k=\"tramite\">actos de trámite</span></b>, pero estos <b>solo si</b>:\n<ul><li>deciden <b>directa o indirectamente el fondo</b> del asunto;</li>\n<li>determinan la <b>imposibilidad de continuar</b> el procedimiento;</li>\n<li>producen <b>indefensión</b>;</li>\n<li>o producen <b>perjuicio irreparable</b> a derechos e intereses legítimos.</li></ul>\nRecursos: <b>alzada</b> y <b>potestativo de reposición</b>, fundados en cualquiera de los motivos de <b>nulidad o anulabilidad</b> de los arts. 47 y 48.</li>\n<li><b>112.2 — sustitución del recurso de alzada:</b> las <b>leyes</b> podrán sustituirlo, en ámbitos sectoriales determinados y cuando la <b>especificidad de la materia</b> lo justifique, por procedimientos de <b>impugnación, reclamación, conciliación, mediación y arbitraje</b> ante órganos colegiados o comisiones <b>no sometidas a instrucciones jerárquicas</b>.</li>\n<li><b>112.3 — disposiciones generales:</b> contra ellas <b>no cabe recurso en vía administrativa</b>. Los recursos contra un acto fundados <b>únicamente</b> en la nulidad de una disposición general pueden interponerse <b>directamente ante el órgano que la dictó</b>.</li>\n<li><b>112.4 — reclamaciones económico-administrativas:</b> se rigen por su <b>legislación específica</b>.</li>\n</ul>", "llano": "<p>Solo hay dos recursos ordinarios: la alzada y la reposición. Se recurren las resoluciones y, de los trámites, solo los que de verdad hacen daño. Y algo que cae mucho: contra un reglamento <b>no cabe recurso administrativo</b>; hay que ir al juez o impugnar el acto de aplicación.</p>", "porque": "<p>Si cualquier trámite fuera recurrible, el procedimiento se detendría a cada paso. Por eso la ley solo abre el recurso frente a los trámites <b>cualificados</b>: los que ya no admiten reparación posterior. Los demás se combaten al recurrir la resolución final, alegando entonces todos los defectos acumulados.</p>\n<p>La regla del apartado 3 tiene otra lógica: un reglamento es una <b>norma</b>, no un acto, y su control corresponde a los tribunales. Admitir recurso administrativo contra él permitiría a la Administración revisar sus propias normas por la vía de las reclamaciones individuales.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> no se protesta cada jugada del partido, sino el resultado; salvo que una jugada te deje fuera del campo.</li>\n<li><b>Real:</b> el acuerdo que declara la <b>caducidad</b> de un expediente impide continuar el procedimiento: es trámite cualificado y sí es recurrible.</li>\n<li><b>Caso límite:</b> un vecino quiere recurrir en alzada la ordenanza de terrazas. <b>No cabe</b> (art. 112.3): puede impugnarla ante el contencioso o recurrir la licencia denegada fundándose en su nulidad, ante el órgano que dictó la ordenanza.</li>\n</ul>", "noej": "<ul>\n<li><b>No es</b> recurrible el trámite ordinario: la petición de un informe, el acuerdo de práctica de una prueba.</li>\n<li><b>No cabe</b> recurso administrativo contra reglamentos ni ordenanzas.</li>\n<li><b>No se rigen</b> por estos artículos las reclamaciones <b>económico-administrativas</b>.</li>\n</ul>", "conex": "<ul>\n<li><b>Arts. 47 y 48 LPAC:</b> motivos en que puede fundarse el recurso.</li>\n<li><b>Art. 114 LPAC:</b> qué actos ponen fin a la vía administrativa, dato que decide entre alzada y reposición.</li>\n<li><b>Art. 121 LPAC:</b> alzada. <b>Art. 123 LPAC:</b> reposición.</li>\n<li><b>Art. 112.4 LPAC:</b> las reclamaciones económico-administrativas se rigen por su <b>legislación específica</b>; en los municipios de gran población el órgano competente es el previsto en el <b>art. 137 de la Ley 7/1985 (LBRL)</b> <i>(norma externa a la biblioteca)</i>.</li>\n</ul>", "trampas": "<ul>\n<li>Los trámites solo se recurren si son <b>cualificados</b>: cuatro supuestos.</li>\n<li>Contra <b>disposiciones generales</b> no cabe recurso administrativo.</li>\n<li>La reposición es <b>potestativa</b>; la alzada, no.</li>\n<li>La sustitución del art. 112.2 solo puede hacerla una <b>ley</b>.</li>\n</ul>", "ancla": "<p><b>«Fondo, imposibilidad, indefensión o perjuicio irreparable»</b>: los cuatro trámites recurribles. Y <b>al reglamento, por vía judicial</b>.</p>", "vis": "<svg viewBox=\"0 0 660 160\" role=\"img\" aria-label=\"Objeto y clases de recursos administrativos\">\n<rect x=\"215\" y=\"8\" width=\"230\" height=\"30\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/>\n<text x=\"330\" y=\"28\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">QUÉ SE PUEDE RECURRIR</text>\n<g font-size=\"10\" text-anchor=\"middle\" fill=\"currentColor\">\n<rect x=\"20\" y=\"52\" width=\"185\" height=\"60\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"112\" y=\"74\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">Resoluciones</text><text x=\"112\" y=\"93\">siempre</text>\n<rect x=\"220\" y=\"52\" width=\"220\" height=\"60\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"330\" y=\"72\" font-size=\"11\" font-weight=\"700\" fill=\"var(--warn)\">Trámites CUALIFICADOS</text><text x=\"330\" y=\"89\">fondo · imposibilidad de continuar</text><text x=\"330\" y=\"103\">indefensión · perjuicio irreparable</text>\n<rect x=\"455\" y=\"52\" width=\"185\" height=\"60\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"547\" y=\"74\" font-size=\"11\" font-weight=\"700\" fill=\"var(--exc)\">Disposiciones generales</text><text x=\"547\" y=\"93\">NO cabe recurso administrativo</text>\n</g>\n<text x=\"330\" y=\"140\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--acc)\" font-weight=\"700\">Dos recursos ordinarios: ALZADA y POTESTATIVO DE REPOSICIÓN</text>\n<text x=\"330\" y=\"155\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--ink2)\">fundados en cualquiera de los motivos de nulidad o anulabilidad (arts. 47 y 48)</text>\n</svg>"}, {"n": 113, "t": "Recurso extraordinario de revisión", "ubic": "Título V (De la revisión de los actos en vía administrativa) ▸ Capítulo II ▸ Sección 1.ª (Principios generales)", "idea": "Contra los actos firmes, solo cabe el recurso extraordinario de revisión.", "literal": "<p>Contra los actos firmes en vía administrativa, sólo procederá el recurso extraordinario de revisión cuando concurra alguna de las circunstancias previstas en el artículo 125.1.</p>", "dis": "<ul>\n<li><b>Regla:</b> contra los actos <b><span class=\"t\" data-k=\"firmeza\">firmes en vía administrativa</span></b> <b>solo</b> procede el <span class=\"t\" data-k=\"revextra\">recurso extraordinario de revisión</span>.</li>\n<li><b>Condición:</b> únicamente cuando concurra alguna de las <b>circunstancias del art. 125.1</b>.</li>\n</ul>", "llano": "<p>Cuando el acto ya es firme —porque agotaste la vía o dejaste pasar el plazo— la puerta ordinaria está cerrada. Queda una rendija estrecha: el recurso extraordinario de revisión, y solo por cuatro motivos muy concretos.</p>", "porque": "<p>La firmeza sirve a la <b>seguridad jurídica</b>: llega un momento en que las decisiones deben quedar cerradas. Pero mantenerlas cuando se descubre que se apoyaron en documentos falsos o en un delito sería intolerable. El recurso extraordinario es esa <b>excepción tasada</b>, no una segunda oportunidad para quien dejó pasar el plazo.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> un resultado deportivo cerrado que solo se revisa si aparece un dopaje probado.</li>\n<li><b>Real:</b> una resolución firme de 2023 que se apoyó en un certificado declarado falso por sentencia penal firme de 2026: cabe revisión extraordinaria por el art. 125.1.c).</li>\n<li><b>Caso límite:</b> el interesado dejó pasar el mes de la alzada por descuido. <b>No</b> puede usar esta vía: el olvido no es causa del art. 125.1.</li>\n</ul>", "noej": "<ul>\n<li><b>No es</b> una vía para recuperar plazos perdidos.</li>\n<li><b>No excluye</b> la revisión de oficio del art. 106 ni la rectificación del art. 109.2 (art. 125.3).</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 125 LPAC:</b> las cuatro causas y sus plazos.</li>\n<li><b>Art. 126 LPAC:</b> resolución del recurso.</li>\n<li><b>Art. 106 LPAC:</b> alternativa para los actos nulos.</li>\n</ul>", "trampas": "<ul>\n<li>La palabra clave es <b>«sólo»</b>.</li>\n<li>Se predica de los actos <b>firmes en vía administrativa</b>, no de cualquier acto.</li>\n</ul>", "ancla": "<p><b>«Acto firme: puerta cerrada y una sola rendija.»</b></p>", "vis": "<svg viewBox=\"0 0 640 110\" role=\"img\" aria-label=\"Recurso extraordinario contra actos firmes\">\n<rect x=\"60\" y=\"30\" width=\"230\" height=\"52\" rx=\"8\" fill=\"var(--panel)\" stroke=\"var(--line)\"/>\n<text x=\"175\" y=\"52\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\">Acto FIRME en vía administrativa</text>\n<text x=\"175\" y=\"70\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--ink2)\">no cabe alzada ni reposición</text>\n<rect x=\"345\" y=\"30\" width=\"240\" height=\"52\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/>\n<text x=\"465\" y=\"52\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--warn)\">Recurso extraordinario</text>\n<text x=\"465\" y=\"70\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">solo por las causas del art. 125.1</text>\n<path d=\"M293 56 L 340 56\" stroke=\"var(--warn)\" stroke-width=\"2.5\"/>\n</svg>"}, {"n": 114, "t": "Fin de la vía administrativa", "ubic": "Título V (De la revisión de los actos en vía administrativa) ▸ Capítulo II ▸ Sección 1.ª (Principios generales)", "idea": "Siete supuestos generales en que la vía administrativa queda agotada.", "literal": "<p>1. Ponen fin a la vía administrativa:</p><p>a) Las resoluciones de los recursos de alzada.</p><p>b) Las resoluciones de los procedimientos a que se refiere el artículo 112.2.</p><p>c) Las resoluciones de los órganos administrativos que carezcan de superior jerárquico, salvo que una Ley establezca lo contrario.</p><p>d) Los acuerdos, pactos, convenios o contratos que tengan la consideración de finalizadores del procedimiento.</p><p>e) La resolución administrativa de los procedimientos de responsabilidad patrimonial, cualquiera que fuese el tipo de relación, pública o privada, de que derive.</p><p>f) La resolución de los procedimientos complementarios en materia sancionadora a los que se refiere el artículo 90.4.</p><p>g) Las demás resoluciones de órganos administrativos cuando una disposición legal o reglamentaria así lo establezca.</p><p>2. Además de lo previsto en el apartado anterior, en el ámbito estatal ponen fin a la vía administrativa los actos y resoluciones siguientes:</p><p>a) Los actos administrativos de los miembros y órganos del Gobierno.</p><p>b) Los emanados de los Ministros y los Secretarios de Estado en el ejercicio de las competencias que tienen atribuidas los órganos de los que son titulares.</p><p>c) Los emanados de los órganos directivos con nivel de Director general o superior, en relación con las competencias que tengan atribuidas en materia de personal.</p><p>d) En los Organismos públicos y entidades de derecho público vinculados o dependientes de la Administración General del Estado, los emanados de los máximos órganos de dirección unipersonales o colegiados, de acuerdo con lo que establezcan sus estatutos, salvo que por ley se establezca otra cosa.</p>", "dis": "<p><b>114.1 — ponen fin a la vía administrativa:</b></p>\n<table><thead><tr><th>Letra</th><th>Supuesto</th></tr></thead><tbody>\n<tr><td><b>a)</b></td><td>Las resoluciones de los <b>recursos de alzada</b></td></tr>\n<tr><td><b>b)</b></td><td>Las resoluciones de los <b>procedimientos sustitutivos</b> del art. 112.2</td></tr>\n<tr><td><b>c)</b></td><td>Las resoluciones de los órganos que <b>carezcan de superior jerárquico</b>, salvo que una ley diga lo contrario</td></tr>\n<tr><td><b>d)</b></td><td>Los <b>acuerdos, pactos, convenios o contratos</b> finalizadores del procedimiento</td></tr>\n<tr><td><b>e)</b></td><td>La resolución de los procedimientos de <b>responsabilidad patrimonial</b>, cualquiera que sea el tipo de relación de que derive</td></tr>\n<tr><td><b>f)</b></td><td>La resolución de los <b>procedimientos complementarios</b> en materia sancionadora del art. 90.4</td></tr>\n<tr><td><b>g)</b></td><td>Las demás resoluciones cuando una <b>disposición legal o reglamentaria</b> así lo establezca</td></tr>\n</tbody></table>\n<p><b>114.2 — además, en el ámbito estatal:</b> actos de los <b>miembros y órganos del Gobierno</b> · de <b>Ministros y Secretarios de Estado</b> en sus competencias propias · de órganos directivos con nivel de <b>Director general o superior</b> en materia de <b>personal</b> · y de los <b>máximos órganos de dirección</b> de los organismos públicos estatales.</p>\n<div class=\"box ej\"><span class=\"lbl\">La clave para el ámbito local</span>La letra <b>c)</b> es la que más se aplica en un ayuntamiento: los actos del <b>alcalde</b> y del <b>Pleno</b> ponen fin a la vía administrativa porque no tienen superior jerárquico. Por eso, frente a ellos, el recurso procedente es la <b>reposición potestativa</b>, no la alzada.</div>", "llano": "<p>Saber si un acto agota la vía administrativa es lo que decide qué recurso toca. Si la agota, reposición potestativa o directamente al juez. Si no la agota, alzada obligatoria. En un ayuntamiento, lo que firman el alcalde y el Pleno ya la agota.</p>", "porque": "<p>La vía administrativa existe para dar a la Administración la oportunidad de corregirse antes de llegar al juez. Cuando ya ha decidido su órgano <b>máximo</b> —el que no tiene superior— insistir dentro de la casa carecería de sentido: por eso la vía se agota y el recurso pasa a ser <b>potestativo</b>.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> reclamar al encargado y, si el encargado es el dueño, ya no hay a quién subir.</li>\n<li><b>Real:</b> una resolución de la alcaldía sobre una licencia pone fin a la vía (letra c): cabe <b>reposición</b> ante la propia alcaldía o contencioso directo.</li>\n<li><b>Caso límite:</b> una resolución de un <b>concejal delegado</b>. Tiene superior jerárquico —la alcaldía—, así que <b>no</b> agota la vía: procede <b>alzada</b>.</li>\n</ul>", "noej": "<ul>\n<li><b>No agotan</b> la vía los actos de órganos con superior jerárquico.</li>\n<li><b>No agota</b> la vía la resolución de un recurso de <b>reposición</b>: la vía ya estaba agotada antes.</li>\n</ul>", "conex": "<ul>\n<li><b>Arts. 121 y 123 LPAC:</b> alzada y reposición, cuya procedencia depende de este artículo.</li>\n<li><b>Art. 40.2 LPAC:</b> la notificación debe indicar si el acto pone fin o no a la vía.</li>\n<li><b>Art. 90.4 LPAC:</b> procedimientos complementarios en materia sancionadora.</li>\n<li><b>Art. 52.2 de la Ley 7/1985 (LBRL)</b> <i>(norma externa a la biblioteca)</i>: actos locales que ponen fin a la vía administrativa.</li>\n</ul>", "trampas": "<ul>\n<li>La letra c) exige que el órgano <b>carezca de superior jerárquico</b>, <b>salvo que una ley establezca lo contrario</b>.</li>\n<li>La <b>responsabilidad patrimonial</b> agota la vía <b>siempre</b>, sea la relación pública o privada.</li>\n<li>Los actos de <b>concejales delegados</b> no agotan la vía.</li>\n</ul>", "ancla": "<p><b>«Alzada resuelta · sustitutivo · sin superior · convenio · patrimonial · complementario sancionador · lo que diga la norma.»</b> Siete letras.</p>", "vis": "<svg viewBox=\"0 0 660 150\" role=\"img\" aria-label=\"Fin de la vía administrativa\">\n<rect x=\"200\" y=\"8\" width=\"260\" height=\"30\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/>\n<text x=\"330\" y=\"28\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">¿PONE FIN A LA VÍA?</text>\n<rect x=\"30\" y=\"52\" width=\"280\" height=\"66\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/>\n<text x=\"170\" y=\"74\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">SÍ</text>\n<text x=\"170\" y=\"93\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">alcalde, Pleno, resolución de alzada,</text>\n<text x=\"170\" y=\"108\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">convenios, responsabilidad patrimonial</text>\n<rect x=\"350\" y=\"52\" width=\"280\" height=\"66\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/>\n<text x=\"490\" y=\"74\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--warn)\">NO</text>\n<text x=\"490\" y=\"93\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">órganos con superior jerárquico</text>\n<text x=\"490\" y=\"108\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">(concejal delegado, jefe de servicio)</text>\n<text x=\"170\" y=\"140\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">→ REPOSICIÓN potestativa o contencioso</text>\n<text x=\"490\" y=\"140\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--warn)\">→ ALZADA obligatoria</text>\n</svg>"}, {"n": 115, "t": "Interposición de recurso", "ubic": "Título V (De la revisión de los actos en vía administrativa) ▸ Capítulo II ▸ Sección 1.ª (Principios generales)", "idea": "Cinco datos en el escrito; el nombre del recurso no importa; nadie alega su propio vicio.", "literal": "<p>1. La interposición del recurso deberá expresar:</p><p>a) El nombre y apellidos del recurrente, así como la identificación personal del mismo.</p><p>b) El acto que se recurre y la razón de su impugnación.</p><p>c) Lugar, fecha, firma del recurrente, identificación del medio y, en su caso, del lugar que se señale a efectos de notificaciones.</p><p>d) Órgano, centro o unidad administrativa al que se dirige y su correspondiente código de identificación.</p><p>e) Las demás particularidades exigidas, en su caso, por las disposiciones específicas.</p><p>2. El error o la ausencia de la calificación del recurso por parte del recurrente no será obstáculo para su tramitación, siempre que se deduzca su verdadero carácter.</p><p>3. Los vicios y defectos que hagan anulable un acto no podrán ser alegados por quienes los hubieren causado.</p>", "dis": "<ul>\n<li><b>115.1 — contenido del escrito:</b> <b>a)</b> nombre, apellidos e <b>identificación</b> del recurrente · <b>b)</b> el <b>acto que se recurre</b> y la <b>razón</b> de su impugnación · <b>c)</b> <b>lugar, fecha, firma</b>, identificación del medio y, en su caso, lugar a efectos de notificaciones · <b>d)</b> <b>órgano</b>, centro o unidad al que se dirige y su <b>código de identificación</b> · <b>e)</b> las demás particularidades exigidas por disposiciones específicas.</li>\n<li><b>115.2 — calificación errónea:</b> el <b>error o la ausencia de la calificación</b> del recurso <b>no será obstáculo</b> para su tramitación, siempre que se deduzca su <b>verdadero carácter</b>.</li>\n<li><b>115.3 — nadie se beneficia de su propio vicio:</b> los vicios y defectos que hagan <b>anulable</b> un acto <b>no podrán ser alegados por quienes los hubieren causado</b>.</li>\n</ul>", "llano": "<p>El escrito tiene que decir quién eres, qué recurres y por qué, ante quién y con firma. Si te equivocas de nombre al llamarlo —pones «alzada» donde tocaba «reposición»—, no pasa nada: se tramita el que corresponda. Lo que no puedes es alegar un defecto que provocaste tú.</p>", "porque": "<p>El apartado 2 es una de las manifestaciones más claras del <b>antiformalismo</b> del procedimiento administrativo: el ciudadano no tiene por qué dominar la terminología de los recursos. Lo relevante es su <b>voluntad impugnatoria</b>.</p>\n<p>El apartado 3 recoge un principio general del Derecho: nadie puede beneficiarse de su propia torpeza. Si el interesado indujo el error —aportando datos falsos, por ejemplo—, no puede después pedir la anulación apoyándose en él.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> una reclamación mal titulada que se atiende igual porque se entiende lo que pides.</li>\n<li><b>Real:</b> un vecino presenta «recurso de alzada» contra una resolución de la alcaldía. Como esta agota la vía, se tramita como <b>reposición</b> (art. 115.2).</li>\n<li><b>Caso límite:</b> una empresa que ocultó su verdadera facturación en la solicitud pretende después anular la resolución alegando error en el cálculo de la subvención. <b>No puede</b>: causó el vicio (art. 115.3).</li>\n</ul>", "noej": "<ul>\n<li><b>No salva</b> el art. 115.2 la falta de <b>voluntad impugnatoria</b>: si no se deduce que se quiere recurrir, no hay recurso.</li>\n<li><b>No alcanza</b> el art. 115.3 a los vicios de <b>nulidad</b>: solo cita los que hacen <b>anulable</b> el acto.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 66 LPAC:</b> contenido de las solicitudes de iniciación.</li>\n<li><b>Art. 68 LPAC:</b> subsanación de la solicitud.</li>\n<li><b>Art. 116 LPAC:</b> causas de inadmisión.</li>\n<li><b>Art. 48 LPAC:</b> vicios que hacen anulable el acto.</li>\n</ul>", "trampas": "<ul>\n<li>El error de <b>calificación</b> no impide la tramitación si se deduce el <b>verdadero carácter</b>.</li>\n<li>El art. 115.3 se refiere solo a los vicios de <b>anulabilidad</b>.</li>\n<li>Debe indicarse el <b>código de identificación</b> del órgano destinatario.</li>\n</ul>", "ancla": "<p><b>«Quién, qué, por qué, dónde y ante quién.»</b> Y da igual cómo lo llames, pero no alegues tu propio error.</p>", "vis": "<svg viewBox=\"0 0 640 130\" role=\"img\" aria-label=\"Interposición del recurso\">\n<g font-size=\"10\" text-anchor=\"middle\" fill=\"currentColor\">\n<rect x=\"20\" y=\"28\" width=\"190\" height=\"62\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"115\" y=\"50\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">115.1 · Contenido</text><text x=\"115\" y=\"68\">identificación · acto y razón</text><text x=\"115\" y=\"82\">lugar, fecha, firma · órgano</text>\n<rect x=\"225\" y=\"28\" width=\"190\" height=\"62\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"320\" y=\"50\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">115.2 · Calificación</text><text x=\"320\" y=\"68\">el error o la ausencia</text><text x=\"320\" y=\"82\">no impide la tramitación</text>\n<rect x=\"430\" y=\"28\" width=\"190\" height=\"62\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"525\" y=\"50\" font-size=\"11\" font-weight=\"700\" fill=\"var(--exc)\">115.3 · Límite</text><text x=\"525\" y=\"68\">no alega el vicio</text><text x=\"525\" y=\"82\">quien lo causó</text>\n</g>\n<text x=\"320\" y=\"118\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--ink2)\">Se tramita el recurso que corresponda siempre que se deduzca su verdadero carácter</text>\n</svg>"}];
</script>
<script>
ARTS.push.apply(ARTS,[{"n": 116, "t": "Causas de inadmisión", "ubic": "Título V (De la revisión de los actos en vía administrativa) ▸ Capítulo II ▸ Sección 1.ª (Principios generales)", "idea": "Cinco causas de inadmisión: competencia, legitimación, acto, plazo y fundamento.", "literal": "<p>Serán causas de inadmisión las siguientes:</p><p>a) Ser incompetente el órgano administrativo, cuando el competente perteneciera a otra Administración Pública. El recurso deberá remitirse al órgano competente, de acuerdo con lo establecido en el artículo 14.1 de la Ley de Régimen Jurídico del Sector Público.</p><p>b) Carecer de legitimación el recurrente.</p><p>c) Tratarse de un acto no susceptible de recurso.</p><p>d) Haber transcurrido el plazo para la interposición del recurso.</p><p>e) Carecer el recurso manifiestamente de fundamento.</p>", "dis": "<table><thead><tr><th>Letra</th><th>Causa</th><th>Matiz</th></tr></thead><tbody>\n<tr><td><b>a)</b></td><td>Ser <b>incompetente el órgano administrativo</b>, cuando el competente perteneciera a <b>otra Administración</b></td><td>El recurso <b>deberá remitirse</b> al órgano competente conforme al art. 14.1 de la Ley 40/2015</td></tr>\n<tr><td><b>b)</b></td><td>Carecer de <b><span class=\"t\" data-k=\"legitimacion\">legitimación</span></b> el recurrente</td><td>No es interesado en el sentido del art. 4</td></tr>\n<tr><td><b>c)</b></td><td>Tratarse de un <b>acto no susceptible de recurso</b></td><td>Trámite no cualificado, disposición general…</td></tr>\n<tr><td><b>d)</b></td><td>Haber <b>transcurrido el plazo</b> para la interposición</td><td>Extemporaneidad</td></tr>\n<tr><td><b>e)</b></td><td>Carecer el recurso <b>manifiestamente de fundamento</b></td><td>Exige que la falta sea evidente</td></tr>\n</tbody></table>", "llano": "<p>Inadmitir es no entrar en el fondo. Ocurre en cinco casos: te has equivocado de Administración, no eres parte, el acto no se puede recurrir, has llegado tarde o lo que pides no tiene ningún fundamento. En el primero, además, no se archiva: se remite a quien corresponda.</p>", "porque": "<p>La inadmisión ahorra tramitación inútil, pero también cierra la puerta al interesado. Por eso las causas están <b>tasadas</b> y la última exige que la falta de fundamento sea <b>manifiesta</b>: la duda debe resolverse entrando en el fondo. Y la letra a) impone el <b>deber de remisión</b>, no el archivo, para que un error de destinatario no cueste el derecho a recurrir.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> presentar una reclamación en la ventanilla equivocada, que te la reenvían.</li>\n<li><b>Real:</b> se recurre ante el ayuntamiento una resolución de la Junta de Andalucía: el ayuntamiento <b>debe remitir</b> el recurso al órgano competente (art. 116.a).</li>\n<li><b>Caso límite:</b> un vecino sin relación alguna con el expediente recurre la concesión de una ayuda a un tercero: falta de <b>legitimación</b> (art. 116.b), salvo que acredite un interés legítimo.</li>\n</ul>", "noej": "<ul>\n<li><b>No es</b> causa de inadmisión el error en la calificación del recurso (art. 115.2).</li>\n<li><b>No procede</b> inadmitir por falta de fundamento si esta no es <b>manifiesta</b>.</li>\n<li><b>No se archiva</b> el recurso presentado ante otra Administración: se <b>remite</b>.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 4 LPAC:</b> concepto de interesado y legitimación.</li>\n<li><b>Art. 112.1 LPAC:</b> actos susceptibles de recurso.</li>\n<li><b>Arts. 122 y 124 LPAC:</b> plazos de interposición.</li>\n<li><b>Art. 14.1 de la Ley 40/2015</b> (documento 2): deber de remisión al órgano competente.</li>\n</ul>", "trampas": "<ul>\n<li>La letra a) exige que el órgano competente pertenezca a <b>otra Administración</b>, e impone <b>remitir</b>.</li>\n<li>La letra e) exige que la falta de fundamento sea <b>manifiesta</b>.</li>\n<li>Inadmitir <b>no es</b> desestimar: no se entra en el fondo.</li>\n</ul>", "ancla": "<p><b>«Casa equivocada · no eres parte · acto blindado · llegaste tarde · no dices nada.»</b> Cinco causas.</p>", "vis": "<svg viewBox=\"0 0 660 130\" role=\"img\" aria-label=\"Causas de inadmisión del recurso\">\n<g font-size=\"10\" text-anchor=\"middle\" fill=\"currentColor\">\n<rect x=\"12\" y=\"35\" width=\"122\" height=\"58\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"73\" y=\"58\" font-weight=\"700\" fill=\"var(--warn)\">a) Otra</text><text x=\"73\" y=\"73\" font-weight=\"700\" fill=\"var(--warn)\">Administración</text><text x=\"73\" y=\"87\">se remite</text>\n<rect x=\"142\" y=\"35\" width=\"122\" height=\"58\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"203\" y=\"58\" font-weight=\"700\" fill=\"var(--exc)\">b) Sin</text><text x=\"203\" y=\"73\" font-weight=\"700\" fill=\"var(--exc)\">legitimación</text>\n<rect x=\"272\" y=\"35\" width=\"122\" height=\"58\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"333\" y=\"58\" font-weight=\"700\" fill=\"var(--exc)\">c) Acto no</text><text x=\"333\" y=\"73\" font-weight=\"700\" fill=\"var(--exc)\">recurrible</text>\n<rect x=\"402\" y=\"35\" width=\"122\" height=\"58\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"463\" y=\"58\" font-weight=\"700\" fill=\"var(--exc)\">d) Plazo</text><text x=\"463\" y=\"73\" font-weight=\"700\" fill=\"var(--exc)\">transcurrido</text>\n<rect x=\"532\" y=\"35\" width=\"122\" height=\"58\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"593\" y=\"58\" font-weight=\"700\" fill=\"var(--exc)\">e) Sin fundamento</text><text x=\"593\" y=\"73\" font-weight=\"700\" fill=\"var(--exc)\">manifiesto</text>\n</g>\n<text x=\"330\" y=\"118\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--ink2)\">Inadmitir es no entrar en el fondo · en la letra a) hay deber de remisión, no archivo</text>\n</svg>"}, {"n": 117, "t": "Suspensión de la ejecución", "ubic": "Título V (De la revisión de los actos en vía administrativa) ▸ Capítulo II ▸ Sección 1.ª (Principios generales)", "idea": "El recurso no suspende, salvo ponderación; y a mes sin resolver, suspensión por silencio.", "literal": "<p>1. La interposición de cualquier recurso, excepto en los casos en que una disposición establezca lo contrario, no suspenderá la ejecución del acto impugnado.</p><p>2. No obstante lo dispuesto en el apartado anterior, el órgano a quien competa resolver el recurso, previa ponderación, suficientemente razonada, entre el perjuicio que causaría al interés público o a terceros la suspensión y el ocasionado al recurrente como consecuencia de la eficacia inmediata del acto recurrido, podrá suspender, de oficio o a solicitud del recurrente, la ejecución del acto impugnado cuando concurran alguna de las siguientes circunstancias:</p><p>a) Que la ejecución pudiera causar perjuicios de imposible o difícil reparación.</p><p>b) Que la impugnación se fundamente en alguna de las causas de nulidad de pleno derecho previstas en el artículo 47.1 de esta Ley.</p><p>3. La ejecución del acto impugnado se entenderá suspendida si transcurrido un mes desde que la solicitud de suspensión haya tenido entrada en el registro electrónico de la Administración u Organismo competente para decidir sobre la misma, el órgano a quien competa resolver el recurso no ha dictado y notificado resolución expresa al respecto. En estos casos, no será de aplicación lo establecido en el artículo 21.4 segundo párrafo, de esta Ley.</p><p>4. Al dictar el acuerdo de suspensión podrán adoptarse las medidas cautelares que sean necesarias para asegurar la protección del interés público o de terceros y la eficacia de la resolución o el acto impugnado. Cuando de la suspensión puedan derivarse perjuicios de cualquier naturaleza, aquélla sólo producirá efectos previa prestación de caución o garantía suficiente para responder de ellos, en los términos establecidos reglamentariamente. La suspensión se prolongará después de agotada la vía administrativa cuando, habiéndolo solicitado previamente el interesado, exista medida cautelar y los efectos de ésta se extiendan a la vía contencioso-administrativa. Si el interesado interpusiera recurso contencioso-administrativo, solicitando la suspensión del acto objeto del proceso, se mantendrá la suspensión hasta que se produzca el correspondiente pronunciamiento judicial sobre la solicitud.</p><p>5. Cuando el recurso tenga por objeto la impugnación de un acto administrativo que afecte a una pluralidad indeterminada de personas, la suspensión de su eficacia habrá de ser publicada en el periódico oficial en que aquél se insertó.</p>", "dis": "<ul>\n<li><b>117.1 — regla:</b> la interposición de <b>cualquier recurso</b>, salvo que una disposición establezca lo contrario, <b>no suspenderá</b> la ejecución del acto impugnado.</li>\n<li><b>117.2 — excepción:</b> el órgano competente para resolver, <b>previa ponderación suficientemente razonada</b> entre el perjuicio al <b>interés público o a terceros</b> y el causado al recurrente por la eficacia inmediata, <b>podrá suspender</b> —de oficio o a solicitud— cuando concurra alguna de estas circunstancias:\n<ul><li><b>a)</b> que la ejecución pudiera causar <b>perjuicios de imposible o difícil reparación</b>;</li>\n<li><b>b)</b> que la impugnación se funde en alguna <b>causa de nulidad</b> del art. 47.1.</li></ul></li>\n<li><b>117.3 — silencio positivo de la suspensión:</b> se entiende <b>suspendida</b> la ejecución si transcurre <b>un mes</b> desde la entrada de la solicitud en el registro electrónico del órgano competente sin resolución expresa notificada.</li>\n<li><b>117.4 — cautelas:</b> pueden adoptarse <b>medidas cautelares</b> y exigirse <b><span class=\"t\" data-k=\"caucion\">caución o garantía</span></b> cuando de la suspensión puedan derivarse perjuicios.</li>\n<li><b>117.5 — publicidad:</b> si el acto afecta a una <b>pluralidad indeterminada</b> de personas, la suspensión se <b>publica</b> en el periódico oficial en que aquel se insertó.</li>\n</ul>\n<div class=\"box ej\"><span class=\"lbl\">Una de las poquísimas suspensiones por silencio positivo</span>Pedida la suspensión, el <b>mes</b> de silencio juega <b>a favor</b> del recurrente. Es excepcional en el sistema de la ley y por eso se pregunta mucho.</div>", "llano": "<p>Recurrir no para el acto: eso es la regla. Pero puedes pedir la suspensión, y el órgano debe ponderar los perjuicios. Si en <b>un mes</b> no te contesta, se entiende <b>suspendida</b>. Puede exigirte una fianza y, si el acto afectaba a mucha gente, la suspensión se publica.</p>", "porque": "<p>La regla del apartado 1 evita el recurso puramente dilatorio. Pero si el acto se ejecuta y produce daños irreparables, la eventual estimación del recurso llegaría vacía. La ley resuelve con una <b>ponderación</b> —no con un automatismo— y añade el silencio positivo del apartado 3 para que la pasividad administrativa no perjudique a quien pidió amparo.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> pedir que no se ejecute un desahucio mientras se resuelve la reclamación.</li>\n<li><b>Real:</b> recurrida una orden de derribo, se solicita la suspensión el 3 de marzo. Si el 3 de abril no hay resolución expresa notificada, la ejecución <b>se entiende suspendida</b> (art. 117.3).</li>\n<li><b>Caso límite:</b> recurso contra una liquidación de 500 €. El perjuicio es económico y reparable: la ponderación difícilmente llevará a suspender.</li>\n</ul>", "noej": "<ul>\n<li><b>No suspende</b> la mera interposición del recurso.</li>\n<li><b>No es</b> automática la suspensión del art. 117.2: exige ponderación razonada.</li>\n<li><b>No opera</b> el silencio del art. 117.3 si no se ha <b>solicitado</b> la suspensión.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 38 LPAC:</b> ejecutividad del acto.</li>\n<li><b>Art. 47.1 LPAC:</b> causas de nulidad, invocables por la letra b).</li>\n<li><b>Art. 108 LPAC:</b> suspensión en la revisión de oficio.</li>\n<li><b>Art. 56 LPAC:</b> medidas provisionales.</li>\n</ul>", "trampas": "<ul>\n<li>El plazo del silencio es de <b>un mes</b> desde la <

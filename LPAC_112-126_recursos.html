b>entrada en el registro electrónico</b>.</li>\n<li>Las dos circunstancias del 117.2 son <b>alternativas</b>: basta una.</li>\n<li>La suspensión puede condicionarse a <b>caución</b>.</li>\n</ul>", "ancla": "<p><b>«Recurrir no para; pedir y callar, sí: un mes.»</b> Y las dos causas: <b>daño irreparable o nulidad</b>.</p>", "vis": "<svg viewBox=\"0 0 660 150\" role=\"img\" aria-label=\"Suspensión de la ejecución al recurrir\">\n<rect x=\"190\" y=\"8\" width=\"280\" height=\"30\" rx=\"8\" fill=\"var(--exc)\" stroke=\"var(--exc)\"/>\n<text x=\"330\" y=\"28\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">EL RECURSO NO SUSPENDE (117.1)</text>\n<g font-size=\"10\" text-anchor=\"middle\" fill=\"currentColor\">\n<rect x=\"25\" y=\"52\" width=\"290\" height=\"66\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/>\n<text x=\"170\" y=\"74\" font-size=\"11\" font-weight=\"700\" fill=\"var(--warn)\">117.2 · Suspensión ponderada</text>\n<text x=\"170\" y=\"93\">a) perjuicios de imposible o difícil reparación</text>\n<text x=\"170\" y=\"108\">b) impugnación fundada en nulidad del art. 47.1</text>\n<rect x=\"345\" y=\"52\" width=\"290\" height=\"66\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/>\n<text x=\"490\" y=\"74\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">117.3 · Silencio POSITIVO</text>\n<text x=\"490\" y=\"93\">1 mes desde la entrada de la solicitud</text>\n<text x=\"490\" y=\"108\">sin resolución: se entiende suspendida</text>\n</g>\n<text x=\"330\" y=\"140\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--ink2)\">Cabe exigir caución (117.4) y publicar la suspensión si afecta a pluralidad indeterminada (117.5)</text>\n</svg>"}, {"n": 118, "t": "Audiencia de los interesados", "ubic": "Título V (De la revisión de los actos en vía administrativa) ▸ Capítulo II ▸ Sección 1.ª (Principios generales)", "idea": "Audiencia de diez a quince días si hay hechos o documentos nuevos.", "literal": "<p>1. Cuando hayan de tenerse en cuenta nuevos hechos o documentos no recogidos en el expediente originario, se pondrán de manifiesto a los interesados para que, en un plazo no inferior a diez días ni superior a quince, formulen las alegaciones y presenten los documentos y justificantes que estimen procedentes. No se tendrán en cuenta en la resolución de los recursos, hechos, documentos o alegaciones del recurrente, cuando habiendo podido aportarlos en el trámite de alegaciones no lo haya hecho. Tampoco podrá solicitarse la práctica de pruebas cuando su falta de realización en el procedimiento en el que se dictó la resolución recurrida fuera imputable al interesado.</p><p>2. Si hubiera otros interesados se les dará, en todo caso, traslado del recurso para que en el plazo antes citado, aleguen cuanto estimen procedente.</p><p>3. El recurso, los informes y las propuestas no tienen el carácter de documentos nuevos a los efectos de este artículo. Tampoco lo tendrán los que los interesados hayan aportado al expediente antes de recaer la resolución impugnada.</p>", "dis": "<ul>\n<li><b>118.1 — cuándo:</b> cuando hayan de tenerse en cuenta <b>nuevos hechos o documentos</b> no recogidos en el expediente originario, se ponen de manifiesto a los interesados por un plazo <b>no inferior a diez días ni superior a quince</b>. <b>No se tendrán en cuenta</b> en la resolución hechos, documentos o alegaciones del recurrente cuando, <b>habiendo podido aportarlos</b> en el trámite de alegaciones, no lo haya hecho.</li>\n<li><b>118.2 — otros interesados:</b> si los hubiera, se les da <b>en todo caso</b> traslado del recurso para que aleguen en el mismo plazo.</li>\n<li><b>118.3 — qué no es documento nuevo:</b> el <b>recurso</b>, los <b>informes</b> y las <b>propuestas</b>; tampoco los documentos que los interesados <b>ya aportaron</b> antes de recaer la resolución impugnada.</li>\n</ul>", "llano": "<p>Si en el recurso aparecen hechos o papeles que no estaban en el expediente, hay que dar audiencia: entre diez y quince días. Ahora bien, no vale guardarse pruebas para el recurso: lo que pudiste aportar antes y no aportaste, no se tiene en cuenta.</p>", "porque": "<p>La horquilla <b>10-15</b> equilibra defensa y agilidad: menos de diez días sería insuficiente y más de quince retrasaría en exceso. La regla final del apartado 1 combate una práctica real: reservar la prueba decisiva para el recurso, forzando dos rondas de decisión. La lealtad procedimental exige poner las cartas sobre la mesa cuando toca.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> si en una reclamación aparece un documento nuevo, la otra parte tiene derecho a verlo antes de que se decida.</li>\n<li><b>Real:</b> en el recurso contra la denegación de una ayuda, el interesado aporta un informe técnico que no constaba: se da traslado por <b>diez a quince días</b> a los demás interesados.</li>\n<li><b>Caso límite:</b> el recurrente aporta ahora la factura que ya tenía y no presentó en el trámite de alegaciones. <b>No se tendrá en cuenta</b> (art. 118.1, inciso final).</li>\n</ul>", "noej": "<ul>\n<li><b>No son</b> documentos nuevos el propio recurso, los informes ni las propuestas.</li>\n<li><b>No hay</b> que dar audiencia si no aparecen hechos o documentos nuevos.</li>\n<li><b>No cabe</b> un plazo inferior a diez ni superior a quince días.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 82 LPAC:</b> trámite de audiencia en el procedimiento.</li>\n<li><b>Art. 76 LPAC:</b> aportación de alegaciones y documentos por los interesados.</li>\n<li><b>Art. 119.3 LPAC:</b> audiencia previa cuando se resuelvan cuestiones no alegadas.</li>\n</ul>", "trampas": "<ul>\n<li>El plazo tiene <b>suelo y techo</b>: <b>no inferior a diez ni superior a quince</b> días.</li>\n<li>A los otros interesados se les da traslado <b>en todo caso</b>.</li>\n<li>Lo que se pudo aportar y no se aportó, <b>no se tiene en cuenta</b>.</li>\n</ul>", "ancla": "<p><b>«Entre 10 y 15, y solo si es nuevo de verdad.»</b></p>", "vis": "<svg viewBox=\"0 0 640 130\" role=\"img\" aria-label=\"Audiencia en el recurso\">\n<rect x=\"45\" y=\"32\" width=\"245\" height=\"58\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/>\n<text x=\"167\" y=\"54\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">¿Hechos o documentos nuevos?</text>\n<text x=\"167\" y=\"73\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">no recogidos en el expediente originario</text>\n<rect x=\"350\" y=\"32\" width=\"245\" height=\"58\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/>\n<text x=\"472\" y=\"56\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"var(--ej)\">10 a 15 días</text>\n<text x=\"472\" y=\"75\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">de audiencia a los interesados</text>\n<path d=\"M293 61 L 345 61\" stroke=\"var(--acc)\" stroke-width=\"2.5\"/>\n<text x=\"320\" y=\"117\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--exc)\">Lo que se pudo aportar en alegaciones y no se aportó, no se tiene en cuenta</text>\n</svg>"}, {"n": 119, "t": "Resolución", "ubic": "Título V (De la revisión de los actos en vía administrativa) ▸ Capítulo II ▸ Sección 1.ª (Principios generales)", "idea": "Estima, desestima o inadmite; decide todo, pero nunca empeora tu situación.", "literal": "<p>1. La resolución del recurso estimará en todo o en parte o desestimará las pretensiones formuladas en el mismo o declarará su inadmisión.</p><p>2. Cuando existiendo vicio de forma no se estime procedente resolver sobre el fondo se ordenará la retroacción del procedimiento al momento en el que el vicio fue cometido, sin perjuicio de que eventualmente pueda acordarse la convalidación de actuaciones por el órgano competente para ello, de acuerdo con lo dispuesto en el artículo 52.</p><p>3. El órgano que resuelva el recurso decidirá cuantas cuestiones, tanto de forma como de fondo, plantee el procedimiento, hayan sido o no alegadas por los interesados. En este último caso se les oirá previamente. No obstante, la resolución será congruente con las peticiones formuladas por el recurrente, sin que en ningún caso pueda agravarse su situación inicial.</p>", "dis": "<ul>\n<li><b>119.1 — contenido:</b> la resolución <b>estimará en todo o en parte</b>, <b>desestimará</b> las pretensiones o <b>declarará su inadmisión</b>.</li>\n<li><b>119.2 — vicio de forma:</b> cuando exista vicio de forma y no proceda resolver sobre el fondo, se ordena la <b><span class=\"t\" data-k=\"retroaccion\">retroacción</span> del procedimiento al momento en que el vicio fue cometido</b>, sin perjuicio de la eventual <b>convalidación</b> del art. 52.</li>\n<li><b>119.3 — extensión y límite:</b> el órgano decide <b>cuantas cuestiones, de forma y de fondo</b>, plantee el procedimiento, <b>hayan sido o no alegadas</b>; en este último caso, con <b>audiencia previa</b>. Pero la resolución será <b><span class=\"t\" data-k=\"congruencia\">congruente</span></b> con las peticiones del recurrente, <b>sin que en ningún caso pueda agravarse su situación inicial</b>.</li>\n</ul>\n<div class=\"box exc\"><span class=\"lbl\">La prohibición de la reformatio in peius</span>Recurrir nunca puede salir caro. Si la multa era de 300 €, la resolución del recurso <b>no puede</b> elevarla a 600 €, aunque el órgano considere que la sanción fue demasiado benévola.</div>", "llano": "<p>Al resolver, el órgano puede darte la razón entera, en parte, negártela o no entrar en el fondo. Puede examinar cosas que ni siquiera planteaste —oyéndote antes—, pero hay una línea que no puede cruzar: <b>no puede dejarte peor de como estabas</b>.</p>", "porque": "<p>Si recurrir pudiera empeorar la situación, nadie recurriría y la vía administrativa dejaría de cumplir su función de autocontrol. La prohibición de la <b><span class=\"t\" data-k=\"reformatio\">reformatio in peius</span></b> garantiza que el recurso sea un derecho y no un riesgo.</p>\n<p>La retroacción del apartado 2 evita, además, resolver el fondo sobre un procedimiento viciado: se repara el defecto y se continúa desde ahí, aprovechando lo válido (art. 51).</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> reclamar una factura y que no te la suban por haber reclamado.</li>\n<li><b>Real:</b> recurrida una sanción de 300 €, el órgano aprecia que los hechos eran más graves. Puede desestimar el recurso, pero <b>no puede</b> aumentar la multa.</li>\n<li><b>Caso límite:</b> el órgano detecta un vicio de forma no alegado. Puede apreciarlo, previa <b>audiencia</b>, y ordenar la <b>retroacción</b> al momento del vicio (art. 119.2 y 119.3).</li>\n</ul>", "noej": "<ul>\n<li><b>No cabe</b> agravar la situación inicial del recurrente en ningún caso.</li>\n<li><b>No puede</b> resolverse una cuestión no alegada sin <b>oír antes</b> a los interesados.</li>\n<li><b>No es</b> lo mismo inadmitir que desestimar.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 51 LPAC:</b> conservación de actos y trámites tras la retroacción.</li>\n<li><b>Art. 52 LPAC:</b> convalidación, expresamente citada.</li>\n<li><b>Art. 48.2 LPAC:</b> vicios de forma.</li>\n<li><b>Art. 88.2 LPAC:</b> prohibición de agravar la situación inicial también en el procedimiento de oficio.</li>\n</ul>", "trampas": "<ul>\n<li><b>«Sin que en ningún caso pueda agravarse su situación inicial»</b>: no admite excepciones.</li>\n<li>Puede decidirse lo <b>no alegado</b>, pero con <b>audiencia previa</b>.</li>\n<li>La retroacción va al <b>momento en que el vicio se cometió</b>, no al inicio del procedimiento.</li>\n</ul>", "ancla": "<p><b>«Todo lo que haya, pero nunca peor.»</b> Y el vicio de forma, <b>retroacción</b> al punto exacto.</p>", "vis": "<svg viewBox=\"0 0 660 145\" role=\"img\" aria-label=\"Resolución del recurso\">\n<g font-size=\"10\" text-anchor=\"middle\" fill=\"currentColor\">\n<rect x=\"15\" y=\"30\" width=\"140\" height=\"52\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"85\" y=\"60\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">Estima</text>\n<rect x=\"167\" y=\"30\" width=\"140\" height=\"52\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"237\" y=\"60\" font-size=\"11\" font-weight=\"700\" fill=\"var(--warn)\">Desestima</text>\n<rect x=\"319\" y=\"30\" width=\"140\" height=\"52\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"389\" y=\"60\" font-size=\"11\" font-weight=\"700\" fill=\"var(--exc)\">Inadmite</text>\n<rect x=\"471\" y=\"30\" width=\"175\" height=\"52\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"558\" y=\"53\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">Retroacción</text><text x=\"558\" y=\"70\">si hay vicio de forma</text>\n</g>\n<rect x=\"130\" y=\"98\" width=\"400\" height=\"34\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/>\n<text x=\"330\" y=\"120\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--exc)\">NUNCA puede agravarse la situación inicial del recurrente</text>\n</svg>"}]);
</script>
<script>
ARTS.push.apply(ARTS,[{"n": 120, "t": "Pluralidad de recursos administrativos", "ubic": "Título V (De la revisión de los actos en vía administrativa) ▸ Capítulo II ▸ Sección 1.ª (Principios generales)", "idea": "Muchos recursos iguales: se suspende el plazo hasta que hable el juez.", "literal": "<p>1. Cuando deban resolverse una pluralidad de recursos administrativos que traigan causa de un mismo acto administrativo y se hubiera interpuesto un recurso judicial contra una resolución administrativa o bien contra el correspondiente acto presunto desestimatorio, el órgano administrativo podrá acordar la suspensión del plazo para resolver hasta que recaiga pronunciamiento judicial.</p><p>2. El acuerdo de suspensión deberá ser notificado a los interesados, quienes podrán recurrirlo. La interposición del correspondiente recurso por un interesado, no afectará a los restantes procedimientos de recurso que se encuentren suspendidos por traer causa del mismo acto administrativo.</p><p>3. Recaído el pronunciamiento judicial, será comunicado a los interesados y el órgano administrativo competente para resolver podrá dictar resolución sin necesidad de realizar ningún trámite adicional, salvo el de audiencia, cuando proceda.</p>", "dis": "<ul>\n<li><b>120.1 — supuesto:</b> pluralidad de recursos que traen causa de un <b>mismo acto</b> y existe ya un <b>recurso judicial</b> contra una resolución administrativa o contra el acto presunto desestimatorio. El órgano <b>podrá acordar la suspensión del plazo para resolver</b> hasta que recaiga <b>pronunciamiento judicial</b>.</li>\n<li><b>120.2 — notificación:</b> el acuerdo de suspensión se notifica a los interesados, que <b>pueden recurrirlo</b>. El recurso de uno <b>no afecta</b> a los demás procedimientos suspendidos.</li>\n<li><b>120.3 — tras la sentencia:</b> se comunica a los interesados y el órgano <b>puede resolver sin trámite adicional</b>, salvo el de <b>audiencia</b> cuando proceda.</li>\n</ul>", "llano": "<p>Cuando cien personas recurren lo mismo y un caso ya está en el juzgado, no tiene sentido resolver cien veces a ciegas. Se paran los plazos, se espera la sentencia y luego se resuelve todo conforme a ella.</p>", "porque": "<p>Es coherencia y economía. Resolver los recursos antes de la sentencia produciría respuestas administrativas que podrían quedar desmentidas días después, con el consiguiente coste para todos. La ley preserva la <b>unidad de criterio</b> y evita resoluciones contradictorias sobre el mismo acto.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> esperar al resultado de un caso piloto antes de resolver los demás iguales.</li>\n<li><b>Real:</b> ochenta aspirantes recurren la misma base de una convocatoria; uno ya ha acudido al contencioso. El ayuntamiento suspende el plazo para resolver los setenta y nueve restantes.</li>\n<li><b>Caso límite:</b> un interesado recurre el acuerdo de suspensión. Su recurso <b>no levanta</b> la suspensión de los demás (art. 120.2).</li>\n</ul>", "noej": "<ul>\n<li><b>No procede</b> si los recursos no traen causa del <b>mismo acto</b>.</li>\n<li><b>No es</b> automática: la ley dice <b>«podrá acordar»</b>.</li>\n<li><b>No exime</b> del trámite de <b>audiencia</b> cuando proceda.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 22 LPAC:</b> suspensión del plazo máximo para resolver.</li>\n<li><b>Art. 118 LPAC:</b> audiencia de los interesados.</li>\n<li><b>Art. 45.1.b) LPAC:</b> procedimientos de concurrencia, donde suele producirse este supuesto.</li>\n</ul>", "trampas": "<ul>\n<li>Se suspende el <b>plazo para resolver</b>, no el procedimiento entero.</li>\n<li>El acuerdo de suspensión <b>es recurrible</b>, pero solo respecto de quien lo recurre.</li>\n<li>Tras la sentencia, cabe resolver <b>sin trámite adicional</b>, salvo audiencia.</li>\n</ul>", "ancla": "<p><b>«Mismo acto, muchos recursos y un juez ya mirando: se espera.»</b></p>", "vis": "<svg viewBox=\"0 0 640 130\" role=\"img\" aria-label=\"Pluralidad de recursos administrativos\">\n<defs><marker id=\"pl1\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\"><path d=\"M0 0 L9 4.5 L0 9 z\" fill=\"var(--acc)\"/></marker></defs>\n<rect x=\"20\" y=\"35\" width=\"170\" height=\"55\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/>\n<text x=\"105\" y=\"58\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">Muchos recursos</text>\n<text x=\"105\" y=\"76\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">del mismo acto</text>\n<path d=\"M193 62 L 228 62\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#pl1)\"/>\n<rect x=\"232\" y=\"35\" width=\"180\" height=\"55\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/>\n<text x=\"322\" y=\"58\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--warn)\">Suspensión del plazo</text>\n<text x=\"322\" y=\"76\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">hay recurso judicial en curso</text>\n<path d=\"M415 62 L 450 62\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#pl1)\"/>\n<rect x=\"454\" y=\"35\" width=\"170\" height=\"55\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/>\n<text x=\"539\" y=\"58\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">Sentencia</text>\n<text x=\"539\" y=\"76\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">se resuelven todos</text>\n</svg>"}, {"n": 121, "t": "Objeto", "ubic": "Título V ▸ Capítulo II ▸ Sección 2.ª (Recurso de alzada)", "idea": "Alzada ante el superior jerárquico; se puede presentar ante cualquiera de los dos.", "literal": "<p>1. Las resoluciones y actos a que se refiere el artículo 112.1, cuando no pongan fin a la vía administrativa, podrán ser recurridos en alzada ante el órgano superior jerárquico del que los dictó. A estos efectos, los Tribunales y órganos de selección del personal al servicio de las Administraciones Públicas y cualesquiera otros que, en el seno de éstas, actúen con autonomía funcional, se considerarán dependientes del órgano al que estén adscritos o, en su defecto, del que haya nombrado al presidente de los mismos.</p><p>2. El recurso podrá interponerse ante el órgano que dictó el acto que se impugna o ante el competente para resolverlo. Si el recurso se hubiera interpuesto ante el órgano que dictó el acto impugnado, éste deberá remitirlo al competente en el plazo de diez días, con su informe y con una copia completa y ordenada del expediente. El titular del órgano que dictó el acto recurrido será responsable directo del cumplimiento de lo previsto en el párrafo anterior.</p>", "dis": "<ul>\n<li><b>121.1 — objeto:</b> las resoluciones y actos del art. 112.1, <b>cuando no pongan fin a la vía administrativa</b>, pueden recurrirse en <span class=\"t\" data-k=\"alzada\">alzada</span> ante el <b>órgano superior jerárquico</b> del que los dictó. Los <b>tribunales y órganos de selección</b> de personal y cualesquiera otros que actúen con <b><span class=\"t\" data-k=\"autonomia\">autonomía funcional</span></b> se consideran dependientes del órgano al que estén adscritos o del que dependa su presidente.</li>\n<li><b>121.2 — dónde se presenta:</b> ante el <b>órgano que dictó</b> el acto <b>o</b> ante el <b>competente para resolverlo</b>. Si se presenta ante el primero, este debe <b>remitirlo en diez días</b> al competente, con su <b>informe</b> y una <b>copia completa y ordenada del expediente</b>. El titular del órgano que dictó el acto es <b>responsable directo</b> del cumplimiento de esa obligación.</li>\n</ul>", "llano": "<p>La alzada se dirige al jefe del que dictó el acto. Puedes presentarla donde quieras de los dos, y si la presentas abajo, ese órgano tiene <b>diez días</b> para subirla con su informe y el expediente completo. Si no lo hace, responde personalmente.</p>", "porque": "<p>Permitir presentar el recurso ante el órgano que dictó el acto facilita la vida al ciudadano, que no tiene por qué averiguar la estructura jerárquica de la Administración. La <b>responsabilidad directa</b> del titular es la garantía de que ese favor no se convierta en un cajón donde el recurso se pierde.</p>\n<p>La regla sobre los <b>órganos de selección</b> resuelve un problema real: un tribunal de oposición no tiene superior jerárquico natural, y sin esta ficción sus actos serían irrecurribles en vía administrativa.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> entregar una queja al empleado que te atendió sabiendo que la hará llegar a su jefe.</li>\n<li><b>Real:</b> un aspirante recurre en alzada la exclusión acordada por el tribunal de una oposición municipal: resuelve el órgano al que el tribunal está adscrito (art. 121.1).</li>\n<li><b>Caso límite:</b> el recurso se presenta ante el órgano autor el 2 de mayo y este lo remite el 30. Ha incumplido el plazo de <b>diez días</b> y su titular es <b>responsable directo</b>.</li>\n</ul>", "noej": "<ul>\n<li><b>No cabe</b> alzada contra actos que <b>ponen fin</b> a la vía administrativa.</li>\n<li><b>No resuelve</b> la alzada el propio órgano autor del acto.</li>\n<li><b>No es</b> potestativa: para agotar la vía hay que interponerla.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 114 LPAC:</b> qué actos ponen fin a la vía administrativa.</li>\n<li><b>Art. 122 LPAC:</b> plazos de la alzada.</li>\n<li><b>Art. 112.2 LPAC:</b> procedimientos que pueden sustituirla.</li>\n<li><b>Art. 16.4 LPAC:</b> lugares de presentación de escritos.</li>\n</ul>", "trampas": "<ul>\n<li>Cabe presentarla ante <b>cualquiera de los dos</b> órganos.</li>\n<li>El plazo de remisión es de <b>diez días</b>, con <b>informe</b> y <b>copia completa y ordenada</b> del expediente.</li>\n<li>Los <b>órganos de selección</b> se consideran dependientes del órgano al que están adscritos.</li>\n</ul>", "ancla": "<p><b>«Al jefe, y por donde quieras; si entras por abajo, diez días para subir.»</b></p>", "vis": "<svg viewBox=\"0 0 640 145\" role=\"img\" aria-label=\"Recurso de alzada\">\n<defs><marker id=\"al1\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\"><path d=\"M0 0 L9 4.5 L0 9 z\" fill=\"var(--acc)\"/></marker></defs>\n<rect x=\"200\" y=\"12\" width=\"240\" height=\"38\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/>\n<text x=\"320\" y=\"36\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">ÓRGANO SUPERIOR JERÁRQUICO</text>\n<path d=\"M320 92 L 320 54\" stroke=\"var(--acc)\" stroke-width=\"2.5\" marker-end=\"url(#al1)\"/>\n<text x=\"405\" y=\"76\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--ink2)\">resuelve la alzada</text>\n<rect x=\"200\" y=\"92\" width=\"240\" height=\"38\" rx=\"8\" fill=\"var(--panel)\" stroke=\"var(--line)\"/>\n<text x=\"320\" y=\"116\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\">Órgano que dictó el acto</text>\n<text x=\"105\" y=\"105\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--exc)\">10 días para remitir</text>\n<text x=\"105\" y=\"120\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--exc)\">con informe y expediente</text>\n<text x=\"545\" y=\"112\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--ink2)\">se presenta ante cualquiera de los dos</text>\n</svg>"}, {"n": 122, "t": "Plazos", "ubic": "Título V ▸ Capítulo II ▸ Sección 2.ª (Recurso de alzada)", "idea": "Un mes para interponer si es expreso; tres meses para resolver; silencio negativo.", "literal": "<p>1. El plazo para la interposición del recurso de alzada será de un mes, si el acto fuera expreso. Transcurrido dicho plazo sin haberse interpuesto el recurso, la resolución será firme a todos los efectos. Si el acto no fuera expreso el solicitante y otros posibles interesados podrán interponer recurso de alzada en cualquier momento a partir del día siguiente a aquel en que, de acuerdo con su normativa específica, se produzcan los efectos del silencio administrativo.</p><p>2. El plazo máximo para dictar y notificar la resolución será de tres meses. Transcurrido este plazo sin que recaiga resolución, se podrá entender desestimado el recurso, salvo en el supuesto previsto en el artículo 24.1, tercer párrafo.</p><p>3. Contra la resolución de un recurso de alzada no cabrá ningún otro recurso administrativo, salvo el recurso extraordinario de revisión, en los casos establecidos en el artículo 125.1.</p>", "dis": "<table><thead><tr><th>Cuestión</th><th>Regla</th></tr></thead><tbody>\n<tr><td><b>Plazo de interposición · acto expreso</b></td><td><b>Un mes</b>. Transcurrido, la resolución es <b>firme a todos los efectos</b></td></tr>\n<tr><td><b>Plazo · <span class=\"t\" data-k=\"presunto\">acto presunto</span></b></td><td><b>En cualquier momento</b> a partir del día siguiente a aquel en que se produzcan los efectos del silencio</td></tr>\n<tr><td><b>Plazo para resolver y notificar</b></td><td><b>Tres meses</b>. Transcurrido sin resolución, el recurso <b>se entiende desestimado</b>, salvo el supuesto del art. 24.1, párrafo tercero</td></tr>\n<tr><td><b>Recursos posteriores</b></td><td>Contra la resolución de la alzada <b>no cabe ningún otro recurso administrativo</b>, salvo el <b>extraordinario de revisión</b></td></tr>\n</tbody></table>\n<div class=\"box warn\"><span class=\"lbl\">La excepción del art. 24.1, párrafo tercero</span>Cuando el recurso de alzada se interpone contra la <b>desestimación por silencio</b> de una solicitud, el silencio del recurso es <b>estimatorio</b>: es el <b>doble silencio positivo</b>. <b>Pero solo</b> si el asunto <b>no se refiere</b> a las materias del párrafo anterior del art. 24.1: <b>derecho de petición</b>, transferencia de facultades sobre el <b>dominio público</b> o el <b>servicio público</b>, actividades que puedan <b>dañar el medio ambiente</b> y <b>responsabilidad patrimonial</b>.</div>", "llano": "<p>Un mes para recurrir si te contestaron; si no te contestaron, cuando quieras. La Administración tiene tres meses para resolver y, si calla, se entiende que te dice que no. Con una excepción de oro: si el acto que recurriste era ya un silencio negativo, el segundo silencio es <b>positivo</b>, salvo que se trate de dominio público, servicio público, medio ambiente, derecho de petición o responsabilidad patrimonial.</p>", "porque": "<p>El plazo abierto para los actos presuntos protege al ciudadano: si la Administración incumplió su deber de resolver, no puede además beneficiarse imponiéndole un plazo perentorio. Y el <b>doble silencio positivo</b> castiga la inactividad reiterada: callar una vez tiene un precio; callar dos, otro mayor.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> un plazo que no corre mientras la otra parte no conteste.</li>\n<li><b>Real:</b> resolución expresa notificada el 10 de abril: la alzada puede interponerse hasta el <b>10 de mayo</b>. Presentada el 5 de mayo, la Administración debe resolver antes del <b>5 de agosto</b>.</li>\n<li><b>Caso límite:</b> se solicita una licencia, no se contesta y opera el silencio <b>negativo</b>; se interpone alzada y tampoco se contesta en tres meses. El recurso se entiende <b>estimado</b> (art. 24.1, párrafo tercero).</li>\n</ul>", "noej": "<ul>\n<li><b>No hay</b> plazo de interposición frente a los actos <b>presuntos</b>.</li>\n<li><b>No cabe</b> reposición contra la resolución de una alzada.</li>\n<li><b>No es</b> siempre negativo el silencio de la alzada: existe la excepción del doble silencio.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 24 LPAC:</b> silencio administrativo, incluido el párrafo tercero del apartado 1.</li>\n<li><b>Art. 30 LPAC:</b> cómputo de plazos por meses, de fecha a fecha.</li>\n<li><b>Art. 125.1 LPAC:</b> causas del recurso extraordinario de revisión.</li>\n</ul>", "trampas": "<ul>\n<li><b>Un mes</b> para interponer; <b>tres meses</b> para resolver. No los intercambies.</li>\n<li>Frente al acto presunto, <b>en cualquier momento</b>.</li>\n<li>Contra la resolución de la alzada solo cabe el <b>extraordinario de revisión</b>.</li>\n<li>El <b>doble silencio positivo</b> tiene <b>materias excluidas</b>: petición, dominio y servicio público, medio ambiente y responsabilidad patrimonial.</li>\n</ul>", "ancla": "<p><b>«Alzada: 1 mes para subir, 3 meses para bajar.»</b> Y si ya venías de un silencio, el segundo te da la razón, salvo materias excluidas.</p>", "vis": "<svg viewBox=\"0 0 660 150\" role=\"img\" aria-label=\"Plazos del recurso de alzada\">\n<g font-size=\"10\" text-anchor=\"middle\" fill=\"currentColor\">\n<rect x=\"20\" y=\"30\" width=\"195\" height=\"60\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"117\" y=\"54\" font-size=\"13\" font-weight=\"700\" fill=\"var(--acc)\">1 mes</text><text x=\"117\" y=\"74\">para interponer (acto expreso)</text>\n<rect x=\"230\" y=\"30\" width=\"195\" height=\"60\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"327\" y=\"54\" font-size=\"13\" font-weight=\"700\" fill=\"var(--ej)\">Sin plazo</text><text x=\"327\" y=\"74\">si el acto es presunto</text>\n<rect x=\"440\" y=\"30\" width=\"200\" height=\"60\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"540\" y=\"54\" font-size=\"13\" font-weight=\"700\" fill=\"var(--warn)\">3 meses</text><text x=\"540\" y=\"74\">para resolver · silencio negativo</text>\n</g>\n<rect x=\"130\" y=\"104\" width=\"400\" height=\"34\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/>\n<text x=\"330\" y=\"126\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">DOBLE SILENCIO: si el acto recurrido era presunto negativo → estimatorio</text>\n</svg>"}, {"n": 123, "t": "Objeto y naturaleza", "ubic": "Título V ▸ Capítulo II ▸ Sección 3.ª (Recurso potestativo de reposición)", "idea": "Reposición: potestativa, ante el mismo órgano, o directamente al juez.", "literal": "<p>1. Los actos administrativos que pongan fin a la vía administrativa podrán ser recurridos potestativamente en reposición ante el mismo órgano que los hubiera dictado o ser impugnados directamente ante el orden jurisdiccional contencioso-administrativo.</p><p>2. No se podrá interponer recurso contencioso-administrativo hasta que sea resuelto expresamente o se haya producido la desestimación presunta del recurso de reposición interpuesto.</p>", "dis": "<ul>\n<li><b>123.1 — objeto:</b> los actos que <b>pongan fin a la vía administrativa</b> pueden recurrirse <b>potestativamente en <span class=\"t\" data-k=\"reposicion\">reposición</span></b> ante el <b>mismo órgano</b> que los dictó, <b>o</b> ser impugnados <b>directamente</b> ante el orden contencioso-administrativo.</li>\n<li><b>123.2 — incompatibilidad temporal:</b> <b>no se podrá interponer recurso contencioso-administrativo</b> hasta que la reposición <b>sea resuelta expresamente</b> o se haya producido su <b>desestimación presunta</b>.</li>\n</ul>\n<div class=\"box warn\"><span class=\"lbl\">Potestativo, pero no simultáneo</span>Puedes elegir entre reposición o contencioso. Lo que <b>no</b> puedes es abrir las dos vías a la vez: elegida la reposición, hay que esperar a su resolución expresa o presunta.</div>", "llano": "<p>Cuando el acto ya agota la vía administrativa tienes dos caminos: pedir al mismo órgano que reconsidere —reposición— o ir directo al juzgado. Si eliges la reposición, tienes que esperar a que la resuelvan o a que venza el plazo antes de acudir al juez.</p>", "porque": "<p>La reposición es <b>potestativa</b> desde 1999 porque obligar a pedir reconsideración al mismo órgano que acaba de decidir tenía escasa utilidad y retrasaba el acceso a la justicia. Se mantiene como <b>oportunidad</b> —barata, rápida y sin abogado— para quien prefiera intentarlo antes de pleitear.</p>\n<p>La regla del apartado 2 evita el <b>doble enjuiciamiento simultáneo</b> del mismo acto por la Administración y por el juez, con el riesgo de decisiones contradictorias.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> pedir al mismo comercio que revise su decisión antes de acudir a consumo.</li>\n<li><b>Real:</b> frente a una resolución de la alcaldía, el interesado interpone reposición. Hasta que se resuelva o transcurra el mes, no puede acudir al contencioso.</li>\n<li><b>Caso límite:</b> el interesado presenta reposición y, tres días después, recurso contencioso. Este último es <b>prematuro</b> conforme al art. 123.2.</li>\n</ul>", "noej": "<ul>\n<li><b>No cabe</b> reposición contra actos que <b>no</b> agotan la vía: para esos, alzada.</li>\n<li><b>No es</b> obligatoria: se puede ir directamente al contencioso.</li>\n<li><b>No pueden</b> simultanearse reposición y contencioso.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 114 LPAC:</b> actos que ponen fin a la vía administrativa.</li>\n<li><b>Art. 124 LPAC:</b> plazos de la reposición.</li>\n<li><b>Art. 112.1 LPAC:</b> carácter potestativo del recurso.</li>\n</ul>", "trampas": "<ul>\n<li>Se interpone ante el <b>mismo órgano</b> que dictó el acto.</li>\n<li>Es <b>potestativa</b>, pero excluye temporalmente el contencioso.</li>\n<li>Solo procede contra actos que <b>ponen fin</b> a la vía administrativa.</li>\n</ul>", "ancla": "<p><b>«Mismo órgano, si quieres; pero si lo pides, esperas.»</b></p>", "vis": "<svg viewBox=\"0 0 640 140\" role=\"img\" aria-label=\"Recurso potestativo de reposición\">\n<rect x=\"200\" y=\"8\" width=\"240\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/>\n<text x=\"320\" y=\"29\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">ACTO QUE PONE FIN A LA VÍA</text>\n<line x1=\"320\" y1=\"40\" x2=\"320\" y2=\"54\" stroke=\"var(--acc)\" stroke-width=\"2\"/>\n<line x1=\"170\" y1=\"54\" x2=\"470\" y2=\"54\" stroke=\"var(--acc)\" stroke-width=\"2\"/>\n<line x1=\"170\" y1=\"54\" x2=\"170\" y2=\"68\" stroke=\"var(--acc)\" stroke-width=\"2\"/>\n<line x1=\"470\" y1=\"54\" x2=\"470\" y2=\"68\" stroke=\"var(--acc)\" stroke-width=\"2\"/>\n<rect x=\"45\" y=\"68\" width=\"250\" height=\"52\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/>\n<text x=\"170\" y=\"90\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">Reposición (potestativa)</text>\n<text x=\"170\" y=\"108\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">ante el mismo órgano</text>\n<rect x=\"345\" y=\"68\" width=\"250\" height=\"52\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/>\n<text x=\"470\" y=\"90\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--warn)\">Contencioso directo</text>\n<text x=\"470\" y=\"108\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">sin pasar por la Administración</text>\n</svg>"}]);
</script>
<script>
ARTS.push.apply(ARTS,[{"n": 124, "t": "Plazos", "ubic": "Título V ▸ Capítulo II ▸ Sección 3.ª (Recurso potestativo de reposición)", "idea": "Un mes para interponer y un mes para resolver.", "literal": "<p>1. El plazo para la interposición del recurso de reposición será de un mes, si el acto fuera expreso. Transcurrido dicho plazo, únicamente podrá interponerse recurso contencioso- administrativo, sin perjuicio, en su caso, de la procedencia del recurso extraordinario de revisión. Si el acto no fuera expreso, el solicitante y otros posibles interesados podrán interponer recurso de reposición en cualquier momento a partir del día siguiente a aquel en que, de acuerdo con su normativa específica, se produzca el acto presunto.</p><p>2. El plazo máximo para dictar y notificar la resolución del recurso será de un mes.</p><p>3. Contra la resolución de un recurso de reposición no podrá interponerse de nuevo dicho recurso.</p>", "dis": "<table><thead><tr><th>Cuestión</th><th>Regla</th></tr></thead><tbody>\n<tr><td><b>Interposición · acto expreso</b></td><td><b>Un mes</b>. Transcurrido, solo cabe <b>contencioso-administrativo</b>, sin perjuicio del extraordinario de revisión</td></tr>\n<tr><td><b>Interposición · acto presunto</b></td><td><b>En cualquier momento</b> a partir del día siguiente a aquel en que se produzcan los efectos del silencio</td></tr>\n<tr><td><b>Resolución</b></td><td><b>Un mes</b> para dictar y notificar</td></tr>\n<tr><td><b>Nuevo recurso</b></td><td>Contra la resolución de la reposición <b>no puede interponerse de nuevo</b> dicho recurso</td></tr>\n</tbody></table>\n<div class=\"box ej\"><span class=\"lbl\">La comparación que hay que llevar grabada</span><b>Alzada: 1 mes / 3 meses.</b> <b>Reposición: 1 mes / 1 mes.</b> Coinciden en la interposición y se separan en la resolución.</div>", "llano": "<p>Un mes para presentarla y un mes para que te contesten. Si no contestan, se entiende desestimada y se abre el camino al juzgado. Y no se puede reponer dos veces sobre lo mismo.</p>", "porque": "<p>El plazo de resolución es más corto que en la alzada porque el órgano <b>ya conoce el asunto</b>: no necesita pedir expediente ni informe a nadie. Y la prohibición de reiterar la reposición evita el bucle de reconsideraciones sucesivas ante el mismo órgano.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> una segunda opinión al mismo médico: se pide una vez, no tres.</li>\n<li><b>Real:</b> reposición interpuesta el 4 de junio contra una resolución de alcaldía. Si el 4 de julio no hay resolución, se entiende desestimada y queda abierta la vía contenciosa.</li>\n<li><b>Caso límite:</b> el interesado deja pasar el mes sin recurrir en reposición. Puede seguir acudiendo al <b>contencioso</b> dentro de su propio plazo: la reposición era potestativa.</li>\n</ul>", "noej": "<ul>\n<li><b>No cabe</b> interponer reposición contra la resolución de una reposición.</li>\n<li><b>No hay</b> plazo de interposición frente a actos presuntos.</li>\n<li><b>No son</b> tres meses para resolver: eso es la alzada.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 122 LPAC:</b> plazos de la alzada, para contrastar.</li>\n<li><b>Art. 24 LPAC:</b> silencio administrativo.</li>\n<li><b>Art. 125 LPAC:</b> recurso extraordinario de revisión.</li>\n</ul>", "trampas": "<ul>\n<li><b>Un mes y un mes</b>: la reposición es simétrica.</li>\n<li>No cabe <b>reiterar</b> la reposición.</li>\n<li>Perdido el mes, aún cabe el <b>contencioso</b> en su plazo propio.</li>\n</ul>", "ancla": "<p><b>«Reposición: uno y uno. Alzada: uno y tres.»</b></p>", "vis": "<svg viewBox=\"0 0 640 130\" role=\"img\" aria-label=\"Plazos comparados de alzada y reposición\">\n<g font-size=\"10\" text-anchor=\"middle\" fill=\"currentColor\">\n<rect x=\"40\" y=\"28\" width=\"250\" height=\"70\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/>\n<text x=\"165\" y=\"50\" font-size=\"11\" font-weight=\"700\" fill=\"var(--warn)\">ALZADA</text>\n<text x=\"165\" y=\"70\" font-size=\"12\" font-weight=\"700\">1 mes interponer</text>\n<text x=\"165\" y=\"88\" font-size=\"12\" font-weight=\"700\">3 meses resolver</text>\n<rect x=\"350\" y=\"28\" width=\"250\" height=\"70\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/>\n<text x=\"475\" y=\"50\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">REPOSICIÓN</text>\n<text x=\"475\" y=\"70\" font-size=\"12\" font-weight=\"700\">1 mes interponer</text>\n<text x=\"475\" y=\"88\" font-size=\"12\" font-weight=\"700\">1 mes resolver</text>\n</g>\n<text x=\"320\" y=\"120\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--ink2)\">En ambos casos, si el acto es presunto: interposición en cualquier momento</text>\n</svg>"}, {"n": 125, "t": "Objeto y plazos", "ubic": "Título V ▸ Capítulo II ▸ Sección 4.ª (Recurso extraordinario de revisión)", "idea": "Cuatro causas tasadas; cuatro años para el error de hecho y tres meses para las demás.", "literal": "<p>1. Contra los actos firmes en vía administrativa podrá interponerse el recurso extraordinario de revisión ante el órgano administrativo que los dictó, que también será el competente para su resolución, cuando concurra alguna de las circunstancias siguientes:</p><p>a) Que al dictarlos se hubiera incurrido en error de hecho, que resulte de los propios documentos incorporados al expediente.</p><p>b) Que aparezcan documentos de valor esencial para la resolución del asunto que, aunque sean posteriores, evidencien el error de la resolución recurrida.</p><p>c) Que en la resolución hayan influido esencialmente documentos o testimonios declarados falsos por sentencia judicial firme, anterior o posterior a aquella resolución.</p><p>d) Que la resolución se hubiese dictado como consecuencia de prevaricación, cohecho, violencia, maquinación fraudulenta u otra conducta punible y se haya declarado así en virtud de sentencia judicial firme.</p><p>2. El recurso extraordinario de revisión se interpondrá, cuando se trate de la causa a) del apartado anterior, dentro del plazo de cuatro años siguientes a la fecha de la notificación de la resolución impugnada. En los demás casos, el plazo será de tres meses a contar desde el conocimiento de los documentos o desde que la sentencia judicial quedó firme.</p><p>3. Lo establecido en el presente artículo no perjudica el derecho de los interesados a formular la solicitud y la instancia a que se refieren los artículos 106 y 109.2 de la presente Ley ni su derecho a que las mismas se sustancien y resuelvan.</p>", "dis": "<p><b>125.1 — se interpone ante el <u>mismo órgano que dictó</u> el acto, que también lo resuelve, en cuatro casos:</b></p>\n<table><thead><tr><th>Letra</th><th>Causa</th><th>Plazo</th></tr></thead><tbody>\n<tr><td><b>a)</b></td><td><b><span class=\"t\" data-k=\"errorhecho\">Error de hecho</span></b> que resulte de los <b>propios documentos</b> incorporados al expediente</td><td><b>4 años</b> desde la notificación</td></tr>\n<tr><td><b>b)</b></td><td>Aparición de <b>documentos de valor esencial</b> que, aunque sean <b>posteriores</b>, <b>evidencien el error</b> de la resolución</td><td><b>3 meses</b> desde el conocimiento de los documentos</td></tr>\n<tr><td><b>c)</b></td><td>Documentos o testimonios <b>declarados falsos</b> por sentencia judicial firme, <b>anterior o posterior</b>, que hayan <b>influido esencialmente</b></td><td><b>3 meses</b> desde la firmeza de la sentencia</td></tr>\n<tr><td><b>d)</b></td><td>Resolución dictada como consecuencia de <b>prevaricación, cohecho, violencia, maquinación fraudulenta</b> u otra conducta punible, <b>declarada por sentencia firme</b></td><td><b>3 meses</b> desde la firmeza de la sentencia</td></tr>\n</tbody></table>\n<p><b>125.3 — compatibilidad:</b> lo anterior <b>no perjudica</b> el derecho de los interesados a formular la solicitud y la instancia de los <b>arts. 106 y 109.2</b> —revisión de oficio y rectificación de errores— ni a que se sustancien y resuelvan.</p>", "llano": "<p>Es la vía para actos ya firmes, y solo por cuatro motivos: un error de bulto que se ve en el propio expediente, un documento decisivo que aparece después, papeles declarados falsos o un delito probado en sentencia. Cuatro años para el primero; tres meses para los otros tres.</p>", "porque": "<p>Las cuatro causas comparten un rasgo: en todas ellas la resolución se apoyó en una <b>base fáctica falsa o incompleta</b> que no era imputable al interesado. No se revisa el criterio jurídico —para eso estaban los recursos ordinarios—, sino los <b>hechos</b> sobre los que se decidió. Por eso tres de las cuatro causas exigen <b>sentencia firme</b> o documentos <b>sobrevenidos</b>.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> reabrir un caso cerrado porque aparece una grabación decisiva.</li>\n<li><b>Real:</b> una resolución de 2024 denegó una ayuda por considerar que la solicitante superaba el umbral de renta, cuando la certificación del propio expediente decía lo contrario: <b>error de hecho</b> (letra a), <b>cuatro años</b> desde la notificación.</li>\n<li><b>Caso límite:</b> el interesado quiere revisar porque discrepa de la interpretación jurídica de una ordenanza. <b>No cabe</b>: no es error de hecho, sino de Derecho.</li>\n</ul>", "noej": "<ul>\n<li><b>No cabe</b> por error de <b>Derecho</b> ni por cambio de criterio.</li>\n<li><b>No sirve</b> el documento posterior que no <b>evidencie el error</b> de la resolución.</li>\n<li><b>No excluye</b> la revisión de oficio del art. 106 ni la rectificación del art. 109.2.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 113 LPAC:</b> solo cabe esta vía contra actos firmes.</li>\n<li><b>Art. 126 LPAC:</b> resolución del recurso.</li>\n<li><b>Arts. 106 y 109.2 LPAC:</b> vías compatibles, citadas expresamente.</li>\n</ul>", "trampas": "<ul>\n<li>Lo resuelve el <b>mismo órgano</b> que dictó el acto.</li>\n<li>Los plazos: <b>cuatro años</b> solo para la letra a); <b>tres meses</b> para b), c) y d).</li>\n<li>En la letra c) la sentencia puede ser <b>anterior o posterior</b> a la resolución.</li>\n<li>La letra b) admite documentos <b>posteriores</b>, siempre que evidencien el error.</li>\n</ul>", "ancla": "<p><b>«Error a la vista (4 años) · documento que aparece · papel falso · delito probado (3 meses).»</b></p>", "vis": "<svg viewBox=\"0 0 660 155\" role=\"img\" aria-label=\"Causas y plazos del recurso extraordinario de revisión\">\n<rect x=\"195\" y=\"8\" width=\"270\" height=\"30\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/>\n<text x=\"330\" y=\"28\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">CONTRA ACTOS FIRMES</text>\n<g font-size=\"10\" text-anchor=\"middle\" fill=\"currentColor\">\n<rect x=\"15\" y=\"52\" width=\"150\" height=\"66\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"90\" y=\"74\" font-weight=\"700\" fill=\"var(--ej)\">a) Error de hecho</text><text x=\"90\" y=\"91\">en el propio expediente</text><text x=\"90\" y=\"108\" font-size=\"12\" font-weight=\"700\">4 AÑOS</text>\n<rect x=\"175\" y=\"52\" width=\"150\" height=\"66\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"250\" y=\"74\" font-weight=\"700\" fill=\"var(--warn)\">b) Documentos</text><text x=\"250\" y=\"91\">esenciales aparecidos</text><text x=\"250\" y=\"108\" font-size=\"12\" font-weight=\"700\">3 MESES</text>\n<rect x=\"335\" y=\"52\" width=\"150\" height=\"66\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"410\" y=\"74\" font-weight=\"700\" fill=\"var(--warn)\">c) Documentos falsos</text><text x=\"410\" y=\"91\">por sentencia firme</text><text x=\"410\" y=\"108\" font-size=\"12\" font-weight=\"700\">3 MESES</text>\n<rect x=\"495\" y=\"52\" width=\"150\" height=\"66\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"570\" y=\"74\" font-weight=\"700\" fill=\"var(--exc)\">d) Conducta punible</text><text x=\"570\" y=\"91\">declarada en sentencia</text><text x=\"570\" y=\"108\" font-size=\"12\" font-weight=\"700\">3 MESES</text>\n</g>\n<text x=\"330\" y=\"145\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--ink2)\">Se interpone y resuelve ante el MISMO órgano que dictó el acto</text>\n</svg>"}, {"n": 126, "t": "Resolución", "ubic": "Título V ▸ Capítulo II ▸ Sección 4.ª (Recurso extraordinario de revisión)", "idea": "Inadmisión motivada sin dictamen; y tres meses de silencio desestimatorio.", "literal": "<p>1. El órgano competente para la resolución del recurso podrá acordar motivadamente la inadmisión a trámite, sin necesidad de recabar dictamen del Consejo de Estado u órgano consultivo de la Comunidad Autónoma, cuando el mismo no se funde en alguna de las causas previstas en el apartado 1 del artículo anterior o en el supuesto de que se hubiesen desestimado en cuanto al fondo otros recursos sustancialmente iguales.</p><p>2. El órgano al que corresponde conocer del recurso extraordinario de revisión debe pronunciarse no sólo sobre la procedencia del recurso, sino también, en su caso, sobre el fondo de la cuestión resuelta por el acto recurrido.</p><p>3. Transcurrido el plazo de tres meses desde la interposición del recurso extraordinario de revisión sin haberse dictado y notificado la resolución, se entenderá desestimado, quedando expedita la vía jurisdiccional contencioso-administrativa.</p>", "dis": "<ul>\n<li><b>126.1 — inadmisión:</b> cabe acordar <b>motivadamente la inadmisión a trámite</b>, <b>sin necesidad de dictamen</b> del Consejo de Estado u órgano consultivo autonómico, cuando el recurso <b>no se funde</b> en alguna de las causas del art. 125.1 o cuando se <b>hubiesen desestimado en cuanto al fondo</b> otros recursos <b>sustancialmente iguales</b>.</li>\n<li><b>126.2 — alcance de la resolución:</b> el órgano debe pronunciarse <b>no solo sobre la procedencia</b> del recurso, <b>sino también sobre el fondo</b> de la cuestión resuelta por el acto recurrido.</li>\n<li><b>126.3 — silencio:</b> transcurridos <b>tres meses</b> desde la interposición sin resolución dictada y notificada, se entiende <b>desestimado</b>, quedando <b>expedita la vía contencioso-administrativa</b>.</li>\n</ul>", "llano": "<p>Si el recurso no encaja en ninguna de las cuatro causas, se inadmite sin más trámite y sin pedir dictamen. Si se admite, hay que resolver también el fondo, no solo si procedía o no. Y a los tres meses sin respuesta, se entiende que no y se puede ir al juzgado.</p>", "porque": "<p>El apartado 1 replica la lógica del art. 106.3: evitar que un recurso manifiestamente improcedente obligue a poner en marcha la maquinaria del dictamen. El apartado 2 impide una respuesta puramente formal: admitido el recurso, el interesado tiene derecho a que se <b>resuelva su asunto</b>, no solo a que se le diga que tenía razón al recurrir.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> una reclamación que se rechaza de plano porque no encaja en ningún supuesto previsto.</li>\n<li><b>Real:</b> interpuesta la revisión por aparecer un documento esencial, el órgano la admite y resuelve: reconoce el error y <b>modifica</b> la resolución de fondo (art. 126.2).</li>\n<li><b>Caso límite:</b> el recurso se funda en una discrepancia jurídica. Se <b>inadmite motivadamente sin dictamen</b> (art. 126.1).</li>\n</ul>", "noej": "<ul>\n<li><b>No basta</b> con pronunciarse sobre la procedencia: hay que entrar en el <b>fondo</b>.</li>\n<li><b>No hace falta</b> dictamen para inadmitir.</li>\n<li><b>No es</b> estimatorio el silencio: a los tres meses, <b>desestimado</b>.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 125 LPAC:</b> causas y plazos del recurso.</li>\n<li><b>Art. 106.3 LPAC:</b> inadmisión paralela en la revisión de oficio.</li>\n<li><b>Art. 24 LPAC:</b> silencio administrativo.</li>\n</ul>", "trampas": "<ul>\n<li>La inadmisión debe ser <b>motivada</b> y no requiere <b>dictamen</b>.</li>\n<li>El silencio es <b>desestimatorio</b> a los <b>tres meses</b>.</li>\n<li>La resolución debe alcanzar también al <b>fondo</b>.</li>\n</ul>", "ancla": "<p><b>«Si no encaja, fuera sin dictamen; si encaja, se resuelve el fondo; y tres meses de silencio, no.»</b></p>", "vis": "<svg viewBox=\"0 0 640 135\" role=\"img\" aria-label=\"Resolución del recurso extraordinario de revisión\">\n<g font-size=\"10\" text-anchor=\"middle\" fill=\"currentColor\">\n<rect x=\"25\" y=\"30\" width=\"180\" height=\"62\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"115\" y=\"52\" font-size=\"11\" font-weight=\"700\" fill=\"var(--exc)\">126.1 · Inadmisión</text><text x=\"115\" y=\"70\">motivada y sin dictamen</text><text x=\"115\" y=\"84\">si no encaja en el 125.1</text>\n<rect x=\"230\" y=\"30\" width=\"180\" height=\"62\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"320\" y=\"52\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">126.2 · Resolución</text><text x=\"320\" y=\"70\">procedencia</text><text x=\"320\" y=\"84\">Y fondo del asunto</text>\n<rect x=\"435\" y=\"30\" width=\"180\" height=\"62\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"525\" y=\"52\" font-size=\"11\" font-weight=\"700\" fill=\"var(--warn)\">126.3 · Silencio</text><text x=\"525\" y=\"70\">3 meses: desestimado</text><text x=\"525\" y=\"84\">vía contenciosa expedita</text>\n</g>\n</svg>"}]);
</script>
<script>
const PLAZOS=[["1 mes", "Interposición del recurso de alzada frente a acto expreso", "Interesado", "122.1 LPAC", "Transcurrido, la resolución es firme"], ["3 meses", "Resolución y notificación del recurso de alzada", "Órgano superior", "122.2 LPAC", "Silencio desestimatorio, salvo doble silencio"], ["1 mes", "Interposición del recurso de reposición frente a acto expreso", "Interesado", "124.1 LPAC", "Potestativo"], ["1 mes", "Resolución y notificación del recurso de reposición", "Mismo órgano", "124.2 LPAC", "Silencio desestimatorio"], ["Cualquier momento", "Interposición frente a actos presuntos, en alzada y reposición", "Interesado", "122.1 y 124.1 LPAC", "Desde el día siguiente a los efectos del silencio"], ["4 años", "Recurso extraordinario de revisión por error de hecho", "Interesado", "125.2 LPAC", "Desde la notificación de la resolución"], ["3 meses", "Recurso extraordinario de revisión en las causas b), c) y d)", "Interesado", "125.2 LPAC", "Desde el conocimiento o la firmeza de la sentencia"], ["3 meses", "Silencio desestimatorio del recurso extraordinario de revisión", "Órgano", "126.3 LPAC", "Queda expedita la vía contenciosa"], ["1 mes", "Silencio ESTIMATORIO de la solicitud de suspensión", "Órgano", "117.3 LPAC", "Desde la entrada en el registro electrónico"], ["10 a 15 días", "Audiencia por hechos o documentos nuevos en el recurso", "Interesados", "118.1 LPAC", "Ni menos de 10 ni más de 15"], ["10 días", "Remisión del recurso de alzada por el órgano que dictó el acto", "Órgano autor", "121.2 LPAC", "Con informe y copia completa del expediente"], ["5 causas", "Motivos de inadmisión del recurso", "Órgano", "116 LPAC", "Competencia, legitimación, acto, plazo y fundamento"], ["4 causas", "Motivos del recurso extraordinario de revisión", "Interesado", "125.1 LPAC", "Tasadas"], ["7 supuestos", "Actos que ponen fin a la vía administrativa (regla general)", "—", "114.1 LPAC", "Más los del ámbito estatal"]];
const FLASH=[["¿Qué actos de trámite son recurribles?", "Los que <b>deciden directa o indirectamente el fondo</b>, <b>impiden continuar</b> el procedimiento, producen <b>indefensión</b> o causan <b>perjuicio irreparable</b> a derechos e intereses legítimos (art. 112.1)."], ["¿Cabe recurso administrativo contra un reglamento?", "<b>No</b> (art. 112.3). El recurso contra un acto fundado <b>únicamente</b> en la nulidad de la disposición puede interponerse ante el órgano que la dictó."], ["¿Qué recurso cabe contra un acto firme en vía administrativa?", "<b>Solo</b> el recurso extraordinario de revisión, y únicamente por las causas del art. 125.1 (art. 113)."], ["Cita cuatro supuestos que ponen fin a la vía administrativa", "Resoluciones de <b>alzada</b> · de los procedimientos sustitutivos del 112.2 · de órganos <b>sin superior jerárquico</b> · <b>convenios</b> finalizadores · <b>responsabilidad patrimonial</b> · procedimientos complementarios sancionadores · lo que establezca una norma (art. 114.1)."], ["¿Ponen fin a la vía los actos del alcalde?", "<b>Sí</b>: carece de superior jerárquico (art. 114.1.c). Frente a ellos cabe <b>reposición potestativa</b> o contencioso directo."], ["¿Y los de un concejal delegado?", "<b>No</b>: tiene superior jerárquico, luego procede <b>recurso de alzada</b>."], ["¿Qué ocurre si el recurrente califica mal el recurso?", "<b>No es obstáculo</b> para su tramitación, siempre que se deduzca su <b>verdadero carácter</b> (art. 115.2)."], ["¿Puede alegar un vicio quien lo causó?", "<b>No</b>: los vicios que hacen <b>anulable</b> un acto no pueden ser alegados por quienes los hubieren causado (art. 115.3)."], ["Cita las cinco causas de inadmisión", "<b>Incompetencia</b> cuando el competente sea de otra Administración —con deber de remisión— · falta de <b>legitimación</b> · acto <b>no susceptible</b> de recurso · <b>plazo transcurrido</b> · carecer <b>manifiestamente de fundamento</b> (art. 116)."], ["¿Suspende la interposición del recurso la ejecución del acto?", "<b>No</b>, salvo que una disposición establezca lo contrario (art. 117.1)."], ["¿Cuándo puede acordarse la suspensión?", "Previa <b>ponderación razonada</b>, cuando la ejecución cause <b>perjuicios de imposible o difícil reparación</b> o la impugnación se funde en una causa de <b>nulidad</b> del art. 47.1 (art. 117.2)."], ["¿Qué ocurre si no se resuelve la solicitud de suspensión?", "Transcurrido <b>un mes</b> desde su entrada en el registro electrónico sin resolución expresa notificada, la ejecución se entiende <b>suspendida</b> (art. 117.3)."], ["Plazo de audiencia cuando hay hechos o documentos nuevos", "<b>No inferior a diez días ni superior a quince</b> (art. 118.1)."], ["¿Son documentos nuevos el recurso, los informes y las propuestas?", "<b>No</b>, ni tampoco los que los interesados ya aportaron antes de la resolución impugnada (art. 118.3)."], ["¿Qué puede hacer la resolución del recurso?", "<b>Estimar</b> en todo o en parte, <b>desestimar</b> o declarar la <b>inadmisión</b> (art. 119.1)."], ["¿Qué límite tiene la resolución del recurso?", "Debe ser <b>congruente</b> con las peticiones del recurrente, <b>sin que en ningún caso pueda agravarse su situación inicial</b> (art. 119.3)."], ["¿Ante quién se interpone la alzada y dónde se presenta?", "Se resuelve por el <b>superior jerárquico</b>; puede presentarse ante <b>ese órgano o ante el que dictó el acto</b>, que debe remitirla en <b>diez días</b> con informe y expediente (art. 121)."], ["Plazos del recurso de alzada", "<b>Un mes</b> para interponer si el acto es expreso; <b>tres meses</b> para resolver, con silencio desestimatorio (art. 122)."], ["¿Qué es el doble silencio positivo?", "Si la alzada se interpone contra la <b>desestimación presunta</b> de una solicitud y tampoco se resuelve en tres meses, el recurso se entiende <b>estimado</b> (arts. 122.2 y 24.1, párrafo tercero). <b>No opera</b> si el asunto versa sobre derecho de petición, dominio o servicio público, medio ambiente o responsabilidad patrimonial."], ["¿Contra la resolución de una alzada cabe otro recurso administrativo?", "<b>No</b>, salvo el <b>extraordinario de revisión</b> (art. 122.3)."], ["Naturaleza del recurso de reposición", "<b>Potestativo</b>, ante el <b>mismo órgano</b> que dictó el acto, frente a actos que ponen fin a la vía administrativa (art. 123.1)."], ["Plazos del recurso de reposición", "<b>Un mes</b> para interponer y <b>un mes</b> para resolver (art. 124)."], ["Las cuatro causas del recurso extraordinario de revisión", "<b>Error de hecho</b> que resulte de los propios documentos · aparición de <b>documentos esenciales</b> que evidencien el error · documentos o testimonios <b>declarados falsos</b> por sentencia firme · resolución dictada por <b>conducta punible</b> declarada en sentencia firme (art. 125.1)."], ["Plazos del recurso extraordinario de revisión", "<b>Cuatro años</b> desde la notificación en la causa a); <b>tres meses</b> desde el conocimiento de los documentos o la firmeza de la sentencia en las demás (art. 125.2)."], ["¿Qué debe resolver el órgano en el recurso extraordinario?", "No solo la <b>procedencia</b> del recurso, sino también el <b>fondo</b> de la cuestión resuelta por el acto recurrido (art. 126.2)."]];
const TEST=[{"a": 112, "q": "Un acto de trámite es recurrible cuando:", "o": [["decide directa o indirectamente el fondo, impide continuar el procedimiento, produce indefensión o perjuicio irreparable", 1, "Correcto: art. 112.1. Son los cuatro supuestos del trámite cualificado."], ["siempre, como las resoluciones", 0, "Solo si es cualificado."], ["nunca: los trámites no se recurren", 0, "Los cualificados sí."], ["cuando lo autorice el órgano que lo dictó", 0, "No depende de autorización alguna."]]}, {"a": 112, "q": "Contra una ordenanza municipal cabe recurso de alzada ante el Pleno.", "vf": true, "ok": false, "fb": "<b>Falso.</b> El art. 112.3 dispone que contra las disposiciones administrativas de carácter general <b>no cabrá recurso en vía administrativa</b>."}, {"a": 114, "q": "¿Cuál de estos actos NO pone fin a la vía administrativa?", "o": [["la resolución de un concejal delegado en materia de licencias", 1, "Correcto: tiene superior jerárquico, luego procede alzada."], ["la resolución de un recurso de alzada", 0, "Letra a) del art. 114.1."], ["la resolución de un procedimiento de responsabilidad patrimonial", 0, "Letra e), cualquiera que sea el tipo de relación."], ["un convenio finalizador del procedimiento", 0, "Letra d)."]]}, {"a": 115, "q": "Si el recurrente califica erróneamente su recurso:", "o": [["no es obstáculo para su tramitación si se deduce su verdadero carácter", 1, "Correcto: art. 115.2, manifestación del antiformalismo."], ["el recurso se inadmite", 0, "No es causa de inadmisión."], ["se le requiere para que lo subsane en diez días", 0, "No es lo que dispone el precepto."], ["se archiva sin más trámite", 0, "No procede."]]}, {"a": 115, "q": "Completa: los vicios y defectos que hagan anulable un acto no podrán ser alegados por quienes ______.", "gap": "los hubieren causado", "fb": "Por quienes <b>los hubieren causado</b> (art. 115.3). Nadie puede beneficiarse de su propio error."}, {"a": 116, "q": "Si el recurso se presenta ante un órgano incompetente que pertenece a otra Administración:", "o": [["deberá remitirse al órgano competente", 1, "Correcto: art. 116.a), en relación con el art. 14.1 de la Ley 40/2015."], ["se archiva sin más trámite", 0, "La ley impone la remisión."], ["se desestima por el fondo", 0, "Es causa de inadmisión, no de desestimación."], ["se devuelve al interesado para que lo presente correctamente", 0, "No es lo previsto."]]}, {"a": 117, "q": "La interposición de un recurso administrativo:", "o": [["no suspende la ejecución del acto, salvo que una disposición establezca lo contrario", 1, "Correcto: art. 117.1."], ["suspende automáticamente la ejecución", 0, "Es justo lo contrario."], ["suspende la ejecución solo en materia sancionadora", 0, "No es lo que dispone el precepto."], ["suspende la ejecución si el recurrente lo pide, sin más", 0, "Exige ponderación razonada del órgano."]]}, {"a": 117, "q": "Solicitada la suspensión, si transcurre un mes desde su entrada en el registro electrónico sin resolución expresa notificada:", "o": [["la ejecución se entiende suspendida", 1, "Correcto: art. 117.3. Es un silencio positivo excepcional en la ley."], ["la solicitud se entiende desestimada", 0, "El silencio aquí es positivo."], ["hay que reiterar la solicitud", 0, "No es necesario."], ["caduca el procedimiento de recurso", 0, "No es la consecuencia."]]}, {"a": 118, "q": "El plazo de audiencia cuando han de tenerse en cuenta hechos o documentos nuevos es:", "o": [["no inferior a diez días ni superior a quince", 1, "Correcto: art. 118.1."], ["de diez días improrrogables", 0, "La ley fija una horquilla."], ["de quince días como mínimo", 0, "Quince es el máximo, no el mínimo."], ["de un mes", 0, "No es el plazo previsto."]]}, {"a": 119, "q": "Al resolver un recurso, el órgano competente:", "o": [["puede decidir cuestiones no alegadas, previa audiencia, pero nunca agravar la situación inicial del recurrente", 1, "Correcto: art. 119.3, que prohíbe la reformatio in peius."], ["puede agravar la situación del recurrente si aprecia mayor gravedad", 0, "Está expresamente prohibido."], ["solo puede pronunciarse sobre lo alegado", 0, "Puede decidir cuantas cuestiones plantee el procedimiento."], ["debe limitarse a estimar o desestimar", 0, "También puede declarar la inadmisión."]]}, {"a": 119, "q": "Cuando existe vicio de forma y no procede resolver sobre el fondo:", "o": [["se ordena la retroacción del procedimiento al momento en que el vicio fue cometido", 1, "Correcto: art. 119.2, sin perjuicio de la convalidación del art. 52."], ["se archiva el procedimiento", 0, "No es la consecuencia."], ["se inicia un procedimiento nuevo desde el principio", 0, "La retroacción va al momento del vicio."], ["se desestima el recurso", 0, "No procede."]]}, {"a": 121, "q": "El recurso de alzada puede interponerse:", "o": [["ante el órgano que dictó el acto o ante el competente para resolverlo", 1, "Correcto: art. 121.2."], ["solo ante el órgano competente para resolverlo", 0, "También ante el que dictó el acto."], ["solo ante el órgano que dictó el acto", 0, "También ante el superior."], ["ante cualquier órgano de la misma Administración", 0, "La ley designa dos concretos."]]}, {"a": 121, "q": "Si el recurso de alzada se presenta ante el órgano que dictó el acto, este debe remitirlo al competente en el plazo de:", "o": [["diez días, con su informe y copia completa y ordenada del expediente", 1, "Correcto: art. 121.2. Su titular es responsable directo del cumplimiento."], ["un mes", 0, "No es el plazo legal."], ["cinco días", 0, "No es el plazo legal."], ["quince días hábiles", 0, "No es el plazo legal."]]}, {"a": 122, "q": "El plazo para interponer el recurso de alzada frente a un acto expreso y el plazo máximo para resolverlo son, respectivamente:", "o": [["un mes y tres meses", 1, "Correcto: art. 122.1 y 122.2."], ["un mes y un mes", 0, "Esos son los plazos de la reposición."], ["tres meses y tres meses", 0, "No es correcto."], ["quince días y dos meses", 0, "No son los plazos legales."]]}, {"a": 122, "q": "Interpuesto recurso de alzada contra la desestimación presunta de una solicitud, si tampoco se resuelve el recurso en plazo:", "o": [["el recurso se entiende estimado", 1, "Correcto: es el doble silencio positivo del art. 24.1, párrafo tercero, al que remite el art. 122.2. Salvedad: no opera en las materias excluidas (petición, dominio y servicio público, medio ambiente y responsabilidad patrimonial)."], ["el recurso se entiende desestimado", 0, "Esa es la regla general, pero aquí opera la excepción."], ["caduca el procedimiento", 0, "No es la consecuencia."], ["debe reiterarse el recurso", 0, "No procede."]]}, {"a": 123, "q": "El recurso de reposición:", "o": [["es potestativo y se interpone ante el mismo órgano que dictó el acto", 1, "Correcto: art. 123.1, frente a actos que ponen fin a la vía administrativa."], ["es obligatorio antes de acudir al contencioso", 0, "Es potestativo."], ["se interpone ante el superior jerárquico", 0, "Eso es la alzada."], ["cabe contra cualquier acto administrativo", 0, "Solo contra los que ponen fin a la vía."]]}, {"a": 123, "q": "Interpuesta la reposición, puede acudirse simultáneamente al recurso contencioso-administrativo.", "vf": true, "ok": false, "fb": "<b>Falso.</b> El art. 123.2 impide interponer contencioso hasta que la reposición sea resuelta expresamente o se produzca su desestimación presunta."}, {"a": 124, "q": "El plazo máximo para dictar y notificar la resolución del recurso de reposición es de:", "o": [["un mes", 1, "Correcto: art. 124.2."], ["tres meses", 0, "Ese es el plazo de la alzada."], ["dos meses", 0, "No es el plazo legal."], ["quince días", 0, "No es el plazo legal."]]}, {"a": 125, "q": "¿Cuál de estas NO es causa del recurso extraordinario de revisión?", "o": [["la discrepancia con la interpretación jurídica aplicada en la resolución", 1, "Correcto: el art. 125.1 solo contempla errores de hecho, documentos y conductas punibles declaradas en sentencia."], ["el error de hecho que resulte de los propios documentos del expediente", 0, "Letra a)."], ["la aparición de documentos de valor esencial que evidencien el error", 0, "Letra b)."], ["que la resolución se dictara como consecuencia de prevaricación declarada en sentencia firme", 0, "Letra d)."]]}, {"a": 125, "q": "El plazo para interponer el recurso extraordinario de revisión por error de hecho es de:", "o": [["cuatro años desde la notificación de la resolución impugnada", 1, "Correcto: art. 125.2. En las demás causas, tres meses."], ["tres meses desde la notificación", 0, "Ese plazo rige para las causas b), c) y d)."], ["un mes desde la notificación", 0, "No es el plazo legal."], ["no hay plazo", 0, "Sí lo hay."]]}];
const CASOS=[{"t": "Caso 1 · ¿Qué recurso toca?", "e": "Determina el recurso procedente, el órgano competente y los plazos en estos cuatro supuestos de un ayuntamiento: <b>(a)</b> resolución de la alcaldía que deniega una licencia; <b>(b)</b> resolución de un concejal delegado que impone una sanción de 400 €; <b>(c)</b> acuerdo del tribunal de una oposición que excluye a un aspirante; <b>(d)</b> ordenanza fiscal aprobada por el Pleno.", "s": "<p><b>(a) Reposición potestativa o contencioso directo.</b> La alcaldía carece de superior jerárquico, luego su resolución <b>pone fin a la vía</b> (art. 114.1.c). Reposición ante la <b>propia alcaldía</b>: <b>un mes</b> para interponer y <b>un mes</b> para resolver (art. 124). También cabe ir directamente al contencioso, pero <b>no las dos cosas a la vez</b> (art. 123.2).</p><p><b>(b) Alzada.</b> El concejal delegado <b>tiene</b> superior jerárquico, de modo que su resolución no agota la vía. Recurso de <b>alzada</b> ante la alcaldía: <b>un mes</b> para interponer y <b>tres meses</b> para resolver, con silencio desestimatorio (art. 122). Puede presentarse ante cualquiera de los dos órganos; si se presenta ante el concejal, este debe remitirlo en <b>diez días</b> con informe y expediente (art. 121.2).</p><p><b>(c) Alzada.</b> El tribunal de selección actúa con <b>autonomía funcional</b>; a estos efectos se considera dependiente del órgano al que está adscrito (art. 121.1). Mismos plazos que en (b).</p><p><b>(d) Ningún recurso administrativo.</b> Es una <b>disposición de carácter general</b> (art. 112.3): procede recurso <b>contencioso-administrativo</b> directo, o recurrir el acto de aplicación fundándose únicamente en su nulidad, ante el órgano que la dictó.</p><p><b>La regla que se extrae:</b> primero pregunta <b>si el acto pone fin a la vía</b> (art. 114) y después aplica el recurso correspondiente.</p>"}, {"t": "Caso 2 · La suspensión y el silencio", "e": "Se notifica una orden de demolición el 5 de marzo. El interesado interpone recurso de alzada el 20 de marzo y, en el mismo escrito, <b>solicita la suspensión</b> de la ejecución alegando que el derribo sería irreversible. El 25 de abril no ha recibido respuesta alguna. El 10 de julio tampoco se ha resuelto el recurso. <b>Analiza la situación en cada fecha.</b>", "s": "<p><b>1) Plazo del recurso.</b> Notificación el 5 de marzo, acto expreso: el plazo de <b>un mes</b> vence el 5 de abril (art. 122.1). Interpuesto el 20 de marzo, está <b>en plazo</b>.</p><p><b>2) La suspensión.</b> La interposición <b>no suspende</b> por sí sola (art. 117.1). Pero se ha solicitado, y concurre la circunstancia de la letra a) del art. 117.2: <b>perjuicios de imposible reparación</b>, porque un edificio derribado no se reconstruye.</p><p><b>3) El 25 de abril.</b> Han transcurrido más de <b>un mes</b> desde la entrada de la solicitud en el registro electrónico sin resolución expresa notificada. Conforme al art. <b>117.3</b>, la ejecución <b>se entiende suspendida</b>. Es un silencio <b>positivo</b>, excepcional en la ley.</p><p><b>4) El 10 de julio.</b> Han pasado más de <b>tres meses</b> desde la interposición del recurso (20 de marzo → 20 de junio). El recurso se entiende <b>desestimado</b> por silencio (art. 122.2), quedando abierta la vía contenciosa. La suspensión ya ganada no desaparece por ello, pero conviene invocarla expresamente ante el juzgado.</p><p><b>5) Si el acto recurrido hubiera sido presunto.</b> El silencio de la alzada habría sido <b>estimatorio</b> (art. 24.1, párrafo tercero). Aquí no, porque la orden de demolición fue <b>expresa</b>.</p>"}, {"t": "Caso 3 · El documento que apareció después", "e": "En 2023 se denegó a una asociación una subvención por no acreditar estar al corriente con la Seguridad Social. En 2026 la asociación obtiene un certificado que demuestra que en aquella fecha <b>sí estaba al corriente</b> y que el dato que constaba en el expediente era erróneo. La resolución de 2023 es firme. <b>¿Qué puede hacer? ¿Y si además hubiera una sentencia penal por falsedad?</b>", "s": "<p><b>1) La vía.</b> El acto es <b>firme en vía administrativa</b>, de modo que solo cabe el <b>recurso extraordinario de revisión</b> (art. 113), ante el <b>mismo órgano</b> que dictó el acto, que también lo resuelve (art. 125.1).</p><p><b>2) La causa.</b> Hay que distinguir. Si el error <b>resultaba de los propios documentos ya incorporados</b> al expediente, la causa es la <b>letra a)</b> y el plazo es de <b>cuatro años</b> desde la notificación: en 2026 estaría <b>vencido</b> si la notificación fue en 2023. Si el certificado es un <b>documento de valor esencial</b> aparecido después que <b>evidencia el error</b>, la causa es la <b>letra b)</b> y el plazo es de <b>tres meses desde su conocimiento</b>: sí estaría en plazo.</p><p><b>3) Con sentencia penal.</b> Si un documento del expediente fue <b>declarado falso</b> por sentencia firme, entra la <b>letra c)</b>; y si la resolución se dictó por <b>prevaricación, cohecho o maquinación fraudulenta</b> declarada en sentencia, la <b>letra d)</b>. En ambos casos, <b>tres meses desde la firmeza</b> de la sentencia, que puede ser <b>anterior o posterior</b> a la resolución.</p><p><b>4) Tramitación.</b> Si el recurso no encajara en ninguna causa, cabría <b>inadmitirlo motivadamente sin dictamen</b> (art. 126.1). Admitido, el órgano debe pronunciarse <b>también sobre el fondo</b> (art. 126.2). Y a los <b>tres meses</b> sin resolución, se entiende <b>desestimado</b> (art. 126.3).</p><p><b>5) Vía alternativa.</b> El art. <b>125.3</b> deja a salvo la solicitud de <b>revisión de oficio</b> (art. 106) si concurriera una causa de nulidad, y la <b>rectificación de errores</b> materiales (art. 109.2).</p>"}];

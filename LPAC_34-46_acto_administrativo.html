ción:</b> quien deba dictar un acto que tenga por base otro de una Administración distinta que entienda ilegal, puede <b>requerirla previamente</b> para que lo anule o revise.</li>\n</ul>", "llano": "<p>El acto nace válido y con efectos el mismo día en que se firma. Solo se retrasa si él mismo lo dice, si depende de que te lo notifiquen o publiquen, o si necesita el visto bueno de un órgano superior. Mirar hacia atrás solo se permite en dos casos: para sustituir un acto anulado y para beneficiarte, sin perjudicar a nadie.</p>", "porque": "<p>La presunción de validez es el reverso de la ejecutividad: si el acto no se presumiera válido, la Administración tendría que probar su corrección antes de aplicarlo y se paralizaría. Por eso la carga de impugnar recae en el particular.</p>\n<p>La <b>retroactividad</b> se restringe porque afecta a la <b>seguridad jurídica</b>: solo se admite cuando repara —sustituir un acto anulado— o cuando beneficia sin dañar a terceros. Los tres requisitos del apartado 3 son acumulativos.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> un billete comprado hoy con validez desde mañana: existe ya, pero surte efecto después.</li>\n<li><b>Real:</b> anulado en alzada el nombramiento de un funcionario interino por defecto de procedimiento, el nuevo nombramiento puede retrotraerse a la fecha del anterior (art. 39.3, primer supuesto).</li>\n<li><b>Caso límite:</b> un ayuntamiento quiere reconocer con efectos de enero un complemento aprobado en junio. Cabe si es <b>favorable</b>, si los <b>hechos</b> ya concurrían en enero y si <b>no se lesiona</b> a terceros. Falta uno y no cabe.</li>\n</ul>", "noej": "<ul>\n<li><b>No cabe</b> retroactividad en actos <b>desfavorables</b>: una sanción no puede aplicarse a hechos anteriores a su tipificación.</li>\n<li><b>No es</b> demora de eficacia la simple tardanza material en notificar.</li>\n<li><b>No permite</b> el art. 39.5 desobedecer el acto de la otra Administración: permite <b>requerirla</b>.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 38 LPAC:</b> ejecutividad.</li>\n<li><b>Art. 40 LPAC:</b> la notificación como condición de eficacia frente al interesado.</li>\n<li><b>Art. 98 LPAC:</b> cuándo el acto es inmediatamente ejecutivo.</li>\n<li><b>Art. 9.3 de la Constitución</b> <i>(norma externa a la biblioteca)</i>: irretroactividad de las disposiciones sancionadoras no favorables o restrictivas de derechos.</li>\n</ul>", "trampas": "<ul>\n<li>Efectos <b>desde que se dictan</b>, no desde que se notifican; la notificación demora la eficacia <b>frente al interesado</b>.</li>\n<li>La retroactividad exige <b>tres</b> requisitos acumulativos en el segundo supuesto: favorable + hechos preexistentes + sin lesión a terceros.</li>\n<li>El apartado 4 obliga también a órganos de <b>otra</b> Administración.</li>\n</ul>", "ancla": "<p><b>«Válido y eficaz desde que se firma; hacia atrás, solo para reparar o para favorecer.»</b></p>", "vis": "<svg viewBox=\"0 0 640 155\" role=\"img\" aria-label=\"Eficacia de los actos administrativos\">\n<rect x=\"185\" y=\"8\" width=\"270\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/>\n<text x=\"320\" y=\"29\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">EFICACIA DESDE QUE SE DICTA (39.1)</text>\n<g font-size=\"10\" text-anchor=\"middle\" fill=\"currentColor\">\n<rect x=\"30\" y=\"55\" width=\"255\" height=\"70\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/>\n<text x=\"157\" y=\"76\" font-size=\"11\" font-weight=\"700\" fill=\"var(--warn)\">39.2 · DEMORADA</text>\n<text x=\"157\" y=\"94\">lo exige el contenido</text><text x=\"157\" y=\"108\">notificación · publicación</text><text x=\"157\" y=\"120\">aprobación superior</text>\n<rect x=\"355\" y=\"55\" width=\"255\" height=\"70\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/>\n<text x=\"482\" y=\"76\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">39.3 · RETROACTIVA</text>\n<text x=\"482\" y=\"94\">sustitución de actos anulados</text><text x=\"482\" y=\"108\">o favorable + hechos previos</text><text x=\"482\" y=\"120\">+ sin lesión a terceros</text>\n</g>\n<text x=\"320\" y=\"147\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--ink2)\">39.4 · vinculan a los demás órganos · 39.5 · requerimiento previo entre Administraciones</text>\n</svg>"}, {"n": 40, "t": "Notificación", "ubic": "Título III (De los actos administrativos) ▸ Capítulo II (Eficacia de los actos)", "idea": "Diez días para cursar la notificación, con texto íntegro y pie de recursos.", "literal": "<p>1. El órgano que dicte las resoluciones y actos administrativos los notificará a los interesados cuyos derechos e intereses sean afectados por aquéllos, en los términos previstos en los artículos siguientes.</p><p>2. Toda notificación deberá ser cursada dentro del plazo de diez días a partir de la fecha en que el acto haya sido dictado, y deberá contener el texto íntegro de la resolución, con indicación de si pone fin o no a la vía administrativa, la expresión de los recursos que procedan, en su caso, en vía administrativa y judicial, el órgano ante el que hubieran de presentarse y el plazo para interponerlos, sin perjuicio de que los interesados puedan ejercitar, en su caso, cualquier otro que estimen procedente.</p><p>3. Las notificaciones que, conteniendo el texto íntegro del acto, omitiesen alguno de los demás requisitos previstos en el apartado anterior, surtirán efecto a partir de la fecha en que el interesado realice actuaciones que supongan el conocimiento del contenido y alcance de la resolución o acto objeto de la notificación, o interponga cualquier recurso que proceda.</p><p>4. Sin perjuicio de lo establecido en el apartado anterior, y a los solos efectos de entender cumplida la obligación de notificar dentro del plazo máximo de duración de los procedimientos, será suficiente la notificación que contenga, cuando menos, el texto íntegro de la resolución, así como el intento de notificación debidamente acreditado.</p><p>5. Las Administraciones Públicas podrán adoptar las medidas que consideren necesarias para la protección de los datos personales que consten en las resoluciones y actos administrativos, cuando éstos tengan por destinatarios a más de un interesado.</p>", "dis": "<ul>\n<li><b>40.1 — a quién:</b> el órgano que dicte el acto lo <b>notificará a los interesados</b> cuyos derechos e intereses resulten afectados.</li>\n<li><b>40.2 — plazo y contenido:</b> toda notificación debe cursarse dentro de los <b>diez días</b> siguientes a la fecha en que el acto haya sido dictado, y debe contener:\n<table><thead><tr><th>Elemento</th><th>Detalle</th></tr></thead><tbody>\n<tr><td><b>Texto íntegro</b></td><td>De la resolución, sin extractos</td></tr>\n<tr><td><b>Fin de la vía administrativa</b></td><td>Indicación de si pone fin o no a la <span class=\"t\" data-k=\"viaadm\">vía administrativa</span></td></tr>\n<tr><td><b>Recursos</b></td><td>Los que procedan en vía administrativa y judicial</td></tr>\n<tr><td><b>Órgano y plazo</b></td><td>Ante quién se presentan y de cuánto tiempo se dispone</td></tr>\n</tbody></table></li>\n<li><b>40.3 — notificación defectuosa:</b> la que contenga el <b>texto íntegro</b> pero omita otros requisitos surte efecto desde que el interesado <b>realice actuaciones que supongan el conocimiento</b> del contenido y alcance del acto, <b>o interponga cualquier recurso</b> que proceda.</li>\n<li><b>40.4 — notificación a efectos de plazo:</b> para entender cumplida la obligación de notificar dentro del plazo máximo del procedimiento basta la notificación que contenga <b>el texto íntegro</b> y el <b>intento debidamente acreditado</b>.</li>\n<li><b>40.5 — protección de datos:</b> cabe adoptar medidas de protección cuando el acto tenga <b>más de un interesado</b> como destinatario.</li>\n</ul>", "llano": "<p>Dictado el acto, la Administración tiene <b>diez días</b> para mandarte la notificación. Y no vale mandar un resumen: tiene que ir el texto completo, decirte si con eso se acaba la vía administrativa, qué recursos tienes, ante quién y en qué plazo. Si falta algo de eso pero está el texto íntegro, la notificación no es nula: empieza a valer cuando demuestres que te has enterado o cuando recurras.</p>", "porque": "<p>El pie de recursos existe porque el ciudadano no tiene por qué conocer el sistema de recursos. Y la regla del apartado 3 evita dos extremos igualmente injustos: que un defecto formal invalide todo, y que la Administración se beneficie de su propia chapuza. La solución es <b>diferir la eficacia</b> hasta que el interesado conozca realmente el acto.</p>\n<p>El apartado 4 resuelve un problema práctico muy concreto: si la notificación pudiera retrasarse indefinidamente, la Administración incumpliría siempre el plazo máximo. Por eso basta con el <b>intento acreditado</b> dentro de plazo.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> un burofax que llega con el documento completo pero sin decirte el plazo para contestar.</li>\n<li><b>Real:</b> una resolución sancionadora de 300 € se notifica el día 12 sin indicar el plazo del recurso de alzada. El interesado interpone alzada el día 20: desde ese momento la notificación surte efecto (art. 40.3).</li>\n<li><b>Caso límite:</b> el procedimiento vence el 30 de junio y la Administración acredita un intento de notificación el 28 con el texto íntegro. Aunque la notificación se perfeccione en julio, el plazo <b>se entiende cumplido</b> (art. 40.4).</li>\n</ul>", "noej": "<ul>\n<li><b>No surte efecto</b> la notificación que omite el <b>texto íntegro</b>: el art. 40.3 solo salva las que lo contienen.</li>\n<li><b>No convierte</b> el art. 40.4 el intento en notificación a todos los efectos: solo a los de entender cumplido el plazo máximo.</li>\n<li><b>No se notifica</b> a cualquiera: solo a los interesados cuyos derechos e intereses resulten afectados.</li>\n</ul>", "conex": "<ul>\n<li><b>Arts. 41 a 44 LPAC:</b> condiciones y práctica de las notificaciones.</li>\n<li><b>Art. 21 LPAC:</b> obligación de resolver y notificar en plazo.</li>\n<li><b>Art. 45 LPAC:</b> supuestos en que la publicación sustituye a la notificación.</li>\n<li><b>Art. 114 LPAC:</b> actos que ponen fin a la vía administrativa, dato que debe constar en la notificación.</li>\n</ul>", "trampas": "<ul>\n<li><b>Diez días</b> desde que se <b>dicta</b> el acto —no desde que se registra—, y son <b>hábiles</b> por la regla general del art. 30.</li>\n<li>Notificación <b>defectuosa</b> no es notificación <b>inexistente</b>: la primera se convalida por conocimiento o recurso.</li>\n<li>El deber de indicar los recursos incluye los de la <b>vía judicial</b>.</li>\n</ul>", "ancla": "<p><b>«Diez días · texto íntegro · fin de vía · recursos · órgano · plazo.»</b> Seis piezas y ninguna es opcional.</p>", "vis": "<svg viewBox=\"0 0 640 150\" role=\"img\" aria-label=\"Contenido y plazo de la notificación\">\n<rect x=\"175\" y=\"8\" width=\"290\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/>\n<text x=\"320\" y=\"29\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">NOTIFICAR EN 10 DÍAS DESDE QUE SE DICTA</text>\n<g font-size=\"10\" text-anchor=\"middle\" fill=\"currentColor\">\n<rect x=\"20\" y=\"55\" width=\"145\" height=\"55\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"92\" y=\"78\" font-weight=\"700\" fill=\"var(--acc)\">Texto íntegro</text><text x=\"92\" y=\"95\">sin extractos</text>\n<rect x=\"175\" y=\"55\" width=\"145\" height=\"55\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"247\" y=\"78\" font-weight=\"700\" fill=\"var(--ej)\">¿Fin de vía?</text><text x=\"247\" y=\"95\">sí o no</text>\n<rect x=\"330\" y=\"55\" width=\"145\" height=\"55\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"402\" y=\"78\" font-weight=\"700\" fill=\"var(--warn)\">Recursos</text><text x=\"402\" y=\"95\">administrativos y judiciales</text>\n<rect x=\"485\" y=\"55\" width=\"135\" height=\"55\" rx=\"8\" fill=\"var(--panel)\" stroke=\"var(--line)\"/><text x=\"552\" y=\"78\" font-weight=\"700\">Órgano y plazo</text><text x=\"552\" y=\"95\">ante quién y cuándo</text>\n</g>\n<text x=\"320\" y=\"134\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--exc)\">Si falta algo salvo el texto íntegro: surte efecto al conocerlo o al recurrir (40.3)</text>\n</svg>"}, {"n": 41, "t": "Condiciones generales para la práctica de las notificaciones", "ubic": "Título III (De los actos administrativos) ▸ Capítulo II (Eficacia de los actos)", "idea": "Preferentemente electrónicas; en papel solo en supuestos tasados.", "literal": "<p>1. Las notificaciones se practicarán preferentemente por medios electrónicos y, en todo caso, cuando el interesado resulte obligado a recibirlas por esta vía. No obstante lo anterior, las Administraciones podrán practicar las notificaciones por medios no electrónicos en los siguientes supuestos:</p><p>a) Cuando la notificación se realice con ocasión de la comparecencia espontánea del interesado o su representante en las oficinas de asistencia en materia de registro y solicite la comunicación o notificación personal en ese momento.</p><p>b) Cuando para asegurar la eficacia de la actuación administrativa resulte necesario practicar la notificación por entrega directa de un empleado público de la Administración notificante. Con independencia del medio utilizado, las notificaciones serán válidas siempre que permitan tener constancia de su envío o puesta a disposición, de la recepción o acceso por el interesado o su representante, de sus fechas y horas, del contenido íntegro, y de la identidad fidedigna del remitente y destinatario de la misma. La acreditación de la notificación efectuada se incorporará al expediente. Los interesados que no estén obligados a recibir notificaciones electrónicas, podrán decidir y comunicar en cualquier momento a la Administración Pública, mediante los modelos normalizados que se establezcan al efecto, que las notificaciones sucesivas se practiquen o dejen de practicarse por medios electrónicos. Reglamentariamente, las Administraciones podrán establecer la obligación de practicar electrónicamente las notificaciones para determinados procedimientos y para ciertos colectivos de personas físicas que por razón de su capacidad económica, técnica, dedicación profesional u otros motivos quede acreditado que tienen acceso y disponibilidad de los medios electrónicos necesarios. Adicionalmente, el interesado podrá identificar un dispositivo electrónico y/o una dirección de correo electrónico que servirán para el envío de los avisos regulados en este artículo, pero no para la práctica de notificaciones.</p><p>2. En ningún caso se efectuarán por medios electrónicos las siguientes notificaciones:</p><p>a) Aquellas en las que el acto a notificar vaya acompañado de elementos que no sean susceptibles de conversión en formato electrónico.</p><p>b) Las que contengan medios de pago a favor de los obligados, tales como cheques.</p><p>3. En los procedimientos iniciados a solicitud del interesado, la notificación se practicará por el medio señalado al efecto por aquel. Esta notificación será electrónica en los casos en los que exista obligación de relacionarse de esta forma con la Administración. Cuando no fuera posible realizar la notificación de acuerdo con lo señalado en la solicitud, se practicará en cualquier lugar adecuado a tal fin, y por cualquier medio que permita tener constancia de la recepción por el interesado o su representante, así como de la fecha, la identidad y el contenido del acto notificado.</p><p>4. En los procedimientos iniciados de oficio, a los solos efectos de su iniciación, las Administraciones Públicas podrán recabar, mediante consulta a las bases de datos del Instituto Nacional de Estadística, los datos sobre el domicilio del interesado recogidos en el Padrón Municipal, remitidos por las Entidades Locales en aplicación de lo previsto en la Ley 7/1985, de 2 de abril, reguladora de las Bases del Régimen Local.</p><p>5. Cuando el interesado o su representante rechace la notificación de una actuación administrativa, se hará constar en el expediente, especificándose las circunstancias del intento de notificación y el medio, dando por efectuado el trámite y siguiéndose el procedimiento.</p><p>6. Con independencia de que la notificación se realice en papel o por medios electrónicos, las Administraciones Públicas enviarán un aviso al dispositivo electrónico y/o a la dirección de correo electrónico del interesado que éste haya comunicado, informándole de la puesta a disposición de una notificación en la sede electrónica de la Administración u Organismo correspondiente o en la dirección electrónica habilitada única. La falta de práctica de este aviso no impedirá que la notificación sea considerada plenamente válida.</p><p>7. Cuando el interesado fuera notificado por distintos cauces, se tomará como fecha de notificación la de aquélla que se hubiera producido en primer lugar.</p>", "dis": "<ul>\n<li><b>41.1 — regla:</b> notificaciones <b>preferentemente por medios electrónicos</b> y <b>en todo caso</b> cuando el interesado esté obligado a recibirlas así. Cabe notificar por medios <b>no electrónicos</b> en dos supuestos: <b>a)</b> con ocasión de la <b>comparecencia espontánea</b> del interesado en las oficinas de asistencia en materia de registro, si solicita la notificación personal en ese momento; <b>b)</b> cuando para asegurar la eficacia de la actuación sea necesaria la <b>entrega directa por un empleado público</b>.</li>\n<li><b>41.2 — nunca electrónicas:</b> <b>a)</b> las que vayan acompañadas de <b>elementos no convertibles a formato electrónico</b>; <b>b)</b> las que contengan <b>medios de pago</b> a favor de los obligados, como cheques.</li>\n<li><b>41.3 — procedimientos iniciados a solicitud:</b> se notifica por el <b>medio señalado</b> por el interesado; será electrónica si existe obligación de relacionarse así.</li>\n<li><b>41.4 — procedimientos de oficio:</b> la Administración puede consultar el <b>Padrón Municipal</b> a través del INE para conocer el domicilio, a los solos efectos de iniciar el procedimiento.</li>\n<li><b>41.5 — rechazo:</b> se hace constar en el expediente, especificando las circunstancias del intento, y se <b>da por efectuado el trámite</b>, siguiendo el procedimiento.</li>\n<li><b>41.6 — aviso:</b> con independencia del soporte, se envía un <b>aviso</b> al dispositivo o correo electrónico comunicado por el interesado. La <b>falta de ese aviso no impide</b> que la notificación sea plenamente válida.</li>\n<li><b>41.7 — doble cauce:</b> si se notifica por varios cauces, vale la fecha de la que se haya producido <b>en primer lugar</b>.</li>\n</ul>", "llano": "<p>Lo electrónico es la regla y para muchos sujetos es obligatorio. El papel queda para quien aparece en la oficina y lo pide, para cuando hace falta entregar en mano, y para lo que no cabe en un fichero —una maqueta, un cheque—. Si te avisan por correo y el aviso falla, la notificación sigue valiendo. Y si te llega por dos vías, cuenta la primera.</p>", "porque": "<p>El precepto pone en práctica el principio del art. 14: relación electrónica obligatoria para personas jurídicas, entidades sin personalidad, profesionales colegiados, notarios y registradores, representantes y empleados públicos. El <b>aviso</b> del apartado 6 es una cortesía técnica, no un requisito de validez: si lo fuera, un fallo del servidor de correo del ciudadano paralizaría la actuación administrativa.</p>\n<p>La regla del apartado 7 —vale la primera— evita que la duplicidad de cauces alargue artificialmente los plazos de recurso.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> un mensaje que te avisa de que tienes una carta certificada: si el aviso no llega, la carta sigue existiendo.</li>\n<li><b>Real:</b> una S.L. está obligada a recibir notificaciones electrónicas (art. 14.2.a); no cabe notificarle en papel salvo los supuestos del art. 41.2.</li>\n<li><b>Caso límite:</b> a un vecino se le notifica en papel el día 4 y por sede electrónica el día 6. La fecha que cuenta es la del <b>día 4</b> (art. 41.7).</li>\n</ul>", "noej": "<ul>\n<li><b>No invalida</b> la notificación la falta del aviso del art. 41.6.</li>\n<li><b>No cabe</b> notificar electrónicamente un cheque a favor del interesado.</li>\n<li><b>No es</b> supuesto de notificación en papel la simple preferencia del interesado obligado a relacionarse electrónicamente.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 14 LPAC:</b> derecho y obligación de relacionarse electrónicamente.</li>\n<li><b>Arts. 42 y 43 LPAC:</b> práctica en papel y por medios electrónicos.</li>\n<li><b>Art. 44 LPAC:</b> notificación infructuosa.</li>\n<li><b>RD 203/2021</b> (documento 4) y <b>Ley 40/2015</b> (documento 2): sede electrónica y funcionamiento electrónico.</li>\n</ul>", "trampas": "<ul>\n<li>La palabra clave es <b>«preferentemente»</b>, salvo obligación, donde es <b>«en todo caso»</b>.</li>\n<li>El <b>aviso</b> del 41.6 <b>no</b> es requisito de validez.</li>\n<li>Con doble notificación vale la <b>primera</b>, no la más favorable.</li>\n<li>El <b>rechazo</b> da por cumplido el trámite y el procedimiento continúa.</li>\n</ul>", "ancla": "<p><b>«Electrónica salvo que no quepa, no se pueda o te presentes.»</b> Y si rechazas, trámite cumplido.</p>", "vis": "<svg viewBox=\"0 0 640 145\" role=\"img\" aria-label=\"Condiciones generales de las notificaciones\">\n<rect x=\"200\" y=\"8\" width=\"240\" height=\"30\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/>\n<text x=\"320\" y=\"28\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">PREFERENTEMENTE ELECTRÓNICA</text>\n<g font-size=\"10\" text-anchor=\"middle\" fill=\"currentColor\">\n<rect x=\"20\" y=\"52\" width=\"190\" height=\"62\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"115\" y=\"73\" font-weight=\"700\" fill=\"var(--ej)\">41.1 · Cabe papel</text><text x=\"115\" y=\"90\">comparecencia espontánea</text><text x=\"115\" y=\"104\">entrega directa necesaria</text>\n<rect x=\"225\" y=\"52\" width=\"190\" height=\"62\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"320\" y=\"73\" font-weight=\"700\" fill=\"var(--exc)\">41.2 · Nunca electrónica</text><text x=\"320\" y=\"90\">no convertible a formato</text><text x=\"320\" y=\"104\">medios de pago (cheques)</text>\n<rect x=\"430\" y=\"52\" width=\"190\" height=\"62\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"525\" y=\"73\" font-weight=\"700\" fill=\"var(--warn)\">41.6 y 41.7</text><text x=\"525\" y=\"90\">el aviso no da validez</text><text x=\"525\" y=\"104\">vale la primera notificación</text>\n</g>\n<text x=\"320\" y=\"135\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--ink2)\">41.5 · el rechazo hace constar el intento y da por efectuado el trámite</text>\n</svg>"}]);
</script>
<script>
ARTS.push.apply(ARTS,[{"n": 42, "t": "Práctica de las notificaciones en papel", "ubic": "Título III (De los actos administrativos) ▸ Capítulo II (Eficacia de los actos)", "idea": "Dos intentos, mayor de catorce años y tres horas de margen.", "literal": "<p>1. Todas las notificaciones que se practiquen en papel deberán ser puestas a disposición del interesado en la sede electrónica de la Administración u Organismo actuante para que pueda acceder al contenido de las mismas de forma voluntaria.</p><p>2. Cuando la notificación se practique en el domicilio del interesado, de no hallarse presente éste en el momento de entregarse la notificación, podrá hacerse cargo de la misma cualquier persona mayor de catorce años que se encuentre en el domicilio y haga constar su identidad. Si nadie se hiciera cargo de la notificación, se hará constar esta circunstancia en el expediente, junto con el día y la hora en que se intentó la notificación, intento que se repetirá por una sola vez y en una hora distinta dentro de los tres días siguientes. En caso de que el primer intento de notificación se haya realizado antes de las quince horas, el segundo intento deberá realizarse después de las quince horas y viceversa, dejando en todo caso al menos un margen de diferencia de tres horas entre ambos intentos de notificación. Si el segundo intento también resultara infructuoso, se procederá en la forma prevista en el artículo 44.</p><p>3. Cuando el interesado accediera al contenido de la notificación en sede electrónica, se le ofrecerá la posibilidad de que el resto de notificaciones se puedan realizar a través de medios electrónicos.</p>", "dis": "<ul>\n<li><b>42.1 — puesta a disposición:</b> todas las notificaciones en papel deben ponerse <b>también</b> a disposición del interesado en la <span class=\"t\" data-k=\"sede\">sede electrónica</span>, para acceso voluntario.</li>\n<li><b>42.2 — la mecánica del intento:</b>\n<table><thead><tr><th>Situación</th><th>Regla</th></tr></thead><tbody>\n<tr><td>El interesado no está</td><td>Puede recogerla cualquier persona <b>mayor de catorce años</b> que esté en el domicilio y <b>haga constar su identidad</b></td></tr>\n<tr><td>Nadie se hace cargo</td><td>Se hace constar en el expediente el <b>día y la hora</b> del intento</td></tr>\n<tr><td>Segundo intento</td><td><b>Por una sola vez</b>, en <b>hora distinta</b>, dentro de los <b>tres días siguientes</b></td></tr>\n<tr><td>Franja horaria</td><td>Si el primero fue <b>antes de las quince horas</b>, el segundo <b>después</b> (y viceversa), con al menos <b>tres horas</b> de diferencia</td></tr>\n<tr><td>Segundo intento infructuoso</td><td>Se procede conforme al <b>art. 44</b>: anuncio en el BOE</td></tr>\n</tbody></table></li>\n<li><b>42.3 — invitación a lo electrónico:</b> si el interesado accede al contenido en sede electrónica, se le ofrece que el resto de notificaciones se practiquen por esa vía.</li>\n</ul>", "llano": "<p>El cartero llama; si no estás, puede recoger la notificación cualquier persona del domicilio mayor de catorce años que se identifique. Si no hay nadie, se anota día y hora y se vuelve <b>una sola vez más</b>, dentro de tres días, en otra franja horaria y con al menos tres horas de diferencia. Si tampoco, se publica en el BOE.</p>", "porque": "<p>Las reglas horarias no son un capricho: si los dos intentos se hicieran a la misma hora de la mañana, quien trabaja nunca recibiría la notificación y se le dejaría indefenso, forzando el edicto en el BOE, que es una ficción de conocimiento. Al obligar a <b>cambiar de franja</b> se maximiza la posibilidad de una notificación real.</p>\n<p>El umbral de los <b>catorce años</b> busca un equilibrio entre eficacia y madurez suficiente para entender la relevancia de lo que se recibe.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> el repartidor que vuelve por la tarde porque por la mañana no había nadie.</li>\n<li><b>Real:</b> primer intento el martes a las 10:30 sin resultado; el segundo debe hacerse antes del viernes, después de las 15:00 y con al menos tres horas de diferencia: por ejemplo, el jueves a las 18:00.</li>\n<li><b>Caso límite:</b> primer intento a las 14:00 y segundo a las 15:30. Es <b>incorrecto</b>: aunque cambia de franja, no hay tres horas de diferencia.</li>\n</ul>", "noej": "<ul>\n<li><b>No cabe</b> un tercer intento: la ley dice <b>«por una sola vez»</b>.</li>\n<li><b>No vale</b> la entrega a un menor de catorce años ni a quien no haga constar su identidad.</li>\n<li><b>No se acude</b> al art. 44 tras el primer intento fallido: hace falta el segundo.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 41 LPAC:</b> cuándo cabe notificar en papel.</li>\n<li><b>Art. 44 LPAC:</b> qué hacer si los dos intentos fracasan.</li>\n<li><b>Art. 43 LPAC:</b> la alternativa electrónica.</li>\n</ul>", "trampas": "<ul>\n<li><b>Catorce</b> años, no dieciséis ni dieciocho.</li>\n<li><b>Tres días</b> para el segundo intento y <b>tres horas</b> de margen: no confundas las dos cifras.</li>\n<li>El criterio horario gira sobre las <b>quince horas</b>.</li>\n<li>Aun en papel, la notificación se pone <b>también</b> en la sede electrónica.</li>\n</ul>", "ancla": "<p><b>«14 años · 2 intentos · 3 días · 3 horas · las 15:00 como frontera.»</b> Cinco cifras y ninguna se puede cambiar.</p>", "vis": "<svg viewBox=\"0 0 640 155\" role=\"img\" aria-label=\"Práctica de las notificaciones en papel\">\n<defs><marker id=\"p1\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\"><path d=\"M0 0 L9 4.5 L0 9 z\" fill=\"var(--acc)\"/></marker></defs>\n<rect x=\"15\" y=\"45\" width=\"165\" height=\"55\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/>\n<text x=\"97\" y=\"68\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">1.er intento</text>\n<text x=\"97\" y=\"86\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">mayor de 14 años · identidad</text>\n<path d=\"M183 72 L 218 72\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#p1)\"/>\n<rect x=\"222\" y=\"45\" width=\"175\" height=\"55\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/>\n<text x=\"309\" y=\"65\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--warn)\">2.º intento (único)</text>\n<text x=\"309\" y=\"82\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">≤ 3 días · hora distinta</text>\n<text x=\"309\" y=\"95\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">± 15:00 y ≥ 3 horas</text>\n<path d=\"M400 72 L 435 72\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#p1)\"/>\n<rect x=\"439\" y=\"45\" width=\"181\" height=\"55\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/>\n<text x=\"529\" y=\"68\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--exc)\">Art. 44</text>\n<text x=\"529\" y=\"86\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">anuncio en el BOE</text>\n<text x=\"320\" y=\"130\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--ink2)\">42.1 · toda notificación en papel se pone también a disposición en la sede electrónica</text>\n</svg>"}, {"n": 43, "t": "Práctica de las notificaciones a través de medios electrónicos", "ubic": "Título III (De los actos administrativos) ▸ Capítulo II (Eficacia de los actos)", "idea": "Practicada al acceder; rechazada a los diez días naturales sin acceso.", "literal": "<p>1. Las notificaciones por medios electrónicos se practicarán mediante comparecencia en la sede electrónica de la Administración u Organismo actuante, a través de la dirección electrónica habilitada única o mediante ambos sistemas, según disponga cada Administración u Organismo. A los efectos previstos en este artículo, se entiende por comparecencia en la sede electrónica, el acceso por el interesado o su representante debidamente identificado al contenido de la notificación.</p><p>2. Las notificaciones por medios electrónicos se entenderán practicadas en el momento en que se produzca el acceso a su contenido. Cuando la notificación por medios electrónicos sea de carácter obligatorio, o haya sido expresamente elegida por el interesado, se entenderá rechazada cuando hayan transcurrido diez días naturales desde la puesta a disposición de la notificación sin que se acceda a su contenido.</p><p>3. Se entenderá cumplida la obligación a la que se refiere el artículo 40.4 con la puesta a disposición de la notificación en la sede electrónica de la Administración u Organismo actuante o en la dirección electrónica habilitada única.</p><p>4. Los interesados podrán acceder a las notificaciones desde el Punto de Acceso General electrónico de la Administración, que funcionará como un portal de acceso.</p>", "dis": "<ul>\n<li><b>43.1 — cómo:</b> mediante <b>comparecencia en la sede electrónica</b>, a través de la <span class=\"t\" data-k=\"deh\">dirección electrónica habilitada única</span> o por ambos sistemas, según disponga cada Administración.</li>\n<li><b>43.2 — cuándo se entiende practicada:</b> en el momento en que se produzca el <b>acceso a su contenido</b>. Si la notificación electrónica es <b>obligatoria</b> o ha sido <b>expresamente elegida</b>, se entiende <b>rechazada</b> cuando transcurran <b>diez días naturales</b> desde la puesta a disposición sin acceder al contenido.</li>\n<li><b>43.3 — plazo máximo del procedimiento:</b> la obligación del art. 40.4 se cumple con la <b>puesta a disposición</b> en la sede o en la dirección electrónica habilitada única.</li>\n<li><b>43.4 — acceso:</b> los interesados pueden acceder desde el <span class=\"t\" data-k=\"pag\">Punto de Acceso General</span> electrónico de la Administración, que funciona como portal de acceso.</li>\n</ul>\n<div class=\"box warn\"><span class=\"lbl\">La cifra que más se pregunta</span><b>Diez días naturales</b>, no hábiles. Es una de las poquísimas excepciones al cómputo en días hábiles del art. 30.2.</div>", "llano": "<p>La notificación electrónica se entiende hecha cuando abres el contenido. Si estás obligado a recibirla así —o la elegiste tú— y dejas pasar <b>diez días naturales</b> sin abrirla, se da por rechazada y el procedimiento sigue sin ti.</p>", "porque": "<p>Sin una regla de rechazo, bastaría con no abrir el buzón electrónico para bloquear indefinidamente cualquier expediente. El plazo se cuenta en días <b>naturales</b> precisamente para no alargarlo con puentes y fines de semana: se presupone que acceder a un buzón electrónico no depende del calendario laboral.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> un mensaje que caduca si no lo abres en diez días.</li>\n<li><b>Real:</b> notificación puesta a disposición de una S.L. el 1 de septiembre; si no accede, el 11 de septiembre se entiende rechazada y el procedimiento continúa.</li>\n<li><b>Caso límite:</b> una persona física no obligada, que no eligió la vía electrónica, accede el día 20. La notificación se entiende practicada <b>ese día 20</b>: para ella no opera el rechazo automático.</li>\n</ul>", "noej": "<ul>\n<li><b>No opera</b> el rechazo por transcurso de los diez días si el interesado <b>no está obligado</b> ni ha elegido expresamente el medio electrónico.</li>\n<li><b>No son</b> días hábiles: son <b>naturales</b>.</li>\n<li><b>No equivale</b> el aviso del art. 41.6 a la puesta a disposición.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 14 LPAC:</b> sujetos obligados a relacionarse electrónicamente.</li>\n<li><b>Art. 41.6 LPAC:</b> el aviso y su irrelevancia para la validez.</li>\n<li><b>Art. 30.2 LPAC:</b> regla general de cómputo en días hábiles, que aquí se excepciona.</li>\n<li><b>Art. 40.4 LPAC:</b> cumplimiento del plazo máximo del procedimiento.</li>\n</ul>", "trampas": "<ul>\n<li><b>Diez días naturales</b> desde la <b>puesta a disposición</b>, no desde el aviso.</li>\n<li>El rechazo automático solo alcanza a los <b>obligados</b> y a quienes <b>eligieron</b> la vía electrónica.</li>\n<li>Practicada <b>en el momento del acceso</b> al contenido, no al recibir el aviso.</li>\n</ul>", "ancla": "<p><b>«Abres, notificada; no abres diez días naturales, rechazada.»</b> Solo si estás obligado o la elegiste.</p>", "vis": "<svg viewBox=\"0 0 640 145\" role=\"img\" aria-label=\"Notificación electrónica\">\n<rect x=\"180\" y=\"8\" width=\"280\" height=\"30\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/>\n<text x=\"320\" y=\"28\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">PUESTA A DISPOSICIÓN</text>\n<line x1=\"320\" y1=\"38\" x2=\"320\" y2=\"52\" stroke=\"var(--acc)\" stroke-width=\"2\"/>\n<line x1=\"165\" y1=\"52\" x2=\"475\" y2=\"52\" stroke=\"var(--acc)\" stroke-width=\"2\"/>\n<line x1=\"165\" y1=\"52\" x2=\"165\" y2=\"66\" stroke=\"var(--acc)\" stroke-width=\"2\"/>\n<line x1=\"475\" y1=\"52\" x2=\"475\" y2=\"66\" stroke=\"var(--acc)\" stroke-width=\"2\"/>\n<rect x=\"40\" y=\"66\" width=\"250\" height=\"52\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/>\n<text x=\"165\" y=\"87\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">Accede al contenido</text>\n<text x=\"165\" y=\"105\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">notificada en ese momento</text>\n<rect x=\"350\" y=\"66\" width=\"250\" height=\"52\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/>\n<text x=\"475\" y=\"87\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--exc)\">10 días naturales sin acceder</text>\n<text x=\"475\" y=\"105\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">rechazada (si obligado o elegida)</text>\n<text x=\"320\" y=\"138\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--ink2)\">Acceso desde la sede, la dirección electrónica habilitada única o el Punto de Acceso General</text>\n</svg>"}, {"n": 44, "t": "Notificación infructuosa", "ubic": "Título III (De los actos administrativos) ▸ Capítulo II (Eficacia de los actos)", "idea": "Si no se puede notificar, anuncio obligatorio en el BOE.", "literal": "<p>Cuando los interesados en un procedimiento sean desconocidos, se ignore el lugar de la notificación o bien, intentada ésta, no se hubiese podido practicar, la notificación se hará por medio de un anuncio publicado en el «Boletín Oficial del Estado». Asimismo, previamente y con carácter facultativo, las Administraciones podrán publicar un anuncio en el boletín oficial de la Comunidad Autónoma o de la Provincia, en el tablón de edictos del Ayuntamiento del último domicilio del interesado o del Consulado o Sección Consular de la Embajada correspondiente. Las Administraciones Públicas podrán establecer otras formas de notificación complementarias a través de los restantes medios de difusión, que no excluirán la obligación de publicar el correspondiente anuncio en el «Boletín Oficial del Estado».</p>", "dis": "<ul>\n<li><b>Tres supuestos:</b> interesados <b>desconocidos</b> · se <b>ignora el lugar</b> de la notificación · intentada, <b>no se ha podido practicar</b>.</li>\n<li><b>Efecto:</b> la notificación se hace por <b>anuncio publicado en el «Boletín Oficial del Estado»</b>. Es obligatorio y no puede sustituirse.</li>\n<li><b>Publicaciones facultativas previas:</b> boletín oficial de la <b>comunidad autónoma</b> o de la <b>provincia</b>, <b>tablón de edictos</b> del ayuntamiento del último domicilio, o del <b>consulado</b> o sección consular de la embajada.</li>\n<li><b>Otras formas complementarias:</b> caben a través de los restantes medios de difusión, pero <b>no excluyen</b> la obligación de publicar en el BOE.</li>\n</ul>", "llano": "<p>Cuando no hay manera de encontrarte, la ley usa el último recurso: publicarlo en el BOE. Puede además anunciarse en el boletín provincial o en el tablón del ayuntamiento, pero eso es voluntario y <b>no sustituye</b> al BOE.</p>", "porque": "<p>El edicto es una <b>ficción de conocimiento</b>: casi nadie lee el BOE buscando su nombre. Precisamente por eso la ley lo reserva para cuando todo lo demás ha fallado y exige que el intento previo esté <b>debidamente acreditado</b>. Centralizarlo en un único boletín estatal —desde 2015— permite además una búsqueda unificada, algo imposible cuando cada Administración publicaba en su propio diario.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> el aviso en el tablón del portal cuando no se sabe a quién pertenece un objeto encontrado.</li>\n<li><b>Real:</b> fracasados los dos intentos del art. 42.2, el ayuntamiento publica el anuncio en el BOE y, facultativamente, en el tablón de edictos municipal.</li>\n<li><b>Caso límite:</b> la Administración publica solo en el boletín provincial. La notificación <b>no está bien practicada</b>: el BOE es obligatorio.</li>\n</ul>", "noej": "<ul>\n<li><b>No basta</b> el tablón de edictos ni el boletín provincial: son <b>facultativos y previos</b>.</li>\n<li><b>No cabe</b> acudir al art. 44 sin haber agotado antes los intentos del art. 42 o los plazos del art. 43.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 42.2 LPAC:</b> los dos intentos previos en papel.</li>\n<li><b>Art. 45 LPAC:</b> publicación que sustituye a la notificación en otros supuestos.</li>\n<li><b>Art. 46 LPAC:</b> indicación somera cuando la publicación lesione derechos.</li>\n</ul>", "trampas": "<ul>\n<li>El boletín obligatorio es el <b>BOE</b>, sea cual sea la Administración actuante.</li>\n<li>Las demás publicaciones son <b>facultativas</b> y <b>previas</b>.</li>\n<li>Son <b>tres</b> supuestos: desconocido, lugar ignorado o intento fallido.</li>\n</ul>", "ancla": "<p><b>«Desconocido, ilocalizable o fallido → BOE.»</b> Lo demás, opcional.</p>", "vis": "<svg viewBox=\"0 0 640 135\" role=\"img\" aria-label=\"Notificación infructuosa y anuncio en el BOE\">\n<g font-size=\"10\" text-anchor=\"middle\" fill=\"currentColor\">\n<rect x=\"20\" y=\"25\" width=\"170\" height=\"52\" rx=\"8\" fill=\"var(--panel)\" stroke=\"var(--line)\"/><text x=\"105\" y=\"48\" font-weight=\"700\">Interesado desconocido</text><text x=\"105\" y=\"65\">o lugar ignorado</text>\n<rect x=\"20\" y=\"83\" width=\"170\" height=\"34\" rx=\"8\" fill=\"var(--panel)\" stroke=\"var(--line)\"/><text x=\"105\" y=\"105\" font-weight=\"700\">Intento fallido</text>\n</g>\n<path d=\"M195 70 L 235 70\" stroke=\"var(--exc)\" stroke-width=\"2.5\"/>\n<rect x=\"240\" y=\"42\" width=\"200\" height=\"56\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/>\n<text x=\"340\" y=\"66\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"var(--exc)\">BOE</text>\n<text x=\"340\" y=\"85\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">anuncio OBLIGATORIO</text>\n<rect x=\"460\" y=\"42\" width=\"165\" height=\"56\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/>\n<text x=\"542\" y=\"63\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"var(--ej)\">Facultativo y previo</text>\n<text x=\"542\" y=\"80\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">BOJA/BOP · tablón · consulado</text>\n</svg>"}, {"n": 45, "t": "Publicación", "ubic": "Título III (De los actos administrativos) ▸ Capítulo II (Eficacia de los actos)", "idea": "En dos casos la publicación sustituye a la notificación y surte sus efectos.", "literal": "<p>1. Los actos administrativos serán objeto de publicación cuando así lo establezcan las normas reguladoras de cada procedimiento o cuando lo aconsejen razones de interés público apreciadas por el órgano competente. En todo caso, los actos administrativos serán objeto de publicación, surtiendo ésta los efectos de la notificación, en los siguientes casos:</p><p>a) Cuando el acto tenga por destinatario a una pluralidad indeterminada de personas o cuando la Administración estime que la notificación efectuada a un solo interesado es insuficiente para garantizar la notificación a todos, siendo, en este último caso, adicional a la individualmente realizada.</p><p>b) Cuando se trate de actos integrantes de un procedimiento selectivo o de concurrencia competitiva de cualquier tipo. En este caso, la convocatoria del procedimiento deberá indicar el medio donde se efectuarán las sucesivas publicaciones, careciendo de validez las que se lleven a cabo en lugares distintos.</p><p>2. La publicación de un acto deberá contener los mismos elementos que el artículo 40.2 exige respecto de las notificaciones. Será también aplicable a la publicación lo establecido en el apartado 3 del mismo artículo. En los supuestos de publicaciones de actos que contengan elementos comunes, podrán publicarse de forma conjunta los aspectos coincidentes, especificándose solamente los aspectos individuales de cada acto.</p><p>3. La publicación de los actos se realizará en el diario oficial que corresponda, según cual sea la Administración de la que proceda el acto a notificar.</p><p>4. Sin perjuicio de lo dispuesto en el artículo 44, la publicación de actos y comunicaciones que, por disposición legal o reglamentaria deba practicarse en tablón de anuncios o edictos, se entenderá cumplida por su publicación en el Diario oficial correspondiente.</p>", "dis": "<ul>\n<li><b>45.1 — cuándo se publica:</b> cuando lo establezcan las normas reguladoras del procedimiento o lo aconsejen <b>razones de interés público</b>. Y <b>en todo caso</b>, surtiendo los <b>efectos de la notificación</b>:\n<ul><li><b>a)</b> cuando el acto tenga por destinatario a una <b>pluralidad indeterminada</b> de personas, o cuando la Administración estime que la notificación a un solo interesado es <b>insuficiente</b> para garantizarla a todos —en este caso, <b>adicional</b> a la individual—;</li>\n<li><b>b)</b> cuando se trate de actos integrantes de un procedimiento <b>selectivo</b> o de <b>concurrencia competitiva</b>. La convocatoria debe indicar el medio de las sucesivas publicaciones, <b>careciendo de validez</b> las realizadas en lugares distintos.</li></ul></li>\n<li><b>45.2 — contenido:</b> los <b>mismos elementos</b> que el art. 40.2 exige para la notificación, y le es aplicable también el art. 40.3.</li>\n<li><b>45.3 — dónde:</b> en el <b>diario oficial que corresponda</b> según la Administración de la que proceda el acto.</li>\n<li><b>45.4 — tablón de anuncios:</b> la publicación que deba practicarse en <b>tablón o edictos</b> se entiende cumplida con la publicación en el <b>diario oficial</b> correspondiente.</li>\n</ul>", "llano": "<p>Hay actos que no se pueden notificar uno a uno: los que afectan a un número indeterminado de personas y los de oposiciones y concursos. Ahí la publicación <b>vale como notificación</b>. Y ojo con las oposiciones: si la convocatoria dice que se publica en un sitio, lo que se publique en otro <b>no vale</b>.</p>", "porque": "<p>En una oposición con miles de aspirantes, notificar individualmente cada acto sería inviable y además rompería la igualdad: todos deben conocer la información <b>al mismo tiempo</b>. La regla del medio único, con invalidez de lo publicado en otro sitio, protege esa igualdad y la seguridad jurídica de los aspirantes.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> el tablón de la facultad donde se cuelgan las notas: nadie espera una carta.</li>\n<li><b>Real:</b> la lista provisional de admitidos y excluidos de una oposición de auxiliar administrativo se publica en el medio fijado por la convocatoria; esa publicación <b>es</b> la notificación.</li>\n<li><b>Caso límite:</b> el tribunal publica la lista solo en la web municipal cuando la convocatoria remitía al boletín provincial. La publicación <b>carece de validez</b> (art. 45.1.b).</li>\n</ul>", "noej": "<ul>\n<li><b>No sustituye</b> la publicación a la notificación en un procedimiento con destinatario único e identificado.</li>\n<li><b>No es</b> suficiente el tablón físico cuando la norma exige diario oficial: el art. 45.4 opera en sentido inverso.</li>\n<li><b>No exime</b> la publicación de contener el pie de recursos del art. 40.2.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 40 LPAC:</b> contenido exigible, aplicable también a la publicación.</li>\n<li><b>Art. 44 LPAC:</b> publicación por notificación infructuosa, distinta de esta.</li>\n<li><b>Art. 35.2 LPAC:</b> motivación en procedimientos selectivos y de concurrencia.</li>\n<li><b>Art. 46 LPAC:</b> indicación somera cuando la publicación lesione derechos.</li>\n</ul>", "trampas": "<ul>\n<li>En la letra a) la publicación puede ser <b>adicional</b> a la notificación individual, no siempre sustitutiva.</li>\n<li>En procesos selectivos, lo publicado <b>fuera del medio previsto</b> carece de validez.</li>\n<li>La publicación debe llevar los <b>mismos elementos</b> que la notificación.</li>\n</ul>", "ancla": "<p><b>«Muchos e indeterminados, u oposición: se publica y vale como notificar.»</b> Y siempre en el medio que dijo la convocatoria.</p>", "vis": "<svg viewBox=\"0 0 640 140\" role=\"img\" aria-label=\"Publicación con efectos de notificación\">\n<rect x=\"185\" y=\"8\" width=\"270\" height=\"30\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/>\n<text x=\"320\" y=\"28\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">PUBLICACIÓN = NOTIFICACIÓN</text>\n<g font-size=\"10\" text-anchor=\"middle\" fill=\"currentColor\">\n<rect x=\"35\" y=\"52\" width=\"255\" height=\"60\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/>\n<text x=\"162\" y=\"74\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">a) Pluralidad indeterminada</text>\n<text x=\"162\" y=\"92\">o notificación individual insuficiente</text><text x=\"162\" y=\"106\">(entonces, adicional a ella)</text>\n<rect x=\"350\" y=\"52\" width=\"255\" height=\"60\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/>\n<text x=\"477\" y=\"74\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">b) Selectivos y concurrencia</text>\n<text x=\"477\" y=\"92\">en el medio fijado por la convocatoria</text><text x=\"477\" y=\"106\" fill=\"var(--exc)\">lo publicado en otro sitio NO vale</text>\n</g>\n<text x=\"320\" y=\"132\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--ink2)\">Con los mismos elementos del art. 40.2 · en el diario oficial que corresponda</text>\n</svg>"}]);
</script>
<script>
ARTS.push.apply(ARTS,[{"n": 46, "t": "Indicación de notificaciones y publicaciones", "ubic": "Título III (De los actos administrativos) ▸ Capítulo II (Eficacia de los actos)", "idea": "Si publicar lesiona derechos, solo una indicación somera y comparecencia.", "literal": "<p>Si el órgano competente apreciase que la notificación por medio de anuncios o la publicación de un acto lesiona derechos o intereses legítimos, se limitará a publicar en el Diario oficial que corresponda una somera indicación del contenido del acto y del lugar donde los interesados podrán comparecer, en el plazo que se establezca, para conocimiento del contenido íntegro del mencionado acto y constancia de tal conocimiento. Adicionalmente y de manera facultativa, las Administraciones podrán establecer otras formas de notificación complementarias a través de los restantes medios de difusión que no excluirán la obligación de publicar en el correspondiente Diario oficial.</p>", "dis": "<ul>\n<li><b>Supuesto:</b> el órgano competente aprecia que la <b>notificación por anuncios</b> o la <b>publicación</b> de un acto <b>lesiona derechos o intereses legítimos</b>.</li>\n<li><b>Consecuencia:</b> se limita a publicar en el diario oficial una <b>somera indicación</b> del contenido del acto y del <b>lugar</b> donde los interesados pueden <b>comparecer</b> para conocer el contenido íntegro y constancia de tal conocimiento.</li>\n</ul>", "llano": "<p>Hay contenidos que no deberían salir en un boletín: datos de salud, situaciones familiares, expedientes de protección de menores. En esos casos se publica lo mínimo —que existe un acto y dónde ir a leerlo— y el interesado acude a conocerlo.</p>", "porque": "<p>Es la regla que concilia dos exigencias opuestas: el acto tiene que llegar a conocimiento del interesado, pero la publicidad no puede convertirse en un castigo añadido ni vulnerar la <b>intimidad</b> y la <b>protección de datos</b>. La solución es publicar el <b>continente</b> y reservar el <b>contenido</b> para la comparecencia.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> un aviso de que tienes un paquete a recoger, sin decir qué contiene.</li>\n<li><b>Real:</b> una resolución sobre una ayuda de emergencia social se publica con una somera indicación y remisión a los servicios sociales municipales para conocer el texto íntegro.</li>\n<li><b>Caso límite:</b> un expediente sancionador de tráfico ordinario <b>no</b> encaja aquí: se publica con normalidad, porque no hay lesión de derechos que lo justifique.</li>\n</ul>", "noej": "<ul>\n<li><b>No autoriza</b> a dejar de publicar: obliga a publicar <b>menos</b>.</li>\n<li><b>No se aplica</b> por la mera incomodidad del interesado: exige lesión de derechos o intereses legítimos.</li>\n</ul>", "conex": "<ul>\n<li><b>Arts. 44 y 45 LPAC:</b> supuestos de anuncio y publicación.</li>\n<li><b>Art. 15 de la Ley 19/2013:</b> protección de datos personales en el acceso a la información.</li>\n<li><b>Art. 40.5 LPAC:</b> medidas de protección de datos en notificaciones con varios destinatarios.</li>\n</ul>", "trampas": "<ul>\n<li>La ley dice <b>«somera indicación»</b>: no es un extracto ni un resumen del contenido.</li>\n<li>Debe indicarse el <b>lugar de comparecencia</b>, no solo que existe el acto.</li>\n<li>La apreciación corresponde al <b>órgano competente</b>.</li>\n</ul>", "ancla": "<p><b>«Si publicarlo hace daño, publico que existe y dónde verlo.»</b></p>", "vis": "<svg viewBox=\"0 0 640 125\" role=\"img\" aria-label=\"Indicación somera del contenido del acto\">\n<defs><marker id=\"s1\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\"><path d=\"M0 0 L9 4.5 L0 9 z\" fill=\"var(--acc)\"/></marker></defs>\n<rect x=\"25\" y=\"35\" width=\"200\" height=\"52\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/>\n<text x=\"125\" y=\"57\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--exc)\">Publicar lesionaría</text>\n<text x=\"125\" y=\"75\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">derechos o intereses legítimos</text>\n<path d=\"M228 61 L 268 61\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#s1)\"/>\n<rect x=\"272\" y=\"35\" width=\"180\" height=\"52\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/>\n<text x=\"362\" y=\"57\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">Somera indicación</text>\n<text x=\"362\" y=\"75\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">en el diario oficial</text>\n<path d=\"M455 61 L 495 61\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#s1)\"/>\n<rect x=\"499\" y=\"35\" width=\"120\" height=\"52\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/>\n<text x=\"559\" y=\"57\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">Comparecencia</text>\n<text x=\"559\" y=\"75\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">texto íntegro</text>\n</svg>"}]);
</script>
<script>
const PLAZOS=[["10 días", "Plazo para cursar la notificación desde que se dicta el acto", "Órgano que dicta", "40.2 LPAC", "Días hábiles (art. 30.2)"], ["10 días naturales", "Transcurso sin acceder que convierte la notificación electrónica en rechazada", "Interesado obligado o que la eligió", "43.2 LPAC", "NATURALES: excepción a la regla general"], ["14 años", "Edad mínima para hacerse cargo de la notificación en el domicilio", "Persona presente", "42.2 LPAC", "Debe hacer constar su identidad"], ["2 intentos", "Número máximo de intentos de notificación en papel", "Administración", "42.2 LPAC", "Por una sola vez se repite"], ["3 días", "Plazo máximo para el segundo intento", "Administración", "42.2 LPAC", "Desde el primer intento"], ["3 horas", "Diferencia mínima entre ambos intentos", "Administración", "42.2 LPAC", "Y en franja distinta de las 15:00"], ["15:00 horas", "Frontera horaria entre los dos intentos", "Administración", "42.2 LPAC", "Antes / después"], ["BOE", "Diario donde se publica el anuncio si la notificación es infructuosa", "Administración", "44 LPAC", "Obligatorio; los demás son facultativos"], ["9 supuestos", "Actos que deben motivarse", "Administración", "35.1 LPAC", "Letras a) a i)"], ["Nulidad", "Consecuencia de vulnerar un reglamento mediante resolución particular", "Administración", "37.2 LPAC", "De pleno derecho"], ["Desde que se dicta", "Momento en que el acto produce efectos", "Administración", "39.1 LPAC", "Salvo demora del 39.2"], ["2 supuestos", "Casos de eficacia retroactiva", "Administración", "39.3 LPAC", "Sustitución de anulados y actos favorables"]];
const FLASH=[["¿Qué tres exigencias impone el art. 34.1 a la producción del acto?", "Dictarlo el <b>órgano competente</b>, ajustándose a los <b>requisitos</b> y al <b>procedimiento</b> establecidos, sea de oficio o a instancia del interesado."], ["¿Cómo debe ser el contenido del acto?", "Ajustado al <b>ordenamiento jurídico</b>, <b>determinado</b> y <b>adecuado a los fines</b> del acto (art. 34.2)."], ["Cita cuatro supuestos de motivación obligatoria", "Actos que <b>limitan derechos</b> · resuelven <b>recursos o revisión de oficio</b> · se <b>separan del precedente o del dictamen</b> · acuerdan <b>suspensión o medidas provisionales</b> · <b>urgencia, ampliación de plazos</b> o actuaciones complementarias · <b>rechazan pruebas</b> · terminación por imposibilidad material · <b>sancionadores</b> y de responsabilidad patrimonial · <b>discrecionales</b> (art. 35.1)."], ["¿Cómo se motivan los actos de procedimientos selectivos?", "Conforme a lo que dispongan las <b>normas de sus convocatorias</b>, quedando en todo caso <b>acreditados en el procedimiento</b> los fundamentos (art. 35.2)."], ["¿Cuál es la forma ordinaria de los actos?", "<b>Por escrito a través de medios electrónicos</b>, salvo que su naturaleza exija otra forma más adecuada (art. 36.1)."], ["¿Quién deja constancia escrita de un acto verbal?", "El <b>titular del órgano inferior o el funcionario que lo recibe oralmente</b>, expresando la autoridad de la que procede (art. 36.2)."], ["¿Qué es la inderogabilidad singular?", "Que una resolución <b>particular</b> no puede vulnerar una disposición <b>general</b>, aunque proceda de un órgano de <b>igual o superior jerarquía</b> (art. 37.1). Si lo hace, es <b>nula</b>."], ["¿Desde cuándo producen efectos los actos administrativos?", "Se presumen válidos y producen efectos <b>desde la fecha en que se dicten</b>, salvo que dispongan otra cosa (art. 39.1)."], ["¿Cuándo queda demorada la eficacia?", "Cuando lo exija el <b>contenido</b> del acto o esté supeditada a <b>notificación, publicación o aprobación superior</b> (art. 39.2)."], ["Los dos supuestos de eficacia retroactiva", "Actos dictados <b>en sustitución de actos anulados</b> y actos <b>favorables</b> al interesado si los hechos ya existían y no se lesiona a terceros (art. 39.3)."], ["¿En qué plazo debe cursarse la notificación?", "<b>Diez días</b> desde la fecha en que el acto haya sido dictado (art. 40.2)."], ["¿Qué debe contener toda notificación?", "<b>Texto íntegro</b>, si <b>pone fin o no a la vía administrativa</b>, los <b>recursos</b> en vía administrativa y judicial, el <b>órgano</b> ante el que presentarlos y el <b>plazo</b> (art. 40.2)."], ["¿Qué ocurre con la notificación que contiene el texto íntegro pero omite otros requisitos?", "Surte efecto desde que el interesado realice <b>actuaciones que supongan el conocimiento</b> del acto o <b>interponga cualquier recurso</b> (art. 40.3)."], ["¿Cuándo caben notificaciones no electrónicas?", "En la <b>comparecencia espontánea</b> del interesado que la solicite, y cuando sea necesaria la <b>entrega directa por un empleado público</b> (art. 41.1)."], ["¿Qué notificaciones nunca son electrónicas?", "Las que van con <b>elementos no convertibles</b> a formato electrónico y las que contienen <b>medios de pago</b> como cheques (art. 41.2)."], ["¿Invalida la notificación la falta del aviso?", "<b>No</b>: la falta del aviso del art. 41.6 no impide que la notificación sea plenamente válida."], ["Si hay dos notificaciones por cauces distintos, ¿cuál cuenta?", "La que se haya producido <b>en primer lugar</b> (art. 41.7)."], ["Reglas del segundo intento de notificación en papel", "<b>Una sola vez</b>, en <b>hora distinta</b>, dentro de los <b>tres días</b> siguientes, cambiando de franja respecto de las <b>15:00</b> y con al menos <b>tres horas</b> de diferencia (art. 42.2)."], ["¿Quién puede recoger la notificación en el domicilio?", "Cualquier persona <b>mayor de catorce años</b> que se encuentre en él y <b>haga constar su identidad</b> (art. 42.2)."], ["¿Cuándo se entiende practicada la notificación electrónica?", "En el momento en que se produce el <b>acceso a su contenido</b> (art. 43.2)."], ["¿Cuándo se entiende rechazada?", "Cuando transcurren <b>diez días naturales</b> desde la puesta a disposición sin acceder, si es obligatoria o fue elegida (art. 43.2)."], ["¿Dónde se publica el anuncio si la notificación resulta infructuosa?", "En el <b>«Boletín Oficial del Estado»</b>, obligatoriamente (art. 44)."], ["Los dos casos en que la publicación surte efectos de notificación", "<b>Pluralidad indeterminada</b> de destinatarios o notificación individual insuficiente, y actos de procedimientos <b>selectivos o de concurrencia competitiva</b> (art. 45.1)."], ["¿Qué ocurre si en una oposición se publica en un medio distinto del previsto?", "Esa publicación <b>carece de validez</b> (art. 45.1.b)."], ["¿Qué hace el órgano si publicar lesiona derechos?", "Publica una <b>somera indicación</b> del contenido y del <b>lugar de comparecencia</b> para conocer el texto íntegro (art. 46)."]];
const TEST=[{"a": 34, "q": "Según el art. 34.2 de la Ley 39/2015, el contenido de los actos:", "o": [["se ajustará al ordenamiento jurídico y será determinado y adecuado a los fines de aquéllos", 1, "Correcto: art. 34.2, literalmente."], ["será siempre discrecional", 0, "La discrecionalidad depende de la potestad ejercida, no del art. 34."], ["podrá ser indeterminado si se concreta después", 0, "La ley exige que sea determinado."], ["se ajustará únicamente a criterios de oportunidad", 0, "Debe ajustarse al ordenamiento jurídico."]]}, {"a": 35, "q": "¿Cuál de estos actos NO exige motivación conforme al art. 35.1?", "o": [["el acto reglado plenamente favorable que no se aparta del precedente", 1, "Correcto: no encaja en ninguna de las nueve letras."], ["los que rechacen pruebas propuestas por los interesados", 0, "Letra f): sí exige motivación."], ["los acuerdos de ampliación de plazos", 0, "Letra e): sí exige motivación."], ["los dictados en ejercicio de potestades discrecionales", 0, "Letra i): siempre se motivan."]]}, {"a": 35, "q": "Completa: los actos se motivarán «con ______ referencia de hechos y fundamentos de derecho».", "gap": "sucinta", "fb": "<b>Sucinta</b> (art. 35.1). La ley no exige extensión, exige razones expresadas."}, {"a": 36, "q": "La forma ordinaria de producción de los actos administrativos es:", "o": [["por escrito a través de medios electrónicos", 1, "Correcto: art. 36.1, salvo que la naturaleza del acto exija otra forma."], ["verbal, con constancia posterior", 0, "Es la excepción del art. 36.2."], ["por escrito en soporte papel", 0, "La ley exige medios electrónicos."], ["indistintamente escrita o verbal, a elección del órgano", 0, "No hay tal libertad de elección."]]}, {"a": 36, "q": "Cuando un órgano ejerce su competencia de forma verbal, la constancia escrita la firma:", "o": [["el titular del órgano inferior o el funcionario que la recibe oralmente", 1, "Correcto: art. 36.2, expresando la autoridad de la que procede."], ["el órgano que dictó la orden verbal", 0, "La ley atribuye la firma a quien la recibe."], ["el secretario de la corporación en todo caso", 0, "No es lo que dispone el precepto."], ["no es necesaria constancia escrita", 0, "Lo es cuando resulte necesaria."]]}, {"a": 37, "q": "Una resolución particular que vulnera una ordenanza municipal es:", "o": [["nula, aunque proceda de un órgano superior al que dictó la ordenanza", 1, "Correcto: arts. 37.1 y 37.2."], ["válida si la dicta el Pleno, que aprobó la ordenanza", 0, "El art. 37.1 alcanza a los órganos de igual o superior jerarquía."], ["anulable, nunca nula", 0, "El art. 37.2 la califica de nula."], ["válida si concurren razones de interés público", 0, "No hay tal excepción."]]}, {"a": 38, "q": "La ejecutividad de los actos administrativos significa que:", "o": [["producen efectos y son exigibles sin necesidad de acudir previamente a un juez", 1, "Correcto: art. 38, manifestación de la autotutela."], ["requieren siempre autorización judicial previa", 0, "Es justo lo contrario."], ["quedan suspendidos automáticamente al interponerse un recurso", 0, "El art. 117.1 dispone que el recurso no suspende por sí solo."], ["solo alcanzan a los actos favorables", 0, "Alcanza a los actos sujetos al Derecho Administrativo en general."]]}, {"a": 39, "q": "Los actos administrativos producen efectos:", "o": [["desde la fecha en que se dicten, salvo que en ellos se disponga otra cosa", 1, "Correcto: art. 39.1."], ["siempre desde su notificación", 0, "La notificación demora la eficacia solo cuando esta queda supeditada a ella."], ["desde su publicación en el diario oficial", 0, "No es la regla general."], ["desde que adquieren firmeza", 0, "La firmeza es otra cosa distinta de la eficacia."]]}, {"a": 39, "q": "Cabe otorgar eficacia retroactiva a un acto favorable siempre que los supuestos de hecho ya existieran y no se lesionen derechos de terceros.", "vf": true, "ok": true, "fb": "<b>Verdadero.</b> Art. 39.3, segundo supuesto, con sus tres requisitos acumulativos: favorable, hechos preexistentes y sin lesión a otras personas."}, {"a": 40, "q": "El plazo para cursar toda notificación es de:", "o": [["diez días desde la fecha en que el acto haya sido dictado", 1, "Correcto: art. 40.2."], ["diez días desde que el interesado lo solicite", 0, "No depende de solicitud alguna."], ["un mes desde que se dicta el acto", 0, "No es el plazo legal."], ["quince días hábiles", 0, "No es el plazo legal."]]}, {"a": 40, "q": "Una notificación contiene el texto íntegro pero no indica los recursos procedentes. El interesado interpone recurso de alzada. La notificación:", "o": [["surte efecto desde la fecha de interposición del recurso", 1, "Correcto: art. 40.3, que salva las notificaciones con texto íntegro."], ["es nula de pleno derecho", 0, "El art. 40.3 no prevé la nulidad, sino el diferimiento de efectos."], ["nunca podrá surtir efecto", 0, "Sí puede, por conocimiento o por interposición de recurso."], ["obliga a repetir todo el procedimiento", 0, "No es la consecuencia prevista."]]}, {"a": 41, "q": "¿Cuál de estas notificaciones NO puede practicarse por medios electrónicos?", "o": [["la que contenga medios de pago a favor del obligado, como cheques", 1, "Correcto: art. 41.2.b)."], ["la dirigida a una sociedad mercantil", 0, "Está obligada a recibirlas electrónicamente (art. 14.2.a)."], ["la dirigida a un notario en el ejercicio de su actividad", 0, "También está obligado."], ["la dirigida a un empleado público por su condición de tal", 0, "Igualmente obligado."]]}, {"a": 41, "q": "La falta del aviso previsto en el art. 41.6 impide que la notificación sea válida.", "vf": true, "ok": false, "fb": "<b>Falso.</b> El precepto establece expresamente que la falta de práctica de ese aviso <b>no impedirá</b> que la notificación sea considerada plenamente válida."}, {"a": 42, "q": "Puede hacerse cargo de la notificación en el domicilio del interesado:", "o": [["cualquier persona mayor de catorce años que se encuentre en el domicilio y haga constar su identidad", 1, "Correcto: art. 42.2."], ["cualquier persona mayor de dieciséis años", 0, "La ley fija los catorce años."], ["solo el interesado o su representante legal", 0, "La ley admite a cualquier persona mayor de catorce años presente en el domicilio."], ["cualquier vecino del inmueble", 0, "Debe encontrarse en el domicilio del interesado."]]}, {"a": 42, "q": "El primer intento de notificación se realiza un martes a las 10:00 horas. El segundo intento:", "o": [["debe hacerse dentro de los tres días siguientes, después de las quince horas y con al menos tres horas de diferencia", 1, "Correcto: art. 42.2. Se combinan las tres reglas."], ["puede hacerse el mismo martes a las 11:00 horas", 0, "No respeta ni la franja horaria ni el margen de tres horas."], ["debe hacerse en el plazo de diez días", 0, "El plazo es de tres días."], ["no procede: se acude directamente al art. 44", 0, "El art. 44 opera tras el segundo intento fallido."]]}, {"a": 43, "q": "La notificación electrónica se entiende rechazada cuando transcurren:", "o": [["diez días naturales desde la puesta a disposición sin acceder a su contenido", 1, "Correcto: art. 43.2, y son naturales, no hábiles."], ["diez días hábiles desde el aviso", 0, "Son días naturales y se cuentan desde la puesta a disposición."], ["un mes desde la puesta a disposición", 0, "No es el plazo legal."], ["quince días naturales", 0, "No es el plazo legal."]]}, {"a": 43, "q": "Completa: la notificación electrónica se entiende practicada «en el momento en que se produzca el ______ a su contenido».", "gap": "acceso", "fb": "El <b>acceso</b> al contenido (art. 43.2). No basta con recibir el aviso ni con que esté puesta a disposición."}, {"a": 44, "q": "Si intentada la notificación no ha podido practicarse, el anuncio se publica obligatoriamente en:", "o": [["el «Boletín Oficial del Estado»", 1, "Correcto: art. 44, sea cual sea la Administración actuante."], ["el boletín oficial de la provincia", 0, "Es facultativo y previo."], ["el tablón de edictos del ayuntamiento", 0, "Es facultativo y previo."], ["la sede electrónica del organismo", 0, "No sustituye al BOE."]]}, {"a": 45, "q": "En los procedimientos selectivos, la publicación realizada en un medio distinto del indicado en la convocatoria:", "o": [["carece de validez", 1, "Correcto: art. 45.1.b), que lo dice expresamente."], ["es válida si se acredita el conocimiento", 0, "El precepto no admite esa convalidación."], ["es válida si además se notifica individualmente", 0, "No es lo que dispone el artículo."], ["produce efectos desde su publicación posterior en el BOE", 0, "No está previsto."]]}, {"a": 46, "q": "Cuando la publicación de un acto lesiona derechos o intereses legítimos, el órgano competente:", "o": [["publica una somera indicación del contenido y del lugar donde comparecer", 1, "Correcto: art. 46."], ["omite toda publicación", 0, "El precepto obliga a publicar, aunque de forma limitada."], ["publica el texto íntegro con los datos personales anonimizados", 0, "No es la solución del art. 46."], ["notifica por edictos en el tablón municipal", 0, "No es lo previsto en este artículo."]]}];
const CASOS=[{"t": "Caso 1 · La notificación que llegó tarde y mal", "e": "El 3 de marzo el ayuntamiento dicta una resolución que deniega una licencia de actividad. La notificación se cursa el 20 de marzo, contiene el texto íntegro pero no indica los recursos procedentes ni el plazo. El interesado interpone recurso de reposición el 5 de abril. <b>Analiza: ¿es válida la notificación? ¿desde cuándo produce efectos? ¿tiene alguna consecuencia el retraso?</b>", "s": "<p><b>1) El plazo de los diez días.</b> El art. 40.2 exige cursar la notificación dentro de los <b>diez días</b> siguientes a la fecha en que el acto se dicta. Del 3 al 20 de marzo se ha superado con creces. Ahora bien, este plazo es una <b>irregularidad no invalidante</b>: no vicia el acto, aunque puede tener efectos sobre el cómputo del plazo máximo del procedimiento (art. 21) y sobre la responsabilidad del personal (art. 20).</p><p><b>2) La omisión del pie de recursos.</b> La notificación contiene el <b>texto íntegro</b>, de modo que encaja en el art. <b>40.3</b>: no es inexistente, sino <b>defectuosa</b>. Surtirá efecto desde que el interesado realice actuaciones que supongan el conocimiento del acto <b>o interponga cualquier recurso que proceda</b>.</p><p><b>3) La fecha de efectos.</b> Al interponer el recurso de reposición el <b>5 de abril</b>, la notificación queda convalidada y surte efecto desde ese día. El recurso no puede rechazarse por extemporáneo: el plazo no había empezado a correr.</p><p><b>4) Si faltara el texto íntegro.</b> La solución sería distinta: el art. 40.3 solo salva las notificaciones que lo contienen. Sin texto íntegro no hay notificación y el acto sería ineficaz frente al interesado.</p><p><b>5) Motivación.</b> Como acto que <b>limita derechos o intereses legítimos</b>, la denegación debía estar motivada (art. 35.1.a). Si no lo estuviera, cabría alegar además <b>anulabilidad</b> por defecto de forma causante de indefensión (art. 48.2).</p>"}, {"t": "Caso 2 · Los dos intentos", "e": "Un ayuntamiento intenta notificar en papel una orden de ejecución. Primer intento: <b>jueves 12, a las 13:30</b>, nadie en el domicilio. Segundo intento: <b>viernes 13, a las 16:00</b>. Nadie de nuevo. El ayuntamiento publica el anuncio únicamente en el <b>Boletín Oficial de la Provincia</b> y en el tablón de edictos municipal. <b>Valora cada paso.</b>", "s": "<p><b>1) Primer intento.</b> Correcto. Debe hacerse constar en el expediente la circunstancia junto con el <b>día y la hora</b> (art. 42.2).</p><p><b>2) Segundo intento.</b> Cumple tres de los cuatro criterios y falla el cuarto:</p><ul><li><b>Una sola vez</b>: correcto.</li><li><b>Dentro de los tres días siguientes</b>: el viernes 13 está en plazo.</li><li><b>Franja horaria distinta</b>: el primero antes de las 15:00 y el segundo después. Correcto.</li><li><b>Margen mínimo de tres horas</b>: de 13:30 a 16:00 median <b>dos horas y media</b>. <b>Incumple</b> el art. 42.2. Debió practicarse a partir de las <b>16:30</b>.</li></ul><p>El segundo intento es, por tanto, <b>defectuoso</b>.</p><p><b>3) La publicación.</b> Incorrecta. El art. 44 impone el anuncio en el <b>«Boletín Oficial del Estado»</b>. El boletín provincial y el tablón de edictos son <b>facultativos y previos</b> y <b>no excluyen</b> la obligación de publicar en el BOE.</p><p><b>4) Consecuencia.</b> La notificación no está bien practicada. El acto será <b>ineficaz</b> frente al interesado y, si se ha ejecutado, cabrá alegar indefensión. La Administración debe retrotraer y notificar correctamente.</p><p><b>Regla que se extrae:</b> las cifras del art. 42.2 no son orientativas. <b>14 años · 2 intentos · 3 días · 3 horas · las 15:00</b>. Y el BOE no es opcional.</p>"}, {"t": "Caso 3 · Retroactividad y precedente", "e": "El 10 de junio un ayuntamiento resuelve reconocer a una funcionaria un complemento retribuido <b>con efectos desde el 1 de enero</b>, fecha desde la que venía desempeñando efectivamente las funciones. En la misma sesión, deniega la misma solicitud a otro funcionario en idéntica situación, <b>sin explicar por qué</b>, pese a que en 2024 se le había reconocido a un tercero en circunstancias iguales. <b>Analiza ambas decisiones.</b>", "s": "<p><b>1) La retroactividad del primer acto.</b> Es admisible si concurren los <b>tres requisitos</b> del art. 39.3, segundo supuesto: que el acto sea <b>favorable</b> a la interesada (lo es), que los <b>supuestos de hecho</b> necesarios existieran ya el 1 de enero (venía desempeñando las funciones) y que <b>no se lesionen derechos o intereses legítimos de otras personas</b>. Este último punto exige comprobación: si el reconocimiento altera un orden de prelación o una bolsa, podría lesionar a terceros y decaería la retroactividad.</p><p><b>2) La denegación al segundo funcionario.</b> Vulnera el art. <b>35.1.a)</b> —acto que limita intereses legítimos— y, sobre todo, el art. <b>35.1.c)</b>: se <b>separa del criterio seguido en actuaciones precedentes</b> sin motivarlo. Apartarse del precedente no está prohibido; hacerlo <b>sin explicación</b>, sí.</p><p><b>3) Consecuencia.</b> Defecto de forma. Conforme al art. <b>48.2</b>, determinará la <b>anulabilidad</b> si causa <b>indefensión</b>, que es lo habitual cuando el interesado no puede saber qué rebatir. Cabe recurso de reposición o alzada, según el órgano.</p><p><b>4) Un matiz.</b> Si la retribución del primer acto vulnerase lo dispuesto en las bases de ejecución del presupuesto —una disposición de carácter general—, entraría además en juego el art. <b>37</b>: sería <b>nula de pleno derecho</b> por inderogabilidad singular.</p>"}];
const SEMAFORO=["Requisitos de producción y contenido del acto — art. 34", "Los nueve supuestos de motivación — art. 35", "Forma: escrita electrónica, verbal y actos en serie — art. 36", "Inderogabilidad singular y su sanción de nulidad — art. 37", "Ejecutividad y su relación con la ejecución forzosa — art. 38", "Presunción de validez y eficacia desde que se dicta — art. 39.1", "Eficacia demorada y eficacia retroactiva — art. 39.2 y 39.3", "Plazo y contenido de la notificación — art. 40", "Notificación defectuosa y su convalidación — art. 40.3", "Notificación electrónica preferente y excepciones — art. 41", "Los dos intentos, las 15:00 y las tres horas — art. 42", "Rechazo por diez días naturales — art. 43", "Anuncio obligatorio en el BOE — art. 44", "Publicación con efectos de notificación — art. 45", "Somera indicación cuando publicar lesiona derechos — art. 46"];
const CALTXT=["Lectura activa + test completo + semáforo. Fija las nueve letras del art. 35 y la tabla de cifras del art. 42.", "Solo flashcards y tabla de plazos: 10 días · 10 naturales · 14 años · 2 intentos · 3 días · 3 horas · 15:00.", "Caso práctico 2 (los dos intentos) inventando variantes de horario y comprobando si son válidas.", "Explicar en voz alta la diferencia entre validez y eficacia, y entre notificación defectuosa e inexistente. Casos 1 y 3.", "Test intercalado con el bloque 2 (nulidad y anulabilidad) y con el tema 3 (fases del procedimiento)."];
const INTRO_HTML="<section class=\"card\" id=\"intro\"><h2>Tema 2 · Bloque 1 · El acto administrativo: requisitos y eficacia</h2><p class=\"small\">Primer bloque del tema 2. Los Capítulos I y II del Título III de la Ley 39/2015: qué hace válido a un acto administrativo y desde cuándo despliega efectos, con toda la mecánica de la notificación y la publicación.</p><div class=\"box ej\"><span class=\"lbl\">La idea que ordena el bloque</span>Un acto administrativo recorre dos planos sucesivos. Primero el de la <b>validez</b> —quién lo dicta, cómo y con qué contenido: arts. 34 a 37—. Después el de la <b>eficacia</b> —desde cuándo obliga y cómo llega al interesado: arts. 38 a 46—. Son planos independientes: un acto puede ser válido y todavía ineficaz, o eficaz y sin embargo inválido.</div><div class=\"box warn\"><span class=\"lbl\">Fuentes utilizadas y vigencia</span><ul><li><b>Ley 39/2015, de 1 de octubre</b>, del Procedimiento Administrativo Común de las Administraciones Públicas (documento 1 de la biblioteca), texto consolidado.</li><li>Concordancias con la <b>Ley 40/2015</b> (documento 2) en materia de competencia y de potestad reglamentaria, y con el <b>RD 203/2021</b> (documento 4) en cuanto al documento y la sede electrónicos.</li><li><b>Aportación externa</b>: los arts. 9.3 y 103 de la <b>Constitución</b>, citados como fundamento de la interdicción de la arbitrariedad y del sometimiento pleno a la ley. Verifica siempre la vigencia en el BOE consolidado.</li></ul></div><svg viewBox=\"0 0 660 210\" role=\"img\" aria-label=\"Mapa conceptual de los artículos 34 a 46\"><rect x=\"215\" y=\"8\" width=\"230\" height=\"34\" rx=\"9\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"330\" y=\"30\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"#fff\">EL ACTO ADMINISTRATIVO</text><line x1=\"330\" y1=\"42\" x2=\"330\" y2=\"58\" stroke=\"var(--acc)\" stroke-width=\"2\"/><line x1=\"165\" y1=\"58\" x2=\"495\" y2=\"58\" stroke=\"var(--acc)\" stroke-width=\"

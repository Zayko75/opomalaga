<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Ley 39/2015 · LPAC · Arts. 34 a 46 · Requisitos, eficacia, notificación y publicación</title>
<style>

/* ═══════════════════════════════════════════════════════════════
   SISTEMA DE DISEÑO · "Académico Gamificado" · Bloque II
   Temas 8, 9 y 10 · Auxiliar Administrativo
   ═══════════════════════════════════════════════════════════════ */
:root{
  --fs:16px;

  --bg:#faf9f7;
  --bg-grad:radial-gradient(1100px 560px at 12% -8%, #ede9ff 0%, transparent 55%),
            radial-gradient(850px 460px at 96% 0%, #dcf5ee 0%, transparent 50%);
  --surface:#ffffff;
  --surface-2:#f4f3f0;
  --surface-3:#eceae5;
  --line:#e6e3dc;
  --line-strong:#d4d0c7;

  --ink:#15161c;
  --ink-2:#5d616e;
  --ink-3:#8b8f9c;

  --brand:#5b3df5;
  --brand-2:#7c5cff;
  --brand-soft:#efeaff;
  --brand-ring:rgba(91,61,245,.18);

  --legal:#4338ca;  --legal-bg:#eeecff;
  --ej:#059669;     --ej-bg:#e4f7f0;
  --warn:#c2690a;   --warn-bg:#fdf1de;
  --exc:#dc2626;    --exc-bg:#ffeceb;

  --ok:#16a34a; --ok-soft:#e7f7ec;
  --mid:#eab308; --mid-soft:#fdf6dd;
  --off:#a1a1aa; --off-soft:#f1f1f3;

  --sh-1:0 1px 2px rgba(20,20,30,.04), 0 2px 8px rgba(20,20,30,.04);
  --sh-2:0 2px 6px rgba(20,20,30,.05), 0 12px 28px rgba(20,20,30,.07);
  --sh-3:0 8px 20px rgba(91,61,245,.13), 0 24px 56px rgba(20,20,30,.10);
  --sh-glow:0 0 0 4px var(--brand-ring);

  --r-sm:9px; --r-md:14px; --r-lg:20px; --r-full:999px;

  --f-display:"Segoe UI Variable Display",system-ui,-apple-system,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-legal:ui-serif,Georgia,Cambria,"Times New Roman",serif;
  --f-mono:ui-monospace,"SF Mono","Cascadia Mono","Segoe UI Mono",Menlo,monospace;

  --t-h1:clamp(1.02rem,.95rem + .3vw,1.2rem);
  --t-h2:clamp(1.2rem,1.05rem + .6vw,1.55rem);
  --t-h3:clamp(1rem,.95rem + .25vw,1.12rem);
  --t-sm:.86rem;
  --t-xs:.75rem;

  --e-out:cubic-bezier(.22,1,.36,1);
  --e-spring:cubic-bezier(.34,1.56,.64,1);

  /* ── Compatibilidad con SVG y contenido generado ── */
  --panel:var(--surface);
  --ink2:var(--ink-2);
  --acc:var(--brand);
  --acc-soft:var(--brand-soft);
  --g:var(--ok); --y:var(--mid); --r:var(--exc);
}

html[data-theme="dark"]{
  --bg:#0a0b0f;
  --bg-grad:radial-gradient(1100px 560px at 12% -8%, #1c1740 0%, transparent 55%),
            radial-gradient(850px 460px at 96% 0%, #08302b 0%, transparent 50%);
  --surface:#13151b;
  --surface-2:#1a1d25;
  --surface-3:#232733;
  --line:#262a34;
  --line-strong:#343947;

  --ink:#eceef4;
  --ink-2:#9ba2b3;
  --ink-3:#6e7585;

  --brand:#8b6dff;
  --brand-2:#a78bff;
  --brand-soft:#1e1a3d;
  --brand-ring:rgba(139,109,255,.22);

  --legal:#a5b4fc; --legal-bg:#191b3a;
  --ej:#34d399;    --ej-bg:#0c2a24;
  --warn:#fbbf24;  --warn-bg:#2e2110;
  --exc:#fb7185;   --exc-bg:#331119;

  --ok:#4ade80; --ok-soft:#0e2a19;
  --mid:#facc15; --mid-soft:#2c2610;
  --off:#5b6070; --off-soft:#1c1f27;

  --sh-1:0 1px 2px rgba(0,0,0,.3), 0 2px 8px rgba(0,0,0,.25);
  --sh-2:0 2px 6px rgba(0,0,0,.35), 0 12px 28px rgba(0,0,0,.4);
  --sh-3:0 8px 20px rgba(139,109,255,.2), 0 24px 56px rgba(0,0,0,.5);
}

*,*::before,*::after{box-sizing:border-box}
html{font-size:var(--fs);scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);background-image:var(--bg-grad);
  background-attachment:fixed;background-repeat:no-repeat;
  color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.68;
  -webkit-font-smoothing:antialiased;
  transition:background-color .5s var(--e-out),color .3s;
}
::selection{background:var(--brand);color:#fff}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{font-family:var(--f-display);letter-spacing:-.022em;line-height:1.2}
.num{font-variant-numeric:tabular-nums}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:99px;border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3)}

/* ═══ HEADER ═══ */
header.top{
  position:sticky;top:0;z-index:60;
  background:color-mix(in srgb,var(--surface) 80%,transparent);
  backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);
  border-bottom:1px solid var(--line);
}
.top-in{max-width:1280px;margin:0 auto;padding:.65rem 1.1rem;display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.brandwrap{display:flex;align-items:center;gap:.65rem;min-width:0;flex:1}
.mark{
  width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;
  font-weight:800;font-size:.8rem;letter-spacing:-.02em;text-decoration:none;
  box-shadow:0 4px 14px var(--brand-ring);
  transition:transform .3s var(--e-spring),box-shadow .3s;
}
.mark:hover{transform:rotate(-8deg) scale(1.08);box-shadow:var(--sh-3);text-decoration:none}
.top h1{font-size:var(--t-h1);margin:0;font-weight:800;line-height:1.25;min-width:0}
.top h1 .sub{display:block;font-size:var(--t-xs);color:var(--ink-2);font-weight:500;letter-spacing:0;
  margin-top:.1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tools{margin-left:auto;display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}

button,select,input[type=search]{
  font:inherit;font-size:var(--t-sm);font-weight:600;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:var(--r-sm);padding:.4rem .72rem;cursor:pointer;
  position:relative;overflow:hidden;
  transition:transform .18s var(--e-spring),border-color .2s,background .2s,box-shadow .2s,color .2s;
}
button:hover{transform:translateY(-1.5px);border-color:var(--brand);box-shadow:var(--sh-1)}
button:active{transform:translateY(0) scale(.97)}
button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible{outline:none;box-shadow:var(--sh-glow)}
input[type=search]{min-width:190px;cursor:text;font-weight:500}
input[type=search]:focus{border-color:var(--brand)}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--surface-2);padding:2px;gap:2px}
.seg button{border:0;border-radius:calc(var(--r-sm) - 2px);padding:.32rem .68rem;background:transparent;box-shadow:none}
.seg button:hover{transform:none;background:var(--surface)}
.seg button[aria-pressed="true"]{background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;box-shadow:0 2px 8px var(--brand-ring)}

.ripple{position:absolute;border-radius:50%;transform:scale(0);background:currentColor;opacity:.25;animation:rip .55s linear;pointer-events:none}
@keyframes rip{to{transform:scale(3.4);opacity:0}}

.progress{position:absolute;left:0;bottom:-1px;height:2.5px;width:0;
  background:linear-gradient(90deg,var(--brand),var(--legal),var(--ej));transition:width .1s linear}

/* ═══ LAYOUT ═══ */
.layout{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:270px 1fr;gap:1.8rem;padding:1.4rem 1.1rem 5rem}
main{min-width:0}

/* ═══ SIDEBAR ═══ */
nav.side{
  position:sticky;top:76px;align-self:start;max-height:calc(100vh - 96px);overflow:auto;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:.85rem;box-shadow:var(--sh-1);
}
nav.side h2{font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);
  margin:.5rem .4rem .5rem;font-weight:800}
nav.side h2:first-child{margin-top:.1rem}
nav.side a{
  display:flex;align-items:baseline;gap:.5rem;padding:.36rem .55rem;border-radius:var(--r-sm);
  text-decoration:none;color:var(--ink-2);font-size:var(--t-sm);font-weight:500;
  position:relative;transition:background .22s,color .22s,transform .22s var(--e-out);
}
nav.side a:hover{background:var(--surface-2);color:var(--ink);transform:translateX(3px);text-decoration:none}
nav.side a.on{background:var(--brand-soft);color:var(--brand);font-weight:700}
nav.side a.on::before{content:"";position:absolute;left:-.85rem;top:20%;bottom:20%;width:3px;
  border-radius:0 3px 3px 0;background:var(--brand)}
nav.side a b{color:var(--ink-3);font-weight:800;font-size:var(--t-xs);font-variant-numeric:tabular-nums;flex:none;min-width:1.9em}
nav.side a.on b{color:var(--brand)}
.navtoggle{display:none}

/* ═══ TARJETAS ═══ */
section.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:1.35rem 1.5rem;margin-bottom:1.1rem;box-shadow:var(--sh-1);
  transition:box-shadow .3s var(--e-out),border-color .3s;
}
section.card:hover{box-shadow:var(--sh-2)}
section.card>h2{
  margin:0 0 1rem;font-size:var(--t-h2);font-weight:800;
  display:flex;align-items:center;gap:.6rem;
}
section.card>h2::before{
  content:"";width:4px;height:1.05em;border-radius:99px;flex:none;
  background:linear-gradient(180deg,var(--brand),var(--brand-2));
}

/* ═══ ARTÍCULO ═══ */
.art{scroll-margin-top:86px;padding-top:.4rem}
.art + .art{margin-top:1.6rem;padding-top:1.6rem;border-top:1px dashed var(--line)}
.art h2{display:flex;flex-wrap:wrap;gap:.5rem;align-items:baseline;font-size:var(--t-h3);
  margin:0 0 .25rem;font-weight:800;letter-spacing:-.015em}
.art h2 .num{
  color:var(--brand);font-weight:800;font-family:var(--f-display);
  background:var(--brand-soft);padding:.1rem .5rem;border-radius:var(--r-sm);
  font-size:.92em;letter-spacing:-.02em;
}
.ubic{font-size:var(--t-xs);color:var(--ink-3);margin:0 0 .8rem;font-weight:600;
  letter-spacing:.03em;text-transform:uppercase}

/* ═══ IDEA CLAVE ═══ */
.idea{
  background:linear-gradient(100deg,var(--brand-soft),color-mix(in srgb,var(--brand-soft) 40%,transparent));
  border-left:4px solid var(--brand);border-radius:0 var(--r-md) var(--r-md) 0;
  padding:.75rem 1rem;font-weight:650;margin:.7rem 0 1rem;position:relative;
  font-size:.97rem;line-height:1.55;
}

/* ═══ ACORDEÓN ═══ */
details.panel{
  border:1px solid var(--line);border-radius:var(--r-md);margin:.6rem 0;
  background:var(--surface);overflow:hidden;
  transition:border-color .25s,box-shadow .25s,background .25s;
}
details.panel:hover{border-color:var(--line-strong)}
details.panel[open]{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-ring)}
details.panel>summary{
  cursor:pointer;padding:.62rem .9rem;font-weight:700;font-size:.93rem;
  list-style:none;display:flex;align-items:center;gap:.55rem;
  transition:background .2s,color .2s;
}
details.panel>summary:hover{background:var(--surface-2)}
details.panel[open]>summary{background:var(--brand-soft);color:var(--brand)}
details.panel>summary::-webkit-details-marker{display:none}
details.panel>summary::before{
  content:"";width:16px;height:16px;flex:none;border-radius:5px;
  background:var(--brand-soft);position:relative;transition:transform .3s var(--e-spring),background .25s;
}
details.panel>summary::after{
  content:"";position:absolute;width:0;height:0;margin-left:5px;
  border:4px solid transparent;border-left-color:var(--brand);
  transition:transform .3s var(--e-spring);
}
details.panel[open]>summary::before{background:var(--surface)}
details.panel[open]>summary::after{transform:rotate(90deg) translateX(-1px)}
details.panel .body{padding:.3rem 1rem 1rem;font-size:.95rem;animation:slidein .35s var(--e-out)}
@keyframes slidein{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* ═══ TEXTO LEGAL ═══ */
.legal{
  background:var(--legal-bg);border-left:4px solid var(--legal);
  border-radius:0 var(--r-md) var(--r-md) 0;padding:.85rem 1.05rem;
  font-family:var(--f-legal);font-size:.95rem;line-height:1.7;
}
.legal p{margin:.45rem 0}
.legal .lbl{
  font-family:var(--f-body);font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;
  color:var(--legal);font-weight:800;display:block;margin-bottom:.4rem;
}

/* ═══ CAJAS SEMÁNTICAS ═══ */
.box{
  border-left:4px solid var(--line);border-radius:0 var(--r-md) var(--r-md) 0;
  padding:.72rem .95rem;margin:.65rem 0;font-size:.94rem;
  transition:transform .25s var(--e-out),box-shadow .25s;
}
.box:hover{transform:translateX(3px);box-shadow:var(--sh-1)}
.box.ej{background:var(--ej-bg);border-color:var(--ej)}
.box.warn{background:var(--warn-bg);border-color:var(--warn)}
.box.exc{background:var(--exc-bg);border-color:var(--exc)}
.box .lbl{font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;font-weight:800;
  display:block;margin-bottom:.3rem}
.box.ej .lbl{color:var(--ej)}
.box.warn .lbl{color:var(--warn)}
.box.exc .lbl{color:var(--exc)}

.interp{
  border:1px dashed var(--warn);background:color-mix(in srgb,var(--warn-bg) 45%,transparent);
  border-radius:var(--r-md);padding:.65rem .9rem;font-size:.9rem;margin:.6rem 0;
}
.interp .lbl{font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;color:var(--warn);font-weight:800;display:block}

/* ═══ TABLAS ═══ */
table{width:100%;border-collapse:separate;border-spacing:0;font-size:.9rem;margin:.7rem 0;
  border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
th,td{padding:.5rem .68rem;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
td + td, th + th{border-left:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th{background:var(--surface-2);font-size:var(--t-xs);font-weight:800;letter-spacing:.05em;
  text-transform:uppercase;color:var(--ink-2);position:sticky;top:0}
tbody tr{transition:background .18s}
tbody tr:nth-child(even){background:color-mix(in srgb,var(--surface-2) 45%,transparent)}
tbody tr:hover{background:var(--brand-soft)}
th.sortable{cursor:pointer;user-select:none;transition:color .2s,background .2s}
th.sortable:hover{color:var(--brand);background:var(--brand-soft)}
th.sortable::after{content:" ⇅";color:var(--ink-3);font-size:.7rem}

ul,ol{margin:.5rem 0 .5rem 1.2rem;padding:0}
li{margin:.26rem 0}
li::marker{color:var(--brand);font-weight:700}

/* ═══ TOOLTIPS ═══ */
.t{border-bottom:1.5px dotted var(--brand);cursor:help;position:relative;
  transition:background .2s,color .2s}
.t:hover{background:var(--brand-soft);color:var(--brand);border-radius:3px}
#tip{
  position:fixed;z-index:99;max-width:330px;background:var(--ink);color:var(--bg);
  padding:.6rem .78rem;border-radius:var(--r-md);font-size:.82rem;line-height:1.5;
  display:none;box-shadow:0 8px 30px rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.08);
}
html[data-theme="dark"] #tip{background:#f0f1f5;color:#15161c}

/* ═══ FLECHAS DE DIAGRAMA ═══
   Un <path> con stroke pero sin fill toma el valor inicial (negro) y el
   navegador cierra el trazo implícitamente: aparece un triángulo relleno
   entre sus extremos. Forzamos fill:none para dejar solo la línea + la
   punta del <marker>, que sí lleva su color. */
svg path[stroke]:not([fill]){fill:none}
svg polyline:not([fill]){fill:none}
svg line{fill:none}

/* ═══ SVG ═══ */
svg{max-width:100%;height:auto;display:block;margin:.9rem auto}
svg text{font-family:var(--f-body)}

/* ═══ BUSCADOR ═══ */
mark.hit{background:linear-gradient(180deg,transparent 55%,#ffe066 55%);color:inherit;
  border-radius:2px;padding:0 1px;font-weight:600}
html[data-theme="dark"] mark.hit{background:linear-gradient(180deg,transparent 55%,#8a6d00 55%);color:#fff}

/* ═══ UTILIDADES ═══ */
.hide{display:none !important}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.small{font-size:var(--t-sm);color:var(--ink-2)}
.chip{
  display:inline-block;font-size:var(--t-xs);padding:.16rem .55rem;border-radius:var(--r-full);
  background:var(--brand-soft);color:var(--brand);font-weight:800;letter-spacing:.02em;
}

/* ═══ HUECOS RELLENABLES ═══ */
.gap{
  display:inline-block;min-width:5.5em;border-bottom:2px solid var(--brand);
  text-align:center;font-weight:700;color:transparent;cursor:pointer;
  transition:color .3s,background .3s;
}
.gap.on,.gap:hover{color:var(--brand);background:var(--brand-soft);border-radius:4px 4px 0 0}

/* ═══ REVELAR SOLUCIÓN ═══ */
.revelar{
  background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;border-color:transparent;
  font-weight:700;
}
.revelar:hover{box-shadow:var(--sh-3)}
.sol{
  margin-top:.7rem;padding:.8rem 1rem;border-radius:var(--r-md);
  background:var(--ej-bg);border-left:4px solid var(--ej);
  animation:slidein .4s var(--e-out);
}

/* ═══ TEST ═══ */
.opt{
  display:block;padding:.55rem .85rem;margin:.35rem 0;border:1.5px solid var(--line);
  border-radius:var(--r-md);cursor:pointer;background:var(--surface);font-size:.94rem;
  transition:border-color .22s,background .22s,transform .22s var(--e-out);
}
.opt:hover{border-color:var(--brand);background:var(--brand-soft);transform:translateX(4px)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft);font-weight:650}
.opt.ko{border-color:var(--exc);background:var(--exc-bg)}
.opt input{margin-right:.5rem;accent-color:var(--brand)}

#tscore,#semres{
  font-family:var(--f-display);font-weight:800;font-size:1.15rem;letter-spacing:-.02em;
}

/* ═══════════════════════════════════════════════════════════════
   FLASHCARDS 3D · mazo con giro, vuelo de salida y sheen
   ═══════════════════════════════════════════════════════════════ */
#flash{--fc-e:cubic-bezier(.2,.8,.25,1);--fc-h:250px}

/* — Escena — */
.fc-stage{
  perspective:1400px;perspective-origin:50% 45%;
  padding:.4rem 0 .2rem;position:relative;
}
.fc-deck{position:relative;height:var(--fc-h);will-change:transform}

/* — Cartas fantasma del mazo — */
.fc-ghost{
  position:absolute;inset:0;border-radius:var(--r-lg);
  background:var(--surface);border:1px solid var(--line);
  transition:transform .5s var(--fc-e),opacity .5s var(--fc-e);
}
.fc-ghost.g1{transform:translateY(9px) scale(.972);opacity:.75}
.fc-ghost.g2{transform:translateY(18px) scale(.944);opacity:.45}
.fc-deck.empty .fc-ghost{opacity:0;transform:translateY(26px) scale(.9)}

/* — Elevación durante el giro — */
.fc-lift{position:absolute;inset:0;transform-style:preserve-3d}
.fc-lift.lift{animation:fcLift .78s var(--fc-e)}
@keyframes fcLift{
  0%,100%{transform:scale(1) translateY(0)}
  45%{transform:scale(1.055) translateY(-16px)}
}
.fc-lift.out-ok{animation:fcOut .5s cubic-bezier(.5,0,.75,0) forwards}
.fc-lift.out-ko{animation:fcOutKo .5s cubic-bezier(.5,0,.75,0) forwards}
.fc-lift.in{animation:fcIn .48s var(--fc-e)}
@keyframes fcOut{
  0%{transform:translateX(0) rotate(0) scale(1);opacity:1}
  100%{transform:translateX(130%) rotate(17deg) scale(.85);opacity:0}
}
@keyframes fcOutKo{
  0%{transform:translateX(0) rotate(0) scale(1);opacity:1}
  100%{transform:translateX(-130%) rotate(-17deg) scale(.85);opacity:0}
}
@keyframes fcIn{
  0%{transform:translateY(26px) scale(.9);opacity:0}
  100%{transform:translateY(0) scale(1);opacity:1}
}

/* — La carta — */
.fc-card{
  position:absolute;inset:0;transform-style:preserve-3d;
  transition:transform .78s var(--fc-e);
  cursor:pointer;border-radius:var(--r-lg);
}
.fc-card:focus-visible{outline:none}
.fc-card:focus-visible .fc-face{box-shadow:var(--sh-glow),var(--sh-2)}

/* — Caras — */
.fc-face{
  position:absolute;inset:0;border-radius:var(--r-lg);
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  padding:2rem 2.2rem;text-align:center;overflow:hidden;
  box-shadow:var(--sh-2);
  transition:box-shadow .4s var(--fc-e);
}
.fc-card:hover .fc-face{box-shadow:var(--sh-3)}

/* Anverso · pregunta */
.fc-front{
  background:
    radial-gradient(120% 90% at 50% -20%, var(--brand-soft) 0%, transparent 60%),
    var(--surface);
  border:1.5px solid var(--line);color:var(--ink);
}
/* Reverso · respuesta */
.fc-back{
  transform:rotateY(180deg);
  background:linear-gradient(145deg,var(--brand) 0%,#6d4bf7 45%,var(--c5,#0891b2) 130%);
  border:1.5px solid transparent;color:#fff;
}
html[data-theme="dark"] .fc-back{
  background:linear-gradient(145deg,#5f45c9 0%,#4b3aa8 45%,#0e6b85 130%);
}
.fc-back .fc-txt{color:#fff}
.fc-back b,.fc-back strong{color:#fff;font-weight:800}

/* — Sheen que barre al girar — */
.fc-face::after{
  content:"";position:absolute;top:-60%;left:-70%;width:55%;height:220%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.42),transparent);
  transform:rotate(18deg);opacity:0;pointer-events:none;
}
.fc-lift.lift .fc-face::after{animation:fcSheen .78s var(--fc-e)}
@keyframes fcSheen{
  0%{opacity:0;left:-70%}
  35%{opacity:1}
  100%{opacity:0;left:150%}
}

/* — Etiqueta superior — */
.fc-tag{
  position:absolute;top:1rem;left:1.15rem;
  font-size:var(--t-xs);font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  display:inline-flex;align-items:center;gap:.4rem;
}
.fc-front .fc-tag{color:var(--brand)}
.fc-back .fc-tag{color:rgba(255,255,255,.9)}
.fc-tag::before{
  content:"";width:7px;height:7px;border-radius:50%;background:currentColor;
  animation:fcPulse 2.2s ease-in-out infinite;
}
@keyframes fcPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.65)}}

/* — Índice tipo naipe — */
.fc-pip{
  position:absolute;font-family:var(--f-display);font-weight:800;
  font-size:.78rem;letter-spacing:-.02em;opacity:.34;font-variant-numeric:tabular-nums;
}
.fc-pip.tr{top:1rem;right:1.15rem}
.fc-pip.bl{bottom:1rem;left:1.15rem;transform:rotate(180deg)}
.fc-front .fc-pip{color:var(--ink-2)}
.fc-back .fc-pip{color:#fff;opacity:.55}

/* — Texto — */
.fc-txt{
  font-size:clamp(1rem,.9rem + .55vw,1.28rem);font-weight:650;line-height:1.5;
  max-width:44ch;letter-spacing:-.012em;
}
.fc-front .fc-txt{font-family:var(--f-display);font-weight:700}
.fc-back .fc-txt{font-weight:600;line-height:1.6}
.fc-hint{
  position:absolute;bottom:1rem;left:0;right:0;
  font-size:var(--t-xs);font-weight:600;letter-spacing:.02em;
  display:flex;align-items:center;justify-content:center;gap:.4rem;
}
.fc-front .fc-hint{color:var(--ink-3)}
.fc-back .fc-hint{color:rgba(255,255,255,.72)}
.fc-hint .kbd{
  font-family:var(--f-mono);font-size:.68rem;font-weight:700;padding:.1rem .32rem;
  border-radius:5px;border:1px solid currentColor;opacity:.75;
}

/* — Pantalla final — */
.fc-done{
  position:absolute;inset:0;border-radius:var(--r-lg);
  background:linear-gradient(150deg,var(--ok-soft),var(--surface) 70%);
  border:1.5px solid var(--ok);
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  text-align:center;padding:2rem;gap:.35rem;
  animation:fcIn .5s var(--fc-e);box-shadow:var(--sh-2);
}
.fc-done .seal{
  font-size:2.6rem;line-height:1;
  animation:fcSeal .7s cubic-bezier(.2,1.5,.4,1);
}
@keyframes fcSeal{0%{transform:scale(0) rotate(-25deg);opacity:0}60%{transform:scale(1.2) rotate(6deg)}100%{transform:scale(1) rotate(0);opacity:1}}
.fc-done h3{font-size:1.3rem;font-weight:800;margin:.2rem 0 0}
.fc-done p{margin:0;color:var(--ink-2);font-size:var(--t-sm)}

/* — Barra de progreso de la ronda — */
.fc-bar{
  height:6px;border-radius:99px;background:var(--surface-3);
  overflow:hidden;margin:.95rem 0 .8rem;position:relative;
}
.fc-bar i{
  display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--brand),var(--c5,#0891b2));
  transition:width .55s var(--fc-e);
}

/* — Controles — */
.fc-ctrls{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.fc-ctrls button{font-weight:700}
#fcok{border-color:var(--ok);color:var(--ok)}
#fcok:hover{background:var(--ok);color:#fff;border-color:var(--ok)}
#fcko{border-color:var(--warn);color:var(--warn)}
#fcko:hover{background:var(--warn);color:#fff;border-color:var(--warn)}
#fcflip{background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;border-color:transparent}
#fcflip:hover{box-shadow:var(--sh-3)}

.fc-score{display:inline-flex;gap:.45rem;margin-left:auto;align-items:center}
.fc-pill{
  font-size:var(--t-xs);font-weight:800;padding:.24rem .6rem;border-radius:var(--r-full);
  font-variant-numeric:tabular-nums;border:1px solid;
}
.fc-pill.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.fc-pill.ko{color:var(--warn);border-color:var(--warn);background:var(--warn-bg)}
.fc-pill.left{color:var(--ink-2);border-color:var(--line);background:var(--surface-2)}
.fc-pill.bump{animation:fcBump .45s var(--e-spring)}
@keyframes fcBump{0%{transform:scale(1)}45%{transform:scale(1.28)}100%{transform:scale(1)}}

@media(max-width:620px){
  #flash{--fc-h:270px}
  .fc-face{padding:1.7rem 1.3rem}
  .fc-score{margin-left:0;width:100%}
}
@media(prefers-reduced-motion:reduce){
  .fc-card{transition:none}
  .fc-lift.lift,.fc-lift.in,.fc-lift.out-ok,.fc-lift.out-ko,.fc-face::after{animation:none !important}
}
@media print{.fc-stage,.fc-ctrls,.fc-bar{display:none !important}}
/* ═══ RESPUESTA ESTRUCTURADA ═══ */
.fc-face{justify-content:center}
.fc-face.struct{justify-content:flex-start;text-align:left;padding-top:3.1rem;padding-bottom:3.1rem}
.fc-body{
  width:100%;max-width:46ch;margin:0 auto;
  overflow-y:auto;max-height:100%;
  scrollbar-width:thin;
}
.fc-body::-webkit-scrollbar{width:5px}
.fc-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.35);border-radius:99px;border:0}
.fc-front .fc-body::-webkit-scrollbar-thumb{background:var(--line-strong)}

/* — Veredicto Sí / No — */
.fc-verdict{
  display:inline-flex;align-items:center;gap:.35rem;
  font-family:var(--f-display);font-weight:800;font-size:.82rem;
  letter-spacing:.06em;text-transform:uppercase;
  padding:.26rem .72rem;border-radius:var(--r-full);margin-bottom:.85rem;
  border:1.5px solid;animation:fcPopIn .45s var(--e-spring) backwards;animation-delay:.34s;
}
.fc-verdict.si{background:rgba(255,255,255,.16);border-color:rgba(190,255,215,.85);color:#d8ffe9}
.fc-verdict.no{background:rgba(255,255,255,.16);border-color:rgba(255,205,205,.85);color:#ffdedd}
@keyframes fcPopIn{0%{opacity:0;transform:scale(.7) translateY(6px)}100%{opacity:1;transform:none}}

/* — Párrafo — */
.fc-p{margin:0;font-size:clamp(1rem,.92rem + .45vw,1.2rem);font-weight:600;line-height:1.6}
.fc-face.struct .fc-p{font-size:clamp(.96rem,.9rem + .35vw,1.1rem)}

/* — Lista enumerada — */
.fc-list{list-style:none;margin:0;padding:0;display:grid;gap:.5rem;counter-reset:fc}
.fc-list li{
  counter-increment:fc;position:relative;margin:0;
  padding:.42rem .6rem .42rem 2.5rem;border-radius:var(--r-sm);
  background:rgba(255,255,255,.11);
  font-size:clamp(.92rem,.88rem + .3vw,1.04rem);font-weight:600;line-height:1.45;
  animation:fcRow .42s var(--e-out) backwards;
}
.fc-list li::before{
  content:counter(fc);position:absolute;left:.6rem;top:50%;transform:translateY(-50%);
  width:1.6rem;height:1.6rem;border-radius:50%;
  display:grid;place-items:center;
  background:rgba(255,255,255,.9);color:var(--brand);
  font-family:var(--f-display);font-weight:800;font-size:.78rem;
  font-variant-numeric:tabular-nums;
}
.fc-list.alpha li::before{content:counter(fc,lower-alpha)}
.fc-list li:nth-child(1){animation-delay:.36s}
.fc-list li:nth-child(2){animation-delay:.42s}
.fc-list li:nth-child(3){animation-delay:.48s}
.fc-list li:nth-child(4){animation-delay:.54s}
.fc-list li:nth-child(5){animation-delay:.60s}
.fc-list li:nth-child(n+6){animation-delay:.66s}
@keyframes fcRow{0%{opacity:0;transform:translateX(-12px)}100%{opacity:1;transform:none}}

/* — Cláusulas contrapuestas — */
.fc-clauses{display:grid;gap:.45rem}
.fc-clauses p{
  margin:0;padding:.45rem .7rem .45rem .95rem;border-radius:0 var(--r-sm) var(--r-sm) 0;
  background:rgba(255,255,255,.11);border-left:3px solid rgba(255,255,255,.55);
  font-size:clamp(.92rem,.88rem + .3vw,1.04rem);font-weight:600;line-height:1.5;
  animation:fcRow .42s var(--e-out) backwards;
}
.fc-clauses p:nth-child(1){animation-delay:.36s}
.fc-clauses p:nth-child(2){animation-delay:.44s}
.fc-clauses p:nth-child(3){animation-delay:.52s}

/* — Negritas resaltadas en el reverso — */
.fc-back .fc-body b,.fc-back .fc-body strong{
  font-weight:800;background:rgba(255,255,255,.2);
  padding:.03em .3em;border-radius:5px;
  box-decoration-break:clone;-webkit-box-decoration-break:clone;
}

/* — Cita legal al pie — */
.fc-cite{
  position:absolute;bottom:.95rem;left:0;right:0;
  display:inline-flex;align-items:center;justify-content:center;gap:.4rem;
  font-family:var(--f-mono);font-size:.74rem;font-weight:700;letter-spacing:.02em;
  color:rgba(255,255,255,.82);
  animation:fcPopIn .5s var(--e-out) backwards;animation-delay:.5s;
}
.fc-cite::before,.fc-cite::after{
  content:"";height:1px;width:clamp(18px,10%,52px);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.45));
}
.fc-cite::after{background:linear-gradient(90deg,rgba(255,255,255,.45),transparent)}
.fc-cite .s{font-size:.9rem;opacity:.75;font-family:var(--f-legal)}
.fc-front .fc-cite{color:var(--ink-3)}
.fc-front .fc-cite::before{background:linear-gradient(90deg,transparent,var(--line-strong))}
.fc-front .fc-cite::after{background:linear-gradient(90deg,var(--line-strong),transparent)}

/* la pista se oculta si hay cita, para no amontonar */
.fc-back .fc-cite ~ .fc-hint,.fc-back .fc-hint.muted{display:none}

@media(max-width:620px){
  #flash{--fc-h:320px}
  .fc-face.struct{padding-top:2.9rem;padding-bottom:2.8rem}
  .fc-list li{padding-left:2.3rem}
}
@media(prefers-reduced-motion:reduce){
  .fc-verdict,.fc-list li,.fc-clauses p,.fc-cite{animation:none !important}
}

/* ═══ SEMÁFORO ═══ */
.sembtn{
  border-radius:var(--r-full);padding:.32rem .7rem;font-weight:700;font-size:var(--t-sm);
}
.sembtn[data-v="g"]:hover,.sembtn.on[data-v="g"]{background:var(--ok);color:#fff;border-color:var(--ok)}
.sembtn[data-v="y"]:hover,.sembtn.on[data-v="y"]{background:var(--mid);color:#3d2f00;border-color:var(--mid)}
.sembtn[data-v="r"]:hover,.sembtn.on[data-v="r"]{background:var(--exc);color:#fff;border-color:var(--exc)}

/* ═══ CTA DE BLOQUE ═══ */
a.blk{
  display:inline-flex;align-items:center;gap:.5rem;
  background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;
  padding:.5rem .95rem;border-radius:var(--r-sm);font-weight:700;font-size:var(--t-sm);
  text-decoration:none;box-shadow:0 2px 10px var(--brand-ring);
  transition:transform .22s var(--e-spring),box-shadow .25s,gap .25s var(--e-out);
}
a.blk:hover{transform:translateY(-2px);box-shadow:var(--sh-3);gap:.75rem;text-decoration:none}
a.blk::after{content:"→"}
a.blk:active{transform:translateY(0) scale(.98)}

/* ═══ REVEAL ═══ */
.rv{opacity:0;transform:translateY(20px);transition:opacity .6s var(--e-out),transform .6s var(--e-out)}
.rv.in{opacity:1;transform:none}

/* ═══ RESPONSIVE ═══ */
@media(max-width:960px){
  .layout{grid-template-columns:1fr;padding-top:.9rem;gap:1rem}
  nav.side{position:static;max-height:none}
  nav.side.collapsed .navbody{display:none}
  .navtoggle{display:block;width:100%;text-align:left;font-weight:700}
  .grid2{grid-template-columns:1fr}
  .top h1 .sub{white-space:normal}
}
@media(max-width:620px){
  .top-in{padding:.55rem .8rem}
  .tools{width:100%;margin-left:0}
  input[type=search]{flex:1;min-width:0}
  section.card{padding:1.05rem 1rem;border-radius:var(--r-md)}
  table{font-size:.82rem}
  th,td{padding:.4rem .5rem}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
  .rv{opacity:1;transform:none}
}
@media print{
  header.top,nav.side,.tools,.noprint,.progress{display:none !important}
  body{background:#fff;background-image:none;font-size:11pt;color:#000}
  .layout{display:block;max-width:none;padding:0}
  section.card{border:0;padding:0;margin:0 0 1rem;break-inside:avoid;box-shadow:none}
  details.panel{border:0;box-shadow:none}
  details.panel .body{display:block !important}
  details.panel>summary{padding-left:0}
  .art{break-inside:avoid}
  .rv{opacity:1;transform:none}
  a{color:#000;text-decoration:none}
}


/* ═══ ALTURA ADAPTATIVA DE LA TARJETA ═══ */
.fc-deck{transition:height .45s var(--fc-e)}
.fc-body{max-height:none;overflow:visible}
.fc-measure{
  position:absolute;left:0;right:0;top:0;height:auto;
  visibility:hidden;pointer-events:none;z-index:-1;
}
.fc-measure .fc-face{
  position:relative;inset:auto;height:auto;min-height:0;
  box-shadow:none;backface-visibility:visible;transform:none;
}
.fc-measure .fc-body{max-height:none;overflow:visible}
.fc-measure .fc-face::after{display:none}

/* ═══ MOSTRAR / OCULTAR ÍNDICE LATERAL ═══ */
.layout{transition:grid-template-columns .42s var(--e-out)}
.layout.nonav{grid-template-columns:0 1fr;gap:0}
.layout.nonav>nav.side{
  opacity:0;transform:translateX(-14px);pointer-events:none;
  padding:0;border-width:0;overflow:hidden;width:0;min-width:0;
}
nav.side{
  transition:opacity .3s var(--e-out),transform .38s var(--e-out);
  overflow-x:hidden;
}
#navhide .ic{display:inline-block;transition:transform .35s var(--e-spring);font-size:.95em;line-height:1}
#navhide[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
#navhide[aria-pressed="true"] .ic{transform:rotate(90deg)}
@media(max-width:960px){#navhide{display:none}}

/* ═══════════════════════════════════════════════════════════════
   LECTURA EN VOZ ALTA (TTS) del texto legal
   ═══════════════════════════════════════════════════════════════ */
.tts-bar{
  display:flex;align-items:center;gap:.45rem;flex-wrap:wrap;
  margin:.15rem 0 .7rem;
}
.tts-bar button{
  font-size:var(--t-xs);font-weight:700;padding:.3rem .62rem;
  border-radius:var(--r-full);border:1px solid var(--legal);
  background:transparent;color:var(--legal);
  display:inline-flex;align-items:center;gap:.35rem;line-height:1.2;
}
.tts-bar button:hover{background:var(--legal);color:var(--surface);border-color:var(--legal)}
.tts-bar button[hidden]{display:none}
.tts-bar .tts-play.on{background:var(--legal);color:var(--surface)}

/* Ondas de audio mientras lee */
.tts-wave{display:inline-flex;align-items:flex-end;gap:2px;height:11px}
.tts-wave i{
  width:2.5px;background:currentColor;border-radius:2px;height:35%;
  animation:ttsW .9s ease-in-out infinite;
}
.tts-wave i:nth-child(2){animation-delay:.15s}
.tts-wave i:nth-child(3){animation-delay:.3s}
.tts-wave i:nth-child(4){animation-delay:.45s}
@keyframes ttsW{0%,100%{height:32%}50%{height:100%}}

.tts-time{
  font-family:var(--f-mono);font-size:.7rem;font-weight:700;
  color:var(--ink-3);font-variant-numeric:tabular-nums;
}

/* Frase que se está leyendo */
.tts-s{transition:background .25s,color .25s;border-radius:3px}
.tts-s.now{
  background:linear-gradient(180deg,transparent 8%,color-mix(in srgb,var(--legal) 26%,transparent) 8%);
  box-shadow:0 0 0 2px color-mix(in srgb,var(--legal) 16%,transparent);
}
html[data-theme="dark"] .tts-s.now{
  background:linear-gradient(180deg,transparent 8%,color-mix(in srgb,var(--legal) 34%,transparent) 8%);
}
.legal.tts-on{box-shadow:0 0 0 3px color-mix(in srgb,var(--legal) 20%,transparent)}

/* ═══ Reproductor flotante ═══ */
.tts-mini{
  position:fixed;left:50%;bottom:1.1rem;transform:translateX(-50%) translateY(140%);
  z-index:80;display:flex;align-items:center;gap:.6rem;
  background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  border:1px solid var(--line);border-radius:var(--r-full);
  padding:.5rem .7rem .5rem .95rem;box-shadow:var(--sh-3);
  transition:transform .45s var(--e-spring),opacity .3s;opacity:0;pointer-events:none;
  max-width:min(94vw,540px);
}
.tts-mini.show{transform:translateX(-50%) translateY(0);opacity:1;pointer-events:auto}
.tts-mini .lbl{
  font-size:var(--t-xs);font-weight:800;color:var(--legal);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:16ch;
}
.tts-mini button{
  border-radius:50%;width:32px;height:32px;padding:0;display:grid;place-items:center;
  font-size:.8rem;border:1px solid var(--line);flex:none;
}
.tts-mini button.main{
  width:38px;height:38px;font-size:.95rem;
  background:linear-gradient(140deg,var(--legal),var(--brand));color:#fff;border-color:transparent;
}
.tts-mini .bar{
  flex:1;min-width:70px;height:5px;border-radius:99px;background:var(--surface-3);overflow:hidden;
}
.tts-mini .bar i{display:block;height:100%;width:0;background:var(--legal);
  border-radius:99px;transition:width .35s var(--e-out)}

/* ═══ Panel de ajustes de voz ═══ */
.tts-back{
  position:fixed;inset:0;z-index:90;background:rgba(10,10,18,.45);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  display:grid;place-items:center;padding:1rem;
  opacity:0;pointer-events:none;transition:opacity .3s var(--e-out);
}
.tts-back.show{opacity:1;pointer-events:auto}
.tts-panel{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--sh-3);width:min(94vw,470px);max-height:88vh;overflow:auto;
  padding:1.3rem 1.4rem;transform:translateY(16px) scale(.97);
  transition:transform .38s var(--e-spring);
}
.tts-back.show .tts-panel{transform:none}
.tts-panel h3{
  font-size:1.12rem;font-weight:800;margin:0 0 .25rem;
  display:flex;align-items:center;gap:.5rem;
}
.tts-panel .sub{font-size:var(--t-sm);color:var(--ink-2);margin:0 0 1.1rem}
.tts-row{margin-bottom:1.05rem}
.tts-row > label{
  display:block;font-size:var(--t-xs);font-weight:800;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-2);margin-bottom:.4rem;
}
.tts-seg{display:flex;gap:3px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:3px}
.tts-seg button{
  flex:1;border:0;background:transparent;border-radius:calc(var(--r-sm) - 3px);
  padding:.42rem .3rem;font-size:var(--t-sm);font-weight:700;box-shadow:none;
}
.tts-seg button:hover{transform:none;background:var(--surface)}
.tts-seg button[aria-pressed="true"]{
  background:linear-gradient(140deg,var(--legal),var(--brand));color:#fff;
}
.tts-panel select{
  width:100%;padding:.5rem .6rem;border-radius:var(--r-sm);
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  font-size:var(--t-sm);font-weight:600;cursor:pointer;
}
.tts-panel select:focus{border-color:var(--brand);outline:none}
.tts-slider{display:flex;align-items:center;gap:.75rem}
.tts-slider input[type=range]{flex:1;accent-color:var(--legal);cursor:pointer;height:22px}
.tts-val{
  font-family:var(--f-mono);font-weight:800;font-size:var(--t-sm);
  min-width:3.4em;text-align:right;color:var(--legal);font-variant-numeric:tabular-nums;
}
.tts-note{
  font-size:var(--t-xs);color:var(--ink-2);line-height:1.5;
  background:var(--surface-2);border-radius:var(--r-sm);padding:.6rem .75rem;margin:0 0 1rem;
}
.tts-note b{color:var(--ink)}
.tts-acts{display:flex;gap:.5rem;justify-content:flex-end;flex-wrap:wrap}
.tts-acts .prim{
  background:linear-gradient(140deg,var(--legal),var(--brand));color:#fff;border-color:transparent;
}
.tts-badge{
  font-size:.62rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
  padding:.1rem .35rem;border-radius:4px;background:var(--ej-bg);color:var(--ej);margin-left:.35rem;
}


/* — Variante compacta para los apartados desplegables — */
.tts-bar.mini{margin:0 0 .6rem}
.tts-bar.mini button{
  font-size:.7rem;padding:.24rem .55rem;
  border-color:var(--brand);color:var(--brand);
}
.tts-bar.mini button:hover{background:var(--brand);color:var(--surface)}
.tts-bar.mini .tts-play.on{background:var(--brand);color:var(--surface)}
.tts-bar.mini .tts-time{font-size:.66rem}
.idea .tts-bar.mini{margin:.55rem 0 0}
.legal.tts-on,.body.tts-on,.idea.tts-on{
  box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 20%,transparent)
}
.legal.tts-on{box-shadow:0 0 0 3px color-mix(in srgb,var(--legal) 20%,transparent)}


/* aviso de cambio de voz */
.tts-aviso{
  position:fixed;left:50%;bottom:5.2rem;transform:translateX(-50%) translateY(20px);
  z-index:95;max-width:min(92vw,460px);
  background:var(--warn-bg);border:1px solid var(--warn);color:var(--warn);
  border-radius:var(--r-md);padding:.6rem .9rem;font-size:var(--t-sm);font-weight:700;
  box-shadow:var(--sh-2);opacity:0;pointer-events:none;
  transition:opacity .3s var(--e-out),transform .35s var(--e-spring);
}
.tts-aviso.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:620px){
  .tts-mini{left:.6rem;right:.6rem;transform:translateY(140%);max-width:none}
  .tts-mini.show{transform:translateY(0)}
  .tts-mini .lbl{display:none}
}
@media(prefers-reduced-motion:reduce){
  .tts-wave i{animation:none;height:60%}
}
@media print{.tts-bar,.tts-mini,.tts-back{display:none !important}}

const GLOSARIO={"interesado": "Interesado: quien está legitimado para promover un procedimiento o intervenir en él porque es titular de derechos o intereses legítimos afectados por la decisión (art. 4 de la Ley 39/2015).", "conten": "Recurso contencioso-administrativo: impugnación ante los juzgados y tribunales de lo contencioso-administrativo, es decir, ya fuera de la propia Administración.", "silencio": "Silencio administrativo: efecto que la ley anuda a la falta de resolución expresa en plazo. Puede ser estimatorio (positivo) o desestimatorio (negativo) según el procedimiento.", "habil": "Días hábiles: se excluyen del cómputo los sábados, los domingos y los declarados festivos (art. 30.2 de la Ley 39/2015).", "pleno": "Pleno: órgano colegiado formado por todos los concejales o diputados de la entidad local.", "acto": "Acto administrativo: declaración de voluntad, juicio, deseo o conocimiento dictada por una Administración en ejercicio de una potestad administrativa distinta de la reglamentaria. Ej.: la resolución que concede una licencia de obra.", "competente": "Órgano competente: el que tiene atribuida por norma la potestad de dictar ese acto concreto. La competencia es irrenunciable (art. 8 de la Ley 40/2015).", "motivacion": "Motivación: expresión sucinta de los hechos y fundamentos de derecho en que se apoya el acto. No es un formalismo: permite al interesado defenderse y al juez controlar.", "discrecional": "Potestad discrecional: aquella en la que la ley deja a la Administración un margen de elección entre varias soluciones igualmente válidas. Su ejercicio siempre debe motivarse.", "reglada": "Potestad reglada: aquella en la que la norma predetermina por completo la respuesta; la Administración se limita a constatar los hechos y aplicar la consecuencia.", "inderogabilidad": "Inderogabilidad singular: un acto concreto no puede saltarse lo que dispone un reglamento, ni siquiera si lo dicta un órgano superior al que aprobó el reglamento.", "ejecutividad": "Ejecutividad: cualidad del acto administrativo de producir efectos y ser exigible por sí mismo, sin necesidad de que un juez lo confirme previamente.", "presuncion": "Presunción de validez: los actos administrativos se presumen válidos mientras no se declare lo contrario. La carga de impugnarlos recae sobre el particular.", "retroactividad": "Eficacia retroactiva: excepcionalmente, un acto puede desplegar efectos desde una fecha anterior a la de su emisión, en los dos casos tasados del art. 39.3.", "notificacion": "Notificación: comunicación individual del acto a los interesados. De ella depende, como regla, que el acto empiece a producir efectos frente a ellos.", "publicacion": "Publicación: difusión del acto en un diario oficial. Sustituye a la notificación en los casos del art. 45.1.", "deh": "Dirección electrónica habilitada única: buzón electrónico oficial en el que se ponen a disposición las notificaciones administrativas.", "pag": "Punto de Acceso General electrónico: portal único desde el que el ciudadano puede acceder a sus notificaciones y a los servicios de la Administración.", "viaadm": "Vía administrativa: el conjunto de trámites y recursos que se sustancian ante la propia Administración. Cuando se agota, queda abierta la vía judicial contencioso-administrativa.", "naturales": "Días naturales: se cuentan todos los días del calendario, incluidos sábados, domingos y festivos. El plazo de rechazo de la notificación electrónica se cuenta así.", "sede": "Sede electrónica: dirección electrónica de titularidad y responsabilidad de una Administración a través de la cual el ciudadano accede a sus servicios y notificaciones."};
const LABELS={"interesado": "Interesado", "conten": "Recurso contencioso-administrativo", "silencio": "Silencio administrativo", "habil": "Días hábiles", "pleno": "Pleno", "acto": "Acto administrativo", "competente": "Órgano competente", "motivacion": "Motivación", "discrecional": "Potestad discrecional", "reglada": "Potestad reglada", "inderogabilidad": "Inderogabilidad singular", "ejecutividad": "Ejecutividad", "presuncion": "Presunción de validez", "retroactividad": "Eficacia retroactiva", "notificacion": "Notificación", "publicacion": "Publicación", "deh": "Dirección electrónica habilitada", "pag": "Punto de Acceso General", "viaadm": "Vía administrativa", "naturales": "Días naturales", "sede": "Sede electrónica"};
</script>
<script>
const ARTS=[{"n": 34, "t": "Producción y contenido", "ubic": "Título III (De los actos administrativos) ▸ Capítulo I (Requisitos de los actos administrativos)", "idea": "El acto lo dicta el órgano competente, con el procedimiento debido y contenido lícito.", "literal": "<p>1. Los actos administrativos que dicten las Administraciones Públicas, bien de oficio o a instancia del interesado, se producirán por el órgano competente ajustándose a los requisitos y al procedimiento establecido.</p><p>2. El contenido de los actos se ajustará a lo dispuesto por el ordenamiento jurídico y será determinado y adecuado a los fines de aquéllos.</p>", "dis": "<ul>\n<li><b>34.1 — los tres requisitos de producción:</b> <b>órgano <span class=\"t\" data-k=\"competente\">competente</span></b> · ajustándose a los <b>requisitos</b> establecidos · siguiendo el <b>procedimiento</b> establecido. Da igual que se dicte <b>de oficio</b> o <b>a instancia del interesado</b>.</li>\n<li><b>34.2 — el contenido:</b> debe ajustarse al <b>ordenamiento jurídico</b> y ser <b>determinado</b> y <b>adecuado a los fines</b> del acto.</li>\n</ul>\n<table><thead><tr><th>Requisito</th><th>Qué exige</th><th>Si falla</th></tr></thead><tbody>\n<tr><td><b>Subjetivo</b></td><td>Órgano competente</td><td>Nulidad si es incompetencia manifiesta por materia o territorio (art. 47.1.b)</td></tr>\n<tr><td><b>Objetivo</b></td><td>Contenido lícito, determinado y adecuado al fin</td><td>Nulidad si es de contenido imposible o delictivo (art. 47.1.c y d)</td></tr>\n<tr><td><b>Formal</b></td><td>Procedimiento legalmente establecido</td><td>Nulidad si se prescinde total y absolutamente de él (art. 47.1.e)</td></tr>\n</tbody></table>", "llano": "<p>Un acto administrativo no vale solo porque diga cosas razonables. Tiene que dictarlo <b>quien puede</b>, <b>como debe</b> y <b>diciendo algo que se pueda hacer y que sirva al fin previsto</b>. Falla cualquiera de esas tres piezas y el acto es atacable.</p>", "porque": "<p>El artículo abre el Título III fijando el marco: la Administración no expresa voluntad libremente, como un particular, sino <b>en el ejercicio de una potestad atribuida por ley</b>. Por eso el precepto encadena competencia, procedimiento y contenido: son los tres puntos por donde el ordenamiento controla que el poder se ha usado para lo que se le dio.</p>\n<p>La exigencia de que el contenido sea <b>adecuado a los fines</b> es la puerta de entrada a la <b>desviación de poder</b>: usar una potestad para un fin distinto del previsto vicia el acto aunque formalmente todo esté correcto.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> una multa impuesta por el vigilante del aparcamiento privado no es una sanción de tráfico: no la ha dictado quien puede.</li>\n<li><b>Real:</b> el alcalde de un municipio concede una licencia de obra mayor; si las bases de ejecución y la LBRL atribuyen esa competencia a la Junta de Gobierno Local, el acto está viciado por incompetencia.</li>\n<li><b>Caso límite:</b> un ayuntamiento deniega una licencia de terraza motivándola en la protección del descanso vecinal, pero el expediente revela que la verdadera razón era penalizar al titular por una denuncia previa. Contenido formalmente correcto, <b>fin desviado</b>.</li>\n</ul>", "noej": "<ul>\n<li><b>No es</b> acto administrativo el contrato privado que celebra la Administración como cualquier particular (compraventa civil de un inmueble).</li>\n<li><b>No es</b> acto administrativo el reglamento: es una <b>disposición general</b>, con su propio régimen de impugnación (art. 112.3).</li>\n<li><b>No basta</b> con que el contenido sea lícito: además debe ser <b>determinado</b>. Una resolución que diga «se adoptarán las medidas oportunas» no lo es.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 47.1 LPAC:</b> los defectos de competencia, contenido y procedimiento como causas de nulidad.</li>\n<li><b>Art. 48 LPAC:</b> anulabilidad por cualquier otra infracción del ordenamiento, incluida la <b>desviación de poder</b>.</li>\n<li><b>Arts. 8 a 14 de la Ley 40/2015</b> (documento 2): competencia, delegación, avocación y encomienda.</li>\n<li><b>Art. 35 LPAC:</b> los actos discrecionales deben motivarse.</li>\n</ul>", "trampas": "<ul>\n<li>El artículo dice <b>«de oficio o a instancia del interesado»</b>: el modo de iniciación no altera los requisitos.</li>\n<li>El contenido debe ser <b>determinado</b> —no genérico— y <b>adecuado a los fines</b>, no solo legal.</li>\n<li>Aquí no se regula la forma: eso es el art. 36.</li>\n</ul>", "ancla": "<p><b>«Quién, cómo y qué.»</b> Órgano competente (quién) · procedimiento y requisitos (cómo) · contenido lícito, determinado y adecuado al fin (qué).</p>", "vis": "<svg viewBox=\"0 0 640 140\" role=\"img\" aria-label=\"Requisitos de producción del acto administrativo\">\n<g font-size=\"10\" text-anchor=\"middle\" fill=\"currentColor\">\n<rect x=\"25\" y=\"30\" width=\"175\" height=\"62\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"112\" y=\"53\" font-size=\"12\" font-weight=\"700\" fill=\"var(--acc)\">QUIÉN</text><text x=\"112\" y=\"72\">órgano competente</text><text x=\"112\" y=\"86\">de oficio o a instancia</text>\n<rect x=\"232\" y=\"30\" width=\"175\" height=\"62\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"320\" y=\"53\" font-size=\"12\" font-weight=\"700\" fill=\"var(--ej)\">CÓMO</text><text x=\"320\" y=\"72\">requisitos y</text><text x=\"320\" y=\"86\">procedimiento establecidos</text>\n<rect x=\"439\" y=\"30\" width=\"176\" height=\"62\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"527\" y=\"53\" font-size=\"12\" font-weight=\"700\" fill=\"var(--warn)\">QUÉ</text><text x=\"527\" y=\"72\">contenido conforme a Derecho,</text><text x=\"527\" y=\"86\">determinado y adecuado al fin</text>\n</g>\n<text x=\"320\" y=\"122\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--exc)\">Falla uno y el acto es nulo (art. 47) o anulable (art. 48)</text>\n</svg>"}, {"n": 35, "t": "Motivación", "ubic": "Título III (De los actos administrativos) ▸ Capítulo I (Requisitos de los actos administrativos)", "idea": "Nueve supuestos en los que la Administración está obligada a explicar por qué decide.", "literal": "<p>1. Serán motivados, con sucinta referencia de hechos y fundamentos de derecho:</p><p>a) Los actos que limiten derechos subjetivos o intereses legítimos.</p><p>b) Los actos que resuelvan procedimientos de revisión de oficio de disposiciones o actos administrativos, recursos administrativos y procedimientos de arbitraje y los que declaren su inadmisión.</p><p>c) Los actos que se separen del criterio seguido en actuaciones precedentes o del dictamen de órganos consultivos.</p><p>d) Los acuerdos de suspensión de actos, cualquiera que sea el motivo de ésta, así como la adopción de medidas provisionales previstas en el artículo 56.</p><p>e) Los acuerdos de aplicación de la tramitación de urgencia, de ampliación de plazos y de realización de actuaciones complementarias.</p><p>f) Los actos que rechacen pruebas propuestas por los interesados.</p><p>g) Los actos que acuerden la terminación del procedimiento por la imposibilidad material de continuarlo por causas sobrevenidas, así como los que acuerden el desistimiento por la Administración en procedimientos iniciados de oficio.</p><p>h) Las propuestas de resolución en los procedimientos de carácter sancionador, así como los actos que resuelvan procedimientos de carácter sancionador o de responsabilidad patrimonial.</p><p>i) Los actos que se dicten en el ejercicio de potestades discrecionales, así como los que deban serlo en virtud de disposición legal o reglamentaria expresa.</p><p>2. La motivación de los actos que pongan fin a los procedimientos selectivos y de concurrencia competitiva se realizará de conformidad con lo que dispongan las normas que regulen sus convocatorias, debiendo, en todo caso, quedar acreditados en el procedimiento los fundamentos de la resolución que se adopte.</p>", "dis": "<p><b>35.1 — se motivan, con sucinta referencia de hechos y fundamentos de derecho:</b></p>\n<table><thead><tr><th>Letra</th><th>Actos que deben motivarse</th></tr></thead><tbody>\n<tr><td><b>a)</b></td><td>Los que <b>limiten derechos subjetivos o intereses legítimos</b></td></tr>\n<tr><td><b>b)</b></td><td>Los que resuelvan <b>revisión de oficio</b>, <b>recursos administrativos</b> y <b>arbitraje</b>, y los que declaren su <b>inadmisión</b></td></tr>\n<tr><td><b>c)</b></td><td>Los que se <b>separen del criterio</b> seguido en actuaciones precedentes <b>o del dictamen</b> de órganos consultivos</td></tr>\n<tr><td><b>d)</b></td><td>Los acuerdos de <b>suspensión</b> de actos y la adopción de <b>medidas provisionales</b> del art. 56</td></tr>\n<tr><td><b>e)</b></td><td>Los acuerdos de <b>tramitación de urgencia</b>, <b>ampliación de plazos</b> y <b>actuaciones complementarias</b></td></tr>\n<tr><td><b>f)</b></td><td>Los que <b>rechacen pruebas</b> propuestas por los interesados</td></tr>\n<tr><td><b>g)</b></td><td>Los que acuerden la <b>terminación por imposibilidad material</b> sobrevenida y el <b>desistimiento de la Administración</b> en procedimientos de oficio</td></tr>\n<tr><td><b>h)</b></td><td>Las <b>propuestas de resolución</b> en procedimientos sancionadores y los actos que resuelvan procedimientos <b>sancionadores o de responsabilidad patrimonial</b></td></tr>\n<tr><td><b>i)</b></td><td>Los dictados en ejercicio de <b><span class=\"t\" data-k=\"discrecional\">potestades discrecionales</span></b> y aquellos en que lo exija una disposición legal o reglamentaria expresa</td></tr>\n</tbody></table>\n<p><b>35.2 — procedimientos selectivos y de concurrencia competitiva:</b> la motivación se realiza conforme a lo que dispongan las normas de sus <b>convocatorias</b>, debiendo en todo caso quedar <b>acreditados en el procedimiento</b> los fundamentos de la resolución.</p>", "llano": "<p>Cuando una decisión te perjudica, resuelve un recurso, se aparta de lo que se venía haciendo o se toma con margen de apreciación, la Administración tiene que decirte <b>por qué</b>. No hace falta un tratado: basta una referencia sucinta a los hechos y al Derecho aplicado, pero tiene que existir.</p>", "porque": "<p>La motivación cumple tres funciones a la vez: permite al interesado <b>defenderse</b> —solo se puede rebatir lo que se conoce—, obliga a la Administración a <b>pensar antes de decidir</b> y hace posible el <b>control judicial</b> posterior. Sin motivación, la discrecionalidad se convertiría en arbitrariedad, que la Constitución prohíbe.</p>\n<p>Fíjate en la letra c): apartarse del <b>precedente</b> no está prohibido, pero exige explicación. Es la garantía de que la Administración trata igual lo igual.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> un profesor puede suspender un examen, pero si el alumno lo reclama debe explicar en qué ha fallado.</li>\n<li><b>Real:</b> un ayuntamiento deniega una subvención de 4.000 € a una asociación vecinal. Es un acto que limita intereses legítimos: <b>letra a)</b>, debe motivarse.</li>\n<li><b>Caso límite:</b> un tribunal de oposición aparta a un aspirante del proceso pese al informe favorable del servicio jurídico. Como se separa del <b>dictamen</b>, entra en la <b>letra c)</b>, con independencia de las reglas del art. 35.2 sobre concurrencia.</li>\n</ul>", "noej": "<ul>\n<li><b>No exige</b> motivación el acto plenamente favorable que no se aparta del precedente ni ejerce discrecionalidad: la concesión sin más de una licencia reglada.</li>\n<li><b>No es</b> motivación la mera cita de preceptos sin conectar con los hechos del caso.</li>\n<li><b>No basta</b> con motivar de palabra: el art. 35.2 exige que los fundamentos queden <b>acreditados en el procedimiento</b>.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 48.2 LPAC:</b> el defecto de forma solo invalida si impide alcanzar el fin o <b>causa indefensión</b>; la falta de motivación suele producirla.</li>\n<li><b>Art. 56 LPAC:</b> medidas provisionales, expresamente citadas en la letra d).</li>\n<li><b>Art. 88.6 LPAC:</b> la resolución de procedimientos iniciados a solicitud debe ser congruente.</li>\n<li><b>Art. 9.3 de la Constitución</b> <i>(norma externa a la biblioteca)</i>: interdicción de la arbitrariedad de los poderes públicos.</li>\n</ul>", "trampas": "<ul>\n<li>La motivación es <b>sucinta</b>: la ley no exige extensión, exige razones.</li>\n<li>La letra b) incluye también los actos que declaran la <b>inadmisión</b> de recursos y revisiones.</li>\n<li>En la letra h) se motivan <b>también las propuestas de resolución</b> sancionadoras, no solo la resolución final.</li>\n<li>Todo acto <b>discrecional</b> se motiva; el <b>reglado</b>, solo si encaja en otra letra.</li>\n</ul>", "ancla": "<p><b>«Si te quito, si resuelvo, si me aparto, si suspendo, si acelero, si rechazo prueba, si cierro, si sanciono o si elijo → explico.»</b> Son las nueve letras en orden.</p>", "vis": "<svg viewBox=\"0 0 640 165\" role=\"img\" aria-label=\"Supuestos de motivación obligatoria\">\n<rect x=\"200\" y=\"8\" width=\"240\" height=\"30\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/>\n<text x=\"320\" y=\"28\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">ACTOS QUE SE MOTIVAN</text>\n<g font-size=\"10\" text-anchor=\"middle\" fill=\"currentColor\">\n<rect x=\"20\" y=\"52\" width=\"145\" height=\"60\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"92\" y=\"73\" font-weight=\"700\" fill=\"var(--exc)\">Perjudican</text><text x=\"92\" y=\"90\">a) limitan derechos</text><text x=\"92\" y=\"104\">h) sancionan</text>\n<rect x=\"175\" y=\"52\" width=\"145\" height=\"60\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"247\" y=\"73\" font-weight=\"700\" fill=\"var(--acc)\">Deciden sobre</text><text x=\"247\" y=\"90\">b) recursos y revisión</text><text x=\"247\" y=\"104\">f) rechazo de pruebas</text>\n<rect x=\"330\" y=\"52\" width=\"145\" height=\"60\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"402\" y=\"73\" font-weight=\"700\" fill=\"var(--warn)\">Se apartan</text><text x=\"402\" y=\"90\">c) del precedente</text><text x=\"402\" y=\"104\">c) del dictamen</text>\n<rect x=\"485\" y=\"52\" width=\"135\" height=\"60\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"552\" y=\"73\" font-weight=\"700\" fill=\"var(--ej)\">Alteran el curso</text><text x=\"552\" y=\"90\">d) suspensión · e) urgencia</text><text x=\"552\" y=\"104\">g) terminación anómala</text>\n</g>\n<text x=\"320\" y=\"140\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--acc)\" font-weight=\"700\">i) Y SIEMPRE los actos discrecionales</text>\n<text x=\"320\" y=\"157\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--ink2)\">35.2 · en procesos selectivos y de concurrencia, según sus convocatorias</text>\n</svg>"}, {"n": 36, "t": "Forma", "ubic": "Título III (De los actos administrativos) ▸ Capítulo I (Requisitos de los actos administrativos)", "idea": "Regla general: por escrito y por medios electrónicos; salvo excepciones tasadas.", "literal": "<p>1. Los actos administrativos se producirán por escrito a través de medios electrónicos, a menos que su naturaleza exija otra forma más adecuada de expresión y constancia.</p><p>2. En los casos en que los órganos administrativos ejerzan su competencia de forma verbal, la constancia escrita del acto, cuando sea necesaria, se efectuará y firmará por el titular del órgano inferior o funcionario que la reciba oralmente, expresando en la comunicación del mismo la autoridad de la que procede. Si se tratara de resoluciones, el titular de la competencia deberá autorizar una relación de las que haya dictado de forma verbal, con expresión de su contenido.</p><p>3. Cuando deba dictarse una serie de actos administrativos de la misma naturaleza, tales como nombramientos, concesiones o licencias, podrán refundirse en un único acto, acordado por el órgano competente, que especificará las personas u otras circunstancias que individualicen los efectos del acto para cada interesado.</p>", "dis": "<ul>\n<li><b>36.1 — forma ordinaria:</b> los actos se producen <b>por escrito a través de medios electrónicos</b>, salvo que su <b>naturaleza</b> exija otra forma más adecuada de expresión y constancia.</li>\n<li><b>36.2 — actos verbales:</b> si el órgano ejerce su competencia <b>de forma verbal</b>, la constancia escrita, cuando sea necesaria, la efectúa y firma el <b>titular del órgano inferior o el funcionario que la recibe oralmente</b>, expresando la autoridad de la que procede.</li>\n<li><b>36.3 — actos en serie:</b> cuando deban dictarse varios actos <b>de la misma naturaleza</b> —nombramientos, concesiones, licencias— pueden <b>refundirse en un único acto</b>, que especificará las personas o circunstancias que individualicen sus efectos.</li>\n</ul>", "llano": "<p>Lo normal es que el acto sea un documento electrónico. Cabe la orden verbal —piensa en el mando de la policía local—, pero si hace falta dejarla por escrito, la escribe y firma <b>quien la recibe</b>, diciendo de quién viene. Y si hay que dictar cien actos iguales, se pueden agrupar en uno solo.</p>", "porque": "<p>La forma escrita y electrónica es hoy la regla porque garantiza <b>constancia, autenticidad e integridad</b>, y porque el art. 3.2 de la Ley 40/2015 impone a las Administraciones relacionarse por medios electrónicos. La excepción del acto verbal responde a la <b>inmediatez</b>: hay decisiones que no pueden esperar a un documento. Y la refundición del apartado 3 es puro principio de <b>eficiencia</b>: evita multiplicar resoluciones idénticas.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> el árbitro señala una falta con el silbato; el acta se redacta después.</li>\n<li><b>Real:</b> el jefe de la policía local ordena verbalmente el corte de una calle por un derrumbe; el agente que la recibe deja constancia escrita expresando de qué autoridad procede.</li>\n<li><b>Caso límite:</b> un ayuntamiento resuelve en un único acuerdo la concesión de 180 licencias de vado, con un anexo que identifica a cada titular y su número de placa: art. 36.3 correctamente aplicado.</li>\n</ul>", "noej": "<ul>\n<li><b>No cabe</b> refundir actos de <b>distinta naturaleza</b>: la ley exige que sean de la misma.</li>\n<li><b>No es</b> el acto verbal la regla general, sino la excepción.</li>\n<li><b>No sustituye</b> la constancia escrita del art. 36.2 a la notificación: son cosas distintas.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 26 LPAC:</b> emisión de documentos por las Administraciones Públicas.</li>\n<li><b>Art. 3.2 de la Ley 40/2015</b> (documento 2): las Administraciones se relacionan entre sí y con sus órganos por medios electrónicos.</li>\n<li><b>RD 203/2021</b> (documento 4): documento y expediente electrónicos.</li>\n</ul>", "trampas": "<ul>\n<li>La fórmula legal es <b>«por escrito a través de medios electrónicos»</b>: no basta con «por escrito».</li>\n<li>En el acto verbal, firma <b>quien lo recibe</b>, no quien lo ordena.</li>\n<li>La refundición exige actos de <b>la misma naturaleza</b> y que el acto único <b>individualice</b> los efectos.</li>\n</ul>", "ancla": "<p><b>«Escrito y electrónico por regla; verbal por excepción, y lo firma quien lo oye; e iguales, todos en uno.»</b></p>", "vis": "<svg viewBox=\"0 0 640 130\" role=\"img\" aria-label=\"Forma de los actos administrativos\">\n<g font-size=\"10\" text-anchor=\"middle\" fill=\"currentColor\">\n<rect x=\"25\" y=\"28\" width=\"175\" height=\"64\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"112\" y=\"50\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">36.1 · Regla</text><text x=\"112\" y=\"69\">escrito por medios</text><text x=\"112\" y=\"83\">electrónicos</text>\n<rect x=\"232\" y=\"28\" width=\"175\" height=\"64\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"320\" y=\"50\" font-size=\"11\" font-weight=\"700\" fill=\"var(--warn)\">36.2 · Verbal</text><text x=\"320\" y=\"69\">constancia escrita por</text><text x=\"320\" y=\"83\">quien la recibe</text>\n<rect x=\"439\" y=\"28\" width=\"176\" height=\"64\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"527\" y=\"50\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">36.3 · En serie</text><text x=\"527\" y=\"69\">actos de la misma naturaleza</text><text x=\"527\" y=\"83\">refundidos en uno</text>\n</g>\n<text x=\"320\" y=\"118\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--ink2)\">Excepción a la regla: cuando la naturaleza del acto exija otra forma más adecuada</text>\n</svg>"}, {"n": 37, "t": "Inderogabilidad singular", "ubic": "Título III (De los actos administrativos) ▸ Capítulo I (Requisitos de los actos administrativos)", "idea": "Un acto singular no puede saltarse un reglamento, aunque venga de arriba.", "literal": "<p>1. Las resoluciones administrativas de carácter particular no podrán vulnerar lo establecido en una disposición de carácter general, aunque aquéllas procedan de un órgano de igual o superior jerarquía al que dictó la disposición general.</p><p>2. Son nulas las resoluciones administrativas que vulneren lo establecido en una disposición reglamentaria, así como aquellas que incurran en alguna de las causas recogidas en el artículo 47.</p>", "dis": "<ul>\n<li><b>37.1 — la regla:</b> las resoluciones administrativas de <b>carácter particular</b> no pueden vulnerar lo establecido en una <b>disposición de carácter general</b>, <b>aunque procedan de un órgano de igual o superior jerarquía</b> al que dictó la disposición.</li>\n<li><b>37.2 — la sanción:</b> son <b>nulas</b> las resoluciones que vulneren lo establecido en una disposición reglamentaria, así como las que incurran en alguna de las causas del <b>art. 47</b>.</li>\n</ul>\n<div class=\"box warn\"><span class=\"lbl\">Aquí está el matiz que se pregunta</span>El alcalde no puede dispensar a un vecino del cumplimiento de una ordenanza aprobada por el Pleno, pero <b>tampoco el propio Pleno</b> puede hacerlo mediante un acuerdo singular: si quiere cambiar la regla, debe <b>modificar la ordenanza</b>.</div>", "llano": "<p>La norma general manda sobre la decisión concreta, y no vale el argumento de que quien decide es el jefe. Si el reglamento dice una cosa, el acto singular no puede decir otra: primero se cambia el reglamento, después se decide.</p>", "porque": "<p>Es la traducción del <b>principio de legalidad</b> al día a día: la Administración queda vinculada por sus propias normas. Si un órgano pudiera excepcionar el reglamento caso por caso, la norma dejaría de ser norma y se convertiría en una orientación, abriendo la puerta al <b>privilegio</b> y a la desigualdad de trato.</p>\n<p>La consecuencia es la más severa posible: <b>nulidad de pleno derecho</b>, no simple anulabilidad.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> el reglamento de la comunidad prohíbe tender en la fachada; el presidente no puede autorizarlo a un vecino concreto.</li>\n<li><b>Real:</b> la ordenanza municipal de terrazas fija un máximo de seis mesas; una resolución del alcalde que autorice diez a un bar es <b>nula</b> (art. 37.2).</li>\n<li><b>Caso límite:</b> el Pleno, órgano que aprobó la ordenanza, adopta un acuerdo singular autorizando esas diez mesas. Sigue siendo nulo: el art. 37.1 alcanza también al órgano de <b>igual o superior jerarquía</b>.</li>\n</ul>", "noej": "<ul>\n<li><b>No vulnera</b> el precepto la <b>modificación</b> de la ordenanza por el procedimiento previsto: ahí se cambia la norma, no se la excepciona.</li>\n<li><b>No se aplica</b> a las dispensas que la propia norma general contempla y regula.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 47.2 LPAC:</b> nulidad de las disposiciones administrativas que vulneren normas de rango superior.</li>\n<li><b>Art. 128.3 de la Ley 40/2015</b> (documento 2): las disposiciones administrativas no pueden vulnerar la Constitución, las leyes ni otras de rango superior.</li>\n<li><b>Art. 106 LPAC:</b> revisión de oficio de los actos nulos.</li>\n</ul>", "trampas": "<ul>\n<li>La clave está en <b>«aunque procedan de un órgano de igual o superior jerarquía»</b>.</li>\n<li>La consecuencia es la <b>nulidad</b>, no la anulabilidad.</li>\n<li>El art. 37.2 remite además a <b>todas</b> las causas del art. 47.</li>\n</ul>", "ancla": "<p><b>«El reglamento manda sobre el acto, aunque el acto lo firme el jefe.»</b> Y el que lo incumple nace <b>nulo</b>.</p>", "vis": "<svg viewBox=\"0 0 640 140\" role=\"img\" aria-label=\"Inderogabilidad singular de los reglamentos\">\n<defs><marker id=\"i1\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\"><path d=\"M0 0 L9 4.5 L0 9 z\" fill=\"var(--exc)\"/></marker></defs>\n<rect x=\"170\" y=\"16\" width=\"300\" height=\"36\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/>\n<text x=\"320\" y=\"39\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"var(--acc)\">DISPOSICIÓN GENERAL (reglamento)</text>\n<rect x=\"170\" y=\"88\" width=\"300\" height=\"36\" rx=\"8\" fill=\"var(--panel)\" stroke=\"var(--line)\"/>\n<text x=\"320\" y=\"111\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\">RESOLUCIÓN PARTICULAR</text>\n<path d=\"M320 88 L 320 56\" stroke=\"var(--exc)\" stroke-width=\"2.5\" marker-end=\"url(#i1)\" stroke-dasharray=\"6 4\"/>\n<text x=\"470\" y=\"76\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--exc)\">NO puede vulnerarla</text>\n<text x=\"120\" y=\"76\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--ink2)\">ni el órgano superior</text>\n<text x=\"320\" y=\"136\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--exc)\">Si la vulnera: NULIDAD de pleno derecho (art. 37.2)</text>\n</svg>"}];
</script>
<script>
ARTS.push.apply(ARTS,[{"n": 38, "t": "Ejecutividad", "ubic": "Título III (De los actos administrativos) ▸ Capítulo II (Eficacia de los actos)", "idea": "Los actos administrativos son ejecutivos por sí mismos con arreglo a esta ley.", "literal": "<p>Los actos de las Administraciones Públicas sujetos al Derecho Administrativo serán ejecutivos con arreglo a lo dispuesto en esta Ley.</p>", "dis": "<ul>\n<li><b>Regla:</b> los actos de las Administraciones Públicas <b>sujetos al Derecho Administrativo</b> serán <b><span class=\"t\" data-k=\"ejecutividad\">ejecutivos</span></b> con arreglo a lo dispuesto en esta ley.</li>\n<li><b>Alcance:</b> el acto es exigible <b>sin necesidad de acudir previamente a un juez</b>, a diferencia de lo que ocurre entre particulares. Es el llamado privilegio de <b>autotutela</b>.</li>\n<li><b>Límite:</b> «con arreglo a lo dispuesto en esta ley» remite a los arts. 97 a 105 —ejecución forzosa— y al art. 98, que fija cuándo el acto es <b>inmediatamente ejecutivo</b>.</li>\n</ul>", "llano": "<p>Si la Administración te ordena algo, la orden vale desde ya y ella misma puede hacerla cumplir. Un particular que quiere cobrarte necesita una sentencia; la Administración, no. Ese es su privilegio, y por eso está sometido a límites estrictos.</p>", "porque": "<p>La ejecutividad existe porque los actos administrativos persiguen el <b>interés general</b> y no pueden quedar paralizados por la simple resistencia del destinatario. Si cualquier recurso suspendiera automáticamente el acto, bastaría recurrir para no cumplir nunca. El contrapeso está en el art. 117: la <b>suspensión cautelar</b> cuando la ejecución cause perjuicios de imposible reparación o el acto incurra en causa de nulidad.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> el revisor del tren puede hacerte bajar sin pedir permiso a un juez.</li>\n<li><b>Real:</b> una orden de ejecución de obras de conservación de un edificio es exigible desde su notificación; si no se cumple, el ayuntamiento puede acudir a la <b>ejecución subsidiaria</b> (art. 102).</li>\n<li><b>Caso límite:</b> el interesado recurre en alzada y pide la suspensión: hasta que se resuelva la petición —y en los términos del art. 117— el acto <b>sigue siendo ejecutivo</b>.</li>\n</ul>", "noej": "<ul>\n<li><b>No son</b> ejecutivos por esta vía los actos de la Administración sujetos al <b>Derecho privado</b>.</li>\n<li><b>No es</b> ejecutividad lo mismo que <b>ejecución forzosa</b>: la primera es la cualidad del acto; la segunda, los medios de los arts. 100 a 105.</li>\n<li><b>No cabe</b> ejecutar cuando la ley o una resolución judicial o administrativa acuerdan la <b>suspensión</b> (art. 98.1).</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 39 LPAC:</b> presunción de validez y eficacia desde la fecha en que se dicten.</li>\n<li><b>Art. 98 LPAC:</b> ejecutoriedad y supuestos en que el acto no es inmediatamente ejecutivo.</li>\n<li><b>Arts. 99 a 105 LPAC:</b> ejecución forzosa y sus medios.</li>\n<li><b>Art. 117 LPAC:</b> suspensión de la ejecución al interponer un recurso.</li>\n</ul>", "trampas": "<ul>\n<li>Solo alcanza a los actos <b>sujetos al Derecho Administrativo</b>.</li>\n<li>La <b>interposición de un recurso no suspende</b> por sí sola (art. 117.1).</li>\n<li>Ejecutividad (art. 38) ≠ ejecutoriedad (art. 98) ≠ ejecución forzosa (arts. 99 y ss.).</li>\n</ul>", "ancla": "<p><b>«Vale ya y lo hago cumplir yo.»</b> Autotutela declarativa y ejecutiva en un solo artículo.</p>", "vis": "<svg viewBox=\"0 0 640 120\" role=\"img\" aria-label=\"Ejecutividad del acto administrativo\">\n<defs><marker id=\"e1\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\"><path d=\"M0 0 L9 4.5 L0 9 z\" fill=\"var(--acc)\"/></marker></defs>\n<rect x=\"20\" y=\"35\" width=\"165\" height=\"50\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/>\n<text x=\"102\" y=\"65\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">Acto administrativo</text>\n<path d=\"M188 60 L 228 60\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#e1)\"/>\n<rect x=\"232\" y=\"35\" width=\"165\" height=\"50\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/>\n<text x=\"314\" y=\"58\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">Ejecutivo</text>\n<text x=\"314\" y=\"76\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">sin juez previo</text>\n<path d=\"M400 60 L 440 60\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#e1)\"/>\n<rect x=\"444\" y=\"35\" width=\"176\" height=\"50\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/>\n<text x=\"532\" y=\"58\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--warn)\">Ejecución forzosa</text>\n<text x=\"532\" y=\"76\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">arts. 99 a 105</text>\n<text x=\"320\" y=\"108\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--exc)\">Salvo suspensión legal, judicial o administrativa (arts. 98.1 y 117)</text>\n</svg>"}, {"n": 39, "t": "Efectos", "ubic": "Título III (De los actos administrativos) ▸ Capítulo II (Eficacia de los actos)", "idea": "Se presumen válidos y surten efecto desde que se dictan, salvo demora o retroactividad.", "literal": "<p>1. Los actos de las Administraciones Públicas sujetos al Derecho Administrativo se presumirán válidos y producirán efectos desde la fecha en que se dicten, salvo que en ellos se disponga otra cosa.</p><p>2. La eficacia quedará demorada cuando así lo exija el contenido del acto o esté supeditada a su notificación, publicación o aprobación superior.</p><p>3. Excepcionalmente, podrá otorgarse eficacia retroactiva a los actos cuando se dicten en sustitución de actos anulados, así como cuando produzcan efectos favorables al interesado, siempre que los supuestos de hecho necesarios existieran ya en la fecha a que se retrotraiga la eficacia del acto y ésta no lesione derechos o intereses legítimos de otras personas.</p><p>4. Las normas y actos dictados por los órganos de las Administraciones Públicas en el ejercicio de su propia competencia deberán ser observadas por el resto de los órganos administrativos, aunque no dependan jerárquicamente entre sí o pertenezcan a otra Administración.</p><p>5. Cuando una Administración Pública tenga que dictar, en el ámbito de sus competencias, un acto que necesariamente tenga por base otro dictado por una Administración Pública distinta y aquélla entienda que es ilegal, podrá requerir a ésta previamente para que anule o revise el acto de acuerdo con lo dispuesto en el artículo 44 de la Ley 29/1998, de 13 de julio, reguladora de la Jurisdicción Contencioso- Administrativa, y, de rechazar el requerimiento, podrá interponer recurso contencioso-administrativo. En estos casos, quedará suspendido el procedimiento para dictar resolución.</p>", "dis": "<ul>\n<li><b>39.1 — <span class=\"t\" data-k=\"presuncion\">presunción de validez</span>:</b> los actos se presumen válidos y producen efectos <b>desde la fecha en que se dicten</b>, salvo que en ellos se disponga otra cosa.</li>\n<li><b>39.2 — eficacia demorada:</b> queda demorada cuando lo exija el <b>contenido</b> del acto o esté supeditada a su <b>notificación</b>, <b>publicación</b> o <b>aprobación superior</b>.</li>\n<li><b>39.3 — <span class=\"t\" data-k=\"retroactividad\">eficacia retroactiva</span>, excepcional y en dos casos:</b> cuando se dicten <b>en sustitución de actos anulados</b>; y cuando produzcan <b>efectos favorables</b> al interesado, siempre que los <b>supuestos de hecho</b> ya existieran en la fecha a la que se retrotraiga y no se lesionen derechos o intereses legítimos de otras personas.</li>\n<li><b>39.4 — eficacia interadministrativa:</b> las normas y actos dictados en el ejercicio de la propia competencia deben ser <b>observados por el resto de órganos</b>, aunque no dependan jerárquicamente ni pertenezcan a la misma Administración.</li>\n<li><b>39.5 — acto ilegal de otra Administra

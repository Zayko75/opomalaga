rcero imparcial.</li>\n<li><b>Real:</b> un ayuntamiento detecta en 2026 que una licencia de 2021, ya firme, se otorgó a quien carecía de un requisito esencial (art. 47.1.f). Puede iniciar la revisión de oficio, pidiendo dictamen al <b>Consejo Consultivo de Andalucía</b>.</li>\n<li><b>Caso límite:</b> un particular solicita la revisión alegando simplemente que la resolución le parece injusta. Cabe <b>inadmitir motivadamente sin dictamen</b> (art. 106.3).</li>\n</ul>", "noej": "<ul>\n<li><b>No sirve</b> esta vía para actos meramente <b>anulables</b>: para esos está la <b>lesividad</b> (art. 107) o la <b>revocación</b> (art. 109).</li>\n<li><b>No cabe</b> declarar la nulidad con dictamen <b>desfavorable</b>.</li>\n<li><b>No procede</b> cuando resulte contraria a la equidad, la buena fe o el derecho de los particulares (art. 110).</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 47.1 y 47.2 LPAC:</b> las causas de nulidad revisables.</li>\n<li><b>Art. 110 LPAC:</b> límites al ejercicio de la revisión.</li>\n<li><b>Art. 112.1 LPAC:</b> alternativa ordinaria: los recursos, dentro de plazo.</li>\n<li><b>Arts. 32.2 y 34.1 de la Ley 40/2015</b> (documento 2): responsabilidad patrimonial e indemnizaciones del art. 106.4.</li>\n</ul>", "trampas": "<ul>\n<li><b>En cualquier momento</b>: no hay plazo de caducidad para iniciarla.</li>\n<li>El dictamen debe ser <b>favorable</b>, no simplemente preceptivo.</li>\n<li>Iniciada <b>de oficio</b> → <b>caducidad</b> a los seis meses. A <b>solicitud</b> → <b>silencio desestimatorio</b>. No confundas los dos efectos.</li>\n<li>Solo alcanza a actos que <b>pusieron fin a la vía administrativa</b> o <b>no fueron recurridos en plazo</b>.</li>\n</ul>", "ancla": "<p><b>«Sin plazo, pero con permiso.»</b> Nulidad + dictamen favorable. Y seis meses: <b>de oficio caduca, a instancia se desestima</b>.</p>", "vis": "<svg viewBox=\"0 0 660 165\" role=\"img\" aria-label=\"Revisión de oficio de actos nulos\">\n<defs><marker id=\"r1\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\"><path d=\"M0 0 L9 4.5 L0 9 z\" fill=\"var(--acc)\"/></marker></defs>\n<rect x=\"20\" y=\"30\" width=\"160\" height=\"54\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/>\n<text x=\"100\" y=\"52\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--exc)\">Acto NULO</text>\n<text x=\"100\" y=\"70\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">firme o no recurrido</text>\n<path d=\"M183 57 L 218 57\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#r1)\"/>\n<rect x=\"222\" y=\"30\" width=\"185\" height=\"54\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/>\n<text x=\"314\" y=\"52\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">Revisión de oficio</text>\n<text x=\"314\" y=\"70\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">en cualquier momento</text>\n<path d=\"M410 57 L 445 57\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#r1)\"/>\n<rect x=\"449\" y=\"30\" width=\"190\" height=\"54\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/>\n<text x=\"544\" y=\"52\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">Dictamen FAVORABLE</text>\n<text x=\"544\" y=\"70\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">Consejo Consultivo</text>\n<rect x=\"80\" y=\"103\" width=\"230\" height=\"42\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/>\n<text x=\"195\" y=\"120\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"var(--warn)\">Iniciada DE OFICIO</text>\n<text x=\"195\" y=\"136\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">6 meses sin resolver: CADUCIDAD</text>\n<rect x=\"350\" y=\"103\" width=\"230\" height=\"42\" rx=\"8\" fill=\"var(--panel)\" stroke=\"var(--line)\"/>\n<text x=\"465\" y=\"120\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\">Iniciada A SOLICITUD</text>\n<text x=\"465\" y=\"136\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">6 meses: silencio DESESTIMATORIO</text>\n</svg>"}, {"n": 107, "t": "Declaración de lesividad de actos anulables", "ubic": "Título V (De la revisión de los actos en vía administrativa) ▸ Capítulo I (Revisión de oficio)", "idea": "Para anular sus actos favorables, la Administración debe ir al juez: cuatro años.", "literal": "<p>1. Las Administraciones Públicas podrán impugnar ante el orden jurisdiccional contencioso-administrativo los actos favorables para los interesados que sean anulables conforme a lo dispuesto en el artículo 48, previa su declaración de lesividad para el interés público.</p><p>2. La declaración de lesividad no podrá adoptarse una vez transcurridos cuatro años desde que se dictó el acto administrativo y exigirá la previa audiencia de cuantos aparezcan como interesados en el mismo, en los términos establecidos por el artículo 82. Sin perjuicio de su examen como presupuesto procesal de admisibilidad de la acción en el proceso judicial correspondiente, la declaración de lesividad no será susceptible de recurso, si bien podrá notificarse a los interesados a los meros efectos informativos.</p><p>3. Transcurrido el plazo de seis meses desde la iniciación del procedimiento sin que se hubiera declarado la lesividad, se producirá la caducidad del mismo.</p><p>4. Si el acto proviniera de la Administración General del Estado o de las Comunidades Autónomas, la declaración de lesividad se adoptará por el órgano de cada Administración competente en la materia.</p><p>5. Si el acto proviniera de las entidades que integran la Administración Local, la declaración de lesividad se adoptará por el Pleno de la Corporación o, en defecto de éste, por el órgano colegiado superior de la entidad.</p>", "dis": "<ul>\n<li><b>107.1 — objeto:</b> las Administraciones podrán <b>impugnar ante el orden contencioso-administrativo</b> los <b>actos favorables</b> para los interesados que sean <b>anulables</b> conforme al art. 48, <b>previa su declaración de <span class=\"t\" data-k=\"lesividad\">lesividad</span></b> para el interés público.</li>\n<li><b>107.2 — plazo y audiencia:</b> la declaración de lesividad <b>no podrá adoptarse una vez transcurridos cuatro años</b> desde que se dictó el acto, y exige la <b>previa audiencia</b> de cuantos aparezcan como interesados. <b>No es susceptible de recurso</b>, si bien puede notificarse a los interesados a meros <b>efectos informativos</b>.</li>\n<li><b>107.3 — caducidad:</b> transcurridos <b>seis meses</b> desde la iniciación sin declararse la lesividad, el procedimiento <b>caduca</b>.</li>\n<li><b>107.4 — competencia estatal y autonómica:</b> el órgano de cada Administración competente en la materia.</li>\n<li><b>107.5 — competencia local:</b> el <b>Pleno de la Corporación</b> o, en su defecto, el <b>órgano colegiado superior</b> de la entidad.</li>\n</ul>\n<div class=\"box ej\"><span class=\"lbl\">Dato local imprescindible</span>En una entidad local, quien declara la lesividad es el <b>Pleno</b>. No el alcalde ni la Junta de Gobierno.</div>", "llano": "<p>La Administración no puede anular por sí misma un acto favorable simplemente anulable: tiene que declararlo lesivo para el interés público y después <b>demandarlo ante el juez</b>. Tiene cuatro años desde que lo dictó, y en un ayuntamiento la declaración corresponde al Pleno.</p>", "porque": "<p>Es la contrapartida de la autotutela. Si la Administración pudiera retirar por sí sola los actos que benefician a los ciudadanos, ninguna licencia, ninguna subvención y ningún nombramiento serían fiables. Por eso, cuando el vicio es de los que solo generan <b>anulabilidad</b>, la ley la obliga a comportarse como un demandante más y a acudir al juez. La declaración de lesividad no es la anulación: es solo el <b>presupuesto procesal</b> para pedirla.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> quien regala algo y luego se arrepiente: no puede entrar en casa a recuperarlo, tiene que reclamarlo.</li>\n<li><b>Real:</b> un ayuntamiento detecta en 2026 que un nombramiento como funcionario interino de 2023 se hizo con un error de baremación no determinante de nulidad. El <b>Pleno</b> declara la lesividad e impugna ante el contencioso.</li>\n<li><b>Caso límite:</b> el mismo acto, pero de 2021. Han pasado más de <b>cuatro años</b>: la declaración de lesividad ya no es posible.</li>\n</ul>", "noej": "<ul>\n<li><b>No procede</b> la lesividad frente a actos <b>desfavorables</b>: esos se revocan (art. 109).</li>\n<li><b>No procede</b> frente a actos <b>nulos</b>: para ellos está el art. 106.</li>\n<li><b>No cabe</b> recurso contra la declaración de lesividad: no es un acto que decida el fondo.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 48 LPAC:</b> actos anulables.</li>\n<li><b>Art. 82 LPAC:</b> trámite de audiencia, expresamente invocado.</li>\n<li><b>Art. 106 LPAC:</b> la vía paralela para los actos nulos.</li>\n<li><b>Art. 109 LPAC:</b> revocación de actos desfavorables.</li>\n</ul>", "trampas": "<ul>\n<li><b>Cuatro años</b> desde que se dictó el acto para declarar la lesividad; <b>seis meses</b> de caducidad del procedimiento.</li>\n<li>En el ámbito local, declara el <b>Pleno</b>.</li>\n<li>La declaración <b>no es recurrible</b>; solo se notifica a efectos informativos.</li>\n<li>Después de declararla hay que <b>impugnar ante el contencioso</b>: la Administración no anula por sí misma.</li>\n</ul>", "ancla": "<p><b>«Favorable y anulable: 4 años, Pleno y juez.»</b> Frente a <b>nulo: cualquier momento y dictamen</b>.</p>", "vis": "<svg viewBox=\"0 0 660 145\" role=\"img\" aria-label=\"Declaración de lesividad\">\n<defs><marker id=\"l1\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\"><path d=\"M0 0 L9 4.5 L0 9 z\" fill=\"var(--acc)\"/></marker></defs>\n<rect x=\"15\" y=\"35\" width=\"150\" height=\"56\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/>\n<text x=\"90\" y=\"57\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">Acto FAVORABLE</text>\n<text x=\"90\" y=\"76\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">pero anulable</text>\n<path d=\"M168 63 L 200 63\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#l1)\"/>\n<rect x=\"204\" y=\"35\" width=\"185\" height=\"56\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/>\n<text x=\"296\" y=\"53\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--warn)\">Declaración de lesividad</text>\n<text x=\"296\" y=\"70\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">≤ 4 años · audiencia previa</text>\n<text x=\"296\" y=\"84\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--exc)\">Pleno en las entidades locales</text>\n<path d=\"M392 63 L 424 63\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#l1)\"/>\n<rect x=\"428\" y=\"35\" width=\"212\" height=\"56\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/>\n<text x=\"534\" y=\"57\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">Recurso contencioso</text>\n<text x=\"534\" y=\"76\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">lo anula el juez, no la Administración</text>\n<text x=\"330\" y=\"127\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--ink2)\">6 meses desde la iniciación sin declarar la lesividad: caducidad del procedimiento</text>\n</svg>"}]);
</script>
<script>
ARTS.push.apply(ARTS,[{"n": 108, "t": "Suspensión", "ubic": "Título V (De la revisión de los actos en vía administrativa) ▸ Capítulo I (Revisión de oficio)", "idea": "Iniciada la revisión o la lesividad, cabe suspender la ejecución del acto.", "literal": "<p>Iniciado el procedimiento de revisión de oficio al que se refieren los artículos 106 y 107, el órgano competente para declarar la nulidad o lesividad, podrá suspender la ejecución del acto, cuando ésta pudiera causar perjuicios de imposible o difícil reparación.</p>", "dis": "<ul>\n<li><b>Supuesto:</b> iniciado el procedimiento de revisión de oficio de los <b>arts. 106 y 107</b>.</li>\n<li><b>Facultad:</b> el órgano competente para declarar la <b>nulidad</b> o la <b>lesividad</b> <b>podrá suspender la ejecución</b> del acto.</li>\n<li><b>Requisito:</b> cuando la ejecución <b>pudiera causar perjuicios de imposible o difícil reparación</b>.</li>\n</ul>", "llano": "<p>Mientras se decide si el acto era nulo o lesivo, puede pararse su ejecución. No automáticamente: solo si seguir adelante causaría un daño que después no podría repararse.</p>", "porque": "<p>La revisión tarda meses. Si entretanto el acto se ejecuta y produce daños irreversibles —se demuele un edificio, se ocupa un puesto, se gasta una subvención—, la eventual declaración de nulidad llegaría tarde y sería inútil. La suspensión asegura que la decisión final <b>pueda cumplirse</b>.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> parar una obra mientras se decide si la licencia era válida.</li>\n<li><b>Real:</b> iniciada la revisión de oficio de una licencia de demolición de un edificio catalogado, el ayuntamiento suspende su ejecución: derribado el inmueble, la nulidad no repararía nada.</li>\n<li><b>Caso límite:</b> revisión de una liquidación tributaria ya pagada. Como el dinero es reintegrable, el perjuicio <b>no</b> es de difícil reparación y la suspensión no está justificada.</li>\n</ul>", "noej": "<ul>\n<li><b>No es</b> automática: es una <b>facultad</b> condicionada al requisito legal.</li>\n<li><b>No procede</b> cuando el perjuicio es económico y reparable.</li>\n<li><b>No es</b> la suspensión del art. 117, que opera al interponer un recurso.</li>\n</ul>", "conex": "<ul>\n<li><b>Arts. 106 y 107 LPAC:</b> los procedimientos a los que se refiere.</li>\n<li><b>Art. 117 LPAC:</b> suspensión al interponer un recurso administrativo.</li>\n<li><b>Art. 56 LPAC:</b> medidas provisionales.</li>\n</ul>", "trampas": "<ul>\n<li>La ley dice <b>«podrá»</b>: no hay suspensión automática.</li>\n<li>El estándar es <b>«perjuicios de imposible o difícil reparación»</b>.</li>\n<li>Decide el mismo órgano competente para declarar la nulidad o la lesividad.</li>\n</ul>", "ancla": "<p><b>«Si no se puede deshacer, se para.»</b></p>", "vis": "<svg viewBox=\"0 0 640 115\" role=\"img\" aria-label=\"Suspensión durante la revisión de oficio\">\n<rect x=\"45\" y=\"32\" width=\"240\" height=\"52\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/>\n<text x=\"165\" y=\"54\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">Revisión iniciada (106 o 107)</text>\n<text x=\"165\" y=\"72\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">el acto sigue siendo ejecutivo</text>\n<rect x=\"345\" y=\"32\" width=\"250\" height=\"52\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/>\n<text x=\"470\" y=\"54\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--warn)\">Suspensión potestativa</text>\n<text x=\"470\" y=\"72\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">si hay perjuicios de imposible</text>\n<text x=\"470\" y=\"86\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">o difícil reparación</text>\n<path d=\"M288 58 L 340 58\" stroke=\"var(--warn)\" stroke-width=\"2.5\"/>\n</svg>"}, {"n": 109, "t": "Revocación de actos y rectificación de errores", "ubic": "Título V (De la revisión de los actos en vía administrativa) ▸ Capítulo I (Revisión de oficio)", "idea": "Los actos desfavorables se revocan libremente; los errores materiales se rectifican siempre.", "literal": "<p>1. Las Administraciones Públicas podrán revocar, mientras no haya transcurrido el plazo de prescripción, sus actos de gravamen o desfavorables, siempre que tal revocación no constituya dispensa o exención no permitida por las leyes, ni sea contraria al principio de igualdad, al interés público o al ordenamiento jurídico.</p><p>2. Las Administraciones Públicas podrán, asimismo, rectificar en cualquier momento, de oficio o a instancia de los interesados, los errores materiales, de hecho o aritméticos existentes en sus actos.</p>", "dis": "<ul>\n<li><b>109.1 — <span class=\"t\" data-k=\"revocacion\">revocación</span>:</b> las Administraciones podrán revocar, <b>mientras no haya transcurrido el plazo de prescripción</b>, sus <b><span class=\"t\" data-k=\"gravamen\">actos de gravamen o desfavorables</span></b>, siempre que la revocación:\n<ul><li><b>no constituya dispensa o exención</b> no permitida por las leyes;</li>\n<li><b>no sea contraria al principio de igualdad</b>, al <b>interés público</b> ni al <b>ordenamiento jurídico</b>.</li></ul></li>\n<li><b>109.2 — rectificación:</b> podrán rectificar <b>en cualquier momento</b>, de oficio o a instancia de los interesados, los <b><span class=\"t\" data-k=\"errormaterial\">errores materiales, de hecho o aritméticos</span></b> existentes en sus actos.</li>\n</ul>\n<table><thead><tr><th></th><th>Revocación (109.1)</th><th>Rectificación (109.2)</th></tr></thead><tbody>\n<tr><td><b>Qué actos</b></td><td>Solo los <b>desfavorables o de gravamen</b></td><td><b>Cualquiera</b> con error material</td></tr>\n<tr><td><b>Plazo</b></td><td>Mientras no prescriba</td><td><b>En cualquier momento</b></td></tr>\n<tr><td><b>Iniciativa</b></td><td>De la Administración</td><td>De oficio <b>o a instancia</b></td></tr>\n<tr><td><b>Límites</b></td><td>Dispensa · igualdad · interés público · ordenamiento</td><td>Que el error sea <b>material</b>, no jurídico</td></tr>\n</tbody></table>", "llano": "<p>Si el acto te perjudicaba, la Administración puede retirarlo sin más trámite: nadie sale dañado. Y si hay un error de bulto —una cifra mal sumada, un nombre mal escrito—, se corrige cuando aparezca, aunque hayan pasado años. Lo que no cabe es disfrazar de «error material» un cambio de criterio jurídico.</p>", "porque": "<p>La revocación de actos desfavorables no necesita las garantías de los arts. 106 y 107 porque <b>no hay tercero perjudicado</b>: quien recibe el beneficio de la retirada es el propio interesado. Los límites impiden el uso torcido de esa facilidad: perdonar a uno lo que se exige a otro sería una <b>dispensa</b> prohibida y una quiebra de la <b>igualdad</b>.</p>\n<p>La rectificación del apartado 2 se admite sin plazo porque no altera el contenido jurídico del acto: solo hace coincidir lo escrito con lo decidido.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> retirar una sanción impuesta por error a un empleado; y corregir el importe mal sumado de una factura.</li>\n<li><b>Real:</b> un ayuntamiento revoca una orden de retirada de un vado impuesta por error de identificación del inmueble (art. 109.1).</li>\n<li><b>Caso límite:</b> el ayuntamiento pretende «rectificar» una liquidación cambiando el tipo impositivo aplicado. No es un error material sino una <b>valoración jurídica</b>: debe acudir a la revisión o a la lesividad.</li>\n</ul>", "noej": "<ul>\n<li><b>No cabe</b> revocar por esta vía actos <b>favorables</b>: para eso está la lesividad.</li>\n<li><b>No es</b> error material el que exige interpretación jurídica o valoración probatoria.</li>\n<li><b>No cabe</b> la revocación que suponga <b>dispensa</b> no permitida o vulnere la <b>igualdad</b>.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 107 LPAC:</b> vía para los actos favorables anulables.</li>\n<li><b>Art. 106 LPAC:</b> vía para los actos nulos.</li>\n<li><b>Art. 110 LPAC:</b> límites comunes a todas las facultades de revisión.</li>\n</ul>", "trampas": "<ul>\n<li>La revocación alcanza <b>solo</b> a los actos <b>de gravamen o desfavorables</b>.</li>\n<li>La rectificación procede <b>en cualquier momento</b> y también <b>a instancia</b> del interesado.</li>\n<li>Los tres límites: <b>dispensa</b>, <b>igualdad</b> e <b>interés público u ordenamiento</b>.</li>\n</ul>", "ancla": "<p><b>«Lo que te perjudica, lo puedo quitar; lo mal escrito, lo puedo corregir siempre.»</b></p>", "vis": "<svg viewBox=\"0 0 640 135\" role=\"img\" aria-label=\"Revocación y rectificación de errores\">\n<g font-size=\"10\" text-anchor=\"middle\" fill=\"currentColor\">\n<rect x=\"30\" y=\"28\" width=\"265\" height=\"70\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/>\n<text x=\"162\" y=\"50\" font-size=\"11\" font-weight=\"700\" fill=\"var(--warn)\">109.1 · REVOCACIÓN</text>\n<text x=\"162\" y=\"69\">solo actos desfavorables o de gravamen</text>\n<text x=\"162\" y=\"85\">mientras no prescriba · sin dispensa ni desigualdad</text>\n<rect x=\"345\" y=\"28\" width=\"265\" height=\"70\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/>\n<text x=\"477\" y=\"50\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">109.2 · RECTIFICACIÓN</text>\n<text x=\"477\" y=\"69\">errores materiales, de hecho o aritméticos</text>\n<text x=\"477\" y=\"85\">en cualquier momento · de oficio o a instancia</text>\n</g>\n<text x=\"320\" y=\"124\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--exc)\">Ninguna de las dos sirve para retirar un acto favorable: para eso, lesividad (art. 107)</text>\n</svg>"}, {"n": 110, "t": "Límites de la revisión", "ubic": "Título V (De la revisión de los actos en vía administrativa) ▸ Capítulo I (Revisión de oficio)", "idea": "Ninguna revisión procede si su ejercicio resulta contrario a la equidad o la buena fe.", "literal": "<p>Las facultades de revisión establecidas en este Capítulo, no podrán ser ejercidas cuando por prescripción de acciones, por el tiempo transcurrido o por otras circunstancias, su ejercicio resulte contrario a la equidad, a la buena fe, al derecho de los particulares o a las leyes.</p>", "dis": "<ul>\n<li><b>Alcance:</b> las facultades de revisión <b>de todo el Capítulo</b> —arts. 106 a 109—.</li>\n<li><b>Causas del límite:</b> <b>prescripción de acciones</b> · el <b>tiempo transcurrido</b> · <b>otras circunstancias</b>.</li>\n<li><b>Criterios que impiden el ejercicio:</b> que resulte contrario a la <b>equidad</b>, a la <b>buena fe</b>, al <b>derecho de los particulares</b> o a las <b>leyes</b>.</li>\n</ul>\n<div class=\"box exc\"><span class=\"lbl\">La válvula de seguridad del sistema</span>Es el contrapeso del «en cualquier momento» del art. 106: aunque no haya plazo, el tiempo transcurrido y la confianza generada pueden hacer que la revisión sea <b>inadmisible</b>.</div>", "llano": "<p>Aunque la ley permita revisar sin plazo, hay un freno: si por el tiempo pasado o por las circunstancias revisar ahora sería injusto o rompería la confianza que la propia Administración generó, no se puede.</p>", "porque": "<p>Sin este artículo, la revisión de oficio sin plazo del art. 106 sería una amenaza permanente sobre situaciones consolidadas durante décadas. El precepto incorpora principios generales del Derecho —<b>equidad</b>, <b>buena fe</b>, <b>confianza legítima</b>— como límite al ejercicio de una potestad legalmente atribuida. Es la prueba de que tener una potestad no equivale a poder usarla siempre.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> reclamar una deuda de hace veinte años a quien confió en que estaba saldada.</li>\n<li><b>Real:</b> un ayuntamiento pretende revisar en 2026 una licencia de 1998 sobre la que se construyó, se vendió y se ha habitado sin incidencias. El tiempo transcurrido y la <b>confianza legítima</b> de los adquirentes pueden impedir la revisión.</li>\n<li><b>Caso límite:</b> el mismo supuesto, pero la ilegalidad afecta a una zona verde de dominio público y quien la solicitó conocía el vicio. El límite del art. 110 <b>decae</b>: no hay buena fe que proteger.</li>\n</ul>", "noej": "<ul>\n<li><b>No es</b> un plazo: es un <b>estándar</b> valorativo que se aprecia caso por caso.</li>\n<li><b>No protege</b> a quien actuó de <b>mala fe</b> o conocía el vicio.</li>\n</ul>", "conex": "<ul>\n<li><b>Arts. 106 a 109 LPAC:</b> facultades de revisión que este artículo limita.</li>\n<li><b>Art. 3.1.e) de la Ley 40/2015</b> (documento 2): buena fe, confianza legítima y lealtad institucional como principios de actuación.</li>\n</ul>", "trampas": "<ul>\n<li>Se aplica a <b>todas</b> las facultades del capítulo, incluida la revocación.</li>\n<li>Son <b>cuatro</b> los criterios: equidad, buena fe, derecho de los particulares y leyes.</li>\n<li>El <b>tiempo transcurrido</b> es una de las causas, aunque no haya prescripción.</li>\n</ul>", "ancla": "<p><b>«Poder revisar no es deber revisar.»</b> Equidad, buena fe, derecho de los particulares y leyes.</p>", "vis": "<svg viewBox=\"0 0 640 125\" role=\"img\" aria-label=\"Límites de la revisión\">\n<rect x=\"185\" y=\"8\" width=\"270\" height=\"30\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/>\n<text x=\"320\" y=\"28\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">FACULTADES DE REVISIÓN (106 a 109)</text>\n<g font-size=\"10\" text-anchor=\"middle\" fill=\"currentColor\">\n<rect x=\"20\" y=\"52\" width=\"145\" height=\"48\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"92\" y=\"80\" font-weight=\"700\" fill=\"var(--exc)\">Equidad</text>\n<rect x=\"175\" y=\"52\" width=\"145\" height=\"48\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"247\" y=\"80\" font-weight=\"700\" fill=\"var(--exc)\">Buena fe</text>\n<rect x=\"330\" y=\"52\" width=\"145\" height=\"48\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"402\" y=\"74\" font-weight=\"700\" fill=\"var(--exc)\">Derecho de los</text><text x=\"402\" y=\"90\" font-weight=\"700\" fill=\"var(--exc)\">particulares</text>\n<rect x=\"485\" y=\"52\" width=\"135\" height=\"48\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"552\" y=\"80\" font-weight=\"700\" fill=\"var(--exc)\">Leyes</text>\n</g>\n<text x=\"320\" y=\"118\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--ink2)\">Por prescripción de acciones, tiempo transcurrido u otras circunstancias</text>\n</svg>"}]);
</script>
<script>
const PLAZOS=[["Cualquier momento", "Plazo para iniciar la revisión de oficio de actos nulos", "Administración o interesado", "106.1 LPAC", "Sin plazo, con dictamen favorable"], ["6 meses", "Caducidad del procedimiento de revisión iniciado de oficio", "Administración", "106.5 LPAC", "Si se inició a solicitud: silencio desestimatorio"], ["4 años", "Plazo máximo para declarar la lesividad desde que se dictó el acto", "Administración", "107.2 LPAC", "Con audiencia previa de los interesados"], ["6 meses", "Caducidad del procedimiento de declaración de lesividad", "Administración", "107.3 LPAC", "Desde la iniciación"], ["Pleno", "Órgano competente para declarar la lesividad en la Administración local", "Entidad local", "107.5 LPAC", "O el órgano colegiado superior en su defecto"], ["Prescripción", "Límite temporal de la revocación de actos desfavorables", "Administración", "109.1 LPAC", "Mientras no haya transcurrido"], ["Cualquier momento", "Rectificación de errores materiales, de hecho o aritméticos", "Administración o interesado", "109.2 LPAC", "De oficio o a instancia"], ["7 causas", "Supuestos de nulidad de pleno derecho de los actos", "Administración", "47.1 LPAC", "Letras a) a g)"], ["3 supuestos", "Causas de nulidad de las disposiciones administrativas", "Administración", "47.2 LPAC", "Rango superior, reserva de ley y retroactividad desfavorable"], ["Desde su fecha", "Efectos de la convalidación", "Administración", "52.2 LPAC", "Salvo retroactividad del art. 39.3"]];
const FLASH=[["Cita cuatro causas de nulidad de pleno derecho", "Lesión de derechos de <b>amparo</b> · órgano <b>manifiestamente incompetente</b> por materia o territorio · contenido <b>imposible</b> · <b>infracción penal</b> · prescindir <b>total y absolutamente</b> del procedimiento · adquisición de facultades sin <b>requisitos esenciales</b> · los previstos en <b>ley</b> (art. 47.1)."], ["¿Qué tipo de incompetencia genera nulidad?", "La <b>manifiesta por razón de la materia o del territorio</b>. La <b>jerárquica</b> es anulabilidad y se convalida por el superior (arts. 47.1.b y 52.3)."], ["¿Cuándo son nulas las disposiciones administrativas?", "Cuando vulneren la <b>Constitución, las leyes u otras disposiciones de rango superior</b>, regulen <b>materias reservadas a la ley</b> o establezcan la <b>retroactividad</b> de disposiciones sancionadoras no favorables o restrictivas de derechos (art. 47.2)."], ["¿Qué actos son anulables?", "Los que incurran en <b>cualquier infracción del ordenamiento jurídico</b>, <b>incluso la desviación de poder</b> (art. 48.1)."], ["¿Cuándo el defecto de forma determina la anulabilidad?", "Cuando el acto <b>carezca de los requisitos formales indispensables para alcanzar su fin</b> o <b>dé lugar a la indefensión</b> de los interesados (art. 48.2)."], ["¿Y la actuación fuera de plazo?", "Solo implica anulabilidad cuando así lo imponga la <b>naturaleza del término o plazo</b> (art. 48.3)."], ["¿Se contagia la invalidez a los actos sucesivos?", "No a los que sean <b>independientes</b> del viciado (art. 49.1). Y dentro del acto, tampoco a las partes independientes, salvo que la viciada sea determinante (art. 49.2)."], ["¿En qué consiste la conversión?", "Los actos <b>nulos o anulables</b> que contengan los elementos constitutivos de <b>otro distinto</b> producirán los efectos de este (art. 50)."], ["¿Qué obliga a hacer el art. 51?", "Disponer <b>siempre</b> la conservación de los actos y trámites cuyo contenido <b>se hubiera mantenido igual</b> de no haberse cometido la infracción."], ["¿Qué actos pueden convalidarse?", "Solo los <b>anulables</b>, subsanando los vicios. Los nulos, <b>no</b> (art. 52.1)."], ["¿Desde cuándo produce efecto la convalidación?", "<b>Desde su fecha</b>, salvo lo dispuesto en el art. 39.3 sobre retroactividad (art. 52.2)."], ["¿Quién convalida un acto viciado de incompetencia jerárquica?", "El <b>órgano competente cuando sea superior jerárquico</b> del que dictó el acto (art. 52.3)."], ["¿Qué actos pueden revisarse de oficio por nulidad?", "Los que hayan <b>puesto fin a la vía administrativa</b> o <b>no hayan sido recurridos en plazo</b>, en los supuestos del art. 47.1 (art. 106.1)."], ["¿Qué carácter tiene el dictamen del órgano consultivo en la revisión de oficio?", "Debe ser <b>favorable</b>: sin él no puede declararse la nulidad (art. 106.1)."], ["¿Cuándo cabe inadmitir a trámite una solicitud de revisión?", "Cuando no se base en una causa del art. 47.1, <b>carezca manifiestamente de fundamento</b> o se hubieran desestimado en el fondo otras <b>sustancialmente iguales</b>; y sin necesidad de dictamen (art. 106.3)."], ["Efectos del transcurso de seis meses en la revisión de oficio", "Iniciada <b>de oficio</b>: <b>caducidad</b>. Iniciada <b>a solicitud</b>: se entiende <b>desestimada por silencio</b> (art. 106.5)."], ["¿Cómo anula la Administración un acto favorable anulable?", "Declarándolo <b>lesivo</b> para el interés público e <b>impugnándolo ante el orden contencioso-administrativo</b> (art. 107.1)."], ["Plazo para declarar la lesividad", "<b>Cuatro años</b> desde que se dictó el acto, con <b>audiencia previa</b> de los interesados (art. 107.2)."], ["¿Quién declara la lesividad en una entidad local?", "El <b>Pleno de la Corporación</b> o, en su defecto, el <b>órgano colegiado superior</b> de la entidad (art. 107.5)."], ["¿Es recurrible la declaración de lesividad?", "<b>No</b>: puede notificarse a los interesados a meros <b>efectos informativos</b> (art. 107.2)."], ["¿Cuándo cabe suspender la ejecución durante la revisión?", "Cuando la ejecución <b>pudiera causar perjuicios de imposible o difícil reparación</b> (art. 108)."], ["¿Qué actos puede revocar la Administración?", "Sus actos <b>de gravamen o desfavorables</b>, mientras no haya prescrito, sin que suponga <b>dispensa</b> ni sea contraria a la <b>igualdad</b>, al interés público o al ordenamiento (art. 109.1)."], ["¿Cuándo pueden rectificarse los errores materiales?", "<b>En cualquier momento</b>, de oficio o a instancia de los interesados (art. 109.2)."], ["¿Qué límites tiene el ejercicio de las facultades de revisión?", "No pueden ejercerse cuando resulte contrario a la <b>equidad</b>, a la <b>buena fe</b>, al <b>derecho de los particulares</b> o a las <b>leyes</b>, por prescripción, tiempo transcurrido u otras circunstancias (art. 110)."]];
const TEST=[{"a": 47, "q": "¿Cuál de estos supuestos NO es causa de nulidad de pleno derecho?", "o": [["la incompetencia jerárquica del órgano que dicta el acto", 1, "Correcto: el art. 47.1.b) solo cita la incompetencia manifiesta por materia o territorio. La jerárquica es anulabilidad convalidable (art. 52.3)."], ["el contenido imposible", 0, "Letra c): sí es causa de nulidad."], ["prescindir total y absolutamente del procedimiento", 0, "Letra e): sí lo es."], ["lesionar derechos susceptibles de amparo constitucional", 0, "Letra a): sí lo es."]]}, {"a": 47, "q": "Completa: son nulos los actos «dictados prescindiendo ______ del procedimiento legalmente establecido».", "gap": "total y absolutamente", "fb": "<b>Total y absolutamente</b> (art. 47.1.e). La omisión de un trámite aislado no basta: sería anulabilidad."}, {"a": 47, "q": "Un acto presunto por el que se adquiere una licencia careciendo de los requisitos esenciales es:", "o": [["nulo de pleno derecho", 1, "Correcto: art. 47.1.f), que alcanza expresamente a los actos presuntos."], ["válido, porque el silencio es positivo", 0, "El silencio no permite adquirir lo que la ley niega."], ["anulable", 0, "La ley lo califica de nulo."], ["convalidable por el superior jerárquico", 0, "Los actos nulos no son convalidables."]]}, {"a": 48, "q": "La desviación de poder determina:", "o": [["la anulabilidad del acto", 1, "Correcto: art. 48.1, que la menciona expresamente."], ["la nulidad de pleno derecho", 0, "No figura entre las causas del art. 47.1."], ["únicamente responsabilidad disciplinaria", 0, "Es un vicio del acto."], ["la caducidad del procedimiento", 0, "No tiene relación."]]}, {"a": 48, "q": "El defecto de forma determina siempre la anulabilidad del acto.", "vf": true, "ok": false, "fb": "<b>Falso.</b> El art. 48.2 lo restringe: <b>solo</b> cuando el acto carezca de los requisitos formales indispensables para alcanzar su fin o dé lugar a <b>indefensión</b>."}, {"a": 49, "q": "La nulidad de un acto en el procedimiento:", "o": [["no implica la de los sucesivos que sean independientes del primero", 1, "Correcto: art. 49.1."], ["arrastra siempre a todo el procedimiento", 0, "Justo lo contrario."], ["obliga a repetir el expediente desde el inicio", 0, "No lo impone la ley."], ["impide la conservación de trámites", 0, "El art. 51 obliga a conservarlos."]]}, {"a": 50, "q": "La conversión de actos viciados se aplica:", "o": [["a los actos nulos y a los anulables", 1, "Correcto: el art. 50 menciona ambos."], ["solo a los anulables", 0, "Esa es la convalidación (art. 52)."], ["solo a los nulos", 0, "Alcanza también a los anulables."], ["solo a las disposiciones administrativas", 0, "Se refiere a actos."]]}, {"a": 51, "q": "Respecto de la conservación de actos y trámites, el órgano que declara la nulidad:", "o": [["dispondrá siempre la conservación de aquellos cuyo contenido se hubiera mantenido igual", 1, "Correcto: art. 51. Es un deber, no una facultad."], ["podrá conservarlos si lo estima oportuno", 0, "La ley dice «dispondrá siempre»."], ["deberá repetir todos los trámites", 0, "No es lo previsto."], ["solo conservará los trámites posteriores al viciado", 0, "El criterio no es temporal, sino de contenido."]]}, {"a": 52, "q": "La convalidación de actos:", "o": [["solo procede respecto de los actos anulables", 1, "Correcto: art. 52.1. Los nulos no se convalidan."], ["procede respecto de los actos nulos y anulables", 0, "Solo los anulables."], ["produce siempre efectos retroactivos", 0, "Produce efecto desde su fecha, salvo el art. 39.3."], ["corresponde al órgano inferior", 0, "En la incompetencia, al superior jerárquico."]]}, {"a": 52, "q": "El acto de convalidación produce efecto:", "o": [["desde su fecha, salvo lo dispuesto en el art. 39.3", 1, "Correcto: art. 52.2."], ["desde la fecha del acto convalidado, en todo caso", 0, "Solo si concurre el art. 39.3."], ["desde su notificación al interesado", 0, "No es lo que dispone el precepto."], ["desde su publicación", 0, "No es lo previsto."]]}, {"a": 106, "q": "La revisión de oficio de los actos nulos puede iniciarse:", "o": [["en cualquier momento, por iniciativa propia o a solicitud de interesado", 1, "Correcto: art. 106.1."], ["solo dentro de los cuatro años siguientes", 0, "Ese es el plazo de la declaración de lesividad."], ["solo por iniciativa propia de la Administración", 0, "También a solicitud del interesado."], ["solo dentro del plazo de recurso", 0, "Precisamente opera cuando ese plazo ha pasado."]]}, {"a": 106, "q": "El dictamen del Consejo de Estado u órgano consultivo autonómico en la revisión de oficio debe ser:", "o": [["favorable", 1, "Correcto: art. 106.1. Sin dictamen favorable no cabe declarar la nulidad."], ["preceptivo pero no vinculante", 0, "Aquí la ley exige que sea favorable."], ["facultativo", 0, "Es preceptivo."], ["emitido solo si lo pide el interesado", 0, "Lo recaba el órgano competente."]]}, {"a": 106, "q": "Iniciado de oficio un procedimiento de revisión, el transcurso de seis meses sin resolver produce:", "o": [["la caducidad del procedimiento", 1, "Correcto: art. 106.5. Si se inició a solicitud, el efecto es el silencio desestimatorio."], ["el silencio estimatorio", 0, "No está previsto."], ["la nulidad automática del acto revisado", 0, "No es la consecuencia."], ["la prórroga automática por otros seis meses", 0, "No existe tal prórroga."]]}, {"a": 107, "q": "Para anular un acto propio favorable al interesado que sea anulable, la Administración debe:", "o": [["declararlo lesivo para el interés público e impugnarlo ante el orden contencioso-administrativo", 1, "Correcto: art. 107.1. No puede anularlo por sí misma."], ["revocarlo directamente", 0, "La revocación solo alcanza a los actos desfavorables (art. 109.1)."], ["revisarlo de oficio con dictamen favorable", 0, "Esa vía es para los actos nulos (art. 106)."], ["rectificarlo como error material", 0, "No es un error material."]]}, {"a": 107, "q": "La declaración de lesividad no podrá adoptarse transcurridos:", "o": [["cuatro años desde que se dictó el acto", 1, "Correcto: art. 107.2."], ["seis meses desde que se dictó el acto", 0, "Los seis meses son la caducidad del procedimiento."], ["dos años desde que se dictó el acto", 0, "No es el plazo legal."], ["cinco años desde su notificación", 0, "No es el plazo legal."]]}, {"a": 107, "q": "En una entidad local, la declaración de lesividad corresponde a:", "o": [["el Pleno de la Corporación o, en su defecto, el órgano colegiado superior", 1, "Correcto: art. 107.5."], ["el alcalde o presidente", 0, "La ley atribuye la competencia al Pleno."], ["la Junta de Gobierno Local", 0, "No es el órgano competente."], ["el secretario de la corporación", 0, "No es órgano decisorio en este punto."]]}, {"a": 108, "q": "Iniciado el procedimiento de revisión de oficio, la suspensión de la ejecución del acto:", "o": [["es potestativa y procede si la ejecución pudiera causar perjuicios de imposible o difícil reparación", 1, "Correcto: art. 108."], ["es automática desde la iniciación", 0, "La ley dice «podrá suspender»."], ["no cabe en ningún caso", 0, "Sí cabe."], ["solo procede si lo acuerda el órgano consultivo", 0, "Decide el órgano competente para declarar la nulidad o lesividad."]]}, {"a": 109, "q": "La revocación regulada en el art. 109.1 alcanza a:", "o": [["los actos de gravamen o desfavorables", 1, "Correcto: y con los límites de dispensa, igualdad, interés público y ordenamiento."], ["cualquier acto administrativo", 0, "Solo a los desfavorables."], ["los actos favorables anulables", 0, "Esos se combaten por la vía de la lesividad."], ["las disposiciones administrativas", 0, "El precepto se refiere a actos."]]}, {"a": 109, "q": "Los errores materiales, de hecho o aritméticos pueden rectificarse:", "o": [["en cualquier momento, de oficio o a instancia de los interesados", 1, "Correcto: art. 109.2."], ["solo dentro de los cuatro años siguientes", 0, "No hay tal plazo."], ["solo de oficio", 0, "También a instancia del interesado."], ["solo previo dictamen del órgano consultivo", 0, "No se exige dictamen."]]}, {"a": 110, "q": "Las facultades de revisión no podrán ejercerse cuando resulte contrario a:", "o": [["la equidad, la buena fe, el derecho de los particulares o las leyes", 1, "Correcto: art. 110, la válvula de seguridad del sistema."], ["la eficacia administrativa únicamente", 0, "No es lo que enumera el precepto."], ["el principio de jerarquía normativa", 0, "No figura entre los criterios del art. 110."], ["ningún límite: la revisión es siempre posible", 0, "El art. 110 establece expresamente límites."]]}];
const CASOS=[{"t": "Caso 1 · Elegir la vía correcta", "e": "Un ayuntamiento detecta cuatro problemas: <b>(a)</b> una licencia de apertura de 2019, firme, concedida por silencio a quien no reunía un requisito esencial; <b>(b)</b> un nombramiento de 2024 con un error de baremación no determinante de nulidad; <b>(c)</b> una sanción de tráfico de 2025 impuesta por error de matrícula; <b>(d)</b> una liquidación en la que se sumaron mal dos cantidades. <b>Indica la vía aplicable en cada caso y el órgano competente.</b>", "s": "<p><b>(a) Revisión de oficio del art. 106.</b> El acto es <b>nulo</b> por el art. 47.1.f) —adquisición de facultades careciendo de requisitos esenciales, aplicable a actos <b>presuntos</b>—. Cabe <b>en cualquier momento</b>, con <b>dictamen favorable</b> del Consejo Consultivo de Andalucía. Límite: el art. 110, si el tiempo transcurrido y la buena fe del titular lo hicieran inadmisible.</p><p><b>(b) Declaración de lesividad del art. 107.</b> Es un acto <b>favorable</b> y solo <b>anulable</b>. El <b>Pleno</b> declara la lesividad —dentro de los <b>cuatro años</b> desde que se dictó y con <b>audiencia previa</b>— e impugna después ante el contencioso. La declaración <b>no es recurrible</b>.</p><p><b>(c) Revocación del art. 109.1.</b> Es un acto <b>de gravamen</b>: puede retirarse directamente mientras no prescriba, siempre que no suponga dispensa ni vulnere la igualdad.</p><p><b>(d) Rectificación del art. 109.2.</b> Error <b>aritmético</b>: se corrige <b>en cualquier momento</b>, de oficio o a instancia del interesado, sin dictamen ni procedimiento especial.</p><p><b>La regla que se extrae:</b> pregúntate primero <b>si el acto es nulo o anulable</b> y después <b>si es favorable o desfavorable</b>. Esas dos preguntas determinan la vía.</p>"}, {"t": "Caso 2 · El expediente sancionador viciado", "e": "En un expediente sancionador municipal se omite el <b>trámite de audiencia</b>. La resolución impone 900 € de multa. El interesado recurre y el órgano competente anula la resolución. <b>¿Qué tipo de invalidez es? ¿Qué actos se conservan? ¿Puede convalidarse?</b>", "s": "<p><b>1) Tipo de invalidez.</b> No hay nulidad: no se ha prescindido <b>total y absolutamente</b> del procedimiento, sino que se ha omitido un trámite. Es un <b>defecto de forma</b> del art. <b>48.2</b>, y determina la <b>anulabilidad</b> porque la falta de audiencia produce <b>indefensión</b>.</p><p><b>2) Extensión.</b> Conforme al art. <b>49.1</b>, la invalidez no alcanza a los actos <b>independientes</b>. Y el art. <b>51</b> obliga a <b>disponer siempre</b> la conservación de aquellos cuyo contenido se hubiera mantenido igual: se conservan el acuerdo de incoación, el pliego de cargos y las pruebas ya practicadas.</p><p><b>3) Convalidación.</b> Al tratarse de un acto <b>anulable</b>, cabe en abstracto la convalidación del art. <b>52.1</b>. Pero aquí la subsanación no consiste en firmar un papel: exige <b>retrotraer</b> las actuaciones al momento de la audiencia y practicarla (art. 119.2). Solo entonces puede dictarse nueva resolución.</p><p><b>4) Efectos.</b> La nueva resolución producirá efecto <b>desde su fecha</b>. Y hay que vigilar el plazo máximo del procedimiento sancionador: la retroacción no lo reabre indefinidamente, y su vencimiento produciría la <b>caducidad</b>.</p>"}, {"t": "Caso 3 · La revisión que llega tarde", "e": "En 2026 un ayuntamiento comprueba que una licencia de obra de <b>1999</b> se concedió por órgano manifiestamente incompetente por razón de la materia. Sobre esa licencia se construyó un edificio de doce viviendas, vendidas y habitadas desde entonces sin incidencia alguna. <b>¿Puede revisarse de oficio? Argumenta a favor y en contra.</b>", "s": "<p><b>1) A favor de la revisión.</b> La incompetencia manifiesta por razón de la materia es causa de <b>nulidad de pleno derecho</b> (art. 47.1.b). El art. <b>106.1</b> permite declararla <b>en cualquier momento</b>, sin plazo alguno, respecto de actos firmes. Formalmente, la potestad existe.</p><p><b>2) En contra.</b> Entra en juego el art. <b>110</b>: las facultades de revisión <b>no podrán ejercerse</b> cuando por el <b>tiempo transcurrido</b> u otras circunstancias su ejercicio resulte contrario a la <b>equidad</b>, a la <b>buena fe</b> o al <b>derecho de los particulares</b>. Veintisiete años, adquirentes de buena fe y una situación consolidada apuntan claramente a este límite.</p><p><b>3) Cómo se decide.</b> No hay respuesta automática: se pondera <b>caso por caso</b>. Pesan a favor del límite la buena fe de los terceros y la irreversibilidad de la situación; pesan en contra la entidad de la ilegalidad y el conocimiento del vicio por quien la solicitó.</p><p><b>4) Salidas.</b> Si la revisión resulta inadmisible por el art. 110, la ilegalidad no queda sin consecuencias: cabe <b>indemnizar</b> a los perjudicados (art. 106.4 y arts. 32 y 34 de la Ley 40/2015) y depurar, en su caso, la responsabilidad de quienes intervinieron.</p><p><b>La lección:</b> el art. 106 dice <b>cuándo se puede</b>; el art. 110 dice <b>cuándo, aun pudiendo, no se debe</b>.</p>"}];

const INTRO_HTML="<section class=\"card\" id=\"intro\"><h2>Tema 2 · Bloque 2 · Invalidez y revisión de oficio</h2><p class=\"small\">Segundo bloque del tema 2. Se juntan aquí dos capítulos que el temario pide de la mano: el <b>Capítulo III del Título III</b> —nulidad y anulabilidad— y el <b>Capítulo I del Título V</b> —revisión de oficio—, porque el segundo es la consecuencia procesal del primero.</p><div class=\"box ej\"><span class=\"lbl\">La idea que ordena el bloque</span>Todo se resuelve con <b>dos preguntas</b>. Primera: <b>¿el vicio es de nulidad o de anulabilidad?</b> Segunda: <b>¿el acto es favorable o desfavorable para el interesado?</b> Cruzando ambas respuestas se obtiene siempre la vía correcta.</div><table><thead><tr><th></th><th>Acto NULO</th><th>Acto ANULABLE</th></tr></thead><tbody><tr><th>Favorable al interesado</th><td><b>Revisión de oficio</b> (art. 106): en cualquier momento + <b>dictamen favorable</b></td><td><b>Lesividad</b> (art. 107): <b>4 años</b> + Pleno + <b>juez</b></td></tr><tr><th>Desfavorable</th><td>Revisión de oficio (art. 106) o <b>revocación</b> (art. 109.1)</td><td><b>Revocación</b> (art. 109.1): mientras no prescriba</td></tr><tr><th>Solo error material</th><td colspan=\"2\"><b>Rectificación</b> (art. 109.2): en cualquier momento, de oficio o a instancia</td></tr></tbody></table><div class=\"box warn\"><span class=\"lbl\">Fuentes utilizadas y vigencia</span><ul><li><b>Ley 39/2015, de 1 de octubre</b> (documento 1 de la biblioteca), texto consolidado. Arts. 47 a 52 y 106 a 110.</li><li>Concordancias con la <b>Ley 40/2015</b> (documento 2) en materia de competencia, principios de actuación y responsabilidad patrimonial, y con el <b>TRLHL</b> (documento 5), art. 173.5, como ejemplo de nulidad establecida por ley.</li><li><b>Aportación externa</b>: el <b>Consejo Consultivo de Andalucía</b> como órgano consultivo equivalente al Consejo de Estado a efectos del art. 106.1. Verifica su regulación y la vigencia de los textos en el BOE consolidado.</li><li>Se ha omitido el <b>art. 111</b>, que distribuye la competencia para la revisión de oficio dentro de la Administración General del Estado y carece de interés para el ámbito local.</li></ul></div><svg viewBox=\"0 0 660 200\" role=\"img\" aria-label=\"Mapa conceptual de la invalidez y su revisión\"><rect x=\"225\" y=\"8\" width=\"210\" height=\"32\" rx=\"9\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"330\" y=\"30\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"#fff\">EL ACTO ESTÁ VICIADO</text><line x1=\"330\" y1=\"40\" x2=\"330\" y2=\"56\" stroke=\"var(--acc)\" stroke-width=\"2\"/><line x1=\"165\" y1=\"56\" x2=\"495\" y2=\"56\" stroke=\"var(--acc)\" stroke-width=\"2\"/><line x1=\"165\" y1=\"56\" x2=\"165\" y2=\"72\" stroke=\"var(--acc)\" stroke-width=\"2\"/><line x1=\"495\" y1=\"56\" x2=\"495\" y2=\"72\" stroke=\"var(--acc)\" stroke-width=\"2\"/><rect x=\"25\" y=\"72\" width=\"280\" height=\"110\" rx=\"9\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"165\" y=\"94\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"var(--exc)\">NULIDAD · art. 47</text><text x=\"165\" y=\"117\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">causas tasadas · no se convalida</text><text x=\"165\" y=\"139\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">no prescribe</text><text x=\"165\" y=\"164\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--exc)\">→ Revisión de oficio (106)</text><rect x=\"355\" y=\"72\" width=\"280\" height=\"110\" rx=\"9\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"495\" y=\"94\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"var(--warn)\">ANULABILIDAD · art. 48</text><text x=\"495\" y=\"117\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">regla general · convalidable (52)</text><text x=\"495\" y=\"139\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">plazos de recurso</text><text x=\"495\" y=\"164\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--warn)\">→ Lesividad (107) o revocación (109)</text></svg></section>";
const RESUMEN_HTML="<section class=\"card\" id=\"resumen\"><h2>Resumen ejecutivo</h2><p class=\"small\"><b>Norma:</b> Ley 39/2015, arts. 47 a 52 y 106 a 110.</p><table><tbody><tr><th style=\"width:60px\">47</th><td><b>Siete</b> causas de nulidad: amparo · incompetencia <b>manifiesta</b> por materia o territorio · contenido imposible · infracción penal · <b>total y absolutamente</b> sin procedimiento · derechos sin requisitos esenciales · las de <b>ley</b>. Reglamentos: rango superior, reserva de ley y retroactividad desfavorable.</td></tr><tr><th>48</th><td>Anulabilidad: <b>cualquier</b> infracción, incluida la <b>desviación de poder</b>. Defecto de forma <b>solo</b> si impide el fin o causa <b>indefensión</b>; fuera de plazo <b>solo</b> si lo impone su naturaleza.</td></tr><tr><th>49-51</th><td>No se contagia lo <b>independiente</b>. <b>Conversión</b>: nulos y anulables que contienen otro acto. <b>Conservación</b>: <b>siempre</b> lo que habría sido igual.</td></tr><tr><th>52</th><td><b>Convalidación</b> solo de anulables · efectos <b>desde su fecha</b> · incompetencia jerárquica: convalida el <b>superior</b> · falta de autorización: se <b>otorga</b>.</td></tr><tr><th>106</th><td>Actos nulos firmes o no recurridos: <b>en cualquier momento</b> + <b>dictamen favorable</b>. Inadmisión motivada sin dictamen. <b>6 meses</b>: de oficio <b>caduca</b>, a instancia <b>silencio desestimatorio</b>.</td></tr><tr><th>107</th><td>Actos <b>favorables anulables</b>: declaración de <b>lesividad</b> en <b>4 años</b> con audiencia + impugnación <b>contenciosa</b>. En lo local decide el <b>Pleno</b>. <b>6 meses</b> de caducidad. No recurrible.</td></tr><tr><th>108-109</th><td><b>Suspensión</b> potestativa si hay perjuicios de imposible o difícil reparación. <b>Revocación</b> de actos <b>desfavorables</b> mientras no prescriba. <b>Rectificación</b> de errores materiales <b>en cualquier momento</b>.</td></tr><tr><th>110</th><td>Ninguna revisión cabe si resulta contraria a la <b>equidad</b>, la <b>buena fe</b>, el <b>derecho de los particulares</b> o las <b>leyes</b>.</td></tr></tbody></table><h2 style=\"margin-top:1.2rem\">Calendario de repaso espaciado</h2><table><thead><tr><th>Momento</th><th>Fecha</th><th>Qué hacer</th></tr></thead><tbody id=\"calbody\"></tbody></table></section>";

<script>

/* ═══ Mejoras de interacción · Bloque II ═══ */
(function(){
"use strict";
var K_THEME="oposi_bII_theme", K_FS="oposi_bII_fs", K_STREAK="oposi_bII_streak";
function load(k,f){try{var v=localStorage.getItem(k);return v?JSON.parse(v):f;}catch(e){return f;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
var root=document.documentElement;

/* Tema persistente (sobrescribe el toggle simple anterior) */
var saved=load(K_THEME,null);
if(saved){root.setAttribute("data-theme",saved);}
else if(window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches){root.setAttribute("data-theme","dark");}
var bt=document.getElementById("theme");
if(bt)bt.onclick=function(){
  var n=root.getAttribute("data-theme")==="dark"?"light":"dark";
  root.setAttribute("data-theme",n);save(K_THEME,n);
};

/* Tamaño de texto persistente */
var fs=load(K_FS,16);
function setFs(v){fs=Math.max(13,Math.min(22,v));root.style.setProperty("--fs",fs+"px");save(K_FS,fs);}
setFs(fs);
var bp=document.getElementById("fs+"),bm=document.getElementById("fs-");
if(bp)bp.onclick=function(){setFs(fs+1);};
if(bm)bm.onclick=function(){setFs(fs-1);};

/* Racha compartida con el índice */
(function(){
  var el=document.getElementById("streakN");if(!el)return;
  var hoy=new Date().toISOString().slice(0,10);
  var s=load(K_STREAK,{last:null,n:0});
  if(s.last!==hoy){
    var ayer=new Date(Date.now()-864e5).toISOString().slice(0,10);
    s.n=(s.last===ayer)?s.n+1:1;s.last=hoy;save(K_STREAK,s);
  }
  el.textContent=s.n;
})();

/* Reveal on scroll para las tarjetas */
function reveal(){
  var els=document.querySelectorAll("section.card:not(.rv)");
  if(!els.length)return;
  if(!("IntersectionObserver" in window)){return;}
  var io=new IntersectionObserver(function(es){
    es.forEach(function(en){if(en.isIntersecting){en.target.classList.add("in");io.unobserve(en.target);}});
  },{threshold:.06,rootMargin:"0px 0px -30px 0px"});
  Array.prototype.forEach.call(els,function(el){el.classList.add("rv");io.observe(el);});
}

/* Sección activa en el índice lateral */
function spy(){
  var links=document.querySelectorAll("nav.side a[href^='#']");
  if(!links.length||!("IntersectionObserver" in window))return;
  var map={};
  Array.prototype.forEach.call(links,function(a){
    var t=document.getElementById(a.getAttribute("href").slice(1));
    if(t)map[t.id]=a;
  });
  var io=new IntersectionObserver(function(es){
    es.forEach(function(en){
      if(en.isIntersecting){
        Array.prototype.forEach.call(links,function(a){a.classList.remove("on");});
        if(map[en.target.id])map[en.target.id].classList.add("on");
      }
    });
  },{rootMargin:"-80px 0px -70% 0px",threshold:0});
  Object.keys(map).forEach(function(id){io.observe(document.getElementById(id));});
}

/* Ripple en botones */
document.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b||b.classList.contains("navtoggle"))return;
  var r=b.getBoundingClientRect(),d=Math.max(r.width,r.height),s=document.createElement("span");
  s.className="ripple";s.style.width=s.style.height=d+"px";
  s.style.left=(e.clientX-r.left-d/2)+"px";s.style.top=(e.clientY-r.top-d/2)+"px";
  b.appendChild(s);setTimeout(function(){if(s.parentNode)s.parentNode.removeChild(s);},560);
});

/* Atajos de teclado */
document.addEventListener("keydown",function(e){
  if(e.target.matches("input,textarea"))return;
  if(e.key==="/"){var q=document.getElementById("q");if(q){e.preventDefault();q.focus();}}
  if(e.key==="t"&&bt)bt.click();
});

/* El contenido se inyecta por JS: esperamos a que exista */
function init(){reveal();spy();}
if(document.getElementById("main")&&document.getElementById("main").children.length){init();}
else{setTimeout(init,60);}
addEventListener("load",function(){setTimeout(init,80);});
})();

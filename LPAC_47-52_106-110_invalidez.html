<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Ley 39/2015 · LPAC · Arts. 47 a 52 y 106 a 110 · Nulidad y anulabilidad</title>
<style>

/* ═══════════════════════════════════════════════════════════════
   SISTEMA DE DISEÑO · "Académico Gamificado" · Bloque II
   Temas 8, 9 y 10 · Auxiliar Administrativo
   ═══════════════════════════════════════════════════════════════ */
:root{
  --fs:16px;

  --bg:#faf9f7;
  --bg-grad:radial-gradient(1100px 560px at 12% -8%, #ede9ff 0%, transparent 55%),
            radial-gradient(850px 460px at 96% 0%, #dcf5ee 0%, transparent 50%);
  --surface:#ffffff;
  --surface-2:#f4f3f0;
  --surface-3:#eceae5;
  --line:#e6e3dc;
  --line-strong:#d4d0c7;

  --ink:#15161c;
  --ink-2:#5d616e;
  --ink-3:#8b8f9c;

  --brand:#5b3df5;
  --brand-2:#7c5cff;
  --brand-soft:#efeaff;
  --brand-ring:rgba(91,61,245,.18);

  --legal:#4338ca;  --legal-bg:#eeecff;
  --ej:#059669;     --ej-bg:#e4f7f0;
  --warn:#c2690a;   --warn-bg:#fdf1de;
  --exc:#dc2626;    --exc-bg:#ffeceb;

  --ok:#16a34a; --ok-soft:#e7f7ec;
  --mid:#eab308; --mid-soft:#fdf6dd;
  --off:#a1a1aa; --off-soft:#f1f1f3;

  --sh-1:0 1px 2px rgba(20,20,30,.04), 0 2px 8px rgba(20,20,30,.04);
  --sh-2:0 2px 6px rgba(20,20,30,.05), 0 12px 28px rgba(20,20,30,.07);
  --sh-3:0 8px 20px rgba(91,61,245,.13), 0 24px 56px rgba(20,20,30,.10);
  --sh-glow:0 0 0 4px var(--brand-ring);

  --r-sm:9px; --r-md:14px; --r-lg:20px; --r-full:999px;

  --f-display:"Segoe UI Variable Display",system-ui,-apple-system,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-legal:ui-serif,Georgia,Cambria,"Times New Roman",serif;
  --f-mono:ui-monospace,"SF Mono","Cascadia Mono","Segoe UI Mono",Menlo,monospace;

  --t-h1:clamp(1.02rem,.95rem + .3vw,1.2rem);
  --t-h2:clamp(1.2rem,1.05rem + .6vw,1.55rem);
  --t-h3:clamp(1rem,.95rem + .25vw,1.12rem);
  --t-sm:.86rem;
  --t-xs:.75rem;

  --e-out:cubic-bezier(.22,1,.36,1);
  --e-spring:cubic-bezier(.34,1.56,.64,1);

  /* ── Compatibilidad con SVG y contenido generado ── */
  --panel:var(--surface);
  --ink2:var(--ink-2);
  --acc:var(--brand);
  --acc-soft:var(--brand-soft);
  --g:var(--ok); --y:var(--mid); --r:var(--exc);
}

html[data-theme="dark"]{
  --bg:#0a0b0f;
  --bg-grad:radial-gradient(1100px 560px at 12% -8%, #1c1740 0%, transparent 55%),
            radial-gradient(850px 460px at 96% 0%, #08302b 0%, transparent 50%);
  --surface:#13151b;
  --surface-2:#1a1d25;
  --surface-3:#232733;
  --line:#262a34;
  --line-strong:#343947;

  --ink:#eceef4;
  --ink-2:#9ba2b3;
  --ink-3:#6e7585;

  --brand:#8b6dff;
  --brand-2:#a78bff;
  --brand-soft:#1e1a3d;
  --brand-ring:rgba(139,109,255,.22);

  --legal:#a5b4fc; --legal-bg:#191b3a;
  --ej:#34d399;    --ej-bg:#0c2a24;
  --warn:#fbbf24;  --warn-bg:#2e2110;
  --exc:#fb7185;   --exc-bg:#331119;

  --ok:#4ade80; --ok-soft:#0e2a19;
  --mid:#facc15; --mid-soft:#2c2610;
  --off:#5b6070; --off-soft:#1c1f27;

  --sh-1:0 1px 2px rgba(0,0,0,.3), 0 2px 8px rgba(0,0,0,.25);
  --sh-2:0 2px 6px rgba(0,0,0,.35), 0 12px 28px rgba(0,0,0,.4);
  --sh-3:0 8px 20px rgba(139,109,255,.2), 0 24px 56px rgba(0,0,0,.5);
}

*,*::before,*::after{box-sizing:border-box}
html{font-size:var(--fs);scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);background-image:var(--bg-grad);
  background-attachment:fixed;background-repeat:no-repeat;
  color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.68;
  -webkit-font-smoothing:antialiased;
  transition:background-color .5s var(--e-out),color .3s;
}
::selection{background:var(--brand);color:#fff}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{font-family:var(--f-display);letter-spacing:-.022em;line-height:1.2}
.num{font-variant-numeric:tabular-nums}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:99px;border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3)}

/* ═══ HEADER ═══ */
header.top{
  position:sticky;top:0;z-index:60;
  background:color-mix(in srgb,var(--surface) 80%,transparent);
  backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);
  border-bottom:1px solid var(--line);
}
.top-in{max-width:1280px;margin:0 auto;padding:.65rem 1.1rem;display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.brandwrap{display:flex;align-items:center;gap:.65rem;min-width:0;flex:1}
.mark{
  width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;
  font-weight:800;font-size:.8rem;letter-spacing:-.02em;text-decoration:none;
  box-shadow:0 4px 14px var(--brand-ring);
  transition:transform .3s var(--e-spring),box-shadow .3s;
}
.mark:hover{transform:rotate(-8deg) scale(1.08);box-shadow:var(--sh-3);text-decoration:none}
.top h1{font-size:var(--t-h1);margin:0;font-weight:800;line-height:1.25;min-width:0}
.top h1 .sub{display:block;font-size:var(--t-xs);color:var(--ink-2);font-weight:500;letter-spacing:0;
  margin-top:.1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tools{margin-left:auto;display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}

button,select,input[type=search]{
  font:inherit;font-size:var(--t-sm);font-weight:600;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:var(--r-sm);padding:.4rem .72rem;cursor:pointer;
  position:relative;overflow:hidden;
  transition:transform .18s var(--e-spring),border-color .2s,background .2s,box-shadow .2s,color .2s;
}
button:hover{transform:translateY(-1.5px);border-color:var(--brand);box-shadow:var(--sh-1)}
button:active{transform:translateY(0) scale(.97)}
button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible{outline:none;box-shadow:var(--sh-glow)}
input[type=search]{min-width:190px;cursor:text;font-weight:500}
input[type=search]:focus{border-color:var(--brand)}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--surface-2);padding:2px;gap:2px}
.seg button{border:0;border-radius:calc(var(--r-sm) - 2px);padding:.32rem .68rem;background:transparent;box-shadow:none}
.seg button:hover{transform:none;background:var(--surface)}
.seg button[aria-pressed="true"]{background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;box-shadow:0 2px 8px var(--brand-ring)}

.ripple{position:absolute;border-radius:50%;transform:scale(0);background:currentColor;opacity:.25;animation:rip .55s linear;pointer-events:none}
@keyframes rip{to{transform:scale(3.4);opacity:0}}

.progress{position:absolute;left:0;bottom:-1px;height:2.5px;width:0;
  background:linear-gradient(90deg,var(--brand),var(--legal),var(--ej));transition:width .1s linear}

/* ═══ LAYOUT ═══ */
.layout{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:270px 1fr;gap:1.8rem;padding:1.4rem 1.1rem 5rem}
main{min-width:0}

/* ═══ SIDEBAR ═══ */
nav.side{
  position:sticky;top:76px;align-self:start;max-height:calc(100vh - 96px);overflow:auto;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:.85rem;box-shadow:var(--sh-1);
}
nav.side h2{font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);
  margin:.5rem .4rem .5rem;font-weight:800}
nav.side h2:first-child{margin-top:.1rem}
nav.side a{
  display:flex;align-items:baseline;gap:.5rem;padding:.36rem .55rem;border-radius:var(--r-sm);
  text-decoration:none;color:var(--ink-2);font-size:var(--t-sm);font-weight:500;
  position:relative;transition:background .22s,color .22s,transform .22s var(--e-out);
}
nav.side a:hover{background:var(--surface-2);color:var(--ink);transform:translateX(3px);text-decoration:none}
nav.side a.on{background:var(--brand-soft);color:var(--brand);font-weight:700}
nav.side a.on::before{content:"";position:absolute;left:-.85rem;top:20%;bottom:20%;width:3px;
  border-radius:0 3px 3px 0;background:var(--brand)}
nav.side a b{color:var(--ink-3);font-weight:800;font-size:var(--t-xs);font-variant-numeric:tabular-nums;flex:none;min-width:1.9em}
nav.side a.on b{color:var(--brand)}
.navtoggle{display:none}

/* ═══ TARJETAS ═══ */
section.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:1.35rem 1.5rem;margin-bottom:1.1rem;box-shadow:var(--sh-1);
  transition:box-shadow .3s var(--e-out),border-color .3s;
}
section.card:hover{box-shadow:var(--sh-2)}
section.card>h2{
  margin:0 0 1rem;font-size:var(--t-h2);font-weight:800;
  display:flex;align-items:center;gap:.6rem;
}
section.card>h2::before{
  content:"";width:4px;height:1.05em;border-radius:99px;flex:none;
  background:linear-gradient(180deg,var(--brand),var(--brand-2));
}

/* ═══ ARTÍCULO ═══ */
.art{scroll-margin-top:86px;padding-top:.4rem}
.art + .art{margin-top:1.6rem;padding-top:1.6rem;border-top:1px dashed var(--line)}
.art h2{display:flex;flex-wrap:wrap;gap:.5rem;align-items:baseline;font-size:var(--t-h3);
  margin:0 0 .25rem;font-weight:800;letter-spacing:-.015em}
.art h2 .num{
  color:var(--brand);font-weight:800;font-family:var(--f-display);
  background:var(--brand-soft);padding:.1rem .5rem;border-radius:var(--r-sm);
  font-size:.92em;letter-spacing:-.02em;
}
.ubic{font-size:var(--t-xs);color:var(--ink-3);margin:0 0 .8rem;font-weight:600;
  letter-spacing:.03em;text-transform:uppercase}

/* ═══ IDEA CLAVE ═══ */
.idea{
  background:linear-gradient(100deg,var(--brand-soft),color-mix(in srgb,var(--brand-soft) 40%,transparent));
  border-left:4px solid var(--brand);border-radius:0 var(--r-md) var(--r-md) 0;
  padding:.75rem 1rem;font-weight:650;margin:.7rem 0 1rem;position:relative;
  font-size:.97rem;line-height:1.55;
}

/* ═══ ACORDEÓN ═══ */
details.panel{
  border:1px solid var(--line);border-radius:var(--r-md);margin:.6rem 0;
  background:var(--surface);overflow:hidden;
  transition:border-color .25s,box-shadow .25s,background .25s;
}
details.panel:hover{border-color:var(--line-strong)}
details.panel[open]{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-ring)}
details.panel>summary{
  cursor:pointer;padding:.62rem .9rem;font-weight:700;font-size:.93rem;
  list-style:none;display:flex;align-items:center;gap:.55rem;
  transition:background .2s,color .2s;
}
details.panel>summary:hover{background:var(--surface-2)}
details.panel[open]>summary{background:var(--brand-soft);color:var(--brand)}
details.panel>summary::-webkit-details-marker{display:none}
details.panel>summary::before{
  content:"";width:16px;height:16px;flex:none;border-radius:5px;
  background:var(--brand-soft);position:relative;transition:transform .3s var(--e-spring),background .25s;
}
details.panel>summary::after{
  content:"";position:absolute;width:0;height:0;margin-left:5px;
  border:4px solid transparent;border-left-color:var(--brand);
  transition:transform .3s var(--e-spring);
}
details.panel[open]>summary::before{background:var(--surface)}
details.panel[open]>summary::after{transform:rotate(90deg) translateX(-1px)}
details.panel .body{padding:.3rem 1rem 1rem;font-size:.95rem;animation:slidein .35s var(--e-out)}
@keyframes slidein{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* ═══ TEXTO LEGAL ═══ */
.legal{
  background:var(--legal-bg);border-left:4px solid var(--legal);
  border-radius:0 var(--r-md) var(--r-md) 0;padding:.85rem 1.05rem;
  font-family:var(--f-legal);font-size:.95rem;line-height:1.7;
}
.legal p{margin:.45rem 0}
.legal .lbl{
  font-family:var(--f-body);font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;
  color:var(--legal);font-weight:800;display:block;margin-bottom:.4rem;
}

/* ═══ CAJAS SEMÁNTICAS ═══ */
.box{
  border-left:4px solid var(--line);border-radius:0 var(--r-md) var(--r-md) 0;
  padding:.72rem .95rem;margin:.65rem 0;font-size:.94rem;
  transition:transform .25s var(--e-out),box-shadow .25s;
}
.box:hover{transform:translateX(3px);box-shadow:var(--sh-1)}
.box.ej{background:var(--ej-bg);border-color:var(--ej)}
.box.warn{background:var(--warn-bg);border-color:var(--warn)}
.box.exc{background:var(--exc-bg);border-color:var(--exc)}
.box .lbl{font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;font-weight:800;
  display:block;margin-bottom:.3rem}
.box.ej .lbl{color:var(--ej)}
.box.warn .lbl{color:var(--warn)}
.box.exc .lbl{color:var(--exc)}

.interp{
  border:1px dashed var(--warn);background:color-mix(in srgb,var(--warn-bg) 45%,transparent);
  border-radius:var(--r-md);padding:.65rem .9rem;font-size:.9rem;margin:.6rem 0;
}
.interp .lbl{font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;color:var(--warn);font-weight:800;display:block}

/* ═══ TABLAS ═══ */
table{width:100%;border-collapse:separate;border-spacing:0;font-size:.9rem;margin:.7rem 0;
  border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
th,td{padding:.5rem .68rem;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
td + td, th + th{border-left:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th{background:var(--surface-2);font-size:var(--t-xs);font-weight:800;letter-spacing:.05em;
  text-transform:uppercase;color:var(--ink-2);position:sticky;top:0}
tbody tr{transition:background .18s}
tbody tr:nth-child(even){background:color-mix(in srgb,var(--surface-2) 45%,transparent)}
tbody tr:hover{background:var(--brand-soft)}
th.sortable{cursor:pointer;user-select:none;transition:color .2s,background .2s}
th.sortable:hover{color:var(--brand);background:var(--brand-soft)}
th.sortable::after{content:" ⇅";color:var(--ink-3);font-size:.7rem}

ul,ol{margin:.5rem 0 .5rem 1.2rem;padding:0}
li{margin:.26rem 0}
li::marker{color:var(--brand);font-weight:700}

/* ═══ TOOLTIPS ═══ */
.t{border-bottom:1.5px dotted var(--brand);cursor:help;position:relative;
  transition:background .2s,color .2s}
.t:hover{background:var(--brand-soft);color:var(--brand);border-radius:3px}
#tip{
  position:fixed;z-index:99;max-width:330px;background:var(--ink);color:var(--bg);
  padding:.6rem .78rem;border-radius:var(--r-md);font-size:.82rem;line-height:1.5;
  display:none;box-shadow:0 8px 30px rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.08);
}
html[data-theme="dark"] #tip{background:#f0f1f5;color:#15161c}

/* ═══ FLECHAS DE DIAGRAMA ═══
   Un <path> con stroke pero sin fill toma el valor inicial (negro) y el
   navegador cierra el trazo implícitamente: aparece un triángulo relleno
   entre sus extremos. Forzamos fill:none para dejar solo la línea + la
   punta del <marker>, que sí lleva su color. */
svg path[stroke]:not([fill]){fill:none}
svg polyline:not([fill]){fill:none}
svg line{fill:none}

/* ═══ SVG ═══ */
svg{max-width:100%;height:auto;display:block;margin:.9rem auto}
svg text{font-family:var(--f-body)}

/* ═══ BUSCADOR ═══ */
mark.hit{background:linear-gradient(180deg,transparent 55%,#ffe066 55%);color:inherit;
  border-radius:2px;padding:0 1px;font-weight:600}
html[data-theme="dark"] mark.hit{background:linear-gradient(180deg,transparent 55%,#8a6d00 55%);color:#fff}

/* ═══ UTILIDADES ═══ */
.hide{display:none !important}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.small{font-size:var(--t-sm);color:var(--ink-2)}
.chip{
  display:inline-block;font-size:var(--t-xs);padding:.16rem .55rem;border-radius:var(--r-full);
  background:var(--brand-soft);color:var(--brand);font-weight:800;letter-spacing:.02em;
}

/* ═══ HUECOS RELLENABLES ═══ */
.gap{
  display:inline-block;min-width:5.5em;border-bottom:2px solid var(--brand);
  text-align:center;font-weight:700;color:transparent;cursor:pointer;
  transition:color .3s,background .3s;
}
.gap.on,.gap:hover{color:var(--brand);background:var(--brand-soft);border-radius:4px 4px 0 0}

/* ═══ REVELAR SOLUCIÓN ═══ */
.revelar{
  background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;border-color:transparent;
  font-weight:700;
}
.revelar:hover{box-shadow:var(--sh-3)}
.sol{
  margin-top:.7rem;padding:.8rem 1rem;border-radius:var(--r-md);
  background:var(--ej-bg);border-left:4px solid var(--ej);
  animation:slidein .4s var(--e-out);
}

/* ═══ TEST ═══ */
.opt{
  display:block;padding:.55rem .85rem;margin:.35rem 0;border:1.5px solid var(--line);
  border-radius:var(--r-md);cursor:pointer;background:var(--surface);font-size:.94rem;
  transition:border-color .22s,background .22s,transform .22s var(--e-out);
}
.opt:hover{border-color:var(--brand);background:var(--brand-soft);transform:translateX(4px)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft);font-weight:650}
.opt.ko{border-color:var(--exc);background:var(--exc-bg)}
.opt input{margin-right:.5rem;accent-color:var(--brand)}

#tscore,#semres{
  font-family:var(--f-display);font-weight:800;font-size:1.15rem;letter-spacing:-.02em;
}

/* ═══════════════════════════════════════════════════════════════
   FLASHCARDS 3D · mazo con giro, vuelo de salida y sheen
   ═══════════════════════════════════════════════════════════════ */
#flash{--fc-e:cubic-bezier(.2,.8,.25,1);--fc-h:250px}

/* — Escena — */
.fc-stage{
  perspective:1400px;perspective-origin:50% 45%;
  padding:.4rem 0 .2rem;position:relative;
}
.fc-deck{position:relative;height:var(--fc-h);will-change:transform}

/* — Cartas fantasma del mazo — */
.fc-ghost{
  position:absolute;inset:0;border-radius:var(--r-lg);
  background:var(--surface);border:1px solid var(--line);
  transition:transform .5s var(--fc-e),opacity .5s var(--fc-e);
}
.fc-ghost.g1{transform:translateY(9px) scale(.972);opacity:.75}
.fc-ghost.g2{transform:translateY(18px) scale(.944);opacity:.45}
.fc-deck.empty .fc-ghost{opacity:0;transform:translateY(26px) scale(.9)}

/* — Elevación durante el giro — */
.fc-lift{position:absolute;inset:0;transform-style:preserve-3d}
.fc-lift.lift{animation:fcLift .78s var(--fc-e)}
@keyframes fcLift{
  0%,100%{transform:scale(1) translateY(0)}
  45%{transform:scale(1.055) translateY(-16px)}
}
.fc-lift.out-ok{animation:fcOut .5s cubic-bezier(.5,0,.75,0) forwards}
.fc-lift.out-ko{animation:fcOutKo .5s cubic-bezier(.5,0,.75,0) forwards}
.fc-lift.in{animation:fcIn .48s var(--fc-e)}
@keyframes fcOut{
  0%{transform:translateX(0) rotate(0) scale(1);opacity:1}
  100%{transform:translateX(130%) rotate(17deg) scale(.85);opacity:0}
}
@keyframes fcOutKo{
  0%{transform:translateX(0) rotate(0) scale(1);opacity:1}
  100%{transform:translateX(-130%) rotate(-17deg) scale(.85);opacity:0}
}
@keyframes fcIn{
  0%{transform:translateY(26px) scale(.9);opacity:0}
  100%{transform:translateY(0) scale(1);opacity:1}
}

/* — La carta — */
.fc-card{
  position:absolute;inset:0;transform-style:preserve-3d;
  transition:transform .78s var(--fc-e);
  cursor:pointer;border-radius:var(--r-lg);
}
.fc-card:focus-visible{outline:none}
.fc-card:focus-visible .fc-face{box-shadow:var(--sh-glow),var(--sh-2)}

/* — Caras — */
.fc-face{
  position:absolute;inset:0;border-radius:var(--r-lg);
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  padding:2rem 2.2rem;text-align:center;overflow:hidden;
  box-shadow:var(--sh-2);
  transition:box-shadow .4s var(--fc-e);
}
.fc-card:hover .fc-face{box-shadow:var(--sh-3)}

/* Anverso · pregunta */
.fc-front{
  background:
    radial-gradient(120% 90% at 50% -20%, var(--brand-soft) 0%, transparent 60%),
    var(--surface);
  border:1.5px solid var(--line);color:var(--ink);
}
/* Reverso · respuesta */
.fc-back{
  transform:rotateY(180deg);
  background:linear-gradient(145deg,var(--brand) 0%,#6d4bf7 45%,var(--c5,#0891b2) 130%);
  border:1.5px solid transparent;color:#fff;
}
html[data-theme="dark"] .fc-back{
  background:linear-gradient(145deg,#5f45c9 0%,#4b3aa8 45%,#0e6b85 130%);
}
.fc-back .fc-txt{color:#fff}
.fc-back b,.fc-back strong{color:#fff;font-weight:800}

/* — Sheen que barre al girar — */
.fc-face::after{
  content:"";position:absolute;top:-60%;left:-70%;width:55%;height:220%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.42),transparent);
  transform:rotate(18deg);opacity:0;pointer-events:none;
}
.fc-lift.lift .fc-face::after{animation:fcSheen .78s var(--fc-e)}
@keyframes fcSheen{
  0%{opacity:0;left:-70%}
  35%{opacity:1}
  100%{opacity:0;left:150%}
}

/* — Etiqueta superior — */
.fc-tag{
  position:absolute;top:1rem;left:1.15rem;
  font-size:var(--t-xs);font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  display:inline-flex;align-items:center;gap:.4rem;
}
.fc-front .fc-tag{color:var(--brand)}
.fc-back .fc-tag{color:rgba(255,255,255,.9)}
.fc-tag::before{
  content:"";width:7px;height:7px;border-radius:50%;background:currentColor;
  animation:fcPulse 2.2s ease-in-out infinite;
}
@keyframes fcPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.65)}}

/* — Índice tipo naipe — */
.fc-pip{
  position:absolute;font-family:var(--f-display);font-weight:800;
  font-size:.78rem;letter-spacing:-.02em;opacity:.34;font-variant-numeric:tabular-nums;
}
.fc-pip.tr{top:1rem;right:1.15rem}
.fc-pip.bl{bottom:1rem;left:1.15rem;transform:rotate(180deg)}
.fc-front .fc-pip{color:var(--ink-2)}
.fc-back .fc-pip{color:#fff;opacity:.55}

/* — Texto — */
.fc-txt{
  font-size:clamp(1rem,.9rem + .55vw,1.28rem);font-weight:650;line-height:1.5;
  max-width:44ch;letter-spacing:-.012em;
}
.fc-front .fc-txt{font-family:var(--f-display);font-weight:700}
.fc-back .fc-txt{font-weight:600;line-height:1.6}
.fc-hint{
  position:absolute;bottom:1rem;left:0;right:0;
  font-size:var(--t-xs);font-weight:600;letter-spacing:.02em;
  display:flex;align-items:center;justify-content:center;gap:.4rem;
}
.fc-front .fc-hint{color:var(--ink-3)}
.fc-back .fc-hint{color:rgba(255,255,255,.72)}
.fc-hint .kbd{
  font-family:var(--f-mono);font-size:.68rem;font-weight:700;padding:.1rem .32rem;
  border-radius:5px;border:1px solid currentColor;opacity:.75;
}

/* — Pantalla final — */
.fc-done{
  position:absolute;inset:0;border-radius:var(--r-lg);
  background:linear-gradient(150deg,var(--ok-soft),var(--surface) 70%);
  border:1.5px solid var(--ok);
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  text-align:center;padding:2rem;gap:.35rem;
  animation:fcIn .5s var(--fc-e);box-shadow:var(--sh-2);
}
.fc-done .seal{
  font-size:2.6rem;line-height:1;
  animation:fcSeal .7s cubic-bezier(.2,1.5,.4,1);
}
@keyframes fcSeal{0%{transform:scale(0) rotate(-25deg);opacity:0}60%{transform:scale(1.2) rotate(6deg)}100%{transform:scale(1) rotate(0);opacity:1}}
.fc-done h3{font-size:1.3rem;font-weight:800;margin:.2rem 0 0}
.fc-done p{margin:0;color:var(--ink-2);font-size:var(--t-sm)}

/* — Barra de progreso de la ronda — */
.fc-bar{
  height:6px;border-radius:99px;background:var(--surface-3);
  overflow:hidden;margin:.95rem 0 .8rem;position:relative;
}
.fc-bar i{
  display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--brand),var(--c5,#0891b2));
  transition:width .55s var(--fc-e);
}

/* — Controles — */
.fc-ctrls{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.fc-ctrls button{font-weight:700}
#fcok{border-color:var(--ok);color:var(--ok)}
#fcok:hover{background:var(--ok);color:#fff;border-color:var(--ok)}
#fcko{border-color:var(--warn);color:var(--warn)}
#fcko:hover{background:var(--warn);color:#fff;border-color:var(--warn)}
#fcflip{background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;border-color:transparent}
#fcflip:hover{box-shadow:var(--sh-3)}

.fc-score{display:inline-flex;gap:.45rem;margin-left:auto;align-items:center}
.fc-pill{
  font-size:var(--t-xs);font-weight:800;padding:.24rem .6rem;border-radius:var(--r-full);
  font-variant-numeric:tabular-nums;border:1px solid;
}
.fc-pill.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.fc-pill.ko{color:var(--warn);border-color:var(--warn);background:var(--warn-bg)}
.fc-pill.left{color:var(--ink-2);border-color:var(--line);background:var(--surface-2)}
.fc-pill.bump{animation:fcBump .45s var(--e-spring)}
@keyframes fcBump{0%{transform:scale(1)}45%{transform:scale(1.28)}100%{transform:scale(1)}}

@media(max-width:620px){
  #flash{--fc-h:270px}
  .fc-face{padding:1.7rem 1.3rem}
  .fc-score{margin-left:0;width:100%}
}
@media(prefers-reduced-motion:reduce){
  .fc-card{transition:none}
  .fc-lift.lift,.fc-lift.in,.fc-lift.out-ok,.fc-lift.out-ko,.fc-face::after{animation:none !important}
}
@media print{.fc-stage,.fc-ctrls,.fc-bar{display:none !important}}
/* ═══ RESPUESTA ESTRUCTURADA ═══ */
.fc-face{justify-content:center}
.fc-face.struct{justify-content:flex-start;text-align:left;padding-top:3.1rem;padding-bottom:3.1rem}
.fc-body{
  width:100%;max-width:46ch;margin:0 auto;
  overflow-y:auto;max-height:100%;
  scrollbar-width:thin;
}
.fc-body::-webkit-scrollbar{width:5px}
.fc-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.35);border-radius:99px;border:0}
.fc-front .fc-body::-webkit-scrollbar-thumb{background:var(--line-strong)}

/* — Veredicto Sí / No — */
.fc-verdict{
  display:inline-flex;align-items:center;gap:.35rem;
  font-family:var(--f-display);font-weight:800;font-size:.82rem;
  letter-spacing:.06em;text-transform:uppercase;
  padding:.26rem .72rem;border-radius:var(--r-full);margin-bottom:.85rem;
  border:1.5px solid;animation:fcPopIn .45s var(--e-spring) backwards;animation-delay:.34s;
}
.fc-verdict.si{background:rgba(255,255,255,.16);border-color:rgba(190,255,215,.85);color:#d8ffe9}
.fc-verdict.no{background:rgba(255,255,255,.16);border-color:rgba(255,205,205,.85);color:#ffdedd}
@keyframes fcPopIn{0%{opacity:0;transform:scale(.7) translateY(6px)}100%{opacity:1;transform:none}}

/* — Párrafo — */
.fc-p{margin:0;font-size:clamp(1rem,.92rem + .45vw,1.2rem);font-weight:600;line-height:1.6}
.fc-face.struct .fc-p{font-size:clamp(.96rem,.9rem + .35vw,1.1rem)}

/* — Lista enumerada — */
.fc-list{list-style:none;margin:0;padding:0;display:grid;gap:.5rem;counter-reset:fc}
.fc-list li{
  counter-increment:fc;position:relative;margin:0;
  padding:.42rem .6rem .42rem 2.5rem;border-radius:var(--r-sm);
  background:rgba(255,255,255,.11);
  font-size:clamp(.92rem,.88rem + .3vw,1.04rem);font-weight:600;line-height:1.45;
  animation:fcRow .42s var(--e-out) backwards;
}
.fc-list li::before{
  content:counter(fc);position:absolute;left:.6rem;top:50%;transform:translateY(-50%);
  width:1.6rem;height:1.6rem;border-radius:50%;
  display:grid;place-items:center;
  background:rgba(255,255,255,.9);color:var(--brand);
  font-family:var(--f-display);font-weight:800;font-size:.78rem;
  font-variant-numeric:tabular-nums;
}
.fc-list.alpha li::before{content:counter(fc,lower-alpha)}
.fc-list li:nth-child(1){animation-delay:.36s}
.fc-list li:nth-child(2){animation-delay:.42s}
.fc-list li:nth-child(3){animation-delay:.48s}
.fc-list li:nth-child(4){animation-delay:.54s}
.fc-list li:nth-child(5){animation-delay:.60s}
.fc-list li:nth-child(n+6){animation-delay:.66s}
@keyframes fcRow{0%{opacity:0;transform:translateX(-12px)}100%{opacity:1;transform:none}}

/* — Cláusulas contrapuestas — */
.fc-clauses{display:grid;gap:.45rem}
.fc-clauses p{
  margin:0;padding:.45rem .7rem .45rem .95rem;border-radius:0 var(--r-sm) var(--r-sm) 0;
  background:rgba(255,255,255,.11);border-left:3px solid rgba(255,255,255,.55);
  font-size:clamp(.92rem,.88rem + .3vw,1.04rem);font-weight:600;line-height:1.5;
  animation:fcRow .42s var(--e-out) backwards;
}
.fc-clauses p:nth-child(1){animation-delay:.36s}
.fc-clauses p:nth-child(2){animation-delay:.44s}
.fc-clauses p:nth-child(3){animation-delay:.52s}

/* — Negritas resaltadas en el reverso — */
.fc-back .fc-body b,.fc-back .fc-body strong{
  font-weight:800;background:rgba(255,255,255,.2);
  padding:.03em .3em;border-radius:5px;
  box-decoration-break:clone;-webkit-box-decoration-break:clone;
}

/* — Cita legal al pie — */
.fc-cite{
  position:absolute;bottom:.95rem;left:0;right:0;
  display:inline-flex;align-items:center;justify-content:center;gap:.4rem;
  font-family:var(--f-mono);font-size:.74rem;font-weight:700;letter-spacing:.02em;
  color:rgba(255,255,255,.82);
  animation:fcPopIn .5s var(--e-out) backwards;animation-delay:.5s;
}
.fc-cite::before,.fc-cite::after{
  content:"";height:1px;width:clamp(18px,10%,52px);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.45));
}
.fc-cite::after{background:linear-gradient(90deg,rgba(255,255,255,.45),transparent)}
.fc-cite .s{font-size:.9rem;opacity:.75;font-family:var(--f-legal)}
.fc-front .fc-cite{color:var(--ink-3)}
.fc-front .fc-cite::before{background:linear-gradient(90deg,transparent,var(--line-strong))}
.fc-front .fc-cite::after{background:linear-gradient(90deg,var(--line-strong),transparent)}

/* la pista se oculta si hay cita, para no amontonar */
.fc-back .fc-cite ~ .fc-hint,.fc-back .fc-hint.muted{display:none}

@media(max-width:620px){
  #flash{--fc-h:320px}
  .fc-face.struct{padding-top:2.9rem;padding-bottom:2.8rem}
  .fc-list li{padding-left:2.3rem}
}
@media(prefers-reduced-motion:reduce){
  .fc-verdict,.fc-list li,.fc-clauses p,.fc-cite{animation:none !important}
}

/* ═══ SEMÁFORO ═══ */
.sembtn{
  border-radius:var(--r-full);padding:.32rem .7rem;font-weight:700;font-size:var(--t-sm);
}
.sembtn[data-v="g"]:hover,.sembtn.on[data-v="g"]{background:var(--ok);color:#fff;border-color:var(--ok)}
.sembtn[data-v="y"]:hover,.sembtn.on[data-v="y"]{background:var(--mid);color:#3d2f00;border-color:var(--mid)}
.sembtn[data-v="r"]:hover,.sembtn.on[data-v="r"]{background:var(--exc);color:#fff;border-color:var(--exc)}

/* ═══ CTA DE BLOQUE ═══ */
a.blk{
  display:inline-flex;align-items:center;gap:.5rem;
  background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;
  padding:.5rem .95rem;border-radius:var(--r-sm);font-weight:700;font-size:var(--t-sm);
  text-decoration:none;box-shadow:0 2px 10px var(--brand-ring);
  transition:transform .22s var(--e-spring),box-shadow .25s,gap .25s var(--e-out);
}
a.blk:hover{transform:translateY(-2px);box-shadow:var(--sh-3);gap:.75rem;text-decoration:none}
a.blk::after{content:"→"}
a.blk:active{transform:translateY(0) scale(.98)}

/* ═══ REVEAL ═══ */
.rv{opacity:0;transform:translateY(20px);transition:opacity .6s var(--e-out),transform .6s var(--e-out)}
.rv.in{opacity:1;transform:none}

/* ═══ RESPONSIVE ═══ */
@media(max-width:960px){
  .layout{grid-template-columns:1fr;padding-top:.9rem;gap:1rem}
  nav.side{position:static;max-height:none}
  nav.side.collapsed .navbody{display:none}
  .navtoggle{display:block;width:100%;text-align:left;font-weight:700}
  .grid2{grid-template-columns:1fr}
  .top h1 .sub{white-space:normal}
}
@media(max-width:620px){
  .top-in{padding:.55rem .8rem}
  .tools{width:100%;margin-left:0}
  input[type=search]{flex:1;min-width:0}
  section.card{padding:1.05rem 1rem;border-radius:var(--r-md)}
  table{font-size:.82rem}
  th,td{padding:.4rem .5rem}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
  .rv{opacity:1;transform:none}
}
@media print{
  header.top,nav.side,.tools,.noprint,.progress{display:none !important}
  body{background:#fff;background-image:none;font-size:11pt;color:#000}
  .layout{display:block;max-width:none;padding:0}
  section.card{border:0;padding:0;margin:0 0 1rem;break-inside:avoid;box-shadow:none}
  details.panel{border:0;box-shadow:none}
  details.panel .body{display:block !important}
  details.panel>summary{padding-left:0}
  .art{break-inside:avoid}
  .rv{opacity:1;transform:none}
  a{color:#000;text-decoration:none}
}


/* ═══ ALTURA ADAPTATIVA DE LA TARJETA ═══ */
.fc-deck{transition:height .45s var(--fc-e)}
.fc-body{max-height:none;overflow:visible}
.fc-measure{
  position:absolute;left:0;right:0;top:0;height:auto;
  visibility:hidden;pointer-events:none;z-index:-1;
}
.fc-measure .fc-face{
  position:relative;inset:auto;height:auto;min-height:0;
  box-shadow:none;backface-visibility:visible;transform:none;
}
.fc-measure .fc-body{max-height:none;overflow:visible}
.fc-measure .fc-face::after{display:none}

/* ═══ MOSTRAR / OCULTAR ÍNDICE LATERAL ═══ */
.layout{transition:grid-template-columns .42s var(--e-out)}
.layout.nonav{grid-template-columns:0 1fr;gap:0}
.layout.nonav>nav.side{
  opacity:0;transform:translateX(-14px);pointer-events:none;
  padding:0;border-width:0;overflow:hidden;width:0;min-width:0;
}
nav.side{
  transition:opacity .3s var(--e-out),transform .38s var(--e-out);
  overflow-x:hidden;
}
#navhide .ic{display:inline-block;transition:transform .35s var(--e-spring);font-size:.95em;line-height:1}
#navhide[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
#navhide[aria-pressed="true"] .ic{transform:rotate(90deg)}
@media(max-width:960px){#navhide{display:none}}

/* ═══════════════════════════════════════════════════════════════
   LECTURA EN VOZ ALTA (TTS) del texto legal
   ═══════════════════════════════════════════════════════════════ */
.tts-bar{
  display:flex;align-items:center;gap:.45rem;flex-wrap:wrap;
  margin:.15rem 0 .7rem;
}
.tts-bar button{
  font-size:var(--t-xs);font-weight:700;padding:.3rem .62rem;
  border-radius:var(--r-full);border:1px solid var(--legal);
  background:transparent;color:var(--legal);
  display:inline-flex;align-items:center;gap:.35rem;line-height:1.2;
}
.tts-bar button:hover{background:var(--legal);color:var(--surface);border-color:var(--legal)}
.tts-bar button[hidden]{display:none}
.tts-bar .tts-play.on{background:var(--legal);color:var(--surface)}

/* Ondas de audio mientras lee */
.tts-wave{display:inline-flex;align-items:flex-end;gap:2px;height:11px}
.tts-wave i{
  width:2.5px;background:currentColor;border-radius:2px;height:35%;
  animation:ttsW .9s ease-in-out infinite;
}
.tts-wave i:nth-child(2){animation-delay:.15s}
.tts-wave i:nth-child(3){animation-delay:.3s}
.tts-wave i:nth-child(4){animation-delay:.45s}
@keyframes ttsW{0%,100%{height:32%}50%{height:100%}}

.tts-time{
  font-family:var(--f-mono);font-size:.7rem;font-weight:700;
  color:var(--ink-3);font-variant-numeric:tabular-nums;
}

/* Frase que se está leyendo */
.tts-s{transition:background .25s,color .25s;border-radius:3px}
.tts-s.now{
  background:linear-gradient(180deg,transparent 8%,color-mix(in srgb,var(--legal) 26%,transparent) 8%);
  box-shadow:0 0 0 2px color-mix(in srgb,var(--legal) 16%,transparent);
}
html[data-theme="dark"] .tts-s.now{
  background:linear-gradient(180deg,transparent 8%,color-mix(in srgb,var(--legal) 34%,transparent) 8%);
}
.legal.tts-on{box-shadow:0 0 0 3px color-mix(in srgb,var(--legal) 20%,transparent)}

/* ═══ Reproductor flotante ═══ */
.tts-mini{
  position:fixed;left:50%;bottom:1.1rem;transform:translateX(-50%) translateY(140%);
  z-index:80;display:flex;align-items:center;gap:.6rem;
  background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  border:1px solid var(--line);border-radius:var(--r-full);
  padding:.5rem .7rem .5rem .95rem;box-shadow:var(--sh-3);
  transition:transform .45s var(--e-spring),opacity .3s;opacity:0;pointer-events:none;
  max-width:min(94vw,540px);
}
.tts-mini.show{transform:translateX(-50%) translateY(0);opacity:1;pointer-events:auto}
.tts-mini .lbl{
  font-size:var(--t-xs);font-weight:800;color:var(--legal);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:16ch;
}
.tts-mini button{
  border-radius:50%;width:32px;height:32px;padding:0;display:grid;place-items:center;
  font-size:.8rem;border:1px solid var(--line);flex:none;
}
.tts-mini button.main{
  width:38px;height:38px;font-size:.95rem;
  background:linear-gradient(140deg,var(--legal),var(--brand));color:#fff;border-color:transparent;
}
.tts-mini .bar{
  flex:1;min-width:70px;height:5px;border-radius:99px;background:var(--surface-3);overflow:hidden;
}
.tts-mini .bar i{display:block;height:100%;width:0;background:var(--legal);
  border-radius:99px;transition:width .35s var(--e-out)}

/* ═══ Panel de ajustes de voz ═══ */
.tts-back{
  position:fixed;inset:0;z-index:90;background:rgba(10,10,18,.45);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  display:grid;place-items:center;padding:1rem;
  opacity:0;pointer-events:none;transition:opacity .3s var(--e-out);
}
.tts-back.show{opacity:1;pointer-events:auto}
.tts-panel{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--sh-3);width:min(94vw,470px);max-height:88vh;overflow:auto;
  padding:1.3rem 1.4rem;transform:translateY(16px) scale(.97);
  transition:transform .38s var(--e-spring);
}
.tts-back.show .tts-panel{transform:none}
.tts-panel h3{
  font-size:1.12rem;font-weight:800;margin:0 0 .25rem;
  display:flex;align-items:center;gap:.5rem;
}
.tts-panel .sub{font-size:var(--t-sm);color:var(--ink-2);margin:0 0 1.1rem}
.tts-row{margin-bottom:1.05rem}
.tts-row > label{
  display:block;font-size:var(--t-xs);font-weight:800;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-2);margin-bottom:.4rem;
}
.tts-seg{display:flex;gap:3px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:3px}
.tts-seg button{
  flex:1;border:0;background:transparent;border-radius:calc(var(--r-sm) - 3px);
  padding:.42rem .3rem;font-size:var(--t-sm);font-weight:700;box-shadow:none;
}
.tts-seg button:hover{transform:none;background:var(--surface)}
.tts-seg button[aria-pressed="true"]{
  background:linear-gradient(140deg,var(--legal),var(--brand));color:#fff;
}
.tts-panel select{
  width:100%;padding:.5rem .6rem;border-radius:var(--r-sm);
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  font-size:var(--t-sm);font-weight:600;cursor:pointer;

const GLOSARIO={"interesado": "Interesado: quien está legitimado para promover un procedimiento o intervenir en él porque es titular de derechos o intereses legítimos afectados por la decisión (art. 4 de la Ley 39/2015).", "conten": "Recurso contencioso-administrativo: impugnación ante los juzgados y tribunales de lo contencioso-administrativo, es decir, ya fuera de la propia Administración.", "silencio": "Silencio administrativo: efecto que la ley anuda a la falta de resolución expresa en plazo. Puede ser estimatorio (positivo) o desestimatorio (negativo) según el procedimiento.", "habil": "Días hábiles: se excluyen del cómputo los sábados, los domingos y los declarados festivos (art. 30.2 de la Ley 39/2015).", "pleno": "Pleno: órgano colegiado formado por todos los concejales o diputados de la entidad local.", "nulidad": "Nulidad de pleno derecho: el vicio más grave. El acto se considera radicalmente inválido desde el origen, no se convalida y puede atacarse en cualquier momento.", "anulabilidad": "Anulabilidad: invalidez de menor intensidad. El acto produce efectos mientras no se anule, es convalidable y solo puede combatirse dentro de los plazos de recurso.", "desviacion": "Desviación de poder: ejercer una potestad administrativa para un fin distinto del previsto por el ordenamiento. Es causa expresa de anulabilidad (art. 48.1).", "amparo": "Derechos susceptibles de amparo constitucional: los de los arts. 14 a 29 y 30.2 de la Constitución —igualdad, libertades y derechos fundamentales, objeción de conciencia—.", "dictamen": "Dictamen del Consejo de Estado u órgano consultivo autonómico: informe que en la revisión de oficio de actos nulos debe ser <b>favorable</b>; sin él no cabe declarar la nulidad.", "consultivo": "Órgano consultivo equivalente: en Andalucía, el Consejo Consultivo de Andalucía, que emite el dictamen exigido por el art. 106.", "lesividad": "Declaración de lesividad: acto por el que la Administración declara que un acto propio favorable al interesado es lesivo para el interés público, como paso previo obligado para impugnarlo ante los tribunales.", "revocacion": "Revocación: retirada por la Administración de sus propios actos de gravamen o desfavorables, con los límites del art. 109.1.", "gravamen": "Acto de gravamen: el que impone al interesado una obligación, una carga o una restricción. Su contrario es el acto favorable o declarativo de derechos.", "conversion": "Conversión: un acto inválido que contiene los elementos de otro distinto produce los efectos de ese otro acto (art. 50).", "conservacion": "Conservación: mantenimiento de los actos y trámites cuyo contenido habría sido idéntico aunque no se hubiera cometido la infracción (art. 51).", "convalidacion": "Convalidación: subsanación por la Administración de los vicios de un acto anulable, que produce efecto desde su fecha (art. 52).", "caducidad": "Caducidad del procedimiento: terminación por el transcurso del plazo máximo sin resolver en procedimientos iniciados de oficio susceptibles de producir efectos desfavorables.", "firme": "Acto firme en vía administrativa: aquel que ya no admite recurso administrativo ordinario, por haberse agotado la vía o por haber transcurrido el plazo para recurrir.", "errormaterial": "Error material, de hecho o aritmético: equivocación evidente, apreciable sin necesidad de interpretación jurídica. Puede rectificarse en cualquier momento (art. 109.2)."};
const LABELS={"interesado": "Interesado", "conten": "Recurso contencioso-administrativo", "silencio": "Silencio administrativo", "habil": "Días hábiles", "pleno": "Pleno", "nulidad": "Nulidad de pleno derecho", "anulabilidad": "Anulabilidad", "desviacion": "Desviación de poder", "amparo": "Derechos de amparo constitucional", "dictamen": "Dictamen del Consejo de Estado", "consultivo": "Órgano consultivo autonómico", "lesividad": "Declaración de lesividad", "revocacion": "Revocación", "gravamen": "Acto de gravamen", "conversion": "Conversión", "conservacion": "Conservación", "convalidacion": "Convalidación", "caducidad": "Caducidad", "firme": "Acto firme", "errormaterial": "Error material"};

<script>
const ARTS=[{"n": 47, "t": "Nulidad de pleno derecho", "ubic": "Título III (De los actos administrativos) ▸ Capítulo III (Nulidad y anulabilidad)", "idea": "Siete causas de nulidad para los actos y cuatro para los reglamentos.", "literal": "<p>1. Los actos de las Administraciones Públicas son nulos de pleno derecho en los casos siguientes:</p><p>a) Los que lesionen los derechos y libertades susceptibles de amparo constitucional.</p><p>b) Los dictados por órgano manifiestamente incompetente por razón de la materia o del territorio.</p><p>c) Los que tengan un contenido imposible.</p><p>d) Los que sean constitutivos de infracción penal o se dicten como consecuencia de ésta.</p><p>e) Los dictados prescindiendo total y absolutamente del procedimiento legalmente establecido o de las normas que contienen las reglas esenciales para la formación de la voluntad de los órganos colegiados.</p><p>f) Los actos expresos o presuntos contrarios al ordenamiento jurídico por los que se adquieren facultades o derechos cuando se carezca de los requisitos esenciales para su adquisición.</p><p>g) Cualquier otro que se establezca expresamente en una disposición con rango de Ley.</p><p>2. También serán nulas de pleno derecho las disposiciones administrativas que vulneren la Constitución, las leyes u otras disposiciones administrativas de rango superior, las que regulen materias reservadas a la Ley, y las que establezcan la retroactividad de disposiciones sancionadoras no favorables o restrictivas de derechos individuales.</p>", "dis": "<p><b>47.1 — actos nulos de pleno derecho:</b></p>\n<table><thead><tr><th>Letra</th><th>Causa</th><th>Ejemplo</th></tr></thead><tbody>\n<tr><td><b>a)</b></td><td>Lesionan derechos y libertades susceptibles de <span class=\"t\" data-k=\"amparo\">amparo constitucional</span></td><td>Denegar una licencia por la ideología del solicitante</td></tr>\n<tr><td><b>b)</b></td><td>Dictados por órgano <b>manifiestamente incompetente</b> por razón de <b>materia</b> o <b>territorio</b></td><td>Un ayuntamiento que sanciona por una infracción de competencia estatal</td></tr>\n<tr><td><b>c)</b></td><td>Contenido <b>imposible</b></td><td>Ordenar demoler un edificio que ya no existe</td></tr>\n<tr><td><b>d)</b></td><td>Constitutivos de <b>infracción penal</b> o dictados como consecuencia de esta</td><td>Licencia obtenida mediante cohecho</td></tr>\n<tr><td><b>e)</b></td><td>Dictados <b>prescindiendo total y absolutamente</b> del procedimiento o de las <b>reglas esenciales</b> de formación de la voluntad de los órganos colegiados</td><td>Sancionar sin expediente alguno</td></tr>\n<tr><td><b>f)</b></td><td>Actos <b>expresos o presuntos</b> contrarios al ordenamiento por los que se <b>adquieren facultades o derechos</b> careciendo de los <b>requisitos esenciales</b></td><td>Licencia por silencio a quien no reúne los requisitos</td></tr>\n<tr><td><b>g)</b></td><td>Cualquier otro establecido expresamente en una <b>disposición con rango de ley</b></td><td>Los actos con gasto sin crédito del art. 173.5 del TRLHL</td></tr>\n</tbody></table>\n<p><b>47.2 — disposiciones administrativas nulas:</b> las que <b>vulneren la Constitución, las leyes u otras disposiciones de rango superior</b> · las que <b>regulen materias reservadas a la ley</b> · y las que establezcan la <b>retroactividad</b> de disposiciones <b>sancionadoras no favorables</b> o <b>restrictivas de derechos individuales</b>.</p>", "llano": "<p>La nulidad es la sanción máxima y por eso la lista está cerrada: solo estos siete casos —más los que otra ley añada— y, para los reglamentos, esos tres supuestos. Fuera de ahí, el acto será anulable, pero no nulo.</p>", "porque": "<p>La nulidad de pleno derecho tiene efectos devastadores para la seguridad jurídica: no prescribe, no se convalida y arrastra los efectos ya producidos. Por eso el legislador la <b>tasa</b>. Y por eso cada causa exige un adjetivo intensificador: incompetencia <b>manifiesta</b>, prescindir <b>total y absolutamente</b>, requisitos <b>esenciales</b>. Sin ese grado, hay anulabilidad.</p>\n<p>La letra f) merece atención: es la respuesta a las licencias ganadas por silencio positivo por quien no cumplía los requisitos. Sin ella, el silencio se convertiría en una vía para obtener lo que la ley niega.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> un contrato firmado por quien no era el dueño de la casa: no es que esté mal hecho, es que no puede sostenerse.</li>\n<li><b>Real:</b> un ayuntamiento impone una sanción de 600 € sin instruir expediente ni dar audiencia. Prescindir <b>total y absolutamente</b> del procedimiento: nulidad por la letra e).</li>\n<li><b>Caso límite:</b> una licencia de apertura obtenida por silencio positivo para una actividad que la ordenanza prohíbe en esa zona. El interesado carecía de un <b>requisito esencial</b>: nulidad por la letra f).</li>\n</ul>", "noej": "<ul>\n<li><b>No es</b> nulidad la incompetencia <b>jerárquica</b>: no está entre las causas de la letra b), que solo cita materia y territorio. Sería anulabilidad, convalidable por el superior (art. 52.3).</li>\n<li><b>No es</b> nulidad la omisión de <b>un</b> trámite: hace falta prescindir <b>total y absolutamente</b> del procedimiento.</li>\n<li><b>No es</b> nulidad la simple infracción del ordenamiento: eso es anulabilidad (art. 48.1).</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 106 LPAC:</b> revisión de oficio de los actos nulos, en cualquier momento.</li>\n<li><b>Art. 37.2 LPAC:</b> nulidad de las resoluciones que vulneran un reglamento.</li>\n<li><b>Art. 173.5 del TRLHL</b> (documento 5): nulidad de los acuerdos que comprometen gasto sin crédito, ejemplo de la letra g).</li>\n<li><b>Art. 39.4 de la Ley 40/2015</b> (documento 2): efectos de la nulidad de una disposición sobre los actos firmes dictados a su amparo.</li>\n</ul>", "trampas": "<ul>\n<li>La incompetencia nula es la <b>manifiesta por materia o territorio</b>: la jerárquica, no.</li>\n<li>La letra e) exige prescindir <b>total y absolutamente</b>.</li>\n<li>La letra f) alcanza a los actos <b>presuntos</b>: el silencio no legaliza lo que no cumple requisitos esenciales.</li>\n<li>Son <b>siete</b> letras de actos y <b>tres</b> supuestos de disposiciones.</li>\n</ul>", "ancla": "<p><b>«A-B-C-D-E-F-G: Amparo · Barrio o materia · Contenido imposible · Delito · Estampida procedimental · Facultades sin requisitos · Ganancia legal.»</b></p>", "vis": "<svg viewBox=\"0 0 660 175\" role=\"img\" aria-label=\"Causas de nulidad de pleno derecho\">\n<rect x=\"205\" y=\"6\" width=\"250\" height=\"30\" rx=\"8\" fill=\"var(--exc)\" stroke=\"var(--exc)\"/>\n<text x=\"330\" y=\"26\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">NULIDAD DE PLENO DERECHO</text>\n<g font-size=\"10\" text-anchor=\"middle\" fill=\"currentColor\">\n<rect x=\"15\" y=\"50\" width=\"200\" height=\"66\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"115\" y=\"70\" font-weight=\"700\" fill=\"var(--exc)\">Quién y cómo</text><text x=\"115\" y=\"88\">b) incompetencia manifiesta</text><text x=\"115\" y=\"103\">e) sin procedimiento alguno</text>\n<rect x=\"230\" y=\"50\" width=\"200\" height=\"66\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"330\" y=\"70\" font-weight=\"700\" fill=\"var(--warn)\">Qué contiene</text><text x=\"330\" y=\"88\">c) contenido imposible</text><text x=\"330\" y=\"103\">d) infracción penal</text>\n<rect x=\"445\" y=\"50\" width=\"200\" height=\"66\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"545\" y=\"70\" font-weight=\"700\" fill=\"var(--acc)\">Qué vulnera o concede</text><text x=\"545\" y=\"88\">a) derechos de amparo</text><text x=\"545\" y=\"103\">f) derechos sin requisitos</text>\n</g>\n<text x=\"330\" y=\"138\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--ink2)\">g) y cualquier otro previsto en norma con rango de ley</text>\n<text x=\"330\" y=\"160\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--exc)\">47.2 · Reglamentos: rango superior · reserva de ley · retroactividad desfavorable</text>\n</svg>"}, {"n": 48, "t": "Anulabilidad", "ubic": "Título III (De los actos administrativos) ▸ Capítulo III (Nulidad y anulabilidad)", "idea": "Todo lo demás es anulable; y el defecto de forma, solo si impide el fin o causa indefensión.", "literal": "<p>1. Son anulables los actos de la Administración que incurran en cualquier infracción del ordenamiento jurídico, incluso la desviación de poder.</p><p>2. No obstante, el defecto de forma sólo determinará la anulabilidad cuando el acto carezca de los requisitos formales indispensables para alcanzar su fin o dé lugar a la indefensión de los interesados.</p><p>3. La realización de actuaciones administrativas fuera del tiempo establecido para ellas sólo implicará la anulabilidad del acto cuando así lo imponga la naturaleza del término o plazo.</p>", "dis": "<ul>\n<li><b>48.1 — regla general:</b> son <span class=\"t\" data-k=\"anulabilidad\">anulables</span> los actos que incurran en <b>cualquier infracción del ordenamiento jurídico</b>, <b>incluso la <span class=\"t\" data-k=\"desviacion\">desviación de poder</span></b>.</li>\n<li><b>48.2 — defecto de forma:</b> <b>solo</b> determina la anulabilidad cuando el acto <b>carezca de los requisitos formales indispensables para alcanzar su fin</b> o <b>dé lugar a la indefensión</b> de los interesados.</li>\n<li><b>48.3 — actuaciones fuera de plazo:</b> <b>solo</b> implican anulabilidad cuando <b>así lo imponga la naturaleza del término o plazo</b>.</li>\n</ul>\n<div class=\"box warn\"><span class=\"lbl\">Los dos filtros</span>Los apartados 2 y 3 son <b>filtros que reducen</b> la invalidez. No todo defecto formal invalida ni todo retraso invalida: hay que probar que se frustró el fin o que hubo <b>indefensión</b>, y que el plazo era <b>esencial</b>.</div>", "llano": "<p>La regla es simple: si el acto infringe el Derecho y no encaja en las causas de nulidad, es anulable. Pero si lo que falla es la forma o el plazo, la ley pide algo más: que ese defecto haya impedido cumplir el fin del trámite, que te haya dejado indefenso o que el plazo fuera de los que no admiten demora.</p>", "porque": "<p>Si cualquier irregularidad formal anulara el acto, la Administración quedaría paralizada y los procedimientos se repetirían indefinidamente por errores intrascendentes. El criterio es <b>antiformalista</b>: la forma sirve a un fin, y solo cuando ese fin se frustra la forma merece protección.</p>\n<p>La mención expresa de la <b>desviación de poder</b> tiene una razón histórica: es un vicio del <b>fin</b>, no de la forma ni del contenido, y podía discutirse si cabía en el concepto de infracción del ordenamiento. La ley zanja la duda.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> una carta con un error en el código postal que llega igualmente: el defecto no impide el fin.</li>\n<li><b>Real:</b> se omite el trámite de audiencia en un expediente sancionador: hay <b>indefensión</b>, luego anulabilidad (art. 48.2).</li>\n<li><b>Caso límite:</b> el informe preceptivo se emite dos días después del plazo interno previsto, sin que ello altere nada. No hay anulabilidad: la naturaleza del plazo no lo impone (art. 48.3).</li>\n</ul>", "noej": "<ul>\n<li><b>No es</b> anulable el acto por un error de numeración o de transcripción sin trascendencia: se rectifica (art. 109.2).</li>\n<li><b>No es</b> anulabilidad la infracción que encaja en el art. 47.1: eso es nulidad.</li>\n<li><b>No basta</b> alegar un defecto de forma: hay que acreditar la <b>indefensión</b> o la frustración del fin.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 47 LPAC:</b> causas tasadas de nulidad.</li>\n<li><b>Art. 52 LPAC:</b> los actos anulables son <b>convalidables</b>.</li>\n<li><b>Art. 107 LPAC:</b> los actos anulables favorables se combaten por la vía de la <b>lesividad</b>.</li>\n<li><b>Art. 34 LPAC:</b> el contenido debe ser adecuado a los fines; su incumplimiento es desviación de poder.</li>\n</ul>", "trampas": "<ul>\n<li>La anulabilidad es la <b>regla</b>; la nulidad, la excepción tasada.</li>\n<li>Los apartados 2 y 3 <b>restringen</b>, no amplían: contienen la palabra <b>«sólo»</b>.</li>\n<li>La <b>desviación de poder</b> es anulabilidad, no nulidad.</li>\n</ul>", "ancla": "<p><b>«Todo lo demás es anulable; la forma solo si frustra o indefiende; el plazo solo si es esencial.»</b></p>", "vis": "<svg viewBox=\"0 0 640 145\" role=\"img\" aria-label=\"Anulabilidad y sus filtros\">\n<rect x=\"185\" y=\"8\" width=\"270\" height=\"30\" rx=\"8\" fill=\"var(--warn)\" stroke=\"var(--warn)\"/>\n<text x=\"320\" y=\"28\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">ANULABILIDAD (regla general)</text>\n<g font-size=\"10\" text-anchor=\"middle\" fill=\"currentColor\">\n<rect x=\"20\" y=\"52\" width=\"190\" height=\"62\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"115\" y=\"73\" font-weight=\"700\" fill=\"var(--acc)\">48.1 · Cualquier infracción</text><text x=\"115\" y=\"91\">del ordenamiento jurídico</text><text x=\"115\" y=\"105\">incluso desviación de poder</text>\n<rect x=\"225\" y=\"52\" width=\"190\" height=\"62\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"320\" y=\"73\" font-weight=\"700\" fill=\"var(--ej)\">48.2 · Defecto de forma</text><text x=\"320\" y=\"91\">solo si impide el fin</text><text x=\"320\" y=\"105\">o causa indefensión</text>\n<rect x=\"430\" y=\"52\" width=\"190\" height=\"62\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"525\" y=\"73\" font-weight=\"700\" fill=\"var(--warn)\">48.3 · Fuera de plazo</text><text x=\"525\" y=\"91\">solo si lo impone</text><text x=\"525\" y=\"105\">la naturaleza del plazo</text>\n</g>\n<text x=\"320\" y=\"136\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--ink2)\">Los actos anulables son convalidables (art. 52) y producen efectos mientras no se anulen</text>\n</svg>"}, {"n": 49, "t": "Límites a la extensión de la nulidad o anulabilidad de los actos", "ubic": "Título III (De los actos administrativos) ▸ Capítulo III (Nulidad y anulabilidad)", "idea": "El vicio no contagia lo independiente, ni en el procedimiento ni dentro del acto.", "literal": "<p>1. La nulidad o anulabilidad de un acto no implicará la de los sucesivos en el procedimiento que sean independientes del primero.</p><p>2. La nulidad o anulabilidad en parte del acto administrativo no implicará la de las partes del mismo independientes de aquélla, salvo que la parte viciada sea de tal importancia que sin ella el acto administrativo no hubiera sido dictado.</p>", "dis": "<ul>\n<li><b>49.1 — extensión horizontal:</b> la nulidad o anulabilidad de un acto <b>no implica la de los sucesivos</b> en el procedimiento que sean <b>independientes</b> del primero.</li>\n<li><b>49.2 — extensión vertical:</b> la invalidez <b>parcial</b> de un acto no implica la de las partes <b>independientes</b> de la viciada, <b>salvo</b> que la parte viciada sea de <b>tal importancia</b> que sin ella el acto no se hubiera dictado.</li>\n</ul>", "llano": "<p>Que un trámite esté mal no tira abajo todo el expediente: solo lo que dependa de él. Y si lo que está mal es una parte del acto, se cae esa parte, salvo que sea tan importante que sin ella el acto no tendría sentido.</p>", "porque": "<p>Es el principio de <b>conservación</b> aplicado a la invalidez: la anulación es un remedio, no un castigo. Repetir trámites intachables solo por su posición en el expediente sería un despilfarro de recursos públicos y una demora injustificada para el interesado. Por eso la ley pide identificar la <b>relación de dependencia</b> real entre lo viciado y lo demás.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> una receta con un ingrediente equivocado: se corrige ese paso, no se tira toda la comida si el resto sirve.</li>\n<li><b>Real:</b> anulado el trámite de valoración de méritos de un concurso por un error en el baremo, se conservan la convocatoria y la admisión de aspirantes, que son independientes.</li>\n<li><b>Caso límite:</b> una resolución concede una subvención de 20.000 € y, en un segundo punto, impone una obligación ilegal. Si la obligación era determinante para conceder la ayuda, cae todo el acto (art. 49.2, inciso final).</li>\n</ul>", "noej": "<ul>\n<li><b>No se conserva</b> el acto sucesivo que <b>trae causa</b> directa del viciado.</li>\n<li><b>No es</b> parcial la invalidez cuando la parte viciada es determinante del acto entero.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 51 LPAC:</b> conservación de actos y trámites.</li>\n<li><b>Art. 50 LPAC:</b> conversión de actos viciados.</li>\n<li><b>Art. 119.2 LPAC:</b> retroacción de actuaciones al resolver un recurso por vicio de forma.</li>\n</ul>", "trampas": "<ul>\n<li>La palabra clave en los dos apartados es <b>«independientes»</b>.</li>\n<li>La excepción del 49.2 exige que la parte viciada sea de <b>tal importancia</b> que sin ella el acto no se hubiera dictado.</li>\n</ul>", "ancla": "<p><b>«Lo independiente se salva.»</b> Salvo que lo viciado fuera la razón de ser del acto.</p>", "vis": "<svg viewBox=\"0 0 640 130\" role=\"img\" aria-label=\"Límites a la extensión de la invalidez\">\n<g font-size=\"10\" text-anchor=\"middle\" fill=\"currentColor\">\n<rect x=\"30\" y=\"35\" width=\"115\" height=\"50\" rx=\"8\" fill=\"var(--panel)\" stroke=\"var(--line)\"/><text x=\"87\" y=\"65\" font-weight=\"700\">Trámite 1</text>\n<rect x=\"160\" y=\"35\" width=\"115\" height=\"50\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"217\" y=\"60\" font-weight=\"700\" fill=\"var(--exc)\">Trámite 2</text><text x=\"217\" y=\"76\" fill=\"var(--exc)\">VICIADO</text>\n<rect x=\"290\" y=\"35\" width=\"115\" height=\"50\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\" stroke-dasharray=\"4 3\"/><text x=\"347\" y=\"60\" font-weight=\"700\" fill=\"var(--exc)\">Trámite 3</text><text x=\"347\" y=\"76\">dependiente: cae</text>\n<rect x=\"420\" y=\"35\" width=\"190\" height=\"50\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"515\" y=\"60\" font-weight=\"700\" fill=\"var(--ej)\">Trámite 4</text><text x=\"515\" y=\"76\">independiente: se conserva</text>\n</g>\n<text x=\"320\" y=\"115\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--ink2)\">49.2 · dentro del propio acto rige la misma lógica, salvo que la parte viciada sea determinante</text>\n</svg>"}, {"n": 50, "t": "Conversión de actos viciados", "ubic": "Título III (De los actos administrativos) ▸ Capítulo III (Nulidad y anulabilidad)", "idea": "Si el acto inválido contiene otro válido dentro, produce los efectos de ese otro.", "literal": "<p>Los actos nulos o anulables que, sin embargo, contengan los elementos constitutivos de otro distinto producirán los efectos de éste.</p>", "dis": "<ul>\n<li><b>Regla única:</b> los actos <b>nulos o anulables</b> que <b>contengan los elementos constitutivos de otro distinto</b> producirán <b>los efectos de éste</b>.</li>\n<li><b>Alcance:</b> opera tanto para la nulidad como para la anulabilidad; es una de las pocas figuras que se aplica a ambas.</li>\n</ul>", "llano": "<p>A veces lo que se ha dictado no vale como lo que pretendía ser, pero sí como otra cosa. Si dentro del acto están todos los elementos de ese otro acto, la ley aprovecha lo que hay en lugar de tirarlo.</p>", "porque": "<p>Es economía procesal pura: obligar a la Administración a dictar de nuevo un acto cuyo contenido ya está íntegramente en el expediente sería un formalismo estéril. La <b>conversión</b> respeta además la voluntad real de la Administración, que quería producir un efecto jurídico y no ninguno.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> un billete de tren para un trayecto que ya no existe, pero que sirve como abono de transporte porque reúne todos sus requisitos.</li>\n<li><b>Real:</b> un acuerdo que pretende ser una <b>concesión demanial</b> pero carece de sus requisitos, y sin embargo reúne todos los de una <b>autorización de uso común especial</b>: produce los efectos de esta.</li>\n<li><b>Caso límite:</b> lo que se dictó como resolución definitiva pero solo contiene los elementos de una <b>propuesta de resolución</b>: puede valer como tal, no como resolución.</li>\n</ul>", "noej": "<ul>\n<li><b>No cabe</b> conversión si faltan elementos del acto de destino: la ley exige que los <b>contenga</b>.</li>\n<li><b>No es</b> conversión la convalidación: esta subsana el vicio y mantiene el mismo acto (art. 52).</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 51 LPAC:</b> conservación.</li>\n<li><b>Art. 52 LPAC:</b> convalidación, aplicable solo a los <b>anulables</b>.</li>\n<li><b>Art. 49 LPAC:</b> límites a la extensión de la invalidez.</li>\n</ul>", "trampas": "<ul>\n<li>La conversión alcanza a los actos <b>nulos y anulables</b>; la convalidación, solo a los <b>anulables</b>.</li>\n<li>El acto convertido produce los efectos <b>del otro acto</b>, no los suyos propios.</li>\n</ul>", "ancla": "<p><b>«No vale como esto, pero vale como aquello.»</b> Conversión: nulos y anulables. Convalidación: solo anulables.</p>", "vis": "<svg viewBox=\"0 0 640 120\" role=\"img\" aria-label=\"Conversión de actos viciados\">\n<defs><marker id=\"c1\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\"><path d=\"M0 0 L9 4.5 L0 9 z\" fill=\"var(--ej)\"/></marker></defs>\n<rect x=\"50\" y=\"35\" width=\"215\" height=\"52\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/>\n<text x=\"157\" y=\"58\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--exc)\">Acto nulo o anulable</text>\n<text x=\"157\" y=\"76\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">contiene los elementos de otro</text>\n<path d=\"M270 61 L 330 61\" stroke=\"var(--ej)\" stroke-width=\"2.5\" marker-end=\"url(#c1)\"/>\n<rect x=\"335\" y=\"35\" width=\"255\" height=\"52\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/>\n<text x=\"462\" y=\"58\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">Produce los efectos de ese otro</text>\n<text x=\"462\" y=\"76\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">se aprovecha lo que sí es válido</text>\n</svg>"}];
</script>
<script>
ARTS.push.apply(ARTS,[{"n": 51, "t": "Conservación de actos y trámites", "ubic": "Título III (De los actos administrativos) ▸ Capítulo III (Nulidad y anulabilidad)", "idea": "Se conserva todo lo que habría sido igual aunque no hubiera vicio.", "literal": "<p>El órgano que declare la nulidad o anule las actuaciones dispondrá siempre la conservación de aquellos actos y trámites cuyo contenido se hubiera mantenido igual de no haberse cometido la infracción.</p>", "dis": "<ul>\n<li><b>Regla:</b> el órgano que <b>declare la nulidad</b> o <b>anule las actuaciones</b> dispondrá <b>siempre</b> la conservación de aquellos actos y trámites cuyo contenido <b>se hubiera mantenido igual</b> de no haberse cometido la infracción.</li>\n<li><b>Carácter:</b> es un <b>deber</b>, no una facultad: la ley dice «dispondrá <b>siempre</b>».</li>\n</ul>", "llano": "<p>Cuando se anula algo, no se empieza de cero: hay que salvar todo lo que habría salido exactamente igual aunque el error no se hubiera cometido. Y no es opcional para la Administración: la ley le obliga.</p>", "porque": "<p>Sin esta regla, cada anulación obligaría a repetir el expediente completo, con el consiguiente perjuicio para el interesado —que vería alargarse su asunto— y para el interés general. El criterio es <b>contrafactual</b>: hay que preguntarse qué habría ocurrido sin la infracción.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> corregir un párrafo de un documento sin reescribir el resto.</li>\n<li><b>Real:</b> anulada la resolución de un expediente sancionador por falta de audiencia, se conservan el acuerdo de incoación, el pliego de cargos y las pruebas practicadas, que habrían sido idénticos.</li>\n<li><b>Caso límite:</b> si la falta de audiencia impidió aportar una prueba que habría cambiado la instrucción, esa parte <b>no</b> se conserva: su contenido no se habría mantenido igual.</li>\n</ul>", "noej": "<ul>\n<li><b>No se conserva</b> el trámite cuyo contenido habría sido distinto sin la infracción.</li>\n<li><b>No es</b> discrecional: la ley impone conservarlos <b>siempre</b>.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 49 LPAC:</b> límites a la extensión de la invalidez.</li>\n<li><b>Art. 119.2 LPAC:</b> retroacción al momento en que se cometió el vicio de forma.</li>\n<li><b>Art. 50 LPAC:</b> conversión.</li>\n</ul>", "trampas": "<ul>\n<li>La palabra clave es <b>«siempre»</b>: es obligatorio.</li>\n<li>El criterio es que el contenido <b>se hubiera mantenido igual</b>, no que el trámite sea anterior o posterior.</li>\n</ul>", "ancla": "<p><b>«Si habría salido igual, se queda.»</b> Y el órgano <b>debe</b> declararlo, no puede elegir.</p>", "vis": "<svg viewBox=\"0 0 640 120\" role=\"img\" aria-label=\"Conservación de actos y trámites\">\n<rect x=\"60\" y=\"30\" width=\"240\" height=\"58\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/>\n<text x=\"180\" y=\"53\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">¿Habría sido igual</text>\n<text x=\"180\" y=\"72\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">sin la infracción?</text>\n<rect x=\"340\" y=\"18\" width=\"245\" height=\"38\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/>\n<text x=\"462\" y=\"42\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">SÍ → se conserva (siempre)</text>\n<rect x=\"340\" y=\"64\" width=\"245\" height=\"38\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/>\n<text x=\"462\" y=\"88\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--exc)\">NO → se repite</text>\n<path d=\"M303 50 L 336 37\" stroke=\"var(--ej)\" stroke-width=\"2\"/><path d=\"M303 68 L 336 81\" stroke=\"var(--exc)\" stroke-width=\"2\"/>\n</svg>"}, {"n": 52, "t": "Convalidación", "ubic": "Título III (De los actos administrativos) ▸ Capítulo III (Nulidad y anulabilidad)", "idea": "Los anulables se subsanan; la convalidación produce efecto desde su fecha.", "literal": "<p>1. La Administración podrá convalidar los actos anulables, subsanando los vicios de que adolezcan.</p><p>2. El acto de convalidación producirá efecto desde su fecha, salvo lo dispuesto en el artículo 39.3 para la retroactividad de los actos administrativos.</p><p>3. Si el vicio consistiera en incompetencia no determinante de nulidad, la convalidación podrá realizarse por el órgano competente cuando sea superior jerárquico del que dictó el acto viciado.</p><p>4. Si el vicio consistiese en la falta de alguna autorización, podrá ser convalidado el acto mediante el otorgamiento de la misma por el órgano competente.</p>", "dis": "<ul>\n<li><b>52.1 — objeto:</b> la Administración <b>podrá convalidar los actos anulables</b>, subsanando los vicios de que adolezcan. <b>Los nulos no son convalidables.</b></li>\n<li><b>52.2 — efectos:</b> el acto de convalidación produce efecto <b>desde su fecha</b>, salvo lo dispuesto en el <b>art. 39.3</b> sobre retroactividad.</li>\n<li><b>52.3 — incompetencia:</b> si el vicio consiste en <b>incompetencia no determinante de nulidad</b> —es decir, la <b>jerárquica</b>—, la convalidación la realiza el <b>órgano competente cuando sea superior jerárquico</b> del que dictó el acto viciado.</li>\n<li><b>52.4 — falta de autorización:</b> si el vicio consiste en la <b>falta de alguna autorización</b>, se convalida mediante su <b>otorgamiento por el órgano competente</b>.</li>\n</ul>", "llano": "<p>Un acto anulable se puede arreglar: se corrige el vicio y sigue adelante. La corrección vale desde el día en que se hace, no desde antes, salvo que se den las condiciones de retroactividad. Y hay dos vicios con receta expresa: la incompetencia jerárquica —lo convalida el superior— y la falta de autorización —se otorga—.</p>", "porque": "<p>La convalidación evita el círculo absurdo de anular un acto para volver a dictarlo idéntico una vez subsanado el defecto. Y el límite es coherente con el sistema: los actos <b>nulos</b> no se convalidan porque su vicio afecta a elementos esenciales, no a la forma de expresarlos.</p>\n<p>El apartado 3 confirma indirectamente que la <b>incompetencia jerárquica</b> es causa de <b>anulabilidad</b> y no de nulidad, algo que el art. 47.1.b) solo dice de forma implícita.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> un contrato firmado por el apoderado sin poder suficiente, que después ratifica el titular.</li>\n<li><b>Real:</b> una resolución sobre personal dictada por el concejal delegado cuando correspondía a la alcaldía: la convalida la <b>alcaldía</b>, superior jerárquico (art. 52.3).</li>\n<li><b>Caso límite:</b> un acto dictado sin el informe favorable de otra Administración exigido por norma: se convalida con el <b>otorgamiento</b> posterior de esa autorización (art. 52.4).</li>\n</ul>", "noej": "<ul>\n<li><b>No cabe</b> convalidar un acto <b>nulo</b> de pleno derecho.</li>\n<li><b>No convalida</b> el órgano <b>inferior</b> ni uno de igual rango sin relación jerárquica.</li>\n<li><b>No produce</b> efectos retroactivos por sistema: solo si concurre el art. 39.3.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 48 LPAC:</b> qué actos son anulables.</li>\n<li><b>Art. 47.1.b) LPAC:</b> solo la incompetencia manifiesta por materia o territorio es causa de nulidad.</li>\n<li><b>Art. 39.3 LPAC:</b> retroactividad, expresamente invocado por el art. 52.2.</li>\n<li><b>Arts. 8 a 14 de la Ley 40/2015</b> (documento 2): competencia y jerarquía.</li>\n</ul>", "trampas": "<ul>\n<li>Solo los <b>anulables</b> se convalidan.</li>\n<li>Efectos <b>desde la fecha</b> de la convalidación, salvo art. 39.3.</li>\n<li>La convalidación por incompetencia la hace el <b>superior jerárquico</b> competente.</li>\n</ul>", "ancla": "<p><b>«Anulable se arregla; nulo, no. Y lo arregla el de arriba.»</b></p>", "vis": "<svg viewBox=\"0 0 640 135\" role=\"img\" aria-label=\"Convalidación de actos anulables\">\n<g font-size=\"10\" text-anchor=\"middle\" fill=\"currentColor\">\n<rect x=\"25\" y=\"30\" width=\"175\" height=\"62\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"112\" y=\"52\" font-size=\"11\" font-weight=\"700\" fill=\"var(--warn)\">Acto ANULABLE</text><text x=\"112\" y=\"70\">se subsana el vicio</text><text x=\"112\" y=\"84\">efectos desde su fecha</text>\n<rect x=\"232\" y=\"30\" width=\"175\" height=\"62\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"320\" y=\"52\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">52.3 · Incompetencia</text><text x=\"320\" y=\"70\">jerárquica: convalida</text><text x=\"320\" y=\"84\">el superior jerárquico</text>\n<rect x=\"439\" y=\"30\" width=\"176\" height=\"62\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"527\" y=\"52\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">52.4 · Falta autorización</text><text x=\"527\" y=\"70\">se otorga por el</text><text x=\"527\" y=\"84\">órgano competente</text>\n</g>\n<text x=\"320\" y=\"122\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--exc)\">Los actos NULOS de pleno derecho NO son convalidables</text>\n</svg>"}, {"n": 106, "t": "Revisión de disposiciones y actos nulos", "ubic": "Título V (De la revisión de los actos en vía administrativa) ▸ Capítulo I (Revisión de oficio)", "idea": "La nulidad se revisa en cualquier momento, con dictamen favorable del órgano consultivo.", "literal": "<p>1. Las Administraciones Públicas, en cualquier momento, por iniciativa propia o a solicitud de interesado, y previo dictamen favorable del Consejo de Estado u órgano consultivo equivalente de la Comunidad Autónoma, si lo hubiere, declararán de oficio la nulidad de los actos administrativos que hayan puesto fin a la vía administrativa o que no hayan sido recurridos en plazo, en los supuestos previstos en el artículo 47.1.</p><p>2. Asimismo, en cualquier momento, las Administraciones Públicas de oficio, y previo dictamen favorable del Consejo de Estado u órgano consultivo equivalente de la Comunidad Autónoma si lo hubiere, podrán declarar la nulidad de las disposiciones administrativas en los supuestos previstos en el artículo 47.2.</p><p>3. El órgano competente para la revisión de oficio podrá acordar motivadamente la inadmisión a trámite de las solicitudes formuladas por los interesados, sin necesidad de recabar Dictamen del Consejo de Estado u órgano consultivo de la Comunidad Autónoma, cuando las mismas no se basen en alguna de las causas de nulidad del artículo 47.1 o carezcan manifiestamente de fundamento, así como en el supuesto de que se hubieran desestimado en cuanto al fondo otras solicitudes sustancialmente iguales.</p><p>4. Las Administraciones Públicas, al declarar la nulidad de una disposición o acto, podrán establecer, en la misma resolución, las indemnizaciones que proceda reconocer a los interesados, si se dan las circunstancias previstas en los artículos 32.2 y 34.1 de la Ley de Régimen Jurídico del Sector Público sin perjuicio de que, tratándose de una disposición, subsistan los actos firmes dictados en aplicación de la misma.</p><p>5. Cuando el procedimiento se hubiera iniciado de oficio, el transcurso del plazo de seis meses desde su inicio sin dictarse resolución producirá la caducidad del mismo. Si el procedimiento se hubiera iniciado a solicitud de interesado, se podrá entender la misma desestimada por silencio administrativo.</p>", "dis": "<ul>\n<li><b>106.1 — actos nulos:</b> las Administraciones, <b>en cualquier momento</b>, <b>por iniciativa propia o a solicitud de interesado</b> y previo <b><span class=\"t\" data-k=\"dictamen\">dictamen favorable</span></b> del Consejo de Estado u órgano consultivo equivalente de la comunidad autónoma, <b>declararán de oficio la nulidad</b> de los actos que hayan <b>puesto fin a la vía administrativa</b> o que <b>no hayan sido recurridos en plazo</b>, en los supuestos del <b>art. 47.1</b>.</li>\n<li><b>106.2 — disposiciones:</b> en cualquier momento y previo dictamen favorable, podrán declarar <b>de oficio</b> la nulidad de las <b>disposiciones administrativas</b> en los supuestos del art. 47.2.</li>\n<li><b>106.3 — inadmisión:</b> cabe <b>inadmitir motivadamente</b> a trámite las solicitudes, <b>sin dictamen</b>, cuando no se basen en alguna causa del art. 47.1, <b>carezcan manifiestamente de fundamento</b> o se hubieran desestimado en el fondo otras <b>sustancialmente iguales</b>.</li>\n<li><b>106.4 — indemnizaciones:</b> al declarar la nulidad puede fijarse en la misma resolución la <b>indemnización</b> que proceda.</li>\n<li><b>106.5 — plazos:</b> iniciado <b>de oficio</b>, el transcurso de <b>seis meses</b> sin resolver produce la <b>caducidad</b>; iniciado <b>a solicitud</b>, se entiende <b>desestimada por silencio</b>.</li>\n</ul>\n<div class=\"box warn\"><span class=\"lbl\">Los dos rasgos que definen esta vía</span><b>Sin plazo</b> —«en cualquier momento»— y con <b>dictamen favorable</b>: si el órgano consultivo dictamina en contra, la Administración <b>no puede</b> declarar la nulidad.</div>", "llano": "<p>Cuando un acto es nulo y ya no se puede recurrir porque pasó el plazo, todavía queda una puerta: la revisión de oficio. No tiene plazo, pero es exigente: hace falta que el Consejo Consultivo diga que sí. Si dice que no, se acabó.</p>", "porque": "<p>Aquí chocan dos principios: la <b>legalidad</b> —un acto nulo no debería consolidarse nunca— y la <b>seguridad jurídica</b> —las situaciones no pueden estar eternamente en cuestión—. La ley resuelve permitiendo la revisión sin plazo, pero sometiéndola al <b>filtro externo</b> de un órgano consultivo independiente, cuyo dictamen debe ser <b>favorable</b>. Es una de las poquísimas ocasiones en que un dictamen vincula.</p>\n<p>El apartado 3 evita el uso abusivo de la figura: sin él, cualquiera podría reabrir indefinidamente asuntos ya cerrados obligando a un dictamen en cada caso.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> reabrir un expediente cerrado hace años porque se descubre que estaba mal desde el origen, pero solo con el visto bueno de un te

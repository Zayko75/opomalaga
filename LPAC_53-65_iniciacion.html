ARTS.push.apply(ARTS,[{"n": 61, "t": "Inicio del procedimiento por petición razonada de otros órganos", "ubic": "Título IV ▸ Capítulo II ▸ Sección 2.ª (Iniciación del procedimiento de oficio por la Administración)", "idea": "Petición razonada de otro órgano sin competencia; no vincula.", "literal": "<p>1. Se entiende por petición razonada, la propuesta de iniciación del procedimiento formulada por cualquier órgano administrativo que no tiene competencia para iniciar el mismo y que ha tenido conocimiento de las circunstancias, conductas o hechos objeto del procedimiento, bien ocasionalmente o bien por tener atribuidas funciones de inspección, averiguación o investigación.</p><p>2. La petición no vincula al órgano competente para iniciar el procedimiento, si bien deberá comunicar al órgano que la hubiera formulado los motivos por los que, en su caso, no procede la iniciación.</p><p>3. En los procedimientos de naturaleza sancionadora, las peticiones deberán especificar, en la medida de lo posible, la persona o personas presuntamente responsables; las conductas o hechos que pudieran constituir infracción administrativa y su tipificación; así como el lugar, la fecha, fechas o período de tiempo continuado en que los hechos se produjeron.</p><p>4. En los procedimientos de responsabilidad patrimonial, la petición deberá individualizar la lesión producida en una persona o grupo de personas, su relación de causalidad con el funcionamiento del servicio público, su evaluación económica si fuera posible, y el momento en que la lesión efectivamente se produjo.</p>", "dis": "<ul>\n<li><b>61.1 — definición:</b> propuesta de iniciación formulada por <b>cualquier órgano administrativo que no tiene competencia para iniciar</b> y que ha tenido conocimiento de los hechos, <b>ocasionalmente</b> o por tener atribuidas <b>funciones de inspección, averiguación o investigación</b>.</li>\n<li><b>61.2 — efecto:</b> la petición <b>no vincula</b> al órgano competente, pero este <b>deberá comunicar</b> al peticionario los <b>motivos</b> por los que, en su caso, no procede la iniciación.</li>\n<li><b>61.3 — sancionadores:</b> la petición especificará, en la medida de lo posible, <b>responsables</b>, <b>conductas o hechos</b> y su <b>tipificación</b>, y el <b>lugar y las fechas</b>.</li>\n<li><b>61.4 — responsabilidad patrimonial:</b> la petición debe <b>individualizar la lesión</b>, su <b>relación de causalidad</b> con el funcionamiento del servicio público, su <b>evaluación económica</b> si fuera posible y el <b>momento</b> en que la lesión se produjo.</li>\n</ul>", "llano": "<p>Un órgano que no puede incoar pero conoce los hechos propone que se incoe. El competente decide libremente, pero si dice que no, tiene que explicar por qué a quien se lo pidió.</p>", "porque": "<p>La no vinculación preserva la <b>competencia</b>. Y el deber de motivar la negativa evita que la petición caiga en el vacío: obliga a un examen real y deja constancia de la decisión, que podrá valorarse después si el asunto se complica.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> un compañero que te propone abrir un caso y al que le debes una respuesta razonada.</li>\n<li><b>Real:</b> la policía local remite al órgano competente una petición razonada tras detectar una actividad sin licencia, con lugar, fechas y titular.</li>\n<li><b>Caso límite:</b> los servicios sociales piden iniciar de oficio un expediente de responsabilidad patrimonial. Deben <b>individualizar la lesión</b> y su relación causal con el servicio público (art. 61.4).</li>\n</ul>", "noej": "<ul>\n<li><b>No es</b> petición razonada la que formula un <b>particular</b>: eso es denuncia o solicitud.</li>\n<li><b>No obliga</b> a incoar.</li>\n<li><b>No exime</b> de responder motivadamente al órgano peticionario.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 58 LPAC:</b> modalidades de iniciación de oficio.</li>\n<li><b>Art. 65 LPAC:</b> iniciación de oficio de la responsabilidad patrimonial.</li>\n<li><b>Arts. 32 a 37 de la Ley 40/2015</b> (documento 2): régimen de la responsabilidad patrimonial.</li>\n</ul>", "trampas": "<ul>\n<li>La formula un <b>órgano</b>, no un particular.</li>\n<li><b>No vincula</b>, pero obliga a <b>comunicar los motivos</b> de la no iniciación.</li>\n<li>Tiene contenido reforzado en <b>sancionadores</b> y en <b>responsabilidad patrimonial</b>.</li>\n</ul>", "ancla": "<p><b>«Te lo propongo, decides tú, pero me contestas.»</b></p>", "vis": "<svg viewBox=\"0 0 640 125\" role=\"img\" aria-label=\"Petición razonada de otros órganos\">\n<defs><marker id=\"pr1\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\"><path d=\"M0 0 L9 4.5 L0 9 z\" fill=\"var(--ej)\"/></marker></defs>\n<rect x=\"30\" y=\"35\" width=\"200\" height=\"52\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/>\n<text x=\"130\" y=\"57\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">Órgano sin competencia</text>\n<text x=\"130\" y=\"75\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">propone la iniciación</text>\n<path d=\"M233 55 L 293 55\" stroke=\"var(--ej)\" stroke-width=\"2\" marker-end=\"url(#pr1)\"/>\n<path d=\"M293 75 L 233 75\" stroke=\"var(--exc)\" stroke-width=\"2\" marker-end=\"url(#pr1)\" stroke-dasharray=\"5 3\"/>\n<text x=\"263\" y=\"98\" text-anchor=\"middle\" font-size=\"9\" fill=\"var(--exc)\">motivos si no incoa</text>\n<rect x=\"297\" y=\"35\" width=\"300\" height=\"52\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/>\n<text x=\"447\" y=\"57\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">Órgano competente</text>\n<text x=\"447\" y=\"75\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">NO queda vinculado</text>\n</svg>"}, {"n": 62, "t": "Inicio del procedimiento por denuncia", "ubic": "Título IV ▸ Capítulo II ▸ Sección 2.ª (Iniciación del procedimiento de oficio por la Administración)", "idea": "Denunciar no da la condición de interesado; y el arrepentido puede quedar exento.", "literal": "<p>1. Se entiende por denuncia, el acto por el que cualquier persona, en cumplimiento o no de una obligación legal, pone en conocimiento de un órgano administrativo la existencia de un determinado hecho que pudiera justificar la iniciación de oficio de un procedimiento administrativo.</p><p>2. Las denuncias deberán expresar la identidad de la persona o personas que las presentan y el relato de los hechos que se ponen en conocimiento de la Administración. Cuando dichos hechos pudieran constituir una infracción administrativa, recogerán la fecha de su comisión y, cuando sea posible, la identificación de los presuntos responsables.</p><p>3. Cuando la denuncia invocara un perjuicio en el patrimonio de las Administraciones Públicas la no iniciación del procedimiento deberá ser motivada y se notificará a los denunciantes la decisión de si se ha iniciado o no el procedimiento.</p><p>4. Cuando el denunciante haya participado en la comisión de una infracción de esta naturaleza y existan otros infractores, el órgano competente para resolver el procedimiento deberá eximir al denunciante del pago de la multa que le correspondería u otro tipo de sanción de carácter no pecuniario, cuando sea el primero en aportar elementos de prueba que permitan iniciar el procedimiento o comprobar la infracción, siempre y cuando en el momento de aportarse aquellos no se disponga de elementos suficientes para ordenar la misma y se repare el perjuicio causado. Asimismo, el órgano competente para resolver deberá reducir el importe del pago de la multa que le correspondería o, en su caso, la sanción de carácter no pecuniario, cuando no cumpliéndose alguna de las condiciones anteriores, el denunciante facilite elementos de prueba que aporten un valor añadido significativo respecto de aquellos de los que se disponga. En ambos casos será necesario que el denunciante cese en la participación de la infracción y no haya destruido elementos de prueba relacionados con el objeto de la denuncia.</p><p>5. La presentación de una denuncia no confiere, por sí sola, la condición de interesado en el procedimiento.</p>", "dis": "<ul>\n<li><b>62.1 — definición:</b> acto por el que <b>cualquier persona</b>, en cumplimiento o no de una obligación legal, pone en conocimiento de un órgano la existencia de un hecho que <b>pudiera justificar</b> la iniciación de oficio de un procedimiento.</li>\n<li><b>62.2 — contenido:</b> <b>identidad</b> de quien la presenta y <b>relato de los hechos</b>. Si pudieran constituir infracción, la <b>fecha</b> de comisión y, cuando sea posible, la <b>identificación de los presuntos responsables</b>.</li>\n<li><b>62.3 — perjuicio al patrimonio público:</b> si la denuncia invoca un perjuicio en el patrimonio de las Administraciones, <b>la no iniciación deberá ser motivada</b> y se <b>notificará al denunciante</b> la decisión de iniciar o no.</li>\n<li><b>62.4 — cláusula del denunciante colaborador:</b> cuando el denunciante haya <b>participado</b> en la infracción y existan otros infractores, el órgano competente <b>deberá eximirle</b> del pago de la multa u otra sanción no pecuniaria cuando sea el <b>primero</b> en aportar elementos de prueba que permitan <b>iniciar el procedimiento o comprobar la infracción</b>, siempre que en ese momento <b>no se disponga</b> de elementos suficientes para ordenarla y se <b>repare el perjuicio</b> causado. Si no se cumple alguna de esas condiciones pero aporta elementos de <b>valor añadido significativo</b>, el órgano <b>deberá reducir</b> el importe. En ambos casos es necesario que el denunciante <b>cese en la participación</b> en la infracción y <b>no haya destruido</b> elementos de prueba.</li>\n<li><b>62.5 — condición:</b> la presentación de una denuncia <b>no confiere, por sí sola, la condición de interesado</b>.</li>\n</ul>", "llano": "<p>Denunciar es fácil, pero denunciar no te convierte en parte del expediente: no tendrás derecho a ver el trámite ni a recurrir la resolución, salvo que además seas interesado por otro motivo. Y hay una excepción llamativa: si participaste en la infracción y eres el primero en aportar pruebas decisivas, puedes quedar exento de la multa.</p>", "porque": "<p>El apartado 5 evita convertir el procedimiento sancionador en un instrumento privado de venganza: el interés del denunciante en que se sancione a otro no es un interés legítimo propio. El apartado 4 responde a otra lógica: en infracciones cometidas por varios —cárteles, fraudes— la prueba está dentro, y la <b>exención al primero que colabora</b> es la herramienta más eficaz para romper el pacto de silencio.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> avisar de una infracción sin ser parte del procedimiento que se abra.</li>\n<li><b>Real:</b> un vecino denuncia ruidos; el ayuntamiento incoa. El vecino <b>no</b> es interesado por el solo hecho de denunciar (art. 62.5), aunque puede serlo por ser el afectado directo.</li>\n<li><b>Caso límite:</b> la denuncia invoca un perjuicio al patrimonio municipal y el órgano decide no incoar. Debe <b>motivarlo</b> y <b>notificárselo</b> al denunciante (art. 62.3).</li>\n</ul>", "noej": "<ul>\n<li><b>No confiere</b> la denuncia la condición de interesado.</li>\n<li><b>No opera</b> la exención del 62.4 si la Administración ya tenía elementos suficientes o si no se repara el perjuicio.</li>\n<li><b>No inicia</b> la denuncia el procedimiento: lo hace el acuerdo del órgano.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 4 LPAC:</b> concepto de interesado.</li>\n<li><b>Art. 58 LPAC:</b> la denuncia como modalidad de iniciación de oficio.</li>\n<li><b>Art. 85 LPAC:</b> reducciones por reconocimiento de responsabilidad y pago voluntario.</li>\n</ul>", "trampas": "<ul>\n<li>La denuncia <b>no</b> convierte en interesado.</li>\n<li>Solo hay <b>deber de motivar y notificar</b> la no iniciación cuando se invoque perjuicio al <b>patrimonio público</b>.</li>\n<li>La exención del 62.4 exige ser el <b>primero</b>, <b>reparar</b> el perjuicio, <b>cesar</b> en la participación y <b>no destruir</b> pruebas. Si falla alguna condición pero hay <b>valor añadido significativo</b>, procede <b>reducción</b>, no exención.</li>\n</ul>", "ancla": "<p><b>«Denunciar no es ser parte.»</b> Y el primero que canta y repara, se libra.</p>", "vis": "<svg viewBox=\"0 0 660 140\" role=\"img\" aria-label=\"La denuncia como forma de iniciación\">\n<rect x=\"200\" y=\"8\" width=\"260\" height=\"30\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/>\n<text x=\"330\" y=\"28\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">DENUNCIA</text>\n<g font-size=\"10\" text-anchor=\"middle\" fill=\"currentColor\">\n<rect x=\"20\" y=\"52\" width=\"190\" height=\"62\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"115\" y=\"74\" font-weight=\"700\" fill=\"var(--exc)\">62.5 · No es interesado</text><text x=\"115\" y=\"92\">denunciar no da</text><text x=\"115\" y=\"106\">derechos en el expediente</text>\n<rect x=\"225\" y=\"52\" width=\"190\" height=\"62\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"320\" y=\"74\" font-weight=\"700\" fill=\"var(--warn)\">62.3 · Patrimonio público</text><text x=\"320\" y=\"92\">no iniciar debe</text><text x=\"320\" y=\"106\">motivarse y notificarse</text>\n<rect x=\"430\" y=\"52\" width=\"205\" height=\"62\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"532\" y=\"74\" font-weight=\"700\" fill=\"var(--ej)\">62.4 · Exención</text><text x=\"532\" y=\"92\">primero en aportar pruebas</text><text x=\"532\" y=\"106\">+ reparar + cesar</text>\n</g>\n</svg>"}, {"n": 63, "t": "Especialidades en el inicio de los procedimientos de naturaleza sancionadora", "ubic": "Título IV ▸ Capítulo II ▸ Sección 2.ª (Iniciación del procedimiento de oficio por la Administración)", "idea": "Sancionador: siempre de oficio y con separación entre instruir y sancionar.", "literal": "<p>1. Los procedimientos de naturaleza sancionadora se iniciarán siempre de oficio por acuerdo del órgano competente y establecerán la debida separación entre la fase instructora y la sancionadora, que se encomendará a órganos distintos.</p><p>Se considerará que un órgano es competente para iniciar el procedimiento cuando así lo determinen las normas reguladoras del mismo.</p><p>2. En ningún caso se podrá imponer una sanción sin que se haya tramitado el oportuno procedimiento.</p><p>3. No se podrán iniciar nuevos procedimientos de carácter sancionador por hechos o conductas tipificadas como infracciones en cuya comisión el infractor persista de forma continuada, en tanto no haya recaído una primera resolución sancionadora, con carácter ejecutivo.</p>", "dis": "<ul>\n<li><b>63.1 — dos reglas básicas:</b> los procedimientos sancionadores se inician <b>siempre de oficio</b> por acuerdo del órgano competente y establecerán la <b><span class=\"t\" data-k=\"separacion\">debida separación entre la fase instructora y la sancionadora</span></b>, que se encomendará a <b>órganos distintos</b>. Un órgano es competente para iniciar cuando así lo determinen sus normas reguladoras.</li>\n<li><b>63.2 — nulla poena sine processo:</b> <b>en ningún caso</b> podrá imponerse una sanción sin que se haya tramitado el oportuno procedimiento.</li>\n<li><b>63.3 — infracciones continuadas:</b> <b>no podrán iniciarse nuevos procedimientos</b> por hechos o conductas tipificadas como infracciones <b>en cuya comisión el infractor persista de forma continuada</b>, en tanto no haya recaído una <b>primera resolución sancionadora con carácter ejecutivo</b>.</li>\n</ul>", "llano": "<p>Tres reglas de oro del Derecho sancionador: nunca se abre a instancia de nadie, quien instruye no puede ser quien sanciona y no hay sanción sin expediente. Y una cuarta, muy práctica: mientras el infractor sigue cometiendo la misma infracción continuada, no se le pueden abrir expedientes en cadena hasta que el primero sea ejecutivo.</p>", "porque": "<p>La <b>separación</b> entre instrucción y resolución traslada al ámbito administrativo la garantía del juez imparcial: quien ha construido la acusación no debe decidir sobre ella. Y la regla del apartado 3 impide el <b>abuso sancionador</b>: multiplicar expedientes por una conducta que se prolonga equivaldría a sancionar varias veces lo mismo antes de que el interesado haya podido siquiera defenderse una vez.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> quien investiga una falta en una empresa no es quien firma la sanción.</li>\n<li><b>Real:</b> en un ayuntamiento, instruye el técnico designado y resuelve la alcaldía o la Junta de Gobierno, según la atribución de competencias.</li>\n<li><b>Caso límite:</b> un establecimiento sigue abierto sin licencia. No caben expedientes sucesivos semana a semana: hay que esperar a que la <b>primera resolución</b> sea ejecutiva (art. 63.3).</li>\n</ul>", "noej": "<ul>\n<li><b>No cabe</b> iniciar un sancionador a solicitud del denunciante.</li>\n<li><b>No cabe</b> sancionar de plano, sin procedimiento.</li>\n<li><b>No pueden</b> coincidir instructor y órgano sancionador.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 53.2 LPAC:</b> derechos del presunto responsable.</li>\n<li><b>Art. 64 LPAC:</b> contenido del acuerdo de iniciación.</li>\n<li><b>Arts. 25 a 31 de la Ley 40/2015</b> (documento 2): principios de la potestad sancionadora.</li>\n<li><b>Art. 29 de la Ley 19/2013:</b> infracciones disciplinarias de los altos cargos.</li>\n</ul>", "trampas": "<ul>\n<li><b>Siempre</b> de oficio: no hay excepción.</li>\n<li>La separación se predica de <b>órganos distintos</b>, no de personas distintas del mismo órgano.</li>\n<li>El art. 63.3 exige que la primera resolución tenga <b>carácter ejecutivo</b>.</li>\n</ul>", "ancla": "<p><b>«Siempre de oficio · quien instruye no sanciona · sin expediente no hay sanción · y una infracción continuada, un solo expediente.»</b></p>", "vis": "<svg viewBox=\"0 0 640 140\" role=\"img\" aria-label=\"Especialidades del inicio del procedimiento sancionador\">\n<defs><marker id=\"sa1\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\"><path d=\"M0 0 L9 4.5 L0 9 z\" fill=\"var(--acc)\"/></marker></defs>\n<rect x=\"30\" y=\"35\" width=\"240\" height=\"55\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/>\n<text x=\"150\" y=\"58\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">Órgano INSTRUCTOR</text>\n<text x=\"150\" y=\"76\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">investiga y propone</text>\n<path d=\"M273 62 L 333 62\" stroke=\"var(--acc)\" stroke-width=\"2.5\" marker-end=\"url(#sa1)\"/>\n<rect x=\"338\" y=\"35\" width=\"265\" height=\"55\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/>\n<text x=\"470\" y=\"58\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--exc)\">Órgano SANCIONADOR</text>\n<text x=\"470\" y=\"76\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">resuelve · debe ser DISTINTO</text>\n<text x=\"320\" y=\"118\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--warn)\">Siempre de oficio · en ningún caso sanción sin procedimiento</text>\n</svg>"}, {"n": 64, "t": "Acuerdo de iniciación en los procedimientos de naturaleza sancionadora", "ubic": "Título IV ▸ Capítulo II ▸ Sección 2.ª (Iniciación del procedimiento de oficio por la Administración)", "idea": "El acuerdo de iniciación es la acusación: seis contenidos mínimos.", "literal": "<p>1. El acuerdo de iniciación se comunicará al instructor del procedimiento, con traslado de cuantas actuaciones existan al respecto, y se notificará a los interesados, entendiendo en todo caso por tal al inculpado. Asimismo, la incoación se comunicará al denunciante cuando las normas reguladoras del procedimiento así lo prevean.</p><p>2. El acuerdo de iniciación deberá contener al menos:</p><p>a) Identificación de la persona o personas presuntamente responsables.</p><p>b) Los hechos que motivan la incoación del procedimiento, su posible calificación y las sanciones que pudieran corresponder, sin perjuicio de lo que resulte de la instrucción.</p><p>c) Identificación del instructor y, en su caso, Secretario del procedimiento, con expresa indicación del régimen de recusación de los mismos.</p><p>d) Órgano competente para la resolución del procedimiento y norma que le atribuya tal competencia, indicando la posibilidad de que el presunto responsable pueda reconocer voluntariamente su responsabilidad, con los efectos previstos en el artículo 85.</p><p>e) Medidas de carácter provisional que se hayan acordado por el órgano competente para iniciar el procedimiento sancionador, sin perjuicio de las que se puedan adoptar durante el mismo de conformidad con el artículo 56.</p><p>f) Indicación del derecho a formular alegaciones y a la audiencia en el procedimiento y de los plazos para su ejercicio, así como indicación de que, en caso de no efectuar alegaciones en el plazo previsto sobre el contenido del acuerdo de iniciación, éste podrá ser considerado propuesta de resolución cuando contenga un pronunciamiento preciso acerca de la responsabilidad imputada.</p><p>3. Excepcionalmente, cuando en el momento de dictar el acuerdo de iniciación no existan elementos suficientes para la calificación inicial de los hechos que motivan la incoación del procedimiento, la citada calificación podrá realizarse en una fase posterior mediante la elaboración de un Pliego de cargos, que deberá ser notificado a los interesados.</p>", "dis": "<ul>\n<li><b>64.1 — comunicación:</b> se comunica al <b>instructor</b> con traslado de las actuaciones y se <b>notifica a los interesados</b>, entendiendo por tal <b>en todo caso al inculpado</b>. La incoación se comunica también al <b>denunciante</b> cuando las normas lo prevean.</li>\n<li><b>64.2 — contenido mínimo:</b>\n<table><thead><tr><th>Letra</th><th>Contenido</th></tr></thead><tbody>\n<tr><td><b>a)</b></td><td><b>Identificación</b> de los presuntos responsables</td></tr>\n<tr><td><b>b)</b></td><td><b>Hechos</b> que motivan la incoación, su <b>posible calificación</b> y las <b>sanciones</b> que pudieran corresponder</td></tr>\n<tr><td><b>c)</b></td><td>Identificación del <b>instructor</b> y, en su caso, <b>secretario</b>, con indicación del régimen de <span class=\"t\" data-k=\"recusacion\">recusación</span></td></tr>\n<tr><td><b>d)</b></td><td><b>Órgano competente</b> para resolver y <b>norma</b> que le atribuye la competencia, indicando la posibilidad de <b>reconocimiento voluntario</b> de responsabilidad (art. 85)</td></tr>\n<tr><td><b>e)</b></td><td><b>Medidas provisionales</b> acordadas, sin perjuicio de las que puedan adoptarse conforme al art. 56</td></tr>\n<tr><td><b>f)</b></td><td>Indicación del derecho a <b>formular alegaciones</b> y a la <b>audiencia</b> y de sus plazos, advirtiendo de que si no se formulan alegaciones el acuerdo <b>podrá ser considerado propuesta de resolución</b></td></tr>\n</tbody></table></li>\n<li><b>64.3 — calificación diferida:</b> excepcionalmente, si no hay elementos suficientes, la calificación puede realizarse en fase posterior mediante <b>pliego de cargos</b>, notificado a los interesados.</li>\n</ul>\n<div class=\"box warn\"><span class=\"lbl\">La advertencia del art. 64.2.f)</span>Si el inculpado <b>no alega nada</b>, el acuerdo de iniciación <b>puede convertirse en propuesta de resolución</b>. El silencio del sancionado acorta el procedimiento en su contra: por eso la ley obliga a advertírselo.</div>", "llano": "<p>El acuerdo de iniciación es el documento que te dice de qué se te acusa, quién instruye, quién decide y qué puede caerte. Y contiene un aviso importante: si no dices nada, ese mismo acuerdo puede pasar directamente a propuesta de resolución.</p>", "porque": "<p>Todo el contenido del art. 64.2 sirve al <b>derecho de defensa</b> reconocido en el art. 53.2.a): no se puede rebatir lo que no se conoce. La identificación del instructor permite además ejercer la <b>recusación</b>, y la mención del reconocimiento voluntario abre la puerta a las reducciones del art. 85.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> una carta que te dice exactamente qué se te reprocha, quién lo revisa y qué puedes hacer.</li>\n<li><b>Real:</b> acuerdo de incoación por venta ambulante sin autorización, con identificación del titular, calificación como infracción grave, sanción posible, instructor designado y órgano competente.</li>\n<li><b>Caso límite:</b> el inculpado no presenta alegaciones en plazo. El acuerdo <b>se considera propuesta de resolución</b> y el procedimiento avanza directamente (art. 64.2.f).</li>\n</ul>", "noej": "<ul>\n<li><b>No basta</b> con notificar los hechos: hay que indicar <b>calificación</b>, <b>sanciones</b>, <b>instructor</b> y <b>órgano competente</b>.</li>\n<li><b>No siempre</b> se comunica al denunciante: solo cuando las normas reguladoras lo prevean.</li>\n<li><b>No es</b> ordinaria la calificación diferida: es <b>excepcional</b>.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 53.2 LPAC:</b> derechos del presunto responsable.</li>\n<li><b>Art. 85 LPAC:</b> terminación en los procedimientos sancionadores y reducciones.</li>\n<li><b>Art. 56 LPAC:</b> medidas provisionales.</li>\n<li><b>Arts. 23 y 24 de la Ley 40/2015</b> (documento 2): abstención y recusación.</li>\n</ul>", "trampas": "<ul>\n<li>Son <b>seis</b> contenidos mínimos, de la a) a la f).</li>\n<li>La falta de alegaciones convierte el acuerdo en <b>propuesta de resolución</b>.</li>\n<li>El <b>pliego de cargos</b> es un instrumento <b>excepcional</b> para calificar después.</li>\n</ul>", "ancla": "<p><b>«Quién eres, qué hiciste, quién instruye, quién decide, qué te aplico ya y qué puedes hacer.»</b> Seis letras.</p>", "vis": "<svg viewBox=\"0 0 660 145\" role=\"img\" aria-label=\"Contenido del acuerdo de iniciación sancionador\">\n<rect x=\"195\" y=\"8\" width=\"270\" height=\"30\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/>\n<text x=\"330\" y=\"28\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">ACUERDO DE INICIACIÓN</text>\n<g font-size=\"10\" text-anchor=\"middle\" fill=\"currentColor\">\n<rect x=\"15\" y=\"52\" width=\"200\" height=\"62\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"115\" y=\"74\" font-weight=\"700\" fill=\"var(--exc)\">La acusación</text><text x=\"115\" y=\"92\">a) responsables</text><text x=\"115\" y=\"106\">b) hechos, calificación y sanción</text>\n<rect x=\"230\" y=\"52\" width=\"200\" height=\"62\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"330\" y=\"74\" font-weight=\"700\" fill=\"var(--acc)\">Los órganos</text><text x=\"330\" y=\"92\">c) instructor y recusación</text><text x=\"330\" y=\"106\">d) quién resuelve</text>\n<rect x=\"445\" y=\"52\" width=\"200\" height=\"62\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"545\" y=\"74\" font-weight=\"700\" fill=\"var(--ej)\">Tus opciones</text><text x=\"545\" y=\"92\">e) medidas provisionales</text><text x=\"545\" y=\"106\">f) alegaciones y audiencia</text>\n</g>\n<text x=\"330\" y=\"136\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--warn)\">Sin alegaciones, el acuerdo puede valer como PROPUESTA DE RESOLUCIÓN</text>\n</svg>"}]);
</script>
<script>
ARTS.push.apply(ARTS,[{"n": 65, "t": "Especialidades en el inicio de oficio de los procedimientos de responsabilidad patrimonial", "ubic": "Título IV ▸ Capítulo II ▸ Sección 2.ª (Iniciación del procedimiento de oficio por la Administración)", "idea": "Responsabilidad patrimonial de oficio: sin prescripción y con diez días de alegaciones.", "literal": "<p>1. Cuando las Administraciones Públicas decidan iniciar de oficio un procedimiento de responsabilidad patrimonial será necesario que no haya prescrito el derecho a la reclamación del interesado al que se refiere el artículo 67.</p><p>2. El acuerdo de iniciación del procedimiento se notificará a los particulares presuntamente lesionados, concediéndoles un plazo de diez días para que aporten cuantas alegaciones, documentos o información estimen conveniente a su derecho y propongan cuantas pruebas sean pertinentes para el reconocimiento del mismo. El procedimiento iniciado se instruirá aunque los particulares presuntamente lesionados no se personen en el plazo establecido.</p>", "dis": "<ul>\n<li><b>65.1 — requisito previo:</b> para iniciar de oficio un procedimiento de <span class=\"t\" data-k=\"respatrimonial\">responsabilidad patrimonial</span> es necesario que <b>no haya prescrito</b> el derecho a la reclamación del interesado del art. 67 —esto es, el plazo de <b>un año</b>—.</li>\n<li><b>65.2 — audiencia inicial:</b> el acuerdo se notifica a los <b>particulares presuntamente lesionados</b>, concediéndoles <b>diez días</b> para aportar alegaciones, documentos o información y proponer pruebas.</li>\n<li><b>65.2, inciso final — la no personación no paraliza:</b> el procedimiento iniciado <b>se instruirá aunque los particulares presuntamente lesionados no se personen</b> en el plazo establecido.</li>\n</ul>", "llano": "<p>La Administración puede reconocer por su cuenta que ha causado un daño, pero solo mientras el perjudicado siga teniendo derecho a reclamar: un año. Abierto el expediente, el afectado tiene <b>diez días</b> para decir lo suyo; si no se persona, el expediente <b>sigue adelante igualmente</b>.</p>", "porque": "<p>Es una vía poco frecuente pero coherente: si la Administración sabe que ha lesionado a alguien, no tiene sentido esperar a que reclame. El límite de la <b>prescripción</b> impide reabrir daños antiguos ya consolidados. Y que el procedimiento continúe <b>sin personación</b> del lesionado evita que su pasividad bloquee el reconocimiento de un derecho que le beneficia.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> una empresa que reconoce un fallo y ofrece compensación sin esperar la reclamación.</li>\n<li><b>Real:</b> tras el desprendimiento de una farola municipal que dañó tres vehículos, el ayuntamiento incoa de oficio el expediente y notifica a los propietarios, con <b>diez días</b> de alegaciones.</li>\n<li><b>Caso límite:</b> el hecho ocurrió hace catorce meses y nadie reclamó. El derecho ha <b>prescrito</b> y no cabe iniciar de oficio (art. 65.1).</li>\n</ul>", "noej": "<ul>\n<li><b>No cabe</b> iniciar si el derecho a reclamar ha <b>prescrito</b>.</li>\n<li><b>No se paraliza</b> el procedimiento porque el lesionado no se persone: se instruye igualmente.</li>\n<li><b>No son</b> quince días de alegaciones: son <b>diez</b>.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 67 LPAC:</b> solicitud del interesado y plazo de prescripción de un año.</li>\n<li><b>Art. 91.3 LPAC:</b> transcurridos <b>seis meses</b> desde el inicio sin resolución ni acuerdo, puede entenderse que la resolución es contraria a la indemnización.</li>\n<li><b>Art. 25.1.b) LPAC:</b> caducidad de los procedimientos iniciados de oficio.</li>\n<li><b>Arts. 32 a 37 de la Ley 40/2015</b> (documento 2): régimen sustantivo.</li>\n</ul>", "trampas": "<ul>\n<li><b>Un año</b> de prescripción del derecho a reclamar y <b>diez días</b> de alegaciones.</li>\n<li>La <b>no personación</b> del lesionado no impide la instrucción.</li>\n<li>Los <b>seis meses</b> para entender la resolución contraria a la indemnización están en el art. <b>91.3</b>, no aquí.</li>\n</ul>", "ancla": "<p><b>«Un año para que no prescriba, diez días para alegar, y sigo aunque no vengas.»</b></p>", "vis": "<svg viewBox=\"0 0 640 130\" role=\"img\" aria-label=\"Iniciación de oficio de la responsabilidad patrimonial\">\n<g font-size=\"10\" text-anchor=\"middle\" fill=\"currentColor\">\n<rect x=\"25\" y=\"32\" width=\"175\" height=\"60\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"112\" y=\"56\" font-size=\"13\" font-weight=\"700\" fill=\"var(--exc)\">1 año</text><text x=\"112\" y=\"76\">que no haya prescrito</text>\n<rect x=\"232\" y=\"32\" width=\"175\" height=\"60\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"319\" y=\"56\" font-size=\"13\" font-weight=\"700\" fill=\"var(--acc)\">10 días</text><text x=\"319\" y=\"76\">alegaciones del lesionado</text>\n<rect x=\"439\" y=\"32\" width=\"176\" height=\"60\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"527\" y=\"56\" font-size=\"12\" font-weight=\"700\" fill=\"var(--ej)\">Sin personación</text><text x=\"527\" y=\"76\">el procedimiento se instruye igual</text>\n</g>\n<text x=\"320\" y=\"118\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--ink2)\">Los seis meses del art. 91.3 permiten entender la resolución contraria a la indemnización</text>\n</svg>"}]);
</script>
<script>
const PLAZOS=[["15 días", "Plazo para dictar el acuerdo de iniciación tras medidas provisionales previas", "Administración", "56.2 LPAC", "Si no, las medidas quedan sin efecto"], ["10 días", "Alegaciones del lesionado en responsabilidad patrimonial iniciada de oficio", "Interesado", "65.2 LPAC", "Con proposición de prueba"], ["6 meses", "Transcurso desde el inicio que permite entender la resolución contraria a la indemnización", "Interesado", "91.3 LPAC", "En responsabilidad patrimonial"], ["1 año", "Prescripción del derecho a reclamar en responsabilidad patrimonial", "Interesado", "65.1 y 67.1 LPAC", "Desde el hecho o la manifestación del efecto lesivo"], ["9 derechos", "Derechos del interesado en todo procedimiento", "Interesado", "53.1 LPAC", "Letras a) a i)"], ["2 derechos", "Derechos adicionales del presunto responsable en procedimientos sancionadores", "Inculpado", "53.2 LPAC", "Notificación de la acusación y presunción de no responsabilidad"], ["4 modalidades", "Formas de iniciación de oficio", "Administración", "58 LPAC", "Iniciativa, orden superior, petición razonada y denuncia"], ["6 contenidos", "Contenido mínimo del acuerdo de iniciación sancionador", "Administración", "64.2 LPAC", "Letras a) a f)"], ["9 medidas", "Catálogo de medidas provisionales", "Administración", "56.3 LPAC", "Más las previstas en otras leyes"], ["Órganos distintos", "Separación entre instrucción y resolución en lo sancionador", "Administración", "63.1 LPAC", "Garantía esencial"]];
const FLASH=[["Cita cuatro derechos del interesado del art. 53.1", "Conocer el <b>estado</b> y el <b>sentido del silencio</b> · <b>identificar</b> al personal · no presentar <b>originales</b> · no presentar documentos <b>ya en poder</b> de la Administración · <b>alegar</b> y aportar hasta la audiencia · <b>información y orientación</b> · <b>asesor</b> · <b>pago electrónico</b>."], ["¿Hasta cuándo pueden aportarse documentos según el art. 53.1.e)?", "En <b>cualquier fase anterior al trámite de audiencia</b>, y deben tenerse en cuenta al redactar la propuesta de resolución."], ["Los dos derechos adicionales en procedimientos sancionadores", "Ser <b>notificado</b> de hechos, infracciones, sanciones, instructor, autoridad competente y norma; y la <b>presunción de no existencia de responsabilidad</b> (art. 53.2)."], ["¿Cómo pueden iniciarse los procedimientos?", "<b>De oficio</b> o <b>a solicitud del interesado</b> (art. 54)."], ["¿Para qué sirven las actuaciones previas?", "Para conocer las circunstancias del caso y la <b>conveniencia o no</b> de iniciar el procedimiento (art. 55.1). En lo sancionador, para precisar hechos y responsables."], ["¿Cuándo pueden adoptarse medidas provisionales antes de iniciar?", "En casos de <b>urgencia inaplazable</b>, con motivación; deben confirmarse en el acuerdo de iniciación, a dictar en <b>quince días</b> (art. 56.2)."], ["¿Qué medidas provisionales no pueden adoptarse?", "Las que causen <b>perjuicio de difícil o imposible reparación</b> a los interesados o impliquen <b>violación de derechos amparados por las leyes</b> (art. 56.4)."], ["Requisitos de la acumulación", "<b>Identidad sustancial o íntima conexión</b> y que sea el <b>mismo órgano</b> quien deba tramitar y resolver. Contra el acuerdo <b>no procede recurso</b> (art. 57)."], ["Las cuatro modalidades de iniciación de oficio", "<b>Propia iniciativa</b> · <b>orden superior</b> · <b>petición razonada</b> de otros órganos · <b>denuncia</b> (art. 58)."], ["¿Qué es la propia iniciativa?", "La actuación derivada del <b>conocimiento directo o indirecto</b> de los hechos por el órgano que tiene la competencia de iniciación (art. 59)."], ["¿Qué debe expresar la orden superior en lo sancionador?", "<b>En la medida de lo posible</b>: responsables, conductas o hechos y su tipificación, y lugar, fecha o período de comisión (art. 60.2)."], ["¿Vincula la petición razonada al órgano competente?", "<b>No</b>, pero deberá <b>comunicar los motivos</b> por los que, en su caso, no procede la iniciación (art. 61.2)."], ["¿Confiere la denuncia la condición de interesado?", "<b>No, por sí sola</b> (art. 62.5)."], ["¿Cuándo debe motivarse la no iniciación tras una denuncia?", "Cuando la denuncia invoque un <b>perjuicio en el patrimonio</b> de las Administraciones; además se notifica al denunciante la decisión (art. 62.3)."], ["¿Qué requisitos exige la exención del denunciante colaborador?", "Ser el <b>primero</b> en aportar elementos de prueba que permitan iniciar el procedimiento o <b>comprobar la infracción</b>, que en ese momento <b>no se disponga</b> de elementos suficientes, <b>reparar el perjuicio</b>, <b>cesar</b> en la participación y <b>no destruir</b> pruebas (art. 62.4)."], ["Dos reglas básicas del inicio del procedimiento sancionador", "<b>Siempre de oficio</b> y con <b>separación entre la fase instructora y la sancionadora</b>, encomendadas a <b>órganos distintos</b> (art. 63.1)."], ["¿Cabe sancionar sin procedimiento?", "<b>En ningún caso</b> (art. 63.2)."], ["¿Pueden abrirse nuevos expedientes por una infracción continuada?", "<b>No</b>, en tanto no haya recaído una <b>primera resolución sancionadora con carácter ejecutivo</b> (art. 63.3)."], ["Cita cuatro contenidos del acuerdo de iniciación sancionador", "<b>Responsables</b> · <b>hechos, calificación y sanciones</b> · <b>instructor</b> y régimen de recusación · <b>órgano competente</b> y norma · <b>medidas provisionales</b> · derecho a <b>alegaciones y audiencia</b> (art. 64.2)."], ["¿Qué ocurre si el inculpado no formula alegaciones?", "El acuerdo de iniciación <b>podrá ser considerado propuesta de resolución</b>, y así debe advertírsele (art. 64.2.f)."], ["Requisito para iniciar de oficio la responsabilidad patrimonial", "Que <b>no haya prescrito</b> el derecho a reclamar del interesado, que prescribe al <b>año</b> (arts. 65.1 y 67.1)."], ["¿Qué ocurre si el lesionado no se persona en el procedimiento de responsabilidad patrimonial iniciado de oficio?", "El procedimiento <b>se instruirá igualmente</b>: la no personación en el plazo de diez días no lo paraliza (art. 65.2)."]];
const TEST=[{"a": 53, "q": "Según el art. 53.1.e), los interesados pueden aportar documentos:", "o": [["en cualquier fase del procedimiento anterior al trámite de audiencia", 1, "Correcto: y deben ser tenidos en cuenta al redactar la propuesta de resolución."], ["hasta la resolución definitiva", 0, "El límite es el trámite de audiencia."], ["solo con la solicitud inicial", 0, "Pueden aportarse después."], ["solo si lo autoriza el instructor", 0, "Es un derecho, no una autorización."]]}, {"a": 53, "q": "En los procedimientos sancionadores, el presunto responsable tiene derecho:", "o": [["a la presunción de no existencia de responsabilidad administrativa mientras no se demuestre lo contrario", 1, "Correcto: art. 53.2.b)."], ["a que se archive el expediente si lo solicita", 0, "No existe tal derecho."], ["a designar al instructor", 0, "Puede recusarlo, no designarlo."], ["a no ser notificado hasta la propuesta de resolución", 0, "Al contrario: debe ser notificado de la acusación."]]}, {"a": 54, "q": "Los procedimientos administrativos pueden iniciarse:", "o": [["de oficio o a solicitud del interesado", 1, "Correcto: art. 54. No hay una tercera vía."], ["de oficio, por denuncia o a solicitud", 0, "La denuncia es una modalidad de la iniciación de oficio."], ["solo de oficio", 0, "También a solicitud."], ["por orden judicial", 0, "No es una clase de iniciación del art. 54."]]}, {"a": 55, "q": "Las actuaciones previas:", "o": [["se realizan con anterioridad al inicio del procedimiento para valorar la conveniencia de iniciarlo", 1, "Correcto: art. 55.1."], ["forman parte de la fase de instrucción", 0, "Son anteriores al procedimiento."], ["son obligatorias en todo procedimiento", 0, "La ley dice «podrá abrir»."], ["sustituyen al acuerdo de iniciación", 0, "No lo sustituyen."]]}, {"a": 56, "q": "Las medidas provisionales adoptadas antes de la iniciación quedan sin efecto si:", "o": [["no se inicia el procedimiento en quince días o el acuerdo de iniciación no se pronuncia sobre ellas", 1, "Correcto: art. 56.2."], ["no se ratifican en el plazo de un mes", 0, "El plazo es de quince días."], ["el interesado las recurre", 0, "El recurso no las deja sin efecto automáticamente."], ["transcurren seis meses", 0, "No es el plazo previsto."]]}, {"a": 56, "q": "Completa: no podrán adoptarse medidas provisionales que puedan causar perjuicio de ______ reparación a los interesados.", "gap": "difícil o imposible", "fb": "De <b>difícil o imposible</b> reparación (art. 56.4), o que impliquen violación de derechos amparados por las leyes."}, {"a": 57, "q": "Contra el acuerdo de acumulación de procedimientos:", "o": [["no procederá recurso alguno", 1, "Correcto: art. 57."], ["cabe recurso de alzada", 0, "La ley excluye todo recurso."], ["cabe recurso potestativo de reposición", 0, "La ley excluye todo recurso."], ["cabe recurso contencioso directo", 0, "No es lo que dispone el precepto."]]}, {"a": 58, "q": "¿Cuál NO es una modalidad de iniciación de oficio?", "o": [["la solicitud del interesado", 1, "Correcto: esa es la otra clase de iniciación del art. 54."], ["la propia iniciativa", 0, "Art. 59."], ["la orden superior", 0, "Art. 60."], ["la denuncia", 0, "Art. 62."]]}, {"a": 61, "q": "La petición razonada de otro órgano:", "o": [["no vincula al órgano competente, que deberá comunicarle los motivos de la no iniciación", 1, "Correcto: art. 61.2."], ["obliga a iniciar el procedimiento", 0, "No vincula."], ["inicia por sí sola el procedimiento", 0, "Se inicia por acuerdo del órgano competente."], ["solo cabe entre órganos con relación jerárquica", 0, "Eso sería orden superior."]]}, {"a": 62, "q": "La presentación de una denuncia:", "o": [["no confiere por sí sola la condición de interesado", 1, "Correcto: art. 62.5."], ["convierte al denunciante en interesado", 0, "No, por sí sola."], ["obliga siempre a incoar el procedimiento", 0, "El órgano valora si procede."], ["debe presentarse siempre de forma anónima", 0, "Debe expresar la identidad de quien la prese orrecto: art. 64.2.f), y debe advertírsele expresamente."], ["se archiva el procedimiento", 0, "No es la consecuencia."], ["se le tiene por conforme y se le exime de sanción", 0, "No es lo previsto."], ["debe reiterarse la notificación", 0, "No procede."]]}, {"a": 65, "q": "Para iniciar de oficio un procedimiento de responsabilidad patrimonial es necesario:", "o": [["que no haya prescrito el derecho a la reclamación del interesado", 1, "Correcto: art. 65.1, en relación con el plazo de un año del art. 67.1."], ["que el interesado haya reclamado previamente", 0, "Precisamente se inicia de oficio."], ["que exista sentencia judicial previa", 0, "No se exige."], ["que hayan transcurrido seis meses desde el hecho", 0, "No es un requisito."]]}, {"a": 65, "q": "En el procedimiento de responsabilidad patrimonial iniciado de oficio, el plazo de alegaciones del lesionado es de:", "o": [["diez días", 1, "Correcto: art. 65.2."], ["quince días", 0, "No es el plazo legal."], ["un mes", 0, "No es el plazo legal."], ["veinte días hábiles", 0, "No es el plazo legal."]]}, {"a": 53, "q": "Completa: los interesados tienen derecho a no presentar datos y documentos no exigidos por las normas que ya se encuentren en poder de ______.", "gap": "las Administraciones Públicas", "fb": "De <b>las Administraciones Públicas</b> o que hayan sido elaborados por estas (art. 53.1.d)."}, {"a": 58, "q": "La iniciación de oficio se produce siempre:", "o": [["por acuerdo del órgano competente", 1, "Correcto: art. 58, cualquiera que sea el origen del impulso."], ["por la denuncia del particular", 0, "La denuncia no inicia por sí sola."], ["por la orden del superior", 0, "La orden impulsa, pero el acuerdo lo dicta el órgano competente."], ["por la petición razonada de otro órgano", 0, "Tampoco inicia por sí sola."]]}, {"a": 56, "q": "Las medidas provisionales se extinguen:", "o": [["cuando surta efectos la resolución administrativa que ponga fin al procedimiento", 1, "Correcto: art. 56.5."], ["a los seis me const CASOS=[{"t": "Caso 1 · Del ruido al expediente", "e": "Un vecino denuncia por escrito ruidos nocturnos procedentes de un bar. La policía local realiza mediciones durante dos semanas. El órgano competente incoa expediente sancionador y, el mismo día, acuerda el <b>cierre temporal</b> del establecimiento. El denunciante pide que se le tenga por parte y que se le notifique todo. <b>Analiza cada paso.</b>", "s": "<p><b>1) La denuncia.</b> Es una de las cuatro modalidades del art. <b>58</b>, pero <b>no inicia</b> el procedimiento: este se abre por <b>acuerdo del órgano competente</b>. Debe expresar la identidad del denunciante y el relato de los hechos, con la fecha de comisión (art. 62.2).</p><p><b>2) Las mediciones.</b> Son <b>actuaciones previas</b> del art. <b>55</b>, realizadas por un órgano con funciones de inspección. No forman parte del procedimiento y <b>no consumen</b> el plazo de caducidad, aunque sí corre la prescripción de la infracción.</p><p><b>3) El cierre temporal.</b> Es una <b>medida provisional</b> del art. <b>56.3.c)</b>. Al adoptarse con el procedimiento ya iniciado, rige el art. 56.1: la acuerda el órgano competente para resolver, <b>de forma motivada</b>, si hay elementos de juicio suficientes. Debe además constar en el acuerdo de iniciación (art. 64.2.e). Límite: no puede causar perjuicio de <b>difícil o imposible reparación</b> (art. 56.4).</p><p><b>4) La petición del denunciante.</b> El art. <b>62.5</b> es tajante: la denuncia <b>no confiere por sí sola</b> la condición de interesado. Ahora bien, si el vecino es el <b>afectado directo</b> por los ruidos, puede ser interesado por la vía del art. 4, en cuanto titular de un interés legítimo propio. Son dos títulos distintos y conviene no confundirlos.</p><p><b>5) El acuerdo de iniciación.</b> Debe contener los seis extremos del art. <b>64.2</b>, incluida la advertencia de que, sin alegaciones, podrá considerarse <b>propuesta de resolución</b>.</p>"}, {"t": "Caso 2 · La medida que llegó antes", "e": "El viernes 6 de marzo, ante un riesgo eléctrico detectado en un local de ocio, el órgano competente para instruir acuerda motivadamente la <b>suspensión temporal de la actividad</b> sin que exista todavía expediente. El acuerdo de iniciación se dicta el <b>25 de marzo</b> y no menciona la medida. <b>¿Cuál es la situación jurídica de la suspensión?</b>", "s": "<p><b>1) Cobertura de la medida.</b> El art. <b>56.2</b> permite adoptar medidas provisionales <b>antes</b> de iniciar el procedimiento, pero solo en casos de <b>urgencia inaplazable</b> y para la protección provisional de los intereses implicados. Un riesgo eléctrico en un local de pública concurrencia encaja sin dificultad.</p><p><b>2) Primer incumplimiento: el plazo.</b> El acuerdo de iniciación debe dictarse dentro de los <b>quince días</b> siguientes. Del 6 al 25 de marzo han transcurrido diecinueve. La medida ha <b>quedado sin efecto</b>.</p><p><b>3) Segundo incumplimiento: el pronunciamiento.</b> Aunque se hubiera dictado en plazo, el art. 56.2 exige que el acuerdo de iniciación contenga un <b>pronunciamiento expreso</b> confirmando, modificando o levantando la medida. Al no mencionarla, la medida decae igualmente.</p><p><b>4) Consecuencia práctica.</b> La suspensión carece de cobertura desde el vencimiento del plazo. Si el riesgo persiste, la Administración debe <b>adoptarla de nuevo</b>, ahora por la vía del art. <b>56.1</b>, con el procedimiento ya iniciado y de forma motivada.</p><p><b>5) Lo que hay que retener.</b> Dos causas <b>autónomas</b> de pérdida de efectos: no iniciar en quince días <b>o</b> no pronunciarse expresamente. Basta una.</p>"}, {"t": "Caso 3 · Quién instruye y quién sanciona", "e": "En un ayuntamiento, la alcaldía dicta el acuerdo de incoación de un expediente sancionador, se designa a sí misma instructora y firma después la resolución sancionadora de 1.500 €. El expediente se abre a petición expresa del denunciante, que pedía la sanción. Además, el establecimiento sigue abierto y se le abre un segundo expediente por los mismos hechos a la semana siguiente. <b>Identifica todas las irregularidades.</b>", "s": "<p><b>1) Falta de separación.</b> El art. <b>63.1</b> exige la <b>debida separación entre la fase instructora y la sancionadora</b>, encomendadas a <b>órganos distintos</b>. Que la alcaldía instruya y resuelva vulnera esa garantía esencial. Es un defecto de forma que produce <b>indefensión</b>: anulabilidad del art. <b>48.2</b>, y para un sector de la doctrina incluso nulidad del art. 47.1.a) por afectar a garantías esenciales del procedimiento.</p><p><b>2) Iniciación a instancia del denunciante.</b> Improcedente. El art. 63.1 dispone que los sancionadores se inician <b>siempre de oficio</b>. La denuncia solo aporta la <i>notitia</i>; el acuerdo lo dicta el órgano competente (art. 58) y el denunciante no es interesado por ese solo hecho (art. 62.5).</p><p><b>3) El segundo expediente.</b> Vulnera el art. <b>63.3</b>: no pueden iniciarse nuevos procedimientos por hechos en cuya comisión el infractor <b>persista de forma continuada</b> mientras no exista una <b>primera resolución sancionadora ejecutiva</b>.</p><p><b>4) Qué debió hacerse.</b> Incoar de oficio, designar <b>instructor distinto</b> del órgano que resuelve, notificar el acuerdo con los seis contenidos del art. <b>64.2</b> —incluida la identificación del instructor y su régimen de <b>recusación</b>— y esperar a la primera resolución ejecutiva antes de cualquier nuevo expediente.</p><p><b>5) Vía de reacción.</b> Recurso contra la resolución sancionadora; y si prospera por vicio de forma, <b>retroacción</b> al momento del vicio conforme al art. 119.2, conservando lo que hubiera sido igual (art. 51).</p>"}];

const INTRO_HTML="<section class=\"card\" id=\"intro\"><h2>Tema 3 · Bloque 1 · Garantías e iniciación del procedimiento</h2><p class=\"small\">Arranca el tema 3, dedicado a las <b>fases del procedimiento administrativo</b>. Este primer bloque cubre los Capítulos I y II del Título IV de la Ley 39/2015: los derechos que acompañan al interesado durante todo el expediente y todo lo relativo a su <b>apertura</b>.</p><div class=\"box ej\"><span class=\"lbl\">El mapa del tema 3</span>El procedimiento tiene cuatro momentos: <b>iniciación</b> (arts. 54 a 69) → <b>ordenación</b> (arts. 70 a 74) → <b>instrucción</b> (arts. 75 a 83) → <b>finalización</b> (arts. 84 a 95), más la <b>ejecución</b> (arts. 97 a 105). Este bloque cubre el primero.</div><div class=\"box warn\"><span class=\"lbl\">Fuentes utilizadas y vigencia</span><ul><li><b>Ley 39/2015, de 1 de octubre</b> (documento 1 de la biblioteca), texto consolidado. Arts. 53 a 65.</li><li>Concordancias con la <b>Ley 40/2015</b> (documento 2) en materia de abstención y recusación (arts. 23 y 24), principios de la potestad sancionadora (arts. 25 a 31) y responsabilidad patrimonial (arts. 32 a 37).</li><li><b>Aportación externa</b>: la <b>Ley 1/2000, de Enjuiciamiento Civil</b>, a la que remite expresamente el art. 56.3 para las medidas provisionales. Verifica la vigencia en el BOE consolidado.</li><li>Los arts. 66 a 69 —solicitudes, subsanación y declaración responsable— se tratan en el <b>bloque 2</b>.</li></ul></div><svg viewBox=\"0 0 660 200\" role=\"img\" aria-label=\"Mapa conceptual de la iniciación del procedimiento\"><rect x=\"215\" y=\"8\" width=\"230\" height=\"32\" rx=\"9\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"330\" y=\"30\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"#fff\">INICIACIÓN</text><line x1=\"330\" y1=\"40\" x2=\"330\" y2=\"56\" stroke=\"var(--acc)\" stroke-width=\"2\"/><line x1=\"165\" y1=\"56\" x2=\"495\" y2=\"56\" stroke=\"var(--acc)\" stroke-width=\"2\"/><line x1=\"165\" y1=\"56\" x2=\"165\" y2=\"72\" stroke=\"var(--acc)\" stroke-width=\"2\"/><line x1=\"495\" y1=\"56\" x2=\"495\" y2=\"72\" stroke=\"var(--acc)\" stroke-width=\"2\"/><rect x=\"25\" y=\"72\" width=\"280\" height=\"112\" rx=\"9\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"165\" y=\"94\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"var(--warn)\">DE OFICIO · arts. 58 a 65</text><text x=\"165\" y=\"117\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">59 iniciativa · 60 orden superior</text><text x=\"165\" y=\"139\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">61 petición razonada · 62 denuncia</text><text x=\"165\" y=\"161\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">63 y 64 sancionador · 65 patrimonial</text><text x=\"165\" y=\"178\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--ink2)\">riesgo de caducidad</text><rect x=\"355\" y=\"72\" width=\"280\" height=\"112\" rx=\"9\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"495\" y=\"94\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"var(--acc)\">GARANTÍAS Y CAUTELAS</text><text x=\"495\" y=\"117\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">53 derechos del interesado</text><text x=\"495\" y=\"139\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">55 actuaciones previas</text><text x=\"495\" y=\"161\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">56 medidas provisionales · 57 acumulación</text><text x=\"495\" y=\"178\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--ink2)\">antes y durante el expediente</text></svg></section>";
const RESUMEN_HTML="<section class=\"card\" id=\"resumen\"><h2>Resumen ejecutivo</h2><p class=\"small\"><b>Norma:</b> Ley 39/2015, Título IV, Capítulos I y II (arts. 53 a 65).</p><table><tbody><tr><th style=\"width:60px\">53</th><td><b>Nueve</b> derechos: estado y sentido del silencio · identificar al personal · no originales · no documentos ya en poder · <b>alegar y aportar hasta la audiencia</b> · información · asesor · pago electrónico · los demás. Sancionador: <b>notificación de la acusación</b> y <b>presunción de no responsabilidad</b>.</td></tr><tr><th>54-55</th><td>Dos clases: <b>de oficio</b> o <b>a solicitud</b>. Cabe abrir <b>actuaciones previas</b> para valorar si conviene iniciar; no computan a efectos de caducidad.</td></tr><tr><th>56</th><td>Medidas provisionales <b>motivadas</b> para asegurar la resolución. Antes de iniciar: <b>urgencia inaplazable</b> y <b>15 días</b> para incoar con pronunciamiento expreso. Nunca perjuicio de <b>difícil o imposible reparación</b>. Se extinguen con la resolución.</td></tr><tr><th>57</th><td><b>Acumulación</b>: identidad sustancial o íntima conexión + <b>mismo órgano</b>. <b>No procede recurso alguno</b>.</td></tr><tr><th>58-62</th><td>Cuatro modalidades de oficio: <b>propia iniciativa</b> · <b>orden superior</b> · <b>petición razonada</b> (no vincula, pero se contesta) · <b>denuncia</b> (no da la condición de interesado; exención al colaborador que sea el primero, repare y coopere).</td></tr><tr><th>63-64</th><td>Sancionador: <b>siempre de oficio</b>, con <b>separación</b> entre instrucción y sanción en <b>órganos distintos</b>; <b>nunca</b> sanción sin procedimiento; nada de expedientes en cadena por infracción <b>continuada</b>. Acuerdo con <b>seis</b> contenidos y advertencia de que, sin alegaciones, vale como <b>propuesta de resolución</b>.</td></tr><tr><th>65</th><td>Responsabilidad patrimonial de oficio: exige que <b>no haya prescrito</b> el año del art. 67 · <b>10 días</b> de alegaciones a los presuntos lesion (function(){
"use strict";
var K_THEME="oposi_bII_theme", K_FS="oposi_bII_fs", K_STREAK="oposi_bII_streak";
function load(k,f){try{var v=localStorage.getItem(k);return v?JSON.parse(v):f;}catch(e){return f;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
var root=document.documentElement;

/* Tema persistente (sobrescribe el toggle simple anterior) */
var saved=load(K_THEME,null);

else if(window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches){root.setAttribute("data-theme","dark");}

if(bt)bt.onclick=function(){
  var n=root.getAttribute("data-theme")==="dark"?"light":"dark";
  root.setAttribute("data-theme",n);save(K_THEME,n);
};

/* Tamaño de texto persistente */
var fs=load(K_FS,16);
function setFs(v){fs=Math.max(13,Math.min(22,v));root.style.setProperty("--fs",fs+"px");save(K_FS,fs);}
setFs(fs);
var bp=document.getElementById("fs+"),bm=document.getElementById("fs-");
if(bp)bp.onclick=function(){setFs(fs+1);};
if(bm)bm.onclick=function(){setFs(fs-1);};

(function(){

  var hoy=new Date().toISOString().slice(0,10);
  var s=load(K_STREAK,{last:null,n:0});
  if(s.last!==hoy){
    var ayer=new Date(Date.now()-864e5).toISOString().slice(0,10);
    s.n=(s.last===ayer)?s.n+1:1;s.last=hoy;save(K_STREAK,s);
  }
  el.textContent=s.n;
})();

/* Reveal on scroll para las tarjetas */
function reveal(){
  var els=document.querySelectorAll("section.card:not(.rv)");
  if(!els.length)return;
  if(!("IntersectionObserver" in window)){return;}
  var io=new IntersectionObserver(function(es){
    es.forEach(function(en){if(en.isIntersecting){en.target.classList.add("in");io.unobserve(en.target);}});
  },{threshold:.06,rootMargin:"0px 0px -30px 0px"});
  Array.prototype.forEach.call(els,function(el){el.classList.add("rv");io.observe(el);});
}

/* Sección activa en el índice lateral */
function spy(){
  var links=document.querySelectorAll("nav.side a[href^='#']");
  if(!links.length||!("IntersectionObserver" in window))return;
  var map={};
  Array.prototype.forEach.call(links,function(a){
    var t=document.getElementById(a.getAttribute("href").slice(1));
    if(t)map[t.id]=a;
  });
  var io=new IntersectionObserver(function(es){
    es.forEach(function(en){
      if(en.isIntersecting){
        Array.prototype.forEach.call(links,function(a){a.classList.remove("on");});
        if(map[en.target.id])map[en.target.id].classList.add("on");
      }
    });
  },{rootMargin:"-80px 0px -70% 0px",threshold:0});
  Object.keys(map).forEach(function(id){io.observe(document.getElementById(id));});
}

/* Ripple en botones */
document.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b||b.classList.contains("navtoggle"))return;
  var r=b.getBoundingClientRect(),d=Math.max(r.width,r.height),s=document.createElement("span");
  s.className="ripple";s.style.width=s.style.height=d+"px";
  s.style.left=(e.clientX-r.left-d/2)+"px";s.style.top=(e.clientY-r.top-d/2)+"px";
  b.appendChild(s);setTimeout(function(){if(s.parentNode)s.parentNode.removeChild(s);},560);
});

/* Atajos de teclado */
document.addEventListener("keydown",function(e){

  if(e.key==="/"){var q=document.getElementById("q");if(q){e.preventDefault();q.focus();}}

});

/* El contenido se inyecta por JS: esperamos a que exista */
function init(){reveal();spy();}
if(document.getElementById("main")&&document.getElementById("main").children.length){init();}
else{setTimeout(init,60);}
addEventListener("load",function(){setTimeout(init,80);});
})();


</script>

/* ═══ Parser de respuestas: estructura semántica ═══ */
var FCFMT=(function(){
  var CITA=/\s*\(((?:arts?\.|DA\b|DT\b|disp\.)[^)]*)\)\s*\.?\s*$/i;
  var strip=function(h){return h.replace(/<[^>]+>/g,"");};

  function esc(s){return s;}

  function parse(raw){
    var out={verdict:null,cite:null,kind:"p",items:[],text:""};
    var body=String(raw).trim();

    /* 1 ── Cita legal al final */
    var m=body.match(CITA);
    if(m){out.cite=m[1].replace(/\s+/g," ").trim();body=body.slice(0,m.index).trim();}
    body=body.replace(/[.;,\s]+$/,"");

    /* 2 ── Veredicto Sí / No inicial */
    var v=strip(body).match(/^(Sí|Sí,|No|No,)[.:,]?\s/);
    if(v){
      out.verdict=/^Sí/.test(v[1])?"si":"no";
      body=body.replace(/^(<[^>]+>\s*)*(Sí|No)[.,:]?\s*/,"").trim();
      body=body.replace(/^en\s/,"En ");
    }

    /* 3 ── Enumeración con · */
    var parts=body.split(/\s+·\s+/);
    if(parts.length>=2){
      out.kind="list";
      var letras=parts.filter(function(p){return /^\s*<?[a-h]\)/.test(strip(p));}).length;
      out.marker = letras>=parts.length-1 ? "alpha" : "num";
      out.items=parts.map(function(p){
        return p.replace(/^\s*[a-h]\)\s*/,"").replace(/[.\s]+$/,"").trim();
      }).filter(Boolean);
      return out;
    }

    /* 4 ── Cláusulas contrapuestas con ; */
    var semi=body.split(/;\s+/);
    if(semi.length>=2&&semi.length<=3&&semi.every(function(s){return strip(s).length>14;})){
      out.kind="clauses";
      out.items=semi.map(function(s){return s.replace(/[.\s]+$/,"").trim();});
      return out;
    }

    /* 5 ── Párrafo */
    out.text=body;
    return out;
  }

  function render(raw){
    var d=parse(raw),h="";

    if(d.verdict){
      h+='<span class="fc-verdict '+d.verdict+'">'+(d.verdict==="si"?"✓ Sí":"✗ No")+'</span>';
    }

    if(d.kind==="list"){
      h+='<ol class="fc-list '+d.marker+'">';
      d.items.forEach(function(it){h+='<li>'+it+'</li>';});
      h+='</ol>';
    }else if(d.kind==="clauses"){
      h+='<div class="fc-clauses">';
      d.items.forEach(function(it){h+='<p>'+it+'</p>';});
      h+='</div>';
    }else if(d.text){
      h+='<p class="fc-p">'+d.text+'</p>';
    }

    if(d.cite){
      h+='<span class="fc-cite"><span class="s">§</span>'+d.cite+'</span>';
    }
    return {html:h,struct:(d.kind!=="p"||!!d.verdict||strip(raw).length>150)};
  }
  return {parse:parse,render:render};
})();

/* ═══ Altura adaptativa + índice plegable ═══ */
(function(){

      side=document.getElementById("side"),
      tools=document.querySelector(".tools");

/* ── 2 · La tarjeta se adapta a su contenido ── */
function autofit(){
  var stage=document.querySelector(".fc-stage");
  if(!stage||stage.dataset.fit)return;
  var deck=stage.querySelector(".fc-deck"),
      front=stage.querySelector(".fc-front"),
      back=stage.querySelector(".fc-back");
  if(!deck||!front||!back)return;
  stage.dataset.fit="1";

  var meas=document.createElement("div");
  meas.className="fc-measure";meas.setAttribute("aria-hidden","true");
  meas.innerHTML='<div class="fc-face fc-front"><div class="fc-body"><div class="fc-txt"></div></div></div>';
  stage.appendChild(meas);
  var mFace=meas.querySelector(".fc-face"), mTxt=meas.querySelector(".fc-txt");

  function measure(cls,html){
    mFace.className="fc-face "+cls;
    mTxt.innerHTML=html;
    return mFace.offsetHeight;
  }

  function fit(){
    if(deck.classList.contains("empty")){deck.style.height="230px";return;}
    var fT=front.querySelector(".fc-txt"), bT=back.querySelector(".fc-txt");
    if(!fT||!bT)return;
    var h=Math.max(
      measure("fc-front"+(front.classList.contains("struct")?" struct":""),fT.innerHTML),
      measure("fc-back" +(back .classList.contains("struct")?" struct":""),bT.innerHTML),
      230
    );
    deck.style.height=Math.ceil(h+8)+"px";
  }

  /* recalcular cuando cambia la tarjeta, el tamaño de letra o la ventana */
  new MutationObserver(fit).observe(back,{childList:true,subtree:true,attributes:true,attributeFilter:["class"]});
  var t;
  addEventListener("resize",function(){clearTimeout(t);t=setTimeout(fit,120);},{passive:true});
  ["fs+","fs-"].forEach(function(id){
    var el=document.getElementById(id);
    if(el)el.addEventListener("click",function(){setTimeout(fit,60);});
  });
  fit();setTimeout(fit,250);
}

function go(){sidebar();autofit();}
if(document.readyState!=="loading")go();else document.addEventListener("DOMContentLoaded",go);
addEventListener("load",function(){setTimeout(go,120);});
var n=0,iv=setInterval(function(){go();if(++n>25)clearInterval(iv);},150);
})();

<script>


/* ═══════════════════════════════════════════════════════════════
   TTS · Lectura en voz alta del texto legal
   ═══════════════════════════════════════════════════════════════ */
(function(){
"use strict";
if(!("speechSynthesis" in window))return;

var K="oposi_bII_tts";
function load(){try{return JSON.parse(localStorage.getItem(K))||{};}catch(e){return {};}}
function save(o){try{localStorage.setItem(K,JSON.stringify(o));}catch(e){}}
var cfg=load();
if(cfg.rate==null)cfg.rate=1;
if(cfg.gen==null)cfg.gen="f";

var synth=window.speechSynthesis, voces=[], actual=null, bloques=[];

/* ─────────── 1 · Selección de voz ─────────── */
function esEspanol(v){return /^es\b|^es[-_]/i.test(v.lang||"")||/spanish|español/i.test(v.name||"");}
function calidad(v){
  var n=(v.name||"")+" "+(v.voiceURI||""), p=0;
  if(/natural|neural/i.test(n))p+=100;
  if(/online/i.test(n))p+=40;
  if(/premium|enhanced|eloquence/i.test(n))p+=35;
  if(/google/i.test(n))p+=30;
  if(v.localService===false)p+=15;
  if(/microsoft/i.test(n))p+=8;
  if(/^es-ES/i.test(v.lang))p+=12;   /* castellano de España primero */
  return p;
}
var MASC=/(pablo|álvaro|alvaro|jorge|diego|juan|raul|raúl|carlos|miguel|lorenzo|gonzalo|dalton|liam|andr[eé]s|luciano|male|hombre|masculin)/i;
var FEM =/(helena|elvira|laura|mónica|monica|paulina|sabina|esperanza|marisol|ximena|dalia|salome|camila|catalina|isidora|female|mujer|femenin)/i;
function genero(v){
  var n=v.name||"";
  if(MASC.test(n))return "m";
  if(FEM.test(n))return "f";
  return "?";
}
function cargarVoces(){
  var all=synth.getVoices()||[];
  voces=all.filter(esEspanol).sort(function(a,b){return calidad(b)-calidad(a);});
  if(!voces.length)voces=all.slice(0,12);
  pintarSelector();
}
function elegir(){
  if(cfg.voz){
    for(var i=0;i<voces.length;i++)if(voces[i].voiceURI===cfg.voz)return voces[i];
  }
  var g=cfg.gen;
  for(var j=0;j<voces.length;j++)if(genero(voces[j])===g)return voces[j];
  return voces[0]||null;
}

/* ─────────── 2 · Naturalidad: expandir lo que el TTS lee mal ─────────── */
var ORD={1:"primera",2:"segunda",3:"tercera",4:"cuarta",5:"quinta",
         6:"sexta",7:"séptima",8:"octava",9:"novena",10:"décima"};
function paraVoz(t){
  return t
    .replace(/\barts?\.\s*/gi,function(m){return /arts/i.test(m)?"artículos ":"artículo ";})
    .replace(/\bapdos?\.\s*/gi,"apartado ")
    .replace(/\bnúms?\.\s*/gi,"número ")
    .replace(/\bpárr\.\s*/gi,"párrafo ")
    .replace(/\bcap\.\s*/gi,"capítulo ")
    .replace(/\bpágs?\.\s*/gi,"página ")
    .replace(/\by\s+ss\./gi,"y siguientes")
    .replace(/\bss\./gi,"siguientes")
    .replace(/\bTRLHL\b/g,"Texto Refundido de la Ley de Haciendas Locales")
    .replace(/\bLCSP\b/g,"Ley de Contratos del Sector Público")
    .replace(/\bLBRL\b/g,"Ley de Bases del Régimen Local")
    .replace(/\bLRJSP\b/g,"Ley de Régimen Jurídico del Sector Público")
    .replace(/\bLPACAP\b/g,"Ley del Procedimiento Administrativo Común")
    .replace(/\bRDLeg\b/gi,"Real Decreto Legislativo")
    .replace(/\bRD\b/g,"Real Decreto")
    .replace(/\bCCAA\b/g,"comunidades autónomas")
    .replace(/\bCA\b/g,"comunidad autónoma")
    .replace(/\bEELL\b/g,"entidades locales")
    .replace(/\bBOE\b/g,"Boletín Oficial del Estado")
    .replace(/\bIVA\b/g,"I.V.A.")
    .replace(/\bSARA\b/g,"sara")
    .replace(/\bDA\s+(\d+)/g,"disposición adicional $1")
    .replace(/\bDT\s+(\d+)/g,"disposición transitoria $1")
    .replace(/(\d+)\.ª/g,function(m,n){return ORD[+n]||(n+"ª");})
    .replace(/(\d+)\.º/g,"$1º")
    /* 3.005,06 → 3005,06 para que lo lea como cifra y no como frase */
    .replace(/(\d)\.(?=\d{3}\b)/g,"$1")
    .replace(/(\d)\.(?=\d{3}\b)/g,"$1")
    .replace(/€/g," euros")
    .replace(/%/g," por ciento")
    .replace(/\bnº\b/gi,"número")
    .replace(/\s*·\s*/g,". ")
    .replace(/\(\s*/g,", ").replace(/\s*\)/g,", ")
    .replace(/\bvid\.\s*/gi,"véase ")
    .replace(/\bcfr\.\s*/gi,"compárese ")
    /* limpieza de puntuación tras las sustituciones */
    .replace(/([.:;!?])(?=[A-ZÁÉÍÓÚÑ¿¡])/g,"$1 ")
    .replace(/\s+([,.;:])/g,"$1")
    .replace(/,\s*([.;:])/g,"$1")
    .replace(/([,.;:])\s*\1+/g,"$1")
    .replace(/,\s*,/g,",")
    .replace(/\s{2,}/g," ")

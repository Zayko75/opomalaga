const GLOSARIO={"interesado": "Interesado: quien está legitimado para promover un procedimiento o intervenir en él porque es titular de derechos o intereses legítimos afectados por la decisión (art. 4 de la Ley 39/2015).", "conten": "Recurso contencioso-administrativo: impugnación ante los juzgados y tribunales de lo contencioso-administrativo, es decir, ya fuera de la propia Administración.", "silencio": "Silencio administrativo: efecto que la ley anuda a la falta de resolución expresa en plazo. Puede ser estimatorio (positivo) o desestimatorio (negativo) según el procedimiento.", "habil": "Días hábiles: se excluyen del cómputo los sábados, los domingos y los declarados festivos (art. 30.2 de la Ley 39/2015).", "pleno": "Pleno: órgano colegiado formado por todos los concejales o diputados de la entidad local.", "oficio": "Iniciación de oficio: la que acuerda el propio órgano competente, sin necesidad de solicitud del interesado. Tiene cuatro orígenes posibles (art. 58).", "instancia": "Iniciación a solicitud del interesado: la que se produce cuando un particular presenta una solicitud que la Administración debe tramitar y resolver.", "actprevias": "Información o actuaciones previas: indagación anterior al inicio del procedimiento para valorar si conviene iniciarlo. No forman parte todavía del procedimiento.", "provisional": "Medidas provisionales: decisiones cautelares adoptadas para asegurar la eficacia de la resolución que pueda recaer, con los límites del art. 56.4.", "acumulacion": "Acumulación: reunión de varios procedimientos en uno solo cuando guardan identidad sustancial o íntima conexión y los tramita el mismo órgano.", "peticion": "Petición razonada: propuesta de iniciación formulada por un órgano que no tiene competencia para iniciar. No vincula al competente (art. 61.2).", "denuncia": "Denuncia: acto por el que cualquier persona pone en conocimiento de la Administración un hecho que podría justificar la iniciación de oficio de un procedimiento.", "instructor": "Instructor: órgano o persona encargada de la tramitación del procedimiento sancionador, distinta de quien resuelve (art. 63.1).", "separacion": "Separación entre instrucción y sanción: exigencia de que la fase instructora y la sancionadora se encomienden a órganos distintos, garantía básica del procedimiento sancionador.", "recusacion": "Recusación: instrumento para apartar de un asunto a la autoridad o personal en quien concurra causa de abstención.", "respatrimonial": "Responsabilidad patrimonial: obligación de la Administración de indemnizar las lesiones que los particulares sufran como consecuencia del funcionamiento de los servicios públicos.", "prescripcionrp": "Prescripción de la reclamación patrimonial: el derecho a reclamar prescribe al año de producido el hecho o de manifestarse su efecto lesivo.", "presuncioninoc": "Presunción de no existencia de responsabilidad administrativa: en el procedimiento sancionador, el presunto responsable se presume no responsable mientras no se demuestre lo contrario (art. 53.2.b).", "continuada": "Infracción continuada: la que se comete de forma persistente en el tiempo. No cabe abrir nuevos procedimientos por esos hechos hasta que recaiga una primera resolución sancionadora ejecutiva."};
const LABELS={"interesado": "Interesado", "conten": "Recurso contencioso-administrativo", "silencio": "Silencio administrativo", "habil": "Días hábiles", "pleno": "Pleno", "oficio": "Iniciación de oficio", "instancia": "Iniciación a solicitud", "actprevias": "Actuaciones previas", "provisional": "Medidas provisionales", "acumulacion": "Acumulación", "peticion": "Petición razonada", "denuncia": "Denuncia", "instructor": "Instructor", "separacion": "Separación instrucción/sanción", "recusacion": "Recusación", "respatrimonial": "Responsabilidad patrimonial", "prescripcionrp": "Prescripción de la reclamación", "presuncioninoc": "Presunción de no responsabilidad", "continuada": "Infracción continuada"};
</script>
<script>
const ARTS=[{"n": 53, "t": "Derechos del interesado en el procedimiento administrativo", "ubic": "Título IV (De las disposiciones sobre el procedimiento administrativo común) ▸ Capítulo I (Garantías del procedimiento)", "idea": "Nueve derechos en todo procedimiento y dos más si es sancionador.", "literal": "<p>1. Además del resto de derechos previstos en esta Ley, los interesados en un procedimiento administrativo, tienen los siguientes derechos:</p><p>a) A conocer, en cualquier momento, el estado de la tramitación de los procedimientos en los que tengan la condición de interesados; el sentido del silencio administrativo que corresponda, en caso de que la Administración no dicte ni notifique resolución expresa en plazo; el órgano competente para su instrucción, en su caso, y resolución; y los actos de trámite dictados. Asimismo, también tendrán derecho a acceder y a obtener copia de los documentos contenidos en los citados procedimientos. Quienes se relacionen con las Administraciones Públicas a través de medios electrónicos, tendrán derecho a consultar la información a la que se refiere el párrafo anterior, en el Punto de Acceso General electrónico de la Administración que funcionará como un portal de acceso. Se entenderá cumplida la obligación de la Administración de facilitar copias de los documentos contenidos en los procedimientos mediante la puesta a disposición de las mismas en el Punto de Acceso General electrónico de la Administración competente o en las sedes electrónicas que correspondan.</p><p>b) A identificar a las autoridades y al personal al servicio de las Administraciones Públicas bajo cuya responsabilidad se tramiten los procedimientos.</p><p>c) A no presentar documentos originales salvo que, de manera excepcional, la normativa reguladora aplicable establezca lo contrario. En caso de que, excepcionalmente, deban presentar un documento original, tendrán derecho a obtener una copia autenticada de éste.</p><p>d) A no presentar datos y documentos no exigidos por las normas aplicables al procedimiento de que se trate, que ya se encuentren en poder de las Administraciones Públicas o que hayan sido elaborados por éstas.</p><p>e) A formular alegaciones, utilizar los medios de defensa admitidos por el Ordenamiento Jurídico, y a aportar documentos en cualquier fase del procedimiento anterior al trámite de audiencia, que deberán ser tenidos en cuenta por el órgano competente al redactar la propuesta de resolución.</p><p>f) A obtener información y orientación acerca de los requisitos jurídicos o técnicos que las disposiciones vigentes impongan a los proyectos, actuaciones o solicitudes que se propongan realizar.</p><p>g) A actuar asistidos de asesor cuando lo consideren conveniente en defensa de sus intereses.</p><p>h) A cumplir las obligaciones de pago a través de los medios electrónicos previstos en el artículo 98.2.</p><p>i) Cualesquiera otros que les reconozcan la Constitución y las leyes.</p><p>2. Además de los derechos previstos en el apartado anterior, en el caso de procedimientos administrativos de naturaleza sancionadora, los presuntos responsables tendrán los siguientes derechos:</p><p>a) A ser notificado de los hechos que se le imputen, de las infracciones que tales hechos puedan constituir y de las sanciones que, en su caso, se les pudieran imponer, así como de la identidad del instructor, de la autoridad competente para imponer la sanción y de la norma que atribuya tal competencia.</p><p>b) A la presunción de no existencia de responsabilidad administrativa mientras no se demuestre lo contrario.</p>", "dis": "<p><b>53.1 — derechos de todo interesado:</b></p>\n<table><thead><tr><th>Letra</th><th>Derecho</th></tr></thead><tbody>\n<tr><td><b>a)</b></td><td>Conocer <b>en cualquier momento</b> el <b>estado de la tramitación</b>, el <b>sentido del silencio</b>, el <b>órgano competente</b> y los actos de trámite adoptados; y obtener <b>copia</b> de los documentos</td></tr>\n<tr><td><b>b)</b></td><td><b>Identificar</b> a las autoridades y al personal bajo cuya responsabilidad se tramita</td></tr>\n<tr><td><b>c)</b></td><td><b>No presentar documentos originales</b>, salvo excepción normativa; y si debe presentarlos, obtener <b>copia autenticada</b></td></tr>\n<tr><td><b>d)</b></td><td><b>No presentar</b> datos y documentos no exigidos, ya en poder de las Administraciones o elaborados por estas</td></tr>\n<tr><td><b>e)</b></td><td><b>Formular alegaciones</b>, usar los medios de defensa admitidos y <b>aportar documentos en cualquier fase anterior al trámite de audiencia</b>, que deberán tenerse en cuenta al redactar la propuesta de resolución</td></tr>\n<tr><td><b>f)</b></td><td>Obtener <b>información y orientación</b> sobre requisitos jurídicos o técnicos</td></tr>\n<tr><td><b>g)</b></td><td>Actuar <b>asistidos de asesor</b> cuando lo consideren conveniente</td></tr>\n<tr><td><b>h)</b></td><td>Cumplir las <b>obligaciones de pago</b> por medios electrónicos (art. 98.2)</td></tr>\n<tr><td><b>i)</b></td><td>Cualesquiera otros reconocidos por la <b>Constitución y las leyes</b></td></tr>\n</tbody></table>\n<p><b>53.2 — además, en los procedimientos sancionadores, el presunto responsable tiene derecho:</b></p>\n<ul>\n<li><b>a)</b> a ser <b>notificado</b> de los <b>hechos</b> imputados, de las <b>infracciones</b> que puedan constituir y de las <b>sanciones</b> que pudieran imponerse, así como de la <b>identidad del instructor</b>, de la <b>autoridad competente</b> para sancionar y de la <b>norma</b> que le atribuye esa competencia;</li>\n<li><b>b)</b> a la <b><span class=\"t\" data-k=\"presuncioninoc\">presunción de no existencia de responsabilidad administrativa</span></b> mientras no se demuestre lo contrario.</li>\n</ul>", "llano": "<p>Este artículo es tu carta de derechos dentro del expediente: saber cómo va, quién lo lleva, no repetir papeles que la Administración ya tiene, alegar, ir con asesor. Y si te están sancionando, dos garantías más: que te digan exactamente de qué te acusan y quién te juzga, y que se te presuma no responsable.</p>", "porque": "<p>El procedimiento no es solo un cauce de eficacia administrativa: es sobre todo una <b>garantía</b>. Las letras c) y d) responden a un problema muy concreto —la Administración pidiendo al ciudadano papeles que ella misma emitió—, y su reverso es el deber de interoperabilidad entre administraciones.</p>\n<p>La letra e) fija un límite temporal preciso: los documentos pueden aportarse <b>hasta el trámite de audiencia</b>, porque después ya se redacta la propuesta de resolución y admitirlos obligaría a reabrir el contradictorio.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> preguntar en qué punto está tu pedido y quién lo gestiona.</li>\n<li><b>Real:</b> en un expediente de licencia, el ayuntamiento no puede exigir el certificado de empadronamiento que él mismo expide (letra d).</li>\n<li><b>Caso límite:</b> el interesado aporta un informe técnico <b>después</b> del trámite de audiencia. Ya está fuera del ámbito de la letra e): su admisión no es obligada.</li>\n</ul>", "noej": "<ul>\n<li><b>No incluye</b> el derecho a que se resuelva en el sentido pretendido: solo a que se tramite con garantías.</li>\n<li><b>No exige</b> la letra g) que el asesor sea abogado ni que lo pague la Administración.</li>\n<li><b>No se aplican</b> los derechos del apartado 2 fuera de los procedimientos <b>sancionadores</b>.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 13 LPAC:</b> derechos de las personas en sus relaciones con las Administraciones.</li>\n<li><b>Art. 28 LPAC:</b> documentos aportados por los interesados y no exigencia de los ya obrantes.</li>\n<li><b>Art. 82 LPAC:</b> trámite de audiencia, límite temporal de la letra e).</li>\n<li><b>Art. 64.2 LPAC:</b> contenido del acuerdo de iniciación sancionador, que materializa el derecho del art. 53.2.a).</li>\n</ul>", "trampas": "<ul>\n<li>La letra e) permite aportar documentos <b>en cualquier fase anterior al trámite de audiencia</b>.</li>\n<li>El apartado 2 solo rige en procedimientos <b>sancionadores</b>.</li>\n<li>La ley habla de <b>presunción de no existencia de responsabilidad</b>, no de «presunción de inocencia».</li>\n</ul>", "ancla": "<p><b>«Saber, identificar, no repetir papeles, alegar, informarme, asesorarme y pagar por internet.»</b> Y si me sancionan: <b>que me digan qué y quién, y que me presuman no responsable</b>.</p>", "vis": "<svg viewBox=\"0 0 660 150\" role=\"img\" aria-label=\"Derechos del interesado en el procedimiento\">\n<rect x=\"205\" y=\"8\" width=\"250\" height=\"30\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/>\n<text x=\"330\" y=\"28\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">DERECHOS DEL INTERESADO</text>\n<g font-size=\"10\" text-anchor=\"middle\" fill=\"currentColor\">\n<rect x=\"15\" y=\"52\" width=\"200\" height=\"62\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"115\" y=\"74\" font-weight=\"700\" fill=\"var(--acc)\">Saber</text><text x=\"115\" y=\"91\">a) estado y silencio</text><text x=\"115\" y=\"105\">b) quién lo tramita</text>\n<rect x=\"230\" y=\"52\" width=\"200\" height=\"62\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"330\" y=\"74\" font-weight=\"700\" fill=\"var(--ej)\">No repetir</text><text x=\"330\" y=\"91\">c) sin originales</text><text x=\"330\" y=\"105\">d) sin documentos ya en poder</text>\n<rect x=\"445\" y=\"52\" width=\"200\" height=\"62\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"545\" y=\"74\" font-weight=\"700\" fill=\"var(--warn)\">Defenderse</text><text x=\"545\" y=\"91\">e) alegar y aportar</text><text x=\"545\" y=\"105\">g) con asesor</text>\n</g>\n<text x=\"330\" y=\"140\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--exc)\">Sancionador: notificación completa de la acusación + presunción de no responsabilidad</text>\n</svg>"}, {"n": 54, "t": "Clases de iniciación", "ubic": "Título IV ▸ Capítulo II (Iniciación del procedimiento) ▸ Sección 1.ª (Disposiciones generales)", "idea": "Solo hay dos formas de empezar: de oficio o a solicitud del interesado.", "literal": "<p>Los procedimientos podrán iniciarse de oficio o a solicitud del interesado.</p>", "dis": "<ul>\n<li><b>Regla:</b> los procedimientos podrán iniciarse <b>de oficio</b> o <b>a solicitud del interesado</b>.</li>\n<li><b>Consecuencias del régimen aplicable:</b> la forma de iniciación determina el <b>efecto del silencio</b> (art. 24 y 25), la posibilidad de <b>caducidad</b> (art. 25.1.b) y quién soporta la carga de impulsar el expediente.</li>\n</ul>\n<table><thead><tr><th></th><th>De oficio</th><th>A solicitud</th></tr></thead><tbody>\n<tr><td><b>Quién lo abre</b></td><td>El órgano competente (art. 58)</td><td>El interesado (art. 66)</td></tr>\n<tr><td><b>Falta de resolución</b></td><td><b>Caducidad</b> si es desfavorable o sancionador; efectos del art. 25</td><td><b>Silencio</b>, positivo o negativo (art. 24)</td></tr>\n</tbody></table>", "llano": "<p>Un artículo de una línea que decide muchísimo: según quién abra el expediente cambia el efecto de que la Administración no conteste. Si lo abriste tú, hay silencio; si lo abrió ella y te perjudica, hay caducidad.</p>", "porque": "<p>La distinción no es formal: responde a <b>quién soporta el riesgo</b> de la inactividad administrativa. Cuando el ciudadano pide algo, la ley le da una respuesta presunta para que pueda seguir adelante. Cuando la Administración actúa contra él, la ley la penaliza con la <b>caducidad</b> si no concluye en plazo.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> no es lo mismo pedir cita que recibir una citación.</li>\n<li><b>Real:</b> una solicitud de licencia se inicia <b>a instancia</b>; un expediente sancionador por ruidos se inicia <b>de oficio</b>.</li>\n<li><b>Caso límite:</b> una <b>denuncia</b> vecinal no inicia el procedimiento: este se abre <b>de oficio</b> por acuerdo del órgano competente (art. 58).</li>\n</ul>", "noej": "<ul>\n<li><b>No existe</b> una tercera forma de iniciación.</li>\n<li><b>No inicia</b> el procedimiento la denuncia ni la petición razonada por sí solas.</li>\n</ul>", "conex": "<ul>\n<li><b>Arts. 58 a 65 LPAC:</b> iniciación de oficio.</li>\n<li><b>Arts. 66 a 69 LPAC:</b> iniciación a solicitud.</li>\n<li><b>Arts. 24 y 25 LPAC:</b> silencio y falta de resolución en procedimientos de oficio.</li>\n</ul>", "trampas": "<ul>\n<li>La denuncia, la orden superior y la petición razonada son <b>modalidades</b> de la iniciación <b>de oficio</b>, no clases distintas.</li>\n</ul>", "ancla": "<p><b>«Dos puertas y solo dos.»</b> Y cada puerta lleva a un régimen distinto de silencio y caducidad.</p>", "vis": "<svg viewBox=\"0 0 640 120\" role=\"img\" aria-label=\"Clases de iniciación del procedimiento\">\n<rect x=\"215\" y=\"8\" width=\"210\" height=\"30\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/>\n<text x=\"320\" y=\"28\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">INICIACIÓN</text>\n<line x1=\"320\" y1=\"38\" x2=\"320\" y2=\"50\" stroke=\"var(--acc)\" stroke-width=\"2\"/>\n<line x1=\"165\" y1=\"50\" x2=\"475\" y2=\"50\" stroke=\"var(--acc)\" stroke-width=\"2\"/>\n<line x1=\"165\" y1=\"50\" x2=\"165\" y2=\"62\" stroke=\"var(--acc)\" stroke-width=\"2\"/><line x1=\"475\" y1=\"50\" x2=\"475\" y2=\"62\" stroke=\"var(--acc)\" stroke-width=\"2\"/>\n<rect x=\"45\" y=\"62\" width=\"240\" height=\"46\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/>\n<text x=\"165\" y=\"82\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--warn)\">DE OFICIO</text>\n<text x=\"165\" y=\"99\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">riesgo: caducidad (art. 25)</text>\n<rect x=\"355\" y=\"62\" width=\"240\" height=\"46\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/>\n<text x=\"475\" y=\"82\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">A SOLICITUD</text>\n<text x=\"475\" y=\"99\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">riesgo: silencio (art. 24)</text>\n</svg>"}, {"n": 55, "t": "Información y actuaciones previas", "ubic": "Título IV ▸ Capítulo II (Iniciación del procedimiento) ▸ Sección 1.ª (Disposiciones generales)", "idea": "Antes de abrir expediente cabe indagar si conviene abrirlo.", "literal": "<p>1. Con anterioridad al inicio del procedimiento, el órgano competente podrá abrir un período de información o actuaciones previas con el fin de conocer las circunstancias del caso concreto y la conveniencia o no de iniciar el procedimiento.</p><p>2. En el caso de procedimientos de naturaleza sancionadora las actuaciones previas se orientarán a determinar, con la mayor precisión posible, los hechos susceptibles de motivar la incoación del procedimiento, la identificación de la persona o personas que pudieran resultar responsables y las circunstancias relevantes que concurran en unos y otros. Las actuaciones previas serán realizadas por los órganos que tengan atribuidas funciones de investigación, averiguación e inspección en la materia y, en defecto de éstos, por la persona u órgano administrativo que se determine por el órgano competente para la iniciación o resolución del procedimiento.</p>", "dis": "<ul>\n<li><b>55.1 — regla general:</b> con anterioridad al inicio, el órgano competente <b>podrá abrir un período de <span class=\"t\" data-k=\"actprevias\">información o actuaciones previas</span></b> para conocer las circunstancias del caso y la <b>conveniencia o no</b> de iniciar el procedimiento.</li>\n<li><b>55.2 — en los sancionadores:</b> las actuaciones previas se orientan a determinar <b>con la mayor precisión posible</b> los <b>hechos</b> susceptibles de motivar la incoación, la <b>identificación</b> de los posibles responsables y las <b>circunstancias relevantes</b>. Se realizan por órganos con <b>funciones de investigación, averiguación e inspección</b> y, en su defecto, por la persona u órgano que determine el competente para iniciar o resolver.</li>\n</ul>", "llano": "<p>Antes de abrir un expediente formal, la Administración puede mirar: recabar datos, inspeccionar, preguntar. Sirve para no incoar procedimientos innecesarios y, en lo sancionador, para llegar al acuerdo de iniciación sabiendo ya qué pasó y quién pudo hacerlo.</p>", "porque": "<p>Incoar un expediente sancionador tiene un coste real para el ciudadano: reputación, medidas provisionales, obligación de defenderse. Las actuaciones previas permiten <b>filtrar</b> lo que no merece procedimiento y llegar al acuerdo de iniciación con una base sólida, evitando incoaciones a ciegas. Además, al no formar parte todavía del procedimiento, no consumen el <b>plazo de caducidad</b>.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> comprobar si la avería existe antes de abrir un parte.</li>\n<li><b>Real:</b> ante una denuncia por ruidos, la policía local realiza mediciones sonométricas antes de decidir si se incoa expediente sancionador.</li>\n<li><b>Caso límite:</b> las actuaciones previas se prolongan meses. Aún no corre el plazo de caducidad del procedimiento, pero <b>sí</b> corre la <b>prescripción de la infracción</b>.</li>\n</ul>", "noej": "<ul>\n<li><b>No forman parte</b> del procedimiento: no computan a efectos de caducidad.</li>\n<li><b>No pueden</b> sustituir a la instrucción: la prueba debe practicarse dentro del procedimiento con contradicción.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 58 LPAC:</b> acuerdo de iniciación de oficio.</li>\n<li><b>Art. 63 LPAC:</b> especialidades sancionadoras.</li>\n<li><b>Art. 21 LPAC:</b> obligación de resolver y cómputo del plazo máximo.</li>\n</ul>", "trampas": "<ul>\n<li>Son <b>previas</b>: no forman parte del procedimiento ni consumen su plazo.</li>\n<li>En lo sancionador las realizan órganos con funciones de <b>investigación, averiguación e inspección</b>.</li>\n<li>La ley dice <b>«podrá»</b>: no son obligatorias.</li>\n</ul>", "ancla": "<p><b>«Mirar antes de abrir.»</b> Y en lo sancionador, mirar <b>quién</b>, <b>qué</b> y <b>cuándo</b>.</p>", "vis": "<svg viewBox=\"0 0 640 120\" role=\"img\" aria-label=\"Información y actuaciones previas\">\n<defs><marker id=\"ap1\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\"><path d=\"M0 0 L9 4.5 L0 9 z\" fill=\"var(--acc)\"/></marker></defs>\n<rect x=\"45\" y=\"35\" width=\"230\" height=\"52\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/>\n<text x=\"160\" y=\"57\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">Actuaciones previas</text>\n<text x=\"160\" y=\"75\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">¿conviene iniciar?</text>\n<path d=\"M278 61 L 330 61\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#ap1)\"/>\n<rect x=\"335\" y=\"35\" width=\"260\" height=\"52\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/>\n<text x=\"465\" y=\"57\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">Acuerdo de iniciación</text>\n<text x=\"465\" y=\"75\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">aquí empieza el procedimiento y su plazo</text>\n<text x=\"320\" y=\"110\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--ink2)\">Lo anterior no computa a efectos de caducidad, pero sí corre la prescripción</text>\n</svg>"}, {"n": 56, "t": "Medidas provisionales", "ubic": "Título IV ▸ Capítulo II (Iniciación del procedimiento) ▸ Sección 1.ª (Disposiciones generales)", "idea": "Cautelares para asegurar la resolución; excepcionalmente, antes de iniciar.", "literal": "<p>1. Iniciado el procedimiento, el órgano administrativo competente para resolver, podrá adoptar, de oficio o a instancia de parte y de forma motivada, las medidas provisionales que estime oportunas para asegurar la eficacia de la resolución que pudiera recaer, si existiesen elementos de juicio suficientes para ello, de acuerdo con los principios de proporcionalidad, efectividad y menor onerosidad.</p><p>2. Antes de la iniciación del procedimiento administrativo, el órgano competente para iniciar o instruir el procedimiento, de oficio o a instancia de parte, en los casos de urgencia inaplazable y para la protección provisional de los intereses implicados, podrá adoptar de forma motivada las medidas provisionales que resulten necesarias y proporcionadas. Las medidas provisionales deberán ser confirmadas, modificadas o levantadas en el acuerdo de iniciación del procedimiento, que deberá efectuarse dentro de los quince días siguientes a su adopción, el cual podrá ser objeto del recurso que proceda.</p><p>En todo caso, dichas medidas quedarán sin efecto si no se inicia el procedimiento en dicho plazo o cuando el acuerdo de iniciación no contenga un pronunciamiento expreso acerca de las mismas.</p><p>3. De acuerdo con lo previsto en los dos apartados anteriores, podrán acordarse las siguientes medidas provisionales, en los términos previstos en la Ley 1/2000, de 7 de enero, de Enjuiciamiento Civil:</p><p>a) Suspensión temporal de actividades.</p><p>b) Prestación de fianzas.</p><p>c) Retirada o intervención de bienes productivos o suspensión temporal de servicios por razones de sanidad, higiene o seguridad, el cierre temporal del establecimiento por estas u otras causas previstas en la normativa reguladora aplicable.</p><p>d) Embargo preventivo de bienes, rentas y cosas fungibles computables en metálico por aplicación de precios ciertos.</p><p>e) El depósito, retención o inmovilización de cosa mueble.</p><p>f) La intervención y depósito de ingresos obtenidos mediante una actividad que se considere ilícita y cuya prohibición o cesación se pretenda.</p><p>g) Consignación o constitución de depósito de las cantidades que se reclamen.</p><p>h) La retención de ingresos a cuenta que deban abonar las Administraciones Públicas.</p><p>i) Aquellas otras medidas que, para la protección de los derechos de los interesados, prevean expresamente las leyes, o que se estimen necesarias para asegurar la efectividad de la resolución.</p><p>4. No se podrán adoptar medidas provisionales que puedan causar perjuicio de difícil o imposible reparación a los interesados o que impliquen violación de derechos amparados por las leyes.</p><p>5. Las medidas provisionales podrán ser alzadas o modificadas durante la tramitación del procedimiento, de oficio o a instancia de parte, en virtud de circunstancias sobrevenidas o que no pudieron ser tenidas en cuenta en el momento de su adopción. En todo caso, se extinguirán cuando surta efectos la resolución administrativa que ponga fin al procedimiento correspondiente.</p>", "dis": "<ul>\n<li><b>56.1 — regla:</b> <b>iniciado</b> el procedimiento, el órgano competente para resolver puede adoptar, de oficio o a instancia de parte y <b>de forma motivada</b>, las <span class=\"t\" data-k=\"provisional\">medidas provisionales</span> que estime oportunas para <b>asegurar la eficacia de la resolución</b>, si existiesen elementos de juicio suficientes.</li>\n<li><b>56.2 — antes de iniciar:</b> en casos de <b>urgencia inaplazable</b> y para la protección provisional de los intereses implicados, el órgano competente para iniciar o instruir puede adoptarlas motivadamente. Deben ser <b>confirmadas, modificadas o levantadas</b> en el acuerdo de iniciación, que ha de dictarse dentro de los <b>quince días</b> siguientes. <b>Quedan sin efecto</b> si no se inicia el procedimiento en ese plazo o si el acuerdo de iniciación no se pronuncia expresamente sobre ellas.</li>\n<li><b>56.3 — catálogo:</b> suspensión temporal de actividades · prestación de fianzas · retirada o intervención de bienes productivos o cierre temporal del establecimiento · embargo preventivo · depósito, retención o inmovilización de cosa mueble · intervención y depósito de ingresos de actividad ilícita · consignación o depósito de las cantidades reclamadas · retención de ingresos a cuenta · y las demás previstas en las leyes o necesarias para asegurar la efectividad de la resolución.</li>\n<li><b>56.4 — límite:</b> <b>no</b> pueden adoptarse medidas que causen <b>perjuicio de difícil o imposible reparación</b> a los interesados ni que impliquen <b>violación de derechos amparados por las leyes</b>.</li>\n<li><b>56.5 — vigencia:</b> pueden <b>alzarse o modificarse</b> por circunstancias sobrevenidas y <b>se extinguen</b> cuando surta efectos la resolución que ponga fin al procedimiento.</li>\n</ul>", "llano": "<p>Si mientras se decide el asunto hay riesgo de que la decisión llegue tarde, se pueden tomar medidas cautelares. Incluso antes de abrir el expediente, pero solo si hay urgencia inaplazable y con un plazo de caducidad muy corto: <b>quince días</b> para incoar y pronunciarse sobre ellas.</p>", "porque": "<p>Las medidas provisionales resuelven el <b>problema del tiempo</b>: un procedimiento dura meses y en ese lapso el daño puede consumarse. Pero como se adoptan <b>antes</b> de saber quién tiene razón, la ley las somete a un doble freno: <b>motivación</b> y la prohibición del apartado 4, que impide que la cautela cause un daño peor que el que trata de evitar.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> precintar una atracción de feria mientras se comprueba si es segura.</li>\n<li><b>Real:</b> ante un riesgo sanitario, el ayuntamiento acuerda el <b>cierre temporal</b> de un establecimiento el viernes; el acuerdo de iniciación debe dictarse dentro de los <b>quince días</b> siguientes y pronunciarse sobre la medida.</li>\n<li><b>Caso límite:</b> se acuerda la medida y el expediente se incoa el día 20. La medida ha <b>quedado sin efecto</b> automáticamente (art. 56.2).</li>\n</ul>", "noej": "<ul>\n<li><b>No caben</b> medidas que causen perjuicio de <b>difícil o imposible reparación</b> al interesado.</li>\n<li><b>No sobreviven</b> a la resolución final: se extinguen cuando esta surte efectos.</li>\n<li><b>No</b> pueden adoptarse antes de iniciar sin <b>urgencia inaplazable</b>.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 35.1.d) LPAC:</b> las medidas provisionales deben motivarse.</li>\n<li><b>Art. 64.2.e) LPAC:</b> deben constar en el acuerdo de iniciación sancionador.</li>\n<li><b>Art. 117 LPAC:</b> suspensión de la ejecución al recurrir.</li>\n<li><b>Ley 1/2000 de Enjuiciamiento Civil</b> <i>(norma externa a la biblioteca)</i>, a la que remite el art. 56.3.</li>\n</ul>", "trampas": "<ul>\n<li><b>Quince días</b> para dictar el acuerdo de iniciación tras una medida previa.</li>\n<li>Quedan sin efecto también si el acuerdo de iniciación <b>no se pronuncia</b> sobre ellas.</li>\n<li>La prohibición del 56.4 tiene dos supuestos: perjuicio irreparable <b>y</b> violación de derechos.</li>\n</ul>", "ancla": "<p><b>«Cautela con motivo, y si es antes: urgencia inaplazable y quince días.»</b></p>", "vis": "<svg viewBox=\"0 0 660 145\" role=\"img\" aria-label=\"Medidas provisionales\">\n<defs><marker id=\"mp1\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\"><path d=\"M0 0 L9 4.5 L0 9 z\" fill=\"var(--acc)\"/></marker></defs>\n<rect x=\"15\" y=\"35\" width=\"195\" height=\"58\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/>\n<text x=\"112\" y=\"57\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--warn)\">56.2 · ANTES de iniciar</text>\n<text x=\"112\" y=\"74\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">urgencia inaplazable</text>\n<text x=\"112\" y=\"88\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--exc)\">15 días para incoar</text>\n<path d=\"M213 64 L 248 64\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#mp1)\"/>\n<rect x=\"252\" y=\"35\" width=\"195\" height=\"58\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/>\n<text x=\"349\" y=\"57\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">56.1 · Iniciado</text>\n<text x=\"349\" y=\"74\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">para asegurar la eficacia</text>\n<text x=\"349\" y=\"88\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">de la resolución</text>\n<path d=\"M450 64 L 485 64\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#mp1)\"/>\n<rect x=\"489\" y=\"35\" width=\"156\" height=\"58\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/>\n<text x=\"567\" y=\"57\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">56.5 · Resolución</text>\n<text x=\"567\" y=\"76\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">las medidas se extinguen</text>\n<text x=\"330\" y=\"128\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--exc)\">Nunca medidas de difícil o imposible reparación ni violación de derechos (56.4)</text>\n</svg>"}];
</script>
<script>
ARTS.push.apply(ARTS,[{"n": 57, "t": "Acumulación", "ubic": "Título IV ▸ Capítulo II (Iniciación del procedimiento) ▸ Sección 1.ª (Disposiciones generales)", "idea": "Se pueden juntar expedientes conexos si los tramita el mismo órgano.", "literal": "<p>El órgano administrativo que inicie o tramite un procedimiento, cualquiera que haya sido la forma de su iniciación, podrá disponer, de oficio o a instancia de parte, su acumulación a otros con los que guarde identidad sustancial o íntima conexión, siempre que sea el mismo órgano quien deba tramitar y resolver el procedimiento. Contra el acuerdo de acumulación no procederá recurso alguno.</p>", "dis": "<ul>\n<li><b>Facultad:</b> el órgano que <b>inicie o tramite</b> un procedimiento, cualquiera que haya sido la forma de su iniciación, <b>podrá disponer</b> —de oficio o a instancia de parte— su <span class=\"t\" data-k=\"acumulacion\">acumulación</span> a otros.</li>\n<li><b>Requisitos:</b> que guarden <b>identidad sustancial o íntima conexión</b> y que sea el <b>mismo órgano</b> quien deba tramitar y resolver.</li>\n<li><b>Recurso:</b> contra el acuerdo de acumulación <b>no procede recurso alguno</b>.</li>\n</ul>", "llano": "<p>Si dos expedientes son prácticamente el mismo asunto y los lleva el mismo órgano, pueden unirse en uno. Y contra esa decisión no cabe recurrir: es una decisión de organización interna.</p>", "porque": "<p>Es economía procedimental y, sobre todo, <b>coherencia</b>: tramitar por separado asuntos íntimamente conectados abre la puerta a resoluciones contradictorias sobre los mismos hechos. La exigencia de que sea el mismo órgano evita que la acumulación altere las reglas de competencia.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> agrupar varias reclamaciones idénticas en un único trámite.</li>\n<li><b>Real:</b> tres expedientes sancionadores contra el mismo titular por incumplimientos de la misma licencia de actividad, tramitados por el mismo órgano: cabe la acumulación.</li>\n<li><b>Caso límite:</b> dos expedientes conexos pero de <b>órganos distintos</b>. <b>No</b> cabe acumular: falta el requisito del mismo órgano.</li>\n</ul>", "noej": "<ul>\n<li><b>No cabe</b> si el órgano competente para resolver no es el mismo.</li>\n<li><b>No es</b> recurrible el acuerdo de acumulación.</li>\n<li><b>No exige</b> identidad total: basta la <b>íntima conexión</b>.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 71 LPAC:</b> impulso de oficio y orden de despacho.</li>\n<li><b>Art. 120 LPAC:</b> pluralidad de recursos sobre el mismo acto.</li>\n<li><b>Art. 66.2 LPAC:</b> solicitud única para pretensiones idénticas.</li>\n</ul>", "trampas": "<ul>\n<li>Dos requisitos: <b>identidad sustancial o íntima conexión</b> y <b>mismo órgano</b>.</li>\n<li>Contra el acuerdo <b>no procede recurso alguno</b>.</li>\n<li>Cabe <b>de oficio o a instancia de parte</b>.</li>\n</ul>", "ancla": "<p><b>«Mismo asunto y mismo órgano: se juntan, y no se discute.»</b></p>", "vis": "<svg viewBox=\"0 0 640 120\" role=\"img\" aria-label=\"Acumulación de procedimientos\">\n<defs><marker id=\"ac1\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\"><path d=\"M0 0 L9 4.5 L0 9 z\" fill=\"var(--ej)\"/></marker></defs>\n<rect x=\"35\" y=\"22\" width=\"150\" height=\"34\" rx=\"7\" fill=\"var(--panel)\" stroke=\"var(--line)\"/><text x=\"110\" y=\"44\" text-anchor=\"middle\" font-size=\"10\">Expediente A</text>\n<rect x=\"35\" y=\"66\" width=\"150\" height=\"34\" rx=\"7\" fill=\"var(--panel)\" stroke=\"var(--line)\"/><text x=\"110\" y=\"88\" text-anchor=\"middle\" font-size=\"10\">Expediente B</text>\n<path d=\"M190 40 L 250 55\" stroke=\"var(--ej)\" stroke-width=\"2\" marker-end=\"url(#ac1)\"/>\n<path d=\"M190 82 L 250 65\" stroke=\"var(--ej)\" stroke-width=\"2\" marker-end=\"url(#ac1)\"/>\n<rect x=\"265\" y=\"38\" width=\"330\" height=\"46\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/>\n<text x=\"430\" y=\"58\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">Procedimiento único</text>\n<text x=\"430\" y=\"75\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">identidad sustancial o íntima conexión + mismo órgano</text>\n</svg>"}, {"n": 58, "t": "Iniciación de oficio", "ubic": "Título IV ▸ Capítulo II ▸ Sección 2.ª (Iniciación del procedimiento de oficio por la Administración)", "idea": "Cuatro caminos hacia la iniciación de oficio, siempre por acuerdo del órgano.", "literal": "<p>Los procedimientos se iniciarán de oficio por acuerdo del órgano competente, bien por propia iniciativa o como consecuencia de orden superior, a petición razonada de otros órganos o por denuncia.</p>", "dis": "<ul>\n<li><b>Regla:</b> los procedimientos se inician de oficio <b>por acuerdo del órgano competente</b>, bien:\n<ul><li>por <b>propia iniciativa</b> (art. 59);</li>\n<li>como consecuencia de <b>orden superior</b> (art. 60);</li>\n<li>a <b><span class=\"t\" data-k=\"peticion\">petición razonada</span> de otros órganos</b> (art. 61);</li>\n<li>por <b><span class=\"t\" data-k=\"denuncia\">denuncia</span></b> (art. 62).</li></ul></li>\n<li><b>Clave:</b> los cuatro son <b>orígenes del impulso</b>, pero en todos los casos quien inicia es el <b>órgano competente mediante acuerdo</b>.</li>\n</ul>", "llano": "<p>Cuatro formas de que llegue la información —yo lo vi, me lo ordenan, me lo pide otro órgano o alguien lo denuncia—, pero una sola forma de empezar: el acuerdo del órgano que tiene la competencia.</p>", "porque": "<p>Distinguir el <b>origen del conocimiento</b> de la <b>decisión de incoar</b> es esencial: preserva la competencia y evita que un tercero —el denunciante— o un órgano ajeno puedan forzar la apertura de un expediente. La Administración conserva siempre el juicio sobre si procede o no actuar.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> muchos avisos posibles, pero una sola persona decide abrir el caso.</li>\n<li><b>Real:</b> una denuncia vecinal por vertidos llega al ayuntamiento; tras las actuaciones previas, el órgano competente <b>acuerda</b> la incoación.</li>\n<li><b>Caso límite:</b> un servicio municipal remite una <b>petición razonada</b>. El órgano competente decide no incoar: debe <b>comunicarle los motivos</b> (art. 61.2).</li>\n</ul>", "noej": "<ul>\n<li><b>No inicia</b> el procedimiento la denuncia por sí sola.</li>\n<li><b>No vincula</b> la petición razonada al órgano competente.</li>\n<li><b>No hay</b> una quinta modalidad.</li>\n</ul>", "conex": "<ul>\n<li><b>Arts. 59 a 62 LPAC:</b> desarrollo de cada modalidad.</li>\n<li><b>Art. 55 LPAC:</b> actuaciones previas al acuerdo.</li>\n<li><b>Art. 63 LPAC:</b> los sancionadores se inician <b>siempre</b> de oficio.</li>\n</ul>", "trampas": "<ul>\n<li>Siempre <b>por acuerdo del órgano competente</b>.</li>\n<li>Son <b>cuatro</b> modalidades, ni tres ni cinco.</li>\n</ul>", "ancla": "<p><b>«Yo, mi jefe, otro órgano o cualquiera.»</b> Pero el acuerdo lo firmo yo.</p>", "vis": "<svg viewBox=\"0 0 660 130\" role=\"img\" aria-label=\"Modalidades de iniciación de oficio\">\n<g font-size=\"10\" text-anchor=\"middle\" fill=\"currentColor\">\n<rect x=\"15\" y=\"28\" width=\"150\" height=\"50\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"90\" y=\"50\" font-weight=\"700\" fill=\"var(--acc)\">Propia iniciativa</text><text x=\"90\" y=\"66\">art. 59</text>\n<rect x=\"175\" y=\"28\" width=\"150\" height=\"50\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"250\" y=\"50\" font-weight=\"700\" fill=\"var(--warn)\">Orden superior</text><text x=\"250\" y=\"66\">art. 60</text>\n<rect x=\"335\" y=\"28\" width=\"150\" height=\"50\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"410\" y=\"50\" font-weight=\"700\" fill=\"var(--ej)\">Petición razonada</text><text x=\"410\" y=\"66\">art. 61</text>\n<rect x=\"495\" y=\"28\" width=\"150\" height=\"50\" rx=\"8\" fill=\"var(--panel)\" stroke=\"var(--line)\"/><text x=\"570\" y=\"50\" font-weight=\"700\">Denuncia</text><text x=\"570\" y=\"66\">art. 62</text>\n</g>\n<rect x=\"180\" y=\"90\" width=\"300\" height=\"30\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/>\n<text x=\"330\" y=\"110\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#fff\">ACUERDO DEL ÓRGANO COMPETENTE</text>\n</svg>"}, {"n": 59, "t": "Inicio del procedimiento a propia iniciativa", "ubic": "Título IV ▸ Capítulo II ▸ Sección 2.ª (Iniciación del procedimiento de oficio por la Administración)", "idea": "Propia iniciativa: el órgano competente conoce los hechos por sí mismo.", "literal": "<p>Se entiende por propia iniciativa, la actuación derivada del conocimiento directo o indirecto de las circunstancias, conductas o hechos objeto del procedimiento por el órgano que tiene atribuida la competencia de iniciación.</p>", "dis": "<ul>\n<li><b>Definición:</b> actuación derivada del <b>conocimiento directo o indirecto</b> de las circunstancias, conductas o hechos objeto del procedimiento <b>por el órgano que tiene atribuida la competencia de iniciación</b>.</li>\n<li><b>Nota:</b> el conocimiento puede ser <b>indirecto</b>; lo determinante es que llegue al órgano competente sin mediar orden, petición formal ni denuncia.</li>\n</ul>", "llano": "<p>Es la modalidad más simple: el propio órgano se entera —lo ve, lo lee, se lo cuentan— y decide actuar. No hace falta que lo presencie: vale el conocimiento indirecto.</p>", "porque": "<p>La ley define cada modalidad para que el <b>expediente refleje su origen</b>. No es un formalismo: de ello depende, por ejemplo, si hay que comunicar algo a otro órgano (art. 61.2) o al denunciante (art. 62.3).</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> el encargado ve el desperfecto y ordena repararlo.</li>\n<li><b>Real:</b> el técnico municipal de disciplina urbanística detecta en una inspección rutinaria una obra sin licencia y el órgano competente incoa.</li>\n<li><b>Caso límite:</b> el órgano se entera por una noticia de prensa. Es conocimiento <b>indirecto</b>: sigue siendo propia iniciativa.</li>\n</ul>", "noej": "<ul>\n<li><b>No es</b> propia iniciativa si media <b>orden</b> del superior o <b>petición razonada</b> de otro órgano.</li>\n<li><b>No exige</b> conocimiento directo ni presencial.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 58 LPAC:</b> modalidades de iniciación de oficio.</li>\n<li><b>Art. 55 LPAC:</b> actuaciones previas.</li>\n</ul>", "trampas": "<ul>\n<li>El conocimiento puede ser <b>directo o indirecto</b>.</li>\n<li>Debe corresponder al órgano que tiene la <b>competencia de iniciación</b>.</li>\n</ul>", "ancla": "<p><b>«Me he enterado yo, como sea.»</b></p>", "vis": "<svg viewBox=\"0 0 640 105\" role=\"img\" aria-label=\"Inicio por propia iniciativa\">\n<rect x=\"140\" y=\"28\" width=\"360\" height=\"52\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/>\n<text x=\"320\" y=\"50\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">PROPIA INICIATIVA</text>\n<text x=\"320\" y=\"69\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">conocimiento directo o indirecto por el órgano competente</text>\n</svg>"}, {"n": 60, "t": "Inicio del procedimiento como consecuencia de orden superior", "ubic": "Título IV ▸ Capítulo II ▸ Sección 2.ª (Iniciación del procedimiento de oficio por la Administración)", "idea": "Orden superior: la manda el superior jerárquico del competente.", "literal": "<p>1. Se entiende por orden superior, la emitida por un órgano administrativo superior jerárquico del competente para la iniciación del procedimiento.</p><p>2. En los procedimientos de naturaleza sancionadora, la orden expresará, en la medida de lo posible, la persona o personas presuntamente responsables; las conductas o hechos que pudieran constituir infracción administrativa y su tipificación; así como el lugar, la fecha, fechas o período de tiempo continuado en que los hechos se produjeron.</p>", "dis": "<ul>\n<li><b>60.1 — definición:</b> la orden emitida por un <b>órgano administrativo superior jerárquico</b> del competente para la iniciación.</li>\n<li><b>60.2 — en procedimientos sancionadores</b>, la orden expresará <b>en la medida de lo posible</b>: la <b>persona o personas presuntamente responsables</b>; las <b>conductas o hechos</b> que pudieran constituir infracción y su <b>tipificación</b>; el <b>lugar</b>, la <b>fecha, fechas o período</b> de comisión.</li>\n</ul>", "llano": "<p>El superior jerárquico ordena que se abra el expediente. Si es sancionador, la orden debe concretar lo máximo posible quién, qué, dónde y cuándo, para que el instructor no parta de cero.</p>", "porque": "<p>La exigencia de concreción del apartado 2 protege dos cosas a la vez: la <b>eficacia</b> —el órgano competente sabe qué investigar— y el <b>derecho de defensa</b>, porque una orden vaga produciría una incoación genérica difícil de rebatir. El inciso <b>«en la medida de lo posible»</b> reconoce, sin embargo, que en el momento de ordenar no siempre se conocen todos los datos.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> el jefe que da instrucciones concretando el asunto y no solo el encargo.</li>\n<li><b>Real:</b> la alcaldía ordena al órgano competente incoar expediente sancionador por una actividad sin licencia, identificando el establecimiento y las fechas.</li>\n<li><b>Caso límite:</b> la orden no identifica al responsable porque aún se desconoce. Es válida: la ley exige concreción <b>en la medida de lo posible</b>.</li>\n</ul>", "noej": "<ul>\n<li><b>No es</b> orden superior la que procede de un órgano <b>sin relación jerárquica</b>: eso sería petición razonada.</li>\n<li><b>No sustituye</b> la orden al acuerdo de iniciación.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 58 LPAC:</b> modalidades de iniciación.</li>\n<li><b>Art. 61 LPAC:</b> petición razonada, para contrastar.</li>\n<li><b>Art. 64.2 LPAC:</b> contenido del acuerdo de iniciación sancionador.</li>\n</ul>", "trampas": "<ul>\n<li>Debe proceder del <b>superior jerárquico</b> del competente para iniciar.</li>\n<li>La concreción se exige <b>en la medida de lo posible</b>.</li>\n</ul>", "ancla": "<p><b>«Me lo manda mi jefe; y si es sanción, con nombres, hechos, lugar y fechas.»</b></p>", "vis": "<svg viewBox=\"0 0 640 120\" role=\"img\" aria-label=\"Inicio por orden superior\">\n<defs><marker id=\"os1\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\"><path d=\"M0 0 L9 4.5 L0 9 z\" fill=\"var(--warn)\"/></marker></defs>\n<rect x=\"200\" y=\"15\" width=\"240\" height=\"34\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/>\n<text x=\"320\" y=\"37\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--warn)\">Órgano superior jerárquico</text>\n<path d=\"M320 51 L 320 72\" stroke=\"var(--warn)\" stroke-width=\"2.5\" marker-end=\"url(#os1)\"/>\n<rect x=\"200\" y=\"76\" width=\"240\" height=\"34\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/>\n<text x=\"320\" y=\"98\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">Órgano competente: acuerda</text>\n<text x=\"545\" y=\"66\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--ink2)\">quién · qué · dónde · cuándo</text>\n</svg>"}]);
</script>

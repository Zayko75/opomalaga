<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Ley 39/2015 · LPAC · Arts. 66 a 74 · Iniciación a solicitud del interesado y ordenación del procedimiento</title>
<style>

/* ═══════════════════════════════════════════════════════════════
   SISTEMA DE DISEÑO · "Académico Gamificado" · Bloque II
   Temas 8, 9 y 10 · Auxiliar Administrativo
   ═══════════════════════════════════════════════════════════════ */
:root{
  --fs:16px;

  --bg:#faf9f7;
  --bg-grad:radial-gradient(1100px 560px at 12% -8%, #ede9ff 0%, transparent 55%),
            radial-gradient(850px 460px at 96% 0%, #dcf5ee 0%, transparent 50%);
  --surface:#ffffff;
  --surface-2:#f4f3f0;
  --surface-3:#eceae5;
  --line:#e6e3dc;
  --line-strong:#d4d0c7;

  --ink:#15161c;
  --ink-2:#5d616e;
  --ink-3:#8b8f9c;

  --brand:#5b3df5;
  --brand-2:#7c5cff;
  --brand-soft:#efeaff;
  --brand-ring:rgba(91,61,245,.18);

  --legal:#4338ca;  --legal-bg:#eeecff;
  --ej:#059669;     --ej-bg:#e4f7f0;
  --warn:#c2690a;   --warn-bg:#fdf1de;
  --exc:#dc2626;    --exc-bg:#ffeceb;

  --ok:#16a34a; --ok-soft:#e7f7ec;
  --mid:#eab308; --mid-soft:#fdf6dd;
  --off:#a1a1aa; --off-soft:#f1f1f3;

  --sh-1:0 1px 2px rgba(20,20,30,.04), 0 2px 8px rgba(20,20,30,.04);
  --sh-2:0 2px 6px rgba(20,20,30,.05), 0 12px 28px rgba(20,20,30,.07);
  --sh-3:0 8px 20px rgba(91,61,245,.13), 0 24px 56px rgba(20,20,30,.10);
  --sh-glow:0 0 0 4px var(--brand-ring);

  --r-sm:9px; --r-md:14px; --r-lg:20px; --r-full:999px;

  --f-display:"Segoe UI Variable Display",system-ui,-apple-system,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-legal:ui-serif,Georgia,Cambria,"Times New Roman",serif;
  --f-mono:ui-monospace,"SF Mono","Cascadia Mono","Segoe UI Mono",Menlo,monospace;

  --t-h1:clamp(1.02rem,.95rem + .3vw,1.2rem);
  --t-h2:clamp(1.2rem,1.05rem + .6vw,1.55rem);
  --t-h3:clamp(1rem,.95rem + .25vw,1.12rem);
  --t-sm:.86rem;
  --t-xs:.75rem;

  --e-out:cubic-bezier(.22,1,.36,1);
  --e-spring:cubic-bezier(.34,1.56,.64,1);

  /* ── Compatibilidad con SVG y contenido generado ── */
  --panel:var(--surface);
  --ink2:var(--ink-2);
  --acc:var(--brand);
  --acc-soft:var(--brand-soft);
  --g:var(--ok); --y:var(--mid); --r:var(--exc);
}

html[data-theme="dark"]{
  --bg:#0a0b0f;
  --bg-grad:radial-gradient(1100px 560px at 12% -8%, #1c1740 0%, transparent 55%),
            radial-gradient(850px 460px at 96% 0%, #08302b 0%, transparent 50%);
  --surface:#13151b;
  --surface-2:#1a1d25;
  --surface-3:#232733;
  --line:#262a34;
  --line-strong:#343947;

  --ink:#eceef4;
  --ink-2:#9ba2b3;
  --ink-3:#6e7585;

  --brand:#8b6dff;
  --brand-2:#a78bff;
  --brand-soft:#1e1a3d;
  --brand-ring:rgba(139,109,255,.22);

  --legal:#a5b4fc; --legal-bg:#191b3a;
  --ej:#34d399;    --ej-bg:#0c2a24;
  --warn:#fbbf24;  --warn-bg:#2e2110;
  --exc:#fb7185;   --exc-bg:#331119;

  --ok:#4ade80; --ok-soft:#0e2a19;
  --mid:#facc15; --mid-soft:#2c2610;
  --off:#5b6070; --off-soft:#1c1f27;

  --sh-1:0 1px 2px rgba(0,0,0,.3), 0 2px 8px rgba(0,0,0,.25);
  --sh-2:0 2px 6px rgba(0,0,0,.35), 0 12px 28px rgba(0,0,0,.4);
  --sh-3:0 8px 20px rgba(139,109,255,.2), 0 24px 56px rgba(0,0,0,.5);
}

*,*::before,*::after{box-sizing:border-box}
html{font-size:var(--fs);scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);background-image:var(--bg-grad);
  background-attachment:fixed;background-repeat:no-repeat;
  color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.68;
  -webkit-font-smoothing:antialiased;
  transition:background-color .5s var(--e-out),color .3s;
}
::selection{background:var(--brand);color:#fff}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{font-family:var(--f-display);letter-spacing:-.022em;line-height:1.2}
.num{font-variant-numeric:tabular-nums}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:99px;border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3)}

/* ═══ HEADER ═══ */
header.top{
  position:sticky;top:0;z-index:60;
  background:color-mix(in srgb,var(--surface) 80%,transparent);
  backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);
  border-bottom:1px solid var(--line);
}
.top-in{max-width:1280px;margin:0 auto;padding:.65rem 1.1rem;display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.brandwrap{display:flex;align-items:center;gap:.65rem;min-width:0;flex:1}
.mark{
  width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;
  font-weight:800;font-size:.8rem;letter-spacing:-.02em;text-decoration:none;
  box-shadow:0 4px 14px var(--brand-ring);
  transition:transform .3s var(--e-spring),box-shadow .3s;
}
.mark:hover{transform:rotate(-8deg) scale(1.08);box-shadow:var(--sh-3);text-decoration:none}
.top h1{font-size:var(--t-h1);margin:0;font-weight:800;line-height:1.25;min-width:0}
.top h1 .sub{display:block;font-size:var(--t-xs);color:var(--ink-2);font-weight:500;letter-spacing:0;
  margin-top:.1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tools{margin-left:auto;display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}

button,select,input[type=search]{
  font:inherit;font-size:var(--t-sm);font-weight:600;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:var(--r-sm);padding:.4rem .72rem;cursor:pointer;
  position:relative;overflow:hidden;
  transition:transform .18s var(--e-spring),border-color .2s,background .2s,box-shadow .2s,color .2s;
}
button:hover{transform:translateY(-1.5px);border-color:var(--brand);box-shadow:var(--sh-1)}
button:active{transform:translateY(0) scale(.97)}
button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible{outline:none;box-shadow:var(--sh-glow)}
input[type=search]{min-width:190px;cursor:text;font-weight:500}
input[type=search]:focus{border-color:var(--brand)}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--surface-2);padding:2px;gap:2px}
.seg button{border:0;border-radius:calc(var(--r-sm) - 2px);padding:.32rem .68rem;background:transparent;box-shadow:none}
.seg button:hover{transform:none;background:var(--surface)}
.seg button[aria-pressed="true"]{background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;box-shadow:0 2px 8px var(--brand-ring)}

.ripple{position:absolute;border-radius:50%;transform:scale(0);background:currentColor;opacity:.25;animation:rip .55s linear;pointer-events:none}
@keyframes rip{to{transform:scale(3.4);opacity:0}}

.progress{position:absolute;left:0;bottom:-1px;height:2.5px;width:0;
  background:linear-gradient(90deg,var(--brand),var(--legal),var(--ej));transition:width .1s linear}

/* ═══ LAYOUT ═══ */
.layout{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:270px 1fr;gap:1.8rem;padding:1.4rem 1.1rem 5rem}
main{min-width:0}

/* ═══ SIDEBAR ═══ */
nav.side{
  position:sticky;top:76px;align-self:start;max-height:calc(100vh - 96px);overflow:auto;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:.85rem;box-shadow:var(--sh-1);
}
nav.side h2{font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);
  margin:.5rem .4rem .5rem;font-weight:800}
nav.side h2:first-child{margin-top:.1rem}
nav.side a{
  display:flex;align-items:baseline;gap:.5rem;padding:.36rem .55rem;border-radius:var(--r-sm);
  text-decoration:none;color:var(--ink-2);font-size:var(--t-sm);font-weight:500;
  position:relative;transition:background .22s,color .22s,transform .22s var(--e-out);
}
nav.side a:hover{background:var(--surface-2);color:var(--ink);transform:translateX(3px);text-decoration:none}
nav.side a.on{background:var(--brand-soft);color:var(--brand);font-weight:700}
nav.side a.on::before{content:"";position:absolute;left:-.85rem;top:20%;bottom:20%;width:3px;
  border-radius:0 3px 3px 0;background:var(--brand)}
nav.side a b{color:var(--ink-3);font-weight:800;font-size:var(--t-xs);font-variant-numeric:tabular-nums;flex:none;min-width:1.9em}
nav.side a.on b{color:var(--brand)}
.navtoggle{display:none}

/* ═══ TARJETAS ═══ */
section.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:1.35rem 1.5rem;margin-bottom:1.1rem;box-shadow:var(--sh-1);
  transition:box-shadow .3s var(--e-out),border-color .3s;
}
section.card:hover{box-shadow:var(--sh-2)}
section.card>h2{
  margin:0 0 1rem;font-size:var(--t-h2);font-weight:800;
  display:flex;align-items:center;gap:.6rem;
}
section.card>h2::before{
  content:"";width:4px;height:1.05em;border-radius:99px;flex:none;
  background:linear-gradient(180deg,var(--brand),var(--brand-2));
}

/* ═══ ARTÍCULO ═══ */
.art{scroll-margin-top:86px;padding-top:.4rem}
.art + .art{margin-top:1.6rem;padding-top:1.6rem;border-top:1px dashed var(--line)}
.art h2{display:flex;flex-wrap:wrap;gap:.5rem;align-items:baseline;font-size:var(--t-h3);
  margin:0 0 .25rem;font-weight:800;letter-spacing:-.015em}
.art h2 .num{
  color:var(--brand);font-weight:800;font-family:var(--f-display);
  background:var(--brand-soft);padding:.1rem .5rem;border-radius:var(--r-sm);
  font-size:.92em;letter-spacing:-.02em;
}
.ubic{font-size:var(--t-xs);color:var(--ink-3);margin:0 0 .8rem;font-weight:600;
  letter-spacing:.03em;text-transform:uppercase}

/* ═══ IDEA CLAVE ═══ */
.idea{
  background:linear-gradient(100deg,var(--brand-soft),color-mix(in srgb,var(--brand-soft) 40%,transparent));
  border-left:4px solid var(--brand);border-radius:0 var(--r-md) var(--r-md) 0;
  padding:.75rem 1rem;font-weight:650;margin:.7rem 0 1rem;position:relative;
  font-size:.97rem;line-height:1.55;
}

/* ═══ ACORDEÓN ═══ */
details.panel{
  border:1px solid var(--line);border-radius:var(--r-md);margin:.6rem 0;
  background:var(--surface);overflow:hidden;
  transition:border-color .25s,box-shadow .25s,background .25s;
}
details.panel:hover{border-color:var(--line-strong)}
details.panel[open]{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-ring)}
details.panel>summary{
  cursor:pointer;padding:.62rem .9rem;font-weight:700;font-size:.93rem;
  list-style:none;display:flex;align-items:center;gap:.55rem;
  transition:background .2s,color .2s;
}
details.panel>summary:hover{background:var(--surface-2)}
details.panel[open]>summary{background:var(--brand-soft);color:var(--brand)}
details.panel>summary::-webkit-details-marker{display:none}
details.panel>summary::before{
  content:"";width:16px;height:16px;flex:none;border-radius:5px;
  background:var(--brand-soft);position:relative;transition:transform .3s var(--e-spring),background .25s;
}
details.panel>summary::after{
  content:"";position:absolute;width:0;height:0;margin-left:5px;
  border:4px solid transparent;border-left-color:var(--brand);
  transition:transform .3s var(--e-spring);
}
details.panel[open]>summary::before{background:var(--surface)}
details.panel[open]>summary::after{transform:rotate(90deg) translateX(-1px)}
details.panel .body{padding:.3rem 1rem 1rem;font-size:.95rem;animation:slidein .35s var(--e-out)}
@keyframes slidein{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* ═══ TEXTO LEGAL ═══ */
.legal{
  background:var(--legal-bg);border-left:4px solid var(--legal);
  border-radius:0 var(--r-md) var(--r-md) 0;padding:.85rem 1.05rem;
  font-family:var(--f-legal);font-size:.95rem;line-height:1.7;
}
.legal p{margin:.45rem 0}
.legal .lbl{
  font-family:var(--f-body);font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;
  color:var(--legal);font-weight:800;display:block;margin-bottom:.4rem;
}

/* ═══ CAJAS SEMÁNTICAS ═══ */
.box{
  border-left:4px solid var(--line);border-radius:0 var(--r-md) var(--r-md) 0;
  padding:.72rem .95rem;margin:.65rem 0;font-size:.94rem;
  transition:transform .25s var(--e-out),box-shadow .25s;
}
.box:hover{transform:translateX(3px);box-shadow:var(--sh-1)}
.box.ej{background:var(--ej-bg);border-color:var(--ej)}
.box.warn{background:var(--warn-bg);border-color:var(--warn)}
.box.exc{background:var(--exc-bg);border-color:var(--exc)}
.box .lbl{font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;font-weight:800;
  display:block;margin-bottom:.3rem}
.box.ej .lbl{color:var(--ej)}
.box.warn .lbl{color:var(--warn)}
.box.exc .lbl{color:var(--exc)}

.interp{
  border:1px dashed var(--warn);background:color-mix(in srgb,var(--warn-bg) 45%,transparent);
  border-radius:var(--r-md);padding:.65rem .9rem;font-size:.9rem;margin:.6rem 0;
}
.interp .lbl{font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;color:var(--warn);font-weight:800;display:block}

/* ═══ TABLAS ═══ */
table{width:100%;border-collapse:separate;border-spacing:0;font-size:.9rem;margin:.7rem 0;
  border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
th,td{padding:.5rem .68rem;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
td + td, th + th{border-left:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th{background:var(--surface-2);font-size:var(--t-xs);font-weight:800;letter-spacing:.05em;
  text-transform:uppercase;color:var(--ink-2);position:sticky;top:0}
tbody tr{transition:background .18s}
tbody tr:nth-child(even){background:color-mix(in srgb,var(--surface-2) 45%,transparent)}
tbody tr:hover{background:var(--brand-soft)}
th.sortable{cursor:pointer;user-select:none;transition:color .2s,background .2s}
th.sortable:hover{color:var(--brand);background:var(--brand-soft)}
th.sortable::after{content:" ⇅";color:var(--ink-3);font-size:.7rem}

ul,ol{margin:.5rem 0 .5rem 1.2rem;padding:0}
li{margin:.26rem 0}
li::marker{color:var(--brand);font-weight:700}

/* ═══ TOOLTIPS ═══ */
.t{border-bottom:1.5px dotted var(--brand);cursor:help;position:relative;
  transition:background .2s,color .2s}
.t:hover{background:var(--brand-soft);color:var(--brand);border-radius:3px}
#tip{
  position:fixed;z-index:99;max-width:330px;background:var(--ink);color:var(--bg);
  padding:.6rem .78rem;border-radius:var(--r-md);font-size:.82rem;line-height:1.5;
  display:none;box-shadow:0 8px 30px rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.08);
}
html[data-theme="dark"] #tip{background:#f0f1f5;color:#15161c}

/* ═══ FLECHAS DE DIAGRAMA ═══
   Un <path> con stroke pero sin fill toma el valor inicial (negro) y el
   navegador cierra el trazo implícitamente: aparece un triángulo relleno
   entre sus extremos. Forzamos fill:none para dejar solo la línea + la
   punta del <marker>, que sí lleva su color. */
svg path[stroke]:not([fill]){fill:none}
svg polyline:not([fill]){fill:none}
svg line{fill:none}

/* ═══ SVG ═══ */
svg{max-width:100%;height:auto;display:block;margin:.9rem auto}
svg text{font-family:var(--f-body)}

/* ═══ BUSCADOR ═══ */
mark.hit{background:linear-gradient(180deg,transparent 55%,#ffe066 55%);color:inherit;
  border-radius:2px;padding:0 1px;font-weight:600}
html[data-theme="dark"] mark.hit{background:linear-gradient(180deg,transparent 55%,#8a6d00 55%);color:#fff}

/* ═══ UTILIDADES ═══ */
.hide{display:none !important}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.small{font-size:var(--t-sm);color:var(--ink-2)}
.chip{
  display:inline-block;font-size:var(--t-xs);padding:.16rem .55rem;border-radius:var(--r-full);
  background:var(--brand-soft);color:var(--brand);font-weight:800;letter-spacing:.02em;
}

/* ═══ HUECOS RELLENABLES ═══ */
.gap{
  display:inline-block;min-width:5.5em;border-bottom:2px solid var(--brand);
  text-align:center;font-weight:700;color:transparent;cursor:pointer;
  transition:color .3s,background .3s;
}
.gap.on,.gap:hover{color:var(--brand);background:var(--brand-soft);border-radius:4px 4px 0 0}

/* ═══ REVELAR SOLUCIÓN ═══ */
.revelar{
  background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;border-color:transparent;
  font-weight:700;
}
.revelar:hover{box-shadow:var(--sh-3)}
.sol{
  margin-top:.7rem;padding:.8rem 1rem;border-radius:var(--r-md);
  background:var(--ej-bg);border-left:4px solid var(--ej);
  animation:slidein .4s var(--e-out);
}

/* ═══ TEST ═══ */
.opt{
  display:block;padding:.55rem .85rem;margin:.35rem 0;border:1.5px solid var(--line);
  border-radius:var(--r-md);cursor:pointer;background:var(--surface);font-size:.94rem;
  transition:border-color .22s,background .22s,transform .22s var(--e-out);
}
.opt:hover{border-color:var(--brand);background:var(--brand-soft);transform:translateX(4px)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft);font-weight:650}
.opt.ko{border-color:var(--exc);background:var(--exc-bg)}
.opt input{margin-right:.5rem;accent-color:var(--brand)}

#tscore,#semres{
  font-family:var(--f-display);font-weight:800;font-size:1.15rem;letter-spacing:-.02em;
}

/* ═══════════════════════════════════════════════════════════════
   FLASHCARDS 3D · mazo con giro, vuelo de salida y sheen
   ═══════════════════════════════════════════════════════════════ */
#flash{--fc-e:cubic-bezier(.2,.8,.25,1);--fc-h:250px}

/* — Escena — */
.fc-stage{
  perspective:1400px;perspective-origin:50% 45%;
  padding:.4rem 0 .2rem;position:relative;
}
.fc-deck{position:relative;height:var(--fc-h);will-change:transform}

/* — Cartas fantasma del mazo — */
.fc-ghost{
  position:absolute;inset:0;border-radius:var(--r-lg);
  background:var(--surface);border:1px solid var(--line);
  transition:transform .5s var(--fc-e),opacity .5s var(--fc-e);
}
.fc-ghost.g1{transform:translateY(9px) scale(.972);opacity:.75}
.fc-ghost.g2{transform:translateY(18px) scale(.944);opacity:.45}
.fc-deck.empty .fc-ghost{opacity:0;transform:translateY(26px) scale(.9)}

/* — Elevación durante el giro — */
.fc-lift{position:absolute;inset:0;transform-style:preserve-3d}
.fc-lift.lift{animation:fcLift .78s var(--fc-e)}
@keyframes fcLift{
  0%,100%{transform:scale(1) translateY(0)}
  45%{transform:scale(1.055) translateY(-16px)}
}
.fc-lift.out-ok{animation:fcOut .5s cubic-bezier(.5,0,.75,0) forwards}
.fc-lift.out-ko{animation:fcOutKo .5s cubic-bezier(.5,0,.75,0) forwards}
.fc-lift.in{animation:fcIn .48s var(--fc-e)}
@keyframes fcOut{
  0%{transform:translateX(0) rotate(0) scale(1);opacity:1}
  100%{transform:translateX(130%) rotate(17deg) scale(.85);opacity:0}
}
@keyframes fcOutKo{
  0%{transform:translateX(0) rotate(0) scale(1);opacity:1}
  100%{transform:translateX(-130%) rotate(-17deg) scale(.85);opacity:0}
}
@keyframes fcIn{
  0%{transform:translateY(26px) scale(.9);opacity:0}
  100%{transform:translateY(0) scale(1);opacity:1}
}

/* — La carta — */
.fc-card{
  position:absolute;inset:0;transform-style:preserve-3d;
  transition:transform .78s var(--fc-e);
  cursor:pointer;border-radius:var(--r-lg);
}
.fc-card:focus-visible{outline:none}
.fc-card:focus-visible .fc-face{box-shadow:var(--sh-glow),var(--sh-2)}

/* — Caras — */
.fc-face{
  position:absolute;inset:0;border-radius:var(--r-lg);
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  padding:2rem 2.2rem;text-align:center;overflow:hidden;
  box-shadow:var(--sh-2);
  transition:box-shadow .4s var(--fc-e);
}
.fc-card:hover .fc-face{box-shadow:var(--sh-3)}

/* Anverso · pregunta */
.fc-front{
  background:
    radial-gradient(120% 90% at 50% -20%, var(--brand-soft) 0%, transparent 60%),
    var(--surface);
  border:1.5px solid var(--line);color:var(--ink);
}
/* Reverso · respuesta */
.fc-back{
  transform:rotateY(180deg);
  background:linear-gradient(145deg,var(--brand) 0%,#6d4bf7 45%,var(--c5,#0891b2) 130%);
  border:1.5px solid transparent;color:#fff;
}
html[data-theme="dark"] .fc-back{
  background:linear-gradient(145deg,#5f45c9 0%,#4b3aa8 45%,#0e6b85 130%);
}
.fc-back .fc-txt{color:#fff}
.fc-back b,.fc-back strong{color:#fff;font-weight:800}

/* — Sheen que barre al girar — */
.fc-face::after{
  content:"";position:absolute;top:-60%;left:-70%;width:55%;height:220%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.42),transparent);
  transform:rotate(18deg);opacity:0;pointer-events:none;
}
.fc-lift.lift .fc-face::after{animation:fcSheen .78s var(--fc-e)}
@keyframes fcSheen{
  0%{opacity:0;left:-70%}
  35%{opacity:1}
  100%{opacity:0;left:150%}
}

/* — Etiqueta superior — */
.fc-tag{
  position:absolute;top:1rem;left:1.15rem;
  font-size:var(--t-xs);font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  display:inline-flex;align-items:center;gap:.4rem;
}
.fc-front .fc-tag{color:var(--brand)}
.fc-back .fc-tag{color:rgba(255,255,255,.9)}
.fc-tag::before{
  content:"";width:7px;height:7px;border-radius:50%;background:currentColor;
  animation:fcPulse 2.2s ease-in-out infinite;
}
@keyframes fcPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.65)}}

/* — Índice tipo naipe — */
.fc-pip{
  position:absolute;font-family:var(--f-display);font-weight:800;
  font-size:.78rem;letter-spacing:-.02em;opacity:.34;font-variant-numeric:tabular-nums;
}
.fc-pip.tr{top:1rem;right:1.15rem}
.fc-pip.bl{bottom:1rem;left:1.15rem;transform:rotate(180deg)}
.fc-front .fc-pip{color:var(--ink-2)}
.fc-back .fc-pip{color:#fff;opacity:.55}

/* — Texto — */
.fc-txt{
  font-size:clamp(1rem,.9rem + .55vw,1.28rem);font-weight:650;line-height:1.5;
  max-width:44ch;letter-spacing:-.012em;
}
.fc-front .fc-txt{font-family:var(--f-display);font-weight:700}
.fc-back .fc-txt{font-weight:600;line-height:1.6}
.fc-hint{
  position:absolute;bottom:1rem;left:0;right:0;
  font-size:var(--t-xs);font-weight:600;letter-spacing:.02em;
  display:flex;align-items:center;justify-content:center;gap:.4rem;
}
.fc-front .fc-hint{color:var(--ink-3)}
.fc-back .fc-hint{color:rgba(255,255,255,.72)}
.fc-hint .kbd{
  font-family:var(--f-mono);font-size:.68rem;font-weight:700;padding:.1rem .32rem;
  border-radius:5px;border:1px solid currentColor;opacity:.75;
}

/* — Pantalla final — */
.fc-done{
  position:absolute;inset:0;border-radius:var(--r-lg);
  background:linear-gradient(150deg,var(--ok-soft),var(--surface) 70%);
  border:1.5px solid var(--ok);
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  text-align:center;padding:2rem;gap:.35rem;
  animation:fcIn .5s var(--fc-e);box-shadow:var(--sh-2);
}
.fc-done .seal{
  font-size:2.6rem;line-height:1;
  animation:fcSeal .7s cubic-bezier(.2,1.5,.4,1);
}
@keyframes fcSeal{0%{transform:scale(0) rotate(-25deg);opacity:0}60%{transform:scale(1.2) rotate(6deg)}100%{transform:scale(1) rotate(0);opacity:1}}
.fc-done h3{font-size:1.3rem;font-weight:800;margin:.2rem 0 0}
.fc-done p{margin:0;color:var(--ink-2);font-size:var(--t-sm)}

/* — Barra de progreso de la ronda — */
.fc-bar{
  height:6px;border-radius:99px;background:var(--surface-3);
  overflow:hidden;margin:.95rem 0 .8rem;position:relative;
}
.fc-bar i{
  display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--brand),var(--c5,#0891b2));
  transition:width .55s var(--fc-e);
}

/* — Controles — */
.fc-ctrls{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.fc-ctrls button{font-weight:700}
#fcok{border-color:var(--ok);color:var(--ok)}
#fcok:hover{background:var(--ok);color:#fff;border-color:var(--ok)}
#fcko{border-color:var(--warn);color:var(--warn)}
#fcko:hover{background:var(--warn);color:#fff;border-color:var(--warn)}
#fcflip{background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;border-color:transparent}
#fcflip:hover{box-shadow:var(--sh-3)}

.fc-score{display:inline-flex;gap:.45rem;margin-left:auto;align-items:center}
.fc-pill{
  font-size:var(--t-xs);font-weight:800;padding:.24rem .6rem;border-radius:var(--r-full);
  font-variant-numeric:tabular-nums;border:1px solid;
}
.fc-pill.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.fc-pill.ko{color:var(--warn);border-color:var(--warn);background:var(--warn-bg)}
.fc-pill.left{color:var(--ink-2);border-color:var(--line);background:var(--surface-2)}
.fc-pill.bump{animation:fcBump .45s var(--e-spring)}
@keyframes fcBump{0%{transform:scale(1)}45%{transform:scale(1.28)}100%{transform:scale(1)}}

@media(max-width:620px){
  #flash{--fc-h:270px}
  .fc-face{padding:1.7rem 1.3rem}
  .fc-score{margin-left:0;width:100%}
}
@media(prefers-reduced-motion:reduce){
  .fc-card{transition:none}
  .fc-lift.lift,.fc-lift.in,.fc-lift.out-ok,.fc-lift.out-ko,.fc-face::after{animation:none !important}
}
@media print{.fc-stage,.fc-ctrls,.fc-bar{display:none !important}}
/* ═══ RESPUESTA ESTRUCTURADA ═══ */
.fc-face{justify-content:center}
.fc-face.struct{justify-content:flex-start;text-align:left;padding-top:3.1rem;padding-bottom:3.1rem}
.fc-body{
  width:100%;max-width:46ch;margin:0 auto;
  overflow-y:auto;max-height:100%;
  scrollbar-width:thin;
}
.fc-body::-webkit-scrollbar{width:5px}
.fc-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.35);border-radius:99px;border:0}
.fc-front .fc-body::-webkit-scrollbar-thumb{background:var(--line-strong)}

/* — Veredicto Sí / No — */
.fc-verdict{
  display:inline-flex;align-items:center;gap:.35rem;
  font-family:var(--f-display);font-weight:800;font-size:.82rem;
  letter-spacing:.06em;text-transform:uppercase;
  padding:.26rem .72rem;border-radius:var(--r-full);margin-bottom:.85rem;
  border:1.5px solid;animation:fcPopIn .45s var(--e-spring) backwards;animation-delay:.34s;
}
.fc-verdict.si{background:rgba(255,255,255,.16);border-color:rgba(190,255,215,.85);color:#d8ffe9}
.fc-verdict.no{background:rgba(255,255,255,.16);border-color:rgba(255,205,205,.85);color:#ffdedd}
@keyframes fcPopIn{0%{opacity:0;transform:scale(.7) translateY(6px)}100%{opacity:1;transform:none}}

/* — Párrafo — */
.fc-p{margin:0;font-size:clamp(1rem,.92rem + .45vw,1.2rem);font-weight:600;line-height:1.6}
.fc-face.struct .fc-p{font-size:clamp(.96rem,.9rem + .35vw,1.1rem)}

/* — Lista enumerada — */
.fc-list{list-style:none;margin:0;padding:0;display:grid;gap:.5rem;counter-reset:fc}
.fc-list li{
  counter-increment:fc;position:relative;margin:0;
  padding:.42rem .6rem .42rem 2.5rem;border-radius:var(--r-sm);
  background:rgba(255,255,255,.11);
  font-size:clamp(.92rem,.88rem + .3vw,1.04rem);font-weight:600;line-height:1.45;
  animation:fcRow .42s var(--e-out) backwards;
}
.fc-list li::before{
  content:counter(fc);position:absolute;left:.6rem;top:50%;transform:translateY(-50%);
  width:1.6rem;height:1.6rem;border-radius:50%;
  display:grid;place-items:center;
  background:rgba(255,255,255,.9);color:var(--brand);
  font-family:var(--f-display);font-weight:800;font-size:.78rem;
  font-variant-numeric:tabular-nums;
}
.fc-list.alpha li::before{content:counter(fc,lower-alpha)}
.fc-list li:nth-child(1){animation-delay:.36s}
.fc-list li:nth-child(2){animation-delay:.42s}
.fc-list li:nth-child(3){animation-delay:.48s}
.fc-list li:nth-child(4){animation-delay:.54s}
.fc-list li:nth-child(5){animation-delay:.60s}
.fc-list li:nth-child(n+6){animation-delay:.66s}
@keyframes fcRow{0%{opacity:0;transform:translateX(-12px)}100%{opacity:1;transform:none}}

/* — Cláusulas contrapuestas — */
.fc-clauses{display:grid;gap:.45rem}
.fc-clauses p{
  margin:0;padding:.45rem .7rem .45rem .95rem;border-radius:0 var(--r-sm) var(--r-sm) 0;
  background:rgba(255,255,255,.11);border-left:3px solid rgba(255,255,255,.55);
  font-size:clamp(.92rem,.88rem + .3vw,1.04rem);font-weight:600;line-height:1.5;
  animation:fcRow .42s var(--e-out) backwards;
}
.fc-clauses p:nth-child(1){animation-delay:.36s}
.fc-clauses p:nth-child(2){animation-delay:.44s}
.fc-clauses p:nth-child(3){animation-delay:.52s}

/* — Negritas resaltadas en el reverso — */
.fc-back .fc-body b,.fc-back .fc-body strong{
  font-weight:800;background:rgba(255,255,255,.2);
  padding:.03em .3em;border-radius:5px;
  box-decoration-break:clone;-webkit-box-decoration-break:clone;
}

/* — Cita legal al pie — */
.fc-cite{
  position:absolute;bottom:.95rem;left:0;right:0;
  display:inline-flex;align-items:center;justify-content:center;gap:.4rem;
  font-family:var(--f-mono);font-size:.74rem;font-weight:700;letter-spacing:.02em;
  color:rgba(255,255,255,.82);
  animation:fcPopIn .5s var(--e-out) backwards;animation-delay:.5s;
}
.fc-cite::before,.fc-cite::after{
  content:"";height:1px;width:clamp(18px,10%,52px);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.45));
}
.fc-cite::after{background:linear-gradient(90deg,rgba(255,255,255,.45),transparent)}
.fc-cite .s{font-size:.9rem;opacity:.75;font-family:var(--f-legal)}
.fc-front .fc-cite{color:var(--ink-3)}
.fc-front .fc-cite::before{background:linear-gradient(90deg,transparent,var(--line-strong))}
.fc-front .fc-cite::after{background:linear-gradient(90deg,var(--line-strong),transparent)}

/* la pista se oculta si hay cita, para no amontonar */
.fc-back .fc-cite ~ .fc-hint,.fc-back .fc-hint.muted{display:none}

@media(max-width:620px){
  #flash{--fc-h:320px}
  .fc-face.struct{padding-top:2.9rem;padding-bottom:2.8rem}
  .fc-list li{padding-left:2.3rem}
}
@media(prefers-reduced-motion:reduce){
  .fc-verdict,.fc-list li,.fc-clauses p,.fc-cite{animation:none !important}
}

/* ═══ SEMÁFORO ═══ */
.sembtn{
  border-radius:var(--r-full);padding:.32rem .7rem;font-weight:700;font-size:var(--t-sm);
}
.sembtn[data-v="g"]:hover,.sembtn.on[data-v="g"]{background:var(--ok);color:#fff;border-color:var(--ok)}
.sembtn[data-v="y"]:hover,.sembtn.on[data-v="y"]{background:var(--mid);color:#3d2f00;border-color:var(--mid)}
.sembtn[data-v="r"]:hover,.sembtn.on[data-v="r"]{background:var(--exc);color:#fff;border-color:var(--exc)}

/* ═══ CTA DE BLOQUE ═══ */
a.blk{
  display:inline-flex;align-items:center;gap:.5rem;
  background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;
  padding:.5rem .95rem;border-radius:var(--r-sm);font-weight:700;font-size:var(--t-sm);
  text-decoration:none;box-shadow:0 2px 10px var(--brand-ring);
  transition:transform .22s var(--e-spring),box-shadow .25s,gap .25s var(--e-out);
}
a.blk:hover{transform:translateY(-2px);box-shadow:var(--sh-3);gap:.75rem;text-decoration:none}
a.blk::after{content:"→"}
a.blk:active{transform:translateY(0) scale(.98)}

/* ═══ REVEAL ═══ */
.rv{opacity:0;transform:translateY(20px);transition:opacity .6s var(--e-out),transform .6s var(--e-out)}
.rv.in{opacity:1;transform:none}

/* ═══ RESPONSIVE ═══ */
@media(max-width:960px){
  .layout{grid-template-columns:1fr;padding-top:.9rem;gap:1rem}
  nav.side{position:static;max-height:none}
  nav.side.collapsed .navbody{display:none}
  .navtoggle{display:block;width:100%;text-align:left;font-weight:700}
  .grid2{grid-template-columns:1fr}
  .top h1 .sub{white-space:normal}
}
@media(max-width:620px){
  .top-in{padding:.55rem .8rem}
  .tools{width:100%;margin-left:0}
  input[type=search]{flex:1;min-width:0}
  section.card{padding:1.05rem 1rem;border-radius:var(--r-md)}
  table{font-size:.82rem}
  th,td{padding:.4rem .5rem}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
  .rv{opacity:1;transform:none}
}
@media print{
  header.top,nav.side,.tools,.noprint,.progress{display:none !important}
  body{background:#fff;background-image:none;font-size:11pt;color:#000}
  .layout{display:block;max-width:none;padding:0}
  section.card{border:0;padding:0;margin:0 0 1rem;break-inside:avoid;box-shadow:none}
  details.panel{border:0;box-shadow:none}
  details.panel .body{display:block !important}
  details.panel>summary{padding-left:0}
  .art{break-inside:avoid}
  .rv{opacity:1;transform:none}
  a{color:#000;text-decoration:none}
}


/* ═══ ALTURA ADAPTATIVA DE LA TARJETA ═══ */
.fc-deck{transition:height .45s var(--fc-e)}
.fc-body{max-height:none;overflow:visible}
.fc-measure{
  position:absolute;left:0;right:0;top:0;height:auto;
  visibility:hidden;pointer-events:none;z-index:-1;
}
.fc-measure .fc-face{
  position:relative;inset:auto;height:auto;min-height:0;
  box-shadow:none;backface-visibility:visible;transform:none;
}
.fc-measure .fc-body{max-height:none;overflow:visible}
.fc-measure .fc-face::after{display:none}

/* ═══ MOSTRAR / OCULTAR ÍNDICE LATERAL ═══ */
.layout{transition:grid-template-columns .42s var(--e-out)}
.layout.nonav{grid-template-columns:0 1fr;gap:0}
.layout.nonav>nav.side{
  opacity:0;transform:translateX(-14px);pointer-events:none;
  padding:0;border-width:0;overflow:hidden;width:0;min-width:0;
}
nav.side{
  transition:opacity .3s var(--e-out),transform .38s var(--e-out);
  overflow-x:hidden;
}
#navhide .ic{display:inline-block;transition:transform .35s var(--e-spring);font-size:.95em;line-height:1}
#navhide[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
#navhide[aria-pressed="true"] .ic{transform:rotate(90deg)}
@media(max-width:960px){#navhide{display:none}}

/* ═══════════════════════════════════════════════════════════════
   LECTURA EN VOZ ALTA (TTS) del texto legal
   ═══════════════════════════════════════════════════════════════ */
.tts-bar{
  display:flex;align-items:center;gap:.45rem;flex-wrap:wrap;
  margin:.15rem 0 .7rem;
}
.tts-bar button{
  font-size:var(--t-xs);font-weight:700;padding:.3rem .62rem;
  border-radius:var(--r-full);border:1px solid var(--legal);
  background:transparent;color:var(--legal);
  display:inline-flex;align-items:center;gap:.35rem;line-height:1.2;
}
.tts-bar button:hover{background:var(--legal);color:var(--surface);border-color:var(--legal)}
.tts-bar button[hidden]{display:none}
.tts-bar .tts-play.on{background:var(--legal);color:var(--surface)}

/* Ondas de audio mientras lee */
.tts-wave{display:inline-flex;align-items:flex-end;gap:2px;height:11px}
.tts-wave i{
  width:2.5px;background:currentColor;border-radius:2px;height:35%;
  animation:ttsW .9s ease-in-out infinite;
}
.tts-wave i:nth-child(2){animation-delay:.15s}
.tts-wave i:nth-child(3){animation-delay:.3s}
.tts-wave i:nth-child(4){animation-delay:.45s}
@keyframes ttsW{0%,100%{height:32%}50%{height:100%}}

.tts-time{
  font-family:var(--f-mono);font-size:.7rem;font-weight:700;
  color:var(--ink-3);font-variant-numeric:tabular-nums;
}

/* Frase que se está leyendo */
.tts-s{transition:background .25s,color .25s;border-radius:3px}
.tts-s.now{
  background:linear-gradient(180deg,transparent 8%,color-mix(in srgb,var(--legal) 26%,transparent) 8%);
  box-shadow:0 0 0 2px color-mix(in srgb,var(--legal) 16%,transparent);
}
html[data-theme="dark"] .tts-s.now{
  background:linear-gradient(180deg,transparent 8%,color-mix(in srgb,var(--legal) 34%,transparent) 8%);
}
.legal.tts-on{box-shadow:0 0 0 3px color-mix(in srgb,var(--legal) 20%,transparent)}

/* ═══ Reproductor flotante ═══ */
.tts-mini{
  position:fixed;left:50%;bottom:1.1rem;transform:translateX(-50%) translateY(140%);
  z-index:80;display:flex;align-items:center;gap:.6rem;
  background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  border:1px solid var(--line);border-radius:var(--r-full);
  padding:.5rem .7rem .5rem .95rem;box-shadow:var(--sh-3);
  transition:transform .45s var(--e-spring),opacity .3s;opacity:0;pointer-events:none;
  max-width:min(94vw,540px);
}
.tts-mini.show{transform:translateX(-50%) translateY(0);opacity:1;pointer-events:auto}
.tts-mini .lbl{
  font-size:var(--t-xs);font-weight:800;color:var(--legal);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:16ch;
}
.tts-mini button{
  border-radius:50%;width:32px;height:32px;padding:0;display:grid;place-items:center;
  font-size:.8rem;border:1px solid var(--line);flex:none;
}
.tts-mini button.main{
  width:38px;height:38px;font-size:.95rem;
  background:linear-gradient(140deg,var(--legal),var(--brand));color:#fff;border-color:transparent;
}
.tts-mini .bar{
  flex:1;min-width:70px;height:5px;border-radius:99px;background:var(--surface-3);overflow:hidden;
}
.tts-mini .bar i{display:block;height:100%;width:0;background:var(--legal);
  border-radius:99px;transition:width .35s var(--e-out)}

/* ═══ Panel de ajustes de voz ═══ */
.tts-back{
  position:fixed;inset:0;z-index:90;background:rgba(10,10,18,.45);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  display:grid;place-items:center;padding:1rem;
  opacity:0;pointer-events:none;transition:opacity .3s var(--e-out);
}
.tts-back.show{opacity:1;pointer-events:auto}
.tts-panel{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--sh-3);width:min(94vw,470px);max-height:88vh;overflow:auto;
  padding:1.3rem 1.4rem;transform:translateY(16px) scale(.97);
  transition:transform .38s var(--e-spring);
}
.tts-back.show .tts-panel{transform:none}
.tts-panel h3{
  font-size:1.12rem;font-weight:800;margin:0 0 .25rem;
  display:flex;align-items:center;gap:.5rem;
}
.tts-panel .sub{font-size:var(--t-sm);color:var(--ink-2);margin:0 0 1.1rem}
.tts-row{margin-bottom:1.05rem}
.tts-row > label{
  display:block;font-size:var(--t-xs);font-weight:800;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-2);margin-bottom:.4rem;
}
.tts-seg{display:flex;gap:3px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:3px}
.tts-seg button{
  flex:1;border:0;background:transparent;border-radius:calc(var(--r-sm) - 3px);
  padding:.42rem .3rem;font-size:var(--t-sm);font-weight:700;box-shadow:none;
}
.tts-seg button:hover{transform:none;background:var(--surface)}
.tts-seg button[aria-pressed="true"]{
  background:linear-gradient(140deg,var(--legal),var(--brand));color:#fff;
}
.tts-panel select{
  width:100%;padding:.5rem .6rem;border-radius:var(--r-sm);
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  font-size:var(--t-sm);font-weight:600;cursor:pointer;
}
.tts-panel select:focus{border-color:var(--brand);outline:none}
.tts-slider{display:flex;align-items:center;gap:.75rem}
.tts-slider input[type=range]{flex:1;accent-color:var(--legal);cursor:pointer;height:22px}
.tts-val{
  font-family:var(--f-mono);font-weight:800;font-size:var(--t-sm);
  min-width:3.4em;text-align:right;color:var(--legal);font-variant-numeric:tabular-nums;
}
.tts-note{
  font-size:var(--t-xs);color:var(--ink-2);line-height:1.5;
  background:var(--surface-2);border-radius:var(--r-sm);padding:.6rem .75rem;margin:0 0 1rem;
}
.tts-note b{color:var(--ink)}
.tts-acts{display:flex;gap:.5rem;justify-content:flex-end;flex-wrap:wrap}
.tts-acts .prim{
  background:linear-gradient(140deg,var(--legal),var(--brand));color:#fff;border-color:transparent;
}
.tts-badge{
  font-size:.62rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
  padding:.1rem .35rem;border-radius:4px;background:var(--ej-bg);color:var(--ej);margin-left:.35rem;
}


/* — Variante compacta para los apartados desplegables — */
.tts-bar.mini{margin:0 0 .6rem}
.tts-bar.mini button{
  font-size:.7rem;padding:.24rem .55rem;
  border-color:var(--brand);color:var(--brand);
}
.tts-bar.mini button:hover{background:var(--brand);color:var(--surface)}
.tts-bar.mini .tts-play.on{background:var(--brand);color:var(--surface)}
.tts-bar.mini .tts-time{font-size:.66rem}
.idea .tts-bar.mini{margin:.55rem 0 0}
.legal.tts-on,.body.tts-on,.idea.tts-on{
  box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 20%,transparent)
}
.legal.tts-on{box-shadow:0 0 0 3px color-mix(in srgb,var(--legal) 20%,transparent)}

@media(max-width:620px){
  .tts-mini{left:.6rem;right:.6rem;transform:translateY(140%);max-width:none}
  .tts-mini.show{transform:translateY(0)}
  .tts-mini .lbl{display:none}
}
@media(prefers-reduced-motion:reduce){
  .tts-wave i{animation:none;height:60%}
}
@media print{.tts-bar,.tts-mini,.tts-back{display:none !important}}

const GLOSARIO={"interesado": "Interesado: quien está legitimado para promover un procedimiento o intervenir en él porque es titular de derechos o intereses legítimos afectados por la decisión (art. 4 de la Ley 39/2015).", "conten": "Recurso contencioso-administrativo: impugnación ante los juzgados y tribunales de lo contencioso-administrativo, es decir, ya fuera de la propia Administración.", "silencio": "Silencio administrativo: efecto que la ley anuda a la falta de resolución expresa en plazo. Puede ser estimatorio (positivo) o desestimatorio (negativo) según el procedimiento.", "habil": "Días hábiles: se excluyen del cómputo los sábados, los domingos y los declarados festivos (art. 30.2 de la Ley 39/2015).", "pleno": "Pleno: órgano colegiado formado por todos los concejales o diputados de la entidad local.", "solicitud": "Solicitud de iniciación: escrito por el que el interesado pide a la Administración que abra y resuelva un procedimiento. Su contenido mínimo está en el art. 66.1.", "subsanacion": "Subsanación: corrección de los defectos de la solicitud dentro del plazo de diez días concedido por la Administración. Si no se subsana, se tiene al interesado por desistido.", "desistido": "Tener por desistido: efecto de no subsanar en plazo. Exige resolución expresa en los términos del art. 21 y no impide volver a solicitar.", "declresponsable": "Declaración responsable: documento en el que el interesado manifiesta, bajo su responsabilidad, que cumple los requisitos exigidos, que dispone de la documentación acreditativa y que se compromete a mantener el cumplimiento.", "comunicacion": "Comunicación: documento por el que el interesado pone en conocimiento de la Administración sus datos identificativos o cualquier otro dato relevante para iniciar una actividad o ejercer un derecho.", "expediente": "Expediente administrativo: conjunto ordenado de documentos y actuaciones que sirven de antecedente y fundamento a la resolución, más las diligencias para ejecutarla.", "auxiliar": "Información auxiliar o de apoyo: notas, borradores, opiniones, resúmenes y comunicaciones internas. No forma parte del expediente, salvo los informes preceptivos y facultativos solicitados antes de la resolución.", "celeridad": "Principio de celeridad: exigencia de tramitar sin dilaciones, impulsando de oficio todos los trámites.", "impulso": "Impulso de oficio: deber de la Administración de hacer avanzar el procedimiento sin necesidad de que el interesado lo pida.", "concentracion": "Concentración de trámites: acordar en un solo acto todos los trámites que admitan impulso simultáneo y no deban cumplirse sucesivamente.", "decaido": "Decaimiento en el derecho al trámite: pérdida de la posibilidad de realizar un trámite por no cumplirlo en plazo, con la salvedad del art. 73.3.", "incidental": "Cuestión incidental: cuestión accesoria que surge durante la tramitación. No suspende el procedimiento, salvo la recusación.", "eni": "Esquema Nacional de Interoperabilidad: marco técnico que fija los criterios para el intercambio de documentos y expedientes electrónicos entre Administraciones.", "obligados": "Sujetos obligados a relacionarse electrónicamente: personas jurídicas, entidades sin personalidad, profesionales colegiados, notarios y registradores, representantes y empleados públicos (art. 14.2 y 14.3)."};
const LABELS={"interesado": "Interesado", "conten": "Recurso contencioso-administrativo", "silencio": "Silencio administrativo", "habil": "Días hábiles", "pleno": "Pleno", "solicitud": "Solicitud de iniciación", "subsanacion": "Subsanación", "desistido": "Tener por desistido", "declresponsable": "Declaración responsable", "comunicacion": "Comunicación", "expediente": "Expediente administrativo", "auxiliar": "Información auxiliar", "celeridad": "Celeridad", "impulso": "Impulso de oficio", "concentracion": "Concentración de trámites", "decaido": "Decaimiento", "incidental": "Cuestión incidental", "eni": "Esquema Nacional de Interoperabilidad", "obligados": "Sujetos obligados"};
</script>
<script>
const ARTS=[{"n": 66, "t": "Solicitudes de iniciación", "ubic": "Título IV ▸ Capítulo II (Iniciación del procedimiento) ▸ Sección 3.ª (Inicio del procedimiento a solicitud del interesado)", "idea": "Seis contenidos mínimos en toda solicitud, y modelos obligatorios si la norma los fija.", "literal": "<p>1. Las solicitudes que se formulen deberán contener:</p><p>a) Nombre y apellidos del interesado y, en su caso, de la persona que lo represente.</p><p>b) Identificación del medio electrónico, o en su defecto, lugar físico en que desea que se practique la notificación. Adicionalmente, los interesados podrán aportar su dirección de correo electrónico y/o dispositivo electrónico con el fin de que las Administraciones Públicas les avisen del envío o puesta a disposición de la notificación.</p><p>c) Hechos, razones y petición en que se concrete, con toda claridad, la solicitud.</p><p>d) Lugar y fecha.</p><p>e) Firma del solicitante o acreditación de la autenticidad de su voluntad expresada por cualquier medio.</p><p>f) Órgano, centro o unidad administrativa a la que se dirige y su correspondiente código de identificación. Las oficinas de asistencia en materia de registros estarán obligadas a facilitar a los interesados el código de identificación si el interesado lo desconoce. Asimismo, las Administraciones Públicas deberán mantener y actualizar en la sede electrónica correspondiente un listado con los códigos de identificación vigentes.</p><p>2. Cuando las pretensiones correspondientes a una pluralidad de personas tengan un contenido y fundamento idéntico o sustancialmente similar, podrán ser formuladas en una única solicitud, salvo que las normas reguladoras de los procedimientos específicos dispongan otra cosa.</p><p>3. De las solicitudes, comunicaciones y escritos que presenten los interesados electrónicamente o en las oficinas de asistencia en materia de registros de la Administración, podrán éstos exigir el correspondiente recibo que acredite la fecha y hora de presentación.</p><p>4. Las Administraciones Públicas deberán establecer modelos y sistemas de presentación masiva que permitan a los interesados presentar simultáneamente varias solicitudes. Estos modelos, de uso voluntario, estarán a disposición de los interesados en las correspondientes sedes electrónicas y en las oficinas de asistencia en materia de registros de las Administraciones Públicas. Los solicitantes podrán acompañar los elementos que estimen convenientes para precisar o completar los datos del modelo, los cuales deberán ser admitidos y tenidos en cuenta por el órgano al que se dirijan.</p><p>5. Los sistemas normalizados de solicitud podrán incluir comprobaciones automáticas de la información aportada respecto de datos almacenados en sistemas propios o pertenecientes a otras Administraciones u ofrecer el formulario cumplimentado, en todo o en parte, con objeto de que el interesado verifique la información y, en su caso, la modifique y complete.</p><p>6. Cuando la Administración en un procedimiento concreto establezca expresamente modelos específicos de presentación de solicitudes, éstos serán de uso obligatorio por los interesados.</p>", "dis": "<p><b>66.1 — contenido mínimo:</b></p>\n<table><thead><tr><th>Letra</th><th>Contenido</th></tr></thead><tbody>\n<tr><td><b>a)</b></td><td><b>Nombre y apellidos</b> del interesado y, en su caso, de su <b>representante</b></td></tr>\n<tr><td><b>b)</b></td><td><b>Medio electrónico</b> o, en su defecto, <b>lugar físico</b> donde desea que se practique la notificación; adicionalmente, correo electrónico o dispositivo para el <b>aviso</b></td></tr>\n<tr><td><b>c)</b></td><td><b>Hechos, razones y petición</b> en que se concrete, <b>con toda claridad</b>, la solicitud</td></tr>\n<tr><td><b>d)</b></td><td><b>Lugar y fecha</b></td></tr>\n<tr><td><b>e)</b></td><td><b>Firma</b> del solicitante o acreditación de la autenticidad de su voluntad por cualquier medio</td></tr>\n<tr><td><b>f)</b></td><td><b>Órgano</b>, centro o unidad a la que se dirige y su <b>código de identificación</b>; las oficinas de asistencia están obligadas a facilitarlo si se desconoce</td></tr>\n</tbody></table>\n<ul>\n<li><b>66.2 — solicitud colectiva:</b> si las pretensiones de una <b>pluralidad de personas</b> tienen contenido y fundamento <b>idéntico o sustancialmente similar</b>, pueden formularse en una <b>única solicitud</b>, salvo que las normas del procedimiento dispongan otra cosa.</li>\n<li><b>66.3 — recibo:</b> los interesados pueden <b>exigir recibo</b> que acredite <b>fecha y hora</b> de presentación.</li>\n<li><b>66.4 y 66.5 — modelos:</b> las Administraciones deben establecer <b>modelos y sistemas de presentación masiva</b>, de <b>uso voluntario</b>, con posibles comprobaciones automáticas.</li>\n<li><b>66.6 — modelos obligatorios:</b> cuando la Administración establezca <b>expresamente modelos específicos</b> en un procedimiento concreto, serán de <b>uso obligatorio</b>.</li>\n</ul>", "llano": "<p>Toda solicitud debe decir quién eres, dónde te notifican, qué pides y por qué, dónde y cuándo la firmas y a quién se dirige. Los modelos son, por regla, voluntarios; pero si la Administración aprueba un modelo específico para ese procedimiento, ahí sí es obligatorio.</p>", "porque": "<p>El contenido mínimo persigue que la Administración pueda <b>identificar</b>, <b>localizar</b> y <b>entender</b> lo que se pide sin necesidad de adivinarlo. La letra c) —«con toda claridad»— es la que evita el escrito genérico imposible de resolver.</p>\n<p>La distinción entre modelos <b>voluntarios</b> (66.4) y <b>obligatorios</b> (66.6) es una de las preguntas más frecuentes: la regla general es la libertad de forma, pero cede cuando la propia norma del procedimiento impone un modelo.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> un formulario de reclamación que pide tus datos, qué te ha pasado y qué quieres.</li>\n<li><b>Real:</b> cien vecinos de la misma calle solicitan la reparación del alumbrado con una <b>única solicitud</b> firmada por todos (art. 66.2).</li>\n<li><b>Caso límite:</b> el ayuntamiento aprueba un modelo específico para las solicitudes de vado. Presentar un escrito libre <b>no</b> cumple el art. 66.6 y procederá requerir su subsanación.</li>\n</ul>", "noej": "<ul>\n<li><b>No es</b> obligatorio, con carácter general, usar los modelos normalizados: solo los del art. 66.6.</li>\n<li><b>No cabe</b> la solicitud colectiva si las normas del procedimiento la excluyen.</li>\n<li><b>No basta</b> con pedir: hay que exponer <b>hechos y razones</b>.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 68 LPAC:</b> subsanación cuando falte algún requisito.</li>\n<li><b>Art. 16 LPAC:</b> registros y lugares de presentación.</li>\n<li><b>Art. 53.1 LPAC:</b> derechos del interesado.</li>\n<li><b>Art. 115 LPAC:</b> contenido paralelo del escrito de recurso.</li>\n</ul>", "trampas": "<ul>\n<li>Los modelos son <b>voluntarios</b>, salvo los específicos del art. <b>66.6</b>, que son <b>obligatorios</b>.</li>\n<li>La solicitud colectiva exige contenido y fundamento <b>idéntico o sustancialmente similar</b>.</li>\n<li>El recibo acredita <b>fecha y hora</b>.</li>\n</ul>", "ancla": "<p><b>«Quién, dónde te aviso, qué pido y por qué, dónde y cuándo, firma y a quién.»</b> Seis letras.</p>", "vis": "<svg viewBox=\"0 0 660 135\" role=\"img\" aria-label=\"Contenido de la solicitud de iniciación\">\n<rect x=\"200\" y=\"8\" width=\"260\" height=\"30\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/>\n<text x=\"330\" y=\"28\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">SOLICITUD (art. 66.1)</text>\n<g font-size=\"10\" text-anchor=\"middle\" fill=\"currentColor\">\n<rect x=\"15\" y=\"52\" width=\"200\" height=\"58\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"115\" y=\"74\" font-weight=\"700\" fill=\"var(--acc)\">Quién</text><text x=\"115\" y=\"92\">a) interesado y representante</text>\n<rect x=\"230\" y=\"52\" width=\"200\" height=\"58\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"330\" y=\"74\" font-weight=\"700\" fill=\"var(--ej)\">Qué y dónde</text><text x=\"330\" y=\"92\">b) notificación · c) petición</text>\n<rect x=\"445\" y=\"52\" width=\"200\" height=\"58\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"545\" y=\"74\" font-weight=\"700\" fill=\"var(--warn)\">Formalidades</text><text x=\"545\" y=\"92\">d) lugar y fecha · e) firma · f) órgano</text>\n</g>\n<text x=\"330\" y=\"128\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--exc)\">Modelos voluntarios (66.4), salvo los modelos específicos del 66.6, que son obligatorios</text>\n</svg>"}, {"n": 67, "t": "Solicitudes de iniciación en los procedimientos de responsabilidad patrimonial", "ubic": "Título IV ▸ Capítulo II (Iniciación del procedimiento) ▸ Sección 3.ª (Inicio del procedimiento a solicitud del interesado)", "idea": "Un año para reclamar; en daños personales, desde la curación o las secuelas.", "literal": "<p>1. Los interesados sólo podrán solicitar el inicio de un procedimiento de responsabilidad patrimonial, cuando no haya prescrito su derecho a reclamar. El derecho a reclamar prescribirá al año de producido el hecho o el acto que motive la indemnización o se manifieste su efecto lesivo. En caso de daños de carácter físico o psíquico a las personas, el plazo empezará a computarse desde la curación o la determinación del alcance de las secuelas. En los casos en que proceda reconocer derecho a indemnización por anulación en vía administrativa o contencioso-administrativa de un acto o disposición de carácter general, el derecho a reclamar prescribirá al año de haberse notificado la resolución administrativa o la sentencia definitiva. En los casos de responsabilidad patrimonial a que se refiere el artículo 32, apartados 4 y 5, de la Ley de Régimen Jurídico del Sector Público, el derecho a reclamar prescribirá al año de la publicación en el «Boletín Oficial del Estado» o en el «Diario Oficial de la Unión Europea», según el caso, de la sentencia que declare la inconstitucionalidad de la norma o su carácter contrario al Derecho de la Unión Europea.</p><p>2. Además de lo previsto en el artículo 66, en la solicitud que realicen los interesados se deberán especificar las lesiones producidas, la presunta relación de causalidad entre éstas y el funcionamiento del servicio público, la evaluación económica de la responsabilidad patrimonial, si fuera posible, y el momento en que la lesión efectivamente se produjo, e irá acompañada de cuantas alegaciones, documentos e informaciones se estimen oportunos y de la proposición de prueba, concretando los medios de que pretenda valerse el reclamante.</p>", "dis": "<ul>\n<li><b>67.1 — regla general:</b> solo puede solicitarse el inicio de un procedimiento de responsabilidad patrimonial cuando <b>no haya prescrito</b> el derecho a reclamar, que prescribe <b>al año</b> de producido el hecho o el acto que motive la indemnización <b>o de manifestarse su efecto lesivo</b>.</li>\n<li><b>Reglas especiales de cómputo:</b>\n<table><thead><tr><th>Supuesto</th><th><i>Dies a quo</i></th></tr></thead><tbody>\n<tr><td>Daños <b>físicos o psíquicos</b> a las personas</td><td>Desde la <b>curación</b> o la <b>determinación del alcance de las secuelas</b></td></tr>\n<tr><td>Indemnización por <b>anulación</b> en vía administrativa o contencioso-administrativa</td><td>Al año de <b>notificarse</b> la resolución o la sentencia definitiva</td></tr>\n<tr><td>Responsabilidad del art. 32.4 y 32.5 de la Ley 40/2015 (norma <b>inconstitucional</b> o contraria al Derecho de la Unión)</td><td>Al año de la <b>publicación</b> en el «BOE» o en el «DOUE» de la sentencia</td></tr>\n</tbody></table></li>\n<li><b>67.2 — contenido adicional:</b> además de lo previsto en el art. 66, hay que especificar las <b>lesiones producidas</b>, la <b>presunta relación de causalidad</b> con el funcionamiento del servicio público, la <b>evaluación económica</b> si fuera posible y el <b>momento</b> en que la lesión se produjo, acompañando <b>alegaciones, documentos e informaciones</b> y la <b>proposición de prueba</b>.</li>\n</ul>", "llano": "<p>Un año para reclamar. Pero el año no siempre empieza el día del accidente: si hubo lesiones, empieza cuando te curas o cuando se sabe con qué secuelas te quedas. Y hay que explicar qué daño sufriste, por qué es culpa del servicio público y cuánto vale.</p>", "porque": "<p>Contar el plazo desde el hecho sería injusto en los daños personales: mientras la lesión evoluciona no se conoce su alcance real y no se puede cuantificar la indemnización. Por eso el <i>dies a quo</i> se retrasa hasta la <b>estabilización</b> del daño. Es la regla que más litigios ha generado y la que más se pregunta.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> no se puede tasar la reparación hasta saber el alcance real de la avería.</li>\n<li><b>Real:</b> una caída por una baldosa suelta el 4 de marzo de 2025, con alta médica y secuelas determinadas el 20 de noviembre de 2025. El plazo de un año vence el <b>20 de noviembre de 2026</b>, no en marzo.</li>\n<li><b>Caso límite:</b> se anula en vía contenciosa una liquidación y de ello nace derecho a indemnización. El año se cuenta desde la <b>notificación de la sentencia definitiva</b>.</li>\n</ul>", "noej": "<ul>\n<li><b>No se cuenta</b> siempre desde el hecho: en daños personales, desde la curación o las secuelas.</li>\n<li><b>No basta</b> con alegar el daño: hay que indicar la <b>relación de causalidad</b> y evaluarlo económicamente si es posible.</li>\n<li><b>No procede</b> la solicitud si el derecho ha <b>prescrito</b>.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 65 LPAC:</b> iniciación de oficio de estos procedimientos.</li>\n<li><b>Art. 81 LPAC:</b> informes y dictámenes preceptivos.</li>\n<li><b>Art. 91 LPAC:</b> especialidades de la resolución.</li>\n<li><b>Arts. 32 a 37 de la Ley 40/2015</b> (documento 2): régimen sustantivo de la responsabilidad patrimonial.</li>\n</ul>", "trampas": "<ul>\n<li>El plazo es de <b>un año</b>, no de cuatro ni de seis meses.</li>\n<li>En daños <b>físicos o psíquicos</b>, desde la <b>curación</b> o la determinación de las <b>secuelas</b>.</li>\n<li>En los casos de norma inconstitucional o contraria al Derecho de la Unión, desde la <b>publicación</b> de la sentencia.</li>\n</ul>", "ancla": "<p><b>«Un año desde que sabes cuánto te duele.»</b> Y si es por una norma anulada, desde que se publica la sentencia.</p>", "vis": "<svg viewBox=\"0 0 660 140\" role=\"img\" aria-label=\"Cómputo del plazo de reclamación patrimonial\">\n<rect x=\"200\" y=\"8\" width=\"260\" height=\"30\" rx=\"8\" fill=\"var(--exc)\" stroke=\"var(--exc)\"/>\n<text x=\"330\" y=\"28\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">UN AÑO PARA RECLAMAR</text>\n<g font-size=\"10\" text-anchor=\"middle\" fill=\"currentColor\">\n<rect x=\"15\" y=\"52\" width=\"200\" height=\"62\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"115\" y=\"74\" font-weight=\"700\" fill=\"var(--acc)\">Regla general</text><text x=\"115\" y=\"92\">desde el hecho o desde</text><text x=\"115\" y=\"106\">que se manifiesta el efecto</text>\n<rect x=\"230\" y=\"52\" width=\"200\" height=\"62\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"330\" y=\"74\" font-weight=\"700\" fill=\"var(--ej)\">Daños personales</text><text x=\"330\" y=\"92\">desde la curación o</text><text x=\"330\" y=\"106\">la determinación de secuelas</text>\n<rect x=\"445\" y=\"52\" width=\"200\" height=\"62\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"545\" y=\"74\" font-weight=\"700\" fill=\"var(--warn)\">Norma anulada</text><text x=\"545\" y=\"92\">desde la publicación</text><text x=\"545\" y=\"106\">de la sentencia (BOE/DOUE)</text>\n</g>\n</svg>"}, {"n": 68, "t": "Subsanación y mejora de la solicitud", "ubic": "Título IV ▸ Capítulo II (Iniciación del procedimiento) ▸ Sección 3.ª (Inicio del procedimiento a solicitud del interesado)", "idea": "Diez días para subsanar, ampliables cinco salvo en concurrencia competitiva.", "literal": "<p>1. Si la solicitud de iniciación no reúne los requisitos que señala el artículo 66, y, en su caso, los que señala el artículo 67 u otros exigidos por la legislación específica aplicable, se requerirá al interesado para que, en un plazo de diez días, subsane la falta o acompañe los documentos preceptivos, con indicación de que, si así no lo hiciera, se le tendrá por desistido de su petición, previa resolución que deberá ser dictada en los términos previstos en el artículo 21.</p><p>2. Siempre que no se trate de procedimientos selectivos o de concurrencia competitiva, este plazo podrá ser ampliado prudencialmente, hasta cinco días, a petición del interesado o a iniciativa del órgano, cuando la aportación de los documentos requeridos presente dificultades especiales.</p><p>3. En los procedimientos iniciados a solicitud de los interesados, el órgano competente podrá recabar del solicitante la modificación o mejora voluntarias de los términos de aquélla. De ello se levantará acta sucinta, que se incorporará al procedimiento.</p><p>4. Si alguno de los sujetos a los que hace referencia el artículo 14.2 y 14.3 presenta su solicitud presencialmente, las Administraciones Públicas requerirán al interesado para que la subsane a través de su presentación electrónica. A estos efectos, se considerará como fecha de presentación de la solicitud aquella en la que haya sido realizada la subsanación.</p>", "dis": "<ul>\n<li><b>68.1 — requerimiento:</b> si la solicitud no reúne los requisitos del art. 66 —o los del art. 67 u otros de la legislación específica—, se requiere al interesado para que en <b>diez días</b> <span class=\"t\" data-k=\"subsanacion\">subsane</span> la falta o acompañe los documentos preceptivos, con indicación de que, si no lo hace, <b>se le tendrá por <span class=\"t\" data-k=\"desistido\">desistido</span></b> de su petición, previa resolución dictada conforme al art. 21.</li>\n<li><b>68.2 — ampliación:</b> <b>siempre que no se trate de procedimientos selectivos o de concurrencia competitiva</b>, el plazo puede ampliarse <b>prudencialmente hasta cinco días</b>, a petición del interesado o de oficio, cuando la aportación presente <b>dificultades especiales</b>.</li>\n<li><b>68.3 — mejora voluntaria:</b> el órgano puede recabar la <b>modificación o mejora voluntarias</b> de los términos de la solicitud, levantando <b>acta sucinta</b> que se incorpora al procedimiento.</li>\n<li><b>68.4 — presentación presencial de un sujeto obligado:</b> si alguno de los <span class=\"t\" data-k=\"obligados\">sujetos del art. 14.2 y 14.3</span> presenta su solicitud <b>presencialmente</b>, se le requiere para que la subsane mediante <b>presentación electrónica</b>. La <b>fecha de presentación</b> pasa a ser <b>aquella en que se realice la subsanación</b>.</li>\n</ul>\n<div class=\"box warn\"><span class=\"lbl\">La trampa del art. 68.4</span>Presentar en papel siendo un sujeto obligado no invalida la solicitud, pero <b>desplaza su fecha</b>. En un procedimiento con plazo —una convocatoria de subvenciones, por ejemplo— eso puede significar quedar fuera.</div>", "llano": "<p>Si falta algo, te dan diez días para arreglarlo y te avisan de que si no lo haces te tendrán por desistido. Se pueden ampliar cinco días más, salvo en oposiciones y concursos. Y ojo: si estabas obligado a presentar por internet y lo hiciste en papel, la fecha que cuenta es la del día en que lo hagas bien.</p>", "porque": "<p>La subsanación evita que un defecto formal cierre la puerta a un derecho: el procedimiento no está para atrapar al ciudadano. Por eso la ley exige <b>requerimiento previo</b> y <b>advertencia expresa</b> de la consecuencia, y obliga a dictar <b>resolución</b> para tener por desistido, que además es recurrible.</p>\n<p>La exclusión de la ampliación en procedimientos <b>selectivos o de concurrencia</b> responde a la <b>igualdad</b> entre aspirantes: ampliar el plazo a uno alteraría las reglas comunes del proceso.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> un plazo para completar la documentación que faltaba en el expediente del banco.</li>\n<li><b>Real:</b> una solicitud de licencia sin plano de situación: requerimiento con <b>diez días</b>, ampliables cinco si el plano exige un levantamiento topográfico.</li>\n<li><b>Caso límite:</b> una S.L. presenta en el registro presencial su solicitud de subvención el último día del plazo. Requerida, la presenta electrónicamente tres días después: la fecha válida es <b>la de la subsanación</b> y queda fuera de plazo (art. 68.4).</li>\n</ul>", "noej": "<ul>\n<li><b>No cabe</b> la ampliación de cinco días en procedimientos <b>selectivos o de concurrencia competitiva</b>.</li>\n<li><b>No basta</b> con no subsanar para archivar: hace falta <b>resolución expresa</b> (art. 21).</li>\n<li><b>No es</b> obligatoria la mejora del art. 68.3: es <b>voluntaria</b> para el interesado.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 66 LPAC:</b> requisitos cuya falta se subsana.</li>\n<li><b>Art. 21 LPAC:</b> obligación de resolver, también en el desistimiento.</li>\n<li><b>Art. 14.2 y 14.3 LPAC:</b> sujetos obligados a relacionarse electrónicamente.</li>\n<li><b>Art. 94 LPAC:</b> desistimiento del interesado, figura distinta del art. 68.1.</li>\n</ul>", "trampas": "<ul>\n<li><b>Diez días</b> de subsanación, ampliables <b>hasta cinco</b>, salvo selectivos y concurrencia.</li>\n<li>El desistimiento exige <b>resolución</b> previa.</li>\n<li>En el art. 68.4 la <b>fecha de presentación</b> es la de la <b>subsanación</b>.</li>\n</ul>", "ancla": "<p><b>«Diez y cinco, salvo oposición.»</b> Y si presentas en papel debiendo hacerlo online, <b>la fecha se te mueve</b>.</p>", "vis": "<svg viewBox=\"0 0 660 140\" role=\"img\" aria-label=\"Subsanación de la solicitud\">\n<defs><marker id=\"sb1\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\"><path d=\"M0 0 L9 4.5 L0 9 z\" fill=\"var(--acc)\"/></marker></defs>\n<rect x=\"15\" y=\"35\" width=\"180\" height=\"56\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/>\n<text x=\"105\" y=\"57\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--warn)\">Solicitud incompleta</text>\n<text x=\"105\" y=\"76\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">falta un requisito del art. 66</text>\n<path d=\"M198 63 L 233 63\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#sb1)\"/>\n<rect x=\"237\" y=\"35\" width=\"185\" height=\"56\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/>\n<text x=\"329\" y=\"55\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"var(--acc)\">10 días</text>\n<text x=\"329\" y=\"76\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">+5 salvo concurrencia</text>\n<path d=\"M425 63 L 460 63\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#sb1)\"/>\n<rect x=\"464\" y=\"35\" width=\"180\" height=\"56\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/>\n<text x=\"554\" y=\"57\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--exc)\">Si no subsana</text>\n<text x=\"554\" y=\"76\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">desistido, previa resolución</text>\n<text x=\"330\" y=\"126\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--ink2)\">68.4 · sujeto obligado que presenta en papel: la fecha válida es la de la subsanación electrónica</text>\n</svg>"}, {"n": 69, "t": "Declaración responsable y comunicación", "ubic": "Título IV ▸ Capítulo II (Iniciación del procedimiento) ▸ Sección 3.ª (Inicio del procedimiento a solicitud del interesado)", "idea": "Declaración responsable y comunicación permiten actuar desde el mismo día.", "literal": "<p>1. A los efectos de esta Ley, se entenderá por declaración responsable el documento suscrito por un interesado en el que éste manifiesta, bajo su responsabilidad, que cumple con los requisitos establecidos en la normativa vigente para obtener el reconocimiento de un derecho o facultad o para su ejercicio, que dispone de la documentación que así lo acredita, que la pondrá a disposición de la Administración cuando le sea requerida, y que se compromete a mantener el cumplimiento de las anteriores obligaciones durante el período de tiempo inherente a dicho reconocimiento o ejercicio. Los requisitos a los que se refiere el párrafo anterior deberán estar recogidos de manera expresa, clara y precisa en la correspondiente declaración responsable. Las Administraciones podrán requerir en cualquier momento que se aporte la documentación que acredite el cumplimiento de los mencionados requisitos y el interesado deberá aportarla.</p><p>2. A los efectos de esta Ley, se entenderá por comunicación aquel documento mediante el que los interesados ponen en conocimiento de la Administración Pública competente sus datos identificativos o cualquier otro dato relevante para el inicio de una actividad o el ejercicio de un derecho.</p><p>3. Las declaraciones responsables y las comunicaciones permitirán, el reconocimiento o ejercicio de un derecho o bien el inicio de una actividad, desde el día de su presentación, sin perjuicio de las facultades de comprobación, control e inspección que tengan atribuidas las Administraciones Públicas. No obstante lo dispuesto en el párrafo anterior, la comunicación podrá presentarse dentro de un plazo posterior al inicio de la actividad cuando la legislación correspondiente lo prevea expresamente.</p><p>4. La inexactitud, falsedad u omisión, de carácter esencial, de cualquier dato o información que se incorpore a una declaración responsable o a una comunicación, o la no presentación ante la Administración competente de la declaración responsable, la documentación que sea en su caso requerida para acreditar el cumplimiento de lo declarado, o la comunicación, determinará la imposibilidad de continuar con el ejercicio del derecho o actividad afectada desde el momento en que se tenga constancia de tales hechos, sin perjuicio de las responsabilidades penales, civiles o administrativas a que hubiera lugar. Asimismo, la resolución de la Administración Pública que declare tales circunstancias podrá determinar la obligación del interesado de restituir la situación jurídica al momento previo al reconocimiento o al ejercicio del derecho o al inicio de la actividad correspondiente, así como la imposibilidad de instar un nuevo procedimiento con el mismo objeto durante un período de tiempo determinado por la ley, todo ello conforme a los términos establecidos en las normas sectoriales de aplicación.</p><p>5. Las Administraciones Públicas tendrán permanentemente publicados y actualizados modelos de declaración responsable y de comunicación, fácilmente accesibles a los interesados.</p><p>6. Únicamente será exigible, bien una declaración responsable, bien una comunicación para iniciar una misma actividad u obtener el reconocimiento de un mismo derecho o facultad para su ejercicio, sin que sea posible la exigencia de ambas acumulativamente.</p>", "dis": "<table><thead><tr><th></th><th><span class=\"t\" data-k=\"declresponsable\">Declaración responsable</span></th><th><span class=\"t\" data-k=\"comunicacion\">Comunicación</span></th></tr></thead><tbody>\n<tr><td><b>Qué es</b></td><td>Documento en que el interesado <b>manifiesta bajo su responsabilidad</b> que cumple los requisitos, que <b>dispone de la documentación</b> que lo acredita, que la <b>pondrá a disposición</b> cuando se le requiera y que se <b>compromete a mantener</b> el cumplimiento</td><td>Documento por el que se <b>pone en conocimiento</b> de la Administración los <b>datos identificativos</b> o cualquier otro dato relevante para el inicio de una actividad o el ejercicio de un derecho</td></tr>\n</tbody></table>\n<ul>\n<li><b>69.3 — efecto:</b> permiten el reconocimiento o ejercicio del derecho o el inicio de la actividad <b>desde el día de su presentación</b>, sin perjuicio de las facultades de <b>comprobación, control e inspección</b>. La <b>comunicación</b> puede presentarse <b>después</b> del inicio de la actividad cuando la legislación lo prevea expresamente.</li>\n<li><b>69.4 — consecuencias del incumplimiento:</b> la <b>inexactitud, falsedad u omisión de carácter esencial</b> de cualquier dato, o la <b>no presentación</b> del documento o de la documentación requerida, determina la <b>imposibilidad de continuar</b> con el ejercicio del derecho o actividad <b>desde que se tenga constancia</b>, sin perjuicio de responsabilidades penales, civiles o administrativas. La resolución puede además obligar a <b>restituir la situación</b> al momento previo y a la <b>imposibilidad de instar un nuevo procedimiento</b> con el mismo objeto durante un período determinado por la ley.</li>\n<li><b>69.5 — publicidad:</b> las Administraciones tendrán permanentemente publicados y actualizados <b>modelos</b> de ambos documentos.</li>\n<li><b>69.6 — no acumulación:</b> <b>únicamente será exigible</b> una de las dos, <b>sin que sea posible exigir ambas acumulativamente</b> para la misma actividad o derecho.</li>\n</ul>", "llano": "<p>En lugar de pedir permiso y esperar, declaras que cumples los requisitos y empiezas ese mismo día. La Administración comprueba después. Si mentiste en algo esencial, se acabó la actividad desde que se descubre, hay que devolver las cosas a su sitio y puedes quedarte un tiempo sin poder volver a intentarlo.</p>", "porque": "<p>Es el <b>cambio de modelo</b> que impuso la Directiva de Servicios: sustituir el control <b>previo</b> —la autorización— por el control <b>posterior</b>, para no frenar la actividad económica. El equilibrio está en el art. 69.4: la contrapartida de empezar sin permiso es un régimen severo si lo declarado no era cierto.</p>\n<p>El art. 69.6 evita una práctica administrativa frecuente: exigir declaración responsable <b>y además</b> comunicación para lo mismo, duplicando cargas.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> declarar que cumples los requisitos de un descuento y que puedes acreditarlo si te lo piden.</li>\n<li><b>Real:</b> la apertura de una peluquería mediante <b>declaración responsable</b>: se abre el mismo día de su presentación, sin perjuicio de la inspección municipal posterior.</li>\n<li><b>Caso límite:</b> se comprueba que el local carecía del certificado de instalación eléctrica declarado. Hay <b>inexactitud esencial</b>: cese de la actividad desde que se constata, restitución y posible imposibilidad de instar un nuevo procedimiento (art. 69.4).</li>\n</ul>", "noej": "<ul>\n<li><b>No cabe</b> exigir <b>a la vez</b> declaración responsable y comunicación para lo mismo (art. 69.6).</li>\n<li><b>No impide</b> la declaración responsable el control <b>posterior</b>: la Administración conserva sus facultades de inspección.</li>\n<li><b>No toda</b> inexactitud produce el efecto del 69.4: debe ser de <b>carácter esencial</b>.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 66 LPAC:</b> la solicitud, cauce alternativo cuando se exige autorización previa.</li>\n<li><b>Art. 47.1.f) LPAC:</b> nulidad de los actos por los que se adquieren derechos careciendo de los requisitos esenciales.</li>\n<li><b>Art. 84 y ss. de la Ley 7/1985 (LBRL)</b> <i>(norma externa a la biblioteca)</i>: intervención administrativa en la actividad de los particulares.</li>\n</ul>", "trampas": "<ul>\n<li>Ambas permiten actuar <b>desde el día de su presentación</b>.</li>\n<li>La <b>comunicación</b> puede ser posterior al inicio de la actividad <b>solo</b> si la legislación lo prevé expresamente.</li>\n<li>La inexactitud debe ser de <b>carácter esencial</b>.</li>\n<li><b>Nunca</b> las dos a la vez.</li>\n</ul>", "ancla": "<p><b>«Declaro y empiezo; si mentí, paro, restituyo y espero.»</b> Y nunca me pidas las dos.</p>", "vis": "<svg viewBox=\"0 0 660 140\" role=\"img\" aria-label=\"Declaración responsable y comunicación\">\n<defs><marker id=\"dr1\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\"><path d=\"M0 0 L9 4.5 L0 9 z\" fill=\"var(--ej)\"/></marker></defs>\n<rect x=\"30\" y=\"32\" width=\"230\" height=\"56\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/>\n<text x=\"145\" y=\"54\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">Presentación</text>\n<text x=\"145\" y=\"73\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">declaración responsable o comunicación</text>\n<path d=\"M263 60 L 313 60\" stroke=\"var(--ej)\" stroke-width=\"2.5\" marker-end=\"url(#dr1)\"/>\n<rect x=\"318\" y=\"32\" width=\"150\" height=\"56\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/>\n<text x=\"393\" y=\"54\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">Actividad</text>\n<text x=\"393\" y=\"73\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">desde ese mismo día</text>\n<path d=\"M471 60 L 511 60\" stroke=\"var(--exc)\" stroke-width=\"2.5\" marker-end=\"url(#dr1)\"/>\n<rect x=\"516\" y=\"32\" width=\"130\" height=\"56\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/>\n<text x=\"581\" y=\"54\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--warn)\">Control</text>\n<text x=\"581\" y=\"73\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">posterior</text>\n<text x=\"330\" y=\"122\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--exc)\">Inexactitud esencial: cese de la actividad, restitución y posible imposibilidad de instar otro procedimiento</text>\n</svg>"}];
</script>
<script>
ARTS.push.apply(ARTS,[{"n": 70, "t": "Expediente Administrativo", "ubic": "Título IV ▸ Capítulo III (Ordenación del procedimiento)", "idea": "El expediente es electrónico, foliado e indexado; lo auxiliar queda fuera.", "literal": "<p>1. Se entiende por expediente administrativo el conjunto ordenado de documentos y actuaciones que sirven de antecedente y fundamento a la resolución administrativa, así como las diligencias encaminadas a ejecutarla.</p><p>2. Los expedientes tendrán formato electrónico y se formarán mediante la agregación ordenada de cuantos documentos, pruebas, dictámenes, informes, acuerdos, notificaciones y demás diligencias deban integrarlos, así como un índice numerado de todos los documentos que contenga cuando se remita. Asimismo, deberá constar en el expediente copia electrónica certificada de la resolución adoptada.</p><p>3. Cuando en virtud de una norma sea preciso remitir el expediente electrónico, se hará de acuerdo con lo previsto en el Esquema Nacional de Interoperabilidad y en las correspondientes Normas Técnicas de Interoperabilidad, y se enviará completo, foliado, autentificado y acompañado de un índice, asimismo autentificado, de los documentos que contenga. La autenticación del citado índice garantizará la integridad e inmutabilidad del expediente electrónico generado desde el momento de su firma y permitirá su recuperación siempre que sea preciso, siendo admisible que un mismo documento forme parte de distintos expedientes electrónicos.</p><p>4. No formará parte del expediente administrativo la información que tenga carácter auxiliar o de apoyo, como la contenida en aplicaciones, ficheros y bases de datos informáticas, notas, borradores, opiniones, resúmenes, comunicaciones e informes internos o entre órganos o entidades administrativas, así como los juicios de valor emitidos por las Administraciones Públicas, salvo que se trate de informes, preceptivos y facultativos, solicitados antes de la resolución administrativa que ponga fin al

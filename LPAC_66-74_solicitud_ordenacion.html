 procedimiento.</p>", "dis": "<ul>\n<li><b>70.1 — concepto:</b> conjunto <b>ordenado</b> de documentos y actuaciones que sirven de <b>antecedente y fundamento</b> a la resolución, <b>así como las diligencias encaminadas a ejecutarla</b>.</li>\n<li><b>70.2 — forma:</b> formato <b>electrónico</b>, mediante agregación ordenada de documentos, pruebas, dictámenes, informes, acuerdos, notificaciones y demás diligencias, con un <b>índice numerado</b> de todos los documentos.</li>\n<li><b>70.3 — remisión:</b> conforme al <span class=\"t\" data-k=\"eni\">Esquema Nacional de Interoperabilidad</span>, enviándolo <b>completo, foliado, autentificado</b> y acompañado de un índice, también autentificado.</li>\n<li><b>70.4 — qué NO forma parte:</b> la <span class=\"t\" data-k=\"auxiliar\">información auxiliar o de apoyo</span>: aplicaciones, ficheros y bases de datos informáticas, <b>notas, borradores, opiniones, resúmenes</b>, comunicaciones e <b>informes internos</b> o entre órganos, y los <b>juicios de valor</b> emitidos por las Administraciones. <b>Salvo</b> que se trate de <b>informes preceptivos y facultativos solicitados antes de la resolución</b> que ponga fin al procedimiento.</li>\n</ul>\n<div class=\"box ej\"><span class=\"lbl\">La excepción que hay que memorizar</span>Los <b>informes</b> —preceptivos <b>y</b> facultativos— <b>sí</b> forman parte del expediente si se solicitaron <b>antes</b> de la resolución. La regla enlaza directamente con el art. 30.b) de la Ley 1/2014 de Andalucía, que impide calificar de auxiliar un informe preceptivo para denegar el acceso.</div>", "llano": "<p>El expediente es el relato completo y ordenado del asunto, en formato electrónico y con índice numerado. Fuera quedan las notas, los borradores y los correos internos. Pero los informes pedidos antes de resolver <b>sí</b> están dentro, aunque fueran facultativos.</p>", "porque": "<p>Delimitar el expediente no es una cuestión de archivo: determina <b>qué puede ver el interesado</b> y qué se remite al juez. Excluir lo auxiliar protege el espacio de deliberación interna; incluir los <b>informes</b> impide que se use esa exclusión para ocultar la base técnica o jurídica de la decisión.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> el dosier de un caso, con índice, frente a las notas sueltas de quien lo prepara.</li>\n<li><b>Real:</b> en un expediente de licencia, el informe del arquitecto municipal <b>forma parte</b> del expediente; el correo interno entre técnicos, no.</li>\n<li><b>Caso límite:</b> un informe jurídico <b>facultativo</b> solicitado antes de resolver. Está <b>dentro</b> del expediente: la excepción del art. 70.4 no distingue entre preceptivos y facultativos.</li>\n</ul>", "noej": "<ul>\n<li><b>No forman parte</b> las notas, borradores, opiniones ni resúmenes.</li>\n<li><b>No forman parte</b> los juicios de valor emitidos por las Administraciones.</li>\n<li><b>No se remite</b> el expediente sin <b>índice autentificado</b>.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 53.1.a) LPAC:</b> derecho a obtener copia de los documentos del expediente.</li>\n<li><b>Art. 82 LPAC:</b> puesta de manifiesto del expediente en el trámite de audiencia.</li>\n<li><b>Art. 18.1.b) de la Ley 19/2013:</b> inadmisión por información auxiliar o de apoyo.</li>\n<li><b>Art. 30.b) de la Ley 1/2014 de Andalucía</b> (documento 9): los informes preceptivos no son información auxiliar.</li>\n<li><b>RD 203/2021</b> (documento 4): expediente y documento electrónicos.</li>\n</ul>", "trampas": "<ul>\n<li>El expediente incluye también las <b>diligencias encaminadas a ejecutar</b> la resolución.</li>\n<li>La excepción del 70.4 alcanza a los informes <b>preceptivos y facultativos</b>.</li>\n<li>Se remite <b>completo, foliado, autentificado</b> y con <b>índice</b>.</li>\n</ul>", "ancla": "<p><b>«Dentro lo que fundamenta y lo que ejecuta; fuera notas y borradores; pero los informes, dentro.»</b></p>", "vis": "<svg viewBox=\"0 0 660 140\" role=\"img\" aria-label=\"Contenido del expediente administrativo\">\n<rect x=\"30\" y=\"30\" width=\"285\" height=\"76\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/>\n<text x=\"172\" y=\"52\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">SÍ forma parte</text>\n<text x=\"172\" y=\"71\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">documentos, pruebas, dictámenes, acuerdos</text>\n<text x=\"172\" y=\"86\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">notificaciones, diligencias de ejecución</text>\n<text x=\"172\" y=\"100\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"var(--ej)\">e informes pedidos antes de resolver</text>\n<rect x=\"345\" y=\"30\" width=\"285\" height=\"76\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/>\n<text x=\"487\" y=\"52\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--exc)\">NO forma parte</text>\n<text x=\"487\" y=\"71\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">notas, borradores, opiniones, resúmenes</text>\n<text x=\"487\" y=\"86\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">comunicaciones e informes internos</text>\n<text x=\"487\" y=\"100\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">juicios de valor</text>\n<text x=\"330\" y=\"128\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--ink2)\">Formato electrónico · índice numerado · remisión completa, foliada y autentificada</text>\n</svg>"}, {"n": 71, "t": "Impulso", "ubic": "Título IV ▸ Capítulo III (Ordenación del procedimiento)", "idea": "Impulso de oficio, celeridad y orden riguroso de incoación.", "literal": "<p>1. El procedimiento, sometido al principio de celeridad, se impulsará de oficio en todos sus trámites y a través de medios electrónicos, respetando los principios de transparencia y publicidad.</p><p>2. En el despacho de los expedientes se guardará el orden riguroso de incoación en asuntos de homogénea naturaleza, salvo que por el titular de la unidad administrativa se dé orden motivada en contrario, de la que quede constancia. El incumplimiento de lo dispuesto en el párrafo anterior dará lugar a la exigencia de responsabilidad disciplinaria del infractor y, en su caso, será causa de remoción del puesto de trabajo.</p><p>3. Las personas designadas como órgano instructor o, en su caso, los titulares de las unidades administrativas que tengan atribuida tal función serán responsables directos de la tramitación del procedimiento y, en especial, del cumplimiento de los plazos establecidos.</p>", "dis": "<ul>\n<li><b>71.1 — impulso:</b> el procedimiento, sometido al principio de <span class=\"t\" data-k=\"celeridad\">celeridad</span>, se <b>impulsará de oficio</b> en <b>todos sus trámites</b> y a través de <b>medios electrónicos</b>, respetando los principios de <b>transparencia y publicidad</b>.</li>\n<li><b>71.2 — orden de despacho:</b> se guardará el <b>orden riguroso de incoación</b> en asuntos de <b>homogénea naturaleza</b>, salvo <b>orden motivada en contrario</b> del titular de la unidad, de la que quede constancia. Su incumplimiento da lugar a <b>responsabilidad disciplinaria</b> y, en su caso, es <b>causa de remoción del puesto de trabajo</b>.</li>\n<li><b>71.3 — responsables:</b> el <b>órgano instructor</b> o los titulares de las unidades con esa función son <b>responsables directos</b> de la tramitación y, en especial, del <b>cumplimiento de los plazos</b>.</li>\n</ul>", "llano": "<p>El expediente avanza solo: no hay que ir pidiendo que se tramite. Y se despachan por orden de entrada dentro de cada tipo de asunto; saltarse ese orden sin justificarlo puede costar el puesto. Además, hay un responsable directo con nombre y apellidos del cumplimiento de los plazos.</p>", "porque": "<p>El <b>orden riguroso de incoación</b> es una garantía de <b>igualdad</b>: impide que el trato preferente a unos expedientes se convierta en un favor. Y la <b>responsabilidad personal</b> del art. 71.3 traduce en consecuencias concretas la obligación de resolver del art. 21, que de otro modo quedaría en una declaración sin destinatario.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> el turno en una ventanilla: se atiende por orden, salvo urgencia justificada.</li>\n<li><b>Real:</b> las licencias de obra se despachan por orden de entrada; adelantar una exige <b>orden motivada</b> del jefe de la unidad, de la que quede constancia en el expediente.</li>\n<li><b>Caso límite:</b> se adelanta un expediente por razones de seguridad. Es admisible <b>si</b> hay orden motivada y constancia; si no, hay responsabilidad disciplinaria.</li>\n</ul>", "noej": "<ul>\n<li><b>No opera</b> el orden riguroso entre asuntos de <b>distinta naturaleza</b>.</li>\n<li><b>No depende</b> el impulso de que el interesado lo solicite.</li>\n<li><b>No basta</b> con alterar el orden: hay que <b>motivarlo</b> y dejar constancia.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 21 LPAC:</b> obligación de resolver y responsabilidad del personal.</li>\n<li><b>Art. 20 LPAC:</b> responsabilidad de la tramitación.</li>\n<li><b>Art. 72 LPAC:</b> concentración de trámites, otra manifestación de la celeridad.</li>\n</ul>", "trampas": "<ul>\n<li>El orden riguroso se predica de asuntos de <b>homogénea naturaleza</b>.</li>\n<li>La alteración exige <b>orden motivada</b> y <b>constancia</b>.</li>\n<li>La consecuencia puede llegar a la <b>remoción del puesto de trabajo</b>.</li>\n</ul>", "ancla": "<p><b>«Se impulsa solo, por orden de llegada, y hay un responsable con nombre.»</b></p>", "vis": "<svg viewBox=\"0 0 640 130\" role=\"img\" aria-label=\"Impulso y orden de despacho\">\n<g font-size=\"10\" text-anchor=\"middle\" fill=\"currentColor\">\n<rect x=\"25\" y=\"30\" width=\"175\" height=\"62\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"112\" y=\"52\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">Impulso de oficio</text><text x=\"112\" y=\"70\">celeridad · electrónico</text><text x=\"112\" y=\"84\">transparencia y publicidad</text>\n<rect x=\"232\" y=\"30\" width=\"175\" height=\"62\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"319\" y=\"52\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">Orden riguroso</text><text x=\"319\" y=\"70\">de incoación en asuntos</text><text x=\"319\" y=\"84\">de homogénea naturaleza</text>\n<rect x=\"439\" y=\"30\" width=\"176\" height=\"62\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"527\" y=\"52\" font-size=\"11\" font-weight=\"700\" fill=\"var(--exc)\">Responsabilidad</text><text x=\"527\" y=\"70\">disciplinaria y remoción</text><text x=\"527\" y=\"84\">del puesto de trabajo</text>\n</g>\n<text x=\"320\" y=\"118\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--ink2)\">Solo cabe alterar el orden por orden motivada del titular de la unidad, de la que quede constancia</text>\n</svg>"}, {"n": 72, "t": "Concentración de trámites", "ubic": "Título IV ▸ Capítulo III (Ordenación del procedimiento)", "idea": "Todos los trámites simultáneos posibles, en un solo acto.", "literal": "<p>1. De acuerdo con el principio de simplificación administrativa, se acordarán en un solo acto todos los trámites que, por su naturaleza, admitan un impulso simultáneo y no sea obligado su cumplimiento sucesivo.</p><p>2. Al solicitar los trámites que deban ser cumplidos por otros órganos, deberá consignarse en la comunicación cursada el plazo legal establecido al efecto.</p>", "dis": "<ul>\n<li><b>72.1 — regla:</b> de acuerdo con el principio de <b>simplificación administrativa</b>, se acordarán <b>en un solo acto</b> todos los trámites que, por su naturaleza, admitan <b>impulso simultáneo</b> y no sea obligado su <b>cumplimiento sucesivo</b>.</li>\n<li><b>72.2 — plazos:</b> al solicitar trámites que deban cumplir <b>otros órganos</b>, deberá <b>consignarse en la comunicación el plazo legal</b> establecido al efecto.</li>\n</ul>", "llano": "<p>Si tres trámites pueden hacerse a la vez, se piden a la vez y no uno detrás de otro. Y cuando se pide algo a otro órgano, hay que decirle en el mismo escrito de qué plazo dispone.</p>", "porque": "<p>La tramitación en cadena es la principal causa de los procedimientos eternos: cada trámite espera al anterior aunque no dependa de él. La <b>concentración</b> ataca ese cuello de botella. Y consignar el plazo evita la excusa habitual del órgano informante de que desconocía el término aplicable.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> poner varias lavadoras a la vez en lugar de una detrás de otra.</li>\n<li><b>Real:</b> en una licencia de actividad se piden simultáneamente los informes de urbanismo, sanidad y bomberos, indicando en cada petición el plazo de <b>diez días</b> del art. 80.2.</li>\n<li><b>Caso límite:</b> un informe cuya emisión requiere el resultado de otro. Ahí el cumplimiento <b>sí</b> es sucesivo y no cabe concentrar.</li>\n</ul>", "noej": "<ul>\n<li><b>No cabe</b> concentrar trámites cuyo cumplimiento sea <b>obligadamente sucesivo</b>.</li>\n<li><b>No exime</b> la concentración de respetar el contenido propio de cada trámite.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 71 LPAC:</b> impulso de oficio y celeridad.</li>\n<li><b>Art. 80.2 LPAC:</b> plazo de diez días para emitir informes.</li>\n<li><b>Art. 96 LPAC:</b> tramitación simplificada.</li>\n</ul>", "trampas": "<ul>\n<li>Solo los trámites que <b>por su naturaleza</b> admitan impulso simultáneo.</li>\n<li>Hay que <b>consignar el plazo</b> en la comunicación a otros órganos.</li>\n</ul>", "ancla": "<p><b>«Todo lo que pueda ir junto, junto; y siempre diciendo el plazo.»</b></p>", "vis": "<svg viewBox=\"0 0 640 125\" role=\"img\" aria-label=\"Concentración de trámites\">\n<defs><marker id=\"ct1\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\"><path d=\"M0 0 L9 4.5 L0 9 z\" fill=\"var(--ej)\"/></marker></defs>\n<rect x=\"45\" y=\"40\" width=\"150\" height=\"46\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/>\n<text x=\"120\" y=\"68\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">Un solo acto</text>\n<path d=\"M198 50 L 253 32\" stroke=\"var(--ej)\" stroke-width=\"2\" marker-end=\"url(#ct1)\"/>\n<path d=\"M198 63 L 253 63\" stroke=\"var(--ej)\" stroke-width=\"2\" marker-end=\"url(#ct1)\"/>\n<path d=\"M198 76 L 253 94\" stroke=\"var(--ej)\" stroke-width=\"2\" marker-end=\"url(#ct1)\"/>\n<rect x=\"258\" y=\"14\" width=\"180\" height=\"34\" rx=\"7\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"348\" y=\"36\" text-anchor=\"middle\" font-size=\"10\">Trámite A</text>\n<rect x=\"258\" y=\"46\" width=\"180\" height=\"34\" rx=\"7\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"348\" y=\"68\" text-anchor=\"middle\" font-size=\"10\">Trámite B</text>\n<rect x=\"258\" y=\"78\" width=\"180\" height=\"34\" rx=\"7\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"348\" y=\"100\" text-anchor=\"middle\" font-size=\"10\">Trámite C</text>\n<text x=\"540\" y=\"62\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--ink2)\">indicando siempre</text>\n<text x=\"540\" y=\"78\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--ink2)\">el plazo legal</text>\n</svg>"}, {"n": 73, "t": "Cumplimiento de trámites", "ubic": "Título IV ▸ Capítulo III (Ordenación del procedimiento)", "idea": "Diez días para los trámites del interesado; y el decaimiento tiene remedio.", "literal": "<p>1. Los trámites que deban ser cumplimentados por los interesados deberán realizarse en el plazo de diez días a partir del siguiente al de la notificación del correspondiente acto, salvo en el caso de que en la norma correspondiente se fije plazo distinto.</p><p>2. En cualquier momento del procedimiento, cuando la Administración considere que alguno de los actos de los interesados no reúne los requisitos necesarios, lo pondrá en conocimiento de su autor, concediéndole un plazo de diez días para cumplimentarlo.</p><p>3. A los interesados que no cumplan lo dispuesto en los apartados anteriores, se les podrá declarar decaídos en su derecho al trámite correspondiente. No obstante, se admitirá la actuación del interesado y producirá sus efectos legales, si se produjera antes o dentro del día que se notifique la resolución en la que se tenga por transcurrido el plazo.</p>", "dis": "<ul>\n<li><b>73.1 — plazo:</b> los trámites que deban cumplimentar los interesados se realizarán en <b>diez días</b> a partir del <b>siguiente</b> al de la notificación del acto correspondiente, <b>salvo que la norma fije plazo distinto</b>.</li>\n<li><b>73.2 — requisitos incompletos:</b> en cualquier momento, si la Administración considera que un acto del interesado <b>no reúne los requisitos</b>, lo pondrá en su conocimiento concediéndole <b>diez días</b> para cumplimentarlo.</li>\n<li><b>73.3 — <span class=\"t\" data-k=\"decaido\">decaimiento</span> y su salvedad:</b> a quien no cumpla se le <b>podrá declarar decaído en su derecho al trámite</b>. <b>No obstante</b>, se admitirá su actuación y producirá <b>efectos legales</b> si se produce <b>antes o dentro del día en que se notifique la resolución</b> que tenga por transcurrido el plazo.</li>\n</ul>\n<div class=\"box ej\"><span class=\"lbl\">La segunda oportunidad del art. 73.3</span>Aunque hayas pasado del plazo, si actúas <b>antes o el mismo día</b> en que se te notifica que se te ha tenido por decaído, tu actuación <b>vale</b>. Es una de las reglas más útiles y menos conocidas de la ley.</div>", "llano": "<p>Cuando te toca hacer algo en el expediente tienes diez días. Si no lo haces, pueden declararte decaído en ese trámite. Pero si lo haces antes de que te notifiquen esa declaración —o incluso el mismo día—, tu actuación se admite igualmente.</p>", "porque": "<p>El decaimiento es una sanción procedimental, no un fin en sí mismo. Si el interesado cumple antes de que la Administración haya cerrado formalmente el trámite, no hay ningún perjuicio para el procedimiento y sí lo habría para el ciudadano si se le excluyera. Es la aplicación del <b>principio antiformalista</b> y del favorecimiento del <i>pro actione</i>.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> entregar el trabajo tarde pero antes de que se cierre el acta.</li>\n<li><b>Real:</b> requerido para aportar una escritura, el interesado la presenta el día 14 en lugar del 10. Si la resolución que le tiene por decaído se notifica el día 15, <b>su aportación es válida</b>.</li>\n<li><b>Caso límite:</b> presenta el documento el día 16 y la resolución se notificó el 15. Ahí sí ha decaído en su derecho al trámite.</li>\n</ul>", "noej": "<ul>\n<li><b>No se aplica</b> el plazo de diez días si la norma del procedimiento fija otro.</li>\n<li><b>No es</b> automático el decaimiento: la ley dice «se les <b>podrá</b> declarar».</li>\n<li><b>No equivale</b> el decaimiento en un trámite a la terminación del procedimiento.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 68 LPAC:</b> subsanación de la solicitud, con su propio plazo de diez días.</li>\n<li><b>Art. 76 LPAC:</b> alegaciones de los interesados.</li>\n<li><b>Art. 30 LPAC:</b> cómputo de plazos en días hábiles.</li>\n</ul>", "trampas": "<ul>\n<li><b>Diez días</b> desde el día <b>siguiente</b> al de la notificación.</li>\n<li>El decaimiento es <b>potestativo</b> y admite la salvedad del art. 73.3.</li>\n<li>La actuación vale si se produce <b>antes o dentro del día</b> de la notificación de la resolución.</li>\n</ul>", "ancla": "<p><b>«Diez días; y si llegas tarde, aún vales hasta el día en que te lo notifican.»</b></p>", "vis": "<svg viewBox=\"0 0 660 130\" role=\"img\" aria-label=\"Cumplimiento de trámites y decaimiento\">\n<line x1=\"40\" y1=\"70\" x2=\"620\" y2=\"70\" stroke=\"var(--line)\" stroke-width=\"3\"/>\n<circle cx=\"90\" cy=\"70\" r=\"7\" fill=\"var(--acc)\"/><text x=\"90\" y=\"52\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--acc)\">notificación</text>\n<circle cx=\"290\" cy=\"70\" r=\"7\" fill=\"var(--warn)\"/><text x=\"290\" y=\"52\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--warn)\">día 10</text>\n<circle cx=\"500\" cy=\"70\" r=\"7\" fill=\"var(--exc)\"/><text x=\"500\" y=\"52\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--exc)\">resolución de decaimiento</text>\n<rect x=\"95\" y=\"82\" width=\"400\" height=\"24\" rx=\"6\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/>\n<text x=\"295\" y=\"99\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--ej)\">la actuación del interesado TODAVÍA produce efectos</text>\n<rect x=\"505\" y=\"82\" width=\"115\" height=\"24\" rx=\"6\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/>\n<text x=\"562\" y=\"99\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--exc)\">ya ha decaído</text>\n</svg>"}]);
</script>
<script>
ARTS.push.apply(ARTS,[{"n": 74, "t": "Cuestiones incidentales", "ubic": "Título IV ▸ Capítulo III (Ordenación del procedimiento)", "idea": "Las cuestiones incidentales no paran el procedimiento; solo la recusación.", "literal": "<p>Las cuestiones incidentales que se susciten en el procedimiento, incluso las que se refieran a la nulidad de actuaciones, no suspenderán la tramitación del mismo, salvo la recusación.</p>", "dis": "<ul>\n<li><b>Regla:</b> las <span class=\"t\" data-k=\"incidental\">cuestiones incidentales</span> que se susciten en el procedimiento, <b>incluso las que se refieran a la nulidad de actuaciones</b>, <b>no suspenderán</b> su tramitación.</li>\n<li><b>Única excepción:</b> la <b>recusación</b>.</li>\n</ul>", "llano": "<p>Plantear un incidente no paraliza el expediente, ni siquiera si lo que se alega es la nulidad de lo actuado. La única cosa que lo detiene es pedir que se aparte a quien lo tramita.</p>", "porque": "<p>Sin esta regla, cualquier interesado podría congelar un procedimiento planteando incidentes sucesivos. La excepción de la <b>recusación</b> es lógica: si se cuestiona la <b>imparcialidad</b> de quien tramita, todo lo que haga entretanto quedaría bajo sospecha; hay que resolver primero quién instruye.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> una protesta durante un partido que no detiene el juego, salvo que se cuestione al propio árbitro.</li>\n<li><b>Real:</b> el interesado alega la nulidad de la prueba practicada. El procedimiento <b>continúa</b>; la cuestión se resolverá en la resolución final.</li>\n<li><b>Caso límite:</b> el interesado recusa al instructor por amistad íntima con el denunciante. Aquí <b>sí</b> se suspende hasta resolver la recusación.</li>\n</ul>", "noej": "<ul>\n<li><b>No suspende</b> ni siquiera la alegación de <b>nulidad de actuaciones</b>.</li>\n<li><b>No hay</b> más excepciones que la recusación.</li>\n</ul>", "conex": "<ul>\n<li><b>Arts. 23 y 24 de la Ley 40/2015</b> (documento 2): abstención y recusación.</li>\n<li><b>Art. 22 LPAC:</b> supuestos de suspensión del plazo máximo para resolver.</li>\n<li><b>Art. 76.2 LPAC:</b> alegación de defectos de tramitación.</li>\n</ul>", "trampas": "<ul>\n<li>La <b>recusación</b> es la <b>única</b> excepción.</li>\n<li>Ni siquiera la <b>nulidad de actuaciones</b> suspende.</li>\n</ul>", "ancla": "<p><b>«Nada para el expediente, salvo dudar de quien lo lleva.»</b></p>", "vis": "<svg viewBox=\"0 0 640 115\" role=\"img\" aria-label=\"Cuestiones incidentales\">\n<rect x=\"35\" y=\"32\" width=\"270\" height=\"52\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/>\n<text x=\"170\" y=\"54\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">Cuestiones incidentales</text>\n<text x=\"170\" y=\"72\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">incluida la nulidad: NO suspenden</text>\n<rect x=\"345\" y=\"32\" width=\"260\" height=\"52\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/>\n<text x=\"475\" y=\"54\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--exc)\">Recusación</text>\n<text x=\"475\" y=\"72\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">única excepción: SÍ suspende</text>\n</svg>"}]);
</script>
<script>
const PLAZOS=[["10 días", "Subsanación de la solicitud de iniciación", "Interesado", "68.1 LPAC", "Si no, se le tiene por desistido, previa resolución"], ["Hasta 5 días", "Ampliación prudencial del plazo de subsanación", "Interesado", "68.2 LPAC", "NO en selectivos ni en concurrencia competitiva"], ["10 días", "Cumplimiento de trámites por los interesados", "Interesado", "73.1 LPAC", "Desde el día siguiente a la notificación"], ["10 días", "Plazo para completar un acto del interesado que no reúne requisitos", "Interesado", "73.2 LPAC", "En cualquier momento del procedimiento"], ["1 año", "Prescripción del derecho a reclamar responsabilidad patrimonial", "Interesado", "67.1 LPAC", "En daños personales, desde la curación o las secuelas"], ["Día de presentación", "Momento desde el que producen efecto la declaración responsable y la comunicación", "Interesado", "69.3 LPAC", "Sin perjuicio del control posterior"], ["Fecha de subsanación", "Fecha de presentación cuando un sujeto obligado presenta en papel", "Interesado", "68.4 LPAC", "Puede dejar fuera de plazo la solicitud"], ["6 contenidos", "Contenido mínimo de la solicitud", "Interesado", "66.1 LPAC", "Letras a) a f)"], ["Orden de incoación", "Criterio de despacho de los expedientes", "Administración", "71.2 LPAC", "En asuntos de homogénea naturaleza"], ["Recusación", "Única cuestión incidental que suspende la tramitación", "Interesado", "74 LPAC", "Ni la nulidad de actuaciones suspende"]];
const FLASH=[["Cita cuatro contenidos obligatorios de la solicitud", "<b>Nombre</b> del interesado y representante · <b>medio o lugar</b> de notificación · <b>hechos, razones y petición</b> con toda claridad · <b>lugar y fecha</b> · <b>firma</b> · <b>órgano</b> y su código de identificación (art. 66.1)."], ["¿Cuándo son obligatorios los modelos normalizados?", "Cuando la Administración establezca <b>expresamente modelos específicos</b> para un procedimiento concreto (art. 66.6). Los demás son de <b>uso voluntario</b>."], ["¿Cabe una solicitud para varias personas?", "Sí, si las pretensiones tienen contenido y fundamento <b>idéntico o sustancialmente similar</b>, salvo que las normas del procedimiento lo excluyan (art. 66.2)."], ["¿En qué plazo prescribe el derecho a reclamar responsabilidad patrimonial?", "Al <b>año</b> de producido el hecho o de manifestarse su efecto lesivo (art. 67.1)."], ["¿Desde cuándo se cuenta el año en daños físicos o psíquicos?", "Desde la <b>curación</b> o la <b>determinación del alcance de las secuelas</b> (art. 67.1)."], ["¿Y si la indemnización nace de la anulación de un acto o disposición?", "Al <b>año de notificarse</b> la resolución administrativa o la sentencia definitiva (art. 67.1)."], ["¿Qué debe especificar la solicitud de responsabilidad patrimonial?", "Las <b>lesiones producidas</b>, la <b>relación de causalidad</b> con el funcionamiento del servicio público, la <b>evaluación económica</b> si es posible y el <b>momento</b> de la lesión (art. 67.2)."], ["Plazo de subsanación de la solicitud", "<b>Diez días</b>, con advertencia de que si no se subsana se le tendrá por <b>desistido</b>, previa resolución (art. 68.1)."], ["¿Puede ampliarse ese plazo?", "Sí, prudencialmente <b>hasta cinco días</b>, salvo en procedimientos <b>selectivos o de concurrencia competitiva</b> (art. 68.2)."], ["¿Qué ocurre si un sujeto obligado presenta la solicitud en papel?", "Se le requiere para que la subsane por vía electrónica, y la <b>fecha de presentación</b> será la de la <b>subsanación</b> (art. 68.4)."], ["¿Qué es una declaración responsable?", "El documento en que el interesado <b>manifiesta bajo su responsabilidad</b> que cumple los requisitos, que <b>dispone</b> de la documentación acreditativa, que la <b>pondrá a disposición</b> y que <b>mantendrá</b> el cumplimiento (art. 69.1)."], ["¿Desde cuándo permiten actuar la declaración responsable y la comunicación?", "<b>Desde el día de su presentación</b>, sin perjuicio de las facultades de comprobación, control e inspección (art. 69.3)."], ["¿Qué efectos tiene la inexactitud esencial de una declaración responsable?", "<b>Imposibilidad de continuar</b> con el derecho o actividad desde que se constate, posible <b>restitución</b> de la situación previa e <b>imposibilidad de instar</b> un nuevo procedimiento con el mismo objeto durante un tiempo (art. 69.4)."], ["¿Pueden exigirse a la vez declaración responsable y comunicación?", "<b>No</b>: únicamente será exigible una de ellas, sin acumulación (art. 69.6)."], ["¿Qué es el expediente administrativo?", "El <b>conjunto ordenado</b> de documentos y actuaciones que sirven de <b>antecedente y fundamento</b> a la resolución, así como las <b>diligencias encaminadas a ejecutarla</b> (art. 70.1)."], ["¿Qué no forma parte del expediente?", "La información <b>auxiliar o de apoyo</b>: notas, borradores, opiniones, resúmenes, comunicaciones e informes internos y juicios de valor. <b>Salvo</b> los informes preceptivos y facultativos solicitados <b>antes</b> de la resolución (art. 70.4)."], ["¿Cómo se impulsa el procedimiento?", "<b>De oficio</b> en todos sus trámites, por <b>medios electrónicos</b> y con sujeción al principio de <b>celeridad</b> (art. 71.1)."], ["¿Qué orden se guarda en el despacho de expedientes?", "El <b>orden riguroso de incoación</b> en asuntos de <b>homogénea naturaleza</b>, salvo orden motivada en contrario de la que quede constancia (art. 71.2)."], ["¿Qué consecuencia tiene incumplir el orden de despacho?", "<b>Responsabilidad disciplinaria</b> y, en su caso, <b>causa de remoción del puesto de trabajo</b> (art. 71.2)."], ["¿En qué consiste la concentración de trámites?", "Acordar <b>en un solo acto</b> todos los trámites que admitan <b>impulso simultáneo</b> y no deban cumplirse sucesivamente (art. 72.1)."], ["¿En qué plazo deben los interesados cumplimentar los trámites?", "<b>Diez días</b> desde el siguiente al de la notificación, salvo plazo distinto (art. 73.1)."], ["¿Qué salvedad tiene el decaimiento en el derecho al trámite?", "Se admite la actuación del interesado si se produce <b>antes o dentro del día en que se notifique</b> la resolución que tenga por transcurrido el plazo (art. 73.3)."], ["¿Suspenden las cuestiones incidentales el procedimiento?", "<b>No</b>, ni siquiera las referidas a la <b>nulidad de actuaciones</b>. Solo suspende la <b>recusación</b> (art. 74)."]];
const TEST=[{"a": 66, "q": "¿Cuál de estos NO es un contenido exigido a toda solicitud por el art. 66.1?", "o": [["la proposición de los medios de prueba de que intente valerse", 1, "Correcto: no figura entre las letras a) a f). Solo se exige en responsabilidad patrimonial (art. 67.2)."], ["hechos, razones y petición con toda claridad", 0, "Letra c)."], ["lugar y fecha", 0, "Letra d)."], ["órgano al que se dirige y su código de identificación", 0, "Letra f)."]]}, {"a": 66, "q": "Los modelos normalizados de solicitud son:", "o": [["de uso voluntario, salvo los modelos específicos que la Administración establezca expresamente para un procedimiento", 1, "Correcto: arts. 66.4 y 66.6."], ["siempre obligatorios", 0, "La regla general es la voluntariedad."], ["siempre voluntarios", 0, "Los del art. 66.6 son obligatorios."], ["obligatorios solo para las personas jurídicas", 0, "No es el criterio legal."]]}, {"a": 67, "q": "En caso de daños de carácter físico o psíquico, el plazo de un año para reclamar empieza a computarse:", "o": [["desde la curación o la determinación del alcance de las secuelas", 1, "Correcto: art. 67.1."], ["desde el día del hecho lesivo", 0, "Esa es la regla general, no la de daños personales."], ["desde el alta hospitalaria en todo caso", 0, "La ley habla de curación o determinación de secuelas."], ["desde la reclamación previa", 0, "No existe tal trámite."]]}, {"a": 67, "q": "Completa: el derecho a reclamar prescribirá al ______ de producido el hecho o el acto que motive la indemnización.", "gap": "año", "fb": "Al <b>año</b> (art. 67.1), o de manifestarse su efecto lesivo."}, {"a": 68, "q": "El plazo de subsanación de la solicitud puede ampliarse prudencialmente hasta cinco días:", "o": [["siempre que no se trate de procedimientos selectivos o de concurrencia competitiva", 1, "Correcto: art. 68.2."], ["en todo caso, a petición del interesado", 0, "Hay una exclusión expresa."], ["solo en procedimientos sancionadores", 0, "No es el criterio legal."], ["nunca: el plazo es improrrogable", 0, "Sí cabe la ampliación."]]}, {"a": 68, "q": "Si un sujeto obligado a relacionarse electrónicamente presenta su solicitud presencialmente:", "o": [["se le requiere para que la subsane electrónicamente y la fecha de presentación será la de la subsanación", 1, "Correcto: art. 68.4. Es una regla con consecuencias graves en procedimientos con plazo."], ["se le tiene por desistido sin más", 0, "Procede requerimiento de subsanación."], ["se admite con la fecha de la presentación presencial", 0, "La fecha se desplaza a la subsanación."], ["se archiva la solicitud", 0, "No es la consecuencia."]]}, {"a": 68, "q": "Si el interesado no subsana en plazo, se le tiene por desistido sin necesidad de resolución expresa.", "vf": true, "ok": false, "fb": "<b>Falso.</b> El art. 68.1 exige <b>previa resolución</b> dictada en los términos del art. 21."}, {"a": 69, "q": "La declaración responsable y la comunicación permiten iniciar la actividad:", "o": [["desde el día de su presentación, sin perjuicio de las facultades de comprobación, control e inspección", 1, "Correcto: art. 69.3."], ["una vez transcurrido un mes desde su presentación", 0, "No hay tal plazo."], ["solo tras la resolución expresa de la Administración", 0, "Precisamente sustituyen a la autorización previa."], ["desde su publicación en el diario oficial", 0, "No procede publicación."]]}, {"a": 69, "q": "¿Pueden exigirse acumulativamente una declaración responsable y una comunicación para la misma actividad?", "o": [["no: únicamente será exigible una de las dos", 1, "Correcto: art. 69.6."], ["sí, si lo prevé la ordenanza municipal", 0, "La ley lo prohíbe expresamente."], ["sí, en actividades sujetas a control sanitario", 0, "No hay tal excepción en el art. 69.6."], ["sí, siempre que se presenten simultáneamente", 0, "No cabe la acumulación."]]}, {"a": 69, "q": "La inexactitud, falsedad u omisión de carácter esencial en una declaración responsable determina:", "o": [["la imposibilidad de continuar con el ejercicio del derecho o actividad desde que se tenga constancia de tales hechos", 1, "Correcto: art. 69.4, sin perjuicio de responsabilidades penales, civiles o administrativas."], ["la nulidad de pleno derecho de la declaración", 0, "No es el efecto que la ley anuda."], ["únicamente una sanción de multa", 0, "El efecto principal es el cese de la actividad."], ["la suspensión de la actividad durante diez días", 0, "No es lo previsto."]]}, {"a": 70, "q": "¿Qué NO forma parte del expediente administrativo?", "o": [["las notas, borradores, opiniones y comunicaciones internas", 1, "Correcto: art. 70.4, información auxiliar o de apoyo."], ["los informes preceptivos solicitados antes de la resolución", 0, "Sí forman parte: es la excepción del art. 70.4."], ["los informes facultativos solicitados antes de la resolución", 0, "También forman parte."], ["las diligencias encaminadas a ejecutar la resolución", 0, "Forman parte según el art. 70.1."]]}, {"a": 70, "q": "El expediente administrativo debe remitirse:", "o": [["completo, foliado, autentificado y acompañado de un índice también autentificado", 1, "Correcto: art. 70.3, conforme al Esquema Nacional de Interoperabilidad."], ["en soporte papel y con copia compulsada", 0, "El formato es electrónico."], ["únicamente con los documentos favorables al interesado", 0, "Debe remitirse completo."], ["sin índice, para agilizar la remisión", 0, "El índice es obligatorio."]]}, {"a": 71, "q": "En el despacho de los expedientes se guardará:", "o": [["el orden riguroso de incoación en asuntos de homogénea naturaleza, salvo orden motivada en contrario", 1, "Correcto: art. 71.2."], ["el orden que determine el interesado", 0, "No depende del interesado."], ["el orden de mayor a menor cuantía", 0, "No es el criterio legal."], ["ningún orden preestablecido", 0, "La ley lo impone."]]}, {"a": 71, "q": "El incumplimiento del orden de despacho de los expedientes puede dar lugar a:", "o": [["responsabilidad disciplinaria y, en su caso, remoción del puesto de trabajo", 1, "Correcto: art. 71.2."], ["la nulidad de la resolución", 0, "No es la consecuencia prevista."], ["la caducidad del procedimiento", 0, "No es la consecuencia prevista."], ["ninguna consecuencia", 0, "La ley prevé consecuencias expresas."]]}, {"a": 72, "q": "La concentración de trámites supone:", "o": [["acordar en un solo acto todos los trámites que admitan impulso simultáneo", 1, "Correcto: art. 72.1, en aplicación del principio de simplificación administrativa."], ["suprimir los trámites no esenciales", 0, "Eso sería la tramitación simplificada del art. 96."], ["acumular varios procedimientos", 0, "Eso es la acumulación del art. 57."], ["reducir a la mitad los plazos", 0, "Eso sería la tramitación de urgencia del art. 33."]]}, {"a": 73, "q": "Los trámites que deban cumplimentar los interesados se realizarán, salvo norma en contrario, en el plazo de:", "o": [["diez días a partir del siguiente al de la notificación", 1, "Correcto: art. 73.1."], ["quince días desde la notificación", 0, "No es el plazo general."], ["un mes desde la notificación", 0, "No es el plazo general."], ["cinco días hábiles", 0, "No es el plazo general."]]}, {"a": 73, "q": "Transcurrido el plazo sin cumplimentar el trámite, la actuación del interesado:", "o": [["se admitirá y producirá efectos si se produce antes o dentro del día en que se notifique la resolución que tenga por transcurrido el plazo", 1, "Correcto: art. 73.3, la segunda oportunidad de la ley."], ["no producirá efecto alguno en ningún caso", 0, "El art. 73.3 admite esa salvedad."], ["obliga a reiniciar el procedimiento", 0, "No es la consecuencia."], ["produce la caducidad del procedimiento", 0, "El decaimiento afecta solo al trámite."]]}, {"a": 74, "q": "Las cuestiones incidentales que se susciten en el procedimiento:", "o": [["no suspenden su tramitación, salvo la recusación", 1, "Correcto: art. 74, ni siquiera las relativas a la nulidad de actuaciones."], ["suspenden siempre la tramitación", 0, "Justo lo contrario."], ["suspenden la tramitación cuando se refieran a la nulidad de actuaciones", 0, "El art. 74 lo excluye expresamente."], ["deben resolverse antes de continuar, en todo caso", 0, "Solo la recusación suspende."]]}, {"a": 66, "q": "Completa: los interesados podrán exigir el correspondiente recibo que acredite la ______ de presentación.", "gap": "fecha y hora", "fb": "La <b>fecha y hora</b> de presentación (art. 66.3)."}, {"a": 70, "q": "El expediente administrativo comprende también las diligencias encaminadas a ejecutar la resolución.", "vf": true, "ok": true, "fb": "<b>Verdadero.</b> Así lo dispone expresamente el art. 70.1, que no se limita a los antecedentes de la resolución."}];
const CASOS=[{"t": "Caso 1 · La solicitud que llegó mal y tarde", "e": "Una sociedad limitada presenta el <b>último día del plazo</b>, en el registro presencial del ayuntamiento, su solicitud de subvención. La solicitud, además, no acompaña el certificado de estar al corriente con la Seguridad Social. El ayuntamiento la requiere y la empresa presenta todo, ya electrónicamente, <b>ocho días después</b>. <b>Analiza la validez y la fecha de la solicitud.</b>", "s": "<p><b>1) La presentación presencial.</b> Una S.L. es sujeto <b>obligado</b> a relacionarse electrónicamente (art. 14.2.a). Conforme al art. <b>68.4</b>, la Administración debe requerirle para que subsane <b>mediante presentación electrónica</b>, y la <b>fecha de presentación</b> pasa a ser la de la subsanación. Presentando ocho días después del vencimiento, la solicitud queda <b>fuera de plazo</b>.</p><p><b>2) La falta del certificado.</b> Es un defecto subsanable del art. <b>68.1</b>: diez días, con advertencia de que se le tendrá por desistido y con <b>resolución expresa</b> conforme al art. 21. Los ocho días están dentro de ese plazo.</p><p><b>3) ¿Cabe ampliar el plazo?</b> El art. <b>68.2</b> permite ampliarlo hasta cinco días, pero <b>no en procedimientos de concurrencia competitiva</b>. Una convocatoria de subvenciones lo es, así que <b>no cabe</b>.</p><p><b>4) Resultado.</b> Los dos defectos tienen consecuencias distintas: el documental se subsana sin problema; el de la <b>forma de presentación</b> desplaza la fecha y deja la solicitud extemporánea. Procede la <b>inadmisión por presentación fuera de plazo</b>.</p><p><b>La lección:</b> el art. 68.4 no invalida la solicitud, pero <b>mueve su fecha</b>, y en un procedimiento con plazo eso equivale a perderlo.</p>"}, {"t": "Caso 2 · Abrir sin permiso", "e": "Una persona presenta el 3 de abril una <b>declaración responsable</b> para abrir una academia y comienza la actividad ese mismo día. El 20 de mayo, una inspección municipal comprueba que el local <b>carece del certificado de seguridad contra incendios</b> que la declaración afirmaba tener. El ayuntamiento, además, le exige presentar también una comunicación previa. <b>Valora la situación.</b>", "s": "<p><b>1) El inicio de la actividad.</b> Correcto. El art. <b>69.3</b> permite iniciar la actividad <b>desde el día de la presentación</b>, sin perjuicio de las facultades de comprobación, control e inspección. Que la inspección llegue en mayo es la <b>lógica del modelo</b>: control posterior, no previo.</p><p><b>2) La inexactitud.</b> El certificado de seguridad contra incendios es un requisito de <b>carácter esencial</b>. Se aplica el art. <b>69.4</b>: <b>imposibilidad de continuar</b> con la actividad <b>desde que se tenga constancia</b> —el 20 de mayo—, sin perjuicio de las responsabilidades <b>penales, civiles o administrativas</b>.</p><p><b>3) Consecuencias adicionales.</b> La resolución que declare estas circunstancias puede imponer la <b>restitución</b> de la situación jurídica al momento previo al inicio de la actividad y la <b>imposibilidad de instar un nuevo procedimiento</b> con el mismo objeto durante el período que determine la ley sectorial.</p><p><b>4) La exigencia de la comunicación.</b> <b>Improcedente</b>. El art. <b>69.6</b> dispone que únicamente será exigible <b>una</b> de las dos figuras, <b>sin que sea posible la exigencia de ambas acumulativamente</b>.</p><p><b>5) Un matiz.</b> Si la inexactitud <b>no fuera esencial</b> —un error en un dato de contacto—, no procedería el cese: el art. 69.4 exige el carácter esencial.</p>"}, {"t": "Caso 3 · El trámite que llegó tarde y el incidente que no paró nada", "e": "En un expediente de disciplina urbanística se requiere al interesado el <b>28 de abril</b> para que aporte el proyecto visado, con plazo de diez días. El interesado lo aporta el <b>19 de mayo</b>. La resolución que le tiene por decaído en el trámite se le notifica el <b>21 de mayo</b>. Ese mismo día, el interesado alega la <b>nulidad de todas las actuaciones</b> por un defecto en la notificación inicial y pide que se suspenda el expediente. <b>Resuelve.</b>", "s": "<p><b>1) El plazo del trámite.</b> Conforme al art. <b>73.1</b>, diez días desde el <b>día siguiente</b> a la notificación. Notificado el 28 de abril, el plazo venció en torno al 13 de mayo, contando en <b>días hábiles</b> (art. 30.2). La aportación del 19 de mayo es, en principio, <b>extemporánea</b>.</p><p><b>2) La salvedad del art. 73.3.</b> Pero la resolución que le tiene por decaído se notifica el <b>21 de mayo</b>, y la ley admite la actuación del interesado si se produce <b>antes o dentro del día</b> en que se notifique esa resolución. Aportado el 19, la actuación <b>se admite y produce sus efectos legales</b>. No hay decaimiento.</p><p><b>3) La petición de suspensión.</b> <b>Improcedente</b>. El art. <b>74</b> dispone que las cuestiones incidentales, <b>incluso las que se refieran a la nulidad de actuaciones</b>, <b>no suspenderán</b> la tramitación. La única excepción es la <b>recusación</b>.</p><p><b>4) ¿Y la alegación de nulidad?</b> No se ignora: el interesado puede alegar en todo momento los <b>defectos de tramitación</b> (art. 76.2) y la cuestión se resolverá en la resolución final, que debe decidir todas las cuestiones planteadas (art. 88.1).</p><p><b>La lección:</b> plantear un incidente <b>no</b> congela el expediente; y llegar tarde a un trámite no siempre significa haberlo perdido.</p>"}];
const SEMAFORO=["Contenido mínimo de la solicitud — art. 66.1", "Solicitud colectiva y modelos obligatorios — art. 66.2 y 66.6", "Plazo de un año y cómputo en daños personales — art. 67.1", "Contenido de la solicitud de responsabilidad patrimonial — art. 67.2", "Subsanación: diez días y ampliación de cinco — art. 68.1 y 68.2", "Presentación presencial por sujeto obligado — art. 68.4", "Declaración responsable y comunicación — art. 69.1 y 69.2", "Efectos desde el día de la presentación — art. 69.3", "Consecuencias de la inexactitud esencial — art. 69.4", "Prohibición de exigir ambas figuras — art. 69.6", "Concepto y forma del expediente — art. 70.1 y 70.2", "Información auxiliar excluida y sus excepciones — art. 70.4", "Impulso de oficio y orden riguroso de incoación — art. 71", "Concentración de trámites — art. 72", "Diez días y decaimiento con salvedad — art. 73", "Cuestiones incidentales y recusación — art. 74"];
const CALTXT=["Lectura activa + test completo + semáforo. Fija las seis letras del art. 66.1 y el cómputo del año del art. 67.", "Solo flashcards y tabla de plazos: 10 días de subsanación · +5 salvo concurrencia · 10 días de trámites.", "Caso práctico 1 (la solicitud que llegó mal y tarde), cambiando las fechas y comprobando el resultado.", "Explicar en voz alta qué entra y qué no entra en el expediente, y la salvedad del art. 73.3. Casos 2 y 3.", "Test intercalado con el bloque 1 del tema 3 y con el tema 2."];
const INTRO_HTML="<section class=\"card\" id=\"intro\"><h2>Tema 3 · Bloque 2 · Iniciación a solicitud y ordenación</h2><p class=\"small\">Segundo bloque del tema 3: la Sección 3.ª del Capítulo II —cómo se inicia el procedimiento cuando lo pide el ciudadano— y todo el Capítulo III, dedicado a la <b>ordenación</b>, que es la fase que hace avanzar el expediente.</p><div class=\"box ej\"><span class=\"lbl\">La idea que ordena el bloque</span>Dos mundos distintos. Los <b>arts. 66 a 69</b> miran al ciudadano: qué tiene que presentar, qué pasa si lo presenta mal y cuándo puede actuar sin esperar permiso. Los <b>arts. 70 a 74</b> miran a la Administración: cómo se forma el expediente y cómo se hace avanzar sin paradas innecesarias.</div><div class=\"box warn\"><span class=\"lbl\">Fuentes utilizadas y vigencia</span><ul><li><b>Ley 39/2015, de 1 de octubre</b> (documento 1 de la biblioteca), texto consolidado. Arts. 66 a 74.</li><li>Concordancias con la <b>Ley 40/2015</b> (documento 2) en materia de abstención y recusación y de responsabilidad patrimonial, con el <b>RD 203/2021</b> (documento 4) en cuanto al expediente electrónico, y con el <b>art. 30.b) de la Ley 1/2014 de Andalucía</b> (documento 9) sobre los informes preceptivos y la información auxiliar.</li><li><b>Aportación externa</b>: la <b>Ley 7/1985 (LBRL)</b> en materia de intervención administrativa en la actividad de los particulares. Verifica su vigencia en el BOE consolidado.</li></ul></div><svg viewBox=\"0 0 660 195\" role=\"img\" aria-label=\"Mapa conceptual de la iniciación a solicitud y la ordenación\"><rect x=\"215\" y=\"8\" width=\"230\" height=\"32\" rx=\"9\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"330\" y=\"30\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"#fff\">DEL ESCRITO AL EXPEDIENTE</text><line x1=\"330\" y1=\"40\" x2=\"330\" y2=\"56\" stroke=\"var(--acc)\" stroke-width=\"2\"/><line x1=\"165\" y1=\"56\" x2=\"495\" y2=\"56\" stroke=\"var(--acc)\" stroke-width=\"2\"/><line x1=\"165\" y1=\"56\" x2=\"165\" y2=\"72\" stroke=\"var(--acc)\" stroke-width=\"2\"/><line x1=\"495\" y1=\"56\" x2=\"495\" y2=\"72\" stroke=\"var(--acc)\" stroke-width=\"2\"/><rect x=\"25\" y=\"72\" width=\"280\" height=\"108\" rx=\"9\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"165\" y=\"94\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"var(--acc)\">EL CIUDADANO · arts. 66 a 69</text><text x=\"165\" y=\"117\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">66 solicitud · 67 patrimonial</text><text x=\"165\" y=\"139\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">68 subsanación en 10 días</text><text x=\"165\" y=\"161\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">69 declaración responsable</text><rect x=\"355\" y=\"72\" width=\"280\" height=\"108\" rx=\"9\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"495\" y=\"94\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"var(--ej)\">LA ADMINISTRACIÓN · arts. 70 a 74</text><text x=\"495\" y=\"117\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">70 expediente electrónico</text><text x=\"495\" y=\"139\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">71 impulso · 72 concentración</text><text x=\"495\" y=\"161\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">73 trámites · 74 incidentes</text></svg></section>";
const RESUMEN_HTML="<section class=\"card\" id=\"resumen\"><h2>Resumen ejecutivo</h2><p class=\"small\"><b>Norma:</b> Ley 39/2015, arts. 66 a 74.</p><table><tbody><tr><th style=\"width:60px\">66</th><td><b>Seis</b> contenidos: interesado y representante · medio o lugar de notificación · <b>hechos, razones y petición</b> · lugar y fecha · firma · órgano y código. Solicitud <b>colectiva</b> si hay identidad sustancial. Modelos <b>voluntarios</b>, salvo los específicos del <b>66.6</b>.</td></tr><tr><th>67</th><td><b>Un año</b> para reclamar. En daños <b>físicos o psíquicos</b>, desde la <b>curación</b> o las <b>secuelas</b>; por anulación, desde la <b>notificación</b>; por norma inconstitucional o contraria al Derecho de la Unión, desde la <b>publicación</b> de la sentencia.</td></tr><tr><th>68</th><td><b>10 días</b> de subsanación, <b>+5</b> salvo selectivos y concurrencia. Sin subsanar: <b>desistido</b>, previa resolución. Sujeto obligado que presenta en papel: la <b>fecha</b> es la de la subsanación.</td></tr><tr><th>69</th><td>Declaración responsable y comunicación: actuar <b>desde el día de la presentación</b>, con control posterior. Inexactitud <b>esencial</b>: cese, restitución y posible imposibilidad de instar otro procedimiento. <b>Nunca las dos a la vez</b>.</td></tr><tr><th>70</th><td>Expediente <b>electrónico</b>, ordenado y con <b>índice numerado</b>; incluye las <b>diligencias de ejecución</b>. Fuera lo <b>auxiliar</b>, salvo los <b>informes</b> preceptivos y facultativos pedidos antes de resolver.</td></tr><tr><th>71-72</th><td><b>Impulso de oficio</b> con celeridad · <b>orden riguroso de incoación</b> en asuntos homogéneos, con responsabilidad disciplinaria y posible <b>remoción</b> · <b>concentración</b> de trámites simultáneos, consignando el plazo.</td></tr><tr><th>73-74</th><td><b>10 días</b> para los trámites del interesado; el <b>decaimiento</b> cede si actúa <b>antes o el mismo día</b> de notificarse la resolución. Las cuestiones incidentales <b>no suspenden</b>, ni la nulidad de actuaciones: <b>solo la recusación</b>.</td></tr></tbody></table><h2 style=\"margin-top:1.2rem\">Calendario de repaso espaciado</h2><table><thead><tr><th>Momento</th><th>Fecha</th><th>Qué hacer</th></tr></thead><tbody id=\"calbody\"></tbody></table></section>";

<script>

 +panel('','🚫 No-ejemplos: dónde está la frontera','<div class="box exc"><span class="lbl">No-ejemplos</span>'+a.noej+'</div>')
 +panel('','🔗 Conexiones con otros preceptos',a.conex)
 +panel('','⚠️ Trampas y errores frecuentes','<div class="box warn"><span class="lbl">Cuidado</span>'+a.trampas+'</div>')
 +panel('','🧠 Anclaje memorístico',a.ancla)

 +'</section>';
});

html+='<section class="card" id="plazos"><h2>Tabla de plazos y cifras</h2>'
+'<p class="small">Pulsa en las cabeceras para ordenar. Si solo te llevas una cosa de esta sesión, que sea esta tabla.</p>'
+'<table id="tplazos"><thead><tr><th class="sortable">Plazo / cifra</th><th class="sortable">Trámite</th><th class="sortable">Quién</th><th class="sortable">Art.</th><th>Matiz</th></tr></thead><tbody>';
PLAZOS.forEach(function(p){html+='<tr><td><b>'+p[0]+'</b></td><td>'+p[1]+'</td><td>'+p[2]+'</td><td>'+p[3]+'</td><td class="small">'+p[4]+'</td></tr>';});
html+='</tbody></table></section>';

/* ---------- CASOS ---------- */
html+='<section class="card" id="casos"><h2>Casos prácticos</h2><p class="small">Intenta resolverlos <b>antes</b> de abrir la solución: el esfuerzo de recuperar es lo que fija el aprendizaje.</p>';
CASOS.forEach(function(c,i){
 html+='<details class="panel"><summary>'+c.t+'</summary><div class="body"><p>'+c.e+'</p>'
 +'<button class="revelar" data-i="'+i+'">Ver solución</button><div class="sol hide" id="sol'+i+'">'+c.s+'</div></div></details>';
});

/* ---------- FLASHCARDS ---------- */
html+='<section class="card noprint" id="flash"><h2>Flashcards</h2>'
+'<div id="fcbox" style="border:1px solid var(--line);border-radius:12px;padding:1.1rem;min-height:150px;display:flex;flex-direction:column;justify-content:center;text-align:center;cursor:pointer" tabindex="0" role="button" aria-label="Tarjeta: pulsa para girar"></div>'

+'<button id="fcflip">Girar</button><button id="fcok">✔ Lo sabía</button><button id="fcko">↻ Repasar</button><button id="fcreset">Reiniciar</button>'
+'<span class="small" id="fccount"></span></div></section>';

/* ---------- TEST ---------- */
html+='<section class="card noprint" id="test"><h2>Test de autoevaluación</h2>'
+'<p class="small">Preguntas intercaladas de todos los artículos del bloque. Corrección inmediata y explicación de por qué falla cada opción incorrecta.</p>'
+'<div id="testbox"></div>'
+'<div style="display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.8rem"><button id="tcorr">Corregir todo</button><button id="tfail">Repetir solo los fallos</button><button id="treset">Reiniciar test</button></div>'
+'<p id="tscore" class="small" style="margin-top:.6rem"></p></section>';

/* ---------- SEMÁFORO ---------- */
html+='<section class="card" id="semaforo"><h2>Semáforo de autoevaluación</h2>'
+'<p class="small">Marca honestamente cada concepto. Abajo se genera tu lista de repaso.</p><div id="sembox"></div>'
+'<div id="semres" style="margin-top:.8rem"></div></section>';

/* ---------- RESUMEN ---------- */
html+=RESUMEN_HTML;

/* ---------- GLOSARIO ---------- */
html+='<section class="card" id="glosario"><h2>Glosario completo</h2><table><tbody id="glosbody"></tbody></table></section>';

main.innerHTML=html;

 this.setAttribute('aria-expanded',s.classList.contains('collapsed')?'false':'true');
};

/* ---------- GLOSARIO Y TOOLTIPS ---------- */

(function(){var g='';Object.keys(GLOSARIO).forEach(function(k){g+='<tr><th style="width:210px">'+(LABEL[k]||k)+'</th><td>'+GLOSARIO[k]+'</td></tr>';});
 document.getElementById('glosbody').innerHTML=g;})();
var tip=document.getElementById('tip');
function showTip(el){var k=el.getAttribute('data-k');if(!GLOSARIO[k])return;
 tip.innerHTML='<b>'+(LABEL[k]||k)+'</b><br>'+GLOSARIO[k];tip.style.display='block';
 var r=el.getBoundingClientRect();var top=r.bottom+8;var left=Math.min(r.left,window.innerWidth-340);
 if(top+tip.offsetHeight>window.innerHeight)top=Math.max(8,r.top-tip.offsetHeight-8);
 tip.style.top=top+'px';tip.style.left=Math.max(8,left)+'px';}

},{passive:true});

/* ---------- BUSCADOR ---------- */
var q=document.getElementById('q'),timer=null;
function clearMarks(){document.querySelectorAll('mark.hit').forEach(function(m){
 var p=m.parentNode;p.replaceChild(document.createTextNode(m.textContent),m);p.normalize();});}
q.addEventListener('input',function(){
 clearTimeout(timer);timer=setTimeout(function(){
  clearMarks();
  var term=q.value.trim();
  document.querySelectorAll('section.card').forEach(function(s){s.classList.remove('hide');});
  if(term.length<3)return;
  var rx=new RegExp(term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
  document.querySelectorAll('section.card').forEach(function(s){
   var found=false;
   var w=document.createTreeWalker(s,NodeFilter.SHOW_TEXT,null);var nodes=[];
   while(w.nextNode()){var nd=w.currentNode;
    if(nd.parentNode.closest('script,style,mark'))continue;
    if(rx.test(nd.nodeValue)){nodes.push(nd);rx.lastIndex=0;}}
   nodes.forEach(function(nd){
    found=true;
    var span=document.createElement('span');
    span.innerHTML=nd.nodeValue.replace(rx,function(m){return '<mark class="hit">'+m+'</mark>';});
    nd.parentNode.replaceChild(span,nd);});
   if(found){s.querySelectorAll('details.panel').forEach(function(d){if(d.querySelector('mark.hit'))d.open=true;});}
   s.classList.toggle('hide',!found);
  });
 },220);});

/* ---------- TABLA ORDENABLE ---------- */
(function(){var t=document.getElementById('tplazos');var dir={};
 t.querySelectorAll('th.sortable').forEach(function(th,i){
  th.onclick=function(){

(function(){
"use strict";
var K_THEME="oposi_bII_theme", K_FS="oposi_bII_fs", K_STREAK="oposi_bII_streak";
function load(k,f){try{var v=localStorage.getItem(k);return v?JSON.parse(v):f;}catch(e){return f;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

/* Tema persistente (sobrescribe el toggle simple anterior) */

else if(window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches){root.setAttribute("data-theme","dark");}

if(bp)bp.onclick=function(){setFs(fs+1);};
if(bm)bm.onclick=function(){setFs(fs-1);};

(function(){

  var s=load(K_STREAK,{last:null,n:0});

    var ayer=new Date(Date.now()-864e5).toISOString().slice(0,10);
    s.n=(s.last===ayer)?s.n+1:1;s.last=hoy;save(K_STREAK,s);
  }

/* Reveal on scroll para las tarjetas */
function reveal(){
  var els=document.querySelectorAll("section.card:not(.rv)");
  if(!els.length)return;
  if(!("IntersectionObserver" in window)){return;}
  var io=new IntersectionObserver(function(es){
    es.forEach(function(en){if(en.isIntersecting){en.target.classList.add("in");io.unobserve(en.target);}});
  },{threshold:.06,rootMargin:"0px 0px -30px 0px"});
  Array.prototype.forEach.call(els,function(el){el.classList.add("rv");io.observe(el);});
}

/* Sección activa en el índice lateral */
function spy(){
  var links=document.querySelectorAll("nav.side a[href^='#']");
  if(!links.length||!("IntersectionObserver" in window))return;
  var map={};
  Array.prototype.forEach.call(links,function(a){
    var t=document.getElementById(a.getAttribute("href").slice(1));
    if(t)map[t.id]=a;
  });
  var io=new IntersectionObserver(function(es){
    es.forEach(function(en){
      if(en.isIntersecting){
        Array.prototype.forEach.call(links,function(a){a.classList.remove("on");});
        if(map[en.target.id])map[en.target.id].classList.add("on");
      }
    });
  },{rootMargin:"-80px 0px -70% 0px",threshold:0});
  Object.keys(map).forEach(function(id){io.observe(document.getElementById(id));});
}

/* Ripple en botones */
document.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b||b.classList.contains("navtoggle"))return;
  var r=b.getBoundingClientRect(),d=Math.max(r.width,r.height),s=document.createElement("span");
  s.className="ripple";s.style.width=s.style.height=d+"px";
  s.style.left=(e.clientX-r.left-d/2)+"px";s.style.top=(e.clientY-r.top-d/2)+"px";
  b.appendChild(s);setTimeout(function(){if(s.parentNode)s.parentNode.removeChild(s);},560);
});

document.addEventListener("keydown",function(e){

else{setTimeout(init,60);}
addEventListener("load",function(){setTimeout(init,80);});
})();

<script>


/* ═══ Parser de respuestas: estructura semántica ═══ */
var FCFMT=(function(){
  var CITA=/\s*\(((?:arts?\.|DA\b|DT\b|disp\.)[^)]*)\)\s*\.?\s*$/i;
  var strip=function(h){return h.replace(/<[^>]+>/g,"");};

  function esc(s){return s;}

  function parse(raw){
    var out={verdict:null,cite:null,kind:"p",items:[],text:""};
    var body=String(raw).trim();

    /* 1 ── Cita legal al final */
    var m=body.match(CITA);
    if(m){out.cite=m[1].replace(/\s+/g," ").trim();body=body.slice(0,m.index).trim();}
    body=body.replace(/[.;,\s]+$/,"");

    /* 2 ── Veredicto Sí / No inicial */
    var v=strip(body).match(/^(Sí|Sí,|No|No,)[.:,]?\s/);
    if(v){
      out.verdict=/^Sí/.test(v[1])?"si":"no";
      body=body.replace(/^(<[^>]+>\s*)*(Sí|No)[.,:]?\s*/,"").trim();
      body=body.replace(/^en\s/,"En ");
    }

    /* 3 ── Enumeración con · */
    var parts=body.split(/\s+·\s+/);
    if(parts.length>=2){
      out.kind="list";
      var letras=parts.filter(function(p){return /^\s*<?[a-h]\)/.test(strip(p));}).length;
      out.marker = letras>=parts.length-1 ? "alpha" : "num";
      out.items=parts.map(function(p){
        return p.replace(/^\s*[a-h]\)\s*/,"").replace(/[.\s]+$/,"").trim();
      }).filter(Boolean);
      return out;
    }

    /* 4 ── Cláusulas contrapuestas con ; */
    var semi=body.split(/;\s+/);
    if(semi.length>=2&&semi.length<=3&&semi.every(function(s){return strip(s).length>14;})){
      out.kind="clauses";
      out.items=semi.map(function(s){return s.replace(/[.\s]+$/,"").trim();});
      return out;
    }

    /* 5 ── Párrafo */
    out.text=body;
    return out;
  }

  function render(raw){
    var d=parse(raw),h="";

    if(d.verdict){
      h+='<span class="fc-verdict '+d.verdict+'">'+(d.verdict==="si"?"✓ Sí":"✗ No")+'</span>';
    }

    if(d.kind==="list"){
      h+='<ol class="fc-list '+d.marker+'">';
      d.items.forEach(function(it){h+='<li>'+it+'</li>';});
      h+='</ol>';
    }else if(d.kind==="clauses"){
      h+='<div class="fc-clauses">';
      d.items.forEach(function(it){h+='<p>'+it+'</p>';});
      h+='</div>';
    }else if(d.text){
      h+='<p class="fc-p">'+d.text+'</p>';
    }

    if(d.cite){
      h+='<span class="fc-cite"><span class="s">§</span>'+d.cite+'</span>';
    }
    return {html:h,struct:(d.kind!=="p"||!!d.verdict||strip(raw).length>150)};
  }
  return {parse:parse,render:render};
})();

    if(busy||!order.length)return;

const GLOSARIO={"interesado": "Interesado: quien está legitimado para promover un procedimiento o intervenir en él porque es titular de derechos o intereses legítimos afectados por la decisión (art. 4 de la Ley 39/2015).", "conten": "Recurso contencioso-administrativo: impugnación ante los juzgados y tribunales de lo contencioso-administrativo, es decir, ya fuera de la propia Administración.", "silencio": "Silencio administrativo: efecto que la ley anuda a la falta de resolución expresa en plazo. Puede ser estimatorio (positivo) o desestimatorio (negativo) según el procedimiento.", "habil": "Días hábiles: se excluyen del cómputo los sábados, los domingos y los declarados festivos (art. 30.2 de la Ley 39/2015).", "pleno": "Pleno: órgano colegiado formado por todos los concejales o diputados de la entidad local.", "instruccion": "Instrucción: fase del procedimiento destinada a determinar, conocer y comprobar los hechos sobre los que debe pronunciarse la resolución.", "contradiccion": "Principio de contradicción: derecho de cada interesado a conocer y rebatir lo alegado y probado por los demás y por la Administración.", "alegaciones": "Alegaciones: manifestaciones de los interesados sobre los hechos y el Derecho aplicable, que deben ser tenidas en cuenta al redactar la propuesta de resolución.", "periodoprueba": "Período de prueba: fase abierta por el instructor, de diez a treinta días, para practicar las pruebas pertinentes cuando los hechos no se tengan por ciertos.", "extraordinario": "Período extraordinario de prueba: plazo adicional no superior a diez días que el instructor puede abrir a petición de los interesados.", "presuncionveracidad": "Presunción de veracidad de las actas: los documentos formalizados por funcionarios con condición de autoridad hacen prueba de los hechos constatados, salvo que se acredite lo contrario.", "preceptivo": "Informe preceptivo: aquel cuya solicitud viene impuesta por una norma. Su falta puede suspender el plazo para resolver.", "vinculante": "Informe vinculante: aquel cuyo contenido obliga al órgano que resuelve. Es excepcional: la regla es que los informes no vinculen.", "audiencia": "Trámite de audiencia: puesta de manifiesto del expediente a los interesados inmediatamente antes de redactar la propuesta de resolución.", "infopublica": "Información pública: apertura del expediente a cualquier persona, mediante anuncio en el diario oficial, para que pueda examinarlo y formular alegaciones.", "propuesta": "Propuesta de resolución: documento del instructor que fija los hechos probados, su calificación y la decisión que propone al órgano competente para resolver.", "asesoramiento": "Informe del órgano competente para el asesoramiento jurídico: informe jurídico que, cuando forma parte del procedimiento, se solicita después de la audiencia.", "onusprobandi": "Inversión de la carga de la prueba en discriminación: alegada la discriminación con indicios fundados, corresponde a quien se imputa aportar una justificación objetiva y razonable."};
const LABELS={"interesado": "Interesado", "conten": "Recurso contencioso-administrativo", "silencio": "Silencio administrativo", "habil": "Días hábiles", "pleno": "Pleno", "instruccion": "Instrucción", "contradiccion": "Contradicción", "alegaciones": "Alegaciones", "periodoprueba": "Período de prueba", "extraordinario": "Período extraordinario", "presuncionveracidad": "Presunción de veracidad", "preceptivo": "Informe preceptivo", "vinculante": "Informe vinculante", "audiencia": "Trámite de audiencia", "infopublica": "Información pública", "propuesta": "Propuesta de resolución", "asesoramiento": "Asesoramiento jurídico", "onusprobandi": "Carga de la prueba en discriminación"};
</script>
<script>
const ARTS=[{"n": 75, "t": "Actos de instrucción", "ubic": "Título IV ▸ Capítulo IV (Instrucción del procedimiento) ▸ Sección 1.ª (Disposiciones generales)", "idea": "Instrucción de oficio y electrónica, con contradicción e igualdad.", "literal": "<p>1. Los actos de instrucción necesarios para la determinación, conocimiento y comprobación de los hechos en virtud de los cuales deba pronunciarse la resolución, se realizarán de oficio y a través de medios electrónicos, por el órgano que tramite el procedimiento, sin perjuicio del derecho de los interesados a proponer aquellas actuaciones que requieran su intervención o constituyan trámites legal o reglamentariamente establecidos.</p><p>2. Las aplicaciones y sistemas de información utilizados para la instrucción de los procedimientos deberán garantizar el control de los tiempos y plazos, la identificación de los órganos responsables y la tramitación ordenada de los expedientes, así como facilitar la simplificación y la publicidad de los procedimientos.</p><p>3. Los actos de instrucción que requieran la intervención de los interesados habrán de practicarse en la forma que resulte más conveniente para ellos y sea compatible, en la medida de lo posible, con sus obligaciones laborales o profesionales.</p><p>4. En cualquier caso, el órgano instructor adoptará las medidas necesarias para lograr el pleno respeto a los principios de contradicción y de igualdad de los interesados en el procedimiento.</p>", "dis": "<ul>\n<li><b>75.1 — regla:</b> los actos de <span class=\"t\" data-k=\"instruccion\">instrucción</span> necesarios para la <b>determinación, conocimiento y comprobación de los hechos</b> se realizarán <b>de oficio</b> y por <b>medios electrónicos</b>, por el órgano que tramite el procedimiento, sin perjuicio del <b>derecho de los interesados a proponer</b> actuaciones que requieran su intervención o constituyan trámites establecidos.</li>\n<li><b>75.2 — sistemas:</b> las aplicaciones deben garantizar el <b>control de tiempos y plazos</b>, la <b>identificación de los órganos responsables</b> y la <b>tramitación ordenada</b>.</li>\n<li><b>75.3 — comodidad del interesado:</b> los actos que requieran su intervención se practicarán <b>en la forma más conveniente para ellos</b> y compatible, en la medida de lo posible, con sus <b>obligaciones laborales o profesionales</b>.</li>\n<li><b>75.4 — principios:</b> el instructor adoptará las medidas necesarias para el <b>pleno respeto a los principios de <span class=\"t\" data-k=\"contradiccion\">contradicción</span> y de igualdad</b> de los interesados.</li>\n</ul>", "llano": "<p>Instruir es averiguar qué pasó. Lo hace la Administración por su cuenta, sin esperar a que se lo pidan, pero el interesado puede proponer actuaciones. Y hay dos exigencias que valen oro en un recurso: los trámites deben acomodarse a la vida laboral del interesado y todos deben poder rebatir lo del otro en igualdad.</p>", "porque": "<p>La instrucción es donde se construye la base fáctica de la decisión. Si esa base se construye <b>sin contradicción</b>, la resolución será formalmente correcta pero materialmente ciega. Por eso el art. 75.4 no es retórico: es el fundamento para alegar <b>indefensión</b> (art. 48.2) cuando a un interesado se le hurta la posibilidad de rebatir.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> una comprobación que se cita fuera del horario de trabajo para que puedas asistir.</li>\n<li><b>Real:</b> una inspección de una actividad se convoca en horario compatible con la apertura del establecimiento (art. 75.3).</li>\n<li><b>Caso límite:</b> en un expediente con dos interesados enfrentados, se admite la prueba de uno sin dar traslado al otro. Vulnera el art. 75.4 y puede producir <b>indefensión</b>.</li>\n</ul>", "noej": "<ul>\n<li><b>No depende</b> la instrucción de que el interesado la impulse: es de oficio.</li>\n<li><b>No excluye</b> el impulso de oficio el <b>derecho a proponer</b> actuaciones.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 71 LPAC:</b> impulso de oficio y celeridad.</li>\n<li><b>Art. 77 LPAC:</b> medios y período de prueba.</li>\n<li><b>Art. 48.2 LPAC:</b> indefensión como causa de anulabilidad.</li>\n</ul>", "trampas": "<ul>\n<li>Instrucción <b>de oficio</b> y por <b>medios electrónicos</b>.</li>\n<li>Los interesados <b>proponen</b>, no instruyen.</li>\n<li>Los principios expresamente citados son <b>contradicción</b> e <b>igualdad</b>.</li>\n</ul>", "ancla": "<p><b>«Averiguo yo, pero tú propones, y os oigo a todos por igual.»</b></p>", "vis": "<svg viewBox=\"0 0 640 125\" role=\"img\" aria-label=\"Actos de instrucción\">\n<g font-size=\"10\" text-anchor=\"middle\" fill=\"currentColor\">\n<rect x=\"25\" y=\"30\" width=\"175\" height=\"60\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"112\" y=\"52\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">De oficio</text><text x=\"112\" y=\"70\">y por medios electrónicos</text><text x=\"112\" y=\"84\">los interesados proponen</text>\n<rect x=\"232\" y=\"30\" width=\"175\" height=\"60\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"319\" y=\"52\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">Conveniencia</text><text x=\"319\" y=\"70\">forma más cómoda para</text><text x=\"319\" y=\"84\">el interesado y su trabajo</text>\n<rect x=\"439\" y=\"30\" width=\"176\" height=\"60\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"527\" y=\"52\" font-size=\"11\" font-weight=\"700\" fill=\"var(--warn)\">Garantías</text><text x=\"527\" y=\"70\">contradicción</text><text x=\"527\" y=\"84\">e igualdad</text>\n</g>\n<text x=\"320\" y=\"115\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--ink2)\">Los sistemas deben garantizar el control de tiempos y plazos y la identificación de responsables</text>\n</svg>"}, {"n": 76, "t": "Alegaciones", "ubic": "Título IV ▸ Capítulo IV (Instrucción del procedimiento) ▸ Sección 1.ª (Disposiciones generales)", "idea": "Alegar y aportar hasta la audiencia; y denunciar defectos en todo momento.", "literal": "<p>1. Los interesados podrán, en cualquier momento del procedimiento anterior al trámite de audiencia, aducir alegaciones y aportar documentos u otros elementos de juicio. Unos y otros serán tenidos en cuenta por el órgano competente al redactar la correspondiente propuesta de resolución.</p><p>2. En todo momento podrán los interesados alegar los defectos de tramitación y, en especial, los que supongan paralización, infracción de los plazos preceptivamente señalados o la omisión de trámites que pueden ser subsanados antes de la resolución definitiva del asunto. Dichas alegaciones podrán dar lugar, si hubiere razones para ello, a la exigencia de la correspondiente responsabilidad disciplinaria.</p>", "dis": "<ul>\n<li><b>76.1 — alegaciones y documentos:</b> los interesados podrán, <b>en cualquier momento del procedimiento anterior al trámite de audiencia</b>, aducir <span class=\"t\" data-k=\"alegaciones\">alegaciones</span> y aportar documentos u otros elementos de juicio. Unos y otros <b>serán tenidos en cuenta</b> por el órgano competente al redactar la <b>propuesta de resolución</b>.</li>\n<li><b>76.2 — defectos de tramitación:</b> <b>en todo momento</b> podrán alegar los <b>defectos de tramitación</b>, en especial los que supongan <b>paralización</b>, <b>infracción de los plazos preceptivos</b> o la <b>omisión de trámites</b> que puedan subsanarse antes de la resolución definitiva. Esas alegaciones podrán dar lugar, si hay razón para ello, a la <b>exigencia de responsabilidad disciplinaria</b>.</li>\n</ul>\n<div class=\"box ej\"><span class=\"lbl\">Dos plazos distintos en un mismo artículo</span>Para <b>alegar sobre el fondo</b>: hasta el trámite de audiencia. Para <b>denunciar defectos de tramitación</b>: <b>en todo momento</b>, sin límite.</div>", "llano": "<p>Puedes decir lo que quieras sobre el asunto hasta que llegue la audiencia, y lo que digas hay que tenerlo en cuenta al redactar la propuesta. Y si el expediente está parado o se salta trámites, eso puedes denunciarlo cuando quieras: incluso puede acabar en responsabilidad disciplinaria.</p>", "porque": "<p>Separar ambos plazos tiene sentido: los <b>defectos de tramitación</b> no son parte del debate sobre el fondo, sino sobre el <b>cauce</b>, y denunciarlos tarde no perjudica a nadie —al contrario, permite corregirlos a tiempo—. La mención a la <b>responsabilidad disciplinaria</b> convierte la queja del ciudadano en un instrumento real de control interno.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> aportar una prueba antes de que se cierre la investigación y quejarse en cualquier momento de que nadie la tramita.</li>\n<li><b>Real:</b> el interesado aporta un informe pericial dos días antes de la audiencia: debe ser <b>tenido en cuenta</b> en la propuesta de resolución (art. 76.1).</li>\n<li><b>Caso límite:</b> el expediente lleva cinco meses parado. Cabe alegarlo <b>en todo momento</b> por la vía del art. 76.2, con posible responsabilidad disciplinaria.</li>\n</ul>", "noej": "<ul>\n<li><b>No hay</b> obligación de tener en cuenta las alegaciones sobre el fondo presentadas <b>después</b> de la audiencia.</li>\n<li><b>No caduca</b> la posibilidad de denunciar defectos de tramitación.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 53.1.e) LPAC:</b> derecho a alegar y aportar documentos.</li>\n<li><b>Art. 82 LPAC:</b> trámite de audiencia, que marca el límite del art. 76.1.</li>\n<li><b>Arts. 20 y 21 LPAC:</b> responsabilidad por la tramitación y obligación de resolver.</li>\n</ul>", "trampas": "<ul>\n<li>Fondo: <b>hasta la audiencia</b>. Defectos de tramitación: <b>en todo momento</b>.</li>\n<li>Las alegaciones deben tenerse en cuenta al redactar la <b>propuesta de resolución</b>, no solo la resolución.</li>\n<li>Los defectos denunciados pueden generar <b>responsabilidad disciplinaria</b>.</li>\n</ul>", "ancla": "<p><b>«Del fondo, hasta la audiencia; de la forma, siempre.»</b></p>", "vis": "<svg viewBox=\"0 0 660 125\" role=\"img\" aria-label=\"Alegaciones de los interesados\">\n<line x1=\"40\" y1=\"60\" x2=\"620\" y2=\"60\" stroke=\"var(--line)\" stroke-width=\"3\"/>\n<circle cx=\"80\" cy=\"60\" r=\"7\" fill=\"var(--acc)\"/><text x=\"80\" y=\"44\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--acc)\">inicio</text>\n<circle cx=\"440\" cy=\"60\" r=\"7\" fill=\"var(--warn)\"/><text x=\"440\" y=\"44\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--warn)\">audiencia</text>\n<circle cx=\"600\" cy=\"60\" r=\"7\" fill=\"var(--exc)\"/><text x=\"600\" y=\"44\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--exc)\">resolución</text>\n<rect x=\"85\" y=\"72\" width=\"350\" height=\"22\" rx=\"6\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/>\n<text x=\"260\" y=\"88\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--acc)\">76.1 · alegaciones y documentos sobre el fondo</text>\n<rect x=\"85\" y=\"98\" width=\"515\" height=\"22\" rx=\"6\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/>\n<text x=\"342\" y=\"114\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--ej)\">76.2 · defectos de tramitación: EN TODO MOMENTO</text>\n</svg>"}, {"n": 77, "t": "Medios y período de prueba", "ubic": "Título IV ▸ Capítulo IV ▸ Sección 2.ª (Prueba)", "idea": "Prueba libre; período de diez a treinta días y actas con presunción de veracidad.", "literal": "<p>1. Los hechos relevantes para la decisión de un procedimiento podrán acreditarse por cualquier medio de prueba admisible en Derecho, cuya valoración se realizará de acuerdo con los criterios establecidos en la Ley 1/2000, de 7 de enero, de Enjuiciamiento Civil.</p><p>2. Cuando la Administración no tenga por ciertos los hechos alegados por los interesados o la naturaleza del procedimiento lo exija, el instructor del mismo acordará la apertura de un período de prueba por un plazo no superior a treinta días ni inferior a diez, a fin de que puedan practicarse cuantas juzgue pertinentes. Asimismo, cuando lo considere necesario, el instructor, a petición de los interesados, podrá decidir la apertura de un período extraordinario de prueba por un plazo no superior a diez días.</p><p>3. El instructor del procedimiento sólo podrá rechazar las pruebas propuestas por los interesados cuando sean manifiestamente improcedentes o innecesarias, mediante resolución motivada. 3 bis. Cuando el interesado alegue discriminación y aporte indicios fundados sobre su existencia, corresponderá a la persona a quien se impute la situación discriminatoria la aportación de una justificación objetiva y razonable, suficientemente probada, de las medidas adoptadas y de su proporcionalidad. A los efectos de lo dispuesto en el párrafo anterior, el órgano administrativo podrá recabar informe de los organismos públicos competentes en materia de igualdad.</p><p>4. En los procedimientos de carácter sancionador, los hechos declarados probados por resoluciones judiciales penales firmes vincularán a las Administraciones Públicas respecto de los procedimientos sancionadores que substancien.</p><p>5. Los documentos formalizados por los funcionarios a los que se reconoce la condición de autoridad y en los que, observándose los requisitos legales correspondientes se recojan los hechos constatados por aquéllos harán prueba de éstos salvo que se acredite lo contrario.</p><p>6. Cuando la prueba consista en la emisión de un informe de un órgano administrativo, organismo público o Entidad de derecho público, se entenderá que éste tiene carácter preceptivo.</p><p>7. Cuando la valoración de las pruebas practicadas pueda constituir el fundamento básico de la decisión que se adopte en el procedimiento, por ser pieza imprescindible para la correcta evaluación de los hechos, deberá incluirse en la propuesta de resolución.</p>", "dis": "<ul>\n<li><b>77.1 — libertad de medios:</b> los hechos relevantes pueden acreditarse por <b>cualquier medio de prueba admisible en Derecho</b>, valorándose conforme a los criterios de la <b>Ley 1/2000, de Enjuiciamiento Civil</b>.</li>\n<li><b>77.2 — <span class=\"t\" data-k=\"periodoprueba\">período de prueba</span>:</b> cuando la Administración <b>no tenga por ciertos</b> los hechos alegados o la naturaleza del procedimiento lo exija, el instructor acordará su apertura por un plazo <b>no superior a treinta días ni inferior a diez</b>. A <b>petición de los interesados</b> puede abrirse un <span class=\"t\" data-k=\"extraordinario\">período extraordinario</span> <b>no superior a diez días</b>.</li>\n<li><b>77.3 — rechazo de pruebas:</b> el instructor <b>solo</b> podrá rechazarlas cuando sean <b>manifiestamente improcedentes o innecesarias</b>, <b>mediante resolución motivada</b>.</li>\n<li><b>77.3 bis — <span class=\"t\" data-k=\"onusprobandi\">discriminación</span>:</b> alegada la discriminación con <b>indicios fundados</b>, corresponde a quien se imputa la situación aportar una <b>justificación objetiva y razonable, suficientemente probada</b>, de las medidas y de su proporcionalidad. Cabe recabar informe de los organismos competentes en materia de igualdad.</li>\n<li><b>77.4 — hechos probados penales:</b> en procedimientos sancionadores, los <b>hechos declarados probados por resoluciones judiciales penales firmes vinculan</b> a las Administraciones.</li>\n<li><b>77.5 — <span class=\"t\" data-k=\"presuncionveracidad\">valor de las actas</span>:</b> los documentos formalizados por funcionarios con <b>condición de autoridad</b>, con los requisitos legales, <b>harán prueba</b> de los hechos constatados, <b>salvo que se acredite lo contrario</b>.</li>\n<li><b>77.6 — informe como prueba:</b> cuando la prueba consista en un informe de un órgano administrativo, se entenderá que tiene carácter <b>preceptivo</b>.</li>\n<li><b>77.7 — valoración en la propuesta:</b> si la valoración de las pruebas puede constituir el <b>fundamento básico</b> de la decisión, deberá <b>incluirse en la propuesta de resolución</b>.</li>\n</ul>", "llano": "<p>Vale cualquier prueba admitida en Derecho. Si los hechos no están claros, se abre un período de entre diez y treinta días, y a petición del interesado puede haber diez más. Solo se pueden rechazar pruebas manifiestamente improcedentes o innecesarias, y siempre por escrito motivado. Las actas de los agentes hacen prueba, pero admiten prueba en contra.</p>", "porque": "<p>La presunción de veracidad de las actas resuelve un problema práctico: sin ella, cada denuncia de un agente exigiría reconstruir el hecho con testigos. Pero es <b>iuris tantum</b>: admite prueba en contrario, porque una presunción absoluta convertiría al agente en juez.</p>\n<p>La restricción del art. 77.3 protege el <b>derecho a la prueba</b>: rechazarla es la vía más fácil de vaciar la defensa, y por eso la ley exige que el rechazo sea <b>manifiesto</b> y <b>motivado</b>. Recuerda que el art. 35.1.f) lo incluye entre los actos que deben motivarse.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> un parte de la policía que se da por cierto salvo que demuestres lo contrario.</li>\n<li><b>Real:</b> en un expediente por vertidos se abre período de prueba de <b>veinte días</b> para practicar un análisis; el interesado pide diez más y el instructor abre el <b>período extraordinario</b>.</li>\n<li><b>Caso límite:</b> el instructor rechaza una pericial diciendo solo «no procede». Es un <b>rechazo inmotivado</b>: infringe los arts. 77.3 y 35.1.f).</li>\n</ul>", "noej": "<ul>\n<li><b>No cabe</b> rechazar una prueba por ser <b>costosa</b> o incómoda: solo por manifiestamente improcedente o innecesaria.</li>\n<li><b>No es</b> absoluta la presunción de veracidad de las actas.</li>\n<li><b>No puede</b> el período ordinario ser inferior a <b>diez</b> ni superior a <b>treinta</b> días.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 35.1.f) LPAC:</b> motivación del rechazo de pruebas.</li>\n<li><b>Art. 78 LPAC:</b> práctica de la prueba.</li>\n<li><b>Art. 53.2.b) LPAC:</b> presunción de no existencia de responsabilidad, que convive con el art. 77.5.</li>\n<li><b>Ley 1/2000 de Enjuiciamiento Civil</b> <i>(norma externa a la biblioteca)</i>: criterios de valoración.</li>\n</ul>", "trampas": "<ul>\n<li><b>De diez a treinta días</b> el ordinario; <b>hasta diez</b> el extraordinario, y este solo <b>a petición de los interesados</b>.</li>\n<li>El rechazo exige que la prueba sea <b>manifiestamente</b> improcedente o innecesaria <b>y</b> resolución <b>motivada</b>.</li>\n<li>El informe pedido como prueba se entiende <b>preceptivo</b>.</li>\n</ul>", "ancla": "<p><b>«10 a 30, más 10 si lo pides.»</b> Y el acta vale <b>salvo que demuestres lo contrario</b>.</p>", "vis": "<svg viewBox=\"0 0 660 145\" role=\"img\" aria-label=\"Medios y período de prueba\">\n<g font-size=\"10\" text-anchor=\"middle\" fill=\"currentColor\">\n<rect x=\"20\" y=\"30\" width=\"195\" height=\"62\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"117\" y=\"54\" font-size=\"13\" font-weight=\"700\" fill=\"var(--acc)\">10 a 30 días</text><text x=\"117\" y=\"74\">período ordinario</text><text x=\"117\" y=\"88\">lo acuerda el instructor</text>\n<rect x=\"230\" y=\"30\" width=\"195\" height=\"62\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"327\" y=\"54\" font-size=\"13\" font-weight=\"700\" fill=\"var(--ej)\">+10 días</text><text x=\"327\" y=\"74\">período extraordinario</text><text x=\"327\" y=\"88\">a petición de los interesados</text>\n<rect x=\"440\" y=\"30\" width=\"200\" height=\"62\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"540\" y=\"54\" font-size=\"11\" font-weight=\"700\" fill=\"var(--warn)\">Rechazo de pruebas</text><text x=\"540\" y=\"74\">manifiestamente improcedentes</text><text x=\"540\" y=\"88\">o innecesarias, y motivado</text>\n</g>\n<text x=\"330\" y=\"128\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--exc)\">Las actas de funcionarios con condición de autoridad hacen prueba salvo que se acredite lo contrario</text>\n</svg>"}, {"n": 78, "t": "Práctica de prueba", "ubic": "Título IV ▸ Capítulo IV ▸ Sección 2.ª (Prueba)", "idea": "Aviso con antelación, lugar, fecha y hora, y posible anticipo de gastos.", "literal": "<p>1. La Administración comunicará a los interesados, con antelación suficiente, el inicio de las actuaciones necesarias para la realización de las pruebas que hayan sido admitidas.</p><p>2. En la notificación se consignará el lugar, fecha y hora en que se practicará la prueba, con la advertencia, en su caso, de que el interesado puede nombrar técnicos para que le asistan.</p><p>3. En los casos en que, a petición del interesado, deban efectuarse pruebas cuya realización implique gastos que no deba soportar la Administración, ésta podrá exigir el anticipo de los mismos, a reserva de la liquidación definitiva, una vez practicada la prueba. La liquidación de los gastos se practicará uniendo los comprobantes que acrediten la realidad y cuantía de los mismos.</p>", "dis": "<ul>\n<li><b>78.1 — comunicación:</b> la Administración comunicará a los interesados, <b>con antelación suficiente</b>, el inicio de las actuaciones necesarias para la realización de las <b>pruebas admitidas</b>.</li>\n<li><b>78.2 — contenido:</b> se consignará <b>lugar, fecha y hora</b> de la práctica, con la advertencia, en su caso, de que el interesado puede <b>nombrar técnicos</b> que le asistan.</li>\n<li><b>78.3 — gastos:</b> si a petición del interesado deben practicarse pruebas cuyos gastos <b>no deba soportar la Administración</b>, esta podrá exigir su <b>anticipo</b>, a reserva de la <b>liquidación definitiva</b> una vez practicada la prueba.</li>\n</ul>", "llano": "<p>Si se va a practicar una prueba, tienen que avisarte con tiempo, decirte dónde, cuándo y a qué hora, y advertirte de que puedes ir con un técnico de tu confianza. Si la prueba la has pedido tú y cuesta dinero que no le toca pagar a la Administración, pueden pedirte un anticipo.</p>", "porque": "<p>La prueba practicada sin conocimiento del interesado es una prueba sin <b>contradicción</b>: podría alterarse o interpretarse sin control. El aviso previo y la posibilidad de asistir con <b>técnico propio</b> son las dos garantías que convierten la prueba en verdaderamente contradictoria.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> una peritación a la que puedes asistir con tu propio perito.</li>\n<li><b>Real:</b> en un expediente por ruidos se comunica la medición sonométrica con lugar, fecha y hora, advirtiendo de que el titular puede asistir con un técnico acústico.</li>\n<li><b>Caso límite:</b> el interesado pide una pericial costosa que no corresponde asumir al ayuntamiento. Cabe exigir el <b>anticipo</b>, con liquidación definitiva posterior (art. 78.3).</li>\n</ul>", "noej": "<ul>\n<li><b>No cabe</b> practicar la prueba sin comunicación previa con <b>antelación suficiente</b>.</li>\n<li><b>No puede</b> exigirse anticipo de gastos que <b>deba soportar la Administración</b>.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 77 LPAC:</b> medios y período de prueba.</li>\n<li><b>Art. 75.3 y 75.4 LPAC:</b> conveniencia para el interesado y contradicción.</li>\n<li><b>Art. 53.1.g) LPAC:</b> derecho a actuar asistido de asesor.</li>\n</ul>", "trampas": "<ul>\n<li>Deben constar <b>lugar, fecha y hora</b>.</li>\n<li>La advertencia sobre <b>técnicos</b> procede «en su caso».</li>\n<li>El anticipo es <b>a reserva de la liquidación definitiva</b>.</li>\n</ul>", "ancla": "<p><b>«Dónde, cuándo, a qué hora y con quién.»</b> Y si la pides tú y cuesta, la adelantas.</p>", "vis": "<svg viewBox=\"0 0 640 120\" role=\"img\" aria-label=\"Práctica de la prueba\">\n<g font-size=\"10\" text-anchor=\"middle\" fill=\"currentColor\">\n<rect x=\"25\" y=\"30\" width=\"175\" height=\"58\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"112\" y=\"52\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">Antelación suficiente</text><text x=\"112\" y=\"72\">comunicación previa</text>\n<rect x=\"232\" y=\"30\" width=\"175\" height=\"58\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"319\" y=\"52\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">Lugar, fecha y hora</text><text x=\"319\" y=\"72\">y posible técnico propio</text>\n<rect x=\"439\" y=\"30\" width=\"176\" height=\"58\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"527\" y=\"52\" font-size=\"11\" font-weight=\"700\" fill=\"var(--warn)\">Gastos</text><text x=\"527\" y=\"72\">anticipo si la pide el interesado</text>\n</g>\n</svg>"}];
</script>
<script>
ARTS.push.apply(ARTS,[{"n": 79, "t": "Petición", "ubic": "Título IV ▸ Capítulo IV ▸ Sección 3.ª (Informes)", "idea": "Se piden los informes preceptivos y los necesarios, citando el precepto.", "literal": "<p>1. A efectos de la resolución del procedimiento, se solicitarán aquellos informes que sean preceptivos por las disposiciones legales, y los que se juzguen necesarios para resolver, citándose el precepto que los exija o fundamentando, en su caso, la conveniencia de reclamarlos.</p><p>2. En la petición de informe se concretará el extremo o extremos acerca de los que se solicita.</p>", "dis": "<ul>\n<li><b>79.1 — qué informes:</b> se solicitarán los que sean <b>preceptivos</b> por disposición legal y los que se <b>juzguen necesarios</b> para resolver, <b>citándose el precepto que los exija</b> o <b>fundamentando la conveniencia</b> de reclamarlos.</li>\n<li><b>79.2 — concreción:</b> en la petición se <b>concretará el extremo o extremos</b> sobre los que se solicita el informe.</li>\n</ul>", "llano": "<p>No se piden informes por costumbre: o los exige una norma —y hay que citarla— o hacen falta —y hay que explicar por qué—. Y siempre diciendo sobre qué se pregunta exactamente.</p>", "porque": "<p>Pedir informes genéricos es una de las principales causas de retraso: el órgano informante no sabe qué se le pregunta y responde con generalidades que no ayudan a decidir. Exigir la <b>concreción del extremo</b> convierte el informe en una herramienta útil y acorta el procedimiento.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> preguntar algo concreto a un especialista en lugar de pedirle «un informe».</li>\n<li><b>Real:</b> se solicita informe al servicio de urbanismo <b>sobre la compatibilidad del uso pretendido con el planeamiento</b>, no un informe genérico sobre la licencia.</li>\n<li><b>Caso límite:</b> un informe no exigido por norma pero conveniente. Cabe pedirlo, <b>fundamentando</b> la conveniencia (art. 79.1).</li>\n</ul>", "noej": "<ul>\n<li><b>No basta</b> con pedir un informe: hay que citar el precepto o fundamentar la conveniencia.</li>\n<li><b>No procede</b> la petición genérica sin concretar el extremo consultado.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 80 LPAC:</b> emisión, carácter y plazo de los informes.</li>\n<li><b>Art. 77.6 LPAC:</b> el informe pedido como prueba se entiende preceptivo.</li>\n<li><b>Art. 72.2 LPAC:</b> deber de consignar el plazo al pedir trámites a otros órganos.</li>\n</ul>", "trampas": "<ul>\n<li>Dos clases: <b>preceptivos</b> (con cita del precepto) y <b>necesarios</b> (con fundamentación).</li>\n<li>Siempre hay que <b>concretar el extremo</b> consultado.</li>\n</ul>", "ancla": "<p><b>«O lo manda una norma o lo justifico; y siempre pregunto algo concreto.»</b></p>", "vis": "<svg viewBox=\"0 0 640 115\" role=\"img\" aria-label=\"Petición de informes\">\n<rect x=\"45\" y=\"30\" width=\"240\" height=\"55\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/>\n<text x=\"165\" y=\"52\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">Preceptivos</text>\n<text x=\"165\" y=\"71\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">citando el precepto que los exige</text>\n<rect x=\"355\" y=\"30\" width=\"240\" height=\"55\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/>\n<text x=\"475\" y=\"52\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">Necesarios</text>\n<text x=\"475\" y=\"71\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">fundamentando la conveniencia</text>\n<text x=\"320\" y=\"106\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--ink2)\">En ambos casos se concretará el extremo o extremos sobre los que se pide</text>\n</svg>"}, {"n": 80, "t": "Emisión de informes", "ubic": "Título IV ▸ Capítulo IV ▸ Sección 3.ª (Informes)", "idea": "Facultativos y no vinculantes, en diez días; el preceptivo puede suspender el plazo.", "literal": "<p>1. Salvo disposición expresa en contrario, los informes serán facultativos y no vinculantes.</p><p>2. Los informes serán emitidos a través de medios electrónicos y de acuerdo con los requisitos que señala el artículo 26 en el plazo de diez días, salvo que una disposición o el cumplimiento del resto de los plazos del procedimiento permita o exija otro plazo mayor o menor.</p><p>3. De no emitirse el informe en el plazo señalado, y sin perjuicio de la responsabilidad en que incurra el responsable de la demora, se podrán proseguir las actuaciones salvo cuando se trate de un informe preceptivo, en cuyo caso se podrá suspender el transcurso del plazo máximo legal para resolver el procedimiento en los términos establecidos en la letra d) del apartado 1 del artículo 22.</p><p>4. Si el informe debiera ser emitido por una Administración Pública distinta de la que tramita el procedimiento en orden a expresar el punto de vista correspondiente a sus competencias respectivas, y transcurriera el plazo sin que aquél se hubiera emitido, se podrán proseguir las actuaciones. El informe emitido fuera de plazo podrá no ser tenido en cuenta al adoptar la correspondiente resolución.</p>", "dis": "<ul>\n<li><b>80.1 — regla de oro:</b> <b>salvo disposición expresa en contrario</b>, los informes serán <b>facultativos</b> y <b>no vinculantes</b>.</li>\n<li><b>80.2 — plazo:</b> se emiten por <b>medios electrónicos</b>, con los requisitos del art. 26, en el plazo de <b>diez días</b>, salvo que una disposición o el cumplimiento del resto de plazos permita o exija otro <b>mayor o menor</b>.</li>\n<li><b>80.3 — falta de emisión:</b> se pueden <b>proseguir las actuaciones</b>, sin perjuicio de la responsabilidad del causante de la demora, <b>salvo</b> que se trate de un informe <b><span class=\"t\" data-k=\"preceptivo\">preceptivo</span></b>, en cuyo caso <b>se podrá suspender</b> el plazo máximo para resolver en los términos del art. 22.1.d).</li>\n<li><b>80.4 — informe de otra Administración:</b> transcurrido el plazo sin emitirse, se pueden proseguir las actuaciones y el informe emitido <b>fuera de plazo podrá no ser tenido en cuenta</b> al resolver.</li>\n</ul>\n<div class=\"box warn\"><span class=\"lbl\">Los cuatro adjetivos que hay que distinguir</span><b>Facultativo / preceptivo</b> se refiere a <b>si hay que pedirlo</b>. <b>Vinculante / no vinculante</b>, a <b>si obliga</b>. La regla es: <b>facultativo y no vinculante</b>; lo contrario debe decirlo una disposición expresa.</div>", "llano": "<p>Por defecto los informes no hay que pedirlos y no obligan; solo cambia si una norma lo dice. Se emiten en diez días. Si no llega, el expediente sigue, salvo que fuera preceptivo: entonces puede pararse el reloj. Y el informe de otra Administración que llega tarde puede no tenerse en cuenta.</p>", "porque": "<p>La regla del art. 80.1 evita la parálisis: si todos los informes fueran preceptivos y vinculantes, quien informa decidiría en la práctica y el órgano competente perdería su potestad. La <b>suspensión</b> del art. 80.3 es el equilibrio para los preceptivos: no se puede resolver sin ellos, pero tampoco se puede penalizar al órgano que resuelve con la caducidad por una demora ajena.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> pedir una segunda opinión que orienta pero no decide.</li>\n<li><b>Real:</b> el informe del servicio jurídico sobre una licencia se emite en <b>diez días</b>; si no se emite y no era preceptivo, el expediente <b>continúa</b>.</li>\n<li><b>Caso límite:</b> el informe preceptivo de otra Administración llega dos meses tarde. Cabe <b>no tenerlo en cuenta</b> (art. 80.4).</li>\n</ul>", "noej": "<ul>\n<li><b>No son</b> vinculantes por regla general.</li>\n<li><b>No suspende</b> el plazo la falta de un informe <b>facultativo</b>.</li>\n<li><b>No es</b> automática la suspensión por informe preceptivo: la ley dice «se <b>podrá</b> suspender».</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 22.1.d) LPAC:</b> suspensión del plazo máximo por informe preceptivo.</li>\n<li><b>Art. 26 LPAC:</b> requisitos de emisión de documentos administrativos.</li>\n<li><b>Art. 88.6 LPAC:</b> la aceptación de informes sirve de motivación si se incorporan al texto.</li>\n<li><b>Art. 35.1.c) LPAC:</b> motivación cuando se separa del dictamen de órganos consultivos.</li>\n</ul>", "trampas": "<ul>\n<li><b>Facultativos y no vinculantes</b>, salvo disposición expresa en contrario.</li>\n<li><b>Diez días</b>, con posibilidad de plazo mayor <b>o menor</b>.</li>\n<li>Solo el <b>preceptivo</b> permite suspender el plazo para resolver.</li>\n</ul>", "ancla": "<p><b>«Ni obligado pedirlo ni obligado seguirlo, salvo que lo diga una norma.»</b> Y diez días.</p>", "vis": "<svg viewBox=\"0 0 660 150\" role=\"img\" aria-label=\"Emisión de informes\">\n<rect x=\"185\" y=\"8\" width=\"280\" height=\"30\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/>\n<text x=\"325\" y=\"28\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">FACULTATIVOS Y NO VINCULANTES</text>\n<g font-size=\"10\" text-anchor=\"middle\" fill=\"currentColor\">\n<rect x=\"20\" y=\"52\" width=\"195\" height=\"62\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"117\" y=\"76\" font-size=\"13\" font-weight=\"700\" fill=\"var(--acc)\">10 días</text><text x=\"117\" y=\"96\">salvo plazo mayor o menor</text>\n<rect x=\"230\" y=\"52\" width=\"195\" height=\"62\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"327\" y=\"74\" font-weight=\"700\" fill=\"var(--warn)\">Si no llega</text><text x=\"327\" y=\"92\">se prosigue, salvo preceptivo</text><text x=\"327\" y=\"106\">que permite suspender</text>\n<rect x=\"440\" y=\"52\" width=\"200\" height=\"62\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"540\" y=\"74\" font-weight=\"700\" fill=\"var(--exc)\">Otra Administración</text><text x=\"540\" y=\"92\">informe fuera de plazo</text><text x=\"540\" y=\"106\">podrá no tenerse en cuenta</text>\n</g>\n<text x=\"330\" y=\"140\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--ink2)\">La excepción a la regla general debe estar en una disposición expresa</text>\n</svg>"}, {"n": 81, "t": "Solicitud de informes y dictámenes en los procedimientos de responsabilidad patrimonial", "ubic": "Título IV ▸ Capítulo IV ▸ Sección 3.ª (Informes)", "idea": "Patrimonial: informe del servicio en diez días y dictamen si se reclaman 50.000 € o más.", "literal": "<p>1. En el caso de los procedimientos de responsabilidad patrimonial será preceptivo solicitar informe al servicio cuyo funcionamiento haya ocasionado la presunta lesión indemnizable, no pudiendo exceder de diez días el plazo de su emisión.</p><p>2. Cuando las indemnizaciones reclamadas sean de cuantía igual o superior a 50.000 euros o a la que se establezca en la correspondiente legislación autonómica, así como en aquellos casos que disponga la Ley Orgánica 3/1980, de 22 de abril, del Consejo de Estado, será preceptivo solicitar dictamen del Consejo de Estado o, en su caso, del órgano consultivo de la Comunidad Autónoma. A estos efectos, el órgano instructor, en el plazo de diez días a contar desde la finalización del trámite de audiencia, remitirá al órgano competente para solicitar el dictamen una propuesta de resolución, que se ajustará a lo previsto en el artículo 91, o, en su caso, la propuesta de acuerdo por el que se podría terminar convencionalmente el procedimiento. El dictamen se emitirá en el plazo de dos meses y deberá pronunciarse sobre la existencia o no de relación de causalidad entre el funcionamiento del servicio público y la lesión producida y, en su caso, sobre la valoración del daño causado y la cuantía y modo de la indemnización de acuerdo con los criterios establecidos en esta Ley.</p><p>3. En el caso de reclamaciones en materia de responsabilidad patrimonial del Estado por el funcionamiento anormal de la Administración de Justicia, será preceptivo el informe del Consejo General del Poder Judicial que será evacuado en el plazo máximo de dos meses. El plazo para dictar resolución quedará suspendido por el tiempo que medie entre la solicitud del informe y su recepción, no pudiendo exceder dicho plazo de los citados dos meses.</p>", "dis": "<ul>\n<li><b>81.1 — informe del servicio:</b> es <b>preceptivo</b> solicitar informe al <b>servicio cuyo funcionamiento haya ocasionado</b> la presunta lesión indemnizable, y su emisión <b>no puede exceder de diez días</b>.</li>\n<li><b>81.2 — dictamen del órgano consultivo:</b> es <b>preceptivo</b> cuando las indemnizaciones reclamadas sean de cuantía <b>igual o superior a 50.000 euros</b> —o la que fije la legislación autonómica— y en los casos de la Ley Orgánica 3/1980 del Consejo de Estado. El instructor remitirá la propuesta en el plazo de <b>diez días desde la finalización del trámite de audiencia</b>, y el <b>dictamen se emitirá en dos meses</b>, pronunciándose sobre la <b>relación de causalidad</b> y, en su caso, sobre la <b>valoración del daño</b> y la <b>cuantía y modo</b> de la indemnización.</li>\n<li><b>81.3 — Administración de Justicia:</b> en reclamaciones por funcionamiento anormal de la Administración de Justicia es preceptivo el informe del <b>Consejo General del Poder Judicial</b>, evacuado en un <b>máximo de dos meses</b>; el plazo para resolver <b>queda suspendido</b> por el tiempo que medie entre la solicitud y su recepción, <b>sin exceder</b> de esos dos meses.</li>\n</ul>", "llano": "<p>En responsabilidad patrimonial hay dos informes obligatorios. Siempre, el del servicio que causó el daño, en diez días. Y si se reclaman 50.000 euros o más, el dictamen del Consejo Consultivo, que tiene dos meses y debe decir si hay relación de causalidad y cuánto vale el daño.</p>", "porque": "<p>El informe del servicio aporta el conocimiento directo de lo ocurrido; sin él, el instructor decidiría sobre un hecho que no puede reconstruir. Y el <b>umbral de los 50.000 euros</b> reserva la intervención del órgano consultivo para los asuntos de mayor entidad económica, evitando saturarlo con reclamaciones menores.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> preguntar primero al departamento donde ocurrió el problema.</li>\n<li><b>Real:</b> reclamación de 8.000 € por una caída en la vía pública: informe del servicio de vías y obras en <b>diez días</b>; <b>no</b> hace falta dictamen consultivo.</li>\n<li><b>Caso límite:</b> reclamación de 62.000 €. Además del informe, es <b>preceptivo el dictamen</b> del Consejo Consultivo de Andalucía, con <b>dos meses</b> para emitirlo.</li>\n</ul>", "noej": "<ul>\n<li><b>No es</b> preceptivo el dictamen si la cuantía reclamada es <b>inferior</b> al umbral, salvo previsión autonómica distinta.</li>\n<li><b>No excede</b> de diez días el plazo del informe del servicio.</li>\n</ul>", "conex": "<ul>\n<li><b>Arts. 65 y 67 LPAC:</b> iniciación de oficio y a solicitud.</li>\n<li><b>Art. 91 LPAC:</b> especialidades de la resolución, que se dicta tras el dictamen.</li>\n<li><b>Art. 22.1.d) LPAC:</b> suspensión del plazo por informes preceptivos.</li>\n<li><b>Arts. 32 a 34 de la Ley 40/2015</b> (documento 2): criterios de cálculo de la indemnización.</li>\n</ul>", "trampas": "<ul>\n<li><b>50.000 €</b> es el umbral estatal; la <b>legislación autonómica</b> puede fijar otro.</li>\n<li><b>Diez días</b> para el informe del servicio y para remitir la propuesta tras la audiencia; <b>dos meses</b> para el dictamen.</li>\n<li>El dictamen debe pronunciarse sobre la <b>relación de causalidad</b>.</li>\n</ul>", "ancla": "<p><b>«10 días el servicio · 50.000 € el listón · 2 meses el dictamen.»</b></p>", "vis": "<svg viewBox=\"0 0 660 140\" role=\"img\" aria-label=\"Informes y dictámenes en responsabilidad patrimonial\">\n<g font-size=\"10\" text-anchor=\"middle\" fill=\"currentColor\">\n<rect x=\"20\" y=\"32\" width=\"195\" height=\"62\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"117\" y=\"56\" font-size=\"12\" font-weight=\"700\" fill=\"var(--acc)\">Informe del servicio</text><text x=\"117\" y=\"76\">preceptivo · máximo 10 días</text>\n<rect x=\"230\" y=\"32\" width=\"195\" height=\"62\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"327\" y=\"56\" font-size=\"13\" font-weight=\"700\" fill=\"var(--warn)\">50.000 €</text><text x=\"327\" y=\"76\">umbral del dictamen preceptivo</text>\n<rect x=\"440\" y=\"32\" width=\"200\" height=\"62\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"540\" y=\"56\" font-size=\"12\" font-weight=\"700\" fill=\"var(--ej)\">Dictamen</text><text x=\"540\" y=\"76\">2 meses · causalidad y cuantía</text>\n</g>\n<text x=\"330\" y=\"124\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--ink2)\">El instructor remite la propuesta en 10 días desde que finaliza el trámite de audiencia</text>\n</svg>"}, {"n": 82, "t": "Trámite de audiencia", "ubic": "Título IV ▸ Capítulo IV ▸ Sección 4.ª (Participación de los interesados)", "idea": "Audiencia de diez a quince días, antes de la propuesta y antes del dictamen.", "literal": "<p>1. Instruidos los procedimientos, e inmediatamente antes de redactar la propuesta de resolución, se pondrán de manifiesto a los interesados o, en su caso, a sus representantes, para lo que se tendrán en cuenta las limitaciones previstas en su caso en la Ley 19/2013, de 9 de diciembre. La audiencia a los interesados será anterior a la solicitud del informe del órgano competente para el asesoramiento jurídico o a la solicitud del Dictamen del Consejo de Estado u órgano consultivo equivalente de la Comunidad Autónoma, en el caso que éstos formaran parte del procedimiento.</p><p>2. Los interesados, en un plazo no inferior a diez días ni superior a quince, podrán alegar y presentar los documentos y justificaciones que estimen pertinentes.</p><p>3. Si antes del vencimiento del plazo los interesados manifiestan su decisión de no efectuar alegaciones ni aportar nuevos documentos o justificaciones, se tendrá por realizado el trámite.</p><p>4. Se podrá prescindir del trámite de audiencia cuando no figuren en el procedimiento ni sean tenidos en cuenta en la resolución otros hechos ni otras alegaciones y pruebas que las aducidas por el interesado.</p><p>5. En los procedimientos de responsabilidad patrimonial a los que se refiere el artículo 32.9 de la Ley de Régimen Jurídico del Sector Público, será necesario en todo caso dar audiencia al contratista, notificándole cuantas actuaciones se realicen en el procedimiento, al efecto de que se persone en el mismo, exponga lo que a su derecho convenga y proponga cuantos medios de prueba estime necesarios.</p>", "dis": "<ul>\n<li><b>82.1 — momento:</b> instruidos los procedimientos e <b>inmediatamente antes de redactar la propuesta de resolución</b>, se pondrán de manifiesto a los interesados, con las limitaciones de la <b>Ley 19/2013</b>. La audiencia será <b>anterior</b> a la solicitud del <b>informe del órgano de asesoramiento jurídico</b> o del <b>dictamen del Consejo de Estado u órgano consultivo autonómico</b>, cuando formen parte del procedimiento.</li>\n<li><b>82.2 — plazo:</b> <b>no inferior a diez días ni superior a quince</b> para alegar y presentar documentos y justificaciones.</li>\n<li><b>82.3 — renuncia anticipada:</b> si antes del vencimiento los interesados manifiestan su decisión de <b>no efectuar alegaciones</b> ni aportar documentos, <b>se tendrá por realizado el trámite</b>.</li>\n<li><b>82.4 — cuándo puede prescindirse:</b> cuando <b>no figuren en el procedimiento ni sean tenidos en cuenta en la resolución otros hechos ni otras alegaciones y pruebas que las aducidas por el interesado</b>.</li>\n<li><b>82.5 — contratista:</b> en los procedimientos de responsabilidad patrimonial del art. 32.9 de la Ley 40/2015 será necesario <b>en todo caso</b> dar audiencia al <b>contratista</b>, notificándole cuantas actuaciones se realicen.</li>\n</ul>\n<div class=\"box exc\"><span class=\"lbl\">El error más caro del tema</span>Prescindir de la audiencia cuando <b>sí</b> hay otros hechos o pruebas en el expediente es el vicio de forma que con más frecuencia produce <b>indefensión</b> y, con ella, la anulabilidad del art. 48.2.</div>", "llano": "<p>Antes de proponer una decisión hay que enseñarte el expediente y darte entre diez y quince días para decir lo que quieras. Puedes renunciar antes de tiempo y se da por hecho. Y solo se puede saltar cuando en el expediente no hay absolutamente nada más que lo que tú mismo aportaste.</p>", "porque": "<p>La audiencia es <b>la</b> garantía del procedimiento: el momento en que el interesado ve todo lo que se va a usar contra él y puede reaccionar. Por eso el art. 82.4 se interpreta de forma <b>restrictiva</b>: basta un informe, una prueba o un dato que él no haya aportado para que la audiencia sea obligatoria.</p>\n<p>El orden del art. 82.1 tampoco es casual: oír al interesado <b>antes</b> del dictamen permite que el órgano consultivo valore también sus alegaciones.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> ver el expediente completo antes de que alguien redacte la propuesta.</li>\n<li><b>Real:</b> en un expediente sancionador se pone de manifiesto el expediente con <b>doce días</b> para alegaciones antes de la propuesta de resolución.</li>\n<li><b>Caso límite:</b> el expediente solo contiene la solicitud y los documentos del propio interesado, y la resolución se basa exclusivamente en ellos. Cabe <b>prescindir</b> de la audiencia (art. 82.4).</li>\n</ul>", "noej": "<ul>\n<li><b>No cabe</b> prescindir de la audiencia si se ha incorporado un informe o una prueba no aportada por el interesado.</li>\n<li><b>No puede</b> el plazo ser inferior a <b>diez</b> ni superior a <b>quince</b> días.</li>\n<li><b>No es</b> posterior al dictamen: es <b>anterior</b>.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 76.1 LPAC:</b> las alegaciones sobre el fondo se admiten hasta este trámite.</li>\n<li><b>Art. 81.2 LPAC:</b> el dictamen se pide después de la audiencia.</li>\n<li><b>Art. 48.2 LPAC:</b> indefensión como causa de anulabilidad.</li>\n<li><b>Ley 19/2013</b> (documento incorporado): límites al acceso que pueden operar en la puesta de manifiesto.</li>\n</ul>", "trampas": "<ul>\n<li><b>10 a 15 días</b>: el mismo plazo que en el art. 118.1 para los recursos.</li>\n<li>Es <b>anterior</b> a la propuesta de resolución <b>y</b> al dictamen.</li>\n<li>El art. 82.4 exige que <b>no figuren</b> otros hechos, alegaciones ni pruebas: es acumulativo.</li>\n<li>En el supuesto del art. 82.5, audiencia al <b>contratista en todo caso</b>.</li>\n</ul>", "ancla": "<p><b>«Antes de proponer, te enseño todo: de 10 a 15 días.»</b> Y solo me la salto si en el expediente solo estás tú.</p>", "vis": "<svg viewBox=\"0 0 660 140\" role=\"img\" aria-label=\"Trámite de audiencia\">\n<defs><marker id=\"au1\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\"><path d=\"M0 0 L9 4.5 L0 9 z\" fill=\"var(--acc)\"/></marker></defs>\n<rect x=\"15\" y=\"35\" width=\"165\" height=\"55\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/>\n<text x=\"97\" y=\"58\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">Instrucción</text>\n<text x=\"97\" y=\"76\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">concluida</text>\n<path d=\"M183 62 L 213 62\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#au1)\"/>\n<rect x=\"217\" y=\"35\" width=\"200\" height=\"55\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/>\n<text x=\"317\" y=\"57\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"var(--ej)\">AUDIENCIA · 10 a 15 días</text>\n<text x=\"317\" y=\"76\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">puesta de manifiesto del expediente</text>\n<path d=\"M420 62 L 450 62\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#au1)\"/>\n<rect x=\"454\" y=\"35\" width=\"190\" height=\"55\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/>\n<text x=\"549\" y=\"57\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--warn)\">Dictamen y propuesta</text>\n<text x=\"549\" y=\"76\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">siempre DESPUÉS</text>\n<text x=\"330\" y=\"126\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--exc)\">Solo se prescinde si no figuran otros hechos, alegaciones ni pruebas que los del interesado</text>\n</svg>"}]);
</script>
<script>
ARTS.push.apply(ARTS,[{"n": 83, "t": "Información pública", "ubic": "Título IV ▸ Capítulo IV ▸ Sección 4.ª (Participación de los interesados)", "idea": "Información pública: mínimo veinte días y comparecer no da la condición de interesado.", "literal": "<p>1. El órgano al que corresponda la resolución del procedimiento, cuando la naturaleza de éste lo requiera, podrá acordar un período de información pública.</p><p>2. A tal efecto, se publicará un anuncio en el Diario oficial correspondiente a fin de que cualquier persona física o jurídica pueda examinar el expediente, o la parte del mismo que se acuerde. El anuncio señalará el lugar de exhibición, debiendo estar en todo caso a disposición de las personas que lo soliciten a través de medios electrónicos en la sede electrónica correspondiente, y determinará el plazo para formular alegaciones, que en ningún caso podrá ser inferior a veinte días.</p><p>3. La incomparecencia en este trámite no impedirá a los interesados interponer los recursos procedentes contra la resolución definitiva del procedimiento. La comparecencia en el trámite de información pública no otorga, por sí misma, la condición de interesado. No obstante, quienes presenten alegaciones u observaciones en este trámite tienen derecho a obtener de la Administración una respuesta razonada, que podrá ser común para todas aquellas alegaciones que planteen cuestiones sustancialmente iguales.</p><p>4. Conforme a lo dispuesto en las leyes, las Administraciones Públicas podrán establecer otras formas, medios y cauces de participación de las personas, directamente o a través de las organizaciones y asociaciones reconocidas por la ley en el procedimiento en el que se dictan los actos administrativos.</p>", "dis": "<ul>\n<li><b>83.1 — decisión:</b> el órgano competente para resolver, <b>cuando la naturaleza del procedimiento lo requiera</b>, <b>podrá acordar</b> un período de <span class=\"t\" data-k=\"infopublica\">información pública</span>.</li>\n<li><b>83.2 — publicidad y plazo:</b> se publicará <b>anuncio en el diario oficial</b> para que <b>cualquier persona física o jurídica</b> pueda examinar el expediente o la parte que se acuerde. El anuncio señalará el <b>lugar de exhibición</b> —debiendo estar en todo caso a disposición por <b>medios electrónicos</b> en la sede— y el <b>plazo para alegar</b>, que <b>en ningún caso podrá ser inferior a veinte días</b>.</li>\n<li><b>83.3 — efectos de comparecer o no:</b> la <b>incomparecencia no impide</b> interponer los recursos procedentes contra la resolución definitiva. La <b>comparecencia no otorga por sí misma la condición de interesado</b>, pero quien presente alegaciones tiene <b>derecho a obtener respuesta razonada</b>, que podrá ser común para todas las alegaciones que planteen cuestiones sustancialmente iguales.</li>\n<li><b>83.4 — otras formas de participación:</b> las Administraciones podrán establecer <b>otras formas, medios y cauces de participación</b>, directamente o a través de organizaciones y asociaciones.</li>\n</ul>", "llano": "<p>Cuando el asunto interesa a todos, se abre al público: se anuncia en el boletín y cualquiera puede mirar el expediente y alegar, con un mínimo de veinte días. Presentarse no te convierte en parte, pero si alegas tienen que contestarte de forma razonada, aunque sea con una respuesta común.</p>", "porque": "<p>Hay decisiones —planeamiento, ordenanzas, grandes infraestructuras— cuyo acierto depende del <b>conocimiento disperso</b> en la ciudadanía. La información pública canaliza esa aportación. El plazo mínimo de <b>veinte días</b> reconoce que estudiar un expediente complejo desde fuera lleva más tiempo que alegar en el propio.</p>\n<p>La regla de que comparecer <b>no da la condición de interesado</b> evita que un trámite de participación multiplique indefinidamente las partes; pero el <b>derecho a respuesta razonada</b> impide que la participación sea decorativa.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> una consulta abierta al vecindario sobre un proyecto del barrio.</li>\n<li><b>Real:</b> la aprobación inicial de una modificación urbanística se somete a información pública por <b>un mes</b>, con anuncio en el boletín provincial y expediente accesible en la sede electrónica.</li>\n<li><b>Caso límite:</b> doscientos vecinos presentan alegaciones idénticas. Cabe una <b>respuesta común</b> a todas las que planteen cuestiones sustancialmente iguales (art. 83.3).</li>\n</ul>", "noej": "<ul>\n<li><b>No otorga</b> la comparecencia la condición de interesado.</li>\n<li><b>No impide</b> la incomparecencia recurrir después la resolución.</li>\n<li><b>No cabe</b> un plazo inferior a <b>veinte días</b>.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 4 LPAC:</b> concepto de interesado.</li>\n<li><b>Art. 82 LPAC:</b> audiencia, que es de los interesados y no del público.</li>\n<li><b>Art. 133 LPAC:</b> participación en la elaboración de normas con rango de ley y reglamentos.</li>\n<li><b>Arts. 5 a 11 de la Ley 19/2013:</b> publicidad activa, con la que enlaza el art. 83.4.</li>\n</ul>", "trampas": "<ul>\n<li>El plazo mínimo es de <b>veinte días</b>: no confundir con los <b>10 a 15</b> de la audiencia.</li>\n<li>Comparecer <b>no</b> da la condición de interesado; no comparecer <b>no</b> impide recurrir.</li>\n<li>La respuesta puede ser <b>común</b> para alegaciones sustancialmente iguales.</li>\n</ul>", "ancla": "<p><b>«Audiencia: 10-15 y para interesados. Información pública: 20 y para todos.»</b></p>", "vis": "<svg viewBox=\"0 0 660 140\" role=\"img\" aria-label=\"Información pública frente a audiencia\">\n<rect x=\"30\" y=\"30\" width=\"280\" height=\"72\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/>\n<text x=\"170\" y=\"52\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">AUDIENCIA (art. 82)</text>\n<text x=\"170\" y=\"72\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">solo los interesados</text>\n<text x=\"170\" y=\"90\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\">10 a 15 días</text>\n<rect x=\"350\" y=\"30\" width=\"280\" height=\"72\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/>\n<text x=\"490\" y=\"52\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">INFORMACIÓN PÚBLICA (art. 83)</text>\n<text x=\"490\" y=\"72\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">cualquier persona física o jurídica</text>\n<text x=\"490\" y=\"90\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\">mínimo 20 días</text>\n<text x=\"330\" y=\"126\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--ink2)\">Comparecer no da la condición de interesado, pero da derecho a respuesta razonada</text>\n</svg>"}]);
</script>

const PLAZOS=[["10 a 30 días", "Período ordinario de prueba", "Instructor", "77.2 LPAC", "Ni menos de 10 ni más de 30"], ["Hasta 10 días", "Período extraordinario de prueba", "Instructor", "77.2 LPAC", "Solo a petición de los interesados"], ["10 días", "Plazo general de emisión de los informes", "Órgano informante", "80.2 LPAC", "Salvo plazo mayor o menor"], ["10 días", "Emisión del informe del servicio causante de la lesión", "Servicio", "81.1 LPAC", "Preceptivo en responsabilidad patrimonial"], ["10 días", "Remisión de la propuesta para solicitar dictamen, tras la audiencia", "Instructor", "81.2 LPAC", "En responsabilidad patrimonial"], ["2 meses", "Emisión del dictamen del Consejo de Estado u órgano consultivo", "Órgano consultivo", "81.2 LPAC", "Debe pronunciarse sobre la relación de causalidad"], ["2 meses", "Informe del Consejo General del Poder Judicial", "CGPJ", "81.3 LPAC", "Suspende el plazo para resolver, sin exceder de dos meses"], ["50.000 €", "Umbral que hace preceptivo el dictamen consultivo", "Reclamante", "81.2 LPAC", "O la cuantía que fije la legislación autonómica"], ["10 a 15 días", "Trámite de audiencia", "Interesados", "82.2 LPAC", "Anterior a la propuesta y al dictamen"], ["20 días", "Plazo mínimo de alegaciones en información pública", "Cualquier persona", "83.2 LPAC", "En ningún caso inferior"], ["Hasta la audiencia", "Momento límite para alegar sobre el fondo", "Interesados", "76.1 LPAC", "Los defectos de tramitación, en todo momento"]];
const FLASH=[["¿Cómo se realizan los actos de instrucción?", "<b>De oficio</b> y por <b>medios electrónicos</b>, por el órgano que tramita, sin perjuicio del derecho de los interesados a <b>proponer</b> actuaciones (art. 75.1)."], ["¿Qué principios debe garantizar el instructor?", "El pleno respeto a los principios de <b>contradicción</b> y de <b>igualdad</b> de los interesados (art. 75.4)."], ["¿Hasta cuándo pueden alegar los interesados sobre el fondo?", "Hasta el <b>trámite de audiencia</b>; sus alegaciones y documentos deben tenerse en cuenta al redactar la <b>propuesta de resolución</b> (art. 76.1)."], ["¿Y para denunciar defectos de tramitación?", "<b>En todo momento</b>, y pueden dar lugar a <b>responsabilidad disciplinaria</b> (art. 76.2)."], ["¿Cómo se acreditan los hechos relevantes?", "Por <b>cualquier medio de prueba admisible en Derecho</b>, con valoración conforme a la Ley de Enjuiciamiento Civil (art. 77.1)."], ["Duración del período de prueba", "<b>No superior a treinta días ni inferior a diez</b>; y un período extraordinario <b>no superior a diez</b> a petición de los interesados (art. 77.2)."], ["¿Cuándo puede rechazarse una prueba propuesta?", "Solo cuando sea <b>manifiestamente improcedente o innecesaria</b>, y mediante <b>resolución motivada</b> (art. 77.3)."], ["¿Qué valor tienen las actas de los funcionarios con condición de autoridad?", "<b>Hacen prueba</b> de los hechos constatados, <b>salvo que se acredite lo contrario</b> (art. 77.5)."], ["¿Vinculan los hechos probados en sentencia penal firme?", "<b>Sí</b>, vinculan a las Administraciones en los procedimientos sancionadores que sustancien (art. 77.4)."], ["¿Qué debe comunicarse al practicar una prueba?", "El inicio de las actuaciones con <b>antelación suficiente</b>, y en la notificación el <b>lugar, fecha y hora</b>, con advertencia de que puede <b>nombrar técnicos</b> (art. 78)."], ["¿Qué informes se solicitan?", "Los <b>preceptivos</b> por disposición legal, <b>citando el precepto</b>, y los que se juzguen <b>necesarios</b>, <b>fundamentando</b> la conveniencia; concretando el extremo consultado (art. 79)."], ["Regla general sobre el carácter de los informes", "Salvo disposición expresa en contrario, son <b>facultativos y no vinculantes</b> (art. 80.1)."], ["Plazo general de emisión de informes", "<b>Diez días</b>, salvo que una disposición o el resto de plazos permita o exija otro mayor o menor (art. 80.2)."], ["¿Qué ocurre si no se emite el informe en plazo?", "Se <b>prosiguen las actuaciones</b>, salvo que sea <b>preceptivo</b>: entonces se podrá <b>suspender</b> el plazo máximo para resolver (art. 80.3)."], ["¿Y si el informe lo debe emitir otra Administración?", "Se prosiguen las actuaciones y el informe emitido <b>fuera de plazo podrá no ser tenido en cuenta</b> (art. 80.4)."], ["¿Qué informe es siempre preceptivo en responsabilidad patrimonial?", "El del <b>servicio cuyo funcionamiento</b> haya ocasionado la presunta lesión, en un plazo no superior a <b>diez días</b> (art. 81.1)."], ["¿Cuándo es preceptivo el dictamen del Consejo de Estado u órgano consultivo autonómico?", "Cuando las indemnizaciones reclamadas sean de cuantía <b>igual o superior a 50.000 euros</b> o la que fije la legislación autonómica (art. 81.2)."], ["¿En qué plazo se emite ese dictamen y sobre qué se pronuncia?", "<b>Dos meses</b>; sobre la <b>relación de causalidad</b> y, en su caso, sobre la valoración del daño y la cuantía y modo de la indemnización (art. 81.2)."], ["¿Cuándo se practica el trámite de audiencia?", "Instruidos los procedimientos e <b>inmediatamente antes de redactar la propuesta de resolución</b>, y <b>antes</b> de pedir el informe jurídico o el dictamen (art. 82.1)."], ["Plazo del trámite de audiencia", "<b>No inferior a diez días ni superior a quince</b> (art. 82.2)."], ["¿Cuándo puede prescindirse de la audiencia?", "Cuando <b>no figuren en el procedimiento ni sean tenidos en cuenta en la resolución otros hechos ni otras alegaciones y pruebas</b> que las aducidas por el interesado (art. 82.4)."], ["Plazo mínimo de la información pública", "<b>Veinte días</b>, en ningún caso inferior (art. 83.2)."], ["¿Otorga la comparecencia en información pública la condición de interesado?", "<b>No</b>, pero quien presente alegaciones tiene derecho a <b>respuesta razonada</b>, que puede ser común para cuestiones sustancialmente iguales (art. 83.3)."], ["¿Impide recurrir el no haber comparecido en información pública?", "<b>No</b>: la incomparecencia no impide interponer los recursos procedentes (art. 83.3)."]];
const TEST=[{"a": 75, "q": "Los actos de instrucción se realizan:", "o": [["de oficio y a través de medios electrónicos, por el órgano que tramite el procedimiento", 1, "Correcto: art. 75.1, sin perjuicio del derecho de los interesados a proponer actuaciones."], ["solo a instancia de los interesados", 0, "La instrucción es de oficio."], ["por el órgano competente para resolver, en todo caso", 0, "Los realiza el órgano que tramita."], ["exclusivamente en soporte papel", 0, "Se realizan por medios electrónicos."]]}, {"a": 76, "q": "Los interesados pueden alegar los defectos de tramitación:", "o": [["en todo momento", 1, "Correcto: art. 76.2, a diferencia de las alegaciones sobre el fondo."], ["solo hasta el trámite de audiencia", 0, "Ese es el límite de las alegaciones del art. 76.1."], ["solo en el recurso contra la resolución", 0, "Pueden alegarse durante el procedimiento."], ["solo en el período de prueba", 0, "No hay tal limitación."]]}, {"a": 77, "q": "El período ordinario de prueba tendrá una duración:", "o": [["no superior a treinta días ni inferior a diez", 1, "Correcto: art. 77.2."], ["no superior a quince días", 0, "No es el plazo legal."], ["de un mes improrrogable", 0, "No es el plazo legal."], ["libre, a criterio del instructor", 0, "La ley fija un mínimo y un máximo."]]}, {"a": 77, "q": "El período extraordinario de prueba:", "o": [["no puede superar los diez días y se abre a petición de los interesados", 1, "Correcto: art. 77.2."], ["dura treinta días y lo acuerda de oficio el instructor", 0, "Ese es el ordinario, y con otro régimen."], ["no existe en la Ley 39/2015", 0, "Sí está previsto."], ["lo acuerda el órgano competente para resolver", 0, "Lo decide el instructor."]]}, {"a": 77, "q": "El instructor puede rechazar las pruebas propuestas por los interesados:", "o": [["solo cuando sean manifiestamente improcedentes o innecesarias, mediante resolución motivada", 1, "Correcto: art. 77.3, en relación con el art. 35.1.f)."], ["libremente, por razones de economía procedimental", 0, "No cabe el rechazo discrecional."], ["cuando su coste sea elevado", 0, "No es causa legal de rechazo."], ["cuando no las considere convenientes", 0, "El estándar legal es más exigente."]]}, {"a": 77, "q": "Completa: los documentos formalizados por funcionarios a los que se reconoce la condición de autoridad harán prueba de los hechos constatados salvo que ______.", "gap": "se acredite lo contrario", "fb": "Salvo que <b>se acredite lo contrario</b> (art. 77.5). La presunción es <i>iuris tantum</i>."}, {"a": 78, "q": "En la notificación de la práctica de una prueba debe consignarse:", "o": [["el lugar, la fecha y la hora, con la advertencia de que el interesado puede nombrar técnicos que le asistan", 1, "Correcto: art. 78.2."], ["únicamente la fecha", 0, "También lugar y hora."], ["el resultado previsto de la prueba", 0, "No procede."], ["la identidad de todos los interesados", 0, "No es exigencia del precepto."]]}, {"a": 79, "q": "Al solicitar un informe:", "o": [["se citará el precepto que lo exija o se fundamentará la conveniencia de reclamarlo, concretando el extremo consultado", 1, "Correcto: art. 79.1 y 79.2."], ["basta con indicar el órgano destinatario", 0, "Es insuficiente."], ["no es necesaria justificación alguna", 0, "La ley la exige."], ["debe indicarse el sentido en que se desea el informe", 0, "Eso comprometería su independencia."]]}, {"a": 80, "q": "Salvo disposición expresa en contrario, los informes son:", "o": [["facultativos y no vinculantes", 1, "Correcto: art. 80.1, la regla de oro en materia de informes."], ["preceptivos y vinculantes", 0, "Eso requiere disposición expresa."], ["preceptivos pero no vinculantes", 0, "La regla es que sean facultativos."], ["facultativos pero vinculantes", 0, "No es la regla legal."]]}, {"a": 80, "q": "Si no se emite en plazo un informe preceptivo:", "o": [["se podrá suspender el transcurso del plazo máximo para resolver", 1, "Correcto: art. 80.3, en los términos del art. 22.1.d)."], ["se produce la caducidad del procedimiento", 0, "No es la consecuencia."], ["debe archivarse el expediente", 0, "No procede."], ["se entiende emitido en sentido favorable", 0, "No existe tal presunción."]]}, {"a": 81, "q": "El dictamen del Consejo de Estado u órgano consultivo autonómico es preceptivo en responsabilidad patrimonial cuando la indemnización reclamada sea:", "o": [["de cuantía igual o superior a 50.000 euros o a la que establezca la legislación autonómica", 1, "Correcto: art. 81.2."], ["igual o superior a 30.000 euros", 0, "No es el umbral legal."], ["superior a 100.000 euros", 0, "No es el umbral legal."], ["cualquiera: siempre es preceptivo", 0, "Solo a partir del umbral o en los casos de la LO 3/1980."]]}, {"a": 81, "q": "El plazo de emisión del informe del servicio causante de la lesión no puede exceder de:", "o": [["diez días", 1, "Correcto: art. 81.1."], ["dos meses", 0, "Ese es el plazo del dictamen consultivo."], ["un mes", 0, "No es el plazo legal."], ["quince días", 0, "No es el plazo legal."]]}, {"a": 82, "q": "El trámite de audiencia se practica:", "o": [["instruidos los procedimientos e inmediatamente antes de redactar la propuesta de resolución", 1, "Correcto: art. 82.1, y antes del informe jurídico o del dictamen."], ["después de la propuesta de resolución", 0, "Es anterior a ella."], ["al inicio del procedimiento", 0, "Se practica una vez instruido."], ["después de recibido el dictamen del órgano consultivo", 0, "La audiencia es anterior al dictamen."]]}, {"a": 82, "q": "El plazo del trámite de audiencia es:", "o": [["no inferior a diez días ni superior a quince", 1, "Correcto: art. 82.2."], ["de veinte días como mínimo", 0, "Ese es el mínimo de la información pública."], ["de diez días improrrogables", 0, "La ley fija una horquilla."], ["de un mes", 0, "No es el plazo legal."]]}, {"a": 82, "q": "Puede prescindirse del trámite de audiencia:", "o": [["cuando no figuren en el procedimiento ni sean tenidos en cuenta en la resolución otros hechos ni otras alegaciones y pruebas que las aducidas por el interesado", 1, "Correcto: art. 82.4, de interpretación restrictiva."], ["cuando el procedimiento sea urgente", 0, "La urgencia reduce plazos, no suprime la audiencia."], ["cuando el interesado no lo solicite", 0, "Es un trámite de oficio."], ["en todos los procedimientos sancionadores", 0, "Al contrario: ahí es especialmente necesario."]]}, {"a": 82, "q": "Si antes del vencimiento del plazo los interesados manifiestan su decisión de no efectuar alegaciones ni aportar documentos:", "o": [["se tendrá por realizado el trámite", 1, "Correcto: art. 82.3."], ["debe esperarse igualmente al vencimiento del plazo", 0, "No es necesario."], ["se entiende que renuncian a recurrir", 0, "No hay tal efecto."], ["caduca el procedimiento", 0, "No procede."]]}, {"a": 83, "q": "El plazo para formular alegaciones en el trámite de información pública:", "o": [["en ningún caso podrá ser inferior a veinte días", 1, "Correcto: art. 83.2."], ["no podrá ser inferior a diez ni superior a quince días", 0, "Ese es el plazo de la audiencia."], ["será de un mes en todo caso", 0, "La ley solo fija un mínimo."], ["lo fija libremente el órgano, sin límite", 0, "Hay un mínimo legal."]]}, {"a": 83, "q": "La comparecencia en el trámite de información pública:", "o": [["no otorga por sí misma la condición de interesado, pero da derecho a respuesta razonada", 1, "Correcto: art. 83.3."], ["convierte al compareciente en interesado", 0, "No lo hace por sí misma."], ["impide recurrir después la resolución", 0, "Al contrario: ni siquiera la incomparecencia lo impide."], ["obliga a la Administración a estimar las alegaciones", 0, "Obliga a responder, no a estimar."]]}, {"a": 80, "q": "Completa: los informes serán emitidos a través de medios electrónicos en el plazo de ______, salvo que una disposición permita o exija otro plazo.", "gap": "diez días", "fb": "<b>Diez días</b> (art. 80.2), que puede ser mayor o menor si así lo permite o exige una disposición."}, {"a": 83, "q": "La incomparecencia en el trámite de información pública impide interponer recursos contra la resolución definitiva.", "vf": true, "ok": false, "fb": "<b>Falso.</b> El art. 83.3 dispone expresamente que la incomparecencia <b>no impedirá</b> a los interesados interponer los recursos procedentes."}];
const CASOS=[{"t": "Caso 1 · La prueba que no se practicó", "e": "En un expediente sancionador por venta ambulante, el interesado propone dos pruebas: una <b>testifical</b> de dos clientes y una <b>pericial</b> sobre la ubicación exacta del puesto. El instructor las rechaza con un escrito que dice: «No se admiten las pruebas propuestas». Dicta después propuesta de resolución basada exclusivamente en el <b>acta de la policía local</b>. <b>Analiza la situación.</b>", "s": "<p><b>1) El rechazo de las pruebas.</b> El art. <b>77.3</b> solo permite rechazarlas cuando sean <b>manifiestamente improcedentes o innecesarias</b> y <b>mediante resolución motivada</b>. Un escrito que se limita a decir que no se admiten <b>no está motivado</b>. Además, el art. <b>35.1.f)</b> incluye expresamente el rechazo de pruebas entre los actos que deben motivarse.</p><p><b>2) El valor del acta.</b> El art. <b>77.5</b> reconoce que las actas de funcionarios con condición de autoridad <b>hacen prueba</b> de los hechos constatados, pero <b>salvo que se acredite lo contrario</b>. Es una presunción <i>iuris tantum</i>: precisamente lo que el interesado pretendía hacer con sus pruebas. Rechazarlas sin motivar convierte de hecho la presunción en indestructible.</p><p><b>3) Consecuencia jurídica.</b> Es un <b>defecto de forma</b> que produce <b>indefensión</b>: anulabilidad conforme al art. <b>48.2</b>, en relación con el art. <b>75.4</b> —contradicción e igualdad—.</p><p><b>4) Vía de reacción y efecto.</b> Recurso contra la resolución. Estimado por vicio de forma, procede la <b>retroacción</b> de actuaciones al momento en que se rechazaron las pruebas (art. 119.2), conservando lo que habría sido igual (art. 51).</p><p><b>5) Qué debió hacerse.</b> Admitirlas o rechazarlas con <b>motivación expresa</b>, y en caso de admitirlas, abrir período de prueba de <b>diez a treinta días</b> (art. 77.2) y comunicar <b>lugar, fecha y hora</b> (art. 78.2).</p>"}, {"t": "Caso 2 · Los informes que no llegan", "e": "En un expediente de licencia de actividad se solicitan tres informes: el del <b>servicio de urbanismo</b> (preceptivo por la ordenanza), el de <b>bomberos</b> (preceptivo por norma sectorial, y corresponde a otra Administración) y el del <b>servicio jurídico</b> (que el instructor considera conveniente). Transcurren treinta días y no se ha emitido ninguno. <b>¿Qué puede hacer el instructor con cada uno?</b>", "s": "<p><b>1) Punto de partida.</b> Todos debían emitirse en <b>diez días</b> (art. 80.2), salvo que una disposición o el resto de plazos del procedimiento permitiera o exigiera otro mayor o menor.</p><p><b>2) Informe de urbanismo (preceptivo, misma Administración).</b> Art. <b>80.3</b>: al ser <b>preceptivo</b>, <b>se podrá suspender</b> el transcurso del plazo máximo para resolver en los términos del art. <b>22.1.d)</b>. No es automático: hay que acordarlo y notificarlo.</p><p><b>3) Informe de bomberos (preceptivo, otra Administración).</b> Rige el art. <b>80.4</b>: se pueden <b>proseguir las actuaciones</b>, y el informe que se emita <b>fuera de plazo podrá no ser tenido en cuenta</b> al resolver.</p><p><b>4) Informe jurídico (facultativo).</b> Art. <b>80.3</b>, primera parte: se <b>prosiguen las actuaciones</b>, sin suspensión, y sin perjuicio de la <b>responsabilidad</b> en que incurra el responsable de la demora.</p><p><b>5) Regla que se extrae.</b> Lo que determina la suspensión no es la importancia del informe, sino <b>quién debe emitirlo</b> y <b>si es preceptivo</b>: preceptivo de la misma Administración → cabe suspender; de otra Administración → se sigue adelante; facultativo → se sigue adelante.</p>"}, {"t": "Caso 3 · Audiencia o información pública", "e": "Un ayuntamiento tramita dos expedientes: <b>(a)</b> una reclamación de responsabilidad patrimonial de 65.000 € por daños en una vivienda; <b>(b)</b> la aprobación inicial de una modificación de la ordenanza de terrazas. <b>Determina, en cada uno, qué trámite de participación procede, con qué plazo y en qué orden se practican los informes.</b>", "s": "<p><b>(a) Responsabilidad patrimonial.</b></p><ul><li><b>Informe del servicio</b> causante de la lesión: <b>preceptivo</b>, plazo máximo de <b>diez días</b> (art. 81.1).</li><li><b>Trámite de audiencia</b> a los interesados: <b>de diez a quince días</b> (art. 82.2), practicado <b>inmediatamente antes</b> de la propuesta y <b>antes</b> del dictamen (art. 82.1).</li><li>Como la cuantía supera los <b>50.000 €</b>, es <b>preceptivo el dictamen</b> del órgano consultivo autonómico. El instructor remite la propuesta en <b>diez días</b> desde que finaliza la audiencia y el dictamen se emite en <b>dos meses</b> (art. 81.2).</li><li>Si hubiera contratista implicado en los términos del art. 32.9 de la Ley 40/2015, audiencia <b>en todo caso</b> también a él (art. 82.5).</li></ul><p><b>(b) Modificación de la ordenanza.</b></p><ul><li>Procede <b>información pública</b> (art. 83.1), con anuncio en el <b>diario oficial</b> y expediente accesible por <b>medios electrónicos</b> en la sede.</li><li>Plazo de alegaciones: <b>nunca inferior a veinte días</b> (art. 83.2).</li><li>Quien comparezca <b>no adquiere</b> por ello la condición de interesado, pero tiene derecho a <b>respuesta razonada</b>, que puede ser <b>común</b> para alegaciones sustancialmente iguales (art. 83.3).</li></ul><p><b>La comparación que hay que retener:</b> <b>audiencia</b> = interesados, <b>10 a 15</b> días, obligatoria salvo art. 82.4. <b>Información pública</b> = cualquiera, <b>mínimo 20</b> días, potestativa según la naturaleza del procedimiento.</p>"}];

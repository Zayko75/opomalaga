<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Ley 39/2015 · LPAC · Arts. 84 a 96 · Finalización del procedimiento y tramitación simplificada</title>
<style>

/* ═══════════════════════════════════════════════════════════════
   SISTEMA DE DISEÑO · "Académico Gamificado" · Bloque II
   Temas 8, 9 y 10 · Auxiliar Administrativo
   ═══════════════════════════════════════════════════════════════ */
:root{
  --fs:16px;

  --bg:#faf9f7;
  --bg-grad:radial-gradient(1100px 560px at 12% -8%, #ede9ff 0%, transparent 55%),
            radial-gradient(850px 460px at 96% 0%, #dcf5ee 0%, transparent 50%);
  --surface:#ffffff;
  --surface-2:#f4f3f0;
  --surface-3:#eceae5;
  --line:#e6e3dc;
  --line-strong:#d4d0c7;

  --ink:#15161c;
  --ink-2:#5d616e;
  --ink-3:#8b8f9c;

  --brand:#5b3df5;
  --brand-2:#7c5cff;
  --brand-soft:#efeaff;
  --brand-ring:rgba(91,61,245,.18);

  --legal:#4338ca;  --legal-bg:#eeecff;
  --ej:#059669;     --ej-bg:#e4f7f0;
  --warn:#c2690a;   --warn-bg:#fdf1de;
  --exc:#dc2626;    --exc-bg:#ffeceb;

  --ok:#16a34a; --ok-soft:#e7f7ec;
  --mid:#eab308; --mid-soft:#fdf6dd;
  --off:#a1a1aa; --off-soft:#f1f1f3;

  --sh-1:0 1px 2px rgba(20,20,30,.04), 0 2px 8px rgba(20,20,30,.04);
  --sh-2:0 2px 6px rgba(20,20,30,.05), 0 12px 28px rgba(20,20,30,.07);
  --sh-3:0 8px 20px rgba(91,61,245,.13), 0 24px 56px rgba(20,20,30,.10);
  --sh-glow:0 0 0 4px var(--brand-ring);

  --r-sm:9px; --r-md:14px; --r-lg:20px; --r-full:999px;

  --f-display:"Segoe UI Variable Display",system-ui,-apple-system,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-legal:ui-serif,Georgia,Cambria,"Times New Roman",serif;
  --f-mono:ui-monospace,"SF Mono","Cascadia Mono","Segoe UI Mono",Menlo,monospace;

  --t-h1:clamp(1.02rem,.95rem + .3vw,1.2rem);
  --t-h2:clamp(1.2rem,1.05rem + .6vw,1.55rem);
  --t-h3:clamp(1rem,.95rem + .25vw,1.12rem);
  --t-sm:.86rem;
  --t-xs:.75rem;

  --e-out:cubic-bezier(.22,1,.36,1);
  --e-spring:cubic-bezier(.34,1.56,.64,1);

  /* ── Compatibilidad con SVG y contenido generado ── */
  --panel:var(--surface);
  --ink2:var(--ink-2);
  --acc:var(--brand);
  --acc-soft:var(--brand-soft);
  --g:var(--ok); --y:var(--mid); --r:var(--exc);
}

html[data-theme="dark"]{
  --bg:#0a0b0f;
  --bg-grad:radial-gradient(1100px 560px at 12% -8%, #1c1740 0%, transparent 55%),
            radial-gradient(850px 460px at 96% 0%, #08302b 0%, transparent 50%);
  --surface:#13151b;
  --surface-2:#1a1d25;
  --surface-3:#232733;
  --line:#262a34;
  --line-strong:#343947;

  --ink:#eceef4;
  --ink-2:#9ba2b3;
  --ink-3:#6e7585;

  --brand:#8b6dff;
  --brand-2:#a78bff;
  --brand-soft:#1e1a3d;
  --brand-ring:rgba(139,109,255,.22);

  --legal:#a5b4fc; --legal-bg:#191b3a;
  --ej:#34d399;    --ej-bg:#0c2a24;
  --warn:#fbbf24;  --warn-bg:#2e2110;
  --exc:#fb7185;   --exc-bg:#331119;

  --ok:#4ade80; --ok-soft:#0e2a19;
  --mid:#facc15; --mid-soft:#2c2610;
  --off:#5b6070; --off-soft:#1c1f27;

  --sh-1:0 1px 2px rgba(0,0,0,.3), 0 2px 8px rgba(0,0,0,.25);
  --sh-2:0 2px 6px rgba(0,0,0,.35), 0 12px 28px rgba(0,0,0,.4);
  --sh-3:0 8px 20px rgba(139,109,255,.2), 0 24px 56px rgba(0,0,0,.5);
}

*,*::before,*::after{box-sizing:border-box}
html{font-size:var(--fs);scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);background-image:var(--bg-grad);
  background-attachment:fixed;background-repeat:no-repeat;
  color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.68;
  -webkit-font-smoothing:antialiased;
  transition:background-color .5s var(--e-out),color .3s;
}
::selection{background:var(--brand);color:#fff}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{font-family:var(--f-display);letter-spacing:-.022em;line-height:1.2}
.num{font-variant-numeric:tabular-nums}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:99px;border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3)}

/* ═══ HEADER ═══ */
header.top{
  position:sticky;top:0;z-index:60;
  background:color-mix(in srgb,var(--surface) 80%,transparent);
  backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);
  border-bottom:1px solid var(--line);
}
.top-in{max-width:1280px;margin:0 auto;padding:.65rem 1.1rem;display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.brandwrap{display:flex;align-items:center;gap:.65rem;min-width:0;flex:1}
.mark{
  width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;
  font-weight:800;font-size:.8rem;letter-spacing:-.02em;text-decoration:none;
  box-shadow:0 4px 14px var(--brand-ring);
  transition:transform .3s var(--e-spring),box-shadow .3s;
}
.mark:hover{transform:rotate(-8deg) scale(1.08);box-shadow:var(--sh-3);text-decoration:none}
.top h1{font-size:var(--t-h1);margin:0;font-weight:800;line-height:1.25;min-width:0}
.top h1 .sub{display:block;font-size:var(--t-xs);color:var(--ink-2);font-weight:500;letter-spacing:0;
  margin-top:.1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tools{margin-left:auto;display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}

button,select,input[type=search]{
  font:inherit;font-size:var(--t-sm);font-weight:600;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:var(--r-sm);padding:.4rem .72rem;cursor:pointer;
  position:relative;overflow:hidden;
  transition:transform .18s var(--e-spring),border-color .2s,background .2s,box-shadow .2s,color .2s;
}
button:hover{transform:translateY(-1.5px);border-color:var(--brand);box-shadow:var(--sh-1)}
button:active{transform:translateY(0) scale(.97)}
button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible{outline:none;box-shadow:var(--sh-glow)}
input[type=search]{min-width:190px;cursor:text;font-weight:500}
input[type=search]:focus{border-color:var(--brand)}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--surface-2);padding:2px;gap:2px}
.seg button{border:0;border-radius:calc(var(--r-sm) - 2px);padding:.32rem .68rem;background:transparent;box-shadow:none}
.seg button:hover{transform:none;background:var(--surface)}
.seg button[aria-pressed="true"]{background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;box-shadow:0 2px 8px var(--brand-ring)}

.ripple{position:absolute;border-radius:50%;transform:scale(0);background:currentColor;opacity:.25;animation:rip .55s linear;pointer-events:none}
@keyframes rip{to{transform:scale(3.4);opacity:0}}

.progress{position:absolute;left:0;bottom:-1px;height:2.5px;width:0;
  background:linear-gradient(90deg,var(--brand),var(--legal),var(--ej));transition:width .1s linear}

/* ═══ LAYOUT ═══ */
.layout{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:270px 1fr;gap:1.8rem;padding:1.4rem 1.1rem 5rem}
main{min-width:0}

/* ═══ SIDEBAR ═══ */
nav.side{
  position:sticky;top:76px;align-self:start;max-height:calc(100vh - 96px);overflow:auto;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:.85rem;box-shadow:var(--sh-1);
}
nav.side h2{font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);
  margin:.5rem .4rem .5rem;font-weight:800}
nav.side h2:first-child{margin-top:.1rem}
nav.side a{
  display:flex;align-items:baseline;gap:.5rem;padding:.36rem .55rem;border-radius:var(--r-sm);
  text-decoration:none;color:var(--ink-2);font-size:var(--t-sm);font-weight:500;
  position:relative;transition:background .22s,color .22s,transform .22s var(--e-out);
}
nav.side a:hover{background:var(--surface-2);color:var(--ink);transform:translateX(3px);text-decoration:none}
nav.side a.on{background:var(--brand-soft);color:var(--brand);font-weight:700}
nav.side a.on::before{content:"";position:absolute;left:-.85rem;top:20%;bottom:20%;width:3px;
  border-radius:0 3px 3px 0;background:var(--brand)}
nav.side a b{color:var(--ink-3);font-weight:800;font-size:var(--t-xs);font-variant-numeric:tabular-nums;flex:none;min-width:1.9em}
nav.side a.on b{color:var(--brand)}
.navtoggle{display:none}

/* ═══ TARJETAS ═══ */
section.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:1.35rem 1.5rem;margin-bottom:1.1rem;box-shadow:var(--sh-1);
  transition:box-shadow .3s var(--e-out),border-color .3s;
}
section.card:hover{box-shadow:var(--sh-2)}
section.card>h2{
  margin:0 0 1rem;font-size:var(--t-h2);font-weight:800;
  display:flex;align-items:center;gap:.6rem;
}
section.card>h2::before{
  content:"";width:4px;height:1.05em;border-radius:99px;flex:none;
  background:linear-gradient(180deg,var(--brand),var(--brand-2));
}

/* ═══ ARTÍCULO ═══ */
.art{scroll-margin-top:86px;padding-top:.4rem}
.art + .art{margin-top:1.6rem;padding-top:1.6rem;border-top:1px dashed var(--line)}
.art h2{display:flex;flex-wrap:wrap;gap:.5rem;align-items:baseline;font-size:var(--t-h3);
  margin:0 0 .25rem;font-weight:800;letter-spacing:-.015em}
.art h2 .num{
  color:var(--brand);font-weight:800;font-family:var(--f-display);
  background:var(--brand-soft);padding:.1rem .5rem;border-radius:var(--r-sm);
  font-size:.92em;letter-spacing:-.02em;
}
.ubic{font-size:var(--t-xs);color:var(--ink-3);margin:0 0 .8rem;font-weight:600;
  letter-spacing:.03em;text-transform:uppercase}

/* ═══ IDEA CLAVE ═══ */
.idea{
  background:linear-gradient(100deg,var(--brand-soft),color-mix(in srgb,var(--brand-soft) 40%,transparent));
  border-left:4px solid var(--brand);border-radius:0 var(--r-md) var(--r-md) 0;
  padding:.75rem 1rem;font-weight:650;margin:.7rem 0 1rem;position:relative;
  font-size:.97rem;line-height:1.55;
}

/* ═══ ACORDEÓN ═══ */
details.panel{
  border:1px solid var(--line);border-radius:var(--r-md);margin:.6rem 0;
  background:var(--surface);overflow:hidden;
  transition:border-color .25s,box-shadow .25s,background .25s;
}
details.panel:hover{border-color:var(--line-strong)}
details.panel[open]{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-ring)}
details.panel>summary{
  cursor:pointer;padding:.62rem .9rem;font-weight:700;font-size:.93rem;
  list-style:none;display:flex;align-items:center;gap:.55rem;
  transition:background .2s,color .2s;
}
details.panel>summary:hover{background:var(--surface-2)}
details.panel[open]>summary{background:var(--brand-soft);color:var(--brand)}
details.panel>summary::-webkit-details-marker{display:none}
details.panel>summary::before{
  content:"";width:16px;height:16px;flex:none;border-radius:5px;
  background:var(--brand-soft);position:relative;transition:transform .3s var(--e-spring),background .25s;
}
details.panel>summary::after{
  content:"";position:absolute;width:0;height:0;margin-left:5px;
  border:4px solid transparent;border-left-color:var(--brand);
  transition:transform .3s var(--e-spring);
}
details.panel[open]>summary::before{background:var(--surface)}
details.panel[open]>summary::after{transform:rotate(90deg) translateX(-1px)}
details.panel .body{padding:.3rem 1rem 1rem;font-size:.95rem;animation:slidein .35s var(--e-out)}
@keyframes slidein{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* ═══ TEXTO LEGAL ═══ */
.legal{
  background:var(--legal-bg);border-left:4px solid var(--legal);
  border-radius:0 var(--r-md) var(--r-md) 0;padding:.85rem 1.05rem;
  font-family:var(--f-legal);font-size:.95rem;line-height:1.7;
}
.legal p{margin:.45rem 0}
.legal .lbl{
  font-family:var(--f-body);font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;
  color:var(--legal);font-weight:800;display:block;margin-bottom:.4rem;
}

/* ═══ CAJAS SEMÁNTICAS ═══ */
.box{
  border-left:4px solid var(--line);border-radius:0 var(--r-md) var(--r-md) 0;
  padding:.72rem .95rem;margin:.65rem 0;font-size:.94rem;
  transition:transform .25s var(--e-out),box-shadow .25s;
}
.box:hover{transform:translateX(3px);box-shadow:var(--sh-1)}
.box.ej{background:var(--ej-bg);border-color:var(--ej)}
.box.warn{background:var(--warn-bg);border-color:var(--warn)}
.box.exc{background:var(--exc-bg);border-color:var(--exc)}
.box .lbl{font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;font-weight:800;
  display:block;margin-bottom:.3rem}
.box.ej .lbl{color:var(--ej)}
.box.warn .lbl{color:var(--warn)}
.box.exc .lbl{color:var(--exc)}

.interp{
  border:1px dashed var(--warn);background:color-mix(in srgb,var(--warn-bg) 45%,transparent);
  border-radius:var(--r-md);padding:.65rem .9rem;font-size:.9rem;margin:.6rem 0;
}
.interp .lbl{font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;color:var(--warn);font-weight:800;display:block}

/* ═══ TABLAS ═══ */
table{width:100%;border-collapse:separate;border-spacing:0;font-size:.9rem;margin:.7rem 0;
  border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
th,td{padding:.5rem .68rem;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
td + td, th + th{border-left:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th{background:var(--surface-2);font-size:var(--t-xs);font-weight:800;letter-spacing:.05em;
  text-transform:uppercase;color:var(--ink-2);position:sticky;top:0}
tbody tr{transition:background .18s}
tbody tr:nth-child(even){background:color-mix(in srgb,var(--surface-2) 45%,transparent)}
tbody tr:hover{background:var(--brand-soft)}
th.sortable{cursor:pointer;user-select:none;transition:color .2s,background .2s}
th.sortable:hover{color:var(--brand);background:var(--brand-soft)}
th.sortable::after{content:" ⇅";color:var(--ink-3);font-size:.7rem}

ul,ol{margin:.5rem 0 .5rem 1.2rem;padding:0}
li{margin:.26rem 0}
li::marker{color:var(--brand);font-weight:700}

/* ═══ TOOLTIPS ═══ */
.t{border-bottom:1.5px dotted var(--brand);cursor:help;position:relative;
  transition:background .2s,color .2s}
.t:hover{background:var(--brand-soft);color:var(--brand);border-radius:3px}
#tip{
  position:fixed;z-index:99;max-width:330px;background:var(--ink);color:var(--bg);
  padding:.6rem .78rem;border-radius:var(--r-md);font-size:.82rem;line-height:1.5;
  display:none;box-shadow:0 8px 30px rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.08);
}
html[data-theme="dark"] #tip{background:#f0f1f5;color:#15161c}

/* ═══ FLECHAS DE DIAGRAMA ═══
   Un <path> con stroke pero sin fill toma el valor inicial (negro) y el
   navegador cierra el trazo implícitamente: aparece un triángulo relleno
   entre sus extremos. Forzamos fill:none para dejar solo la línea + la
   punta del <marker>, que sí lleva su color. */
svg path[stroke]:not([fill]){fill:none}
svg polyline:not([fill]){fill:none}
svg line{fill:none}

/* ═══ SVG ═══ */
svg{max-width:100%;height:auto;display:block;margin:.9rem auto}
svg text{font-family:var(--f-body)}

/* ═══ BUSCADOR ═══ */
mark.hit{background:linear-gradient(180deg,transparent 55%,#ffe066 55%);color:inherit;
  border-radius:2px;padding:0 1px;font-weight:600}
html[data-theme="dark"] mark.hit{background:linear-gradient(180deg,transparent 55%,#8a6d00 55%);color:#fff}

/* ═══ UTILIDADES ═══ */
.hide{display:none !important}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.small{font-size:var(--t-sm);color:var(--ink-2)}
.chip{
  display:inline-block;font-size:var(--t-xs);padding:.16rem .55rem;border-radius:var(--r-full);
  background:var(--brand-soft);color:var(--brand);font-weight:800;letter-spacing:.02em;
}

/* ═══ HUECOS RELLENABLES ═══ */
.gap{
  display:inline-block;min-width:5.5em;border-bottom:2px solid var(--brand);
  text-align:center;font-weight:700;color:transparent;cursor:pointer;
  transition:color .3s,background .3s;
}
.gap.on,.gap:hover{color:var(--brand);background:var(--brand-soft);border-radius:4px 4px 0 0}

/* ═══ REVELAR SOLUCIÓN ═══ */
.revelar{
  background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;border-color:transparent;
  font-weight:700;
}
.revelar:hover{box-shadow:var(--sh-3)}
.sol{
  margin-top:.7rem;padding:.8rem 1rem;border-radius:var(--r-md);
  background:var(--ej-bg);border-left:4px solid var(--ej);
  animation:slidein .4s var(--e-out);
}

/* ═══ TEST ═══ */
.opt{
  display:block;padding:.55rem .85rem;margin:.35rem 0;border:1.5px solid var(--line);
  border-radius:var(--r-md);cursor:pointer;background:var(--surface);font-size:.94rem;
  transition:border-color .22s,background .22s,transform .22s var(--e-out);
}
.opt:hover{border-color:var(--brand);background:var(--brand-soft);transform:translateX(4px)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft);font-weight:650}
.opt.ko{border-color:var(--exc);background:var(--exc-bg)}
.opt input{margin-right:.5rem;accent-color:var(--brand)}

#tscore,#semres{
  font-family:var(--f-display);font-weight:800;font-size:1.15rem;letter-spacing:-.02em;
}

/* ═══════════════════════════════════════════════════════════════
   FLASHCARDS 3D · mazo con giro, vuelo de salida y sheen
   ═══════════════════════════════════════════════════════════════ */
#flash{--fc-e:cubic-bezier(.2,.8,.25,1);--fc-h:250px}

/* — Escena — */
.fc-stage{
  perspective:1400px;perspective-origin:50% 45%;
  padding:.4rem 0 .2rem;position:relative;
}
.fc-deck{position:relative;height:var(--fc-h);will-change:transform}

/* — Cartas fantasma del mazo — */
.fc-ghost{
  position:absolute;inset:0;border-radius:var(--r-lg);
  background:var(--surface);border:1px solid var(--line);
  transition:transform .5s var(--fc-e),opacity .5s var(--fc-e);
}
.fc-ghost.g1{transform:translateY(9px) scale(.972);opacity:.75}
.fc-ghost.g2{transform:translateY(18px) scale(.944);opacity:.45}
.fc-deck.empty .fc-ghost{opacity:0;transform:translateY(26px) scale(.9)}

/* — Elevación durante el giro — */
.fc-lift{position:absolute;inset:0;transform-style:preserve-3d}
.fc-lift.lift{animation:fcLift .78s var(--fc-e)}
@keyframes fcLift{
  0%,100%{transform:scale(1) translateY(0)}
  45%{transform:scale(1.055) translateY(-16px)}
}
.fc-lift.out-ok{animation:fcOut .5s cubic-bezier(.5,0,.75,0) forwards}
.fc-lift.out-ko{animation:fcOutKo .5s cubic-bezier(.5,0,.75,0) forwards}
.fc-lift.in{animation:fcIn .48s var(--fc-e)}
@keyframes fcOut{
  0%{transform:translateX(0) rotate(0) scale(1);opacity:1}
  100%{transform:translateX(130%) rotate(17deg) scale(.85);opacity:0}
}
@keyframes fcOutKo{
  0%{transform:translateX(0) rotate(0) scale(1);opacity:1}
  100%{transform:translateX(-130%) rotate(-17deg) scale(.85);opacity:0}
}
@keyframes fcIn{
  0%{transform:translateY(26px) scale(.9);opacity:0}
  100%{transform:translateY(0) scale(1);opacity:1}
}

/* — La carta — */
.fc-card{
  position:absolute;inset:0;transform-style:preserve-3d;
  transition:transform .78s var(--fc-e);
  cursor:pointer;border-radius:var(--r-lg);
}
.fc-card:focus-visible{outline:none}
.fc-card:focus-visible .fc-face{box-shadow:var(--sh-glow),var(--sh-2)}

/* — Caras — */
.fc-face{
  position:absolute;inset:0;border-radius:var(--r-lg);
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  padding:2rem 2.2rem;text-align:center;overflow:hidden;
  box-shadow:var(--sh-2);
  transition:box-shadow .4s var(--fc-e);
}
.fc-card:hover .fc-face{box-shadow:var(--sh-3)}

/* Anverso · pregunta */
.fc-front{
  background:
    radial-gradient(120% 90% at 50% -20%, var(--brand-soft) 0%, transparent 60%),
    var(--surface);
  border:1.5px solid var(--line);color:var(--ink);
}
/* Reverso · respuesta */
.fc-back{
  transform:rotateY(180deg);
  background:linear-gradient(145deg,var(--brand) 0%,#6d4bf7 45%,var(--c5,#0891b2) 130%);
  border:1.5px solid transparent;color:#fff;
}
html[data-theme="dark"] .fc-back{
  background:linear-gradient(145deg,#5f45c9 0%,#4b3aa8 45%,#0e6b85 130%);
}
.fc-back .fc-txt{color:#fff}
.fc-back b,.fc-back strong{color:#fff;font-weight:800}

/* — Sheen que barre al girar — */
.fc-face::after{
  content:"";position:absolute;top:-60%;left:-70%;width:55%;height:220%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.42),transparent);
  transform:rotate(18deg);opacity:0;pointer-events:none;
}
.fc-lift.lift .fc-face::after{animation:fcSheen .78s var(--fc-e)}
@keyframes fcSheen{
  0%{opacity:0;left:-70%}
  35%{opacity:1}
  100%{opacity:0;left:150%}
}

/* — Etiqueta superior — */
.fc-tag{
  position:absolute;top:1rem;left:1.15rem;
  font-size:var(--t-xs);font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  display:inline-flex;align-items:center;gap:.4rem;
}
.fc-front .fc-tag{color:var(--brand)}
.fc-back .fc-tag{color:rgba(255,255,255,.9)}
.fc-tag::before{
  content:"";width:7px;height:7px;border-radius:50%;background:currentColor;
  animation:fcPulse 2.2s ease-in-out infinite;
}
@keyframes fcPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.65)}}

/* — Índice tipo naipe — */
.fc-pip{
  position:absolute;font-family:var(--f-display);font-weight:800;
  font-size:.78rem;letter-spacing:-.02em;opacity:.34;font-variant-numeric:tabular-nums;
}
.fc-pip.tr{top:1rem;right:1.15rem}
.fc-pip.bl{bottom:1rem;left:1.15rem;transform:rotate(180deg)}
.fc-front .fc-pip{color:var(--ink-2)}
.fc-back .fc-pip{color:#fff;opacity:.55}

/* — Texto — */
.fc-txt{
  font-size:clamp(1rem,.9rem + .55vw,1.28rem);font-weight:650;line-height:1.5;
  max-width:44ch;letter-spacing:-.012em;
}
.fc-front .fc-txt{font-family:var(--f-display);font-weight:700}
.fc-back .fc-txt{font-weight:600;line-height:1.6}
.fc-hint{
  position:absolute;bottom:1rem;left:0;right:0;
  font-size:var(--t-xs);font-weight:600;letter-spacing:.02em;
  display:flex;align-items:center;justify-content:center;gap:.4rem;
}
.fc-front .fc-hint{color:var(--ink-3)}
.fc-back .fc-hint{color:rgba(255,255,255,.72)}
.fc-hint .kbd{
  font-family:var(--f-mono);font-size:.68rem;font-weight:700;padding:.1rem .32rem;
  border-radius:5px;border:1px solid currentColor;opacity:.75;
}

/* — Pantalla final — */
.fc-done{
  position:absolute;inset:0;border-radius:var(--r-lg);
  background:linear-gradient(150deg,var(--ok-soft),var(--surface) 70%);
  border:1.5px solid var(--ok);
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  text-align:center;padding:2rem;gap:.35rem;
  animation:fcIn .5s var(--fc-e);box-shadow:var(--sh-2);
}
.fc-done .seal{
  font-size:2.6rem;line-height:1;
  animation:fcSeal .7s cubic-bezier(.2,1.5,.4,1);
}
@keyframes fcSeal{0%{transform:scale(0) rotate(-25deg);opacity:0}60%{transform:scale(1.2) rotate(6deg)}100%{transform:scale(1) rotate(0);opacity:1}}
.fc-done h3{font-size:1.3rem;font-weight:800;margin:.2rem 0 0}
.fc-done p{margin:0;color:var(--ink-2);font-size:var(--t-sm)}

/* — Barra de progreso de la ronda — */
.fc-bar{
  height:6px;border-radius:99px;background:var(--surface-3);
  overflow:hidden;margin:.95rem 0 .8rem;position:relative;
}
.fc-bar i{
  display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--brand),var(--c5,#0891b2));
  transition:width .55s var(--fc-e);
}

/* — Controles — */
.fc-ctrls{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.fc-ctrls button{font-weight:700}
#fcok{border-color:var(--ok);color:var(--ok)}
#fcok:hover{background:var(--ok);color:#fff;border-color:var(--ok)}
#fcko{border-color:var(--warn);color:var(--warn)}
#fcko:hover{background:var(--warn);color:#fff;border-color:var(--warn)}
#fcflip{background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;border-color:transparent}
#fcflip:hover{box-shadow:var(--sh-3)}

.fc-score{display:inline-flex;gap:.45rem;margin-left:auto;align-items:center}
.fc-pill{
  font-size:var(--t-xs);font-weight:800;padding:.24rem .6rem;border-radius:var(--r-full);
  font-variant-numeric:tabular-nums;border:1px solid;
}
.fc-pill.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.fc-pill.ko{color:var(--warn);border-color:var(--warn);background:var(--warn-bg)}
.fc-pill.left{color:var(--ink-2);border-color:var(--line);background:var(--surface-2)}
.fc-pill.bump{animation:fcBump .45s var(--e-spring)}
@keyframes fcBump{0%{transform:scale(1)}45%{transform:scale(1.28)}100%{transform:scale(1)}}

@media(max-width:620px){
  #flash{--fc-h:270px}
  .fc-face{padding:1.7rem 1.3rem}
  .fc-score{margin-left:0;width:100%}
}
@media(prefers-reduced-motion:reduce){
  .fc-card{transition:none}
  .fc-lift.lift,.fc-lift.in,.fc-lift.out-ok,.fc-lift.out-ko,.fc-face::after{animation:none !important}
}
@media print{.fc-stage,.fc-ctrls,.fc-bar{display:none !important}}
/* ═══ RESPUESTA ESTRUCTURADA ═══ */
.fc-face{justify-content:center}
.fc-face.struct{justify-content:flex-start;text-align:left;padding-top:3.1rem;padding-bottom:3.1rem}
.fc-body{
  width:100%;max-width:46ch;margin:0 auto;
  overflow-y:auto;max-height:100%;
  scrollbar-width:thin;
}
.fc-body::-webkit-scrollbar{width:5px}
.fc-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.35);border-radius:99px;border:0}
.fc-front .fc-body::-webkit-scrollbar-thumb{background:var(--line-strong)}

/* — Veredicto Sí / No — */
.fc-verdict{
  display:inline-flex;align-items:center;gap:.35rem;
  font-family:var(--f-display);font-weight:800;font-size:.82rem;
  letter-spacing:.06em;text-transform:uppercase;
  padding:.26rem .72rem;border-radius:var(--r-full);margin-bottom:.85rem;
  border:1.5px solid;animation:fcPopIn .45s var(--e-spring) backwards;animation-delay:.34s;
}
.fc-verdict.si{background:rgba(255,255,255,.16);border-color:rgba(190,255,215,.85);color:#d8ffe9}
.fc-verdict.no{background:rgba(255,255,255,.16);border-color:rgba(255,205,205,.85);color:#ffdedd}
@keyframes fcPopIn{0%{opacity:0;transform:scale(.7) translateY(6px)}100%{opacity:1;transform:none}}

/* — Párrafo — */
.fc-p{margin:0;font-size:clamp(1rem,.92rem + .45vw,1.2rem);font-weight:600;line-height:1.6}
.fc-face.struct .fc-p{font-size:clamp(.96rem,.9rem + .35vw,1.1rem)}

/* — Lista enumerada — */
.fc-list{list-style:none;margin:0;padding:0;display:grid;gap:.5rem;counter-reset:fc}
.fc-list li{
  counter-increment:fc;position:relative;margin:0;
  padding:.42rem .6rem .42rem 2.5rem;border-radius:var(--r-sm);
  background:rgba(255,255,255,.11);
  font-size:clamp(.92rem,.88rem + .3vw,1.04rem);font-weight:600;line-height:1.45;
  animation:fcRow .42s var(--e-out) backwards;
}
.fc-list li::before{
  content:counter(fc);position:absolute;left:.6rem;top:50%;transform:translateY(-50%);
  width:1.6rem;height:1.6rem;border-radius:50%;
  display:grid;place-items:center;
  background:rgba(255,255,255,.9);color:var(--brand);
  font-family:var(--f-display);font-weight:800;font-size:.78rem;
  font-variant-numeric:tabular-nums;
}
.fc-list.alpha li::before{content:counter(fc,lower-alpha)}
.fc-list li:nth-child(1){animation-delay:.36s}
.fc-list li:nth-child(2){animation-delay:.42s}
.fc-list li:nth-child(3){animation-delay:.48s}
.fc-list li:nth-child(4){animation-delay:.54s}
.fc-list li:nth-child(5){animation-delay:.60s}
.fc-list li:nth-child(n+6){animation-delay:.66s}
@keyframes fcRow{0%{opacity:0;transform:translateX(-12px)}100%{opacity:1;transform:none}}

/* — Cláusulas contrapuestas — */
.fc-clauses{display:grid;gap:.45rem}
.fc-clauses p{
  margin:0;padding:.45rem .7rem .45rem .95rem;border-radius:0 var(--r-sm) var(--r-sm) 0;
  background:rgba(255,255,255,.11);border-left:3px solid rgba(255,255,255,.55);
  font-size:clamp(.92rem,.88rem + .3vw,1.04rem);font-weight:600;line-height:1.5;
  animation:fcRow .42s var(--e-out) backwards;
}
.fc-clauses p:nth-child(1){animation-delay:.36s}
.fc-clauses p:nth-child(2){animation-delay:.44s}
.fc-clauses p:nth-child(3){animation-delay:.52s}

/* — Negritas resaltadas en el reverso — */
.fc-back .fc-body b,.fc-back .fc-body strong{
  font-weight:800;background:rgba(255,255,255,.2);
  padding:.03em .3em;border-radius:5px;
  box-decoration-break:clone;-webkit-box-decoration-break:clone;
}

/* — Cita legal al pie — */
.fc-cite{
  position:absolute;bottom:.95rem;left:0;right:0;
  display:inline-flex;align-items:center;justify-content:center;gap:.4rem;
  font-family:var(--f-mono);font-size:.74rem;font-weight:700;letter-spacing:.02em;
  color:rgba(255,255,255,.82);
  animation:fcPopIn .5s var(--e-out) backwards;animation-delay:.5s;
}
.fc-cite::before,.fc-cite::after{
  content:"";height:1px;width:clamp(18px,10%,52px);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.45));
}
.fc-cite::after{background:linear-gradient(90deg,rgba(255,255,255,.45),transparent)}
.fc-cite .s{font-size:.9rem;opacity:.75;font-family:var(--f-legal)}
.fc-front .fc-cite{color:var(--ink-3)}
.fc-front .fc-cite::before{background:linear-gradient(90deg,transparent,var(--line-strong))}
.fc-front .fc-cite::after{background:linear-gradient(90deg,var(--line-strong),transparent)}

/* la pista se oculta si hay cita, para no amontonar */
.fc-back .fc-cite ~ .fc-hint,.fc-back .fc-hint.muted{display:none}

@media(max-width:620px){
  #flash{--fc-h:320px}
  .fc-face.struct{padding-top:2.9rem;padding-bottom:2.8rem}
  .fc-list li{padding-left:2.3rem}
}
@media(prefers-reduced-motion:reduce){
  .fc-verdict,.fc-list li,.fc-clauses p,.fc-cite{animation:none !important}
}

/* ═══ SEMÁFORO ═══ */
.sembtn{
  border-radius:var(--r-full);padding:.32rem .7rem;font-weight:700;font-size:var(--t-sm);
}
.sembtn[data-v="g"]:hover,.sembtn.on[data-v="g"]{background:var(--ok);color:#fff;border-color:var(--ok)}
.sembtn[data-v="y"]:hover,.sembtn.on[data-v="y"]{background:var(--mid);color:#3d2f00;border-color:var(--mid)}
.sembtn[data-v="r"]:hover,.sembtn.on[data-v="r"]{background:var(--exc);color:#fff;border-color:var(--exc)}

/* ═══ CTA DE BLOQUE ═══ */
a.blk{
  display:inline-flex;align-items:center;gap:.5rem;
  background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;
  padding:.5rem .95rem;border-radius:var(--r-sm);font-weight:700;font-size:var(--t-sm);
  text-decoration:none;box-shadow:0 2px 10px var(--brand-ring);
  transition:transform .22s var(--e-spring),box-shadow .25s,gap .25s var(--e-out);
}
a.blk:hover{transform:translateY(-2px);box-shadow:var(--sh-3);gap:.75rem;text-decoration:none}
a.blk::after{content:"→"}
a.blk:active{transform:translateY(0) scale(.98)}

/* ═══ REVEAL ═══ */
.rv{opacity:0;transform:translateY(20px);transition:opacity .6s var(--e-out),transform .6s var(--e-out)}
.rv.in{opacity:1;transform:none}

/* ═══ RESPONSIVE ═══ */
@media(max-width:960px){
  .layout{grid-template-columns:1fr;padding-top:.9rem;gap:1rem}
  nav.side{position:static;max-height:none}
  nav.side.collapsed .navbody{display:none}
  .navtoggle{display:block;width:100%;text-align:left;font-weight:700}
  .grid2{grid-template-columns:1fr}
  .top h1 .sub{white-space:normal}
}
@media(max-width:620px){
  .top-in{padding:.55rem .8rem}
  .tools{width:100%;margin-left:0}
  input[type=search]{flex:1;min-width:0}
  section.card{padding:1.05rem 1rem;border-radius:var(--r-md)}
  table{font-size:.82rem}
  th,td{padding:.4rem .5rem}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
  .rv{opacity:1;transform:none}
}
@media print{
  header.top,nav.side,.tools,.noprint,.progress{display:none !important}
  body{background:#fff;background-image:none;font-size:11pt;color:#000}
  .layout{display:block;max-width:none;padding:0}
  section.card{border:0;padding:0;margin:0 0 1rem;break-inside:avoid;box-shadow:none}
  details.panel{border:0;box-shadow:none}
  details.panel .body{display:block !important}
  details.panel>summary{padding-left:0}
  .art{break-inside:avoid}
  .rv{opacity:1;transform:none}
  a{color:#000;text-decoration:none}
}


/* ═══ ALTURA ADAPTATIVA DE LA TARJETA ═══ */
.fc-deck{transition:height .45s var(--fc-e)}
.fc-body{max-height:none;overflow:visible}
.fc-measure{
  position:absolute;left:0;right:0;top:0;height:auto;
  visibility:hidden;pointer-events:none;z-index:-1;
}
.fc-measure .fc-face{
  position:relative;inset:auto;height:auto;min-height:0;
  box-shadow:none;backface-visibility:visible;transform:none;
}
.fc-measure .fc-body{max-height:none;overflow:visible}
.fc-measure .fc-face::after{display:none}

/* ═══ MOSTRAR / OCULTAR ÍNDICE LATERAL ═══ */
.layout{transition:grid-template-columns .42s var(--e-out)}
.layout.nonav{grid-template-columns:0 1fr;gap:0}
.layout.nonav>nav.side{
  opacity:0;transform:translateX(-14px);pointer-events:none;
  padding:0;border-width:0;overflow:hidden;width:0;min-width:0;
}
nav.side{
  transition:opacity .3s var(--e-out),transform .38s var(--e-out);
  overflow-x:hidden;
}
#navhide .ic{display:inline-block;transition:transform .35s var(--e-spring);font-size:.95em;line-height:1}
#navhide[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
#navhide[aria-pressed="true"] .ic{transform:rotate(90deg)}
@media(max-width:960px){#navhide{display:none}}

/* ═══════════════════════════════════════════════════════════════
   LECTURA EN VOZ ALTA (TTS) del texto legal
   ═══════════════════════════════════════════════════════════════ */
.tts-bar{
  display:flex;align-items:center;gap:.45rem;flex-wrap:wrap;
  margin:.15rem 0 .7rem;
}
.tts-bar button{
  font-size:var(--t-xs);font-weight:700;padding:.3rem .62rem;
  border-radius:var(--r-full);border:1px solid var(--legal);
  background:transparent;color:var(--legal);
  display:inline-flex;align-items:center;gap:.35rem;line-height:1.2;
}
.tts-bar button:hover{background:var(--legal);color:var(--surface);border-color:var(--legal)}
.tts-bar button[hidden]{display:none}
.tts-bar .tts-play.on{background:var(--legal);color:var(--surface)}

/* Ondas de audio mientras lee */
.tts-wave{display:inline-flex;align-items:flex-end;gap:2px;height:11px}
.tts-wave i{
  width:2.5px;background:currentColor;border-radius:2px;height:35%;
  animation:ttsW .9s ease-in-out infinite;
}
.tts-wave i:nth-child(2){animation-delay:.15s}
.tts-wave i:nth-child(3){animation-delay:.3s}
.tts-wave i:nth-child(4){animation-delay:.45s}
@keyframes ttsW{0%,100%{height:32%}50%{height:100%}}

.tts-time{
  font-family:var(--f-mono);font-size:.7rem;font-weight:700;
  color:var(--ink-3);font-variant-numeric:tabular-nums;
}

/* Frase que se está leyendo */
.tts-s{transition:background .25s,color .25s;border-radius:3px}
.tts-s.now{
  background:linear-gradient(180deg,transparent 8%,color-mix(in srgb,var(--legal) 26%,transparent) 8%);
  box-shadow:0 0 0 2px color-mix(in srgb,var(--legal) 16%,transparent);
}
html[data-theme="dark"] .tts-s.now{
  background:linear-gradient(180deg,transparent 8%,color-mix(in srgb,var(--legal) 34%,transparent) 8%);
}
.legal.tts-on{box-shadow:0 0 0 3px color-mix(in srgb,var(--legal) 20%,transparent)}

/* ═══ Reproductor flotante ═══ */
.tts-mini{
  position:fixed;left:50%;bottom:1.1rem;transform:translateX(-50%) translateY(140%);
  z-index:80;display:flex;align-items:center;gap:.6rem;
  background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  border:1px solid var(--line);border-radius:var(--r-full);
  padding:.5rem .7rem .5rem .95rem;box-shadow:var(--sh-3);
  transition:transform .45s var(--e-spring),opacity .3s;opacity:0;pointer-events:none;
  max-width:min(94vw,540px);
}
.tts-mini.show{transform:translateX(-50%) translateY(0);opacity:1;pointer-events:auto}
.tts-mini .lbl{
  font-size:var(--t-xs);font-weight:800;color:var(--legal);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:16ch;
}
.tts-mini button{
  border-radius:50%;width:32px;height:32px;padding:0;display:grid;place-items:center;
  font-size:.8rem;border:1px solid var(--line);flex:none;
}
.tts-mini button.main{
  width:38px;height:38px;font-size:.95rem;
  background:linear-gradient(140deg,var(--legal),var(--brand));color:#fff;border-color:transparent;
}
.tts-mini .bar{
  flex:1;min-width:70px;height:5px;border-radius:99px;background:var(--surface-3);overflow:hidden;
}
.tts-mini .bar i{display:block;height:100%;width:0;background:var(--legal);
  border-radius:99px;transition:width .35s var(--e-out)}

/* ═══ Panel de ajustes de voz ═══ */
.tts-back{
  position:fixed;inset:0;z-index:90;background:rgba(10,10,18,.45);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  display:grid;place-items:center;padding:1rem;
  opacity:0;pointer-events:none;transition:opacity .3s var(--e-out);
}
.tts-back.show{opacity:1;pointer-events:auto}
.tts-panel{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--sh-3);width:min(94vw,470px);max-height:88vh;overflow:auto;
  padding:1.3rem 1.4rem;transform:translateY(16px) scale(.97);
  transition:transform .38s var(--e-spring);
}
.tts-back.show .tts-panel{transform:none}
.tts-panel h3{
  font-size:1.12rem;font-weight:800;margin:0 0 .25rem;
  display:flex;align-items:center;gap:.5rem;
}
.tts-panel .sub{font-size:var(--t-sm);color:var(--ink-2);margin:0 0 1.1rem}
.tts-row{margin-bottom:1.05rem}
.tts-row > label{
  display:block;font-size:var(--t-xs);font-weight:800;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-2);margin-bottom:.4rem;
}
.tts-seg{display:flex;gap:3px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:3px}
.tts-seg button{
  flex:1;border:0;background:transparent;border-radius:calc(var(--r-sm) - 3px);
  padding:.42rem .3rem;font-size:var(--t-sm);font-weight:700;box-shadow:none;
}
.tts-seg button:hover{transform:none;background:var(--surface)}
.tts-seg button[aria-pressed="true"]{
  background:linear-gradient(140deg,var(--legal),var(--brand));color:#fff;
}
.tts-panel select{
  width:100%;padding:.5rem .6rem;border-radius:var(--r-sm);
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  font-size:var(--t-sm);font-weight:600;cursor:pointer;
}
.tts-panel select:focus{border-color:var(--brand);outline:none}
.tts-slider{display:flex;align-items:center;gap:.75rem}
.tts-slider input[type=range]{flex:1;accent-color:var(--legal);cursor:pointer;height:22px}
.tts-val{
  font-family:var(--f-mono);font-weight:800;font-size:var(--t-sm);
  min-width:3.4em;text-align:right;color:var(--legal);font-variant-numeric:tabular-nums;
}
.tts-note{
  font-size:var(--t-xs);color:var(--ink-2);line-height:1.5;
  background:var(--surface-2);border-radius:var(--r-sm);padding:.6rem .75rem;margin:0 0 1rem;
}
.tts-note b{color:var(--ink)}
.tts-acts{display:flex;gap:.5rem;justify-content:flex-end;flex-wrap:wrap}
.tts-acts .prim{
  background:linear-gradient(140deg,var(--legal),var(--brand));color:#fff;border-color:transparent;
}
.tts-badge{
  font-size:.62rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
  padding:.1rem .35rem;border-radius:4px;background:var(--ej-bg);color:var(--ej);margin-left:.35rem;
}


/* — Variante compacta para los apartados desplegables — */
.tts-bar.mini{margin:0 0 .6rem}
.tts-bar.mini button{
  font-size:.7rem;padding:.24rem .55rem;
  border-color:var(--brand);color:var(--brand);
}
.tts-bar.mini button:hover{background:var(--brand);color:var(--surface)}
.tts-bar.mini .tts-play.on{background:var(--brand);color:var(--surface)}
.tts-bar.mini .tts-time{font-size:.66rem}
.idea .tts-bar.mini{margin:.55rem 0 0}
.legal.tts-on,.body.tts-on,.idea.tts-on{
  box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 20%,transparent)
}
.legal.tts-on{box-shadow:0 0 0 3px color-mix(in srgb,var(--legal) 20%,transparent)}

@media(max-width:620px){
  .tts-mini{left:.6rem;right:.6rem;transform:translateY(140%);max-width:none}
  .tts-mini.show{transform:translateY(0)}
  .tts-mini .lbl{display:none}
}
@media(prefers-reduced-motion:reduce){
  .tts-wave i{animation:none;height:60%}
}
@media print{.tts-bar,.tts-mini,.tts-back{display:none !important}}

const GLOSARIO={"interesado": "Interesado: quien está legitimado para promover un procedimiento o intervenir en él porque es titular de derechos o intereses legítimos afectados por la decisión (art. 4 de la Ley 39/2015).", "conten": "Recurso contencioso-administrativo: impugnación ante los juzgados y tribunales de lo contencioso-administrativo, es decir, ya fuera de la propia Administración.", "silencio": "Silencio administrativo: efecto que la ley anuda a la falta de resolución expresa en plazo. Puede ser estimatorio (positivo) o desestimatorio (negativo) según el procedimiento.", "habil": "Días hábiles: se excluyen del cómputo los sábados, los domingos y los declarados festivos (art. 30.2 de la Ley 39/2015).", "pleno": "Pleno: órgano colegiado formado por todos los concejales o diputados de la entidad local.", "desistimiento": "Desistimiento: abandono de la solicitud concreta, conservando el derecho de fondo. Se puede volver a solicitar lo mismo si no ha prescrito.", "renuncia": "Renuncia: abandono del derecho mismo en que se funda la solicitud. Solo cabe cuando no esté prohibida por el ordenamiento y es irreversible.", "caducidadproc": "Caducidad del procedimiento: terminación por paralización imputable al interesado (art. 95) o por vencimiento del plazo máximo en procedimientos de oficio desfavorables (art. 25.1.b).", "convencional": "Terminación convencional: finalización mediante acuerdos, pactos, convenios o contratos que no sean contrarios al ordenamiento ni versen sobre materias no susceptibles de transacción.", "reconocimiento": "Reconocimiento voluntario de responsabilidad: en lo sancionador, admisión por el infractor de su responsabilidad, que permite resolver de inmediato y aplicar reducciones.", "pagovoluntario": "Pago voluntario: abono de la sanción pecuniaria antes de la resolución, que termina el procedimiento y da derecho a reducción.", "actcomplementarias": "Actuaciones complementarias: actuaciones indispensables acordadas motivadamente antes de resolver. No tienen tal consideración los informes que preceden a la resolución.", "congruenciares": "Congruencia de la resolución: correspondencia entre lo pedido y lo resuelto en los procedimientos iniciados a solicitud, sin agravar la situación inicial.", "cuestionconexa": "Cuestión conexa: cuestión relacionada con el objeto del procedimiento no planteada por los interesados, sobre la que cabe pronunciarse previa puesta de manifiesto.", "simplificada": "Tramitación simplificada: modalidad abreviada del procedimiento común, con trámites tasados y resolución en treinta días.", "propuestasanc": "Propuesta de resolución sancionadora: documento del instructor que fija los hechos probados, su calificación, los responsables y la sanción propuesta.", "archivo": "Archivo de actuaciones: terminación del procedimiento sancionador acordada por el instructor sin propuesta de resolución, en los cinco supuestos del art. 89.1.", "imposibilidad": "Imposibilidad material de continuar: causa sobrevenida que impide seguir el procedimiento; la resolución que la declare debe ser motivada en todo caso."};
const LABELS={"interesado": "Interesado", "conten": "Recurso contencioso-administrativo", "silencio": "Silencio administrativo", "habil": "Días hábiles", "pleno": "Pleno", "desistimiento": "Desistimiento", "renuncia": "Renuncia", "caducidadproc": "Caducidad", "convencional": "Terminación convencional", "reconocimiento": "Reconocimiento de responsabilidad", "pagovoluntario": "Pago voluntario", "actcomplementarias": "Actuaciones complementarias", "congruenciares": "Congruencia", "cuestionconexa": "Cuestión conexa", "simplificada": "Tramitación simplificada", "propuestasanc": "Propuesta de resolución", "archivo": "Archivo de actuaciones", "imposibilidad": "Imposibilidad material"};
</script>
<script>
const ARTS=[{"n": 84, "t": "Terminación", "ubic": "Título IV ▸ Capítulo V (Finalización del procedimiento) ▸ Sección 1.ª (Disposiciones generales)", "idea": "Cinco formas de terminar: resolución, desistimiento, renuncia, caducidad e imposibilidad.", "literal": "<p>1. Pondrán fin al procedimiento la resolución, el desistimiento, la renuncia al derecho en que se funde la solicitud, cuando tal renuncia no esté prohibida por el ordenamiento jurídico, y la declaración de caducidad.</p><p>2. También producirá la terminación del procedimiento la imposibilidad material de continuarlo por causas sobrevenidas. La resolución que se dicte deberá ser motivada en todo caso.</p>", "dis": "<ul>\n<li><b>84.1 — cuatro modos:</b> ponen fin al procedimiento la <b>resolución</b>, el <b><span class=\"t\" data-k=\"desistimiento\">desistimiento</span></b>, la <b><span class=\"t\" data-k=\"renuncia\">renuncia</span> al derecho en que se funde la solicitud</b> —cuando no esté prohibida por el ordenamiento— y la <b>declaración de <span class=\"t\" data-k=\"caducidadproc\">caducidad</span></b>.</li>\n<li><b>84.2 — quinto modo:</b> también termina el procedimiento la <b><span class=\"t\" data-k=\"imposibilidad\">imposibilidad material de continuarlo por causas sobrevenidas</span></b>. La resolución que se dicte deberá ser <b>motivada en todo caso</b>.</li>\n</ul>\n<table><thead><tr><th>Forma</th><th>Quién la provoca</th><th>Efecto sobre el derecho</th></tr></thead><tbody>\n<tr><td><b>Resolución</b></td><td>La Administración</td><td>Decide el fondo</td></tr>\n<tr><td><b>Desistimiento</b></td><td>El interesado (o la Administración, art. 93)</td><td>Se abandona <b>la solicitud</b>: el derecho subsiste</td></tr>\n<tr><td><b>Renuncia</b></td><td>El interesado</td><td>Se abandona <b>el derecho</b>: es irreversible</td></tr>\n<tr><td><b>Caducidad</b></td><td>La inactividad</td><td>Archivo; no prescribe por sí sola</td></tr>\n<tr><td><b>Imposibilidad material</b></td><td>Causa sobrevenida</td><td>Resolución <b>motivada</b> en todo caso</td></tr>\n</tbody></table>", "llano": "<p>Un expediente puede acabar de cinco maneras. Con una decisión, porque tú te retiras —de la petición o del derecho—, porque se paraliza y caduca, o porque ha ocurrido algo que hace imposible seguir. Esta última siempre exige explicación.</p>", "porque": "<p>Enumerar las formas de terminación no es un capricho clasificatorio: cada una produce <b>efectos distintos</b> sobre el derecho de fondo. Desistir permite volver a pedir; renunciar, no. Y la caducidad no extingue el derecho, aunque el procedimiento caducado <b>no interrumpe la prescripción</b> (art. 95.3), lo que puede acabar teniendo el mismo efecto práctico.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> retirar una candidatura no es lo mismo que renunciar a presentarse nunca más.</li>\n<li><b>Real:</b> solicitada una licencia de obra, el interesado <b>desiste</b>: puede volver a solicitarla al año siguiente. Si <b>renunciara</b> al derecho, no.</li>\n<li><b>Caso límite:</b> el inmueble objeto del expediente se derrumba durante la tramitación. Hay <b>imposibilidad material sobrevenida</b>: resolución motivada (art. 84.2).</li>\n</ul>", "noej": "<ul>\n<li><b>No cabe</b> la renuncia cuando esté <b>prohibida por el ordenamiento jurídico</b>.</li>\n<li><b>No es</b> lo mismo desistir que renunciar.</li>\n<li><b>No exime</b> la imposibilidad material de dictar resolución: exige una <b>motivada</b>.</li>\n</ul>", "conex": "<ul>\n<li><b>Arts. 93 y 94 LPAC:</b> desistimiento de la Administración y de los interesados.</li>\n<li><b>Art. 95 LPAC:</b> caducidad por paralización imputable al interesado.</li>\n<li><b>Art. 25.1.b) LPAC:</b> caducidad de los procedimientos de oficio desfavorables.</li>\n<li><b>Art. 86 LPAC:</b> terminación convencional.</li>\n</ul>", "trampas": "<ul>\n<li>Son <b>cinco</b> formas contando la del apartado 2.</li>\n<li>La renuncia solo cabe si <b>no está prohibida</b>.</li>\n<li>La imposibilidad material exige resolución <b>motivada en todo caso</b>.</li>\n</ul>", "ancla": "<p><b>«Resuelvo, te retiras, renuncias, caduca o se vuelve imposible.»</b> Cinco finales.</p>", "vis": "<svg viewBox=\"0 0 660 135\" role=\"img\" aria-label=\"Formas de terminación del procedimiento\">\n<g font-size=\"10\" text-anchor=\"middle\" fill=\"currentColor\">\n<rect x=\"12\" y=\"35\" width=\"122\" height=\"58\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"73\" y=\"60\" font-weight=\"700\" fill=\"var(--acc)\">Resolución</text><text x=\"73\" y=\"78\">decide el fondo</text>\n<rect x=\"142\" y=\"35\" width=\"122\" height=\"58\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"203\" y=\"60\" font-weight=\"700\" fill=\"var(--ej)\">Desistimiento</text><text x=\"203\" y=\"78\">se abandona la solicitud</text>\n<rect x=\"272\" y=\"35\" width=\"122\" height=\"58\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"333\" y=\"60\" font-weight=\"700\" fill=\"var(--warn)\">Renuncia</text><text x=\"333\" y=\"78\">se abandona el derecho</text>\n<rect x=\"402\" y=\"35\" width=\"122\" height=\"58\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"463\" y=\"60\" font-weight=\"700\" fill=\"var(--exc)\">Caducidad</text><text x=\"463\" y=\"78\">archivo</text>\n<rect x=\"532\" y=\"35\" width=\"122\" height=\"58\" rx=\"8\" fill=\"var(--panel)\" stroke=\"var(--line)\"/><text x=\"593\" y=\"60\" font-weight=\"700\">Imposibilidad</text><text x=\"593\" y=\"78\">material sobrevenida</text>\n</g>\n<text x=\"330\" y=\"122\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--ink2)\">La imposibilidad material exige resolución motivada en todo caso</text>\n</svg>"}, {"n": 85, "t": "Terminación en los procedimientos sancionadores", "ubic": "Título IV ▸ Capítulo V (Finalización del procedimiento) ▸ Sección 1.ª (Disposiciones generales)", "idea": "Reconocer la responsabilidad o pagar antes de resolver: al menos un 20 % menos, acumulable.", "literal": "<p>1. Iniciado un procedimiento sancionador, si el infractor reconoce su responsabilidad, se podrá resolver el procedimiento con la imposición de la sanción que proceda.</p><p>2. Cuando la sanción tenga únicamente carácter pecuniario o bien quepa imponer una sanción pecuniaria y otra de carácter no pecuniario pero se ha justificado la improcedencia de la segunda, el pago voluntario por el presunto responsable, en cualquier momento anterior a la resolución, implicará la terminación del procedimiento, salvo en lo relativo a la reposición de la situación alterada o a la determinación de la indemnización por los daños y perjuicios causados por la comisión de la infracción.</p><p>3. En ambos casos, cuando la sanción tenga únicamente carácter pecuniario, el órgano competente para resolver el procedimiento aplicará reducciones de, al menos, el 20 % sobre el importe de la sanción propuesta, siendo éstos acumulables entre sí. Las citadas reducciones, deberán estar determinadas en la notificación de iniciación del procedimiento y su efectividad estará condicionada al desistimiento o renuncia de cualquier acción o recurso en vía administrativa contra la sanción. El porcentaje de reducción previsto en este apartado podrá ser incrementado reglamentariamente.</p>", "dis": "<ul>\n<li><b>85.1 — <span class=\"t\" data-k=\"reconocimiento\">reconocimiento de responsabilidad</span>:</b> iniciado un procedimiento sancionador, si el infractor <b>reconoce su responsabilidad</b>, <b>se podrá resolver</b> con la imposición de la sanción que proceda.</li>\n<li><b>85.2 — <span class=\"t\" data-k=\"pagovoluntario\">pago voluntario</span>:</b> cuando la sanción tenga <b>únicamente carácter pecuniario</b> —o quepa también una no pecuniaria pero se haya justificado su improcedencia—, el <b>pago voluntario</b> en cualquier momento <b>anterior a la resolución</b> implica la <b>terminación del procedimiento</b>, <b>salvo</b> en lo relativo a la <b>reposición de la situación alterada</b> o a la <b>indemnización</b> por los daños causados.</li>\n<li><b>85.3 — reducciones:</b> en ambos casos, con sanción <b>únicamente pecuniaria</b>, se aplicarán reducciones de <b>al menos el 20 %</b> sobre el importe de la sanción propuesta, <b>acumulables entre sí</b>. Deben constar en la <b>notificación de iniciación</b> y su efectividad está <b>condicionada al desistimiento o renuncia de cualquier acción o recurso</b> en vía administrativa contra la sanción. El porcentaje puede <b>incrementarse reglamentariamente</b>.</li>\n</ul>\n<div class=\"box warn\"><span class=\"lbl\">El precio de la rebaja</span>La reducción <b>no es gratis</b>: exige <b>desistir o renunciar a recurrir</b>. Y como son <b>acumulables</b>, reconocer la responsabilidad <b>y</b> pagar puede suponer un <b>40 %</b> menos.</div>", "llano": "<p>Si admites que has cometido la infracción, o si pagas antes de que resuelvan, te aplican al menos un 20 % de rebaja, y las dos rebajas se suman. A cambio, renuncias a recurrir. Y pagar no te libra de reparar el daño causado ni de indemnizar.</p>", "porque": "<p>Es una lógica de <b>eficiencia</b>: el procedimiento sancionador consume recursos y acaba muchas veces en los tribunales. Ofrecer una rebaja a cambio de la aceptación reduce litigiosidad y acelera el cobro. El equilibrio está en las dos salvedades: la rebaja <b>no</b> alcanza a la <b>reposición</b> ni a la <b>indemnización</b>, porque esas no son sanción, sino reparación del daño.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> el descuento por pronto pago de una multa de tráfico.</li>\n<li><b>Real:</b> sanción propuesta de 1.000 €. El interesado reconoce su responsabilidad y paga: <b>20 % + 20 %</b> de reducción, quedando en <b>600 €</b>, si desiste de recurrir.</li>\n<li><b>Caso límite:</b> la infracción causó daños en el mobiliario urbano. El pago voluntario termina el procedimiento sancionador, pero <b>no</b> la determinación de la <b>indemnización</b> (art. 85.2).</li>\n</ul>", "noej": "<ul>\n<li><b>No procede</b> la reducción si la sanción <b>no es únicamente pecuniaria</b>, salvo el supuesto del art. 85.2.</li>\n<li><b>No se aplica</b> la reducción si el interesado <b>recurre</b>: su efectividad está condicionada al desistimiento o renuncia.</li>\n<li><b>No exime</b> el pago de la reposición ni de la indemnización.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 64.2.d) LPAC:</b> el acuerdo de iniciación debe indicar esta posibilidad.</li>\n<li><b>Art. 90.4 LPAC:</b> determinación de la indemnización por daños causados a la Administración.</li>\n<li><b>Art. 28.1 de la Ley 40/2015</b> (documento 2): responsabilidad y obligación de reponer la situación alterada.</li>\n</ul>", "trampas": "<ul>\n<li><b>Al menos el 20 %</b>, y las reducciones son <b>acumulables</b>.</li>\n<li>Deben constar en la <b>notificación de iniciación</b>.</li>\n<li>Su efectividad exige <b>desistir o renunciar</b> a recurrir en vía administrativa.</li>\n<li>El pago voluntario debe ser <b>anterior a la resolución</b>.</li>\n</ul>", "ancla": "<p><b>«Reconoces 20, pagas 20, y suman 40; pero no recurres.»</b></p>", "vis": "<svg viewBox=\"0 0 660 140\" role=\"img\" aria-label=\"Terminación en procedimientos sancionadores\">\n<g font-size=\"10\" text-anchor=\"middle\" fill=\"currentColor\">\n<rect x=\"35\" y=\"32\" width=\"240\" height=\"60\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"155\" y=\"56\" font-size=\"12\" font-weight=\"700\" fill=\"var(--ej)\">Reconocimiento (85.1)</text><text x=\"155\" y=\"76\">al menos −20 %</text>\n<rect x=\"385\" y=\"32\" width=\"240\" height=\"60\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"505\" y=\"56\" font-size=\"12\" font-weight=\"700\" fill=\"var(--acc)\">Pago voluntario (85.2)</text><text x=\"505\" y=\"76\">al menos −20 %</text>\n</g>\n<text x=\"330\" y=\"66\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"700\" fill=\"var(--warn)\">+</text>\n<rect x=\"150\" y=\"102\" width=\"360\" height=\"30\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/>\n<text x=\"330\" y=\"122\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--warn)\">ACUMULABLES · condicionadas a no recurrir</text>\n</svg>"}, {"n": 86, "t": "Terminación convencional", "ubic": "Título IV ▸ Capítulo V (Finalización del procedimiento) ▸ Sección 1.ª (Disposiciones generales)", "idea": "Acuerdos y convenios que terminan el procedimiento, con contenido mínimo tasado.", "literal": "<p>1. Las Administraciones Públicas podrán celebrar acuerdos, pactos, convenios o contratos con personas tanto de Derecho público como privado, siempre que no sean contrarios al ordenamiento jurídico ni versen sobre materias no susceptibles de transacción y tengan por objeto satisfacer el interés público que tienen encomendado, con el alcance, efectos y régimen jurídico específico que, en su caso, prevea la disposición que lo regule, pudiendo tales actos tener la consideración de finalizadores de los procedimientos administrativos o insertarse en los mismos con carácter previo, vinculante o no, a la resolución que les ponga fin.</p><p>2. Los citados instrumentos deberán establecer como contenido mínimo la identificación de las partes intervinientes, el ámbito personal, funcional y territorial, y el plazo de vigencia, debiendo publicarse o no según su naturaleza y las personas a las que estuvieran destinados.</p><p>3. Requerirán en todo caso la aprobación expresa del Consejo de Ministros u órgano equivalente de las Comunidades Autónomas, los acuerdos que versen sobre materias de la competencia directa de dicho órgano.</p><p>4. Los acuerdos que se suscriban no supondrán alteración de las competencias atribuidas a los órganos administrativos, ni de las responsabilidades que correspondan a las autoridades y funcionarios, relativas al funcionamiento de los servicios públicos.</p><p>5. En los casos de procedimientos de responsabilidad patrimonial, el acuerdo alcanzado entre las partes deberá fijar la cuantía y modo de indemnización de acuerdo con los criterios que para calcularla y abonarla establece el artículo 34 de la Ley de Régimen Jurídico del Sector Público.</p>", "dis": "<ul>\n<li><b>86.1 — objeto:</b> las Administraciones podrán celebrar <b>acuerdos, pactos, convenios o contratos</b> con personas de Derecho <b>público o privado</b>, siempre que <b>no sean contrarios al ordenamiento jurídico</b> ni versen sobre <b>materias no susceptibles de transacción</b> y tengan por objeto <b>satisfacer el interés público</b>. Pueden tener la consideración de <b>finalizadores</b> del procedimiento o insertarse en él con carácter previo, <b>vinculante o no</b>, a la resolución.</li>\n<li><b>86.2 — contenido mínimo:</b> <b>identificación de las partes</b>, <b>ámbito personal, funcional y territorial</b> y <b>plazo de vigencia</b>, publicándose o no según su naturaleza y las personas a las que estuvieran destinados.</li>\n<li><b>86.3 — aprobación:</b> requieren <b>en todo caso</b> la aprobación expresa del <b>Consejo de Ministros u órgano equivalente</b> de las comunidades autónomas los acuerdos que versen sobre materias de la <b>competencia directa</b> de dicho órgano.</li>\n<li><b>86.4 — límites:</b> <b>no supondrán alteración de las competencias</b> atribuidas a los órganos ni de las <b>responsabilidades</b> de autoridades y funcionarios.</li>\n<li><b>86.5 — responsabilidad patrimonial:</b> el acuerdo deberá fijar la <b>cuantía y modo</b> de la indemnización conforme a los criterios del art. 34 de la Ley 40/2015.</li>\n</ul>", "llano": "<p>La Administración puede cerrar un asunto por acuerdo en lugar de por resolución, siempre que no vaya contra la ley, no verse sobre algo intransigible y sirva al interés público. El acuerdo tiene que decir quién, qué ámbito y cuánto dura. Y nunca puede cambiar quién es competente ni exonerar de responsabilidad.</p>", "porque": "<p>La terminación convencional traslada al Derecho administrativo la idea de que <b>pactar es a veces mejor que decidir</b>: reduce conflictividad y produce soluciones más adaptadas. Pero el límite del art. 86.4 es esencial: si el acuerdo pudiera alterar competencias o exonerar responsabilidades, se convertiría en un instrumento para eludir el régimen jurídico-público.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> un acuerdo extrajudicial que evita el pleito.</li>\n<li><b>Real:</b> en una reclamación patrimonial de 12.000 € por daños en un vehículo, el ayuntamiento y el perjudicado <b>acuerdan</b> la indemnización conforme al art. 34 de la Ley 40/2015 (art. 86.5).</li>\n<li><b>Caso límite:</b> se pretende pactar la <b>no aplicación</b> de una sanción tipificada. Es materia <b>no susceptible de transacción</b>: el acuerdo sería contrario al art. 86.1.</li>\n</ul>", "noej": "<ul>\n<li><b>No cabe</b> el acuerdo sobre materias <b>no susceptibles de transacción</b>.</li>\n<li><b>No puede</b> alterar competencias ni responsabilidades.</li>\n<li><b>No siempre</b> es finalizador: puede insertarse en el procedimiento con carácter previo.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 114.1.d) LPAC:</b> los acuerdos finalizadores ponen fin a la vía administrativa.</li>\n<li><b>Art. 91.1 LPAC:</b> propuesta de acuerdo en responsabilidad patrimonial.</li>\n<li><b>Arts. 47 a 53 de la Ley 40/2015</b> (documento 2): régimen de los convenios.</li>\n<li><b>Art. 34 de la Ley 40/2015</b> (documento 2): cálculo de la indemnización.</li>\n</ul>", "trampas": "<ul>\n<li>El contenido mínimo son <b>tres</b> elementos: partes, ámbito <b>personal, funcional y territorial</b> y <b>plazo de vigencia</b>.</li>\n<li>Pueden ser <b>finalizadores</b> o <b>previos</b>, <b>vinculantes o no</b>.</li>\n<li>Nunca alteran <b>competencias</b> ni <b>responsabilidades</b>.</li>\n</ul>", "ancla": "<p><b>«Pactar sí, pero ni contra la ley, ni sobre lo intransigible, ni cambiando quién manda.»</b></p>", "vis": "<svg viewBox=\"0 0 660 130\" role=\"img\" aria-label=\"Terminación convencional\">\n<rect x=\"30\" y=\"30\" width=\"285\" height=\"66\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/>\n<text x=\"172\" y=\"52\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">SE PUEDE PACTAR</text>\n<text x=\"172\" y=\"71\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">acuerdos, pactos, convenios o contratos</text>\n<text x=\"172\" y=\"86\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">con personas de Derecho público o privado</text>\n<rect x=\"345\" y=\"30\" width=\"285\" height=\"66\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/>\n<text x=\"487\" y=\"52\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--exc)\">LÍMITES</text>\n<text x=\"487\" y=\"71\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">ni contrarios al ordenamiento ni sobre</text>\n<text x=\"487\" y=\"86\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">materias no transigibles · sin alterar competencias</text>\n<text x=\"330\" y=\"120\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--ink2)\">Contenido mínimo: partes · ámbito personal, funcional y territorial · plazo de vigencia</text>\n</svg>"}, {"n": 87, "t": "Actuaciones complementarias", "ubic": "Título IV ▸ Capítulo V ▸ Sección 2.ª (Resolución)", "idea": "Antes de resolver caben actuaciones complementarias indispensables, con plazo tasado.", "literal": "<p>Antes de dictar resolución, el órgano competente para resolver podrá decidir, mediante acuerdo motivado, la realización de las actuaciones complementarias indispensables para resolver el procedimiento. No tendrán la consideración de actuaciones complementarias los informes que preceden inmediatamente a la resolución final del procedimiento. El acuerdo de realización de actuaciones complementarias se notificará a los interesados, concediéndoseles un plazo de siete días para formular las alegaciones que tengan por pertinentes tras la finalización de las mismas. Las actuaciones complementarias deberán practicarse en un plazo no superior a quince días. El plazo para resolver el procedimiento quedará suspendido hasta la terminación de las actuaciones complementarias.</p>", "dis": "<ul>\n<li><b>Facultad:</b> antes de dictar resolución, el órgano competente para resolver <b>podrá decidir, mediante acuerdo motivado</b>, la realización de las <span class=\"t\" data-k=\"actcomplementarias\">actuaciones complementarias</span> <b>indispensables</b> para resolver.</li>\n<li><b>Exclusión:</b> <b>no tendrán</b> tal consideración los <b>informes que preceden inmediatamente a la resolución final</b>.</li>\n<li><b>Trámite:</b> el acuerdo se <b>notifica</b> a los interesados, concediéndoles un plazo de <b>siete días</b> para formular alegaciones tras la finalización de las actuaciones. Estas deberán practicarse en un plazo <b>no superior a quince días</b>.</li>\n<li><b>Efecto sobre el plazo:</b> el plazo para resolver <b>queda suspendido</b> hasta la terminación de las actuaciones complementarias.</li>\n</ul>", "llano": "<p>Si al ir a resolver falta algo imprescindible, el órgano puede acordar hacerlo: como máximo quince días, con siete días después para que el interesado alegue. Mientras tanto, el reloj del procedimiento se para.</p>", "porque": "<p>Es una válvula que evita dos males: resolver con información insuficiente o retrotraer todo el procedimiento. Pero se somete a un doble freno —<b>acuerdo motivado</b> y carácter <b>indispensable</b>— para que no se convierta en una forma encubierta de alargar el plazo. La exclusión expresa de los <b>informes previos a la resolución</b> impide precisamente ese uso.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> una última comprobación imprescindible antes de firmar.</li>\n<li><b>Real:</b> antes de resolver una licencia se advierte que falta la medición real de la superficie: se acuerdan actuaciones complementarias por <b>quince días</b>, con <b>siete</b> de alegaciones posteriores.</li>\n<li><b>Caso límite:</b> se pretende acordar como complementaria la petición del informe jurídico que precede a la resolución. <b>No cabe</b>: el art. 87 lo excluye expresamente.</li>\n</ul>", "noej": "<ul>\n<li><b>No son</b> complementarias los informes que preceden inmediatamente a la resolución final.</li>\n<li><b>No caben</b> actuaciones meramente convenientes: deben ser <b>indispensables</b>.</li>\n<li><b>No procede</b> sin <b>acuerdo motivado</b> notificado a los interesados.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 35.1.e) LPAC:</b> los acuerdos de realización de actuaciones complementarias deben motivarse.</li>\n<li><b>Art. 22 LPAC:</b> suspensión del plazo máximo para resolver.</li>\n<li><b>Art. 82 LPAC:</b> trámite de audiencia, ya practicado en este momento.</li>\n</ul>", "trampas": "<ul>\n<li><b>Siete días</b> de alegaciones y <b>quince días</b> máximo de duración: no los confundas.</li>\n<li>El plazo para resolver <b>queda suspendido</b>.</li>\n<li>Los <b>informes previos a la resolución</b> quedan expresamente excluidos.</li>\n</ul>", "ancla": "<p><b>«Indispensable, motivado, 15 para hacerlas y 7 para alegar; y el reloj, parado.»</b></p>", "vis": "<svg viewBox=\"0 0 640 125\" role=\"img\" aria-label=\"Actuaciones complementarias\">\n<defs><marker id=\"ac2\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\"><path d=\"M0 0 L9 4.5 L0 9 z\" fill=\"var(--acc)\"/></marker></defs>\n<rect x=\"20\" y=\"35\" width=\"170\" height=\"55\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/>\n<text x=\"105\" y=\"57\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">Acuerdo motivado</text>\n<text x=\"105\" y=\"76\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">actuaciones indispensables</text>\n<path d=\"M193 62 L 228 62\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#ac2)\"/>\n<rect x=\"232\" y=\"35\" width=\"170\" height=\"55\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/>\n<text x=\"317\" y=\"57\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"var(--ej)\">15 días</text>\n<text x=\"317\" y=\"76\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">para practicarlas</text>\n<path d=\"M405 62 L 440 62\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#ac2)\"/>\n<rect x=\"444\" y=\"35\" width=\"176\" height=\"55\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/>\n<text x=\"532\" y=\"57\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"var(--warn)\">7 días</text>\n<text x=\"532\" y=\"76\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">de alegaciones</text>\n<text x=\"320\" y=\"115\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--ink2)\">El plazo para resolver queda suspendido hasta la terminación</text>\n</svg>"}];
</script>
<script>
ARTS.push.apply(ARTS,[{"n": 88, "t": "Contenido", "ubic": "Título IV ▸ Capítulo V ▸ Sección 2.ª (Resolución)", "idea": "Decide todo, es congruente, no agrava y nunca cabe abstenerse de resolver.", "literal": "<p>1. La resolución que ponga fin al procedimiento decidirá todas las cuestiones planteadas por los interesados y aquellas otras derivadas del mismo. Cuando se trate de cuestiones conexas que no hubieran sido planteadas por los interesados, el órgano competente podrá pronunciarse sobre las mismas, poniéndolo antes de manifiesto a aquéllos por un plazo no superior a quince días, para que formulen las alegaciones que estimen pertinentes y aporten, en su caso, los medios de prueba.</p><p>2. En los procedimientos tramitados a solicitud del interesado, la resolución será congruente con las peticiones formuladas por éste, sin que en ningún caso pueda agravar su situación inicial y sin perjuicio de la potestad de la Administración de incoar de oficio un nuevo procedimiento, si procede.</p><p>3. Las resoluciones contendrán la decisión, que será motivada en los casos a que se refiere el artículo 35. Expresarán, además, los recursos que contra la misma procedan, órgano administrativo o judicial ante el que hubieran de presentarse y plazo para interponerlos, sin perjuicio de que los interesados puedan ejercitar cualquier otro que estimen oportuno.</p><p>4. Sin perjuicio de la forma y lugar señalados por el interesado para la práctica de las notificaciones, la resolución del procedimiento se dictará electrónicamente y garantizará la identidad del órgano competente, así como la autenticidad e integridad del documento que se formalice mediante el empleo de alguno de los instrumentos previstos en esta Ley.</p><p>5. En ningún caso podrá la Administración abstenerse de resolver so pretexto de silencio, oscuridad o insuficiencia de los preceptos legales aplicables al caso, aunque podrá acordarse la inadmisión de las solicitudes de reconocimiento de derechos no previstos en el ordenamiento jurídico o manifiestamente carentes de fundamento, sin perjuicio del derecho de petición previsto por el artículo 29 de la Constitución.</p><p>6. La aceptación de informes o dictámenes servirá de motivación a la resolución cuando se incorporen al texto de la misma.</p><p>7. Cuando la competencia para instruir y resolver un procedimiento no recaiga en un mismo órgano, será necesario que el instructor eleve al órgano competente para resolver una propuesta de resolución. En los procedimientos de carácter sancionador, la propuesta de resolución deberá ser notificada a los interesados en los términos previstos en el artículo siguiente.</p>", "dis": "<ul>\n<li><b>88.1 — extensión:</b> la resolución decidirá <b>todas las cuestiones planteadas</b> por los interesados y las <b>derivadas</b> del procedimiento. Si se trata de <span class=\"t\" data-k=\"cuestionconexa\">cuestiones conexas</span> no planteadas, puede pronunciarse sobre ellas <b>poniéndolo antes de manifiesto</b> por plazo <b>no superior a quince días</b>.</li>\n<li><b>88.2 — <span class=\"t\" data-k=\"congruenciares\">congruencia</span>:</b> en los procedimientos iniciados <b>a solicitud</b>, la resolución será <b>congruente</b> con las peticiones, <b>sin que en ningún caso pueda agravar su situación inicial</b>, y sin perjuicio de la potestad de la Administración de iniciar de oficio un nuevo procedimiento si procede.</li>\n<li><b>88.3 — contenido:</b> la <b>decisión</b>, <b>motivada</b> en los casos del art. 35, y además los <b>recursos</b> procedentes, el <b>órgano</b> ante el que presentarlos y el <b>plazo</b>.</li>\n<li><b>88.4 — forma:</b> se dictará <b>electrónicamente</b>, garantizando la <b>identidad del órgano</b> y la autenticidad de su contenido.</li>\n<li><b>88.5 — prohibición de la abstención:</b> <b>en ningún caso</b> puede la Administración abstenerse de resolver <b>so pretexto de silencio, oscuridad o insuficiencia</b> de los preceptos aplicables; aunque cabe <b>inadmitir</b> las solicitudes de reconocimiento de derechos <b>no previstos en el ordenamiento</b> o <b>manifiestamente carentes de fundamento</b>.</li>\n<li><b>88.6 — motivación por remisión:</b> la <b>aceptación de informes o dictámenes</b> servirá de motivación cuando <b>se incorporen al texto</b> de la resolución.</li>\n<li><b>88.7 — propuesta de resolución:</b> si instruir y resolver no recaen en el mismo órgano, el instructor <b>elevará</b> al competente una <b>propuesta de resolución</b>.</li>\n</ul>", "llano": "<p>La resolución tiene que responder a todo lo planteado, ser coherente con lo que pediste y no dejarte peor de como estabas. Debe decirte además qué recursos tienes. Y hay una regla contundente: la Administración <b>no puede</b> escudarse en que la ley no está clara para no decidir.</p>", "porque": "<p>El art. 88.5 es la traducción procedimental de la <b>prohibición del <i>non liquet</i></b>: quien tiene el deber de decidir no puede refugiarse en la duda. Y la <b>prohibición de agravar</b> del art. 88.2 protege al ciudadano que se dirige a la Administración: pedir no puede volverse en contra. La salvedad final —iniciar de oficio otro procedimiento— evita que esa protección se convierta en impunidad.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> pedir una revisión de la factura y que no te la suban por haberla pedido.</li>\n<li><b>Real:</b> solicitada una bonificación fiscal, se deniega; el órgano advierte además una posible infracción. <b>No puede</b> sancionar en esa resolución, pero <b>sí</b> iniciar de oficio un procedimiento sancionador (art. 88.2).</li>\n<li><b>Caso límite:</b> el órgano quiere pronunciarse sobre una cuestión conexa no planteada. Puede, pero debe <b>ponerla de manifiesto</b> por un plazo <b>no superior a quince días</b> (art. 88.1).</li>\n</ul>", "noej": "<ul>\n<li><b>No cabe</b> dejar de resolver por oscuridad o insuficiencia de la norma.</li>\n<li><b>No cabe</b> agravar la situación inicial del solicitante.</li>\n<li><b>No sirve</b> de motivación un informe que <b>no se incorpore</b> al texto de la resolución.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 21 LPAC:</b> obligación de resolver.</li>\n<li><b>Art. 35 LPAC:</b> supuestos de motivación.</li>\n<li><b>Art. 119.3 LPAC:</b> prohibición paralela de agravar al resolver un recurso.</li>\n<li><b>Art. 29 de la Constitución</b> <i>(norma externa a la biblioteca)</i>: derecho de petición, expresamente citado.</li>\n</ul>", "trampas": "<ul>\n<li>La puesta de manifiesto de cuestiones conexas tiene un plazo <b>no superior a quince días</b>.</li>\n<li>La prohibición de agravar rige en procedimientos iniciados <b>a solicitud</b>.</li>\n<li>Cabe <b>inadmitir</b> solicitudes de derechos no previstos o manifiestamente infundadas.</li>\n<li>El informe motiva <b>solo si se incorpora al texto</b>.</li>\n</ul>", "ancla": "<p><b>«Todo, coherente, sin empeorarte, con pie de recursos, y sin excusas para no decidir.»</b></p>", "vis": "<svg viewBox=\"0 0 660 140\" role=\"img\" aria-label=\"Contenido de la resolución\">\n<g font-size=\"10\" text-anchor=\"middle\" fill=\"currentColor\">\n<rect x=\"15\" y=\"30\" width=\"200\" height=\"62\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"115\" y=\"52\" font-weight=\"700\" fill=\"var(--acc)\">88.1 · Decide TODO</text><text x=\"115\" y=\"70\">lo planteado y lo derivado</text><text x=\"115\" y=\"84\">conexas: manifiesto ≤ 15 días</text>\n<rect x=\"230\" y=\"30\" width=\"200\" height=\"62\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"330\" y=\"52\" font-weight=\"700\" fill=\"var(--ej)\">88.2 · Congruente</text><text x=\"330\" y=\"70\">y sin agravar la</text><text x=\"330\" y=\"84\">situación inicial</text>\n<rect x=\"445\" y=\"30\" width=\"200\" height=\"62\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"545\" y=\"52\" font-weight=\"700\" fill=\"var(--warn)\">88.3 · Contenido</text><text x=\"545\" y=\"70\">decisión motivada</text><text x=\"545\" y=\"84\">y pie de recursos</text>\n</g>\n<text x=\"330\" y=\"126\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--exc)\">88.5 · NUNCA cabe abstenerse de resolver por silencio, oscuridad o insuficiencia de la norma</text>\n</svg>"}, {"n": 89, "t": "Propuesta de resolución en los procedimientos de carácter sancionador", "ubic": "Título IV ▸ Capítulo V ▸ Sección 2.ª (Resolución)", "idea": "Cinco causas de archivo sin propuesta, y propuesta motivada en los demás casos.", "literal": "<p>1. El órgano instructor resolverá la finalización del procedimiento, con archivo de las actuaciones, sin que sea necesaria la formulación de la propuesta de resolución, cuando en la instrucción procedimiento se ponga de manifiesto que concurre alguna de las siguientes circunstancias:</p><p>a) La inexistencia de los hechos que pudieran constituir la infracción.</p><p>b) Cuando los hechos no resulten acreditados.</p><p>c) Cuando los hechos probados no constituyan, de modo manifiesto, infracción administrativa.</p><p>d) Cuando no exista o no se haya podido identificar a la persona o personas responsables o bien aparezcan exentos de responsabilidad.</p><p>e) Cuando se concluyera, en cualquier momento, que ha prescrito la infracción.</p><p>2. En el caso de procedimientos de carácter sancionador, una vez concluida la instrucción del procedimiento, el órgano instructor formulará una propuesta de resolución que deberá ser notificada a los interesados. La propuesta de resolución deberá indicar la puesta de manifiesto del procedimiento y el plazo para formular alegaciones y presentar los documentos e informaciones que se estimen pertinentes.</p><p>3. En la propuesta de resolución se fijarán de forma motivada los hechos que se consideren probados y su exacta calificación jurídica, se determinará la infracción que, en su caso, aquéllos constituyan, la persona o personas responsables y la sanción que se proponga, la valoración de las pruebas practicadas, en especial aquellas que constituyan los fundamentos básicos

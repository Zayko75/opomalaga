de la decisión, así como las medidas provisionales que, en su caso, se hubieran adoptado. Cuando la instrucción concluya la inexistencia de infracción o responsabilidad y no se haga uso de la facultad prevista en el apartado primero, la propuesta declarará esa circunstancia.</p>", "dis": "<p><b>89.1 — <span class=\"t\" data-k=\"archivo\">archivo sin propuesta de resolución</span>.</b> El instructor resolverá la finalización con archivo cuando en la instrucción se ponga de manifiesto:</p>\n<table><thead><tr><th>Letra</th><th>Causa</th></tr></thead><tbody>\n<tr><td><b>a)</b></td><td><b>Inexistencia de los hechos</b> que pudieran constituir la infracción</td></tr>\n<tr><td><b>b)</b></td><td>Los hechos <b>no resultan acreditados</b></td></tr>\n<tr><td><b>c)</b></td><td>Los hechos probados <b>no constituyen, de modo manifiesto</b>, infracción administrativa</td></tr>\n<tr><td><b>d)</b></td><td><b>No existe</b> o no se ha podido <b>identificar</b> al responsable, o está <b>exento</b> de responsabilidad</td></tr>\n<tr><td><b>e)</b></td><td>Ha <b>prescrito la infracción</b></td></tr>\n</tbody></table>\n<ul>\n<li><b>89.2 — propuesta:</b> concluida la instrucción, el instructor formulará <span class=\"t\" data-k=\"propuestasanc\">propuesta de resolución</span>, que <b>deberá ser notificada a los interesados</b> indicando la puesta de manifiesto del procedimiento y el plazo para alegar y presentar documentos.</li>\n<li><b>89.3 — contenido:</b> se fijarán <b>de forma motivada</b> los <b>hechos probados</b> y su <b>exacta calificación jurídica</b>, la <b>infracción</b> que constituyan, la <b>persona responsable</b>, la <b>sanción</b> propuesta, las <b>medidas provisionales</b> adoptadas y, en su caso, la <b>declaración de no existencia de infracción o responsabilidad</b>.</li>\n</ul>", "llano": "<p>Si durante la instrucción queda claro que no hubo hechos, no se prueban, no son infracción, no hay responsable o ya prescribió, el instructor archiva directamente: no hace falta propuesta. En los demás casos, formula propuesta motivada y te la notifica.</p>", "porque": "<p>Las cinco causas del art. 89.1 comparten un rasgo: en todas ellas <b>ya se sabe</b> que no habrá sanción. Obligar a tramitar propuesta, alegaciones y resolución en esos casos sería mantener abierto un expediente contra alguien sin ninguna posibilidad de que prospere, con el consiguiente perjuicio para él.</p>\n<p>La exigencia de <b>exacta calificación jurídica</b> del apartado 3 es una garantía capital: el inculpado necesita saber con precisión de qué infracción se le acusa para poder rebatirla.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> cerrar una investigación en cuanto se comprueba que el hecho no ocurrió.</li>\n<li><b>Real:</b> denunciada una obra sin licencia, la instrucción acredita que <b>sí</b> existía licencia: <b>archivo</b> por la letra a), sin propuesta de resolución.</li>\n<li><b>Caso límite:</b> los hechos existen pero no se han podido probar. Es la <b>letra b)</b>: archivo igualmente, aunque por una razón distinta.</li>\n</ul>", "noej": "<ul>\n<li><b>No procede</b> el archivo del art. 89.1 si los hechos <b>podrían</b> ser infracción y hay indicios: entonces hay propuesta.</li>\n<li><b>No basta</b> con proponer una sanción: hay que fijar <b>hechos probados</b> y <b>calificación exacta</b>.</li>\n<li><b>No cabe</b> omitir la <b>notificación</b> de la propuesta a los interesados.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 64.2.f) LPAC:</b> el acuerdo de iniciación puede valer como propuesta si no hay alegaciones.</li>\n<li><b>Art. 90.2 LPAC:</b> no pueden aceptarse hechos distintos de los determinados en el procedimiento.</li>\n<li><b>Art. 88.7 LPAC:</b> elevación de la propuesta al órgano competente para resolver.</li>\n<li><b>Art. 30 de la Ley 40/2015</b> (documento 2): prescripción de infracciones y sanciones.</li>\n</ul>", "trampas": "<ul>\n<li>Son <b>cinco</b> causas de archivo, letras a) a e).</li>\n<li>La letra c) exige que la falta de infracción sea <b>manifiesta</b>.</li>\n<li>La propuesta debe fijar la <b>exacta calificación jurídica</b>.</li>\n</ul>", "ancla": "<p><b>«No pasó · no se prueba · no es infracción · no hay quien · ya prescribió.»</b> Cinco archivos.</p>", "vis": "<svg viewBox=\"0 0 660 145\" role=\"img\" aria-label=\"Archivo y propuesta de resolución sancionadora\">\n<rect x=\"180\" y=\"8\" width=\"300\" height=\"30\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/>\n<text x=\"330\" y=\"28\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">CONCLUIDA LA INSTRUCCIÓN</text>\n<rect x=\"20\" y=\"52\" width=\"300\" height=\"70\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/>\n<text x=\"170\" y=\"74\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">ARCHIVO sin propuesta (89.1)</text>\n<text x=\"170\" y=\"92\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">a) no hay hechos · b) no acreditados</text>\n<text x=\"170\" y=\"107\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">c) no son infracción · d) sin responsable · e) prescrita</text>\n<rect x=\"340\" y=\"52\" width=\"300\" height=\"70\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/>\n<text x=\"490\" y=\"74\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--warn)\">PROPUESTA DE RESOLUCIÓN (89.2)</text>\n<text x=\"490\" y=\"92\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">hechos probados · calificación exacta</text>\n<text x=\"490\" y=\"107\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">responsable · sanción · medidas provisionales</text>\n</svg>"}, {"n": 90, "t": "Especialidades de la resolución en los procedimientos sancionadores", "ubic": "Título IV ▸ Capítulo V ▸ Sección 2.ª (Resolución)", "idea": "Ni hechos nuevos ni sorpresas: mayor gravedad exige quince días de alegaciones.", "literal": "<p>1. En el caso de procedimientos de carácter sancionador, además del contenido previsto en los dos artículos anteriores, la resolución incluirá la valoración de las pruebas practicadas, en especial aquellas que constituyan los fundamentos básicos de la decisión, fijarán los hechos y, en su caso, la persona o personas responsables, la infracción o infracciones cometidas y la sanción o sanciones que se imponen, o bien la declaración de no existencia de infracción o responsabilidad.</p><p>2. En la resolución no se podrán aceptar hechos distintos de los determinados en el curso del procedimiento, con independencia de su diferente valoración jurídica. No obstante, cuando el órgano competente para resolver considere que la infracción o la sanción revisten mayor gravedad que la determinada en la propuesta de resolución, se notificará al inculpado para que aporte cuantas alegaciones estime convenientes en el plazo de quince días.</p><p>3. La resolución que ponga fin al procedimiento será ejecutiva cuando no quepa contra ella ningún recurso ordinario en vía administrativa, pudiendo adoptarse en la misma las disposiciones cautelares precisas para garantizar su eficacia en tanto no sea ejecutiva y que podrán consistir en el mantenimiento de las medidas provisionales que en su caso se hubieran adoptado. Cuando la resolución sea ejecutiva, se podrá suspender cautelarmente, si el interesado manifiesta a la Administración su intención de interponer recurso contencioso-administrativo contra la resolución firme en vía administrativa. Dicha suspensión cautelar finalizará cuando:</p><p>a) Haya transcurrido el plazo legalmente previsto sin que el interesado haya interpuesto recurso contencioso-administrativo.</p><p>b) Habiendo el interesado interpuesto recurso contencioso-administrativo:</p><p>1.º No se haya solicitado en el mismo trámite la suspensión cautelar de la resolución impugnada.</p><p>2.º El órgano judicial se pronuncie sobre la suspensión cautelar solicitada, en los términos previstos en ella.</p><p>4. Cuando las conductas sancionadas hubieran causado daños o perjuicios a las Administraciones y la cuantía destinada a indemnizar estos daños no hubiera quedado determinada en el expediente, se fijará mediante un procedimiento complementario, cuya resolución será inmediatamente ejecutiva. Este procedimiento será susceptible de terminación convencional, pero ni ésta ni la aceptación por el infractor de la resolución que pudiera recaer implicarán el reconocimiento voluntario de su responsabilidad. La resolución del procedimiento pondrá fin a la vía administrativa.</p>", "dis": "<ul>\n<li><b>90.1 — contenido añadido:</b> además de lo previsto en los arts. 88 y 89, la resolución sancionadora incluirá la <b>valoración de las pruebas</b> practicadas, en especial las que constituyan los <b>fundamentos básicos</b> de la decisión, <b>fijará los hechos</b> y, en su caso, la <b>persona responsable</b>, la <b>infracción</b> cometida y la <b>sanción</b> que se impone, o bien la <b>declaración de no existencia</b> de infracción o responsabilidad.</li>\n<li><b>90.2 — prohibición de hechos nuevos:</b> <b>no se podrán aceptar hechos distintos</b> de los determinados en el curso del procedimiento, <b>con independencia de su diferente valoración jurídica</b>. Si el órgano considera que la infracción o la sanción revisten <b>mayor gravedad</b> que la propuesta, se <b>notificará al inculpado</b> para que alegue en el plazo de <b>quince días</b>.</li>\n<li><b>90.3 — ejecutividad:</b> la resolución será <b>ejecutiva cuando no quepa contra ella ningún recurso ordinario en vía administrativa</b>. Pueden adoptarse <b>disposiciones cautelares</b> para garantizar su eficacia entretanto, incluido el <b>mantenimiento de las medidas provisionales</b>. Siendo ya ejecutiva, cabe <b>suspenderla cautelarmente</b> si el interesado manifiesta su intención de interponer recurso contencioso-administrativo; esa suspensión finaliza cuando: <b>a)</b> transcurra el plazo sin interponerlo; <b>b)</b> interpuesto, <b>1.º</b> no se solicite en el mismo trámite la suspensión cautelar, o <b>2.º</b> el órgano judicial se pronuncie sobre ella.</li>\n<li><b>90.4 — daños a la Administración:</b> si la conducta sancionada causó daños cuya cuantía no quedó determinada, se fijará mediante <b>procedimiento complementario</b>, cuya resolución es <b>inmediatamente ejecutiva</b>. Ese procedimiento <b>es susceptible de terminación convencional</b>, pero ni esta ni la aceptación de la resolución por el infractor implican <b>reconocimiento voluntario de su responsabilidad</b>. La resolución <b>pone fin a la vía administrativa</b>.</li>\n</ul>", "llano": "<p>La resolución sancionadora tiene que valorar las pruebas y fijar los hechos, sin poder introducir hechos nuevos. Si el órgano ve la cosa más grave que el instructor, tiene que avisarte y darte quince días. Y no es ejecutiva hasta que no quepa recurso ordinario en vía administrativa.</p>", "porque": "<p>El art. 90.2 protege el <b>derecho de defensa</b>: uno se defiende de los hechos que se le imputaron, no de otros. La <b>valoración jurídica</b> sí puede cambiar, pero si eso empeora su situación, la ley obliga a abrir un nuevo turno de alegaciones. Y el art. 90.3 retrasa la ejecutividad respecto de la regla general del art. 38, precisamente por el carácter aflictivo de la sanción.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> que te cambien la acusación a última hora sin dejarte responder sería injusto.</li>\n<li><b>Real:</b> el instructor propone infracción leve y el órgano competente aprecia que es grave. Debe <b>notificarlo</b> al inculpado con <b>quince días</b> de alegaciones (art. 90.2).</li>\n<li><b>Caso límite:</b> el interesado comunica su intención de acudir al contencioso. Cabe <b>suspender cautelarmente</b> la resolución ya ejecutiva, hasta que se den las circunstancias del art. 90.3.</li>\n</ul>", "noej": "<ul>\n<li><b>No cabe</b> incorporar hechos distintos de los determinados en el procedimiento.</li>\n<li><b>No es</b> ejecutiva mientras quepa recurso ordinario en vía administrativa.</li>\n<li><b>No hace falta</b> nuevo trámite si solo cambia la <b>valoración jurídica</b> sin agravar.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 38 LPAC:</b> ejecutividad general de los actos, aquí modulada.</li>\n<li><b>Art. 89.3 LPAC:</b> contenido de la propuesta de resolución.</li>\n<li><b>Art. 114.1.f) LPAC:</b> la resolución del procedimiento complementario pone fin a la vía administrativa.</li>\n<li><b>Art. 85 LPAC:</b> reducciones por reconocimiento y pago voluntario.</li>\n</ul>", "trampas": "<ul>\n<li><b>Quince días</b> de alegaciones si se aprecia <b>mayor gravedad</b>.</li>\n<li>La resolución sancionadora es ejecutiva cuando <b>no quepa recurso ordinario</b> en vía administrativa.</li>\n<li>La resolución del procedimiento complementario es <b>inmediatamente ejecutiva</b> y <b>pone fin a la vía administrativa</b>; cabe terminación convencional, que <b>no</b> implica reconocimiento de responsabilidad.</li>\n</ul>", "ancla": "<p><b>«Mismos hechos siempre; más grave, quince días; y no ejecuto mientras puedas recurrir en casa.»</b></p>", "vis": "<svg viewBox=\"0 0 660 135\" role=\"img\" aria-label=\"Especialidades de la resolución sancionadora\">\n<g font-size=\"10\" text-anchor=\"middle\" fill=\"currentColor\">\n<rect x=\"20\" y=\"30\" width=\"195\" height=\"62\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"117\" y=\"52\" font-weight=\"700\" fill=\"var(--acc)\">90.1 · Valoración</text><text x=\"117\" y=\"70\">de las pruebas y fijación</text><text x=\"117\" y=\"84\">de hechos y responsable</text>\n<rect x=\"230\" y=\"30\" width=\"195\" height=\"62\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"327\" y=\"52\" font-weight=\"700\" fill=\"var(--exc)\">90.2 · Sin hechos nuevos</text><text x=\"327\" y=\"70\">mayor gravedad:</text><text x=\"327\" y=\"84\">15 días de alegaciones</text>\n<rect x=\"440\" y=\"30\" width=\"200\" height=\"62\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"540\" y=\"52\" font-weight=\"700\" fill=\"var(--warn)\">90.3 · Ejecutividad</text><text x=\"540\" y=\"70\">cuando no quepa recurso</text><text x=\"540\" y=\"84\">ordinario en vía administrativa</text>\n</g>\n<text x=\"330\" y=\"122\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--ink2)\">90.4 · los daños no cuantificados se fijan por procedimiento complementario, inmediatamente ejecutivo</text>\n</svg>"}, {"n": 91, "t": "Especialidades de la resolución en los procedimientos en materia de responsabilidad patrimonial", "ubic": "Título IV ▸ Capítulo V ▸ Sección 2.ª (Resolución)", "idea": "Patrimonial: causalidad, valoración y cuantía; seis meses sin resolver, no hay indemnización.", "literal": "<p>1. Una vez recibido, en su caso, el dictamen al que se refiere el artículo 81.2 o, cuando éste no sea preceptivo, una vez finalizado el trámite de audiencia, el órgano competente resolverá o someterá la propuesta de acuerdo para su formalización por el interesado y por el órgano administrativo competente para suscribirlo. Cuando no se estimase procedente formalizar la propuesta de terminación convencional, el órgano competente resolverá en los términos previstos en el apartado siguiente.</p><p>2. Además de lo previsto en el artículo 88, en los casos de procedimientos de responsabilidad patrimonial, será necesario que la resolución se pronuncie sobre la existencia o no de la relación de causalidad entre el funcionamiento del servicio público y la lesión producida y, en su caso, sobre la valoración del daño causado, la cuantía y el modo de la indemnización, cuando proceda, de acuerdo con los criterios que para calcularla y abonarla se establecen en el artículo 34 de la Ley de Régimen Jurídico del Sector Público.</p><p>3. Transcurridos seis meses desde que se inició el procedimiento sin que haya recaído y se notifique resolución expresa o, en su caso, se haya formalizado el acuerdo, podrá entenderse que la resolución es contraria a la indemnización del particular.</p>", "dis": "<ul>\n<li><b>91.1 — momento:</b> recibido el <b>dictamen</b> del art. 81.2 o, cuando no sea preceptivo, finalizado el <b>trámite de audiencia</b>, el órgano competente <b>resolverá</b> o <b>someterá la propuesta de acuerdo</b> para su formalización. Si no se estima procedente formalizarla, resolverá conforme al apartado siguiente.</li>\n<li><b>91.2 — contenido:</b> además de lo previsto en el art. 88, la resolución <b>debe pronunciarse</b> sobre:\n<ul><li>la <b>existencia o no de relación de causalidad</b> entre el funcionamiento del servicio público y la lesión;</li>\n<li>y, en su caso, la <b>valoración del daño</b>, la <b>cuantía</b> y el <b>modo</b> de la indemnización, conforme al art. 34 de la Ley 40/2015.</li></ul></li>\n<li><b>91.3 — silencio:</b> transcurridos <b>seis meses</b> desde que se inició el procedimiento sin resolución expresa notificada ni acuerdo formalizado, <b>podrá entenderse que la resolución es contraria a la indemnización</b> del particular.</li>\n</ul>", "llano": "<p>En estos expedientes la resolución tiene que decir dos cosas obligatoriamente: si el daño lo causó el servicio público y, si es que sí, cuánto y cómo se paga. Y si pasan seis meses sin respuesta, se entiende que te la deniegan.</p>", "porque": "<p>Exigir un pronunciamiento expreso sobre la <b>relación de causalidad</b> impide las denegaciones genéricas: la clave de toda reclamación patrimonial es si el daño es <b>imputable</b> al funcionamiento del servicio, y sobre eso hay que mojarse.</p>\n<p>El silencio <b>negativo</b> a los seis meses es coherente con el sistema: reconocer una indemnización por silencio equivaldría a comprometer fondos públicos sin decisión ni cuantificación.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> una reclamación al seguro que debe decir si cubre y por cuánto.</li>\n<li><b>Real:</b> reclamación por daños de una rama caída de un árbol municipal: la resolución debe declarar si hay <b>nexo causal</b> y, en caso afirmativo, fijar la <b>cuantía</b>.</li>\n<li><b>Caso límite:</b> se reclamaron 65.000 € y hay dictamen preceptivo. La resolución solo puede dictarse <b>una vez recibido</b> (art. 91.1).</li>\n</ul>", "noej": "<ul>\n<li><b>No basta</b> con denegar: hay que pronunciarse sobre la <b>relación de causalidad</b>.</li>\n<li><b>No hay</b> silencio positivo: a los seis meses, resolución <b>contraria</b> a la indemnización.</li>\n<li><b>No cabe</b> resolver antes de recibir el dictamen cuando este sea preceptivo.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 81 LPAC:</b> informes y dictámenes preceptivos.</li>\n<li><b>Art. 86.5 LPAC:</b> contenido del acuerdo indemnizatorio.</li>\n<li><b>Art. 92 LPAC:</b> competencia para resolver.</li>\n<li><b>Art. 34 de la Ley 40/2015</b> (documento 2): cálculo de la indemnización.</li>\n</ul>", "trampas": "<ul>\n<li><b>Seis meses</b> y silencio <b>desestimatorio</b>.</li>\n<li>La resolución debe pronunciarse <b>siempre</b> sobre la relación de causalidad.</li>\n<li>Cabe terminar por <b>acuerdo</b> en vez de por resolución.</li>\n</ul>", "ancla": "<p><b>«¿Fue el servicio? ¿Cuánto vale? Y si callo seis meses, no pago.»</b></p>", "vis": "<svg viewBox=\"0 0 660 130\" role=\"img\" aria-label=\"Resolución en responsabilidad patrimonial\">\n<g font-size=\"10\" text-anchor=\"middle\" fill=\"currentColor\">\n<rect x=\"25\" y=\"32\" width=\"195\" height=\"62\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"122\" y=\"56\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">Relación de causalidad</text><text x=\"122\" y=\"76\">pronunciamiento obligatorio</text>\n<rect x=\"235\" y=\"32\" width=\"195\" height=\"62\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"332\" y=\"56\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">Valoración y cuantía</text><text x=\"332\" y=\"76\">y modo de la indemnización</text>\n<rect x=\"445\" y=\"32\" width=\"195\" height=\"62\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"542\" y=\"56\" font-size=\"13\" font-weight=\"700\" fill=\"var(--exc)\">6 meses</text><text x=\"542\" y=\"76\">silencio: contraria a indemnizar</text>\n</g>\n</svg>"}]);
</script>
<script>
ARTS.push.apply(ARTS,[{"n": 92, "t": "Competencia para la resolución de los procedimientos de responsabilidad patrimonial", "ubic": "Título IV ▸ Capítulo V ▸ Sección 2.ª (Resolución)", "idea": "Cada Administración resuelve las suyas; en lo local, los órganos de la propia entidad.", "literal": "<p>En el ámbito de la Administración General del Estado, los procedimientos de responsabilidad patrimonial se resolverán por el Ministro respectivo o por el Consejo de Ministros en los casos del artículo 32.3 de la Ley de Régimen Jurídico del Sector Público o cuando una ley así lo disponga.</p><p>En el ámbito autonómico y local, los procedimientos de responsabilidad patrimonial se resolverán por los órganos correspondientes de las Comunidades Autónomas o de las Entidades que integran la Administración Local. En el caso de las Entidades de Derecho Público, las normas que determinen su régimen jurídico podrán establecer los órganos a quien corresponde la resolución de los procedimientos de responsabilidad patrimonial. En su defecto, se aplicarán las normas previstas en este artículo.</p>", "dis": "<ul>\n<li><b>Ámbito estatal:</b> resuelven el <b>Ministro respectivo</b> o el <b>Consejo de Ministros</b> en los casos del art. 32.3 de la Ley 40/2015 <b>o cuando una ley así lo disponga</b>.</li>\n<li><b>Ámbito autonómico y local:</b> resuelven los <b>órganos correspondientes</b> de las comunidades autónomas o de las <b>entidades que integran la Administración local</b>.</li>\n<li><b>Corporaciones de Derecho público:</b> resuelven sus <b>órganos competentes</b>.</li>\n<li><b>Entidades de Derecho Público:</b> las normas que determinen su <b>régimen jurídico</b> podrán establecer el órgano competente; <b>en su defecto</b>, se aplican las reglas de este artículo.</li>\n</ul>", "llano": "<p>Cada Administración resuelve sus propias reclamaciones patrimoniales con sus propios órganos. En un ayuntamiento, el que tenga atribuida la competencia según su régimen de delegaciones.</p>", "porque": "<p>Es una regla de <b>autonomía</b>: la responsabilidad patrimonial deriva del funcionamiento de <b>cada</b> servicio público, y quien lo presta debe responder y decidir. Y la remisión al régimen jurídico propio de las Entidades de Derecho Público permite adaptar la competencia a organizaciones muy diversas, sin dejar lagunas: en su defecto se aplican las reglas generales del artículo.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> cada empresa responde de sus propios servicios.</li>\n<li><b>Real:</b> una reclamación por daños causados por un servicio municipal se resuelve por el órgano competente del <b>ayuntamiento</b>, no por la Junta de Andalucía.</li>\n<li><b>Caso límite:</b> el daño lo causa una empresa concesionaria de un servicio municipal. Resuelve igualmente el ayuntamiento, sin perjuicio de la audiencia al <b>contratista</b> (art. 82.5).</li>\n</ul>", "noej": "<ul>\n<li><b>No resuelve</b> la Administración del Estado las reclamaciones de una entidad local.</li>\n<li><b>No resuelve</b> el órgano consultivo que dictaminó: dictamina, no decide.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 91 LPAC:</b> contenido de la resolución.</li>\n<li><b>Art. 82.5 LPAC:</b> audiencia al contratista.</li>\n<li><b>Art. 32.3 de la Ley 40/2015</b> (documento 2): responsabilidad patrimonial por actos legislativos.</li>\n</ul>", "trampas": "<ul>\n<li>En lo local, resuelven los <b>órganos correspondientes de la entidad</b>.</li>\n<li>En las <b>Entidades de Derecho Público</b> puede fijarlo su régimen jurídico propio; en su defecto, rigen las reglas del art. 92.</li>\n</ul>", "ancla": "<p><b>«Cada casa responde de lo suyo.»</b> Y en las Entidades de Derecho Público, lo que diga su régimen jurídico; en su defecto, esta regla.</p>", "vis": "<svg viewBox=\"0 0 640 115\" role=\"img\" aria-label=\"Competencia para resolver la responsabilidad patrimonial\">\n<g font-size=\"10\" text-anchor=\"middle\" fill=\"currentColor\">\n<rect x=\"25\" y=\"30\" width=\"175\" height=\"55\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"112\" y=\"52\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">Estado</text><text x=\"112\" y=\"72\">Ministro o Consejo de Ministros</text>\n<rect x=\"232\" y=\"30\" width=\"175\" height=\"55\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"319\" y=\"52\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">Autonómico y local</text><text x=\"319\" y=\"72\">órganos de cada entidad</text>\n<rect x=\"439\" y=\"30\" width=\"176\" height=\"55\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"527\" y=\"52\" font-size=\"11\" font-weight=\"700\" fill=\"var(--warn)\">Corporaciones</text><text x=\"527\" y=\"72\">sus órganos competentes</text>\n</g>\n</svg>"}, {"n": 93, "t": "Desistimiento por la Administración", "ubic": "Título IV ▸ Capítulo V ▸ Sección 3.ª (Desistimiento y renuncia)", "idea": "La Administración también puede desistir, pero motivadamente y solo si la ley lo prevé.", "literal": "<p>En los procedimientos iniciados de oficio, la Administración podrá                  desistir, motivadamente, en los supuestos y con los requisitos previstos en las Leyes.</p>", "dis": "<ul>\n<li><b>Regla:</b> en los procedimientos <b>iniciados de oficio</b>, la Administración podrá <b>desistir</b>, <b>motivadamente</b>, <b>en los supuestos y con los requisitos previstos en las leyes</b>.</li>\n<li><b>Doble límite:</b> solo en procedimientos <b>de oficio</b> y solo cuando una <b>ley</b> lo contemple, con <b>motivación</b> expresa.</li>\n</ul>", "llano": "<p>La Administración puede echarse atrás en un expediente que ella misma abrió, pero no cuando quiera: hace falta que una ley lo prevea y explicarlo por escrito.</p>", "porque": "<p>Si la Administración pudiera desistir libremente, el <b>principio de legalidad</b> quedaría a su disposición: podría abrir y cerrar expedientes según conveniencia. Exigir <b>previsión legal</b> y <b>motivación</b> convierte el desistimiento en una decisión controlable, y el art. 35.1.g) obliga además a motivar el desistimiento de la Administración en procedimientos de oficio.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> retirar una demanda solo en los casos y condiciones que la ley permite.</li>\n<li><b>Real:</b> el ayuntamiento desiste de un procedimiento de oficio en un supuesto expresamente previsto por la ley sectorial, con acuerdo <b>motivado</b>.</li>\n<li><b>Caso límite:</b> el órgano quiere desistir de un expediente sancionador por conveniencia. <b>No cabe</b>: falta la previsión legal y, además, opera el art. 89.1 si concurre alguna de sus causas.</li>\n</ul>", "noej": "<ul>\n<li><b>No cabe</b> en procedimientos iniciados <b>a solicitud</b> del interesado.</li>\n<li><b>No cabe</b> sin previsión legal ni sin motivación.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 35.1.g) LPAC:</b> motivación del desistimiento de la Administración.</li>\n<li><b>Art. 94 LPAC:</b> desistimiento y renuncia de los interesados.</li>\n<li><b>Art. 89.1 LPAC:</b> archivo en procedimientos sancionadores.</li>\n</ul>", "trampas": "<ul>\n<li>Solo en procedimientos iniciados <b>de oficio</b>.</li>\n<li>Exige <b>motivación</b> y previsión <b>en las leyes</b>.</li>\n</ul>", "ancla": "<p><b>«También puedo retirarme yo, pero solo si la ley me deja y lo explico.»</b></p>", "vis": "<svg viewBox=\"0 0 640 105\" role=\"img\" aria-label=\"Desistimiento por la Administración\">\n<rect x=\"120\" y=\"28\" width=\"400\" height=\"52\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/>\n<text x=\"320\" y=\"50\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--warn)\">DESISTIMIENTO DE LA ADMINISTRACIÓN</text>\n<text x=\"320\" y=\"69\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">solo de oficio · motivado · en los supuestos previstos en las leyes</text>\n</svg>"}, {"n": 94, "t": "Desistimiento y renuncia por los interesados", "ubic": "Título IV ▸ Capítulo V ▸ Sección 3.ª (Desistimiento y renuncia)", "idea": "Desistir y renunciar: efecto individual, aceptación de plano y salvedad del interés general.", "literal": "<p>1. Todo interesado podrá desistir de su solicitud o, cuando ello no esté prohibido por el ordenamiento jurídico, renunciar a sus derechos.</p><p>2. Si el escrito de iniciación se hubiera formulado por dos o más interesados, el desistimiento o la renuncia sólo afectará a aquellos que la hubiesen formulado.</p><p>3. Tanto el desistimiento como la renuncia podrán hacerse por cualquier medio que permita su constancia, siempre que incorpore las firmas que correspondan de acuerdo con lo previsto en la normativa aplicable.</p><p>4. La Administración aceptará de plano el desistimiento o la renuncia, y declarará concluso el procedimiento salvo que, habiéndose personado en el mismo terceros interesados, instasen éstos su continuación en el plazo de diez días desde que fueron notificados del desistimiento o renuncia.</p><p>5. Si la cuestión suscitada por la incoación del procedimiento entrañase interés general o fuera conveniente sustanciarla para su definición y esclarecimiento, la Administración podrá limitar los efectos del desistimiento o la renuncia al interesado y seguirá el procedimiento.</p>", "dis": "<ul>\n<li><b>94.1 — dos figuras:</b> todo interesado podrá <b>desistir de su solicitud</b> o, <b>cuando no esté prohibido</b> por el ordenamiento, <b>renunciar a sus derechos</b>.</li>\n<li><b>94.2 — efecto individual:</b> si la iniciación se formuló por <b>dos o más interesados</b>, el desistimiento o la renuncia <b>solo afectará a quienes la hubiesen formulado</b>.</li>\n<li><b>94.3 — forma:</b> por <b>cualquier medio que permita su constancia</b>, con las firmas correspondientes.</li>\n<li><b>94.4 — aceptación:</b> la Administración <b>aceptará de plano</b> el desistimiento o la renuncia y declarará <b>concluso el procedimiento</b>, <b>salvo</b> que, habiéndose personado <b>terceros interesados</b>, estos <b>insten su continuación</b> en el plazo de <b>diez días</b> desde que fueron notificados.</li>\n<li><b>94.5 — interés general:</b> si la cuestión entrañase <b>interés general</b> o fuera conveniente sustanciarla para su <b>definición y esclarecimiento</b>, la Administración podrá <b>limitar los efectos</b> del desistimiento o la renuncia al interesado y <b>seguirá el procedimiento</b>.</li>\n</ul>\n<div class=\"box ej\"><span class=\"lbl\">La diferencia esencial</span><b>Desistir</b> = abandono la <b>solicitud</b>; puedo volver a pedirlo. <b>Renunciar</b> = abandono el <b>derecho</b>; no puedo. Por eso la renuncia solo cabe si no está prohibida.</div>", "llano": "<p>Puedes retirarte del expediente o incluso renunciar al derecho, y la Administración lo acepta sin más. Pero si hay terceros personados, tienen diez días para pedir que siga; y si el asunto interesa a todos, puede seguir adelante aunque tú te vayas.</p>", "porque": "<p>La <b>aceptación de plano</b> respeta la autonomía del interesado: nadie está obligado a mantener una petición. Pero el procedimiento no es solo suyo: si hay <b>terceros</b> con interés o está en juego el <b>interés general</b>, la retirada de uno no puede cerrar el asunto para todos. Ahí está la clave de los apartados 4 y 5.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> retirar una queja conjunta sin que ello afecte a los demás firmantes.</li>\n<li><b>Real:</b> tres vecinos solicitan la revisión de una licencia; uno desiste. El procedimiento <b>continúa</b> para los otros dos (art. 94.2).</li>\n<li><b>Caso límite:</b> el único solicitante desiste, pero la cuestión afecta a la seguridad de un edificio. La Administración puede <b>limitar los efectos</b> del desistimiento y seguir (art. 94.5).</li>\n</ul>", "noej": "<ul>\n<li><b>No afecta</b> el desistimiento de uno a los demás cointeresados.</li>\n<li><b>No cabe</b> la renuncia cuando esté prohibida por el ordenamiento.</li>\n<li><b>No siempre</b> concluye el procedimiento: cabe la continuación por terceros o por interés general.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 84.1 LPAC:</b> desistimiento y renuncia como formas de terminación.</li>\n<li><b>Art. 68.1 LPAC:</b> desistimiento presunto por falta de subsanación.</li>\n<li><b>Art. 93 LPAC:</b> desistimiento de la Administración.</li>\n</ul>", "trampas": "<ul>\n<li><b>Diez días</b> para que los terceros insten la continuación.</li>\n<li>El efecto es <b>individual</b>: solo alcanza a quien desiste o renuncia.</li>\n<li>La Administración acepta <b>de plano</b>, salvo las dos excepciones.</li>\n</ul>", "ancla": "<p><b>«Me retiro yo, no los demás; y si interesa a todos, el expediente sigue.»</b></p>", "vis": "<svg viewBox=\"0 0 660 135\" role=\"img\" aria-label=\"Desistimiento y renuncia por los interesados\">\n<rect x=\"30\" y=\"28\" width=\"270\" height=\"66\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/>\n<text x=\"165\" y=\"50\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">DESISTIMIENTO</text>\n<text x=\"165\" y=\"69\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">abandono la solicitud</text>\n<text x=\"165\" y=\"85\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">puedo volver a pedirlo</text>\n<rect x=\"360\" y=\"28\" width=\"270\" height=\"66\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/>\n<text x=\"495\" y=\"50\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--exc)\">RENUNCIA</text>\n<text x=\"495\" y=\"69\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">abandono el derecho</text>\n<text x=\"495\" y=\"85\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">solo si no está prohibida</text>\n<text x=\"330\" y=\"122\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--ink2)\">Terceros personados: 10 días para instar la continuación · interés general: el procedimiento sigue</text>\n</svg>"}, {"n": 95, "t": "Requisitos y efectos", "ubic": "Título IV ▸ Capítulo V ▸ Sección 4.ª (Caducidad)", "idea": "Tres meses de paralización imputable al interesado; y la caducidad no prescribe.", "literal": "<p>1. En los procedimientos iniciados a solicitud del interesado, cuando se produzca su paralización por causa imputable al mismo, la Administración le advertirá que, transcurridos tres meses, se producirá la caducidad del procedimiento. Consumido este plazo sin que el particular requerido realice las actividades necesarias para reanudar la tramitación, la Administración acordará el archivo de las actuaciones, notificándoselo al interesado. Contra la resolución que declare la caducidad procederán los recursos pertinentes.</p><p>2. No podrá acordarse la caducidad por la simple inactividad del interesado en la cumplimentación de trámites, siempre que no sean indispensables para dictar resolución. Dicha inactividad no tendrá otro efecto que la pérdida de su derecho al referido trámite.</p><p>3. La caducidad no producirá por sí sola la prescripción de las acciones del particular o de la Administración, pero los procedimientos caducados no interrumpirán el plazo de prescripción. En los casos en los que sea posible la iniciación de un nuevo procedimiento por no haberse producido la prescripción, podrán incorporarse a éste los actos y trámites cuyo contenido se hubiera mantenido igual de no haberse producido la caducidad. En todo caso, en el nuevo procedimiento deberán cumplimentarse los trámites de alegaciones, proposición de prueba y audiencia al interesado.</p><p>4. Podrá no ser aplicable la caducidad en el supuesto de que la cuestión suscitada afecte al interés general, o fuera conveniente sustanciarla para su definición y esclarecimiento.</p>", "dis": "<ul>\n<li><b>95.1 — supuesto y plazo:</b> en procedimientos iniciados <b>a solicitud</b>, cuando se produzca su <b>paralización por causa imputable al interesado</b>, la Administración le <b>advertirá</b> que, transcurridos <b>tres meses</b>, se producirá la caducidad. Consumido el plazo sin reanudar, se acordará el <b>archivo</b>, notificándoselo. Contra la resolución que declare la caducidad proceden los <b>recursos pertinentes</b>.</li>\n<li><b>95.2 — límite:</b> <b>no</b> podrá acordarse la caducidad por la <b>simple inactividad</b> en la cumplimentación de trámites, <b>siempre que no sean indispensables</b> para dictar resolución. Esa inactividad solo produce la <b>pérdida del derecho al trámite</b>.</li>\n<li><b>95.3 — efectos sobre la prescripción:</b> la caducidad <b>no produce por sí sola la prescripción</b> de las acciones, <b>pero los procedimientos caducados no interrumpen el plazo de prescripción</b>. Si cabe iniciar un nuevo procedimiento, pueden <b>incorporarse los actos y trámites</b> cuyo contenido se hubiera mantenido igual; en todo caso deberán cumplimentarse de nuevo los trámites de <b>alegaciones, proposición de prueba y audiencia</b>.</li>\n<li><b>95.4 — excepción:</b> podrá <b>no aplicarse</b> la caducidad si la cuestión afecta al <b>interés general</b> o fuera conveniente sustanciarla para su definición y esclarecimiento.</li>\n</ul>", "llano": "<p>Si el expediente se para por tu culpa, te avisan: tres meses y caduca. Pero no vale cualquier inactividad, solo la que impide resolver. Y aunque caduque, no pierdes el derecho: puedes volver a pedirlo si no ha prescrito, aprovechando lo que siga valiendo, pero repitiendo alegaciones, prueba y audiencia.</p>", "porque": "<p>La caducidad evita expedientes zombis abiertos indefinidamente. La cautela del art. 95.2 impide un uso abusivo: si el trámite no era <b>indispensable</b>, archivar sería castigar al ciudadano por algo irrelevante.</p>\n<p>Lo más importante para un examen está en el art. 95.3: la caducidad <b>no extingue el derecho</b>, pero como el procedimiento caducado <b>no interrumpe la prescripción</b>, el tiempo transcurrido cuenta igual y puede acabar produciendo el mismo resultado.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> una solicitud que se cierra porque nunca entregaste lo que faltaba, aunque puedas volver a presentarla.</li>\n<li><b>Real:</b> solicitada una licencia, el interesado no aporta el proyecto imprescindible. Advertido, transcurren <b>tres meses</b>: se acuerda el <b>archivo</b>.</li>\n<li><b>Caso límite:</b> el interesado no aporta un dato accesorio que no impide resolver. <b>No cabe</b> la caducidad: solo pierde el derecho a ese trámite (art. 95.2).</li>\n</ul>", "noej": "<ul>\n<li><b>No cabe</b> caducar por inactividad en trámites <b>no indispensables</b>.</li>\n<li><b>No extingue</b> la caducidad el derecho de fondo.</li>\n<li><b>No interrumpen</b> la prescripción los procedimientos caducados.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 25.1.b) LPAC:</b> caducidad de los procedimientos iniciados de oficio desfavorables.</li>\n<li><b>Art. 84.1 LPAC:</b> la declaración de caducidad como forma de terminación.</li>\n<li><b>Art. 51 LPAC:</b> conservación de actos, con la misma lógica que el art. 95.3.</li>\n<li><b>Art. 73.3 LPAC:</b> decaimiento en el derecho al trámite.</li>\n</ul>", "trampas": "<ul>\n<li><b>Tres meses</b> desde la advertencia, y la <b>advertencia es obligatoria</b>.</li>\n<li>La inactividad en trámites <b>no indispensables</b> no produce caducidad.</li>\n<li>Los procedimientos caducados <b>no interrumpen</b> la prescripción.</li>\n<li>En el nuevo procedimiento hay que repetir <b>alegaciones, prueba y audiencia</b>.</li>\n</ul>", "ancla": "<p><b>«Tres meses tras avisarte; caduca el expediente, no el derecho; pero el reloj no se ha parado.»</b></p>", "vis": "<svg viewBox=\"0 0 660 140\" role=\"img\" aria-label=\"Caducidad por paralización imputable al interesado\">\n<defs><marker id=\"cd1\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\"><path d=\"M0 0 L9 4.5 L0 9 z\" fill=\"var(--exc)\"/></marker></defs>\n<rect x=\"15\" y=\"35\" width=\"185\" height=\"55\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/>\n<text x=\"107\" y=\"57\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--warn)\">Paralización imputable</text>\n<text x=\"107\" y=\"76\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">con advertencia previa</text>\n<path d=\"M203 62 L 238 62\" stroke=\"var(--exc)\" stroke-width=\"2\" marker-end=\"url(#cd1)\"/>\n<rect x=\"242\" y=\"35\" width=\"185\" height=\"55\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/>\n<text x=\"334\" y=\"57\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"var(--exc)\">3 meses</text>\n<text x=\"334\" y=\"76\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">caducidad y archivo</text>\n<path d=\"M430 62 L 465 62\" stroke=\"var(--exc)\" stroke-width=\"2\" marker-end=\"url(#cd1)\"/>\n<rect x=\"469\" y=\"35\" width=\"176\" height=\"55\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/>\n<text x=\"557\" y=\"57\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">El derecho subsiste</text>\n<text x=\"557\" y=\"76\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">si no ha prescrito</text>\n<text x=\"330\" y=\"126\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--exc)\">Pero los procedimientos caducados NO interrumpen el plazo de prescripción</text>\n</svg>"}]);
</script>
<script>
ARTS.push.apply(ARTS,[{"n": 96, "t": "Tramitación simplificada del procedimiento administrativo común", "ubic": "Título IV ▸ Capítulo VI (De la tramitación simplificada del procedimiento administrativo común)", "idea": "Tramitación simplificada: treinta días y ocho trámites tasados.", "literal": "<p>1. Cuando razones de interés público o la falta de complejidad del procedimiento así lo aconsejen, las Administraciones Públicas podrán acordar, de oficio o a solicitud del interesado, la tramitación simplificada del procedimiento. En cualquier momento del procedimiento anterior a su resolución, el órgano competente para su tramitación podrá acordar continuar con arreglo a la tramitación ordinaria.</p><p>2. Cuando la Administración acuerde de oficio la tramitación simplificada del procedimiento deberá notificarlo a los interesados. Si alguno de ellos manifestara su oposición expresa, la Administración deberá seguir la tramitación ordinaria.</p><p>3. Los interesados podrán solicitar la tramitación simplificada del procedimiento. Si el órgano competente para la tramitación aprecia que no concurre alguna de las razones previstas en el apartado 1, podrá desestimar dicha solicitud, en el plazo de cinco días desde su presentación, sin que exista posibilidad de recurso por parte del interesado. Transcurrido el mencionado plazo de cinco días se entenderá desestimada la solicitud.</p><p>4. En el caso de procedimientos en materia de responsabilidad patrimonial de las Administraciones Públicas, si una vez iniciado el procedimiento administrativo el órgano competente para su tramitación considera inequívoca la relación de causalidad entre el funcionamiento del servicio público y la lesión, así como la valoración del daño y el cálculo de la cuantía de la indemnización, podrá acordar de oficio la suspensión del procedimiento general y la iniciación de un procedimiento simplificado.</p><p>5. En el caso de procedimientos de naturaleza sancionadora, se podrá adoptar la tramitación simplificada del procedimiento cuando el órgano competente para iniciar el procedimiento considere que, de acuerdo con lo previsto en su normativa reguladora, existen elementos de juicio suficientes para calificar la infracción como leve, sin que quepa la oposición expresa por parte del interesado prevista en el apartado 2.</p><p>6. Salvo que reste menos para su tramitación ordinaria, los procedimientos administrativos tramitados de manera simplificada deberán ser resueltos en treinta días, a contar desde el siguiente al que se notifique al interesado el acuerdo de tramitación simplificada del procedimiento, y constarán únicamente de los siguientes trámites:</p><p>a) Inicio del procedimiento de oficio o a solicitud del interesado.</p><p>b) Subsanación de la solicitud presentada, en su caso.</p><p>c) Alegaciones formuladas al inicio del procedimiento durante el plazo de cinco días.</p><p>d) Trámite de audiencia, únicamente cuando la resolución vaya a ser desfavorable para el interesado.</p><p>e) Informe del servicio jurídico, cuando éste sea preceptivo.</p><p>f) Informe del Consejo General del Poder Judicial, cuando éste sea preceptivo.</p><p>g) Dictamen del Consejo de Estado u órgano consultivo equivalente de la Comunidad Autónoma en los casos en que sea preceptivo. Desde que se solicite el Dictamen al Consejo de Estado, u órgano equivalente, hasta que éste sea emitido, se producirá la suspensión automática del plazo para resolver. El órgano competente solicitará la emisión del Dictamen en un plazo tal que permita cumplir el plazo de resolución del procedimiento. El Dictamen podrá ser emitido en el plazo de quince días si así lo solicita el órgano competente. En todo caso, en el expediente que se remita al Consejo de Estado u órgano consultivo equivalente, se incluirá una propuesta de resolución. Cuando el Dictamen sea contrario al fondo de la propuesta de resolución, con independencia de que se atienda o no este criterio, el órgano competente para resolver acordará continuar el procedimiento con arreglo a la tramitación ordinaria, lo que se notificará a los interesados. En este caso, se entenderán convalidadas todas las actuaciones que se hubieran realizado durante la tramitación simplificada del procedimiento, a excepción del Dictamen del Consejo de Estado u órgano consultivo equivalente.</p><p>h) Resolución.</p><p>7. En el caso que un procedimiento exigiera la realización de un trámite no previsto en el apartado anterior, deberá ser tramitado de manera ordinaria.</p>", "dis": "<ul>\n<li><b>96.1 — cuándo:</b> cuando <b>razones de interés público</b> o la <b>falta de complejidad</b> lo aconsejen, cabe acordar la <span class=\"t\" data-k=\"simplificada\">tramitación simplificada</span>, <b>de oficio o a solicitud</b>. En cualquier momento anterior a la resolución puede acordarse <b>continuar por la tramitación ordinaria</b>.</li>\n<li><b>96.2 — oposición del interesado:</b> acordada de oficio, se <b>notifica</b>; si alguno manifiesta su <b>oposición expresa</b>, se seguirá la <b>tramitación ordinaria</b>.</li>\n<li><b>96.3 — solicitud del interesado:</b> si el órgano aprecia que no concurren las razones del apartado 1, podrá <b>desestimarla</b>.</li>\n<li><b>96.4 — responsabilidad patrimonial:</b> si el órgano considera <b>inequívoca</b> la relación de causalidad, la valoración del daño y el cálculo de la cuantía, podrá acordar la tramitación simplificada.</li>\n<li><b>96.5 — sancionadores:</b> cabe cuando el órgano competente para iniciar considere que hay elementos de juicio suficientes para calificar la infracción como <b>leve</b>, sin que quepa la oposición expresa del interesado <b>prevista en el apartado 2</b>.</li>\n<li><b>96.6 — plazo y trámites:</b> <b>salvo que reste menos para la ordinaria</b>, se resuelven en <b>treinta días</b> desde el siguiente a la notificación del acuerdo, y constarán <b>únicamente</b> de: <b>a)</b> inicio · <b>b)</b> subsanación · <b>c)</b> <b>alegaciones en cinco días</b> · <b>d)</b> <b>audiencia solo si la resolución va a ser desfavorable</b> · <b>e)</b> informe del <b>servicio jurídico</b> si es preceptivo · <b>f)</b> informe del <b>CGPJ</b> si es preceptivo · <b>g)</b> <b>dictamen</b> del Consejo de Estado u órgano equivalente cuando sea preceptivo · <b>h)</b> resolución.</li>\n<li><b>96.7 — trámite no previsto:</b> si el procedimiento exigiera un trámite no incluido, deberá tramitarse de manera <b>ordinaria</b>.</li>\n</ul>\n<div class=\"box warn\"><span class=\"lbl\">Las tres cifras del artículo</span><b>30 días</b> para resolver · <b>5 días</b> de alegaciones · <b>audiencia solo si la resolución será desfavorable</b>.</div>", "llano": "<p>Para asuntos sencillos o urgentes hay una vía rápida: treinta días y solo ocho trámites. El interesado puede oponerse y volver a la vía ordinaria —salvo en sancionadores por infracción leve—. Y si el asunto necesita cualquier trámite que no esté en la lista, hay que ir por la ordinaria.</p>", "porque": "<p>La simplificación no consiste en recortar garantías al azar, sino en <b>tasar</b> los trámites: por eso el art. 96.7 obliga a volver a la ordinaria en cuanto haga falta uno que no esté en la lista. Y la <b>audiencia</b> se mantiene precisamente donde importa —resoluciones desfavorables—, que es donde el derecho de defensa está en juego.</p>\n<p>La excepción del art. 96.5 —sancionadores por infracción leve— se explica porque ahí la simplificación beneficia al propio interesado: menos trámites para una infracción de escasa entidad.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> un trámite exprés para casos sencillos, con menos pasos.</li>\n<li><b>Real:</b> una reclamación patrimonial de 300 € por rotura de una farola con causalidad evidente: cabe tramitación simplificada (art. 96.4), resolviendo en <b>treinta días</b>.</li>\n<li><b>Caso límite:</b> se acuerda de oficio y el interesado se opone expresamente. Se sigue la <b>tramitación ordinaria</b> (art. 96.2), salvo que fuera un sancionador por infracción leve.</li>\n</ul>", "noej": "<ul>\n<li><b>No cabe</b> si el procedimiento exige un trámite no previsto en el art. 96.6.</li>\n<li><b>No puede</b> oponerse el interesado en el supuesto del art. 96.5 (sancionador por infracción leve).</li>\n<li><b>No siempre</b> hay audiencia: solo si la resolución va a ser <b>desfavorable</b>.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 33 LPAC:</b> tramitación de urgencia, figura distinta que reduce plazos a la mitad.</li>\n<li><b>Art. 82 LPAC:</b> trámite de audiencia en la tramitación ordinaria.</li>\n<li><b>Art. 81 LPAC:</b> dictámenes preceptivos en responsabilidad patrimonial.</li>\n<li><b>Art. 72 LPAC:</b> concentración de trámites.</li>\n</ul>", "trampas": "<ul>\n<li><b>Treinta días</b> para resolver y <b>cinco</b> de alegaciones.</li>\n<li>La <b>audiencia</b> solo si la resolución va a ser <b>desfavorable</b>.</li>\n<li>La oposición del interesado devuelve a la <b>ordinaria</b>, salvo en el art. 96.5.</li>\n<li>No confundir con la <b>tramitación de urgencia</b> del art. 33.</li>\n</ul>", "ancla": "<p><b>«30 para resolver, 5 para alegar, audiencia solo si te va mal.»</b></p>", "vis": "<svg viewBox=\"0 0 660 145\" role=\"img\" aria-label=\"Tramitación simplificada\">\n<rect x=\"195\" y=\"8\" width=\"270\" height=\"30\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/>\n<text x=\"330\" y=\"28\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">TRAMITACIÓN SIMPLIFICADA</text>\n<g font-size=\"10\" text-anchor=\"middle\" fill=\"currentColor\">\n<rect x=\"20\" y=\"52\" width=\"195\" height=\"62\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"117\" y=\"76\" font-size=\"13\" font-weight=\"700\" fill=\"var(--ej)\">30 días</text><text x=\"117\" y=\"96\">para resolver</text>\n<rect x=\"230\" y=\"52\" width=\"195\" height=\"62\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"327\" y=\"76\" font-size=\"13\" font-weight=\"700\" fill=\"var(--acc)\">5 días</text><text x=\"327\" y=\"96\">de alegaciones</text>\n<rect x=\"440\" y=\"52\" width=\"200\" height=\"62\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"540\" y=\"74\" font-size=\"11\" font-weight=\"700\" fill=\"var(--warn)\">Audiencia</text><text x=\"540\" y=\"92\">solo si la resolución</text><text x=\"540\" y=\"106\">va a ser desfavorable</text>\n</g>\n<text x=\"330\" y=\"136\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--exc)\">Si hace falta un trámite no previsto, se vuelve a la tramitación ordinaria</text>\n</svg>"}]);
</script>
<script>
const PLAZOS=[["20 %", "Reducción mínima por reconocimiento de responsabilidad y por pago voluntario", "Infractor", "85.3 LPAC", "Acumulables entre sí; exigen no recurrir"], ["15 días", "Duración máxima de las actuaciones complementarias", "Administración", "87 LPAC", "Suspenden el plazo para resolver"], ["7 días", "Alegaciones tras las actuaciones complementarias", "Interesados", "87 LPAC", "Desde su finalización"], ["15 días", "Puesta de manifiesto de cuestiones conexas no planteadas", "Interesados", "88.1 LPAC", "Plazo no superior a quince días"], ["15 días", "Alegaciones cuando el órgano aprecia mayor gravedad que la propuesta", "Inculpado", "90.2 LPAC", "En procedimientos sancionadores"], ["6 meses", "Silencio desestimatorio en responsabilidad patrimonial", "Interesado", "91.3 LPAC", "Resolución contraria a la indemnización"], ["10 días", "Plazo de los terceros personados para instar la continuación", "Terceros interesados", "94.4 LPAC", "Tras el desistimiento o la renuncia"], ["3 meses", "Caducidad por paralización imputable al interesado", "Interesado", "95.1 LPAC", "Previa advertencia de la Administración"], ["30 días", "Resolución en tramitación simplificada", "Administración", "96.6 LPAC", "Salvo que reste menos para la ordinaria"], ["5 días", "Alegaciones en tramitación simplificada", "Interesados", "96.6.c) LPAC", "Al inicio del procedimiento"], ["5 causas", "Supuestos de archivo sin propuesta de resolución", "Instructor", "89.1 LPAC", "Letras a) a e)"], ["50.000 €", "Umbral del dictamen preceptivo, previo a la resolución patrimonial", "Reclamante", "81.2 y 91.1 LPAC", "La resolución espera al dictamen"]];
const FLASH=[["Formas de terminación del procedimiento", "<b>Resolución</b> · <b>desistimiento</b> · <b>renuncia</b> al derecho, si no está prohibida · <b>declaración de caducidad</b> (art. 84.1); y la <b>imposibilidad material</b> sobrevenida, con resolución motivada (art. 84.2)."], ["¿Qué reducción se aplica por reconocer la responsabilidad o pagar voluntariamente?", "<b>Al menos el 20 %</b> sobre la sanción propuesta, y son <b>acumulables</b> entre sí (art. 85.3)."], ["¿A qué está condicionada la efectividad de esas reducciones?", "Al <b>desistimiento o renuncia</b> de cualquier acción o recurso en vía administrativa contra la sanción; y deben constar en la <b>notificación de iniciación</b> (art. 85.3)."], ["¿De qué no libera el pago voluntario?", "De la <b>reposición de la situación alterada</b> ni de la <b>indemnización</b> por los daños y perjuicios causados (art. 85.2)."], ["Requisitos de la terminación convencional", "Que no sea <b>contraria al ordenamiento</b>, que no verse sobre <b>materias no susceptibles de transacción</b> y que tenga por objeto <b>satisfacer el interés público</b> (art. 86.1)."], ["Contenido mínimo de los acuerdos del art. 86", "<b>Identificación de las partes</b>, <b>ámbito personal, funcional y territorial</b> y <b>plazo de vigencia</b> (art. 86.2)."], ["¿Qué plazos rigen las actuaciones complementarias?", "<b>Quince días</b> como máximo para practicarlas y <b>siete días</b> de alegaciones posteriores; el plazo para resolver <b>queda suspendido</b> (art. 87)."], ["¿Qué no son actuaciones complementarias?", "Los <b>informes que preceden inmediatamente a la resolución final</b> (art. 87)."], ["¿Qué debe decidir la resolución?", "<b>Todas las cuestiones planteadas</b> por los interesados y las <b>derivadas</b> del procedimiento; las conexas no planteadas, previa puesta de manifiesto por plazo <b>no superior a quince días</b> (art. 88.1)."], ["¿Puede la resolución agravar la situación inicial del solicitante?", "<b>No, en ningún caso</b>, sin perjuicio de que la Administración pueda iniciar de oficio un nuevo procedimiento (art. 88.2)."], ["¿Puede la Administración abstenerse de resolver por oscuridad de la norma?", "<b>En ningún caso</b>; aunque cabe <b>inadmitir</b> solicitudes de derechos no previstos en el ordenamiento o manifiestamente carentes de fundamento (art. 88.5)."], ["¿Cuándo sirve un informe de motivación?", "Cuando se <b>acepte</b> y se <b>incorpore al texto</b> de la resolución (art. 88.6)."], ["Las cinco causas de archivo sin propuesta de resolución", "<b>Inexistencia</b> de los hechos · hechos <b>no acreditados</b> · hechos que <b>no constituyen manifiestamente</b> infracción · <b>no hay o no se identifica</b> al responsable o está exento · <b>prescripción</b> de la infracción (art. 89.1)."], ["¿Qué debe fijar la propuesta de resolución sancionadora?", "De forma motivada, los <b>hechos probados</b>, su <b>exacta calificación jurídica</b>, la <b>infracción</b>, la <b>persona responsable</b>, la <b>sanción</b> y las <b>medidas provisionales</b> (art. 89.3)."], ["¿Puede la resolución sancionadora aceptar hechos distintos de los del procedimiento?", "<b>No</b>, con independencia de su diferente valoración jurídica (art. 90.2)."], ["¿Qué ocurre si el órgano aprecia mayor gravedad que la propuesta?", "Se <b>notifica al inculpado</b> para que alegue en el plazo de <b>quince días</b> (art. 90.2)."], ["¿Cuándo es ejecutiva la resolución sancionadora?", "Cuando <b>no quepa contra ella ningún recurso ordinario en vía administrativa</b> (art. 90.3)."], ["¿Sobre qué debe pronunciarse siempre la resolución en responsabilidad patrimonial?", "Sobre la <b>existencia o no de relación de causalidad</b> y, en su caso, sobre la <b>valoración del daño</b> y la <b>cuantía y modo</b> de la indemnización (art. 91.2)."], ["Efecto del transcurso de seis meses en responsabilidad patrimonial", "Podrá entenderse que la resolución es <b>contraria a la indemnización</b> del particular (art. 91.3)."], ["¿Puede la Administración desistir?", "Sí, en procedimientos iniciados <b>de oficio</b>, <b>motivadamente</b> y en los supuestos y con los requisitos previstos <b>en las leyes</b> (art. 93)."], ["¿A quién afecta el desistimiento formulado por uno de varios interesados?", "<b>Solo a quien lo hubiese formulado</b> (art. 94.2)."], ["¿Cuándo no concluye el procedimiento pese al desistimiento?", "Si <b>terceros interesados personados</b> instan su continuación en <b>diez días</b>, o si la cuestión entraña <b>interés general</b> (art. 94.4 y 94.5)."], ["Plazo de caducidad por paralización imputable al interesado", "<b>Tres meses</b> desde la advertencia de la Administración (art. 95.1)."], ["¿Interrumpen la prescripción los procedimientos caducados?", "<b>No</b>; la caducidad tampoco produce por sí sola la prescripción de las acciones (art. 95.3)."], ["Plazo y trámites de la tramitación simplificada", "<b>Treinta días</b> para resolver y ocho trámites tasados, con <b>cinco días</b> de alegaciones y <b>audiencia solo si la resolución va a ser desfavorable</b> (art. 96.6)."]];
const TEST=[{"a": 84, "q": "¿Cuál de estas NO es una forma de terminación prevista en el art. 84?", "o": [["la suspensión del procedimiento", 1, "Correcto: la suspensión no termina el procedimiento, lo detiene."], ["la renuncia al derecho en que se funde la solicitud", 0, "Sí lo es, cuando no esté prohibida."], ["la declaración de caducidad", 0, "Sí lo es."], ["la imposibilidad material de continuarlo por causas sobrevenidas", 0, "Sí lo es (art. 84.2), con resolución motivada."]]}, {"a": 85, "q": "Las reducciones por reconocimiento de responsabilidad y por pago voluntario:", "o": [["son de al menos el 20 % y acumulables entre sí", 1, "Correcto: art. 85.3, y su efectividad exige desistir o renunciar a recurrir."], ["son del 50 % y alternativas", 0, "No es lo que dispone la ley."], ["son del 20 % pero no acumulables", 0, "La ley las declara acumulables."], ["no existen en la Ley 39/2015", 0, "Están en el art. 85.3."]]}, {"a": 85, "q": "El pago voluntario de la sanción pecuniaria antes de la resolución:", "o": [["implica la terminación del procedimiento, salvo en cuanto a la reposición de la situación alterada y la indemnización", 1, "Correcto: art. 85.2."], ["no produce ningún efecto sobre el procedimiento", 0, "Sí lo termina."], ["exime también de reparar los daños causados", 0, "Precisamente la ley lo excepciona."], ["solo cabe tras la propuesta de resolución", 0, "Cabe en cualquier momento anterior a la resolución."]]}, {"a": 86, "q": "Los acuerdos, pactos y convenios que terminan el procedimiento:", "o": [["no supondrán alteración de las competencias atribuidas a los órganos ni de las responsabilidades de autoridades y funcionarios", 1, "Correcto: art. 86.4."], ["pueden alterar la competencia si así se pacta", 0, "Está expresamente prohibido."], ["pueden versar sobre cualquier materia", 0, "No sobre materias no susceptibles de transacción."], ["no requieren contenido mínimo alguno", 0, "El art. 86.2 lo establece."]]}, {"a": 87, "q": "Las actuaciones complementarias deben practicarse en un plazo:", "o": [["no superior a quince días, con siete días de alegaciones posteriores", 1, "Correcto: art. 87. El plazo para resolver queda suspendido."], ["no superior a siete días, con quince de alegaciones", 0, "Están invertidos."], ["de un mes", 0, "No es el plazo legal."], ["sin límite temporal", 0, "La ley fija un máximo."]]}, {"a": 87, "q": "Tienen la consideración de actuaciones complementarias los informes que preceden inmediatamente a la resolución final.", "vf": true, "ok": false, "fb": "<b>Falso.</b> El art. 87 los excluye expresamente de tal consideración."}, {"a": 88, "q": "En los procedimientos iniciados a solicitud del interesado, la resolución:", "o": [["será congruente con las peticiones, sin que en ningún caso pueda agravar su situación inicial", 1, "Correcto: art. 88.2, sin perjuicio de iniciar de oficio otro procedimiento."], ["puede agravar la situación inicial si se aprecian nuevos hechos", 0, "Está prohibido en todo caso."], ["solo puede pronunciarse sobre lo expresamente pedido", 0, "Decide también las cuestiones derivadas del procedimiento."], ["no necesita motivación en ningún caso", 0, "Se motiva en los casos del art. 35."]]}, {"a": 88, "q": "Completa: en ningún caso podrá la Administración abstenerse de resolver so pretexto de ______, oscuridad o insuficiencia de los preceptos legales aplicables.", "gap": "silencio", "fb": "De <b>silencio</b>, oscuridad o insuficiencia (art. 88.5). Es la prohibición del <i>non liquet</i>."}, {"a": 89, "q": "¿Cuál de estas NO es causa de archivo sin propuesta de resolución en el procedimiento sancionador?", "o": [["que el infractor haya reconocido su responsabilidad", 1, "Correcto: eso permite resolver con imposición de sanción (art. 85.1), no archivar."], ["la inexistencia de los hechos que pudieran constituir la infracción", 0, "Letra a) del art. 89.1."], ["que los hechos no resulten acreditados", 0, "Letra b)."], ["que haya prescrito la infracción", 0, "Letra e)."]]}, {"a": 89, "q": "La propuesta de resolución sancionadora debe fijar de forma motivada:", "o": [["los hechos probados y su exacta calificación jurídica, la infracción, el responsable y la sanción propuesta", 1, "Correcto: art. 89.3."], ["únicamente la sanción propuesta", 0, "Debe fijar mucho más."], ["solo los hechos, sin calificación", 0, "Se exige la exacta calificación jurídica."], ["la valoración de la prueba, pero no los hechos", 0, "Debe fijar los hechos probados."]]}, {"a": 90, "q": "Si el órgano competente para resolver considera que la infracción reviste mayor gravedad que la determinada en la propuesta:", "o": [["lo notificará al inculpado para que alegue en el plazo de quince días", 1, "Correcto: art. 90.2."], ["resolverá directamente con la sanción más grave", 0, "Debe dar audiencia previa."], ["devolverá el expediente al instructor", 0, "No es lo previsto."], ["archivará el procedimiento", 0, "No procede."]]}, {"a": 90, "q": "La resolución sancionadora es ejecutiva:", "o": [["cuando no quepa contra ella ningún recurso ordinario en vía administrativa", 1, "Correcto: art. 90.3."], ["desde que se dicta, como cualquier acto", 0, "El art. 90.3 modula la regla general del art. 38."], ["desde su notificación al interesado", 0, "No es el criterio del art. 90.3."], ["cuando lo acuerde el órgano sancionador", 0, "No depende de un acuerdo."]]}, {"a": 91, "q": "Transcurridos seis meses desde el inicio de un procedimiento de responsabilidad patrimonial sin resolución expresa ni acuerdo:", "o": [["podrá entenderse que la resolución es contraria a la indemnización del particular", 1, "Correcto: art. 91.3."], ["se entiende reconocida la indemnización", 0, "El silencio es desestimatorio."], ["caduca el procedimiento en todo caso", 0, "No es el efecto que fija el art. 91.3."], ["se prorroga automáticamente el plazo", 0, "No existe tal prórroga."]]}, {"a": 92, "q": "En el ámbito local, los procedimientos de responsabilidad patrimonial se resuelven por:", "o": [["los órganos correspondientes de las entidades que integran la Administración local", 1, "Correcto: art. 92."], ["el Ministro competente por razón de la materia", 0, "Eso es el ámbito estatal."], ["el Consejo de Ministros", 0, "Solo en los casos del art. 32.3 de la Ley 40/2015."], ["el Consejo Consultivo autonómico", 0, "Dictamina, no resuelve."]]}, {"a": 93, "q": "El desistimiento por la Administración:", "o": [["solo cabe en procedimientos iniciados de oficio, motivadamente y en los supuestos previstos en las leyes", 1, "Correcto: art. 93."], ["cabe libremente en cualquier procedimiento", 0, "Tiene doble límite."], ["cabe en los iniciados a solicitud del interesado", 0, "Solo en los de oficio."], ["no está previsto en la Ley 39/2015", 0, "Sí lo está."]]}, {"a": 94, "q": "Si el escrito de iniciación fue formulado por varios interesados y uno desiste:", "o": [["el desistimiento solo afectará a quien lo hubiese formulado", 1, "Correcto: art. 94.2."], ["se archiva el procedimiento para todos", 0, "El efecto es individual."], ["deben ratificarlo todos los demás", 0, "No es necesario."], ["se convierte automáticamente en renuncia", 0, "Son figuras distintas."]]}, {"a": 94, "q": "Presentado el desistimiento, la Administración lo aceptará de plano salvo que:", "o": [["terceros interesados personados insten la continuación en el plazo de diez días", 1, "Correcto: art. 94.4; y también cabe seguir por interés general (art. 94.5)."], ["lo impugne el instructor", 0, "No está previsto."], ["hayan transcurrido tres meses", 0, "No guarda relación."], ["el procedimiento sea sancionador", 0, "No es la excepción prevista."]]}, {"a": 95, "q": "La caducidad por paralización imputable al interesado se produce transcurridos:", "o": [["tres meses desde la advertencia de la Administración", 1, "Correcto: art. 95.1, con archivo posterior notificado."], ["seis meses desde el inicio", 0, "No es el supuesto del art. 95."], ["un mes desde la paralización", 0, "No es el plazo legal."], ["treinta días", 0, "No es el plazo legal."]]}, {"a": 95, "q": "Los procedimientos caducados interrumpen el plazo de prescripción.", "vf": true, "ok": false, "fb": "<b>Falso.</b> El art. 95.3 dispone que los procedimientos caducados <b>no interrumpirán</b> el plazo de prescripción, aunque la caducidad no produzca por sí sola la prescripción."}, {"a": 96, "q": "En la tramitación simplificada, el trámite de audiencia:", "o": [["se practica únicamente cuando la resolución vaya a ser desfavorable para el interesado", 1, "Correcto: art. 96.6.d)."], ["se practica siempre, con el plazo ordinario", 0, "Solo en el supuesto indicado."], ["se suprime en todo caso", 0, "Se mantiene si la resolución será desfavorable."], ["se sustituye por información pública", 0, "No es lo previsto."]]}];
const CASOS=[{"t": "Caso 1 · La multa que se puede rebajar", "e": "Se notifica el acuerdo de iniciación de un expediente sancionador con propuesta de <b>1.200 €</b> por una infracción que además ha dañado el mobiliario urbano. El interesado quiere pagar cuanto antes y no complicarse. <b>¿Qué opciones tiene, qué ahorra y qué no se evita?</b>", "s": "<p><b>1) Las dos vías.</b> El art. <b>85.1</b> permite <b>reconocer la responsabilidad</b>; el art. <b>85.2</b>, el <b>pago voluntario</b> en cualquier momento anterior a la resolución. Ambas terminan el procedimiento.</p><p><b>2) El ahorro.</b> El art. <b>85.3</b> impone reducciones de <b>al menos el 20 %</b> sobre el importe propuesto, <b>acumulables entre sí</b>. Reconociendo y pagando, la reducción mínima sería del <b>40 %</b>: de 1.200 € a <b>720 €</b>. Y el porcentaje puede haberse <b>incrementado reglamentariamente</b>.</p><p><b>3) El requisito.</b> Su efectividad está <b>condicionada al desistimiento o renuncia</b> de cualquier acción o recurso en vía administrativa. Además, las reducciones <b>deben constar</b> en la notificación de iniciación (arts. 85.3 y 64.2.d).</p><p><b>4) Lo que no se evita.</b> El art. 85.2 excluye expresamente de la terminación lo relativo a la <b>reposición de la situación alterada</b> y a la <b>indemnización</b> por los daños. Si la cuantía del daño no quedó determinada, se fijará por el <b>procedimiento complementario</b> del art. <b>90.4</b>, cuya resolución es <b>inmediatamente ejecutiva</b> y <b>pone fin a la vía administrativa</b>; cabe en él la terminación convencional, sin que implique reconocimiento de responsabilidad.</p><p><b>5) Balance.</b> Paga menos y antes, pero <b>renuncia a discutir</b> la sanción y <b>sigue debiendo</b> el daño causado.</p>"}, {"t": "Caso 2 · El expediente que se quedó parado", "e": "Un particular solicita una licencia el 10 de enero. El 3 de febrero se le requiere el proyecto técnico, <b>indispensable</b> para resolver. No lo aporta. El 20 de febrero la Administración le advierte de la caducidad. El 5 de julio se dicta el archivo. En septiembre vuelve a solicitar lo mismo. <b>Analiza cada paso y qué se puede aprovechar.</b>", "s": "<p><b>1) La advertencia.</b> Es <b>obligatoria</b>: el art. <b>95.1</b> exige advertir al interesado de que, transcurridos <b>tres meses</b>, se producirá la caducidad. Sin advertencia no cabe caducar.</p><p><b>2) El cómputo.</b> Advertido el 20 de febrero, los tres meses vencen hacia el 20 de mayo. Consumido el plazo sin reanudar, procede el <b>archivo</b>, que debe <b>notificarse</b> y contra el que caben los <b>recursos pertinentes</b>.</p><p><b>3) ¿Era caducable?</b> Sí. El art. <b>95.2</b> impide caducar por inactividad en trámites <b>no indispensables</b>; aquí el proyecto técnico <b>sí</b> lo es. Si hubiera sido un dato accesorio, solo habría procedido el <b>decaimiento</b> en el trámite (art. 73.3).</p><p><b>4) La nueva solicitud.</b> El art. <b>95.3</b> es claro: la caducidad <b>no produce por sí sola la prescripción</b> del derecho, así que puede volver a solicitarlo. En el nuevo procedimiento pueden <b>incorporarse</b> los actos y trámites cuyo contenido se hubiera mantenido igual, pero <b>en todo caso</b> deben cumplimentarse de nuevo los de <b>alegaciones, proposición de prueba y audiencia</b>.</p><p><b>5) La advertencia que hay que retener.</b> El procedimiento caducado <b>no interrumpe la prescripción</b>: los meses perdidos cuentan igual. Si el derecho tuviera plazo, la caducidad puede acabar costándolo.</p>"}, {"t": "Caso 3 · Vía rápida o vía ordinaria", "e": "Un ayuntamiento tramita tres asuntos: <b>(a)</b> reclamación patrimonial de 250 € por rotura de una farola, con causalidad evidente; <b>(b)</b> expediente sancionador por una infracción claramente <b>leve</b>; <b>(c)</b> una licencia que exige <b>información pública</b>. Se plantea usar la tramitación simplificada en los tres. <b>Valora cada caso.</b>", "s": "<p><b>(a) Procede.</b> El art. <b>96.4</b> permite la tramitación simplificada en responsabilidad patrimonial cuando el órgano considere <b>inequívocas</b> la relación de causalidad, la valoración del daño y el cálculo de la cuantía. Plazo: <b>treinta días</b> (art. 96.6). Si el interesado se <b>opusiera expresamente</b>, se seguiría la ordinaria (art. 96.2).</p><p><b>(b) Procede, y sin posible oposición.</b> El art. <b>96.5</b> la admite cuando el órgano competente para iniciar considere que hay elementos suficientes para calificar la infracción como <b>leve</b>, <b>sin que quepa la oposición expresa</b> del interesado. La <b>audiencia</b> se practicará porque la resolución será <b>desfavorable</b> (art. 96.6.d), y las alegaciones serán de <b>cinco días</b>.</p><p><b>(c) No procede.</b> La <b>información pública</b> del art. 83 <b>no figura</b> entre los ocho trámites del art. <b>96.6</b>. Conforme al art. <b>96.7</b>, si el procedimiento exige un trámite no previsto, <b>deberá tramitarse de manera ordinaria</b>.</p><p><b>Advertencia final.</b> No confundir la <b>tramitación simplificada</b> (art. 96: trámites tasados, treinta días) con la <b>tramitación de urgencia</b> (art. 33: se reducen los plazos a la mitad, salvo los de presentación de solicitudes y recursos). Son figuras distintas y se preguntan juntas.</p>"}];

const INTRO_HTML="<section class=\"card\" id=\"intro\"><h2>Tema 3 · Bloque 4 · Finalización del procedimiento</h2><p class=\"small\">Cuarto bloque del tema 3: los Capítulos V y VI del Título IV. Cómo acaba un procedimiento —con decisión o sin ella—, qué debe contener la resolución y cuál es la vía rápida para los asuntos sencillos.</p><div class=\"box ej\"><span class=\"lbl\">La idea que ordena el bloque</span>Un procedimiento puede acabar <b>con pronunciamiento sobre el fondo</b> —resolución, arts. 88 a 92, o acuerdo, art. 86— o <b>sin él</b> —desistimiento, renuncia, caducidad e imposibilidad material, arts. 93 a 95—. Y el art. 96 no es una forma de terminar, sino una forma <b>abreviada</b> de llegar hasta el final.</div><div class=\"box warn\"><span class=\"lbl\">Fuentes utilizadas y vigencia</span><ul><li><b>Ley 39/2015, de 1 de octubre</b> (documento 1 de la biblioteca), texto consolidado. Arts. 84 a 96.</li><li>Concordancias con la <b>Ley 40/2015</b> (documento 2): art. 28.1 sobre reposición de la situación alterada, art. 34 sobre cálculo de la indemnización, arts. 47 a 53 sobre convenios y art. 30 sobre prescripción de infracciones.</li><li><b>Aportación externa</b>: el <b>art. 29 de la Constitución</b>, sobre el derecho de petición, expresamente citado por el art. 88.5. Verifica la vigencia de los textos en el BOE consolidado.</li></ul></div><svg viewBox=\"0 0 660 200\" role=\"img\" aria-label=\"Mapa conceptual de la terminación del procedimiento\"><rect x=\"215\" y=\"8\" width=\"230\" height=\"32\" rx=\"9\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"330\" y=\"30\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"#fff\">TERMINACIÓN</text><line x1=\"330\" y1=\"40\" x2=\"330\" y2=\"56\" stroke=\"var(--acc)\" stroke-width=\"2\"/><line x1=\"165\" y1=\"56\" x2=\"495\" y2=\"56\" stroke=\"var(--acc)\" stroke-width=\"2\"/><line x1=\"165\" y1=\"56\" x2=\"165\" y2=\"72\" stroke=\"var(--acc)\" stroke-width=\"2\"/><line x1=\"495\" y1=\"56\" x },{passive:true});

/* ---------- BUSCADOR ---------- */
var q=document.getElementById('q'),timer=null;
function clearMarks(){document.querySelectorAll('mark.hit').forEach(function(m){
 var p=m.parentNode;p.replaceChild(document.createTextNode(m.textContent),m);p.normalize();});}
q.addEventListener('input',function(){
 clearTimeout(timer);timer=setTimeout(function(){
  clearMarks();
  var term=q.value.trim();
  document.querySelectorAll('section.card').forEach(function(s){s.classList.remove('hide');});
  if(term.length<3)return;
  var rx=new RegExp(term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
  document.querySelectorAll('section.card').forEach(function(s){
   var found=false;
   var w=document.createTreeWalker(s,NodeFilter.SHOW_TEXT,null);var nodes=[];
   while(w.nextNode()){var nd=w.currentNode;
    if(nd.parentNode.closest('script,style,mark'))continue;
    if(rx.test(nd.nodeValue)){nodes.push(nd);rx.lastIndex=0;}}
   nodes.forEach(function(nd){
    found=true;
    var span=document.createElement('span');
    span.innerHTML=nd.nodeValue.replace(rx,function(m){return '<mark class="hit">'+m+'</mark>';});
    nd.parentNode.replaceChild(span,nd);});
   if(found){s.querySelectorAll('details.panel').forEach(function(d){if(d.querySelector('mark.hit'))d.open=true;});}
   s.classList.toggle('hide',!found);
  });
 },220);});

var state=TEST.map(function(){return{ans:null,done:false,right:false};});

function drawTest(){

   if(s.done)h+='<div class="small" style="margin-top:.3rem;color:'+(s.right?'var(--ej)':'var(--exc)')+'">'+(s.right?'Correcto. ':'Respuesta correcta: <b>'+t.gap+'</b>. ')+t.fb+'</div>';
  }
  h+='</div>';});
 document.getElementById('testbox').innerHTML=h;
 document.querySelectorAll('.opt').forEach(function(o){
  o.onclick=function(){var qi=+o.getAttribute('data-q');if(state[qi].done)return;

}

(function(){
"use strict";
var K_THEME="oposi_bII_theme", K_FS="oposi_bII_fs", K_STREAK="oposi_bII_streak";
function load(k,f){try{var v=localStorage.getItem(k);return v?JSON.parse(v):f;}catch(e){return f;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
var root=document.documentElement;

/* Tema persistente (sobrescribe el toggle simple anterior) */
var saved=load(K_THEME,null);
if(saved){root.setAttribute("data-theme",saved);}
else if(window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches){root.setAttribute("data-theme","dark");}

if(bt)bt.onclick=function(){

};

var fs=load(K_FS,16);

setFs(fs);
var bp=document.getElementById("fs+"),bm=document.getElementById("fs-");
if(bp)bp.onclick=function(){setFs(fs+1);};
if(bm)bm.onclick=function(){setFs(fs-1);};

(function(){

  var hoy=new Date().toISOString().slice(0,10);
  var s=load(K_STREAK,{last:null,n:0});
  if(s.last!==hoy){
    var ayer=new Date(Date.now()-864e5).toISOString().slice(0,10);
    s.n=(s.last===ayer)?s.n+1:1;s.last=hoy;save(K_STREAK,s);
  }

/* Reveal on scroll para las tarjetas */
function reveal(){
  var els=document.querySelectorAll("section.card:not(.rv)");
  if(!els.length)return;
  if(!("IntersectionObserver" in window)){return;}
  var io=new IntersectionObserver(function(es){
    es.forEach(function(en){if(en.isIntersecting){en.target.classList.add("in");io.unobserve(en.target);}});
  },{threshold:.06,rootMargin:"0px 0px -30px 0px"});
  Array.prototype.forEach.call(els,function(el){el.classList.add("rv");io.observe(el);});
}

/* Sección activa en el índice lateral */
function spy(){
  var links=document.querySelectorAll("nav.side a[href^='#']");
  if(!links.length||!("IntersectionObserver" in window))return;
  var map={};
  Array.prototype.forEach.call(links,function(a){
    var t=document.getElementById(a.getAttribute("href").slice(1));
    if(t)map[t.id]=a;
  });
  var io=new IntersectionObserver(function(es){
    es.forEach(function(en){
      if(en.isIntersecting){
        Array.prototype.forEach.call(links,function(a){a.classList.remove("on");});
        if(map[en.target.id])map[en.target.id].classList.add("on");
      }
    });
  },{rootMargin:"-80px 0px -70% 0px",threshold:0});
  Object.keys(map).forEach(function(id){io.observe(document.getElementById(id));});
}

/* Ripple en botones */
document.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b||b.classList.contains("navtoggle"))return;

  s.style.left=(e.clientX-r.left-d/2)+"px";s.style.top=(e.clientY-r.top-d/2)+"px";

});

if(document.getElementById("main")&&document.getElementById("main").children.length){init();}
else{setTimeout(init,60);}
addEventListener("load",function(){setTimeout(init,80);});
})();

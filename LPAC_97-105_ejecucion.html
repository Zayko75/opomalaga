const GLOSARIO={"interesado": "Interesado: quien está legitimado para promover un procedimiento o intervenir en él porque es titular de derechos o intereses legítimos afectados por la decisión (art. 4 de la Ley 39/2015).", "conten": "Recurso contencioso-administrativo: impugnación ante los juzgados y tribunales de lo contencioso-administrativo, es decir, ya fuera de la propia Administración.", "silencio": "Silencio administrativo: efecto que la ley anuda a la falta de resolución expresa en plazo. Puede ser estimatorio (positivo) o desestimatorio (negativo) según el procedimiento.", "habil": "Días hábiles: se excluyen del cómputo los sábados, los domingos y los declarados festivos (art. 30.2 de la Ley 39/2015).", "pleno": "Pleno: órgano colegiado formado por todos los concejales o diputados de la entidad local.", "titulo": "Título habilitante: resolución previa que sirve de fundamento jurídico a cualquier actuación material de ejecución que limite derechos. Sin ella, la actuación es una vía de hecho.", "viadehecho": "Vía de hecho: actuación material de la Administración sin acto que la ampare o excediendo de él. Carece de la presunción de validez y admite acciones específicas de reacción.", "ejecutoriedad": "Ejecutoriedad: cualidad de los actos administrativos de ser inmediatamente ejecutivos, salvo las cuatro excepciones del art. 98.1.", "ejecucionforzosa": "Ejecución forzosa: empleo por la Administración de medios coactivos para hacer cumplir un acto que el obligado no cumple voluntariamente.", "apercibimiento": "Apercibimiento: advertencia previa e ineludible al obligado antes de iniciar la ejecución forzosa (art. 99).", "apremio": "Apremio sobre el patrimonio: medio de ejecución forzosa aplicable cuando hay que satisfacer una cantidad líquida, siguiendo el procedimiento de apremio.", "subsidiaria": "Ejecución subsidiaria: la Administración realiza el acto por sí o a través de terceros, a costa del obligado, cuando el acto no es personalísimo.", "multacoerc": "Multa coercitiva: multa reiterada por lapsos de tiempo suficientes, dirigida a forzar el cumplimiento. No es una sanción, aunque es compatible con ellas.", "compulsion": "Compulsión sobre las personas: ejecución forzosa mediante coacción física directa sobre el obligado, solo en obligaciones personalísimas de no hacer o soportar y con autorización legal expresa.", "personalisimo": "Acto personalísimo: aquel cuya prestación solo puede realizar el obligado, por lo que no admite ejecución subsidiaria.", "proporcionalidad": "Principio de proporcionalidad: la ejecución forzosa debe emplear el medio adecuado y, entre varios admisibles, el menos restrictivo de la libertad individual.", "posesoria": "Acciones posesorias: acciones civiles para proteger la posesión (los antiguos interdictos). No se admiten a trámite contra actuaciones administrativas competentes y regulares.", "cantidadliquida": "Cantidad líquida: suma de dinero determinada o determinable mediante simple operación aritmética, presupuesto del apremio sobre el patrimonio."};
const LABELS={"interesado": "Interesado", "conten": "Recurso contencioso-administrativo", "silencio": "Silencio administrativo", "habil": "Días hábiles", "pleno": "Pleno", "titulo": "Título habilitante", "viadehecho": "Vía de hecho", "ejecutoriedad": "Ejecutoriedad", "ejecucionforzosa": "Ejecución forzosa", "apercibimiento": "Apercibimiento", "apremio": "Apremio sobre el patrimonio", "subsidiaria": "Ejecución subsidiaria", "multacoerc": "Multa coercitiva", "compulsion": "Compulsión sobre las personas", "personalisimo": "Acto personalísimo", "proporcionalidad": "Proporcionalidad", "posesoria": "Acciones posesorias", "cantidadliquida": "Cantidad líquida"};
</script>
<script>
const ARTS=[{"n": 97, "t": "Título", "ubic": "Título IV (De las disposiciones sobre el procedimiento administrativo común) ▸ Capítulo VII (Ejecución)", "idea": "Sin resolución previa no hay ejecución material que limite derechos.", "literal": "<p>1. Las Administraciones Públicas no iniciarán ninguna actuación material de ejecución de resoluciones que limite derechos de los particulares sin que previamente haya sido adoptada la resolución que le sirva de fundamento jurídico.</p><p>2. El órgano que ordene un acto de ejecución material de resoluciones estará obligado a notificar al particular interesado la resolución que autorice la actuación administrativa.</p>", "dis": "<ul>\n<li><b>97.1 — regla:</b> las Administraciones <b>no iniciarán ninguna actuación material de ejecución</b> de resoluciones <b>que limite derechos de los particulares</b> sin que previamente haya sido adoptada la <b>resolución que le sirva de fundamento jurídico</b>.</li>\n<li><b>97.2 — deber de notificar:</b> el órgano que <b>ordene</b> un acto de ejecución material está <b>obligado a notificar</b> al particular interesado <b>la resolución que autorice</b> la actuación administrativa.</li>\n</ul>\n<div class=\"box exc\"><span class=\"lbl\">La consecuencia de infringirlo: la vía de hecho</span>Actuar materialmente sin <span class=\"t\" data-k=\"titulo\">título</span> —o excediéndose de él— constituye <b>vía de hecho</b>. La actuación no goza de presunción de validez y el particular puede reaccionar frente a ella por cauces específicos.</div>", "llano": "<p>La Administración no puede empezar a derribar, precintar o retirar nada sin que exista antes un papel que lo ordene, y sin habértelo notificado. Primero el título, después la máquina.</p>", "porque": "<p>Este artículo separa el <b>poder</b> de la <b>fuerza</b>. La Administración tiene autotutela ejecutiva, pero esa potestad solo existe <b>al servicio de un acto previo</b>: sin acto no hay potestad, sino coacción pura. Y el deber de notificar del apartado 2 garantiza que el particular pueda <b>reaccionar antes</b> de que el daño se consume, no después.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> nadie puede entrar a llevarse algo tuyo enseñándote la orden después.</li>\n<li><b>Real:</b> antes de retirar mesas y sillas de una terraza sin licencia, el ayuntamiento debe haber dictado y <b>notificado</b> la orden de retirada.</li>\n<li><b>Caso límite:</b> existe orden de demolición, pero se derriba <b>además</b> un anexo no incluido en ella. En esa parte hay <b>vía de hecho</b>: la ejecución excede del título.</li>\n</ul>", "noej": "<ul>\n<li><b>No exige</b> resolución previa la actuación material que <b>no limite derechos</b> de los particulares.</li>\n<li><b>No basta</b> con que exista la resolución: hay que <b>notificarla</b> al interesado.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 98 LPAC:</b> ejecutoriedad del acto.</li>\n<li><b>Art. 99 LPAC:</b> ejecución forzosa previo apercibimiento.</li>\n<li><b>Art. 105 LPAC:</b> prohibición de acciones posesorias, que presupone actuación conforme al procedimiento.</li>\n<li><b>Art. 47.1.e) LPAC:</b> nulidad por prescindir total y absolutamente del procedimiento.</li>\n</ul>", "trampas": "<ul>\n<li>La exigencia se refiere a actuaciones que <b>limiten derechos</b> de los particulares.</li>\n<li>Obligado a notificar es el órgano que <b>ordena</b> el acto de ejecución.</li>\n<li>Lo que se notifica es la <b>resolución que autoriza</b> la actuación.</li>\n</ul>", "ancla": "<p><b>«Primero el papel, luego la piqueta.»</b> Y el papel, notificado.</p>", "vis": "<svg viewBox=\"0 0 640 125\" role=\"img\" aria-label=\"Título habilitante de la ejecución\">\n<defs><marker id=\"t1\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\"><path d=\"M0 0 L9 4.5 L0 9 z\" fill=\"var(--acc)\"/></marker></defs>\n<rect x=\"35\" y=\"35\" width=\"200\" height=\"55\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/>\n<text x=\"135\" y=\"57\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">Resolución previa</text>\n<text x=\"135\" y=\"76\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">y notificada al interesado</text>\n<path d=\"M238 62 L 288 62\" stroke=\"var(--acc)\" stroke-width=\"2.5\" marker-end=\"url(#t1)\"/>\n<rect x=\"293\" y=\"35\" width=\"200\" height=\"55\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/>\n<text x=\"393\" y=\"57\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">Actuación material</text>\n<text x=\"393\" y=\"76\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">de ejecución</text>\n<rect x=\"505\" y=\"35\" width=\"115\" height=\"55\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/>\n<text x=\"562\" y=\"57\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--exc)\">Sin título</text>\n<text x=\"562\" y=\"76\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">vía de hecho</text>\n</svg>"}, {"n": 98, "t": "Ejecutoriedad", "ubic": "Título IV (De las disposiciones sobre el procedimiento administrativo común) ▸ Capítulo VII (Ejecución)", "idea": "Inmediatamente ejecutivos, salvo cuatro excepciones tasadas.", "literal": "<p>1. Los actos de las Administraciones Públicas sujetos al Derecho Administrativo serán inmediatamente ejecutivos, salvo que:</p><p>a) Se produzca la suspensión de la ejecución del acto.</p><p>b) Se trate de una resolución de un procedimiento de naturaleza sancionadora contra la que quepa algún recurso en vía administrativa, incluido el potestativo de reposición.</p><p>c) Una disposición establezca lo contrario.</p><p>d) Se necesite aprobación o autorización superior.</p><p>2. Cuando de una resolución administrativa, o de cualquier otra forma de finalización del procedimiento administrativo prevista en esta ley, nazca una obligación de pago derivada de una sanción pecuniaria, multa o cualquier otro derecho que haya de abonarse a la Hacienda pública, éste se efectuará preferentemente, salvo que se justifique la imposibilidad de hacerlo, utilizando alguno de los medios electrónicos siguientes:</p><p>a) Tarjeta de crédito y débito.</p><p>b) Transferencia bancaria.</p><p>c) Domiciliación bancaria.</p><p>d) Cualesquiera otros que se autoricen por el órgano competente en materia de Hacienda Pública.</p>", "dis": "<ul>\n<li><b>98.1 — regla y excepciones:</b> los actos sujetos al Derecho Administrativo son <b>inmediatamente ejecutivos</b>, <b>salvo que</b>:\n<table><thead><tr><th>Letra</th><th>Excepción</th></tr></thead><tbody>\n<tr><td><b>a)</b></td><td>Se produzca la <b>suspensión</b> de la ejecución del acto</td></tr>\n<tr><td><b>b)</b></td><td>Se trate de una <b>resolución sancionadora</b> contra la que quepa <b>algún recurso en vía administrativa</b>, <b>incluido el potestativo de reposición</b></td></tr>\n<tr><td><b>c)</b></td><td>Una <b>disposición</b> establezca lo contrario</td></tr>\n<tr><td><b>d)</b></td><td>Se necesite <b>aprobación o autorización superior</b></td></tr>\n</tbody></table></li>\n<li><b>98.2 — pago electrónico:</b> cuando nazca una obligación de pago derivada de <b>sanción pecuniaria, multa o cualquier otro derecho</b> a abonar a la Hacienda pública, se efectuará <b>preferentemente</b> por medios electrónicos: <b>tarjeta de crédito y débito</b>, <b>transferencia bancaria</b>, <b>domiciliación bancaria</b> o cualesquiera otros autorizados por el órgano competente en materia de Hacienda Pública.</li>\n</ul>\n<div class=\"box warn\"><span class=\"lbl\">La letra b) es la clave del tema sancionador</span>Una multa municipal contra la que quepa <b>reposición potestativa</b> <b>no</b> es inmediatamente ejecutiva. Es la misma idea del art. 90.3, vista desde la ejecución.</div>", "llano": "<p>Por regla general, el acto se puede ejecutar desde ya. Cuatro excepciones: que esté suspendido, que sea una sanción todavía recurrible en vía administrativa —aunque el recurso sea el potestativo de reposición—, que una norma diga otra cosa o que falte una aprobación superior.</p>", "porque": "<p>La letra b) traduce el principio de <b>presunción de no responsabilidad</b> del art. 53.2.b): sería incoherente cobrar una multa mientras la propia Administración puede todavía revocarla al resolver el recurso. Y la mención expresa del <b>potestativo de reposición</b> cierra la discusión sobre si un recurso voluntario impide la ejecución: <b>sí la impide</b>.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> una factura que no se cobra mientras la reclamación está viva.</li>\n<li><b>Real:</b> multa de 200 € impuesta por resolución de la alcaldía. Como cabe <b>reposición potestativa</b>, <b>no</b> es inmediatamente ejecutiva (art. 98.1.b).</li>\n<li><b>Caso límite:</b> orden de ejecución de obras de conservación —no sancionadora—. <b>Sí</b> es inmediatamente ejecutiva, aunque se recurra, salvo suspensión (art. 117).</li>\n</ul>", "noej": "<ul>\n<li><b>No es</b> excepción el mero hecho de recurrir un acto <b>no sancionador</b>.</li>\n<li><b>No alcanza</b> la letra b) a actos que no sean resolución de un procedimiento <b>sancionador</b>.</li>\n<li><b>No son</b> obligatorios los medios electrónicos de pago: son <b>preferentes</b>, salvo imposibilidad justificada.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 38 LPAC:</b> ejecutividad de los actos.</li>\n<li><b>Art. 90.3 LPAC:</b> ejecutividad de la resolución sancionadora.</li>\n<li><b>Art. 117 LPAC:</b> suspensión de la ejecución al interponer un recurso.</li>\n<li><b>Art. 53.1.h) LPAC:</b> derecho a cumplir las obligaciones de pago por medios electrónicos.</li>\n</ul>", "trampas": "<ul>\n<li>Son <b>cuatro</b> excepciones, letras a) a d).</li>\n<li>La letra b) incluye expresamente el <b>potestativo de reposición</b>.</li>\n<li>Los medios de pago electrónicos son <b>preferentes</b>, no exclusivos.</li>\n</ul>", "ancla": "<p><b>«Ejecuto ya, salvo: suspendido, sanción recurrible, norma en contra o falta el visto bueno.»</b></p>", "vis": "<svg viewBox=\"0 0 660 140\" role=\"img\" aria-label=\"Ejecutoriedad y sus excepciones\">\n<rect x=\"180\" y=\"8\" width=\"300\" height=\"30\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/>\n<text x=\"330\" y=\"28\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">INMEDIATAMENTE EJECUTIVOS</text>\n<g font-size=\"10\" text-anchor=\"middle\" fill=\"currentColor\">\n<rect x=\"12\" y=\"52\" width=\"152\" height=\"58\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"88\" y=\"76\" font-weight=\"700\" fill=\"var(--exc)\">a) Suspensión</text><text x=\"88\" y=\"94\">de la ejecución</text>\n<rect x=\"176\" y=\"52\" width=\"152\" height=\"58\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"252\" y=\"76\" font-weight=\"700\" fill=\"var(--exc)\">b) Sanción</text><text x=\"252\" y=\"94\">recurrible en vía adva.</text>\n<rect x=\"340\" y=\"52\" width=\"152\" height=\"58\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"416\" y=\"76\" font-weight=\"700\" fill=\"var(--exc)\">c) Disposición</text><text x=\"416\" y=\"94\">en contrario</text>\n<rect x=\"504\" y=\"52\" width=\"144\" height=\"58\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"576\" y=\"76\" font-weight=\"700\" fill=\"var(--exc)\">d) Aprobación</text><text x=\"576\" y=\"94\">o autorización superior</text>\n</g>\n<text x=\"330\" y=\"130\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--ink2)\">98.2 · el pago a la Hacienda pública se hará preferentemente por medios electrónicos</text>\n</svg>"}, {"n": 99, "t": "Ejecución forzosa", "ubic": "Título IV (De las disposiciones sobre el procedimiento administrativo común) ▸ Capítulo VII (Ejecución)", "idea": "Ejecución forzosa previo apercibimiento, salvo suspensión o reserva judicial.", "literal": "<p>Las Administraciones Públicas, a través de sus órganos competentes en cada caso, podrán proceder, previo apercibimiento, a la ejecución forzosa de los actos administrativos, salvo en los supuestos en que se suspenda la ejecución de acuerdo con la Ley, o cuando la Constitución o la Ley exijan la intervención de un órgano judicial.</p>", "dis": "<ul>\n<li><b>Facultad:</b> las Administraciones, a través de sus <b>órganos competentes en cada caso</b>, podrán proceder, <b>previo <span class=\"t\" data-k=\"apercibimiento\">apercibimiento</span></b>, a la <span class=\"t\" data-k=\"ejecucionforzosa\">ejecución forzosa</span> de los actos administrativos.</li>\n<li><b>Dos límites:</b>\n<ul><li>cuando se <b>suspenda la ejecución</b> de acuerdo con la ley;</li>\n<li>cuando la <b>Constitución o la ley exijan la intervención de un órgano judicial</b>.</li></ul></li>\n</ul>", "llano": "<p>Si no cumples voluntariamente, la Administración puede obligarte, pero antes tiene que avisarte. Y hay dos frenos: que la ejecución esté suspendida o que haga falta un juez —por ejemplo, para entrar en tu domicilio—.</p>", "porque": "<p>El <b>apercibimiento</b> no es un formalismo: da al obligado una última oportunidad de cumplir voluntariamente, lo que suele ser más barato y menos lesivo que la ejecución forzosa. Su omisión es un vicio de forma que puede producir indefensión.</p>\n<p>La reserva judicial protege los <b>derechos fundamentales</b>: la autotutela administrativa se detiene donde la Constitución exige la garantía de un juez.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> un último aviso antes de que vengan a llevarse el vehículo mal aparcado.</li>\n<li><b>Real:</b> incumplida una orden de limpieza de un solar, el ayuntamiento <b>apercibe</b> y después acuerda la <b>ejecución subsidiaria</b> a costa del obligado.</li>\n<li><b>Caso límite:</b> para ejecutar hay que <b>entrar en el domicilio</b> del afectado. Se necesita su consentimiento o <b>autorización judicial</b> (art. 100.3).</li>\n</ul>", "noej": "<ul>\n<li><b>No cabe</b> la ejecución forzosa sin <b>apercibimiento</b> previo.</li>\n<li><b>No cabe</b> mientras la ejecución esté <b>suspendida</b>.</li>\n<li><b>No cabe</b> sin juez cuando la Constitución o la ley exijan su intervención.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 97 LPAC:</b> título habilitante previo.</li>\n<li><b>Art. 100 LPAC:</b> medios de ejecución forzosa.</li>\n<li><b>Art. 117 LPAC:</b> suspensión al recurrir.</li>\n<li><b>Art. 18.2 de la Constitución</b> <i>(norma externa a la biblioteca)</i>: inviolabilidad del domicilio.</li>\n</ul>", "trampas": "<ul>\n<li>El <b>apercibimiento</b> es previo e ineludible.</li>\n<li>Actúan los <b>órganos competentes en cada caso</b>, no cualquiera.</li>\n<li>Dos excepciones: <b>suspensión</b> e <b>intervención judicial</b> exigida por la Constitución o la ley.</li>\n</ul>", "ancla": "<p><b>«Aviso, y luego ejecuto; salvo que esté suspendido o haga falta un juez.»</b></p>", "vis": "<svg viewBox=\"0 0 640 120\" role=\"img\" aria-label=\"Ejecución forzosa\">\n<defs><marker id=\"ef1\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\"><path d=\"M0 0 L9 4.5 L0 9 z\" fill=\"var(--acc)\"/></marker></defs>\n<rect x=\"30\" y=\"32\" width=\"185\" height=\"55\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/>\n<text x=\"122\" y=\"54\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--warn)\">Apercibimiento</text>\n<text x=\"122\" y=\"73\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">última oportunidad de cumplir</text>\n<path d=\"M218 59 L 258 59\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#ef1)\"/>\n<rect x=\"262\" y=\"32\" width=\"185\" height=\"55\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/>\n<text x=\"354\" y=\"54\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">Ejecución forzosa</text>\n<text x=\"354\" y=\"73\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">órgano competente</text>\n<rect x=\"462\" y=\"32\" width=\"160\" height=\"55\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/>\n<text x=\"542\" y=\"54\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--exc)\">Frenos</text>\n<text x=\"542\" y=\"73\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">suspensión o juez</text>\n</svg>"}, {"n": 100, "t": "Medios de ejecución forzosa", "ubic": "Título IV (De las disposiciones sobre el procedimiento administrativo común) ▸ Capítulo VII (Ejecución)", "idea": "Cuatro medios, con proporcionalidad y elección del menos restrictivo.", "literal": "<p>1. La ejecución forzosa por las Administraciones Públicas se efectuará, respetando siempre el principio de proporcionalidad, por los siguientes medios:</p><p>a) Apremio sobre el patrimonio.</p><p>b) Ejecución subsidiaria.</p><p>c) Multa coercitiva.</p><p>d) Compulsión sobre las personas.</p><p>2. Si fueran varios los medios de ejecución admisibles se elegirá el menos restrictivo de la libertad individual.</p><p>3. Si fuese necesario entrar en el domicilio del afectado o en los restantes lugares que requieran la autorización de su titular, las Administraciones Públicas deberán obtener el consentimiento del mismo o, en su defecto, la oportuna autorización judicial.</p>", "dis": "<ul>\n<li><b>100.1 — los cuatro medios</b>, respetando <b>siempre el principio de <span class=\"t\" data-k=\"proporcionalidad\">proporcionalidad</span></b>:\n<table><thead><tr><th>Medio</th><th>Cuándo</th><th>Artículo</th></tr></thead><tbody>\n<tr><td><b>a) <span class=\"t\" data-k=\"apremio\">Apremio sobre el patrimonio</span></b></td><td>Hay que satisfacer una <b>cantidad líquida</b></td><td>101</td></tr>\n<tr><td><b>b) <span class=\"t\" data-k=\"subsidiaria\">Ejecución subsidiaria</span></b></td><td>Actos <b>no personalísimos</b></td><td>102</td></tr>\n<tr><td><b>c) <span class=\"t\" data-k=\"multacoerc\">Multa coercitiva</span></b></td><td>Cuando lo <b>autoricen las leyes</b>, en tres supuestos</td><td>103</td></tr>\n<tr><td><b>d) <span class=\"t\" data-k=\"compulsion\">Compulsión sobre las personas</span></b></td><td>Obligaciones <b>personalísimas de no hacer o soportar</b></td><td>104</td></tr>\n</tbody></table></li>\n<li><b>100.2 — criterio de elección:</b> si fueran <b>varios los medios admisibles</b>, se elegirá el <b>menos restrictivo de la libertad individual</b>.</li>\n<li><b>100.3 — entrada en domicilio:</b> si fuese necesario entrar en el <b>domicilio</b> del afectado o en los restantes lugares que requieran autorización de su titular, se necesita su <b>consentimiento</b> o, en su defecto, la <b>oportuna autorización judicial</b>.</li>\n</ul>", "llano": "<p>Cuatro herramientas: cobrar por la vía de apremio, hacerlo la Administración a tu costa, multarte una y otra vez hasta que cumplas, o usar la fuerza sobre ti. Y una regla que las ordena: si valen varias, se usa la que menos limite tu libertad. Para entrar en tu casa, consentimiento o juez.</p>", "porque": "<p>El art. 100.2 convierte la <b>proporcionalidad</b> en una regla operativa, no en un principio abstracto: obliga a comparar los medios disponibles y justificar la elección. Y el orden del listado no es casual: va del que solo afecta al <b>patrimonio</b> al que afecta a la <b>persona física</b>, que es el último recurso.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> antes de sacar a alguien a la fuerza, se le multa o se hace la tarea por él.</li>\n<li><b>Real:</b> incumplida una orden de retirada de un cartel, cabe la <b>ejecución subsidiaria</b> a costa del obligado; no es necesario acudir a la compulsión.</li>\n<li><b>Caso límite:</b> la ejecución exige acceder al interior de la vivienda. Sin consentimiento, hay que pedir <b>autorización judicial</b> (art. 100.3).</li>\n</ul>", "noej": "<ul>\n<li><b>No cabe</b> elegir el medio más gravoso si hay otro admisible menos restrictivo.</li>\n<li><b>No hay</b> más medios que los <b>cuatro</b> enumerados.</li>\n<li><b>No cabe</b> entrar en el domicilio sin consentimiento ni autorización judicial.</li>\n</ul>", "conex": "<ul>\n<li><b>Arts. 101 a 104 LPAC:</b> desarrollo de cada medio.</li>\n<li><b>Art. 99 LPAC:</b> apercibimiento previo.</li>\n<li><b>Art. 18.2 de la Constitución</b> <i>(norma externa a la biblioteca)</i>: inviolabilidad del domicilio.</li>\n<li><b>Art. 4.1.a) de la Ley 40/2015</b> (documento 2): principio de proporcionalidad en la intervención administrativa.</li>\n</ul>", "trampas": "<ul>\n<li>Son <b>cuatro</b> medios, en ese orden: apremio, subsidiaria, multa coercitiva y compulsión.</li>\n<li>El criterio del 100.2 es el <b>menos restrictivo de la libertad individual</b>.</li>\n<li>La entrada en domicilio exige <b>consentimiento o autorización judicial</b>.</li>\n</ul>", "ancla": "<p><b>«Bolsillo, sustituto, multa y fuerza.»</b> Y entre varios, el que menos ate.</p>", "vis": "<svg viewBox=\"0 0 660 145\" role=\"img\" aria-label=\"Medios de ejecución forzosa\">\n<g font-size=\"10\" text-anchor=\"middle\" fill=\"currentColor\">\n<rect x=\"12\" y=\"35\" width=\"152\" height=\"60\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"88\" y=\"58\" font-weight=\"700\" fill=\"var(--acc)\">a) Apremio</text><text x=\"88\" y=\"76\">sobre el patrimonio</text><text x=\"88\" y=\"90\">cantidad líquida</text>\n<rect x=\"176\" y=\"35\" width=\"152\" height=\"60\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"252\" y=\"58\" font-weight=\"700\" fill=\"var(--ej)\">b) Subsidiaria</text><text x=\"252\" y=\"76\">actos no personalísimos</text><text x=\"252\" y=\"90\">a costa del obligado</text>\n<rect x=\"340\" y=\"35\" width=\"152\" height=\"60\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"416\" y=\"58\" font-weight=\"700\" fill=\"var(--warn)\">c) Multa coercitiva</text><text x=\"416\" y=\"76\">reiterada por lapsos</text><text x=\"416\" y=\"90\">si lo autoriza la ley</text>\n<rect x=\"504\" y=\"35\" width=\"144\" height=\"60\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"576\" y=\"58\" font-weight=\"700\" fill=\"var(--exc)\">d) Compulsión</text><text x=\"576\" y=\"76\">sobre las personas</text><text x=\"576\" y=\"90\">último recurso</text>\n</g>\n<text x=\"330\" y=\"122\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">Entre varios medios admisibles: el MENOS RESTRICTIVO de la libertad individual</text>\n<text x=\"330\" y=\"139\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--ink2)\">Entrada en domicilio: consentimiento del titular o autorización judicial</text>\n</svg>"}];
</script>
<script>
ARTS.push.apply(ARTS,[{"n": 101, "t": "Apremio sobre el patrimonio", "ubic": "Título IV (De las disposiciones sobre el procedimiento administrativo común) ▸ Capítulo VII (Ejecución)", "idea": "Cantidad líquida: procedimiento de apremio y reserva de ley para lo pecuniario.", "literal": "<p>1. Si en virtud de acto administrativo hubiera de satisfacerse cantidad líquida se seguirá el procedimiento previsto en las normas reguladoras del procedimiento de apremio.</p><p>2. En cualquier caso no podrá imponerse a los administrados una obligación pecuniaria que no estuviese establecida con arreglo a una norma de rango legal.</p>", "dis": "<ul>\n<li><b>101.1 — supuesto:</b> si en virtud de acto administrativo hubiera de satisfacerse <b><span class=\"t\" data-k=\"cantidadliquida\">cantidad líquida</span></b>, se seguirá el <b>procedimiento previsto en las normas reguladoras del procedimiento de apremio</b>.</li>\n<li><b>101.2 — reserva de ley:</b> <b>en cualquier caso</b>, no podrá imponerse a los administrados una <b>obligación pecuniaria</b> que no estuviese establecida con arreglo a una <b>norma de rango legal</b>.</li>\n</ul>", "llano": "<p>Si lo que debes es dinero determinado, se cobra por la vía de apremio, con sus recargos y su embargo. Y una garantía capital: ninguna obligación de pagar puede nacer de un reglamento; hace falta una ley.</p>", "porque": "<p>El apartado 2 es una manifestación del <b>principio de legalidad en materia patrimonial</b>: si la Administración pudiera crear obligaciones pecuniarias por vía reglamentaria, el patrimonio de los ciudadanos quedaría a merced del poder ejecutivo. Es el mismo fundamento del art. 31.3 de la Constitución para las prestaciones patrimoniales de carácter público.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> una deuda impagada que pasa a vía ejecutiva con recargo.</li>\n<li><b>Real:</b> impagada en periodo voluntario una multa de tráfico municipal, se inicia el <b>procedimiento de apremio</b> conforme a la normativa recaudatoria.</li>\n<li><b>Caso límite:</b> una ordenanza pretende imponer un pago sin cobertura legal. Vulnera el art. <b>101.2</b> y, en su caso, el art. 47.2 sobre nulidad de disposiciones.</li>\n</ul>", "noej": "<ul>\n<li><b>No cabe</b> el apremio si la cantidad <b>no es líquida</b>.</li>\n<li><b>No puede</b> nacer una obligación pecuniaria de una norma sin <b>rango legal</b>.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 100.1.a) LPAC:</b> el apremio como medio de ejecución forzosa.</li>\n<li><b>Art. 102.3 LPAC:</b> los gastos de la ejecución subsidiaria se exigen por esta vía.</li>\n<li><b>Art. 103.1 LPAC:</b> las multas coercitivas requieren igualmente autorización legal.</li>\n<li><b>Art. 31.3 de la Constitución</b> <i>(norma externa a la biblioteca)</i>: reserva de ley de las prestaciones patrimoniales públicas.</li>\n</ul>", "trampas": "<ul>\n<li>Exige <b>cantidad líquida</b>.</li>\n<li>La reserva de ley del 101.2 rige <b>en cualquier caso</b>.</li>\n<li>El procedimiento no está en la LPAC: se remite a las <b>normas del procedimiento de apremio</b>.</li>\n</ul>", "ancla": "<p><b>«Dinero cierto, vía de apremio; y ninguna deuda sin ley.»</b></p>", "vis": "<svg viewBox=\"0 0 640 115\" role=\"img\" aria-label=\"Apremio sobre el patrimonio\">\n<rect x=\"45\" y=\"30\" width=\"240\" height=\"55\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/>\n<text x=\"165\" y=\"52\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">Cantidad líquida</text>\n<text x=\"165\" y=\"71\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">procedimiento de apremio</text>\n<rect x=\"355\" y=\"30\" width=\"240\" height=\"55\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/>\n<text x=\"475\" y=\"52\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--exc)\">Reserva de ley</text>\n<text x=\"475\" y=\"71\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">ninguna obligación pecuniaria sin norma legal</text>\n</svg>"}, {"n": 102, "t": "Ejecución subsidiaria", "ubic": "Título IV (De las disposiciones sobre el procedimiento administrativo común) ▸ Capítulo VII (Ejecución)", "idea": "Lo que puede hacer otro, lo hace la Administración a costa del obligado.", "literal": "<p>1. Habrá lugar a la ejecución subsidiaria cuando se trate de actos que por no ser personalísimos puedan ser realizados por sujeto distinto del obligado.</p><p>2. En este caso, las Administraciones Públicas realizarán el acto, por sí o a través de las personas que determinen, a costa del obligado.</p><p>3. El importe de los gastos, daños y perjuicios se exigirá conforme a lo dispuesto en el artículo anterior.</p><p>4. Dicho importe podrá liquidarse de forma provisional y realizarse antes de la ejecución, a reserva de la liquidación definitiva.</p>", "dis": "<ul>\n<li><b>102.1 — supuesto:</b> habrá lugar a la <span class=\"t\" data-k=\"subsidiaria\">ejecución subsidiaria</span> cuando se trate de actos que, <b>por no ser <span class=\"t\" data-k=\"personalisimo\">personalísimos</span></b>, puedan ser realizados por <b>sujeto distinto del obligado</b>.</li>\n<li><b>102.2 — cómo:</b> la Administración realizará el acto <b>por sí o a través de las personas que determine</b>, <b>a costa del obligado</b>.</li>\n<li><b>102.3 — cobro:</b> el importe de los <b>gastos, daños y perjuicios</b> se exigirá conforme al <b>art. 101</b>, es decir, por la vía de <b>apremio</b>.</li>\n<li><b>102.4 — liquidación provisional:</b> ese importe podrá liquidarse <b>de forma provisional</b> y realizarse <b>antes de la ejecución</b>, a reserva de la <b>liquidación definitiva</b>.</li>\n</ul>", "llano": "<p>Si la orden consiste en hacer algo que puede hacer cualquiera —limpiar, retirar, vallar—, la Administración lo hace ella o contrata a quien lo haga, y te pasa la factura. Incluso puede cobrarte antes, provisionalmente, y ajustar después.</p>", "porque": "<p>Es el medio más eficaz y menos lesivo: consigue el resultado sin coaccionar a nadie. La posibilidad de <b>liquidación provisional anticipada</b> resuelve un problema real: sin ella, la Administración tendría que adelantar fondos públicos para cumplir obligaciones ajenas y arriesgarse a no recuperarlos.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> la comunidad repara la humedad que el vecino no arregla y le pasa el recibo.</li>\n<li><b>Real:</b> incumplida la orden de limpieza y vallado de un solar, el ayuntamiento contrata la actuación y exige el importe por <b>apremio</b> (arts. 102.2 y 102.3).</li>\n<li><b>Caso límite:</b> la orden consiste en <b>cesar</b> en una actividad que solo el titular puede cesar. Es <b>personalísima</b>: no cabe ejecución subsidiaria, sino multa coercitiva (art. 103.1.a).</li>\n</ul>", "noej": "<ul>\n<li><b>No cabe</b> en actos <b>personalísimos</b>.</li>\n<li><b>No corre</b> el coste a cargo de la Administración: es <b>a costa del obligado</b>.</li>\n<li><b>No es</b> definitiva la liquidación anticipada: queda a reserva de la definitiva.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 100.1.b) LPAC:</b> la ejecución subsidiaria como medio.</li>\n<li><b>Art. 101 LPAC:</b> vía de cobro de los gastos.</li>\n<li><b>Art. 103.1.c) LPAC:</b> multa coercitiva en actos cuya ejecución pueda encargarse a otro.</li>\n</ul>", "trampas": "<ul>\n<li>Solo para actos <b>no personalísimos</b>.</li>\n<li>El importe se exige por la vía del <b>art. 101</b>.</li>\n<li>Cabe <b>liquidación provisional</b> y cobro <b>antes</b> de la ejecución.</li>\n</ul>", "ancla": "<p><b>«Si puede hacerlo otro, lo hago yo y te lo cobro.»</b> Incluso por adelantado.</p>", "vis": "<svg viewBox=\"0 0 640 125\" role=\"img\" aria-label=\"Ejecución subsidiaria\">\n<defs><marker id=\"es1\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\"><path d=\"M0 0 L9 4.5 L0 9 z\" fill=\"var(--ej)\"/></marker></defs>\n<rect x=\"25\" y=\"35\" width=\"180\" height=\"55\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/>\n<text x=\"115\" y=\"57\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">Acto NO personalísimo</text>\n<text x=\"115\" y=\"76\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">puede hacerlo otro</text>\n<path d=\"M208 62 L 243 62\" stroke=\"var(--ej)\" stroke-width=\"2\" marker-end=\"url(#es1)\"/>\n<rect x=\"247\" y=\"35\" width=\"180\" height=\"55\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/>\n<text x=\"337\" y=\"57\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">Lo realiza la Administración</text>\n<text x=\"337\" y=\"76\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">por sí o por terceros</text>\n<path d=\"M430 62 L 465 62\" stroke=\"var(--ej)\" stroke-width=\"2\" marker-end=\"url(#es1)\"/>\n<rect x=\"469\" y=\"35\" width=\"150\" height=\"55\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/>\n<text x=\"544\" y=\"57\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--warn)\">A costa del obligado</text>\n<text x=\"544\" y=\"76\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">por vía de apremio</text>\n</svg>"}, {"n": 103, "t": "Multa coercitiva", "ubic": "Título IV (De las disposiciones sobre el procedimiento administrativo común) ▸ Capítulo VII (Ejecución)", "idea": "Multas reiteradas para forzar el cumplimiento; no son sanción y son compatibles con ella.", "literal": "<p>1. Cuando así lo autoricen las Leyes, y en la forma y cuantía que éstas determinen, las Administraciones Públicas pueden, para la ejecución de determinados actos, imponer multas coercitivas, reiteradas por lapsos de tiempo que sean suficientes para cumplir lo ordenado, en los siguientes supuestos:</p><p>a) Actos personalísimos en que no proceda la compulsión directa sobre la persona del obligado.</p><p>b) Actos en que, procediendo la compulsión, la Administración no la estimara conveniente.</p><p>c) Actos cuya ejecución pueda el obligado encargar a otra persona.</p><p>2. La multa coercitiva es independiente de las sanciones que puedan imponerse con tal carácter y compatible con ellas.</p>", "dis": "<ul>\n<li><b>103.1 — requisitos y supuestos:</b> <b>cuando así lo autoricen las leyes</b>, y <b>en la forma y cuantía que estas determinen</b>, cabe imponer <span class=\"t\" data-k=\"multacoerc\">multas coercitivas</span>, <b>reiteradas por lapsos de tiempo suficientes</b> para cumplir lo ordenado, en tres supuestos:\n<table><thead><tr><th>Letra</th><th>Supuesto</th></tr></thead><tbody>\n<tr><td><b>a)</b></td><td>Actos <b>personalísimos</b> en que <b>no proceda la compulsión directa</b> sobre la persona del obligado</td></tr>\n<tr><td><b>b)</b></td><td>Actos en que, <b>procediendo la compulsión</b>, la Administración <b>no la estimara conveniente</b></td></tr>\n<tr><td><b>c)</b></td><td>Actos cuya ejecución <b>pueda el obligado encargar a otra persona</b></td></tr>\n</tbody></table></li>\n<li><b>103.2 — naturaleza:</b> la multa coercitiva es <b>independiente de las sanciones</b> que puedan imponerse con tal carácter y <b>compatible con ellas</b>.</li>\n</ul>\n<div class=\"box warn\"><span class=\"lbl\">No es una sanción</span>La multa coercitiva <b>no castiga</b> lo ya hecho: <b>compele</b> a cumplir lo ordenado. Por eso puede reiterarse y por eso convive con la sanción sin vulnerar el <i>non bis in idem</i>.</div>", "llano": "<p>Es una multa que se repite cada cierto tiempo hasta que cumples. No es un castigo por lo que hiciste, sino una presión para que hagas lo que debes. Por eso puede sumarse a la sanción que además te corresponda. Eso sí: solo si una ley lo autoriza y en la cuantía que esa ley fije.</p>", "porque": "<p>Distinguir <b>multa coercitiva</b> y <b>sanción</b> es lo que permite su compatibilidad. La sanción mira al pasado —reprocha una infracción ya cometida—; la multa coercitiva mira al futuro —quiere un comportamiento—. Confundirlas llevaría a la conclusión errónea de que se sanciona dos veces lo mismo.</p>\n<p>La exigencia de <b>autorización legal</b> previa impide que la Administración se dote por sí sola de un instrumento tan poderoso como una multa reiterable indefinidamente.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> una penalización que se repite cada semana hasta que se entrega lo pendiente.</li>\n<li><b>Real:</b> el art. <b>4.4 de la Ley 1/2014 de Andalucía</b> (documento 9) autoriza multas coercitivas frente a quien no atiende un requerimiento de información en materia de transparencia.</li>\n<li><b>Caso límite:</b> un establecimiento sigue abierto pese a la orden de cese. Cabe <b>multa coercitiva</b> (letra a) y, además, la <b>sanción</b> que proceda por la infracción (art. 103.2).</li>\n</ul>", "noej": "<ul>\n<li><b>No cabe</b> sin <b>autorización legal</b> expresa que fije forma y cuantía.</li>\n<li><b>No es</b> una sanción, aunque sea compatible con ella.</li>\n<li><b>No puede</b> imponerse en un solo acto sin posibilidad de cumplimiento: se reitera por <b>lapsos suficientes</b>.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 100.1.c) LPAC:</b> la multa coercitiva como medio de ejecución forzosa.</li>\n<li><b>Art. 104 LPAC:</b> compulsión sobre las personas, alternativa en las letras a) y b).</li>\n<li><b>Art. 4.4 de la Ley 1/2014 de Andalucía</b> (documento 9): ejemplo de habilitación legal.</li>\n<li><b>Art. 31 de la Ley 40/2015</b> (documento 2): principio de <i>non bis in idem</i>.</li>\n</ul>", "trampas": "<ul>\n<li>Requiere <b>autorización legal</b> y que la ley fije <b>forma y cuantía</b>.</li>\n<li>Son <b>tres</b> supuestos, letras a) a c).</li>\n<li>Es <b>independiente</b> de las sanciones y <b>compatible</b> con ellas.</li>\n</ul>", "ancla": "<p><b>«No te castigo: te aprieto, y las veces que haga falta.»</b> Y la sanción va aparte.</p>", "vis": "<svg viewBox=\"0 0 660 140\" role=\"img\" aria-label=\"Multa coercitiva\">\n<rect x=\"180\" y=\"8\" width=\"300\" height=\"30\" rx=\"8\" fill=\"var(--warn)\" stroke=\"var(--warn)\"/>\n<text x=\"330\" y=\"28\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">MULTA COERCITIVA (si lo autoriza la ley)</text>\n<g font-size=\"10\" text-anchor=\"middle\" fill=\"currentColor\">\n<rect x=\"20\" y=\"52\" width=\"195\" height=\"58\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"117\" y=\"74\" font-weight=\"700\" fill=\"var(--acc)\">a) Personalísimos</text><text x=\"117\" y=\"92\">sin compulsión directa</text>\n<rect x=\"230\" y=\"52\" width=\"195\" height=\"58\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"327\" y=\"74\" font-weight=\"700\" fill=\"var(--ej)\">b) Cabe compulsión</text><text x=\"327\" y=\"92\">pero no se estima conveniente</text>\n<rect x=\"440\" y=\"52\" width=\"200\" height=\"58\" rx=\"8\" fill=\"var(--panel)\" stroke=\"var(--line)\"/><text x=\"540\" y=\"74\" font-weight=\"700\">c) Encargable a otro</text><text x=\"540\" y=\"92\">por el propio obligado</text>\n</g>\n<text x=\"330\" y=\"130\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--exc)\">Independiente de las sanciones y COMPATIBLE con ellas</text>\n</svg>"}, {"n": 104, "t": "Compulsión sobre las personas", "ubic": "Título IV (De las disposiciones sobre el procedimiento administrativo común) ▸ Capítulo VII (Ejecución)", "idea": "Fuerza sobre la persona solo con ley expresa y respeto a la dignidad.", "literal": "<p>1. Los actos administrativos que impongan una obligación personalísima de no hacer o soportar podrán ser ejecutados por compulsión directa sobre las personas en los casos en que la ley expresamente lo autorice, y dentro siempre del respeto debido a su dignidad y a los derechos reconocidos en la Constitución.</p><p>2. Si, tratándose de obligaciones personalísimas de hacer, no se realizase la prestación, el obligado deberá resarcir los daños y perjuicios, a cuya liquidación y cobro se procederá en vía administrativa.</p>", "dis": "<ul>\n<li><b>104.1 — supuesto:</b> los actos que impongan una obligación <b>personalísima de no hacer o soportar</b> podrán ejecutarse por <span class=\"t\" data-k=\"compulsion\">compulsión directa sobre las personas</span> <b>en los casos en que la ley expresamente lo autorice</b>, y <b>dentro siempre del respeto debido a su dignidad y a los derechos reconocidos en la Constitución</b>.</li>\n<li><b>104.2 — obligaciones personalísimas de hacer:</b> si no se realiza la prestación, el obligado deberá <b>resarcir los daños y perjuicios</b>, a cuya <b>liquidación y cobro</b> se procederá <b>en vía administrativa</b>.</li>\n</ul>\n<div class=\"box exc\"><span class=\"lbl\">La distinción decisiva</span><b>No hacer o soportar</b> → cabe <b>compulsión</b> si la ley lo autoriza. <b>Hacer</b> personalísimo → <b>no</b> cabe compulsión: se convierte en <b>resarcimiento de daños y perjuicios</b>. A nadie se le puede obligar físicamente a hacer algo.</div>", "llano": "<p>La fuerza física solo se puede usar cuando la obligación consiste en <b>no hacer</b> algo o en <b>soportar</b> algo, y solo si una ley lo permite expresamente. Si la obligación era <b>hacer</b> algo que solo tú puedes hacer y no lo haces, no te pueden forzar: pagas los daños.</p>", "porque": "<p>Es el límite último de la autotutela: la <b>dignidad</b> de la persona. Obligar por la fuerza a <i>hacer</i> algo sería una forma de trabajo impuesto incompatible con la Constitución; en cambio, impedir que alguien <i>siga haciendo</i> algo prohibido o hacerle <i>soportar</i> una actuación legítima admite coacción, porque no exige de él una conducta activa.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> se puede impedir físicamente el paso a una zona restringida; no se puede obligar físicamente a alguien a pintar una pared.</li>\n<li><b>Real:</b> el desalojo de un local clausurado implica <b>soportar</b> la actuación: cabe compulsión si la ley lo autoriza.</li>\n<li><b>Caso límite:</b> una orden de <b>hacer</b> personalísima incumplida —por ejemplo, una obligación intransferible de comparecer a realizar una prestación—. No cabe compulsión: procede el <b>resarcimiento</b> del art. 104.2.</li>\n</ul>", "noej": "<ul>\n<li><b>No cabe</b> compulsión sin <b>autorización legal expresa</b>.</li>\n<li><b>No cabe</b> compulsión en obligaciones personalísimas de <b>hacer</b>.</li>\n<li><b>No cabe</b> compulsión que vulnere la <b>dignidad</b> o los derechos constitucionales.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 100.1.d) y 100.2 LPAC:</b> la compulsión como medio y su carácter subsidiario.</li>\n<li><b>Art. 103.1.a) y b) LPAC:</b> multa coercitiva como alternativa.</li>\n<li><b>Art. 102 LPAC:</b> ejecución subsidiaria, imposible en lo personalísimo.</li>\n<li><b>Arts. 10 y 15 de la Constitución</b> <i>(norma externa a la biblioteca)</i>: dignidad e integridad física.</li>\n</ul>", "trampas": "<ul>\n<li>Solo en obligaciones personalísimas de <b>no hacer o soportar</b>.</li>\n<li>Exige que la <b>ley expresamente lo autorice</b>.</li>\n<li>En las de <b>hacer</b>, la respuesta es el <b>resarcimiento de daños y perjuicios</b>, liquidado y cobrado <b>en vía administrativa</b>.</li>\n</ul>", "ancla": "<p><b>«No hacer o soportar: puedo empujarte. Hacer: solo puedo cobrarte.»</b></p>", "vis": "<svg viewBox=\"0 0 640 130\" role=\"img\" aria-label=\"Compulsión sobre las personas\">\n<rect x=\"30\" y=\"30\" width=\"270\" height=\"66\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/>\n<text x=\"165\" y=\"52\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--exc)\">Obligación de NO HACER o SOPORTAR</text>\n<text x=\"165\" y=\"71\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">cabe compulsión directa</text>\n<text x=\"165\" y=\"87\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">si la ley expresamente lo autoriza</text>\n<rect x=\"345\" y=\"30\" width=\"270\" height=\"66\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/>\n<text x=\"480\" y=\"52\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">Obligación personalísima de HACER</text>\n<text x=\"480\" y=\"71\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">NO cabe compulsión</text>\n<text x=\"480\" y=\"87\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">resarcimiento de daños y perjuicios</text>\n<text x=\"320\" y=\"120\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--ink2)\">Siempre con respeto a la dignidad y a los derechos reconocidos en la Constitución</text>\n</svg>"}]);
</script>
<script>
ARTS.push.apply(ARTS,[{"n": 105, "t": "Prohibición de acciones posesorias", "ubic": "Título IV (De las disposiciones sobre el procedimiento administrativo común) ▸ Capítulo VII (Ejecución)", "idea": "No se admiten a trámite acciones posesorias frente a la actuación administrativa regular.", "literal": "<p>No se admitirán a trámite acciones posesorias contra las actuaciones de los órganos administrativos realizadas en materia de su competencia y de acuerdo con el procedimiento legalmente establecido.</p>", "dis": "<ul>\n<li><b>Regla:</b> <b>no se admitirán a trámite</b> <span class=\"t\" data-k=\"posesoria\">acciones posesorias</span> contra las actuaciones de los órganos administrativos realizadas <b>en materia de su competencia</b> y <b>de acuerdo con el procedimiento legalmente establecido</b>.</li>\n<li><b>Los dos requisitos son acumulativos:</b> competencia <b>y</b> procedimiento. Si falta cualquiera de ellos —vía de hecho—, la prohibición <b>no opera</b>.</li>\n</ul>", "llano": "<p>No se puede acudir a la vía civil de la protección de la posesión para frenar una actuación administrativa correcta: para eso está la vía contencioso-administrativa. Ahora bien, si la Administración actúa sin competencia o sin procedimiento, la protección se recupera.</p>", "porque": "<p>Es la última pieza de la <b>autotutela</b>: sin esta regla, cualquier ejecución administrativa podría paralizarse acudiendo al juez civil, y el sistema de control quedaría desplazado del <b>orden contencioso-administrativo</b>, que es el competente.</p>\n<p>Pero la excepción implícita es importantísima: la prohibición <b>presupone</b> una actuación <b>competente y regular</b>. Frente a la <b>vía de hecho</b> el particular no queda desarmado.</p>", "ej": "<ul>\n<li><b>Cotidiano:</b> no se discute con el árbitro por la vía de la reclamación de consumo.</li>\n<li><b>Real:</b> frente a la ocupación temporal de un terreno acordada en un expediente expropiatorio tramitado en forma, <b>no</b> cabe acción posesoria: procede el contencioso-administrativo.</li>\n<li><b>Caso límite:</b> la Administración ocupa un terreno <b>sin expediente alguno</b>. Hay <b>vía de hecho</b>: no concurren los requisitos del art. 105 y la prohibición no se aplica.</li>\n</ul>", "noej": "<ul>\n<li><b>No opera</b> la prohibición si el órgano actuó <b>sin competencia</b>.</li>\n<li><b>No opera</b> si se prescindió del <b>procedimiento legalmente establecido</b>.</li>\n<li><b>No impide</b> acudir a la jurisdicción <b>contencioso-administrativa</b>.</li>\n</ul>", "conex": "<ul>\n<li><b>Art. 97 LPAC:</b> exigencia de título previo, cuya falta genera vía de hecho.</li>\n<li><b>Art. 47.1.b) y e) LPAC:</b> nulidad por incompetencia manifiesta o por prescindir del procedimiento.</li>\n<li><b>Art. 98 LPAC:</b> ejecutoriedad.</li>\n</ul>", "trampas": "<ul>\n<li>Los dos requisitos son <b>acumulativos</b>: competencia <b>y</b> procedimiento.</li>\n<li>La ley dice <b>«no se admitirán a trámite»</b>: es una inadmisión, no una desestimación.</li>\n<li>Queda siempre abierta la vía <b>contencioso-administrativa</b>.</li>\n</ul>", "ancla": "<p><b>«Contra la Administración competente y con procedimiento, al contencioso; nunca al interdicto.»</b></p>", "vis": "<svg viewBox=\"0 0 640 125\" role=\"img\" aria-label=\"Prohibición de acciones posesorias\">\n<rect x=\"35\" y=\"30\" width=\"265\" height=\"62\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/>\n<text x=\"167\" y=\"52\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--exc)\">Actuación con competencia</text>\n<text x=\"167\" y=\"70\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--exc)\">y con procedimiento</text>\n<text x=\"167\" y=\"86\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">acciones posesorias: NO se admiten</text>\n<rect x=\"345\" y=\"30\" width=\"265\" height=\"62\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/>\n<text x=\"477\" y=\"52\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">Vía de hecho</text>\n<text x=\"477\" y=\"70\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">sin competencia o sin procedimiento</text>\n<text x=\"477\" y=\"86\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">la prohibición no opera</text>\n</svg>"}]);
</script>
<script>
const PLAZOS=[["4 excepciones", "Supuestos en que el acto no es inmediatamente ejecutivo", "Administración", "98.1 LPAC", "Suspensión · sanción recurrible · disposición · aprobación superior"], ["4 medios", "Medios de ejecución forzosa", "Administración", "100.1 LPAC", "Apremio, subsidiaria, multa coercitiva y compulsión"], ["3 supuestos", "Casos en que cabe la multa coercitiva", "Administración", "103.1 LPAC", "Letras a) a c)"], ["Apercibimiento", "Requisito previo e ineludible de la ejecución forzosa", "Administración", "99 LPAC", "Salvo suspensión o intervención judicial"], ["Menos restrictivo", "Criterio de elección entre varios medios admisibles", "Administración", "100.2 LPAC", "De la libertad individual"], ["Autorización judicial", "Requisito para entrar en el domicilio sin consentimiento", "Administración", "100.3 LPAC", "O en lugares que requieran autorización del titular"], ["Rango legal", "Norma necesaria para imponer una obligación pecuniaria", "Administración", "101.2 LPAC", "En cualquier caso"], ["A costa del obligado", "Régimen económico de la ejecución subsidiaria", "Obligado", "102.2 LPAC", "Con posible liquidación provisional anticipada"], ["Ley expresa", "Requisito de la compulsión sobre las personas", "Administración", "104.1 LPAC", "Con respeto a la dignidad"], ["Resarcimiento", "Consecuencia del incumplimiento de obligaciones personalísimas de hacer", "Obligado", "104.2 LPAC", "Liquidación y cobro en vía administrativa"], ["No se admiten", "Tratamiento de las acciones posesorias contra actuación regular", "Particular", "105 LPAC", "Competencia y procedimiento, acumulativos"]];
const FLASH=[["¿Qué exige el art. 97 antes de una actuación material de ejecución?", "Que se haya adoptado previamente la <b>resolución que le sirva de fundamento jurídico</b>, cuando la actuación <b>limite derechos</b> de los particulares."], ["¿Qué debe notificar el órgano que ordena un acto de ejecución material?", "La <b>resolución que autorice</b> la actuación administrativa (art. 97.2)."], ["¿Qué es la vía de hecho?", "La actuación material sin acto que la ampare o excediendo de él. No goza de presunción de validez y excluye la prohibición del art. 105."], ["Las cuatro excepciones a la ejecutoriedad inmediata", "<b>Suspensión</b> de la ejecución · <b>resolución sancionadora</b> contra la que quepa recurso en vía administrativa, <b>incluido el potestativo de reposición</b> · <b>disposición</b> en contrario · necesidad de <b>aprobación o autorización superior</b> (art. 98.1)."], ["¿Cómo se paga preferentemente a la Hacienda pública?", "Por medios electrónicos: <b>tarjeta de crédito y débito</b>, <b>transferencia</b>, <b>domiciliación</b> u otros autorizados (art. 98.2)."], ["¿Qué requisito previo exige la ejecución forzosa?", "El <b>apercibimiento</b> (art. 99)."], ["¿Cuándo no cabe la ejecución forzosa?", "Cuando se <b>suspenda la ejecución</b> de acuerdo con la ley o cuando la <b>Constitución o la ley exijan la intervención de un órgano judicial</b> (art. 99)."], ["Los cuatro medios de ejecución forzosa", "<b>Apremio sobre el patrimonio</b> · <b>ejecución subsidiaria</b> · <b>multa coercitiva</b> · <b>compulsión sobre las personas</b> (art. 100.1)."], ["¿Qué criterio rige si son admisibles varios medios?", "Se elegirá el <b>menos restrictivo de la libertad individual</b> (art. 100.2)."], ["¿Qué se necesita para entrar en el domicilio del afectado?", "Su <b>consentimiento</b> o, en su defecto, la <b>oportuna autorización judicial</b> (art. 100.3)."], ["¿Cuándo procede el apremio sobre el patrimonio?", "Cuando en virtud de acto administrativo haya de satisfacerse <b>cantidad líquida</b>, siguiendo las normas del <b>procedimiento de apremio</b> (art. 101.1)."], ["¿Puede un reglamento imponer una obligación pecuniaria?", "<b>No</b>: en cualquier caso debe estar establecida con arreglo a una <b>norma de rango legal</b> (art. 101.2)."], ["¿Cuándo procede la ejecución subsidiaria?", "Cuando se trate de actos que, por <b>no ser personalísimos</b>, puedan ser realizados por <b>sujeto distinto del obligado</b> (art. 102.1)."], ["¿Quién soporta el coste de la ejecución subsidiaria?", "El <b>obligado</b>; los gastos, daños y perjuicios se exigen por la vía del art. 101, y cabe <b>liquidación provisional</b> anticipada (art. 102)."], ["¿Qué requisito habilita la multa coercitiva?", "Que <b>lo autoricen las leyes</b>, en la <b>forma y cuantía</b> que estas determinen (art. 103.1)."], ["Los tres supuestos de multa coercitiva", "Actos <b>personalísimos</b> sin compulsión directa · actos en que, procediendo la compulsión, <b>no se estime conveniente</b> · actos cuya ejecución <b>pueda encargarse a otra persona</b> (art. 103.1)."], ["¿Es la multa coercitiva una sanción?", "<b>No</b>: es <b>independiente</b> de las sanciones y <b>compatible</b> con ellas (art. 103.2)."], ["¿Cuándo cabe la compulsión sobre las personas?", "En obligaciones personalísimas de <b>no hacer o soportar</b>, <b>cuando la ley expresamente lo autorice</b> y con respeto a la <b>dignidad</b> y a los derechos constitucionales (art. 104.1)."], ["¿Y si se incumple una obligación personalísima de hacer?", "El obligado deberá <b>resarcir los daños y perjuicios</b>, con liquidación y cobro <b>en vía administrativa</b> (art. 104.2)."], ["¿Se admiten acciones posesorias contra las actuaciones administrativas?", "<b>No se admitirán a trámite</b> cuando se realicen <b>en materia de su competencia</b> y <b>de acuerdo con el procedimiento legalmente establecido</b> (art. 105)."]];
const TEST=[{"a": 97, "q": "Antes de iniciar una actuación material de ejecución que limite derechos de los particulares, la Administración debe:", "o": [["haber adoptado previamente la resolución que le sirva de fundamento jurídico", 1, "Correcto: art. 97.1. Su ausencia constituye vía de hecho."], ["obtener autorización judicial en todo caso", 0, "Solo para entrar en domicilio o cuando la ley lo exija."], ["comunicarlo al Defensor del Pueblo", 0, "No es un requisito."], ["esperar a que el acto sea firme", 0, "No es lo que exige el art. 97."]]}, {"a": 98, "q": "¿Cuál de estas NO es una excepción a la ejecutoriedad inmediata del art. 98.1?", "o": [["que el interesado haya anunciado su intención de recurrir en vía contenciosa", 1, "Correcto: eso solo permite la suspensión cautelar del art. 90.3 en lo sancionador, pero no es una excepción del art. 98.1."], ["que se produzca la suspensión de la ejecución del acto", 0, "Letra a)."], ["que una disposición establezca lo contrario", 0, "Letra c)."], ["que se necesite aprobación o autorización superior", 0, "Letra d)."]]}, {"a": 98, "q": "Una resolución sancionadora contra la que quepa recurso potestativo de reposición:", "o": [["no es inmediatamente ejecutiva", 1, "Correcto: art. 98.1.b), que menciona expresamente el potestativo de reposición."], ["es inmediatamente ejecutiva, porque el recurso es potestativo", 0, "El precepto lo incluye expresamente entre las excepciones."], ["es ejecutiva desde su notificación", 0, "No, mientras quepa recurso en vía administrativa."], ["nunca llega a ser ejecutiva", 0, "Lo será cuando no quepa recurso ordinario."]]}, {"a": 99, "q": "La ejecución forzosa de los actos administrativos exige:", "o": [["apercibimiento previo", 1, "Correcto: art. 99."], ["autorización del Consejo de Estado", 0, "No se exige."], ["consentimiento del obligado", 0, "Precisamente se ejecuta porque no cumple."], ["informe favorable del servicio jurídico", 0, "No es un requisito del art. 99."]]}, {"a": 100, "q": "Si fueran admisibles varios medios de ejecución forzosa:", "o": [["se elegirá el menos restrictivo de la libertad individual", 1, "Correcto: art. 100.2, manifestación del principio de proporcionalidad."], ["se elegirá el más eficaz", 0, "El criterio legal es otro."], ["se elegirá el más económico para la Administración", 0, "No es el criterio legal."], ["podrá elegirse libremente", 0, "El art. 100.2 impone un criterio."]]}, {"a": 100, "q": "Para entrar en el domicilio del afectado, la Administración necesita:", "o": [["su consentimiento o, en su defecto, la oportuna autorización judicial", 1, "Correcto: art. 100.3."], ["solo el acuerdo motivado del órgano competente", 0, "Es insuficiente."], ["la presencia del secretario de la corporación", 0, "No es lo previsto."], ["nada especial: basta el título ejecutivo", 0, "La inviolabilidad del domicilio exige más."]]}, {"a": 101, "q": "Completa: en cualquier caso no podrá imponerse a los administrados una obligación pecuniaria que no estuviese establecida con arreglo a una norma de ______.", "gap": "rango legal", "fb": "De <b>rango legal</b> (art. 101.2). Es la reserva de ley en materia pecuniaria."}, {"a": 102, "q": "La ejecución subsidiaria procede:", "o": [["cuando se trate de actos que, por no ser personalísimos, puedan ser realizados por sujeto distinto del obligado", 1, "Correcto: art. 102.1."], ["en los actos personalísimos de no hacer", 0, "Ahí procede, en su caso, la compulsión."], ["siempre que haya que pagar una cantidad líquida", 0, "Eso es el apremio sobre el patrimonio."], ["solo cuando lo autorice expresamente una ley", 0, "Ese requisito es de la multa coercitiva."]]}, {"a": 102, "q": "El importe de los gastos, daños y perjuicios de la ejecución subsidiaria:", "o": [["se exige conforme al art. 101 y puede liquidarse provisionalmente antes de la ejecución", 1, "Correcto: arts. 102.3 y 102.4, a reserva de la liquidación definitiva."], ["lo asume la Administración", 0, "Es a costa del obligado."], ["solo puede exigirse tras sentencia firme", 0, "Se exige en vía administrativa."], ["no puede liquidarse hasta finalizar la ejecución", 0, "Cabe liquidación provisional anticipada."]]}, {"a": 103, "q": "La multa coercitiva:", "o": [["es independiente de las sanciones que puedan imponerse y compatible con ellas", 1, "Correcto: art. 103.2. No castiga: compele."], ["es una modalidad de sanción pecuniaria", 0, "No lo es."], ["excluye la imposición de sanciones por los mismos hechos", 0, "Son compatibles."], ["puede imponerse sin cobertura legal", 0, "Requiere que las leyes la autoricen."]]}, {"a": 103, "q": "¿Cuál de estos NO es un supuesto de multa coercitiva del art. 103.1?", "o": [["actos de los que se derive el pago de una cantidad líquida", 1, "Correcto: para eso está el apremio sobre el patrimonio (art. 101)."], ["actos personalísimos en que no proceda la compulsión directa", 0, "Letra a)."], ["actos en que, procediendo la compulsión, la Administración no la estimara conveniente", 0, "Letra b)."], ["actos cuya ejecución pueda el obligado encargar a otra persona", 0, "Letra c)."]]}, {"a": 104, "q": "La compulsión directa sobre las personas procede en actos que impongan una obligación personalísima de:", "o": [["no hacer o soportar, cuando la ley expresamente lo autorice", 1, "Correcto: art. 104.1, con respeto a la dignidad."], ["hacer, en todo caso", 0, "En las de hacer procede el resarcimiento (art. 104.2)."], ["pagar una cantidad líquida", 0, "Eso es el apremio."], ["cualquier clase, si lo acuerda el órgano competente", 0, "Se exige ley expresa y obligación de no hacer o soportar."]]}, {"a": 104, "q": "Si no se realiza una prestación personalísima de hacer:", "o": [["el obligado deberá resarcir los daños y perjuicios, con liquidación y cobro en vía administrativa", 1, "Correcto: art. 104.2."], ["se procederá a la compulsión directa", 0, "No cabe en obligaciones de hacer."], ["se impondrá automáticamente una sanción", 0, "No es la consecuencia prevista."], ["se archivará la ejecución", 0, "No procede."]]}, {"a": 105, "q": "Las acciones posesorias contra actuaciones de los órganos administrativos:", "o": [["no se admitirán a trámite cuando se realicen en materia de su competencia y conforme al procedimiento legalmente establecido", 1, "Correcto: art. 105. Los dos requisitos son acumulativos."], ["se admiten siempre", 0, "El art. 105 lo impide en el supuesto indicado."], ["se admiten si la actuación causa daños", 0, "No es el criterio legal."], ["se sustituyen por el recurso de alzada", 0, "La vía es la contencioso-administrativa."]]}, {"a": 98, "q": "Los actos de las Administraciones Públicas sujetos al Derecho Administrativo son, por regla general, inmediatamente ejecutivos.", "vf": true, "ok": true, "fb": "<b>Verdadero.</b> Así lo establece el art. 98.1, con las cuatro excepciones que enumera."}, {"a": 97, "q": "Completa: las Administraciones no iniciarán ninguna actuación material de ejecución de resoluciones que ______ derechos de los particulares sin resolución previa.", "gap": "limite", "fb": "Que <b>limite</b> derechos de los particulares (art. 97.1)."}, {"a": 100, "q": "Los medios de ejecución forzosa deben emplearse:", "o": [["respetando siempre el principio de proporcionalidad", 1, "Correcto: art. 100.1, inciso inicial."], ["según el criterio discrecional del órgano", 0, "La ley impone la proporcionalidad."], ["por el orden en que aparecen enumerados, obligatoriamente", 0, "La ley no impone ese orden, sino el criterio del art. 100.2."], ["únicamente tras sentencia judicial", 0, "No es necesario, salvo reserva legal o constitucional."]]}, {"a": 101, "q": "El apremio sobre el patrimonio procede cuando:", "o": [["en virtud de acto administrativo haya de satisfacerse cantidad líquida", 1, "Correcto: art. 101.1."], ["el acto sea personalísimo", 0, "Ahí procede la multa coercitiva o la compulsión."], ["el obligado incumpla una obligación de hacer", 0, "Ahí procede la subsidiaria o el resarcimiento."], ["lo autorice una ley especial", 0, "Ese requisito es de la multa coercitiva."]]}, {"a": 105, "q": "La prohibición de acciones posesorias del art. 105 opera aunque la Administración haya actuado sin competencia.", "vf": true, "ok": false, "fb": "<b>Falso.</b> El art. 105 exige que la actuación se realice <b>en materia de su competencia</b> y <b>conforme al procedimiento legalmente establecido</b>. Faltando cualquiera de los dos requisitos —vía de hecho—, la prohibición no opera."}];
const CASOS=[{"t": "Caso 1 · El solar sin limpiar", "e": "Un ayuntamiento ordena a un propietario limpiar y vallar un solar en un mes. Transcurrido el plazo, nada se ha hecho. El ayuntamiento quiere actuar. <b>¿Qué debe hacer, con qué medio y en qué orden? ¿Puede además multarle?</b>", "s": "<p><b>1) Comprobación previa.</b> Existe <b>título</b>: la orden de ejecución, dictada y notificada (art. <b>97</b>). Y es <b>ejecutiva</b>: no es sancionadora, no consta suspensión ni disposición en contrario ni necesidad de aprobación superior (art. <b>98.1</b>).</p><p><b>2) Apercibimiento.</b> Ineludible antes de la ejecución forzosa (art. <b>99</b>). Sin él, la actuación estaría viciada.</p><p><b>3) Elección del medio.</b> Limpiar y vallar <b>no es personalísimo</b>: puede hacerlo cualquiera. Procede la <b>ejecución subsidiaria</b> (art. <b>102.1</b>), que además es menos restrictiva de la libertad individual que las alternativas (art. <b>100.2</b>).</p><p><b>4) Coste.</b> Se realiza <b>a costa del obligado</b> (art. 102.2); el importe de gastos, daños y perjuicios se exige por la vía del <b>art. 101</b>, es decir, por <b>apremio</b>, y puede liquidarse <b>provisionalmente antes</b> de la ejecución (art. 102.4).</p><p><b>5) ¿Y la multa?</b> La <b>multa coercitiva</b> exige que <b>una ley la autorice</b> y fije forma y cuantía (art. <b>103.1</b>). Si la hay, cabría por la letra c) —acto cuya ejecución puede encargar el obligado a otra persona—. Y sería <b>compatible</b> con la <b>sanción</b> que en su caso proceda por la infracción urbanística (art. 103.2), porque no es una sanción.</p><p><b>6) Si hubiera que entrar en la finca cerrada.</b> Consentimiento del titular o <b>autorización judicial</b> (art. 100.3).</p>"}, {"t": "Caso 2 · La multa que no se puede cobrar todavía", "e": "El 3 de mayo se notifica una resolución de la alcaldía que impone una multa de 400 € por infracción de la ordenanza de convivencia. El 10 de mayo, sin más trámite, el ayuntamiento inicia el procedimiento de apremio para cobrarla. El interesado, que no ha recurrido, protesta. <b>¿Tiene razón?</b>", "s": "<p><b>1) La regla general.</b> El art. <b>98.1</b> declara los actos <b>inmediatamente ejecutivos</b>. Si nos quedáramos aquí, el apremio sería correcto.</p><p><b>2) La excepción aplicable.</b> Pero la letra <b>b)</b> excluye la ejecutividad inmediata de las <b>resoluciones sancionadoras</b> contra las que <b>quepa algún recurso en vía administrativa, incluido el potestativo de reposición</b>. La resolución de la alcaldía pone fin a la vía administrativa, pero contra ella cabe <b>reposición potestativa</b> (art. 123). Mientras ese plazo esté vivo, la multa <b>no es ejecutiva</b>.</p><p><b>3) Confirmación desde el otro lado.</b> El art. <b>90.3</b> dice lo mismo desde la perspectiva del procedimiento sancionador: la resolución será ejecutiva <b>cuando no quepa contra ella ningún recurso ordinario en vía administrativa</b>.</p><p><b>4) Conclusión.</b> El interesado tiene razón: el apremio iniciado el 10 de mayo es <b>prematuro</b>. Habrá que esperar a que transcurra el mes del art. 124.1 sin interponer reposición o, interpuesta, a que se resuelva.</p><p><b>5) Matiz importante.</b> Si la resolución hubiera sido <b>no sancionadora</b> —una orden de ejecución, por ejemplo—, sí habría sido inmediatamente ejecutiva, porque la letra b) solo alcanza a las sancionadoras.</p>"}, {"t": "Caso 3 · Elegir el medio correcto", "e": "Determina el medio de ejecución forzosa aplicable en cada supuesto y justifícalo: <b>(a)</b> impago de una liquidación de 1.500 €; <b>(b)</b> incumplimiento de la orden de retirar un rótulo publicitario; <b>(c)</b> orden de cese de una actividad que el titular sigue ejerciendo; <b>(d)</b> desalojo de un local clausurado; <b>(e)</b> incumplimiento de una obligación personalísima de hacer.", "s": "<p><b>(a) Apremio sobre el patrimonio</b> (art. <b>101.1</b>): hay que satisfacer una <b>cantidad líquida</b>, y se sigue el procedimiento de apremio.</p><p><b>(b) Ejecución subsidiaria</b> (art. <b>102.1</b>): retirar un rótulo <b>no es personalísimo</b>. La Administración lo retira por sí o por terceros, <b>a costa del obligado</b>, y cobra por apremio.</p><p><b>(c) Multa coercitiva</b> (art. <b>103.1.a</b>): el cese es una obligación <b>personalísima</b> en la que no procede la compulsión directa. Requiere que <b>una ley la autorice</b>. Es compatible con la sanción por la infracción.</p><p><b>(d) Compulsión sobre las personas</b> (art. <b>104.1</b>): el desalojo impone <b>soportar</b> la actuación. Cabe si la ley lo autoriza expresamente y con respeto a la <b>dignidad</b>. Y si hay que entrar en un domicilio, consentimiento o <b>autorización judicial</b> (art. 100.3).</p><p><b>(e) Resarcimiento de daños y perjuicios</b> (art. <b>104.2</b>): en las obligaciones personalísimas <b>de hacer</b> no cabe compulsión; se liquidan y cobran los daños <b>en vía administrativa</b>.</p><p><b>La regla que ordena todo:</b> pregúntate <b>qué se debe</b> —dinero, un hacer no personalísimo, un hacer personalísimo, un no hacer o soportar— y aplica después el art. <b>100.2</b>: entre los admisibles, <b>el menos restrictivo de la libertad individual</b>.</p>"}];

const CALTXT=["Lectura activa + test completo + semáforo. Memoriza la tabla «¿qué se debe? → qué medio» de la introducción.", "Solo flashcards: las cuatro excepciones del art. 98.1 y los cuatro medios del art. 100.1.", "Caso práctico 3 (elegir el medio) inventando cinco supuestos nuevos de tu ayuntamiento.", "Explicar en voz alta por qué la multa coercitiva no es una sanción y por qué no cabe compulsión para obligar a hacer. Casos 1 y 2.", "Test intercalado de todo el tema 3 y del tema 2, con especial atención a la ejecutividad (arts. 38, 90.3, 98 y 117)."];
const INTRO_HTML="<section class=\"card\" id=\"intro\"><h2>Tema 3 · Bloque 5 · La ejecución</h2><p class=\"small\">Último bloque del tema 3: el Capítulo VII del Título IV de la Ley 39/2015. Es el momento en que la decisión administrativa se convierte en realidad material, y por eso es también donde la ley extrema las cautelas.</p><div class=\"box ej\"><span class=\"lbl\">La idea que ordena el bloque</span>Tres preguntas encadenadas. <b>¿Hay título?</b> (art. 97: sin resolución previa, vía de hecho). <b>¿Es ejecutivo?</b> (art. 98: sí, salvo cuatro excepciones). <b>¿Con qué medio se ejecuta?</b> (arts. 99 a 104: apercibimiento y cuatro medios, del menos al más lesivo). Y una regla de cierre: contra la actuación regular <b>no caben acciones posesorias</b> (art. 105).</div><table><thead><tr><th>¿Qué se debe?</th><th>Medio</th><th>Artículo</th></tr></thead><tbody><tr><td>Una <b>cantidad líquida</b></td><td>Apremio sobre el patrimonio</td><td>101</td></tr><tr><td>Un <b>hacer no personalísimo</b></td><td>Ejecución subsidiaria, a costa del obligado</td><td>102</td></tr><tr><td>Un <b>hacer personalísimo</b> o encargable</td><td>Multa coercitiva, si la ley la autoriza</td><td>103</td></tr><tr><td>Un <b>no hacer o soportar</b></td><td>Compulsión sobre las personas, si la ley lo autoriza</td><td>104</td></tr><tr><td>Un <b>hacer personalísimo</b> incumplido</td><td>Resarcimiento de daños y perjuicios</td><td>104.2</td></tr></tbody></table><div class=\"box warn\"><span class=\"lbl\">Fuentes utilizadas y vigencia</span><ul><li><b>Ley 39/2015, de 1 de octubre</b> (documento 1 de la biblioteca), texto consolidado. Arts. 97 a 105.</li><li>Concordancias con la <b>Ley 40/2015</b> (documento 2), principio de proporcionalidad y <i>non bis in idem</i>, y con el <b>art. 4.4 de la Ley 1/2014 de Andalucía</b> (documento 9), ejemplo de habilitación legal de multas coercitivas.</li><li><b>Aportación externa</b>: los <b>arts. 10, 15, 18.2 y 31.3 de la Constitución</b> —dignidad, integridad, inviolabilidad del domicilio y reserva de ley en materia pecuniaria—. Verifica la vigencia de los textos en el BOE consolidado.</li></ul></div></section>";
const RESUMEN_HTML="<section class=\"card\" id=\"resumen\"><h2>Resumen ejecutivo</h2><p class=\"small\"><b>Norma:</b> Ley 39/2015, Título IV, Capítulo VII (arts. 97 a 105).</p><table><tbody><tr><th style=\"width:60px\">97</th><td>Ninguna actuación material que <b>limite derechos</b> sin <b>resolución previa</b>, y el órgano que la ordena debe <b>notificarla</b>. Sin título: <b>vía de hecho</b>.</td></tr><tr><th>98</th><td><b>Inmediatamente ejecutivos</b>, salvo: <b>suspensión</b> · <b>sanción</b> con recurso administrativo pendiente, <b>incluida la reposición potestativa</b> · <b>disposición</b> en contrario · <b>aprobación o autorización superior</b>. Pago preferentemente <b>electrónico</b>.</td></tr><tr><th>99</th><td>Ejecución forzosa por el <b>órgano competente</b>, <b>previo apercibimiento</b>, salvo <b>suspensión</b> o exigencia de <b>intervención judicial</b>.</td></tr><tr><th>100</th><td><b>Cuatro medios</b> con <b>proporcionalidad</b>: apremio · subsidiaria · multa coercitiva · compulsión. Entre varios, el <b>menos restrictivo de la libertad individual</b>. Domicilio: <b>consentimiento o juez</b>.</td></tr><tr><th>101-102</th><td>Apremio si hay <b>cantidad líquida</b>; ninguna obligación pecuniaria sin <b>rango legal</b>. Subsidiaria en actos <b>no personalísimos</b>, <b>a costa del obligado</b>, cobrando por apremio y con posible <b>liquidación provisional</b>.</td></tr><tr><th>103</th><td>Multa coercitiva <b>si lo autorizan las leyes</b>, <b>reiterada por lapsos suficientes</b>, en <b>tres</b> supuestos. Es <b>independiente</b> de las sanciones y <b>compatible</b> con ellas.</td></tr><tr><th>104</th><td>Compulsión solo en obligaciones personalísimas de <b>no hacer o soportar</b>, con <b>ley expresa</b> y respeto a la <b>dignidad</b>. En las de <b>hacer</b>: <b>resarcimiento</b> liquidado y cobrado en vía administrativa.</td></tr><tr><th>105</th><td><b>No se admiten a trámite</b> acciones posesorias contra actuaciones realizadas <b>en materia de su competencia</b> y <b>conforme al procedimiento</b>. Faltando alguno: la prohibición no opera.</td></tr></tbody></table><h2 style=\"margin-top:1.2rem\">Calendario de repaso espaciado</h2><table><thead><tr><th>Momento</th><th>Fecha</th><th>Qué hacer</th></tr></thead><tbody id=\"calbody\"></tbody></table></section>";
</script>
<script>
const main=document.getElementById('main');
function panel(id,title,body,cls){return '<details class="panel '+(cls||'v-expl')+'"'+(id?' data-p="'+id+'"':'')+'><summary>'+title+'</summary><div class="body">'+body+'</div></details>';}
let html='';

/* ---------- INTRO ---------- */
html+=INTRO_HTML;

/* ---------- ARTÍCULOS ---------- */
ARTS.forEach(function(a){
 html+='<section class="card art" id="art'+a.n+'">'
 +'<h2><span class="num">Art. '+a.n+'</span> '+a.t+'</h2>'
 +'<p class="ubic">'+a.ubic+'</p>'
 +'<div class="idea v-expl">💡 '+a.idea+'</div>'
 +'<div class="legal v-legal"><span class="lbl">Texto legal · literal</span>'+a.literal+'</div>'
 +panel('','🔍 Disección estructural',a.dis)
 +panel('','🗣️ Traducción a lenguaje llano',a.llano)
 +panel('','❓ ¿Por qué existe este artículo?',a.porque)
 +panel('','✅ Ejemplos','<div class="box ej"><span class="lbl">Ejemplos</span>'+a.ej+'</div>')
 +panel('','🚫 No-ejemplos: dónde está la frontera','<div class="box exc"><span class="lbl">No-ejemplos</span>'+a.noej+'</div>')
 +panel('','🔗 Conexiones con otros preceptos',a.conex)
 +panel('','⚠️ Trampas y errores frecuentes','<div class="box warn"><span class="lbl">Cuidado</span>'+a.trampas+'</div>')

 +'</section>';

{n:6,t:"Información institucional, organizativa y de planificación",ubic:"Título I (Transparencia de la actividad pública) ▸ Capítulo II (Publicidad activa)",idea:"Publicar funciones, normativa, estructura con organigrama y los planes con su evaluación.",literal:`<p>1. Los sujetos comprendidos en el ámbito de aplicación de este título publicarán información relativa a las funciones que desarrollan, la normativa que les sea de aplicación así como a su estructura organizativa. A estos efectos, incluirán un organigrama actualizado que identifique a los responsables de los diferentes órganos y su perfil y trayectoria profesional.</p><p>2. Las Administraciones Públicas publicarán los planes y programas anuales y plurianuales en los que se fijen objetivos concretos, así como las actividades, medios y tiempo previsto para su consecución. Su grado de cumplimiento y resultados deberán ser objeto de evaluación y publicación periódica junto con los indicadores de medida y valoración, en la forma en que se determine por cada Administración competente.</p><p>En el ámbito de la Administración General del Estado corresponde a las inspecciones generales de servicios la evaluación del cumplimiento de estos planes y programas.</p>`,dis:`<ul>
<li><b>6.1 — todos los sujetos del título:</b> publicarán información sobre <b>funciones</b> que desarrollan, <b>normativa</b> aplicable y <b>estructura organizativa</b>, incluyendo un <b>organigrama actualizado</b> que identifique a los responsables de los distintos órganos y <b>su perfil y trayectoria profesional</b>.</li>
<li><b>6.2 — solo las Administraciones Públicas</b> (letras a a d del art. 2.1): publicarán los <b>planes y programas anuales y plurianuales</b> con objetivos concretos, actividades, medios y tiempo previsto. Su <b>grado de cumplimiento y resultados</b> deben ser objeto de <b>evaluación y publicación periódica</b> junto con los indicadores de medida y valoración.</li>
</ul>`,llano:`<p>Lo primero que hay que poder saber de una Administración es quién es quién y qué hace: funciones, normas que le aplican y organigrama con nombres y trayectorias. Y además, si tiene planes, debe publicarlos y contar después si los ha cumplido.</p>`,porque:`<p>Sin conocer la <b>estructura</b>, el ciudadano no sabe a quién dirigirse ni quién responde de qué: la transparencia empieza por poder identificar al responsable. La obligación de publicar los planes <b>y su evaluación</b> introduce un elemento de rendición de cuentas por resultados, no solo por legalidad.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> el directorio de una empresa en su web, con nombres, cargos y responsabilidades.</li>
<li><b>Real:</b> un ayuntamiento publica su organigrama con las delegaciones, el perfil profesional de cada responsable y el plan estratégico municipal con sus indicadores de cumplimiento.</li>
<li><b>Caso límite:</b> una sociedad mercantil pública debe publicar funciones, normativa y organigrama (6.1), pero <b>no</b> los planes y programas del 6.2, reservado a las Administraciones Públicas.</li>
</ul>`,noej:`<ul>
<li><b>No basta</b> con publicar el organigrama: debe estar <b>actualizado</b> e incluir el <b>perfil y la trayectoria</b> de los responsables.</li>
<li><b>No alcanza</b> el 6.2 a los sujetos de las letras e) a i) del art. 2.1.</li>
</ul>`,conex:`<ul>
<li><b>Art. 2.2 LTBG:</b> concepto restringido de Administraciones Públicas, clave para el 6.2.</li>
<li><b>Arts. 10 y 12 de la Ley 1/2014 de Andalucía</b> (documento 9): información institucional y sobre planificación, con mayor detalle.</li>
<li><b>Art. 8.1 de la Ley 38/2003</b> (documento 8): plan estratégico de subvenciones, uno de los planes publicables.</li>
</ul>`,trampas:`<ul>
<li>El <b>6.1</b> obliga a todos los sujetos del título; el <b>6.2</b>, solo a las <b>Administraciones Públicas</b>.</li>
<li>El organigrama debe incluir <b>perfil y trayectoria profesional</b> de los responsables.</li>
<li>Los planes exigen <b>evaluación y publicación periódica</b> de su grado de cumplimiento.</li>
</ul>`,ancla:`<p><b>"Qué hago, con qué normas, quién soy y qué me propongo."</b> Y del plan, <b>cuánto he cumplido</b>.</p>`,vis:`<svg viewBox="0 0 640 140" role="img" aria-label="Información institucional, organizativa y de planificación">
<rect x="25" y="30" width="280" height="80" rx="8" fill="var(--acc-soft)" stroke="var(--acc)"/>
<text x="165" y="52" text-anchor="middle" font-size="11" font-weight="700" fill="var(--acc)">6.1 · Todos los sujetos</text>
<text x="165" y="72" text-anchor="middle" font-size="10" fill="currentColor">funciones · normativa · estructura</text>
<text x="165" y="90" text-anchor="middle" font-size="10" fill="currentColor">organigrama con perfil y trayectoria</text>
<rect x="335" y="30" width="280" height="80" rx="8" fill="var(--ej-bg)" stroke="var(--ej)"/>
<text x="475" y="52" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ej)">6.2 · Solo Administraciones Públicas</text>
<text x="475" y="72" text-anchor="middle" font-size="10" fill="currentColor">planes y programas anuales y plurianuales</text>
<text x="475" y="90" text-anchor="middle" font-size="10" fill="currentColor">con evaluación e indicadores</text>
</svg>`},
{n:7,t:"Información de relevancia jurídica",ubic:"Título I (Transparencia de la actividad pública) ▸ Capítulo II (Publicidad activa)",idea:"Las Administraciones publican lo jurídico: instrucciones, anteproyectos, reglamentos y memorias.",literal:`<p>Las Administraciones Públicas, en el ámbito de sus competencias, publicarán:</p><p>a) Las directrices, instrucciones, acuerdos, circulares o respuestas a consultas planteadas por los particulares u otros órganos en la medida en que supongan una interpretación del Derecho o tengan efectos jurídicos.</p><p>b) Los Anteproyectos de Ley y los proyectos de Decretos Legislativos cuya iniciativa les corresponda, cuando se soliciten los dictámenes a los órganos consultivos correspondientes. En el caso en que no sea preceptivo ningún dictamen la publicación se realizará en el momento de su aprobación.</p><p>c) Los proyectos de Reglamentos cuya iniciativa les corresponda. Cuando sea preceptiva la solicitud de dictámenes, la publicación se producirá una vez que estos hayan sido solicitados a los órganos consultivos correspondientes sin que ello suponga, necesariamente, la apertura de un trámite de audiencia pública.</p><p>d) Las memorias e informes que conformen los expedientes de elaboración de los textos normativos, en particular, la memoria del análisis de impacto normativo regulada por el Real Decreto 1083/2009, de 3 de julio.</p><p>e) Los documentos que, conforme a la legislación sectorial vigente, deban ser sometidos a un período de información pública durante su tramitación.</p>`,dis:`<p><b>Sujetos:</b> solo las <b>Administraciones Públicas</b>, en el ámbito de sus competencias.</p>
<table><thead><tr><th>Letra</th><th>Información de relevancia jurídica</th></tr></thead><tbody>
<tr><td><b>a)</b></td><td><b>Directrices, instrucciones, acuerdos, circulares o respuestas a consultas</b> en la medida en que supongan una <b>interpretación del Derecho</b> o tengan efectos jurídicos</td></tr>
<tr><td><b>b)</b></td><td><b>Anteproyectos de Ley</b> y proyectos de <b>Decretos Legislativos</b>, cuando se soliciten los dictámenes a los órganos consultivos; si no es preceptivo ningún dictamen, en el momento de su aprobación</td></tr>
<tr><td><b>c)</b></td><td><b>Proyectos de Reglamentos</b>; si es preceptivo el dictamen, una vez solicitado, sin que ello suponga necesariamente apertura de audiencia pública</td></tr>
<tr><td><b>d)</b></td><td><b>Memorias e informes</b> de los expedientes de elaboración normativa, en particular la <b>memoria del análisis de impacto normativo</b></td></tr>
<tr><td><b>e)</b></td><td>Los documentos que deban someterse a <b>información pública</b> durante su tramitación</td></tr>
</tbody></table>`,llano:`<p>Las normas no aparecen de la nada: antes hay borradores, informes y criterios internos que condicionan cómo se aplica el Derecho. Este artículo obliga a enseñar esa cocina: las instrucciones que interpretan la norma, los borradores de leyes y reglamentos y las memorias que los justifican.</p>`,porque:`<p>La letra a) es la más relevante en la práctica: una <b>instrucción interna</b> puede determinar cómo se resuelven miles de expedientes y, sin publicidad, el ciudadano se enfrenta a criterios que desconoce. Publicar los proyectos normativos, por su parte, permite la <b>participación</b> antes de que la norma esté cerrada, que es cuando sirve de algo.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> las reglas internas con las que un árbitro interpreta el reglamento: si no se conocen, nadie puede jugar con seguridad.</li>
<li><b>Real:</b> un ayuntamiento publica la instrucción de la Intervención sobre tramitación de facturas y el proyecto de ordenanza de terrazas con su memoria justificativa.</li>
<li><b>Caso límite:</b> una nota interna de organización del trabajo, sin interpretación del Derecho ni efectos jurídicos, no entra en la letra a).</li>
</ul>`,noej:`<ul>
<li><b>No obliga</b> este artículo a los sujetos de las letras e) a i) del art. 2.1: solo a las Administraciones Públicas.</li>
<li><b>No implica</b> la publicación del proyecto de reglamento la apertura automática de un trámite de audiencia pública.</li>
</ul>`,conex:`<ul>
<li><b>Art. 13 de la Ley 1/2014 de Andalucía</b> (documento 9): información de relevancia jurídica, con contenido propio.</li>
<li><b>Arts. 129 a 133 de la Ley 39/2015</b> (documento 1): principios de buena regulación y participación en la elaboración de normas.</li>
<li><b>Art. 45 de la Ley 39/2015:</b> publicación de actos y disposiciones.</li>
</ul>`,trampas:`<ul>
<li>La letra a) exige que supongan <b>interpretación del Derecho</b> o tengan <b>efectos jurídicos</b>: no toda circular se publica.</li>
<li>El momento de publicación de anteproyectos y reglamentos se vincula a la <b>solicitud del dictamen</b>.</li>
<li>Solo obliga a las <b>Administraciones Públicas</b>.</li>
</ul>`,ancla:`<p><b>"Lo que interpreta y lo que está en el horno."</b> Instrucciones con efectos, borradores normativos y sus memorias.</p>`,vis:`<svg viewBox="0 0 640 145" role="img" aria-label="Información de relevancia jurídica">
<rect x="150" y="12" width="340" height="32" rx="8" fill="var(--acc-soft)" stroke="var(--acc)"/>
<text x="320" y="33" text-anchor="middle" font-size="11" font-weight="700" fill="var(--acc)">Solo las Administraciones Públicas (letras a a d del art. 2.1)</text>
<g font-size="10" text-anchor="middle" fill="currentColor">
<rect x="20" y="58" width="185" height="60" rx="8" fill="var(--panel)" stroke="var(--line)"/><text x="112" y="80" font-weight="700">a) Criterios interpretativos</text><text x="112" y="98">instrucciones, circulares, consultas</text>
<rect x="227" y="58" width="185" height="60" rx="8" fill="var(--panel)" stroke="var(--line)"/><text x="320" y="80" font-weight="700">b) y c) Proyectos normativos</text><text x="320" y="98">anteproyectos y reglamentos</text>
<rect x="434" y="58" width="186" height="60" rx="8" fill="var(--panel)" stroke="var(--line)"/><text x="527" y="80" font-weight="700">d) y e) Memorias</text><text x="527" y="98">e informes y documentos a información pública</text>
</g>
</svg>`},
{n:8,t:"Información económica, presupuestaria y estadística",ubic:"Título I (Transparencia de la actividad pública) ▸ Capítulo II (Publicidad activa)",idea:"El bloque económico: contratos, convenios, subvenciones, presupuestos, cuentas y retribuciones.",literal:`<p>1. Teniendo en cuenta las competencias legislativas de las Comunidades Autónomas, los sujetos incluidos en el ámbito de aplicación de este título deberán hacer pública, como mínimo, la información relativa a los actos de gestión administrativa con repercusión económica o presupuestaria que se indican a continuación:</p><p>a) Todos los contratos, con indicación del objeto, duración, el importe de la licitación y de adjudicación, el procedimiento utilizado para su celebración, los instrumentos a través de los que, en su caso, se ha publicitado, el número de licitadores participantes en el procedimiento y la identidad del adjudicatario, así como las modificaciones del contrato. Igualmente serán objeto de publicación las decisiones de desistimiento y renuncia de los contratos. La publicación de la información relativa a los contratos menores podrá realizarse trimestralmente.</p><p>Asimismo, se publicarán datos estadísticos sobre el porcentaje en volumen presupuestario de contratos adjudicados a través de cada uno de los procedimientos previstos en la legislación de contratos del sector público.</p><p>Además, se publicará información estadística sobre el porcentaje de participación en contratos adjudicados, tanto en relación con su número como en relación con su valor, de la categoría de microempresas, pequeñas y medianas empresas (pymes), entendidas como tal según el anexo I del Reglamento (UE) n.º 651/2014 de la Comisión, de 17 de junio de 2014, para cada uno de los procedimientos y tipologías previstas en la legislación de contratos del sector público. La publicación de esta información se realizará semestralmente, a partir de un año de la publicación de la norma.</p><p>b) La relación de los convenios suscritos, con mención de las partes firmantes, su objeto, plazo de duración, modificaciones realizadas, obligados a la realización de las prestaciones y, en su caso, las obligaciones económicas convenidas. Igualmente, se publicarán las encomiendas de gestión que se firmen, con indicación de su objeto, presupuesto, duración, obligaciones económicas y las subcontrataciones que se realicen con mención de los adjudicatarios, procedimiento seguido para la adjudicación e importe de la misma.</p><p>c) Las subvenciones y ayudas públicas concedidas con indicación de su importe, objetivo o finalidad y beneficiarios.</p><p>d) Los presupuestos, con descripción de las principales partidas presupuestarias e información actualizada y comprensible sobre su estado de ejecución y sobre el cumplimiento de los objetivos de estabilidad presupuestaria y sostenibilidad financiera de las Administraciones Públicas.</p><p>e) Las cuentas anuales que deban rendirse y los informes de auditoría de cuentas y de fiscalización por parte de los órganos de control externo que sobre ellos se emitan.</p><p>f) Las retribuciones percibidas anualmente por los altos cargos y máximos responsables de las entidades incluidas en el ámbito de la aplicación de este título. Igualmente, se harán públicas las indemnizaciones percibidas, en su caso, con ocasión del abandono del cargo.</p><p>g) Las resoluciones de autorización o reconocimiento de compatibilidad que afecten a los empleados públicos así como las que autoricen el ejercicio de actividad privada al cese de los altos cargos de la Administración General del Estado o asimilados según la normativa autonómica o local.</p><p>h) Las declaraciones anuales de bienes y actividades de los representantes locales, en los términos previstos en la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local. Cuando el reglamento no fije los términos en que han de hacerse públicas estas declaraciones se aplicará lo dispuesto en la normativa de conflictos de intereses en el ámbito de la Administración General del Estado. En todo caso, se omitirán los datos relativos a la localización concreta de los bienes inmuebles y se garantizará la privacidad y seguridad de sus titulares.</p><p>i) La información estadística necesaria para valorar el grado de cumplimiento y calidad de los servicios públicos que sean de su competencia, en los términos que defina cada administración competente.</p><p>2. Los sujetos mencionados en el artículo 3 deberán publicar la información a la que se refieren las letras a) y b) del apartado primero de este artículo cuando se trate de contratos o convenios celebrados con una Administración Pública. Asimismo, habrán de publicar la información prevista en la letra c) en relación a las subvenciones que reciban cuando el órgano concedente sea una Administración Pública.</p><p>3. Las Administraciones Públicas publicarán la relación de los bienes inmuebles que sean de su propiedad o sobre los que ostenten algún derecho real.</p>`,dis:`<table><thead><tr><th>Letra</th><th>Qué debe publicarse (art. 8.1)</th></tr></thead><tbody>
<tr><td><b>a)</b></td><td><b>Todos los contratos</b>: objeto, duración, importe de licitación y de adjudicación, procedimiento, instrumentos de publicidad, número de licitadores e identidad del adjudicatario; modificaciones; datos estadísticos por procedimiento y participación de <b>pymes</b></td></tr>
<tr><td><b>b)</b></td><td>Relación de <b>convenios</b>, con partes, objeto, plazo, modificaciones y obligaciones económicas; y las <b>encomiendas de gestión</b></td></tr>
<tr><td><b>c)</b></td><td><b>Subvenciones y ayudas públicas</b> concedidas, con importe, objetivo o finalidad y beneficiarios</td></tr>
<tr><td><b>d)</b></td><td>Los <b>presupuestos</b>, con las principales partidas e información actualizada sobre su <b>ejecución</b> y sobre el cumplimiento de los objetivos de <b>estabilidad presupuestaria</b></td></tr>
<tr><td><b>e)</b></td><td>Las <b>cuentas anuales</b> y los informes de <b>auditoría y de fiscalización</b> de los órganos de control externo</td></tr>
<tr><td><b>f)</b></td><td><b>Retribuciones</b> anuales de <span class="t" data-k="altocargo">altos cargos</span> y máximos responsables, e <b>indemnizaciones</b> por abandono del cargo</td></tr>
<tr><td><b>g)</b></td><td>Resoluciones de <b>compatibilidad</b> de empleados públicos y las que autoricen actividad privada tras el cese de altos cargos</td></tr>
<tr><td><b>h)</b></td><td><b>Declaraciones anuales de bienes y actividades</b> de los representantes locales, en los términos de la <b>LBRL</b></td></tr>
<tr><td><b>i)</b></td><td><b>Información estadística</b> sobre el grado de cumplimiento y calidad de los servicios públicos</td></tr>
</tbody></table>
<ul>
<li><b>8.2:</b> los sujetos del <b>art. 3</b> publican lo relativo a <b>contratos y convenios</b> celebrados con una Administración Pública y las subvenciones que reciban.</li>
<li><b>8.3:</b> las <b>Administraciones Públicas</b> publicarán la relación de sus <b>bienes inmuebles</b> en propiedad o sobre los que ostenten un derecho real.</li>
</ul>`,llano:`<p>Es el artículo estrella para una entidad local: todos los contratos con sus datos, los convenios, las subvenciones concedidas, el presupuesto y su ejecución, las cuentas y los informes de fiscalización, lo que cobran los cargos, las compatibilidades, las declaraciones de bienes de los concejales y los inmuebles municipales.</p>`,porque:`<p>El dinero es donde la opacidad más daño hace, y por eso este artículo es el más detallado de la ley. Obliga a publicar no solo la decisión —el contrato adjudicado— sino los <b>datos que permiten evaluarla</b>: cuántos licitadores hubo, por qué procedimiento, con qué modificaciones. Esa granularidad es lo que convierte la publicación en control efectivo.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> las cuentas de una comunidad de vecinos con el detalle de cada contrato y de lo que cobra el administrador.</li>
<li><b>Real:</b> un ayuntamiento publica la relación de contratos menores del trimestre, los convenios con asociaciones, las subvenciones concedidas con beneficiarios e importes, el estado de ejecución presupuestaria y las retribuciones del alcalde y los concejales con dedicación.</li>
<li><b>Caso límite:</b> una entidad privada del art. 3 publica solo sus contratos y convenios con la Administración y las subvenciones recibidas, no todo su presupuesto.</li>
</ul>`,noej:`<ul>
<li><b>No se limita</b> la letra a) a los contratos mayores: dice <b>todos los contratos</b>.</li>
<li><b>No corresponde</b> el 8.3 a las sociedades ni fundaciones públicas: es obligación de las <b>Administraciones Públicas</b>.</li>
</ul>`,conex:`<ul>
<li><b>Arts. 63 y 154 de la Ley 9/2017</b> (documento 7): perfil de contratante y publicidad de la formalización.</li>
<li><b>Arts. 18 y 20 de la Ley 38/2003</b> (documento 8): publicidad de subvenciones y BDNS.</li>
<li><b>Arts. 169 y 212 del TRLHL</b> (documento 5): publicación del presupuesto y de la cuenta general.</li>
<li><b>Arts. 15 y 16 de la Ley 1/2014 de Andalucía</b> (documento 9): equivalentes autonómicos.</li>
</ul>`,trampas:`<ul>
<li>La letra a) alcanza a <b>todos</b> los contratos e incluye estadísticas de <b>pymes</b>.</li>
<li>Las <b>encomiendas de gestión</b> se publican junto con los convenios (letra b).</li>
<li>Las <b>declaraciones de bienes</b> de los representantes locales se publican en los términos de la <b>LBRL</b>.</li>
<li>La relación de <b>bienes inmuebles</b> (8.3) solo obliga a las Administraciones Públicas.</li>
</ul>`,ancla:`<p><b>"Contratos, convenios, subvenciones, presupuesto, cuentas, sueldos, compatibilidades, bienes y estadística."</b> Nueve letras, todas de dinero o de poder.</p>`,vis:`<svg viewBox="0 0 640 170" role="img" aria-label="Información económica, presupuestaria y estadística">
<rect x="180" y="10" width="280" height="32" rx="8" fill="var(--acc)" stroke="var(--acc)"/>
<text x="320" y="31" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">ART. 8 · EL BLOQUE ECONÓMICO</text>
<g font-size="10" text-anchor="middle" fill="currentColor">
<rect x="15" y="56" width="195" height="52" rx="8" fill="var(--acc-soft)" stroke="var(--acc)"/><text x="112" y="78" font-weight="700">Gasto contratado</text><text x="112" y="95">a) contratos · b) convenios · c) subvenciones</text>
<rect x="222" y="56" width="195" height="52" rx="8" fill="var(--ej-bg)" stroke="var(--ej)"/><text x="320" y="78" font-weight="700">Cuentas</text><text x="320" y="95">d) presupuestos · e) cuentas y auditorías</text>
<rect x="429" y="56" width="196" height="52" rx="8" fill="var(--warn-bg)" stroke="var(--warn)"/><text x="527" y="78" font-weight="700">Personas</text><text x="527" y="95">f) retribuciones · g) compatibilidades · h) bienes</text>
</g>
<text x="320" y="132" text-anchor="middle" font-size="10" fill="currentColor">i) Información estadística sobre cumplimiento y calidad de los servicios</text>
<text x="320" y="152" text-anchor="middle" font-size="10" fill="var(--ink2)">8.3 · Las Administraciones Públicas publican además la relación de sus bienes inmuebles</text>
</svg>`},
{n:9,t:"Control",ubic:"Título I (Transparencia de la actividad pública) ▸ Capítulo II (Publicidad activa)",idea:"El Consejo controla el cumplimiento y el incumplimiento reiterado es infracción grave.",literal:`<p>1. El cumplimiento por la Administración General del Estado de las obligaciones contenidas en este capítulo será objeto de control por parte del Consejo de Transparencia y Buen Gobierno.</p><p>2. En ejercicio de la competencia prevista en el apartado anterior, el Consejo de Transparencia y Buen Gobierno, de acuerdo con el procedimiento que se prevea reglamentariamente, podrá dictar resoluciones en las que se establezcan las medidas que</p><p>sea necesario adoptar para el cese del incumplimiento y el inicio de las actuaciones disciplinarias que procedan.</p><p>3. El incumplimiento reiterado de las obligaciones de publicidad activa reguladas en este capítulo tendrá la consideración de infracción grave a los efectos de aplicación a sus responsables del régimen disciplinario previsto en la correspondiente normativa reguladora.</p>`,dis:`<ul>
<li><b>9.1:</b> el cumplimiento por la <b>AGE</b> de las obligaciones de publicidad activa es objeto de control por el <span class="t" data-k="consejotbg">Consejo de Transparencia y Buen Gobierno</span>.</li>
<li><b>9.2:</b> el Consejo puede dictar <b>resoluciones</b> que establezcan las medidas necesarias para el <b>cese del incumplimiento</b> y el <b>inicio de las actuaciones disciplinarias</b> que procedan.</li>
<li><b>9.3:</b> el <b>incumplimiento reiterado</b> de las obligaciones de publicidad activa tiene la consideración de <b>infracción grave</b> a efectos disciplinarios.</li>
</ul>`,llano:`<p>Las obligaciones de publicar no se quedan en una declaración de intenciones: hay un organismo que vigila, puede exigir que se corrija y puede pedir que se abra expediente disciplinario. Y si el incumplimiento se repite, es falta grave.</p>`,porque:`<p>Una obligación sin consecuencia es una recomendación. El art. 9 cierra el sistema: control externo por un organismo independiente y calificación del incumplimiento reiterado como <b>infracción grave</b>. Nótese el alcance del apartado 1: el control del Consejo se refiere a la <b>AGE</b>; en las comunidades autónomas y entidades locales el control corresponde a los órganos autonómicos, salvo convenio de atribución.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> el organismo que inspecciona si un comercio tiene la lista de precios a la vista y puede sancionar si reincide.</li>
<li><b>Real:</b> en Andalucía, el control del cumplimiento de la publicidad activa corresponde al <b>Consejo de Transparencia y Protección de Datos de Andalucía</b> (arts. 23 y 43 de la Ley 1/2014).</li>
<li><b>Caso límite:</b> un incumplimiento aislado no es infracción grave por este artículo: la ley exige que sea <b>reiterado</b>.</li>
</ul>`,noej:`<ul>
<li><b>No sanciona</b> directamente el Consejo por esta vía: insta el inicio de actuaciones disciplinarias.</li>
<li><b>No alcanza</b> el control del 9.1 a las entidades locales andaluzas: ahí interviene el Consejo autonómico.</li>
</ul>`,conex:`<ul>
<li><b>Arts. 33 a 40 LTBG:</b> Consejo de Transparencia y Buen Gobierno.</li>
<li><b>Arts. 23 y 43 y ss. de la Ley 1/2014</b> (documento 9): control y Consejo andaluz.</li>
<li><b>Arts. 52 a 56 de la Ley 1/2014:</b> régimen sancionador autonómico, que sí prevé sanciones propias.</li>
</ul>`,trampas:`<ul>
<li>El apartado 1 se refiere al cumplimiento por la <b>Administración General del Estado</b>.</li>
<li>La infracción es grave solo si el incumplimiento es <b>reiterado</b>.</li>
</ul>`,ancla:`<p><b>"Vigila el Consejo; si reincides, falta grave."</b></p>`,vis:`<svg viewBox="0 0 640 125" role="img" aria-label="Control del cumplimiento de la publicidad activa">

{n:10,t:"Portal de la Transparencia",ubic:"Título I (Transparencia de la actividad pública) ▸ Capítulo II (Publicidad activa)",idea:"El Portal de la Transparencia centraliza la información de la Administración del Estado.",literal:`<p>1. La Administración General del Estado desarrollará un Portal de la Transparencia, dependiente del Ministerio de la Presidencia, que facilitará el acceso de los ciudadanos a toda la información a la que se refieren los artículos anteriores relativa a su ámbito de actuación.</p><p>2. El Portal de la Transparencia incluirá, en los términos que se establezcan reglamentariamente, la información de la Administración General del Estado, cuyo acceso se solicite con mayor frecuencia.</p><p>3. La Administración General del Estado, las Administraciones de las Comunidades Autónomas y de las Ciudades de Ceuta y Melilla y las entidades que integran la Administración Local podrán adoptar otras medidas complementarias y de colaboración para el cumplimiento de las obligaciones de transparencia recogidas en este capítulo.</p>`,dis:`<ul>
<li><b>10.1:</b> la <b>AGE</b> desarrollará un <span class="t" data-k="portal">Portal de la Transparencia</span>, dependiente del <b>Ministerio de la Presidencia</b>, que facilitará el acceso de los ciudadanos a toda la información de su ámbito de actuación.</li>
<li><b>10.2:</b> incluirá, en los términos reglamentarios, la información de la AGE <b>cuyo acceso se solicite con mayor frecuencia</b>.</li>
<li><b>10.3:</b> la AGE, las comunidades autónomas, Ceuta y Melilla y las entidades locales <b>podrán adoptar otras medidas complementarias y de colaboración</b> para el cumplimiento de las obligaciones de transparencia.</li>
</ul>`,llano:`<p>Toda la información del Estado se concentra en una única ventanilla digital. Además, se publica de oficio lo que más se pide, para no tener que contestar mil veces a la misma pregunta. Y las demás Administraciones pueden colaborar y adherirse a soluciones comunes.</p>`,porque:`<p>La dispersión es enemiga de la transparencia: información publicada en cincuenta webs distintas equivale a información oculta. Y la regla del apartado 2 responde a una lógica de eficiencia administrativa: si una información se pide mucho, sale más barato publicarla que tramitar cada solicitud.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> la sección de preguntas frecuentes de una web, que evita repetir la misma respuesta.</li>
<li><b>Real:</b> muchos ayuntamientos pequeños cumplen sus obligaciones adhiriéndose al portal de transparencia de su diputación provincial, al amparo del art. 10.3.</li>
</ul>`,noej:`<ul>
<li><b>No obliga</b> este artículo a las entidades locales a crear su propio portal: les permite adoptar medidas de colaboración.</li>
<li><b>No sustituye</b> el Portal a las obligaciones de publicación de cada sujeto.</li>
</ul>`,conex:`<ul>
<li><b>Art. 11 LTBG:</b> principios técnicos del Portal.</li>
<li><b>Art. 5.4 LTBG:</b> publicación en sedes electrónicas o páginas web.</li>
<li><b>Arts. 18 y 20 de la Ley 1/2014 de Andalucía</b> (documento 9): acceso a la publicidad activa y reutilización.</li>
</ul>`,trampas:`<ul>
<li>El Portal depende del <b>Ministerio de la Presidencia</b> y se refiere a la <b>AGE</b>.</li>
<li>La colaboración del 10.3 es <b>potestativa</b> ("podrán").</li>
</ul>`,ancla:`<p><b>"Una ventanilla, y lo que más se pregunta, publicado de oficio."</b></p>`,vis:`<svg viewBox="0 0 640 120" role="img" aria-label="Portal de la Transparencia">
<rect x="200" y="25" width="240" height="52" rx="8" fill="var(--acc)" stroke="var(--acc)"/>
<text x="320" y="48" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">PORTAL DE LA TRANSPARENCIA</text>
<text x="320" y="67" text-anchor="middle" font-size="10" fill="#fff">Ministerio de la Presidencia · ámbito AGE</text>
<text x="320" y="98" text-anchor="middle" font-size="10" fill="currentColor">Incluye la información cuyo acceso se solicita con mayor frecuencia</text>
<text x="320" y="114" text-anchor="middle" font-size="10" fill="var(--ink2)">Las demás Administraciones pueden adoptar medidas complementarias y de colaboración</text>
</svg>`},
{n:11,t:"Principios técnicos",ubic:"Título I (Transparencia de la actividad pública) ▸ Capítulo II (Publicidad activa)",idea:"Tres principios técnicos: accesibilidad, interoperabilidad y reutilización.",literal:`<p>El Portal de la Transparencia contendrá información publicada de acuerdo con las prescripciones técnicas que se establezcan reglamentariamente que deberán adecuarse a los siguientes principios:</p><p>a) Accesibilidad: se proporcionará información estructurada sobre los documentos y recursos de información con vistas a facilitar la identificación y búsqueda de la información.</p><p>b) Interoperabilidad: la información publicada será conforme al Esquema Nacional de Interoperabilidad, aprobado por el Real Decreto 4/2010, de 8 enero, así como a las normas técnicas de interoperabilidad.</p><p>c) Reutilización: se fomentará que la información sea publicada en formatos que permita su reutilización, de acuerdo con lo previsto en la Ley 37/2007, de 16 de noviembre, sobre reutilización de la información del sector público y en su normativa de desarrollo.</p>`,dis:`<table><thead><tr><th>Principio</th><th>Contenido</th></tr></thead><tbody>
<tr><td><b>a) Accesibilidad</b></td><td>Información <b>estructurada</b> sobre documentos y recursos, para facilitar su <b>identificación y búsqueda</b></td></tr>
<tr><td><b>b) <span class="t" data-k="interoperabilidad">Interoperabilidad</span></b></td><td>Conformidad con el <span class="t" data-k="esquemanac">Esquema Nacional de Interoperabilidad</span> y sus normas técnicas</td></tr>
<tr><td><b>c) <span class="t" data-k="reutilizacion">Reutilización</span></b></td><td>Fomento de formatos que permitan reutilizar la información, conforme a la <b>Ley 37/2007</b> sobre reutilización de la información del sector público</td></tr>
</tbody></table>`,llano:`<p>Tres exigencias técnicas para que la información publicada sirva de algo: que se pueda encontrar, que los sistemas se entiendan entre sí y que cualquiera pueda descargarla y trabajar con ella.</p>`,porque:`<p>Publicar en formato imagen o en documentos que impiden copiar el texto es una forma sofisticada de opacidad. Estos principios convierten la publicación en <b>datos utilizables</b>: es lo que permite que periodistas, investigadores o empresas puedan analizar la contratación pública o el gasto de una Administración.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> recibir una lista en hoja de cálculo en lugar de en una foto de un papel.</li>
<li><b>Real:</b> publicar la relación de contratos en CSV o JSON descargable, con campos normalizados, en vez de un PDF escaneado.</li>
</ul>`,noej:`<ul>
<li><b>No cumple</b> el principio de reutilización un PDF que no permite extraer los datos.</li>
<li><b>No basta</b> con publicar: hay que hacerlo de forma <b>estructurada</b> y conforme al Esquema Nacional de Interoperabilidad.</li>
</ul>`,conex:`<ul>
<li><b>Art. 5.4 LTBG:</b> formatos reutilizables y mecanismos de accesibilidad.</li>
<li><b>Art. 19 de la Ley 1/2014 de Andalucía</b> (documento 9): reutilización de la información.</li>
<li><b>RD 203/2021</b> (documento 4): actuación por medios electrónicos e interoperabilidad.</li>
</ul>`,trampas:`<ul>
<li>Son <b>tres</b> principios: accesibilidad, interoperabilidad y reutilización.</li>
<li>La interoperabilidad se remite al <b>Esquema Nacional de Interoperabilidad</b>; la reutilización, a la <b>Ley 37/2007</b>.</li>
</ul>`,ancla:`<p><b>"A-I-R":</b> <b>A</b>ccesibilidad · <b>I</b>nteroperabilidad · <b>R</b>eutilización. Que se encuentre, que se entienda y que se pueda usar.</p>`,vis:`<svg viewBox="0 0 640 125" role="img" aria-label="Principios técnicos de la publicación">
<g font-size="10" text-anchor="middle" fill="currentColor">
<rect x="30" y="30" width="170" height="60" rx="8" fill="var(--acc-soft)" stroke="var(--acc)"/><text x="115" y="53" font-size="11" font-weight="700" fill="var(--acc)">Accesibilidad</text><text x="115" y="72">estructurada y localizable</text>
<rect x="235" y="30" width="170" height="60" rx="8" fill="var(--ej-bg)" stroke="var(--ej)"/><text x="320" y="53" font-size="11" font-weight="700" fill="var(--ej)">Interoperabilidad</text><text x="320" y="72">Esquema Nacional</text>
<rect x="440" y="30" width="170" height="60" rx="8" fill="var(--warn-bg)" stroke="var(--warn)"/><text x="525" y="53" font-size="11" font-weight="700" fill="var(--warn)">Reutilización</text><text x="525" y="72">Ley 37/2007</text>
</g>
<text x="320" y="112" text-anchor="middle" font-size="10" fill="var(--ink2)">Que se encuentre · que se entienda · que se pueda usar</text>
</svg>`}];
</script>
<script>
const PLAZOS=[["Más del 50 %", "Participación pública que sujeta a una sociedad mercantil", "Sociedades", "2.1.g) L19/2013", "Directa o indirecta"], ["Más de 100.000 €", "Ayudas o subvenciones anuales que sujetan a una entidad privada a publicidad activa", "Entidades privadas", "3.b) L19/2013", "Umbral alternativo"], ["40 % y 5.000 €", "Porcentaje de ingresos de origen público y mínimo absoluto", "Entidades privadas", "3.b) L19/2013", "Umbral alternativo al anterior"], ["50.000 €", "Presupuesto por debajo del cual las entidades sin ánimo de lucro pueden cumplir con medios ajenos", "Entidades sin ánimo de lucro", "5.4 L19/2013", "Fines de interés social o cultural"], ["Periódica y actualizada", "Frecuencia de la publicidad activa", "Sujetos obligados", "5.1 L19/2013", "Información relevante para el control de la actuación pública"], ["Gratuito", "Coste del acceso a la información publicada", "Ciudadanía", "5.5 L19/2013", "Fácil, comprensible y accesible"], ["Previa disociación", "Condición para publicar información con datos especialmente protegidos", "Sujetos obligados", "5.3 L19/2013", "Límites de los arts. 14 y 15"], ["Infracción grave", "Calificación del incumplimiento reiterado de la publicidad activa", "Responsables", "9.3 L19/2013", "A efectos disciplinarios"], ["Todos los contratos", "Alcance de la publicidad de la contratación", "Sujetos obligados", "8.1.a) L19/2013", "Con datos de licitadores, procedimiento y adjudicatario"], ["Bienes inmuebles", "Relación que publican solo las Administraciones Públicas", "AAPP", "8.3 L19/2013", "En propiedad o con derecho real"]];
const FLASH=[["¿Cuáles son los tres objetos de la Ley 19/2013?", "Ampliar y reforzar la <b>transparencia</b>, regular y garantizar el <b>derecho de acceso</b> y establecer las obligaciones de <b>buen gobierno</b> y las consecuencias de su incumplimiento (art. 1)."], ["¿Qué entidades son «Administraciones Públicas» a efectos del Título I?", "Las de las letras <b>a) a d)</b> del art. 2.1: AGE, CCAA y entidades locales · Seguridad Social y mutuas · organismos, agencias y EPE · entidades de Derecho Público, incluidas las Universidades (art. 2.2)."], ["¿Cuándo queda sujeta una sociedad mercantil?", "Cuando la participación pública, directa o indirecta, sea <b>superior al 50 %</b> (art. 2.1.g)."], ["¿En qué medida quedan sujetos los colegios profesionales y las Cortes?", "Solo <b>en lo relativo a sus actividades sujetas a Derecho Administrativo</b> (art. 2.1.e y f)."], ["¿Qué sujetos del art. 3 quedan obligados y a qué?", "Partidos, sindicatos y organizaciones empresariales, y entidades privadas con ayudas superiores a <b>100.000 €</b> o con el <b>40 %</b> de sus ingresos de origen público (mínimo <b>5.000 €</b>). Solo al <b>capítulo II</b>, publicidad activa."], ["¿Qué obliga el art. 4?", "A quienes presten servicios públicos o ejerzan potestades administrativas, a <b>suministrar información</b> a la Administración a la que estén vinculados, <b>previo requerimiento</b>."], ["¿Cómo debe publicarse la información?", "De forma <b>periódica y actualizada</b>, en sedes electrónicas o webs, <b>clara, estructurada y entendible</b>, preferiblemente en <b>formatos reutilizables</b>, de acceso <b>fácil y gratuito</b> y accesible para personas con discapacidad (art. 5)."], ["¿Qué ocurre si la información contiene datos especialmente protegidos?", "La publicidad solo se lleva a cabo <b>previa disociación</b> de esos datos (art. 5.3)."], ["¿Es la ley estatal un techo para las comunidades autónomas?", "No: es un <b>mínimo</b>. Las obligaciones se entienden sin perjuicio de normativa que prevea un régimen <b>más amplio</b> (art. 5.2)."], ["¿Qué información institucional debe publicarse?", "Funciones, normativa aplicable y estructura organizativa, con <b>organigrama actualizado</b> que identifique a los responsables y su <b>perfil y trayectoria</b> (art. 6.1)."], ["¿Quién debe publicar los planes y programas y su evaluación?", "Solo las <b>Administraciones Públicas</b>, con objetivos, actividades, medios, tiempo e <b>indicadores</b> (art. 6.2)."], ["Cita tres contenidos de información de relevancia jurídica", "Directrices, instrucciones y circulares con efectos jurídicos · anteproyectos de ley y proyectos de reglamento · memorias e informes del expediente normativo (art. 7)."], ["¿Qué debe publicarse sobre contratos?", "<b>Todos</b> los contratos, con objeto, duración, importes de licitación y adjudicación, procedimiento, publicidad, número de licitadores, adjudicatario y modificaciones; más estadísticas por procedimiento y de pymes (art. 8.1.a)."], ["¿Qué información económica exige el art. 8 además de los contratos?", "Convenios y encomiendas · subvenciones y ayudas · presupuestos y su ejecución · cuentas anuales e informes de fiscalización · retribuciones e indemnizaciones de altos cargos · compatibilidades · declaraciones de bienes de representantes locales · estadística de servicios."], ["¿Quién publica la relación de bienes inmuebles?", "Las <b>Administraciones Públicas</b>, respecto de los que sean de su propiedad o sobre los que ostenten un derecho real (art. 8.3)."], ["¿Quién controla el cumplimiento de la publicidad activa en la AGE?", "El <b>Consejo de Transparencia y Buen Gobierno</b> (art. 9.1)."], ["¿Cómo se califica el incumplimiento reiterado de la publicidad activa?", "Como <b>infracción grave</b> a efectos disciplinarios (art. 9.3)."], ["¿De quién depende el Portal de la Transparencia?", "Del <b>Ministerio de la Presidencia</b>, en el ámbito de la Administración General del Estado (art. 10.1)."], ["¿Qué información incluye el Portal además de la obligatoria?", "La de la AGE <b>cuyo acceso se solicite con mayor frecuencia</b> (art. 10.2)."], ["Los tres principios técnicos del art. 11", "<b>Accesibilidad</b> · <b>interoperabilidad</b> (Esquema Nacional) · <b>reutilización</b> (Ley 37/2007)."]];
const TEST=[{"a": 1, "q": "El objeto de la Ley 19/2013 comprende:", "o": [["ampliar la transparencia, garantizar el derecho de acceso y establecer obligaciones de buen gobierno y sus consecuencias", 1, "Correcto: art. 1, los tres objetos."], ["únicamente regular el derecho de acceso a la información pública", 0, "Faltarían la publicidad activa y el buen gobierno."], ["regular la protección de datos personales", 0, "No es su objeto, aunque la contempla como límite."], ["establecer el régimen de la administración electrónica", 0, "Esa materia corresponde a la Ley 39/2015 y al RD 203/2021."]]}, {"a": 2, "q": "Una sociedad mercantil queda sujeta al Título I de la Ley 19/2013 cuando la participación pública sea:", "o": [["superior al 50 %, directa o indirecta", 1, "Correcto: art. 2.1.g)."], ["igual o superior al 50 %", 0, "La ley exige participación <b>superior</b> al 50 %."], ["superior al 25 %", 0, "No es el umbral legal."], ["cualquiera, con tal de que exista participación pública", 0, "Se exige superar el 50 %."]]}, {"a": 2, "q": "El Congreso de los Diputados y los colegios profesionales quedan sujetos a la ley en toda su actividad.", "vf": true, "ok": false, "fb": "<b>Falso.</b> Las letras e) y f) del art. 2.1 los sujetan solo <b>en relación con sus actividades sujetas a Derecho Administrativo</b>."}, {"a": 3, "q": "Una entidad privada queda obligada a publicidad activa cuando:", "o": [["percibe más de 100.000 € en ayudas al año o el 40 % de sus ingresos son públicos, con un mínimo de 5.000 €", 1, "Correcto: art. 3.b). Los umbrales son alternativos."], ["percibe más de 100.000 € y además el 40 % de sus ingresos son públicos", 0, "No son acumulativos: basta con uno."], ["recibe cualquier subvención pública", 0, "Se exige superar alguno de los umbrales."], ["así lo acuerda la Administración concedente", 0, "La sujeción es legal, no convencional."]]}, {"a": 4, "q": "Completa: «Las personas que presten servicios públicos o ejerzan potestades administrativas estarán obligadas a suministrar toda la información necesaria, ______ requerimiento».", "gap": "previo", "fb": "<b>Previo</b> requerimiento (art. 4). La obligación no opera de oficio."}, {"a": 5, "q": "La información sujeta a publicidad activa debe publicarse:", "o": [["de forma periódica y actualizada, clara, estructurada, entendible y preferiblemente en formatos reutilizables", 1, "Correcto: art. 5.1 y 5.4."], ["una vez al año, en el boletín oficial", 0, "No es la forma ni el medio previstos."], ["previa solicitud de los interesados", 0, "Eso sería el derecho de acceso, no la publicidad activa."], ["previo pago de la tasa correspondiente", 0, "El acceso es <b>gratuito</b> (art. 5.5)."]]}, {"a": 5, "q": "Las obligaciones de transparencia de la ley estatal impiden que una comunidad autónoma establezca un régimen más amplio.", "vf": true, "ok": false, "fb": "<b>Falso.</b> El art. 5.2 dice que se entienden <b>sin perjuicio</b> de la normativa autonómica o de otras disposiciones que prevean un régimen <b>más amplio</b> de publicidad. La Ley 1/2014 de Andalucía lo amplía."}, {"a": 5, "q": "Cuando la información contenga datos especialmente protegidos:", "o": [["la publicidad solo se llevará a cabo previa disociación de los mismos", 1, "Correcto: art. 5.3."], ["se publicará íntegramente por primar la transparencia", 0, "No: prima la protección de los datos especialmente protegidos."], ["no se publicará en ningún caso, aunque puedan disociarse", 0, "Sí puede publicarse tras la disociación."], ["se publicará previa autorización del afectado en todo caso", 0, "La ley prevé la disociación, no la autorización."]]}, {"a": 6, "q": "La obligación de publicar planes y programas con sus indicadores de cumplimiento corresponde a:", "o": [["las Administraciones Públicas de las letras a) a d) del art. 2.1", 1, "Correcto: art. 6.2 en relación con el art. 2.2."], ["todos los sujetos del art. 2.1", 0, "El art. 6.2 se refiere solo a las Administraciones Públicas."], ["los partidos políticos y sindicatos", 0, "A estos se les aplica el capítulo II, pero no esta obligación específica."], ["únicamente a la Administración General del Estado", 0, "Alcanza a todas las Administraciones Públicas."]]}, {"a": 6, "q": "El organigrama que debe publicarse ha de identificar a los responsables e incluir su perfil y trayectoria profesional.", "vf": true, "ok": true, "fb": "<b>Verdadero</b> (art. 6.1). Debe estar además <b>actualizado</b>."}, {"a": 7, "q": "¿Cuál de estos contenidos es información de relevancia jurídica del art. 7?", "o": [["las instrucciones y circulares que supongan una interpretación del Derecho o tengan efectos jurídicos", 1, "Correcto: art. 7.a)."], ["las retribuciones de los altos cargos", 0, "Es información económica: art. 8.1.f)."], ["la relación de bienes inmuebles", 0, "Es información económica: art. 8.3."], ["el organigrama de la entidad", 0, "Es información institucional: art. 6.1."]]}, {"a": 8, "q": "Respecto de los contratos, la ley obliga a publicar:", "o": [["todos los contratos, con el número de licitadores y la identidad del adjudicatario, entre otros datos", 1, "Correcto: art. 8.1.a), que incluye también estadísticas por procedimiento y de pymes."], ["solo los contratos sujetos a regulación armonizada", 0, "La ley dice «todos los contratos»."], ["únicamente los contratos mayores de 100.000 €", 0, "No hay umbral en este precepto."], ["solo el número total de contratos adjudicados", 0, "Se exige un detalle mucho mayor."]]}, {"a": 8, "q": "Completa: «Las Administraciones Públicas publicarán la relación de los ______ que sean de su propiedad o sobre los que ostenten algún derecho real».", "gap": "bienes inmuebles", "fb": "<b>Bienes inmuebles</b> (art. 8.3). Es obligación exclusiva de las Administraciones Públicas."}, {"a": 8, "q": "¿Qué deben publicar los sujetos del art. 3 conforme al art. 8.2?", "o": [["los contratos y convenios celebrados con una Administración Pública y las subvenciones recibidas", 1, "Correcto: art. 8.2."], ["la totalidad de su presupuesto y sus cuentas anuales", 0, "No se les exige en ese apartado."], ["la relación de sus bienes inmuebles", 0, "Esa obligación es de las Administraciones Públicas (art. 8.3)."], ["nada: solo se les aplica el derecho de acceso", 0, "Al contrario: se les aplica el capítulo de publicidad activa."]]}, {"a": 9, "q": "El incumplimiento reiterado de las obligaciones de publicidad activa se considera:", "o": [["infracción grave a efectos del régimen disciplinario", 1, "Correcto: art. 9.3."], ["infracción muy grave sancionable con multa", 0, "La ley lo califica como infracción <b>grave</b> a efectos disciplinarios."], ["una irregularidad no invalidante sin consecuencias", 0, "Sí tiene consecuencias."], ["causa de nulidad de los actos dictados", 0, "No es el efecto previsto."]]}, {"a": 10, "q": "El Portal de la Transparencia:", "o": [["depende del Ministerio de la Presidencia y se refiere al ámbito de la Administración General del Estado", 1, "Correcto: art. 10.1."], ["es obligatorio para todas las entidades locales", 0, "Las entidades locales pueden adoptar medidas de colaboración (art. 10.3)."], ["depende del Consejo de Transparencia y Buen Gobierno", 0, "El Consejo controla el cumplimiento; el Portal depende del Ministerio de la Presidencia."], ["sustituye a las obligaciones de publicación de cada sujeto", 0, "No las sustituye."]]}, {"a": 11, "q": "Los principios técnicos de la publicación son:", "o": [["accesibilidad, interoperabilidad y reutilización", 1, "Correcto: art. 11."], ["publicidad, transparencia y concurrencia", 0, "Son principios de la contratación y de las subvenciones."], ["eficacia, eficiencia y economía", 0, "Son principios de gestión económica."], ["legalidad, jerarquía y competencia", 0, "No son los del art. 11."]]}, {"a": 5, "q": "El acceso a la información sujeta a publicidad activa puede condicionarse al pago de una tasa.", "vf": true, "ok": false, "fb": "<b>Falso.</b> El art. 5.5 exige que la información sea comprensible, de acceso <b>fácil y gratuito</b> y accesible para personas con discapacidad."}, {"a": 2, "q": "Completa: «A los efectos de lo previsto en este título, se entiende por Administraciones Públicas los organismos y entidades incluidos en las letras ______ del apartado anterior».", "gap": "a) a d)", "fb": "Las letras <b>a) a d)</b> (art. 2.2). De ahí depende quién queda obligado por los arts. 6.2, 7 y 8.3."}, {"a": 3, "q": "A los partidos políticos, sindicatos y organizaciones empresariales se les aplica:", "o": [["el capítulo II del Título I, sobre publicidad activa", 1, "Correcto: art. 3, primer inciso."], ["toda la ley, incluido el buen gobierno", 0, "El Título II tiene su propio ámbito subjetivo (art. 25)."], ["solo el derecho de acceso", 0, "Precisamente el capítulo que se les aplica es el de publicidad activa."], ["ninguna obligación: son entidades privadas", 0, "Están expresamente incluidos."]]}];
const CASOS=[{"t": "Caso 1 · ¿Quién está obligado y a qué?", "e": "Determina la sujeción a la Ley 19/2013 de: <b>(1)</b> un ayuntamiento de 8.000 habitantes; <b>(2)</b> su empresa municipal de aguas, con capital 100 % público; <b>(3)</b> el colegio de arquitectos de la provincia; <b>(4)</b> una asociación cultural con 90.000 € de ingresos, de los que 45.000 € son subvención municipal; <b>(5)</b> la empresa concesionaria del servicio de limpieza viaria.", "s": "<p><b>(1) Ayuntamiento.</b> Sujeto por el art. 2.1.a) y, además, <b>«Administración Pública»</b> a efectos del art. 2.2: le alcanzan también los arts. 6.2, 7 y 8.3.</p><p><b>(2) Empresa municipal.</b> Sujeta por el art. 2.1.g) —participación superior al 50 %—, pero <b>no</b> es Administración Pública: no le aplican los planes del 6.2, la información jurídica del art. 7 ni la relación de inmuebles del 8.3.</p><p><b>(3) Colegio de arquitectos.</b> Sujeto por el art. 2.1.e), pero <b>solo en lo relativo a sus actividades sujetas a Derecho Administrativo</b>.</p><p><b>(4) Asociación cultural.</b> No llega a los 100.000 €, pero la subvención supone el <b>50 %</b> de sus ingresos y supera los 5.000 €: queda sujeta por el art. 3.b) al <b>capítulo de publicidad activa</b>, y publicará lo previsto en el art. 8.2.</p><p><b>(5) Concesionaria.</b> No es sujeto obligado a publicar, pero sí está obligada a <b>suministrar información</b> al ayuntamiento previo requerimiento (art. 4).</p><p><b>En Andalucía:</b> comprueba además el art. 3 de la <b>Ley 1/2014</b> (documento 9), cuyo ámbito subjetivo es más detallado.</p>"}, {"t": "Caso 2 · Auditar el portal de transparencia municipal", "e": "Revisas el portal de un ayuntamiento y encuentras: contratos publicados en PDF escaneado y sin número de licitadores; el presupuesto de 2023 como último dato; el organigrama con los cargos pero sin trayectoria profesional; las subvenciones publicadas con importes pero sin beneficiarios; y un formulario que exige registrarse para consultar. <b>Enumera los incumplimientos con su artículo.</b>", "s": "<p><b>1) PDF escaneado.</b> Vulnera el art. 5.4 (formatos preferiblemente reutilizables) y el art. 11.c) (principio de reutilización), además del art. 11.a) sobre información estructurada.</p><p><b>2) Falta el número de licitadores.</b> El art. 8.1.a) exige publicar objeto, duración, importes de licitación y adjudicación, procedimiento, instrumentos de publicidad, <b>número de licitadores</b> e identidad del adjudicatario.</p><p><b>3) Presupuesto de 2023.</b> Incumple el art. 5.1: la publicación debe ser <b>periódica y actualizada</b>; y el art. 8.1.d) exige información actualizada sobre el <b>estado de ejecución</b>.</p><p><b>4) Organigrama incompleto.</b> El art. 6.1 exige que identifique a los responsables y <b>su perfil y trayectoria profesional</b>.</p><p><b>5) Subvenciones sin beneficiarios.</b> El art. 8.1.c) exige importe, <b>objetivo o finalidad y beneficiarios</b>. Enlaza con los arts. 18 y 20 de la <b>Ley 38/2003</b> (documento 8) y la BDNS.</p><p><b>6) Registro previo.</b> Contradice el art. 5.5: acceso <b>fácil y gratuito</b>.</p><p><b>Consecuencia:</b> el incumplimiento <b>reiterado</b> tiene la consideración de <b>infracción grave</b> a efectos disciplinarios (art. 9.3), y en Andalucía puede activar el régimen sancionador de la Ley 1/2014.</p>"}, {"t": "Caso 3 · Publicar sin vulnerar la protección de datos", "e": "El ayuntamiento va a publicar: <b>(a)</b> la relación de beneficiarios de ayudas de emergencia social, con nombre, DNI y motivo de la ayuda; <b>(b)</b> las retribuciones del personal directivo; <b>(c)</b> el expediente de un contrato que incluye el informe médico de un trabajador. <b>¿Qué puede publicarse y cómo?</b>", "s": "<p><b>(a) Ayudas de emergencia social.</b> El motivo de la ayuda revela datos sobre la situación social y, en su caso, de salud, que son <b>especialmente protegidos</b>. El art. 5.3 exige <b>previa disociación</b>: puede publicarse la información agregada o disociada, nunca con nombre y DNI unidos al motivo. Conecta con el art. 15 (protección de datos) del bloque de acceso.</p><p><b>(b) Retribuciones del personal directivo.</b> El art. 8.1.f) obliga expresamente a publicar las retribuciones anuales de <b>altos cargos y máximos responsables</b>, así como las indemnizaciones por abandono del cargo. Aquí la ley ya ha hecho la ponderación: prima la transparencia.</p><p><b>(c) Informe médico.</b> Dato especialmente protegido: no puede publicarse. Procede publicar el resto del expediente con <b>acceso parcial</b>, aplicando la lógica del art. 16.</p><p><b>Regla general:</b> la publicidad activa no es un cheque en blanco. Los límites del art. 14 y, muy señaladamente, la protección de datos del art. 15 se aplican también a lo que se publica de oficio (art. 5.3).</p>"}];
const SEMAFORO=["Los tres objetos de la ley — art. 1", "Ámbito subjetivo: las nueve letras del art. 2.1", "Concepto restringido de Administración Pública — art. 2.2", "Otros sujetos obligados y sus umbrales — art. 3", "Obligación de suministrar información — art. 4", "Principios generales de la publicidad activa — art. 5", "Límites y disociación de datos protegidos — art. 5.3", "Información institucional y organizativa — art. 6", "Información de relevancia jurídica — art. 7", "Información económica: contratos y convenios — art. 8.1.a) y b)", "Información económica: subvenciones, presupuestos y cuentas — art. 8.1.c) a e)", "Retribuciones, compatibilidades y bienes — art. 8.1.f) a h) y 8.3", "Control y consecuencias del incumplimiento — art. 9", "Portal de la Transparencia — art. 10", "Principios técnicos: accesibilidad, interoperabilidad y reutilización — art. 11"];
const INTRO_HTML="<section class=\"card\" id=\"intro\"><h2>Tema 13 · Bloque 1 · Ámbito y publicidad activa</h2><p class=\"small\">El tema 13 abarca dos leyes completas: la estatal 19/2013 y la andaluza 1/2014. Este primer bloque cubre el Título Preliminar y los capítulos I y II del Título I de la ley estatal: qué persigue la ley, a quién obliga y qué hay que publicar sin que nadie lo pida.</p><div class=\"box ej\"><span class=\"lbl\">La idea que ordena el bloque</span>La transparencia tiene <b>dos motores</b>: la <b>publicidad activa</b> —publico porque la ley me obliga, sin que nadie pregunte— y el <b>derecho de acceso</b> —publico porque alguien lo pide—. Este bloque agota el primero; el segundo se estudia en el bloque 2.</div><div class=\"box warn\"><span class=\"lbl\">Fuentes utilizadas y vigencia</span><ul><li><b>Ley 19/2013, de 9 de diciembre</b>, de transparencia, acceso a la información pública y buen gobierno, texto consolidado con <b>última modificación de 9 de julio de 2022</b> (documento incorporado a la biblioteca).</li><li>Concordancias con la <b>Ley 1/2014 de Andalucía</b> (documento 9), la <b>Ley 9/2017</b> (documento 7), la <b>Ley 38/2003</b> (documento 8), el <b>TRLHL</b> (documento 5), la <b>Ley 39/2015</b> (documento 1) y el <b>RD 203/2021</b> (documento 4).</li><li><b>Aportación externa</b>: la <b>Ley 7/1985 (LBRL)</b>, a la que remite el art. 8.1.h) para las declaraciones de bienes de los representantes locales, y la <b>Ley 37/2007</b> de reutilización, citada por el art. 11.c). No están en la biblioteca: verifícalas en el BOE.</li><li><b>Cita desfasada:</b> el art. 2.1.i) remite al art. 5 de la <b>Ley 30/1992</b>; hoy los órganos de cooperación se regulan en los arts. 145 y siguientes de la <b>Ley 40/2015</b> (documento 2).</li></ul></div><svg viewBox=\"0 0 660 205\" role=\"img\" aria-label=\"Mapa conceptual del bloque 1 del tema 13\"><rect x=\"205\" y=\"8\" width=\"250\" height=\"36\" rx=\"9\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"330\" y=\"31\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"#fff\">TRANSPARENCIA DE LA ACTIVIDAD PÚBLICA</text><line x1=\"330\" y1=\"44\" x2=\"330\" y2=\"60\" stroke=\"var(--acc)\" stroke-width=\"2\"/><line x1=\"130\" y1=\"60\" x2=\"530\" y2=\"60\" stroke=\"var(--acc)\" stroke-width=\"2\"/><line x1=\"130\" y1=\"60\" x2=\"130\" y2=\"78\" stroke=\"var(--acc)\" stroke-width=\"2\"/><line x1=\"330\" y1=\"60\" x2=\"330\" y2=\"78\" stroke=\"var(--acc)\" stroke-width=\"2\"/><line x1=\"530\" y1=\"60\" x2=\"530\" y2=\"78\" stroke=\"var(--acc)\" stroke-width=\"2\"/><rect x=\"25\" y=\"78\" width=\"210\" height=\"112\" rx=\"9\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"130\" y=\"100\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"var(--acc)\">1 · A QUIÉN OBLIGA</text><text x=\"130\" y=\"124\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">art. 2 · nueve letras</text><text x=\"130\" y=\"146\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">art. 3 · partidos y subvencionados</text><text x=\"130\" y=\"168\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">art. 4 · deber de suministrar</text><rect x=\"245\" y=\"78\" width=\"170\" height=\"112\" rx=\"9\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"330\" y=\"100\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"var(--ej)\">2 · CÓMO SE PUBLICA</text><text x=\"330\" y=\"126\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">art. 5 · principios</text><text x=\"330\" y=\"150\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">art. 11 · técnica</text><text x=\"330\" y=\"176\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--ink2)\">clara, gratuita, reutilizable</text><rect x=\"425\" y=\"78\" width=\"210\" height=\"112\" rx=\"9\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"530\" y=\"100\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"var(--warn)\">3 · QUÉ SE PUBLICA</text><text x=\"530\" y=\"124\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">art. 6 · institucional</text><text x=\"530\" y=\"146\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">art. 7 · jurídica</text><text x=\"530\" y=\"168\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">art. 8 · económica</text></svg></section>";
const RESUMEN_HTML="<section class=\"card\" id=\"resumen\"><h2>Resumen ejecutivo</h2><p class=\"small\"><b>Norma:</b> Ley 19/2013, Título Preliminar y Título I, capítulos I y II (arts. 1 a 11).</p><table><tbody><tr><th style=\"width:60px\">1</th><td>Tres objetos: <b>transparencia</b> · <b>derecho de acceso</b> · <b>buen gobierno</b> y sus consecuencias.</td></tr><tr><th>2</th><td>Nueve letras de sujetos. Sociedades con más del <b>50 %</b>; corporaciones y órganos constitucionales <b>solo en su actividad administrativa</b>. «Administraciones Públicas» = letras <b>a) a d)</b>.</td></tr><tr><th>3</th><td>Partidos, sindicatos y patronales; entidades privadas con más de <b>100.000 €</b> o el <b>40 %</b> de ingresos públicos (mínimo <b>5.000 €</b>). Solo <b>publicidad activa</b>.</td></tr><tr><th>4</th><td>Quien presta servicios públicos o ejerce potestades debe <b>suministrar información</b>, previo requerimiento.</td></tr><tr><th>5</th><td>Publicación <b>periódica y actualizada</b>, clara, estructurada, <b>gratuita</b>, accesible y reutilizable. Datos especialmente protegidos: <b>previa disociación</b>. La ley es un <b>mínimo</b>.</td></tr><tr><th>6-7</th><td>Institucional: funciones, normativa, <b>organigrama con trayectorias</b>; planes y su evaluación (solo AAPP). Jurídica: instrucciones con efectos, anteproyectos, reglamentos y memorias.</td></tr><tr><th>8</th><td>Económica: <b>todos los contratos</b> · convenios y encomiendas · subvenciones · presupuestos y ejecución · cuentas y auditorías · <b>retribuciones</b> · compatibilidades · declaraciones de bienes · estadística. Y los <b>inmuebles</b> (solo AAPP).</td></tr><tr><th>9-11</th><td>Control del <b>Consejo</b>; incumplimiento reiterado = <b>infracción grave</b>. <b>Portal de la Transparencia</b> (Ministerio de la Presidencia). Principios técnicos: <b>accesibilidad, interoperabilidad y reutilización</b>.</td></tr></tbody></table><h2 style=\"margin-top:1.2rem\">Calendario de repaso espaciado</h2><table><thead><tr><th>Momento</th><th>Fecha</th><th>Qué hacer</th></tr></thead><tbody id=\"calbody\"></tbody></table></section>";

/* ---------- TEST ---------- */
html+='<section class="card noprint" id="test"><h2>Test de autoevaluación</h2>'

/* ═══ Mejoras de interacción · Bloque II ═══ */
(function(){
"use strict";
var K_THEME="oposi_bII_theme", K_FS="oposi_bII_fs", K_STREAK="oposi_bII_streak";
function load(k,f){try{var v=localStorage.getItem(k);return v?JSON.parse(v):f;}catch(e){return f;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
var root=document.documentElement;

/* Tema persistente (sobrescribe el toggle simple anterior) */
var saved=load(K_THEME,null);
if(saved){root.setAttribute("data-theme",saved);}
else if(window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches){root.setAttribute("data-theme","dark");}
var bt=document.getElementById("theme");
if(bt)bt.onclick=function(){
  var n=root.getAttribute("data-theme")==="dark"?"light":"dark";
  root.setAttribute("data-theme",n);save(K_THEME,n);
};

/* Tamaño de texto persistente */
var fs=load(K_FS,16);
function setFs(v){fs=Math.max(13,Math.min(22,v));root.style.setProperty("--fs",fs+"px");save(K_FS,fs);}
setFs(fs);
var bp=document.getElementById("fs+"),bm=document.getElementById("fs-");
if(bp)bp.onclick=function(){setFs(fs+1);};
if(bm)bm.onclick=function(){setFs(fs-1);};

(function(){
  var el=document.getElementById("streakN");if(!el)return;
  var hoy=new Date().toISOString().slice(0,10);
  var s=load(K_STREAK,{last:null,n:0});
  if(s.last!==hoy){
    var ayer=new Date(Date.now()-864e5).toISOString().slice(0,10);
    s.n=(s.last===ayer)?s.n+1:1;s.last=hoy;save(K_STREAK,s);
  }
  el.textContent=s.n;
})();

/* Reveal on scroll para las tarjetas */
function reveal(){
  var els=document.querySelectorAll("section.card:not(.rv)");
  if(!els.length)return;
  if(!("IntersectionObserver" in window)){return;}
  var io=new IntersectionObserver(function(es){
    es.forEach(function(en){if(en.isIntersecting){en.target.classList.add("in");io.unobserve(en.target);}});
  },{threshold:.06,rootMargin:"0px 0px -30px 0px"});
  Array.prototype.forEach.call(els,function(el){el.classList.add("rv");io.observe(el);});
}

/* Sección activa en el índice lateral */
function spy(){
  var links=document.querySelectorAll("nav.side a[href^='#']");
  if(!links.length||!("IntersectionObserver" in window))return;
  var map={};
  Array.prototype.forEach.call(links,function(a){
    var t=document.getElementById(a.getAttribute("href").slice(1));
    if(t)map[t.id]=a;
  });
  var io=new IntersectionObserver(function(es){
    es.forEach(function(en){
      if(en.isIntersecting){
        Array.prototype.forEach.call(links,function(a){a.classList.remove("on");});
        if(map[en.target.id])map[en.target.id].classList.add("on");
      }
    });
  },{rootMargin:"-80px 0px -70% 0px",threshold:0});
  Object.keys(map).forEach(function(id){io.observe(document.getElementById(id));});
}

/* Ripple en botones */
document.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b||b.classList.contains("navtoggle"))return;
  var r=b.getBoundingClientRect(),d=Math.max(r.width,r.height),s=document.createElement("span");
  s.className="ripple";s.style.width=s.style.height=d+"px";
  s.style.left=(e.clientX-r.left-d/2)+"px";s.style.top=(e.clientY-r.top-d/2)+"px";
  b.appendChild(s);setTimeout(function(){if(s.parentNode)s.parentNode.removeChild(s);},560);
});

/* El contenido se inyecta por JS: esperamos a que exista */
function init(){reveal();spy();}
if(document.getElementById("main")&&document.getElementById("main").children.length){init();}
else{setTimeout(init,60);}
addEventListener("load",function(){setTimeout(init,80);});
})();


</script>
<script>


/* ═══ Parser de respuestas: estructura semántica ═══ */
var FCFMT=(function(){
  var CITA=/\s*\(((?:arts?\.|DA\b|DT\b|disp\.)[^)]*)\)\s*\.?\s*$/i;
  var strip=function(h){return h.replace(/<[^>]+>/g,"");};

  function esc(s){return s;}

  function parse(raw){
    var out={verdict:null,cite:null,kind:"p",items:[],text:""};
    var body=String(raw).trim();

    /* 1 ── Cita legal al final */
    var m=body.match(CITA);
    if(m){out.cite=m[1].replace(/\s+/g," ").trim();body=body.slice(0,m.index).trim();}
    body=body.replace(/[.;,\s]+$/,"");

    /* 2 ── Veredicto Sí / No inicial */
    var v=strip(body).match(/^(Sí|Sí,|No|No,)[.:,]?\s/);
    if(v){
      out.verdict=/^Sí/.test(v[1])?"si":"no";
      body=body.replace(/^(<[^>]+>\s*)*(Sí|No)[.,:]?\s*/,"").trim();
      body=body.replace(/^en\s/,"En ");
    }

    /* 3 ── Enumeración con · */
    var parts=body.split(/\s+·\s+/);
    if(parts.length>=2){
      out.kind="list";
      var letras=parts.filter(function(p){return /^\s*<?[a-h]\)/.test(strip(p));}).length;
      out.marker = letras>=parts.length-1 ? "alpha" : "num";
      out.items=parts.map(function(p){
        return p.replace(/^\s*[a-h]\)\s*/,"").replace(/[.\s]+$/,"").trim();
      }).filter(Boolean);
      return out;
    }

    /* 4 ── Cláusulas contrapuestas con ; */
    var semi=body.split(/;\s+/);
    if(semi.length>=2&&semi.length<=3&&semi.every(function(s){return strip(s).length>14;})){
      out.kind="clauses";
      out.items=semi.map(function(s){return s.replace(/[.\s]+$/,"").trim();});
      return out;
    }

    /* 5 ── Párrafo */
    out.text=body;
    return out;
  }

  function render(raw){
    var d=parse(raw),h="";

    if(d.verdict){
      h+='<span class="fc-verdict '+d.verdict+'">'+(d.verdict==="si"?"✓ Sí":"✗ No")+'</span>';
    }

    if(d.kind==="list"){
      h+='<ol class="fc-list '+d.marker+'">';
      d.items.forEach(function(it){h+='<li>'+it+'</li>';});
      h+='</ol>';
    }else if(d.kind==="clauses"){
      h+='<div class="fc-clauses">';
      d.items.forEach(function(it){h+='<p>'+it+'</p>';});
      h+='</div>';
    }else if(d.text){
      h+='<p class="fc-p">'+d.text+'</p>';
    }

    if(d.cite){
      h+='<span class="fc-cite"><span class="s">§</span>'+d.cite+'</span>';
    }
    return {html:h,struct:(d.kind!=="p"||!!d.verdict||strip(raw).length>150)};
  }
  return {parse:parse,render:render};
})();

})();

/* ═══ Altura adaptativa + índice plegable ═══ */
(function(){

/* ── 1 · Índice lateral plegable ── */
function sidebar(){
  var lay=document.querySelector(".layout"),
      side=document.getElementById("side"),
      tools=document.querySelector(".tools");
  if(!lay||!side||!tools||document.getElementById("navhide"))return;

  var K="oposi_bII_nav";
  function get(){try{return localStorage.getItem(K)==="0";}catch(e){return false;}}
  function set(v){try{localStorage.setItem(K,v?"0":"1");}catch(e){}}

  var b=document.createElement("button");
  b.id="navhide";b.type="button";
  b.innerHTML='<span class="ic">☰</span>';
  b.setAttribute("aria-controls","side");
  tools.insertBefore(b,tools.firstChild);

  function apply(hidden,anim){
    if(!anim)lay.style.transition="none";
    lay.classList.toggle("nonav",hidden);
    side.setAttribute("aria-hidden",String(hidden));
    b.setAttribute("aria-pressed",String(hidden));
    b.title=hidden?"Mostrar índice (i)":"Ocultar índice (i)";
    b.setAttribute("aria-label",b.title);
    if(!anim)requestAnimationFrame(function(){lay.style.transition="";});
  }
  apply(get(),false);

  b.onclick=function(){
    var h=!lay.classList.contains("nonav");
    apply(h,true);set(h);
    window.dispatchEvent(new Event("resize"));
  };
  document.addEventListener("keydown",function(e){
    if(e.target.matches("input,textarea,select"))return;
    if(e.key==="i"||e.key==="I"){e.preventDefault();b.click();}
  });
}

/* ── 2 · La tarjeta se adapta a su contenido ── */
function autofit(){
  var stage=document.querySelector(".fc-stage");
  if(!stage||stage.dataset.fit)return;
  var deck=stage.querySelector(".fc-deck"),
      front=stage.querySelector(".fc-front"),
      back=stage.querySelector(".fc-back");
  if(!deck||!front||!back)return;
  stage.dataset.fit="1";

  var meas=document.createElement("div");
  meas.className="fc-measure";meas.setAttribute("aria-hidden","true");
  meas.innerHTML='<div class="fc-face fc-front"><div class="fc-body"><div class="fc-txt"></div></div></div>';
  stage.appendChild(meas);
  var mFace=meas.querySelector(".fc-face"), mTxt=meas.querySelector(".fc-txt");

  function measure(cls,html){
    mFace.className="fc-face "+cls;
    mTxt.innerHTML=html;
    return mFace.offsetHeight;
  }

  function fit(){
    if(deck.classList.contains("empty")){deck.style.height="230px";return;}
    var fT=front.querySelector(".fc-txt"), bT=back.querySelector(".fc-txt");
    if(!fT||!bT)return;
    var h=Math.max(
      measure("fc-front"+(front.classList.contains("struct")?" struct":""),fT.innerHTML),
      measure("fc-back" +(back .classList.contains("struct")?" struct":""),bT.innerHTML),
      230
    );
    deck.style.height=Math.ceil(h+8)+"px";
  }

  /* recalcular cuando cambia la tarjeta, el tamaño de letra o la ventana */
  new MutationObserver(fit).observe(back,{childList:true,subtree:true,attributes:true,attributeFilter:["class"]});
  var t;
  addEventListener("resize",function(){clearTimeout(t);t=setTimeout(fit,120);},{passive:true});
  ["fs+","fs-"].forEach(function(id){
    var el=document.getElementById(id);
    if(el)el.addEventListener("click",function(){setTimeout(fit,60);});
  });
  fit();setTimeout(fit,250);
}

function go(){sidebar();autofit();}
if(document.readyState!=="loading")go();else document.addEventListener("DOMContentLoaded",go);
addEventListener("load",function(){setTimeout(go,120);});
var n=0,iv=setInterval(function(){go();if(++n>25)clearInterval(iv);},150);
})();


</script>

/* ═══════════════════════════════════════════════════════════════
   TTS · Lectura en voz alta del texto legal
   ═══════════════════════════════════════════════════════════════ */
(function(){
"use strict";
if(!("speechSynthesis" in window))return;

var K="oposi_bII_tts";
function load(){try{return JSON.parse(localStorage.getItem(K))||{};}catch(e){return {};}}
function save(o){try{localStorage.setItem(K,JSON.stringify(o));}catch(e){}}
var cfg=load();
if(cfg.rate==null)cfg.rate=1;
if(cfg.gen==null)cfg.gen="f";

var synth=window.speechSynthesis, voces=[], actual=null, bloques=[];

/* ─────────── 1 · Selección de voz ─────────── */
/* iOS y iPadOS enumeran voces de red (Google, «Online») que en realidad no
   sintetizan: se seleccionan pero no suena nada. Ahí solo valen las locales. */
var IOS=(function(){
  var ua=navigator.userAgent||"";
  if(/iPad|iPhone|iPod/i.test(ua))return true;
  return navigator.platform==="MacIntel"&&(navigator.maxTouchPoints||0)>1;
})();
var descartadas=0;

function esEspanol(v){return /^es\b|^es[-_]/i.test(v.lang||"")||/spanish|español/i.test(v.name||"");}
function esRemota(v){return v.localService===false||/google|online/i.test(v.name||"");}
function reproducible(v){return !IOS||!esRemota(v);}

function calidad(v){
  var n=(v.name||"")+" "+(v.voiceURI||""), p=0;
  if(/natural|neural/i.test(n))p+=100;
  if(/premium|enhanced|eloquence/i.test(n))p+=35;
  if(/^es-ES/i.test(v.lang))p+=12;              /* castellano de España primero */
  if(/microsoft/i.test(n))p+=8;
  if(IOS){
    /* en el iPad y el móvil de Apple mandan las locales */
    if(esRemota(v))p-=500;
    if(v.localService!==false)p+=40;
  }else{
    if(/online/i.test(n))p+=40;
    if(/google/i.test(n))p+=30;
    if(v.localService===false)p+=15;
  }
  return p;
}
var MASC=/(pablo|álvaro|alvaro|jorge|diego|juan|raul|raúl|carlos|miguel|lorenzo|gonzalo|dalton|liam|andr[eé]s|luciano|male|hombre|masculin)/i;
var FEM =/(helena|elvira|laura|mónica|monica|paulina|sabina|esperanza|marisol|ximena|dalia|salome|camila|catalina|isidora|female|mujer|femenin)/i;
function genero(v){
  var n=v.name||"";
  if(MASC.test(n))return "m";
  if(FEM.test(n))return "f";
  return "?";
}
function cargarVoces(){
  var all=synth.getVoices()||[];
  var es=all.filter(esEspanol);
  descartadas=0;
  var utiles=[];
  es.forEach(function(v){ if(reproducible(v))utiles.push(v); else descartadas++; });
  voces=utiles.sort(function(a,b){return calidad(b)-calidad(a);});
  if(!voces.length)voces=all.filter(reproducible).slice(0,12);
  /* si la voz guardada ya no sirve en este aparato, la olvidamos */
  if(cfg.voz){
    var sigue=false;
    for(var i=0;i<voces.length;i++)if(voces[i].voiceURI===cfg.voz)sigue=true;
    if(!sigue&&voces.length){cfg.voz=null;save(cfg);}
  }
  pintarSelector();
}
function elegir(){
  if(cfg.voz){
    for(var i=0;i<voces.length;i++)
      if(voces[i].voiceURI===cfg.voz&&reproducible(voces[i]))return voces[i];
  }
  var g=cfg.gen;
  for(var j=0;j<voces.length;j++)if(genero(voces[j])===g&&reproducible(voces[j]))return voces[j];
  for(var k=0;k<voces.length;k++)if(reproducible(voces[k]))return voces[k];
  return null;
}
/* Safari exige que la primera locución nazca de un gesto: la preparamos */
var motorListo=false;
function despertarMotor(){
  if(motorListo)return;

  try{var u=new SpeechSynthesisUtterance(" ");u.volume=0;u.rate=1;synth.speak(u);}catch(e){}

document.addEventListener("pointerdown",despertarMotor);

/* aviso discreto cuando cambiamos de voz por no ser reproducible */
function avisarVoz(v){

    a.classList.add("show");

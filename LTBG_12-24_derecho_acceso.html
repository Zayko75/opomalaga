<text x="559" y="77" text-anchor="middle" font-size="10" fill="currentColor">quede sin sentido</text>
</svg>`},
{n:17,t:"Solicitud de acceso a la información",ubic:"Título I ▸ Capítulo III ▸ Sección 2.ª (Ejercicio del derecho de acceso a la información pública)",idea:"Basta identificarse, decir qué se pide y dar una dirección; no hay que motivar.",literal:`<p>1. El procedimiento para el ejercicio del derecho de acceso se iniciará con la presentación de la correspondiente solicitud, que deberá dirigirse al titular del órgano administrativo o entidad que posea la información. Cuando se trate de información en posesión de personas físicas o jurídicas que presten servicios públicos o ejerzan potestades administrativas, la solicitud se dirigirá a la Administración, organismo o entidad de las previstas en el artículo 2.1 a las que se encuentren vinculadas.</p><p>2. La solicitud podrá presentarse por cualquier medio que permita tener constancia de:</p><p>a) La identidad del solicitante.</p><p>b) La información que se solicita.</p><p>c) Una dirección de contacto, preferentemente electrónica, a efectos de comunicaciones.</p><p>d) En su caso, la modalidad que se prefiera para acceder a la información solicitada.</p><p>3. El solicitante no está obligado a motivar su solicitud de acceso a la información. Sin embargo, podrá exponer los motivos por los que solicita la información y que podrán ser tenidos en cuenta cuando se dicte la resolución. No obstante, la ausencia de motivación no será por si sola causa de rechazo de la solicitud.</p><p>4. Los solicitantes de información podrán dirigirse a las Administraciones Públicas en cualquiera de las lenguas cooficiales del Estado en el territorio en el que radique la Administración en cuestión.</p>`,dis:`<ul>
<li><b>17.1 — a quién:</b> la solicitud se dirige al <b>titular del órgano o entidad que posea la información</b>. Si la información está en poder de personas que presten servicios públicos o ejerzan potestades, se dirige a la <b>Administración a la que estén vinculadas</b>.</li>
<li><b>17.2 — contenido mínimo:</b> puede presentarse <b>por cualquier medio</b> que permita tener constancia de: a) <b>identidad</b> del solicitante · b) <b>información</b> que se solicita · c) <b>dirección de contacto</b>, preferentemente electrónica · d) en su caso, la <b>modalidad</b> preferida de acceso.</li>
<li><b>17.3 — sin motivación:</b> el solicitante <b>no está obligado a motivar</b> su solicitud. Puede exponer los motivos, que podrán tenerse en cuenta, pero <b>la ausencia de motivación no será por sí sola causa de rechazo</b>.</li>
<li><b>17.4 — lenguas:</b> puede dirigirse en cualquiera de las <b>lenguas cooficiales</b> del territorio de la Administración correspondiente.</li>
</ul>`,llano:`<p>Pedir información es sencillo: dices quién eres, qué quieres y dónde contestarte. No tienes que explicar para qué la quieres, y si no lo explicas no pueden rechazarte por eso. Si das motivos, pueden ayudarte, pero no son obligatorios.</p>`,porque:`<p>La <b>no exigencia de motivación</b> es la piedra angular del modelo: si hubiera que justificar el interés, el funcionario acabaría valorando si el ciudadano «merece» la información, que es justo lo que la ley quiere evitar. La posibilidad de exponer motivos se mantiene porque puede jugar a favor del solicitante en la ponderación del art. 15.3.b).</p>`,ej:`<ul>
<li><b>Cotidiano:</b> pedir el extracto de una cuenta comunitaria sin tener que explicar qué sospechas.</li>
<li><b>Real:</b> un vecino solicita por la sede electrónica el listado de contratos menores del último trimestre, indicando su nombre, su correo y que prefiere recibirlo en hoja de cálculo.</li>
<li><b>Caso límite:</b> un investigador que sí motiva su solicitud por fines científicos mejora su posición en la ponderación de datos personales (art. 15.3.b).</li>
</ul>`,noej:`<ul>
<li><b>No puede</b> rechazarse una solicitud por no estar motivada.</li>
<li><b>No se exige</b> un modelo oficial: vale <b>cualquier medio</b> que deje constancia de los cuatro extremos.</li>
</ul>`,conex:`<ul>
<li><b>Art. 19 LTBG:</b> tramitación, incluida la subsanación si la solicitud no identifica la información.</li>
<li><b>Art. 15.3.b) LTBG:</b> la motivación puede pesar en la ponderación.</li>
<li><b>Arts. 66 y 68 de la Ley 39/2015</b> (documento 1): contenido de las solicitudes y subsanación.</li>
<li><b>Art. 28 de la Ley 1/2014 de Andalucía</b> (documento 9): procedimiento de acceso autonómico.</li>
</ul>`,trampas:`<ul>
<li>Cuatro extremos, y el cuarto —modalidad de acceso— es <b>potestativo</b> ("en su caso").</li>
<li>La <b>ausencia de motivación</b> no es causa de rechazo.</li>
<li>La solicitud se dirige al <b>titular del órgano que posea la información</b>.</li>
</ul>`,ancla:`<p><b>"Quién eres, qué quieres, dónde te contesto."</b> Y el porqué, <b>solo si te apetece</b>.</p>`,vis:`<svg viewBox="0 0 640 140" role="img" aria-label="Contenido de la solicitud de acceso">
<g font-size="10" text-anchor="middle" fill="currentColor">
<rect x="15" y="30" width="145" height="56" rx="8" fill="var(--acc-soft)" stroke="var(--acc)"/><text x="87" y="53" font-size="11" font-weight="700" fill="var(--acc)">a) Identidad</text><text x="87" y="72">del solicitante</text>
<rect x="172" y="30" width="145" height="56" rx="8" fill="var(--acc-soft)" stroke="var(--acc)"/><text x="244" y="53" font-size="11" font-weight="700" fill="var(--acc)">b) Información</text><text x="244" y="72">que se solicita</text>
<rect x="329" y="30" width="145" height="56" rx="8" fill="var(--acc-soft)" stroke="var(--acc)"/><text x="401" y="53" font-size="11" font-weight="700" fill="var(--acc)">c) Contacto</text><text x="401" y="72">preferentemente electrónico</text>
<rect x="486" y="30" width="139" height="56" rx="8" fill="var(--panel)" stroke="var(--line)" stroke-dasharray="5 4"/><text x="555" y="53" font-size="11" font-weight="700" fill="var(--ink2)">d) Modalidad</text><text x="555" y="72">en su caso</text>
</g>
<rect x="120" y="100" width="400" height="30" rx="8" fill="var(--ej-bg)" stroke="var(--ej)"/>
<text x="320" y="120" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ej)">No hay obligación de motivar la solicitud (17.3)</text>
</svg>`},
{n:18,t:"Causas de inadmisión",ubic:"Título I ▸ Capítulo III ▸ Sección 2.ª (Ejercicio del derecho de acceso a la información pública)",idea:"Cinco causas de inadmisión, siempre por resolución motivada.",literal:`<p>1. Se inadmitirán a trámite, mediante resolución motivada, las solicitudes:</p><p>a) Que se refieran a información que esté en curso de elaboración o de publicación general.</p><p>b) Referidas a información que tenga carácter auxiliar o de apoyo como la contenida en notas, borradores, opiniones, resúmenes, comunicaciones e informes internos o entre órganos o entidades administrativas.</p><p>c) Relativas a información para cuya divulgación sea necesaria una acción previa de reelaboración.</p><p>d) Dirigidas a un órgano en cuyo poder no obre la información cuando se desconozca el competente.</p><p>e) Que sean manifiestamente repetitivas o tengan un carácter abusivo no justificado con la finalidad de transparencia de esta Ley.</p><p>2. En el caso en que se inadmita la solicitud por concurrir la causa prevista en la letra d) del apartado anterior, el órgano que acuerde la inadmisión deberá indicar en la resolución el órgano que, a su juicio, es competente para conocer de la solicitud.</p>`,dis:`<table><thead><tr><th>Letra</th><th>Causa de <span class="t" data-k="inadmision">inadmisión</span> (art. 18.1)</th></tr></thead><tbody>
<tr><td><b>a)</b></td><td>Información <b>en curso de elaboración o de publicación general</b></td></tr>
<tr><td><b>b)</b></td><td>Información de <b>carácter auxiliar o de apoyo</b>: notas, borradores, opiniones, resúmenes, comunicaciones e informes internos o entre órganos</td></tr>
<tr><td><b>c)</b></td><td>Información para cuya divulgación sea necesaria una acción previa de <b><span class="t" data-k="reelaboracion">reelaboración</span></b></td></tr>
<tr><td><b>d)</b></td><td>Solicitudes dirigidas a un órgano <b>en cuyo poder no obre la información</b> cuando se <b>desconozca el competente</b></td></tr>
<tr><td><b>e)</b></td><td>Solicitudes <b>manifiestamente repetitivas</b> o de <b>carácter abusivo</b> no justificado con la finalidad de transparencia de la ley</td></tr>
</tbody></table>
<p><b>18.2:</b> si se inadmite por la letra d), la resolución <b>deberá indicar el órgano que, a su juicio, es competente</b>.</p>`,llano:`<p>Hay cinco motivos para no entrar siquiera en el fondo: que la información se esté haciendo, que sea un papel interno de trabajo, que haya que fabricarla de nuevo, que no se sepa quién la tiene o que la petición sea repetitiva o abusiva. En todos los casos hay que resolver y motivar, y si es porque no se sabe quién la tiene, además hay que orientar al ciudadano.</p>`,porque:`<p>Las causas de inadmisión evitan que el derecho se convierta en una carga desproporcionada o en un instrumento de acoso administrativo. Ahora bien, son de <b>interpretación estricta</b>: la letra b) no ampara cualquier documento interno —solo el verdaderamente auxiliar— y la letra c) no cubre la simple extracción de datos ya existentes, que no es reelaboración.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> no puedes pedir el acta de una reunión que aún se está redactando.</li>
<li><b>Real:</b> se inadmite la solicitud de un borrador de informe aún no aprobado (letra a) o de las notas manuscritas de trabajo de un técnico (letra b).</li>
<li><b>Caso límite:</b> pedir un listado que se obtiene aplicando un filtro a una base de datos existente <b>no</b> es reelaboración: la inadmisión por la letra c) sería improcedente.</li>
</ul>`,noej:`<ul>
<li><b>No es</b> causa de inadmisión que la información sea voluminosa, si no exige reelaborarla.</li>
<li><b>No cabe</b> inadmitir sin resolución <b>motivada</b>.</li>
<li><b>No basta</b> con inadmitir por la letra d): hay que <b>indicar el órgano competente</b>.</li>
</ul>`,conex:`<ul>
<li><b>Art. 13 LTBG:</b> concepto de información pública, que delimita la letra c).</li>
<li><b>Art. 19.1 LTBG:</b> remisión al órgano competente cuando sí se conoce.</li>
<li><b>Art. 30 de la Ley 1/2014 de Andalucía</b> (documento 9): reglas especiales sobre las causas de inadmisión.</li>
</ul>`,trampas:`<ul>
<li>Son <b>cinco</b> causas y todas exigen <b>resolución motivada</b>.</li>
<li>La letra d) opera solo cuando se <b>desconoce</b> el órgano competente; si se conoce, procede <b>remitir</b> (art. 19.1).</li>
<li>La letra e) exige que sean <b>manifiestamente</b> repetitivas o abusivas.</li>
</ul>`,ancla:`<p><b>"En curso, auxiliar, reelaborar, no sé quién y abusiva."</b> Cinco puertas de salida, todas motivadas.</p>`,vis:`<svg viewBox="0 0 640 150" role="img" aria-label="Causas de inadmisión de la solicitud">
<rect x="185" y="10" width="270" height="30" rx="8" fill="var(--exc-bg)" stroke="var(--exc)"/>
<text x="320" y="30" text-anchor="middle" font-size="12" font-weight="700" fill="var(--exc)">INADMISIÓN · resolución motivada</text>
<g font-size="10" text-anchor="middle" fill="currentColor">
<rect x="12" y="54" width="120" height="52" rx="8" fill="var(--panel)" stroke="var(--line)"/><text x="72" y="76" font-weight="700">a) En curso</text><text x="72" y="94">de elaboración</text>
<rect x="140" y="54" width="120" height="52" rx="8" fill="var(--panel)" stroke="var(--line)"/><text x="200" y="76" font-weight="700">b) Auxiliar</text><text x="200" y="94">notas y borradores</text>
<rect x="268" y="54" width="120" height="52" rx="8" fill="var(--panel)" stroke="var(--line)"/><text x="328" y="76" font-weight="700">c) Reelaboración</text><text x="328" y="94">previa necesaria</text>
<rect x="396" y="54" width="120" height="52" rx="8" fill="var(--panel)" stroke="var(--line)"/><text x="456" y="76" font-weight="700">d) No la tiene</text><text x="456" y="94">y se ignora quién</text>
<rect x="524" y="54" width="104" height="52" rx="8" fill="var(--panel)" stroke="var(--line)"/><text x="576" y="76" font-weight="700">e) Abusiva</text><text x="576" y="94">o repetitiva</text>
</g>
<text x="320" y="132" text-anchor="middle" font-size="10" fill="var(--warn)">Si se inadmite por la letra d), hay que indicar el órgano competente (18.2)</text>
</svg>`},
{n:19,t:"Tramitación",ubic:"Título I ▸ Capítulo III ▸ Sección 2.ª (Ejercicio del derecho de acceso a la información pública)",idea:"Remitir, concretar en diez días y dar quince a los terceros afectados.",literal:`<p>1. Si la solicitud se refiere a información que no obre en poder del sujeto al que se dirige, éste la remitirá al competente, si lo conociera, e informará de esta circunstancia al solicitante.</p><p>2. Cuando la solicitud no identifique de forma suficiente la información, se pedirá al solicitante que la concrete en un plazo de diez días, con indicación de que, en caso de no hacerlo, se le tendrá por desistido, así como de la suspensión del plazo para dictar resolución.</p><p>3. Si la información solicitada pudiera afectar a derechos o intereses de terceros, debidamente identificados, se les concederá un plazo de quince días para que puedan realizar las alegaciones que estimen oportunas. El solicitante deberá ser informado de esta circunstancia, así como de la suspensión del plazo para dictar resolución hasta que se hayan recibido las alegaciones o haya transcurrido el plazo para su presentación.</p><p>4. Cuando la información objeto de la solicitud, aun obrando en poder del sujeto al que se dirige, haya sido elaborada o generada en su integridad o parte principal por otro, se le remitirá la solicitud a éste para que decida sobre el acceso.</p>`,dis:`<ul>
<li><b>19.1 — remisión:</b> si la información no obra en poder del sujeto al que se dirige, este la <b>remitirá al competente</b>, si lo conociera, e <b>informará al solicitante</b>.</li>
<li><b>19.2 — concreción:</b> si la solicitud <b>no identifica suficientemente</b> la información, se pedirá al solicitante que la concrete en <b>diez días</b>, advirtiéndole de que en otro caso se le tendrá por <b>desistido</b> y de la <b>suspensión del plazo</b> para resolver.</li>
<li><b>19.3 — terceros:</b> si la información pudiera afectar a derechos o intereses de <b>terceros debidamente identificados</b>, se les concede un plazo de <b>quince días</b> para alegaciones, informando al solicitante y de la <b>suspensión del plazo</b> para resolver.</li>
<li><b>19.4 — información ajena:</b> si la información, aun obrando en su poder, fue <b>elaborada o generada en su integridad o parte principal por otro</b>, se le remitirá la solicitud a este para que <b>decida sobre el acceso</b>.</li>
</ul>`,llano:`<p>Tres reglas prácticas: si no tengo la información pero sé quién la tiene, se la paso y te aviso; si no entiendo qué me pides, te doy diez días para concretar; y si lo que pides afecta a otra persona, le doy quince días para que opine. En los dos últimos casos, el reloj del plazo se para.</p>`,porque:`<p>El artículo evita dos disfunciones: la <b>ventanilla equivocada</b>, resolviendo por remisión en lugar de por inadmisión; y la <b>resolución a ciegas</b> sobre información que afecta a terceros. La suspensión del plazo es la contrapartida lógica: no puede computarse contra la Administración el tiempo que consume un trámite que depende de otros.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> te derivan al departamento correcto en vez de decirte que no es su asunto.</li>
<li><b>Real:</b> se pide el expediente de una licencia que afecta a un vecino colindante: se le da <b>audiencia por quince días</b> antes de resolver, y el plazo del mes queda suspendido.</li>
<li><b>Caso límite:</b> si el solicitante no concreta en <b>diez días</b> una petición ambigua, se le tiene por desistido, previa resolución.</li>
</ul>`,noej:`<ul>
<li><b>No procede</b> inadmitir por la letra d) del art. 18 si se conoce el órgano competente: hay que <b>remitir</b>.</li>
<li><b>No se suspende</b> el plazo automáticamente: la suspensión se vincula a los trámites de los apartados 2 y 3.</li>
</ul>`,conex:`<ul>
<li><b>Art. 18.1.d) LTBG:</b> inadmisión cuando se desconoce el órgano competente.</li>
<li><b>Art. 20.1 LTBG:</b> plazo de un mes, que estos trámites suspenden.</li>
<li><b>Art. 22.2 LTBG:</b> efectos de la oposición del tercero sobre la formalización del acceso.</li>
<li><b>Arts. 22 y 68 de la Ley 39/2015</b> (documento 1): suspensión del plazo y subsanación.</li>
</ul>`,trampas:`<ul>
<li><b>Diez días</b> para concretar; <b>quince días</b> para alegaciones de terceros. No confundirlos.</li>
<li>Ambos trámites <b>suspenden</b> el plazo para resolver.</li>
<li>El apartado 4 traslada la <b>decisión sobre el acceso</b> a quien elaboró la información.</li>
</ul>`,ancla:`<p><b>"10 para ti, 15 para el tercero."</b> Y en ambos casos, <b>el reloj se para</b>.</p>`,vis:`<svg viewBox="0 0 640 145" role="img" aria-label="Trámites del procedimiento de acceso">
<g font-size="10" text-anchor="middle" fill="currentColor">
<rect x="20" y="30" width="185" height="62" rx="8" fill="var(--acc-soft)" stroke="var(--acc)"/><text x="112" y="53" font-size="11" font-weight="700" fill="var(--acc)">No la tengo</text><text x="112" y="72">remito al competente</text><text x="112" y="87">e informo al solicitante</text>
<rect x="227" y="30" width="185" height="62" rx="8" fill="var(--warn-bg)" stroke="var(--warn)"/><text x="320" y="53" font-size="11" font-weight="700" fill="var(--warn)">No se entiende</text><text x="320" y="72">10 días para concretar</text><text x="320" y="87">o desistimiento</text>
<rect x="434" y="30" width="186" height="62" rx="8" fill="var(--ej-bg)" stroke="var(--ej)"/><text x="527" y="53" font-size="11" font-weight="700" fill="var(--ej)">Afecta a terceros</text><text x="527" y="72">15 días de alegaciones</text><text x="527" y="87">identificados</text>
</g>
<text x="320" y="122" text-anchor="middle" font-size="10" fill="var(--exc)">Los trámites de los apartados 2 y 3 SUSPENDEN el plazo para resolver</text>
</svg>`},
{n:20,t:"Resolución",ubic:"Título I ▸ Capítulo III ▸ Sección 2.ª (Ejercicio del derecho de acceso a la información pública)",idea:"Un mes para resolver, ampliable a otro; el silencio es negativo.",literal:`<p>1. La resolución en la que se conceda o deniegue el acceso deberá notificarse al solicitante y a los terceros afectados que así lo hayan solicitado en el plazo máximo de un mes desde la recepción de la solicitud por el órgano competente para resolver.</p><p>Este plazo podrá ampliarse por otro mes en el caso de que el volumen o la complejidad de la información que se solicita así lo hagan necesario y previa notificación al solicitante.</p><p>2. Serán motivadas las resoluciones que denieguen el acceso, las que concedan el acceso parcial o a través de una modalidad distinta a la solicitada y las que permitan el acceso cuando haya habido oposición de un tercero. En este último supuesto, se indicará expresamente al interesado que el acceso sólo tendrá lugar cuando haya transcurrido el plazo del artículo 22.2.</p><p>3. Cuando la mera indicación de la existencia o no de la información supusiera la vulneración de alguno de los límites al acceso se indicará esta circunstancia al desestimarse la solicitud.</p><p>4. Transcurrido el plazo máximo para resolver sin que se haya dictado y notificado resolución expresa se entenderá que la solicitud ha sido desestimada.</p><p>5. Las resoluciones dictadas en materia de acceso a la información pública son recurribles directamente ante la Jurisdicción Contencioso-administrativa, sin perjuicio de la posibilidad de interposición de la reclamación potestativa prevista en el artículo 24.</p><p>6. El incumplimiento reiterado de la obligación de resolver en plazo tendrá la consideración de infracción grave a los efectos de la aplicación a sus responsables del régimen disciplinario previsto en la correspondiente normativa reguladora.</p>`,dis:`<table><thead><tr><th>Apdo.</th><th>Contenido</th></tr></thead><tbody>
<tr><td><b>20.1</b></td><td>Notificación al solicitante y a los terceros que lo hayan solicitado en el plazo máximo de <b>un mes</b> desde la recepción por el órgano competente. <b>Ampliable por otro mes</b> si el volumen o la complejidad lo hacen necesario, <b>previa notificación</b> al solicitante</td></tr>
<tr><td><b>20.2</b></td><td>Serán <b>motivadas</b>: las que <b>denieguen</b>, las que concedan <b>acceso parcial</b> o por <b>modalidad distinta</b> a la solicitada, y las que permitan el acceso <b>habiendo oposición de un tercero</b></td></tr>
<tr><td><b>20.3</b></td><td>Si la mera indicación de la existencia o no de la información vulnerara un límite, <b>se indicará esta circunstancia</b> al desestimar</td></tr>
<tr><td><b>20.4</b></td><td>Transcurrido el plazo sin resolución expresa, la solicitud se entiende <b>desestimada</b></td></tr>
<tr><td><b>20.5</b></td><td>Las resoluciones son recurribles <b>directamente ante la jurisdicción contencioso-administrativa</b>, sin perjuicio de la <b>reclamación potestativa</b> del art. 24</td></tr>
<tr><td><b>20.6</b></td><td>El <b>incumplimiento reiterado</b> de la obligación de resolver en plazo es <b>infracción grave</b> a efectos disciplinarios</td></tr>
</tbody></table>`,llano:`<p>La Administración tiene un mes para contestar, ampliable a dos si el asunto es voluminoso o complejo y te avisa. Si no contesta, se entiende que te dice que no. Y hay que motivar siempre que se deniegue, se dé solo una parte, se cambie el formato o se entregue pese a la oposición de un tercero.</p>`,porque:`<p>El <b>plazo breve</b> es esencial: una información que llega tarde suele ser inútil. El <b>silencio negativo</b> se justifica porque conceder por silencio podría vulnerar límites o derechos de terceros sin control alguno; a cambio, la ley abre de inmediato la vía de la reclamación. Y el art. 20.6 evita que el silencio se convierta en la forma cómoda de no contestar: incumplir reiteradamente es <b>infracción grave</b>.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> un plazo de respuesta con prórroga avisada, no con retraso silencioso.</li>
<li><b>Real:</b> solicitud presentada el 3 de marzo: la resolución debe notificarse antes del 3 de abril, salvo ampliación notificada por otro mes. Si no hay respuesta, el 4 de abril puede reclamarse ante el Consejo.</li>
<li><b>Caso límite:</b> si confirmar que existe un informe policial revelaría por sí solo una investigación en curso, se desestima indicando esa circunstancia (art. 20.3).</li>
</ul>`,noej:`<ul>
<li><b>No hay</b> silencio positivo en materia de acceso.</li>
<li><b>No es</b> obligatoria la reclamación del art. 24: es <b>potestativa</b> y sustitutiva de los recursos administrativos.</li>
<li><b>No basta</b> con conceder el acceso: si es parcial o por otra modalidad, hay que <b>motivarlo</b>.</li>
</ul>`,conex:`<ul>
<li><b>Art. 19 LTBG:</b> trámites que suspenden el plazo.</li>
<li><b>Arts. 23 y 24 LTBG:</b> régimen de impugnaciones y reclamación ante el Consejo.</li>
<li><b>Art. 22.2 LTBG:</b> demora del acceso cuando hubo oposición de un tercero.</li>
<li><b>Art. 32 de la Ley 1/2014 de Andalucía</b> (documento 9): plazo de resolución autonómico.</li>
</ul>`,trampas:`<ul>
<li><b>Un mes</b> desde la recepción por el órgano <b>competente para resolver</b>, ampliable por otro mes <b>previa notificación</b>.</li>
<li>Silencio <b>desestimatorio</b>.</li>
<li>Cuatro supuestos de <b>motivación obligatoria</b> en el apartado 2.</li>
<li>Las resoluciones son recurribles <b>directamente</b> ante el contencioso, sin perjuicio de la reclamación potestativa.</li>
</ul>`,ancla:`<p><b>"Un mes, más otro avisando; si callan, es no."</b><br>Motivación obligatoria: <b>denegar, parcial, otra modalidad y contra la oposición del tercero</b>.</p>`,vis:`<svg viewBox="0 0 640 160" role="img" aria-label="Plazo de resolución y silencio en el derecho de acceso">
<line x1="60" y1="65" x2="580" y2="65" stroke="var(--line)" stroke-width="3"/>
<circle cx="90" cy="65" r="8" fill="var(--acc)"/><text x="90" y="44" text-anchor="middle" font-size="11" font-weight="700" fill="var(--acc)">Solicitud</text>
<circle cx="330" cy="65" r="8" fill="var(--ej)"/><text x="330" y="44" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ej)">1 MES</text>
<text x="330" y="90" text-anchor="middle" font-size="10" fill="currentColor">resolución y notificación</text>
<circle cx="520" cy="65" r="8" fill="var(--warn)"/><text x="520" y="44" text-anchor="middle" font-size="11" font-weight="700" fill="var(--warn)">+1 MES</text>
<text x="520" y="90" text-anchor="middle" font-size="10" fill="currentColor">ampliación por volumen o complejidad</text>
<rect x="120" y="112" width="400" height="34" rx="8" fill="var(--exc-bg)" stroke="var(--exc)"/>
<text x="320" y="133" text-anchor="middle" font-size="11" font-weight="700" fill="var(--exc)">Sin resolución expresa: solicitud DESESTIMADA (20.4)</text>
</svg>`},
{n:21,t:"Unidades de información",ubic:"Título I ▸ Capítulo III ▸ Sección 2.ª (Ejercicio del derecho de acceso a la información pública)",idea:"Unidades especializadas que reciben, tramitan, registran y mantienen el mapa de contenidos.",literal:`<p>1. Las Administraciones Públicas incluidas en el ámbito de aplicación de este título establecerán sistemas para integrar la gestión de solicitudes de información de los ciudadanos en el funcionamiento de su organización interna.</p><p>2. En el ámbito de la Administración General del Estado, existirán unidades especializadas que tendrán las siguientes funciones:</p><p>a) Recabar y difundir la información a la que se refiere el capítulo II del título I de esta Ley.</p><p>b) Recibir y dar tramitación a las solicitudes de acceso a la información.</p><p>c) Realizar los trámites internos necesarios para dar acceso a la información solicitada.</p><p>d) Realizar el seguimiento y control de la correcta tramitación de las solicitudes de acceso a la información.</p><p>e) Llevar un registro de las solicitudes de acceso a la información.</p><p>f) Asegurar la disponibilidad en la respectiva página web o sede electrónica de la información cuyo acceso se solicita con más frecuencia.</p><p>g) Mantener actualizado un mapa de contenidos en el que queden identificados los distintos tipos de información que obre en poder del órgano.</p><p>h) Todas aquellas que sean necesarias para asegurar una correcta aplicación de las disposiciones de esta Ley.</p><p>3. El resto de las entidades incluidas en el ámbito de aplicación de este título identificarán claramente el órgano competente para conocer de las solicitudes de acceso.</p>`,dis:`<ul>
<li><b>21.1:</b> las Administraciones Públicas establecerán <b>sistemas para integrar la gestión de solicitudes</b> en su organización interna.</li>
<li><b>21.2 — en la AGE, <span class="t" data-k="unidades">unidades especializadas</span> con ocho funciones:</b> a) recabar y difundir la información de publicidad activa · b) <b>recibir y tramitar</b> las solicitudes · c) realizar los trámites internos para dar acceso · d) <b>seguimiento y control</b> de la tramitación · e) llevar un <b>registro</b> de solicitudes · f) asegurar la disponibilidad en web de la información <b>más solicitada</b> · g) mantener actualizado un <b><span class="t" data-k="mapacontenidos">mapa de contenidos</span></b> · h) las demás necesarias.</li>
<li><b>21.3:</b> el resto de entidades <b>identificarán claramente el órgano competente</b> para conocer de las solicitudes.</li>
</ul>`,llano:`<p>Para que el derecho funcione hace falta que alguien se ocupe: una unidad que reciba las peticiones, las tramite, las registre, publique lo que más se pide y sepa qué información existe y dónde está. Y si no hay unidad especializada, al menos hay que decir claramente quién se encarga.</p>`,porque:`<p>Un derecho sin estructura administrativa detrás se convierte en una carrera de obstáculos. Las funciones f) y g) son especialmente inteligentes: publicar lo más solicitado <b>reduce</b> el número de solicitudes, y el mapa de contenidos permite saber qué se tiene, sin lo cual es imposible responder con rigor.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> una oficina de atención con registro de peticiones y un inventario de lo que hay en el almacén.</li>
<li><b>Real:</b> un ayuntamiento designa a la Secretaría General como órgano competente para las solicitudes de acceso y lo publica en su portal (art. 21.3).</li>
</ul>`,noej:`<ul>
<li><b>No obliga</b> el art. 21.2 a las entidades locales a crear unidades especializadas: esa previsión es para la <b>AGE</b>.</li>
<li><b>No basta</b> con recibir solicitudes: hay que registrarlas y hacer seguimiento.</li>
</ul>`,conex:`<ul>
<li><b>Art. 10.2 LTBG:</b> publicación de la información más solicitada en el Portal.</li>
<li><b>Art. 17.1 LTBG:</b> órgano al que se dirige la solicitud.</li>
<li><b>Art. 41 de la Ley 1/2014 de Andalucía</b> (documento 9): unidades y comisiones de transparencia.</li>
</ul>`,trampas:`<ul>
<li>Las <b>unidades especializadas</b> del 21.2 se prevén en el ámbito de la <b>AGE</b>.</li>
<li>El resto de entidades deben <b>identificar claramente</b> el órgano competente.</li>
<li>Entre las funciones están el <b>registro</b> de solicitudes y el <b>mapa de contenidos</b>.</li>
</ul>`,ancla:`<p><b>"Recibe, tramita, registra, publica lo que más se pide y sabe dónde está todo."</b></p>`,vis:`<svg viewBox="0 0 640 130" role="img" aria-label="Unidades de información">

{n:22,t:"Formalización del acceso",ubic:"Título I ▸ Capítulo III ▸ Sección 2.ª (Ejercicio del derecho de acceso a la información pública)",idea:"Acceso preferentemente electrónico, gratuito y en diez días si no es inmediato.",literal:`<p>1. El acceso a la información se realizará preferentemente por vía electrónica, salvo cuando no sea posible o el solicitante haya señalado expresamente otro medio. Cuando no pueda darse el acceso en el momento de la notificación de la resolución deberá otorgarse, en cualquier caso, en un plazo no superior a diez días.</p><p>2. Si ha existido oposición de tercero, el acceso sólo tendrá lugar cuando, habiéndose concedido dicho acceso, haya transcurrido el plazo para interponer recurso contencioso administrativo sin que se haya formalizado o haya sido resuelto confirmando el derecho a recibir la información.</p><p>3. Si la información ya ha sido publicada, la resolución podrá limitarse a indicar al solicitante cómo puede acceder a ella.</p><p>4. El acceso a la información será gratuito. No obstante, la expedición de copias o la trasposición de la información a un formato diferente al original podrá dar lugar a la exigencia de exacciones en los términos previstos en la Ley 8/1989, de 13 de abril, de Tasas y Precios Públicos, o, en su caso, conforme a la normativa autonómica o local que resulte aplicable.</p>`,dis:`<ul>
<li><b>22.1 — forma y plazo:</b> el acceso se realiza <b>preferentemente por vía electrónica</b>, salvo imposibilidad o que el solicitante haya señalado otro medio. Si no puede darse en el momento de la notificación, deberá otorgarse <b>en un plazo no superior a diez días</b>.</li>
<li><b>22.2 — oposición de tercero:</b> si la hubo, el acceso solo tendrá lugar cuando haya <b>transcurrido el plazo para interponer recurso contencioso-administrativo</b> sin que se haya formalizado, o cuando este haya sido <b>resuelto confirmando</b> el derecho a recibir la información.</li>
<li><b>22.3 — información ya publicada:</b> la resolución <b>podrá limitarse a indicar</b> al solicitante cómo acceder a ella.</li>
<li><b>22.4 — gratuidad:</b> el acceso será <b>gratuito</b>. No obstante, la <b>expedición de copias</b> o la <b>trasposición a un formato distinto</b> del original puede dar lugar a <b>exacciones</b> conforme a la Ley 8/1989 de Tasas y Precios Públicos o a la normativa autonómica o local.</li>
</ul>`,llano:`<p>Lo normal es recibir la información por vía electrónica y gratis. Si no te la pueden dar en el mismo momento, tienen diez días. Si alguien se opuso, hay que esperar a que pase el plazo de recurso o a que el juez confirme el acceso. Y si ya está publicada, basta con decirte dónde mirar.</p>`,porque:`<p>La gratuidad es esencial: un precio, por pequeño que sea, disuade y convierte el derecho en un servicio. Pero la ley distingue entre <b>acceder</b> —gratuito— y <b>obtener copias o conversiones de formato</b>, que tienen un coste material y pueden repercutirse. El apartado 2 protege al tercero: de nada serviría su recurso si el acceso ya se hubiera consumado.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> consultar un documento es gratis; que te hagan cien fotocopias, no necesariamente.</li>
<li><b>Real:</b> el ayuntamiento remite por correo electrónico el PDF del contrato solicitado en el plazo de tres días desde la notificación de la resolución.</li>
<li><b>Caso límite:</b> si un tercero se opuso y ha interpuesto recurso contencioso-administrativo, el acceso queda demorado hasta que se resuelva confirmando el derecho (art. 22.2).</li>
</ul>`,noej:`<ul>
<li><b>No cabe</b> cobrar por el <b>acceso</b> en sí.</li>
<li><b>No hay</b> obligación de entregar copia en papel si el solicitante no lo pidió y cabe la vía electrónica.</li>
<li><b>No procede</b> demorar el acceso por la simple existencia de un tercero: hace falta <b>oposición</b>.</li>
</ul>`,conex:`<ul>
<li><b>Art. 19.3 LTBG:</b> audiencia al tercero, antecedente de la oposición.</li>
<li><b>Art. 20.2 LTBG:</b> motivación de las resoluciones que conceden acceso pese a la oposición.</li>
<li><b>Art. 34 de la Ley 1/2014 de Andalucía</b> (documento 9): materialización del acceso.</li>
<li><b>RD 203/2021</b> (documento 4): actuación por medios electrónicos.</li>
</ul>`,trampas:`<ul>
<li>Si no se da en el momento, <b>máximo diez días</b>.</li>
<li>El acceso es <b>gratuito</b>; las <b>copias</b> y los cambios de formato pueden generar exacciones.</li>
<li>La oposición del tercero <b>demora</b> el acceso hasta que transcurra el plazo de recurso o se resuelva confirmando.</li>
</ul>`,ancla:`<p><b>"Electrónico, gratis y en diez días."</b> Copias aparte, y si hay tercero opuesto, <b>se espera</b>.</p>`,vis:`<svg viewBox="0 0 640 145" role="img" aria-label="Formalización del acceso">
<g font-size="10" text-anchor="middle" fill="currentColor">
<rect x="20" y="30" width="185" height="58" rx="8" fill="var(--acc-soft)" stroke="var(--acc)"/><text x="112" y="53" font-size="11" font-weight="700" fill="var(--acc)">Preferentemente electrónico</text><text x="112" y="72">salvo otro medio señalado</text>

<rect x="434" y="30" width="186" height="58" rx="8" fill="var(--warn-bg)" stroke="var(--warn)"/><text x="527" y="53" font-size="11" font-weight="700" fill="var(--warn)">Gratuito</text><text x="527" y="72">copias y cambio de formato: exacciones</text>
</g>
<text x="320" y="118" text-anchor="middle" font-size="10" fill="var(--exc)">Si hubo oposición de tercero: se espera al plazo de recurso o a su resolución confirmatoria</text>
<text x="320" y="136" text-anchor="middle" font-size="10" fill="var(--ink2)">Si la información ya está publicada, basta con indicar cómo acceder a ella</text>
</svg>`},
{n:23,t:"Recursos",ubic:"Título I ▸ Capítulo III ▸ Sección 3.ª (Régimen de impugnaciones)",idea:"La reclamación sustituye a los recursos administrativos; en ciertos órganos, solo contencioso.",literal:`<p>1. La reclamación prevista en el artículo siguiente tendrá la consideración de sustitutiva de los recursos administrativos de conformidad con lo dispuesto en el artículo 107.2 de la Ley 30/1992, de 26 de noviembre, de Régimen Jurídico de las Administraciones Públicas y del Procedimiento Administrativo Común.</p><p>2. No obstante lo dispuesto en el apartado anterior, contra las resoluciones dictadas por los órganos previstos en el artículo 2.1.f) sólo cabrá la interposición de recurso contencioso- administrativo.</p>`,dis:`<ul>
<li><b>23.1:</b> la reclamación del art. 24 tiene la consideración de <b>sustitutiva de los recursos administrativos</b>, conforme a la legislación de procedimiento administrativo.</li>
<li><b>23.2:</b> contra las resoluciones dictadas por los <b>órganos del art. 2.1.f)</b> —Casa del Rey, Cortes, Tribunal Constitucional, CGPJ, Banco de España, Consejo de Estado, Defensor del Pueblo, Tribunal de Cuentas, Consejo Económico y Social e instituciones autonómicas análogas— <b>solo cabrá recurso contencioso-administrativo</b>.</li>
</ul>
<div class="interp"><span class="lbl">Interpretación / contexto — aportación externa</span>El precepto remite al <b>art. 107.2 de la Ley 30/1992</b>. Esa ley está derogada: hoy la sustitución de recursos por otros procedimientos de impugnación se regula en el <b>art. 112.2 de la Ley 39/2015</b> (documento 1 de la biblioteca).</div>`,llano:`<p>Frente a una denegación no se presenta el recurso administrativo de siempre: se presenta la reclamación ante el Consejo, que ocupa su lugar. Y contra lo que resuelvan los grandes órganos constitucionales no cabe reclamación: se va directo al juzgado.</p>`,porque:`<p>Sustituir los recursos por una reclamación ante un <b>órgano independiente</b> es lo que da fuerza al sistema: si el recurso lo resolviera la misma Administración que denegó, la garantía sería aparente. La excepción del apartado 2 responde a la <b>posición constitucional</b> de esos órganos, que no admiten un control administrativo externo.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> reclamar ante un árbitro externo en vez de ante quien te dijo que no.</li>
<li><b>Real:</b> denegado el acceso por un ayuntamiento andaluz, la reclamación se dirige al <b>Consejo de Transparencia y Protección de Datos de Andalucía</b> (art. 33 de la Ley 1/2014 y disposición adicional cuarta de la Ley 19/2013).</li>
<li><b>Caso límite:</b> denegación del Tribunal de Cuentas en materia de acceso: solo cabe recurso contencioso-administrativo (art. 23.2).</li>
</ul>`,noej:`<ul>
<li><b>No cabe</b> interponer además recurso de alzada o reposición: la reclamación los sustituye.</li>
<li><b>No es obligatoria</b> la reclamación: es <b>potestativa</b> (art. 24.1).</li>
</ul>`,conex:`<ul>
<li><b>Art. 24 LTBG:</b> régimen de la reclamación.</li>
<li><b>Art. 20.5 LTBG:</b> recurribilidad directa ante el contencioso.</li>
<li><b>Art. 112.2 de la Ley 39/2015</b> (documento 1): sustitución de recursos.</li>
<li><b>Disposición adicional cuarta LTBG:</b> atribución de la competencia a órganos autonómicos.</li>
</ul>`,trampas:`<ul>
<li>La reclamación es <b>sustitutiva</b> de los recursos administrativos, pero <b>potestativa</b>.</li>
<li>La excepción del 23.2 se refiere a los órganos del <b>art. 2.1.f)</b>.</li>
<li>La cita a la Ley 30/1992 está <b>desfasada</b>.</li>
</ul>`,ancla:`<p><b>"En vez de recurso, reclamación; y contra los grandes órganos, directo al juez."</b></p>`,vis:`<svg viewBox="0 0 640 130" role="img" aria-label="Régimen de impugnaciones">

{n:24,t:"Reclamación ante el Consejo de Transparencia y Buen Gobierno",ubic:"Título I ▸ Capítulo III ▸ Sección 3.ª (Régimen de impugnaciones)",idea:"Reclamación en un mes ante el Consejo, que resuelve en tres y publica sus resoluciones.",literal:`<p>1. Frente a toda resolución expresa o presunta en materia de acceso podrá interponerse una reclamación ante el Consejo de Transparencia y Buen Gobierno, con carácter potestativo y previo a su impugnación en vía contencioso-administrativa.</p><p>2. La reclamación se interpondrá en el plazo de un mes a contar desde el día siguiente al de la notificación del acto impugnado o desde el día siguiente a aquel en que se produzcan los efectos del silencio administrativo.</p><p>3. La tramitación de la reclamación se ajustará a lo dispuesto en materia de recursos en la Ley 30/1992, de 26 de noviembre, de Régimen Jurídico de las Administraciones Públicas y del Procedimiento Administrativo Común.</p><p>Cuando la denegación del acceso a la información se fundamente en la protección de derechos o intereses de terceros se otorgará, previamente a la resolución de la reclamación, trámite de audiencia a las personas que pudieran resultar afectadas para que aleguen lo que a su derecho convenga.</p><p>4. El plazo máximo para resolver y notificar la resolución será de tres meses, transcurrido el cual, la reclamación se entenderá desestimada.</p><p>5. Las resoluciones del Consejo de Transparencia y Buen Gobierno se publicarán, previa disociación de los datos de carácter personal que contuvieran, por medios electrónicos y en los términos en que se establezca reglamentariamente, una vez se hayan notificado a los interesados.</p><p>El Presidente del Consejo de Transparencia y Buen Gobierno comunicará al Defensor del Pueblo las resoluciones que dicte en aplicación de este artículo.</p><p>6. La competencia para conocer de dichas reclamaciones corresponderá al Consejo de Transparencia y Buen Gobierno, salvo en aquellos supuestos en que las Comunidades Autónomas atribuyan dicha competencia a un órgano específico, de acuerdo con lo establecido en la disposición adicional cuarta de esta Ley.</p>`,dis:`<table><thead><tr><th>Apdo.</th><th>Contenido</th></tr></thead><tbody>
<tr><td><b>24.1</b></td><td>Frente a <b>toda resolución expresa o presunta</b> en materia de acceso cabe <span class="t" data-k="reclamacion">reclamación</span> ante el <b>Consejo de Transparencia y Buen Gobierno</b>, con carácter <b>potestativo y previo</b> a la impugnación contencioso-administrativa</td></tr>
<tr><td><b>24.2</b></td><td>Plazo de interposición: <b>un mes</b> desde el día siguiente a la notificación del acto impugnado o a aquel en que se produzcan los efectos del <b>silencio</b></td></tr>
<tr><td><b>24.3</b></td><td>Tramitación conforme a la legislación de recursos. Si la denegación se funda en la protección de derechos o intereses de terceros, se otorga <b>audiencia previa</b> a los afectados</td></tr>
<tr><td><b>24.4</b></td><td>Plazo máximo para resolver y notificar: <b>tres meses</b>; transcurrido, la reclamación se entiende <b>desestimada</b></td></tr>
<tr><td><b>24.5</b></td><td>Las resoluciones se <b>publican</b>, previa <b>disociación</b> de datos personales, una vez notificadas. El Presidente del Consejo las <b>comunica al Defensor del Pueblo</b></td></tr>
<tr><td><b>24.6</b></td><td>La competencia corresponde al Consejo, <b>salvo</b> que las comunidades autónomas la atribuyan a un <b>órgano específico</b>, conforme a la disposición adicional cuarta</td></tr>
</tbody></table>`,llano:`<p>Si te deniegan la información o no te contestan, tienes un mes para reclamar ante el Consejo. Este tiene tres meses para resolver; si no lo hace, se entiende desestimada. Sus resoluciones se publican anonimizadas y se comunican al Defensor del Pueblo. En Andalucía, quien resuelve es el Consejo autonómico.</p>`,porque:`<p>La reclamación es la <b>pieza clave del sistema de garantías</b>: gratuita, sin abogado y ante un órgano independiente. Publicar sus resoluciones genera <b>doctrina</b> y hace previsible el criterio; comunicarlas al Defensor del Pueblo añade un control institucional adicional. Y el apartado 6 explica por qué en Andalucía la reclamación no se dirige a Madrid.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> reclamar ante la junta arbitral de consumo: rápido, gratis y sin necesidad de abogado.</li>
<li><b>Real:</b> denegado el acceso el 10 de marzo, la reclamación puede interponerse hasta el 10 de abril ante el Consejo autonómico; si el 10 de julio no ha resuelto, se entiende desestimada y queda abierta la vía contenciosa.</li>
<li><b>Caso límite:</b> si la denegación se fundó en derechos de un tercero, el Consejo debe darle <b>audiencia</b> antes de resolver (art. 24.3).</li>
</ul>`,noej:`<ul>
<li><b>No es</b> obligatoria: se puede ir directamente al contencioso (art. 20.5).</li>
<li><b>No cabe</b> reclamación contra las resoluciones de los órganos del art. 2.1.f).</li>
<li><b>No hay</b> silencio positivo: transcurridos los tres meses, se entiende desestimada.</li>
</ul>`,conex:`<ul>
<li><b>Art. 23 LTBG:</b> carácter sustitutivo de la reclamación.</li>
<li><b>Arts. 33 a 40 LTBG:</b> el Consejo de Transparencia y Buen Gobierno.</li>
<li><b>Art. 33 de la Ley 1/2014 de Andalucía</b> (documento 9): reclamaciones ante el Consejo andaluz.</li>
<li><b>Disposición adicional cuarta LTBG:</b> régimen de las reclamaciones en las comunidades autónomas.</li>
</ul>`,trampas:`<ul>
<li>Plazo de interposición: <b>un mes</b>. Plazo de resolución: <b>tres meses</b>. Silencio: <b>desestimatorio</b>.</li>
<li>Es <b>potestativa y previa</b> a la vía contenciosa.</li>
<li>Las resoluciones se publican <b>previa disociación</b> y se comunican al <b>Defensor del Pueblo</b>.</li>
<li>En las comunidades autónomas puede resolver un <b>órgano específico</b>.</li>
</ul>`,ancla:`<p><b>"Uno para reclamar, tres para resolver, y si callan, no."</b><br>Y recuerda: en Andalucía resuelve el <b>Consejo autonómico</b>.</p>`,vis:`<svg viewBox="0 0 640 155" role="img" aria-label="Reclamación ante el Consejo de Transparencia">

<script>
const PLAZOS=[["1 mes", "Plazo máximo para resolver y notificar la solicitud de acceso", "Órgano competente", "20.1 L19/2013", "Ampliable por otro mes previa notificación"], ["1 mes más", "Ampliación por volumen o complejidad de la información", "Órgano competente", "20.1 L19/2013", "Requiere notificación al solicitante"], ["Silencio negativo", "Efecto de la falta de resolución en plazo", "Solicitante", "20.4 L19/2013", "La solicitud se entiende desestimada"], ["10 días", "Plazo para concretar la solicitud que no identifica la información", "Solicitante", "19.2 L19/2013", "Suspende el plazo; en otro caso, desistimiento"], ["15 días", "Alegaciones de terceros afectados", "Terceros", "19.3 L19/2013", "Suspende el plazo para resolver"], ["10 días", "Plazo máximo para dar el acceso si no se otorga en el momento", "Órgano competente", "22.1 L19/2013", "Preferentemente por vía electrónica"], ["1 mes", "Plazo para interponer la reclamación ante el Consejo", "Reclamante", "24.2 L19/2013", "Desde la notificación o desde los efectos del silencio"], ["3 meses", "Plazo del Consejo para resolver y notificar la reclamación", "Consejo", "24.4 L19/2013", "Transcurrido, se entiende desestimada"], ["Gratuito", "Coste del acceso a la información", "Ciudadanía", "22.4 L19/2013", "Copias y cambios de formato pueden generar exacciones"], ["Infracción grave", "Incumplimiento reiterado de la obligación de resolver en plazo", "Responsables", "20.6 L19/2013", "A efectos disciplinarios"]];
const FLASH=[["¿Quién es titular del derecho de acceso?", "<b>Todas las personas</b>, en los términos del art. 105.b) de la Constitución (art. 12)."], ["¿Qué es información pública?", "Los contenidos o documentos, <b>en cualquier formato o soporte</b>, que <b>obren en poder</b> de un sujeto del título I y hayan sido <b>elaborados o adquiridos en el ejercicio de sus funciones</b> (art. 13)."], ["Cita cinco límites del art. 14", "Seguridad nacional · defensa · relaciones exteriores · seguridad pública · prevención e investigación de ilícitos · procesos judiciales · vigilancia e inspección · intereses económicos · política económica · secreto profesional · confidencialidad en la toma de decisiones · medio ambiente."], ["¿Cómo deben aplicarse los límites?", "De forma <b>justificada y proporcionada</b>, atendiendo al <b>caso concreto</b> y a la posible concurrencia de un <b>interés público o privado superior</b> (art. 14.2)."], ["¿Qué datos exigen consentimiento expreso y por escrito?", "Los que revelen <b>ideología, afiliación sindical, religión o creencias</b>, salvo que el afectado los hubiera hecho manifiestamente públicos (art. 15.1)."], ["¿Qué ocurre con los datos meramente identificativos?", "Con carácter general <b>se concede</b> el acceso, salvo que prevalezca la protección de datos u otros derechos constitucionalmente protegidos (art. 15.2)."], ["¿Qué desactiva las reglas de protección de datos del art. 15?", "La <b>disociación</b> previa que impida identificar a las personas afectadas (art. 15.4)."], ["¿En qué consiste el acceso parcial?", "En conceder el acceso omitiendo la información afectada por un límite, salvo que resulte <b>distorsionada o carente de sentido</b>, indicando al solicitante qué se ha omitido (art. 16)."], ["¿Debe motivarse la solicitud de acceso?", "<b>No</b>. Puede exponerse el motivo, pero su ausencia <b>no es por sí sola causa de rechazo</b> (art. 17.3)."], ["Contenido mínimo de la solicitud", "Identidad · información solicitada · dirección de contacto, preferentemente electrónica · en su caso, modalidad de acceso (art. 17.2)."], ["Las cinco causas de inadmisión", "En curso de elaboración o publicación · información auxiliar o de apoyo · necesidad de reelaboración · órgano que no la posee y se desconoce el competente · solicitudes repetitivas o abusivas (art. 18.1)."], ["¿Qué debe indicar la inadmisión por no poseer la información?", "El <b>órgano que, a juicio del que inadmite, es competente</b> (art. 18.2)."], ["¿Qué plazos hay en la tramitación?", "<b>10 días</b> para que el solicitante concrete la petición y <b>15 días</b> para alegaciones de terceros; ambos <b>suspenden</b> el plazo de resolución (art. 19)."], ["Plazo para resolver la solicitud de acceso", "<b>Un mes</b> desde la recepción por el órgano competente, ampliable por otro mes previa notificación (art. 20.1)."], ["¿Qué resoluciones deben motivarse?", "Las que <b>deniegan</b>, las de <b>acceso parcial</b>, las que conceden por <b>modalidad distinta</b> a la solicitada y las que permiten el acceso pese a la <b>oposición de un tercero</b> (art. 20.2)."], ["¿Qué efecto tiene el silencio en el derecho de acceso?", "<b>Desestimatorio</b>: la solicitud se entiende desestimada (art. 20.4)."], ["¿Cómo se formaliza el acceso?", "Preferentemente por <b>vía electrónica</b> y, si no puede darse en el momento, en un plazo <b>no superior a diez días</b> (art. 22.1)."], ["¿Es gratuito el acceso?", "Sí. Pero la <b>expedición de copias</b> o la trasposición a otro formato puede dar lugar a <b>exacciones</b> (art. 22.4)."], ["¿Qué naturaleza tiene la reclamación del art. 24?", "<b>Potestativa</b> y <b>previa</b> al contencioso, y <b>sustitutiva</b> de los recursos administrativos (arts. 23.1 y 24.1)."], ["Plazos de la reclamación", "<b>Un mes</b> para interponerla y <b>tres meses</b> para que el Consejo resuelva; transcurridos, se entiende <b>desestimada</b> (art. 24.2 y 24.4)."], ["¿Contra qué resoluciones no cabe reclamación?", "Contra las dictadas por los órganos del <b>art. 2.1.f)</b>: solo cabe recurso contencioso-administrativo (art. 23.2)."], ["¿Quién resuelve las reclamaciones en Andalucía?", "El <b>Consejo de Transparencia y Protección de Datos de Andalucía</b>, por la vía del art. 24.6 y la disposición adicional cuarta."]];
const TEST=[{"a": 12, "q": "Son titulares del derecho de acceso a la información pública:", "o": [["todas las personas", 1, "Correcto: art. 12. No se exige interés, nacionalidad ni residencia."], ["solo los interesados en un procedimiento", 0, "Ese es el derecho de acceso al expediente de la Ley 39/2015."], ["únicamente los ciudadanos españoles", 0, "La ley no distingue por nacionalidad."], ["los mayores de edad empadronados", 0, "No se exigen tales requisitos."]]}, {"a": 13, "q": "Para que un contenido sea información pública se exige:", "o": [["que obre en poder del sujeto obligado y haya sido elaborado o adquirido en el ejercicio de sus funciones", 1, "Correcto: art. 13, requisitos cumulativos."], ["que conste en un expediente administrativo en papel", 0, "Vale cualquier formato o soporte."], ["que haya sido publicado previamente", 0, "No es requisito."], ["que lo haya elaborado la propia Administración", 0, "También la información <b>adquirida</b> en el ejercicio de sus funciones."]]}, {"a": 14, "q": "Los límites al derecho de acceso:", "o": [["se aplican de forma justificada y proporcionada, atendiendo al caso concreto", 1, "Correcto: art. 14.2, que además contempla el interés superior que justifique el acceso."], ["operan automáticamente por la materia de que se trate", 0, "No: exigen justificación y proporcionalidad."], ["impiden en todo caso el acceso parcial", 0, "Al contrario: procede el acceso parcial (art. 16)."], ["no requieren motivación por afectar a intereses generales", 0, "La motivación es imprescindible."]]}, {"a": 14, "q": "Completa: «La aplicación de los límites será justificada y ______ a su objeto y finalidad de protección».", "gap": "proporcionada", "fb": "<b>Proporcionada</b> (art. 14.2), atendiendo a las circunstancias del caso concreto."}, {"a": 15, "q": "El acceso a información con datos que revelen ideología o afiliación sindical requiere:", "o": [["consentimiento expreso y por escrito del afectado, salvo que los hubiera hecho manifiestamente públicos", 1, "Correcto: art. 15.1, primer párrafo."], ["ponderación razonada del órgano competente", 0, "La ponderación opera para los datos no especialmente protegidos (art. 15.3)."], ["autorización judicial previa", 0, "No está prevista."], ["nada especial: se concede como cualquier otro dato", 0, "Son datos especialmente protegidos."]]}, {"a": 15, "q": "Si el acceso se efectúa previa disociación de los datos personales, no se aplican las reglas de los apartados anteriores del art. 15.", "vf": true, "ok": true, "fb": "<b>Verdadero</b> (art. 15.4). Si no se puede identificar a las personas, el conflicto con la protección de datos desaparece."}, {"a": 16, "q": "Cuando un límite afecta solo a parte de la información:", "o": [["se concede el acceso parcial, omitiendo lo afectado e indicándolo al solicitante", 1, "Correcto: art. 16, salvo que la información resulte distorsionada o sin sentido."], ["se deniega el acceso a la totalidad", 0, "Sería desproporcionado y contrario al art. 16."], ["se entrega íntegra por prevalecer la transparencia", 0, "El límite debe respetarse en la parte afectada."], ["se traslada la decisión al Consejo de Transparencia", 0, "No está previsto."]]}, {"a": 17, "q": "El solicitante de información pública:", "o": [["no está obligado a motivar su solicitud", 1, "Correcto: art. 17.3. La ausencia de motivación no es por sí sola causa de rechazo."], ["debe acreditar un interés legítimo", 0, "No se exige."], ["debe utilizar el modelo oficial aprobado", 0, "Puede presentarla por cualquier medio que deje constancia."], ["debe abonar una tasa de tramitación", 0, "El acceso es gratuito (art. 22.4)."]]}, {"a": 18, "q": "¿Cuál NO es causa de inadmisión del art. 18?", "o": [["que la información sea muy voluminosa", 1, "Correcto: el volumen no es causa de inadmisión; puede justificar la ampliación del plazo (art. 20.1)."], ["que se refiera a información en curso de elaboración", 0, "Sí lo es: letra a)."], ["que tenga carácter auxiliar o de apoyo", 0, "Sí lo es: letra b)."], ["que sea manifiestamente repetitiva o abusiva", 0, "Sí lo es: letra e)."]]}, {"a": 19, "q": "Cuando la solicitud no identifica suficientemente la información, se concede al solicitante un plazo de:", "o": [["diez días para concretarla, con suspensión del plazo para resolver", 1, "Correcto: art. 19.2; en otro caso se le tiene por desistido."], ["quince días", 0, "Los quince días son para las alegaciones de terceros (art. 19.3)."], ["un mes", 0, "Ese es el plazo de resolución."], ["tres meses", 0, "Ese es el plazo del Consejo para resolver la reclamación."]]}, {"a": 19, "q": "Completa: «Si la información pudiera afectar a derechos o intereses de terceros debidamente identificados, se les concederá un plazo de ______ días para alegaciones».", "gap": "quince", "fb": "<b>Quince días</b> (art. 19.3), con suspensión del plazo para dictar resolución."}, {"a": 20, "q": "El plazo máximo para resolver y notificar la solicitud de acceso es de:", "o": [["un mes desde la recepción por el órgano competente, ampliable por otro mes", 1, "Correcto: art. 20.1, con notificación previa de la ampliación."], ["tres meses improrrogables", 0, "Tres meses es el plazo del Consejo para la reclamación."], ["quince días", 0, "No es el plazo de resolución."], ["seis meses", 0, "No es el plazo de esta ley."]]}, {"a": 20, "q": "El silencio en materia de acceso a la información pública es positivo.", "vf": true, "ok": false, "fb": "<b>Falso.</b> El art. 20.4 establece que, transcurrido el plazo sin resolución expresa, la solicitud <b>se entiende desestimada</b>."}, {"a": 20, "q": "¿Cuál de estas resoluciones NO exige motivación conforme al art. 20.2?", "o": [["la que concede el acceso íntegro en la modalidad solicitada y sin oposición de terceros", 1, "Correcto: la motivación se exige en los cuatro supuestos del art. 20.2, entre los que no está este."], ["la que deniega el acceso", 0, "Sí exige motivación."], ["la que concede acceso parcial", 0, "Sí exige motivación."], ["la que concede el acceso pese a la oposición de un tercero", 0, "Sí exige motivación."]]}, {"a": 22, "q": "Si el acceso no puede darse en el momento de la notificación de la resolución:", "o": [["deberá otorgarse en un plazo no superior a diez días", 1, "Correcto: art. 22.1."], ["deberá otorgarse en el plazo de un mes", 0, "No es el plazo del precepto."], ["se entenderá denegado", 0, "No: se otorga en plazo."], ["se requerirá nueva solicitud", 0, "No procede."]]}, {"a": 22, "q": "El acceso a la información es gratuito, pero la expedición de copias puede dar lugar a exacciones.", "vf": true, "ok": true, "fb": "<b>Verdadero</b> (art. 22.4), conforme a la Ley 8/1989 de Tasas y Precios Públicos o a la normativa autonómica o local."}, {"a": 23, "q": "La reclamación ante el Consejo de Transparencia tiene la consideración de:", "o": [["sustitutiva de los recursos administrativos", 1, "Correcto: art. 23.1."], ["recurso de alzada especial", 0, "No: sustituye a los recursos administrativos."], ["recurso obligatorio previo al contencioso", 0, "Es <b>potestativa</b> (art. 24.1)."], ["recurso extraordinario de revisión", 0, "No es esa figura."]]}, {"a": 24, "q": "El plazo para interponer la reclamación ante el Consejo es de:", "o": [["un mes desde el día siguiente a la notificación o a los efectos del silencio", 1, "Correcto: art. 24.2."], ["quince días hábiles", 0, "No es el plazo legal."], ["tres meses", 0, "Tres meses es el plazo del Consejo para resolver."], ["dos meses", 0, "Ese es el plazo del recurso contencioso-administrativo."]]}, {"a": 24, "q": "Completa: «El plazo máximo para resolver y notificar la resolución de la reclamación será de ______ meses, transcurrido el cual se entenderá desestimada».", "gap": "tres", "fb": "<b>Tres meses</b> (art. 24.4), con silencio desestimatorio."}, {"a": 24, "q": "Las resoluciones del Consejo de Transparencia y Buen Gobierno:", "o": [["se publican previa disociación de datos personales y se comunican al Defensor del Pueblo", 1, "Correcto: art. 24.5."], ["son secretas por afectar a terceros", 0, "Se publican, previa disociación."], ["se comunican al Tribunal de Cuentas", 0, "Se comunican al Defensor del Pueblo."], ["no son recurribles", 0, "Cabe recurso contencioso-administrativo."]]}];
const CASOS=[{"t": "Caso 1 · Del registro a la reclamación", "e": "El 3 de marzo un vecino solicita al ayuntamiento el expediente de la licencia de una nave contigua a su vivienda. El 10 de marzo se le pide que concrete qué documentos quiere; contesta el 15. El 20 de marzo se da audiencia al titular de la licencia, que se opone el 30. El 20 de abril no hay respuesta. <b>Analiza plazos, efectos y vías de reacción.</b>", "s": "<p><b>1) Requerimiento de concreción.</b> Art. 19.2: plazo de <b>10 días</b> y <b>suspensión</b> del plazo de resolución, que se reanuda con la contestación del 15 de marzo.</p><p><b>2) Audiencia al tercero.</b> Art. 19.3: <b>15 días</b> de alegaciones al titular de la licencia, con nueva <b>suspensión</b> del plazo, informando al solicitante.</p><p><b>3) Plazo de resolución.</b> Un mes desde la recepción (art. 20.1), <b>descontando</b> los periodos de suspensión, y ampliable por otro mes si el volumen o la complejidad lo justifican, previa notificación.</p><p><b>4) Falta de respuesta.</b> Vencido el plazo, la solicitud se entiende <b>desestimada</b> (art. 20.4). Además, el incumplimiento reiterado de resolver en plazo es <b>infracción grave</b> (art. 20.6).</p><p><b>5) Reacción.</b> Cabe <b>reclamación</b> ante el Consejo —en Andalucía, el Consejo de Transparencia y Protección de Datos— en el plazo de <b>un mes</b> desde que se producen los efectos del silencio (art. 24.2), o acudir directamente al contencioso (art. 20.5).</p><p><b>6) Si finalmente se concede</b> pese a la oposición del tercero, la resolución debe ser <b>motivada</b> (art. 20.2) y el acceso se demora hasta que transcurra el plazo de recurso contencioso o este se resuelva confirmando el derecho (art. 22.2).</p>"}, {"t": "Caso 2 · Cuatro solicitudes, cuatro respuestas", "e": "Un ayuntamiento recibe estas peticiones: <b>(a)</b> el borrador del plan de movilidad, aún en redacción; <b>(b)</b> un listado de las licencias concedidas en 2025, que exige filtrar la base de datos; <b>(c)</b> el expediente disciplinario de un empleado, con datos de salud; <b>(d)</b> la décima solicitud del mismo vecino pidiendo lo mismo con otras palabras. <b>Resuelve cada una.</b>", "s": "<p><b>(a) Inadmisión</b> por el art. 18.1.a): información <b>en curso de elaboración</b>. Resolución motivada.</p><p><b>(b) Se concede.</b> Filtrar o extraer datos de una base existente <b>no es reelaboración</b>: la inadmisión por el art. 18.1.c) sería improcedente. Si el listado incluye datos personales, se aplica el art. 15: los meramente identificativos se conceden, y en otro caso se pondera o se disocia (art. 15.4).</p><p><b>(c) Acceso muy limitado.</b> Los datos de salud son <b>especialmente protegidos</b> (art. 15.1, segundo párrafo): solo cabe acceso con consentimiento expreso o amparo en norma con rango de ley. Además concurre el límite del art. 14.1.e) (sanción de ilícitos disciplinarios). Procede <b>acceso parcial</b> tras omitir lo protegido (art. 16), o denegación motivada si lo que queda carece de sentido.</p><p><b>(d) Posible inadmisión</b> por el art. 18.1.e): solicitud <b>manifiestamente repetitiva</b>. Ojo: la reiteración debe ser manifiesta y la inadmisión, motivada; no basta con que el solicitante sea insistente.</p>"}, {"t": "Caso 3 · Publicidad activa frente a derecho de acceso", "e": "Un ciudadano pide por escrito: <b>(1)</b> el presupuesto municipal vigente, que ya está publicado en el portal; <b>(2)</b> el organigrama, que no está publicado; <b>(3)</b> las retribuciones del alcalde. <b>¿Cómo se responde a cada una y qué obligación incumple, en su caso, el ayuntamiento?</b>", "s": "<p><b>(1) Presupuesto ya publicado.</b> La resolución <b>podrá limitarse a indicar cómo acceder</b> a la información (art. 22.3). No hay incumplimiento: el presupuesto es información de publicidad activa (art. 8.1.d).</p><p><b>(2) Organigrama no publicado.</b> Hay que <b>facilitarlo</b> por la vía del derecho de acceso y, además, el ayuntamiento está <b>incumpliendo</b> la obligación de publicidad activa del art. 6.1, que exige organigrama actualizado con los responsables y su perfil y trayectoria.</p><p><b>(3) Retribuciones del alcalde.</b> Deben estar publicadas de oficio conforme al art. 8.1.f). No cabe oponer protección de datos: la propia ley ha hecho la ponderación, y en todo caso serían datos relacionados con la <b>actividad pública</b> (art. 15.2).</p><p><b>Conclusión:</b> el derecho de acceso funciona como <b>red de seguridad</b> de la publicidad activa. Si hay que pedir lo que debería estar publicado, hay un incumplimiento previo, cuyo carácter <b>reiterado</b> constituye infracción grave (art. 9.3).</p>"}];
const SEMAFORO=["Titularidad universal del derecho — art. 12", "Concepto de información pública — art. 13", "Los doce límites y la regla de proporcionalidad — art. 14", "Datos especialmente protegidos y consentimiento — art. 15.1", "Datos identificativos y ponderación — art. 15.2 y 15.3", "Disociación como solución — art. 15.4", "Acceso parcial — art. 16", "Contenido de la solicitud y no motivación — art. 17", "Las cinco causas de inadmisión — art. 18", "Tramitación: 10 y 15 días y suspensión — art. 19", "Plazo de un mes, ampliación y silencio negativo — art. 20", "Resoluciones que deben motivarse — art. 20.2", "Unidades de información y mapa de contenidos — art. 21", "Formalización del acceso y gratuidad — art. 22", "Régimen de impugnaciones — art. 23", "Reclamación ante el Consejo: 1 mes y 3 meses — art. 24"];
const INTRO_HTML="<section class=\"card\" id=\"intro\"><h2>Tema 13 · Bloque 2 · El derecho de acceso a la información pública</h2><p class=\"small\">Segundo bloque de la Ley 19/2013: el capítulo III del Título I. Quién puede pedir información y qué información puede pedir (arts. 12 y 13), qué puede denegarse y con qué motivación (arts. 14 a 16), cómo se tramita la solicitud (arts. 17 a 22) y cómo se reclama (arts. 23 y 24).</p><div class=\"box ej\"><span class=\"lbl\">La idea que ordena el bloque</span>El derecho de acceso funciona como una <b>cadena de decisiones</b>: ¿es información pública? → ¿concurre algún límite? → ¿hay datos personales que ponderar? → ¿puede darse acceso parcial? → ¿se resuelve en plazo? → ¿cabe reclamar? Cada eslabón tiene su artículo y su plazo.</div><div class=\"box warn\"><span class=\"lbl\">Fuentes utilizadas y vigencia</span><ul><li><b>Ley 19/2013</b>, texto consolidado con <b>última modificación de 9 de julio de 2022</b>.</li><li>Concordancias con la <b>Ley 39/2015</b> (documento 1) y con la <b>Ley 1/2014 de Andalucía</b> (documento 9), que regula el acceso en su Título III.</li><li><b>Citas desfasadas:</b> los arts. 23.1 y 24.3 remiten a la <b>Ley 30/1992</b>; hoy la sustitución de recursos está en el <b>art. 112.2</b> y la tramitación de recursos en los <b>arts. 112 a 120 de la Ley 39/2015</b>.</li><li><b>Aportación externa</b>: la <b>Ley 8/1989</b> de Tasas y Precios Públicos (art. 22.4), la <b>Ley 16/1985</b> del Patrimonio Histórico (art. 15.3.a) y la normativa de protección de datos (RGPD y LO 3/2018). Verifícalas en el BOE.</li></ul></div><svg viewBox=\"0 0 660 215\" role=\"img\" aria-label=\"Mapa conceptual del derecho de acceso\"><rect x=\"205\" y=\"8\" width=\"250\" height=\"36\" rx=\"9\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"330\" y=\"31\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"#fff\">DERECHO DE ACCESO</text><line x1=\"330\" y1=\"44\" x2=\"330\" y2=\"60\" stroke=\"var(--acc)\" stroke-width=\"2\"/><line x1=\"130\" y1=\"60\" x2=\"530\" y2=\"60\" stroke=\"var(--acc)\" stroke-width=\"2\"/><line x1=\"130\" y1=\"60\" x2=\"130\" y2=\"78\" stroke=\"var(--acc)\" stroke-width=\"2\"/><line x1=\"330\" y1=\"60\" x2=\"330\" y2=\"78\" stroke=\"var(--acc)\" stroke-width=\"2\"/><line x1=\"530\" y1=\"60\" x2=\"530\" y2=\"78\" stroke=\"var(--acc)\" stroke-width=\"2\"/><rect x=\"25\" y=\"78\" width=\"210\" height=\"122\" rx=\"9\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"130\" y=\"100\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"var(--acc)\">1 · QUÉ Y QUIÉN</text><text x=\"130\" y=\"126\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">12 · todas las personas</text><text x=\"130\" y=\"150\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">13 · información pública</text><text x=\"130\" y=\"178\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--ink2)\">sin motivación (17.3)</text><rect x=\"245\" y=\"78\" width=\"170\" height=\"122\" rx=\"9\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"330\" y=\"100\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"var(--exc)\">2 · LÍMITES</text><text x=\"330\" y=\"126\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">14 · doce causas</text><text x=\"330\" y=\"150\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">15 · datos personales</text><text x=\"330\" y=\"174\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">16 · acceso parcial</text><rect x=\"425\" y=\"78\" width=\"210\" height=\"122\" rx=\"9\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"530\" y=\"100\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"var(--ej)\">3 · PROCEDIMIENTO</text><text x=\"530\" y=\"124\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">17-19 · solicitud y trámite</text><text x=\"530\" y=\"146\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">20-22 · resolución y acceso</text><text x=\"530\" y=\"168\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">23-24 · reclamación</text><text x=\"530\" y=\"190\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--ink2)\">1 mes · 3 meses</text></svg></section>";

var q=document.getElementById('q'),timer=null;
function clearMarks(){document.querySelectorAll('mark.hit').forEach(function(m){
 var p=m.parentNode;p.replaceChild(document.createTextNode(m.textContent),m);p.normalize();});}
q.addEventListener('input',function(){
 clearTimeout(timer);timer=setTimeout(function(){
  clearMarks();
  var term=q.value.trim();
  document.querySelectorAll('section.card').forEach(function(s){s.classList.remove('hide');});
  if(term.length<3)return;
  var rx=new RegExp(term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
  document.querySelectorAll('section.card').forEach(function(s){
   var found=false;
   var w=document.createTreeWalker(s,NodeFilter.SHOW_TEXT,null);var nodes=[];
   while(w.nextNode()){var nd=w.currentNode;
    if(nd.parentNode.closest('script,style,mark'))continue;
    if(rx.test(nd.nodeValue)){nodes.push(nd);rx.lastIndex=0;}}
   nodes.forEach(function(nd){
    found=true;
    var span=document.createElement('span');
    span.innerHTML=nd.nodeValue.replace(rx,function(m){return '<mark class="hit">'+m+'</mark>';});
    nd.parentNode.replaceChild(span,nd);});
   if(found){s.querySelectorAll('details.panel').forEach(function(d){if(d.querySelector('mark.hit'))d.open=true;});}
   s.classList.toggle('hide',!found);
  });
 },220);});

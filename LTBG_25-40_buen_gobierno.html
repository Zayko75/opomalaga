</svg>`},
{n:32,t:"Prescripción",ubic:"Título II (Buen gobierno)",idea:"Prescriben a cinco, tres y un año, tanto las infracciones como las sanciones.",literal:`<p>1. El plazo de prescripción de las infracciones previstas en este título será de cinco años para las infracciones muy graves, tres años para las graves y un año para las leves.</p><p>2. Las sanciones impuestas por la comisión de infracciones muy graves prescribirán a los cinco años, las impuestas por infracciones graves a los tres años y las que sean consecuencia de la comisión de infracciones leves prescribirán en el plazo de un año.</p><p>3. Para el cómputo de los plazos de prescripción regulados en los dos apartados anteriores, así como para las causas de su interrupción, se estará a lo dispuesto en el artículo 132 de la Ley 30/1992, de 30 de noviembre, de Régimen Jurídico de las Administraciones Públicas y del Procedimiento Administrativo Común.</p>`,dis:`<table><thead><tr><th>Clase</th><th>Prescripción de la infracción</th><th>Prescripción de la sanción</th></tr></thead><tbody>
<tr><td><b>Muy grave</b></td><td><b>5 años</b></td><td><b>5 años</b></td></tr>
<tr><td><b>Grave</b></td><td><b>3 años</b></td><td><b>3 años</b></td></tr>
<tr><td><b>Leve</b></td><td><b>1 año</b></td><td><b>1 año</b></td></tr>
</tbody></table>
<p><b>32.3 — cómputo e interrupción:</b> se aplica la legislación general de procedimiento administrativo.</p>
<div class="interp"><span class="lbl">Interpretación / contexto — aportación externa</span>El precepto remite al <b>art. 132 de la Ley 30/1992</b>, derogada. Hoy el cómputo y la interrupción de la prescripción se regulan en el <b>art. 30 de la Ley 40/2015</b> (documento 2 de la biblioteca).</div>`,llano:`<p>Fácil de recordar: cinco, tres y uno. Y el mismo plazo vale tanto para perseguir la infracción como para ejecutar la sanción ya impuesta.</p>`,porque:`<p>La prescripción es una exigencia de <b>seguridad jurídica</b>: no puede pesar indefinidamente sobre una persona la amenaza de un expediente. La <b>simetría</b> entre infracciones y sanciones simplifica el sistema y evita que una sanción impuesta quede en el limbo.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> una deuda que deja de poder reclamarse pasado cierto tiempo.</li>
<li><b>Real:</b> una infracción grave cometida en marzo de 2023 prescribe en marzo de 2026 si no se ha iniciado el procedimiento con conocimiento del interesado.</li>
</ul>`,noej:`<ul>
<li><b>No coinciden</b> necesariamente con los plazos de la responsabilidad contable ante el Tribunal de Cuentas.</li>
</ul>`,conex:`<ul>
<li><b>Art. 30 de la Ley 40/2015</b> (documento 2): prescripción de infracciones y sanciones.</li>
<li><b>Arts. 28 a 30 LTBG:</b> infracciones y sanciones cuya prescripción se regula.</li>
</ul>`,trampas:`<ul>
<li><b>5-3-1</b>, tanto para infracciones como para sanciones.</li>
<li>El cómputo y la interrupción se rigen por la <b>legislación general</b>, hoy la Ley 40/2015.</li>
</ul>`,ancla:`<p><b>5-3-1</b>, en ambos sentidos: lo que se persigue y lo que se ejecuta.</p>`,vis:`<svg viewBox="0 0 640 130" role="img" aria-label="Plazos de prescripción">
<g font-size="10" text-anchor="middle" fill="currentColor">
<rect x="40" y="30" width="160" height="66" rx="8" fill="var(--exc-bg)" stroke="var(--exc)"/><text x="120" y="55" font-size="13" font-weight="700" fill="var(--exc)">5 años</text><text x="120" y="76">muy graves</text>
<rect x="240" y="30" width="160" height="66" rx="8" fill="var(--warn-bg)" stroke="var(--warn)"/><text x="320" y="55" font-size="13" font-weight="700" fill="var(--warn)">3 años</text><text x="320" y="76">graves</text>
<rect x="440" y="30" width="160" height="66" rx="8" fill="var(--ej-bg)" stroke="var(--ej)"/><text x="520" y="55" font-size="13" font-weight="700" fill="var(--ej)">1 año</text><text x="520" y="76">leves</text>
</g>
<text x="320" y="118" text-anchor="middle" font-size="10" fill="var(--ink2)">Los mismos plazos para la prescripción de las infracciones y de las sanciones</text>
</svg>`},
{n:33,t:"Consejo de Transparencia y Buen Gobierno",ubic:"Título III (Consejo de Transparencia y Buen Gobierno)",idea:"Se crea el Consejo como organismo público con autonomía y plena independencia.",literal:`<p>1. Se crea el Consejo de Transparencia y Buen Gobierno como organismo público de los previstos en la disposición adicional décima de la Ley 6/1997, de 14 de abril, de Organización y Funcionamiento de la Administración General del Estado. Estará adscrito al Ministerio de Hacienda y Administraciones Públicas.</p><p>2. El Consejo de Transparencia y Buen Gobierno tiene personalidad jurídica propia y plena capacidad de obrar. Actúa con autonomía y plena independencia en el cumplimiento de sus fines.</p>`,dis:`<ul>
<li><b>Creación:</b> se crea el <span class="t" data-k="consejo">Consejo de Transparencia y Buen Gobierno</span> como <b>organismo público</b>, adscrito al Ministerio competente.</li>
<li><b>Naturaleza:</b> tiene <b>personalidad jurídica propia y plena capacidad de obrar</b>.</li>
<li><b>Garantía:</b> actúa con <b>autonomía y plena independencia</b> en el cumplimiento de sus fines.</li>
</ul>`,llano:`<p>Para que la transparencia tenga quien la defienda, la ley crea un organismo con personalidad propia que actúa con independencia. No es un departamento más: su valor está precisamente en no depender de quien tiene que controlar.</p>`,porque:`<p>Un sistema de reclamaciones resuelto por la propia Administración denegante sería una garantía aparente. La <b>independencia</b> es, por tanto, un elemento estructural: sin ella, el art. 24 no tendría sentido. Las comunidades autónomas han replicado el modelo con sus propios consejos.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> un árbitro externo que no forma parte de ninguno de los equipos.</li>
<li><b>Real:</b> en Andalucía existe el <b>Consejo de Transparencia y Protección de Datos de Andalucía</b>, creado por el art. 43 de la Ley 1/2014 (documento 9).</li>
</ul>`,noej:`<ul>
<li><b>No es</b> un órgano administrativo sin personalidad: la tiene propia.</li>
<li><b>No resuelve</b> las reclamaciones autonómicas cuando la comunidad ha creado su propio órgano (art. 24.6).</li>
</ul>`,conex:`<ul>
<li><b>Arts. 9 y 24 LTBG:</b> competencias de control y resolución de reclamaciones.</li>
<li><b>Arts. 43 a 50 de la Ley 1/2014 de Andalucía</b> (documento 9): Consejo autonómico.</li>
</ul>`,trampas:`<ul>
<li>Tiene <b>personalidad jurídica propia</b> y actúa con <b>autonomía y plena independencia</b>.</li>
</ul>`,ancla:`<p><b>"Independiente o no sirve."</b> Personalidad propia y plena capacidad de obrar.</p>`,vis:`<svg viewBox="0 0 640 110" role="img" aria-label="Naturaleza del Consejo de Transparencia">
<rect x="140" y="25" width="360" height="55" rx="10" fill="var(--acc)" stroke="var(--acc)"/>
<text x="320" y="49" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">CONSEJO DE TRANSPARENCIA Y BUEN GOBIERNO</text>
<text x="320" y="68" text-anchor="middle" font-size="10" fill="#fff">personalidad jurídica propia · autonomía y plena independencia</text>
<text x="320" y="99" text-anchor="middle" font-size="10" fill="var(--ink2)">Las comunidades autónomas pueden crear órganos propios (art. 24.6)</text>
</svg>`},
{n:34,t:"Fines",ubic:"Título III (Consejo de Transparencia y Buen Gobierno)",idea:"Cuatro fines: promover, velar, salvaguardar y garantizar el buen gobierno.",literal:`<p>El Consejo de Transparencia y Buen Gobierno tiene por finalidad promover la transparencia de la actividad pública, velar por el cumplimiento de las obligaciones de publicidad, salvaguardar el ejercicio de derecho de acceso a la información pública y garantizar la observancia de las disposiciones de buen gobierno.</p>`,dis:`<ul>
<li><b>Promover</b> la transparencia de la actividad pública.</li>
<li><b>Velar</b> por el cumplimiento de las obligaciones de publicidad.</li>
<li><b>Salvaguardar</b> el ejercicio del derecho de acceso a la información pública.</li>
<li><b>Garantizar</b> la observancia de las disposiciones de buen gobierno.</li>
</ul>`,llano:`<p>Cuatro verbos que resumen su razón de ser: empujar la transparencia, vigilar que se publique, defender a quien pide información y velar por el buen gobierno.</p>`,porque:`<p>Los fines explican por qué el Consejo tiene a la vez funciones <b>promocionales</b> —recomendaciones, formación, informes— y <b>resolutorias</b> —reclamaciones—. Es un organismo de fomento y de garantía al mismo tiempo.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> un defensor que además hace campañas de divulgación.</li>
<li><b>Real:</b> el Consejo elabora recomendaciones sobre publicidad activa y resuelve reclamaciones de acceso, cumpliendo sus dos vertientes.</li>
</ul>`,noej:`<ul>
<li><b>No incluye</b> entre sus fines la protección de datos personales, competencia de la autoridad de control correspondiente.</li>
</ul>`,conex:`<ul>
<li><b>Art. 38 LTBG:</b> funciones concretas.</li>
<li><b>Art. 45 de la Ley 1/2014 de Andalucía</b> (documento 9): finalidad del Consejo autonómico, que sí acumula transparencia y protección de datos.</li>
</ul>`,trampas:`<ul>
<li>Son <b>cuatro</b> fines y abarcan las tres materias de la ley: transparencia, acceso y buen gobierno.</li>
</ul>`,ancla:`<p><b>"Promover, velar, salvaguardar y garantizar."</b> Cuatro verbos, cuatro fines.</p>`,vis:`<svg viewBox="0 0 640 115" role="img" aria-label="Fines del Consejo">
<g font-size="10" text-anchor="middle" fill="currentColor">
<rect x="15" y="30" width="145" height="52" rx="8" fill="var(--acc-soft)" stroke="var(--acc)"/><text x="87" y="52" font-size="11" font-weight="700" fill="var(--acc)">Promover</text><text x="87" y="70">la transparencia</text>
<rect x="172" y="30" width="145" height="52" rx="8" fill="var(--ej-bg)" stroke="var(--ej)"/><text x="244" y="52" font-size="11" font-weight="700" fill="var(--ej)">Velar</text><text x="244" y="70">por la publicidad</text>
<rect x="329" y="30" width="145" height="52" rx="8" fill="var(--warn-bg)" stroke="var(--warn)"/><text x="401" y="52" font-size="11" font-weight="700" fill="var(--warn)">Salvaguardar</text><text x="401" y="70">el derecho de acceso</text>
<rect x="486" y="30" width="139" height="52" rx="8" fill="var(--panel)" stroke="var(--line)"/><text x="555" y="52" font-size="11" font-weight="700">Garantizar</text><text x="555" y="70">el buen gobierno</text>
</g>
</svg>`},
{n:35,t:"Composición",ubic:"Título III (Consejo de Transparencia y Buen Gobierno)",idea:"Dos órganos: la Comisión y el Presidente, que preside ambas cosas.",literal:`<p>El Consejo de Transparencia y Buen Gobierno estará compuesto por los siguientes órganos:</p><p>a) La Comisión de Transparencia y Buen Gobierno.</p><p>b) El Presidente del Consejo de Transparencia y Buen Gobierno que lo será también de su Comisión.</p>`,dis:`<ul>
<li><b>a)</b> La <span class="t" data-k="comision">Comisión de Transparencia y Buen Gobierno</span>.</li>
<li><b>b)</b> El <b>Presidente</b> del Consejo, que lo será también <b>de su Comisión</b>.</li>
</ul>`,llano:`<p>Dos piezas: un órgano colegiado y un presidente, que es el mismo para el Consejo y para la Comisión.</p>`,porque:`<p>La estructura combina la <b>agilidad</b> de un órgano unipersonal —que resuelve las reclamaciones— con la <b>pluralidad</b> de un órgano colegiado en el que están representadas otras instituciones, lo que refuerza la independencia.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> una junta y su presidente, que preside ambas reuniones.</li>
<li><b>Real:</b> el Consejo andaluz tiene una estructura distinta: Dirección y Comisión Consultiva (arts. 46 a 49 de la Ley 1/2014).</li>
</ul>`,noej:`<ul>
<li><b>No hay</b> más órganos que estos dos en el Consejo estatal.</li>
</ul>`,conex:`<ul>
<li><b>Arts. 36 y 37 LTBG:</b> composición de la Comisión y estatuto del Presidente.</li>
<li><b>Art. 46 de la Ley 1/2014 de Andalucía</b> (documento 9): estructura del Consejo andaluz.</li>
</ul>`,trampas:`<ul>
<li>El Presidente del Consejo lo es <b>también de la Comisión</b>.</li>
</ul>`,ancla:`<p><b>"Comisión y Presidente; y el Presidente preside la Comisión."</b></p>`,vis:`<svg viewBox="0 0 640 110" role="img" aria-label="Órganos del Consejo">
<rect x="200" y="15" width="240" height="30" rx="8" fill="var(--acc)" stroke="var(--acc)"/>
<text x="320" y="35" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">CONSEJO</text>
<rect x="80" y="62" width="200" height="36" rx="8" fill="var(--acc-soft)" stroke="var(--acc)"/>
<text x="180" y="85" text-anchor="middle" font-size="11" font-weight="700" fill="var(--acc)">Comisión</text>
<rect x="360" y="62" width="200" height="36" rx="8" fill="var(--ej-bg)" stroke="var(--ej)"/>
<text x="460" y="85" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ej)">Presidente</text>
<path d="M280 45 L 200 60" stroke="var(--acc)" stroke-width="2"/><path d="M360 45 L 440 60" stroke="var(--acc)" stroke-width="2"/>
</svg>`},
{n:36,t:"Comisión de Transparencia y Buen Gobierno",ubic:"Título III (Consejo de Transparencia y Buen Gobierno)",idea:"La Comisión reúne al Presidente y a representantes de siete instituciones.",literal:`<p>1. La Comisión de Transparencia y Buen Gobierno ejercerá todas las competencias que le asigna esta Ley, así como aquellas que les sean atribuidas en su normativa de desarrollo.</p><p>2. Dicha Comisión estará compuesta por:</p><p>a) El Presidente.</p><p>b) Un Diputado.</p><p>c) Un Senador.</p><p>d) Un representante del Tribunal de Cuentas.</p><p>e) Un representante del Defensor del Pueblo.</p><p>f) Un representante de la Agencia Española de Protección de Datos.</p><p>g) Un representante de la Secretaría de Estado de Administraciones Públicas.</p><p>h) Un representante de la Autoridad Independiente de Responsabilidad Fiscal.</p><p>3. La condición de miembro de la Comisión del Consejo de Transparencia y Buen Gobierno no exigirá dedicación exclusiva ni dará derecho a remuneración con excepción de lo previsto en el artículo siguiente.</p><p>4. Al menos una vez al año, la Comisión de Transparencia y Buen Gobierno convocará a los representantes de los organismos que, con funciones similares a las desarrolladas por</p><p>ella, hayan sido creados por las Comunidades Autónomas en ejercicio de sus competencias. A esta reunión podrá ser convocado un representante de la Administración Local propuesto por la Federación Española de Municipios y Provincias.</p>`,dis:`<ul>
<li><b>Competencias:</b> ejerce todas las que le asigna la ley y su normativa de desarrollo.</li>
<li><b>Composición:</b> a) el <b>Presidente</b> · b) un <b>Diputado</b> · c) un <b>Senador</b> · d) un representante del <b>Tribunal de Cuentas</b> · e) un representante del <b>Defensor del Pueblo</b> · f) un representante de la <b>Agencia Española de Protección de Datos</b> · g) un representante de la <b>Secretaría de Estado de Administraciones Públicas</b> · y un representante de la Autoridad Independiente de Responsabilidad Fiscal, en los términos de la ley.</li>
</ul>`,llano:`<p>La Comisión sienta en la misma mesa al Congreso, al Senado, al Tribunal de Cuentas, al Defensor del Pueblo, a la Agencia de Protección de Datos y a la Administración. Esa pluralidad es la que blinda su independencia.</p>`,porque:`<p>Al integrar a instituciones de control ya existentes se evita crear un organismo aislado y se aprovecha su experiencia. La presencia de la <b>Agencia de Protección de Datos</b> tiene una razón evidente: casi todos los conflictos de acceso acaban planteando un problema de datos personales.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> un jurado formado por representantes de distintas entidades, no por una sola.</li>
<li><b>Real:</b> la presencia del representante de la AEPD facilita la coherencia de criterio en la aplicación del art. 15.</li>
</ul>`,noej:`<ul>
<li><b>No forman parte</b> de la Comisión representantes de las comunidades autónomas.</li>
</ul>`,conex:`<ul>
<li><b>Art. 35 LTBG:</b> órganos del Consejo.</li>
<li><b>Art. 15 LTBG:</b> protección de datos, materia en la que participa la AEPD.</li>
<li><b>Art. 49 de la Ley 1/2014 de Andalucía</b> (documento 9): Comisión Consultiva andaluza.</li>
</ul>`,trampas:`<ul>
<li>Un <b>Diputado</b> y un <b>Senador</b>: uno de cada cámara.</li>
<li>Están el <b>Tribunal de Cuentas</b>, el <b>Defensor del Pueblo</b> y la <b>AEPD</b>.</li>
</ul>`,ancla:`<p><b>"Cortes, Cuentas, Defensor, Datos y Administración."</b> Y preside el Presidente.</p>`,vis:`<svg viewBox="0 0 640 135" role="img" aria-label="Composición de la Comisión">
<rect x="215" y="12" width="210" height="30" rx="8" fill="var(--acc)" stroke="var(--acc)"/>
<text x="320" y="32" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">COMISIÓN</text>
<g font-size="10" text-anchor="middle" fill="currentColor">
<rect x="15" y="58" width="115" height="52" rx="8" fill="var(--acc-soft)" stroke="var(--acc)"/><text x="72" y="80" font-weight="700">Presidente</text><text x="72" y="97">del Consejo</text>
<rect x="140" y="58" width="115" height="52" rx="8" fill="var(--panel)" stroke="var(--line)"/><text x="197" y="80" font-weight="700">Cortes</text><text x="197" y="97">Diputado y Senador</text>
<rect x="265" y="58" width="115" height="52" rx="8" fill="var(--panel)" stroke="var(--line)"/><text x="322" y="80" font-weight="700">Tribunal de Cuentas</text><text x="322" y="97">un representante</text>
<rect x="390" y="58" width="115" height="52" rx="8" fill="var(--panel)" stroke="var(--line)"/><text x="447" y="80" font-weight="700">Defensor y AEPD</text><text x="447" y="97">un representante cada uno</text>
<rect x="515" y="58" width="110" height="52" rx="8" fill="var(--panel)" stroke="var(--line)"/><text x="570" y="80" font-weight="700">Administración</text><text x="570" y="97">Secretaría de Estado</text>
</g>
</svg>`},
{n:37,t:"Presidente del Consejo de Transparencia y Buen Gobierno",ubic:"Título III (Consejo de Transparencia y Buen Gobierno)",idea:"Presidente nombrado por cinco años no renovables, con comparecencia parlamentaria previa.",literal:`<p>1. El Presidente del Consejo de Transparencia y Buen Gobierno será nombrado por un período no renovable de cinco años mediante Real Decreto, a propuesta del titular del Ministerio de Hacienda y Administraciones Públicas, entre personas de reconocido prestigio y competencia profesional previa comparecencia de la persona propuesta para el cargo ante la Comisión correspondiente del Congreso de los Diputados. El Congreso, a través de la Comisión competente y por acuerdo adoptado por mayoría absoluta, deberá refrendar el nombramiento del candidato propuesto en el plazo de un mes natural desde la recepción de la correspondiente comunicación.</p><p>2. El Presidente del Consejo de Transparencia y Buen Gobierno cesará en su cargo por la expiración de su mandato, a petición propia o por separación acordada por el Gobierno, previa instrucción del correspondiente procedimiento por el titular del Ministerio de Hacienda y Administraciones Públicas, por incumplimiento grave de sus obligaciones, incapacidad permanente para el ejercicio de su función, incompatibilidad sobrevenida o condena por delito doloso.</p><p>3. El Presidente del Consejo de Transparencia y Buen Gobierno percibirá las retribuciones fijadas de acuerdo con el Real Decreto 451/2012, de 5 de marzo, por el que se regula el régimen retributivo de los máximos responsables y directivos en el sector público empresarial y otras entidades.</p>`,dis:`<ul>
<li><b>Nombramiento:</b> por <b>real decreto</b>, a propuesta del titular del Ministerio competente, entre personas de reconocido prestigio y competencia profesional, previa <b>comparecencia</b> ante la Comisión correspondiente del <b>Congreso de los Diputados</b>, que deberá <b>refrendar</b> el nombramiento por acuerdo adoptado por mayoría absoluta.</li>
<li><b>Duración:</b> período <b>no renovable de cinco años</b>.</li>
<li><b>Cese:</b> por <b>expiración del mandato</b>, a <b>petición propia</b> o por <b>separación acordada por el Gobierno</b>, previa instrucción del correspondiente procedimiento por causas tasadas: incumplimiento grave de sus obligaciones, incapacidad sobrevenida, incompatibilidad o condena por delito doloso.</li>
</ul>`,llano:`<p>Se nombra por cinco años y no se puede repetir, lo que le libra de tener que agradar a quien podría renovarle. Antes de nombrarlo comparece en el Congreso, que debe refrendar el nombramiento. Y solo se le puede cesar por causas tasadas y con procedimiento previo.</p>`,porque:`<p>Los tres elementos —mandato <b>no renovable</b>, <b>refrendo parlamentario</b> y <b>causas tasadas de cese</b>— son las garantías clásicas de la independencia de un organismo regulador. Sin ellas, la autonomía del art. 33 sería nominal.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> un árbitro con contrato fijo e irrevocable salvo falta grave.</li>
<li><b>Real:</b> la comparecencia previa en el Congreso permite contrastar públicamente el perfil del candidato.</li>
</ul>`,noej:`<ul>
<li><b>No es</b> renovable el mandato.</li>
<li><b>No cabe</b> el cese discrecional: exige causa tasada y procedimiento.</li>
</ul>`,conex:`<ul>
<li><b>Art. 33 LTBG:</b> autonomía e independencia del Consejo.</li>
<li><b>Art. 38 LTBG:</b> funciones que ejerce.</li>
<li><b>Art. 47 de la Ley 1/2014 de Andalucía</b> (documento 9): Dirección del Consejo andaluz, con garantías equivalentes.</li>
</ul>`,trampas:`<ul>
<li><b>Cinco años no renovables</b>.</li>
<li>Nombramiento por <b>real decreto</b> con <b>comparecencia y refrendo</b> del Congreso.</li>
<li>Cese por causas <b>tasadas</b>, previa instrucción del procedimiento.</li>
</ul>`,ancla:`<p><b>"Cinco años, una vez y con el Congreso de por medio."</b></p>`,vis:`<svg viewBox="0 0 640 125" role="img" aria-label="Estatuto del Presidente del Consejo">
<g font-size="10" text-anchor="middle" fill="currentColor">
<rect x="30" y="30" width="170" height="60" rx="8" fill="var(--acc-soft)" stroke="var(--acc)"/><text x="115" y="53" font-size="11" font-weight="700" fill="var(--acc)">Nombramiento</text><text x="115" y="72">real decreto + Congreso</text>
<rect x="235" y="30" width="170" height="60" rx="8" fill="var(--ej-bg)" stroke="var(--ej)"/><text x="320" y="53" font-size="11" font-weight="700" fill="var(--ej)">5 años</text><text x="320" y="72">NO renovables</text>
<rect x="440" y="30" width="170" height="60" rx="8" fill="var(--warn-bg)" stroke="var(--warn)"/><text x="525" y="53" font-size="11" font-weight="700" fill="var(--warn)">Cese</text><text x="525" y="72">causas tasadas y procedimiento</text>
</g>
</svg>`},
{n:38,t:"Funciones",ubic:"Título III (Consejo de Transparencia y Buen Gobierno)",idea:"Recomienda, asesora, informa proyectos, evalúa, forma, colabora y resuelve reclamaciones.",literal:`<p>1. Para la consecución de sus objetivos, el Consejo de Transparencia y Buen Gobierno tiene encomendadas las siguientes funciones:</p><p>a) Adoptar recomendaciones para el mejor cumplimiento de las obligaciones contenidas en esta Ley.</p><p>b) Asesorar en materia de transparencia, acceso a la información pública y buen gobierno.</p><p>c) Informar preceptivamente los proyectos normativos de carácter estatal que desarrollen esta Ley o que estén relacionados con su objeto.</p><p>d) Evaluar el grado de aplicación de esta Ley. Para ello, elaborará anualmente una memoria en la que se incluirá información sobre el cumplimiento de las obligaciones previstas y que será presentada ante las Cortes Generales.</p><p>e) Promover la elaboración de borradores de recomendaciones y de directrices y normas de desarrollo de buenas prácticas en materia de transparencia, acceso a la información pública y buen gobierno.</p><p>f) Promover actividades de formación y sensibilización para un mejor conocimiento de las materias reguladas por esta Ley.</p><p>g) Colaborar, en las materias que le son propias, con órganos de naturaleza análoga.</p><p>h) Aquellas otras que le sean atribuidas por norma de rango legal o reglamentario.</p><p>2. El Presidente del Consejo de Transparencia y Buen Gobierno ejercerá las siguientes funciones:</p><p>a) Adoptar criterios de interpretación uniforme de las obligaciones contenidas en esta Ley.</p><p>b) Velar por el cumplimiento de las obligaciones de publicidad contenidas en el capítulo II del título I de acuerdo con lo previsto en el artículo 9 de esta Ley.</p><p>c) Conocer de las reclamaciones que se presenten en aplicación del artículo 24 de esta Ley.</p><p>d) Responder las consultas que, con carácter facultativo, le planteen los órganos encargados de tramitar y resolver las solicitudes de acceso a la información.</p><p>e) Instar el inicio del procedimiento sancionador previsto en el título II de esta Ley. El órgano competente deberá motivar, en su caso, su decisión de no incoar el procedimiento.</p><p>f) Aprobar el anteproyecto de presupuesto.</p><p>g) Aquellas otras que le sean atribuidas por norma de rango legal o reglamentario.</p>`,dis:`<ul>
<li><b>a)</b> Adoptar <b>recomendaciones</b> para el mejor cumplimiento de la ley.</li>
<li><b>b)</b> <b>Asesorar</b> en materia de transparencia, acceso y buen gobierno.</li>
<li><b>c)</b> <b>Informar preceptivamente</b> los proyectos normativos estatales que desarrollen la ley o estén relacionados con su objeto.</li>
<li><b>d)</b> <b>Evaluar</b> el grado de aplicación de la ley, elaborando una <span class="t" data-k="memoria">memoria anual</span> que se presenta a las Cortes Generales.</li>
<li><b>e)</b> Promover borradores de recomendaciones, directrices y <b>buenas prácticas</b>.</li>
<li><b>f)</b> Promover actividades de <b>formación y sensibilización</b>.</li>
<li><b>g)</b> <b>Colaborar</b> con órganos de naturaleza análoga.</li>
<li><b>h)</b> Las demás atribuidas por norma legal o reglamentaria — entre ellas, <b>conocer de las reclamaciones</b> del art. 24 y del <b>control</b> de la publicidad activa del art. 9.</li>
</ul>`,llano:`<p>El Consejo no solo resuelve reclamaciones: recomienda, asesora, informa las normas que se van a aprobar, mide cómo se está aplicando la ley y forma. Su memoria anual es el termómetro público del cumplimiento.</p>`,porque:`<p>Un organismo que solo resolviera reclamaciones llegaría siempre tarde, cuando el conflicto ya existe. Las funciones <b>preventivas</b> —informe de proyectos, recomendaciones, formación— buscan que el problema no se produzca, y la <b>evaluación</b> anual genera presión pública sobre los incumplidores.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> un supervisor que además publica un informe anual sobre cómo lo está haciendo cada sujeto supervisado.</li>
<li><b>Real:</b> el informe preceptivo del Consejo sobre un proyecto de reglamento estatal de desarrollo de la ley (letra c).</li>
</ul>`,noej:`<ul>
<li><b>No informa</b> preceptivamente los proyectos normativos autonómicos: la letra c) se refiere a los de <b>carácter estatal</b>.</li>
<li><b>No sanciona</b> el Consejo por incumplimiento de la publicidad activa: insta actuaciones disciplinarias (art. 9.2).</li>
</ul>`,conex:`<ul>
<li><b>Arts. 9 y 24 LTBG:</b> control de la publicidad activa y reclamaciones.</li>
<li><b>Art. 40 LTBG:</b> memoria anual a las Cortes Generales.</li>
<li><b>Art. 48 de la Ley 1/2014 de Andalucía</b> (documento 9): funciones de la Dirección del Consejo andaluz.</li>
</ul>`,trampas:`<ul>
<li>El informe de la letra c) es <b>preceptivo</b> y se refiere a proyectos <b>estatales</b>.</li>
<li>La <b>memoria anual</b> se presenta a las Cortes Generales.</li>
</ul>`,ancla:`<p><b>"Recomienda, asesora, informa, evalúa, forma y colabora."</b> Seis verbos más las reclamaciones.</p>`,vis:`<svg viewBox="0 0 640 130" role="img" aria-label="Funciones del Consejo">
<g font-size="10" text-anchor="middle" fill="currentColor">
<rect x="15" y="30" width="145" height="60" rx="8" fill="var(--acc-soft)" stroke="var(--acc)"/><text x="87" y="52" font-size="11" font-weight="700" fill="var(--acc)">Prevención</text><text x="87" y="70">recomendaciones</text><text x="87" y="84">y asesoramiento</text>
<rect x="172" y="30" width="145" height="60" rx="8" fill="var(--ej-bg)" stroke="var(--ej)"/><text x="244" y="52" font-size="11" font-weight="700" fill="var(--ej)">Normativa</text><text x="244" y="70">informe preceptivo</text><text x="244" y="84">de proyectos estatales</text>
<rect x="329" y="30" width="145" height="60" rx="8" fill="var(--warn-bg)" stroke="var(--warn)"/><text x="401" y="52" font-size="11" font-weight="700" fill="var(--warn)">Evaluación</text><text x="401" y="70">memoria anual</text><text x="401" y="84">a las Cortes</text>
<rect x="486" y="30" width="139" height="60" rx="8" fill="var(--panel)" stroke="var(--line)"/><text x="555" y="52" font-size="11" font-weight="700">Garantía</text><text x="555" y="70">reclamaciones (art. 24)</text><text x="555" y="84">y control (art. 9)</text>
</g>
</svg>`},
{n:39,t:"Régimen jurídico",ubic:"Título III (Consejo de Transparencia y Buen Gobierno)",idea:"Se rige por su ley, su Estatuto y la normativa presupuestaria, contractual y de personal.",literal:`<p>1. El Consejo de Transparencia y Buen Gobierno se regirá, además de por lo dispuesto en esta Ley, por:</p><p>a) Las disposiciones de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, que le sean de aplicación. Anualmente elaborará un anteproyecto de presupuesto con la estructura que establezca el Ministerio de Hacienda y Administraciones Públicas para su elevación al Gobierno y su posterior integración en los Presupuestos Generales del Estado.</p><p>b) El Real Decreto Legislativo 3/2011, de 14 de noviembre, por el que se aprueba el Texto Refundido de la Ley de Contratos del Sector Público.</p><p>c) La Ley 33/2003, de 3 de noviembre, del Patrimonio de las Administraciones Públicas, y, en lo no previsto en ella, por el Derecho privado en sus adquisiciones patrimoniales.</p><p>d) La Ley 7/2007, de 12 de abril, del Estatuto Básico del Empleado Público, y las demás normas aplicables al personal funcionario de la Administración General del Estado, en materia de medios personales.</p><p>e) La Ley 30/1992, de 26 de noviembre, de Régimen Jurídico de las Administraciones Públicas y del Procedimiento Administrativo Común, y por la normativa que le sea de aplicación, en lo no dispuesto por esta Ley, cuando desarrolle sus funciones públicas.</p><p>2. El Consejo de Ministros aprobará mediante Real Decreto el Estatuto del Consejo de Transparencia y Buen Gobierno, en el que se establecerá su organización, estructura, funcionamiento, así como todos los aspectos que sean necesarios para el cumplimiento de sus funciones.</p><p>3. Con carácter general, los puestos de trabajo del Consejo de Transparencia y Buen Gobierno serán desempeñados por funcionarios públicos de acuerdo con lo establecido en la Ley 7/2007, de 12 de abril, del Estatuto Básico del Empleado Público, y las normas de función pública aplicables al personal funcionario de la Administración General del Estado. El personal laboral podrá desempeñar puestos de trabajo que se ajusten a la normativa de función pública de la Administración General del Estado. Asimismo, el personal que pase a prestar servicios en el Consejo de Transparencia y Buen Gobierno mediante los procedimientos de provisión previstos en la Administración General del Estado mantendrá la condición de personal funcionario o laboral, de acuerdo con la legislación aplicable.</p><p>4. El Consejo de Transparencia y Buen Gobierno contará para el cumplimiento de sus fines con los siguientes bienes y medios económicos:</p><p>a) Las asignaciones que se establezcan anualmente con cargos a los Presupuestos Generales del Estado.</p><p>b) Los bienes y valores que constituyan su patrimonio, así como los productos y rentas del mismo.</p><p>c) Cualesquiera otros que legalmente puedan serle atribuidos.</p>`,dis:`<ul>
<li><b>39.1 — bloque normativo:</b> además de por esta ley, se rige por la <b>legislación presupuestaria</b>, la de <b>contratos del sector público</b>, la de <b>patrimonio de las Administraciones Públicas</b>, la de <b>empleo público</b> y la de <b>procedimiento administrativo común</b>.</li>
<li><b>39.2 — Estatuto:</b> el <b>Consejo de Ministros</b> aprobará por <b>real decreto</b> el Estatuto del Consejo, con su organización, estructura y funcionamiento.</li>
<li><b>39.3 — personal:</b> con carácter general, los puestos serán desempeñados por <b>funcionarios públicos</b>.</li>
<li><b>39.4 — medios:</b> se financia con las asignaciones presupuestarias, los bienes y derechos que se le adscriban y los demás ingresos que perciba.</li>
</ul>
<div class="interp"><span class="lbl">Interpretación / contexto — aportación externa</span>El texto cita normas hoy sustituidas: el <b>RDLeg 3/2011</b> de contratos (hoy <b>Ley 9/2017</b>, documento 7), la <b>Ley 7/2007</b> del Estatuto Básico del Empleado Público (hoy <b>RDLeg 5/2015</b>) y la <b>Ley 30/1992</b> (hoy <b>Leyes 39/2015 y 40/2015</b>, documentos 1 y 2).</div>`,llano:`<p>El Consejo es un organismo público más en cuanto a presupuesto, contratos, patrimonio y personal: se rige por las normas generales. Su organización interna la fija un Estatuto aprobado por real decreto, y sus puestos los ocupan funcionarios.</p>`,porque:`<p>La independencia funcional no significa excepcionalidad de régimen: someterlo a las normas comunes de gasto, contratación y empleo público es lo que evita que la autonomía se convierta en opacidad. Es coherente con el objeto de la propia ley.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> un organismo autónomo que decide con independencia pero compra y contrata como cualquier otro.</li>
<li><b>Real:</b> el Estatuto del Consejo, aprobado por real decreto, desarrolla su estructura y funcionamiento (art. 39.2).</li>
</ul>`,noej:`<ul>
<li><b>No goza</b> de un régimen contractual o de personal propio y distinto.</li>
</ul>`,conex:`<ul>
<li><b>Ley 9/2017</b> (documento 7): régimen de contratación aplicable hoy.</li>
<li><b>Leyes 39/2015 y 40/2015</b> (documentos 1 y 2): procedimiento y régimen jurídico.</li>
<li><b>Art. 44 de la Ley 1/2014 de Andalucía</b> (documento 9): régimen jurídico del Consejo andaluz.</li>
</ul>`,trampas:`<ul>
<li>El <b>Estatuto</b> lo aprueba el <b>Consejo de Ministros</b> por real decreto.</li>
<li>Los puestos se desempeñan, con carácter general, por <b>funcionarios públicos</b>.</li>
<li>Las remisiones normativas del precepto están <b>desfasadas</b>.</li>
</ul>`,ancla:`<p><b>"Independiente en el criterio, común en el régimen."</b></p>`,vis:`<svg viewBox="0 0 640 120" role="img" aria-label="Régimen jurídico del Consejo">

{n:40,t:"Relaciones con las Cortes Generales",ubic:"Título III (Consejo de Transparencia y Buen Gobierno)",idea:"El Consejo rinde cuentas ante las Cortes con una memoria anual.",literal:`<p>El Consejo de Transparencia y Buen Gobierno elevará anualmente a las Cortes Generales una memoria sobre el desarrollo de sus actividades y sobre el grado de cumplimiento de las disposiciones establecidas en esta Ley. El Presidente del Consejo de Transparencia y Buen Gobierno comparecerá ante la Comisión correspondiente para dar cuenta de tal memoria, así como cuantas veces sea requerido para ello.</p>`,dis:`<ul>
<li><b>Obligación:</b> el Consejo <b>elevará anualmente a las Cortes Generales</b> una <b>memoria</b> sobre el desarrollo de sus actividades y sobre el <b>grado de cumplimiento</b> de las disposiciones establecidas en esta ley.</li>
</ul>`,llano:`<p>Quien vigila también rinde cuentas: cada año el Consejo presenta ante las Cortes una memoria de lo que ha hecho y de cómo se está cumpliendo la ley.</p>`,porque:`<p>Cierra el círculo institucional: el organismo independiente no responde ante el Gobierno —lo que comprometería su autonomía— sino ante el <b>Parlamento</b>. Y la memoria, al ser pública, convierte el cumplimiento de la ley en un asunto de debate político.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> el informe anual que presenta un auditor ante la junta general.</li>
<li><b>Real:</b> la memoria incluye datos de reclamaciones resueltas y de cumplimiento de la publicidad activa (art. 38.d).</li>
</ul>`,noej:`<ul>
<li><b>No se eleva</b> al Gobierno, sino a las <b>Cortes Generales</b>.</li>
</ul>`,conex:`<ul>
<li><b>Art. 38.d) LTBG:</b> función de evaluar el grado de aplicación de la ley.</li>
<li><b>Art. 33 LTBG:</b> autonomía e independencia.</li>
</ul>`,trampas:`<ul>
<li>La memoria es <b>anual</b> y se eleva a las <b>Cortes Generales</b>.</li>
</ul>`,ancla:`<p><b>"Vigila el Consejo; y al Consejo lo vigilan las Cortes."</b></p>`,vis:`<svg viewBox="0 0 640 105" role="img" aria-label="Relaciones con las Cortes Generales">
<defs><marker id="m2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="var(--acc)"/></marker></defs>

<script>
const PLAZOS=[["5 años", "Duración del mandato del Presidente del Consejo", "Presidente", "37.1 L19/2013", "No renovable"], ["5-3-1 años", "Prescripción de las infracciones muy graves, graves y leves", "Infractores", "32.1 L19/2013", "Mismos plazos para las sanciones"], ["5 a 10 años", "Prohibición de ser nombrado alto cargo tras infracción muy grave", "Sancionado", "30.4 L19/2013", "Además de la destitución"], ["Anual", "Memoria del Consejo a las Cortes Generales", "Consejo", "40 L19/2013", "Sobre actividades y grado de cumplimiento"], ["Amonestación", "Sanción de las infracciones leves", "Sancionado", "30.1 L19/2013", "Escalón más bajo"], ["Publicación en boletín", "Sanción de las infracciones graves", "Sancionado", "30.2.a) L19/2013", "Declaración del incumplimiento"], ["Sin indemnización", "Pérdida de la indemnización por cese en infracciones graves", "Sancionado", "30.2.b) L19/2013", "Si la llevara aparejada"], ["De oficio", "Forma de inicio del procedimiento sancionador", "Órgano competente", "31.1 L19/2013", "También por denuncia ciudadana"], ["Junta de Gobierno", "Órgano local expresamente incluido en el ámbito del buen gobierno", "Altos cargos locales", "25.2 L19/2013", "Miembros de las Juntas de Gobierno"], ["Mayoría absoluta", "Refrendo del Congreso al nombramiento del Presidente", "Congreso", "37.1 L19/2013", "Previa comparecencia"]];
const FLASH=[["¿A quién se aplica el Título II de buen gobierno?", "A los miembros del Gobierno, Secretarios de Estado y altos cargos estatales, y a los altos cargos autonómicos y locales, <b>incluidos los miembros de las Juntas de Gobierno de las Entidades Locales</b> (art. 25)."], ["¿Afecta la aplicación del Título II a la condición de cargo electo?", "No: <b>en ningún caso</b> (art. 25.3)."], ["Cita cuatro principios generales de buen gobierno", "Transparencia con eficacia, economía y eficiencia · dedicación al servicio público · imparcialidad · igualdad y no discriminación · diligencia · conducta digna · asunción de responsabilidad (art. 26.2.a)."], ["Cita tres principios de actuación", "Plena dedicación con respeto a incompatibilidades · <b>debida reserva</b> sobre lo conocido por el cargo · <b>comunicar</b> a los órganos competentes cualquier actuación irregular (art. 26.2.b)."], ["¿Cómo se sanciona el incumplimiento de las incompatibilidades?", "Conforme a la <b>normativa en materia de conflictos de intereses</b> (art. 27)."], ["Cita tres infracciones muy graves de gestión económico-presupuestaria", "Incursión en alcance · compromisos de gasto sin crédito suficiente · omisión de la intervención previa o del procedimiento de discrepancias · operaciones de crédito sin autorización (art. 28)."], ["Cita tres infracciones disciplinarias muy graves", "Incumplir el deber de respeto a la Constitución · discriminación · acuerdos manifiestamente ilegales con perjuicio grave · uso indebido de información del cargo · prevalencia del cargo para obtener beneficio (art. 29.1)."], ["¿Qué sanción corresponde a las infracciones leves?", "<b>Amonestación</b> (art. 30.1)."], ["¿Y a las graves?", "Declaración del incumplimiento y su <b>publicación</b> en el boletín oficial, y <b>no percepción de la indemnización</b> por cese (art. 30.2)."], ["¿Qué añaden las muy graves?", "<b>Destitución</b> del cargo, salvo cese previo, y prohibición de ser nombrado alto cargo durante <b>cinco a diez años</b> (art. 30.4)."], ["¿Cómo se inicia el procedimiento sancionador?", "<b>Siempre de oficio</b>, por iniciativa propia, orden superior, petición razonada o denuncia de los ciudadanos (art. 31.1)."], ["¿Quién instruye en el ámbito estatal?", "La <b>Oficina de Conflictos de Intereses</b> (art. 31.3)."], ["¿Y en el ámbito local?", "Los órganos que tengan atribuidas esas funciones conforme al <b>régimen disciplinario propio</b> (art. 31.2.c y 31.4.c)."], ["Plazos de prescripción de las infracciones", "<b>5 años</b> las muy graves, <b>3</b> las graves y <b>1</b> las leves; los mismos plazos para las sanciones (art. 32)."], ["¿Qué naturaleza tiene el Consejo de Transparencia y Buen Gobierno?", "Organismo público con <b>personalidad jurídica propia</b> que actúa con <b>autonomía y plena independencia</b> (art. 33)."], ["Los cuatro fines del Consejo", "<b>Promover</b> la transparencia · <b>velar</b> por el cumplimiento de la publicidad · <b>salvaguardar</b> el derecho de acceso · <b>garantizar</b> el buen gobierno (art. 34)."], ["¿Por qué órganos está compuesto el Consejo?", "La <b>Comisión</b> de Transparencia y Buen Gobierno y el <b>Presidente</b>, que lo es también de la Comisión (art. 35)."], ["¿Quiénes integran la Comisión?", "El Presidente, un Diputado, un Senador y representantes del <b>Tribunal de Cuentas</b>, el <b>Defensor del Pueblo</b>, la <b>AEPD</b> y la Administración (art. 36)."], ["Mandato del Presidente del Consejo", "<b>Cinco años no renovables</b>, por real decreto, previa comparecencia y refrendo del Congreso (art. 37)."], ["Cita cuatro funciones del Consejo", "Recomendaciones · asesoramiento · <b>informe preceptivo</b> de proyectos normativos estatales · <b>evaluación</b> con memoria anual · formación · colaboración (art. 38)."], ["¿A quién eleva el Consejo su memoria anual?", "A las <b>Cortes Generales</b> (art. 40)."]];
const TEST=[{"a": 25, "q": "El Título II sobre buen gobierno se aplica en el ámbito local a:", "o": [["los altos cargos o asimilados, incluidos los miembros de las Juntas de Gobierno de las Entidades Locales", 1, "Correcto: art. 25.2, con mención expresa."], ["todos los empleados públicos municipales", 0, "Tienen su propio régimen disciplinario."], ["únicamente al alcalde", 0, "Alcanza a los altos cargos o asimilados y a la Junta de Gobierno."], ["a nadie: es un título de aplicación estatal", 0, "El art. 25.2 lo extiende al ámbito autonómico y local."]]}, {"a": 25, "q": "La aplicación del Título II puede hacer perder la condición de cargo electo.", "vf": true, "ok": false, "fb": "<b>Falso.</b> El art. 25.3 dispone que no afectará <b>en ningún caso</b> a la condición de cargo electo."}, {"a": 26, "q": "¿Cuál es un principio de actuación del art. 26.2.b)?", "o": [["poner en conocimiento de los órganos competentes cualquier actuación irregular de la que se tenga conocimiento", 1, "Correcto: art. 26.2.b)."], ["actuar con imparcialidad", 0, "Es un principio general (26.2.a)."], ["asumir la responsabilidad de las decisiones propias", 0, "Es un principio general."], ["mantener una conducta digna", 0, "Es un principio general."]]}, {"a": 27, "q": "El incumplimiento de las normas de incompatibilidades se sanciona:", "o": [["conforme a la normativa en materia de conflictos de intereses", 1, "Correcto: art. 27, artículo de remisión."], ["como infracción muy grave del art. 28", 0, "El art. 28 se refiere a la gestión económico-presupuestaria."], ["como infracción leve", 0, "No lo tipifica esta ley."], ["no está sancionado", 0, "Sí lo está, por su normativa específica."]]}, {"a": 28, "q": "¿Cuál de estas es infracción muy grave en materia de gestión económico-presupuestaria?", "o": [["la omisión del trámite de intervención previa cuando resulte preceptiva", 1, "Correcto: art. 28.d), que enlaza con los arts. 214 a 218 del TRLHL."], ["la incorrección con los ciudadanos", 0, "Es infracción disciplinaria leve (art. 29.3)."], ["el abuso de autoridad", 0, "Es infracción disciplinaria grave (art. 29.2)."], ["la falta de publicación del organigrama", 0, "Es incumplimiento de publicidad activa (art. 9.3)."]]}, {"a": 28, "q": "Completa: «Los compromisos de gastos, reconocimiento de obligaciones y ordenación de pagos sin ______ suficiente para realizarlos» constituyen infracción muy grave.", "gap": "crédito", "fb": "Sin <b>crédito</b> suficiente (art. 28.c), en línea con el art. 173.5 del TRLHL, que declara nulos de pleno derecho esos actos."}, {"a": 29, "q": "La adopción de acuerdos manifiestamente ilegales que causen perjuicio grave a la Administración o a los ciudadanos es infracción:", "o": [["muy grave", 1, "Correcto: art. 29.1.c)."], ["grave", 0, "La ley la califica como muy grave."], ["leve", 0, "No."], ["no está tipificada", 0, "Sí lo está."]]}, {"a": 30, "q": "La sanción prevista para las infracciones leves es:", "o": [["la amonestación", 1, "Correcto: art. 30.1."], ["la destitución del cargo", 0, "Es sanción de las muy graves."], ["la publicación del incumplimiento", 0, "Es sanción de las graves."], ["una multa de hasta 30.000 euros", 0, "Este régimen no contempla multas."]]}, {"a": 30, "q": "Los sancionados por infracción muy grave no podrán ser nombrados altos cargos durante un periodo de:", "o": [["entre cinco y diez años", 1, "Correcto: art. 30.4, además de la destitución."], ["entre uno y tres años", 0, "No es el periodo legal."], ["diez años fijos", 0, "La ley fija una horquilla."], ["de por vida", 0, "No es la consecuencia prevista."]]}, {"a": 31, "q": "El procedimiento sancionador en materia de buen gobierno se inicia:", "o": [["siempre de oficio, aunque medie denuncia de los ciudadanos", 1, "Correcto: art. 31.1."], ["a instancia del denunciante", 0, "La denuncia no inicia el procedimiento por sí sola."], ["por acuerdo del Consejo de Transparencia", 0, "No es el órgano competente para incoar."], ["por resolución del Tribunal de Cuentas", 0, "Al Tribunal se le da conocimiento de los hechos."]]}, {"a": 31, "q": "En el ámbito estatal, la instrucción de estos procedimientos corresponde a:", "o": [["la Oficina de Conflictos de Intereses", 1, "Correcto: art. 31.3."], ["el Consejo de Transparencia y Buen Gobierno", 0, "No instruye procedimientos sancionadores de buen gobierno."], ["el Tribunal de Cuentas", 0, "Su ámbito es la responsabilidad contable."], ["la Abogacía del Estado", 0, "No es el órgano previsto."]]}, {"a": 32, "q": "Las infracciones graves prescriben a los:", "o": [["tres años", 1, "Correcto: art. 32.1. Cinco las muy graves y uno las leves."], ["cinco años", 0, "Ese es el plazo de las muy graves."], ["un año", 0, "Ese es el plazo de las leves."], ["cuatro años", 0, "No es plazo de esta ley."]]}, {"a": 33, "q": "El Consejo de Transparencia y Buen Gobierno:", "o": [["tiene personalidad jurídica propia y actúa con autonomía y plena independencia", 1, "Correcto: art. 33."], ["es un órgano del Ministerio sin personalidad propia", 0, "La tiene propia."], ["depende funcionalmente del Consejo de Ministros", 0, "Actúa con plena independencia."], ["es un órgano de las Cortes Generales", 0, "Es un organismo público."]]}, {"a": 34, "q": "¿Cuál NO es un fin del Consejo?", "o": [["ejercer la potestad sancionadora en materia de buen gobierno", 1, "Correcto: la potestad sancionadora corresponde a los órganos del art. 31."], ["promover la transparencia de la actividad pública", 0, "Sí lo es."], ["velar por el cumplimiento de las obligaciones de publicidad", 0, "Sí lo es."], ["salvaguardar el ejercicio del derecho de acceso", 0, "Sí lo es."]]}, {"a": 36, "q": "Forman parte de la Comisión de Transparencia y Buen Gobierno, entre otros:", "o": [["un Diputado, un Senador y representantes del Tribunal de Cuentas, el Defensor del Pueblo y la AEPD", 1, "Correcto: art. 36.2."], ["un representante de cada comunidad autónoma", 0, "No está previsto."], ["dos magistrados del Tribunal Supremo", 0, "No forman parte."], ["únicamente el Presidente", 0, "La Comisión es un órgano colegiado."]]}, {"a": 37, "q": "El Presidente del Consejo es nombrado por un período:", "o": [["no renovable de cinco años", 1, "Correcto: art. 37.1, previa comparecencia y refrendo del Congreso."], ["renovable de cuatro años", 0, "Ni el plazo ni la renovabilidad son correctos."], ["indefinido hasta su cese", 0, "El mandato es temporal."], ["de seis años renovable una vez", 0, "No es el régimen legal."]]}, {"a": 38, "q": "Entre las funciones del Consejo figura:", "o": [["informar preceptivamente los proyectos normativos de carácter estatal que desarrollen esta ley", 1, "Correcto: art. 38.1.c)."], ["aprobar el Estatuto del propio Consejo", 0, "Lo aprueba el Consejo de Ministros por real decreto (art. 39.2)."], ["sancionar a los altos cargos", 0, "No es competencia suya."], ["nombrar a su Presidente", 0, "Se nombra por real decreto."]]}, {"a": 39, "q": "Completa: «El Consejo de Ministros aprobará mediante ______ el Estatuto del Consejo de Transparencia y Buen Gobierno».", "gap": "Real Decreto", "fb": "Mediante <b>real decreto</b> (art. 39.2), donde se establece su organización, estructura y funcionamiento."}, {"a": 40, "q": "El Consejo eleva anualmente una memoria sobre sus actividades y el grado de cumplimiento de la ley a:", "o": [["las Cortes Generales", 1, "Correcto: art. 40."], ["el Consejo de Ministros", 0, "Comprometería su independencia."], ["el Defensor del Pueblo", 0, "A este se le comunican las resoluciones del art. 24."], ["el Tribunal de Cuentas", 0, "No es el destinatario de la memoria."]]}, {"a": 30, "q": "El régimen sancionador de buen gobierno prevé multas económicas como sanción principal.", "vf": true, "ok": false, "fb": "<b>Falso.</b> Las sanciones son amonestación, declaración y publicación del incumplimiento, pérdida de la indemnización por cese, destitución e inhabilitación para ser alto cargo."}];
const CASOS=[{"t": "Caso 1 · Del reparo a la sanción", "e": "El interventor de un ayuntamiento formula reparo suspensivo por insuficiencia de crédito. El concejal delegado de Hacienda, miembro de la Junta de Gobierno Local, ordena continuar el expediente sin tramitar la discrepancia y se reconocen obligaciones por 180.000 €. <b>Analiza las consecuencias con las dos leyes.</b>", "s": "<p><b>1) En el plano presupuestario (TRLHL, documento 5).</b> El reparo por insuficiencia de crédito <b>suspende</b> la tramitación (art. 216.2.a) y la discrepancia debe resolverla el <b>Pleno</b>, no el presidente (art. 217.2.a). Los acuerdos que comprometen gasto sin crédito son <b>nulos de pleno derecho</b> (art. 173.5) y generan responsabilidad personal (art. 188).</p><p><b>2) En el plano del buen gobierno (Ley 19/2013).</b> La conducta encaja en el art. <b>28.c)</b> —reconocimiento de obligaciones sin crédito suficiente— y en el art. <b>28.d)</b> —omisión del procedimiento de resolución de discrepancias frente a reparos suspensivos—: <b>infracciones muy graves</b> si son culpables.</p><p><b>3) Ámbito subjetivo.</b> El concejal, como miembro de la <b>Junta de Gobierno Local</b>, está incluido en el Título II (art. 25.2), sin que ello afecte a su condición de cargo electo (art. 25.3).</p><p><b>4) Sanciones.</b> Declaración y publicación del incumplimiento, pérdida de la indemnización por cese, <b>destitución</b> del cargo y prohibición de ser nombrado alto cargo de <b>cinco a diez años</b> (art. 30).</p><p><b>5) Procedimiento.</b> De oficio, incoado e instruido por los órganos del régimen disciplinario propio de la entidad (art. 31.2.c y 31.3), con <b>comunicación al Tribunal de Cuentas</b> por si procede responsabilidad contable (art. 31.1). Prescripción: <b>cinco años</b> (art. 32).</p>"}, {"t": "Caso 2 · Calificar conductas", "e": "Clasifica estas conductas de altos cargos: <b>(a)</b> filtrar a un medio la propuesta de adjudicación antes de su publicación; <b>(b)</b> contestar con desconsideración grave a un ciudadano en una reunión; <b>(c)</b> llegar tarde reiteradamente a las reuniones y descuidar tareas menores; <b>(d)</b> usar el cargo para conseguir un empleo a un familiar; <b>(e)</b> ejercer una actividad privada incompatible.", "s": "<p><b>(a) Muy grave</b> — art. 29.1.d): publicación o utilización indebida de documentación o información conocida por razón del cargo.</p><p><b>(b) Grave</b> — art. 29.2: grave desconsideración con los ciudadanos.</p><p><b>(c) Leve</b> — art. 29.3: descuido o negligencia en el ejercicio de las funciones.</p><p><b>(d) Muy grave</b> — art. 29.1.h): prevalencia de la condición de alto cargo para obtener un beneficio indebido para sí o para otro.</p><p><b>(e) Fuera de este régimen</b> — art. 27: se sanciona conforme a la <b>normativa de conflictos de intereses</b>, no por los arts. 28 o 29.</p><p><b>Consecuencias:</b> (a) y (d) llevan aparejadas destitución e inhabilitación de cinco a diez años; (b), publicación del incumplimiento y pérdida de la indemnización por cese; (c), amonestación. Prescripción: <b>5-3-1</b> años (art. 32).</p>"}, {"t": "Caso 3 · ¿Quién resuelve qué?", "e": "Ordena estas actuaciones indicando el órgano competente: <b>(1)</b> una reclamación por denegación de acceso de un ayuntamiento andaluz; <b>(2)</b> el control del cumplimiento de la publicidad activa de un ministerio; <b>(3)</b> la sanción a un alto cargo municipal; <b>(4)</b> el informe sobre un proyecto de reglamento estatal de desarrollo de la ley; <b>(5)</b> la memoria anual de aplicación de la ley.", "s": "<p><b>(1) Consejo de Transparencia y Protección de Datos de Andalucía</b>, por la vía del art. 24.6 de la Ley 19/2013 y del art. 33 de la Ley 1/2014 (documento 9). No el Consejo estatal.</p><p><b>(2) Consejo de Transparencia y Buen Gobierno</b> — art. 9.1: el control de la publicidad activa de la <b>AGE</b> le corresponde, y puede dictar resoluciones instando el cese del incumplimiento (art. 9.2).</p><p><b>(3) Los órganos del régimen disciplinario propio</b> de la entidad local — arts. 31.2.c) y 31.4.c). Ni el Consejo ni el Ministerio.</p><p><b>(4) Consejo de Transparencia y Buen Gobierno</b> — art. 38.1.c): informe <b>preceptivo</b> de los proyectos normativos <b>estatales</b>.</p><p><b>(5) Consejo de Transparencia y Buen Gobierno</b>, que la eleva a las <b>Cortes Generales</b> — arts. 38.1.d) y 40.</p><p><b>Regla que se extrae:</b> el Consejo <b>controla, informa, evalúa y resuelve reclamaciones</b>; <b>no sanciona</b> a los altos cargos. Y en Andalucía, las reclamaciones de acceso las resuelve el <b>Consejo autonómico</b>.</p>"}];

const INTRO_HTML="<section class=\"card\" id=\"intro\"><h2>Tema 13 · Bloque 3 · Buen gobierno y Consejo de Transparencia</h2><p class=\"small\">Tercer bloque de la Ley 19/2013: el Título II, que impone principios de conducta a los altos cargos y tipifica infracciones y sanciones, y el Título III, que crea el organismo independiente encargado de velar por toda la ley.</p><div class=\"box ej\"><span class=\"lbl\">La idea que ordena el bloque</span>Los dos títulos responden a la misma pregunta: <b>¿qué pasa si no se cumple?</b> El Título II responde con <b>responsabilidad personal</b> del cargo —infracciones y sanciones— y el Título III con un <b>garante independiente</b> que controla, informa, evalúa y resuelve reclamaciones.</div><div class=\"box warn\"><span class=\"lbl\">Fuentes utilizadas y vigencia</span><ul><li><b>Ley 19/2013</b>, texto consolidado con <b>última modificación de 9 de julio de 2022</b>.</li><li>Concordancias con el <b>TRLHL</b> (documento 5), muy estrechas en el art. 28, y con la <b>Ley 40/2015</b> (documento 2) en materia sancionadora.</li><li><b>Citas desfasadas:</b> el art. 30.5 remite al art. 131.3 y el art. 32.3 al art. 132 de la <b>Ley 30/1992</b>; hoy son los <b>arts. 29 y 30 de la Ley 40/2015</b>. El art. 39 cita el RDLeg 3/2011 de contratos (hoy <b>Ley 9/2017</b>) y la Ley 7/2007 del EBEP (hoy <b>RDLeg 5/2015</b>).</li><li><b>Aportación externa</b>: la <b>Ley 3/2015</b> del ejercicio del alto cargo y la <b>LO 2/2012</b> de estabilidad, citadas por los arts. 27 y 28.h). Verifícalas en el BOE.</li></ul></div><svg viewBox=\"0 0 660 200\" role=\"img\" aria-label=\"Mapa conceptual del bloque 3\"><rect x=\"205\" y=\"8\" width=\"250\" height=\"36\" rx=\"9\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"330\" y=\"31\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"#fff\">¿Y SI NO SE CUMPLE?</text><line x1=\"330\" y1=\"44\" x2=\"330\" y2=\"60\" stroke=\"var(--acc)\" stroke-width=\"2\"/><line x1=\"180\" y1=\"60\" x2=\"480\" y2=\"60\" stroke=\"var(--acc)\" stroke-width=\"2\"/><line x1=\"180\" y1=\"60\" x2=\"180\" y2=\"78\" stroke=\"var(--acc)\" stroke-width=\"2\"/><line x1=\"480\" y1=\"60\" x2=\"480\" y2=\"78\" stroke=\"var(--acc)\" stroke-width=\"2\"/><rect x=\"35\" y=\"78\" width=\"290\" height=\"112\" rx=\"9\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"180\" y=\"100\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"var(--exc)\">TÍTULO II · BUEN GOBIERNO</text><text x=\"180\" y=\"124\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">25 · altos cargos y Juntas de Gobierno</text><text x=\"180\" y=\"146\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">26 · principios · 27 a 29 · infracciones</text><text x=\"180\" y=\"168\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">30 a 32 · sanciones, procedimiento y prescripción</text><rect x=\"345\" y=\"78\" width=\"290\" height=\"112\" rx=\"9\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"490\" y=\"100\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"var(--ej)\">TÍTULO III · EL CONSEJO</text><text x=\"490\" y=\"124\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">33 y 34 · naturaleza y fines</text><text x=\"490\" y=\"146\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">35 a 37 · órganos y Presidente</text><text x=\"490\" y=\"168\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">38 a 40 · funciones, régimen y memoria</text></svg></section>";
const RESUMEN_HTML="<section class=\"card\" id=\"resumen\"><h2>Resumen ejecutivo</h2><p class=\"small\"><b>Norma:</b> Ley 19/2013, Títulos II y III (arts. 25 a 40).</p><table><tbody><tr><th style=\"width:60px\">25</th><td>Altos cargos estatales, autonómicos y locales, <b>incluidas las Juntas de Gobierno locales</b>. No afecta a la condición de <b>cargo electo</b>.</td></tr><tr><th>26</th><td>Principios <b>generales</b> (transparencia, dedicación, imparcialidad, igualdad, diligencia, dignidad, responsabilidad) y <b>de actuación</b> (incompatibilidades, reserva, comunicar irregularidades).</td></tr><tr><th>27-29</th><td>Incompatibilidades: por su <b>normativa específica</b>. Infracciones <b>muy graves</b> de gestión económica (sin crédito, sin intervención previa, sin autorización de crédito) e infracciones <b>disciplinarias</b> muy graves, graves y leves.</td></tr><tr><th>30</th><td>Leve: <b>amonestación</b>. Grave: <b>declaración y publicación</b> + pérdida de indemnización. Muy grave: además, <b>destitución</b> e inhabilitación de <b>5 a 10 años</b>.</td></tr><tr><th>31-32</th><td>Inicio <b>de oficio</b>; instrucción estatal por la <b>Oficina de Conflictos de Intereses</b> y, en lo local, por el régimen disciplinario propio. Aviso al <b>Tribunal de Cuentas</b>. Prescripción <b>5-3-1</b>.</td></tr><tr><th>33-35</th><td>Consejo con <b>personalidad propia</b>, <b>autonomía y plena independencia</b>. Fines: promover, velar, salvaguardar y garantizar. Órganos: <b>Comisión</b> y <b>Presidente</b>.</td></tr><tr><th>36-37</th><td>Comisión con Diputado, Senador, Tribunal de Cuentas, Defensor del Pueblo, AEPD y Administración. Presidente: <b>cinco años no renovables</b>, con refrendo del Congreso.</td></tr><tr><th>38-40</th><td>Funciones: recomendaciones, asesoramiento, <b>informe preceptivo</b> de proyectos estatales, <b>evaluación</b>, formación y colaboración. Estatuto por <b>real decreto</b>. <b>Memoria anual</b> a las Cortes Generales.</td></tr></tbody></table><h2 style (function(){

function load(k,f){try{var v=localStorage.getItem(k);return v?JSON.parse(v):f;}catch(e){return f;}}

/* Reveal on scroll para las tarjetas */
function reveal(){
  var els=document.querySelectorAll("section.card:not(.rv)");
  if(!els.length)return;
  if(!("IntersectionObserver" in window)){return;}
  var io=new IntersectionObserver(function(es){
    es.forEach(function(en){if(en.isIntersecting){en.target.classList.add("in");io.unobserve(en.target);}});
  },{threshold:.06,rootMargin:"0px 0px -30px 0px"});
  Array.prototype.forEach.call(els,function(el){el.classList.add("rv");io.observe(el);});
}

/* Sección activa en el índice lateral */
function spy(){
  var links=document.querySelectorAll("nav.side a[href^='#']");
  if(!links.length||!("IntersectionObserver" in window))return;
  var map={};
  Array.prototype.forEach.call(links,function(a){
    var t=document.getElementById(a.getAttribute("href").slice(1));
    if(t)map[t.id]=a;
  });
  var io=new IntersectionObserver(function(es){
    es.forEach(function(en){
      if(en.isIntersecting){
        Array.prototype.forEach.call(links,function(a){a.classList.remove("on");});
        if(map[en.target.id])map[en.target.id].classList.add("on");
      }
    });
  },{rootMargin:"-80px 0px -70% 0px",threshold:0});
  Object.keys(map).forEach(function(id){io.observe(document.getElementById(id));});
}

document.addEventListener("click",function(e){

  var r=b.getBoundingClientRect(),d=Math.max(r.width,r.height),s=document.createElement("span");
  s.className="ripple";s.style.width=s.style.height=d+"px";
  s.style.left=(e.clientX-r.left-d/2)+"px";s.style.top=(e.clientY-r.top-d/2)+"px";

});

/* ═══ Parser de respuestas: estructura semántica ═══ */
var FCFMT=(function(){
  var CITA=/\s*\(((?:arts?\.|DA\b|DT\b|disp\.)[^)]*)\)\s*\.?\s*$/i;
  var strip=function(h){return h.replace(/<[^>]+>/g,"");};

  function esc(s){return s;}

  function parse(raw){
    var out={verdict:null,cite:null,kind:"p",items:[],text:""};
    var body=String(raw).trim();

    /* 1 ── Cita legal al final */
    var m=body.match(CITA);
    if(m){out.cite=m[1].replace(/\s+/g," ").trim();body=body.slice(0,m.index).trim();}
    body=body.replace(/[.;,\s]+$/,"");

    /* 2 ── Veredicto Sí / No inicial */
    var v=strip(body).match(/^(Sí|Sí,|No|No,)[.:,]?\s/);
    if(v){
      out.verdict=/^Sí/.test(v[1])?"si":"no";
      body=body.replace(/^(<[^>]+>\s*)*(Sí|No)[.,:]?\s*/,"").trim();
      body=body.replace(/^en\s/,"En ");
    }

    /* 3 ── Enumeración con · */
    var parts=body.split(/\s+·\s+/);
    if(parts.length>=2){
      out.kind="list";
      var letras=parts.filter(function(p){return /^\s*<?[a-h]\)/.test(strip(p));}).length;
      out.marker = letras>=parts.length-1 ? "alpha" : "num";
      out.items=parts.map(function(p){
        return p.replace(/^\s*[a-h]\)\s*/,"").replace(/[.\s]+$/,"").trim();
      }).filter(Boolean);
      return out;
    }

    /* 4 ── Cláusulas contrapuestas con ; */
    var semi=body.split(/;\s+/);
    if(semi.length>=2&&semi.length<=3&&semi.every(function(s){return strip(s).length>14;})){
      out.kind="clauses";
      out.items=semi.map(function(s){return s.replace(/[.\s]+$/,"").trim();});
      return out;
    }

    /* 5 ── Párrafo */
    out.text=body;
    return out;
  }

  function render(raw){
    var d=parse(raw),h="";

    if(d.verdict){
      h+='<span class="fc-verdict '+d.verdict+'">'+(d.verdict==="si"?"✓ Sí":"✗ No")+'</span>';
    }

    if(d.kind==="list"){
      h+='<ol class="fc-list '+d.marker+'">';
      d.items.forEach(function(it){h+='<li>'+it+'</li>';});
      h+='</ol>';
    }else if(d.kind==="clauses"){
      h+='<div class="fc-clauses">';
      d.items.forEach(function(it){h+='<p>'+it+'</p>';});
      h+='</div>';
    }else if(d.text){
      h+='<p class="fc-p">'+d.text+'</p>';
    }

    if(d.cite){
      h+='<span class="fc-cite"><span class="s">§</span>'+d.cite+'</span>';
    }
    return {html:h,struct:(d.kind!=="p"||!!d.verdict||strip(raw).length>150)};
  }
  return {parse:parse,render:render};
})();

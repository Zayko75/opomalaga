<script>
const GLOSARIO={
 "presupuesto":"Documento contable y jurídico, aprobado por el Pleno, que fija el techo de gasto de un ejercicio y estima los ingresos con los que se financia. Ej.: el presupuesto de Utrera para 2026 autoriza gastar como máximo 78 M€.",
 "credito":"Crédito presupuestario: la cantidad máxima de dinero autorizada para una finalidad concreta. Ej.: 120.000 € en la aplicación de 'mantenimiento de colegios'.",
 "obligacion":"Obligación reconocida: la deuda que el Ayuntamiento admite formalmente que debe pagar, una vez comprobado que el servicio o suministro se ha prestado. Ej.: aprobada la factura del proveedor, nace la obligación.",
 "derecho":"Derecho liquidado: el importe concreto que un tercero debe a la entidad local, una vez cuantificado. Ej.: liquidado el IBI de un inmueble en 340 €, ese es el derecho.",
 "oa":"Organismo autónomo: ente con personalidad jurídica propia creado por la entidad local para gestionar un servicio (patronatos de deportes, de cultura, gerencias de urbanismo). Depende del Ayuntamiento pero tiene su propio presupuesto.",
 "sociedad":"Sociedad mercantil local: empresa con forma de S.A. o S.L. cuyo capital pertenece a la entidad local (p. ej. la empresa municipal de aguas). No aprueba 'presupuesto', sino estados de previsión de gastos e ingresos.",
 "bases":"Bases de ejecución: el 'reglamento de uso' del presupuesto. Adaptan las normas presupuestarias generales a la organización concreta de la entidad. Ej.: fijan qué órgano autoriza gastos de hasta 3.000 €.",
 "estabilidad":"Estabilidad presupuestaria: exigencia de que las cuentas públicas no incurran en déficit estructural. Ej.: un ayuntamiento no puede presupuestar más gasto no financiero que ingresos no financieros.",
 "afectacion":"No afectación: regla general de que todos los ingresos financian todo el gasto, sin que un ingreso concreto quede reservado a un gasto concreto. Ej.: lo recaudado por el IBI no está reservado a pagar el alumbrado.",
 "bruto":"Principio de presupuesto bruto (o de integridad): derechos y obligaciones se anotan por su importe total, sin compensar unos con otros. Ej.: no se puede anotar la subvención 'ya descontados' los gastos del programa.",
 "nivelacion":"Nivelación presupuestaria: que el total de ingresos previstos cubra el total de gastos autorizados; es decir, aprobar sin déficit inicial.",
 "aplicacion":"Aplicación presupuestaria: la 'casilla' exacta donde vive cada euro de gasto, formada al cruzar la clasificación por programas con la económica. Ej.: 323/22103 (funcionamiento de centros docentes / combustibles).",
 "vinculacion":"Nivel de vinculación jurídica: el nivel de agregación en el que el crédito es realmente limitativo; por debajo de él se puede mover el gasto sin tramitar una modificación de crédito (art. 172 TRLHL).",
 "intervencion":"Intervención: el órgano de control interno de la entidad local, con función de fiscalización previa del gasto y de informe preceptivo del presupuesto. Lo desempeña un funcionario de habilitación nacional.",
 "pleno":"Pleno: órgano colegiado formado por todos los concejales o diputados. Es el único competente para aprobar el presupuesto.",
 "bop":"Boletín Oficial de la Provincia: diario oficial donde las entidades locales publican sus anuncios y acuerdos con efectos frente a terceros.",
 "prorroga":"Prórroga presupuestaria: si el 1 de enero no ha entrado en vigor el presupuesto nuevo, sigue rigiendo automáticamente el anterior con sus créditos iniciales.",
 "interesado":"Interesado: quien está legitimado para intervenir en un procedimiento. En el presupuesto, la ley define expresamente quiénes lo son (art. 170.1).",
 "liquidacion":"Liquidación del presupuesto: cierre contable del ejercicio, que determina los derechos y obligaciones pendientes, el remanente de tesorería y el resultado presupuestario.",
 "tcuentas":"Tribunal de Cuentas: órgano fiscalizador externo de las cuentas y la gestión económica del sector público, dependiente de las Cortes Generales.",
 "conten":"Recurso contencioso-administrativo: impugnación ante los juzgados y tribunales de lo contencioso-administrativo, es decir, ya fuera de la propia Administración.",
 "buengob":"Buen gobierno: conjunto de principios y obligaciones de conducta exigibles a los altos cargos, cuyo incumplimiento genera responsabilidad sancionadora (Título II de la Ley 19/2013).","conflicto":"Conflicto de intereses: situación en que el interés particular del cargo puede influir en el ejercicio imparcial de sus funciones. Su régimen sancionador es el de la normativa específica de incompatibilidades.","alcance":"Alcance: saldo deudor injustificado en la administración de fondos públicos. Su incursión culpable es infracción muy grave en materia de gestión económico-presupuestaria.","reparosusp":"Reparo suspensivo: el que formula la Intervención y paraliza el expediente hasta que se resuelva la discrepancia. Omitir ese procedimiento es infracción muy grave.","oficinaci":"Oficina de Conflictos de Intereses: órgano estatal que instruye los procedimientos sancionadores contra miembros del Gobierno, Secretarios de Estado y altos cargos de la AGE.","destitucion":"Destitución: sanción propia de las infracciones muy graves, acompañada de la imposibilidad de ser nombrado alto cargo durante un periodo de entre cinco y diez años.","consejo":"Consejo de Transparencia y Buen Gobierno: organismo público con personalidad jurídica propia que actúa con autonomía y plena independencia para promover la transparencia y resolver las reclamaciones de acceso.","comision":"Comisión de Transparencia y Buen Gobierno: órgano colegiado del Consejo, presidido por su Presidente e integrado por representantes de las Cortes y de otros organismos.","memoria":"Memoria anual: documento en el que el Consejo evalúa el grado de aplicación de la ley y que eleva a las Cortes Generales.","responsabilidadcont":"Responsabilidad contable: la que se exige ante el Tribunal de Cuentas a quien causa un menoscabo en los fondos públicos. Es compatible con la responsabilidad sancionadora de esta ley.","prescripcion":"Prescripción: extinción por el transcurso del tiempo de la posibilidad de sancionar una infracción o de ejecutar una sanción.","amonestacion":"Amonestación: sanción prevista para las infracciones leves de buen gobierno."
};
const ARTS=[{n:25,t:"Ámbito de aplicación",ubic:"Título II (Buen gobierno)",idea:"El buen gobierno se aplica a los altos cargos, incluidas las Juntas de Gobierno locales.",literal:`<p>1. En el ámbito de la Administración General del Estado las disposiciones de este título se aplicarán a los miembros del Gobierno, a los Secretarios de Estado y al resto de los altos cargos de la Administración General del Estado y de las entidades del sector público estatal, de Derecho público o privado, vinculadas o dependientes de aquella.</p><p>A estos efectos, se considerarán altos cargos los que tengan tal consideración en aplicación de la normativa en materia de conflictos de intereses.</p><p>2. Este título será de aplicación a los altos cargos o asimilados que, de acuerdo con la normativa autonómica o local que sea de aplicación, tengan tal consideración, incluidos los miembros de las Juntas de Gobierno de las Entidades Locales.</p><p>3. La aplicación a los sujetos mencionados en los apartados anteriores de las disposiciones contenidas en este título no afectará, en ningún caso, a la condición de cargo electo que pudieran ostentar.</p>`,dis:`<ul>
<li><b>25.1 — AGE:</b> miembros del Gobierno, Secretarios de Estado y el resto de <b>altos cargos</b> de la AGE y de las entidades del sector público estatal. Se consideran altos cargos los que tengan tal condición conforme a la <b>normativa de conflictos de intereses</b>.</li>
<li><b>25.2 — autonómico y local:</b> se aplica a los <b>altos cargos o asimilados</b> que tengan tal consideración según la normativa autonómica o local, <b>incluidos los miembros de las Juntas de Gobierno de las Entidades Locales</b>.</li>
<li><b>25.3 — cargo electo:</b> la aplicación de este título <b>no afecta en ningún caso a la condición de cargo electo</b> que pudieran ostentar.</li>
</ul>`,llano:`<p>El buen gobierno no es para todo empleado público: se dirige a quien manda. En un ayuntamiento alcanza expresamente a los miembros de la Junta de Gobierno Local. Y una cautela importante: sancionar a un cargo por esta vía no le quita su condición de electo.</p>`,porque:`<p>Las obligaciones de conducta y el régimen sancionador se anudan al <b>poder de decisión</b>, no al vínculo funcionarial: por eso el ámbito se define por remisión a la normativa de altos cargos. El apartado 3 resuelve un problema constitucional evidente: la condición de concejal o diputado deriva de la elección popular y no puede perderse por una sanción administrativa.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> el código de conducta de una empresa que se aplica a la dirección, no a toda la plantilla.</li>
<li><b>Real:</b> los miembros de la Junta de Gobierno Local de un ayuntamiento están sujetos al Título II por remisión expresa del art. 25.2.</li>
<li><b>Caso límite:</b> un concejal sancionado por infracción muy grave sería destituido del cargo de alto cargo que ocupe, pero <b>no</b> pierde su acta de concejal (art. 25.3 en relación con el art. 30.4).</li>
</ul>`,noej:`<ul>
<li><b>No se aplica</b> el Título II a los empleados públicos en general: tienen su propio régimen disciplinario.</li>
<li><b>No afecta</b> a la condición de cargo electo.</li>
</ul>`,conex:`<ul>
<li><b>Arts. 26 a 32 LTBG:</b> principios, infracciones y sanciones que se aplican a estos sujetos.</li>
<li><b>Ley 7/1985 (LBRL)</b> <i>(norma externa a la biblioteca)</i>: régimen de los miembros de las corporaciones locales y de la Junta de Gobierno.</li>
<li><b>Art. 51 de la Ley 1/2014 de Andalucía</b> (documento 9): responsables en el ámbito autonómico.</li>
</ul>`,trampas:`<ul>
<li>La mención expresa a los <b>miembros de las Juntas de Gobierno de las Entidades Locales</b> es de examen seguro.</li>
<li>El concepto de alto cargo se toma de la <b>normativa de conflictos de intereses</b>.</li>
<li>No afecta a la <b>condición de cargo electo</b>.</li>
</ul>`,ancla:`<p><b>"Buen gobierno = para quien manda."</b> Y en lo local, <b>Junta de Gobierno</b> incluida.</p>`,vis:`<svg viewBox="0 0 640 130" role="img" aria-label="Ámbito subjetivo del buen gobierno">
<rect x="30" y="30" width="270" height="62" rx="8" fill="var(--acc-soft)" stroke="var(--acc)"/>
<text x="165" y="53" text-anchor="middle" font-size="11" font-weight="700" fill="var(--acc)">Ámbito estatal</text>
<text x="165" y="72" text-anchor="middle" font-size="10" fill="currentColor">Gobierno, Secretarios de Estado y altos cargos</text>
<rect x="340" y="30" width="270" height="62" rx="8" fill="var(--ej-bg)" stroke="var(--ej)"/>
<text x="475" y="53" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ej)">Ámbito autonómico y local</text>
<text x="475" y="72" text-anchor="middle" font-size="10" fill="currentColor">altos cargos y Juntas de Gobierno locales</text>
<text x="320" y="118" text-anchor="middle" font-size="10" fill="var(--exc)">No afecta en ningún caso a la condición de cargo electo (25.3)</text>
</svg>`},
{n:26,t:"Principios de buen gobierno",ubic:"Título II (Buen gobierno)",idea:"Principios generales y de actuación que vinculan la conducta de los altos cargos.",literal:`<p>1. Las personas comprendidas en el ámbito de aplicación de este título observarán en el ejercicio de sus funciones lo dispuesto en la Constitución Española y en el resto del ordenamiento jurídico y promoverán el respeto a los derechos fundamentales y a las libertades públicas.</p><p>2. Asimismo, adecuarán su actividad a los siguientes:</p><p>a) Principios generales:</p><p>1.º Actuarán con transparencia en la gestión de los asuntos públicos, de acuerdo con los principios de eficacia, economía y eficiencia y con el objetivo de satisfacer el interés general.</p><p>2.º Ejercerán sus funciones con dedicación al servicio público, absteniéndose de cualquier conducta que sea contraria a estos principios.</p><p>3.º Respetarán el principio de imparcialidad, de modo que mantengan un criterio independiente y ajeno a todo interés particular.</p><p>4.º Asegurarán un trato igual y sin discriminaciones de ningún tipo en el ejercicio de sus funciones.</p><p>5.º Actuarán con la diligencia debida en el cumplimiento de sus obligaciones y fomentarán la calidad en la prestación de servicios públicos.</p><p>6.º Mantendrán una conducta digna y tratarán a los ciudadanos con esmerada corrección.</p><p>7.º Asumirán la responsabilidad de las decisiones y actuaciones propias y de los organismos que dirigen, sin perjuicio de otras que fueran exigibles legalmente.</p><p>b) Principios de actuación:</p><p>1.º Desempeñarán su actividad con plena dedicación y con pleno respeto a la normativa reguladora de las incompatibilidades y los conflictos de intereses.</p><p>2.º Guardarán la debida reserva respecto a los hechos o informaciones conocidos con motivo u ocasión del ejercicio de sus competencias.</p><p>3.º Pondrán en conocimiento de los órganos competentes cualquier actuación irregular de la cual tengan conocimiento.</p><p>4.º Ejercerán los poderes que les atribuye la normativa vigente con la finalidad exclusiva para la que fueron otorgados y evitarán toda acción que pueda poner en riesgo el interés público o el patrimonio de las Administraciones.</p><p>5.º No se implicarán en situaciones, actividades o intereses incompatibles con sus funciones y se abstendrán de intervenir en los asuntos en que concurra alguna causa que pueda afectar a su objetividad.</p><p>6.º No aceptarán para sí regalos que superen los usos habituales, sociales o de cortesía, ni favores o servicios en condiciones ventajosas que puedan condicionar el desarrollo de sus funciones. En el caso de obsequios de una mayor relevancia institucional se procederá a su incorporación al patrimonio de la Administración Pública correspondiente.</p><p>7.º Desempeñarán sus funciones con transparencia.</p><p>8.º Gestionarán, protegerán y conservarán adecuadamente los recursos públicos, que no podrán ser utilizados para actividades que no sean las permitidas por la normativa que sea de aplicación.</p><p>9.º No se valdrán de su posición en la Administración para obtener ventajas personales o materiales.</p><p>3. Los principios establecidos en este artículo informarán la interpretación y aplicación del régimen sancionador regulado en este título.</p>`,dis:`<ul>
<li><b>26.1 — deber marco:</b> observar la <b>Constitución</b> y el resto del ordenamiento y <b>promover el respeto a los derechos fundamentales</b> y a las libertades públicas.</li>
<li><b>26.2.a) — principios generales (siete):</b> <b>transparencia</b> en la gestión con eficacia, economía y eficiencia · <b>dedicación</b> al servicio público · <b>imparcialidad</b> e independencia de criterio · <b>igualdad</b> y no discriminación · <b>diligencia debida</b> y fomento de la calidad · <b>conducta digna</b> y trato correcto · <b>asunción de responsabilidad</b> por las decisiones propias y de los organismos que dirigen.</li>
<li><b>26.2.b) — principios de actuación:</b> plena dedicación con respeto a incompatibilidades y <span class="t" data-k="conflicto">conflictos de intereses</span> · <b>debida reserva</b> sobre hechos e informaciones conocidos por razón del cargo · <b>poner en conocimiento</b> de los órganos competentes cualquier actuación irregular · ejercicio de los poderes conforme a su finalidad · austeridad en el uso de medios públicos, entre otros.</li>
<li><b>Eficacia jurídica:</b> estos principios <b>informan la interpretación y aplicación</b> del régimen sancionador del propio título.</li>
</ul>`,llano:`<p>Un catálogo de conducta: gestionar con transparencia y eficiencia, dedicarse al cargo, ser imparcial, tratar igual, hacer las cosas con diligencia, comportarse con dignidad y asumir la responsabilidad. Y en el plano práctico: respetar las incompatibilidades, guardar reserva y denunciar lo irregular que se conozca.</p>`,porque:`<p>La novedad no está en el contenido —son principios clásicos— sino en su <b>eficacia</b>: dejan de ser recomendaciones éticas para convertirse en <b>criterio de interpretación del régimen sancionador</b>. Es decir, sirven para calificar conductas y para graduar responsabilidades.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> el código de conducta que se firma al entrar en una organización y que después se usa para valorar los incumplimientos.</li>
<li><b>Real:</b> un alto cargo que conoce una irregularidad en un expediente y no la comunica incumple el principio de actuación de poner en conocimiento de los órganos competentes cualquier actuación irregular.</li>
<li><b>Caso límite:</b> el deber de reserva no ampara ocultar irregularidades: conviven con el deber de comunicarlas.</li>
</ul>`,noej:`<ul>
<li><b>No son</b> meras declaraciones programáticas: informan la interpretación y aplicación del régimen sancionador.</li>
<li><b>No sustituyen</b> al régimen de incompatibilidades: remiten a él.</li>
</ul>`,conex:`<ul>
<li><b>Arts. 27 a 31 LTBG:</b> infracciones y sanciones que desarrollan estos principios.</li>
<li><b>Art. 3 de la Ley 40/2015</b> (documento 2): principios generales de actuación de las Administraciones.</li>
<li><b>Art. 52 de la Ley 1/2014 de Andalucía</b> (documento 9): infracciones disciplinarias autonómicas.</li>
</ul>`,trampas:`<ul>
<li>Dos grupos: <b>principios generales</b> (a) y <b>principios de actuación</b> (b).</li>
<li>Entre los de actuación destacan la <b>debida reserva</b> y el deber de <b>comunicar actuaciones irregulares</b>.</li>
<li>Su función es <b>interpretativa</b> del régimen sancionador.</li>
</ul>`,ancla:`<p><b>Generales:</b> transparencia, dedicación, imparcialidad, igualdad, diligencia, dignidad y responsabilidad.<br><b>De actuación:</b> incompatibilidades, reserva y denuncia de lo irregular.</p>`,vis:`<svg viewBox="0 0 640 145" role="img" aria-label="Principios de buen gobierno">
<rect x="30" y="25" width="270" height="90" rx="8" fill="var(--acc-soft)" stroke="var(--acc)"/>
<text x="165" y="48" text-anchor="middle" font-size="11" font-weight="700" fill="var(--acc)">Principios generales (26.2.a)</text>
<text x="165" y="68" text-anchor="middle" font-size="10" fill="currentColor">transparencia · dedicación · imparcialidad</text>
<text x="165" y="85" text-anchor="middle" font-size="10" fill="currentColor">igualdad · diligencia · dignidad</text>
<text x="165" y="102" text-anchor="middle" font-size="10" fill="currentColor">y asunción de responsabilidad</text>
<rect x="340" y="25" width="270" height="90" rx="8" fill="var(--ej-bg)" stroke="var(--ej)"/>
<text x="475" y="48" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ej)">Principios de actuación (26.2.b)</text>
<text x="475" y="68" text-anchor="middle" font-size="10" fill="currentColor">incompatibilidades y conflictos</text>
<text x="475" y="85" text-anchor="middle" font-size="10" fill="currentColor">debida reserva</text>
<text x="475" y="102" text-anchor="middle" font-size="10" fill="currentColor">comunicar actuaciones irregulares</text>
<text x="320" y="136" text-anchor="middle" font-size="10" fill="var(--ink2)">Informan la interpretación y aplicación del régimen sancionador del Título II</text>
</svg>`},
{n:27,t:"Infracciones y sanciones en materia de conflicto de intereses",ubic:"Título II (Buen gobierno)",idea:"Los incumplimientos de incompatibilidades se sancionan por su normativa específica.",literal:`<p>El incumplimiento de las normas de incompatibilidades o de las que regulan las declaraciones que han de realizar las personas comprendidas en el ámbito de este título será sancionado de conformidad con lo dispuesto en la normativa en materia de conflictos de intereses de la Administración General del Estado y para el resto de Administraciones de acuerdo con su propia normativa que resulte de aplicación.</p>`,dis:`<ul>
<li><b>Remisión:</b> el incumplimiento de las <b>normas de incompatibilidades</b> o de las que regulan las <b>declaraciones</b> que deben realizar los sujetos del título se sanciona conforme a la <b>normativa en materia de conflictos de intereses</b>.</li>
<li><b>Efecto:</b> este bloque no crea tipos propios: reenvía a la ley reguladora del ejercicio del alto cargo.</li>
</ul>`,llano:`<p>Si un alto cargo incumple sus obligaciones de incompatibilidad o no presenta sus declaraciones, no se le sanciona por esta ley: se le sanciona por la ley de conflictos de intereses, que tiene sus propios tipos y sanciones.</p>`,porque:`<p>Evita la <b>duplicidad de regímenes</b> sobre una misma materia y respeta la especialidad: los conflictos de intereses tienen una regulación propia y consolidada. La ley de transparencia se limita a recordar que ese incumplimiento también forma parte del buen gobierno.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> una norma que remite a otra en lugar de repetir su contenido.</li>
<li><b>Real:</b> un alto cargo que ejerce una actividad privada incompatible responde conforme a la normativa de conflictos de intereses, no por los arts. 28 o 29.</li>
</ul>`,noej:`<ul>
<li><b>No crea</b> este artículo infracciones nuevas.</li>
<li><b>No excluye</b> que la misma conducta pueda ser además constitutiva de otras responsabilidades.</li>
</ul>`,conex:`<ul>
<li><b>Art. 26.2.b) LTBG:</b> deber de respetar incompatibilidades y conflictos de intereses.</li>
<li><b>Art. 31.3 LTBG:</b> la instrucción corresponde a la Oficina de Conflictos de Intereses en el ámbito estatal.</li>
<li><b>Ley 3/2015</b> <i>(norma externa a la biblioteca)</i>: ejercicio del alto cargo de la AGE.</li>
</ul>`,trampas:`<ul>
<li>Es un artículo de <b>remisión</b>: la sanción viene de la normativa de conflictos de intereses.</li>
<li>Alcanza también al incumplimiento de las obligaciones de <b>declaración</b>.</li>
</ul>`,ancla:`<p><b>"Incompatibilidades: por su ley, no por esta."</b></p>`,vis:`<svg viewBox="0 0 640 110" role="img" aria-label="Remisión en materia de conflicto de intereses">
<rect x="80" y="28" width="200" height="52" rx="8" fill="var(--acc-soft)" stroke="var(--acc)"/>
<text x="180" y="50" text-anchor="middle" font-size="11" font-weight="700" fill="var(--acc)">Art. 27 LTBG</text>
<text x="180" y="68" text-anchor="middle" font-size="10" fill="currentColor">incompatibilidades y declaraciones</text>
<text x="320" y="58" text-anchor="middle" font-size="16" fill="var(--ink2)">→</text>
<rect x="350" y="28" width="230" height="52" rx="8" fill="var(--warn-bg)" stroke="var(--warn)"/>
<text x="465" y="50" text-anchor="middle" font-size="11" font-weight="700" fill="var(--warn)">Normativa de conflictos de intereses</text>
<text x="465" y="68" text-anchor="middle" font-size="10" fill="currentColor">sus tipos y sus sanciones</text>
</svg>`},
{n:28,t:"Infracciones en materia de gestión económico-presupuestaria",ubic:"Título II (Buen gobierno)",idea:"Infracciones muy graves de gestión económica: gastar sin crédito, omitir la intervención y más.",literal:`<p>Constituyen infracciones muy graves las siguientes conductas cuando sean culpables:</p><p>a) La incursión en alcance en la administración de los fondos públicos cuando la conducta no sea subsumible en ninguno de los tipos que se contemplan en las letras siguientes.</p><p>b) La administración de los recursos y demás derechos de la Hacienda Pública sin sujeción a las disposiciones que regulan su liquidación, recaudación o ingreso en el Tesoro.</p><p>c) Los compromisos de gastos, reconocimiento de obligaciones y ordenación de pagos sin crédito suficiente para realizarlos o con infracción de lo dispuesto en la Ley 47/2003, de 26 de noviembre, General Presupuestaria, o en la de Presupuestos u otra normativa presupuestaria que sea aplicable.</p><p>d) La omisión del trámite de intervención previa de los gastos, obligaciones o pagos, cuando ésta resulte preceptiva o del procedimiento de resolución de discrepancias frente a los reparos suspensivos de la intervención, regulado en la normativa presupuestaria.</p><p>e) La ausencia de justificación de la inversión de los fondos a los que se refieren los artículos 78 y 79 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, o, en su caso, la normativa presupuestaria equivalente de las administraciones distintas de la General del Estado.</p><p>f) El incumplimiento de la obligación de destinar íntegramente los ingresos obtenidos por encima de los previstos en el presupuesto a la reducción del nivel de deuda pública de conformidad con lo previsto en el artículo 12.5 de la Ley Orgánica 2/2012, de 27 de abril, de Estabilidad Presupuestaria y Sostenibilidad Financiera y el incumplimiento de la obligación del destino del superávit presupuestario a la reducción del nivel de endeudamiento neto en los términos previstos en el artículo 32 y la disposición adicional sexta de la citada Ley.</p><p>g) La realización de operaciones de crédito y emisiones de deudas que no cuenten con la preceptiva autorización o, habiéndola obtenido, no se cumpla con lo en ella previsto o se superen los límites previstos en la Ley Orgánica 2/2012, de 27 de abril, la Ley Orgánica 8/1980, de 22 de septiembre, de Financiación de las Comunidades Autónomas, y en el Texto Refundido de la Ley Reguladora de las Haciendas Locales, aprobado por el Real Decreto Legislativo 2/2004, de 5 de marzo.</p><p>h) La no adopción en plazo de las medidas necesarias para evitar el riesgo de incumplimiento, cuando se haya formulado la advertencia prevista en el artículo 19 de la Ley Orgánica 2/2012, de 27 de abril.</p><p>i) La suscripción de un Convenio de colaboración o concesión de una subvención a una Administración Pública que no cuente con el informe favorable del Ministerio de Hacienda y Administraciones Públicas previsto en el artículo 20.3 de la Ley Orgánica 2/2012, de 27 de abril.</p><p>j) La no presentación o la falta de puesta en marcha en plazo del plan económico- financiero o del plan de reequilibrio de conformidad con el artículo 23 de la Ley Orgánica 2/2012, de 27 de abril.</p><p>k) El incumplimiento de las obligaciones de publicación o de suministro de información previstas en la normativa presupuestaria y económico-financiera, siempre que en este último caso se hubiera formulado requerimiento.</p><p>l) La falta de justificación de la desviación, o cuando así se le haya requerido la falta de inclusión de nuevas medidas en el plan económico-financiero o en el plan de reequilibrio de acuerdo con el artículo 24.3 de la Ley Orgánica 2/2012, de 27 de abril.</p><p>m) La no adopción de las medidas previstas en los planes económico-financieros y de reequilibrio, según corresponda, previstos en los artículos 21 y 22 de la Ley Orgánica 2/2012, de 27 de abril.</p><p>n) La no adopción en el plazo previsto del acuerdo de no disponibilidad al que se refieren los artículos 20.5.a) y 25 de la Ley Orgánica 2/2012, de 27 de abril, así como la no constitución del depósito previsto en el citado artículo 25 de la misma Ley, cuando así se haya solicitado.</p><p>ñ) La no adopción de un acuerdo de no disponibilidad, la no constitución del depósito que se hubiere solicitado o la falta de ejecución de las medidas propuestas por la Comisión de Expertos cuando se hubiere formulado el requerimiento del Gobierno previsto en el artículo 26.1 de la Ley Orgánica 2/2012, de 27 de abril.</p><p>o) El incumplimiento de las instrucciones dadas por el Gobierno para ejecutar las medidas previstas en el artículo 26.1 de la Ley Orgánica 2/2012, de 27 de abril.</p><p>p) El incumplimiento de la obligación de rendir cuentas regulada en el artículo 137 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria u otra normativa presupuestaria que sea aplicable.</p>`,dis:`<p>Constituyen <b>infracciones muy graves</b>, cuando sean <b>culpables</b>, entre otras conductas:</p>
<table><thead><tr><th>Letra</th><th>Conducta</th></tr></thead><tbody>
<tr><td><b>a)</b></td><td>La incursión en <span class="t" data-k="alcance">alcance</span> en la administración de fondos públicos no subsumible en otras letras</td></tr>
<tr><td><b>b)</b></td><td>Administrar recursos y derechos de la Hacienda Pública <b>sin sujeción</b> a las normas de liquidación, recaudación o ingreso</td></tr>
<tr><td><b>c)</b></td><td>Compromisos de gasto, reconocimiento de obligaciones y ordenación de pagos <b>sin crédito suficiente</b> o con infracción de la normativa presupuestaria</td></tr>
<tr><td><b>d)</b></td><td><b>Omitir el trámite de intervención previa</b> cuando sea preceptiva, o el procedimiento de resolución de discrepancias frente a los <span class="t" data-k="reparosusp">reparos suspensivos</span></td></tr>
<tr><td><b>e)</b></td><td>Ausencia de <b>justificación de la inversión</b> de determinados fondos</td></tr>
<tr><td><b>f)</b></td><td>No destinar íntegramente los ingresos obtenidos por encima de lo previsto a <b>reducir deuda pública</b> cuando así proceda</td></tr>
<tr><td><b>g)</b></td><td>Realizar <b>operaciones de crédito</b> y emisiones de deuda sin autorización preceptiva o superando límites</td></tr>
<tr><td><b>h)</b></td><td>No adoptar en plazo las <b>medidas necesarias</b> tras la advertencia de riesgo de incumplimiento prevista en la <b>LO 2/2012</b></td></tr>
</tbody></table>
<div class="box ej"><span class="lbl">Conexión directa con el tema 8</b></span>Las letras c) y d) tipifican como infracción muy grave lo que en el TRLHL son, respectivamente, el <b>gasto sin crédito</b> (art. 173.5, nulo de pleno derecho) y la <b>omisión de la fiscalización previa</b> o del procedimiento de discrepancias (arts. 214 a 218).</div>`,llano:`<p>Aquí la ley convierte en infracción muy grave lo que ya sabías del tema 8: comprometer gasto sin crédito, saltarse al interventor, no resolver las discrepancias, endeudarse sin autorización o no corregir cuando se advierte riesgo de incumplir la estabilidad.</p>`,porque:`<p>Antes de esta ley, esas conductas producían la <b>nulidad</b> del acto y, en su caso, responsabilidad contable, pero rara vez consecuencias personales para quien decidía. Tipificarlas como infracción muy grave cierra el círculo del control económico: a la invalidez del acto se suma la <b>responsabilidad del cargo</b>.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> el directivo que firma pedidos sin presupuesto y esquiva al departamento financiero.</li>
<li><b>Real:</b> un alto cargo ordena pagos pese al reparo suspensivo de la Intervención sin tramitar la discrepancia: encaja en la letra d).</li>
<li><b>Caso límite:</b> se exige que la conducta sea <b>culpable</b>: no basta el error material o la irregularidad sin reproche.</li>
</ul>`,noej:`<ul>
<li><b>No es</b> infracción de este artículo cualquier irregularidad contable: los tipos son tasados y exigen culpabilidad.</li>
<li><b>No excluye</b> esta responsabilidad la <b>contable</b> ante el Tribunal de Cuentas (art. 31.1).</li>
</ul>`,conex:`<ul>
<li><b>Arts. 173.5, 214 a 218 del TRLHL</b> (documento 5): gasto sin crédito, reparos y discrepancias.</li>
<li><b>Art. 30 LTBG:</b> sanciones aplicables.</li>
<li><b>LO 2/2012</b> <i>(norma externa a la biblioteca)</i>: advertencia de riesgo de incumplimiento de la letra h).</li>
</ul>`,trampas:`<ul>
<li>Todas son <b>muy graves</b> y exigen que la conducta sea <b>culpable</b>.</li>
<li>La letra d) incluye tanto la <b>omisión de la intervención previa</b> como la del <b>procedimiento de discrepancias</b>.</li>
<li>La letra f) se refiere a destinar los mayores ingresos a <b>reducir deuda</b>.</li>
</ul>`,ancla:`<p><b>"Sin crédito, sin interventor, sin autorización y sin corregir."</b> Cuatro maneras de acabar en muy grave.</p>`,vis:`<svg viewBox="0 0 640 145" role="img" aria-label="Infracciones muy graves en gestión económico-presupuestaria">
<rect x="170" y="10" width="300" height="30" rx="8" fill="var(--exc-bg)" stroke="var(--exc)"/>
<text x="320" y="30" text-anchor="middle" font-size="12" font-weight="700" fill="var(--exc)">INFRACCIONES MUY GRAVES (culpables)</text>
<g font-size="10" text-anchor="middle" fill="currentColor">
<rect x="20" y="54" width="185" height="56" rx="8" fill="var(--panel)" stroke="var(--line)"/><text x="112" y="76" font-weight="700">Gastar mal</text><text x="112" y="94">sin crédito · sin sujeción a normas</text>
<rect x="227" y="54" width="185" height="56" rx="8" fill="var(--panel)" stroke="var(--line)"/><text x="320" y="76" font-weight="700">Esquivar el control</text><text x="320" y="94">omitir intervención o discrepancias</text>
<rect x="434" y="54" width="186" height="56" rx="8" fill="var(--panel)" stroke="var(--line)"/><text x="527" y="76" font-weight="700">Endeudarse o no corregir</text><text x="527" y="94">crédito sin autorización · LO 2/2012</text>
</g>
<text x="320" y="132" text-anchor="middle" font-size="10" fill="var(--ink2)">Enlaza con los arts. 173.5 y 214 a 218 del TRLHL: nulidad, reparos y discrepancias</text>
</svg>`},
{n:29,t:"Infracciones disciplinarias",ubic:"Título II (Buen gobierno)",idea:"Infracciones disciplinarias muy graves, graves y leves de los altos cargos.",literal:`<p>1. Son infracciones muy graves:</p><p>a) El incumplimiento del deber de respeto a la Constitución y a los respectivos Estatutos de Autonomía de las Comunidades Autónomas y Ciudades de Ceuta y Melilla, en el ejercicio de sus funciones.</p><p>b) Toda actuación que suponga discriminación por razón de origen racial o étnico, religión o convicciones, discapacidad, edad u orientación sexual, lengua, opinión, lugar de nacimiento o vecindad, sexo o cualquier otra condición o circunstancia personal o social, así como el acoso por razón de origen racial o étnico, religión o convicciones, discapacidad, edad u orientación sexual y el acoso moral, sexual y por razón de sexo.</p><p>c) La adopción de acuerdos manifiestamente ilegales que causen perjuicio grave a la Administración o a los ciudadanos.</p><p>d) La publicación o utilización indebida de la documentación o información a que tengan o hayan tenido acceso por razón de su cargo o función.</p><p>e) La negligencia en la custodia de secretos oficiales, declarados así por Ley o clasificados como tales, que sea causa de su publicación o que provoque su difusión o conocimiento indebido.</p><p>f) El notorio incumplimiento de las funciones esenciales inherentes al puesto de trabajo o funciones encomendadas.</p><p>g) La violación de la imparcialidad, utilizando las facultades atribuidas para influir en procesos electorales de cualquier naturaleza y ámbito.</p><p>h) La prevalencia de la condición de alto cargo para obtener un beneficio indebido para sí o para otro.</p><p>i) La obstaculización al ejercicio de las libertades públicas y derechos sindicales.</p><p>j) La realización de actos encaminados a coartar el libre ejercicio del derecho de huelga.</p><p>k) El acoso laboral.</p><p>l) La comisión de una infracción grave cuando el autor hubiera sido sancionado por dos infracciones graves a lo largo del año anterior contra las que no quepa recurso en la vía administrativa.</p><p>2. Son infracciones graves:</p><p>a) El abuso de autoridad en el ejercicio del cargo.</p><p>b) La intervención en un procedimiento administrativo cuando se dé alguna de las causas de abstención legalmente señaladas.</p><p>c) La emisión de informes y la adopción de acuerdos manifiestamente ilegales cuando causen perjuicio a la Administración o a los ciudadanos y no constituyan infracción muy grave.</p><p>d) No guardar el debido sigilo respecto a los asuntos que se conozcan por razón del cargo, cuando causen perjuicio a la Administración o se utilice en provecho propio.</p><p>e) El incumplimiento de los plazos u otras disposiciones de procedimiento en materia de incompatibilidades, cuando no suponga el mantenimiento de una situación de incompatibilidad.</p><p>f) La comisión de una infracción leve cuando el autor hubiera sido sancionado por dos infracciones leves a lo largo del año anterior contra las que no quepa recurso en la vía administrativa.</p><p>3. Son infracciones leves:</p><p>a) La incorrección con los superiores, compañeros o subordinados.</p><p>b) El descuido o negligencia en el ejercicio de sus funciones y el incumplimiento de los principios de actuación del artículo 26.2.b) cuando ello no constituya infracción grave o muy grave o la conducta no se encuentre tipificada en otra norma.</p>`,dis:`<ul>
<li><b>29.1 — muy graves</b>, entre otras: incumplir el deber de <b>respeto a la Constitución</b> y a los Estatutos de Autonomía · toda actuación que suponga <b>discriminación</b> · adoptar <b>acuerdos manifiestamente ilegales</b> que causen perjuicio grave · <b>publicación o utilización indebida</b> de documentación o información conocida por razón del cargo · <b>negligencia en la custodia de secretos oficiales</b> · <b>notorio incumplimiento</b> de las funciones esenciales · violar la <b>imparcialidad</b> influyendo en procesos electorales · <b>prevalerse</b> de la condición de alto cargo para obtener un beneficio indebido.</li>
<li><b>29.2 — graves:</b> abuso de autoridad, tolerancia de faltas graves de los subordinados, grave desconsideración con ciudadanos, empleados o cargos, entre otras.</li>
<li><b>29.3 — leves:</b> incorrección con superiores, compañeros, subordinados o ciudadanos y descuido o negligencia en el ejercicio de sus funciones.</li>
</ul>`,llano:`<p>Junto a las infracciones económicas, la ley tipifica conductas de comportamiento: discriminar, aprobar acuerdos manifiestamente ilegales con perjuicio grave, filtrar información del cargo, usar el puesto para beneficio propio o meterse en procesos electorales. Y, en escala descendente, el abuso de autoridad y la simple incorrección.</p>`,porque:`<p>El régimen disciplinario clásico de los empleados públicos no alcanzaba a los altos cargos, que quedaban en una zona de impunidad formal: su responsabilidad era casi exclusivamente política. Este artículo <b>llena ese vacío</b>, tipificando conductas y permitiendo sanciones administrativas.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> un reglamento interno que gradúa las faltas de la dirección de una entidad.</li>
<li><b>Real:</b> un alto cargo que filtra a un tercero la propuesta de adjudicación antes de su publicación incurre en la letra d) del art. 29.1.</li>
<li><b>Caso límite:</b> la adopción de un acuerdo ilegal solo es muy grave si es <b>manifiestamente ilegal</b> y causa <b>perjuicio grave</b>.</li>
</ul>`,noej:`<ul>
<li><b>No basta</b> con la ilegalidad del acuerdo: debe ser manifiesta y causar perjuicio grave.</li>
<li><b>No se aplica</b> este artículo a los empleados públicos: tienen su propio régimen disciplinario.</li>
</ul>`,conex:`<ul>
<li><b>Art. 30 LTBG:</b> sanciones correspondientes a cada clase de infracción.</li>
<li><b>Art. 32 LTBG:</b> prescripción.</li>
<li><b>Art. 52 de la Ley 1/2014 de Andalucía</b> (documento 9): infracciones disciplinarias autonómicas.</li>
</ul>`,trampas:`<ul>
<li>Tres clases: <b>muy graves, graves y leves</b>.</li>
<li>La <b>discriminación</b> y la <b>prevalencia del cargo</b> son muy graves.</li>
<li>Las <b>leves</b> se reducen a incorrección y descuido o negligencia.</li>
</ul>`,ancla:`<p><b>Escalera:</b> muy graves (Constitución, discriminación, ilegalidad manifiesta, filtración, secretos, incumplimiento notorio, elecciones, prevalencia) → graves (abuso y tolerancia) → leves (incorrección y descuido).</p>`,vis:`<svg viewBox="0 0 640 145" role="img" aria-label="Infracciones disciplinarias de los altos cargos">
<rect x="40" y="25" width="560" height="30" rx="6" fill="var(--exc-bg)" stroke="var(--exc)"/>
<text x="320" y="45" text-anchor="middle" font-size="11" fill="var(--exc)">MUY GRAVES · Constitución · discriminación · acuerdos manifiestamente ilegales · filtraciones · prevalencia</text>
<rect x="80" y="62" width="480" height="30" rx="6" fill="var(--warn-bg)" stroke="var(--warn)"/>
<text x="320" y="82" text-anchor="middle" font-size="11" fill="var(--warn)">GRAVES · abuso de autoridad · tolerancia de faltas graves · grave desconsideración</text>
<rect x="130" y="99" width="380" height="30" rx="6" fill="var(--ej-bg)" stroke="var(--ej)"/>
<text x="320" y="119" text-anchor="middle" font-size="11" fill="var(--ej)">LEVES · incorrección · descuido o negligencia</text>
</svg>`},
{n:30,t:"Sanciones",ubic:"Título II (Buen gobierno)",idea:"Amonestación, declaración de incumplimiento con publicación y destitución con inhabilitación.",literal:`<p>1. Las infracciones leves serán sancionadas con una amonestación.</p><p>2. Por la comisión de una infracción grave se impondrán al infractor algunas de las siguientes sanciones:</p><p>a) La declaración del incumplimiento y su publicación en el «Boletín Oficial del Estado» o diario oficial que corresponda.</p><p>b) La no percepción, en el caso de que la llevara aparejada, de la correspondiente indemnización para el caso de cese en el cargo.</p><p>3. En el caso de las infracciones muy graves, se impondrán en todo caso las sanciones previstas en el apartado anterior.</p><p>4. Los sancionados por la comisión de una infracción muy grave serán destituidos del cargo que ocupen salvo que ya hubiesen cesado y no podrán ser nombrados para ocupar ningún puesto de alto cargo o asimilado durante un periodo de entre cinco y diez años con arreglo a los criterios previstos en el apartado siguiente.</p><p>5. La comisión de infracciones muy graves, graves o leves se sancionará de acuerdo con los criterios recogidos en el artículo 131.3 de la Ley 30/1992, de 26 de noviembre, de Régimen Jurídico de las Administraciones Públicas y del Procedimiento Administrativo Común, y los siguientes:</p><p>a) La naturaleza y entidad de la infracción.</p><p>b) La gravedad del peligro ocasionado o del perjuicio causado.</p><p>c) Las ganancias obtenidas, en su caso, como consecuencia de los actos u omisiones constitutivos de la infracción.</p><p>d) Las consecuencias desfavorables de los hechos para la Hacienda Pública respectiva.</p><p>e) La circunstancia de haber procedido a la subsanación de la infracción por propia iniciativa.</p><p>f) La reparación de los daños o perjuicios causados.</p><p>En la graduación de las sanciones se valorará la existencia de perjuicios para el interés público, la repercusión de la conducta en los ciudadanos, y, en su caso, la percepción indebida de cantidades por el desempeño de actividades públicas incompatibles.</p><p>6. Cuando las infracciones pudieran ser constitutivas de delito, la Administración pondrá los hechos en conocimiento del Fiscal General del Estado y se abstendrá de seguir el procedimiento mientras la autoridad judicial no dicte una resolución que ponga fin al proceso penal.</p><p>7. Cuando los hechos estén tipificados como infracción en una norma administrativa especial, se dará cuenta de los mismos a la Administración competente para la instrucción del correspondiente procedimiento sancionador, suspendiéndose las actuaciones hasta la terminación de aquel. No se considerará normativa especial la Ley 47/2003, de 26 de noviembre, General Presupuestaria, respecto de las infracciones previstas en el artículo 28, pudiéndose tramitar el procedimiento de responsabilidad patrimonial simultáneamente al procedimiento sancionador.</p><p>8. En todo caso la comisión de las infracciones previstas en el artículo 28 conllevará las siguientes consecuencias:</p><p>a) La obligación de restituir, en su caso, las cantidades percibidas o satisfechas indebidamente.</p><p>b) La obligación de indemnizar a la Hacienda Pública en los términos del artículo 176 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria.</p>`,dis:`<table><thead><tr><th>Infracción</th><th>Sanción</th></tr></thead><tbody>
<tr><td><b>Leve</b></td><td><span class="t" data-k="amonestacion">Amonestación</span></td></tr>
<tr><td><b>Grave</b></td><td><b>Declaración del incumplimiento y su publicación</b> en el BOE o diario oficial · y <b>no percepción de la indemnización</b> por cese en el cargo, si la llevara aparejada</td></tr>
<tr><td><b>Muy grave</b></td><td><b>En todo caso</b> las sanciones de las graves · más <b><span class="t" data-k="destitucion">destitución</span></b> del cargo, salvo cese previo, y <b>prohibición de ser nombrado alto cargo durante un periodo de entre cinco y diez años</b></td></tr>
</tbody></table>
<p><b>30.5 — graduación:</b> se atiende a la naturaleza y entidad de la infracción · la gravedad del peligro o perjuicio · las <b>ganancias obtenidas</b> · las consecuencias para la <b>Hacienda Pública</b> · la <b>subsanación por propia iniciativa</b> · la reparación de daños. Se valora además el perjuicio al interés público, la repercusión en los ciudadanos y la percepción indebida de cantidades.</p>`,llano:`<p>Tres escalones: una amonestación para lo leve; para lo grave, que se declare y se publique el incumplimiento y que se pierda la indemnización por cese; y para lo muy grave, además, la destitución y no poder volver a ser alto cargo entre cinco y diez años.</p>`,porque:`<p>La sanción estrella no es económica sino <b>reputacional e inhabilitante</b>: la publicación del incumplimiento y la imposibilidad de volver a ocupar un alto cargo. Es coherente con la naturaleza del bien jurídico protegido —la confianza en el ejercicio del poder público— y con el hecho de que muchos de estos cargos no tienen relación funcionarial que sancionar.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> la diferencia entre una advertencia, una nota pública en el tablón y la expulsión con veto temporal.</li>
<li><b>Real:</b> declarada una infracción muy grave, se publica el incumplimiento, se pierde la indemnización por cese, se destituye al cargo y se le inhabilita para ser nombrado alto cargo entre <b>cinco y diez años</b>.</li>
<li><b>Caso límite:</b> si el infractor ya había cesado, no cabe destitución, pero sí el resto de sanciones y la inhabilitación.</li>
</ul>`,noej:`<ul>
<li><b>No hay</b> multa económica como sanción típica en este régimen.</li>
<li><b>No pierde</b> el sancionado su condición de cargo electo (art. 25.3).</li>
</ul>`,conex:`<ul>
<li><b>Arts. 28 y 29 LTBG:</b> infracciones sancionadas.</li>
<li><b>Art. 31 LTBG:</b> órgano competente y procedimiento.</li>
<li><b>Arts. 55 y 56 de la Ley 1/2014 de Andalucía</b> (documento 9): sanciones disciplinarias y a otras entidades.</li>
</ul>
<div class="interp"><span class="lbl">Interpretación / contexto — aportación externa</span>El art. 30.5 remite al <b>art. 131.3 de la Ley 30/1992</b>, derogada. Hoy los criterios de graduación de las sanciones están en el <b>art. 29.3 de la Ley 40/2015</b> (documento 2 de la biblioteca).</div>`,trampas:`<ul>
<li>La <b>publicación</b> del incumplimiento es sanción de las <b>graves</b>, y se aplica también a las muy graves.</li>
<li>La inhabilitación es de <b>cinco a diez años</b>.</li>
<li>La destitución no procede si el cargo <b>ya había cesado</b>.</li>
</ul>`,ancla:`<p><b>Leve → amonestación. Grave → publicar y sin indemnización. Muy grave → además, fuera y de 5 a 10 años sin volver.</b></p>`,vis:`<svg viewBox="0 0 640 150" role="img" aria-label="Sanciones por infracciones de buen gobierno">
<rect x="30" y="30" width="180" height="70" rx="8" fill="var(--ej-bg)" stroke="var(--ej)"/>
<text x="120" y="55" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ej)">Leve</text>
<text x="120" y="76" text-anchor="middle" font-size="10" fill="currentColor">amonestación</text>
<rect x="230" y="30" width="180" height="70" rx="8" fill="var(--warn-bg)" stroke="var(--warn)"/>
<text x="320" y="55" text-anchor="middle" font-size="11" font-weight="700" fill="var(--warn)">Grave</text>
<text x="320" y="74" text-anchor="middle" font-size="10" fill="currentColor">declaración y publicación</text>
<text x="320" y="90" text-anchor="middle" font-size="10" fill="currentColor">sin indemnización por cese</text>
<rect x="430" y="30" width="180" height="70" rx="8" fill="var(--exc-bg)" stroke="var(--exc)"/>
<text x="520" y="55" text-anchor="middle" font-size="11" font-weight="700" fill="var(--exc)">Muy grave</text>
<text x="520" y="74" text-anchor="middle" font-size="10" fill="currentColor">lo anterior + destitución</text>
<text x="520" y="90" text-anchor="middle" font-size="10" fill="currentColor">y 5 a 10 años sin alto cargo</text>
<text x="320" y="130" text-anchor="middle" font-size="10" fill="var(--ink2)">Graduación: entidad de la infracción · perjuicio · ganancias · daño a la Hacienda · subsanación y reparación</text>
</svg>`},
{n:31,t:"Órgano competente y procedimiento",ubic:"Título II (Buen gobierno)",idea:"Procedimiento de oficio: incoa y sanciona quien corresponda según el cargo y la Administración.",literal:`<p>1. El procedimiento sancionador se iniciará de oficio, por acuerdo del órgano competente, bien por propia iniciativa o como consecuencia de orden superior, petición razonada de otros órganos o denuncia de los ciudadanos.</p><p>La responsabilidad será exigida en procedimiento administrativo instruido al efecto, sin perjuicio de dar conocimiento de los hechos al Tribunal de Cuentas por si procediese, en su caso, la incoación del oportuno procedimiento de responsabilidad contable.</p><p>2. El órgano competente para ordenar la incoación será:</p><p>a) Cuando el alto cargo tenga la condición de miembro del Gobierno o de Secretario de Estado, el Consejo de Ministros a propuesta del Ministro de Hacienda y Administraciones Públicas.</p><p>b) Cuando los presuntos responsables sean personas al servicio de la Administración General del Estado distintas de los anteriores, el Ministro de Hacienda y Administraciones Públicas.</p><p>c) Cuando los presuntos responsables sean personas al servicio de la Administración autonómica o local, la orden de incoación del procedimiento se dará por los órganos que tengan atribuidas estas funciones en aplicación del régimen disciplinario propio de las Comunidades Autónomas o Entidades Locales en las que presten servicios los cargos contra los que se dirige el procedimiento.</p><p>3. En los supuestos previstos en las letras a) y b) del apartado anterior, la instrucción de los correspondientes procedimientos corresponderá a la Oficina de Conflictos de Intereses. En el supuesto contemplado en el apartado c) la instrucción corresponderá al órgano competente en aplicación del régimen disciplinario propio de la Comunidad Autónoma o Entidad Local correspondiente.</p><p>4. La competencia para la imposición de sanciones corresponderá:</p><p>a) Al Consejo de Ministros cuando el alto cargo tenga la condición de miembro del Gobierno o Secretario de Estado.</p><p>b) Al Ministro de Hacienda y Administraciones Públicas cuando el responsable sea un alto cargo de la Administración General del Estado.</p><p>c) Cuando el procedimiento se dirija contra altos cargos de las Comunidades Autónomas o Entidades Locales, los órganos que tengan atribuidas estas funciones en aplicación del régimen disciplinario propio de Administraciones en las que presten servicios los cargos contra los que se dirige el procedimiento o, en su caso, el Consejo de Gobierno de la Comunidad Autónoma o el Pleno de la Junta de Gobierno de la Entidad Local de que se trate.</p><p>5. Las resoluciones que se dicten en aplicación del procedimiento sancionador regulado en este título serán recurribles ante el orden jurisdiccional contencioso-administrativo.</p>`,dis:`<ul>
<li><b>31.1 — inicio:</b> siempre <b>de oficio</b>, por propia iniciativa, orden superior, petición razonada de otros órganos o <b>denuncia de los ciudadanos</b>. Se dará conocimiento de los hechos al <b>Tribunal de Cuentas</b> por si procediera la <span class="t" data-k="responsabilidadcont">responsabilidad contable</span>.</li>
<li><b>31.2 — incoación:</b> a) <b>Consejo de Ministros</b>, a propuesta del Ministro competente, si el alto cargo es miembro del Gobierno o Secretario de Estado · b) el <b>Ministro</b> competente, para el resto de personas al servicio de la AGE · c) para el ámbito <b>autonómico y local</b>, los órganos que tengan atribuidas esas funciones conforme a su régimen disciplinario propio.</li>
<li><b>31.3 — instrucción:</b> en los supuestos a) y b), la <span class="t" data-k="oficinaci">Oficina de Conflictos de Intereses</span>; en el supuesto c), el <b>órgano competente autonómico o local</b>.</li>
<li><b>31.4 — imposición de sanciones:</b> Consejo de Ministros, Ministro competente o los órganos autonómicos y locales, según el caso.</li>
<li><b>31.5 — recursos:</b> las resoluciones son recurribles ante el orden <b>contencioso-administrativo</b>.</li>
</ul>`,llano:`<p>El expediente se abre siempre de oficio, aunque lo haya provocado la denuncia de un ciudadano. Quién lo abre y quién sanciona depende del cargo: en el Estado, el Consejo de Ministros o el Ministro; en comunidades y ayuntamientos, los órganos que tengan esa competencia por su propio régimen disciplinario. Y siempre se avisa al Tribunal de Cuentas por si hay responsabilidad contable.</p>`,porque:`<p>La ley respeta la <b>autonomía</b> autonómica y local: no impone un órgano sancionador estatal para los cargos territoriales, sino que reenvía a su propio régimen. La comunicación al Tribunal de Cuentas evita que la vía sancionadora desplace a la <b>reparación del daño</b> a los fondos públicos, que es una responsabilidad distinta y compatible.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> quien abre el expediente depende del rango de la persona implicada.</li>
<li><b>Real:</b> frente a un alto cargo municipal, la incoación y la sanción corresponden a los órganos que las tengan atribuidas en el régimen disciplinario del ayuntamiento (art. 31.2.c y 31.4.c).</li>
<li><b>Caso límite:</b> la denuncia de un ciudadano no inicia el procedimiento por sí sola: sirve de <b>impulso</b>, pero el inicio es siempre de oficio.</li>
</ul>`,noej:`<ul>
<li><b>No hay</b> inicio a instancia de parte: siempre <b>de oficio</b>.</li>
<li><b>No excluye</b> este procedimiento la responsabilidad contable ante el Tribunal de Cuentas.</li>
</ul>`,conex:`<ul>
<li><b>Arts. 28 a 30 LTBG:</b> infracciones y sanciones.</li>
<li><b>Arts. 25 a 31 de la Ley 40/2015</b> (documento 2): principios de la potestad sancionadora.</li>
<li><b>Art. 223 del TRLHL</b> (documento 5): responsabilidad contable y Tribunal de Cuentas.</li>
<li><b>Arts. 57 y 58 de la Ley 1/2014 de Andalucía</b> (documento 9): procedimiento y competencia sancionadora autonómicos.</li>
</ul>`,trampas:`<ul>
<li>Inicio <b>siempre de oficio</b>, aunque haya denuncia ciudadana.</li>
<li>La instrucción estatal corresponde a la <b>Oficina de Conflictos de Intereses</b>.</li>
<li>En el ámbito local, incoación, instrucción y sanción se rigen por el <b>régimen disciplinario propio</b>.</li>
</ul>`,ancla:`<p><b>"De oficio, con aviso al Tribunal de Cuentas, y cada uno en su casa."</b></p>`,vis:`<svg viewBox="0 0 640 150" role="img" aria-label="Procedimiento sancionador de buen gobierno">

<text x="95" y="82" text-anchor="middle" font-size="10" fill="currentColor">también por denuncia</text>

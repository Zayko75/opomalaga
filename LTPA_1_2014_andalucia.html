{n:6,t:"Principios básicos",ubic:"Título I (Disposiciones generales)",idea:"Ocho principios básicos propios que guían la interpretación de la ley andaluza.",literal:`<p>Se tendrán en cuenta en la interpretación y aplicación de la presente ley los siguientes principios básicos:</p><p>a) Principio de transparencia, en cuya virtud toda la información pública es en principio accesible y sólo puede ser retenida para proteger otros derechos e intereses legítimos de acuerdo con la Ley.</p><p>b) Principio de libre acceso a la información pública, en cuya virtud cualquier persona puede solicitar el acceso a la información pública.</p><p>c) Principio de responsabilidad, en cuya virtud las entidades sujetas a lo dispuesto en la presente ley son responsables del cumplimiento de sus prescripciones.</p><p>d) Principio de no discriminación tecnológica, en cuya virtud las entidades sujetas al ámbito de aplicación de la presente ley habrán de arbitrar los medios necesarios para hacer efectiva la transparencia, con independencia del medio de acceso a la información.</p><p>e) Principio de veracidad, en cuya virtud la información pública ha de ser cierta y exacta, asegurando que procede de documentos respecto de los que se ha verificado su autenticidad, fiabilidad, integridad, disponibilidad y cadena de custodia.</p><p>f) Principio de utilidad, en cuya virtud la información pública que se suministre, siempre que sea posible, ha de ser adecuada al cumplimiento de los fines para los que se solicite.</p><p>g) Principio de gratuidad, en cuya virtud el acceso a la información y las solicitudes de acceso serán gratuitos, sin perjuicio de las exacciones que puedan establecerse por la expedición de copias o soportes o la transposición de la información a un formato diferente al original.</p><p>h) Principio de facilidad y comprensión, en cuya virtud la información se facilitará de la forma que resulte más simple e inteligible atendiendo a la naturaleza de la misma y a las necesidades de las personas con circunstancias especiales que les dificulten el ejercicio del derecho.</p><p>i) Principio de accesibilidad, por el que se proporcionará información estructurada sobre los documentos y recursos de información con vistas a facilitar la identificación y búsqueda de la información.</p><p>j) Principio de interoperabilidad, en cuya virtud la información será publicada conforme al Esquema Nacional de Interoperabilidad.</p><p>k) Principio de reutilización, en cuya virtud se fomentará que la información sea publicada en formatos que permitan su reutilización, de acuerdo con la legislación aplicable en materia de reutilización de la información del sector público.</p>`,dis:`<table><thead><tr><th>Principio</th><th>Contenido</th></tr></thead><tbody>
<tr><td><b>a) Transparencia</b></td><td>Toda la información pública es <b>en principio accesible</b> y solo puede retenerse para proteger otros derechos e intereses legítimos</td></tr>
<tr><td><b>b) Libre acceso</b></td><td><b>Cualquier persona</b> puede solicitar el acceso</td></tr>
<tr><td><b>c) Responsabilidad</b></td><td>Las entidades sujetas <b>responden</b> del cumplimiento de la ley</td></tr>
<tr><td><b>d) <span class="t" data-k="nodiscriminaciontec">No discriminación tecnológica</span></b></td><td>Medios necesarios con independencia del soporte utilizado</td></tr>
<tr><td><b>e) <span class="t" data-k="veracidad">Veracidad</span></b></td><td>Información <b>cierta y exacta</b>, procedente de documentos verificados</td></tr>
<tr><td><b>f) Utilidad</b></td><td>Información adecuada a los fines para los que se solicite</td></tr>
<tr><td><b>g) <span class="t" data-k="gratuidadand">Gratuidad</span></b></td><td>Acceso y solicitudes <b>gratuitos</b>, sin perjuicio de exacciones por copias o cambio de formato</td></tr>
<tr><td><b>h) Facilidad y comprensión</b></td><td>Información de la forma más <b>simple e inteligible</b>, atendiendo a las necesidades de personas con circunstancias especiales</td></tr>
</tbody></table>
<p class="small">Y los principios de <b>accesibilidad</b>, <b>interoperabilidad</b> y <b>reutilización</b>, coincidentes con los técnicos del art. 11 de la ley estatal.</p>`,llano:`<p>La ley andaluza abre con un catálogo de principios que no existe como tal en la estatal. Dos son especialmente útiles: el de <b>veracidad</b> —la información tiene que ser cierta, no solo estar publicada— y el de <b>no discriminación tecnológica</b>.</p>`,porque:`<p>Los principios no son decoración: el art. 6 dice expresamente que se tendrán en cuenta <b>en la interpretación y aplicación</b> de la ley. Y el de veracidad tiene consecuencia sancionadora directa: publicar información falsa o inexacta es infracción (arts. 53.2.b y 54.2).</p>`,ej:`<ul>
<li><b>Cotidiano:</b> no basta con colgar la lista de precios: tiene que estar bien y entenderse.</li>
<li><b>Real:</b> publicar datos de contratación desactualizados o erróneos vulnera el principio de <b>veracidad</b> y puede ser infracción grave.</li>
</ul>`,noej:`<ul>
<li><b>No son</b> meras declaraciones: informan la interpretación y aplicación de la ley.</li>
<li><b>No excluye</b> la gratuidad las exacciones por copias o cambio de soporte.</li>
</ul>`,conex:`<ul>
<li><b>Arts. 5 y 11 de la Ley 19/2013:</b> principios generales y técnicos estatales.</li>
<li><b>Arts. 53.2.b) y 54.2 de esta ley:</b> infracciones por incumplir el principio de veracidad.</li>
<li><b>Art. 9 de esta ley:</b> normas generales de publicidad activa.</li>
</ul>`,trampas:`<ul>
<li>El principio de <b>veracidad</b> es propio de la ley andaluza y tiene reflejo sancionador.</li>
<li>La <b>gratuidad</b> alcanza al acceso y a las solicitudes.</li>
</ul>`,ancla:`<p><b>"Accesible, libre, responsable, sin tecnología excluyente, veraz, útil, gratis y comprensible."</b> Ocho principios.</p>`,vis:`<svg viewBox="0 0 640 145" role="img" aria-label="Principios básicos de la ley andaluza">
<g font-size="10" text-anchor="middle" fill="currentColor">
<rect x="15" y="25" width="145" height="50" rx="8" fill="var(--acc-soft)" stroke="var(--acc)"/><text x="87" y="46" font-weight="700">a) Transparencia</text><text x="87" y="63">b) Libre acceso</text>
<rect x="172" y="25" width="145" height="50" rx="8" fill="var(--ej-bg)" stroke="var(--ej)"/><text x="244" y="46" font-weight="700">c) Responsabilidad</text><text x="244" y="63">d) No discriminación tecnológica</text>
<rect x="329" y="25" width="145" height="50" rx="8" fill="var(--warn-bg)" stroke="var(--warn)"/><text x="401" y="46" font-weight="700">e) Veracidad</text><text x="401" y="63">f) Utilidad</text>
<rect x="486" y="25" width="139" height="50" rx="8" fill="var(--panel)" stroke="var(--line)"/><text x="555" y="46" font-weight="700">g) Gratuidad</text><text x="555" y="63">h) Facilidad</text>
</g>
<text x="320" y="105" text-anchor="middle" font-size="10" fill="var(--exc)">El principio de VERACIDAD es propio de Andalucía y tiene consecuencia sancionadora</text>
<text x="320" y="125" text-anchor="middle" font-size="10" fill="var(--ink2)">Se tienen en cuenta en la interpretación y aplicación de toda la ley</text>
</svg>`},
{n:9,t:"Normas generales",ubic:"Título II (La publicidad activa)",idea:"Publicidad activa periódica, veraz, objetiva y actualizada, con carácter de mínimo.",literal:`<p>1. Las personas y entidades enumeradas en el artículo 3 publicarán de forma periódica, veraz, objetiva y actualizada la información pública cuyo conocimiento sea relevante para garantizar la transparencia de su actividad relacionada con el funcionamiento y el control de la actuación pública por parte de la ciudadanía y de la sociedad en general y favorecer la participación ciudadana en la misma.</p><p>En este sentido, adoptarán las medidas oportunas para asegurar la difusión de la información pública y su puesta a disposición de la ciudadanía de la manera más amplia y sistemática posible.</p><p>2. Las obligaciones de transparencia contenidas en este título tienen carácter de mínimas y generales y se entienden sin perjuicio de la aplicación de otras disposiciones específicas que prevean un régimen más amplio en materia de publicidad.</p><p>3. Serán de aplicación, en su caso, los límites al derecho de acceso a la información pública previstos en la normativa básica y, especialmente, el derivado de la protección de datos de carácter personal. A este respecto, cuando la información contuviera datos especialmente protegidos, la publicidad sólo se llevará a cabo previa disociación de los mismos.</p><p>4. La información pública objeto de publicidad activa estará disponible en las sedes electrónicas, portales o páginas web de las personas y entidades incluidas en el ámbito de aplicación de esta ley de una manera segura y comprensible, garantizando especialmente la accesibilidad universal y la no discriminación tecnológica, con objeto de que todas las personas puedan ejercer sus derechos en igualdad de condiciones e incorporando las</p><p>características necesarias para garantizar la accesibilidad de aquellas personas o colectivos que lo requieran.</p><p>Cuando se trate de entidades sin ánimo de lucro que persigan exclusivamente fines de interés social o cultural y cuyo presupuesto sea inferior a 50.000 euros, el cumplimiento de las obligaciones derivadas de esta ley podrá realizarse utilizando los medios electrónicos puestos a su disposición por la Administración Pública de la que provenga la mayor parte de las ayudas o subvenciones públicas percibidas por dichas entidades.</p><p>5. Toda la información estará a disposición de las personas con discapacidad en una modalidad accesible, entendiendo por tal aquella que sea suministrada por medios o en formatos adecuados de manera que resulten accesibles y comprensibles, conforme al principio de accesibilidad universal y diseño para todos.</p><p>6. En la redacción de la información que tenga la consideración de publicidad activa, se prestará especial atención a lo previsto en la Ley 12/2007, de 26 de noviembre, para la promoción de la igualdad de género en Andalucía, en lo referente a la utilización de lenguaje no sexista ni discriminatorio.</p><p>7. Toda la información pública señalada en este título se publicará y actualizará, con carácter general, trimestralmente, salvo que la normativa específica establezca otros plazos atendiendo a las peculiaridades propias de la información de que se trate y sin perjuicio de los plazos que puedan establecer las entidades locales en ejercicio de su autonomía o de la potestad de la Administración de la Junta de Andalucía y de sus entidades instrumentales para publicar toda la información pública que estime conveniente en plazos más breves.</p><p>8. La publicidad activa prevista en este título se configurará de forma que permita la participación ciudadana que sea consecuencia de la información facilitada.</p>`,dis:`<ul>
<li><b>9.1:</b> publicación <b>periódica, veraz, objetiva y actualizada</b> de la información relevante, adoptando medidas para su difusión <b>más amplia y sistemática posible</b>.</li>
<li><b>9.2:</b> las obligaciones de este título tienen carácter de <b>mínimas y generales</b> y se entienden sin perjuicio de otras disposiciones con régimen más amplio.</li>
<li><b>9.3:</b> se aplican los <b>límites</b> de la normativa básica y, especialmente, la <b>protección de datos</b>; con datos especialmente protegidos, publicación <b>previa disociación</b>.</li>
<li><b>9.4:</b> información disponible en <b>sedes electrónicas, portales o páginas web</b>, de manera segura y comprensible y con garantía de accesibilidad. Para entidades sin ánimo de lucro con fines de interés social o cultural y presupuesto <b>inferior a 50.000 €</b>, cabe usar los medios electrónicos de la Administración que las financie.</li>
<li><b>9.5:</b> información accesible para <b>personas con discapacidad</b>.</li>
</ul>
<div class="box ej"><span class="lbl">Diferencia con el art. 5 estatal</span>La ley andaluza añade dos adjetivos: la información debe ser además <b>veraz y objetiva</b>, no solo periódica y actualizada.</div>`,llano:`<p>Mismo esquema que la ley estatal, con dos exigencias más: la información tiene que ser veraz y objetiva. Y se repite el umbral de los 50.000 euros para que las pequeñas entidades sin ánimo de lucro puedan apoyarse en los medios de la Administración que las subvenciona.</p>`,porque:`<p>Añadir <b>veracidad y objetividad</b> no es retórico: convierte en incumplimiento la publicación de datos inexactos o sesgados, algo que la ley estatal solo aborda indirectamente. Es coherente con el principio del art. 6.e) y con el régimen sancionador propio.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> publicar los resultados completos y no solo los que favorecen.</li>
<li><b>Real:</b> un ayuntamiento que publica únicamente los contratos adjudicados por procedimiento abierto, omitiendo los menores, incumple los principios de veracidad y objetividad.</li>
</ul>`,noej:`<ul>
<li><b>No es</b> un techo: las obligaciones son <b>mínimas y generales</b>.</li>
<li><b>No cabe</b> publicar datos especialmente protegidos sin disociación previa.</li>
</ul>`,conex:`<ul>
<li><b>Art. 5 de la Ley 19/2013:</b> principios generales de la publicidad activa.</li>
<li><b>Art. 6.e) de esta ley:</b> principio de veracidad.</li>
<li><b>Art. 23 de esta ley:</b> control del cumplimiento por el Consejo andaluz.</li>
</ul>`,trampas:`<ul>
<li>Cuatro adjetivos: <b>periódica, veraz, objetiva y actualizada</b>.</li>
<li>Las obligaciones son <b>mínimas y generales</b>.</li>
<li>El umbral de los <b>50.000 €</b> coincide con el del art. 5.4 estatal.</li>
</ul>`,ancla:`<p><b>"Periódica, veraz, objetiva y actualizada."</b> Dos adjetivos más que en la ley estatal.</p>`,vis:`<svg viewBox="0 0 640 130" role="img" aria-label="Normas generales de publicidad activa en Andalucía">
<g font-size="10" text-anchor="middle" fill="currentColor">
<rect x="15" y="30" width="145" height="52" rx="8" fill="var(--acc-soft)" stroke="var(--acc)"/><text x="87" y="60" font-size="11" font-weight="700" fill="var(--acc)">Periódica</text>
<rect x="172" y="30" width="145" height="52" rx="8" fill="var(--exc-bg)" stroke="var(--exc)"/><text x="244" y="60" font-size="11" font-weight="700" fill="var(--exc)">Veraz</text>
<rect x="329" y="30" width="145" height="52" rx="8" fill="var(--exc-bg)" stroke="var(--exc)"/><text x="401" y="60" font-size="11" font-weight="700" fill="var(--exc)">Objetiva</text>
<rect x="486" y="30" width="139" height="52" rx="8" fill="var(--acc-soft)" stroke="var(--acc)"/><text x="555" y="60" font-size="11" font-weight="700" fill="var(--acc)">Actualizada</text>
</g>
<text x="320" y="105" text-anchor="middle" font-size="10" fill="var(--ink2)">Obligaciones mínimas y generales · límites básicos y disociación de datos protegidos</text>
<text x="320" y="122" text-anchor="middle" font-size="10" fill="var(--ej)">Entidades sin ánimo de lucro con presupuesto inferior a 50.000 €: medios de la Administración financiadora</text>
</svg>`},
{n:15,t:"Información sobre contratos, convenios y subvenciones",ubic:"Título II (La publicidad activa)",idea:"Contratos, convenios y subvenciones con más detalle que la ley estatal.",literal:`<p>Las entidades incluidas en el ámbito de aplicación de esta ley deberán hacer pública la información relativa a la gestión administrativa que se indica a continuación:</p><p>a) Todos los contratos, con indicación del objeto, duración, el importe de licitación y de adjudicación, el procedimiento utilizado para su celebración, los instrumentos a través de los que, en su caso, se ha publicitado, el número de licitadores participantes en el procedimiento y la identidad del adjudicatario, así como las modificaciones y prórrogas del contrato y la indicación de los procedimientos que han quedado desiertos, los supuestos de resolución de contrato o declaración de nulidad, así como los casos de posibles revisiones de precios y cesión de contratos. Igualmente, serán objeto de publicación las decisiones de desistimiento y renuncia de los contratos y las subcontrataciones que se realicen con mención de las personas adjudicatarias.</p><p>La publicación de la información relativa a los contratos menores podrá realizarse trimestralmente.</p><p>Asimismo, se publicarán datos estadísticos sobre el porcentaje en volumen presupuestario de contratos adjudicados a través de cada uno de los procedimientos previstos en la legislación de contratos del sector público.</p><p>b) La relación de los convenios suscritos, con mención de las partes firmantes, su objeto, plazo de duración, modificaciones realizadas, personas obligadas a la realización de las prestaciones y, en su caso, las obligaciones económicas convenidas. Igualmente, se publicarán las encomiendas de gestión que se firmen, con indicación de su objeto, presupuesto, obligaciones económicas y las subcontrataciones que se realicen con mención</p><p>de las personas adjudicatarias, procedimiento seguido para la adjudicación e importe de la misma.</p><p>c) Las subvenciones y ayudas públicas concedidas con indicación de la convocatoria o la resolución de concesión en el caso de subvenciones excepcionales, el programa y crédito presupuestario al que se imputan, su importe, objetivo o finalidad y personas beneficiarias. No obstante, las subvenciones cofinanciadas con fondos agrícolas europeos se regirán, en lo que se refiere a la publicación de la información sobre los beneficiarios, por lo dispuesto en los artículos 111 y 112 del Reglamento (UE) número 1306/2013 del Parlamento y del Consejo, de 17 de diciembre de 2013, sobre la financiación, gestión y seguimiento de la Política Agrícola Común, o norma que la sustituya.</p>`,dis:`<ul>
<li><b>a) Contratos:</b> <b>todos</b>, con objeto, duración, importes de licitación y adjudicación, procedimiento, publicidad, número de licitadores, identidad del adjudicatario, modificaciones, desistimientos y renuncias. <b>Los contratos menores pueden publicarse trimestralmente.</b> Además, datos estadísticos por procedimiento.</li>
<li><b>b) Convenios:</b> relación con partes, objeto, plazo, modificaciones, obligados y obligaciones económicas; también las <b>encomiendas de gestión</b>, con su objeto, presupuesto, obligaciones económicas, subcontrataciones, adjudicatarias, procedimiento e importe.</li>
<li><b>c) Subvenciones:</b> concedidas, con indicación de la <b>convocatoria o resolución</b> en las excepcionales, el <b>programa y crédito presupuestario</b>, importe, objetivo o finalidad y beneficiarios.</li>
</ul>
<div class="box ej"><span class="lbl">Especialidades frente al art. 8 estatal</span>La ley andaluza añade la publicación de <b>desistimientos y renuncias</b>, permite la publicación <b>trimestral de los contratos menores</b> y exige identificar el <b>programa y crédito presupuestario</b> de cada subvención.</div>`,llano:`<p>Es el artículo gemelo del art. 8 estatal, pero con más detalle: hay que decir también cuándo se desiste o se renuncia a un contrato, se permite agrupar los contratos menores por trimestres y, en las subvenciones, hay que identificar de qué partida presupuestaria salen.</p>`,porque:`<p>El detalle adicional responde a la experiencia: los <b>contratos menores</b> son la vía más frecuente de fragmentación del gasto, y conocer el <b>crédito presupuestario</b> de una subvención permite enlazar la transparencia subvencional con el control presupuestario del tema 8.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> un extracto bancario que además dice de qué cuenta sale cada pago.</li>
<li><b>Real:</b> un ayuntamiento andaluz publica trimestralmente la relación de contratos menores y, en cada subvención, la aplicación presupuestaria 341/48000 con la que se financia.</li>
</ul>`,noej:`<ul>
<li><b>No permite</b> la publicación trimestral para todos los contratos: solo para los <b>menores</b>.</li>
<li><b>No basta</b> con publicar el importe de la subvención: hay que indicar convocatoria, programa y crédito.</li>
</ul>`,conex:`<ul>
<li><b>Art. 8.1 de la Ley 19/2013:</b> equivalente estatal.</li>
<li><b>Arts. 18 y 20 de la Ley 38/2003</b> (documento 8): publicidad de subvenciones y BDNS.</li>
<li><b>Art. 63 de la Ley 9/2017</b> (documento 7): perfil de contratante.</li>
<li><b>Orden EHA/3565/2008</b> (documento 6): estructura de la aplicación presupuestaria que hay que citar.</li>
</ul>`,trampas:`<ul>
<li>Los <b>contratos menores</b> pueden publicarse <b>trimestralmente</b>.</li>
<li>Se publican también <b>desistimientos y renuncias</b>.</li>
<li>En subvenciones hay que identificar <b>programa y crédito presupuestario</b>.</li>
</ul>`,ancla:`<p><b>"Todos los contratos —los menores, por trimestres— y las subvenciones, con su partida."</b></p>`,vis:`<svg viewBox="0 0 640 135" role="img" aria-label="Información sobre contratos, convenios y subvenciones en Andalucía">

<rect x="440" y="30" width="170" height="60" rx="8" fill="var(--warn-bg)" stroke="var(--warn)"/><text x="525" y="52" font-size="11" font-weight="700" fill="var(--warn)">c) Subvenciones</text><text x="525" y="70">convocatoria y beneficiarios</text><text x="525" y="84" fill="var(--exc)">programa y crédito</text>

{n:21,t:"Publicidad de los plenos de las entidades locales",ubic:"Título II (La publicidad activa)",idea:"Los plenos locales se emiten por internet o se cuelga su grabación.",literal:`<p>Cuando las entidades locales celebren sesiones plenarias, facilitarán, salvo que concurran causas justificadas de imposibilidad técnica o económica, su acceso a través de Internet, bien transmitiendo la sesión, bien dando acceso al archivo audiovisual grabado una vez celebrada la misma. En todo caso, las personas asistentes podrán realizar la grabación de las sesiones por sus propios medios, respetando el funcionamiento ordinario de la institución.</p>`,dis:`<ul>
<li><b>Obligación:</b> cuando las entidades locales celebren <b>sesiones plenarias</b>, facilitarán su <b>acceso a través de internet</b>, bien <b>transmitiendo</b> la sesión, bien dando acceso al <b>archivo audiovisual grabado</b> una vez celebrada.</li>
<li><b>Excepción:</b> salvo que concurran <b>causas justificadas de imposibilidad técnica o económica</b>.</li>
<li><b>Garantía adicional:</b> en todo caso, las personas asistentes <b>podrán grabar</b> las sesiones por sus propios medios, respetando el funcionamiento ordinario de la institución.</li>
</ul>
<div class="box ej"><span class="lbl">Sin equivalente estatal</span>La Ley 19/2013 <b>no contiene</b> una obligación semejante. Es una de las especialidades andaluzas más fáciles de preguntar y más relevantes para una entidad local.</div>`,llano:`<p>Los plenos municipales tienen que poder verse por internet, en directo o en diferido, salvo que la entidad acredite que no puede técnica o económicamente. Y aunque no se emitan, cualquier asistente puede grabarlos.</p>`,porque:`<p>El pleno es el órgano donde se debate y decide lo esencial de la vida local. Abrirlo a internet multiplica el control ciudadano sin coste apreciable. Y reconocer expresamente el <b>derecho a grabar</b> zanja los conflictos que se producían cuando se impedía a vecinos o periodistas registrar la sesión.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> una asamblea que se retransmite para quien no puede asistir.</li>
<li><b>Real:</b> un ayuntamiento andaluz emite sus plenos por su canal en línea y mantiene el archivo audiovisual accesible.</li>
<li><b>Caso límite:</b> un municipio muy pequeño puede alegar imposibilidad técnica o económica, pero debe <b>justificarla</b>: no basta con no querer.</li>
</ul>`,noej:`<ul>
<li><b>No exige</b> necesariamente la transmisión en directo: basta con dar acceso al archivo grabado.</li>
<li><b>No puede</b> impedirse a los asistentes grabar por sus propios medios.</li>
</ul>`,conex:`<ul>
<li><b>Art. 22 de esta ley:</b> transparencia del funcionamiento de los gobiernos.</li>
<li><b>Ley 7/1985 (LBRL)</b> <i>(norma externa a la biblioteca)</i>: carácter público de las sesiones del Pleno.</li>
<li><b>RD 203/2021</b> (documento 4): medios electrónicos y sede.</li>
</ul>`,trampas:`<ul>
<li>Dos opciones alternativas: <b>transmitir</b> o dar acceso al <b>archivo grabado</b>.</li>
<li>La excepción exige <b>causas justificadas</b> de imposibilidad técnica o económica.</li>
<li>Los asistentes pueden grabar <b>en todo caso</b>.</li>
</ul>`,ancla:`<p><b>"El pleno, en internet; y si no, que grabe quien quiera."</b> Especialidad andaluza pura.</p>`,vis:`<svg viewBox="0 0 640 125" role="img" aria-label="Publicidad de los plenos locales">

<text x="157" y="53" text-anchor="middle" font-size="11" font-weight="700" fill="var(--acc)">Transmisión en directo</text>
<text x="157" y="72" text-anchor="middle" font-size="10" fill="currentColor">o acceso al archivo audiovisual</text>
<rect x="355" y="30" width="255" height="56" rx="8" fill="var(--ej-bg)" stroke="var(--ej)"/>
<text x="482" y="53" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ej)">Grabación por los asistentes</text>
<text x="482" y="72" text-anchor="middle" font-size="10" fill="currentColor">en todo caso, con sus propios medios</text>
<text x="320" y="112" text-anchor="middle" font-size="10" fill="var(--exc)">Salvo causas justificadas de imposibilidad técnica o económica</text>
</svg>`},
{n:25,t:"Límites al derecho de acceso a la información pública",ubic:"Título III (El derecho de acceso a la información pública)",idea:"Los límites son los básicos, pero temporales y de interpretación restrictiva.",literal:`<p>1. El derecho de acceso a la información pública sólo podrá ser restringido o denegado en los términos previstos en la legislación básica.</p><p>2. Las limitaciones al derecho de acceso sólo serán de aplicación durante el período de tiempo determinado por las leyes o en tanto se mantenga la razón que las justifique. Su aplicación será valorada con respecto a la posibilidad de facilitar el acceso parcial.</p><p>3. La aplicación de los límites será justificada y proporcionada a su objeto y finalidad de protección y atenderá a las circunstancias del caso concreto, especialmente a la concurrencia de un interés público o privado superior que justifique el acceso.</p><p>4. Las resoluciones que restrinjan o denieguen el derecho de acceso serán objeto de publicidad, previa disociación de los datos de carácter personal que contuvieran. Cuando la mera indicación de la existencia o no de la información supusiera la vulneración de alguno de los límites al acceso, se hará constar esta circunstancia al desestimarse la solicitud.</p>`,dis:`<ul>
<li><b>25.1:</b> el derecho solo puede restringirse o denegarse <b>en los términos de la legislación básica</b> —es decir, los doce límites del art. 14 de la Ley 19/2013—.</li>
<li><b>25.2 — temporalidad:</b> las limitaciones solo se aplican <b>durante el periodo determinado por las leyes</b> o <b>en tanto se mantenga la razón que las justifique</b>, y su aplicación se valora respecto de la posibilidad de <b>acceso parcial</b>.</li>
<li><b>25.3:</b> aplicación <b>justificada y proporcionada</b>, atendiendo al caso concreto y al posible <b>interés superior</b>.</li>
<li><b>25.4 — publicidad:</b> las resoluciones que restrinjan o denieguen el acceso se publican, previa disociación. Si la mera indicación de la existencia de la información vulnerase un límite, se hará constar al desestimar.</li>
</ul>
<div class="box ej"><span class="lbl">Especialidad andaluza</span>La ley estatal no subraya la <b>temporalidad</b> de los límites. El art. 25.2 andaluz obliga a comprobar si la razón que justificó la denegación <b>sigue existiendo</b>: un documento reservado hoy puede ser accesible mañana.</div>`,llano:`<p>Andalucía no inventa nuevos límites: usa los de la ley estatal. Pero añade dos matices importantes: los límites duran lo que dure la razón que los justifica, y antes de denegar hay que valorar si cabe dar acceso parcial.</p>`,porque:`<p>Los límites protegen bienes jurídicos que pueden desaparecer con el tiempo: una investigación termina, una negociación se cierra. Vincular la limitación a la <b>persistencia de su causa</b> impide que la denegación se convierta en una etiqueta permanente sobre un documento.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> una información confidencial durante una negociación que deja de serlo cuando esta acaba.</li>
<li><b>Real:</b> denegado el acceso a un informe por afectar a una investigación en curso, concluida esta, una nueva solicitud debería resolverse concediendo el acceso.</li>
</ul>`,noej:`<ul>
<li><b>No crea</b> la ley andaluza límites nuevos: se remite a la legislación básica.</li>
<li><b>No cabe</b> denegar sin valorar antes la posibilidad de <b>acceso parcial</b>.</li>
</ul>`,conex:`<ul>
<li><b>Arts. 14 a 16 de la Ley 19/2013:</b> límites, protección de datos y acceso parcial.</li>
<li><b>Arts. 26 y 27 de esta ley:</b> protección de datos y acceso parcial en el ámbito andaluz.</li>
</ul>`,trampas:`<ul>
<li>Los límites son los de la <b>legislación básica</b>: no hay lista propia.</li>
<li>Rige la <b>temporalidad</b>: solo mientras se mantenga la razón que los justifique.</li>
<li>Antes de denegar hay que valorar el <b>acceso parcial</b>.</li>
</ul>`,ancla:`<p><b>"Los límites son los de siempre, pero caducan."</b> Y antes de denegar, <b>mira si puedes dar una parte</b>.</p>`,vis:`<svg viewBox="0 0 640 130" role="img" aria-label="Límites al acceso en la ley andaluza">
<rect x="40" y="30" width="250" height="60" rx="8" fill="var(--acc-soft)" stroke="var(--acc)"/>
<text x="165" y="53" text-anchor="middle" font-size="11" font-weight="700" fill="var(--acc)">Límites de la legislación básica</text>
<text x="165" y="72" text-anchor="middle" font-size="10" fill="currentColor">los doce del art. 14 de la Ley 19/2013</text>
<rect x="350" y="30" width="250" height="60" rx="8" fill="var(--ej-bg)" stroke="var(--ej)"/>
<text x="475" y="53" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ej)">Con dos matices andaluces</text>
<text x="475" y="72" text-anchor="middle" font-size="10" fill="currentColor">temporalidad + valorar acceso parcial</text>
<text x="320" y="118" text-anchor="middle" font-size="10" fill="var(--ink2)">Las resoluciones denegatorias se publican previa disociación de datos personales</text>
</svg>`},
{n:30,t:"Reglas especiales relativas a las causas de inadmisión de las solicitudes de acceso",ubic:"Título III (El derecho de acceso a la información pública)",idea:"Tres reglas que estrechan las causas de inadmisión de la ley estatal.",literal:`<p>En relación a las causas de inadmisión señaladas en la legislación básica, se aplicarán las siguientes reglas:</p><p>a) En el supuesto de que se inadmita la solicitud porque la información esté en curso de elaboración o publicación general, la denegación de información deberá especificar el órgano que elabora dicha información y el tiempo previsto para su conclusión y puesta a disposición.</p><p>b) Los informes preceptivos no podrán ser considerados como información de carácter auxiliar o de apoyo para justificar la inadmisión de las solicitudes referidas a los mismos.</p><p>c) Asimismo, no se estimará como reelaboración que justifique la inadmisión la información que pueda obtenerse mediante un tratamiento informatizado de uso corriente.</p>`,dis:`<table><thead><tr><th>Regla</th><th>Contenido</th></tr></thead><tbody>
<tr><td><b>a)</b></td><td>Si se inadmite porque la información está <b>en curso de elaboración o publicación</b>, la denegación debe <b>especificar el órgano</b> que la elabora y el <b>tiempo previsto</b> para su conclusión</td></tr>
<tr><td><b>b)</b></td><td>Los <b>informes preceptivos</b> <b>no pueden</b> considerarse información de carácter <b>auxiliar o de apoyo</b> para justificar la inadmisión</td></tr>
<tr><td><b>c)</b></td><td><b>No se estima reelaboración</b> la información que pueda obtenerse mediante un <b>tratamiento informatizado de uso corriente</b></td></tr>
</tbody></table>
<div class="box ej"><span class="lbl">La especialidad más útil del tema</span>Estas tres reglas cierran los tres abusos más frecuentes en la aplicación del art. 18 de la ley estatal: escudarse en que «se está elaborando», calificar de auxiliar un informe preceptivo y llamar «reelaboración» a un simple filtro de base de datos.</div>`,llano:`<p>Andalucía no añade causas de inadmisión: las <b>recorta</b>. Si dices que la información se está elaborando, tienes que decir quién y para cuándo. Un informe preceptivo nunca es un simple papel de trabajo. Y filtrar una base de datos no es reelaborar.</p>`,porque:`<p>Las causas de inadmisión del art. 18 estatal se habían convertido en la vía habitual para no contestar. Estas reglas responden a la <b>doctrina consolidada</b> de los consejos de transparencia y la elevan a rango legal en Andalucía, reduciendo el margen de la Administración para eludir el acceso.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> «lo estamos preparando» deja de valer si hay que decir quién lo prepara y cuándo estará.</li>
<li><b>Real:</b> se solicita el informe jurídico preceptivo de un expediente: no puede inadmitirse como información auxiliar (regla b).</li>
<li><b>Caso límite:</b> extraer de una base de datos las licencias de un año concreto es un tratamiento de uso corriente: no cabe inadmitir por reelaboración (regla c).</li>
</ul>`,noej:`<ul>
<li><b>No añade</b> causas de inadmisión nuevas.</li>
<li><b>No impide</b> inadmitir por información realmente auxiliar, como notas o borradores sin carácter preceptivo.</li>
</ul>`,conex:`<ul>
<li><b>Art. 18 de la Ley 19/2013:</b> causas de inadmisión que estas reglas modulan.</li>
<li><b>Art. 13 de la Ley 19/2013:</b> concepto de información pública.</li>
<li><b>Art. 31 de esta ley:</b> deber de auxilio y colaboración con la persona solicitante.</li>
</ul>`,trampas:`<ul>
<li>La regla a) exige indicar <b>órgano</b> y <b>tiempo previsto</b>.</li>
<li>Los <b>informes preceptivos</b> nunca son información auxiliar.</li>
<li>El <b>tratamiento informatizado de uso corriente</b> no es reelaboración.</li>
</ul>`,ancla:`<p><b>"Quién y cuándo · el preceptivo no es auxiliar · filtrar no es reelaborar."</b> Tres reglas de oro.</p>`,vis:`<svg viewBox="0 0 640 130" role="img" aria-label="Reglas especiales sobre las causas de inadmisión">
<g font-size="10" text-anchor="middle" fill="currentColor">
<rect x="20" y="30" width="185" height="62" rx="8" fill="var(--acc-soft)" stroke="var(--acc)"/><text x="112" y="52" font-size="11" font-weight="700" fill="var(--acc)">a) En elaboración</text><text x="112" y="70">hay que decir órgano</text><text x="112" y="85">y tiempo previsto</text>
<rect x="227" y="30" width="185" height="62" rx="8" fill="var(--ej-bg)" stroke="var(--ej)"/><text x="320" y="52" font-size="11" font-weight="700" fill="var(--ej)">b) Informes preceptivos</text><text x="320" y="70">nunca son</text><text x="320" y="85">información auxiliar</text>
<rect x="434" y="30" width="186" height="62" rx="8" fill="var(--warn-bg)" stroke="var(--warn)"/><text x="527" y="52" font-size="11" font-weight="700" fill="var(--warn)">c) Reelaboración</text><text x="527" y="70">no lo es el tratamiento</text><text x="527" y="85">informatizado de uso corriente</text>
</g>
<text x="320" y="118" text-anchor="middle" font-size="10" fill="var(--ink2)">Modulan las causas del art. 18 de la Ley 19/2013 reduciendo el margen de inadmisión</text>
</svg>`},
{n:32,t:"Plazo de resolución y notificación",ubic:"Título III (El derecho de acceso a la información pública)",idea:"En la Junta de Andalucía el plazo baja a veinte días hábiles.",literal:`<p>Las solicitudes deberán resolverse y notificarse en el menor plazo posible. En todo caso, en el ámbito de la Administración de la Junta de Andalucía y sus entidades instrumentales, el plazo máximo para dictar y notificar la resolución será de 20 días hábiles desde la recepción de la solicitud por el órgano competente para resolver, prorrogables por igual período en el caso de que el volumen o la complejidad de la información solicitada lo requiera. Dicha ampliación será notificada a la persona solicitante.</p>`,dis:`<ul>
<li><b>Regla general:</b> las solicitudes deben resolverse y notificarse <b>en el menor plazo posible</b>.</li>
<li><b>Plazo máximo:</b> en el ámbito de la <b>Administración de la Junta de Andalucía y sus entidades instrumentales</b>, <b>veinte días hábiles</b> desde la recepción de la solicitud por el órgano competente para resolver.</li>
<li><b>Ampliación:</b> posible por otro periodo igual en caso de volumen o complejidad, previa notificación.</li>
<li><b>Comparación:</b> la ley estatal fija <b>un mes</b> (art. 20.1 de la Ley 19/2013). El plazo andaluz es <b>más breve</b>, pero se aplica al ámbito autonómico; las entidades locales aplican el plazo básico salvo que su normativa propia establezca uno menor.</li>
</ul>`,llano:`<p>La Junta se autoimpone contestar en veinte días hábiles, menos que el mes de la ley estatal. Y la regla general es aún más exigente: resolver en el menor plazo posible.</p>`,porque:`<p>Acortar el plazo es la forma más eficaz de mejorar un derecho de acceso: la información pierde valor con el tiempo. Que el plazo se predique del ámbito autonómico responde al reparto competencial — la ley básica fija el mínimo de garantía y la autonómica puede mejorarlo <b>en su propio ámbito</b>.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> un servicio que promete responder en menos tiempo del que exige la norma.</li>
<li><b>Real:</b> solicitud presentada a la Junta el 2 de marzo: debe resolverse y notificarse en <b>20 días hábiles</b>. La misma solicitud a un ayuntamiento se rige por el plazo de <b>un mes</b> del art. 20.1 estatal, salvo norma local más favorable.</li>
</ul>`,noej:`<ul>
<li><b>No se aplican</b> los veinte días, por este artículo, a las entidades locales andaluzas.</li>
<li><b>No hay</b> silencio positivo: se mantiene el efecto desestimatorio de la ley básica.</li>
</ul>`,conex:`<ul>
<li><b>Art. 20 de la Ley 19/2013:</b> plazo de un mes y silencio desestimatorio.</li>
<li><b>Art. 33 de esta ley:</b> reclamación ante el Consejo andaluz.</li>
<li><b>Art. 31 de esta ley:</b> deber de auxilio y colaboración.</li>
</ul>`,trampas:`<ul>
<li><b>Veinte días hábiles</b> frente al mes estatal.</li>
<li>El plazo se predica de la <b>Junta de Andalucía y sus entidades instrumentales</b>.</li>
<li>La regla previa es resolver <b>en el menor plazo posible</b>.</li>
</ul>`,ancla:`<p><b>"Junta: 20 días hábiles. Ayuntamiento: un mes."</b> Es la comparación estrella del tema.</p>`,vis:`<svg viewBox="0 0 640 130" role="img" aria-label="Plazos de resolución comparados">
<rect x="40" y="30" width="250" height="62" rx="8" fill="var(--ej-bg)" stroke="var(--ej)"/>
<text x="165" y="55" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ej)">20 días hábiles</text>
<text x="165" y="76" text-anchor="middle" font-size="10" fill="currentColor">Junta de Andalucía y entes instrumentales</text>
<rect x="350" y="30" width="250" height="62" rx="8" fill="var(--acc-soft)" stroke="var(--acc)"/>
<text x="475" y="55" text-anchor="middle" font-size="13" font-weight="700" fill="var(--acc)">1 mes</text>
<text x="475" y="76" text-anchor="middle" font-size="10" fill="currentColor">plazo básico estatal (art. 20.1)</text>
<text x="320" y="118" text-anchor="middle" font-size="10" fill="var(--ink2)">En ambos casos, silencio desestimatorio y posible ampliación por volumen o complejidad</text>
</svg>`},
{n:33,t:"Reclamaciones frente a las resoluciones",ubic:"Título III (El derecho de acceso a la información pública)",idea:"La reclamación se presenta ante el Consejo andaluz, no ante el estatal.",literal:`<p>1. Frente a toda resolución expresa o presunta en materia de acceso, podrá interponerse reclamación ante el Consejo de Transparencia y la Protección de Datos de Andalucía, con carácter potestativo y previo a su impugnación en vía contencioso-administrativa. Esta reclamación se regirá por lo establecido en la legislación básica en materia de transparencia y por lo previsto en esta ley.</p><p>2. Las resoluciones referentes al derecho de acceso a la información pública que sean dictadas por las instituciones y entidades a que se refiere el artículo 3.1.b) y 3.2 sólo serán recurribles ante la jurisdicción contencioso-administrativa.</p><p>3. Las resoluciones del Consejo se publicarán, previa disociación de los datos de carácter personal que contuvieran, por medios electrónicos y en los términos que se establezcan reglamentariamente, una vez se hayan notificado a los interesados. La persona titular de la Dirección del Consejo comunicará al Defensor del Pueblo Andaluz las resoluciones que dicte en aplicación de este artículo.</p>`,dis:`<ul>
<li><b>33.1:</b> frente a toda resolución <b>expresa o presunta</b> en materia de acceso cabe reclamación ante el <span class="t" data-k="ctpda">Consejo de Transparencia y Protección de Datos de Andalucía</span>, con carácter <b>potestativo y previo</b> a la vía contencioso-administrativa.</li>
<li><b>33.2:</b> las resoluciones dictadas por las instituciones del art. 3.1.b) y 3.2 solo son recurribles ante la <b>jurisdicción contencioso-administrativa</b>.</li>
<li><b>33.3:</b> las resoluciones del Consejo se <b>publican</b>, previa disociación de datos personales, una vez notificadas.</li>
<li><b>Plazos:</b> se aplican los de la legislación básica —<b>un mes</b> para reclamar y <b>tres meses</b> para resolver, con silencio desestimatorio (art. 24 de la Ley 19/2013)—.</li>
</ul>`,llano:`<p>Si un ayuntamiento andaluz te deniega información, la reclamación no va a Madrid: va al Consejo de Transparencia y Protección de Datos de Andalucía. Y sigue siendo potestativa: puedes ir directamente al juzgado.</p>`,porque:`<p>El art. 24.6 de la ley estatal permite que las comunidades atribuyan la competencia a un órgano propio, y Andalucía lo hizo. La <b>proximidad</b> del órgano mejora el acceso a la garantía y permite construir doctrina adaptada a la realidad autonómica y local.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> reclamar en la oficina de tu ciudad en vez de en la sede central.</li>
<li><b>Real:</b> denegada una solicitud por un ayuntamiento sevillano, la reclamación se dirige al Consejo andaluz en el plazo de <b>un mes</b>.</li>
<li><b>Caso límite:</b> frente a resoluciones del Parlamento de Andalucía o de instituciones asimiladas, solo cabe <b>contencioso-administrativo</b> (art. 33.2).</li>
</ul>`,noej:`<ul>
<li><b>No resuelve</b> el Consejo estatal las reclamaciones andaluzas.</li>
<li><b>No es</b> obligatoria la reclamación: es potestativa.</li>
</ul>`,conex:`<ul>
<li><b>Art. 24 de la Ley 19/2013:</b> régimen y plazos de la reclamación.</li>
<li><b>Arts. 43 a 50 de esta ley:</b> el Consejo andaluz.</li>
<li><b>Art. 23 de esta ley:</b> control del cumplimiento de la publicidad activa por el Consejo.</li>
</ul>`,trampas:`<ul>
<li>La reclamación es <b>potestativa y previa</b> al contencioso.</li>
<li>Se presenta ante el <b>Consejo andaluz</b>.</li>
<li>Contra las resoluciones de ciertas instituciones solo cabe <b>contencioso</b>.</li>
</ul>`,ancla:`<p><b>"En Andalucía se reclama en Andalucía."</b> Un mes para reclamar, tres para resolver.</p>`,vis:`<svg viewBox="0 0 640 130" role="img" aria-label="Reclamación ante el Consejo andaluz">

<text x="233" y="53" text-anchor="middle" font-size="9" fill="var(--ink2)">1 mes</text>

<text x="357" y="58" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ej)">Consejo andaluz</text>

{n:43,t:"Creación y naturaleza",ubic:"Título V (Organización) ▸ Capítulo II (Consejo de Transparencia y Protección de Datos de Andalucía)",idea:"Un solo consejo para transparencia y protección de datos, independiente.",literal:`<p>1. Se crea el Consejo de Transparencia y Protección de Datos de Andalucía, en adelante el Consejo, como autoridad independiente de control en materia de protección de datos y de transparencia en la Comunidad Autónoma de Andalucía.</p><p>2. El Consejo se configura como una entidad pública con personalidad jurídica propia, con plena capacidad y autonomía orgánica y funcional para el ejercicio de sus cometidos.</p><p>3. El Consejo ejercerá sus funciones con objetividad, profesionalidad, sometimiento al ordenamiento jurídico y plena independencia de las administraciones públicas en el ejercicio de las mismas.</p><p>4. Su relación con la Administración de la Junta de Andalucía se llevará a cabo a través de la Consejería de la Presidencia.</p>`,dis:`<ul>
<li><b>43.1 — creación:</b> se crea el <b>Consejo de Transparencia y Protección de Datos de Andalucía</b> como <b>autoridad independiente de control</b> en materia de <b>protección de datos</b> y de <b>transparencia</b>.</li>
<li><b>43.2 — naturaleza:</b> <b>entidad pública con personalidad jurídica propia</b>, plena capacidad y <b>autonomía orgánica y funcional</b>.</li>
<li><b>43.3 — garantías:</b> ejerce sus funciones con <b>objetividad, profesionalidad, sometimiento al ordenamiento jurídico y plena independencia</b> de las administraciones públicas.</li>
<li><b>43.4:</b> se relaciona con la Administración de la Junta a través de la <b>Consejería de la Presidencia</b>.</li>
</ul>
<div class="box ej"><span class="lbl">Diferencia clave</span>El Consejo estatal se ocupa de <b>transparencia y buen gobierno</b>; el andaluz, de <b>transparencia y protección de datos</b>. Es la confusión más habitual en los tests.</div>`,llano:`<p>Andalucía une en un solo organismo dos materias que van siempre de la mano: la transparencia y la protección de datos. Es independiente y tiene personalidad propia; se relaciona con la Junta a través de la Consejería de la Presidencia.</p>`,porque:`<p>Casi todos los conflictos de acceso terminan planteando un problema de datos personales. Reunir ambas competencias en un mismo órgano evita criterios contradictorios y aprovecha la especialización, a diferencia del modelo estatal, donde el Consejo y la Agencia de Protección de Datos son organismos distintos.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> una misma ventanilla para dos trámites que siempre aparecen juntos.</li>
<li><b>Real:</b> el Consejo andaluz resuelve una reclamación de acceso ponderando a la vez la transparencia y la protección de datos de los afectados.</li>
</ul>`,noej:`<ul>
<li><b>No es</b> un órgano de la Consejería de la Presidencia: se relaciona con ella, pero es independiente.</li>
<li><b>No tiene</b> competencias en materia de buen gobierno de altos cargos.</li>
</ul>`,conex:`<ul>
<li><b>Arts. 33 a 40 de la Ley 19/2013:</b> Consejo estatal, con distinta denominación y ámbito.</li>
<li><b>Arts. 44 a 50 de esta ley:</b> régimen jurídico, estructura y funciones.</li>
<li><b>Art. 24.6 de la Ley 19/2013:</b> habilitación para que las comunidades creen su propio órgano.</li>
</ul>`,trampas:`<ul>
<li>Andaluz: transparencia + <b>protección de datos</b>. Estatal: transparencia + <b>buen gobierno</b>.</li>
<li>Tiene <b>personalidad jurídica propia</b> y <b>autonomía orgánica y funcional</b>.</li>
</ul>`,ancla:`<p><b>"En Madrid, buen gobierno; en Andalucía, protección de datos."</b> Mismo apellido, distinta segunda materia.</p>`,vis:`<svg viewBox="0 0 640 130" role="img" aria-label="Consejo andaluz frente al estatal">
<rect x="30" y="30" width="270" height="62" rx="8" fill="var(--acc-soft)" stroke="var(--acc)"/>
<text x="165" y="53" text-anchor="middle" font-size="11" font-weight="700" fill="var(--acc)">Consejo estatal</text>
<text x="165" y="72" text-anchor="middle" font-size="10" fill="currentColor">Transparencia y BUEN GOBIERNO</text>
<rect x="340" y="30" width="270" height="62" rx="8" fill="var(--ej-bg)" stroke="var(--ej)"/>
<text x="475" y="53" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ej)">Consejo andaluz</text>
<text x="475" y="72" text-anchor="middle" font-size="10" fill="currentColor">Transparencia y PROTECCIÓN DE DATOS</text>
<text x="320" y="118" text-anchor="middle" font-size="10" fill="var(--ink2)">Ambos con personalidad jurídica propia y plena independencia</text>
</svg>`},
{n:47,t:"Dirección del Consejo",ubic:"Título V (Organización) ▸ Capítulo II (Consejo de Transparencia y Protección de Datos de Andalucía)",idea:"La Dirección: cinco años no renovables, designada por el Parlamento por mayoría absoluta.",literal:`<p>1. La persona que ejerza la Dirección del Consejo será nombrada por el Consejo de Gobierno por un periodo de 5 años no renovable. No obstante, expirado el plazo del mandato correspondiente, continuará en ejercicio de sus funciones hasta la toma de posesión del nuevo titular.</p><p>2. La designación corresponde al Parlamento de Andalucía, por mayoría absoluta, y deberá recaer en una persona de reconocido prestigio y competencia profesional.</p><p>3. Ejercerá sus funciones con plena independencia y objetividad, y no estará sujeta a instrucción alguna en el desempeño de aquellas. No obstante, la persona que ejerza la Dirección deberá oír a la Comisión Consultiva en aquellas propuestas que esta le realice en el ejercicio de sus funciones.</p><p>4. La persona que ejerza la Dirección del Consejo sólo cesará antes de la expiración de su período de mandato por alguna de las siguientes causas:</p><p>a) Muerte o incapacitación judicial.</p><p>b) Renuncia.</p><p>c) Por separación, acordada por el Consejo de Gobierno, previa instrucción de expediente, en el que necesariamente será oída la Comisión Consultiva, por incumplimiento</p><p>grave de sus obligaciones, incapacidad sobrevenida para el ejercicio de su función, incompatibilidad o condena por delito doloso.</p>`,dis:`<ul>
<li><b>47.1 — nombramiento:</b> por el <b>Consejo de Gobierno</b>, por un periodo de <b>cinco años no renovable</b>; expirado el mandato, continúa hasta la toma de posesión de quien le suceda.</li>
<li><b>47.2 — designación:</b> corresponde al <b>Parlamento de Andalucía</b>, por <b>mayoría absoluta</b>, y debe recaer en persona de reconocido prestigio y competencia profesional.</li>
<li><b>47.3 — independencia:</b> ejerce sus funciones con plena independencia y objetividad, <b>sin sujeción a instrucción alguna</b>; debe oír a la <span class="t" data-k="comisionconsultiva">Comisión Consultiva</span> en las propuestas que esta le eleve.</li>
<li><b>47.4 — cese:</b> solo por muerte o incapacitación judicial, <b>renuncia</b> o <b>separación</b> acordada por el Consejo de Gobierno, previa instrucción de expediente y audiencia de la Comisión Consultiva, por incumplimiento grave, incapacidad sobrevenida, incompatibilidad o condena por delito doloso.</li>
</ul>
<div class="box ej"><span class="lbl">Comparación</span>Estatal: nombramiento por <b>real decreto</b> con comparecencia y refrendo del <b>Congreso</b>. Andaluz: <b>designación por el Parlamento</b> por mayoría absoluta y nombramiento por el Consejo de Gobierno. En ambos casos, <b>cinco años no renovables</b>.</div>`,llano:`<p>Quien dirige el Consejo andaluz lo elige el Parlamento por mayoría absoluta y lo nombra el Consejo de Gobierno, para cinco años que no se pueden repetir. No recibe instrucciones de nadie y solo puede ser cesado por causas tasadas y con expediente.</p>`,porque:`<p>La designación parlamentaria por <b>mayoría absoluta</b> obliga al consenso entre grupos y refuerza la independencia frente al Gobierno que después lo nombra. El mandato <b>no renovable</b> elimina el incentivo de agradar a quien podría prorrogarlo.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> un cargo elegido por acuerdo amplio y con mandato único.</li>
<li><b>Real:</b> la Dirección continúa en funciones hasta que su sucesor toma posesión, evitando vacíos.</li>
</ul>`,noej:`<ul>
<li><b>No cabe</b> el cese discrecional del Consejo de Gobierno: exige causa tasada y expediente.</li>
<li><b>No es</b> renovable el mandato.</li>
</ul>`,conex:`<ul>
<li><b>Art. 37 de la Ley 19/2013:</b> Presidente del Consejo estatal.</li>
<li><b>Arts. 48 y 49 de esta ley:</b> funciones de la Dirección y Comisión Consultiva.</li>
</ul>`,trampas:`<ul>
<li>Designa el <b>Parlamento</b> por <b>mayoría absoluta</b>; nombra el <b>Consejo de Gobierno</b>.</li>
<li><b>Cinco años no renovable</b>, con continuidad hasta la toma de posesión del sucesor.</li>
<li>Cuatro causas de cese, entre ellas la <b>separación</b> con expediente y audiencia de la Comisión Consultiva.</li>
</ul>`,ancla:`<p><b>"Lo elige el Parlamento, lo nombra el Gobierno, cinco años y no repite."</b></p>`,vis:`<svg viewBox="0 0 640 130" role="img" aria-label="Dirección del Consejo andaluz">
<defs><marker id="d3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="var(--acc)"/></marker></defs>

<text x="130" y="77" text-anchor="middle" font-size="10" fill="currentColor">designa por mayoría absoluta</text>

{n:56,t:"Sanciones a otras entidades",ubic:"Título VI (Régimen sancionador)",idea:"Multas de hasta 400.000 euros y reintegro o resolución del contrato como accesoria.",literal:`<p>1. Para las infracciones previstas en los artículos 53 y 54, podrán aplicarse las sanciones de amonestación y multa.</p><p>2. Las infracciones leves podrán sancionarse con amonestación o multa comprendida entre 200 y 5.000 euros.</p><p>3. Las infracciones graves se sancionarán con multa comprendida entre 5.001 y 30.000 euros.</p><p>4. Las infracciones muy graves se sancionarán con multa comprendida entre 30.001 y 400.000 euros.</p><p>5. Las infracciones graves y muy graves podrán conllevar como sanción accesoria el reintegro total o parcial de la subvención concedida o, en su caso, la resolución del contrato, concierto o vínculo establecido. Para la imposición y graduación de estas sanciones accesorias, se atenderá a la gravedad de los hechos y su repercusión, de acuerdo con el principio de proporcionalidad.</p>`,dis:`<table><thead><tr><th>Infracción</th><th>Sanción (art. 56)</th></tr></thead><tbody>
<tr><td><b>Leve</b></td><td>Amonestación o multa de <b>200 a 5.000 €</b></td></tr>
<tr><td><b>Grave</b></td><td>Multa de <b>5.001 a 30.000 €</b></td></tr>
<tr><td><b>Muy grave</b></td><td>Multa de <b>30.001 a 400.000 €</b></td></tr>
</tbody></table>
<ul>
<li><b>Sanción accesoria (56.5):</b> las graves y muy graves pueden conllevar el <b><span class="t" data-k="reintegroacc">reintegro total o parcial de la subvención</span></b> concedida o la <b>resolución del contrato, concierto o vínculo</b> establecido.</li>
<li><b>Destinatarios:</b> las infracciones de los <b>arts. 53</b> (obligados a suministrar información) y <b>54</b> (entidades privadas del art. 5).</li>
<li><b>Competencia (art. 58):</b> para las del art. 54, la <b>Consejería competente en materia de la presidencia</b> o la <b>entidad local titular del servicio público</b>.</li>
</ul>
<div class="box ej"><span class="lbl">La gran diferencia con la ley estatal</span>La Ley 19/2013 <b>no prevé multas</b>: sus sanciones son amonestación, publicación del incumplimiento, pérdida de indemnización, destitución e inhabilitación. Andalucía sí sanciona económicamente a las entidades privadas obligadas.</div>`,llano:`<p>Aquí está el diente de la ley andaluza: multas que llegan a 400.000 euros para las entidades privadas que incumplen, y la posibilidad de que además haya que devolver la subvención o de que se resuelva el contrato.</p>`,porque:`<p>El régimen estatal solo alcanza a los altos cargos y no tiene multas: frente a una entidad privada que incumple, carecía de instrumentos. Andalucía cubre ese hueco con un régimen económico graduado, y la <b>sanción accesoria</b> es especialmente eficaz porque golpea donde duele: la subvención o el contrato.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> una multa creciente según la gravedad, con posibilidad de perder la ayuda recibida.</li>
<li><b>Real:</b> una entidad concertada que desatiende el requerimiento expreso del Consejo andaluz comete infracción <b>muy grave</b> (art. 54.1) y puede ser multada entre 30.001 y 400.000 €, con posible reintegro de la subvención.</li>
</ul>`,noej:`<ul>
<li><b>No se aplican</b> estas multas a los altos cargos: sus infracciones disciplinarias se sancionan conforme al art. 55.</li>
<li><b>No procede</b> la accesoria en las infracciones leves.</li>
</ul>`,conex:`<ul>
<li><b>Arts. 53 y 54 de esta ley:</b> infracciones sancionadas.</li>
<li><b>Art. 58 de esta ley:</b> competencia sancionadora.</li>
<li><b>Art. 30 de la Ley 19/2013:</b> sanciones estatales, sin multas.</li>
<li><b>Arts. 37 y 40 de la Ley 38/2003</b> (documento 8): reintegro de subvenciones.</li>
</ul>`,trampas:`<ul>
<li>Las cifras: <b>200-5.000</b>, <b>5.001-30.000</b> y <b>30.001-400.000</b> euros.</li>
<li>La accesoria de <b>reintegro o resolución</b> solo cabe en graves y muy graves.</li>
<li>En servicios públicos locales, sanciona la <b>entidad local titular</b> (art. 58.3).</li>
</ul>`,ancla:`<p><b>"200 · 5.000 · 30.000 · 400.000."</b> Y de propina, <b>devolver la subvención o perder el contrato</b>.</p>`,vis:`<svg viewBox="0 0 640 145" role="img" aria-label="Sanciones económicas de la ley andaluza">

<script>
const PLAZOS=[["20 días hábiles", "Plazo de resolución en la Junta de Andalucía y sus entes instrumentales", "Órgano competente", "32 L1/2014", "Frente al mes de la ley estatal"], ["1 mes", "Plazo para reclamar ante el Consejo andaluz", "Reclamante", "33 L1/2014 y 24.2 L19/2013", "Potestativa y previa al contencioso"], ["3 meses", "Plazo del Consejo para resolver la reclamación", "Consejo andaluz", "24.4 L19/2013", "Silencio desestimatorio"], ["5 años", "Mandato de la Dirección del Consejo andaluz", "Dirección", "47.1 L1/2014", "No renovable; designa el Parlamento por mayoría absoluta"], ["50.000 €", "Presupuesto por debajo del cual las entidades sin ánimo de lucro pueden usar medios ajenos", "Entidades sin ánimo de lucro", "9.4 L1/2014", "Coincide con el art. 5.4 estatal"], ["Trimestral", "Periodicidad admitida para publicar los contratos menores", "Entidades", "15.a) L1/2014", "Especialidad andaluza"], ["200 a 5.000 €", "Multa por infracción leve", "Entidades privadas", "56.2 L1/2014", "O amonestación"], ["5.001 a 30.000 €", "Multa por infracción grave", "Entidades privadas", "56.3 L1/2014", "Con posible accesoria"], ["30.001 a 400.000 €", "Multa por infracción muy grave", "Entidades privadas", "56.4 L1/2014", "Con posible reintegro o resolución del contrato"], ["Multas coercitivas", "Medio de compulsión frente al incumplimiento del requerimiento de información", "Administración", "4.4 L1/2014", "Previo apercibimiento y audiencia; reiterables"]];
const FLASH=[["¿Cuál es el objeto de la Ley 1/2014?", "La regulación de la transparencia en Andalucía en su <b>doble vertiente</b>: publicidad activa y derecho de acceso (art. 1). La estatal añade el buen gobierno."], ["Cita cuatro sujetos del ámbito subjetivo andaluz", "Administración de la Junta · consejos consultivos y estatutarios · agencias · <b>entidades locales andaluzas y sus entes instrumentales</b> · universidades públicas · corporaciones de derecho público, <b>incluidas federaciones y clubes deportivos</b> (art. 3)."], ["¿Qué mecanismo añade Andalucía frente al incumplimiento del deber de suministrar información?", "<b>Multas coercitivas</b>, previo apercibimiento y audiencia, reiterables hasta el cumplimiento (art. 4.4)."], ["¿Dónde debe reflejarse la obligación de suministrar información?", "En los <b>pliegos</b> de los contratos y en las <b>bases reguladoras</b> y resoluciones de concesión de subvenciones (art. 4.2 y 4.3)."], ["Cita cuatro principios básicos de la ley andaluza", "Transparencia · libre acceso · responsabilidad · no discriminación tecnológica · <b>veracidad</b> · utilidad · <b>gratuidad</b> · facilidad y comprensión (art. 6)."], ["¿Qué adjetivos añade el art. 9 a la publicidad activa?", "La información debe ser además <b>veraz y objetiva</b>, no solo periódica y actualizada."], ["¿Con qué periodicidad pueden publicarse los contratos menores?", "<b>Trimestralmente</b> (art. 15.a)."], ["¿Qué debe indicarse al publicar una subvención en Andalucía?", "La convocatoria o resolución, el <b>programa y crédito presupuestario</b>, el importe, el objetivo o finalidad y los beneficiarios (art. 15.c)."], ["¿Qué obligación específica tienen las entidades locales respecto de sus plenos?", "Facilitar su acceso por <b>internet</b>, transmitiéndolos o dando acceso al <b>archivo grabado</b>, salvo imposibilidad técnica o económica justificada; y permitir la grabación por los asistentes (art. 21)."], ["¿Crea la ley andaluza límites propios al derecho de acceso?", "No: se remite a la <b>legislación básica</b>, pero exige que los límites duren solo mientras se mantenga su razón y que se valore el <b>acceso parcial</b> (art. 25)."], ["Las tres reglas especiales sobre inadmisión", "Si está en elaboración, indicar <b>órgano y tiempo previsto</b> · los <b>informes preceptivos</b> no son información auxiliar · el <b>tratamiento informatizado de uso corriente</b> no es reelaboración (art. 30)."], ["¿Cuál es el plazo de resolución en la Junta de Andalucía?", "<b>20 días hábiles</b>, frente al mes de la ley estatal (art. 32)."], ["¿Ante quién se reclama en Andalucía?", "Ante el <b>Consejo de Transparencia y Protección de Datos de Andalucía</b>, con carácter potestativo y previo al contencioso (art. 33)."], ["¿Qué materias reúne el Consejo andaluz?", "<b>Transparencia y protección de datos</b>; el estatal reúne transparencia y <b>buen gobierno</b> (art. 43)."], ["¿Cómo se designa la Dirección del Consejo andaluz?", "La designa el <b>Parlamento de Andalucía por mayoría absoluta</b> y la nombra el <b>Consejo de Gobierno</b> por <b>cinco años no renovables</b> (art. 47)."], ["¿Qué infracciones comete quien no suministra información requerida?", "Muy grave si desatiende un requerimiento del Consejo; grave la falta de contestación al requerimiento o incumplir el principio de <b>veracidad</b> (art. 53)."], ["Cuantía de las multas del art. 56", "Leves: amonestación o <b>200 a 5.000 €</b> · graves: <b>5.001 a 30.000 €</b> · muy graves: <b>30.001 a 400.000 €</b>."], ["¿Qué sanción accesoria cabe en graves y muy graves?", "El <b>reintegro total o parcial de la subvención</b> o la <b>resolución del contrato, concierto o vínculo</b> (art. 56.5)."], ["¿Quién ejerce la potestad sancionadora sobre las entidades del art. 54?", "La <b>Consejería competente en materia de la presidencia</b> o la <b>entidad local titular del servicio público</b> (art. 58.3)."], ["¿Prevé multas la Ley 19/2013?", "<b>No</b>: sus sanciones son amonestación, publicación del incumplimiento, pérdida de indemnización, destitución e inhabilitación. Las multas son especialidad andaluza."]];
const TEST=[{"a": 1, "q": "La Ley 1/2014 de Andalucía regula la transparencia en su:", "o": [["doble vertiente de publicidad activa y derecho de acceso", 1, "Correcto: art. 1. La ley estatal añade además el buen gobierno."], ["triple vertiente, incluido el buen gobierno de los altos cargos", 0, "Ese es el objeto de la Ley 19/2013."], ["única vertiente del derecho de acceso", 0, "También regula la publicidad activa."], ["vertiente exclusivamente sancionadora", 0, "El régimen sancionador es su Título VI, no su único objeto."]]}, {"a": 3, "q": "¿Cuál de estos sujetos aparece expresamente en el ámbito subjetivo de la ley andaluza?", "o": [["las federaciones y clubes deportivos, en lo relativo a sus actividades sujetas al Derecho administrativo", 1, "Correcto: art. 3.1.h), sin equivalente literal en la ley estatal."], ["la Casa de Su Majestad el Rey", 0, "Figura en el art. 2.1.f) de la ley estatal."], ["el Congreso de los Diputados", 0, "Es ámbito de la ley estatal."], ["el Banco de España", 0, "Es ámbito de la ley estatal."]]}, {"a": 4, "q": "Frente a quien no atiende el requerimiento de información, la ley andaluza permite:", "o": [["imponer multas coercitivas, previo apercibimiento y audiencia", 1, "Correcto: art. 4.4, especialidad frente a la ley estatal."], ["resolver automáticamente el contrato", 0, "La resolución del contrato es sanción accesoria del art. 56.5, no consecuencia automática."], ["nada: la ley no prevé mecanismos de reacción", 0, "Sí los prevé."], ["imponer directamente una multa de 400.000 €", 0, "Las multas del art. 56 exigen procedimiento sancionador."]]}, {"a": 6, "q": "Completa: «Principio de ______, en cuya virtud la información pública ha de ser cierta y exacta».", "gap": "veracidad", "fb": "Principio de <b>veracidad</b> (art. 6.e), especialidad andaluza con reflejo en el régimen sancionador."}, {"a": 9, "q": "Según el art. 9 de la ley andaluza, la publicidad activa debe ser:", "o": [["periódica, veraz, objetiva y actualizada", 1, "Correcto: art. 9.1, con dos adjetivos más que el art. 5.1 estatal."], ["periódica y actualizada únicamente", 0, "Esa es la fórmula estatal."], ["anual y agregada", 0, "No es la exigencia legal."], ["previa solicitud de los interesados", 0, "Eso sería el derecho de acceso."]]}, {"a": 15, "q": "Los contratos menores pueden publicarse en Andalucía:", "o": [["trimestralmente", 1, "Correcto: art. 15.a), especialidad andaluza."], ["anualmente", 0, "No es la periodicidad prevista."], ["no deben publicarse", 0, "Deben publicarse; solo se flexibiliza la periodicidad."], ["en el plazo de diez días desde su adjudicación", 0, "No es lo que dispone el precepto."]]}, {"a": 21, "q": "Respecto de las sesiones plenarias de las entidades locales, la ley andaluza exige:", "o": [["facilitar su acceso por internet, transmitiéndolas o dando acceso al archivo grabado", 1, "Correcto: art. 21, salvo imposibilidad técnica o económica justificada."], ["publicar únicamente el acta aprobada", 0, "Es una obligación adicional y distinta."], ["prohibir la grabación por los asistentes", 0, "Al contrario: se les reconoce expresamente esa posibilidad."], ["nada: no hay obligación al respecto", 0, "Sí la hay, y es especialidad andaluza."]]}, {"a": 25, "q": "Los límites al derecho de acceso en Andalucía:", "o": [["son los de la legislación básica y solo se aplican mientras se mantenga la razón que los justifique", 1, "Correcto: art. 25.1 y 25.2."], ["son más numerosos que los estatales", 0, "No: se remite a los básicos."], ["tienen carácter permanente una vez apreciados", 0, "Al contrario: rige la temporalidad."], ["impiden en todo caso el acceso parcial", 0, "Debe valorarse la posibilidad de acceso parcial."]]}, {"a": 30, "q": "Conforme al art. 30 de la ley andaluza:", "o": [["los informes preceptivos no pueden considerarse información auxiliar o de apoyo", 1, "Correcto: regla b), que estrecha la causa de inadmisión del art. 18.1.b) estatal."], ["los informes preceptivos siempre son información auxiliar", 0, "Justo lo contrario."], ["cualquier tratamiento informático constituye reelaboración", 0, "El de uso corriente no la constituye."], ["la inadmisión no necesita motivación", 0, "La motivación es siempre exigible."]]}, {"a": 30, "q": "Completa: «No se estimará como reelaboración que justifique la inadmisión la información que pueda obtenerse mediante un tratamiento ______ de uso corriente».", "gap": "informatizado", "fb": "<b>Informatizado</b> de uso corriente (art. 30.c). Es la regla que impide inadmitir por filtrar una base de datos."}, {"a": 32, "q": "El plazo máximo para resolver las solicitudes de acceso en la Administración de la Junta de Andalucía es de:", "o": [["20 días hábiles", 1, "Correcto: art. 32, más breve que el mes de la ley estatal."], ["un mes", 0, "Ese es el plazo básico del art. 20.1 de la Ley 19/2013."], ["tres meses", 0, "Es el plazo del Consejo para resolver reclamaciones."], ["diez días", 0, "No es el plazo previsto."]]}, {"a": 33, "q": "La reclamación frente a la denegación de acceso por un ayuntamiento andaluz se interpone ante:", "o": [["el Consejo de Transparencia y Protección de Datos de Andalucía", 1, "Correcto: art. 33.1, por la vía del art. 24.6 de la ley estatal."], ["el Consejo de Transparencia y Buen Gobierno estatal", 0, "No: Andalucía tiene órgano propio."], ["el Defensor del Pueblo Andaluz", 0, "No es el órgano competente para resolverla."], ["directamente el juzgado, sin reclamación posible", 0, "La reclamación es posible, aunque potestativa."]]}, {"a": 43, "q": "El Consejo de Transparencia y Protección de Datos de Andalucía es autoridad independiente en materia de:", "o": [["protección de datos y transparencia", 1, "Correcto: art. 43.1. El estatal es de transparencia y buen gobierno."], ["transparencia y buen gobierno", 0, "Esa es la denominación y el ámbito del Consejo estatal."], ["contratación pública", 0, "No es su ámbito."], ["fiscalización de cuentas", 0, "Corresponde a la Cámara de Cuentas."]]}, {"a": 47, "q": "La persona titular de la Dirección del Consejo andaluz es designada por:", "o": [["el Parlamento de Andalucía por mayoría absoluta, y nombrada por el Consejo de Gobierno", 1, "Correcto: art. 47.1 y 47.2, por cinco años no renovables."], ["el Consejo de Gobierno libremente", 0, "La designación corresponde al Parlamento."], ["el Presidente de la Junta por decreto", 0, "No es el procedimiento previsto."], ["la Consejería de la Presidencia", 0, "Con ella se relaciona el Consejo, pero no lo designa."]]}, {"a": 47, "q": "El mandato de la Dirección del Consejo andaluz es de cinco años y renovable una sola vez.", "vf": true, "ok": false, "fb": "<b>Falso.</b> El art. 47.1 establece un periodo de <b>cinco años no renovable</b>, con continuidad en funciones hasta la toma de posesión del sucesor."}, {"a": 56, "q": "Las infracciones muy graves de las entidades privadas se sancionan en Andalucía con multa de:", "o": [["30.001 a 400.000 euros", 1, "Correcto: art. 56.4."], ["5.001 a 30.000 euros", 0, "Esa es la horquilla de las graves."], ["200 a 5.000 euros", 0, "Esa es la de las leves."], ["hasta 1.000.000 de euros", 0, "No es la cuantía legal."]]}, {"a": 56, "q": "Las infracciones graves y muy graves pueden llevar aparejada como sanción accesoria:", "o": [["el reintegro total o parcial de la subvención o la resolución del contrato o concierto", 1, "Correcto: art. 56.5."], ["la inhabilitación para contratar durante diez años", 0, "No está prevista en este precepto."], ["la publicación en el BOJA en todo caso", 0, "No es la accesoria del art. 56.5."], ["ninguna: la multa es la única consecuencia", 0, "Sí cabe accesoria."]]}, {"a": 56, "q": "La Ley 19/2013 prevé multas económicas equivalentes a las de la ley andaluza.", "vf": true, "ok": false, "fb": "<b>Falso.</b> La ley estatal no prevé multas: sus sanciones son amonestación, declaración y publicación del incumplimiento, pérdida de indemnización, destitución e inhabilitación (art. 30 de la Ley 19/2013)."}, {"a": 4, "q": "La obligación de suministrar información se extiende en Andalucía a:", "o": [["adjudicatarios de contratos y beneficiarios de subvenciones, en los términos de pliegos y bases", 1, "Correcto: art. 4.2 y 4.3."], ["solo a los concesionarios de servicios públicos", 0, "El precepto es más amplio."], ["solo a las entidades del art. 3", 0, "Esas son sujetos obligados directamente, no por el art. 4."], ["a ninguna entidad privada", 0, "Precisamente a ellas se dirige."]]}, {"a": 9, "q": "Las obligaciones de publicidad activa de la ley andaluza tienen carácter:", "o": [["de mínimas y generales, sin perjuicio de regímenes más amplios", 1, "Correcto: art. 9.2."], ["de máximas e inalterables", 0, "No: son mínimas."], ["potestativo para las entidades locales", 0, "Son obligatorias."], ["supletorio respecto de la ley estatal", 0, "No son supletorias: amplían el mínimo estatal."]]}];
const CASOS=[{"t": "Caso 1 · La misma solicitud en dos ventanillas", "e": "Una persona pide el mismo informe a la Consejería de Hacienda de la Junta y a un ayuntamiento andaluz. Ambos guardan silencio. <b>Compara plazos, efectos y vías de reacción en cada caso, citando la norma aplicable.</b>", "s": "<p><b>1) Plazo en la Junta.</b> <b>20 días hábiles</b> desde la recepción por el órgano competente (art. 32 de la <b>Ley 1/2014</b>), con la regla previa de resolver en el menor plazo posible.</p><p><b>2) Plazo en el ayuntamiento.</b> El plazo básico de <b>un mes</b>, ampliable por otro (art. 20.1 de la <b>Ley 19/2013</b>), salvo que la normativa local establezca uno menor.</p><p><b>3) Efecto del silencio.</b> En ambos casos, <b>desestimatorio</b> (art. 20.4 de la Ley 19/2013). La ley andaluza no altera este efecto.</p><p><b>4) Reacción.</b> En los dos supuestos, <b>reclamación potestativa</b> ante el <b>Consejo de Transparencia y Protección de Datos de Andalucía</b> en el plazo de <b>un mes</b> desde que se producen los efectos del silencio (art. 33 de la Ley 1/2014 y art. 24.2 de la Ley 19/2013), con resolución en <b>tres meses</b> y silencio desestimatorio. Alternativamente, contencioso-administrativo directo.</p><p><b>5) Consecuencia añadida.</b> El incumplimiento reiterado de resolver en plazo es <b>infracción grave</b> (art. 20.6 de la Ley 19/2013) y, en el ámbito andaluz, puede activar el régimen sancionador del Título VI.</p>"}, {"t": "Caso 2 · Tres inadmisiones cuestionables", "e": "Un ayuntamiento andaluz inadmite tres solicitudes: <b>(a)</b> la de un informe jurídico preceptivo, por considerarlo «documento interno de apoyo»; <b>(b)</b> la de un listado de subvenciones concedidas en 2025, por exigir «reelaboración»; <b>(c)</b> la del plan de movilidad, «en elaboración», sin más detalle. <b>Valora cada inadmisión.</b>", "s": "<p><b>(a) Improcedente.</b> El art. 30.b) de la <b>Ley 1/2014</b> dispone que los <b>informes preceptivos no pueden considerarse información de carácter auxiliar o de apoyo</b> para justificar la inadmisión. La causa del art. 18.1.b) de la Ley 19/2013 no ampara esta denegación.</p><p><b>(b) Improcedente.</b> El art. 30.c) excluye de la reelaboración lo que pueda obtenerse mediante un <b>tratamiento informatizado de uso corriente</b>. Extraer un listado de una base de datos existente entra de lleno en esa regla.</p><p><b>(c) Insuficiente.</b> Cabe la inadmisión del art. 18.1.a) de la ley estatal, pero el art. 30.a) andaluz exige que la denegación <b>especifique el órgano</b> que elabora la información y el <b>tiempo previsto</b> para su conclusión. Sin esos datos, la resolución está incompleta.</p><p><b>Vía de reacción:</b> reclamación ante el <b>Consejo andaluz</b> (art. 33), cuyas resoluciones se publican previa disociación.</p>"}, {"t": "Caso 3 · La entidad concertada que no informa", "e": "Una entidad privada que gestiona un servicio social concertado con un ayuntamiento andaluz recibe un requerimiento de información del Consejo de Transparencia y Protección de Datos y no contesta. Además, no publica la información de publicidad activa que le corresponde. <b>Determina infracciones, sanciones y órgano competente.</b>", "s": "<p><b>1) Por no atender el requerimiento.</b> El art. 53.1.a) de la <b>Ley 1/2014</b> tipifica como <b>muy grave</b> el incumplimiento de la obligación de suministro de información reclamada como consecuencia de un requerimiento del Consejo.</p><p><b>2) Por no publicar.</b> Como entidad del art. 5, el incumplimiento de las obligaciones de publicidad activa tras requerimiento expreso del Consejo es <b>infracción muy grave</b> (art. 54.1); el incumplimiento reiterado sin requerimiento sería <b>grave</b> (art. 54.2).</p><p><b>3) Sanciones.</b> Multa de <b>30.001 a 400.000 €</b> (art. 56.4) y posible <b>accesoria</b>: reintegro total o parcial de la subvención o <b>resolución del concierto</b> (art. 56.5).</p><p><b>4) Órgano competente.</b> Para las infracciones del art. 54, la <b>Consejería competente en materia de la presidencia</b> o la <b>entidad local titular del servicio público</b> (art. 58.3): aquí, el ayuntamiento.</p><p><b>5) Vía previa.</b> Antes de sancionar, la Administración pudo imponer <b>multas coercitivas</b> para forzar el cumplimiento del requerimiento (art. 4.4), que son distintas de la sanción.</p>"}];
const SEMAFORO=["Objeto y relación con la ley estatal — art. 1", "Ámbito subjetivo andaluz — art. 3", "Deber de suministrar información y multas coercitivas — art. 4", "Otros sujetos obligados: conciertos y gestión indirecta — art. 5", "Los ocho principios básicos, con el de veracidad — art. 6", "Normas generales de publicidad activa — art. 9", "Contratos, convenios y subvenciones — art. 15", "Información económica, financiera y presupuestaria — art. 16", "Publicidad de los plenos locales — art. 21", "Control por el Consejo andaluz — art. 23", "Límites: remisión, temporalidad y acceso parcial — art. 25", "Reglas especiales de inadmisión — art. 30", "Plazo de 20 días hábiles — art. 32", "Reclamación ante el Consejo andaluz — art. 33", "Naturaleza del Consejo y su Dirección — arts. 43 y 47", "Régimen sancionador y multas — arts. 53 a 58"];

<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Orden EHA/3565/2008 · Estructura de los presupuestos de las entidades locales</title>
<style>

/* ═══════════════════════════════════════════════════════════════
   SISTEMA DE DISEÑO · "Académico Gamificado" · Bloque II
   Temas 8, 9 y 10 · Auxiliar Administrativo
   ═══════════════════════════════════════════════════════════════ */
:root{
  --fs:16px;

  --bg:#faf9f7;
  --bg-grad:radial-gradient(1100px 560px at 12% -8%, #ede9ff 0%, transparent 55%),
            radial-gradient(850px 460px at 96% 0%, #dcf5ee 0%, transparent 50%);
  --surface:#ffffff;
  --surface-2:#f4f3f0;
  --surface-3:#eceae5;
  --line:#e6e3dc;
  --line-strong:#d4d0c7;

  --ink:#15161c;
  --ink-2:#5d616e;
  --ink-3:#8b8f9c;

  --brand:#5b3df5;
  --brand-2:#7c5cff;
  --brand-soft:#efeaff;
  --brand-ring:rgba(91,61,245,.18);

  --legal:#4338ca;  --legal-bg:#eeecff;
  --ej:#059669;     --ej-bg:#e4f7f0;
  --warn:#c2690a;   --warn-bg:#fdf1de;
  --exc:#dc2626;    --exc-bg:#ffeceb;

  --ok:#16a34a; --ok-soft:#e7f7ec;
  --mid:#eab308; --mid-soft:#fdf6dd;
  --off:#a1a1aa; --off-soft:#f1f1f3;

  --sh-1:0 1px 2px rgba(20,20,30,.04), 0 2px 8px rgba(20,20,30,.04);
  --sh-2:0 2px 6px rgba(20,20,30,.05), 0 12px 28px rgba(20,20,30,.07);
  --sh-3:0 8px 20px rgba(91,61,245,.13), 0 24px 56px rgba(20,20,30,.10);
  --sh-glow:0 0 0 4px var(--brand-ring);

  --r-sm:9px; --r-md:14px; --r-lg:20px; --r-full:999px;

  --f-display:"Segoe UI Variable Display",system-ui,-apple-system,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-legal:ui-serif,Georgia,Cambria,"Times New Roman",serif;
  --f-mono:ui-monospace,"SF Mono","Cascadia Mono","Segoe UI Mono",Menlo,monospace;

  --t-h1:clamp(1.02rem,.95rem + .3vw,1.2rem);
  --t-h2:clamp(1.2rem,1.05rem + .6vw,1.55rem);
  --t-h3:clamp(1rem,.95rem + .25vw,1.12rem);
  --t-sm:.86rem;
  --t-xs:.75rem;

  --e-out:cubic-bezier(.22,1,.36,1);
  --e-spring:cubic-bezier(.34,1.56,.64,1);

  /* ── Compatibilidad con SVG y contenido generado ── */
  --panel:var(--surface);
  --ink2:var(--ink-2);
  --acc:var(--brand);
  --acc-soft:var(--brand-soft);
  --g:var(--ok); --y:var(--mid); --r:var(--exc);
}

html[data-theme="dark"]{
  --bg:#0a0b0f;
  --bg-grad:radial-gradient(1100px 560px at 12% -8%, #1c1740 0%, transparent 55%),
            radial-gradient(850px 460px at 96% 0%, #08302b 0%, transparent 50%);
  --surface:#13151b;
  --surface-2:#1a1d25;
  --surface-3:#232733;
  --line:#262a34;
  --line-strong:#343947;

  --ink:#eceef4;
  --ink-2:#9ba2b3;
  --ink-3:#6e7585;

  --brand:#8b6dff;
  --brand-2:#a78bff;
  --brand-soft:#1e1a3d;
  --brand-ring:rgba(139,109,255,.22);

  --legal:#a5b4fc; --legal-bg:#191b3a;
  --ej:#34d399;    --ej-bg:#0c2a24;
  --warn:#fbbf24;  --warn-bg:#2e2110;
  --exc:#fb7185;   --exc-bg:#331119;

  --ok:#4ade80; --ok-soft:#0e2a19;
  --mid:#facc15; --mid-soft:#2c2610;
  --off:#5b6070; --off-soft:#1c1f27;

  --sh-1:0 1px 2px rgba(0,0,0,.3), 0 2px 8px rgba(0,0,0,.25);
  --sh-2:0 2px 6px rgba(0,0,0,.35), 0 12px 28px rgba(0,0,0,.4);
  --sh-3:0 8px 20px rgba(139,109,255,.2), 0 24px 56px rgba(0,0,0,.5);
}

*,*::before,*::after{box-sizing:border-box}
html{font-size:var(--fs);scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);background-image:var(--bg-grad);
  background-attachment:fixed;background-repeat:no-repeat;
  color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.68;
  -webkit-font-smoothing:antialiased;
  transition:background-color .5s var(--e-out),color .3s;
}
::selection{background:var(--brand);color:#fff}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{font-family:var(--f-display);letter-spacing:-.022em;line-height:1.2}
.num{font-variant-numeric:tabular-nums}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:99px;border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3)}

/* ═══ HEADER ═══ */
header.top{
  position:sticky;top:0;z-index:60;
  background:color-mix(in srgb,var(--surface) 80%,transparent);
  backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);
  border-bottom:1px solid var(--line);
}
.top-in{max-width:1280px;margin:0 auto;padding:.65rem 1.1rem;display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.brandwrap{display:flex;align-items:center;gap:.65rem;min-width:0;flex:1}
.mark{
  width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;
  font-weight:800;font-size:.8rem;letter-spacing:-.02em;text-decoration:none;
  box-shadow:0 4px 14px var(--brand-ring);
  transition:transform .3s var(--e-spring),box-shadow .3s;
}
.mark:hover{transform:rotate(-8deg) scale(1.08);box-shadow:var(--sh-3);text-decoration:none}
.top h1{font-size:var(--t-h1);margin:0;font-weight:800;line-height:1.25;min-width:0}
.top h1 .sub{display:block;font-size:var(--t-xs);color:var(--ink-2);font-weight:500;letter-spacing:0;
  margin-top:.1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tools{margin-left:auto;display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}

button,select,input[type=search]{
  font:inherit;font-size:var(--t-sm);font-weight:600;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:var(--r-sm);padding:.4rem .72rem;cursor:pointer;
  position:relative;overflow:hidden;
  transition:transform .18s var(--e-spring),border-color .2s,background .2s,box-shadow .2s,color .2s;
}
button:hover{transform:translateY(-1.5px);border-color:var(--brand);box-shadow:var(--sh-1)}
button:active{transform:translateY(0) scale(.97)}
button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible{outline:none;box-shadow:var(--sh-glow)}
input[type=search]{min-width:190px;cursor:text;font-weight:500}
input[type=search]:focus{border-color:var(--brand)}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--surface-2);padding:2px;gap:2px}
.seg button{border:0;border-radius:calc(var(--r-sm) - 2px);padding:.32rem .68rem;background:transparent;box-shadow:none}
.seg button:hover{transform:none;background:var(--surface)}
.seg button[aria-pressed="true"]{background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;box-shadow:0 2px 8px var(--brand-ring)}

.ripple{position:absolute;border-radius:50%;transform:scale(0);background:currentColor;opacity:.25;animation:rip .55s linear;pointer-events:none}
@keyframes rip{to{transform:scale(3.4);opacity:0}}

.progress{position:absolute;left:0;bottom:-1px;height:2.5px;width:0;
  background:linear-gradient(90deg,var(--brand),var(--legal),var(--ej));transition:width .1s linear}

/* ═══ LAYOUT ═══ */
.layout{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:270px 1fr;gap:1.8rem;padding:1.4rem 1.1rem 5rem}
main{min-width:0}

/* ═══ SIDEBAR ═══ */
nav.side{
  position:sticky;top:76px;align-self:start;max-height:calc(100vh - 96px);overflow:auto;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:.85rem;box-shadow:var(--sh-1);
}
nav.side h2{font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);
  margin:.5rem .4rem .5rem;font-weight:800}
nav.side h2:first-child{margin-top:.1rem}
nav.side a{
  display:flex;align-items:baseline;gap:.5rem;padding:.36rem .55rem;border-radius:var(--r-sm);
  text-decoration:none;color:var(--ink-2);font-size:var(--t-sm);font-weight:500;
  position:relative;transition:background .22s,color .22s,transform .22s var(--e-out);
}
nav.side a:hover{background:var(--surface-2);color:var(--ink);transform:translateX(3px);text-decoration:none}
nav.side a.on{background:var(--brand-soft);color:var(--brand);font-weight:700}
nav.side a.on::before{content:"";position:absolute;left:-.85rem;top:20%;bottom:20%;width:3px;
  border-radius:0 3px 3px 0;background:var(--brand)}
nav.side a b{color:var(--ink-3);font-weight:800;font-size:var(--t-xs);font-variant-numeric:tabular-nums;flex:none;min-width:1.9em}
nav.side a.on b{color:var(--brand)}
.navtoggle{display:none}

/* ═══ TARJETAS ═══ */
section.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:1.35rem 1.5rem;margin-bottom:1.1rem;box-shadow:var(--sh-1);
  transition:box-shadow .3s var(--e-out),border-color .3s;
}
section.card:hover{box-shadow:var(--sh-2)}
section.card>h2{
  margin:0 0 1rem;font-size:var(--t-h2);font-weight:800;
  display:flex;align-items:center;gap:.6rem;
}
section.card>h2::before{
  content:"";width:4px;height:1.05em;border-radius:99px;flex:none;
  background:linear-gradient(180deg,var(--brand),var(--brand-2));
}

/* ═══ ARTÍCULO ═══ */
.art{scroll-margin-top:86px;padding-top:.4rem}
.art + .art{margin-top:1.6rem;padding-top:1.6rem;border-top:1px dashed var(--line)}
.art h2{display:flex;flex-wrap:wrap;gap:.5rem;align-items:baseline;font-size:var(--t-h3);
  margin:0 0 .25rem;font-weight:800;letter-spacing:-.015em}
.art h2 .num{
  color:var(--brand);font-weight:800;font-family:var(--f-display);
  background:var(--brand-soft);padding:.1rem .5rem;border-radius:var(--r-sm);
  font-size:.92em;letter-spacing:-.02em;
}
.ubic{font-size:var(--t-xs);color:var(--ink-3);margin:0 0 .8rem;font-weight:600;
  letter-spacing:.03em;text-transform:uppercase}

/* ═══ IDEA CLAVE ═══ */
.idea{
  background:linear-gradient(100deg,var(--brand-soft),color-mix(in srgb,var(--brand-soft) 40%,transparent));
  border-left:4px solid var(--brand);border-radius:0 var(--r-md) var(--r-md) 0;
  padding:.75rem 1rem;font-weight:650;margin:.7rem 0 1rem;position:relative;
  font-size:.97rem;line-height:1.55;
}

/* ═══ ACORDEÓN ═══ */
details.panel{
  border:1px solid var(--line);border-radius:var(--r-md);margin:.6rem 0;
  background:var(--surface);overflow:hidden;
  transition:border-color .25s,box-shadow .25s,background .25s;
}
details.panel:hover{border-color:var(--line-strong)}
details.panel[open]{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-ring)}
details.panel>summary{
  cursor:pointer;padding:.62rem .9rem;font-weight:700;font-size:.93rem;
  list-style:none;display:flex;align-items:center;gap:.55rem;
  transition:background .2s,color .2s;
}
details.panel>summary:hover{background:var(--surface-2)}
details.panel[open]>summary{background:var(--brand-soft);color:var(--brand)}
details.panel>summary::-webkit-details-marker{display:none}
details.panel>summary::before{
  content:"";width:16px;height:16px;flex:none;border-radius:5px;
  background:var(--brand-soft);position:relative;transition:transform .3s var(--e-spring),background .25s;
}
details.panel>summary::after{
  content:"";position:absolute;width:0;height:0;margin-left:5px;
  border:4px solid transparent;border-left-color:var(--brand);
  transition:transform .3s var(--e-spring);
}
details.panel[open]>summary::before{background:var(--surface)}
details.panel[open]>summary::after{transform:rotate(90deg) translateX(-1px)}
details.panel .body{padding:.3rem 1rem 1rem;font-size:.95rem;animation:slidein .35s var(--e-out)}
@keyframes slidein{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* ═══ TEXTO LEGAL ═══ */
.legal{
  background:var(--legal-bg);border-left:4px solid var(--legal);
  border-radius:0 var(--r-md) var(--r-md) 0;padding:.85rem 1.05rem;
  font-family:var(--f-legal);font-size:.95rem;line-height:1.7;
}
.legal p{margin:.45rem 0}
.legal .lbl{
  font-family:var(--f-body);font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;
  color:var(--legal);font-weight:800;display:block;margin-bottom:.4rem;
}

/* ═══ CAJAS SEMÁNTICAS ═══ */
.box{
  border-left:4px solid var(--line);border-radius:0 var(--r-md) var(--r-md) 0;
  padding:.72rem .95rem;margin:.65rem 0;font-size:.94rem;
  transition:transform .25s var(--e-out),box-shadow .25s;
}
.box:hover{transform:translateX(3px);box-shadow:var(--sh-1)}
.box.ej{background:var(--ej-bg);border-color:var(--ej)}
.box.warn{background:var(--warn-bg);border-color:var(--warn)}
.box.exc{background:var(--exc-bg);border-color:var(--exc)}
.box .lbl{font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;font-weight:800;
  display:block;margin-bottom:.3rem}
.box.ej .lbl{color:var(--ej)}
.box.warn .lbl{color:var(--warn)}
.box.exc .lbl{color:var(--exc)}

.interp{
  border:1px dashed var(--warn);background:color-mix(in srgb,var(--warn-bg) 45%,transparent);
  border-radius:var(--r-md);padding:.65rem .9rem;font-size:.9rem;margin:.6rem 0;
}
.interp .lbl{font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;color:var(--warn);font-weight:800;display:block}

/* ═══ TABLAS ═══ */
table{width:100%;border-collapse:separate;border-spacing:0;font-size:.9rem;margin:.7rem 0;
  border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
th,td{padding:.5rem .68rem;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
td + td, th + th{border-left:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th{background:var(--surface-2);font-size:var(--t-xs);font-weight:800;letter-spacing:.05em;
  text-transform:uppercase;color:var(--ink-2);position:sticky;top:0}
tbody tr{transition:background .18s}
tbody tr:nth-child(even){background:color-mix(in srgb,var(--surface-2) 45%,transparent)}
tbody tr:hover{background:var(--brand-soft)}
th.sortable{cursor:pointer;user-select:none;transition:color .2s,background .2s}
th.sortable:hover{color:var(--brand);background:var(--brand-soft)}
th.sortable::after{content:" ⇅";color:var(--ink-3);font-size:.7rem}

ul,ol{margin:.5rem 0 .5rem 1.2rem;padding:0}
li{margin:.26rem 0}
li::marker{color:var(--brand);font-weight:700}

/* ═══ TOOLTIPS ═══ */
.t{border-bottom:1.5px dotted var(--brand);cursor:help;position:relative;
  transition:background .2s,color .2s}
.t:hover{background:var(--brand-soft);color:var(--brand);border-radius:3px}
#tip{
  position:fixed;z-index:99;max-width:330px;background:var(--ink);color:var(--bg);
  padding:.6rem .78rem;border-radius:var(--r-md);font-size:.82rem;line-height:1.5;
  display:none;box-shadow:0 8px 30px rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.08);
}
html[data-theme="dark"] #tip{background:#f0f1f5;color:#15161c}

/* ═══ FLECHAS DE DIAGRAMA ═══
   Un <path> con stroke pero sin fill toma el valor inicial (negro) y el
   navegador cierra el trazo implícitamente: aparece un triángulo relleno
   entre sus extremos. Forzamos fill:none para dejar solo la línea + la
   punta del <marker>, que sí lleva su color. */
svg path[stroke]:not([fill]){fill:none}
svg polyline:not([fill]){fill:none}
svg line{fill:none}

/* ═══ SVG ═══ */
svg{max-width:100%;height:auto;display:block;margin:.9rem auto}
svg text{font-family:var(--f-body)}

/* ═══ BUSCADOR ═══ */
mark.hit{background:linear-gradient(180deg,transparent 55%,#ffe066 55%);color:inherit;
  border-radius:2px;padding:0 1px;font-weight:600}
html[data-theme="dark"] mark.hit{background:linear-gradient(180deg,transparent 55%,#8a6d00 55%);color:#fff}

/* ═══ UTILIDADES ═══ */
.hide{display:none !important}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.small{font-size:var(--t-sm);color:var(--ink-2)}
.chip{
  display:inline-block;font-size:var(--t-xs);padding:.16rem .55rem;border-radius:var(--r-full);
  background:var(--brand-soft);color:var(--brand);font-weight:800;letter-spacing:.02em;
}

/* ═══ HUECOS RELLENABLES ═══ */
.gap{
  display:inline-block;min-width:5.5em;border-bottom:2px solid var(--brand);
  text-align:center;font-weight:700;color:transparent;cursor:pointer;
  transition:color .3s,background .3s;
}
.gap.on,.gap:hover{color:var(--brand);background:var(--brand-soft);border-radius:4px 4px 0 0}

/* ═══ REVELAR SOLUCIÓN ═══ */
.revelar{
  background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;border-color:transparent;
  font-weight:700;
}
.revelar:hover{box-shadow:var(--sh-3)}
.sol{
  margin-top:.7rem;padding:.8rem 1rem;border-radius:var(--r-md);
  background:var(--ej-bg);border-left:4px solid var(--ej);
  animation:slidein .4s var(--e-out);
}

/* ═══ TEST ═══ */
.opt{
  display:block;padding:.55rem .85rem;margin:.35rem 0;border:1.5px solid var(--line);
  border-radius:var(--r-md);cursor:pointer;background:var(--surface);font-size:.94rem;
  transition:border-color .22s,background .22s,transform .22s var(--e-out);
}
.opt:hover{border-color:var(--brand);background:var(--brand-soft);transform:translateX(4px)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft);font-weight:650}
.opt.ko{border-color:var(--exc);background:var(--exc-bg)}
.opt input{margin-right:.5rem;accent-color:var(--brand)}

#tscore,#semres{
  font-family:var(--f-display);font-weight:800;font-size:1.15rem;letter-spacing:-.02em;
}

/* ═══════════════════════════════════════════════════════════════
   FLASHCARDS 3D · mazo con giro, vuelo de salida y sheen
   ═══════════════════════════════════════════════════════════════ */
#flash{--fc-e:cubic-bezier(.2,.8,.25,1);--fc-h:250px}

/* — Escena — */
.fc-stage{
  perspective:1400px;perspective-origin:50% 45%;
  padding:.4rem 0 .2rem;position:relative;
}
.fc-deck{position:relative;height:var(--fc-h);will-change:transform}

/* — Cartas fantasma del mazo — */
.fc-ghost{
  position:absolute;inset:0;border-radius:var(--r-lg);
  background:var(--surface);border:1px solid var(--line);
  transition:transform .5s var(--fc-e),opacity .5s var(--fc-e);
}
.fc-ghost.g1{transform:translateY(9px) scale(.972);opacity:.75}
.fc-ghost.g2{transform:translateY(18px) scale(.944);opacity:.45}
.fc-deck.empty .fc-ghost{opacity:0;transform:translateY(26px) scale(.9)}

/* — Elevación durante el giro — */
.fc-lift{position:absolute;inset:0;transform-style:preserve-3d}
.fc-lift.lift{animation:fcLift .78s var(--fc-e)}
@keyframes fcLift{
  0%,100%{transform:scale(1) translateY(0)}
  45%{transform:scale(1.055) translateY(-16px)}
}
.fc-lift.out-ok{animation:fcOut .5s cubic-bezier(.5,0,.75,0) forwards}
.fc-lift.out-ko{animation:fcOutKo .5s cubic-bezier(.5,0,.75,0) forwards}
.fc-lift.in{animation:fcIn .48s var(--fc-e)}
@keyframes fcOut{
  0%{transform:translateX(0) rotate(0) scale(1);opacity:1}
  100%{transform:translateX(130%) rotate(17deg) scale(.85);opacity:0}
}
@keyframes fcOutKo{
  0%{transform:translateX(0) rotate(0) scale(1);opacity:1}
  100%{transform:translateX(-130%) rotate(-17deg) scale(.85);opacity:0}
}
@keyframes fcIn{
  0%{transform:translateY(26px) scale(.9);opacity:0}
  100%{transform:translateY(0) scale(1);opacity:1}
}

/* — La carta — */
.fc-card{
  position:absolute;inset:0;transform-style:preserve-3d;
  transition:transform .78s var(--fc-e);
  cursor:pointer;border-radius:var(--r-lg);
}
.fc-card:focus-visible{outline:none}
.fc-card:focus-visible .fc-face{box-shadow:var(--sh-glow),var(--sh-2)}

/* — Caras — */
.fc-face{
  position:absolute;inset:0;border-radius:var(--r-lg);
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  padding:2rem 2.2rem;text-align:center;overflow:hidden;
  box-shadow:var(--sh-2);
  transition:box-shadow .4s var(--fc-e);
}
.fc-card:hover .fc-face{box-shadow:var(--sh-3)}

/* Anverso · pregunta */
.fc-front{
  background:
    radial-gradient(120% 90% at 50% -20%, var(--brand-soft) 0%, transparent 60%),
    var(--surface);
  border:1.5px solid var(--line);color:var(--ink);
}
/* Reverso · respuesta */
.fc-back{
  transform:rotateY(180deg);
  background:linear-gradient(145deg,var(--brand) 0%,#6d4bf7 45%,var(--c5,#0891b2) 130%);
  border:1.5px solid transparent;color:#fff;
}
html[data-theme="dark"] .fc-back{
  background:linear-gradient(145deg,#5f45c9 0%,#4b3aa8 45%,#0e6b85 130%);
}
.fc-back .fc-txt{color:#fff}
.fc-back b,.fc-back strong{color:#fff;font-weight:800}

/* — Sheen que barre al girar — */
.fc-face::after{
  content:"";position:absolute;top:-60%;left:-70%;width:55%;height:220%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.42),transparent);
  transform:rotate(18deg);opacity:0;pointer-events:none;
}
.fc-lift.lift .fc-face::after{animation:fcSheen .78s var(--fc-e)}
@keyframes fcSheen{
  0%{opacity:0;left:-70%}
  35%{opacity:1}
  100%{opacity:0;left:150%}
}

/* — Etiqueta superior — */
.fc-tag{
  position:absolute;top:1rem;left:1.15rem;
  font-size:var(--t-xs);font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  display:inline-flex;align-items:center;gap:.4rem;
}
.fc-front .fc-tag{color:var(--brand)}
.fc-back .fc-tag{color:rgba(255,255,255,.9)}
.fc-tag::before{
  content:"";width:7px;height:7px;border-radius:50%;background:currentColor;
  animation:fcPulse 2.2s ease-in-out infinite;
}
@keyframes fcPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.65)}}

/* — Índice tipo naipe — */
.fc-pip{
  position:absolute;font-family:var(--f-display);font-weight:800;
  font-size:.78rem;letter-spacing:-.02em;opacity:.34;font-variant-numeric:tabular-nums;
}
.fc-pip.tr{top:1rem;right:1.15rem}
.fc-pip.bl{bottom:1rem;left:1.15rem;transform:rotate(180deg)}
.fc-front .fc-pip{color:var(--ink-2)}
.fc-back .fc-pip{color:#fff;opacity:.55}

/* — Texto — */
.fc-txt{
  font-size:clamp(1rem,.9rem + .55vw,1.28rem);font-weight:650;line-height:1.5;
  max-width:44ch;letter-spacing:-.012em;
}
.fc-front .fc-txt{font-family:var(--f-display);font-weight:700}
.fc-back .fc-txt{font-weight:600;line-height:1.6}
.fc-hint{
  position:absolute;bottom:1rem;left:0;right:0;
  font-size:var(--t-xs);font-weight:600;letter-spacing:.02em;
  display:flex;align-items:center;justify-content:center;gap:.4rem;
}
.fc-front .fc-hint{color:var(--ink-3)}
.fc-back .fc-hint{color:rgba(255,255,255,.72)}
.fc-hint .kbd{
  font-family:var(--f-mono);font-size:.68rem;font-weight:700;padding:.1rem .32rem;
  border-radius:5px;border:1px solid currentColor;opacity:.75;
}

/* — Pantalla final — */
.fc-done{
  position:absolute;inset:0;border-radius:var(--r-lg);
  background:linear-gradient(150deg,var(--ok-soft),var(--surface) 70%);
  border:1.5px solid var(--ok);
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  text-align:center;padding:2rem;gap:.35rem;
  animation:fcIn .5s var(--fc-e);box-shadow:var(--sh-2);
}
.fc-done .seal{
  font-size:2.6rem;line-height:1;
  animation:fcSeal .7s cubic-bezier(.2,1.5,.4,1);
}
@keyframes fcSeal{0%{transform:scale(0) rotate(-25deg);opacity:0}60%{transform:scale(1.2) rotate(6deg)}100%{transform:scale(1) rotate(0);opacity:1}}
.fc-done h3{font-size:1.3rem;font-weight:800;margin:.2rem 0 0}
.fc-done p{margin:0;color:var(--ink-2);font-size:var(--t-sm)}

/* — Barra de progreso de la ronda — */
.fc-bar{
  height:6px;border-radius:99px;background:var(--surface-3);
  overflow:hidden;margin:.95rem 0 .8rem;position:relative;
}
.fc-bar i{
  display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--brand),var(--c5,#0891b2));
  transition:width .55s var(--fc-e);
}

/* — Controles — */
.fc-ctrls{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.fc-ctrls button{font-weight:700}
#fcok{border-color:var(--ok);color:var(--ok)}
#fcok:hover{background:var(--ok);color:#fff;border-color:var(--ok)}
#fcko{border-color:var(--warn);color:var(--warn)}
#fcko:hover{background:var(--warn);color:#fff;border-color:var(--warn)}
#fcflip{background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;border-color:transparent}
#fcflip:hover{box-shadow:var(--sh-3)}

.fc-score{display:inline-flex;gap:.45rem;margin-left:auto;align-items:center}
.fc-pill{
  font-size:var(--t-xs);font-weight:800;padding:.24rem .6rem;border-radius:var(--r-full);
  font-variant-numeric:tabular-nums;border:1px solid;
}
.fc-pill.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.fc-pill.ko{color:var(--warn);border-color:var(--warn);background:var(--warn-bg)}
.fc-pill.left{color:var(--ink-2);border-color:var(--line);background:var(--surface-2)}
.fc-pill.bump{animation:fcBump .45s var(--e-spring)}
@keyframes fcBump{0%{transform:scale(1)}45%{transform:scale(1.28)}100%{transform:scale(1)}}

@media(max-width:620px){
  #flash{--fc-h:270px}
  .fc-face{padding:1.7rem 1.3rem}
  .fc-score{margin-left:0;width:100%}
}
@media(prefers-reduced-motion:reduce){
  .fc-card{transition:none}
  .fc-lift.lift,.fc-lift.in,.fc-lift.out-ok,.fc-lift.out-ko,.fc-face::after{animation:none !important}
}
@media print{.fc-stage,.fc-ctrls,.fc-bar{display:none !important}}
/* ═══ RESPUESTA ESTRUCTURADA ═══ */
.fc-face{justify-content:center}
.fc-face.struct{justify-content:flex-start;text-align:left;padding-top:3.1rem;padding-bottom:3.1rem}
.fc-body{
  width:100%;max-width:46ch;margin:0 auto;
  overflow-y:auto;max-height:100%;
  scrollbar-width:thin;
}
.fc-body::-webkit-scrollbar{width:5px}
.fc-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.35);border-radius:99px;border:0}
.fc-front .fc-body::-webkit-scrollbar-thumb{background:var(--line-strong)}

/* — Veredicto Sí / No — */
.fc-verdict{
  display:inline-flex;align-items:center;gap:.35rem;
  font-family:var(--f-display);font-weight:800;font-size:.82rem;
  letter-spacing:.06em;text-transform:uppercase;
  padding:.26rem .72rem;border-radius:var(--r-full);margin-bottom:.85rem;
  border:1.5px solid;animation:fcPopIn .45s var(--e-spring) backwards;animation-delay:.34s;
}
.fc-verdict.si{background:rgba(255,255,255,.16);border-color:rgba(190,255,215,.85);color:#d8ffe9}
.fc-verdict.no{background:rgba(255,255,255,.16);border-color:rgba(255,205,205,.85);color:#ffdedd}
@keyframes fcPopIn{0%{opacity:0;transform:scale(.7) translateY(6px)}100%{opacity:1;transform:none}}

/* — Párrafo — */
.fc-p{margin:0;font-size:clamp(1rem,.92rem + .45vw,1.2rem);font-weight:600;line-height:1.6}
.fc-face.struct .fc-p{font-size:clamp(.96rem,.9rem + .35vw,1.1rem)}

/* — Lista enumerada — */
.fc-list{list-style:none;margin:0;padding:0;display:grid;gap:.5rem;counter-reset:fc}
.fc-list li{
  counter-increment:fc;position:relative;margin:0;
  padding:.42rem .6rem .42rem 2.5rem;border-radius:var(--r-sm);
  background:rgba(255,255,255,.11);
  font-size:clamp(.92rem,.88rem + .3vw,1.04rem);font-weight:600;line-height:1.45;
  animation:fcRow .42s var(--e-out) backwards;
}
.fc-list li::before{
  content:counter(fc);position:absolute;left:.6rem;top:50%;transform:translateY(-50%);
  width:1.6rem;height:1.6rem;border-radius:50%;
  display:grid;place-items:center;
  background:rgba(255,255,255,.9);color:var(--brand);
  font-family:var(--f-display);font-weight:800;font-size:.78rem;
  font-variant-numeric:tabular-nums;
}
.fc-list.alpha li::before{content:counter(fc,lower-alpha)}
.fc-list li:nth-child(1){animation-delay:.36s}
.fc-list li:nth-child(2){animation-delay:.42s}
.fc-list li:nth-child(3){animation-delay:.48s}
.fc-list li:nth-child(4){animation-delay:.54s}
.fc-list li:nth-child(5){animation-delay:.60s}
.fc-list li:nth-child(n+6){animation-delay:.66s}
@keyframes fcRow{0%{opacity:0;transform:translateX(-12px)}100%{opacity:1;transform:none}}

/* — Cláusulas contrapuestas — */
.fc-clauses{display:grid;gap:.45rem}
.fc-clauses p{
  margin:0;padding:.45rem .7rem .45rem .95rem;border-radius:0 var(--r-sm) var(--r-sm) 0;
  background:rgba(255,255,255,.11);border-left:3px solid rgba(255,255,255,.55);
  font-size:clamp(.92rem,.88rem + .3vw,1.04rem);font-weight:600;line-height:1.5;
  animation:fcRow .42s var(--e-out) backwards;
}
.fc-clauses p:nth-child(1){animation-delay:.36s}
.fc-clauses p:nth-child(2){animation-delay:.44s}
.fc-clauses p:nth-child(3){animation-delay:.52s}

/* — Negritas resaltadas en el reverso — */
.fc-back .fc-body b,.fc-back .fc-body strong{
  font-weight:800;background:rgba(255,255,255,.2);
  padding:.03em .3em;border-radius:5px;
  box-decoration-break:clone;-webkit-box-decoration-break:clone;
}

/* — Cita legal al pie — */
.fc-cite{
  position:absolute;bottom:.95rem;left:0;right:0;
  display:inline-flex;align-items:center;justify-content:center;gap:.4rem;
  font-family:var(--f-mono);font-size:.74rem;font-weight:700;letter-spacing:.02em;
  color:rgba(255,255,255,.82);
  animation:fcPopIn .5s var(--e-out) backwards;animation-delay:.5s;
}
.fc-cite::before,.fc-cite::after{
  content:"";height:1px;width:clamp(18px,10%,52px);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.45));
}
.fc-cite::after{background:linear-gradient(90deg,rgba(255,255,255,.45),transparent)}
.fc-cite .s{font-size:.9rem;opacity:.75;font-family:var(--f-legal)}
.fc-front .fc-cite{color:var(--ink-3)}
.fc-front .fc-cite::before{background:linear-gradient(90deg,transparent,var(--line-strong))}
.fc-front .fc-cite::after{background:linear-gradient(90deg,var(--line-strong),transparent)}

/* la pista se oculta si hay cita, para no amontonar */
.fc-back .fc-cite ~ .fc-hint,.fc-back .fc-hint.muted{display:none}

@media(max-width:620px){
  #flash{--fc-h:320px}
  .fc-face.struct{padding-top:2.9rem;padding-bottom:2.8rem}
  .fc-list li{padding-left:2.3rem}
}
@media(prefers-reduced-motion:reduce){
  .fc-verdict,.fc-list li,.fc-clauses p,.fc-cite{animation:none !important}
}

/* ═══ SEMÁFORO ═══ */
.sembtn{
  border-radius:var(--r-full);padding:.32rem .7rem;font-weight:700;font-size:var(--t-sm);
}
.sembtn[data-v="g"]:hover,.sembtn.on[data-v="g"]{background:var(--ok);color:#fff;border-color:var(--ok)}
.sembtn[data-v="y"]:hover,.sembtn.on[data-v="y"]{background:var(--mid);color:#3d2f00;border-color:var(--mid)}
.sembtn[data-v="r"]:hover,.sembtn.on[data-v="r"]{background:var(--exc);color:#fff;border-color:var(--exc)}

/* ═══ CTA DE BLOQUE ═══ */
a.blk{
  display:inline-flex;align-items:center;gap:.5rem;
  background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;
  padding:.5rem .95rem;border-radius:var(--r-sm);font-weight:700;font-size:var(--t-sm);
  text-decoration:none;box-shadow:0 2px 10px var(--brand-ring);
  transition:transform .22s var(--e-spring),box-shadow .25s,gap .25s var(--e-out);
}
a.blk:hover{transform:translateY(-2px);box-shadow:var(--sh-3);gap:.75rem;text-decoration:none}
a.blk::after{content:"→"}
a.blk:active{transform:translateY(0) scale(.98)}

/* ═══ REVEAL ═══ */
.rv{opacity:0;transform:translateY(20px);transition:opacity .6s var(--e-out),transform .6s var(--e-out)}
.rv.in{opacity:1;transform:none}

/* ═══ RESPONSIVE ═══ */
@media(max-width:960px){
  .layout{grid-template-columns:1fr;padding-top:.9rem;gap:1rem}
  nav.side{position:static;max-height:none}
  nav.side.collapsed .navbody{display:none}
  .navtoggle{display:block;width:100%;text-align:left;font-weight:700}
  .grid2{grid-template-columns:1fr}
  .top h1 .sub{white-space:normal}
}
@media(max-width:620px){
  .top-in{padding:.55rem .8rem}
  .tools{width:100%;margin-left:0}
  input[type=search]{flex:1;min-width:0}
  section.card{padding:1.05rem 1rem;border-radius:var(--r-md)}
  table{font-size:.82rem}
  th,td{padding:.4rem .5rem}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
  .rv{opacity:1;transform:none}
}
@media print{
  header.top,nav.side,.tools,.noprint,.progress{display:none !important}
  body{background:#fff;background-image:none;font-size:11pt;color:#000}
  .layout{display:block;max-width:none;padding:0}
  section.card{border:0;padding:0;margin:0 0 1rem;break-inside:avoid;box-shadow:none}
  details.panel{border:0;box-shadow:none}
  details.panel .body{display:block !important}
  details.panel>summary{padding-left:0}
  .art{break-inside:avoid}
  .rv{opacity:1;transform:none}
  a{color:#000;text-decoration:none}
}


/* ═══ ALTURA ADAPTATIVA DE LA TARJETA ═══ */
.fc-deck{transition:height .45s var(--fc-e)}
.fc-body{max-height:none;overflow:visible}
.fc-measure{
  position:absolute;left:0;right:0;top:0;height:auto;
  visibility:hidden;pointer-events:none;z-index:-1;
}
.fc-measure .fc-face{
  position:relative;inset:auto;height:auto;min-height:0;
  box-shadow:none;backface-visibility:visible;transform:none;
}
.fc-measure .fc-body{max-height:none;overflow:visible}
.fc-measure .fc-face::after{display:none}

/* ═══ MOSTRAR / OCULTAR ÍNDICE LATERAL ═══ */
.layout{transition:grid-template-columns .42s var(--e-out)}
.layout.nonav{grid-template-columns:0 1fr;gap:0}
.layout.nonav>nav.side{
  opacity:0;transform:translateX(-14px);pointer-events:none;
  padding:0;border-width:0;overflow:hidden;width:0;min-width:0;
}
nav.side{
  transition:opacity .3s var(--e-out),transform .38s var(--e-out);
  overflow-x:hidden;
}
#navhide .ic{display:inline-block;transition:transform .35s var(--e-spring);font-size:.95em;line-height:1}
#navhide[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
#navhide[aria-pressed="true"] .ic{transform:rotate(90deg)}
@media(max-width:960px){#navhide{display:none}}

/* ═══════════════════════════════════════════════════════════════
   LECTURA EN VOZ ALTA (TTS) del texto legal
   ═══════════════════════════════════════════════════════════════ */
.tts-bar{
  display:flex;align-items:center;gap:.45rem;flex-wrap:wrap;
  margin:.15rem 0 .7rem;
}
.tts-bar button{
  font-size:var(--t-xs);font-weight:700;padding:.3rem .62rem;
  border-radius:var(--r-full);border:1px solid var(--legal);
  background:transparent;color:var(--legal);
  display:inline-flex;align-items:center;gap:.35rem;line-height:1.2;
}
.tts-bar button:hover{background:var(--legal);color:var(--surface);border-color:var(--legal)}
.tts-bar button[hidden]{display:none}
.tts-bar .tts-play.on{background:var(--legal);color:var(--surface)}

/* Ondas de audio mientras lee */
.tts-wave{display:inline-flex;align-items:flex-end;gap:2px;height:11px}
.tts-wave i{
  width:2.5px;background:currentColor;border-radius:2px;height:35%;
  animation:ttsW .9s ease-in-out infinite;
}
.tts-wave i:nth-child(2){animation-delay:.15s}
.tts-wave i:nth-child(3){animation-delay:.3s}
.tts-wave i:nth-child(4){animation-delay:.45s}
@keyframes ttsW{0%,100%{height:32%}50%{height:100%}}

.tts-time{
  font-family:var(--f-mono);font-size:.7rem;font-weight:700;
  color:var(--ink-3);font-variant-numeric:tabular-nums;
}

/* Frase que se está leyendo */
.tts-s{transition:background .25s,color .25s;border-radius:3px}
.tts-s.now{
  background:linear-gradient(180deg,transparent 8%,color-mix(in srgb,var(--legal) 26%,transparent) 8%);
  box-shadow:0 0 0 2px color-mix(in srgb,var(--legal) 16%,transparent);
}
html[data-theme="dark"] .tts-s.now{
  background:linear-gradient(180deg,transparent 8%,color-mix(in srgb,var(--legal) 34%,transparent) 8%);
}
.legal.tts-on{box-shadow:0 0 0 3px color-mix(in srgb,var(--legal) 20%,transparent)}

/* ═══ Reproductor flotante ═══ */
.tts-mini{
  position:fixed;left:50%;bottom:1.1rem;transform:translateX(-50%) translateY(140%);
  z-index:80;display:flex;align-items:center;gap:.6rem;
  background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  border:1px solid var(--line);border-radius:var(--r-full);
  padding:.5rem .7rem .5rem .95rem;box-shadow:var(--sh-3);
  transition:transform .45s var(--e-spring),opacity .3s;opacity:0;pointer-events:none;
  max-width:min(94vw,540px);
}
.tts-mini.show{transform:translateX(-50%) translateY(0);opacity:1;pointer-events:auto}
.tts-mini .lbl{
  font-size:var(--t-xs);font-weight:800;color:var(--legal);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:16ch;
}
.tts-mini button{
  border-radius:50%;width:32px;height:32px;padding:0;display:grid;place-items:center;
  font-size:.8rem;border:1px solid var(--line);flex:none;
}
.tts-mini button.main{
  width:38px;height:38px;font-size:.95rem;
  background:linear-gradient(140deg,var(--legal),var(--brand));color:#fff;border-color:transparent;
}
.tts-mini .bar{
  flex:1;min-width:70px;height:5px;border-radius:99px;background:var(--surface-3);overflow:hidden;
}
.tts-mini .bar i{display:block;height:100%;width:0;background:var(--legal);
  border-radius:99px;transition:width .35s var(--e-out)}

/* ═══ Panel de ajustes de voz ═══ */
.tts-back{
  position:fixed;inset:0;z-index:90;background:rgba(10,10,18,.45);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  display:grid;place-items:center;padding:1rem;
  opacity:0;pointer-events:none;transition:opacity .3s var(--e-out);
}
.tts-back.show{opacity:1;pointer-events:auto}
.tts-panel{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--sh-3);width:min(94vw,470px);max-height:88vh;overflow:auto;
  padding:1.3rem 1.4rem;transform:translateY(16px) scale(.97);
  transition:transform .38s var(--e-spring);
}
.tts-back.show .tts-panel{transform:none}
.tts-panel h3{
  font-size:1.12rem;font-weight:800;margin:0 0 .25rem;
  display:flex;align-items:center;gap:.5rem;
}
.tts-panel .sub{font-size:var(--t-sm);color:var(--ink-2);margin:0 0 1.1rem}
.tts-row{margin-bottom:1.05rem}
.tts-row > label{
  display:block;font-size:var(--t-xs);font-weight:800;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-2);margin-bottom:.4rem;
}
.tts-seg{display:flex;gap:3px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:3px}
.tts-seg button{
  flex:1;border:0;background:transparent;border-radius:calc(var(--r-sm) - 3px);
  padding:.42rem .3rem;font-size:var(--t-sm);font-weight:700;box-shadow:none;
}
.tts-seg button:hover{transform:none;background:var(--surface)}
.tts-seg button[aria-pressed="true"]{
  background:linear-gradient(140deg,var(--legal),var(--brand));color:#fff;
}
.tts-panel select{
  width:100%;padding:.5rem .6rem;border-radius:var(--r-sm);
  border:1px solid var(--line);background:var(--surface);color:var(--ink);

<script>
const GLOSARIO={
 "presupuesto":"Documento contable y jurídico, aprobado por el Pleno, que fija el techo de gasto de un ejercicio y estima los ingresos con los que se financia. Ej.: el presupuesto de Utrera para 2026 autoriza gastar como máximo 78 M€.",
 "credito":"Crédito presupuestario: la cantidad máxima de dinero autorizada para una finalidad concreta. Ej.: 120.000 € en la aplicación de 'mantenimiento de colegios'.",
 "obligacion":"Obligación reconocida: la deuda que el Ayuntamiento admite formalmente que debe pagar, una vez comprobado que el servicio o suministro se ha prestado. Ej.: aprobada la factura del proveedor, nace la obligación.",
 "derecho":"Derecho liquidado: el importe concreto que un tercero debe a la entidad local, una vez cuantificado. Ej.: liquidado el IBI de un inmueble en 340 €, ese es el derecho.",
 "oa":"Organismo autónomo: ente con personalidad jurídica propia creado por la entidad local para gestionar un servicio (patronatos de deportes, de cultura, gerencias de urbanismo). Depende del Ayuntamiento pero tiene su propio presupuesto.",
 "sociedad":"Sociedad mercantil local: empresa con forma de S.A. o S.L. cuyo capital pertenece a la entidad local (p. ej. la empresa municipal de aguas). No aprueba 'presupuesto', sino estados de previsión de gastos e ingresos.",
 "bases":"Bases de ejecución: el 'reglamento de uso' del presupuesto. Adaptan las normas presupuestarias generales a la organización concreta de la entidad. Ej.: fijan qué órgano autoriza gastos de hasta 3.000 €.",
 "estabilidad":"Estabilidad presupuestaria: exigencia de que las cuentas públicas no incurran en déficit estructural. Ej.: un ayuntamiento no puede presupuestar más gasto no financiero que ingresos no financieros.",
 "afectacion":"No afectación: regla general de que todos los ingresos financian todo el gasto, sin que un ingreso concreto quede reservado a un gasto concreto. Ej.: lo recaudado por el IBI no está reservado a pagar el alumbrado.",
 "bruto":"Principio de presupuesto bruto (o de integridad): derechos y obligaciones se anotan por su importe total, sin compensar unos con otros. Ej.: no se puede anotar la subvención 'ya descontados' los gastos del programa.",
 "nivelacion":"Nivelación presupuestaria: que el total de ingresos previstos cubra el total de gastos autorizados; es decir, aprobar sin déficit inicial.",
 "aplicacion":"Aplicación presupuestaria: la 'casilla' exacta donde vive cada euro de gasto, formada al cruzar la clasificación por programas con la económica. Ej.: 323/22103 (funcionamiento de centros docentes / combustibles).",
 "vinculacion":"Nivel de vinculación jurídica: el nivel de agregación en el que el crédito es realmente limitativo; por debajo de él se puede mover el gasto sin tramitar una modificación de crédito (art. 172 TRLHL).",
 "intervencion":"Intervención: el órgano de control interno de la entidad local, con función de fiscalización previa del gasto y de informe preceptivo del presupuesto. Lo desempeña un funcionario de habilitación nacional.",
 "pleno":"Pleno: órgano colegiado formado por todos los concejales o diputados. Es el único competente para aprobar el presupuesto.",
 "bop":"Boletín Oficial de la Provincia: diario oficial donde las entidades locales publican sus anuncios y acuerdos con efectos frente a terceros.",
 "prorroga":"Prórroga presupuestaria: si el 1 de enero no ha entrado en vigor el presupuesto nuevo, sigue rigiendo automáticamente el anterior con sus créditos iniciales.",
 "interesado":"Interesado: quien está legitimado para intervenir en un procedimiento. En el presupuesto, la ley define expresamente quiénes lo son (art. 170.1).",
 "liquidacion":"Liquidación del presupuesto: cierre contable del ejercicio, que determina los derechos y obligaciones pendientes, el remanente de tesorería y el resultado presupuestario.",
 "tcuentas":"Tribunal de Cuentas: órgano fiscalizador externo de las cuentas y la gestión económica del sector público, dependiente de las Cortes Generales.",
 "conten":"Recurso contencioso-administrativo: impugnación ante los juzgados y tribunales de lo contencioso-administrativo, es decir, ya fuera de la propia Administración.",
 "areagasto":"Área de gasto: primer nivel de la clasificación por programas. Agrupa el gasto por grandes finalidades. Son seis: 0 Deuda pública, 1 Servicios públicos básicos, 2 Protección y promoción social, 3 Bienes públicos de carácter preferente, 4 Actuaciones de carácter económico y 9 Actuaciones de carácter general.","politica":"Política de gasto: segundo nivel de la clasificación por programas, de dos dígitos. Ej.: 33 Cultura, dentro del área 3.","grupoprog":"Grupo de programas: tercer nivel de la clasificación por programas, de tres dígitos. Es el nivel mínimo de detalle exigido con carácter general. Ej.: 342 Instalaciones deportivas.","programa":"Programa: cuarto nivel de la clasificación por programas, que puede desarrollarse en subprogramas. La estructura es abierta a partir de aquí.","capitulo":"Capítulo: primer nivel de la clasificación económica, de un dígito. En gastos: 1 a 4 corrientes, 5 fondo de contingencia, 6 y 7 de capital, 8 y 9 financieros.","concepto":"Concepto: tercer nivel de la clasificación económica, de tres dígitos. Puede subdividirse en subconceptos y estos en partidas, con estructura abierta.","organica":"Clasificación orgánica: clasificación potestativa que identifica quién gasta (concejalía, servicio). Si se usa, se integra en la aplicación presupuestaria.","creditoinicial":"Crédito inicial: el asignado a cada aplicación presupuestaria en el presupuesto definitivamente aprobado.","creditodef":"Crédito definitivo: el crédito inicial aumentado o disminuido por las modificaciones presupuestarias aprobadas.","cerrada":"Estructura cerrada y obligatoria: los códigos fijados por la Orden no pueden alterarse ni sustituirse; solo cabe crear niveles inferiores cuando la estructura es abierta."
};
const ARTS=[{n:1,t:"Objeto y ámbito subjetivo",ubic:"Orden EHA/3565/2008, de 3 de diciembre (BOE 24-12-2008) ▸ parte dispositiva ▸ desarrollo del art. 167.1 del TRLHL",idea:"Esta Orden fija la estructura del presupuesto local que exige el art. 167 TRLHL.",literal:`<p>1. Se aprueban por la presente Orden la estructura, normas y códigos a los que deberán adaptarse los presupuestos de las entidades locales.</p><p>2. La normativa contenida en la presente Orden por la que se establece la estructura presupuestaria prevista en el artículo 167.1 del texto refundido de la Ley Reguladora de las Haciendas Locales, aprobado por Real Decreto Legislativo 2/2004, de 5 de marzo, será de aplicación tanto para las entidades locales como para los organismos autónomos de ellas dependientes.</p>`,dis:`<ul>
<li><b>1.1 — objeto:</b> se aprueban la <b>estructura, normas y códigos</b> a los que deberán adaptarse los presupuestos de las entidades locales.</li>
<li><b>1.2 — habilitación y ámbito:</b> establece la estructura presupuestaria <b>prevista en el art. 167.1 del TRLHL</b> y se aplica <b>tanto a las entidades locales como a sus organismos autónomos</b>.</li>
</ul>
<div class="box ej"><span class="lbl">Norma utilizada</span><b>Orden EHA/3565/2008, de 3 de diciembre</b>, por la que se aprueba la estructura de los presupuestos de las entidades locales (documento 6 de la biblioteca), texto consolidado con última modificación de <b>19 de marzo de 2014</b>. Desarrolla el <b>art. 167 del RDLeg 2/2004, TRLHL</b> (documento 5).</div>`,llano:`<p>El TRLHL dice que el Ministerio fijará la estructura del presupuesto. Esta Orden es exactamente eso: el manual de códigos con el que todos los ayuntamientos de España presentan sus cuentas de la misma manera.</p>`,porque:`<p>Sin códigos comunes no habría forma de comparar el gasto en cultura de dos municipios, ni de agregar los datos del sector local para las estadísticas nacionales, ni de que el Tribunal de Cuentas fiscalizara con criterios homogéneos. La Orden convierte el mandato genérico del art. 167 en una <b>tabla de códigos operativa</b>.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> el plan contable que impone el mismo formato a todas las empresas para que sus cuentas se puedan comparar.</li>
<li><b>Real:</b> el programa 342 ("Instalaciones deportivas") significa lo mismo en Utrera que en Bilbao, porque lo fija esta Orden.</li>
<li><b>Caso límite:</b> un organismo autónomo municipal también debe aplicarla: el art. 1.2 lo dice expresamente.</li>
</ul>`,noej:`<ul>
<li><b>No alcanza</b> a las sociedades mercantiles locales: estas se rigen por el Plan General de Contabilidad de la empresa española (art. 200.2 TRLHL).</li>
<li><b>No regula</b> la contabilidad: esa es materia del art. 203 TRLHL y de las Instrucciones de contabilidad local.</li>
</ul>`,conex:`<ul>
<li><b>Art. 167 TRLHL</b> (documento 5): norma habilitante, que ordena al Ministerio establecer la estructura.</li>
<li><b>Art. 165.1.a) TRLHL:</b> los créditos figuran "con la debida especificación", que es esta estructura.</li>
<li><b>Art. 203 TRLHL:</b> paralelo en materia contable.</li>
</ul>`,trampas:`<ul>
<li>La Orden desarrolla el art. <b>167.1</b> del TRLHL, no el 165.</li>
<li>Se aplica a entidades locales <b>y a sus organismos autónomos</b>.</li>
</ul>`,ancla:`<p><b>"El 167 manda, la Orden obedece."</b> Ley → estructura; Orden → códigos.</p>`,vis:`<svg viewBox="0 0 640 130" role="img" aria-label="Relación entre el TRLHL y la Orden EHA/3565/2008">
<defs><marker id="o1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="var(--acc)"/></marker></defs>
<rect x="40" y="35" width="240" height="60" rx="8" fill="var(--acc-soft)" stroke="var(--acc)"/>
<text x="160" y="58" text-anchor="middle" font-size="11" font-weight="700" fill="var(--acc)">Art. 167.1 TRLHL</text>
<text x="160" y="78" text-anchor="middle" font-size="10" fill="currentColor">"el Ministerio establecerá la estructura"</text>
<path d="M284 65 L 340 65" stroke="var(--acc)" stroke-width="2" marker-end="url(#o1)"/>
<text x="312" y="55" text-anchor="middle" font-size="10" fill="var(--ink2)">desarrolla</text>
<rect x="344" y="35" width="260" height="60" rx="8" fill="var(--ej-bg)" stroke="var(--ej)"/>
<text x="474" y="58" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ej)">Orden EHA/3565/2008</text>
<text x="474" y="78" text-anchor="middle" font-size="10" fill="currentColor">estructura, normas y códigos</text>
<text x="320" y="118" text-anchor="middle" font-size="10" fill="var(--ink2)">Se aplica a las entidades locales y a sus organismos autónomos</text>
</svg>`},
{n:2,t:"Estructura de los presupuestos",ubic:"Orden EHA/3565/2008, de 3 de diciembre (BOE 24-12-2008) ▸ parte dispositiva ▸ desarrollo del art. 167.1 del TRLHL",idea:"El presupuesto se elabora atendiendo a naturaleza económica y a finalidades.",literal:`<p>1. Las entidades locales elaborarán sus presupuestos teniendo en cuenta la naturaleza económica de los ingresos y de los gastos, y las finalidades y objetivos que con estos últimos se pretendan conseguir.</p><p>2. Igualmente podrán clasificar los gastos e ingresos atendiendo a su propia estructura de acuerdo con sus reglamentos o decretos de organización.</p>`,dis:`<ul>
<li><b>2.1:</b> los presupuestos se elaboran teniendo en cuenta la <b>naturaleza económica</b> de ingresos y gastos y las <b>finalidades y objetivos</b> que con estos se pretendan conseguir.</li>
<li><b>2.2:</b> las entidades <b>podrán</b> clasificar gastos e ingresos atendiendo a su <b>propia estructura</b>, conforme a sus reglamentos o decretos de organización.</li>
</ul>
<p class="small">Es la reproducción, casi literal, de los apartados 1 y 2 del art. 167 TRLHL: la Orden no innova, concreta.</p>`,llano:`<p>Dos preguntas guían la elaboración: en qué se gasta (naturaleza económica) y para qué se gasta (finalidades). Y si la entidad quiere, puede añadir una tercera: quién lo gasta, según su propia organización.</p>`,porque:`<p>Reproducir aquí el criterio legal no es redundante: fija el <b>marco interpretativo</b> de los códigos que vienen después. Cualquier duda sobre a qué programa o capítulo imputar un gasto se resuelve volviendo a estas dos preguntas.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> clasificar un gasto de casa a la vez por concepto (luz) y por destino (calefacción del salón).</li>
<li><b>Real:</b> la compra de material deportivo se clasifica por naturaleza en el capítulo 2 y por finalidad en el grupo de programas 342.</li>
</ul>`,noej:`<ul>
<li><b>No es obligatoria</b> la clasificación orgánica: el art. 2.2 dice "podrán".</li>
</ul>`,conex:`<ul>
<li><b>Art. 167.1 y 167.2 TRLHL:</b> texto del que trae causa.</li>
<li><b>Art. 3 de esta Orden:</b> concreta los tres criterios de clasificación.</li>
</ul>`,trampas:`<ul>
<li>La clasificación por la propia estructura de la entidad es <b>potestativa</b> y exige reglamento o decreto de organización.</li>
</ul>`,ancla:`<p><b>"En qué, para qué y —si quiero— quién."</b></p>`,vis:`<svg viewBox="0 0 640 115" role="img" aria-label="Criterios de elaboración del presupuesto">
<rect x="40" y="30" width="250" height="56" rx="8" fill="var(--acc-soft)" stroke="var(--acc)"/>
<text x="165" y="53" text-anchor="middle" font-size="11" font-weight="700" fill="var(--acc)">Naturaleza económica</text>
<text x="165" y="72" text-anchor="middle" font-size="10" fill="currentColor">¿en qué se gasta o de dónde se ingresa?</text>
<rect x="350" y="30" width="250" height="56" rx="8" fill="var(--ej-bg)" stroke="var(--ej)"/>
<text x="475" y="53" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ej)">Finalidades y objetivos</text>
<text x="475" y="72" text-anchor="middle" font-size="10" fill="currentColor">¿para qué se gasta?</text>
<text x="320" y="105" text-anchor="middle" font-size="10" fill="var(--ink2)">y, potestativamente, según la propia estructura organizativa (art. 2.2)</text>
</svg>`},
{n:3,t:"Criterios generales de clasificación del estado de gastos",ubic:"Orden EHA/3565/2008, de 3 de diciembre (BOE 24-12-2008) ▸ parte dispositiva ▸ desarrollo del art. 167.1 del TRLHL",idea:"Tres criterios de clasificación del gasto: programas, económica y —opcional— orgánica.",literal:`<p>Los estados de gastos de los presupuestos de las entidades locales se clasificarán con los siguientes criterios:</p><p>a) Por programas.</p><p>b) Por categorías económicas.</p><p>c) Opcionalmente, por unidades orgánicas.</p>`,dis:`<table><thead><tr><th>Criterio</th><th>Pregunta</th><th>¿Obligatorio?</th></tr></thead><tbody>
<tr><td><b>a)</b> Por programas</td><td>¿Para qué?</td><td><b>Sí</b></td></tr>
<tr><td><b>b)</b> Por categorías económicas</td><td>¿En qué?</td><td><b>Sí</b></td></tr>
<tr><td><b>c)</b> Por <span class="t" data-k="organica">unidades orgánicas</span></td><td>¿Quién?</td><td><b>Opcional</b></td></tr>
</tbody></table>`,llano:`<p>Cada euro de gasto lleva dos etiquetas obligatorias y una voluntaria: para qué sirve, en qué se materializa y, si la entidad quiere, qué concejalía lo maneja.</p>`,porque:`<p>La doble clasificación obligatoria responde a las dos preguntas que ningún control puede eludir. La orgánica es opcional porque depende del tamaño: en un municipio pequeño identificar "quién gasta" no aporta información, pero en una gran ciudad es imprescindible para exigir responsabilidades de gestión.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> etiquetar un gasto por categoría, por finalidad y por quién de la familia lo hizo.</li>
<li><b>Real:</b> aplicación <b>10/342/22100</b>: <i>10</i> Delegación de Deportes (orgánica), <i>342</i> instalaciones deportivas (programas), <i>22100</i> energía eléctrica (económica).</li>
</ul>`,noej:`<ul>
<li><b>No hay</b> un cuarto criterio: la Orden enumera tres.</li>
<li><b>No es obligatoria</b> la orgánica, pero si se usa se integra en la aplicación presupuestaria (art. 6).</li>
</ul>`,conex:`<ul>
<li><b>Art. 167.3 TRLHL:</b> impone las clasificaciones por programas y económica.</li>
<li><b>Arts. 4, 5 y 6 de esta Orden:</b> desarrollo de cada criterio.</li>
</ul>`,trampas:`<ul>
<li>El orden de las letras: <b>a) programas · b) económica · c) orgánica</b>.</li>
<li>La orgánica es la única <b>opcional</b>.</li>
</ul>`,ancla:`<p><b>"P-E-O":</b> <b>P</b>rogramas y <b>E</b>conómica obligatorias, <b>O</b>rgánica opcional.</p>`,vis:`<svg viewBox="0 0 640 130" role="img" aria-label="Los tres criterios de clasificación del gasto">
<g font-size="10" text-anchor="middle" fill="currentColor">
<rect x="25" y="30" width="180" height="60" rx="8" fill="var(--acc-soft)" stroke="var(--acc)"/><text x="115" y="55" font-size="11" font-weight="700" fill="var(--acc)">a) Por programas</text><text x="115" y="74">¿para qué? · obligatoria</text>
<rect x="230" y="30" width="180" height="60" rx="8" fill="var(--ej-bg)" stroke="var(--ej)"/><text x="320" y="55" font-size="11" font-weight="700" fill="var(--ej)">b) Económica</text><text x="320" y="74">¿en qué? · obligatoria</text>
<rect x="435" y="30" width="180" height="60" rx="8" fill="var(--panel)" stroke="var(--line)" stroke-dasharray="5 4"/><text x="525" y="55" font-size="11" font-weight="700" fill="var(--ink2)">c) Orgánica</text><text x="525" y="74">¿quién? · opcional</text>
</g>
<text x="320" y="115" text-anchor="middle" font-size="10" fill="var(--ink2)">Las dos primeras se cruzan para formar la aplicación presupuestaria (art. 6)</text>
</svg>`},
{n:4,t:"Clasificación por programas",ubic:"Orden EHA/3565/2008, de 3 de diciembre (BOE 24-12-2008) ▸ parte dispositiva ▸ desarrollo del art. 167.1 del TRLHL",idea:"Cuatro niveles por programas, con el anexo I cerrado hasta programa y abierto después.",literal:`<p>1. Los créditos se ordenarán según su finalidad y los objetivos que con ellos se proponga conseguir, con arreglo a la clasificación por áreas de gasto, políticas de gasto, grupos de programas y programas que se detallan en el anexo I. Estos últimos podrán desarrollarse en subprogramas.</p><p>2. Con carácter general, el detalle de los créditos se presentará, como mínimo, en el nivel de grupos de programas de gasto. No obstante, este detalle se deberá presentar en el nivel de programas de gasto en los casos que se especifican en el anexo I.</p><p>3. La estructura que se especifica en el anexo I se debe considerar cerrada y obligatoria para todas las entidades locales. No obstante, será abierta a partir del nivel de programas y subprogramas, por lo que podrán crearse los programas y subprogramas que se consideren necesarios cuando no figuren en la estructura que por esta Orden se establece.</p><p>4. En los supuestos en que la Entidad local asuma competencias por delegación del Estado o de las Comunidades Autónomas, en aplicación del artículo 27 de la Ley 7/1985, de 2 de abril, reguladora de las Bases del Régimen Local, deberá realizar el necesario desarrollo de los grupos de programa, a fin de que exista una exacta correspondencia entre cada servicio asumido y un único programa o subprograma presupuestario.</p>`,dis:`<ul>
<li><b>4.1 — niveles:</b> <span class="t" data-k="areagasto">áreas de gasto</span> ▸ <span class="t" data-k="politica">políticas de gasto</span> ▸ <span class="t" data-k="grupoprog">grupos de programas</span> ▸ <span class="t" data-k="programa">programas</span>, que podrán desarrollarse en <b>subprogramas</b>, según el <b>anexo I</b>.</li>
<li><b>4.2 — detalle mínimo:</b> con carácter general, el crédito se presenta <b>al menos a nivel de grupo de programas</b>; en los casos que especifica el anexo I, a nivel de <b>programa</b>.</li>
<li><b>4.3 — carácter:</b> la estructura del anexo I es <b><span class="t" data-k="cerrada">cerrada y obligatoria</span></b> para todas las entidades locales, y <b>abierta a partir de programas y subprogramas</b>: pueden crearse los que se necesiten si no figuran.</li>
<li><b>4.4 — competencias delegadas:</b> si la entidad asume competencias por delegación del Estado o de las comunidades autónomas (<b>art. 27 LBRL</b>), debe desarrollar los grupos de programa para que exista <b>exacta correspondencia entre cada servicio asumido y un único programa o subprograma</b>.</li>
</ul>
<table><thead><tr><th>Código</th><th>Área de gasto (anexo I)</th></tr></thead><tbody>
<tr><td><b>0</b></td><td>Deuda Pública</td></tr>
<tr><td><b>1</b></td><td>Servicios Públicos Básicos</td></tr>
<tr><td><b>2</b></td><td>Actuaciones de protección y promoción social</td></tr>
<tr><td><b>3</b></td><td>Producción de bienes públicos de carácter preferente</td></tr>
<tr><td><b>4</b></td><td>Actuaciones de carácter económico</td></tr>
<tr><td><b>9</b></td><td>Actuaciones de carácter general</td></tr>
</tbody></table>`,llano:`<p>El gasto se ordena como una muñeca rusa: seis grandes áreas, dentro políticas, dentro grupos de programas y dentro programas. Los tres primeros niveles son iguales para todos los ayuntamientos de España y no se pueden tocar; a partir del programa, cada entidad puede crear los que necesite.</p>`,porque:`<p>Cerrar los niveles superiores es lo que hace posible <b>comparar y agregar</b>: si un ayuntamiento pudiera inventarse las áreas, el gasto en servicios sociales de España sería incalculable. Abrir los inferiores permite que cada entidad refleje su realidad, que es muy distinta entre un municipio rural y una capital.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> el sistema de carpetas de una oficina: los cajones son fijos, las subcarpetas las creas tú.</li>
<li><b>Real:</b> área <b>3</b> (bienes públicos preferentes) ▸ política <b>34</b> (Deporte) ▸ grupo de programas <b>342</b> (Instalaciones deportivas) ▸ programa que la entidad puede crear para una piscina concreta.</li>
<li><b>Caso límite:</b> un ayuntamiento que asume por delegación la gestión de un servicio autonómico debe crear un programa o subprograma específico para él (art. 4.4).</li>
</ul>`,noej:`<ul>
<li><b>No puede</b> una entidad crear un área de gasto nueva ni renombrar una política: son cerradas.</li>
<li><b>No basta</b> el nivel de política de gasto: el detalle mínimo general es el <b>grupo de programas</b>.</li>
</ul>`,conex:`<ul>
<li><b>Art. 167.3.a) TRLHL:</b> los niveles de área y política de gasto se ajustan a los del Estado.</li>
<li><b>Art. 27 LBRL</b> <i>(norma no incluida en la biblioteca)</i>: delegación de competencias, citada por el art. 4.4.</li>
<li><b>Disposición adicional única de la Orden:</b> tabla de equivalencias con los antiguos grupos de función, funciones y subfunciones (anexo II).</li>
</ul>`,trampas:`<ul>
<li>Las áreas de gasto son <b>seis</b>, y la de <b>Deuda Pública es la 0</b>, no la 9. La 9 es "Actuaciones de carácter general".</li>
<li>Detalle mínimo: <b>grupo de programas</b> (tres dígitos), salvo los casos del anexo I que exigen programa.</li>
<li>La estructura es <b>cerrada</b> hasta programas y <b>abierta</b> a partir de programas y subprogramas.</li>
</ul>`,ancla:`<p><b>Á-P-G-P:</b> <b>Á</b>rea ▸ <b>P</b>olítica ▸ <b>G</b>rupo ▸ <b>P</b>rograma.<br>Las seis áreas: <b>0 deuda · 1 básicos · 2 social · 3 preferentes · 4 económico · 9 general</b>. Truco: <b>"la deuda va primero y lo general al final"</b>.</p>`,vis:`<svg viewBox=\"0 0 640 200\" role=\"img\" aria-label=\"Niveles de la clasificación por programas y áreas de gasto\">\n<rect x=\"120\" y=\"12\" width=\"400\" height=\"26\" rx=\"6\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"320\" y=\"30\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">1. Área de gasto (1 dígito) — cerrada</text>\n<rect x=\"150\" y=\"42\" width=\"340\" height=\"26\" rx=\"6\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"320\" y=\"60\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">2. Política de gasto (2 dígitos) — cerrada</text>\n<rect x=\"180\" y=\"72\" width=\"280\" height=\"26\" rx=\"6\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"320\" y=\"90\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">3. Grupo de programas (3 dígitos) — detalle mínimo</text>\n<rect x=\"210\" y=\"102\" width=\"220\" height=\"26\" rx=\"6\" fill=\"var(--panel)\" stroke=\"var(--line)\" stroke-dasharray=\"5 4\"/><text x=\"320\" y=\"120\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--ink2)\">4. Programa — abierto</text>\n<rect x=\"240\" y=\"132\" width=\"160\" height=\"24\" rx=\"6\" fill=\"var(--panel)\" stroke=\"var(--line)\" stroke-dasharray=\"5 4\"/><text x=\"320\" y=\"149\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--ink2)\">Subprograma — abierto</text>\n<text x=\"320\" y=\"176\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">Áreas: 0 Deuda pública · 1 Servicios públicos básicos · 2 Protección y promoción social</text>\n<text x=\"320\" y=\"192\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">3 Bienes públicos preferentes · 4 Actuaciones económicas · 9 Actuaciones de carácter general</text>\n</svg>`},
{n:5,t:"Clasificación económica del gasto",ubic:"Orden EHA/3565/2008, de 3 de diciembre (BOE 24-12-2008) ▸ parte dispositiva ▸ desarrollo del art. 167.1 del TRLHL",idea:"La económica agrupa por capítulos: corrientes, de capital y financieros.",literal:`<p>1. La clasificación económica del gasto agrupará los créditos por capítulos separando las operaciones corrientes, las de capital y las financieras.</p><p>2. Atendiendo a su naturaleza económica, los capítulos se desglosarán en artículos, y éstos, a su vez, en conceptos, que se podrán subdividir en subconceptos.</p><p>3. Los créditos se clasificarán de acuerdo con la estructura que, por capítulos, artículos, conceptos y subconceptos, se detalla en el anexo III de la presente Orden.</p><p>4. La estructura por conceptos y subconceptos es abierta, por lo que podrán crearse los que se consideren necesarios cuando no figuren en la estructura que esta Orden establece.</p><p>5. Los subconceptos podrán desarrollarse en partidas, cuya estructura es igualmente abierta.</p>`,dis:`<ul>
<li><b>5.1:</b> agrupa los créditos por <span class="t" data-k="capitulo">capítulos</span>, separando <b>operaciones corrientes, de capital y financieras</b>.</li>
<li><b>5.2:</b> los capítulos se desglosan en <b>artículos</b>, estos en <span class="t" data-k="concepto">conceptos</span> y estos en <b>subconceptos</b>.</li>
<li><b>5.3:</b> la estructura por capítulos, artículos, conceptos y subconceptos se detalla en el <b>anexo III</b>.</li>
<li><b>5.4 y 5.5:</b> la estructura de <b>conceptos y subconceptos es abierta</b>, y los subconceptos pueden desarrollarse en <b>partidas</b>, también abiertas.</li>
</ul>
<table><thead><tr><th>Cap.</th><th>Denominación (anexo III · gastos)</th><th>Tipo</th></tr></thead><tbody>
<tr><td><b>1</b></td><td>Gastos de personal</td><td rowspan="4">Operaciones corrientes</td></tr>
<tr><td><b>2</b></td><td>Gastos corrientes en bienes y servicios</td></tr>
<tr><td><b>3</b></td><td>Gastos financieros</td></tr>
<tr><td><b>4</b></td><td>Transferencias corrientes</td></tr>
<tr><td><b>5</b></td><td>Fondo de Contingencia y Otros Imprevistos</td><td>—</td></tr>
<tr><td><b>6</b></td><td>Inversiones reales</td><td rowspan="2">Operaciones de capital</td></tr>
<tr><td><b>7</b></td><td>Transferencias de capital</td></tr>
<tr><td><b>8</b></td><td>Activos financieros</td><td rowspan="2">Operaciones financieras</td></tr>
<tr><td><b>9</b></td><td>Pasivos financieros</td></tr>
</tbody></table>`,llano:`<p>La clasificación económica dice en qué se gasta el dinero. Nueve capítulos: los cuatro primeros son el día a día (personal, compras, intereses, subvenciones), el quinto es el colchón para imprevistos, el sexto y el séptimo son inversión, y los dos últimos son movimientos financieros.</p>`,porque:`<p>Separar corriente de capital es la distinción económica fundamental: el gasto corriente se consume en el año, el de capital crea patrimonio duradero. De esa separación dependen indicadores clave —ahorro neto, capacidad de endeudamiento— y las reglas de la estabilidad presupuestaria.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> distinguir en casa entre la compra semanal (corriente) y reformar el baño (capital).</li>
<li><b>Real:</b> nóminas → capítulo 1; electricidad → capítulo 2; intereses del préstamo → capítulo 3; subvención a una asociación → capítulo 4; construcción de un parque → capítulo 6; amortización del préstamo → capítulo 9.</li>
<li><b>Caso límite:</b> el <b>capítulo 5</b> no encaja ni en corriente ni en capital: es la dotación al Fondo de Contingencia, prevista en la normativa de estabilidad presupuestaria.</li>
</ul>`,noej:`<ul>
<li><b>No es gasto de capital</b> la reparación ordinaria de un edificio: es capítulo 2.</li>
<li><b>No puede</b> la entidad inventarse capítulos ni artículos: solo conceptos, subconceptos y partidas.</li>
</ul>`,conex:`<ul>
<li><b>Art. 167.3.b) y c) TRLHL:</b> separación de corrientes y de capital y niveles de la clasificación económica.</li>
<li><b>Art. 182.1.c) TRLHL:</b> los créditos por operaciones de capital son incorporables.</li>
<li><b>LO 2/2012, de Estabilidad Presupuestaria</b> <i>(norma no incluida en la biblioteca)</i>: origen del Fondo de Contingencia del capítulo 5.</li>
</ul>`,trampas:`<ul>
<li><b>Nueve capítulos</b> de gasto. El <b>5</b> es Fondo de Contingencia, no "otros gastos".</li>
<li>Niveles: <b>capítulo ▸ artículo ▸ concepto ▸ subconcepto ▸ partida</b>. Los dos primeros son cerrados.</li>
<li>Los capítulos <b>8 y 9</b> son financieros (activos y pasivos), no de capital.</li>
</ul>`,ancla:`<p><b>1-2-3-4 corriente · 5 colchón · 6-7 capital · 8-9 financiero.</b><br>Regla: <b>"del 1 al 4 vivo, en el 5 me guardo, en el 6 y 7 construyo, en el 8 y 9 presto y devuelvo"</b>.</p>`,vis:`<svg viewBox="0 0 640 165" role="img" aria-label="Capítulos de la clasificación económica del gasto">
<g font-size="10" text-anchor="middle" fill="currentColor">
<rect x="20" y="35" width="230" height="70" rx="8" fill="var(--acc-soft)" stroke="var(--acc)"/><text x="135" y="57" font-size="11" font-weight="700" fill="var(--acc)">Corrientes · 1 a 4</text><text x="135" y="76">personal · bienes y servicios</text><text x="135" y="92">financieros · transferencias</text>
<rect x="262" y="35" width="115" height="70" rx="8" fill="var(--warn-bg)" stroke="var(--warn)"/><text x="319" y="57" font-size="11" font-weight="700" fill="var(--warn)">Cap. 5</text><text x="319" y="76">Fondo de</text><text x="319" y="92">Contingencia</text>
<rect x="389" y="35" width="115" height="70" rx="8" fill="var(--ej-bg)" stroke="var(--ej)"/><text x="446" y="57" font-size="11" font-weight="700" fill="var(--ej)">Capital · 6 y 7</text><text x="446" y="76">inversiones reales</text><text x="446" y="92">transf. de capital</text>
<rect x="516" y="35" width="105" height="70" rx="8" fill="var(--panel)" stroke="var(--line)"/><text x="568" y="57" font-size="11" font-weight="700" fill="currentColor">Financieras</text><text x="568" y="76">8 activos</text><text x="568" y="92">9 pasivos</text>
</g>
<text x="320" y="132" text-anchor="middle" font-size="10" fill="var(--ink2)">Niveles: capítulo ▸ artículo ▸ concepto ▸ subconcepto ▸ partida</text>
<text x="320" y="150" text-anchor="middle" font-size="10" fill="var(--exc)">Capítulo y artículo, cerrados · concepto en adelante, abierto</text>
</svg>`},
{n:6,t:"Aplicación presupuestaria",ubic:"Orden EHA/3565/2008, de 3 de diciembre (BOE 24-12-2008) ▸ parte dispositiva ▸ desarrollo del art. 167.1 del TRLHL",idea:"La aplicación presupuestaria es el cruce de programas y económica, más la orgánica si se usa.",literal:`<p>La aplicación presupuestaria cuya expresión cifrada constituye el crédito presupuestario vendrá definida, al menos, por la conjunción de las clasificaciones por programas y económica, en el nivel de grupo de programa o programa y concepto o subconcepto respectivamente.</p><p>En el caso de que la Entidad local opte por utilizar la clasificación orgánica, la aplicación presupuestaria vendrá definida por la conjunción de las clasificaciones orgánica, por programas y económica.</p>`,dis:`<ul>
<li><b>Regla general:</b> la aplicación presupuestaria —cuya expresión cifrada constituye el <b>crédito presupuestario</b>— viene definida, <b>al menos</b>, por la conjunción de las clasificaciones <b>por programas</b> y <b>económica</b>, en el nivel de <b>grupo de programa o programa</b> y <b>concepto o subconcepto</b>.</li>
<li><b>Si se usa la orgánica:</b> la aplicación viene definida por la conjunción de las <b>tres</b> clasificaciones.</li>
</ul>
<div class="box ej"><span class="lbl">Coincidencia literal</span>Este artículo reproduce, prácticamente palabra por palabra, el <b>art. 167.4 del TRLHL</b>. Si el examen pregunta por la aplicación presupuestaria, la respuesta vale igual citando uno u otro precepto.</div>`,llano:`<p>La aplicación presupuestaria es la casilla exacta donde vive cada euro, y se forma juntando dos códigos: el de "para qué" y el de "en qué". Si la entidad usa además el código de "quién", la casilla tiene tres partes.</p>`,porque:`<p>Definir la aplicación como <b>cruce</b> y no como una lista plana permite consultar el gasto desde dos perspectivas con los mismos datos: cuánto cuesta el deporte y cuánto cuesta la electricidad. Es lo que convierte el presupuesto en un sistema de información, y no en una simple lista de partidas.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> las coordenadas de un mapa: latitud y longitud juntas identifican un punto único.</li>
<li><b>Real:</b> aplicación <b>342/22100</b> = instalaciones deportivas (grupo de programas) + energía eléctrica (subconcepto). Con orgánica: <b>10/342/22100</b>.</li>
</ul>`,noej:`<ul>
<li><b>No es aplicación presupuestaria</b> un código de programas suelto ni un capítulo económico suelto.</li>
<li><b>No coincide</b> necesariamente con el nivel de vinculación jurídica (art. 172 TRLHL): sobre la aplicación se hace el control contable; sobre la vinculación, el fiscal (art. 167.4 TRLHL).</li>
</ul>`,conex:`<ul>
<li><b>Art. 167.4 TRLHL:</b> texto prácticamente idéntico.</li>
<li><b>Art. 7 de esta Orden:</b> el registro contable se realiza como mínimo sobre la aplicación.</li>
<li><b>Art. 172.2 TRLHL:</b> niveles de vinculación jurídica.</li>
</ul>`,trampas:`<ul>
<li>"<b>Al menos</b>" dos clasificaciones: puede haber tres, nunca una.</li>
<li>Los niveles mínimos: <b>grupo de programa o programa</b> y <b>concepto o subconcepto</b>.</li>
</ul>`,ancla:`<p><b>"Para qué + en qué = dónde."</b> Y si hay orgánica, el "quién" va delante.</p>`,vis:`<svg viewBox="0 0 640 145" role="img" aria-label="Formación de la aplicación presupuestaria">
<rect x="30" y="30" width="170" height="52" rx="8" fill="var(--acc-soft)" stroke="var(--acc)"/>
<text x="115" y="52" text-anchor="middle" font-size="11" font-weight="700" fill="var(--acc)">Programas</text>
<text x="115" y="70" text-anchor="middle" font-size="10" fill="currentColor">grupo o programa</text>
<text x="222" y="60" text-anchor="middle" font-size="18" fill="var(--ink2)">+</text>
<rect x="245" y="30" width="170" height="52" rx="8" fill="var(--ej-bg)" stroke="var(--ej)"/>
<text x="330" y="52" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ej)">Económica</text>
<text x="330" y="70" text-anchor="middle" font-size="10" fill="currentColor">concepto o subconcepto</text>
<text x="437" y="60" text-anchor="middle" font-size="18" fill="var(--ink2)">+</text>
<rect x="460" y="30" width="160" height="52" rx="8" fill="var(--panel)" stroke="var(--line)" stroke-dasharray="5 4"/>
<text x="540" y="52" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink2)">Orgánica</text>
<text x="540" y="70" text-anchor="middle" font-size="10" fill="var(--ink2)">si se utiliza</text>
<rect x="170" y="95" width="300" height="36" rx="8" fill="var(--acc)" stroke="var(--acc)"/>
<text x="320" y="118" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">APLICACIÓN PRESUPUESTARIA = el crédito</text>
</svg>`},
{n:7,t:"Registro contable",ubic:"Orden EHA/3565/2008, de 3 de diciembre (BOE 24-12-2008) ▸ parte dispositiva ▸ desarrollo del art. 167.1 del TRLHL",idea:"La contabilidad se registra, como mínimo, en el nivel de la aplicación presupuestaria.",literal:`<p>1. El registro contable de los créditos, de sus modificaciones y de las operaciones de ejecución del gasto se realizará, como mínimo, sobre la aplicación presupuestaria definida en el artículo anterior.</p><p>2. Las entidades locales podrán efectuar el seguimiento contable a un mayor nivel de desglose.</p>`,dis:`<ul>
<li><b>7.1:</b> el registro contable de los <b>créditos, sus modificaciones y las operaciones de ejecución del gasto</b> se realiza <b>como mínimo</b> sobre la aplicación presupuestaria del art. 6.</li>
<li><b>7.2:</b> las entidades <b>podrán</b> efectuar el seguimiento contable a un <b>mayor nivel de desglose</b>.</li>
</ul>`,llano:`<p>Todo lo que pasa con un crédito —que nace, que se modifica, que se gasta— se anota al menos en la casilla de la aplicación presupuestaria. Si la entidad quiere más detalle, puede bajar a partidas o a proyectos, pero nunca subir de nivel.</p>`,porque:`<p>Fijar un <b>mínimo común</b> garantiza que la información contable de todas las entidades sea agregable, mientras que permitir mayor desglose respeta la autonomía de gestión: una gran ciudad querrá seguir cada proyecto de inversión de forma individualizada.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> anotar los gastos por categorías, y si quieres, además por tienda.</li>
<li><b>Real:</b> un ayuntamiento registra el gasto en la aplicación 342/22100 y, adicionalmente, por instalación deportiva concreta para conocer el coste de cada una (fin del art. 205.c TRLHL).</li>
</ul>`,noej:`<ul>
<li><b>No cabe</b> registrar solo por capítulo o por programa: el mínimo es la aplicación completa.</li>
</ul>`,conex:`<ul>
<li><b>Art. 6 de esta Orden</b> y <b>art. 167.4 TRLHL:</b> definición de la aplicación.</li>
<li><b>Art. 205.c) TRLHL:</b> resultados analíticos, que exigen mayor desglose.</li>
<li><b>Art. 204 TRLHL:</b> la Intervención lleva la contabilidad.</li>
</ul>`,trampas:`<ul>
<li>"<b>Como mínimo</b>": el desglose mayor es potestativo, el menor está prohibido.</li>
<li>Alcanza a créditos, <b>modificaciones</b> y operaciones de ejecución.</li>
</ul>`,ancla:`<p><b>"Mínimo la aplicación; más, si quieres."</b></p>`,vis:`<svg viewBox="0 0 640 120" role="img" aria-label="Nivel mínimo del registro contable">
<rect x="130" y="25" width="380" height="34" rx="8" fill="var(--acc-soft)" stroke="var(--acc)"/>
<text x="320" y="47" text-anchor="middle" font-size="11" font-weight="700" fill="var(--acc)">Registro contable: créditos, modificaciones y ejecución</text>
<rect x="80" y="68" width="220" height="36" rx="8" fill="var(--exc-bg)" stroke="var(--exc)"/>
<text x="190" y="91" text-anchor="middle" font-size="10" fill="var(--exc)">Nunca por debajo de la aplicación</text>
<rect x="340" y="68" width="220" height="36" rx="8" fill="var(--ej-bg)" stroke="var(--ej)"/>
<text x="450" y="91" text-anchor="middle" font-size="10" fill="var(--ej)">Sí cabe mayor desglose</text>
</svg>`},
{n:8,t:"Créditos iniciales y definitivos",ubic:"Orden EHA/3565/2008, de 3 de diciembre (BOE 24-12-2008) ▸ parte dispositiva ▸ desarrollo del art. 167.1 del TRLHL",idea:"Crédito inicial es el aprobado; crédito definitivo, el inicial más o menos modificaciones.",literal:`<p>1. Se entenderá por crédito inicial el asignado a cada aplicación presupuestaria en el presupuesto de la entidad definitivamente aprobado.</p><p>2. El crédito definitivo vigente en cada momento vendrá determinado por el crédito inicial aumentado o disminuido como consecuencia de modificaciones presupuestarias.</p>`,dis:`<table><thead><tr><th>Concepto</th><th>Definición (art. 8)</th></tr></thead><tbody>
<tr><td><span class="t" data-k="creditoinicial">Crédito inicial</span></td><td>El asignado a cada aplicación presupuestaria en el presupuesto <b>definitivamente aprobado</b></td></tr>
<tr><td><span class="t" data-k="creditodef">Crédito definitivo</span></td><td>El inicial <b>aumentado o disminuido</b> como consecuencia de las modificaciones presupuestarias</td></tr>
</tbody></table>`,llano:`<p>El crédito inicial es la cifra con la que arranca el año. El definitivo es la cifra en la que ha quedado esa casilla después de todas las modificaciones. Distinguirlos importa mucho, porque la prórroga presupuestaria arrastra solo los <b>iniciales</b>.</p>`,porque:`<p>Sin esta distinción no se podría medir la gestión: comparar lo ejecutado con el crédito definitivo mide la eficacia de la ejecución; comparar el definitivo con el inicial mide cuánto se ha desviado el presupuesto respecto de lo aprobado por el Pleno.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> el presupuesto de una obra y el presupuesto final tras los cambios.</li>
<li><b>Real:</b> aplicación 342/22100 con crédito inicial de 60.000 € que, tras una transferencia de 8.000 €, queda con un crédito definitivo de 68.000 €.</li>
<li><b>Caso límite:</b> si al 1 de enero siguiente no hay presupuesto nuevo, la prórroga del <b>art. 169.6 TRLHL</b> arrastra los 60.000 € iniciales, no los 68.000 € definitivos.</li>
</ul>`,noej:`<ul>
<li><b>No es crédito inicial</b> el consignado en el proyecto aprobado inicialmente: la definición exige presupuesto <b>definitivamente aprobado</b>.</li>
</ul>`,conex:`<ul>
<li><b>Art. 169.6 TRLHL:</b> la prórroga opera con los <b>créditos iniciales</b>.</li>
<li><b>Arts. 177 a 182 TRLHL:</b> modificaciones que transforman el inicial en definitivo.</li>
<li><b>Art. 175 TRLHL:</b> anulación de los créditos no afectados a obligaciones reconocidas.</li>
</ul>`,trampas:`<ul>
<li>El crédito inicial se mide sobre el presupuesto <b>definitivamente aprobado</b>, no sobre la aprobación inicial.</li>
<li>El definitivo puede ser <b>mayor o menor</b> que el inicial: las modificaciones también minoran.</li>

</ul>`,ancla:`<p><b>"Inicial = con lo que empiezo. Definitivo = en lo que he quedado."</b> Y la prórroga viaja siempre con el <b>inicial</b>.</p>`,vis:`<svg viewBox=\"0 0 640 125\" role=\"img\" aria-label=\"Crédito inicial y crédito definitivo\">\n<defs><marker id=\"c2\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\"><path d=\"M0 0 L9 4.5 L0 9 z\" fill=\"var(--acc)\"/></marker></defs>\n<rect x=\"40\" y=\"35\" width=\"200\" height=\"52\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/>\n<text x=\"140\" y=\"58\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">Crédito inicial</text>\n<text x=\"140\" y=\"76\" text-anchor=\"middle\" font-size=\"9.8\" fill=\"currentColor\">presupuesto definitivamente aprobado</text>\n<path d=\"M244 61 L 300 61\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#c2)\"/>\n<text x=\"272\" y=\"51\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--ink2)\">± modificaciones</text>\n<rect x=\"304\" y=\"35\" width=\"200\" height=\"52\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/>\n<text x=\"404\" y=\"58\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">Crédito definitivo</text>\n<text x=\"404\" y=\"76\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">vigente en cada momento</text>\n<text x=\"320\" y=\"112\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--exc)\">La prórroga del art. 169.6 TRLHL arrastra solo los créditos INICIALES</text>\n</svg>`},
{n:9,t:"Clasificación económica del ingreso",ubic:"Orden EHA/3565/2008, de 3 de diciembre (BOE 24-12-2008) ▸ parte dispositiva ▸ desarrollo del art. 167.1 del TRLHL",idea:"Los ingresos se clasifican solo por economía, en nueve capítulos del anexo IV.",literal:`<p>1. Las previsiones incluidas en los estados de ingresos del presupuesto de la entidad local se clasificarán separando las operaciones corrientes, las de capital y las financieras, de acuerdo con la estructura que por capítulos, artículos, conceptos y subconceptos se detalla en el anexo IV de la presente Orden.</p><p>2. La estructura por conceptos y subconceptos es abierta, por lo que podrán crearse los que se consideren necesarios cuando no figuren en la estructura que esta Orden establece.</p>`,dis:`<ul>
<li><b>9.1:</b> las previsiones de ingresos se clasifican separando operaciones <b>corrientes, de capital y financieras</b>, según la estructura por <b>capítulos, artículos, conceptos y subconceptos</b> del <b>anexo IV</b>.</li>
<li><b>9.2:</b> la estructura por <b>conceptos y subconceptos es abierta</b>.</li>
</ul>
<table><thead><tr><th>Cap.</th><th>Denominación (anexo IV · ingresos)</th><th>Tipo</th></tr></thead><tbody>
<tr><td><b>1</b></td><td>Impuestos directos</td><td rowspan="5">Operaciones corrientes</td></tr>
<tr><td><b>2</b></td><td>Impuestos indirectos</td></tr>
<tr><td><b>3</b></td><td>Tasas, precios públicos y otros ingresos</td></tr>
<tr><td><b>4</b></td><td>Transferencias corrientes</td></tr>
<tr><td><b>5</b></td><td>Ingresos patrimoniales</td></tr>
<tr><td><b>6</b></td><td>Enajenación de inversiones reales</td><td rowspan="2">Operaciones de capital</td></tr>
<tr><td><b>7</b></td><td>Transferencias de capital</td></tr>
<tr><td><b>8</b></td><td>Activos financieros</td><td rowspan="2">Operaciones financieras</td></tr>
<tr><td><b>9</b></td><td>Pasivos financieros</td></tr>
</tbody></table>
<div class="box warn"><span class="lbl">Detalle que se pregunta</span>En <b>ingresos no hay clasificación por programas</b>: solo económica (y, en su caso, orgánica). Tiene lógica: el dinero que entra no tiene finalidad propia, salvo que sea un ingreso afectado (art. 165.2 TRLHL).</div>`,llano:`<p>Los ingresos solo se clasifican de una forma: por su naturaleza. Los cinco primeros capítulos son ingresos corrientes —impuestos, tasas, transferencias, rentas—, el 6 y el 7 son de capital y el 8 y el 9, financieros. Fíjate en que el capítulo 5 aquí no es el fondo de contingencia, sino ingresos patrimoniales.</p>`,porque:`<p>Preguntar "para qué" a un ingreso carece de sentido en un sistema regido por el principio de <b>no afectación</b> (art. 165.2 TRLHL): todos los recursos financian todas las obligaciones. Solo los ingresos afectados escapan a esa regla, y su seguimiento se hace por proyectos de gasto con financiación afectada, no por una clasificación por programas.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> clasificar tus ingresos por origen —nómina, alquiler, venta— sin preguntarte "para qué" sirven: sirven para todo.</li>
<li><b>Real:</b> IBI → capítulo 1; ICIO → capítulo 2; tasa de basura → capítulo 3; participación en tributos del Estado → capítulo 4; alquiler de un local municipal → capítulo 5; venta de una parcela → capítulo 6; subvención de la Junta para una obra → capítulo 7; préstamo → capítulo 9.</li>
<li><b>Caso límite:</b> una subvención finalista es capítulo 4 o 7 según sea corriente o de capital, y además genera un proyecto con financiación afectada cuya incorporación es obligatoria (art. 182.3 TRLHL).</li>
</ul>`,noej:`<ul>
<li><b>No existe</b> clasificación por programas en el estado de ingresos.</li>
<li><b>No es lo mismo</b> el capítulo 5 de gastos (Fondo de Contingencia) que el capítulo 5 de ingresos (Ingresos patrimoniales).</li>
</ul>`,conex:`<ul>
<li><b>Art. 167.3 TRLHL:</b> la clasificación por programas se predica de los <b>estados de gastos</b>.</li>
<li><b>Art. 165.1.b) y 165.2 TRLHL:</b> estados de ingresos y principio de no afectación.</li>
<li><b>Arts. 2 y ss. TRLHL:</b> enumeración de los recursos de las haciendas locales.</li>
</ul>`,trampas:`<ul>
<li>En ingresos, <b>cinco</b> capítulos corrientes (1 a 5), frente a cuatro en gastos.</li>
<li>El capítulo <b>5</b> cambia de significado según sea gasto o ingreso.</li>
<li>Los capítulos <b>6 y 7</b> son de capital y los <b>8 y 9</b> financieros, igual que en gastos.</li>
</ul>`,ancla:`<p><b>Ingresos: 1-5 corriente · 6-7 capital · 8-9 financiero.</b> Un capítulo corriente más que en gastos, porque no hay fondo de contingencia.<br>Truco para el 5: <b>gasto = colchón; ingreso = patrimonio</b>.</p>`,vis:`<svg viewBox=\"0 0 640 160\" role=\"img\" aria-label=\"Capítulos de ingresos y comparación con gastos\">\n<text x=\"320\" y=\"18\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--ink2)\">Estado de ingresos: solo clasificación económica</text>\n<g font-size=\"10\" text-anchor=\"middle\" fill=\"currentColor\">\n<rect x=\"20\" y=\"30\" width=\"290\" height=\"66\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"165\" y=\"52\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">Corrientes · 1 a 5</text><text x=\"165\" y=\"70\">impuestos directos e indirectos · tasas</text><text x=\"165\" y=\"86\">transferencias corrientes · patrimoniales</text>\n<rect x=\"325\" y=\"30\" width=\"145\" height=\"66\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"397\" y=\"52\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">Capital · 6 y 7</text><text x=\"397\" y=\"70\">enajenación de</text><text x=\"397\" y=\"86\" font-size=\"9.1\">inversiones · transferencias</text>\n<rect x=\"485\" y=\"30\" width=\"135\" height=\"66\" rx=\"8\" fill=\"var(--panel)\" stroke=\"var(--line)\"/><text x=\"552\" y=\"52\" font-size=\"11\" font-weight=\"700\" fill=\"currentColor\">Financieras</text><text x=\"552\" y=\"70\">8 activos</text><text x=\"552\" y=\"86\">9 pasivos</text>\n</g>\n<rect x=\"120\" y=\"112\" width=\"400\" height=\"36\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/>\n<text x=\"320\" y=\"134\" text-anchor=\"middle\" font-size=\"7.9\" fill=\"var(--warn)\">Cuidado: capítulo 5 en gastos = Fondo de Contingencia; en ingresos = Ingresos patrimoniales</text>\n</svg>`},
{n:"Anexos",t:"Anexos I, II, III y IV · los códigos",ubic:"Orden EHA/3565/2008, de 3 de diciembre (BOE 24-12-2008) ▸ parte dispositiva ▸ desarrollo del art. 167.1 del TRLHL",idea:"Cuatro anexos: programas, equivalencias con el sistema antiguo, gastos e ingresos.",literal:`<p class="small"><i>Compilación de <b>citas literales</b> (entre comillas angulares) de los anexos y de la disposición adicional única de la Orden. Los encabezados que las enlazan son orientativos, no texto legal.</i></p><p><b>Anexo I.</b> Códigos de la clasificación por programas de los gastos del presupuesto de las entidades locales y sus organismos autónomos: «La presente codificación tiene carácter cerrado y obligatorio para todas las entidades locales en sus niveles de áreas de gasto, políticas de gasto, grupos de programas y programas que están especificados en la misma. Por lo que se refiere a programas o subprogramas, se considera abierto, en tanto no se recojan en este anexo.»</p>
<p>Áreas de gasto: «Área de Gasto 1. Servicios Públicos Básicos», «Área de Gasto 2. Actuaciones de protección y promoción social», «Área de Gasto 3. Producción de bienes públicos de carácter preferente», «Área de Gasto 4. Actuaciones de carácter económico», «Área de Gasto 9. Actuaciones de carácter general», «Área de Gasto 0. Deuda Pública».</p>
<p><b>Disposición adicional única. Equivalencias de la clasificación por programas.</b> «Las áreas de gasto, políticas de gasto y grupos de programas se corresponden, respectivamente, con los grupos de funciones, funciones y subfunciones, de acuerdo con las denominaciones utilizadas en los presupuestos de las Entidades Locales anteriores al ejercicio 2010, conforme a la tabla de equivalencias recogida en el anexo II de la presente Orden.»</p>
<p><b>Anexo III.</b> Clasificación económica del gasto. Denominación literal de cada capítulo: 1 «Gastos de personal» · 2 «Gastos corrientes en bienes y servicios» · 3 «Gastos financieros» · 4 «Transferencias corrientes» · 5 «Fondo de Contingencia y Otros Imprevistos» · 6 «Inversiones reales» · 7 «Transferencias de capital» · 8 «Activos financieros» · 9 «Pasivos financieros».</p>
<p><b>Anexo IV.</b> Clasificación económica del ingreso. Denominación literal de cada capítulo: 1 «Impuestos directos» · 2 «Impuestos indirectos» · 3 «Tasas, precios públicos y otros ingresos» · 4 «Transferencias corrientes» · 5 «Ingresos patrimoniales» · 6 «Enajenación de inversiones reales» · 7 «Transferencias de capital» · 8 «Activos financieros» · 9 «Pasivos financieros».</p>`,dis:`<p><b>Las 23 políticas de gasto del anexo I</b>, agrupadas por área:</p>
<table><thead><tr><th>Área</th><th>Políticas de gasto</th></tr></thead><tbody>
<tr><td><b>1</b> Servicios públicos básicos</td><td>13 Seguridad y movilidad ciudadana · 15 Vivienda y urbanismo · 16 Bienestar comunitario · 17 Medio ambiente</td></tr>
<tr><td><b>2</b> Protección y promoción social</td><td>21 Pensiones · 22 Otras prestaciones económicas a favor de empleados · 23 Servicios sociales y promoción social · 24 Fomento del empleo</td></tr>
<tr><td><b>3</b> Bienes públicos preferentes</td><td>31 Sanidad · 32 Educación · 33 Cultura · 34 Deporte</td></tr>
<tr><td><b>4</b> Actuaciones de carácter económico</td><td>41 Agricultura, ganadería y pesca · 42 Industria y energía · 43 Comercio, turismo y pymes · 44 Transporte público · 45 Infraestructuras · 46 I+D+i · 49 Otras actuaciones de carácter económico</td></tr>
<tr><td><b>9</b> Actuaciones de carácter general</td><td>91 Órganos de gobierno · 92 Servicios de carácter general · 93 Administración financiera y tributaria · 94 Transferencias a otras Administraciones Públicas</td></tr>
<tr><td><b>0</b> Deuda pública</td><td>01 Deuda pública</td></tr>
</tbody></table>`,llano:`<p>Los anexos son la chuleta oficial: el I dice cómo se numeran las finalidades del gasto, el II traduce los códigos antiguos a los nuevos, el III lista los capítulos de gasto y el IV los de ingreso. En un examen no se pide memorizarlos enteros, pero sí las áreas, las políticas más reconocibles y los nueve capítulos de cada lado.</p>`,porque:`<p>El <b>anexo II</b> merece una nota: existe porque hasta 2010 el presupuesto local se clasificaba por <b>grupos de funciones, funciones y subfunciones</b>. Esa terminología antigua sigue apareciendo en el art. 179.2 del TRLHL —que no se ha actualizado— y la tabla de equivalencias es lo que permite entender hoy aquel precepto.</p>`,ej:`<ul>
<li><b>Real:</b> el gasto de la biblioteca municipal se imputa al área <b>3</b> ▸ política <b>33</b> (Cultura) ▸ grupo de programas <b>332</b>.</li>
<li><b>Real:</b> las retribuciones del alcalde y los concejales van al área <b>9</b> ▸ política <b>91</b> (Órganos de gobierno) ▸ capítulo económico <b>1</b>.</li>
<li><b>Caso límite:</b> cuando el art. 179.2 TRLHL exige acuerdo del Pleno para transferencias "entre distintos grupos de función", hoy se entiende referido a las <b>áreas de gasto</b>, por la equivalencia del anexo II.</li>
</ul>`,noej:`<ul>
<li><b>No hay</b> políticas de gasto con código 10, 20 o 30: las políticas empiezan en 13, 21, 31, 41, 91 y 01.</li>
<li><b>No coinciden</b> los códigos de gasto y de ingreso pese a compartir numeración de capítulos.</li>
</ul>`,conex:`<ul>
<li><b>Art. 179.2 TRLHL:</b> "grupos de función", hoy leído como áreas de gasto gracias al anexo II.</li>
<li><b>Art. 167.3.a) TRLHL:</b> áreas y políticas se ajustan a las del Estado.</li>
<li><b>Art. 26.1 LBRL</b> <i>(norma no incluida en la biblioteca)</i>: servicios mínimos obligatorios, citados por el anexo I para delimitar el área 1.</li>
</ul>`,trampas:`<ul>
<li>El <b>anexo II</b> es la tabla de equivalencias, no un listado de códigos nuevos.</li>
<li>Las áreas de gasto no son correlativas: <b>0, 1, 2, 3, 4 y 9</b>.</li>
<li>La codificación es <b>cerrada</b> hasta programas y <b>abierta</b> en programas y subprogramas.</li>
</ul>`,ancla:`<p><b>Anexos: I programas · II equivalencias · III gastos · IV ingresos.</b><br>Truco: <b>"uno para el para qué, dos para el ayer, tres para lo que sale, cuatro para lo que entra"</b>.</p>`,vis:`<svg viewBox="0 0 640 175" role="img" aria-label="Contenido de los anexos de la Orden">
<g font-size="10" text-anchor="middle" fill="currentColor">
<rect x="15" y="25" width="145" height="70" rx="8" fill="var(--acc-soft)" stroke="var(--acc)"/><text x="87" y="48" font-size="11" font-weight="700" fill="var(--acc)">ANEXO I</text><text x="87" y="68">clasificación</text><text x="87" y="84">por programas</text>
<rect x="172" y="25" width="145" height="70" rx="8" fill="var(--warn-bg)" stroke="var(--warn)"/><text x="244" y="48" font-size="11" font-weight="700" fill="var(--warn)">ANEXO II</text><text x="244" y="68">equivalencias con</text><text x="244" y="84">grupos de función</text>
<rect x="329" y="25" width="145" height="70" rx="8" fill="var(--exc-bg)" stroke="var(--exc)"/><text x="401" y="48" font-size="11" font-weight="700" fill="var(--exc)">ANEXO III</text><text x="401" y="68">económica</text><text x="401" y="84">de gastos</text>
<rect x="486" y="25" width="139" height="70" rx="8" fill="var(--ej-bg)" stroke="var(--ej)"/><text x="555" y="48" font-size="11" font-weight="700" fill="var(--ej)">ANEXO IV</text><text x="555" y="68">económica</text><text x="555" y="84">de ingresos</text>
</g>
<text x="320" y="122" text-anchor="middle" font-size="11" fill="currentColor">Áreas de gasto: 0 · 1 · 2 · 3 · 4 · 9 — no son correlativas</text>
<text x="320" y="145" text-anchor="middle" font-size="10" fill="var(--ink2)">Cerrado hasta programas · abierto en programas y subprogramas</text>
<text x="320" y="164" text-anchor="middle" font-size="10" fill="var(--warn)">El anexo II explica los "grupos de función" que aún cita el art. 179.2 TRLHL</text>
</svg>`}];
</script>
<script>
const PLAZOS=[["6 áreas de gasto", "Primer nivel de la clasificación por programas: 0, 1, 2, 3, 4 y 9", "Entidad", "Anexo I · Orden EHA/3565/2008", "Cerrado y obligatorio"], ["23 políticas de gasto", "Segundo nivel, de dos dígitos", "Entidad", "Anexo I · Orden EHA/3565/2008", "Cerrado y obligatorio"], ["Grupo de programas", "Detalle mínimo general del crédito (3 dígitos)", "Entidad", "Art. 4.2 · Orden EHA/3565/2008", "A nivel de programa en los casos del anexo I"], ["9 capítulos de gasto", "1 a 4 corrientes · 5 fondo de contingencia · 6 y 7 capital · 8 y 9 financieros", "Entidad", "Anexo III · Orden EHA/3565/2008", "Capítulo y artículo, cerrados"], ["9 capítulos de ingreso", "1 a 5 corrientes · 6 y 7 capital · 8 y 9 financieros", "Entidad", "Anexo IV · Orden EHA/3565/2008", "Sin clasificación por programas"], ["Aplicación presupuestaria", "Grupo de programa o programa + concepto o subconcepto", "Entidad", "Art. 6 · Orden EHA/3565/2008", "Coincide con el art. 167.4 TRLHL"], ["Como mínimo", "Nivel del registro contable de créditos y ejecución", "Intervención", "Art. 7 · Orden EHA/3565/2008", "Cabe mayor desglose"], ["Crédito inicial", "El del presupuesto definitivamente aprobado", "Entidad", "Art. 8.1 · Orden EHA/3565/2008", "Es el que se prorroga (art. 169.6 TRLHL)"], ["Crédito definitivo", "Inicial ± modificaciones presupuestarias", "Entidad", "Art. 8.2 · Orden EHA/3565/2008", "Vigente en cada momento"], ["Ejercicio 2010", "Desde cuándo se aplica esta estructura", "Entidad", "Disp. final tercera y transitoria única", "Antes regía la Orden de 20-09-1989"]];
const FLASH=[["¿Qué norma fija la estructura de los presupuestos locales y en desarrollo de qué precepto?", "La <b>Orden EHA/3565/2008</b>, de 3 de diciembre, en desarrollo del <b>art. 167.1 del TRLHL</b> (RDLeg 2/2004)."], ["¿A quién se aplica la Orden EHA/3565/2008?", "A las <b>entidades locales</b> y a sus <b>organismos autónomos</b> (art. 1.2)."], ["¿Cuáles son los tres criterios de clasificación del estado de gastos?", "Por <b>programas</b>, por <b>categorías económicas</b> y, opcionalmente, por <b>unidades orgánicas</b> (art. 3)."], ["Niveles de la clasificación por programas", "<b>Área de gasto ▸ política de gasto ▸ grupo de programas ▸ programa</b>, desarrollable en subprogramas (art. 4.1)."], ["¿Cuál es el detalle mínimo con el que se presenta el crédito?", "El nivel de <b>grupo de programas</b>, salvo los casos del anexo I que exigen nivel de programa (art. 4.2)."], ["¿Hasta dónde es cerrada la clasificación por programas?", "Es <b>cerrada y obligatoria</b> en áreas, políticas, grupos de programas y programas especificados; <b>abierta</b> a partir de programas y subprogramas (art. 4.3)."], ["Enumera las seis áreas de gasto", "<b>0</b> Deuda Pública · <b>1</b> Servicios Públicos Básicos · <b>2</b> Actuaciones de protección y promoción social · <b>3</b> Producción de bienes públicos de carácter preferente · <b>4</b> Actuaciones de carácter económico · <b>9</b> Actuaciones de carácter general."], ["¿Qué ocurre si la entidad asume competencias por delegación?", "Debe desarrollar los grupos de programa para que haya <b>exacta correspondencia</b> entre cada servicio asumido y un único programa o subprograma (art. 4.4)."], ["Niveles de la clasificación económica del gasto", "<b>Capítulo ▸ artículo ▸ concepto ▸ subconcepto</b>, y estos en <b>partidas</b> (art. 5.2 y 5.5)."], ["Los nueve capítulos de gasto", "1 Personal · 2 Bienes corrientes y servicios · 3 Financieros · 4 Transferencias corrientes · 5 Fondo de Contingencia · 6 Inversiones reales · 7 Transferencias de capital · 8 Activos financieros · 9 Pasivos financieros."], ["Los nueve capítulos de ingreso", "1 Impuestos directos · 2 Indirectos · 3 Tasas y precios públicos · 4 Transferencias corrientes · 5 Ingresos patrimoniales · 6 Enajenación de inversiones reales · 7 Transferencias de capital · 8 Activos financieros · 9 Pasivos financieros."], ["¿Qué capítulos son corrientes en gastos y en ingresos?", "En <b>gastos</b>, del 1 al 4. En <b>ingresos</b>, del 1 al 5."], ["¿Cómo se define la aplicación presupuestaria?", "Por la conjunción, <b>al menos</b>, de las clasificaciones por programas (grupo de programa o programa) y económica (concepto o subconcepto); más la orgánica si se utiliza (art. 6)."], ["¿A qué nivel se registra contablemente el gasto?", "<b>Como mínimo</b> sobre la aplicación presupuestaria; cabe mayor desglose (art. 7)."], ["Diferencia entre crédito inicial y definitivo", "El <b>inicial</b> es el asignado en el presupuesto definitivamente aprobado; el <b>definitivo</b> es el inicial aumentado o disminuido por modificaciones (art. 8)."], ["¿Se clasifican los ingresos por programas?", "<b>No</b>: solo por categorías económicas, conforme al anexo IV (art. 9)."], ["¿Qué contiene el anexo II de la Orden?", "La <b>tabla de equivalencias</b> entre áreas, políticas y grupos de programas y los antiguos grupos de funciones, funciones y subfunciones anteriores a 2010 (disposición adicional única)."], ["¿Desde qué ejercicio se aplica esta estructura?", "Desde el ejercicio <b>2010</b>; antes regía la Orden del Ministerio de Economía y Hacienda de 20 de septiembre de 1989 (disposiciones transitoria, derogatoria y final tercera)."], ["¿Qué capítulo cambia de significado entre gastos e ingresos?", "El <b>5</b>: en gastos es Fondo de Contingencia; en ingresos, Ingresos patrimoniales."], ["¿Qué pasó con el art. 10 de la Orden?", "Está <b>derogado</b>. Regulaba las clasificaciones aplicables a las entidades locales de menos de 5.000 habitantes."]];
const TEST=[{"a": 1, "q": "La Orden EHA/3565/2008 desarrolla:", "o": [["el artículo 167.1 del TRLHL, sobre estructura de los presupuestos", 1, "Correcto: art. 1.2 de la Orden."], ["el artículo 165 del TRLHL, sobre contenido del presupuesto", 0, "El art. 165 regula el contenido; la estructura es el 167."], ["el artículo 203 del TRLHL, sobre contabilidad", 0, "Ese precepto habilita las Instrucciones de contabilidad, no esta Orden."], ["la Ley 47/2003, General Presupuestaria", 0, "No es su norma habilitante."]]}, {"a": 3, "q": "¿Cuál de los criterios de clasificación del estado de gastos es opcional?", "o": [["por unidades orgánicas", 1, "Correcto: art. 3.c) de la Orden y art. 167.4 TRLHL."], ["por programas", 0, "Es obligatoria."], ["por categorías económicas", 0, "Es obligatoria."], ["ninguno: los tres son obligatorios", 0, "La orgánica es potestativa."]]}, {"a": 4, "q": "El detalle de los créditos se presentará, con carácter general, como mínimo en el nivel de:", "o": [["grupos de programas", 1, "Correcto: art. 4.2 de la Orden; a nivel de programa solo en los casos del anexo I."], ["áreas de gasto", 0, "Sería un detalle insuficiente."], ["programas en todo caso", 0, "Solo en los casos que especifica el anexo I."], ["subprogramas", 0, "Es un nivel abierto y potestativo."]]}, {"a": 4, "q": "Completa: «La estructura que se especifica en el anexo I se debe considerar ______ y obligatoria para todas las entidades locales».", "gap": "cerrada", "fb": "<b>Cerrada</b> y obligatoria, si bien es abierta a partir de programas y subprogramas (art. 4.3)."}, {"a": 4, "q": "¿Cuál de estas NO es un área de gasto de la clasificación por programas?", "o": [["Área de gasto 5. Servicios financieros", 1, "Correcto: no existe. Las áreas son 0, 1, 2, 3, 4 y 9."], ["Área de gasto 0. Deuda Pública", 0, "Sí existe."], ["Área de gasto 2. Actuaciones de protección y promoción social", 0, "Sí existe."], ["Área de gasto 9. Actuaciones de carácter general", 0, "Sí existe."]]}, {"a": 5, "q": "El capítulo 5 de la clasificación económica del gasto corresponde a:", "o": [["Fondo de Contingencia y Otros Imprevistos", 1, "Correcto: anexo III. En ingresos, el capítulo 5 son los Ingresos patrimoniales."], ["Ingresos patrimoniales", 0, "Ese es el capítulo 5 del estado de <b>ingresos</b>."], ["Inversiones reales", 0, "Ese es el capítulo 6."], ["Transferencias corrientes", 0, "Ese es el capítulo 4."]]}, {"a": 5, "q": "Los capítulos 8 y 9 del estado de gastos son operaciones de capital.", "vf": true, "ok": false, "fb": "<b>Falso.</b> Son operaciones <b>financieras</b>: activos financieros (8) y pasivos financieros (9). De capital son el 6 y el 7."}, {"a": 6, "q": "La aplicación presupuestaria viene definida, al menos, por la conjunción de:", "o": [["la clasificación por programas y la económica", 1, "Correcto: art. 6 de la Orden y art. 167.4 TRLHL."], ["la clasificación orgánica y la económica", 0, "La orgánica solo se integra si la entidad opta por usarla."], ["el capítulo y el artículo económicos", 0, "Faltaría la clasificación por programas."], ["el área de gasto y el capítulo", 0, "Los niveles mínimos son grupo de programa o programa y concepto o subconcepto."]]}, {"a": 7, "q": "El registro contable de los créditos y de su ejecución se realiza:", "o": [["como mínimo sobre la aplicación presupuestaria, sin perjuicio de un mayor desglose", 1, "Correcto: art. 7 de la Orden."], ["únicamente a nivel de capítulo", 0, "Sería un nivel inferior al exigido."], ["a nivel de vinculación jurídica", 0, "El nivel de vinculación sirve para el control fiscal (art. 167.4 TRLHL), no para el registro contable."], ["a nivel de área de gasto", 0, "Insuficiente."]]}, {"a": 8, "q": "Completa: «Se entenderá por crédito inicial el asignado a cada aplicación presupuestaria en el presupuesto de la entidad ______ aprobado».", "gap": "definitivamente", "fb": "<b>Definitivamente</b> aprobado (art. 8.1). Es el crédito que se prorroga conforme al art. 169.6 TRLHL."}, {"a": 9, "q": "Las previsiones del estado de ingresos se clasifican:", "o": [["solo por categorías económicas, conforme al anexo IV", 1, "Correcto: art. 9.1. No hay clasificación por programas en ingresos."], ["por programas y por categorías económicas", 0, "La clasificación por programas se predica de los estados de gastos (art. 167.3 TRLHL)."], ["por áreas de ingreso", 0, "No existe esa categoría."], ["por unidades orgánicas obligatoriamente", 0, "La orgánica es siempre potestativa."]]}, {"a": 9, "q": "El capítulo 3 del estado de ingresos comprende:", "o": [["tasas, precios públicos y otros ingresos", 1, "Correcto: anexo IV."], ["gastos financieros", 0, "Ese es el capítulo 3 del estado de <b>gastos</b>."], ["impuestos indirectos", 0, "Ese es el capítulo 2."], ["transferencias corrientes", 0, "Ese es el capítulo 4."]]}, {"a": "Anexos", "q": "El anexo II de la Orden contiene:", "o": [["la tabla de equivalencias con los antiguos grupos de funciones, funciones y subfunciones", 1, "Correcto: disposición adicional única. Es la clave para leer hoy el art. 179.2 TRLHL."], ["los códigos de la clasificación económica del gasto", 0, "Ese es el anexo III."], ["los códigos de la clasificación por programas", 0, "Ese es el anexo I."], ["los códigos de ingresos", 0, "Ese es el anexo IV."]]}, {"a": 4, "q": "Una entidad local puede crear un área de gasto nueva si sus competencias no encajan en las existentes.", "vf": true, "ok": false, "fb": "<b>Falso.</b> La estructura es <b>cerrada y obligatoria</b> en áreas, políticas y grupos de programas; solo es abierta a partir de programas y subprogramas (art. 4.3)."}, {"a": 5, "q": "¿Qué niveles de la clasificación económica del gasto son abiertos?", "o": [["conceptos, subconceptos y partidas", 1, "Correcto: arts. 5.4 y 5.5 de la Orden. Capítulo y artículo son cerrados y deben coincidir con los del Estado (art. 167.3.c TRLHL)."], ["capítulos y artículos", 0, "Son precisamente los cerrados."], ["todos", 0, "No: los dos primeros niveles son cerrados."], ["ninguno", 0, "Los conceptos y subconceptos sí son abiertos."]]}, {"a": 2, "q": "Las entidades locales pueden clasificar gastos e ingresos atendiendo a su propia estructura:", "o": [["sí, de acuerdo con sus reglamentos o decretos de organización", 1, "Correcto: art. 2.2 de la Orden, en línea con el art. 167.2 TRLHL."], ["no, la estructura es única e inalterable", 0, "La clasificación orgánica es potestativa."], ["solo los municipios de más de 50.000 habitantes", 0, "No hay umbral de población."], ["solo previa autorización del Ministerio", 0, "No se exige autorización."]]}, {"a": 8, "q": "El crédito definitivo puede ser inferior al inicial.", "vf": true, "ok": true, "fb": "<b>Verdadero</b> (art. 8.2): el inicial se ve <b>aumentado o disminuido</b> por las modificaciones, y hay modificaciones que minoran, como las bajas por transferencia."}, {"a": 1, "q": "La Orden EHA/3565/2008 se aplica también a las sociedades mercantiles locales.", "vf": true, "ok": false, "fb": "<b>Falso.</b> Su ámbito son las entidades locales y sus <b>organismos autónomos</b> (art. 1.2). Las sociedades se rigen por el Plan General de Contabilidad de la empresa española (art. 200.2 TRLHL)."}, {"a": 4, "q": "Completa: «Las áreas de gasto, políticas de gasto y grupos de programas se corresponden, respectivamente, con los grupos de funciones, funciones y ______».", "gap": "subfunciones", "fb": "<b>Subfunciones</b> (disposición adicional única). Esta equivalencia explica la terminología del art. 179.2 TRLHL."}, {"a": 9, "q": "¿Cuántos capítulos de operaciones corrientes hay en el estado de ingresos?", "o": [["cinco: del 1 al 5", 1, "Correcto: impuestos directos, indirectos, tasas, transferencias corrientes e ingresos patrimoniales."], ["cuatro: del 1 al 4", 0, "Esa es la cifra en el estado de <b>gastos</b>."], ["seis: del 1 al 6", 0, "El 6 es enajenación de inversiones reales, de capital."], ["tres: del 1 al 3", 0, "Insuficiente."]]}];
const CASOS=[{"t": "Caso 1 · Codifica el gasto", "e": "Clasifica estos cuatro gastos indicando área, política y capítulo económico: <b>(1)</b> nóminas de la policía local; <b>(2)</b> electricidad de la biblioteca municipal; <b>(3)</b> construcción de un carril bici; <b>(4)</b> amortización del principal de un préstamo. <b>Indica también qué norma aplicas en cada paso.</b>", "s": "<p><b>(1) Nóminas de la policía local.</b> Área <b>1</b> (Servicios Públicos Básicos) ▸ política <b>13</b> (Seguridad y movilidad ciudadana) ▸ capítulo <b>1</b> (Gastos de personal). Normas: anexo I y anexo III de la <b>Orden EHA/3565/2008</b>.</p><p><b>(2) Electricidad de la biblioteca.</b> Área <b>3</b> ▸ política <b>33</b> (Cultura) ▸ capítulo <b>2</b> (Gastos corrientes en bienes y servicios).</p><p><b>(3) Carril bici.</b> Área <b>1</b> ▸ política <b>13</b> (movilidad) o área <b>4</b> ▸ política <b>45</b> (Infraestructuras), según cómo lo defina la entidad ▸ capítulo <b>6</b> (Inversiones reales). El anexo I permite acudir a criterios cualitativos y cuantitativos cuando un gasto encaja en más de una política.</p><p><b>(4) Amortización del principal.</b> Área <b>0</b> (Deuda Pública) ▸ política <b>01</b> ▸ capítulo <b>9</b> (Pasivos financieros). Los <b>intereses</b>, en cambio, van al capítulo <b>3</b>.</p><p><b>Norma que ordena todo:</b> art. 167 del <b>RDLeg 2/2004 (TRLHL)</b>, desarrollado por la <b>Orden EHA/3565/2008</b>. La aplicación presupuestaria resulta del cruce de ambas clasificaciones (art. 6 de la Orden y art. 167.4 TRLHL).</p>"}, {"t": "Caso 2 · De la estructura a la modificación", "e": "La aplicación <b>342/22100</b> (instalaciones deportivas · energía eléctrica) tiene un crédito inicial de 60.000 €. En abril se aprueba una transferencia de 8.000 € desde <b>338/22609</b> (fiestas populares · actividades culturales y deportivas) y en octubre una generación de crédito de 5.000 € por una aportación privada. <b>Analiza la operación con las dos normas.</b>", "s": "<p><b>1) Lectura de los códigos</b> (Orden EHA/3565/2008): <b>342</b> es grupo de programas del área 3 ▸ política 34 (Deporte); <b>338</b> pertenece a la política 33 (Cultura); <b>221</b> y <b>226</b> son artículos del capítulo 2.</p><p><b>2) La transferencia</b> (arts. 179 y 180 <b>TRLHL</b>): cruza políticas de gasto dentro de la misma área. La competencia depende de lo que fijen las <b>bases de ejecución</b>; el art. 179.2 reserva al Pleno las transferencias entre distintos «grupos de función», expresión que hoy se lee como <b>áreas de gasto</b> gracias al anexo II de la Orden.</p><p><b>3) La generación de crédito</b> (art. 181.a <b>TRLHL</b>): aportación de una persona física o jurídica para cofinanciar un gasto propio de los fines de la entidad; es ingreso <b>no tributario</b>, luego procede la generación. Su disponibilidad queda condicionada a documentos fehacientes del compromiso firme (art. 173.6.a TRLHL).</p><p><b>4) Resultado</b> (art. 8 de la Orden): crédito inicial 60.000 € · crédito definitivo 73.000 €. Si el 1 de enero siguiente no hubiera presupuesto aprobado, la prórroga del art. 169.6 TRLHL arrastraría solo los <b>60.000 € iniciales</b>.</p>"}, {"t": "Caso 3 · Cuadrar el presupuesto por capítulos", "e": "Un ayuntamiento presenta este resumen por capítulos de ingresos: 1) 6,2 M€ · 2) 0,4 M€ · 3) 2,1 M€ · 4) 4,8 M€ · 5) 0,3 M€ · 6) 0,5 M€ · 7) 1,2 M€ · 9) 1,0 M€. Y de gastos: 1) 7,5 M€ · 2) 4,9 M€ · 3) 0,2 M€ · 4) 0,9 M€ · 6) 2,4 M€ · 9) 0,6 M€. <b>Comprueba la nivelación, calcula el ahorro bruto y di qué normas aplicas.</b>", "s": "<p><b>1) Totales.</b> Ingresos: 6,2 + 0,4 + 2,1 + 4,8 + 0,3 + 0,5 + 1,2 + 1,0 = <b>16,5 M€</b>. Gastos: 7,5 + 4,9 + 0,2 + 0,9 + 2,4 + 0,6 = <b>16,5 M€</b>. Cumple el <b>art. 165.4 TRLHL</b>: se aprueba <b>sin déficit inicial</b>.</p><p><b>2) Operaciones corrientes.</b> Ingresos corrientes (capítulos 1 a 5): 6,2 + 0,4 + 2,1 + 4,8 + 0,3 = <b>13,8 M€</b>. Gastos corrientes (capítulos 1 a 4): 7,5 + 4,9 + 0,2 + 0,9 = <b>13,5 M€</b>. <b>Ahorro bruto: 0,3 M€.</b> La delimitación de capítulos procede de los anexos III y IV de la <b>Orden EHA/3565/2008</b>.</p><p><b>3) Operaciones de capital y financieras.</b> Ingresos de capital (6 y 7): 1,7 M€; gastos de capital (6 y 7): 2,4 M€. El desfase de 0,7 M€ se cubre con el capítulo <b>9 de ingresos</b> (pasivos financieros, esto es, endeudamiento) por 1,0 M€, del que 0,6 M€ se destinan a amortizar (capítulo 9 de gastos).</p><p><b>4) Normas aplicadas.</b> Estructura y capítulos: <b>Orden EHA/3565/2008</b> (anexos III y IV). Nivelación sin déficit inicial: <b>art. 165.4 TRLHL</b>. Régimen del endeudamiento: <b>arts. 48 y ss. TRLHL</b>. La regla de gasto y la estabilidad presupuestaria se rigen por la <b>LO 2/2012</b>, <i>norma no incluida en la biblioteca: verifica su texto vigente en el BOE</i>.</p>"}];
const SEMAFORO=["Objeto de la Orden y su relación con el art. 167 TRLHL — art. 1", "Criterios de elaboración del presupuesto — art. 2", "Los tres criterios de clasificación del gasto — art. 3", "Niveles y carácter cerrado de la clasificación por programas — art. 4", "Las seis áreas de gasto y las políticas principales — anexo I", "Capítulos de la clasificación económica del gasto — art. 5 y anexo III", "Formación de la aplicación presupuestaria — art. 6", "Nivel mínimo del registro contable — art. 7", "Crédito inicial y crédito definitivo — art. 8", "Clasificación económica del ingreso — art. 9 y anexo IV", "Equivalencias con los antiguos grupos de función — anexo II"];
const INTRO_HTML="<section class=\"card\" id=\"intro\"><h2>Bloque 6 del tema 8 · La estructura presupuestaria</h2><p class=\"small\">El art. 167 del TRLHL ordena al Ministerio de Hacienda fijar la estructura de los presupuestos locales. Esta es la norma que lo hace: la <b>Orden EHA/3565/2008</b>. Sin ella, el art. 167 es un mandato en el aire; con ella, el presupuesto se convierte en un sistema de códigos común a toda España.</p><div class=\"box ej\"><span class=\"lbl\">La idea que ordena todo el bloque</span>Cada euro de gasto lleva dos códigos obligatorios —<b>para qué</b> (programas) y <b>en qué</b> (económica)— y uno opcional (<b>quién</b>). El cruce de los dos primeros es la <b>aplicación presupuestaria</b>, que es el crédito. Los ingresos, en cambio, solo se clasifican <b>por su naturaleza económica</b>.</div><div class=\"box warn\"><span class=\"lbl\">Fuentes utilizadas y vigencia</span><ul><li><b>Orden EHA/3565/2008</b>, de 3 de diciembre, por la que se aprueba la estructura de los presupuestos de las entidades locales (documento 6 de la biblioteca), texto consolidado con última modificación de <b>19 de marzo de 2014</b>.</li><li><b>RDLeg 2/2004, TRLHL</b> (documento 5), arts. 165, 167, 169.6 y 172, para las concordancias.</li><li>Se citan como <b>aportación externa</b>, por no estar en la biblioteca: la <b>Ley 7/1985, LBRL</b> (arts. 26.1 y 27, mencionados por el anexo I y el art. 4.4) y la <b>LO 2/2012</b> de estabilidad presupuestaria, origen del Fondo de Contingencia del capítulo 5. Verifica su texto vigente en el BOE.</li></ul></div><svg viewBox=\"0 0 660 215\" role=\"img\" aria-label=\"Mapa conceptual de la estructura presupuestaria\"><rect x=\"200\" y=\"8\" width=\"260\" height=\"36\" rx=\"9\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"330\" y=\"31\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"#fff\">ESTRUCTURA PRESUPUESTARIA</text><line x1=\"330\" y1=\"44\" x2=\"330\" y2=\"60\" stroke=\"var(--acc)\" stroke-width=\"2\"/><line x1=\"130\" y1=\"60\" x2=\"530\" y2=\"60\" stroke=\"var(--acc)\" stroke-width=\"2\"/><line x1=\"130\" y1=\"60\" x2=\"130\" y2=\"78\" stroke=\"var(--acc)\" stroke-width=\"2\"/><line x1=\"330\" y1=\"60\" x2=\"330\" y2=\"78\" stroke=\"var(--acc)\" stroke-width=\"2\"/><line x1=\"530\" y1=\"60\" x2=\"530\" y2=\"78\" stroke=\"var(--acc)\" stroke-width=\"2\"/><rect x=\"25\" y=\"78\" width=\"210\" height=\"122\" rx=\"9\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"130\" y=\"100\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"var(--acc)\">GASTOS · ¿para qué?</text><text x=\"130\" y=\"124\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">art. 4 · por programas</text><text x=\"130\" y=\"146\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">6 áreas · 23 políticas</text><text x=\"130\" y=\"168\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">grupos y programas</text><text x=\"130\" y=\"190\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--ink2)\">anexo I · cerrado</text><rect x=\"245\" y=\"78\" width=\"170\" height=\"122\" rx=\"9\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"330\" y=\"100\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"var(--ej)\">¿en qué?</text><text x=\"330\" y=\"124\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">art. 5 · económica</text><text x=\"330\" y=\"146\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">9 capítulos</text><text x=\"330\" y=\"168\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">art. 6 · aplicación</text><text x=\"330\" y=\"190\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--ink2)\">anexo III</text><rect x=\"425\" y=\"78\" width=\"210\" height=\"122\" rx=\"9\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"530\" y=\"100\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"var(--warn)\">INGRESOS</text><text x=\"530\" y=\"124\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">art. 9 · solo económica</text><text x=\"530\" y=\"146\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">9 capítulos</text><text x=\"530\" y=\"168\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">1 a 5 corrientes</text><text x=\"530\" y=\"190\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--ink2)\">anexo IV</text></svg></section>";
const RESUMEN_HTML="<section class=\"card\" id=\"verpar\"><h2>Dónde seguir</h2><div class=\"box ej\"><span class=\"lbl\">Páginas conectadas con este bloque</span><ul><li><a href=\"TRLHL_183-193_ejecucion.html\"><b>TRLHL · Arts. 183 a 193 bis</b></a> — las fases del gasto A-D-O-P y los documentos contables acumulados.</li><li><a href=\"TRLHL_162-171_presupuesto.html\"><b>TRLHL · Arts. 162 a 171</b></a> — contenido y aprobación del presupuesto, cuya estructura desarrolla esta Orden.</li><li><a href=\"TRLHL_ampliacion_contable.html\"><b>TRLHL · Ampliación contable</b></a> — visión de conjunto de la contabilidad presupuestaria.</li><li><a href=\"SUPUESTOS_practicos_resueltos.html\"><b>Supuestos prácticos resueltos</b></a> — incluidas las preguntas sobre gastos corrientes y de capital.</li></ul></div></section><section class=\"card\" id=\"clasifecon\"><h2>Ampliación · Los nueve capítulos de la clasificación económica del gasto</h2><p class=\"small\">Bloque añadido tras analizar tres exámenes reales de la convocatoria: la pregunta «qué incluyen los créditos para gastos corrientes» y «qué incluyen los de capital» aparece una y otra vez, y se responde con este único esquema.</p><svg viewBox=\"0 0 960 510\" role=\"img\" aria-label=\"Los nueve capítulos de la clasificación económica del presupuesto de gastos\" style=\"width:100%;height:auto\"><defs><marker id=\"fl1\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr1\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe1\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw1\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"200\" y=\"8\" width=\"560\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"27.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">LOS NUEVE CAPÍTULOS DE LA CLASIFICACIÓN ECONÓMICA DEL GASTO</text><rect x=\"20\" y=\"52\" width=\"920\" height=\"130\" rx=\"10\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"34\" y=\"72\" text-anchor=\"start\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--ej)\">A.1 · OPERACIONES CORRIENTES</text><text x=\"926\" y=\"72\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">Capítulos 1 a 4</text><rect x=\"34\" y=\"86\" width=\"26\" height=\"20\" rx=\"5\" fill=\"var(--bg)\" stroke=\"var(--ej)\"/><text x=\"47\" y=\"100\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">1</text><text x=\"70\" y=\"100\" text-anchor=\"start\" font-size=\"10.5\" fill=\"currentColor\">Gastos de personal</text><text x=\"520\" y=\"100\" text-anchor=\"start\" font-size=\"9.6\" fill=\"var(--ink2)\">· funcionamiento</text><rect x=\"34\" y=\"110\" width=\"26\" height=\"20\" rx=\"5\" fill=\"var(--bg)\" stroke=\"var(--ej)\"/><text x=\"47\" y=\"124\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">2</text><text x=\"70\" y=\"124\" text-anchor=\"start\" font-size=\"10.5\" fill=\"currentColor\">Gastos corrientes en bienes y servicios</text><text x=\"520\" y=\"124\" text-anchor=\"start\" font-size=\"9.6\" fill=\"var(--ink2)\">· funcionamiento</text><rect x=\"34\" y=\"134\" width=\"26\" height=\"20\" rx=\"5\" fill=\"var(--bg)\" stroke=\"var(--ej)\"/><text x=\"47\" y=\"148\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">3</text><text x=\"70\" y=\"148\" text-anchor=\"start\" font-size=\"10.5\" fill=\"currentColor\">Gastos financieros</text><text x=\"520\" y=\"148\" text-anchor=\"start\" font-size=\"9.6\" fill=\"var(--ink2)\">· los intereses</text><rect x=\"34\" y=\"158\" width=\"26\" height=\"20\" rx=\"5\" fill=\"var(--bg)\" stroke=\"var(--ej)\"/><text x=\"47\" y=\"172\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">4</text><text x=\"70\" y=\"172\" text-anchor=\"start\" font-size=\"10.5\" fill=\"currentColor\">Transferencias corrientes</text><text x=\"520\" y=\"172\" text-anchor=\"start\" font-size=\"9.6\" fill=\"var(--ink2)\">· transferencias</text><rect x=\"20\" y=\"192\" width=\"920\" height=\"58\" rx=\"10\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"34\" y=\"212\" text-anchor=\"start\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--warn)\">FONDO DE CONTINGENCIA</text><text x=\"926\" y=\"212\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">Capítulo 5</text><rect x=\"34\" y=\"226\" width=\"26\" height=\"20\" rx=\"5\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"47\" y=\"240\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--warn)\">5</text><text x=\"70\" y=\"240\" text-anchor=\"start\" font-size=\"10.5\" fill=\"currentColor\">Fondo de contingencia y otros imprevistos</text><text x=\"520\" y=\"240\" text-anchor=\"start\" font-size=\"9.6\" fill=\"var(--ink2)\">· art. 31 LO 2/2012</text><rect x=\"20\" y=\"260\" width=\"920\" height=\"82\" rx=\"10\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"34\" y=\"280\" text-anchor=\"start\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--acc)\">A.2 · OPERACIONES DE CAPITAL</text><text x=\"926\" y=\"280\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">Capítulos 6 y 7</text><rect x=\"34\" y=\"294\" width=\"26\" height=\"20\" rx=\"5\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"47\" y=\"308\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">6</text><text x=\"70\" y=\"308\" text-anchor=\"start\" font-size=\"10.5\" fill=\"currentColor\">Inversiones reales</text><text x=\"520\" y=\"308\" text-anchor=\"start\" font-size=\"9.6\" fill=\"var(--ink2)\">· infraestructuras e inventariable</text><rect x=\"34\" y=\"318\" width=\"26\" height=\"20\" rx=\"5\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"47\" y=\"332\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">7</text><text x=\"70\" y=\"332\" text-anchor=\"start\" font-size=\"10.5\" fill=\"currentColor\">Transferencias de capital</text><text x=\"520\" y=\"332\" text-anchor=\"start\" font-size=\"9.6\" fill=\"var(--ink2)\">· financian capital</text><rect x=\"20\" y=\"352\" width=\"920\" height=\"82\" rx=\"10\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"34\" y=\"372\" text-anchor=\"start\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--exc)\">B · OPERACIONES FINANCIERAS</text><text x=\"926\" y=\"372\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink2)\">Capítulos 8 y 9</text><rect x=\"34\" y=\"386\" width=\"26\" height=\"20\" rx=\"5\" fill=\"var(--bg)\" stroke=\"var(--exc)\"/><text x=\"47\" y=\"400\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--exc)\">8</text><text x=\"70\" y=\"400\" text-anchor=\"start\" font-size=\"10.5\" fill=\"currentColor\">Activos financieros</text><text x=\"520\" y=\"400\" text-anchor=\"start\" font-size=\"9.6\" fill=\"var(--ink2)\">· adquisición de activos</text><rect x=\"34\" y=\"410\" width=\"26\" height=\"20\" rx=\"5\" fill=\"var(--bg)\" stroke=\"var(--exc)\"/><text x=\"47\" y=\"424\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--exc)\">9</text><text x=\"70\" y=\"424\" text-anchor=\"start\" font-size=\"10.5\" fill=\"currentColor\">Pasivos financieros</text><text x=\"520\" y=\"424\" text-anchor=\"start\" font-size=\"9.6\" fill=\"var(--ink2)\">· amortización de deuda</text><rect x=\"20\" y=\"444\" width=\"920\" height=\"58\" rx=\"8\" fill=\"var(--panel)\" stroke=\"var(--line)\"/><text x=\"480\" y=\"457.02\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"currentColor\">LA REGLA QUE RESUELVE LAS PREGUNTAS DE EXAMEN</text><text x=\"480\" y=\"470.02\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">CORRIENTES = capítulos 1 a 4 · funcionamiento de los servicios, intereses y transferencias corrientes.</text><text x=\"480\" y=\"483.02\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">CAPITAL = capítulos 6 y 7 · inversiones reales y transferencias de capital.</text><text x=\"480\" y=\"496.02\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">FINANCIERAS = capítulos 8 y 9 · activos y pasivos financieros.</text></svg><div class=\"box legal\"><span class=\"lbl\">Texto legal · anexo de la Orden EHA/3565/2008 · A.1 Operaciones corrientes</span>«El presupuesto de gastos clasifica en sus <b>capítulos 1 al 4</b> los gastos por operaciones corrientes, separando los <b>gastos de funcionamiento de los servicios</b> (personal y gastos en bienes corrientes y servicios), los <b>intereses</b> y las <b>transferencias corrientes</b>.»</div><div class=\"box legal\"><span class=\"lbl\">Texto legal · A.2 Operaciones de capital</span>«Comprende los <b>Capítulos 6</b>, «Inversiones reales», <b>y 7</b>, «Transferencias de capital», y describen los gastos en inversiones reales y en transferencias destinadas a financiar operaciones de capital.»</div><div class=\"box legal\"><span class=\"lbl\">Texto legal · B) Operaciones financieras</span>«Los <b>Capítulos 8 y 9</b> reflejan las transacciones de débitos y créditos correspondientes a operaciones financieras tanto a corto (de plazo no superior a un año) como a largo plazo (superior a un año), poniendo de manifiesto las variaciones netas de activos financieros (diferencia entre los Capítulos 8 de gastos e ingresos) y las variaciones netas de pasivos financieros (diferencia entre los Capítulos 9 de ingresos y gastos).»</div><div class=\"box legal\"><span class=\"lbl\">Texto legal · Capítulo 5</span>«Comprende este capítulo la dotación al <b>Fondo de Contingencia</b> al que se refiere el artículo 31 de la Ley Orgánica 2/2012, de 27 de abril, de Estabilidad Presupuestaria y Sostenibilidad Financiera, que obligatoriamente han de incluir en sus presupuestos las Entidades Locales» del ámbito subjetivo correspondiente.</div><div class=\"box\"><span class=\"lbl\">Interpretación · aportación externa</span>El <b>capítulo 5</b> ocupa una posición singular: no es gasto de funcionamiento ni inversión, sino una <b>reserva</b> para necesidades no discrecionales y no previstas. Por eso, cuando una pregunta pide agrupar «corrientes» y «capital», el capítulo 5 se queda fuera de ambas categorías y suele no aparecer entre las opciones.</div><svg viewBox=\"0 0 960 294\" role=\"img\" aria-label=\"Frontera entre gasto corriente, gasto de capital y operaciones financieras\" style=\"width:100%;height:auto\"><defs><marker id=\"fl2\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr2\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe2\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw2\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"250\" y=\"8\" width=\"460\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"27.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">LA FRONTERA QUE SIEMPRE SE PREGUNTA</text><rect x=\"20\" y=\"52\" width=\"450\" height=\"150\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"245\" y=\"91.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"var(--ej)\">¿ES GASTO CORRIENTE?</text><text x=\"245\" y=\"104.84\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"currentColor\">SÍ · capítulos 1 a 4</text><text x=\"245\" y=\"117.84\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"currentColor\"></text><text x=\"245\" y=\"130.84\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"currentColor\">· Nóminas del personal (cap. 1)</text><text x=\"245\" y=\"143.84\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"currentColor\">· Luz, limpieza, suministros (cap. 2)</text><text x=\"245\" y=\"156.84\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"currentColor\">· Intereses de un préstamo (cap. 3)</text><text x=\"245\" y=\"169.84\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"currentColor\">· Subvención a una asociación (cap. 4)</text><rect x=\"490\" y=\"52\" width=\"450\" height=\"150\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"715\" y=\"85.34\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"var(--acc)\">¿ES GASTO DE CAPITAL?</text><text x=\"715\" y=\"98.34\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"currentColor\">SÍ · capítulos 6 y 7</text><text x=\"715\" y=\"111.34\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"currentColor\"></text><text x=\"715\" y=\"124.34\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"currentColor\">· Construir un polideportivo (cap. 6)</text><text x=\"715\" y=\"137.34\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"currentColor\">· Comprar un vehículo inventariable (cap. 6)</text><text x=\"715\" y=\"150.34\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"currentColor\">· Aportación a una obra de otra entidad (cap. 7)</text><text x=\"715\" y=\"163.34\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"currentColor\"></text><text x=\"715\" y=\"176.34\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"currentColor\">NO son de capital las nóminas ni la luz</text><rect x=\"20\" y=\"214\" width=\"920\" height=\"72\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"480\" y=\"234.02\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--exc)\">LOS DOS ERRORES QUE MÁS PUNTOS CUESTAN</text><text x=\"480\" y=\"247.02\" text-anchor=\"middle\" font-size=\"10.2\" fill=\"currentColor\">1 · Meter las INVERSIONES REALES (capítulo 6) entre los gastos CORRIENTES. Son de capital por definición.</text><text x=\"480\" y=\"260.02\" text-anchor=\"middle\" font-size=\"10.2\" fill=\"currentColor\">2 · Meter los GASTOS DE PERSONAL (capítulo 1) entre los gastos DE CAPITAL. Son corrientes por definición.</text><text x=\"480\" y=\"273.02\" text-anchor=\"middle\" font-size=\"10.2\" fill=\"currentColor\">Y un tercero, más fino: los capítulos 8 y 9 no son ni corrientes ni de capital, son OPERACIONES FINANCIERAS.</text></svg><div class=\"box ej\"><span class=\"lbl\">Caso trabajado</span>Una diputación quiere clasificar cinco gastos de su presupuesto: <b>(1)</b> nóminas de 240 empleados, <b>(2)</b> electricidad de los centros comarcales, <b>(3)</b> intereses del préstamo del pabellón, <b>(4)</b> subvención de 18.000 € a una asociación cultural y <b>(5)</b> construcción de un carril bici. → (1) capítulo <b>1</b>; (2) capítulo <b>2</b>; (3) capítulo <b>3</b>; (4) capítulo <b>4</b>. Los cuatro son <b>corrientes</b>. (5) es capítulo <b>6</b>, inversiones reales: <b>gasto de capital</b>. Si la pregunta ofrece una opción que mete las inversiones reales entre los corrientes, es falsa por definición.</div><div class=\"box exc\"><span class=\"lbl\">No-ejemplo</span>La <b>amortización del principal</b> de ese mismo préstamo <b>no</b> es gasto corriente ni de capital: es capítulo <b>9</b>, pasivos financieros, una <b>operación financiera</b>. Solo los <b>intereses</b> —capítulo 3— son gasto corriente.</div><div class=\"box warn\"><span class=\"lbl\">Anclaje memorístico</span>Cuenta con los dedos: <b>1-2-3-4 corrientes</b> · <b>5 aparte</b>, el colchón · <b>6-7 capital</b> · <b>8-9 financieras</b>. Y una frase: «<b>pago sueldos y luz, pago intereses y ayudas; construyo y transfiero para construir; y aparte, presto y devuelvo.</b>»</div><div class=\"box\"><span class=\"lbl\">Dónde seguir</span>El detalle de las fases del gasto y de los documentos contables acumulados —<b>AD, ADO, ADOP</b>— está en el bloque 3 del tema 8: <a href=\"TRLHL_183-193_ejecucion.html\">arts. 183 a 193 bis del TRLHL</a>. Y la visión de conjunto, en la <a href=\"TRLHL_ampliacion_contable.html\">ampliación contable del tema 8</a>.</div></section><section class=\"card\" id=\"resumen\"><h2>Resumen ejecutivo</h2><p class=\"small\"><b>Norma:</b> Orden EHA/3565/2008, de 3 de diciembre, en desarrollo del art. 167 del RDLeg 2/2004 (TRLHL).</p><table><tbody><tr><th style=\"width:60px\">1 y 2</th><td>Fija estructura, normas y códigos del art. <b>167.1 TRLHL</b>, para entidades locales <b>y organismos autónomos</b>. Criterios: naturaleza económica y finalidades.</td></tr><tr><th>3</th><td>Tres clasificaciones: <b>programas</b> y <b>económica</b> (obligatorias) y <b>orgánica</b> (opcional).</td></tr><tr><th>4</th><td>Programas: <b>área ▸ política ▸ grupo de programas ▸ programa</b> (+ subprogramas). Detalle mínimo: <b>grupo de programas</b>. Anexo I <b>cerrado</b> hasta programas, abierto después. Áreas: <b>0, 1, 2, 3, 4 y 9</b>.</td></tr><tr><th>5</th><td>Económica del gasto: <b>capítulo ▸ artículo ▸ concepto ▸ subconcepto ▸ partida</b>. Nueve capítulos: <b>1-4 corrientes, 5 fondo de contingencia, 6-7 capital, 8-9 financieros</b>.</td></tr><tr><th>6</th><td><b>Aplicación presupuestaria</b> = programas (grupo o programa) + económica (concepto o subconcepto) + orgánica si se usa. Coincide con el art. <b>167.4 TRLHL</b>.</td></tr><tr><th>7</th><td>Registro contable <b>como mínimo</b> sobre la aplicación; cabe mayor desglose.</td></tr><tr><th>8</th><td><b>Crédito inicial</b> (presupuesto definitivamente aprobado) frente a <b>crédito definitivo</b> (± modificaciones). La prórroga arrastra el inicial (art. <b>169.6 TRLHL</b>).</td></tr><tr><th>9</th><td>Ingresos: <b>solo clasificación económica</b>. Nueve capítulos, con <b>1 a 5 corrientes</b>. El capítulo 5 aquí es <b>Ingresos patrimoniales</b>.</td></tr><tr><th>Anexos</th><td>I programas · II <b>equivalencias</b> con grupos de funciones · III gastos · IV ingresos. Vigente desde el ejercicio <b>2010</b>.</td></tr></tbody></table><h2 style=\"margin-top:1.2rem\">Calendario de repaso espaciado</h2><table><thead><tr><th>Momento</th><th>Fecha</th><th>Qué hacer</th></tr></thead><tbody id=\"calbody\"></tbody></table></section>";

   var found=false;
   var w=document.createTreeWalker(s,NodeFilter.SHOW_TEXT,null);var nodes=[];
   while(w.nextNode()){var nd=w.currentNode;
    if(nd.parentNode.closest('script,style,mark'))continue;

(function(){
"use strict";
var K_THEME="oposi_bII_theme", K_FS="oposi_bII_fs", K_STREAK="oposi_bII_streak";
function load(k,f){try{var v=localStorage.getItem(k);return v?JSON.parse(v):f;}catch(e){return f;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
var root=document.documentElement;

/* Tema persistente (sobrescribe el toggle simple anterior) */

if(saved){root.setAttribute("data-theme",saved);}
else if(window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches){root.setAttribute("data-theme","dark");}

if(bt)bt.onclick=function(){

var fs=load(K_FS,16);

setFs(fs);

  var s=load(K_STREAK,{last:null,n:0});

    s.n=(s.last===ayer)?s.n+1:1;s.last=hoy;save(K_STREAK,s);
  }

/* Reveal on scroll para las tarjetas */
function reveal(){
  var els=document.querySelectorAll("section.card:not(.rv)");
  if(!els.length)return;
  if(!("IntersectionObserver" in window)){return;}
  var io=new IntersectionObserver(function(es){
    es.forEach(function(en){if(en.isIntersecting){en.target.classList.add("in");io.unobserve(en.target);}});
  },{threshold:.06,rootMargin:"0px 0px -30px 0px"});
  Array.prototype.forEach.call(els,function(el){el.classList.add("rv");io.observe(el);});
}

/* Sección activa en el índice lateral */
function spy(){
  var links=document.querySelectorAll("nav.side a[href^='#']");
  if(!links.length||!("IntersectionObserver" in window))return;
  var map={};
  Array.prototype.forEach.call(links,function(a){
    var t=document.getElementById(a.getAttribute("href").slice(1));
    if(t)map[t.id]=a;
  });
  var io=new IntersectionObserver(function(es){
    es.forEach(function(en){
      if(en.isIntersecting){
        Array.prototype.forEach.call(links,function(a){a.classList.remove("on");});
        if(map[en.target.id])map[en.target.id].classList.add("on");
      }
    });
  },{rootMargin:"-80px 0px -70% 0px",threshold:0});
  Object.keys(map).forEach(function(id){io.observe(document.getElementById(id));});
}

/* Ripple en botones */
document.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b||b.classList.contains("navtoggle"))return;

  s.style.left=(e.clientX-r.left-d/2)+"px";s.style.top=(e.clientY-r.top-d/2)+"px";
  b.appendChild(s);setTimeout(function(){if(s.parentNode)s.parentNode.removeChild(s);},560);
});

/* Atajos de teclado */

if(document.getElementById("main")&&document.getElementById("main").children.length){init();}
else{setTimeout(init,60);}
addEventListener("load",function(){setTimeout(init,80);});
})();

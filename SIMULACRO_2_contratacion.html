t\" font-size=\"9.8\" fill=\"currentColor\">Registro de Licitadores · sin provisional · técnicos ≤ 7 días</text><text x=\"224\" y=\"230\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Definitiva 7.500 € en 7 días hábiles (4-jun) · en obras no cabe eximirla</text><text x=\"930\" y=\"202\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">arts. 107.1 y 159</text><path d=\"M480 249 L 480 257\" stroke=\"var(--acc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#s2b_fl)\"/><rect x=\"20\" y=\"258\" width=\"920\" height=\"40\" rx=\"10\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"30\" y=\"265\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"120\" y=\"282\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--warn)\">Exp. 4 · negociado</text><text x=\"224\" y=\"280\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Ninguna oferta → art. 168.a).1.º · sin subir el PBL ni cambiar la retribución</text><text x=\"930\" y=\"280\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">art. 168</text><path d=\"M480 299 L 480 307\" stroke=\"var(--warn)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#s2b_fw)\"/><rect x=\"20\" y=\"308\" width=\"920\" height=\"40\" rx=\"10\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><rect x=\"30\" y=\"315\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--exc)\"/><text x=\"120\" y=\"332\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--exc)\">Exp. 5 · duración</text><text x=\"224\" y=\"330\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">VE 150.000 € · 5 años = máximo legal · más de 4 años → órgano: el Pleno</text><text x=\"930\" y=\"330\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">art. 29.4 · DA 2.ª</text><rect x=\"20\" y=\"358\" width=\"920\" height=\"34\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"480\" y=\"378.328\" text-anchor=\"middle\" font-size=\"10.4\" fill=\"currentColor\">Antes de contar un plazo: ¿días o días hábiles? ¿desde la publicación, el envío o la recepción?</text></svg>\n<div class=\"interp\"><span class=\"lbl\">Aportación externa</span>La redacción original del art. 118 impedía adjudicar contratos menores a un contratista que ya hubiera suscrito otros que, sumados, superasen el umbral. Esa regla se suprimió por el Real Decreto-ley 3/2020. El texto consolidado de la biblioteca ya no la contiene: solo exige justificar que no se altera el objeto. El límite real lo pone la prohibición de fraccionar del art. 99.2.</div>\n</div></details>\n</section><section class=\"card\" id=\"nota\"><h2>Tu nota</h2>\n<p class=\"small\">Cuenta el supuesto que hayas elegido. Las dos reglas aparecen siempre; la resaltada es la que tienes activada arriba. Para aprobar hacen falta <b>12,50 de 25</b>.</p>\n<div id=\"notabox\"></div>\n<div class=\"box warn\"><span class=\"lbl\">Cuándo dejar en blanco</span>Con la penalización, cada fallo resta 0,5 puntos y cada acierto suma 1. Si dudas entre dos opciones, responder te sale a cuenta (de media ganas 0,25). Si dudas entre las cuatro, no: de media pierdes 0,125.</div>\n</section><section class=\"card\" id=\"cifras\"><h2>Tabla de cifras y plazos de este simulacro</h2>\n<p class=\"small\">Pulsa en una cabecera para ordenar. Escríbela de memoria en papel antes de mirarla: es la tarea de mañana por la tarde.</p>\n<div class=\"tw\"><table id=\"tcif\"><thead><tr><th class=\"sortable\">Qué</th><th class=\"sortable\">Cifra o plazo</th><th class=\"sortable\">Se mide sobre / cómo se cuenta</th><th class=\"sortable\">Art. LCSP</th></tr></thead><tbody><tr><td>Contrato menor · obras</td><td>< 40.000 €</td><td>VE sin IVA</td><td>118.1</td></tr><tr><td>Contrato menor · suministros y servicios</td><td>< 15.000 €</td><td>VE sin IVA</td><td>118.1</td></tr><tr><td>Abreviado · obras</td><td>< 80.000 €</td><td>VE</td><td>159.6</td></tr><tr><td>Abreviado · suministros y servicios</td><td>< 60.000 €</td><td>VE</td><td>159.6</td></tr><tr><td>Simplificado · suministros y servicios</td><td>< 140.000 €</td><td>VE · remite al 22.1.a</td><td>159.1.a</td></tr><tr><td>Simplificado · obras</td><td>≤ 2.000.000 €</td><td>VE</td><td>159.1.a</td></tr><tr><td>Simplificado · juicio de valor</td><td>≤ 25 % (45 % intelectual)</td><td>Ponderación</td><td>159.1.b</td></tr><tr><td>Armonizado · servicios, entidad local</td><td>≥ 216.000 €</td><td>VE</td><td>22.1.b</td></tr><tr><td>Órgano: Alcalde</td><td>≤ 10 % rec. ordinarios, ≤ 6 M€ y ≤ 4 años</td><td>VE y duración con prórrogas</td><td>DA 2.ª</td></tr><tr><td>Duración máxima servicios y suministros</td><td>5 años</td><td>Prórrogas incluidas</td><td>29.4</td></tr><tr><td>Preaviso de la prórroga</td><td>2 meses</td><td>Antes del fin del contrato</td><td>29.2</td></tr><tr><td>Ofertas · abierto no armonizado (serv.)</td><td>15 días</td><td>Naturales, desde el siguiente</td><td>156.6</td></tr><tr><td>Ofertas · abierto no armonizado (obras)</td><td>26 días</td><td>Naturales</td><td>156.6</td></tr><tr><td>Ofertas · simplificado</td><td>15 días (obras 20)</td><td>Naturales, desde el siguiente</td><td>159.3</td></tr><tr><td>Ofertas · abreviado</td><td>10 días hábiles</td><td>Desde el siguiente</td><td>159.6.a</td></tr><tr><td>Apertura de proposiciones</td><td>20 días</td><td>Desde el fin de la presentación</td><td>157.3</td></tr><tr><td>Adjudicación · solo precio</td><td>15 días</td><td>Desde la apertura</td><td>158.1</td></tr><tr><td>Adjudicación · varios criterios</td><td>2 meses</td><td>+15 días hábiles si hay anormalidad</td><td>158.2-3</td></tr><tr><td>Requerimiento de documentación</td><td>10 días hábiles</td><td>Desde la recepción</td><td>150.2</td></tr><tr><td>Garantía en el simplificado</td><td>7 días hábiles</td><td>Desde el envío</td><td>159.4.f</td></tr><tr><td>Justificar baja anormal (simplificado)</td><td>5 días hábiles</td><td>Desde el envío</td><td>159.4.f</td></tr><tr><td>Adjudicar tras la documentación</td><td>5 días hábiles</td><td>Desde la recepción</td><td>150.3</td></tr><tr><td>Publicar la adjudicación</td><td>15 días</td><td>En el perfil</td><td>151.1</td></tr><tr><td>Espera si cabe recurso especial</td><td>15 días hábiles</td><td>Desde la remisión de la notificación</td><td>153.3</td></tr><tr><td>Requerimiento de formalización</td><td>5 días</td><td>Naturales, desde el siguiente</td><td>153.3</td></tr><tr><td>Formalizar sin recurso especial</td><td>15 días hábiles</td><td>Desde la notificación</td><td>153.3</td></tr><tr><td>Publicar la formalización</td><td>15 días</td><td>Tras el perfeccionamiento</td><td>154.1</td></tr><tr><td>Garantía definitiva</td><td>5 %</td><td>Precio ofertado sin IVA</td><td>107.1</td></tr><tr><td>Garantía provisional (excepcional)</td><td>≤ 3 %</td><td>PBL sin IVA</td><td>106.2</td></tr><tr><td>Penalidad por retirar la oferta o no formalizar</td><td>3 %</td><td>PBL sin IVA</td><td>150.2 · 153.4</td></tr><tr><td>Modificación prevista</td><td>≤ 20 %</td><td>Precio inicial</td><td>204.1</td></tr><tr><td>Mesa local · miembros electos</td><td>≤ 1/3</td><td>Mínimo 3 miembros</td><td>DA 2.ª.7</td></tr></tbody></table></div>\n</section><section class=\"card\" id=\"legal\"><h2>Los preceptos, literales</h2>\n<p class=\"small\">Los fragmentos que sostienen las 50 respuestas, transcritos del texto consolidado de la Ley 9/2017 de la biblioteca y comprobados contra el PDF. Aquí solo hay letra de la ley, sin interpretación.</p>\n<details class=\"panel\"><summary>Art. 22.1 LCSP · umbrales de los servicios</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LCSP</span><p>«a) 140.000 euros, cuando los contratos hayan de ser adjudicados por la Administración General del Estado, sus Organismos Autónomos, o las Entidades Gestoras y Servicios Comunes de la Seguridad Social.»</p><p>«b) 216.000 euros, cuando los contratos hayan de adjudicarse por entidades del sector público distintas a la Administración General del Estado, sus Organismos Autónomos o las Entidades Gestoras y Servicios Comunes de la Seguridad Social.»</p></div></div></details><details class=\"panel\"><summary>Art. 29.2 LCSP · prórroga</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LCSP</span><p>«La prórroga se acordará por el órgano de contratación y será obligatoria para el empresario, siempre que su preaviso se produzca al menos con dos meses de antelación a la finalización del plazo de duración del contrato, salvo que en el pliego que rija el contrato se establezca uno mayor.»</p><p>«En ningún caso podrá producirse la prórroga por el consentimiento tácito de las partes.»</p></div></div></details><details class=\"panel\"><summary>Art. 29.4 LCSP · duración máxima</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LCSP</span><p>«Los contratos de suministros y de servicios de prestación sucesiva tendrán un plazo máximo de duración de cinco años, incluyendo las posibles prórrogas que en aplicación del apartado segundo de este artículo acuerde el órgano de contratación»</p></div></div></details><details class=\"panel\"><summary>Art. 36.1 LCSP · perfección</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LCSP</span><p>«Los contratos que celebren los poderes adjudicadores, a excepción de los contratos menores y de los contratos basados en un acuerdo marco y los contratos específicos en el marco de un sistema dinámico de adquisición a los que se refiere el apartado 3 de este artículo, se perfeccionan con su formalización.»</p></div></div></details><details class=\"panel\"><summary>Art. 99.2 LCSP · fraccionamiento</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LCSP</span><p>«No podrá fraccionarse un contrato con la finalidad de disminuir la cuantía del mismo y eludir así los requisitos de publicidad o los relativos al procedimiento de adjudicación que correspondan.»</p></div></div></details><details class=\"panel\"><summary>Art. 100.1 LCSP · presupuesto base de licitación</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LCSP</span><p>«por presupuesto base de licitación se entenderá el límite máximo de gasto que en virtud del contrato puede comprometer el órgano de contratación, incluido el Impuesto sobre el Valor Añadido, salvo disposición en contrario.»</p></div></div></details><details class=\"panel\"><summary>Art. 101.1.a) LCSP · sin IVA</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LCSP</span><p>«el órgano de contratación tomará el importe total, sin incluir el Impuesto sobre el Valor Añadido, pagadero según sus estimaciones.»</p></div></div></details><details class=\"panel\"><summary>Art. 101.2.a) y c) LCSP · prórrogas y modificaciones</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LCSP</span><p>«a) Cualquier forma de opción eventual y las eventuales prórrogas del contrato.»</p><p>«se haya previsto en el pliego de cláusulas administrativas particulares o en el anuncio de licitación la posibilidad de que el contrato sea modificado, se considerará valor estimado del contrato el importe máximo que este pueda alcanzar, teniendo en cuenta la totalidad de las modificaciones al alza previstas.»</p></div></div></details><details class=\"panel\"><summary>Art. 106.2 LCSP · tope de la garantía provisional</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LCSP</span><p>«que no podrá ser superior a un 3 por 100 del presupuesto base de licitación del contrato, excluido el Impuesto sobre el Valor Añadido»</p></div></div></details><details class=\"panel\"><summary>Art. 107.1 LCSP · garantía definitiva</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LCSP</span><p>«deberán constituir a disposición del órgano de contratación una garantía de un 5 por 100 del precio final ofertado por aquellos, excluido el Impuesto sobre el Valor Añadido.»</p><p>«Esta exención no será posible en el caso de contratos de obras, ni de concesión de obras.»</p></div></div></details><details class=\"panel\"><summary>Art. 118 LCSP · contrato menor</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LCSP</span><p>«1. Se consideran contratos menores los contratos de valor estimado inferior a 40.000 euros, cuando se trate de contratos de obras, o a 15.000 euros, cuando se trate de contratos de suministro o de servicios»</p><p>«2. En los contratos menores la tramitación del expediente exigirá la emisión de un informe del órgano de contratación justificando de manera motivada la necesidad del contrato y que no se está alterando su objeto con el fin de evitar la aplicación de los umbrales descritos en el apartado anterior.»</p><p>«3. Asimismo se requerirá la aprobación del gasto y la incorporación al mismo de la factura correspondiente, que deberá reunir los requisitos que las normas de desarrollo de esta Ley establezcan.»</p></div></div></details><details class=\"panel\"><summary>Art. 146.2.a) LCSP · comité de expertos</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LCSP</span><p>«la valoración de los criterios cuya cuantificación dependa de un juicio de valor corresponderá, en los casos en que proceda por tener atribuida una ponderación mayor que la correspondiente a los criterios evaluables de forma automática, a un comité formado por expertos con cualificación apropiada, que cuente con un mínimo de tres miembros»</p></div></div></details><details class=\"panel\"><summary>Art. 149 LCSP · ofertas anormalmente bajas</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LCSP</span><p>«solo podrá excluirla del procedimiento de licitación previa tramitación del procedimiento que establece este artículo.»</p><p>«deberá requerir al licitador o licitadores que las hubieren presentado dándoles plazo suficiente para que justifiquen y desglosen razonada y detalladamente el bajo nivel de los precios»</p><p>«Se entenderá en todo caso que la justificación no explica satisfactoriamente el bajo nivel de los precios o costes propuestos por el licitador cuando esta sea incompleta»</p><p>«la excluirá de la clasificación y acordará la adjudicación a favor de la mejor oferta, de acuerdo con el orden en que hayan sido clasificadas»</p></div></div></details><details class=\"panel\"><summary>Art. 150.2 LCSP · requerimiento y penalidad</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LCSP</span><p>«dentro del plazo de diez días hábiles, a contar desde el siguiente a aquel en que hubiera recibido el requerimiento»</p><p>«se entenderá que el licitador ha retirado su oferta, procediéndose a exigirle el importe del 3 por ciento del presupuesto base de licitación, IVA excluido, en concepto de penalidad»</p></div></div></details><details class=\"panel\"><summary>Art. 150.3 LCSP · adjudicación</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LCSP</span><p>«El órgano de contratación adjudicará el contrato dentro de los cinco días hábiles siguientes a la recepción de la documentación.»</p><p>«No podrá declararse desierta una licitación cuando exista alguna oferta o proposición que sea admisible de acuerdo con los criterios que figuren en el pliego.»</p></div></div></details><details class=\"panel\"><summary>Art. 151.1 LCSP · notificación y publicación</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LCSP</span><p>«La resolución de adjudicación deberá ser motivada y se notificará a los candidatos y licitadores, debiendo ser publicada en el perfil de contratante en el plazo de 15 días.»</p></div></div></details><details class=\"panel\"><summary>Art. 153 LCSP · formalización</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LCSP</span><p>«2. En el caso de los contratos menores definidos en el artículo 118 se acreditará su existencia con los documentos a los que se refiere dicho artículo.»</p><p>«la formalización no podrá efectuarse antes de que transcurran quince días hábiles desde que se remita la notificación de la adjudicación a los licitadores y candidatos.»</p><p>«requerirán al adjudicatario para que formalice el contrato en plazo no superior a cinco días a contar desde el siguiente a aquel en que hubiera recibido el requerimiento»</p></div></div></details><details class=\"panel\"><summary>Art. 156.6 LCSP · plazo en el abierto</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LCSP</span><p>«En los contratos de las Administraciones Públicas que no estén sujetos a regulación armonizada, el plazo de presentación de proposiciones no será inferior a quince días, contados desde el día siguiente al de la publicación del anuncio de licitación del contrato en el perfil de contratante. En los contratos de obras y de concesión de obras y concesión de servicios, el plazo será, como mínimo, de veintiséis días.»</p></div></div></details><details class=\"panel\"><summary>Art. 157 LCSP · sobres y apertura</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LCSP</span><p>«La Mesa de contratación calificará la documentación a que se refiere el artículo 140, que deberá presentarse por los licitadores en sobre o archivo electrónico distinto al que contenga la proposición.»</p><p>«En todo caso la apertura de las proposiciones deberá efectuarse en el plazo máximo de veinte días contado desde la fecha de finalización del plazo para presentar las mismas.»</p><p>«el plazo anterior se entenderá cumplido cuando se haya abierto, dentro del mismo, el primero de los sobres o archivos electrónicos que componen la proposición.»</p></div></div></details><details class=\"panel\"><summary>Art. 158 LCSP · plazo para adjudicar</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LCSP</span><p>«el plazo máximo para efectuar la adjudicación será de dos meses a contar desde la apertura de las proposiciones, salvo que se hubiese establecido otro en el pliego de cláusulas administrativas particulares.»</p><p>«Los plazos indicados en los apartados anteriores se ampliarán en quince días hábiles cuando sea necesario seguir los trámites a que se refiere el apartado 4 del artículo 149 de la presente Ley.»</p></div></div></details><details class=\"panel\"><summary>Art. 159.1 LCSP · cuándo cabe el simplificado</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LCSP</span><p>«a) Que su valor estimado sea igual o inferior a 2.000.000 de euros en el caso de contratos de obras, y en el caso de contratos de suministro y de servicios, que su valor estimado sea inferior a las cantidades establecidas en los artículos 21.1, letra a), y 22.1, letra a), de esta Ley, respectivamente, o a sus correspondientes actualizaciones.»</p><p>«b) Que entre los criterios de adjudicación previstos en el pliego no haya ninguno evaluable mediante juicio de valor o, de haberlos, su ponderación no supere el veinticinco por ciento del total»</p></div></div></details><details class=\"panel\"><summary>Art. 159.3 y 4 LCSP · simplificado ordinario</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LCSP</span><p>«El plazo para la presentación de proposiciones no podrá ser inferior a quince días a contar desde el siguiente a la publicación en el perfil de contratante del anuncio de licitación. En los contratos de obras el plazo será como mínimo de veinte días.»</p><p>«b) No procederá la constitución de garantía provisional por parte de los licitadores.»</p><p>«la valoración de las proposiciones se hará por los servicios técnicos del órgano de contratación en un plazo no superior a siete días»</p><p>«y todo ello en el plazo de siete días hábiles a contar desde el envío de la comunicación.»</p><p>«el plazo máximo para que justifique su oferta el licitador no podrá superar los cinco días hábiles desde el envío de la correspondiente comunicación.»</p></div></div></details><details class=\"panel\"><summary>Art. 159.6 LCSP · tramitación abreviada</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LCSP</span><p>«En contratos de obras de valor estimado inferior a 80.000 euros, y en contratos de suministros y de servicios de valor estimado inferior a 60.000 euros, excepto los que tengan por objeto prestaciones de carácter intelectual»</p><p>«a) El plazo para la presentación de proposiciones no podrá ser inferior a diez días hábiles, a contar desde el siguiente a la publicación del anuncio de licitación en el perfil de contratante.»</p><p>«b) Se eximirá a los licitadores de la acreditación de la solvencia económica y financiera y técnica o profesional.»</p><p>«por lo que no se celebrará acto público de apertura de las mismas.»</p><p>«f) No se requerirá la constitución de garantía definitiva.»</p><p>«g) La formalización del contrato podrá efectuarse mediante la firma de aceptación por el contratista de la resolución de adjudicación.»</p></div></div></details><details class=\"panel\"><summary>Art. 168.a).1.º LCSP · negociado sin publicidad</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LCSP</span><p>«No se haya presentado ninguna oferta; ninguna oferta adecuada; ninguna solicitud de participación; o ninguna solicitud de participación adecuada en respuesta a un procedimiento abierto o a un procedimiento restringido, siempre que las condiciones iniciales del contrato no se modifiquen sustancialmente, sin que en ningún caso se pueda incrementar el presupuesto base de licitación ni modificar el sistema de retribución»</p></div></div></details><details class=\"panel\"><summary>Art. 204.1 LCSP · modificaciones previstas</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LCSP</span><p>«Los contratos de las Administraciones Públicas podrán modificarse durante su vigencia hasta un máximo del veinte por ciento del precio inicial cuando en los pliegos de cláusulas administrativas particulares se hubiere advertido expresamente de esta posibilidad»</p></div></div></details><details class=\"panel\"><summary>Art. 326.1 LCSP · mesa de contratación</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LCSP</span><p>«En los procedimientos a los que se refiere el artículo 159.6 será igualmente potestativa la constitución de la mesa.»</p></div></div></details><details class=\"panel\"><summary>DA 2.ª LCSP · órgano de contratación en las entidades locales</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LCSP</span><p>«1. Corresponden a los Alcaldes y a los Presidentes de las Entidades Locales las competencias como órgano de contratación respecto de los contratos de obras, de suministro, de servicios, los contratos de concesión de obras, los contratos de concesión de servicios y los contratos administrativos especiales, cuando su valor estimado no supere el 10 por ciento de los recursos ordinarios del presupuesto ni, en cualquier caso, la cuantía de seis millones de euros, incluidos los de carácter plurianual cuando su duración no sea superior a cuatro años, eventuales prórrogas incluidas»</p><p>«Corresponden al Pleno las competencias como órgano de contratación respecto de los contratos mencionados en el apartado anterior que celebre la Entidad Local, cuando por su valor o duración no correspondan al Alcalde o Presidente de la Entidad Local»</p></div></div></details><details class=\"panel\"><summary>DA 2.ª.7 LCSP · composición de la mesa</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LCSP</span><p>«Los miembros electos que, en su caso, formen parte de la Mesa de contratación no podrán suponer más de un tercio del total de miembros de la misma. Actuará como Secretario un funcionario de la Corporación.»</p></div></div></details><details class=\"panel\"><summary>DA 12.ª LCSP · cómputo de plazos</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LCSP</span><p>«Los plazos establecidos por días en esta Ley se entenderán referidos a días naturales, salvo que en la misma se indique expresamente que solo deben computarse los días hábiles. No obstante, si el último día del plazo fuera inhábil, este se entenderá prorrogado al primer día hábil siguiente.»</p></div></div></details>\n</section><section class=\"card\" id=\"sem\"><h2>Semáforo de autoevaluación</h2>\n<p class=\"small\">Marca cada destreza. Lo que quede en rojo o ámbar va directo al cuaderno de errores.</p>\n<div id=\"sembox\"></div><div id=\"semres\"></div>\n</section><section class=\"card\" id=\"cierre\"><h2>Cierre y repaso espaciado</h2>\n<div class=\"idea\">La contratación del práctico se juega en dos preguntas: <b>qué cifra</b> (con o sin IVA, oferta o presupuesto) y <b>qué días</b> (naturales o hábiles, desde cuándo). Si respondes a esas dos antes de mirar las opciones, la pregunta está resuelta.</div>\n<div class=\"tw\"><table><thead><tr><th>Si te preguntan…</th><th>La base es…</th></tr></thead><tbody>\n<tr><td>Umbral, procedimiento u órgano</td><td>El <span class=\"t\" data-g=\"ve\">valor estimado</span>: sin IVA, con prórrogas y modificaciones</td></tr>\n<tr><td>Crédito o límite de gasto</td><td>El <span class=\"t\" data-g=\"pbl\">presupuesto base de licitación</span>, con IVA</td></tr>\n<tr><td><span class=\"t\" data-g=\"gdef\">Garantía definitiva</span></td><td>El precio ofertado, sin IVA</td></tr>\n<tr><td>Penalidad del 3 % o garantía provisional</td><td>El PBL, sin IVA</td></tr>\n<tr><td>Modificación</td><td>El <span class=\"t\" data-g=\"pinicial\">precio inicial</span>, con el tope del pliego</td></tr>\n</tbody></table></div>\n<div class=\"box ej\"><span class=\"lbl\">Calendario de repaso espaciado</span><ul>\n<li><b>Lunes 9 de noviembre de 2026</b> (24 h): rehaz solo los fallos del supuesto que elegiste.</li>\n<li><b>Miércoles 11 de noviembre</b> (3 días): el <b>otro</b> supuesto, cronometrado.</li>\n<li><b>Domingo 15 de noviembre</b> (7 días): la tabla de cifras de memoria y los dos mapas de solución en papel.</li>\n<li><b>Domingo 29 de noviembre</b> (21 días): los dos supuestos seguidos, con penalización, en 60 minutos.</li></ul></div>\n</section>";
</script>

   var c=(dow+d-1)%7, cls=FEST['2027-'+(m+1)+'-'+d]?'fe':(c>4?'we':'');
   h+='<td'+(cls?' class="'+cls+'"':'')+'>'+d+'</td>';

 });
 document.getElementById('calbox').innerHTML=h;

/* ═══ Mejoras de interacción · Bloque II ═══ */
(function(){
"use strict";
var K_THEME="oposi_bII_theme", K_FS="oposi_bII_fs", K_STREAK="oposi_bII_streak";
function load(k,f){try{var v=localStorage.getItem(k);return v?JSON.parse(v):f;}catch(e){return f;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
var root=document.documentElement;

/* Tema persistente (sobrescribe el toggle simple anterior) */
var saved=load(K_THEME,null);
if(saved){root.setAttribute("data-theme",saved);}
else if(window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches){root.setAttribute("data-theme","dark");}
var bt=document.getElementById("theme");
if(bt)bt.onclick=function(){
  var n=root.getAttribute("data-theme")==="dark"?"light":"dark";
  root.setAttribute("data-theme",n);save(K_THEME,n);
};

/* Tamaño de texto persistente · solo afecta al cuerpo de la página */
var fs=load(K_FS,16);
function setFs(v){
  fs=Math.max(13,Math.min(22,v));
  root.style.setProperty("--z",(fs/16).toFixed(4));
  save(K_FS,fs);
}
setFs(fs);

/* Racha compartida con el índice */
(function(){
  var el=document.getElementById("streakN");if(!el)return;
  var hoy=new Date().toISOString().slice(0,10);
  var s=load(K_STREAK,{last:null,n:0});
  if(s.last!==hoy){
    var ayer=new Date(Date.now()-864e5).toISOString().slice(0,10);
    s.n=(s.last===ayer)?s.n+1:1;s.last=hoy;save(K_STREAK,s);
  }
  el.textContent=s.n;
})();

/* Reveal on scroll para las tarjetas */
function reveal(){
  var els=document.querySelectorAll("section.card:not(.rv)");
  if(!els.length)return;
  if(!("IntersectionObserver" in window)){return;}
  var io=new IntersectionObserver(function(es){
    es.forEach(function(en){if(en.isIntersecting){en.target.classList.add("in");io.unobserve(en.target);}});
  },{threshold:.06,rootMargin:"0px 0px -30px 0px"});
  Array.prototype.forEach.call(els,function(el){el.classList.add("rv");io.observe(el);});
}

/* Sección activa en el índice lateral */
function spy(){
  var links=document.querySelectorAll("nav.side a[href^='#']");
  if(!links.length||!("IntersectionObserver" in window))return;
  var map={};
  Array.prototype.forEach.call(links,function(a){
    var t=document.getElementById(a.getAttribute("href").slice(1));
    if(t)map[t.id]=a;
  });
  var io=new IntersectionObserver(function(es){
    es.forEach(function(en){
      if(en.isIntersecting){
        Array.prototype.forEach.call(links,function(a){a.classList.remove("on");});
        if(map[en.target.id])map[en.target.id].classList.add("on");
      }
    });
  },{rootMargin:"-80px 0px -70% 0px",threshold:0});
  Object.keys(map).forEach(function(id){io.observe(document.getElementById(id));});
}

/* Ripple en botones */
document.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b||b.classList.contains("navtoggle"))return;
  var r=b.getBoundingClientRect(),d=Math.max(r.width,r.height),s=document.createElement("span");
  s.className="ripple";s.style.width=s.style.height=d+"px";
  s.style.left=(e.clientX-r.left-d/2)+"px";s.style.top=(e.clientY-r.top-d/2)+"px";
  b.appendChild(s);setTimeout(function(){if(s.parentNode)s.parentNode.removeChild(s);},560);
});

/* Atajos de teclado */

function init(){reveal();spy();}
if(document.getElementById("main")&&document.getElementById("main").children.length){init();}
else{setTimeout(init,60);}
addEventListener("load",function(){setTimeout(init,80);});
})();


</script>
<script>


/* ═══ Parser de respuestas: estructura semántica ═══ */
var FCFMT=(function(){
  var CITA=/\s*\(((?:arts?\.|DA\b|DT\b|disp\.)[^)]*)\)\s*\.?\s*$/i;
  var strip=function(h){return h.replace(/<[^>]+>/g,"");};

  function esc(s){return s;}

  function parse(raw){
    var out={verdict:null,cite:null,kind:"p",items:[],text:""};
    var body=String(raw).trim();

    /* 1 ── Cita legal al final */
    var m=body.match(CITA);
    if(m){out.cite=m[1].replace(/\s+/g," ").trim();body=body.slice(0,m.index).trim();}
    body=body.replace(/[.;,\s]+$/,"");

    /* 2 ── Veredicto Sí / No inicial */
    var v=strip(body).match(/^(Sí|Sí,|No|No,)[.:,]?\s/);
    if(v){
      out.verdict=/^Sí/.test(v[1])?"si":"no";
      body=body.replace(/^(<[^>]+>\s*)*(Sí|No)[.,:]?\s*/,"").trim();
      body=body.replace(/^en\s/,"En ");
    }

    /* 3 ── Enumeración con · */
    var parts=body.split(/\s+·\s+/);
    if(parts.length>=2){
      out.kind="list";
      var letras=parts.filter(function(p){return /^\s*<?[a-h]\)/.test(strip(p));}).length;
      out.marker = letras>=parts.length-1 ? "alpha" : "num";
      out.items=parts.map(function(p){
        return p.replace(/^\s*[a-h]\)\s*/,"").replace(/[.\s]+$/,"").trim();
      }).filter(Boolean);
      return out;
    }

    /* 4 ── Cláusulas contrapuestas con ; */
    var semi=body.split(/;\s+/);
    if(semi.length>=2&&semi.length<=3&&semi.every(function(s){return strip(s).length>14;})){
      out.kind="clauses";
      out.items=semi.map(function(s){return s.replace(/[.\s]+$/,"").trim();});
      return out;
    }

    /* 5 ── Párrafo */
    out.text=body;
    return out;
  }

  function render(raw){
    var d=parse(raw),h="";

    if(d.verdict){
      h+='<span class="fc-verdict '+d.verdict+'">'+(d.verdict==="si"?"✓ Sí":"✗ No")+'</span>';
    }

    if(d.kind==="list"){
      h+='<ol class="fc-list '+d.marker+'">';
      d.items.forEach(function(it){h+='<li>'+it+'</li>';});
      h+='</ol>';
    }else if(d.kind==="clauses"){
      h+='<div class="fc-clauses">';
      d.items.forEach(function(it){h+='<p>'+it+'</p>';});
      h+='</div>';
    }else if(d.text){
      h+='<p class="fc-p">'+d.text+'</p>';
    }

    if(d.cite){
      h+='<span class="fc-cite"><span class="s">§</span>'+d.cite+'</span>';
    }
    return {html:h,struct:(d.kind!=="p"||!!d.verdict||strip(raw).length>150)};
  }
  return {parse:parse,render:render};
})();

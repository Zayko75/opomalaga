<script>
const NAV=[["intro", "Cómo funciona"], ["cal", "Calendario de 2027"], ["sa", "Supuesto A · Abierto ordinario"], ["sb", "Supuesto B · Cinco expedientes"], ["nota", "Tu nota"], ["cifras", "Tabla de cifras y plazos"], ["legal", "Los preceptos, literales"], ["sem", "Semáforo de autoevaluación"], ["cierre", "Cierre y repaso espaciado"]];
const GLOS={"pbl": ["Presupuesto base de licitación", "El límite máximo de gasto que el órgano de contratación puede comprometer con el contrato, IVA incluido (art. 100.1 LCSP). No incluye prórrogas ni modificaciones."], "ve": ["Valor estimado", "El importe total del contrato sin IVA, incluidas las prórrogas eventuales y las modificaciones previstas en el pliego (art. 101 LCSP). Con él se miden los umbrales, el procedimiento y el órgano competente."], "gdef": ["Garantía definitiva", "Fianza del 5 % del precio ofertado, sin IVA, que constituye el licitador con la mejor oferta antes de la adjudicación (art. 107.1). No se exige en la vía abreviada del art. 159.6."], "menor": ["Contrato menor", "El de valor estimado inferior a 40.000 € en obras o a 15.000 € en suministros y servicios. Se adjudica directamente, con informe de necesidad, aprobación del gasto y factura (art. 118)."], "mesa": ["Mesa de contratación", "Órgano colegiado de asistencia técnica que califica la documentación, valora las ofertas y propone la adjudicación (art. 326). En las entidades locales su composición la fija la DA 2.ª.7."], "anormal": ["Oferta anormalmente baja", "La que, según los parámetros del pliego, hace presumir que no podrá cumplirse. Solo puede excluirse después de pedir al licitador que la justifique (art. 149)."], "perfil": ["Perfil de contratante", "Página web del órgano de contratación donde se publican los anuncios, los pliegos, la adjudicación y la formalización de sus contratos."], "juicio": ["Criterio de juicio de valor", "Criterio que no se puntúa con una fórmula, sino con la valoración técnica de quien lo examina (una memoria, un proyecto). Se valora siempre antes que los criterios de fórmula."], "simpl": ["Procedimiento abierto simplificado", "Procedimiento abierto más ágil para contratos de cuantía media con poco peso de los juicios de valor (art. 159). Tiene una variante aún más ligera, la abreviada del art. 159.6."], "abrev": ["Tramitación abreviada", "Variante del simplificado para obras de menos de 80.000 € y suministros o servicios de menos de 60.000 €: plazo de 10 días hábiles, sin solvencia, sin garantía definitiva, único sobre y solo fórmulas (art. 159.6)."], "rolece": ["Registro Oficial de Licitadores", "Registro Oficial de Licitadores y Empresas Clasificadas del Sector Público. En el simplificado ordinario los licitadores deben estar inscritos en él, o en el autonómico, en la fecha final de presentación de ofertas."], "negsp": ["Negociado sin publicidad", "Procedimiento en el que se negocia con empresas elegidas sin publicar anuncio de licitación. Solo cabe en los supuestos tasados del art. 168."], "formal": ["Formalización", "La firma del documento administrativo del contrato. Con ella se perfecciona el contrato, salvo los menores y los basados en acuerdos marco (art. 36)."], "naturales": ["Días naturales", "Todos los días del calendario. En la LCSP son la regla cuando el plazo se fija en «días» sin más (DA 12.ª). Si el último día es inhábil, el plazo se prorroga al primer hábil siguiente."], "habiles": ["Días hábiles", "Todos menos los sábados, los domingos y los festivos. La LCSP solo los usa cuando lo dice expresamente («diez días hábiles»)."], "sara": ["Regulación armonizada", "Régimen reforzado, de origen europeo, para los contratos que alcanzan los umbrales de los arts. 20 a 23 LCSP: publicación en el Diario Oficial de la Unión Europea y plazos más largos."], "recesp": ["Recurso especial en materia de contratación", "Recurso ante un órgano independiente contra ciertos actos de los contratos de mayor importe (art. 44). Aquí solo importa como dato: si cabe, la formalización debe esperar 15 días hábiles."], "pinicial": ["Precio inicial", "El precio del contrato tal como se adjudicó. Es la base sobre la que se calculan los porcentajes de modificación del art. 204."]};
const TEST=[["A01", "A", "¿Cuál es el importe <b>anual</b> del servicio con el IVA incluido?", ["50.000 €", "60.500 €", "10.500 €", "121.000 €"], 1, ["Es el precio anual sin IVA. Le falta la cuota del impuesto.", "Correcta. 50.000 × 1,21 = 60.500 €. Es lo que el Ayuntamiento paga cada año.", "Es solo la cuota de IVA: 50.000 × 0,21. Falta sumarle la base.", "Es el importe de los dos años con IVA, no el de un año."], "art. 100.1 LCSP"], ["A02", "A", "¿Cuál es el <span class=\"t\" data-g=\"pbl\">presupuesto base de licitación</span> del contrato?", ["100.000 €", "181.500 €", "160.000 €", "121.000 €"], 3, ["Es el PBL sin IVA. El art. 100.1 lo define con el IVA incluido.", "Suma también el año de prórroga con IVA. La prórroga cuenta para el valor estimado, no para el PBL.", "Es el valor estimado: otra magnitud, sin IVA y con prórroga y modificación.", "Correcta. El PBL es el límite máximo de gasto del contrato, «incluido el Impuesto sobre el Valor Añadido» (art. 100.1): 2 años × 60.500 € = 121.000 €. La prórroga y la modificación no entran: aún no son gasto comprometido."], "art. 100.1 LCSP"], ["A03", "A", "¿Cuál es el <span class=\"t\" data-g=\"ve\">valor estimado</span> del contrato?", ["150.000 €", "160.000 €", "100.000 €", "193.600 €"], 1, ["Olvida la modificación. El art. 101.2.c) obliga a tomar «el importe máximo que este pueda alcanzar, teniendo en cuenta la totalidad de las modificaciones al alza previstas».", "Correcta. Sin IVA (art. 101.1.a): 100.000 € de los dos años + 50.000 € de la prórroga eventual (art. 101.2.a) + 10.000 € de la modificación prevista en el pliego (art. 101.2.c).", "Solo cuenta la duración inicial. Faltan la prórroga y la modificación.", "Es 160.000 × 1,21. El valor estimado se calcula siempre sin IVA."], "art. 101 LCSP"], ["A04", "A", "¿Está el contrato sujeto a regulación armonizada?", ["Sí, porque el valor estimado supera 140.000 €", "Sí, porque el presupuesto con IVA y la prórroga supera 181.000 €", "No, porque los contratos de servicios nunca están sujetos a regulación armonizada", "No: para una entidad local el umbral de los servicios es 216.000 € y el valor estimado es 160.000 €"], 3, ["140.000 € es el umbral del art. 22.1.a), que solo rige para la Administración General del Estado, sus organismos autónomos y la Seguridad Social.", "El umbral nunca se compara con cifras con IVA, y para una entidad local es 216.000 €.", "Falso: el art. 22 regula precisamente cuándo lo están.", "Correcta. Art. 22.1.b): 216.000 € para entidades distintas de la Administración General del Estado. Se compara con el valor estimado, sin IVA."], "art. 22.1 LCSP"], ["A05", "A", "¿Quién es el órgano de contratación?", ["El Pleno, porque el contrato es plurianual", "La Junta de Gobierno Local", "El Pleno, porque supera el 10 % de los recursos ordinarios", "El Alcalde"], 3, ["Ser plurianual no basta. La DA 2.ª.1 admite los plurianuales en manos del Alcalde si no superan 4 años, prórrogas incluidas, y el porcentaje.", "Solo en los municipios de gran población (DA 2.ª.4). Valdeolivos es de régimen común.", "El 10 % de 21.000.000 € son 2.100.000 €. 160.000 € queda muy lejos.", "Correcta. DA 2.ª.1: el valor estimado (160.000 €) no supera el 10 % de los recursos ordinarios (2.100.000 €) y la duración, prórroga incluida, es de 3 años, no superior a 4."], "DA 2.ª LCSP"], ["A06", "A", "¿Por qué no puede seguirse el procedimiento abierto <b>simplificado</b>?", ["Por dos motivos: el valor estimado no es inferior a 140.000 € y el juicio de valor pesa más del 25 %", "Solo por el juicio de valor: por importe cabría, porque para una entidad local el límite es 216.000 €", "Porque el contrato es susceptible de recurso especial", "Sí puede seguirse: ninguno de los dos requisitos del art. 159.1 lo impide"], 0, ["Correcta. El art. 159.1 exige dos condiciones y aquí fallan las dos. La letra a) remite, para servicios, a la cantidad del art. 22.1.<b>a)</b>, que es 140.000 €, y 160.000 € la supera. La letra b) limita el juicio de valor al 25 % (45 % si la prestación es intelectual), y aquí pesa un 30 %.", "El art. 159.1.a) no remite a la letra b) del art. 22.1, sino a la a): 140.000 €, para cualquier entidad. El importe también impide el simplificado.", "Esa circunstancia no impide el simplificado. Solo afecta al plazo de formalización (art. 153.3).", "Fallan los dos: el importe (160.000 € frente a 140.000 €) y el peso del juicio de valor (30 % frente a 25 %)."], "art. 159.1 LCSP"], ["A07", "A", "¿Quién valora la memoria técnica, que es el criterio de juicio de valor?", ["La mesa de contratación, porque el juicio de valor (30) pesa menos que los criterios automáticos (70)", "Un comité de al menos tres expertos no adscritos al órgano proponente", "Los servicios técnicos, en un plazo no superior a siete días", "El Alcalde, como órgano de contratación, en la resolución de adjudicación"], 0, ["Correcta. El comité de expertos solo interviene cuando el juicio de valor pesa más que los criterios de fórmula (art. 146.2.a). En los demás casos valora la mesa (art. 146.2.b).", "Solo se exige cuando el juicio de valor pesa más que los criterios automáticos. Aquí es al revés.", "Esa regla es del procedimiento abierto simplificado (art. 159.4.e). Este es un abierto ordinario.", "El órgano de contratación adjudica. La valoración se hace antes, en la mesa."], "art. 146.2 LCSP"], ["A08", "A", "¿Cómo deben presentar los licitadores la documentación?", ["Todo en un único sobre o archivo electrónico", "Un sobre con la documentación administrativa y otro con toda la proposición", "Solo una declaración responsable, que sustituye a la proposición", "La documentación administrativa del art. 140 en un sobre y la proposición en otros dos: uno de juicio de valor y otro de fórmulas"], 3, ["Eso es propio de la tramitación abreviada del simplificado (art. 159.6.c), o del simplificado sin juicios de valor.", "Falta separar la parte de juicio de valor de la de fórmulas. Lo exige el art. 157.2.", "La declaración responsable sustituye a la documentación de aptitud, no a la oferta.", "Correcta. Art. 157.1: la documentación del art. 140 va en sobre distinto al de la proposición. Art. 157.2: con varios criterios, la proposición se divide en dos sobres."], "art. 157 LCSP"], ["A09", "A", "El anuncio se publicó en el perfil de contratante el <b>viernes 5 de marzo</b>. ¿Cuál es la primera fecha en que podía terminar el plazo de presentación de ofertas?", ["Lunes 22 de marzo", "Sábado 20 de marzo", "Martes 30 de marzo", "Miércoles 31 de marzo"], 0, ["Correcta. Mínimo de 15 días (art. 156.6), naturales (DA 12.ª), contados desde el día siguiente a la publicación: del 6 al 20 de marzo. El 20 es sábado: el plazo se prorroga al primer día hábil siguiente (DA 12.ª), el lunes 22.", "El cómputo es correcto, pero el último día es inhábil y se prorroga al primer hábil siguiente (DA 12.ª).", "Cuenta 15 días hábiles. La LCSP dice «días» sin más, y por la DA 12.ª son naturales.", "Aplica los 26 días de las obras (art. 156.6, segundo inciso). Esto es un servicio."], "art. 156.6 y DA 12.ª LCSP"], ["A10", "A", "¿Qué ocurre con la oferta de Fotón Energía, presentada el 23 de marzo?", ["Se admite si se presentó por medios electrónicos", "Se admite con una penalización del 3 % del presupuesto base de licitación", "Se requiere a la empresa para que subsane en tres días", "No se admite, porque se presentó fuera del plazo que terminaba el 22 de marzo"], 3, ["El medio de presentación no altera el plazo.", "Esa penalidad es para quien retira su oferta (art. 150.2) o no formaliza (art. 153.4). No guarda relación con presentar tarde.", "El retraso no es subsanable. La subsanación se refiere a defectos de la documentación, no al plazo.", "Correcta. El plazo de presentación es un límite para todos los licitadores. Una oferta extemporánea no entra en la licitación."], "art. 156.6 LCSP"], ["A11", "A", "El primer sobre de las proposiciones se abrió el 30 de marzo y el de fórmulas, el 13 de abril. ¿Se respeta el plazo de apertura?", ["No, porque el sobre de fórmulas se abrió más de 20 días después del 22 de marzo", "Sí: hay 20 días desde que terminó el plazo de presentación y basta con abrir el primer sobre dentro de ellos", "No, porque la apertura debía hacerse al día siguiente de terminar el plazo", "Sí, porque la Ley no fija plazo para la apertura"], 1, ["Con varios sobres, el plazo se cumple con abrir el primero (art. 157.3, segundo párrafo).", "Correcta. Art. 157.3: plazo máximo de 20 días desde que termina el de presentación. Si hay varios sobres, «se entenderá cumplido cuando se haya abierto, dentro del mismo, el primero». El 30 de marzo está dentro.", "La Ley fija un máximo de 20 días, no la apertura al día siguiente.", "Sí lo fija: 20 días (art. 157.3)."], "art. 157.3 LCSP"], ["A12", "A", "La Alcaldía propone una mesa con seis miembros con voz y voto: el concejal de Obras, que preside; la Secretaria; el Interventor; la ingeniera municipal, y dos concejales más. Un funcionario hará de secretario. ¿Es correcta esta composición?", ["Sí: tiene más de tres miembros e incluye a la Secretaria y al Interventor", "No, porque la mesa no puede presidirla un concejal", "No: son tres miembros electos de seis y no pueden pasar de un tercio, es decir, de dos", "No, porque en un procedimiento abierto la mesa es potestativa y no debe constituirse"], 2, ["Cumple el mínimo de tres y los vocales obligatorios, pero no el tope de electos.", "Sí puede: la preside «un miembro de la Corporación o un funcionario de la misma» (DA 2.ª.7).", "Correcta. DA 2.ª.7: «Los miembros electos [...] no podrán suponer más de un tercio del total». Con seis miembros, el máximo es dos. El presidente concejal también cuenta.", "En el abierto la mesa es obligatoria (art. 326.1). Es potestativa en el negociado sin publicidad y en el art. 159.6."], "DA 2.ª.7 LCSP"], ["A13", "A", "Según el parámetro de anormalidad del pliego, ¿qué ofertas se presumen anormalmente bajas?", ["Solo la de Luminia", "Luminia y Alumbrados Guadalhorce", "Ninguna, porque ninguna baja más de un 25 %", "Luminia, Guadalhorce y Electro Sur"], 0, ["Correcta. El umbral económico es 80.000 € (20 % por debajo de 100.000 €). Por precio, quedan por debajo Luminia (78.000 €) y Guadalhorce (79.500 €), pero el pliego exige además más de 25 puntos en la memoria. Solo Luminia (27) cumple las dos condiciones.", "Guadalhorce está por debajo de 80.000 €, pero solo tiene 18 puntos de memoria. El parámetro del pliego mira la oferta en su conjunto (art. 149.2.b).", "El pliego fija un 20 %. Lo decide el pliego, no un porcentaje legal general.", "Electro Sur (84.000 €) está por encima del umbral de 80.000 €."], "art. 149.2 LCSP"], ["A14", "A", "La mesa sospecha que la oferta de Luminia es inviable. ¿Qué debe hacer?", ["Excluirla directamente, porque el pliego ya fija el umbral", "Requerirle para que justifique y desglose su oferta, dándole un plazo suficiente", "Clasificarla la primera sin más trámite, porque es la mejor puntuada", "Pedirle que mejore su precio al alza"], 1, ["El umbral solo crea una presunción. Excluir sin oír al licitador está vedado (art. 149.1).", "Correcta. Art. 149.1: solo puede excluirse «previa tramitación del procedimiento» del artículo. Art. 149.4: hay que requerir al licitador, con «plazo suficiente», y pedir asesoramiento técnico.", "La presunción obliga a abrir el trámite de justificación antes de seguir.", "En el abierto está excluida toda negociación con los licitadores (art. 156.1)."], "art. 149 LCSP"], ["A15", "A", "Luminia presenta una justificación incompleta, sin desglose de los costes de personal. Si el órgano de contratación rechaza su oferta, ¿a quién se requiere la documentación?", ["A Alumbrados Guadalhorce, porque es la de precio más bajo entre las que quedan", "A Instalaciones Martín", "A Electro Sur, la siguiente en el orden de clasificación", "A nadie: la licitación se declara desierta"], 2, ["El criterio no es el precio, sino la puntuación total con todos los criterios (arts. 145 y 150.1).", "Es la última clasificada, con 70 puntos.", "Correcta. Una justificación incompleta no explica satisfactoriamente la oferta (art. 149.4, último párrafo). Se excluye de la clasificación y se adjudica a la mejor según ese orden (art. 149.6): Electro Sur, 88 puntos.", "No puede declararse desierta si hay alguna oferta admisible (art. 150.3)."], "arts. 149.6 y 150 LCSP"], ["A16", "A", "¿Cuál es el plazo máximo para adjudicar este contrato?", ["Quince días desde la apertura de las proposiciones", "Dos meses desde que terminó el plazo de presentación de ofertas", "Cinco días hábiles desde la apertura", "Dos meses desde el primer acto de apertura, ampliados en 15 días hábiles por el trámite de anormalidad"], 3, ["Ese plazo es para cuando el único criterio es el precio (art. 158.1).", "Se cuenta desde la apertura, no desde que termina la presentación.", "Cinco días hábiles es el plazo para adjudicar una vez recibida la documentación (art. 150.3), no el máximo del procedimiento.", "Correcta. Hay varios criterios, así que el plazo es de dos meses (art. 158.2) y se cuenta desde la primera apertura. Se amplía en 15 días hábiles porque se tramitó el art. 149.4 (art. 158.3)."], "art. 158 LCSP"], ["A17", "A", "Electro Sur recibe el requerimiento de documentación el <b>lunes 3 de mayo</b>. ¿Cuál es el último día para presentarla?", ["Lunes 17 de mayo", "Jueves 13 de mayo", "Miércoles 12 de mayo", "Martes 18 de mayo"], 0, ["Correcta. Diez días hábiles contados desde el siguiente a la recepción (art. 150.2): del 4 al 7 son cuatro; del 10 al 14, nueve; el 17, diez.", "Cuenta diez días naturales. El art. 150.2 dice expresamente «hábiles».", "Son siete días hábiles, el plazo del simplificado (art. 159.4.f). Aquí rigen diez.", "Se pasa un día. Quizá empezó a contar el mismo 3 de mayo como día cero y sumó once."], "art. 150.2 LCSP"], ["A18", "A", "¿Qué <span class=\"t\" data-g=\"gdef\">garantía definitiva</span> debe constituir Electro Sur?", ["5.082 €", "4.200 €", "5.000 €", "8.000 €"], 1, ["Calcula el 5 % sobre el precio con IVA (101.640 €). El art. 107.1 excluye el IVA.", "Correcta. 5 % del precio final ofertado, sin IVA (art. 107.1): 84.000 × 0,05 = 4.200 €.", "Calcula sobre el PBL sin IVA. La base es el precio ofertado. El PBL solo se usa con precios unitarios (art. 107.3).", "Calcula sobre el valor estimado, que no es la base de la garantía."], "art. 107.1 LCSP"], ["A19", "A", "Si Electro Sur no hubiera atendido el requerimiento a tiempo, ¿qué consecuencia económica tendría?", ["Una penalidad de 3.630 €", "Una penalidad de 2.520 €", "Una penalidad de 3.000 €, el 3 % del presupuesto base de licitación sin IVA", "Ninguna: simplemente se pasa al siguiente licitador"], 2, ["Es el 3 % del PBL con IVA (121.000 €). La Ley dice «IVA excluido».", "Es el 3 % de su oferta (84.000 €). La base es el PBL.", "Correcta. Art. 150.2: se entiende retirada la oferta y se le exige «el 3 por ciento del presupuesto base de licitación, IVA excluido»: 100.000 × 0,03 = 3.000 €.", "Se pasa al siguiente, sí, pero además se le exige la penalidad."], "art. 150.2 LCSP"], ["A20", "A", "Electro Sur entrega toda la documentación el <b>miércoles 12 de mayo</b>. ¿Hasta cuándo tiene el Alcalde para adjudicar?", ["Lunes 17 de mayo", "Miércoles 26 de mayo", "Miércoles 19 de mayo", "Viernes 14 de mayo"], 2, ["Cuenta cinco días naturales (del 13 al 17). El art. 150.3 dice «hábiles».", "Son diez días hábiles. El plazo es de cinco.", "Correcta. Cinco días hábiles siguientes a la recepción (art. 150.3): 13, 14, 17, 18 y 19 de mayo.", "Solo cuenta dos días."], "art. 150.3 LCSP"], ["A21", "A", "La notificación de la adjudicación se remite a los licitadores el <b>jueves 20 de mayo</b>. El contrato es susceptible de recurso especial. ¿Cuál es el primer día en que puede formalizarse?", ["Viernes 11 de junio", "Jueves 10 de junio", "Viernes 4 de junio", "Martes 25 de mayo"], 0, ["Correcta. No puede formalizarse «antes de que transcurran quince días hábiles» desde la remisión (art. 153.3). Los quince días hábiles van del 21 de mayo al 10 de junio, así que el primer día posible es el 11.", "Es el último de los quince días hábiles. Hasta que no transcurre entero no puede formalizarse.", "Cuenta quince días naturales. El art. 153.3 exige hábiles.", "Aplica solo los cinco días del requerimiento. Antes hay que esperar los quince días hábiles."], "art. 153.3 LCSP"], ["A22", "A", "Pasado ese plazo sin recurso, Electro Sur recibe el requerimiento para formalizar el <b>viernes 11 de junio</b>. ¿Hasta cuándo puede firmar?", ["Viernes 18 de junio", "Martes 15 de junio", "Miércoles 16 de junio", "Viernes 25 de junio"], 2, ["Cuenta cinco días hábiles. La Ley no dice «hábiles», así que son naturales.", "Se queda en cuatro días.", "Correcta. «Plazo no superior a cinco días a contar desde el siguiente» (art. 153.3). Son naturales (DA 12.ª): del 12 al 16. El 16 es miércoles, día hábil.", "Mezcla este plazo con los quince días hábiles de espera."], "art. 153.3 y DA 12.ª LCSP"], ["A23", "A", "¿En qué plazo debe publicarse la adjudicación en el perfil de contratante?", ["15 días", "10 días hábiles", "Un mes", "Solo se publica el anuncio de formalización, no la adjudicación"], 0, ["Correcta. Art. 151.1: la resolución motivada se notifica a candidatos y licitadores y se publica en el perfil «en el plazo de 15 días».", "No es el plazo del art. 151.1.", "No es el plazo del art. 151.1.", "Se publican las dos: la adjudicación (art. 151.1) y la formalización (art. 154.1)."], "art. 151.1 LCSP"], ["A24", "A", "Al final del segundo año, el Ayuntamiento quiere prorrogar. ¿Qué afirmación es correcta?", ["Se produce sola si ninguna de las partes dice nada", "La acuerda el órgano de contratación y obliga a la empresa si se le preavisa con al menos dos meses", "Necesita siempre la conformidad de la empresa", "No es posible, porque superaría los cinco años de duración máxima"], 1, ["«En ningún caso podrá producirse la prórroga por el consentimiento tácito de las partes» (art. 29.2).", "Correcta. Art. 29.2: la prórroga la acuerda el órgano de contratación y es obligatoria para el empresario si el preaviso es de al menos dos meses, salvo que el pliego fije uno mayor.", "Con el preaviso legal es obligatoria para el empresario.", "Con la prórroga son tres años. El máximo de cinco del art. 29.4 queda lejos."], "art. 29.2 LCSP"], ["A25", "A", "Durante el contrato surge la necesidad prevista en el pliego (nuevas zonas urbanizadas). ¿Cuál es el importe máximo de la modificación?", ["10.000 €", "16.800 €", "8.400 €, el 10 % del precio inicial de 84.000 €", "16.000 €"], 2, ["Es el 10 % del PBL sin IVA. Sirvió para calcular el valor estimado antes de licitar, pero el contrato ya tiene precio.", "Es el 20 % del precio. Ese es el máximo legal del art. 204.1, pero este pliego solo permite el 10 %.", "Correcta. El pliego la limita al 10 % del precio inicial, que es el de adjudicación: 84.000 × 0,10 = 8.400 €. El art. 204.1 marca un techo legal del 20 %, pero manda el pliego.", "Es el 10 % del valor estimado, que no es la base de la modificación."], "art. 204.1 LCSP"], ["B01", "B", "Expediente 1. ¿Puede adjudicarse el suministro de material deportivo como <span class=\"t\" data-g=\"menor\">contrato menor</span>?", ["No, porque con IVA (16.698 €) supera los 15.000 €", "Sí, porque es inferior a 40.000 €", "Sí: es un suministro de valor estimado inferior a 15.000 €", "No: solo cabe por procedimiento abierto simplificado abreviado"], 2, ["El umbral se mide sobre el valor estimado, que excluye el IVA (art. 101.1.a).", "40.000 € es el umbral de las obras. Aquí cabe por el de 15.000 €.", "Correcta. Art. 118.1: suministros y servicios por debajo de 15.000 €, sin IVA; obras por debajo de 40.000 €. 13.800 € < 15.000 €.", "Podría usarse, pero no es obligatorio: siendo menor, cabe la adjudicación directa (art. 131.3)."], "art. 118.1 LCSP"], ["B02", "B", "Expediente 1. ¿Qué exige la Ley en el expediente de este contrato menor?", ["Lo anterior y, además, el presupuesto de las obras", "Pliegos, mesa de contratación y anuncio en el perfil", "Solo la factura", "Un informe que justifique la necesidad y que no se altera el objeto, la aprobación del gasto y la factura"], 3, ["El presupuesto se añade solo en el contrato menor de obras (art. 118.4).", "Eso es propio de los procedimientos con licitación, no del contrato menor.", "La factura es necesaria pero no suficiente: faltan el informe y la aprobación del gasto.", "Correcta. Art. 118.2 (informe del órgano de contratación sobre la necesidad y la no alteración del objeto) y art. 118.3 (aprobación del gasto y factura)."], "art. 118 LCSP"], ["B03", "B", "Expediente 1. ¿Hay que formalizar el contrato menor en documento administrativo?", ["No: su existencia se acredita con los documentos del art. 118", "Sí, como cualquier contrato administrativo, en los quince días hábiles siguientes a la adjudicación", "Sí, pero puede sustituirse por escritura pública", "Solo si el contratista lo pide"], 0, ["Correcta. Art. 153.2. Además, los contratos menores son la excepción a la regla de que el contrato se perfecciona con su formalización (art. 36.1).", "Esa regla general (art. 153.1 y 3) no se aplica al contrato menor (art. 153.2).", "La escritura es una opción del contratista en los contratos que sí se formalizan (art. 153.1).", "La Ley no lo condiciona a eso: basta con los documentos del art. 118."], "arts. 153.2 y 36.1 LCSP"], ["B04", "B", "Expediente 1. En febrero se compró a la misma empresa otro lote de material deportivo por 4.000 €, también como contrato menor. ¿Qué dice el texto vigente del art. 118?", ["Lo prohíbe: un empresario no puede tener dos contratos menores que juntos superen 15.000 €", "Obliga a sumar los dos importes y a licitar por procedimiento abierto", "No lo prohíbe por sí solo: exige el informe que justifique que no se altera el objeto para eludir los umbrales", "Obliga a esperar un año antes de volver a contratar con la misma empresa"], 2, ["Esa regla figuraba en una redacción anterior del art. 118 y no está en el texto consolidado de la biblioteca.", "La Ley no impone esa suma automática. Lo que prohíbe es fraccionar para eludir umbrales (art. 99.2).", "Correcta. El art. 118.2 vigente pide justificar que no se altera el objeto «con el fin de evitar la aplicación de los umbrales». Si se troceara una única necesidad para no licitar, habría fraccionamiento prohibido por el art. 99.2.", "No existe esa regla en la LCSP."], "arts. 118.2 y 99.2 LCSP"], ["B05", "B", "Expediente 2. Servicio de monitores: 55.000 €, un año, sin prórroga y solo criterios de fórmula. ¿Qué tramitación puede seguirse?", ["El procedimiento abierto simplificado abreviado", "Contrato menor", "Procedimiento negociado sin publicidad por razón de la cuantía", "Solo el procedimiento abierto ordinario"], 0, ["Correcta. Art. 159.6: servicios de valor estimado inferior a 60.000 €, sin prestaciones intelectuales. Además, solo hay criterios de fórmula, que es lo que exige la letra c).", "Supera 15.000 €, el umbral de los servicios (art. 118.1).", "El negociado sin publicidad solo cabe en los supuestos tasados del art. 168. Ninguno es la cuantía.", "Podría usarse, pero la Ley permite la vía abreviada para este importe."], "art. 159.6 LCSP"], ["B06", "B", "Expediente 2. El anuncio se publica en el perfil el <b>jueves 18 de marzo</b>. ¿Cuál es el primer día en que puede terminar el plazo de ofertas?", ["Jueves 1 de abril", "Lunes 29 de marzo", "Lunes 5 de abril", "Viernes 2 de abril"], 2, ["Cuenta diez días hábiles, pero se salta el Jueves y el Viernes Santo, que son festivos.", "Cuenta diez días naturales (el 28 es domingo y pasa al 29). La Ley dice «días hábiles».", "Correcta. Al menos diez días hábiles desde el siguiente a la publicación (art. 159.6.a): 19, 22, 23 y 24 de marzo; 25 y 26 son festivos; 29, 30 y 31 de marzo; 1, 2 y 5 de abril.", "Cuenta quince días naturales, el plazo del simplificado ordinario (art. 159.3)."], "art. 159.6.a LCSP"], ["B07", "B", "Expediente 2. ¿Deben acreditar los licitadores su solvencia económica y técnica?", ["No: en la tramitación abreviada se les exime", "Sí, mediante la inscripción en el Registro de Licitadores", "Sí, pero solo la técnica", "Sí, aportándola con la garantía definitiva"], 0, ["Correcta. Art. 159.6.b): «Se eximirá a los licitadores de la acreditación de la solvencia económica y financiera y técnica o profesional».", "La inscripción es un requisito del simplificado ordinario (art. 159.4.a). En el abreviado no se exige acreditar la solvencia.", "La exención alcanza a las dos.", "En el abreviado tampoco hay garantía definitiva (art. 159.6.f)."], "art. 159.6.b LCSP"], ["B08", "B", "Expediente 2. La adjudicataria ofrece 50.000 € sin IVA. ¿Qué garantía definitiva debe constituir?", ["2.500 €", "Ninguna", "3.025 €", "1.650 €"], 1, ["Sería el 5 % del art. 107.1, pero en la vía abreviada no se exige.", "Correcta. Art. 159.6.f): «No se requerirá la constitución de garantía definitiva».", "Además de no exigirse, calcula sobre el precio con IVA.", "Es el 3 % del presupuesto, el tope de la garantía provisional (art. 106.2). No procede."], "art. 159.6.f LCSP"], ["B09", "B", "Expediente 2. ¿Cómo puede formalizarse este contrato?", ["Solo en escritura pública", "Con la firma de aceptación de la resolución de adjudicación por el contratista", "Con la factura, como en el contrato menor", "No se formaliza: se perfecciona con la adjudicación"], 1, ["La escritura es siempre voluntaria y a costa del contratista (art. 153.1).", "Correcta. Art. 159.6.g).", "Eso es lo propio del menor (art. 153.2), no del abreviado.", "Se perfeccionan con la adjudicación los contratos basados en un acuerdo marco (art. 36.3). No es el caso."], "art. 159.6.g LCSP"], ["B10", "B", "Expediente 2. ¿Es obligatorio constituir mesa de contratación?", ["Sí, en todo procedimiento abierto simplificado", "No, porque la sustituye el Pleno", "Sí, porque hay más de tres licitadores", "No: en la tramitación del art. 159.6 su constitución es potestativa"], 3, ["Es la regla del simplificado ordinario. Para la vía abreviada, el art. 326.1 la hace potestativa.", "El Pleno no valora ofertas: no es un órgano de asistencia.", "La Ley no hace depender la mesa del número de licitadores.", "Correcta. Art. 326.1, inciso final: «En los procedimientos a los que se refiere el artículo 159.6 será igualmente potestativa la constitución de la mesa»."], "art. 326.1 LCSP"], ["B11", "B", "Expediente 2. ¿Cómo se abren las ofertas?", ["En acto público, como exige el art. 157.4 para la oferta económica", "Primero el sobre de juicio de valor y después el de fórmulas", "Las abre el órgano de contratación en presencia del Secretario", "Por medios electrónicos, sin acto público, y nunca antes de que termine el plazo"], 3, ["El propio art. 157.4 exceptúa el acto público cuando se emplean medios electrónicos. El art. 159.6.d) lo descarta expresamente.", "En el abreviado hay un único sobre y solo criterios de fórmula (art. 159.6.c).", "La apertura es automática y electrónica.", "Correcta. Art. 159.6.d): un dispositivo electrónico garantiza que no se abren antes de tiempo, «por lo que no se celebrará acto público de apertura»."], "art. 159.6.d LCSP"], ["B12", "B", "Expediente 3. Obra de 170.000 € con un 20 % de criterios de juicio de valor. ¿Puede seguirse el procedimiento abierto simplificado?", ["No, porque supera 80.000 €", "Sí: en obras el límite es de 2.000.000 € y el juicio de valor no pasa del 25 %", "No, porque hay criterios de juicio de valor", "Solo si se declara la urgencia"], 1, ["80.000 € es el límite de la vía abreviada en obras (art. 159.6). Para el simplificado ordinario es de 2.000.000 €.", "Correcta. Se cumplen las dos condiciones del art. 159.1: valor estimado ≤ 2.000.000 € en obras, y criterios de juicio de valor que no superan el 25 %.", "Se admiten hasta un 25 % (art. 159.1.b).", "La urgencia no es requisito del simplificado."], "art. 159.1 LCSP"], ["B13", "B", "Expediente 3. El anuncio se publica el <b>lunes 12 de abril</b>. ¿Cuál es el primer día en que puede terminar el plazo de ofertas?", ["Domingo 2 de mayo", "Lunes 3 de mayo", "Martes 27 de abril", "Lunes 10 de mayo"], 1, ["El cómputo es correcto, pero el último día es inhábil y se pasa al primero hábil (DA 12.ª).", "Correcta. En obras, el simplificado exige como mínimo 20 días desde el siguiente a la publicación (art. 159.3), naturales (DA 12.ª): del 13 de abril al 2 de mayo. El 2 es domingo y se prorroga al 3.", "Aplica los 15 días de los suministros y servicios. En obras son 20.", "Aplica los 26 días del abierto ordinario de obras (art. 156.6)."], "art. 159.3 LCSP"], ["B14", "B", "Expediente 3. ¿Qué requisito registral tienen los licitadores?", ["Estar inscritos en el Registro Oficial de Licitadores (o en el autonómico) en la fecha final de presentación de ofertas", "Estar inscritos el día de la adjudicación", "Ninguno: están eximidos, como en la vía abreviada", "Estar clasificados en todo caso, sea cual sea el importe"], 0, ["Correcta. Art. 159.4.a). También vale haber solicitado la inscripción antes de esa fecha, con la documentación preceptiva.", "La fecha que cuenta es la final de presentación de ofertas.", "La exención de solvencia es del art. 159.6.b). El simplificado ordinario exige la inscripción.", "El art. 159.4.a) exige inscripción registral, no clasificación."], "art. 159.4.a LCSP"], ["B15", "B", "Expediente 3. ¿Puede el pliego exigir una garantía provisional?", ["Sí, hasta el 3 % del presupuesto base de licitación sin IVA", "Sí, del 5 % del precio ofertado", "No: en el simplificado no procede", "Sí, siempre que sea una obra"], 2, ["Ese es el tope del art. 106.2 en los procedimientos donde la garantía provisional cabe de forma excepcional. En el simplificado está excluida.", "Ese porcentaje es el de la garantía definitiva.", "Correcta. Art. 159.4.b): «No procederá la constitución de garantía provisional por parte de los licitadores».", "El art. 159.4.b) no distingue por tipo de contrato."], "art. 159.4.b LCSP"], ["B16", "B", "Expediente 3. ¿Quién valora la memoria técnica y en qué plazo?", ["Los servicios técnicos del órgano de contratación, en no más de siete días y antes de abrir el sobre de fórmulas", "Un comité de expertos, en un mes", "La mesa, después de abrir el sobre de fórmulas", "Los servicios técnicos, en diez días hábiles"], 0, ["Correcta. Art. 159.4.e) y f).", "El comité es del abierto o restringido cuando el juicio de valor pesa más (art. 146.2.a). Aquí pesa un 20 %.", "El juicio de valor siempre se valora antes que las fórmulas (arts. 146.2 y 159.4.f).", "El plazo es de siete días."], "art. 159.4.e LCSP"], ["B17", "B", "Expediente 3. Construcciones Atalaya obtiene la mejor puntuación con 150.000 € sin IVA. ¿Qué garantía definitiva debe constituir?", ["9.075 €", "8.500 €", "7.500 €", "Ninguna, porque es un procedimiento simplificado"], 2, ["Calcula sobre el precio con IVA (181.500 €).", "Calcula sobre los 170.000 € de licitación. La base es el precio ofertado.", "Correcta. 5 % del precio ofertado sin IVA (art. 107.1): 150.000 × 0,05 = 7.500 €.", "Solo se suprime en la vía abreviada (art. 159.6.f). En el simplificado ordinario se requiere (art. 159.4.f.4.º)."], "arts. 107.1 y 159.4.f LCSP"], ["B18", "B", "Expediente 3. ¿Podría el pliego eximir a Atalaya de constituir la garantía definitiva?", ["No: la exención no es posible en los contratos de obras", "Sí, justificándolo en el pliego", "Sí, si la empresa está inscrita en el Registro de Licitadores", "Sí, si el valor estimado no supera 200.000 €"], 0, ["Correcta. Art. 107.1, tercer párrafo: «Esta exención no será posible en el caso de contratos de obras, ni de concesión de obras».", "Es la regla general del art. 107.1, pero tiene la excepción de las obras.", "La inscripción no tiene relación con la garantía definitiva.", "La Ley no fija un umbral para esta exención."], "art. 107.1 LCSP"], ["B19", "B", "Expediente 3. La comunicación para que Atalaya constituya la garantía se envía el <b>miércoles 26 de mayo</b>. ¿Cuál es el último día?", ["Miércoles 2 de junio", "Miércoles 9 de junio", "Jueves 3 de junio", "Viernes 4 de junio"], 3, ["Cuenta siete días naturales. La Ley dice «hábiles».", "Aplica los diez días hábiles del abierto ordinario (art. 150.2).", "Se queda en seis días hábiles.", "Correcta. Siete días hábiles desde el envío de la comunicación (art. 159.4.f.4.º): 27 y 28 de mayo; 31 de mayo; 1, 2, 3 y 4 de junio."], "art. 159.4.f LCSP"], ["B20", "B", "Expediente 3. Si la oferta de Atalaya se presumiera anormalmente baja, ¿qué plazo máximo tendría para justificarla?", ["Diez días hábiles", "Cinco días hábiles desde el envío de la comunicación", "Un plazo suficiente, sin límite máximo", "Quince días hábiles"], 1, ["Es el plazo del requerimiento de documentación del abierto ordinario (art. 150.2).", "Correcta. Art. 159.4.f): en el simplificado, el plazo para justificar «no podrá superar los cinco días hábiles».", "Es la regla general del art. 149.4. El simplificado la acota a cinco días hábiles.", "Son los que se añaden al plazo de adjudicación cuando hay trámite de anormalidad (art. 158.3), no el plazo para justificar."], "art. 159.4.f LCSP"], ["B21", "B", "Expediente 3. Presentada la garantía definitiva, ¿en qué plazo se adjudica?", ["En dos meses desde la apertura", "En no más de cinco días, previa fiscalización del gasto cuando sea preceptiva", "En quince días hábiles", "Inmediatamente, en la misma sesión de la mesa"], 1, ["Ese es el máximo general con varios criterios (art. 158.2), no el plazo tras la garantía en el simplificado.", "Correcta. Art. 159.4.f): «en un plazo no superior a cinco días se procederá a adjudicar».", "No es el plazo del art. 159.4.f).", "En la misma sesión la mesa clasifica, propone y requiere. La adjudicación viene después."], "art. 159.4.f LCSP"], ["B22", "B", "Expediente 4. Al procedimiento abierto de limpieza del pabellón no se presentó ninguna oferta. ¿Qué puede hacer el Ayuntamiento?", ["Acudir al negociado sin publicidad con un presupuesto un 10 % mayor para atraer ofertas", "Adjudicar directamente como contrato menor, cualquiera que sea el importe", "Nada: tiene que repetir el mismo procedimiento abierto", "Acudir al negociado sin publicidad, sin modificar sustancialmente las condiciones y sin subir el presupuesto"], 3, ["El incremento del presupuesto está expresamente vedado por el art. 168.a).1.º.", "El contrato menor depende del valor estimado (art. 118.1), no de que la licitación quedara desierta.", "Puede hacerlo, pero la Ley le ofrece también el negociado sin publicidad.", "Correcta. Art. 168.a).1.º: cabe si no se presentó ninguna oferta, «sin que en ningún caso se pueda incrementar el presupuesto base de licitación ni modificar el sistema de retribución»."], "art. 168.a LCSP"], ["B23", "B", "Expediente 5. Mantenimiento de instalaciones deportivas: 30.000 € al año, 3 años y prórroga posible de 2. ¿Cuál es su valor estimado?", ["90.000 €", "181.500 €", "108.900 €", "150.000 €"], 3, ["Olvida los dos años de prórroga.", "Añade el IVA, que el valor estimado excluye.", "Calcula solo la duración inicial y, además, con IVA.", "Correcta. 30.000 × 5 años: las prórrogas eventuales se computan (art. 101.2.a), sin IVA (art. 101.1.a)."], "art. 101 LCSP"], ["B24", "B", "Expediente 5. ¿Es válida una duración total de 5 años, prórroga incluida?", ["No: el máximo es de cuatro años, prórrogas incluidas", "No: la prórroga no puede durar más que el contrato inicial", "Sí: es justo el máximo de cinco años, prórrogas incluidas, de los servicios de prestación sucesiva", "Sí, y podría llegar a diez años con más prórrogas"], 2, ["Los cuatro años no son una duración máxima. Son el límite de la DA 2.ª para que el Alcalde sea el órgano competente.", "La Ley no establece esa regla.", "Correcta. Art. 29.4: «plazo máximo de duración de cinco años, incluyendo las posibles prórrogas».", "El máximo de cinco años incluye todas las prórrogas, salvo las excepciones tasadas del art. 29.4."], "art. 29.4 LCSP"], ["B25", "B", "Expediente 5. ¿Quién es el órgano de contratación?", ["El Alcalde, porque 150.000 € no llega al 10 % de los recursos ordinarios", "El Pleno, porque la duración con prórrogas supera cuatro años", "La Junta de Gobierno Local", "El Alcalde, porque la duración inicial es de solo 3 años"], 1, ["El importe permitiría que fuera el Alcalde, pero la duración no. Los dos requisitos son acumulativos.", "Correcta. DA 2.ª.1: el Alcalde solo lo es si la duración no supera cuatro años, «eventuales prórrogas incluidas». Son cinco, así que le corresponde al Pleno (DA 2.ª.2), aunque el importe sea pequeño.", "Solo en los municipios de gran población (DA 2.ª.4).", "Las prórrogas eventuales se incluyen en el cómputo de la DA 2.ª.1."], "DA 2.ª LCSP"]];

<script>
document.getElementById("main").innerHTML="<section class=\"card\" id=\"intro\"><h2>Simulacro 2 · contratación · dos supuestos para elegir uno</h2>\n<div class=\"idea\">El día del examen el Tribunal pondrá dos supuestos y tendrás que resolver uno. Aquí pasa igual: lee los dos enunciados, elige en dos minutos y haz solo ese. El otro queda para otro día.</div>\n<div class=\"legal\"><span class=\"lbl\">Texto legal · Bases de la convocatoria (subgrupos C1 y C2)</span>\n<p>«esta prueba consistirá en la resolución de un supuesto práctico de entre los dos propuestos por el tribunal, en relación con el bloque de las materias específicas del temario de cada categoría, que se podrá resolver según determine el tribunal mediante: el análisis de un supuesto; la preparación de un informe; la contestación de preguntas con respuestas breves; test multirrespuesta, etc.»</p>\n<p>«La puntuación máxima de la prueba práctica será de 25,00 puntos, debiéndose obtener una puntuación mínima de 12,50 puntos para entenderla superada.»</p></div>\n<div class=\"box ej\"><span class=\"lbl\">Cómo sacarle partido</span><ol>\n<li>Pon el cronómetro y lee los dos enunciados. Elige uno en menos de dos minutos: es una destreza del examen.</li>\n<li>Haz los cálculos y las fechas <b>en papel</b>, sobre el calendario de abajo, antes de mirar las opciones.</li>\n<li>Deja en blanco lo que no sepas. Con la penalización activada, un fallo resta medio acierto.</li>\n<li>Pulsa «Entregar y corregir» y lee la explicación de <b>las cuatro</b> opciones.</li></ol></div>\n<div class=\"ctrl noprint\"><span class=\"lbl2\">Corrección</span>\n<span class=\"seg\" role=\"group\" aria-label=\"Modo de corrección\"><button data-modo=\"examen\" aria-pressed=\"true\">Al entregar</button><button data-modo=\"inmediata\" aria-pressed=\"false\">Inmediata</button></span>\n<span class=\"lbl2\">Penalización</span>\n<span class=\"seg\" role=\"group\" aria-label=\"Penalización\"><button data-pen=\"0\" aria-pressed=\"false\">Sin penalización</button><button data-pen=\"1\" aria-pressed=\"true\">(A − F/2) × 25 / N</button></span>\n<span class=\"lbl2\">Cronómetro</span>\n<select id=\"mins\" aria-label=\"Minutos\"><option value=\"45\">45 min</option><option value=\"60\" selected>60 min</option><option value=\"90\">90 min</option></select>\n<button id=\"reloj\" aria-label=\"Iniciar o pausar el cronómetro\">60:00</button><button id=\"relojR\" aria-label=\"Reiniciar el cronómetro\">↺</button></div>\n<p class=\"small\">La penalización solo consta en las bases para los ejercicios 1.º y 2.º. Para el tercero, el Tribunal la anunciará al empezar. Por eso el interruptor: entrena con las dos reglas. Con cada regla, la nota se calcula sobre 25 puntos y 25 preguntas.</p>\n<div class=\"box warn\"><span class=\"lbl\">Antes de empezar</span>Verifica la vigencia en el BOE consolidado. Los literales proceden del texto de la biblioteca (última modificación: 26 de diciembre de 2025). Los umbrales armonizados del art. 22 (140.000 € y 216.000 €) se actualizan cada dos años. Los de los arts. 118 y 159.6 son fijos en la Ley.</div>\n<p class=\"small\"><b>Ámbito formativo.</b> Los municipios, las empresas y los expedientes son ficticios. No es asesoramiento para ningún expediente real.</p>\n</section><section class=\"card\" id=\"cal\"><h2>Calendario de 2027 para los dos supuestos</h2>\n<p class=\"small\">A efectos de los supuestos, son inhábiles los sábados, los domingos y los festivos marcados: <b>jueves 25 y viernes 26 de marzo</b> (Semana Santa). No hay más festivos entre marzo y junio. Las fechas clave de las respuestas no van marcadas: búscalas tú.</p>\n<div class=\"cals\" id=\"calbox\"></div>\n<div class=\"box warn\"><span class=\"lbl\">La trampa de siempre</span>En la LCSP, «días» a secas son <span class=\"t\" data-g=\"naturales\">días naturales</span>, y si el último es inhábil el plazo pasa al primer día hábil (DA 12.ª). Solo son <span class=\"t\" data-g=\"habiles\">días hábiles</span> cuando la Ley lo dice.</div>\n</section><section class=\"card\" id=\"sa\"><h2>Supuesto A · Un servicio por procedimiento abierto, de principio a fin</h2>\n<div class=\"legal\"><span class=\"lbl\">Enunciado</span>\n<p>El <b>Ayuntamiento de Valdeolivos</b> (Málaga), municipio de régimen común con <b>23.500 habitantes</b>, tiene unos <b>recursos ordinarios</b> en su presupuesto de 2027 de <b>21.000.000 €</b>.</p>\n<p>Va a contratar el <b>servicio de mantenimiento integral del alumbrado público</b>:</p>\n<ul>\n<li>Precio anual: <b>50.000 €, IVA excluido</b>. IVA aplicable: <b>21 %</b>.</li>\n<li>Duración: <b>2 años</b>, con posible <b>prórroga de 1 año</b>.</li>\n<li>El pliego prevé una <b>modificación de hasta el 10 % del precio inicial</b> si se recepcionan nuevas urbanizaciones (art. 204).</li>\n<li>No son prestaciones de carácter intelectual. Se exige <b>garantía provisional</b>: <b>no</b>. El contrato es <b>susceptible de <span class=\"t\" data-g=\"recesp\">recurso especial</span></b>.</li>\n<li>Criterios: oferta económica, <b>55 puntos</b> (fórmula); ampliación del plazo de garantía de los materiales, <b>15 puntos</b> (fórmula); memoria técnica, <b>30 puntos</b> (<span class=\"t\" data-g=\"juicio\">juicio de valor</span>).</li>\n<li>El pliego presume <span class=\"t\" data-g=\"anormal\">anormalmente baja</span> la oferta cuyo precio sea <b>más de un 20 % inferior</b> al presupuesto base de licitación sin IVA <b>y</b> que además obtenga <b>más de 25 puntos</b> en la memoria técnica.</li>\n</ul>\n<p>Se sigue el <b>procedimiento abierto</b>. El anuncio se publica en el <span class=\"t\" data-g=\"perfil\">perfil de contratante</span> el <b>viernes 5 de marzo de 2027</b>.</p>\n<div class=\"tw\"><table><thead><tr><th>Licitador</th><th>Precio 2 años (sin IVA)</th><th>Memoria técnica</th><th>Puntuación total</th></tr></thead><tbody>\n<tr><td>Luminia, S.L.</td><td>78.000 €</td><td>27</td><td>92</td></tr>\n<tr><td>Electro Sur, S.A.</td><td>84.000 €</td><td>24</td><td>88</td></tr>\n<tr><td>Alumbrados Guadalhorce, S.L.</td><td>79.500 €</td><td>18</td><td>85</td></tr>\n<tr><td>Instalaciones Martín, S.L.</td><td>96.000 €</td><td>22</td><td>70</td></tr>\n<tr><td>Fotón Energía, S.L.</td><td colspan=\"3\">Oferta registrada el 23 de marzo</td></tr>\n</tbody></table></div>\n<p>El primer sobre de las proposiciones se abre el <b>30 de marzo</b> y el de fórmulas, el <b>13 de abril</b>. Tras el trámite de anormalidad, Electro Sur recibe el requerimiento de documentación el <b>lunes 3 de mayo</b> y lo atiende el <b>miércoles 12 de mayo</b>. La notificación de la adjudicación se remite el <b>jueves 20 de mayo</b>.</p>\n</div>\n<h3 style=\"font-size:1rem;margin:1rem 0 .2rem\">Test · 25 preguntas</h3><div class=\"ctrl noprint\"><button class=\"corr\" data-s=\"A\">Entregar y corregir</button><button class=\"fallos\" data-s=\"A\">Repetir solo los fallos</button><button class=\"reset\" data-s=\"A\">Reiniciar</button><span class=\"chip\" id=\"scoreA\">0 de 25 contestadas</span></div><div id=\"testA\"></div><div id=\"resA\"></div>\n<details class=\"panel\"><summary>Mapa de la solución (ábrelo después de corregir)</summary><div class=\"body\"><svg viewBox=\"0 0 960 482\" role=\"img\" aria-label=\"Mapa de la solución del supuesto A\" style=\"width:100%;height:auto\"><defs><marker id=\"s2a_fl\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"s2a_fr\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"s2a_fe\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"s2a_fw\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"250\" y=\"8\" width=\"460\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"27.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">Supuesto A · la solución en seis pasos</text><rect x=\"20\" y=\"52\" width=\"920\" height=\"68\" rx=\"10\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"30\" y=\"73\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"120\" y=\"90\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--acc)\">Preparación</text><text x=\"224\" y=\"74\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">VE 160.000 € = 100.000 + 50.000 (prórroga) + 10.000 (modificación) · sin IVA</text><text x=\"224\" y=\"88\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">PBL 121.000 € con IVA · No SARA (&lt; 216.000 €) · Alcalde (&lt; 10 % y ≤ 4 años)</text><text x=\"224\" y=\"102\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">No simplificado: VE ≥ 140.000 € y juicio de valor 30 % &gt; 25 %</text><text x=\"930\" y=\"74\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">arts. 100, 101, 159 · DA 2.ª</text><path d=\"M480 121 L 480 129\" stroke=\"var(--acc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#s2a_fl)\"/><rect x=\"20\" y=\"130\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"30\" y=\"144\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"120\" y=\"161\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--acc)\">Licitación</text><text x=\"224\" y=\"152\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Anuncio 5-mar · 15 días naturales → sábado 20 → lunes 22-mar (DA 12.ª)</text><text x=\"224\" y=\"166\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Fotón (23-mar) fuera de plazo · 1.ª apertura 30-mar, dentro de 20 días</text><text x=\"930\" y=\"152\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">arts. 156.6 y 157.3</text><path d=\"M480 185 L 480 193\" stroke=\"var(--acc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#s2a_fl)\"/><rect x=\"20\" y=\"194\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"30\" y=\"208\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"120\" y=\"225\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--warn)\">Anormalidad</text><text x=\"224\" y=\"216\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Umbral del pliego: &lt; 80.000 € y &gt; 25 puntos técnicos → solo Luminia</text><text x=\"224\" y=\"230\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Justificación incompleta → excluida · plazo de adjudicación + 15 días hábiles</text><text x=\"930\" y=\"216\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">arts. 149 y 158.3</text><path d=\"M480 249 L 480 257\" stroke=\"var(--warn)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#s2a_fw)\"/><rect x=\"20\" y=\"258\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><rect x=\"30\" y=\"272\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--ej)\"/><text x=\"120\" y=\"289\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--ej)\">Requerimiento</text><text x=\"224\" y=\"280\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Electro Sur (88 puntos) · 10 días hábiles: del 4 al 17-may</text><text x=\"224\" y=\"294\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Garantía: 5 % × 84.000 = 4.200 € · si falla: 3 % × 100.000 = 3.000 €</text><text x=\"930\" y=\"280\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">arts. 107.1 y 150.2</text><path d=\"M480 313 L 480 321\" stroke=\"var(--ej)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#s2a_fe)\"/><rect x=\"20\" y=\"322\" width=\"920\" height=\"40\" rx=\"10\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><rect x=\"30\" y=\"329\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--ej)\"/><text x=\"120\" y=\"346\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--ej)\">Adjudicación</text><text x=\"224\" y=\"344\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">≤ 5 días hábiles desde la documentación: 12 → 19-may · perfil en 15 días</text><text x=\"930\" y=\"344\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">arts. 150.3 y 151.1</text><path d=\"M480 363 L 480 371\" stroke=\"var(--ej)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#s2a_fe)\"/><rect x=\"20\" y=\"372\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><rect x=\"30\" y=\"386\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--exc)\"/><text x=\"120\" y=\"403\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--exc)\">Formalización</text><text x=\"224\" y=\"394\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Cabe recurso especial: 15 días hábiles (21-may a 10-jun) → desde el 11-jun</text><text x=\"224\" y=\"408\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Requerimiento ≤ 5 días naturales: del 12 al 16-jun</text><text x=\"930\" y=\"394\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">art. 153.3</text><rect x=\"20\" y=\"436\" width=\"920\" height=\"34\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"480\" y=\"456.328\" text-anchor=\"middle\" font-size=\"10.4\" fill=\"currentColor\">Prórroga: acuerdo del órgano + preaviso de 2 meses · Modificación: 10 % × 84.000 = 8.400 € (techo legal 20 %)</text></svg>\n<div class=\"interp\"><span class=\"lbl\">Aportación externa</span>Que el «precio inicial» del art. 204 sea el precio de adjudicación (84.000 €) y no el de licitación es el criterio común en la práctica y en la doctrina consultiva. La Ley no lo define con esas palabras. Para el valor estimado, antes de licitar, solo se conoce el presupuesto: por eso allí la modificación se calcula sobre 100.000 €.</div>\n</div></details>\n</section><section class=\"card\" id=\"sb\"><h2>Supuesto B · Cinco expedientes de la Concejalía de Deportes</h2>\n<div class=\"legal\"><span class=\"lbl\">Enunciado</span>\n<p>El <b>Ayuntamiento de Peñaluz</b> (Málaga), municipio de régimen común con <b>7.200 habitantes</b>, tiene unos <b>recursos ordinarios</b> en su presupuesto de 2027 de <b>6.500.000 €</b>. La Concejalía de Deportes tramita cinco expedientes. Importes <b>sin IVA</b>, al <b>21 %</b>. Ninguno tiene por objeto prestaciones de carácter intelectual.</p>\n<div class=\"tw\"><table><thead><tr><th>Exp.</th><th>Objeto y datos</th></tr></thead><tbody>\n<tr><td>1</td><td><b>Suministro</b> de material deportivo para las escuelas municipales: <b>13.800 €</b>, entrega única. En febrero ya se compró a la misma empresa otro lote de material por 4.000 €, también como contrato menor.</td></tr>\n<tr><td>2</td><td><b>Servicio</b> de monitores para las escuelas deportivas: <b>55.000 €</b>, un año, sin prórroga. Solo criterios de fórmula: precio (80 puntos) y horas adicionales (20 puntos). Anuncio en el perfil el <b>jueves 18 de marzo</b>.</td></tr>\n<tr><td>3</td><td><b>Obra</b> de reforma de los vestuarios del pabellón: <b>170.000 €</b>. Criterios: precio (70), reducción del plazo (10) y memoria constructiva (20, juicio de valor). <span class=\"t\" data-g=\"simpl\">Procedimiento abierto simplificado</span>. Anuncio el <b>lunes 12 de abril</b>. La mejor puntuación la obtiene Construcciones Atalaya, S.L., con <b>150.000 €</b>. La comunicación para que constituya la garantía se envía el <b>miércoles 26 de mayo</b>.</td></tr>\n<tr><td>4</td><td><b>Servicio</b> de limpieza del pabellón, licitado por procedimiento abierto: <b>no se presentó ninguna oferta</b>.</td></tr>\n<tr><td>5</td><td><b>Servicio</b> de mantenimiento de las instalaciones deportivas: <b>30.000 € al año</b>, 3 años con posible prórroga de 2 años.</td></tr>\n</tbody></table></div>\n</div>\n<h3 style=\"font-size:1rem;margin:1rem 0 .2rem\">Test · 25 preguntas</h3><div class=\"ctrl noprint\"><button class=\"corr\" data-s=\"B\">Entregar y corregir</button><button class=\"fallos\" data-s=\"B\">Repetir solo los fallos</button><button class=\"reset\" data-s=\"B\">Reiniciar</button><span class=\"chip\" id=\"scoreB\">0 de 25 contestadas</span></div><div id=\"testB\"></div><div id=\"resB\"></div>\n<details class=\"panel\"><summary>Mapa de la solución (ábrelo después de corregir)</summary><div class=\"body\"><svg viewBox=\"0 0 960 404\" role=\"img\" aria-label=\"Mapa de la solución del supuesto B\" style=\"width:100%;height:auto\"><defs><marker id=\"s2b_fl\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"s2b_fr\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"s2b_fe\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"s2b_fw\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"250\" y=\"8\" width=\"460\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"27.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">Supuesto B · cinco expedientes, cinco reglas</text><rect x=\"20\" y=\"52\" width=\"920\" height=\"54\" rx=\"10\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><rect x=\"30\" y=\"66\" width=\"180\" height=\"26\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--ej)\"/><text x=\"120\" y=\"83\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--ej)\">Exp. 1 · menor</text><text x=\"224\"

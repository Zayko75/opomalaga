hor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">120.000 €</text><rect x=\"440\" y=\"274\" width=\"190\" height=\"46\" rx=\"8\" fill=\"#fdeceb\" stroke=\"#b91c1c\" stroke-width=\"1.4\"/><text x=\"535\" y=\"300.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">NO</text><rect x=\"640\" y=\"274\" width=\"320\" height=\"46\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"800\" y=\"294.175\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Abierto simplificado ordinario</text><text x=\"800\" y=\"307.175\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">art. 159.1 y 159.3</text><text x=\"490\" y=\"340\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"bold\">El umbral del art. 118.1 se compara siempre con el VALOR ESTIMADO, IVA excluido y prórrogas incluidas (art. 101).</text></svg>\n<p class=\"small\">Las tres operaciones del supuesto: pasar de base a total sumando el 21 %; construir el <span class=\"t\" data-g=\"valorestimado\">valor estimado</span> incluyendo la prórroga; y restar del <span class=\"t\" data-g=\"credef\">crédito definitivo</span> lo ya autorizado.</p>\n<svg viewBox=\"0 0 940 268\" width=\"100%\" role=\"img\" aria-label=\"Cálculo del crédito disponible y modificación presupuestaria procedente\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"v2fr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#4b5563\"/></marker><marker id=\"v2fe\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#15803d\"/></marker><marker id=\"v2fw\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#b45309\"/></marker></defs><text x=\"470\" y=\"22\" font-size=\"13\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"bold\">Del crédito de la aplicación al suplemento de crédito</text><rect x=\"20\" y=\"40\" width=\"195\" height=\"56\" rx=\"8\" fill=\"#e8efff\" stroke=\"#1d4ed8\" stroke-width=\"1.4\"/><text x=\"117.5\" y=\"64.2\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1d4ed8\" font-weight=\"bold\">Crédito definitivo</text><text x=\"117.5\" y=\"80.2\" font-size=\"12\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">60.000 €</text><rect x=\"255\" y=\"40\" width=\"195\" height=\"56\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"352.5\" y=\"64.2\" font-size=\"12\" text-anchor=\"middle\" fill=\"#4b5563\" font-weight=\"bold\">− Gastos autorizados</text><text x=\"352.5\" y=\"80.2\" font-size=\"12\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">18.000 €</text><rect x=\"490\" y=\"40\" width=\"195\" height=\"56\" rx=\"8\" fill=\"#eaf6ee\" stroke=\"#15803d\" stroke-width=\"1.4\"/><text x=\"587.5\" y=\"64.2\" font-size=\"12\" text-anchor=\"middle\" fill=\"#15803d\" font-weight=\"bold\">= Crédito disponible</text><text x=\"587.5\" y=\"80.2\" font-size=\"12\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">42.000 €</text><rect x=\"725\" y=\"40\" width=\"195\" height=\"56\" rx=\"8\" fill=\"#fdf3e3\" stroke=\"#b45309\" stroke-width=\"1.4\"/><text x=\"822.5\" y=\"64.2\" font-size=\"12\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"bold\">Gasto con IVA</text><text x=\"822.5\" y=\"80.2\" font-size=\"12\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">45.980 €</text><line x1=\"219\" y1=\"68\" x2=\"249\" y2=\"68\" stroke=\"#4b5563\" stroke-width=\"1.6\" marker-end=\"url(#v2fr)\"/><line x1=\"454\" y1=\"68\" x2=\"484\" y2=\"68\" stroke=\"#4b5563\" stroke-width=\"1.6\" marker-end=\"url(#v2fr)\"/><line x1=\"689\" y1=\"68\" x2=\"719\" y2=\"68\" stroke=\"#4b5563\" stroke-width=\"1.6\" marker-end=\"url(#v2fr)\"/><rect x=\"260\" y=\"124\" width=\"420\" height=\"48\" rx=\"8\" fill=\"#fdeceb\" stroke=\"#b91c1c\" stroke-width=\"1.4\"/><text x=\"470\" y=\"152.55\" font-size=\"13\" text-anchor=\"middle\" fill=\"#b91c1c\" font-weight=\"bold\">Insuficiencia: 3.980 €</text><line x1=\"822\" y1=\"100\" x2=\"690\" y2=\"124\" stroke=\"#b45309\" stroke-width=\"1.6\" marker-end=\"url(#v2fw)\"/><rect x=\"170\" y=\"192\" width=\"600\" height=\"56\" rx=\"8\" fill=\"#e8efff\" stroke=\"#1d4ed8\" stroke-width=\"1.4\"/><text x=\"470\" y=\"216.025\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#1d4ed8\" font-weight=\"bold\">Suplemento de crédito — art. 177.1 TRLHL y art. 35 RD 500/1990</text><text x=\"470\" y=\"232.025\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Lo aprueba el Pleno, con informe previo de Intervención</text><line x1=\"470\" y1=\"176\" x2=\"470\" y2=\"190\" stroke=\"#4b5563\" stroke-width=\"1.6\" marker-end=\"url(#v2fr)\"/></svg>\n<p class=\"small\">Cuando el crédito no llega, la figura es el <span class=\"t\" data-g=\"suplemento\">suplemento de crédito</span>, no el crédito extraordinario: el crédito existe, solo que se queda corto.</p>\n<div class=\"box warn\"><span class=\"lbl\">La trampa del bloque</span>El umbral del <span class=\"t\" data-g=\"menor\">contrato menor</span> se compara con el valor estimado <b>sin IVA</b>, que no es el <span class=\"t\" data-g=\"pbl\">presupuesto base de licitación</span>; el crédito, en cambio, se compromete por el importe <b>con IVA</b>, porque es lo que el Ayuntamiento va a pagar. Quien usa la misma cifra para las dos cosas falla una de las dos.</div>\n</section><section class=\"card\" id=\"s2\"><h2>Supuesto 2 · Subvenciones, crédito y justificación</h2>\n<div class=\"legal\"><span class=\"lbl\">Enunciado</span>\n<p>El mismo Ayuntamiento de Las Flores convoca subvenciones en régimen de <b><span class=\"t\" data-g=\"concurrencia\">concurrencia competitiva</span></b> para asociaciones culturales del municipio, con un <b>crédito de 30.000 €</b>. Las bases disponen que cada entidad podrá recibir el <b>50 % del presupuesto de su actividad</b>, con un <b>máximo de 6.000 €</b> por beneficiaria, y <b>no contienen previsión alguna sobre prorrateo</b>.</p>\n<p>La convocatoria se publica el <b>lunes 11 de enero de 2027</b>. Se presentan cuatro solicitudes, todas en plazo y todas con derecho a ser beneficiarias:</p>\n<table><thead><tr><th>Asociación</th><th>Presupuesto de la actividad</th><th>Incidencia</th></tr></thead><tbody>\n<tr><td>A</td><td>14.000 €</td><td>—</td></tr>\n<tr><td>B</td><td>8.000 €</td><td>—</td></tr>\n<tr><td>C</td><td>20.000 €</td><td>—</td></tr>\n<tr><td>D</td><td>5.000 €</td><td>La solicitud se presenta <b>sin firmar</b></td></tr>\n</tbody></table>\n<p>El requerimiento de subsanación a la asociación D se notifica el <b>lunes 1 de febrero de 2027</b>. En ese periodo no hay festivos nacionales, autonómicos ni locales.</p>\n<p>Concluidas las actividades, <b>C justifica gasto por 16.000 €</b> y <b>A justifica gasto por 9.000 €</b>. Ambas habían percibido el importe que les correspondía según las bases.</p>\n</div>\n<svg viewBox=\"0 0 1000 300\" width=\"100%\" role=\"img\" aria-label=\"Importe que corresponde a cada asociación con el tope de seis mil euros y crédito sobrante\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"v3fr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#4b5563\"/></marker><marker id=\"v3fe\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#15803d\"/></marker><marker id=\"v3fw\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#b45309\"/></marker></defs><text x=\"500\" y=\"22\" font-size=\"13\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"bold\">Reparto del crédito: 50 % del presupuesto, con el tope de 6.000 €</text><text x=\"238\" y=\"68\" font-size=\"11\" text-anchor=\"end\" fill=\"#15181d\" font-weight=\"normal\">A · presupuesto 14.000 €</text><rect x=\"250\" y=\"52\" width=\"252\" height=\"26\" rx=\"5\" fill=\"#fdf3e3\" stroke=\"#b45309\" stroke-width=\"1.4\"/><text x=\"512\" y=\"70\" font-size=\"10\" text-anchor=\"start\" fill=\"#4b5563\" font-weight=\"normal\">6.000 €  ·  tope: el 50 % serían 7.000 €</text><text x=\"238\" y=\"112\" font-size=\"11\" text-anchor=\"end\" fill=\"#15181d\" font-weight=\"normal\">B · presupuesto 8.000 €</text><rect x=\"250\" y=\"96\" width=\"168\" height=\"26\" rx=\"5\" fill=\"#eaf6ee\" stroke=\"#15803d\" stroke-width=\"1.4\"/><text x=\"428\" y=\"114\" font-size=\"10\" text-anchor=\"start\" fill=\"#4b5563\" font-weight=\"normal\">4.000 €  ·  50 % exacto</text><text x=\"238\" y=\"156\" font-size=\"11\" text-anchor=\"end\" fill=\"#15181d\" font-weight=\"normal\">C · presupuesto 20.000 €</text><rect x=\"250\" y=\"140\" width=\"252\" height=\"26\" rx=\"5\" fill=\"#fdf3e3\" stroke=\"#b45309\" stroke-width=\"1.4\"/><text x=\"512\" y=\"158\" font-size=\"10\" text-anchor=\"start\" fill=\"#4b5563\" font-weight=\"normal\">6.000 €  ·  tope: el 50 % serían 10.000 €</text><text x=\"238\" y=\"200\" font-size=\"11\" text-anchor=\"end\" fill=\"#15181d\" font-weight=\"normal\">D · presupuesto 5.000 €</text><rect x=\"250\" y=\"184\" width=\"105\" height=\"26\" rx=\"5\" fill=\"#eaf6ee\" stroke=\"#15803d\" stroke-width=\"1.4\"/><text x=\"365\" y=\"202\" font-size=\"10\" text-anchor=\"start\" fill=\"#4b5563\" font-weight=\"normal\">2.500 €  ·  50 % exacto</text><text x=\"238\" y=\"244\" font-size=\"11\" text-anchor=\"end\" fill=\"#15181d\" font-weight=\"normal\">Crédito que sobra</text><rect x=\"250\" y=\"228\" width=\"483\" height=\"26\" rx=\"5\" fill=\"#e8efff\" stroke=\"#1d4ed8\" stroke-width=\"1.4\"/><text x=\"743\" y=\"246\" font-size=\"10\" text-anchor=\"start\" fill=\"#4b5563\" font-weight=\"normal\">11.500 €  ·  30.000 − 18.500</text><text x=\"500\" y=\"284\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"bold\">Suma concedida 18.500 € · El prorrateo del art. 22.1 es excepcional y exige previsión en las bases: aquí no procede.</text></svg>\n<p class=\"small\">Dos reglas y una sola operación por entidad: calcula el 50 % y, si pasa de 6.000 €, aplica el tope. Después comprueba si el <span class=\"t\" data-g=\"prorrateo\">prorrateo</span> procede, que es una pregunta de derecho, no de calculadora.</p>\n<svg viewBox=\"0 0 960 210\" width=\"100%\" role=\"img\" aria-label=\"Línea de tiempo de la convocatoria de subvenciones con los plazos de subsanación, resolución, justificación y reintegro\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"v4fr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#4b5563\"/></marker><marker id=\"v4fe\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#15803d\"/></marker><marker id=\"v4fw\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#b45309\"/></marker></defs><text x=\"480\" y=\"22\" font-size=\"13\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"bold\">La línea de tiempo de la convocatoria</text><rect x=\"19\" y=\"48\" width=\"170\" height=\"70\" rx=\"8\" fill=\"#e8efff\" stroke=\"#1d4ed8\" stroke-width=\"1.4\"/><text x=\"104\" y=\"70.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#1d4ed8\" font-weight=\"bold\">Convocatoria</text><text x=\"104\" y=\"86.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">lunes 11-I-2027</text><text x=\"104\" y=\"102.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">art. 23.2 LGS</text><line x1=\"191\" y1=\"83\" x2=\"205\" y2=\"83\" stroke=\"#4b5563\" stroke-width=\"1.6\" marker-end=\"url(#v4fr)\"/><rect x=\"207\" y=\"48\" width=\"170\" height=\"70\" rx=\"8\" fill=\"#fdf3e3\" stroke=\"#b45309\" stroke-width=\"1.4\"/><text x=\"292\" y=\"70.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"bold\">Requerimiento 1-II</text><text x=\"292\" y=\"86.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">10 días hábiles</text><text x=\"292\" y=\"102.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">vence el 15-II</text><line x1=\"379\" y1=\"83\" x2=\"393\" y2=\"83\" stroke=\"#4b5563\" stroke-width=\"1.6\" marker-end=\"url(#v4fr)\"/><rect x=\"395\" y=\"48\" width=\"170\" height=\"70\" rx=\"8\" fill=\"#fdf3e3\" stroke=\"#b45309\" stroke-width=\"1.4\"/><text x=\"480\" y=\"70.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"bold\">Resolver y notificar</text><text x=\"480\" y=\"86.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">6 meses: 11-VII</text><text x=\"480\" y=\"102.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">domingo → 12-VII</text><line x1=\"567\" y1=\"83\" x2=\"581\" y2=\"83\" stroke=\"#4b5563\" stroke-width=\"1.6\" marker-end=\"url(#v4fr)\"/><rect x=\"583\" y=\"48\" width=\"170\" height=\"70\" rx=\"8\" fill=\"#eaf6ee\" stroke=\"#15803d\" stroke-width=\"1.4\"/><text x=\"668\" y=\"70.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15803d\" font-weight=\"bold\">Pago y justificación</text><text x=\"668\" y=\"86.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">arts. 30 y 34 LGS</text><text x=\"668\" y=\"102.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">pago anticipado: 34.4</text><line x1=\"755\" y1=\"83\" x2=\"769\" y2=\"83\" stroke=\"#4b5563\" stroke-width=\"1.6\" marker-end=\"url(#v4fr)\"/><rect x=\"771\" y=\"48\" width=\"170\" height=\"70\" rx=\"8\" fill=\"#fdeceb\" stroke=\"#b91c1c\" stroke-width=\"1.4\"/><text x=\"856\" y=\"70.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#b91c1c\" font-weight=\"bold\">Reintegro</text><text x=\"856\" y=\"86.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">12 meses: caducidad</text><text x=\"856\" y=\"102.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">art. 42.4 LGS</text><text x=\"480\" y=\"152\" font-size=\"11\" text-anchor=\"middle\" fill=\"#b91c1c\" font-weight=\"bold\">Silencio: desestimatorio (art. 25.5 LGS) — no el estimatorio general del art. 24.1 LPAC.</text><text x=\"480\" y=\"176\" font-size=\"11\" text-anchor=\"middle\" fill=\"#4b5563\" font-weight=\"normal\">Prescripción del derecho a reconocer o liquidar el reintegro: 4 años (art. 39.1 LGS).</text></svg>\n<div class=\"box warn\"><span class=\"lbl\">La trampa del bloque</span>En la justificación parcial no se reintegra «el porcentaje que falta». Se calcula <b>qué subvención habría correspondido al gasto realmente justificado</b> y se compara con lo percibido. Si lo justificado sigue soportando lo cobrado, no hay nada que devolver: eso le pasa a C.</div>\n</section><section class=\"card\" id=\"cal\"><h2>Calendario de febrero de 2027</h2>\n<p class=\"small\">Como en los exámenes oficiales, el calendario se adjunta: los plazos se <b>cuentan</b>, no se calculan.</p>\n<table><thead><tr><th>Lunes</th><th>Martes</th><th>Miércoles</th><th>Jueves</th><th>Viernes</th><th>Sábado</th><th>Domingo</th></tr></thead><tbody>\n<tr><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td><td style=\"color:var(--exc)\">6</td><td style=\"color:var(--exc)\">7</td></tr>\n<tr><td>8</td><td>9</td><td>10</td><td>11</td><td>12</td><td style=\"color:var(--exc)\">13</td><td style=\"color:var(--exc)\">14</td></tr>\n<tr><td><b>15</b></td><td>16</td><td>17</td><td>18</td><td>19</td><td style=\"color:var(--exc)\">20</td><td style=\"color:var(--exc)\">21</td></tr>\n<tr><td>22</td><td>23</td><td>24</td><td>25</td><td>26</td><td style=\"color:var(--exc)\">27</td><td style=\"color:var(--exc)\">28</td></tr>\n</tbody></table>\n<p class=\"small\">Julio de 2027 arranca en jueves: el <b>11 de julio de 2027 es domingo</b> y el <b>12, lunes</b>.</p>\n<div class=\"box ej\"><span class=\"lbl\">Las reglas del cómputo</span><ul>\n<li><b>Desde el día siguiente</b> a la notificación o publicación (art. 30.3 LPAC).</li>\n<li>Los plazos por días son <b><span class=\"t\" data-g=\"habiles\">hábiles</span></b> salvo que una ley diga lo contrario (art. 30.2 LPAC).</li>\n<li>Si el requerimiento no se atiende, se tiene por <span class=\"t\" data-g=\"desistido\">desistido</span> al interesado, pero siempre con resolución expresa.</li>\n<li>Los plazos por meses vencen <b>el mismo día</b> del mes correspondiente (art. 30.4), y si ese día es inhábil se <b>prorrogan</b> al siguiente hábil (art. 30.5).</li></ul></div>\n</section><section class=\"card\" id=\"cifras\"><h2>Tabla de cifras y umbrales</h2>\n<p class=\"small\">Pulsa en una columna para ordenar. Son las cifras que hay que llevar de memoria, porque en el examen no habrá textos legales.</p>\n<table id=\"tcif\"><thead><tr><th class=\"sortable\">Cifra</th><th class=\"sortable\">Qué mide</th><th class=\"sortable\">Precepto</th></tr></thead><tbody>\n<tr><td>40.000 €</td><td>Contrato menor de obras (valor estimado, sin IVA)</td><td>Art. 118.1 LCSP</td></tr>\n<tr><td>15.000 €</td><td>Contrato menor de suministros y servicios</td><td>Art. 118.1 LCSP</td></tr>\n<tr><td>5.000 €</td><td>Contrato menor pagado por anticipos de caja fija: sin informe del 118.2</td><td>Art. 118.5 LCSP</td></tr>\n<tr><td>80.000 €</td><td>Obras: tramitación abreviada del abierto simplificado</td><td>Art. 159.6 LCSP</td></tr>\n<tr><td>60.000 €</td><td>Suministros y servicios: tramitación abreviada</td><td>Art. 159.6 LCSP</td></tr>\n<tr><td>2.000.000 €</td><td>Obras: abierto simplificado ordinario</td><td>Art. 159.1.a) LCSP</td></tr>\n<tr><td>10 días hábiles</td><td>Proposiciones en la tramitación abreviada (5 en compras corrientes)</td><td>Art. 159.6.a) LCSP</td></tr>\n<tr><td>15 días</td><td>Proposiciones en el simplificado ordinario (20 en obras)</td><td>Art. 159.3 LCSP</td></tr>\n<tr><td>5 %</td><td>Garantía definitiva, sobre el precio final ofertado sin IVA</td><td>Art. 107.1 LCSP</td></tr>\n<tr><td>3 %</td><td>Tope de la garantía provisional, sobre el presupuesto base sin IVA</td><td>Art. 106.2 LCSP</td></tr>\n<tr><td>10 % de los recursos ordinarios</td><td>Límite de la competencia del Alcalde como órgano de contratación</td><td>D. A. 2.ª.1 LCSP</td></tr>\n<tr><td>6.000.000 €</td><td>Límite absoluto de esa misma competencia</td><td>D. A. 2.ª.1 LCSP</td></tr>\n<tr><td>4 años</td><td>Duración máxima del contrato plurianual que sigue siendo del Alcalde</td><td>D. A. 2.ª.1 LCSP</td></tr>\n<tr><td>10 días</td><td>Subsanación de la solicitud</td><td>Art. 68.1 LPAC</td></tr>\n<tr><td>5 días</td><td>Ampliación de ese plazo, salvo concurrencia competitiva y selectivos</td><td>Art. 68.2 LPAC</td></tr>\n<tr><td>6 meses</td><td>Resolver y notificar la concesión, desde la publicación de la convocatoria</td><td>Art. 25.4 LGS</td></tr>\n<tr><td>3 meses</td><td>Rendir la cuenta justificativa, a falta de previsión en las bases</td><td>Art. 30.2 LGS</td></tr>\n<tr><td>Comunicación a la <span class=\"t\" data-g=\"bdns\">BDNS</span></td><td>Texto de la convocatoria; el extracto va al diario oficial</td><td>Arts. 20.8 y 23.2 LGS</td></tr>\n<tr><td>12 meses</td><td>Procedimiento de reintegro; su transcurso produce caducidad</td><td>Art. 42.4 LGS</td></tr>\n<tr><td>4 años</td><td>Prescripción del derecho a reconocer o liquidar el reintegro</td><td>Art. 39.1 LGS</td></tr>\n</tbody></table>\n</section><section class=\"card\" id=\"test\"><h2>Test · 35 preguntas con corrección razonada</h2>\n<div class=\"tools noprint\" style=\"margin-bottom:.8rem\">\n <button id=\"corr\">Corregir todo</button>\n <button id=\"fallos\">Repetir solo los fallos</button>\n <button id=\"reset\">Reiniciar</button>\n <span id=\"score\" class=\"chip\" style=\"margin-left:.4rem\">0 de 35</span>\n</div>\n<div id=\"testbox\"></div>\n</section><section class=\"card\" id=\"legal\"><h2>Los preceptos, literales</h2>\n<p class=\"small\">Los 35 fragmentos que sostienen las respuestas, transcritos del texto consolidado de la biblioteca del proyecto. Aquí no hay interpretación: solo la letra de la ley.</p>\n<details class=\"panel\"><summary>Art. 118.1 LCSP · umbrales del contrato menor</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LCSP</span><p>«Se consideran contratos menores los contratos de valor estimado inferior a 40.000 euros, cuando se trate de contratos de obras, o a 15.000 euros, cuando se trate de contratos de suministro o de servicios»</p></div></div></details><details class=\"panel\"><summary>Art. 101.1.a) LCSP · con qué cifra se mide</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LCSP</span><p>«el órgano de contratación tomará el importe total, sin incluir el Impuesto sobre el Valor Añadido, pagadero según sus estimaciones»</p></div></div></details><details class=\"panel\"><summary>Art. 101.2.a) LCSP · las prórrogas cuentan</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LCSP</span><p>«Cualquier forma de opción eventual y las eventuales prórrogas del contrato.»</p></div></div></details><details class=\"panel\"><summary>Art. 107.1 LCSP · garantía definitiva</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LCSP</span><p>«deberán constituir a disposición del órgano de contratación una garantía de un 5 por 100 del precio final ofertado por aquellos, excluido el Impuesto sobre el Valor Añadido»</p></div></div></details><details class=\"panel\"><summary>Art. 106.2 LCSP · tope de la garantía provisional</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LCSP</span><p>«no podrá ser superior a un 3 por 100 del presupuesto base de licitación del contrato, excluido el Impuesto sobre el Valor Añadido»</p></div></div></details><details class=\"panel\"><summary>Art. 159.3 LCSP · plazo en el simplificado ordinario</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LCSP</span><p>«El plazo para la presentación de proposiciones no podrá ser inferior a quince días a contar desde el siguiente a la publicación en el perfil de contratante del anuncio de licitación. En los contratos de obras el plazo será como mínimo de veinte días.»</p></div></div></details><details class=\"panel\"><summary>Art. 159.6 LCSP · umbrales del simplificado abreviado</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LCSP</span><p>«En contratos de obras de valor estimado inferior a 80.000 euros, y en contratos de suministros y de servicios de valor estimado inferior a 60.000 euros, excepto los que tengan por objeto prestaciones de carácter intelectual»</p></div></div></details><details class=\"panel\"><summary>Art. 159.6.a) LCSP · plazo en el abreviado</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LCSP</span><p>«El plazo para la presentación de proposiciones no podrá ser inferior a diez días hábiles, a contar desde el siguiente a la publicación del anuncio de licitación en el perfil de contratante.»</p></div></div></details><details class=\"panel\"><summary>Art. 159.6.f) LCSP · sin garantía definitiva</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LCSP</span><p>«No se requerirá la constitución de garantía definitiva.»</p></div></div></details><details class=\"panel\"><summary>D. A. 2.ª.1 LCSP · competencia del Alcalde</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LCSP</span><p>«cuando su valor estimado no supere el 10 por ciento de los recursos ordinarios del presupuesto ni, en cualquier caso, la cuantía de seis millones de euros»</p></div></div></details><details class=\"panel\"><summary>Art. 117.1 LCSP · aprobar el expediente es aprobar el gasto</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LCSP</span><p>«Dicha resolución implicará también la aprobación del gasto»</p></div></div></details><details class=\"panel\"><summary>Art. 118.6 LCSP · publicidad del contrato menor</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LCSP</span><p>«Los contratos menores se publicarán en la forma prevista en el artículo 63.4.»</p></div></div></details><details class=\"panel\"><summary>Art. 173.5 TRLHL · gastar sin crédito</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · TRLHL</span><p>«No podrán adquirirse compromisos de gastos por cuantía superior al importe de los créditos autorizados en los estados de gastos, siendo nulos de pleno derecho los acuerdos, resoluciones y actos administrativos que infrinjan la expresada norma»</p></div></div></details><details class=\"panel\"><summary>Art. 177.1 TRLHL · extraordinario o suplemento</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · TRLHL</span><p>«el presidente de la corporación ordenará la incoación del expediente de concesión de crédito extraordinario, en el primer caso, o de suplemento de crédito, en el segundo»</p></div></div></details><details class=\"panel\"><summary>Art. 177.2 TRLHL · quién lo aprueba</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · TRLHL</span><p>«El expediente, que habrá de ser previamente informado por la Intervención, se someterá a la aprobación del Pleno de la corporación, con sujeción a los mismos trámites y requisitos que los presupuestos.»</p></div></div></details><details class=\"panel\"><summary>Art. 35 RD 500/1990 · la diferencia entre los dos</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · RD500</span><p>«Los suplementos de créditos son aquellas modificaciones del Presupuesto de gastos en los que concurriendo las mismas circunstancias anteriores en relación con el gasto a realizar, el crédito previsto resulta insuficiente y no puede ser objeto de ampliación.»</p></div></div></details><details class=\"panel\"><summary>Art. 22.1 LGS · el prorrateo es excepcional</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LGS</span><p>«Excepcionalmente, siempre que así se prevea en las bases reguladoras, el órgano competente procederá al prorrateo, entre los beneficiarios de la subvención, del importe global máximo destinado a las subvenciones.»</p></div></div></details><details class=\"panel\"><summary>Art. 17.2 LGS · bases reguladoras en las corporaciones locales</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LGS</span><p>«Las bases reguladoras de las subvenciones de las corporaciones locales se deberán aprobar en el marco de las bases de ejecución del presupuesto, a través de una ordenanza general de subvenciones o mediante una ordenanza específica para las distintas modalidades de subvenciones.»</p></div></div></details><details class=\"panel\"><summary>Art. 23.1 LGS · iniciación</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LGS</span><p>«El procedimiento para la concesión de subvenciones se inicia siempre de oficio.»</p></div></div></details><details class=\"panel\"><summary>Art. 25.4 LGS · plazo para resolver</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LGS</span><p>«El plazo máximo para resolver y notificar la resolución del procedimiento no podrá exceder de seis meses»</p></div></div></details><details class=\"panel\"><summary>Art. 25.4 LGS · desde cuándo se cuenta</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LGS</span><p>«El plazo se computará a partir de la publicación de la correspondiente convocatoria, salvo que la misma posponga sus efectos a una fecha posterior.»</p></div></div></details><details class=\"panel\"><summary>Art. 25.5 LGS · sentido del silencio</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LGS</span><p>«El vencimiento del plazo máximo sin haberse notificado la resolución legitima a los interesados para entender desestimada por silencio administrativo la solicitud de concesión de la subvención.»</p></div></div></details><details class=\"panel\"><summary>Art. 19.3 LGS · tope absoluto del importe</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LGS</span><p>«El importe de las subvenciones en ningún caso podrá ser de tal cuantía que, aisladamente o en concurrencia con otras subvenciones, ayudas, ingresos o recursos, supere el coste de la actividad subvencionada.»</p></div></div></details><details class=\"panel\"><summary>Art. 34.4 LGS · pagos anticipados</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LGS</span><p>«También se podrán realizar pagos anticipados que supondrán entregas de fondos con carácter previo a la justificación, como financiación necesaria para poder llevar a cabo las actuaciones inherentes a la subvención. Dicha posibilidad y el régimen de garantías deberán preverse expresamente en la normativa reguladora de la subvención.»</p></div></div></details><details class=\"panel\"><summary>Art. 37.1 LGS · desde cuándo corren los intereses</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LGS</span><p>«procederá el reintegro de las cantidades percibidas y la exigencia del interés de demora correspondiente desde el momento del pago de la subvención hasta la fecha en que se acuerde la procedencia del reintegro»</p></div></div></details><details class=\"panel\"><summary>Art. 37.1.c) LGS · justificación insuficiente</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LGS</span><p>«Incumplimiento de la obligación de justificación o la justificación insuficiente, en los términos establecidos en el artículo 30 de esta ley»</p></div></div></details><details class=\"panel\"><summary>Art. 42.4 LGS · plazo del procedimiento de reintegro</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LGS</span><p>«El plazo máximo para resolver y notificar la resolución del procedimiento de reintegro será de 12 meses desde la fecha del acuerdo de iniciación.»</p></div></div></details><details class=\"panel\"><summary>Art. 39.1 LGS · prescripción</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LGS</span><p>«Prescribirá a los cuatro años el derecho de la Administración a reconocer o liquidar el reintegro.»</p></div></div></details><details class=\"panel\"><summary>Art. 66.1.e) LPAC · la firma</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LPAC</span><p>«Firma del solicitante o acreditación de la autenticidad de su voluntad expresada por cualquier medio.»</p></div></div></details><details class=\"panel\"><summary>Art. 68.1 LPAC · subsanación</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LPAC</span><p>«se requerirá al interesado para que, en un plazo de diez días, subsane la falta o acompañe los documentos preceptivos, con indicación de que, si así no lo hiciera, se le tendrá por desistido de su petición, previa resolución que deberá ser dictada en los términos previstos en el artículo 21.»</p></div></div></details><details class=\"panel\"><summary>Art. 68.2 LPAC · la ampliación que aquí no cabe</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LPAC</span><p>«Siempre que no se trate de procedimientos selectivos o de concurrencia competitiva, este plazo podrá ser ampliado prudencialmente, hasta cinco días»</p></div></div></details><details class=\"panel\"><summary>Art. 30.2 LPAC · días hábiles</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LPAC</span><p>«cuando los plazos se señalen por días, se entiende que éstos son hábiles, excluyéndose del cómputo los sábados, los domingos y los declarados festivos»</p></div></div></details><details class=\"panel\"><summary>Art. 30.3 LPAC · desde el día siguiente</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LPAC</span><p>«Los plazos expresados en días se contarán a partir del día siguiente a aquel en que tenga lugar la notificación o publicación del acto de que se trate»</p></div></div></details><details class=\"panel\"><summary>Art. 30.4 LPAC · plazos por meses</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LPAC</span><p>«El plazo concluirá el mismo día en que se produjo la notificación, publicación o silencio administrativo en el mes o el año de vencimiento.»</p></div></div></details><details class=\"panel\"><summary>Art. 30.5 LPAC · último día inhábil</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LPAC</span><p>«Cuando el último día del plazo sea inhábil, se entenderá prorrogado al primer día hábil siguiente.»</p></div></div></details>\n<div class=\"interp\"><span class=\"lbl\">Aportación externa</span>El criterio de que, en la justificación parcial, la subvención procedente se recalcula sobre el gasto efectivamente acreditado y se reintegra la diferencia no está en un solo precepto: resulta de combinar el art. 37.1.c) con los criterios de graduación que el art. 17.3.n) obliga a fijar en las bases reguladoras. En un examen conviene razonarlo así y citar ambos.</div>\n</section><section class=\"card\" id=\"sem\"><h2>Semáforo de autoevaluación</h2>\n<p class=\"small\">Marca cada destreza. Lo que quede en rojo o ámbar es tu plan de estudio de esta semana.</p>\n<div id=\"sembox\"></div><div id=\"semres\"></div>\n</section><section class=\"card\" id=\"cierre\"><h2>Cierre y repaso espaciado</h2>\n<div class=\"idea\">Lo que de verdad mide este ejercicio: si sabes <b>qué cifra</b> hay que meter en la calculadora. La operación es trivial; elegir el dato correcto es el examen entero.</div>\n<table><thead><tr><th>Si te preguntan…</th><th>La cifra es…</th></tr></thead><tbody>\n<tr><td>Si cabe <span class=\"t\" data-g=\"menor\">contrato menor</span> o qué procedimiento procede</td><td>El valor estimado, sin IVA, con prórrogas</td></tr>\n<tr><td>Si hay crédito suficiente</td><td>El importe total, con IVA</td></tr>\n<tr><td>Qué <span class=\"t\" data-g=\"garantiadef\">garantía definitiva</span> se constituye</td><td>El precio final ofertado, sin IVA — salvo que sea tramitación abreviada, donde no hay</td></tr>\n<tr><td>Quién es el órgano de contratación</td><td>El valor estimado frente al 10 % de los recursos ordinarios</td></tr>\n<tr><td>Qué subvención corresponde</td><td>El porcentaje sobre el presupuesto, y después el tope</td></tr>\n<tr><td>Qué <span class=\"t\" data-g=\"reintegro\">reintegro</span> procede</td><td>El porcentaje sobre el gasto justificado, comparado con lo percibido</td></tr>\n</tbody></table>\n<div class=\"box ej\"><span class=\"lbl\">Calendario de repaso espaciado</span><ul>\n<li><b>31 de octubre de 2026</b> — rehaz solo los fallos.</li>\n<li><b>2 de noviembre de 2026</b> — las dos tablas de cifras, de memoria y en papel.</li>\n<li><b>6 de noviembre de 2026</b> — el simulacro completo, cronometrado a 60 minutos.</li>\n<li><b>20 de noviembre de 2026</b> — último pase antes del examen del 5 de diciembre.</li></ul></div>\n</section>";
</script>

 });

  document.querySelectorAll('section.card').forEach(function(s){

   var w=document.createTreeWalker(s,NodeFilter.SHOW_TEXT,null);var nodes=[];
   while(w.nextNode()){var nd=w.currentNode;
    if(nd.parentNode.closest('script,style,mark,svg'))continue;
    if(rx.test(nd.nodeValue)){nodes.push(nd);rx.lastIndex=0;}}
   nodes.forEach(function(nd){
    found=true;
    var span=document.createElement('span');
    span.innerHTML=nd.nodeValue.replace(rx,function(m){return '<mark class="hit">'+m+'</mark>';});
    nd.parentNode.replaceChild(span,nd);});
   if(found){s.querySelectorAll('details.panel').forEach(function(d){if(d.querySelector('mark.hit'))d.open=true;});}

<script>

/* ═══ Mejoras de interacción · Bloque II ═══ */
(function(){
"use strict";
var K_THEME="oposi_bII_theme", K_FS="oposi_bII_fs", K_STREAK="oposi_bII_streak";
function load(k,f){try{var v=localStorage.getItem(k);return v?JSON.parse(v):f;}catch(e){return f;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
var root=document.documentElement;

/* Tema persistente (sobrescribe el toggle simple anterior) */
var saved=load(K_THEME,null);
if(saved){root.setAttribute("data-theme",saved);}
else if(window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches){root.setAttribute("data-theme","dark");}
var bt=document.getElementById("theme");
if(bt)bt.onclick=function(){
  var n=root.getAttribute("data-theme")==="dark"?"light":"dark";
  root.setAttribute("data-theme",n);save(K_THEME,n);
};

/* Tamaño de texto persistente · solo afecta al cuerpo de la página */
var fs=load(K_FS,16);
function setFs(v){
  fs=Math.max(13,Math.min(22,v));
  root.style.setProperty("--z",(fs/16).toFixed(4));
  save(K_FS,fs);
}
setFs(fs);
var bp=document.getElementById("fs+"),bm=document.getElementById("fs-");
if(bp)bp.onclick=function(){setFs(fs+1);};
if(bm)bm.onclick=function(){setFs(fs-1);};

/* Racha compartida con el índice */
(function(){
  var el=document.getElementById("streakN");if(!el)return;
  var hoy=new Date().toISOString().slice(0,10);
  var s=load(K_STREAK,{last:null,n:0});
  if(s.last!==hoy){
    var ayer=new Date(Date.now()-864e5).toISOString().slice(0,10);
    s.n=(s.last===ayer)?s.n+1:1;s.last=hoy;save(K_STREAK,s);
  }
  el.textContent=s.n;
})();

/* Reveal on scroll para las tarjetas */
function reveal(){
  var els=document.querySelectorAll("section.card:not(.rv)");
  if(!els.length)return;
  if(!("IntersectionObserver" in window)){return;}
  var io=new IntersectionObserver(function(es){
    es.forEach(function(en){if(en.isIntersecting){en.target.classList.add("in");io.unobserve(en.target);}});
  },{threshold:.06,rootMargin:"0px 0px -30px 0px"});
  Array.prototype.forEach.call(els,function(el){el.classList.add("rv");io.observe(el);});
}

/* Sección activa en el índice lateral */
function spy(){
  var links=document.querySelectorAll("nav.side a[href^='#']");
  if(!links.length||!("IntersectionObserver" in window))return;
  var map={};
  Array.prototype.forEach.call(links,function(a){
    var t=document.getElementById(a.getAttribute("href").slice(1));
    if(t)map[t.id]=a;
  });
  var io=new IntersectionObserver(function(es){
    es.forEach(function(en){
      if(en.isIntersecting){
        Array.prototype.forEach.call(links,function(a){a.classList.remove("on");});
        if(map[en.target.id])map[en.target.id].classList.add("on");
      }
    });
  },{rootMargin:"-80px 0px -70% 0px",threshold:0});
  Object.keys(map).forEach(function(id){io.observe(document.getElementById(id));});
}

/* Ripple en botones */
document.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b||b.classList.contains("navtoggle"))return;
  var r=b.getBoundingClientRect(),d=Math.max(r.width,r.height),s=document.createElement("span");
  s.className="ripple";s.style.width=s.style.height=d+"px";
  s.style.left=(e.clientX-r.left-d/2)+"px";s.style.top=(e.clientY-r.top-d/2)+"px";
  b.appendChild(s);setTimeout(function(){if(s.parentNode)s.parentNode.removeChild(s);},560);
});

/* Atajos de teclado */
document.addEventListener("keydown",function(e){
  if(e.target.matches("input,textarea"))return;
  if(e.key==="/"){var q=document.getElementById("q");if(q){e.preventDefault();q.focus();}}
  if(e.key==="t"&&bt)bt.click();
});

/* El contenido se inyecta por JS: esperamos a que exista */
function init(){reveal();spy();}
if(document.getElementById("main")&&document.getElementById("main").children.length){init();}
else{setTimeout(init,60);}
addEventListener("load",function(){setTimeout(init,80);});
})();


</script>
<script>


/* ═══ Parser de respuestas: estructura semántica ═══ */
var FCFMT=(function(){
  var CITA=/\s*\(((?:arts?\.|DA\b|DT\b|disp\.)[^)]*)\)\s*\.?\s*$/i;
  var strip=function(h){return h.replace(/<[^>]+>/g,"");};

  function esc(s){return s;}

  function parse(raw){
    var out={verdict:null,cite:null,kind:"p",items:[],text:""};
    var body=String(raw).trim();

    /* 1 ── Cita legal al final */
    var m=body.match(CITA);
    if(m){out.cite=m[1].replace(/\s+/g," ").trim();body=body.slice(0,m.index).trim();}
    body=body.replace(/[.;,\s]+$/,"");

    /* 2 ── Veredicto Sí / No inicial */
    var v=strip(body).match(/^(Sí|Sí,|No|No,)[.:,]?\s/);
    if(v){
      out.verdict=/^Sí/.test(v[1])?"si":"no";
      body=body.replace(/^(<[^>]+>\s*)*(Sí|No)[.,:]?\s*/,"").trim();
      body=body.replace(/^en\s/,"En ");
    }

    /* 3 ── Enumeración con · */
    var parts=body.split(/\s+·\s+/);
    if(parts.length>=2){
      out.kind="list";
      var letras=parts.filter(function(p){return /^\s*<?[a-h]\)/.test(strip(p));}).length;
      out.marker = letras>=parts.length-1 ? "alpha" : "num";
      out.items=parts.map(function(p){
        return p.replace(/^\s*[a-h]\)\s*/,"").replace(/[.\s]+$/,"").trim();
      }).filter(Boolean);
      return out;
    }

    /* 4 ── Cláusulas contrapuestas con ; */
    var semi=body.split(/;\s+/);
    if(semi.length>=2&&semi.length<=3&&semi.every(function(s){return strip(s).length>14;})){
      out.kind="clauses";
      out.items=semi.map(function(s){return s.replace(/[.\s]+$/,"").trim();});
      return out;
    }

    /* 5 ── Párrafo */
    out.text=body;
    return out;
  }

  function render(raw){
    var d=parse(raw),h="";

    if(d.verdict){
      h+='<span class="fc-verdict '+d.verdict+'">'+(d.verdict==="si"?"✓ Sí":"✗ No")+'</span>';
    }

    if(d.kind==="list"){
      h+='<ol class="fc-list '+d.marker+'">';
      d.items.forEach(function(it){h+='<li>'+it+'</li>';});
      h+='</ol>';
    }else if(d.kind==="clauses"){
      h+='<div class="fc-clauses">';
      d.items.forEach(function(it){h+='<p>'+it+'</p>';});
      h+='</div>';
    }else if(d.text){
      h+='<p class="fc-p">'+d.text+'</p>';
    }

    if(d.cite){
      h+='<span class="fc-cite"><span class="s">§</span>'+d.cite+'</span>';
    }
    return {html:h,struct:(d.kind!=="p"||!!d.verdict||strip(raw).length>150)};
  }
  return {parse:parse,render:render};
})();

  ctr.innerHTML='<button id="fcflip">⟲ Girar</button>'

      +'<span class="fc-pill ok" id="fcpok">0 sabidas</span>'

  var rot=0;

    card.style.display="";

  function bump(el){el.classList.remove("bump");void el.offsetWidth;el.classList.add("bump");}

    pok.textContent=ok+(ok===1?" sabida":" sabidas");
    pko.textContent=ko+" repasar";
    var done=N-order.length;
    fill.style.width=(N?done/N*100:0)+"%";

        deck.appendChild(d);

    if(busy||!order.length)return;

    if(e.key===" "){e.preventDefault();flip();}
    else if(e.key==="ArrowRight"){e.preventDefault();next(true);}
    else if(e.key==="ArrowLeft"){e.preventDefault();next(false);}
  });

  reset();
  return true;
}
if(!boot()){
  var tries=0;
  var iv=setInterval(function(){if(boot()||++tries>40)clearInterval(iv);},120);
  addEventListener("load",function(){setTimeout(boot,100);});
}
})();

/* ═══ Altura adaptativa + índice plegable ═══ */
(function(){
"use strict";

/* ── 1 · Índice lateral plegable ── */
function sidebar(){
  var lay=document.querySelector(".layout"),
      side=document.getElementById("side"),
      tools=document.querySelector(".tools");
  if(!lay||!side||!tools||document.getElementById("navhide"))return;

  var K="oposi_bII_nav";
  function get(){try{return localStorage.getItem(K)==="0";}catch(e){return false;}}
  function set(v){try{localStorage.setItem(K,v?"0":"1");}catch(e){}}

  var b=document.createElement("button");
  b.id="navhide";b.type="button";
  b.innerHTML='<span class="ic">☰</span>';
  b.setAttribute("aria-controls","side");
  tools.insertBefore(b,tools.firstChild);

  function apply(hidden,anim){
    if(!anim)lay.style.transition="none";
    lay.classList.toggle("nonav",hidden);
    side.setAttribute("aria-hidden",String(hidden));
    b.setAttribute("aria-pressed",String(hidden));
    b.title=hidden?"Mostrar índice (i)":"Ocultar índice (i)";
    b.setAttribute("aria-label",b.title);
    if(!anim)requestAnimationFrame(function(){lay.style.transition="";});
  }
  apply(get(),false);

  b.onclick=function(){
    var h=!lay.classList.contains("nonav");
    apply(h,true);set(h);
    window.dispatchEvent(new Event("resize"));
  };
  document.addEventListener("keydown",function(e){
    if(e.target.matches("input,textarea,select"))return;
    if(e.key==="i"||e.key==="I"){e.preventDefault();b.click();}
  });
}

/* ── 2 · La tarjeta se adapta a su contenido ── */
function autofit(){
  var stage=document.querySelector(".fc-stage");
  if(!stage||stage.dataset.fit)return;
  var deck=stage.querySelector(".fc-deck"),
      front=stage.querySelector(".fc-front"),
      back=stage.querySelector(".fc-back");
  if(!deck||!front||!back)return;
  stage.dataset.fit="1";

  var meas=document.createElement("div");
  meas.className="fc-measure";meas.setAttribute("aria-hidden","true");
  meas.innerHTML='<div class="fc-face fc-front"><div class="fc-body"><div class="fc-txt"></div></div></div>';
  stage.appendChild(meas);
  var mFace=meas.querySelector(".fc-face"), mTxt=meas.querySelector(".fc-txt");

  function measure(cls,html){
    mFace.className="fc-face "+cls;
    mTxt.innerHTML=html;
    return mFace.offsetHeight;
  }

  function fit(){
    if(deck.classList.contains("empty")){deck.style.height="230px";return;}
    var fT=front.querySelector(".fc-txt"), bT=back.querySelector(".fc-txt");
    if(!fT||!bT)return;
    var h=Math.max(
      measure("fc-front"+(front.classList.contains("struct")?" struct":""),fT.innerHTML),
      measure("fc-back" +(back .classList.contains("struct")?" struct":""),bT.innerHTML),
      230
    );
    deck.style.height=Math.ceil(h+8)+"px";
  }

  /* recalcular cuando cambia la tarjeta, el tamaño de letra o la ventana */
  new MutationObserver(fit).observe(back,{childList:true,subtree:true,attributes:true,attributeFilter:["class"]});
  var t;
  addEventListener("resize",function(){clearTimeout(t);t=setTimeout(fit,120);},{passive:true});
  ["fs+","fs-"].forEach(function(id){
    var el=document.getElementById(id);
    if(el)el.addEventListener("click",function(){setTimeout(fit,60);});
  });
  fit();setTimeout(fit,250);
}

function go(){sidebar();autofit();}
if(document.readyState!=="loading")go();else document.addEventListener("DOMContentLoaded",go);
addEventListener("load",function(){setTimeout(go,120);});
var n=0,iv=setInterval(function(){go();if(++n>25)clearInterval(iv);},150);
})();


</script>

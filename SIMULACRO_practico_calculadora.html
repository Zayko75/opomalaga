<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulacro · Dos supuestos prácticos tipo test con calculadora</title>
<style>

/* ═══════════════════════════════════════════════════════════════
   SISTEMA DE DISEÑO · "Académico Gamificado" · Bloque II
   Temas 8, 9 y 10 · Auxiliar Administrativo
   ═══════════════════════════════════════════════════════════════ */
:root{
  --z:1;              /* A+ / A− · solo agranda el cuerpo de la página */

  --bg:#faf9f7;
  --bg-grad:radial-gradient(1100px 560px at 12% -8%, #ede9ff 0%, transparent 55%),
            radial-gradient(850px 460px at 96% 0%, #dcf5ee 0%, transparent 50%);
  --surface:#ffffff;
  --surface-2:#f4f3f0;
  --surface-3:#eceae5;
  --line:#e6e3dc;
  --line-strong:#d4d0c7;

  --ink:#15161c;
  --ink-2:#5d616e;
  --ink-3:#8b8f9c;

  --brand:#5b3df5;
  --brand-2:#7c5cff;
  --brand-soft:#efeaff;
  --brand-ring:rgba(91,61,245,.18);

  --legal:#4338ca;  --legal-bg:#eeecff;
  --ej:#059669;     --ej-bg:#e4f7f0;
  --warn:#c2690a;   --warn-bg:#fdf1de;
  --exc:#dc2626;    --exc-bg:#ffeceb;

  --ok:#16a34a; --ok-soft:#e7f7ec;
  --mid:#eab308; --mid-soft:#fdf6dd;
  --off:#a1a1aa; --off-soft:#f1f1f3;

  --sh-1:0 1px 2px rgba(20,20,30,.04), 0 2px 8px rgba(20,20,30,.04);
  --sh-2:0 2px 6px rgba(20,20,30,.05), 0 12px 28px rgba(20,20,30,.07);
  --sh-3:0 8px 20px rgba(91,61,245,.13), 0 24px 56px rgba(20,20,30,.10);
  --sh-glow:0 0 0 4px var(--brand-ring);

  --r-sm:9px; --r-md:14px; --r-lg:20px; --r-full:999px;

  --f-display:"Segoe UI Variable Display",system-ui,-apple-system,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-legal:ui-serif,Georgia,Cambria,"Times New Roman",serif;
  --f-mono:ui-monospace,"SF Mono","Cascadia Mono","Segoe UI Mono",Menlo,monospace;

  --t-h1:clamp(1.02rem,.95rem + .3vw,1.2rem);
  --t-h2:clamp(1.2rem,1.05rem + .6vw,1.55rem);
  --t-h3:clamp(1rem,.95rem + .25vw,1.12rem);
  --t-sm:.86rem;
  --t-xs:.75rem;

  --e-out:cubic-bezier(.22,1,.36,1);
  --e-spring:cubic-bezier(.34,1.56,.64,1);

  /* ── Compatibilidad con SVG y contenido generado ── */
  --panel:var(--surface);
  --ink2:var(--ink-2);
  --acc:var(--brand);
  --acc-soft:var(--brand-soft);
  --g:var(--ok); --y:var(--mid); --r:var(--exc);
}

html[data-theme="dark"]{
  --bg:#0a0b0f;
  --bg-grad:radial-gradient(1100px 560px at 12% -8%, #1c1740 0%, transparent 55%),
            radial-gradient(850px 460px at 96% 0%, #08302b 0%, transparent 50%);
  --surface:#13151b;
  --surface-2:#1a1d25;
  --surface-3:#232733;
  --line:#262a34;
  --line-strong:#343947;

  --ink:#eceef4;
  --ink-2:#9ba2b3;
  --ink-3:#6e7585;

  --brand:#8b6dff;
  --brand-2:#a78bff;
  --brand-soft:#1e1a3d;
  --brand-ring:rgba(139,109,255,.22);

  --legal:#a5b4fc; --legal-bg:#191b3a;
  --ej:#34d399;    --ej-bg:#0c2a24;
  --warn:#fbbf24;  --warn-bg:#2e2110;
  --exc:#fb7185;   --exc-bg:#331119;

  --ok:#4ade80; --ok-soft:#0e2a19;
  --mid:#facc15; --mid-soft:#2c2610;
  --off:#5b6070; --off-soft:#1c1f27;

  --sh-1:0 1px 2px rgba(0,0,0,.3), 0 2px 8px rgba(0,0,0,.25);
  --sh-2:0 2px 6px rgba(0,0,0,.35), 0 12px 28px rgba(0,0,0,.4);
  --sh-3:0 8px 20px rgba(139,109,255,.2), 0 24px 56px rgba(0,0,0,.5);
}

*,*::before,*::after{box-sizing:border-box}
html{font-size:16px;scroll-behavior:smooth}
/* A+ y A− agrandan o reducen únicamente el cuerpo: el texto de los
   artículos, las tablas y los diagramas. La cabecera, el índice lateral
   y los botones conservan su tamaño para no descolocar la pantalla. */
main{zoom:var(--z)}
@media print{main{zoom:1}}
body{
  margin:0;background:var(--bg);background-image:var(--bg-grad);
  background-attachment:fixed;background-repeat:no-repeat;
  color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.68;
  -webkit-font-smoothing:antialiased;
  transition:background-color .5s var(--e-out),color .3s;
}
::selection{background:var(--brand);color:#fff}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{font-family:var(--f-display);letter-spacing:-.022em;line-height:1.2}
.num{font-variant-numeric:tabular-nums}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:99px;border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3)}

/* ═══ HEADER ═══ */
header.top{
  position:sticky;top:0;z-index:60;
  background:color-mix(in srgb,var(--surface) 80%,transparent);
  backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);
  border-bottom:1px solid var(--line);
}
/* El título ocupa su propia línea, encima de los botones. Antes competía
   por el ancho con la barra de herramientas y acababa desmigado en una
   columna de una palabra por línea. */
.top-in{max-width:1280px;margin:0 auto;padding:.6rem 1.1rem .55rem;display:flex;flex-direction:column;gap:.5rem;align-items:stretch}
.brandwrap{display:flex;align-items:center;gap:.65rem;min-width:0;width:100%}
.mark{
  width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;
  font-weight:800;font-size:.8rem;letter-spacing:-.02em;text-decoration:none;
  box-shadow:0 4px 14px var(--brand-ring);
  transition:transform .3s var(--e-spring),box-shadow .3s;
}
.mark:hover{transform:rotate(-8deg) scale(1.08);box-shadow:var(--sh-3);text-decoration:none}
.top h1{font-size:var(--t-h1);margin:0;font-weight:800;line-height:1.25;min-width:0;flex:1 1 auto}
/* como mucho dos líneas: si no cabe, se recorta con puntos suspensivos */
.top h1 .tit{
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;text-wrap:balance;
}
.top h1 .sub{display:block;font-size:var(--t-xs);color:var(--ink-2);font-weight:500;letter-spacing:0;
  margin-top:.1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tools{margin-left:0;display:flex;gap:.4rem;flex-wrap:wrap;align-items:center;width:100%}

button,select,input[type=search]{
  font:inherit;font-size:var(--t-sm);font-weight:600;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:var(--r-sm);padding:.4rem .72rem;cursor:pointer;
  position:relative;overflow:hidden;
  transition:transform .18s var(--e-spring),border-color .2s,background .2s,box-shadow .2s,color .2s;
}
button:hover{transform:translateY(-1.5px);border-color:var(--brand);box-shadow:var(--sh-1)}
button:active{transform:translateY(0) scale(.97)}
button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible{outline:none;box-shadow:var(--sh-glow)}
input[type=search]{min-width:190px;cursor:text;font-weight:500}
input[type=search]:focus{border-color:var(--brand)}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--surface-2);padding:2px;gap:2px}
.seg button{border:0;border-radius:calc(var(--r-sm) - 2px);padding:.32rem .68rem;background:transparent;box-shadow:none}
.seg button:hover{transform:none;background:var(--surface)}
.seg button[aria-pressed="true"]{background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;box-shadow:0 2px 8px var(--brand-ring)}

.ripple{position:absolute;border-radius:50%;transform:scale(0);background:currentColor;opacity:.25;animation:rip .55s linear;pointer-events:none}
@keyframes rip{to{transform:scale(3.4);opacity:0}}

.progress{position:absolute;left:0;bottom:-1px;height:2.5px;width:0;
  background:linear-gradient(90deg,var(--brand),var(--legal),var(--ej));transition:width .1s linear}

/* ═══ LAYOUT ═══ */
.layout{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:270px 1fr;gap:1.8rem;padding:1.4rem 1.1rem 5rem}
main{min-width:0}

/* ═══ SIDEBAR ═══ */
nav.side{
  position:sticky;top:76px;align-self:start;max-height:calc(100vh - 96px);overflow:auto;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:.85rem;box-shadow:var(--sh-1);
}
nav.side h2{font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);
  margin:.5rem .4rem .5rem;font-weight:800}
nav.side h2:first-child{margin-top:.1rem}
nav.side a{
  display:flex;align-items:baseline;gap:.5rem;padding:.36rem .55rem;border-radius:var(--r-sm);
  text-decoration:none;color:var(--ink-2);font-size:var(--t-sm);font-weight:500;
  position:relative;transition:background .22s,color .22s,transform .22s var(--e-out);
}
nav.side a:hover{background:var(--surface-2);color:var(--ink);transform:translateX(3px);text-decoration:none}
nav.side a.on{background:var(--brand-soft);color:var(--brand);font-weight:700}
nav.side a.on::before{content:"";position:absolute;left:-.85rem;top:20%;bottom:20%;width:3px;
  border-radius:0 3px 3px 0;background:var(--brand)}
nav.side a b{color:var(--ink-3);font-weight:800;font-size:var(--t-xs);font-variant-numeric:tabular-nums;flex:none;min-width:1.9em}
nav.side a.on b{color:var(--brand)}
.navtoggle{display:none}

/* ═══ TARJETAS ═══ */
section.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:1.35rem 1.5rem;margin-bottom:1.1rem;box-shadow:var(--sh-1);
  transition:box-shadow .3s var(--e-out),border-color .3s;
}
section.card:hover{box-shadow:var(--sh-2)}
section.card>h2{
  margin:0 0 1rem;font-size:var(--t-h2);font-weight:800;
  display:flex;align-items:center;gap:.6rem;
}
section.card>h2::before{
  content:"";width:4px;height:1.05em;border-radius:99px;flex:none;
  background:linear-gradient(180deg,var(--brand),var(--brand-2));
}

/* ═══ ARTÍCULO ═══ */
.art{scroll-margin-top:86px;padding-top:.4rem}
.art + .art{margin-top:1.6rem;padding-top:1.6rem;border-top:1px dashed var(--line)}
.art h2{display:flex;flex-wrap:wrap;gap:.5rem;align-items:baseline;font-size:var(--t-h3);
  margin:0 0 .25rem;font-weight:800;letter-spacing:-.015em}
.art h2 .num{
  color:var(--brand);font-weight:800;font-family:var(--f-display);
  background:var(--brand-soft);padding:.1rem .5rem;border-radius:var(--r-sm);
  font-size:.92em;letter-spacing:-.02em;
}
.ubic{font-size:var(--t-xs);color:var(--ink-3);margin:0 0 .8rem;font-weight:600;
  letter-spacing:.03em;text-transform:uppercase}

/* ═══ IDEA CLAVE ═══ */
.idea{
  background:linear-gradient(100deg,var(--brand-soft),color-mix(in srgb,var(--brand-soft) 40%,transparent));
  border-left:4px solid var(--brand);border-radius:0 var(--r-md) var(--r-md) 0;
  padding:.75rem 1rem;font-weight:650;margin:.7rem 0 1rem;position:relative;
  font-size:.97rem;line-height:1.55;
}

/* ═══ ACORDEÓN ═══ */
details.panel{
  border:1px solid var(--line);border-radius:var(--r-md);margin:.6rem 0;
  background:var(--surface);overflow:hidden;
  transition:border-color .25s,box-shadow .25s,background .25s;
}
details.panel:hover{border-color:var(--line-strong)}
details.panel[open]{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-ring)}
details.panel>summary{
  cursor:pointer;padding:.62rem .9rem;font-weight:700;font-size:.93rem;
  list-style:none;display:flex;align-items:center;gap:.55rem;
  transition:background .2s,color .2s;
}
details.panel>summary:hover{background:var(--surface-2)}
details.panel[open]>summary{background:var(--brand-soft);color:var(--brand)}
details.panel>summary::-webkit-details-marker{display:none}
details.panel>summary::before{
  content:"";width:16px;height:16px;flex:none;border-radius:5px;
  background:var(--brand-soft);position:relative;transition:transform .3s var(--e-spring),background .25s;
}
details.panel>summary::after{
  content:"";position:absolute;width:0;height:0;margin-left:5px;
  border:4px solid transparent;border-left-color:var(--brand);
  transition:transform .3s var(--e-spring);
}
details.panel[open]>summary::before{background:var(--surface)}
details.panel[open]>summary::after{transform:rotate(90deg) translateX(-1px)}
details.panel .body{padding:.3rem 1rem 1rem;font-size:.95rem;animation:slidein .35s var(--e-out)}
@keyframes slidein{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* ═══ TEXTO LEGAL ═══ */
.legal{
  background:var(--legal-bg);border-left:4px solid var(--legal);
  border-radius:0 var(--r-md) var(--r-md) 0;padding:.85rem 1.05rem;
  font-family:var(--f-legal);font-size:.95rem;line-height:1.7;
}
.legal p{margin:.45rem 0}
.legal .lbl{
  font-family:var(--f-body);font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;
  color:var(--legal);font-weight:800;display:block;margin-bottom:.4rem;
}

/* ═══ CAJAS SEMÁNTICAS ═══ */
.box{
  border-left:4px solid var(--line);border-radius:0 var(--r-md) var(--r-md) 0;
  padding:.72rem .95rem;margin:.65rem 0;font-size:.94rem;
  transition:transform .25s var(--e-out),box-shadow .25s;
}
.box:hover{transform:translateX(3px);box-shadow:var(--sh-1)}
.box.ej{background:var(--ej-bg);border-color:var(--ej)}
.box.warn{background:var(--warn-bg);border-color:var(--warn)}
.box.exc{background:var(--exc-bg);border-color:var(--exc)}
.box .lbl{font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;font-weight:800;
  display:block;margin-bottom:.3rem}
.box.ej .lbl{color:var(--ej)}
.box.warn .lbl{color:var(--warn)}
.box.exc .lbl{color:var(--exc)}

.interp{
  border:1px dashed var(--warn);background:color-mix(in srgb,var(--warn-bg) 45%,transparent);
  border-radius:var(--r-md);padding:.65rem .9rem;font-size:.9rem;margin:.6rem 0;
}
.interp .lbl{font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;color:var(--warn);font-weight:800;display:block}

/* ═══ TABLAS ═══ */
table{width:100%;border-collapse:separate;border-spacing:0;font-size:.9rem;margin:.7rem 0;
  border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
th,td{padding:.5rem .68rem;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
td + td, th + th{border-left:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th{background:var(--surface-2);font-size:var(--t-xs);font-weight:800;letter-spacing:.05em;
  text-transform:uppercase;color:var(--ink-2);position:sticky;top:0}
tbody tr{transition:background .18s}
tbody tr:nth-child(even){background:color-mix(in srgb,var(--surface-2) 45%,transparent)}
tbody tr:hover{background:var(--brand-soft)}
th.sortable{cursor:pointer;user-select:none;transition:color .2s,background .2s}
th.sortable:hover{color:var(--brand);background:var(--brand-soft)}
th.sortable::after{content:" ⇅";color:var(--ink-3);font-size:.7rem}

ul,ol{margin:.5rem 0 .5rem 1.2rem;padding:0}
li{margin:.26rem 0}
li::marker{color:var(--brand);font-weight:700}

/* ═══ TOOLTIPS ═══ */
.t{border-bottom:1.5px dotted var(--brand);cursor:help;position:relative;
  transition:background .2s,color .2s}
.t:hover{background:var(--brand-soft);color:var(--brand);border-radius:3px}
#tip{
  position:fixed;z-index:99;max-width:330px;background:var(--ink);color:var(--bg);
  padding:.6rem .78rem;border-radius:var(--r-md);font-size:.82rem;line-height:1.5;
  display:none;box-shadow:0 8px 30px rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.08);
}
html[data-theme="dark"] #tip{background:#f0f1f5;color:#15161c}

/* ═══ FLECHAS DE DIAGRAMA ═══
   Un <path> con stroke pero sin fill toma el valor inicial (negro) y el
   navegador cierra el trazo implícitamente: aparece un triángulo relleno
   entre sus extremos. Forzamos fill:none para dejar solo la línea + la
   punta del <marker>, que sí lleva su color. */
svg path[stroke]:not([fill]){fill:none}
svg polyline:not([fill]){fill:none}
svg line{fill:none}

/* ═══ SVG ═══ */
svg{max-width:100%;height:auto;display:block;margin:.9rem auto}
svg text{font-family:var(--f-body)}

/* ═══ BUSCADOR ═══ */
mark.hit{background:linear-gradient(180deg,transparent 55%,#ffe066 55%);color:inherit;
  border-radius:2px;padding:0 1px;font-weight:600}
html[data-theme="dark"] mark.hit{background:linear-gradient(180deg,transparent 55%,#8a6d00 55%);color:#fff}

/* ═══ UTILIDADES ═══ */
.hide{display:none !important}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.small{font-size:var(--t-sm);color:var(--ink-2)}
.chip{
  display:inline-block;font-size:var(--t-xs);padding:.16rem .55rem;border-radius:var(--r-full);
  background:var(--brand-soft);color:var(--brand);font-weight:800;letter-spacing:.02em;
}

/* ═══ HUECOS RELLENABLES ═══ */
.gap{
  display:inline-block;min-width:5.5em;border-bottom:2px solid var(--brand);
  text-align:center;font-weight:700;color:transparent;cursor:pointer;
  transition:color .3s,background .3s;
}
.gap.on,.gap:hover{color:var(--brand);background:var(--brand-soft);border-radius:4px 4px 0 0}

/* ═══ REVELAR SOLUCIÓN ═══ */
.revelar{
  background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;border-color:transparent;
  font-weight:700;
}
.revelar:hover{box-shadow:var(--sh-3)}
.sol{
  margin-top:.7rem;padding:.8rem 1rem;border-radius:var(--r-md);
  background:var(--ej-bg);border-left:4px solid var(--ej);
  animation:slidein .4s var(--e-out);
}

/* ═══ TEST ═══ */
.opt{
  display:block;padding:.55rem .85rem;margin:.35rem 0;border:1.5px solid var(--line);
  border-radius:var(--r-md);cursor:pointer;background:var(--surface);font-size:.94rem;
  transition:border-color .22s,background .22s,transform .22s var(--e-out);
}
.opt:hover{border-color:var(--brand);background:var(--brand-soft);transform:translateX(4px)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft);font-weight:650}
.opt.ko{border-color:var(--exc);background:var(--exc-bg)}
.opt input{margin-right:.5rem;accent-color:var(--brand)}

#tscore,#semres{
  font-family:var(--f-display);font-weight:800;font-size:1.15rem;letter-spacing:-.02em;
}

/* ═══════════════════════════════════════════════════════════════
   FLASHCARDS 3D · mazo con giro, vuelo de salida y sheen
   ═══════════════════════════════════════════════════════════════ */
#flash{--fc-e:cubic-bezier(.2,.8,.25,1);--fc-h:250px}

/* — Escena — */
.fc-stage{
  perspective:1400px;perspective-origin:50% 45%;
  padding:.4rem 0 .2rem;position:relative;
}
.fc-deck{position:relative;height:var(--fc-h);will-change:transform}

/* — Cartas fantasma del mazo — */
.fc-ghost{
  position:absolute;inset:0;border-radius:var(--r-lg);
  background:var(--surface);border:1px solid var(--line);
  transition:transform .5s var(--fc-e),opacity .5s var(--fc-e);
}
.fc-ghost.g1{transform:translateY(9px) scale(.972);opacity:.75}
.fc-ghost.g2{transform:translateY(18px) scale(.944);opacity:.45}
.fc-deck.empty .fc-ghost{opacity:0;transform:translateY(26px) scale(.9)}

/* — Elevación durante el giro — */
.fc-lift{position:absolute;inset:0;transform-style:preserve-3d}
.fc-lift.lift{animation:fcLift .78s var(--fc-e)}
@keyframes fcLift{
  0%,100%{transform:scale(1) translateY(0)}
  45%{transform:scale(1.055) translateY(-16px)}
}
.fc-lift.out-ok{animation:fcOut .5s cubic-bezier(.5,0,.75,0) forwards}
.fc-lift.out-ko{animation:fcOutKo .5s cubic-bezier(.5,0,.75,0) forwards}
.fc-lift.in{animation:fcIn .48s var(--fc-e)}
@keyframes fcOut{
  0%{transform:translateX(0) rotate(0) scale(1);opacity:1}
  100%{transform:translateX(130%) rotate(17deg) scale(.85);opacity:0}
}
@keyframes fcOutKo{
  0%{transform:translateX(0) rotate(0) scale(1);opacity:1}
  100%{transform:translateX(-130%) rotate(-17deg) scale(.85);opacity:0}
}
@keyframes fcIn{
  0%{transform:translateY(26px) scale(.9);opacity:0}
  100%{transform:translateY(0) scale(1);opacity:1}
}

/* — La carta — */
.fc-card{
  position:absolute;inset:0;transform-style:preserve-3d;
  transition:transform .78s var(--fc-e);
  cursor:pointer;border-radius:var(--r-lg);
}
.fc-card:focus-visible{outline:none}
.fc-card:focus-visible .fc-face{box-shadow:var(--sh-glow),var(--sh-2)}

/* — Caras — */
.fc-face{
  position:absolute;inset:0;border-radius:var(--r-lg);
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  padding:2rem 2.2rem;text-align:center;overflow:hidden;
  box-shadow:var(--sh-2);
  transition:box-shadow .4s var(--fc-e);
}
.fc-card:hover .fc-face{box-shadow:var(--sh-3)}

/* Anverso · pregunta */
.fc-front{
  background:
    radial-gradient(120% 90% at 50% -20%, var(--brand-soft) 0%, transparent 60%),
    var(--surface);
  border:1.5px solid var(--line);color:var(--ink);
}
/* Reverso · respuesta */
.fc-back{
  transform:rotateY(180deg);
  background:linear-gradient(145deg,var(--brand) 0%,#6d4bf7 45%,var(--c5,#0891b2) 130%);
  border:1.5px solid transparent;color:#fff;
}
html[data-theme="dark"] .fc-back{
  background:linear-gradient(145deg,#5f45c9 0%,#4b3aa8 45%,#0e6b85 130%);
}
.fc-back .fc-txt{color:#fff}
.fc-back b,.fc-back strong{color:#fff;font-weight:800}

/* — Sheen que barre al girar — */
.fc-face::after{
  content:"";position:absolute;top:-60%;left:-70%;width:55%;height:220%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.42),transparent);
  transform:rotate(18deg);opacity:0;pointer-events:none;
}
.fc-lift.lift .fc-face::after{animation:fcSheen .78s var(--fc-e)}
@keyframes fcSheen{
  0%{opacity:0;left:-70%}
  35%{opacity:1}
  100%{opacity:0;left:150%}
}

/* — Etiqueta superior — */
.fc-tag{
  position:absolute;top:1rem;left:1.15rem;
  font-size:var(--t-xs);font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  display:inline-flex;align-items:center;gap:.4rem;
}
.fc-front .fc-tag{color:var(--brand)}
.fc-back .fc-tag{color:rgba(255,255,255,.9)}
.fc-tag::before{
  content:"";width:7px;height:7px;border-radius:50%;background:currentColor;
  animation:fcPulse 2.2s ease-in-out infinite;
}
@keyframes fcPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.65)}}

/* — Índice tipo naipe — */
.fc-pip{
  position:absolute;font-family:var(--f-display);font-weight:800;
  font-size:.78rem;letter-spacing:-.02em;opacity:.34;font-variant-numeric:tabular-nums;
}
.fc-pip.tr{top:1rem;right:1.15rem}
.fc-pip.bl{bottom:1rem;left:1.15rem;transform:rotate(180deg)}
.fc-front .fc-pip{color:var(--ink-2)}
.fc-back .fc-pip{color:#fff;opacity:.55}

/* — Texto — */
.fc-txt{
  font-size:clamp(1rem,.9rem + .55vw,1.28rem);font-weight:650;line-height:1.5;
  max-width:44ch;letter-spacing:-.012em;
}
.fc-front .fc-txt{font-family:var(--f-display);font-weight:700}
.fc-back .fc-txt{font-weight:600;line-height:1.6}
.fc-hint{
  position:absolute;bottom:1rem;left:0;right:0;
  font-size:var(--t-xs);font-weight:600;letter-spacing:.02em;
  display:flex;align-items:center;justify-content:center;gap:.4rem;
}
.fc-front .fc-hint{color:var(--ink-3)}
.fc-back .fc-hint{color:rgba(255,255,255,.72)}
.fc-hint .kbd{
  font-family:var(--f-mono);font-size:.68rem;font-weight:700;padding:.1rem .32rem;
  border-radius:5px;border:1px solid currentColor;opacity:.75;
}

/* — Pantalla final — */
.fc-done{
  position:absolute;inset:0;border-radius:var(--r-lg);
  background:linear-gradient(150deg,var(--ok-soft),var(--surface) 70%);
  border:1.5px solid var(--ok);
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  text-align:center;padding:2rem;gap:.35rem;
  animation:fcIn .5s var(--fc-e);box-shadow:var(--sh-2);
}
.fc-done .seal{
  font-size:2.6rem;line-height:1;
  animation:fcSeal .7s cubic-bezier(.2,1.5,.4,1);
}
@keyframes fcSeal{0%{transform:scale(0) rotate(-25deg);opacity:0}60%{transform:scale(1.2) rotate(6deg)}100%{transform:scale(1) rotate(0);opacity:1}}
.fc-done h3{font-size:1.3rem;font-weight:800;margin:.2rem 0 0}
.fc-done p{margin:0;color:var(--ink-2);font-size:var(--t-sm)}

/* — Barra de progreso de la ronda — */
.fc-bar{
  height:6px;border-radius:99px;background:var(--surface-3);
  overflow:hidden;margin:.95rem 0 .8rem;position:relative;
}
.fc-bar i{
  display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--brand),var(--c5,#0891b2));
  transition:width .55s var(--fc-e);
}

/* — Controles — */
.fc-ctrls{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.fc-ctrls button{font-weight:700}
#fcok{border-color:var(--ok);color:var(--ok)}
#fcok:hover{background:var(--ok);color:#fff;border-color:var(--ok)}
#fcko{border-color:var(--warn);color:var(--warn)}
#fcko:hover{background:var(--warn);color:#fff;border-color:var(--warn)}
#fcflip{background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;border-color:transparent}
#fcflip:hover{box-shadow:var(--sh-3)}

.fc-score{display:inline-flex;gap:.45rem;margin-left:auto;align-items:center}
.fc-pill{
  font-size:var(--t-xs);font-weight:800;padding:.24rem .6rem;border-radius:var(--r-full);
  font-variant-numeric:tabular-nums;border:1px solid;
}
.fc-pill.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.fc-pill.ko{color:var(--warn);border-color:var(--warn);background:var(--warn-bg)}
.fc-pill.left{color:var(--ink-2);border-color:var(--line);background:var(--surface-2)}
.fc-pill.bump{animation:fcBump .45s var(--e-spring)}
@keyframes fcBump{0%{transform:scale(1)}45%{transform:scale(1.28)}100%{transform:scale(1)}}

@media(max-width:620px){
  #flash{--fc-h:270px}
  .fc-face{padding:1.7rem 1.3rem}
  .fc-score{margin-left:0;width:100%}
}
@media(prefers-reduced-motion:reduce){
  .fc-card{transition:none}
  .fc-lift.lift,.fc-lift.in,.fc-lift.out-ok,.fc-lift.out-ko,.fc-face::after{animation:none !important}
}
@media print{.fc-stage,.fc-ctrls,.fc-bar{display:none !important}}
/* ═══ RESPUESTA ESTRUCTURADA ═══ */
.fc-face{justify-content:center}
.fc-face.struct{justify-content:flex-start;text-align:left;padding-top:3.1rem;padding-bottom:3.1rem}
.fc-body{
  width:100%;max-width:46ch;margin:0 auto;
  overflow-y:auto;max-height:100%;
  scrollbar-width:thin;
}
.fc-body::-webkit-scrollbar{width:5px}
.fc-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.35);border-radius:99px;border:0}
.fc-front .fc-body::-webkit-scrollbar-thumb{background:var(--line-strong)}

/* — Veredicto Sí / No — */
.fc-verdict{
  display:inline-flex;align-items:center;gap:.35rem;
  font-family:var(--f-display);font-weight:800;font-size:.82rem;
  letter-spacing:.06em;text-transform:uppercase;
  padding:.26rem .72rem;border-radius:var(--r-full);margin-bottom:.85rem;
  border:1.5px solid;animation:fcPopIn .45s var(--e-spring) backwards;animation-delay:.34s;
}
.fc-verdict.si{background:rgba(255,255,255,.16);border-color:rgba(190,255,215,.85);color:#d8ffe9}
.fc-verdict.no{background:rgba(255,255,255,.16);border-color:rgba(255,205,205,.85);color:#ffdedd}
@keyframes fcPopIn{0%{opacity:0;transform:scale(.7) translateY(6px)}100%{opacity:1;transform:none}}

/* — Párrafo — */
.fc-p{margin:0;font-size:clamp(1rem,.92rem + .45vw,1.2rem);font-weight:600;line-height:1.6}
.fc-face.struct .fc-p{font-size:clamp(.96rem,.9rem + .35vw,1.1rem)}

/* — Lista enumerada — */
.fc-list{list-style:none;margin:0;padding:0;display:grid;gap:.5rem;counter-reset:fc}
.fc-list li{
  counter-increment:fc;position:relative;margin:0;
  padding:.42rem .6rem .42rem 2.5rem;border-radius:var(--r-sm);
  background:rgba(255,255,255,.11);
  font-size:clamp(.92rem,.88rem + .3vw,1.04rem);font-weight:600;line-height:1.45;
  animation:fcRow .42s var(--e-out) backwards;
}
.fc-list li::before{
  content:counter(fc);position:absolute;left:.6rem;top:50%;transform:translateY(-50%);
  width:1.6rem;height:1.6rem;border-radius:50%;
  display:grid;place-items:center;
  background:rgba(255,255,255,.9);color:var(--brand);
  font-family:var(--f-display);font-weight:800;font-size:.78rem;
  font-variant-numeric:tabular-nums;
}
.fc-list.alpha li::before{content:counter(fc,lower-alpha)}
.fc-list li:nth-child(1){animation-delay:.36s}
.fc-list li:nth-child(2){animation-delay:.42s}
.fc-list li:nth-child(3){animation-delay:.48s}
.fc-list li:nth-child(4){animation-delay:.54s}
.fc-list li:nth-child(5){animation-delay:.60s}
.fc-list li:nth-child(n+6){animation-delay:.66s}
@keyframes fcRow{0%{opacity:0;transform:translateX(-12px)}100%{opacity:1;transform:none}}

/* — Cláusulas contrapuestas — */
.fc-clauses{display:grid;gap:.45rem}
.fc-clauses p{
  margin:0;padding:.45rem .7rem .45rem .95rem;border-radius:0 var(--r-sm) var(--r-sm) 0;
  background:rgba(255,255,255,.11);border-left:3px solid rgba(255,255,255,.55);
  font-size:clamp(.92rem,.88rem + .3vw,1.04rem);font-weight:600;line-height:1.5;
  animation:fcRow .42s var(--e-out) backwards;
}
.fc-clauses p:nth-child(1){animation-delay:.36s}
.fc-clauses p:nth-child(2){animation-delay:.44s}
.fc-clauses p:nth-child(3){animation-delay:.52s}

/* — Negritas resaltadas en el reverso — */
.fc-back .fc-body b,.fc-back .fc-body strong{
  font-weight:800;background:rgba(255,255,255,.2);
  padding:.03em .3em;border-radius:5px;
  box-decoration-break:clone;-webkit-box-decoration-break:clone;
}

/* — Cita legal al pie — */
.fc-cite{
  position:absolute;bottom:.95rem;left:0;right:0;
  display:inline-flex;align-items:center;justify-content:center;gap:.4rem;
  font-family:var(--f-mono);font-size:.74rem;font-weight:700;letter-spacing:.02em;
  color:rgba(255,255,255,.82);
  animation:fcPopIn .5s var(--e-out) backwards;animation-delay:.5s;
}
.fc-cite::before,.fc-cite::after{
  content:"";height:1px;width:clamp(18px,10%,52px);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.45));
}
.fc-cite::after{background:linear-gradient(90deg,rgba(255,255,255,.45),transparent)}
.fc-cite .s{font-size:.9rem;opacity:.75;font-family:var(--f-legal)}
.fc-front .fc-cite{color:var(--ink-3)}
.fc-front .fc-cite::before{background:linear-gradient(90deg,transparent,var(--line-strong))}
.fc-front .fc-cite::after{background:linear-gradient(90deg,var(--line-strong),transparent)}

/* la pista se oculta si hay cita, para no amontonar */
.fc-back .fc-cite ~ .fc-hint,.fc-back .fc-hint.muted{display:none}

@media(max-width:620px){
  #flash{--fc-h:320px}
  .fc-face.struct{padding-top:2.9rem;padding-bottom:2.8rem}
  .fc-list li{padding-left:2.3rem}
}
@media(prefers-reduced-motion:reduce){
  .fc-verdict,.fc-list li,.fc-clauses p,.fc-cite{animation:none !important}
}

/* ═══ SEMÁFORO ═══ */
.sembtn{
  border-radius:var(--r-full);padding:.32rem .7rem;font-weight:700;font-size:var(--t-sm);
}
.sembtn[data-v="g"]:hover,.sembtn.on[data-v="g"]{background:var(--ok);color:#fff;border-color:var(--ok)}
.sembtn[data-v="y"]:hover,.sembtn.on[data-v="y"]{background:var(--mid);color:#3d2f00;border-color:var(--mid)}
.sembtn[data-v="r"]:hover,.sembtn.on[data-v="r"]{background:var(--exc);color:#fff;border-color:var(--exc)}

/* ═══ CTA DE BLOQUE ═══ */
a.blk{
  display:inline-flex;align-items:center;gap:.5rem;
  background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;
  padding:.5rem .95rem;border-radius:var(--r-sm);font-weight:700;font-size:var(--t-sm);
  text-decoration:none;box-shadow:0 2px 10px var(--brand-ring);
  transition:transform .22s var(--e-spring),box-shadow .25s,gap .25s var(--e-out);
}
a.blk:hover{transform:translateY(-2px);box-shadow:var(--sh-3);gap:.75rem;text-decoration:none}
a.blk::after{content:"→"}
a.blk:active{transform:translateY(0) scale(.98)}

/* ═══ REVEAL ═══ */
.rv{opacity:0;transform:translateY(20px);transition:opacity .6s var(--e-out),transform .6s var(--e-out)}
.rv.in{opacity:1;transform:none}

/* ═══ RESPONSIVE ═══ */
@media(max-width:960px){
  .layout{grid-template-columns:1fr;padding-top:.9rem;gap:1rem}
  nav.side{position:static;max-height:none}
  nav.side.collapsed .navbody{display:none}
  .navtoggle{display:block;width:100%;text-align:left;font-weight:700}
  .grid2{grid-template-columns:1fr}
  .top h1 .sub{white-space:normal}
}
@media(max-width:620px){
  .top-in{padding:.55rem .8rem}
  .tools{width:100%;margin-left:0}
  /* en pantallas estrechas el título se achica un poco y puede llegar a
     tres líneas: preferimos eso a recortarlo y esconder texto */
  .top h1{font-size:.95rem}
  .top h1 .tit{-webkit-line-clamp:3}
  input[type=search]{flex:1;min-width:0}
  section.card{padding:1.05rem 1rem;border-radius:var(--r-md)}
  table{font-size:.82rem}
  th,td{padding:.4rem .5rem}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
  .rv{opacity:1;transform:none}
}
@media print{
  header.top,nav.side,.tools,.noprint,.progress{display:none !important}
  body{background:#fff;background-image:none;font-size:11pt;color:#000}
  .layout{display:block;max-width:none;padding:0}
  section.card{border:0;padding:0;margin:0 0 1rem;break-inside:avoid;box-shadow:none}
  details.panel{border:0;box-shadow:none}
  details.panel .body{display:block !important}
  details.panel>summary{padding-left:0}
  .art{break-inside:avoid}
  .rv{opacity:1;transform:none}
  a{color:#000;text-decoration:none}
}


/* ═══ ALTURA ADAPTATIVA DE LA TARJETA ═══ */
.fc-deck{transition:height .45s var(--fc-e)}
.fc-body{max-height:none;overflow:visible}
.fc-measure{
  position:absolute;left:0;right:0;top:0;height:auto;
  visibility:hidden;pointer-events:none;z-index:-1;
}
.fc-measure .fc-face{
  position:relative;inset:auto;height:auto;min-height:0;
  box-shadow:none;backface-visibility:visible;transform:none;
}
.fc-measure .fc-body{max-height:none;overflow:visible}
.fc-measure .fc-face::after{display:none}

/* ═══ MOSTRAR / OCULTAR ÍNDICE LATERAL ═══ */
.layout{transition:grid-template-columns .42s var(--e-out)}
.layout.nonav{grid-template-columns:0 1fr;gap:0}
.layout.nonav>nav.side{
  opacity:0;transform:translateX(-14px);pointer-events:none;
  padding:0;border-width:0;overflow:hidden;width:0;min-width:0;
}
nav.side{
  transition:opacity .3s var(--e-out),transform .38s var(--e-out);
  overflow-x:hidden;
}
#navhide .ic{display:inline-block;transition:transform .35s var(--e-spring);font-size:.95em;line-height:1}
#navhide[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
#navhide[aria-pressed="true"] .ic{transform:rotate(90deg)}
@media(max-width:960px){#navhide{display:none}}

/* ═══════════════════════════════════════════════════════════════
   LECTURA EN VOZ ALTA (TTS) del texto legal
   ═══════════════════════════════════════════════════════════════ */
.tts-bar{
  display:flex;align-items:center;gap:.45rem;flex-wrap:wrap;
  margin:.15rem 0 .7rem;
}
.tts-bar button{
  font-size:var(--t-xs);font-weight:700;padding:.3rem .62rem;
  border-radius:var(--r-full);border:1px solid var(--legal);
  background:transparent;color:var(--legal);
  display:inline-flex;align-items:center;gap:.35rem;line-height:1.2;
}
.tts-bar button:hover{background:var(--legal);color:var(--surface);border-color:var(--legal)}
.tts-bar button[hidden]{display:none}
.tts-bar .tts-play.on{background:var(--legal);color:var(--surface)}

/* Ondas de audio mientras lee */
.tts-wave{display:inline-flex;align-items:flex-end;gap:2px;height:11px}
.tts-wave i{
  width:2.5px;background:currentColor;border-radius:2px;height:35%;
  animation:ttsW .9s ease-in-out infinite;
}
.tts-wave i:nth-child(2){animation-delay:.15s}
.tts-wave i:nth-child(3){animation-delay:.3s}
.tts-wave i:nth-child(4){animation-delay:.45s}
@keyframes ttsW{0%,100%{height:32%}50%{height:100%}}

.tts-time{
  font-family:var(--f-mono);font-size:.7rem;font-weight:700;
  color:var(--ink-3);font-variant-numeric:tabular-nums;
}

/* Frase que se está leyendo */
.tts-s{transition:background .25s,color .25s;border-radius:3px}
.tts-s.now{
  background:linear-gradient(180deg,transparent 8%,color-mix(in srgb,var(--legal) 26%,transparent) 8%);
  box-shadow:0 0 0 2px color-mix(in srgb,var(--legal) 16%,transparent);
}
html[data-theme="dark"] .tts-s.now{
  background:linear-gradient(180deg,transparent 8%,color-mix(in srgb,var(--legal) 34%,transparent) 8%);
}
.legal.tts-on{box-shadow:0 0 0 3px color-mix(in srgb,var(--legal) 20%,transparent)}

/* ═══ Reproductor flotante ═══ */
.tts-mini{
  position:fixed;left:50%;bottom:1.1rem;transform:translateX(-50%) translateY(140%);
  z-index:80;display:flex;align-items:center;gap:.6rem;
  background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  border:1px solid var(--line);border-radius:var(--r-full);
  padding:.5rem .7rem .5rem .95rem;box-shadow:var(--sh-3);
  transition:transform .45s var(--e-spring),opacity .3s;opacity:0;pointer-events:none;
  max-width:min(94vw,540px);
}
.tts-mini.show{transform:translateX(-50%) translateY(0);opacity:1;pointer-events:auto}
.tts-mini .lbl{
  font-size:var(--t-xs);font-weight:800;color:var(--legal);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:16ch;
}
.tts-mini button{
  border-radius:50%;width:32px;height:32px;padding:0;display:grid;place-items:center;
  font-size:.8rem;border:1px solid var(--line);flex:none;
}
.tts-mini button.main{
  width:38px;height:38px;font-size:.95rem;
  background:linear-gradient(140deg,var(--legal),var(--brand));color:#fff;border-color:transparent;
}
.tts-mini .bar{
  flex:1;min-width:70px;height:5px;border-radius:99px;background:var(--surface-3);overflow:hidden;
}
.tts-mini .bar i{display:block;height:100%;width:0;background:var(--legal);
  border-radius:99px;transition:width .35s var(--e-out)}

/* ═══ Panel de ajustes de voz ═══ */
.tts-back{
  position:fixed;inset:0;z-index:90;background:rgba(10,10,18,.45);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  display:grid;place-items:center;padding:1rem;
  opacity:0;pointer-events:none;transition:opacity .3s var(--e-out);
}
.tts-back.show{opacity:1;pointer-events:auto}
.tts-panel{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--sh-3);width:min(94vw,470px);max-height:88vh;overflow:auto;
  padding:1.3rem 1.4rem;transform:translateY(16px) scale(.97);
  transition:transform .38s var(--e-spring);
}
.tts-back.show .tts-panel{transform:none}
.tts-panel h3{
  font-size:1.12rem;font-weight:800;margin:0 0 .25rem;
  display:flex;align-items:center;gap:.5rem;
}
.tts-panel .sub{font-size:var(--t-sm);color:var(--ink-2);margin:0 0 1.1rem}
.tts-row{margin-bottom:1.05rem}
.tts-row > label{
  display:block;font-size:var(--t-xs);font-weight:800;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-2);margin-bottom:.4rem;
}
.tts-seg{display:flex;gap:3px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:3px}
.tts-seg button{
  flex:1;border:0;background:transparent;border-radius:calc(var(--r-sm) - 3px);
  padding:.42rem .3rem;font-size:var(--t-sm);font-weight:700;box-shadow:none;
}
.tts-seg button:hover{transform:none;background:var(--surface)}
.tts-seg button[aria-pressed="true"]{
  background:linear-gradient(140deg,var(--legal),var(--brand));color:#fff;
}
.tts-panel select{
  width:100%;padding:.5rem .6rem;border-radius:var(--r-sm);
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  font-size:var(--t-sm);font-weight:600;cursor:pointer;
}
.tts-panel select:focus{border-color:var(--brand);outline:none}
.tts-slider{display:flex;align-items:center;gap:.75rem}
.tts-slider input[type=range]{flex:1;accent-color:var(--legal);cursor:pointer;height:22px}
.tts-val{
  font-family:var(--f-mono);font-weight:800;font-size:var(--t-sm);
  min-width:3.4em;text-align:right;color:var(--legal);font-variant-numeric:tabular-nums;
}
.tts-note{
  font-size:var(--t-xs);color:var(--ink-2);line-height:1.5;
  background:var(--surface-2);border-radius:var(--r-sm);padding:.6rem .75rem;margin:0 0 1rem;
}
.tts-note b{color:var(--ink)}
.tts-acts{display:flex;gap:.5rem;justify-content:flex-end;flex-wrap:wrap}
.tts-acts .prim{
  background:linear-gradient(140deg,var(--legal),var(--brand));color:#fff;border-color:transparent;
}
.tts-badge{
  font-size:.62rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
  padding:.1rem .35rem;border-radius:4px;background:var(--ej-bg);color:var(--ej);margin-left:.35rem;
}


/* — Variante compacta para los apartados desplegables — */
.tts-bar.mini{margin:0 0 .6rem}
.tts-bar.mini button{
  font-size:.7rem;padding:.24rem .55rem;
  border-color:var(--brand);color:var(--brand);
}
.tts-bar.mini button:hover{background:var(--brand);color:var(--surface)}
.tts-bar.mini .tts-play.on{background:var(--brand);color:var(--surface)}
.tts-bar.mini .tts-time{font-size:.66rem}
.idea .tts-bar.mini{margin:.55rem 0 0}
.legal.tts-on,.body.tts-on,.idea.tts-on{
  box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 20%,transparent)
}
.legal.tts-on{box-shadow:0 0 0 3px color-mix(in srgb,var(--legal) 20%,transparent)}


/* aviso de cambio de voz */
.tts-aviso{
  position:fixed;left:50%;bottom:5.2rem;transform:translateX(-50%) translateY(20px);
  z-index:95;max-width:min(92vw,460px);
  background:var(--warn-bg);border:1px solid var(--warn);color:var(--warn);
  border-radius:var(--r-md);padding:.6rem .9rem;font-size:var(--t-sm);font-weight:700;
  box-shadow:var(--sh-2);opacity:0;pointer-events:none;
  transition:opacity .3s var(--e-out),transform .35s var(--e-spring);
}
.tts-aviso.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:620px){
  .tts-mini{left:.6rem;right:.6rem;transform:translateY(140%);max-width:none}
  .tts-mini.show{transform:translateY(0)}
  .tts-mini .lbl{display:none}
}
@media(prefers-reduced-motion:reduce){
  .tts-wave i{animation:none;height:60%}
}
@media print{.tts-bar,.tts-mini,.tts-back{display:none !important}}

<script>
const NAV=[["intro", "Cómo funciona el simulacro"], ["s1", "Supuesto 1 · Contratos y crédito"], ["s2", "Supuesto 2 · Subvenciones"], ["cal", "Calendario de febrero de 2027"], ["cifras", "Tabla de cifras y umbrales"], ["test", "Test · 35 preguntas"], ["legal", "Los preceptos, literales"], ["sem", "Semáforo de autoevaluación"], ["cierre", "Cierre y repaso espaciado"]];
const GLOS={"valorestimado": ["Valor estimado", "El importe total del contrato sin IVA, incluidas las eventuales prórrogas y las modificaciones previstas en el pliego (art. 101 LCSP). Es la cifra con la que se mide todo: umbrales, procedimiento y competencia."], "pbl": ["Presupuesto base de licitación", "El límite máximo de gasto que el órgano de contratación puede comprometer, con el IVA desglosado (art. 100 LCSP). No se confunde con el valor estimado: aquel lleva IVA, este no."], "menor": ["Contrato menor", "El de valor estimado inferior a 40.000 € en obras o a 15.000 € en suministros y servicios. Se adjudica directamente, con informe de necesidad, aprobación del gasto y factura (art. 118 LCSP)."], "credef": ["Crédito definitivo", "El crédito inicial de una aplicación presupuestaria más o menos las modificaciones aprobadas. De él se descuentan retenciones y gastos autorizados para obtener el disponible."], "suplemento": ["Suplemento de crédito", "Modificación que aumenta un crédito que ya existe pero resulta insuficiente y no es ampliable. Si el crédito no existiera en absoluto, la figura sería el crédito extraordinario (art. 177 TRLHL y art. 35 RD 500/1990)."], "concurrencia": ["Concurrencia competitiva", "Régimen ordinario de concesión: se comparan las solicitudes, se ordenan según los criterios de las bases y se conceden las mejor valoradas dentro del crédito disponible (art. 22.1 LGS)."], "prorrateo": ["Prorrateo", "Reparto proporcional del crédito entre todos los beneficiarios en lugar de aplicar la prelación. Es excepcional y solo cabe si las bases reguladoras lo prevén (art. 22.1 LGS)."], "reintegro": ["Reintegro", "Devolución de la subvención percibida, con el interés de demora, cuando concurre alguna de las causas del art. 37 LGS. Puede ser total o parcial."], "bdns": ["BDNS", "Base de Datos Nacional de Subvenciones. Opera como Sistema Nacional de Publicidad de Subvenciones: a ella se comunica el texto de la convocatoria, y de ahí sale el extracto que se publica en el diario oficial (art. 20.8 LGS)."], "desistido": ["Tener por desistido", "Efecto de no atender el requerimiento de subsanación. No es un archivo automático: exige resolución expresa (arts. 68.1 y 21 LPAC)."], "habiles": ["Días hábiles", "Todos los días salvo sábados, domingos y declarados festivos (art. 30.2 LPAC). Cuando una ley quiere días naturales, lo dice y debe hacerse constar en la notificación."], "garantiadef": ["Garantía definitiva", "El 5 % del precio final ofertado, IVA excluido, que constituye quien va a ser adjudicatario (art. 107.1 LCSP). No se exige en la tramitación abreviada del art. 159.6."]};
const TEST=[["S1", "El contrato 1 (obra de acerado) tiene un importe de 38.000 € sin IVA. ¿Cuál es el importe total con el IVA del 21 %?", ["45.980 €", "38.000 €", "7.980 €", "45.600 €"], 0, ["Correcta. 38.000 × 1,21 = 45.980 €. Esta es la cifra que consume crédito, porque el IVA se paga.", "Es la base imponible, la cifra sin IVA. Sirve para comparar umbrales, no para reservar crédito.", "Es solo la cuota de IVA: 38.000 × 0,21 = 7.980 €. Falta sumarle la base.", "Sale de aplicar un 20 % en lugar del 21 %."]], ["S1", "¿Cuál es el valor estimado del contrato 2 (mantenimiento de parques, 14.500 € al año, un año prorrogable por otro, con intención de prorrogar)?", ["14.500 €", "29.000 €", "17.545 €", "35.090 €"], 1, ["Olvida la prórroga. El art. 101.2.a) obliga a computar «cualquier forma de opción eventual y las eventuales prórrogas del contrato».", "Correcta. 14.500 × 2 años = 29.000 €. La prórroga entra en el valor estimado aunque todavía no se haya acordado.", "Añade el IVA, que el art. 101.1.a) excluye expresamente del valor estimado, y además olvida la prórroga.", "Suma las dos cosas mal: incluye prórroga y además IVA."]], ["S1", "¿Cuáles de los cinco contratos pueden adjudicarse como contrato menor?", ["El 1 y el 3", "El 1, el 3 y el 4", "Solo el 3", "El 1, el 2 y el 3"], 0, ["Correcta. Art. 118.1: obras por debajo de 40.000 € y suministros o servicios por debajo de 15.000 €, sobre el valor estimado. El 1 es obra de 38.000 € y el 3 suministro de 12.000 €.", "El contrato 4 es un servicio de 16.000 €, que ya alcanza el umbral de 15.000 €. Queda fuera.", "Deja fuera el contrato 1, que es obra de 38.000 € y está por debajo de los 40.000 € de su umbral.", "El contrato 2 tiene un valor estimado de 29.000 € con la prórroga, muy por encima de los 15.000 €."]], ["S1", "La cifra que se compara con los umbrales del art. 118.1 es…", ["el presupuesto base de licitación, IVA incluido", "el precio de adjudicación", "el valor estimado, IVA excluido", "el importe de la primera anualidad"], 2, ["El presupuesto base de licitación incluye el IVA (art. 100) y no es la referencia del art. 118.1.", "El precio de adjudicación no se conoce todavía cuando hay que decidir si el contrato es menor.", "Correcta. El art. 118.1 habla de «valor estimado», y el art. 101.1.a) lo define sin IVA e incluyendo prórrogas y modificaciones previstas.", "Tomar solo la primera anualidad es justamente el fraccionamiento que el art. 118.2 obliga a justificar que no se produce."]], ["S1", "Los recursos ordinarios del presupuesto son 3.000.000 €. ¿Quién es el órgano de contratación del contrato 5 (120.000 €, dos años)?", ["El Alcalde", "El Pleno", "La Junta de Gobierno Local", "La Junta de Contratación, obligatoriamente"], 0, ["Correcta. D. A. 2.ª.1: el Alcalde hasta el 10 % de los recursos ordinarios, aquí 300.000 €, y hasta seis millones; los plurianuales de duración no superior a cuatro años entran igual.", "El Pleno solo asume la competencia cuando por valor o duración excede del límite del Alcalde (D. A. 2.ª.2). Aquí no excede.", "La Junta de Gobierno Local es órgano de contratación en los municipios de gran población (D. A. 2.ª.4). Las Flores tiene 4.800 habitantes.", "La constitución de Juntas de Contratación en las entidades locales es potestativa (D. A. 2.ª.5)."]], ["S1", "La aplicación que soporta la obra tiene un crédito definitivo de 60.000 € y gastos autorizados por 18.000 €. ¿Cuál es el crédito disponible?", ["60.000 €", "18.000 €", "42.000 €", "14.020 €"], 2, ["Es el crédito definitivo, antes de descontar lo ya comprometido.", "Es lo ya autorizado, no lo que queda.", "Correcta. 60.000 − 18.000 = 42.000 €.", "Mezcla el crédito con el importe del contrato; no responde a ninguna operación del supuesto."]], ["S1", "¿Puede aprobarse el gasto del contrato 1 con ese crédito?", ["Sí, porque 38.000 € son menos de 42.000 €", "No: faltan 3.980 €", "Sí, porque el IVA no consume crédito", "No: faltan 18.000 €"], 1, ["Compara con la base imponible. El crédito se compromete por el importe total que el Ayuntamiento va a pagar, IVA incluido.", "Correcta. 45.980 − 42.000 = 3.980 €. Y el art. 173.5 TRLHL declara nulos de pleno derecho los acuerdos que superen el crédito autorizado.", "El IVA soportado es un mayor coste para la entidad local y se imputa al crédito como el resto del precio.", "18.000 € es lo autorizado previamente, no la diferencia que falta."]], ["S1", "¿Qué modificación de crédito procede para cubrir esos 3.980 €?", ["Un crédito extraordinario", "Una transferencia de crédito, en todo caso", "Un suplemento de crédito", "Una ampliación de crédito"], 2, ["El crédito extraordinario es para cuando NO existe crédito para esa finalidad (art. 35 RD 500/1990). Aquí existe, pero no llega.", "La transferencia es posible como técnica, pero la pregunta es por la figura que corresponde a una insuficiencia de crédito no ampliable, y esa es el suplemento.", "Correcta. Art. 177.1 TRLHL y art. 35 RD 500/1990: el crédito existe pero «resulta insuficiente y no puede ser objeto de ampliación».", "La ampliación de crédito solo cabe en las aplicaciones declaradas ampliables en las bases de ejecución y financiadas con ingresos afectados."]], ["S1", "¿Quién aprueba ese expediente y con qué trámites?", ["El Alcalde, por decreto, por razones de urgencia", "El Pleno, previo informe de Intervención y con los mismos trámites que el presupuesto", "El Pleno, pero sin exposición pública", "La Junta de Gobierno Local"], 1, ["El Alcalde ordena incoar el expediente (art. 177.1), pero no lo aprueba.", "Correcta. Art. 177.2 TRLHL: informe previo de la Intervención, aprobación por el Pleno y las mismas normas de información, reclamación y publicidad que el presupuesto (art. 169).", "Sí hay exposición pública: el art. 177.2 remite expresamente al art. 169.", "La Junta de Gobierno Local no tiene competencia sobre las modificaciones presupuestarias de esta clase."]], ["S1", "¿Puede el contrato 1 seguir la tramitación abreviada del procedimiento abierto simplificado?", ["Sí: 38.000 € es inferior a 80.000 €", "No: la tramitación abreviada es solo para suministros y servicios", "No: en obras el límite del abreviado es 40.000 €", "No: el abreviado exige valor estimado inferior a 60.000 € en todo caso"], 0, ["Correcta. El art. 159.6 fija 80.000 € para obras y 60.000 € para suministros y servicios.", "El art. 159.6 menciona expresamente los contratos de obras.", "40.000 € es el umbral del contrato menor de obras (art. 118.1), no el del abreviado.", "Los 60.000 € son el umbral de suministros y servicios; el de obras es más alto."]], ["S1", "Si el contrato 1 se licita por esa tramitación abreviada, ¿cuál es el plazo mínimo de presentación de proposiciones?", ["Quince días naturales", "Diez días hábiles desde el siguiente a la publicación en el perfil de contratante", "Veinte días", "Veintiséis días"], 1, ["Quince días es el plazo del simplificado ordinario (art. 159.3), y además allí no se dicen hábiles.", "Correcta. Art. 159.6.a). Si se tratara de compras corrientes de bienes disponibles en el mercado, serían cinco días hábiles.", "Veinte días es el mínimo del simplificado ordinario cuando el contrato es de obras (art. 159.3).", "Veintiséis días no es ningún plazo del procedimiento simplificado."]], ["S1", "El contrato 4 se tramita por la vía abreviada y se adjudica en 14.400 € sin IVA. ¿Qué garantía definitiva debe constituir la adjudicataria?", ["720 €", "871,20 €", "Ninguna", "432 €"], 2, ["Sería el 5 % del art. 107.1, que aquí no se aplica. Es el error más fácil de cometer con la calculadora en la mano.", "Sería el 5 % calculado sobre el precio con IVA, doblemente incorrecto: ni procede la garantía, ni se calcularía sobre el importe con IVA.", "Correcta. Art. 159.6.f): en la tramitación abreviada «no se requerirá la constitución de garantía definitiva».", "Es el 3 %, que además es el tope de la garantía provisional del art. 106.2, no de la definitiva."]], ["S1", "El contrato 5 se licita por el simplificado ordinario y se adjudica en 115.000 € sin IVA. ¿Cuál es la garantía definitiva?", ["6.957,50 €", "3.450 €", "11.500 €", "5.750 €"], 3, ["Aplica el 5 % sobre el precio con IVA. El art. 107.1 dice «excluido el Impuesto sobre el Valor Añadido».", "Es el 3 %, el tope de la garantía provisional del art. 106.2.", "Es el 10 %, que solo se alcanza si el pliego exige además la garantía complementaria del art. 107.2.", "Correcta. 115.000 × 5 % = 5.750 €."]], ["S1", "¿Dónde se publican los contratos menores adjudicados?", ["En el perfil de contratante", "En el Boletín Oficial del Estado", "En el Diario Oficial de la Unión Europea", "No se publican, por su escasa cuantía"], 0, ["Correcta. El art. 118.6 remite al art. 63.4, que es la publicidad en el perfil de contratante.", "El BOE no es el medio de publicidad de los contratos menores de una entidad local.", "El DOUE es para los contratos sujetos a regulación armonizada.", "Sí se publican: es precisamente el control de transparencia que el legislador quiso reforzar sobre el contrato menor."]], ["S1", "La resolución del órgano de contratación que aprueba el expediente…", ["no implica aprobación del gasto, que es acto separado", "implica también la aprobación del gasto y se publica en el perfil de contratante", "la dicta siempre el Pleno", "no necesita ser motivada"], 1, ["El art. 117.1 dice lo contrario de forma expresa.", "Correcta. Art. 117.1: «Dicha resolución implicará también la aprobación del gasto» y «deberá ser objeto de publicación en el perfil de contratante».", "La dicta el órgano de contratación, que aquí es el Alcalde.", "El art. 117.1 exige resolución motivada."]], ["S2", "Las bases dan el 50 % del presupuesto de la actividad con un máximo de 6.000 €. La asociación A presenta un presupuesto de 14.000 €. ¿Qué importe le corresponde?", ["7.000 €", "6.000 €", "14.000 €", "4.500 €"], 1, ["Es el 50 % puro, pero supera el tope de la convocatoria.", "Correcta. El 50 % de 14.000 serían 7.000 €, pero opera el límite de 6.000 € fijado en la convocatoria.", "Es el presupuesto íntegro de la actividad, no la subvención.", "No responde a ninguna de las dos reglas; además el art. 19.3 LGS solo impide superar el coste de la actividad."]], ["S2", "La asociación D presenta un presupuesto de 5.000 € y su solicitud llega sin firmar. ¿Qué importe le corresponde en principio?", ["5.000 €", "6.000 €", "0 €, porque la solicitud no está firmada", "2.500 €"], 3, ["Es el presupuesto de la actividad, no la subvención.", "Es el tope máximo, que aquí no llega a operar porque el 50 % queda muy por debajo.", "La falta de firma no excluye: es un defecto subsanable del art. 66.1.e) LPAC y abre el requerimiento del art. 68.1.", "Correcta. El 50 % de 5.000 son 2.500 €, por debajo del tope."]], ["S2", "El crédito de la convocatoria es de 30.000 €. ¿Cuánto se concede en total y cuánto sobra?", ["18.500 € concedidos y 11.500 € sobrantes", "23.500 € y 6.500 €", "30.000 € y 0 €", "24.000 € y 6.000 €"], 0, ["Correcta. 6.000 + 4.000 + 6.000 + 2.500 = 18.500 €; 30.000 − 18.500 = 11.500 €.", "Resulta de no aplicar el tope a una de las entidades.", "El crédito es un máximo, no un importe que haya que agotar.", "Resulta de aplicar el tope de 6.000 € a cuatro entidades por igual, sin calcular el 50 % de cada presupuesto."]], ["S2", "¿Procede prorratear el crédito entre las beneficiarias?", ["Sí, siempre que haya concurrencia competitiva", "Sí, porque lo impone el art. 22.1 LGS", "No: el prorrateo es excepcional, exige previsión en las bases y además aquí sobra crédito", "Solo si lo acuerda la Intervención"], 2, ["La concurrencia competitiva es el régimen ordinario; el prorrateo es una excepción dentro de él.", "El art. 22.1 lo configura justo al revés: «Excepcionalmente, siempre que así se prevea en las bases reguladoras».", "Correcta. Y hay una segunda razón, más sencilla: con 30.000 € de crédito y 18.500 € solicitados no hay nada que prorratear.", "La Intervención fiscaliza; no decide el sistema de reparto, que lo fijan las bases."]], ["S2", "¿En qué instrumento se aprueban las bases reguladoras de una corporación local?", ["En una orden del concejal delegado", "En las bases de ejecución del presupuesto, una ordenanza general o una ordenanza específica", "En la propia convocatoria, siempre", "En un convenio con cada beneficiaria"], 1, ["La orden ministerial es el instrumento de la Administración General del Estado (art. 17.1).", "Correcta. Art. 17.2 LGS, que enumera exactamente esas tres vías.", "La convocatoria puede incluirlas por su especificidad, pero no es la regla general del art. 17.2 para las entidades locales.", "El convenio es el instrumento de la concesión directa nominativa (art. 22.2.a), no de las bases."]], ["S2", "¿Cómo se inicia el procedimiento de concesión en concurrencia competitiva?", ["Siempre de oficio, mediante convocatoria", "A solicitud de los interesados", "De oficio o a instancia de parte, indistintamente", "Por acuerdo del órgano colegiado de valoración"], 0, ["Correcta. Art. 23.1 y 23.2 LGS. La solicitud de la asociación no inicia nada: se presenta dentro de un procedimiento ya abierto.", "Es el error clásico. La solicitud es un acto de la interesada dentro del procedimiento, no su inicio.", "El art. 23.1 no deja alternativa: «se inicia siempre de oficio».", "El órgano colegiado formula la propuesta de concesión, no inicia el procedimiento."]], ["S2", "El requerimiento para que D subsane la falta de firma, ¿con qué plazo se concede?", ["Quince días", "Diez días", "Cinco días", "Un mes"], 1, ["Quince días es el plazo de audiencia del art. 82, no el de subsanación.", "Correcta. Art. 68.1 LPAC: diez días, con la advertencia de tenerle por desistido.", "Cinco días es la ampliación del art. 68.2, no el plazo inicial.", "El mes es el plazo del recurso de reposición, no el de subsanación."]], ["S2", "¿Puede ampliarse ese plazo cinco días más a petición de la asociación?", ["Sí, a petición de la interesada", "Sí, de oficio, si el órgano lo estima oportuno", "No: el art. 68.2 excluye los procedimientos de concurrencia competitiva", "Sí, y hasta diez días más"], 2, ["La ampliación existe, pero el propio precepto la condiciona a que no estemos en concurrencia competitiva.", "Lo mismo: ni de oficio ni a instancia, porque la exclusión es objetiva, por el tipo de procedimiento.", "Correcta. Art. 68.2: «Siempre que no se trate de procedimientos selectivos o de concurrencia competitiva». Aquí lo es, así que no cabe.", "El tope de la ampliación, cuando procede, son cinco días, no diez."]], ["S2", "El requerimiento se notifica el lunes 1 de febrero de 2027. Con el calendario adjunto, ¿cuál es el último día del plazo?", ["Jueves 11 de febrero de 2027", "Viernes 12 de febrero de 2027", "Lunes 15 de febrero de 2027", "Domingo 14 de febrero de 2027"], 2, ["Cuenta diez días naturales desde el día 1, sin excluir fines de semana y sin empezar el día siguiente.", "Cuenta bien los hábiles pero empieza el mismo día 1, cuando el art. 30.3 manda contar desde el día siguiente.", "Correcta. Se empieza el martes 2 (art. 30.3) y se excluyen sábados y domingos (art. 30.2): el décimo día hábil es el lunes 15.", "Cuenta catorce días naturales y además cae en domingo, que es inhábil."]], ["S2", "Si D no subsana en plazo, ¿qué ocurre?", ["Se archiva el expediente sin más trámite", "Se le tiene por desistida de su petición, previa resolución expresa", "Se le inadmite la solicitud", "Se le concede de oficio un nuevo plazo"], 1, ["No basta el archivo: el art. 68.1 exige una resolución, dictada en los términos del art. 21.", "Correcta. Art. 68.1 LPAC en relación con el art. 21: hay que dictar y notificar resolución declarando el desistimiento.", "La inadmisión es otra figura, reservada a los recursos y a supuestos tasados.", "El plazo de subsanación no se reabre de oficio."]], ["S2", "La convocatoria se publica el lunes 11 de enero de 2027. ¿Cuál es el plazo máximo para resolver y notificar?", ["Tres meses desde cada solicitud", "Seis meses desde cada solicitud", "Seis meses desde la publicación de la convocatoria", "Doce meses"], 2, ["Los tres meses del art. 21.3 LPAC son supletorios, para cuando la norma reguladora no fija plazo. Aquí sí lo fija.", "El plazo es de seis meses, pero no se cuenta desde la solicitud.", "Correcta. Art. 25.4 LGS: seis meses, computados «a partir de la publicación de la correspondiente convocatoria».", "Doce meses es el plazo del procedimiento de reintegro (art. 42.4), no el de concesión."]], ["S2", "Aplicando ese plazo, ¿cuál es el último día para notificar la resolución?", ["Domingo 11 de julio de 2027", "Lunes 12 de julio de 2027", "Sábado 10 de julio de 2027", "Viernes 11 de junio de 2027"], 1, ["El cómputo lleva al 11 de julio, pero ese día es domingo e inhábil.", "Correcta. El art. 30.4 lleva el vencimiento al 11 de julio; como es domingo, el art. 30.5 lo prorroga al primer día hábil siguiente.", "Adelantar al día hábil anterior es justo lo contrario de lo que dice el art. 30.5.", "Cuenta cinco meses en lugar de seis."]], ["S2", "Si transcurre ese plazo sin resolución expresa, ¿cuál es el sentido del silencio?", ["Estimatorio, por la regla general del art. 24.1 LPAC", "Desestimatorio", "No hay silencio: la Administración está obligada a resolver", "Estimatorio si sobra crédito"], 1, ["El art. 24.1 admite excepciones establecidas por norma con rango de ley, y la Ley 38/2003 es una de ellas.", "Correcta. Art. 25.5 LGS: el interesado queda legitimado para entender desestimada su solicitud.", "La obligación de resolver del art. 21.1 LPAC subsiste, pero no impide que el silencio produzca efectos mientras tanto.", "La existencia de crédito sobrante no altera el sentido del silencio."]], ["S2", "La asociación C, que percibió 6.000 € sobre un presupuesto de 20.000 €, justifica gasto por 16.000 €. ¿Qué reintegro procede?", ["No procede reintegro", "1.200 €", "2.000 €", "6.000 €"], 0, ["Correcta. El 50 % de lo efectivamente justificado son 8.000 €, por encima de los 6.000 € percibidos: el gasto acreditado cubre de sobra la subvención.", "Aplica el 20 % de desviación sobre los 6.000 €, pero la regla no es esa: hay que ver si lo justificado soporta lo percibido.", "Es la diferencia entre presupuesto y justificación multiplicada por el 50 %, operación que aquí no procede.", "El reintegro total exigiría falta absoluta de justificación, no una justificación del 80 % del presupuesto."]], ["S2", "La asociación A, que percibió 6.000 € sobre un presupuesto de 14.000 €, justifica gasto por 9.000 €. ¿Qué reintegro procede?", ["2.500 €", "1.500 €", "4.500 €", "6.000 €"], 1, ["No corresponde a ninguna de las operaciones del supuesto.", "Correcta. El 50 % de 9.000 € son 4.500 € de subvención procedente; 6.000 − 4.500 = 1.500 € a reintegrar.", "4.500 € es la cantidad que A conserva, no la que devuelve.", "El reintegro total solo procedería si no hubiera justificado nada."]], ["S2", "Los intereses de demora del reintegro se exigen…", ["desde la notificación del acuerdo de reintegro", "desde que venció el plazo de justificación", "desde el pago de la subvención hasta que se acuerde la procedencia del reintegro", "no se devengan en los incumplimientos parciales"], 2, ["Esa fecha es posterior y dejaría sin interés todo el periodo en que la entidad dispuso de un dinero que no le correspondía.", "Es la fecha desde la que se cuenta la prescripción del art. 39.2.a), no los intereses.", "Correcta. Art. 37.1 LGS, que lo dice con esas palabras, o hasta la fecha del ingreso si es anterior.", "El art. 37.1 no distingue: también el reintegro parcial devenga interés de demora."]], ["S2", "¿Cuál es el plazo máximo del procedimiento de reintegro y qué ocurre si se agota?", ["Seis meses, con silencio desestimatorio", "Doce meses desde el acuerdo de iniciación; se produce la caducidad", "Cuatro años", "Tres meses, con archivo de las actuaciones"], 1, ["Los seis meses son el plazo de la concesión, no el del reintegro.", "Correcta. Art. 42.4 LGS: doce meses desde el acuerdo de iniciación, y su transcurso produce la caducidad del procedimiento.", "Cuatro años es el plazo de prescripción del art. 39.1, cosa distinta de la duración del procedimiento.", "No es el plazo, y la consecuencia es la caducidad, no un simple archivo."]], ["S2", "¿En qué plazo prescribe el derecho de la Administración a reconocer o liquidar el reintegro?", ["Cuatro años", "Cinco años", "Doce meses", "Quince años"], 0, ["Correcta. Art. 39.1 LGS, contado desde que venció el plazo de justificación (art. 39.2.a).", "Cinco años no es el plazo de la Ley 38/2003.", "Doce meses es la duración máxima del procedimiento de reintegro (art. 42.4).", "Quince años es el plazo civil de las acciones personales, ajeno a esta materia."]], ["S2", "¿Puede el Ayuntamiento pagar la subvención antes de que se justifique la actividad?", ["Nunca: el art. 34.3 exige justificación previa", "Sí, siempre, hasta el 50 % del importe", "Sí, si lo prevé expresamente la normativa reguladora, que fijará el régimen de garantías", "Solo con aval bancario por el 100 % del importe"], 2, ["La regla general es la del art. 34.3, pero el 34.4 admite expresamente pagos a cuenta y anticipados.", "No hay un porcentaje automático: depende de lo que fije la normativa reguladora.", "Correcta. Art. 34.4 LGS: la posibilidad y el régimen de garantías «deberán preverse expresamente en la normativa reguladora de la subvención».", "El régimen de garantías lo fija la normativa reguladora; no hay una exigencia legal de aval por el total."]], ["S2", "¿Qué debe comunicarse a la Base de Datos Nacional de Subvenciones?", ["Solo el importe finalmente concedido", "El texto de la convocatoria y la información que la Base requiera, publicándose un extracto en el diario oficial", "Nada: basta la publicación en el tablón de anuncios", "Solo las subvenciones que superen un determinado importe"], 1, ["El importe concedido es parte de la información, pero la comunicación arranca antes, con el texto mismo de la convocatoria.", "Correcta. Arts. 20.8.a) y 23.2 LGS: la convocatoria se publica en la BDNS y un extracto en el diario oficial correspondiente.", "El tablón no sustituye a la BDNS, que opera como Sistema Nacional de Publicidad de Subvenciones.", "La Ley no fija un umbral de importe para esta comunicación."]]];
const SEM=["Distingo valor estimado de presupuesto base de licitación y sé cuál lleva IVA", "Sé que las prórrogas entran en el valor estimado aunque no se hayan acordado", "Me sé de memoria 40.000 y 15.000 del contrato menor, y 80.000 y 60.000 del abreviado", "Calculo el crédito disponible y sé que el gasto se compromete con IVA", "Distingo crédito extraordinario de suplemento de crédito y sé quién los aprueba", "Sé cuándo el órgano de contratación es el Alcalde y cuándo el Pleno", "Sé que en la tramitación abreviada no hay garantía definitiva", "Calculo la garantía definitiva al 5 % sobre el precio sin IVA", "Aplico el tope de la convocatoria sobre el porcentaje de subvención", "Sé que el prorrateo es excepcional y exige previsión en las bases", "Cuento un plazo en días hábiles sobre un calendario sin equivocarme", "Cuento un plazo en meses y aplico la prórroga del último día inhábil", "Sé que en subvenciones el silencio es desestimatorio y por qué", "Recalculo la subvención procedente sobre el gasto justificado y obtengo el reintegro", "Sé desde cuándo corren los intereses de demora del reintegro", "Distingo los 12 meses del procedimiento de reintegro de los 4 años de prescripción"];
</script>
<script>
document.getElementById("main").innerHTML="<section class=\"card\" id=\"intro\"><h2>Simulacro · dos supuestos prácticos con calculadora</h2>\n<div class=\"idea\">Dos supuestos independientes, 35 preguntas de cuatro opciones. La calculadora hace falta para el IVA, los umbrales, los porcentajes y los saldos de crédito; para las fechas no, porque tienes el calendario.</div>\n<p class=\"small\">Calibrado sobre el nivel de los supuestos oficiales de auxiliar administrativo: nada de fórmulas de puntuación de ofertas ni de cálculo de intereses. Lo que se pide es <b>calificar</b> —qué contrato es, qué procedimiento cabe, qué órgano decide, qué plazo corre— y hacer <b>una o dos operaciones sencillas</b> con cifras redondas.</p>\n<div class=\"box warn\"><span class=\"lbl\">Antes de empezar</span>Verifica la vigencia en el BOE consolidado. Los umbrales de los contratos sujetos a regulación armonizada se revisan cada dos años por reglamento de la Comisión Europea; los documentos de la biblioteca recogen los que estaban en vigor en la fecha de su consolidación. Los umbrales del contrato menor (40.000 y 15.000 €) y los del procedimiento abreviado (80.000 y 60.000 €) están en la propia Ley 9/2017 y no se actualizan por esa vía.</div>\n<div class=\"box ej\"><span class=\"lbl\">Cómo sacarle partido</span><ol><li>Lee el enunciado y haz los cálculos <b>en papel</b>, sin mirar las opciones.</li><li>Contesta las 35 preguntas de una tirada, cronometradas: 60 minutos.</li><li>Corrige y lee la explicación de <b>las cuatro</b> opciones, no solo de la que fallaste. Las incorrectas son errores reales de examen.</li><li>Usa «Repetir solo los fallos» al día siguiente.</li></ol></div>\n<p class=\"small\"><b>Ámbito formativo.</b> Los supuestos son ficticios y están construidos para estudiar. No son asesoramiento jurídico para ningún expediente real.</p>\n</section><section class=\"card\" id=\"s1\"><h2>Supuesto 1 · Contratación y crédito</h2>\n<div class=\"legal\"><span class=\"lbl\">Enunciado</span>\n<p>El <b>Ayuntamiento de Las Flores</b>, municipio de régimen común de la provincia de Málaga con <b>4.800 habitantes</b>, tiene aprobado su presupuesto para 2027. Los <b>recursos ordinarios</b> del presupuesto ascienden a <b>3.000.000 €</b>.</p>\n<p>El negociado de contratación prepara cinco expedientes. Todos los importes se expresan <b>sin IVA</b>, siendo aplicable el tipo general del <b>21 %</b>:</p>\n<table><thead><tr><th>N.º</th><th>Objeto</th><th>Importe</th><th>Duración</th></tr></thead><tbody>\n<tr><td>1</td><td>Obra de reparación del acerado de la calle Mayor</td><td>38.000 €</td><td>4 meses</td></tr>\n<tr><td>2</td><td>Servicio de mantenimiento de parques y jardines</td><td>14.500 € al año</td><td>1 año, prorrogable por otro; <b>se tiene intención de prorrogar</b></td></tr>\n<tr><td>3</td><td>Suministro de equipos informáticos</td><td>12.000 €</td><td>Entrega única</td></tr>\n<tr><td>4</td><td>Servicio de organización de un curso de formación</td><td>16.000 €</td><td>1 año</td></tr>\n<tr><td>5</td><td>Servicio de limpieza de edificios municipales</td><td>60.000 € al año</td><td>2 años, sin prórroga</td></tr>\n</tbody></table>\n<p>La aplicación presupuestaria que soporta la <b>obra</b> tiene un <b>crédito definitivo de 60.000 €</b>, con <b>gastos autorizados por 18.000 €</b> y ninguna retención pendiente. Ninguno de los contratos tiene por objeto prestaciones de carácter intelectual.</p>\n<p>Finalmente, el contrato 4 se tramita por la vía abreviada del procedimiento abierto simplificado y se adjudica en <b>14.400 €</b>; el contrato 5 se tramita por el procedimiento abierto simplificado ordinario y se adjudica en <b>115.000 €</b>. Ambos importes, sin IVA.</p>\n</div>\n<svg viewBox=\"0 0 980 352\" width=\"100%\" role=\"img\" aria-label=\"Cuadro de los cinco contratos con su valor estimado, si caben como contrato menor y el procedimiento aplicable\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"v1fr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#4b5563\"/></marker><marker id=\"v1fe\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#15803d\"/></marker><marker id=\"v1fw\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#b45309\"/></marker></defs><text x=\"490\" y=\"24\" font-size=\"13\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"bold\">Los cinco contratos: qué cifra se compara y con qué umbral</text><rect x=\"20\" y=\"38\" width=\"250\" height=\"30\" rx=\"8\" fill=\"#e8efff\" stroke=\"#1d4ed8\" stroke-width=\"1.4\"/><text x=\"145\" y=\"57\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#1d4ed8\" font-weight=\"bold\">Contrato</text><rect x=\"280\" y=\"38\" width=\"150\" height=\"30\" rx=\"8\" fill=\"#e8efff\" stroke=\"#1d4ed8\" stroke-width=\"1.4\"/><text x=\"355\" y=\"57\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#1d4ed8\" font-weight=\"bold\">Valor estimado</text><rect x=\"440\" y=\"38\" width=\"190\" height=\"30\" rx=\"8\" fill=\"#e8efff\" stroke=\"#1d4ed8\" stroke-width=\"1.4\"/><text x=\"535\" y=\"57\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#1d4ed8\" font-weight=\"bold\">¿Contrato menor?</text><rect x=\"640\" y=\"38\" width=\"320\" height=\"30\" rx=\"8\" fill=\"#e8efff\" stroke=\"#1d4ed8\" stroke-width=\"1.4\"/><text x=\"800\" y=\"57\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#1d4ed8\" font-weight=\"bold\">Procedimiento que encaja</text><rect x=\"20\" y=\"74\" width=\"250\" height=\"46\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"145\" y=\"94.175\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">1 · Obra de acerado</text><text x=\"145\" y=\"107.175\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">38.000 € (4 meses)</text><rect x=\"280\" y=\"74\" width=\"150\" height=\"46\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"355\" y=\"100.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">38.000 €</text><rect x=\"440\" y=\"74\" width=\"190\" height=\"46\" rx=\"8\" fill=\"#eaf6ee\" stroke=\"#15803d\" stroke-width=\"1.4\"/><text x=\"535\" y=\"94.175\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">SÍ</text><text x=\"535\" y=\"107.175\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">obras &lt; 40.000</text><rect x=\"640\" y=\"74\" width=\"320\" height=\"46\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"800\" y=\"94.175\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Contrato menor: informe, aprobación</text><text x=\"800\" y=\"107.175\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">del gasto y factura (art. 118)</text><rect x=\"20\" y=\"124\" width=\"250\" height=\"46\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"145\" y=\"144.175\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">2 · Servicio de parques</text><text x=\"145\" y=\"157.175\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">14.500 €/año + 1 prórroga</text><rect x=\"280\" y=\"124\" width=\"150\" height=\"46\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"355\" y=\"150.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">29.000 €</text><rect x=\"440\" y=\"124\" width=\"190\" height=\"46\" rx=\"8\" fill=\"#fdeceb\" stroke=\"#b91c1c\" stroke-width=\"1.4\"/><text x=\"535\" y=\"144.175\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">NO</text><text x=\"535\" y=\"157.175\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">servicios ≥ 15.000</text><rect x=\"640\" y=\"124\" width=\"320\" height=\"46\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"800\" y=\"144.175\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Abierto simplificado abreviado</text><text x=\"800\" y=\"157.175\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">art. 159.6</text><rect x=\"20\" y=\"174\" width=\"250\" height=\"46\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"145\" y=\"194.175\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">3 · Suministro informático</text><text x=\"145\" y=\"207.175\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">12.000 €</text><rect x=\"280\" y=\"174\" width=\"150\" height=\"46\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"355\" y=\"200.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">12.000 €</text><rect x=\"440\" y=\"174\" width=\"190\" height=\"46\" rx=\"8\" fill=\"#eaf6ee\" stroke=\"#15803d\" stroke-width=\"1.4\"/><text x=\"535\" y=\"194.175\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">SÍ</text><text x=\"535\" y=\"207.175\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">suministros &lt; 15.000</text><rect x=\"640\" y=\"174\" width=\"320\" height=\"46\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"800\" y=\"194.175\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Contrato menor: informe, aprobación</text><text x=\"800\" y=\"207.175\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">del gasto y factura (art. 118)</text><rect

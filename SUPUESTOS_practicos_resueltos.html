<script>
document.getElementById('main').innerHTML+="<section class=\"card\" id=\"ex1\"><h2>Turno 17 h · SUPUESTO A · Premio de ensayo con concierto y conferencia</h2><div class=\"box\"><span class=\"lbl\">Enunciado</span>Una delegación de Cultura convoca un premio de ensayo dotado con 10.000 €, con bases reguladoras publicadas en el boletín provincial el 29 de febrero de 2024. Para el acto de entrega se quiere celebrar un concierto y una conferencia, con un presupuesto máximo de 3.000 €.</div><details class=\"panel\"><summary><b>1.</b> ¿Qué plan hay que aprobar con carácter previo, que contemple los objetivos y efectos de la convocatoria?</summary><div class=\"box ej\"><span class=\"lbl\">Respuesta</span><b>El plan estratégico de subvenciones</b></div><div class=\"box interp\"><span class=\"lbl\">Por qué</span>El art. 8.1 exige concretar <b>con carácter previo</b>, en un plan estratégico, los <b>objetivos y efectos</b> que se pretenden, el <b>plazo</b> para su consecución, los <b>costes previsibles</b> y sus <b>fuentes de financiación</b>. No existen en la ley el «plan provincial de premios» ni el «plan de ayudas sociales».</div><div class=\"box legal\"><span class=\"lbl\">Precepto</span>art. 8.1 LGS</div></details><details class=\"panel\"><summary><b>2.</b> Publicadas las bases el 29 de febrero de 2024 con un plazo de 20 días, ¿cuándo se inicia el plazo?</summary><div class=\"box ej\"><span class=\"lbl\">Respuesta</span><b>El 1 de marzo de 2024</b></div><div class=\"box interp\"><span class=\"lbl\">Por qué</span>Los plazos señalados en días se cuentan <b>a partir del día siguiente</b> a aquel en que tenga lugar la publicación (art. 30.4 LPAC). Ni el mismo 29 de febrero, ni el día en que vence.</div><div class=\"box legal\"><span class=\"lbl\">Precepto</span>art. 30.4 LPAC</div></details><details class=\"panel\"><summary><b>3.</b> ¿Qué contenido mínimo NO es necesario concretar en las bases reguladoras?</summary><div class=\"box ej\"><span class=\"lbl\">Respuesta</span><b>El número de páginas, formato y tamaño de letra</b></div><div class=\"box interp\"><span class=\"lbl\">Por qué</span>El art. 17.3 enumera objeto, requisitos de los beneficiarios, procedimiento de concesión, criterios de otorgamiento, cuantía, órganos competentes, plazos, justificación, garantías, modificación, compatibilidad y graduación de incumplimientos. Las cuestiones de <b>formato del trabajo</b> no forman parte de ese contenido mínimo.</div><div class=\"box legal\"><span class=\"lbl\">Precepto</span>art. 17.3 LGS</div></details><details class=\"panel\"><summary><b>4.</b> ¿Quién NO podrá obtener la condición de beneficiario?</summary><div class=\"box ej\"><span class=\"lbl\">Respuesta</span><b>Quien tenga la residencia fiscal en un paraíso fiscal</b></div><div class=\"box interp\"><span class=\"lbl\">Por qué</span>Es la prohibición de la letra f) del art. 13.2. Las otras tres opciones están redactadas <b>en positivo</b> —no haber sido condenado, estar al corriente con Hacienda, estar al corriente con la Seguridad Social— y describen precisamente lo que <b>sí</b> permite ser beneficiario.</div><div class=\"box legal\"><span class=\"lbl\">Precepto</span>art. 13.2.f) LGS</div><div class=\"box warn\"><span class=\"lbl\">Atención</span>Lee siempre si la pregunta va en positivo o en negativo: es la trampa más rentable del examen.</div></details><details class=\"panel\"><summary><b>5.</b> ¿Qué régimen jurídico rige la PREPARACIÓN del contrato para la actuación musical?</summary><div class=\"box ej\"><span class=\"lbl\">Respuesta</span><b>Administrativo</b></div><div class=\"box interp\"><span class=\"lbl\">Por qué</span>El contrato de un espectáculo musical es <b>privado</b> por razón del objeto (art. 25.1.a.1.º), pero el art. 26.2 somete su <b>preparación y adjudicación</b> a la propia Ley 9/2017 y, en su defecto, a las restantes normas de Derecho administrativo. Solo los efectos y la extinción se rigen por el Derecho privado.</div><div class=\"box legal\"><span class=\"lbl\">Precepto</span>arts. 25.1.a).1.º y 26.2 LCSP</div></details><details class=\"panel\"><summary><b>6.</b> ¿Y en cuanto a la CELEBRACIÓN del contrato?</summary><div class=\"box ej\"><span class=\"lbl\">Respuesta</span><b>Administrativo</b></div><div class=\"box interp\"><span class=\"lbl\">Por qué</span>Entendida la celebración como el momento en que el contrato se perfecciona y formaliza, sigue dentro de la fase de <b>adjudicación y formalización</b>, que el art. 26.2 somete al Derecho administrativo. Lo que pasa al Derecho privado son los <b>efectos, modificación y extinción</b>.</div><div class=\"box legal\"><span class=\"lbl\">Precepto</span>art. 26.2 LCSP</div><div class=\"box warn\"><span class=\"lbl\">Atención</span>La pregunta es ambigua: si por «celebración» se entendiera «ejecución», la respuesta sería civil. Por coherencia con el art. 26.2, «celebración» equivale a perfección del contrato.</div></details><details class=\"panel\"><summary><b>7.</b> ¿Qué debe motivar el órgano de contratación conforme al art. 28?</summary><div class=\"box ej\"><span class=\"lbl\">Respuesta</span><b>La necesidad e idoneidad del contrato</b></div><div class=\"box interp\"><span class=\"lbl\">Por qué</span>El art. 28.1 exige determinar con precisión <b>la naturaleza y extensión de las necesidades</b> a cubrir y <b>la idoneidad del objeto y contenido</b> para satisfacerlas, dejando constancia en la documentación preparatoria <b>antes</b> de iniciar el procedimiento.</div><div class=\"box legal\"><span class=\"lbl\">Precepto</span>art. 28.1 LCSP</div></details><details class=\"panel\"><summary><b>8.</b> ¿Cómo se considera la infracción del deber de secreto sobre los datos de la Base de Datos?</summary><div class=\"box ej\"><span class=\"lbl\">Respuesta</span><b>Siempre falta disciplinaria muy grave</b></div><div class=\"box interp\"><span class=\"lbl\">Por qué</span>El art. 20.7 es tajante: con independencia de las responsabilidades <b>penales o civiles</b>, la infracción de ese particular deber de secreto se considera <b>siempre</b> falta disciplinaria <b>muy grave</b>. El adverbio «siempre» descarta las opciones que gradúan según la gravedad de los hechos.</div><div class=\"box legal\"><span class=\"lbl\">Precepto</span>art. 20.7 LGS</div></details><details class=\"panel\"><summary><b>9.</b> ¿Qué principios rigen la gestión de esta subvención?</summary><div class=\"box ej\"><span class=\"lbl\">Respuesta</span><b>Publicidad, transparencia, concurrencia, objetividad, igualdad y no discriminación</b></div><div class=\"box interp\"><span class=\"lbl\">Por qué</span>Son los seis principios de la letra a) del art. 8.3. La <b>eficacia</b> y la <b>eficiencia</b> están en las letras b) y c). <b>Necesidad e idoneidad</b> no pertenecen a las subvenciones, sino a la contratación (art. 28 LCSP); y <b>mérito y capacidad</b>, al empleo público.</div><div class=\"box legal\"><span class=\"lbl\">Precepto</span>art. 8.3.a) LGS</div></details><details class=\"panel\"><summary><b>10.</b> Contra la resolución que otorga el premio, ¿qué recurso cabe?</summary><div class=\"box ej\"><span class=\"lbl\">Respuesta</span><b>Recurso de reposición</b></div><div class=\"box interp\"><span class=\"lbl\">Por qué</span>Los actos del Presidente y del Pleno de una entidad local <b>ponen fin a la vía administrativa</b>, de modo que procede la <b>reposición potestativa</b> ante el mismo órgano o el contencioso directo (art. 123 LPAC). No cabe alzada, que presupone un superior jerárquico, ni el extraordinario de revisión fuera de las causas del art. 125.1.</div><div class=\"box legal\"><span class=\"lbl\">Precepto</span>art. 123 LPAC y art. 52.2 LBRL</div></details></section><section class=\"card\" id=\"ex2\"><h2>Turno 17 h · SUPUESTO B · El presupuesto general de una diputación</h2><div class=\"box\"><span class=\"lbl\">Enunciado</span>Conforme al art. 164 del TRLHL, una diputación provincial debe elaborar y aprobar el Presupuesto General para el ejercicio 2025.</div><details class=\"panel\"><summary><b>1.</b> ¿Quién es el órgano competente para su formación?</summary><div class=\"box ej\"><span class=\"lbl\">Respuesta</span><b>El Presidente</b></div><div class=\"box interp\"><span class=\"lbl\">Por qué</span>El art. 168.1 es literal: «El presupuesto de la Entidad Local será formado por su Presidente». El Interventor <b>informa</b> (168.4) y el Pleno <b>aprueba</b> (169.2), pero <b>formar</b> el presupuesto corresponde al Presidente.</div><div class=\"box legal\"><span class=\"lbl\">Precepto</span>art. 168.1 TRLHL</div></details><details class=\"panel\"><summary><b>2.</b> ¿En qué fecha debe remitirse al Pleno el proyecto para el ejercicio 2025?</summary><div class=\"box ej\"><span class=\"lbl\">Respuesta</span><b>Antes del 15 de octubre de 2024</b></div><div class=\"box interp\"><span class=\"lbl\">Por qué</span>El art. 168.4 fija la remisión al Pleno, informado por la Intervención, <b>antes del día 15 de octubre</b> del año anterior al del ejercicio. Para 2025, antes del 15 de octubre de 2024.</div><div class=\"box legal\"><span class=\"lbl\">Precepto</span>art. 168.4 TRLHL</div></details><details class=\"panel\"><summary><b>3.</b> ¿Dónde se expone al público el anuncio de la aprobación inicial?</summary><div class=\"box ej\"><span class=\"lbl\">Respuesta</span><b>En el Boletín Oficial de la Provincia</b></div><div class=\"box interp\"><span class=\"lbl\">Por qué</span>El art. 169.1 exige anuncio en el <b>boletín oficial de la provincia</b> o, en su caso, de la comunidad autónoma uniprovincial, y exposición al público por <b>15 días</b>.</div><div class=\"box legal\"><span class=\"lbl\">Precepto</span>art. 169.1 TRLHL</div></details><details class=\"panel\"><summary><b>4.</b> Presentadas reclamaciones, ¿de qué plazo dispone el Pleno para resolverlas?</summary><div class=\"box ej\"><span class=\"lbl\">Respuesta</span><b>Un mes</b></div><div class=\"box interp\"><span class=\"lbl\">Por qué</span>El art. 169.1 dispone que, presentadas reclamaciones, «el Pleno dispondrá de <b>un plazo de un mes</b> para resolverlas». No 30 días ni 20 días: <b>un mes</b>.</div><div class=\"box legal\"><span class=\"lbl\">Precepto</span>art. 169.1 TRLHL</div></details><details class=\"panel\"><summary><b>5.</b> Aprobado definitivamente el presupuesto, ¿qué recurso cabe?</summary><div class=\"box ej\"><span class=\"lbl\">Respuesta</span><b>Recurso contencioso-administrativo</b></div><div class=\"box interp\"><span class=\"lbl\">Por qué</span>El art. 171.1 permite interponer <b>directamente</b> recurso contencioso-administrativo contra la aprobación definitiva. Su interposición <b>no suspende por sí sola</b> la aplicación del presupuesto (171.3), y si la impugnación afecta a la nivelación, el Tribunal de Cuentas debe informar previamente (171.2).</div><div class=\"box legal\"><span class=\"lbl\">Precepto</span>art. 171 TRLHL</div></details><details class=\"panel\"><summary><b>6.</b> ¿Qué norma regula la estructura presupuestaria de las entidades locales?</summary><div class=\"box ej\"><span class=\"lbl\">Respuesta</span><b>La Orden de 3 de diciembre de 2008</b></div><div class=\"box interp\"><span class=\"lbl\">Por qué</span>Es la <b>Orden EHA/3565/2008, de 3 de diciembre</b>, que desarrolla el art. 167 del TRLHL. El RD 500/1990 es de 20 de abril y desarrolla el capítulo I del título VI en materia presupuestaria, no la estructura.</div><div class=\"box legal\"><span class=\"lbl\">Precepto</span>Orden EHA/3565/2008</div></details><details class=\"panel\"><summary><b>7.</b> ¿Qué NO se une como anexo al presupuesto general?</summary><div class=\"box ej\"><span class=\"lbl\">Respuesta</span><b>La liquidación del presupuesto del ejercicio anterior</b></div><div class=\"box interp\"><span class=\"lbl\">Por qué</span>Los <b>anexos</b> del art. 166.1 son cuatro: planes y programas de inversión y financiación a <b>cuatro años</b>, programas anuales de las sociedades, estado de <b>consolidación</b> y estado de la <b>deuda</b>. La <b>liquidación del ejercicio anterior</b> no es anexo del art. 166: es <b>documentación</b> que se une al presupuesto por el art. 168.1.b).</div><div class=\"box legal\"><span class=\"lbl\">Precepto</span>arts. 166.1 y 168.1.b) TRLHL</div><div class=\"box warn\"><span class=\"lbl\">Atención</span><b>Discrepancia.</b> La marca del examen señala los planes de inversión, que sí son anexo (166.1.a). Atendiendo a la letra de la ley, la respuesta correcta es la liquidación. Contrasta esta pregunta con la plantilla oficial si la tienes.</div></details><details class=\"panel\"><summary><b>8.</b> Los créditos para gastos corrientes deben incluir:</summary><div class=\"box ej\"><span class=\"lbl\">Respuesta</span><b>Gastos de funcionamiento de los servicios, intereses de deudas y transferencias corrientes</b></div><div class=\"box interp\"><span class=\"lbl\">Por qué</span>La Orden EHA/3565/2008 agrupa como <b>operaciones corrientes</b> los capítulos <b>1 a 4</b>: personal y bienes corrientes y servicios —el funcionamiento de los servicios—, los <b>intereses</b> y las <b>transferencias corrientes</b>. Las <b>inversiones reales</b> son capítulo 6 y por definición son gasto <b>de capital</b>.</div><div class=\"box legal\"><span class=\"lbl\">Precepto</span>Orden EHA/3565/2008 · clasificación económica</div><div class=\"box warn\"><span class=\"lbl\">Atención</span><b>Discrepancia.</b> La marca del examen apunta a «inversiones reales», que contradice la Orden. La pregunta pudo ser anulada.</div></details><details class=\"panel\"><summary><b>9.</b> Los créditos para gastos de capital deben incluir:</summary><div class=\"box ej\"><span class=\"lbl\">Respuesta</span><b>Transferencias de capital, inversiones, activos y pasivos financieros</b></div><div class=\"box interp\"><span class=\"lbl\">Por qué</span>En sentido estricto las <b>operaciones de capital</b> son los capítulos <b>6</b> (inversiones reales) y <b>7</b> (transferencias de capital), y los capítulos <b>8 y 9</b> son <b>operaciones financieras</b>. De las cuatro opciones, la única que no mezcla gasto corriente es esta.</div><div class=\"box legal\"><span class=\"lbl\">Precepto</span>Orden EHA/3565/2008</div><div class=\"box warn\"><span class=\"lbl\">Atención</span><b>Discrepancia.</b> La marca apunta a «gastos de personal», que es capítulo 1 y por tanto corriente. Trátala como pregunta defectuosa y quédate con el criterio de la Orden.</div></details><details class=\"panel\"><summary><b>10.</b> De 31 diputados, ¿qué votación reúne los requisitos para aprobar el presupuesto?</summary><div class=\"box ej\"><span class=\"lbl\">Respuesta</span><b>12 votos a favor, 11 en contra y 8 abstenciones</b></div><div class=\"box interp\"><span class=\"lbl\">Por qué</span>El presupuesto se aprueba por <b>mayoría simple</b>: más votos a favor que en contra. Las abstenciones no cuentan. Solo la primera opción cumple esa condición (12 > 11).</div><div class=\"box legal\"><span class=\"lbl\">Precepto</span>art. 47.1 LBRL <i>(norma externa a la biblioteca)</i></div><div class=\"box warn\"><span class=\"lbl\">Atención</span>Esta pregunta pertenece al <b>tema 1</b>, que aún no está en tus materiales.</div></details></section><section class=\"card\" id=\"ex3\"><h2>Turno 12 h · SUPUESTO A · Expediente de contratación de un servicio</h2><div class=\"box\"><span class=\"lbl\">Enunciado</span>Una entidad local tramita un expediente de contratación de servicios por procedimiento abierto, sujeto a regulación armonizada, con varios criterios de adjudicación.</div><details class=\"panel\"><summary><b>1.</b> ¿Qué debe justificarse en el expediente conforme al art. 116.4?</summary><div class=\"box ej\"><span class=\"lbl\">Respuesta</span><b>La elección del procedimiento de licitación</b></div><div class=\"box interp\"><span class=\"lbl\">Por qué</span>La letra a) del art. 116.4 exige justificar en el expediente <b>la elección del procedimiento</b> de licitación. Junto a ella, la clasificación exigida, los criterios de solvencia y de adjudicación, el valor estimado, la necesidad y —en servicios— el informe de insuficiencia de medios.</div><div class=\"box legal\"><span class=\"lbl\">Precepto</span>art. 116.4.a) LCSP</div></details><details class=\"panel\"><summary><b>2.</b> ¿Qué documento inicia el expediente de contratación?</summary><div class=\"box ej\"><span class=\"lbl\">Respuesta</span><b>La resolución motivada del órgano de contratación</b></div><div class=\"box interp\"><span class=\"lbl\">Por qué</span>El art. 116.1 ordena que el órgano de contratación <b>inicie</b> el expediente <b>motivando la necesidad</b> del contrato en los términos del art. 28 y que esa resolución se <b>publique en el perfil de contratante</b>.</div><div class=\"box legal\"><span class=\"lbl\">Precepto</span>art. 116.1 LCSP</div></details><details class=\"panel\"><summary><b>3.</b> ¿Qué se une al expediente conforme al art. 116.3?</summary><div class=\"box ej\"><span class=\"lbl\">Respuesta</span><b>El pliego de cláusulas administrativas particulares y el de prescripciones técnicas</b></div><div class=\"box interp\"><span class=\"lbl\">Por qué</span>El art. 116.3 exige incorporar los <b>pliegos</b>, el <b>certificado de existencia de crédito</b> —o documento equivalente— y la <b>fiscalización previa</b> de la Intervención.</div><div class=\"box legal\"><span class=\"lbl\">Precepto</span>art. 116.3 LCSP</div></details><details class=\"panel\"><summary><b>4.</b> En el cálculo del valor estimado, ¿qué se incluye?</summary><div class=\"box ej\"><span class=\"lbl\">Respuesta</span><b>Cualquier forma de opción eventual y las prórrogas</b></div><div class=\"box interp\"><span class=\"lbl\">Por qué</span>El art. 101.1 manda tomar el <b>importe total sin IVA</b>, incluyendo <b>cualquier forma de opción eventual</b> y las <b>eventuales prórrogas</b>, así como primas o pagos a los candidatos.</div><div class=\"box legal\"><span class=\"lbl\">Precepto</span>art. 101.1 LCSP</div><div class=\"box warn\"><span class=\"lbl\">Atención</span>El IVA nunca entra en el valor estimado. Es el error más repetido.</div></details><details class=\"panel\"><summary><b>5.</b> ¿Qué debe justificarse cuando NO se divide el contrato en lotes?</summary><div class=\"box ej\"><span class=\"lbl\">Respuesta</span><b>La no división en lotes</b></div><div class=\"box interp\"><span class=\"lbl\">Por qué</span>La letra g) del art. 116.4 exige justificar en el expediente <b>la no división en lotes del objeto del contrato</b>. La regla general del art. 99.3 es dividir; no dividir es la excepción y por eso hay que motivarla.</div><div class=\"box legal\"><span class=\"lbl\">Precepto</span>arts. 116.4.g) y 99.3 LCSP</div><div class=\"box warn\"><span class=\"lbl\">Atención</span><b>Discrepancia.</b> La marca del examen apunta a otra letra. La no división en lotes está expresamente en la letra g) del 116.4.</div></details><details class=\"panel\"><summary><b>6.</b> Completado el expediente, ¿qué se dicta?</summary><div class=\"box ej\"><span class=\"lbl\">Respuesta</span><b>La resolución de aprobación del expediente y la apertura del procedimiento de adjudicación</b></div><div class=\"box interp\"><span class=\"lbl\">Por qué</span>El art. 117.1 dispone que, completado el expediente, se dicte resolución motivada <b>aprobando el expediente</b> y <b>disponiendo la apertura</b> del procedimiento de adjudicación, con la <b>aprobación del gasto</b>.</div><div class=\"box legal\"><span class=\"lbl\">Precepto</span>art. 117.1 LCSP</div></details><details class=\"panel\"><summary><b>7.</b> La aprobación del expediente, ¿qué otra aprobación implica?</summary><div class=\"box ej\"><span class=\"lbl\">Respuesta</span><b>La aprobación del gasto</b></div><div class=\"box interp\"><span class=\"lbl\">Por qué</span>El art. 117.1 in fine: dicha resolución <b>implicará también la aprobación del gasto</b>, salvo el supuesto excepcional previsto en la letra a) del apartado 3 del art. 117 o los contratos de tramitación anticipada.</div><div class=\"box legal\"><span class=\"lbl\">Precepto</span>art. 117.1 LCSP</div></details><details class=\"panel\"><summary><b>8.</b> Si por resolución de un recurso especial hay que adjudicar a otro licitador, ¿de qué plazo dispone?</summary><div class=\"box ej\"><span class=\"lbl\">Respuesta</span><b>Diez días hábiles</b></div><div class=\"box interp\"><span class=\"lbl\">Por qué</span>El art. 150.4 es literal: se concederá a ese licitador «un plazo de <b>diez días hábiles</b> para que cumplimente los trámites que resulten oportunos».</div><div class=\"box legal\"><span class=\"lbl\">Precepto</span>art. 150.4 LCSP</div></details><details class=\"panel\"><summary><b>9.</b> ¿En qué plazo debe formalizarse el contrato susceptible de recurso especial?</summary><div class=\"box ej\"><span class=\"lbl\">Respuesta</span><b>No antes de que transcurran quince días hábiles desde la remisión de la notificación</b></div><div class=\"box interp\"><span class=\"lbl\">Por qué</span>El art. 153.3: en los contratos susceptibles de recurso especial, la formalización <b>no podrá efectuarse antes de que transcurran quince días hábiles</b> desde que se remita la notificación de la adjudicación. Transcurrido ese plazo, el órgano requiere al adjudicatario para formalizar en <b>plazo no superior a cinco días</b>.</div><div class=\"box legal\"><span class=\"lbl\">Precepto</span>art. 153.3 LCSP</div><div class=\"box warn\"><span class=\"lbl\">Atención</span><b>Discrepancia.</b> La marca del examen dice diez días. La ley dice quince días hábiles.</div></details><details class=\"panel\"><summary><b>10.</b> ¿Qué recurso cabe contra los pliegos de un contrato de servicios SARA?</summary><div class=\"box ej\"><span class=\"lbl\">Respuesta</span><b>El recurso especial en materia de contratación</b></div><div class=\"box interp\"><span class=\"lbl\">Por qué</span>El art. 44.1.b) incluye los contratos de <b>servicios sujetos a regulación armonizada</b>, y el 44.2.a) señala como acto recurrible los <b>pliegos</b> y demás documentos contractuales que establezcan las condiciones de la contratación. Es <b>potestativo</b> y <b>gratuito</b> (art. 44.6 y 44.7).</div><div class=\"box legal\"><span class=\"lbl\">Precepto</span>art. 44 LCSP</div></details></section><section class=\"card\" id=\"ex4\"><h2>Turno 12 h · SUPUESTO B · Modificación de créditos y ejecución del presupuesto</h2><div class=\"box\"><span class=\"lbl\">Enunciado</span>En el transcurso del ejercicio, una entidad local necesita atender un gasto no previsto y tramitar diversas operaciones de ejecución del presupuesto de gastos.</div><details class=\"panel\"><summary><b>1.</b> ¿Qué modificación presupuestaria procede cuando hay que atender un gasto específico y determinado que no puede demorarse y no existe crédito?</summary><div class=\"box ej\"><span class=\"lbl\">Respuesta</span><b>Crédito extraordinario</b></div><div class=\"box interp\"><span class=\"lbl\">Por qué</span>El art. 177.1 distingue: si <b>no existe crédito</b>, crédito <b>extraordinario</b>; si el crédito existe pero es <b>insuficiente y no ampliable</b>, <b>suplemento de crédito</b>. En ambos casos el gasto debe ser <b>específico y determinado</b> y no poder demorarse al ejercicio siguiente.</div><div class=\"box legal\"><span class=\"lbl\">Precepto</span>art. 177.1 TRLHL</div></details><details class=\"panel\"><summary><b>2.</b> ¿Quién aprueba los créditos extraordinarios y suplementos de crédito?</summary><div class=\"box ej\"><span class=\"lbl\">Respuesta</span><b>El Pleno de la corporación</b></div><div class=\"box interp\"><span class=\"lbl\">Por qué</span>El art. 177.2 remite al mismo trámite del presupuesto: expediente del Presidente, informe de la Intervención y <b>aprobación por el Pleno</b>, con las mismas normas de publicidad, reclamaciones y recursos de los arts. 169 a 171.</div><div class=\"box legal\"><span class=\"lbl\">Precepto</span>art. 177.2 TRLHL</div></details><details class=\"panel\"><summary><b>3.</b> El acto por el que se reserva crédito para un gasto determinado se denomina:</summary><div class=\"box ej\"><span class=\"lbl\">Respuesta</span><b>Autorización del gasto (A)</b></div><div class=\"box interp\"><span class=\"lbl\">Por qué</span>La <b>autorización</b> (A) es el acto por el que se acuerda la realización de un gasto por cuantía cierta o aproximada, <b>reservando</b> a tal fin la totalidad o parte de un crédito. La <b>retención</b> (RC) es previa y solo certifica la existencia del crédito; el <b>compromiso</b> (D) ya vincula frente a un tercero.</div><div class=\"box legal\"><span class=\"lbl\">Precepto</span>art. 184 TRLHL y RD 500/1990</div></details><details class=\"panel\"><summary><b>4.</b> El acuerdo con un tercero por el que se vincula el gasto a la realización de una prestación concreta se denomina:</summary><div class=\"box ej\"><span class=\"lbl\">Respuesta</span><b>Disposición o compromiso del gasto (D)</b></div><div class=\"box interp\"><span class=\"lbl\">Por qué</span>La <b>disposición</b> (D) es el acto por el que se acuerda o concierta con un tercero la realización de obras, prestaciones o suministros. Es un acto <b>con relevancia jurídica frente a terceros</b>, a diferencia de la autorización, que es interna.</div><div class=\"box legal\"><span class=\"lbl\">Precepto</span>art. 184 TRLHL y RD 500/1990</div></details><details class=\"panel\"><summary><b>5.</b> La declaración de existencia de un crédito exigible contra la entidad se denomina:</summary><div class=\"box ej\"><span class=\"lbl\">Respuesta</span><b>Reconocimiento de la obligación (O)</b></div><div class=\"box interp\"><span class=\"lbl\">Por qué</span>El <b>reconocimiento y liquidación de la obligación</b> (O) es el acto por el que se declara la existencia de un <b>crédito exigible</b> contra la entidad, derivado de un gasto autorizado y comprometido, previa acreditación documental de la prestación.</div><div class=\"box legal\"><span class=\"lbl\">Precepto</span>art. 185 TRLHL</div></details><details class=\"panel\"><summary><b>6.</b> ¿Qué documento contable refleja de una sola vez las fases A, D y O?</summary><div class=\"box ej\"><span class=\"lbl\">Respuesta</span><b>ADO</b></div><div class=\"box interp\"><span class=\"lbl\">Por qué</span>El documento <b>ADO</b> acumula autorización, disposición y reconocimiento de la obligación. <b>AD</b> acumula solo autorización y disposición; <b>ADOP</b> añade la <b>propuesta de pago</b> (P).</div><div class=\"box legal\"><span class=\"lbl\">Precepto</span>RD 500/1990 · instrucción de contabilidad</div><div class=\"box warn\"><span class=\"lbl\">Atención</span>Regla mnemotécnica: R-A-D-O-P. Cada letra que añades es un paso más hacia el pago.</div></details><details class=\"panel\"><summary><b>7.</b> ¿Qué gastos NO pueden acordarse sin crédito?</summary><div class=\"box ej\"><span class=\"lbl\">Respuesta</span><b>Los que excedan del importe de los créditos autorizados</b></div><div class=\"box interp\"><span class=\"lbl\">Por qué</span>El art. 173.5 declara <b>nulos de pleno derecho</b> los acuerdos, resoluciones y actos administrativos que <b>infrinjan</b> la norma de que no pueden adquirirse compromisos de gasto por cuantía superior al importe de los créditos autorizados.</div><div class=\"box legal\"><span class=\"lbl\">Precepto</span>art. 173.5 TRLHL</div></details><details class=\"panel\"><summary><b>8.</b> Los créditos para gastos que el último día del ejercicio no estén afectados al cumplimiento de obligaciones reconocidas:</summary><div class=\"box ej\"><span class=\"lbl\">Respuesta</span><b>Quedarán anulados de pleno derecho</b></div><div class=\"box interp\"><span class=\"lbl\">Por qué</span>El art. 175 es el principio de <b>anualidad presupuestaria</b>: los créditos no afectados al cumplimiento de obligaciones reconocidas quedan <b>anulados de pleno derecho</b>, sin perjuicio de la <b>incorporación de remanentes</b> del art. 182.</div><div class=\"box legal\"><span class=\"lbl\">Precepto</span>art. 175 TRLHL</div></details><details class=\"panel\"><summary><b>9.</b> En un contrato menor de servicios, ¿cuál es el límite de valor estimado?</summary><div class=\"box ej\"><span class=\"lbl\">Respuesta</span><b>Inferior a 15.000 euros</b></div><div class=\"box interp\"><span class=\"lbl\">Por qué</span>El art. 118.1: contratos menores son los de <b>obras</b> de valor estimado inferior a <b>40.000 €</b> y los de <b>suministros o servicios</b> inferior a <b>15.000 €</b>. Recuerda: es valor estimado, es decir, <b>sin IVA</b>.</div><div class=\"box legal\"><span class=\"lbl\">Precepto</span>art. 118.1 LCSP</div></details><details class=\"panel\"><summary><b>10.</b> La resolución que aprueba la modificación de créditos, ¿cuándo entra en vigor?</summary><div class=\"box ej\"><span class=\"lbl\">Respuesta</span><b>Una vez publicada definitivamente y transcurrido el plazo de exposición</b></div><div class=\"box interp\"><span class=\"lbl\">Por qué</span>El art. 177.2 remite a los arts. 169 a 171: aprobación inicial, exposición al público <b>15 días</b>, resolución de reclamaciones en <b>un mes</b> y publicación resumida por capítulos; entra en vigor <b>una vez publicada</b> la aprobación definitiva.</div><div class=\"box legal\"><span class=\"lbl\">Precepto</span>arts. 169 y 177.2 TRLHL</div></details></section><section class=\"card\" id=\"ex5\"><h2>Turno 9 h · SUPUESTO A · Del presupuesto al contrato</h2><div class=\"box\"><span class=\"lbl\">Enunciado</span>Una entidad local aprueba su presupuesto, ejecuta el gasto y contrata un suministro. El supuesto recorre el ciclo completo: aprobación, ejecución y contratación.</div><details class=\"panel\"><summary><b>1.</b> El presupuesto general contiene el de la propia entidad, el de sus organismos autónomos y:</summary><div class=\"box ej\"><span class=\"lbl\">Respuesta</span><b>Los estados de previsión de gastos e ingresos de las sociedades mercantiles de capital íntegramente local</b></div><div class=\"box interp\"><span class=\"lbl\">Por qué</span>El art. 164.1 es literal: presupuesto de la propia entidad, presupuestos de los <b>organismos autónomos</b> dependientes y <b>estados de previsión</b> de gastos e ingresos de las <b>sociedades mercantiles</b> cuyo capital social pertenezca íntegramente a la entidad local.</div><div class=\"box legal\"><span class=\"lbl\">Precepto</span>art. 164.1 TRLHL</div></details><details class=\"panel\"><summary><b>2.</b> ¿Cuál es el principio que impide destinar recursos concretos a gastos concretos?</summary><div class=\"box ej\"><span class=\"lbl\">Respuesta</span><b>El principio de no afectación o desafectación de ingresos</b></div><div class=\"box interp\"><span class=\"lbl\">Por qué</span>El art. 165.2: los recursos de la entidad local y de sus organismos autónomos se destinan a <b>satisfacer el conjunto</b> de sus obligaciones, <b>salvo</b> que un ingreso se recaude con <b>fines determinados</b>. Es la regla general de caja única con excepción de la afectación expresa.</div><div class=\"box legal\"><span class=\"lbl\">Precepto</span>art. 165.2 TRLHL</div></details><details class=\"panel\"><summary><b>3.</b> El presupuesto de cada uno de los organismos que integran el general debe:</summary><div class=\"box ej\"><span class=\"lbl\">Respuesta</span><b>Aprobarse sin déficit inicial</b></div><div class=\"box interp\"><span class=\"lbl\">Por qué</span>El art. 165.4 exige que cada uno de los presupuestos que integran el general se apruebe <b>sin déficit inicial</b>. Es un requisito de equilibrio formal en el momento de la aprobación.</div><div class=\"box legal\"><span class=\"lbl\">Precepto</span>art. 165.4 TRLHL</div></details><details class=\"panel\"><summary><b>4.</b> Si al 31 de diciembre no se ha aprobado el presupuesto:</summary><div class=\"box ej\"><span class=\"lbl\">Respuesta</span><b>Se considera automáticamente prorrogado el del ejercicio anterior</b></div><div class=\"box interp\"><span class=\"lbl\">Por qué</span>El art. 169.6: se considerará <b>automáticamente prorrogados</b> los presupuestos del ejercicio anterior, con sus <b>créditos iniciales</b>, sin perjuicio de las modificaciones que se realicen conforme a los arts. 177 a 182 y hasta la entrada en vigor del nuevo. La prórroga <b>no afecta</b> a los créditos para servicios o programas que terminen en el ejercicio anterior.</div><div class=\"box legal\"><span class=\"lbl\">Precepto</span>art. 169.6 TRLHL</div></details><details class=\"panel\"><summary><b>5.</b> ¿Cuál es el importe a partir del cual un contrato de suministro está sujeto a regulación armonizada en entidades locales?</summary><div class=\"box ej\"><span class=\"lbl\">Respuesta</span><b>El fijado en el art. 22 de la Ley 9/2017</b></div><div class=\"box interp\"><span class=\"lbl\">Por qué</span>El art. 22 fija los umbrales SARA para suministros y servicios y remite a la actualización periódica por las directivas comunitarias. Conviene comprobar siempre la <b>última orden de actualización</b> de umbrales antes del examen.</div><div class=\"box legal\"><span class=\"lbl\">Precepto</span>art. 22 LCSP</div><div class=\"box warn\"><span class=\"lbl\">Atención</span><b>Verifica la vigencia.</b> Los umbrales SARA se actualizan cada dos años por reglamento delegado de la Comisión.</div></details><details class=\"panel\"><summary><b>6.</b> En el procedimiento abierto simplificado, ¿cuál es el plazo de presentación de proposiciones en contratos de suministros y servicios?</summary><div class=\"box ej\"><span class=\"lbl\">Respuesta</span><b>Quince días naturales desde la publicación del anuncio en el perfil de contratante</b></div><div class=\"box interp\"><span class=\"lbl\">Por qué</span>El art. 159.3.b): el plazo de presentación será, como <b>mínimo</b>, de <b>quince días</b> contados desde el siguiente a la publicación del anuncio de licitación en el perfil de contratante. En <b>obras</b> el mínimo es de <b>veinte días</b>.</div><div class=\"box legal\"><span class=\"lbl\">Precepto</span>art. 159.3.b) LCSP</div></details><details class=\"panel\"><summary><b>7.</b> ¿Qué es el remanente de tesorería?</summary><div class=\"box ej\"><span class=\"lbl\">Respuesta</span><b>Un recurso para la financiación de modificaciones de crédito</b></div><div class=\"box interp\"><span class=\"lbl\">Por qué</span>El remanente de tesorería integra los derechos pendientes de cobro, las obligaciones pendientes de pago y los fondos líquidos, y se configura como <b>recurso para financiar modificaciones de crédito</b> (arts. 177.4 y 193). No es un ingreso ordinario del ejercicio.</div><div class=\"box legal\"><span class=\"lbl\">Precepto</span>arts. 177.4 y 193 TRLHL</div></details><details class=\"panel\"><summary><b>8.</b> ¿Qué órgano ejerce la función de fiscalización interna en las entidades locales?</summary><div class=\"box ej\"><span class=\"lbl\">Respuesta</span><b>La Intervención</b></div><div class=\"box interp\"><span class=\"lbl\">Por qué</span>El art. 214.1: la función interventora fiscaliza <b>todos</b> los actos de la entidad local y de sus organismos autónomos que den lugar al <b>reconocimiento y liquidación de derechos y obligaciones</b>, a los <b>ingresos y pagos</b> y al movimiento de fondos y valores.</div><div class=\"box legal\"><span class=\"lbl\">Precepto</span>art. 214.1 TRLHL</div></details><details class=\"panel\"><summary><b>9.</b> La adjudicación de un contrato menor requiere:</summary><div class=\"box ej\"><span class=\"lbl\">Respuesta</span><b>Informe del órgano de contratación motivando la necesidad y la aprobación del gasto y la factura</b></div><div class=\"box interp\"><span class=\"lbl\">Por qué</span>El art. 118.1 y 118.2: se exige <b>informe del órgano de contratación</b> motivando la necesidad del contrato, la <b>aprobación del gasto</b> y la <b>incorporación de la factura</b>. En obras, además, presupuesto de las obras y, en su caso, proyecto y supervisión.</div><div class=\"box legal\"><span class=\"lbl\">Precepto</span>art. 118 LCSP</div></details><details class=\"panel\"><summary><b>10.</b> ¿Dónde deben publicarse trimestralmente los contratos menores?</summary><div class=\"box ej\"><span class=\"lbl\">Respuesta</span><b>En el perfil de contratante</b></div><div class=\"box interp\"><span class=\"lbl\">Por qué</span>El art. 63.4 obliga a publicar en el <b>perfil de contratante</b>, al menos <b>trimestralmente</b>, la información relativa a los contratos menores celebrados, con objeto, duración, importe de adjudicación —IVA incluido— e identidad del adjudicatario.</div><div class=\"box legal\"><span class=\"lbl\">Precepto</span>art. 63.4 LCSP</div></details></section><section class=\"card\" id=\"ex6\"><h2>Turno 9 h · SUPUESTO B · Registro, notificaciones y relación electrónica</h2><div class=\"box\"><span class=\"lbl\">Enunciado</span>Un ciudadano y una sociedad mercantil presentan escritos ante una entidad local. Se plantean cuestiones de registro, cómputo de plazos, notificación y obligación de relacionarse electrónicamente.</div><details class=\"panel\"><summary><b>1.</b> ¿Qué debe contener toda notificación?</summary><div class=\"box ej\"><span class=\"lbl\">Respuesta</span><b>El texto íntegro de la resolución, si pone fin o no a la vía administrativa, los recursos procedentes, el órgano ante el que presentarlos y el plazo</b></div><div class=\"box interp\"><span class=\"lbl\">Por qué</span>El art. 40.2 exige que toda notificación contenga el <b>texto íntegro</b> de la resolución, con indicación de <b>si pone fin o no a la vía administrativa</b>, la <b>expresión de los recursos</b> que procedan —en su caso, en vía administrativa y judicial—, el <b>órgano</b> ante el que hubieran de presentarse y el <b>plazo</b> para interponerlos.</div><div class=\"box legal\"><span class=\"lbl\">Precepto</span>art. 40.2 LPAC</div><div class=\"box warn\"><span class=\"lbl\">Atención</span><b>Discrepancia.</b> La marca del examen apunta a una opción incompleta. El art. 40.2 exige los cinco elementos.</div></details><details class=\"panel\"><summary><b>2.</b> ¿En qué plazo debe practicarse la notificación?</summary><div class=\"box ej\"><span class=\"lbl\">Respuesta</span><b>Dentro del plazo de diez días a partir de la fecha en que el acto haya sido dictado</b></div><div class=\"box interp\"><span class=\"lbl\">Por qué</span>El art. 40.2: toda notificación deberá ser cursada dentro del plazo de <b>diez días</b> a partir de la fecha en que el acto haya sido dictado. Es un plazo <b>impropio</b>: su incumplimiento no invalida la notificación, pero sí puede generar responsabilidad.</div><div class=\"box legal\"><span class=\"lbl\">Precepto</span>art. 40.2 LPAC</div></details><details class=\"panel\"><summary><b>3.</b> ¿Quiénes están obligados a relacionarse electrónicamente con las Administraciones?</summary><div class=\"box ej\"><span class=\"lbl\">Respuesta</span><b>Las personas jurídicas y las entidades sin personalidad jurídica, entre otros</b></div><div class=\"box interp\"><span class=\"lbl\">Por qué</span>El art. 14.2 enumera: <b>personas jurídicas</b>, <b>entidades sin personalidad jurídica</b>, quienes ejerzan una <b>actividad profesional con colegiación obligatoria</b> para los trámites propios de esa actividad, quienes <b>representen</b> a un obligado y los <b>empleados públicos</b> en los trámites que se determinen.</div><div class=\"box legal\"><span class=\"lbl\">Precepto</span>art. 14.2 LPAC</div></details><details class=\"panel\"><summary><b>4.</b> El registro electrónico de apoderamientos:</summary><div class=\"box ej\"><span class=\"lbl\">Respuesta</span><b>Debe existir en todas las Administraciones, incluidas las entidades locales</b></div><div class=\"box interp\"><span class=\"lbl\">Por qué</span>El art. 6.1: la Administración General del Estado, las Comunidades Autónomas y las <b>Entidades Locales</b> dispondrán de un <b>registro electrónico general de apoderamientos</b> en el que deberán inscribirse, al menos, los de carácter general otorgados apud acta.</div><div class=\"box legal\"><span class=\"lbl\">Precepto</span>art. 6.1 LPAC</div></details><details class=\"panel\"><summary><b>5.</b> En el registro electrónico, ¿qué fecha y hora rigen?</summary><div class=\"box ej\"><span class=\"lbl\">Respuesta</span><b>La fecha y hora oficial de la sede electrónica de acceso</b></div><div class=\"box interp\"><span class=\"lbl\">Por qué</span>El art. 31.2: cada Administración determinará los <b>días considerados inhábiles</b>, y el registro electrónico se regirá <b>a efectos de cómputo</b> por la <b>fecha y hora oficial de la sede electrónica de acceso</b>, que deberá contar con las medidas de seguridad necesarias.</div><div class=\"box legal\"><span class=\"lbl\">Precepto</span>art. 31.2 LPAC</div></details><details class=\"panel\"><summary><b>6.</b> Un plazo señalado en meses que vence en un día inexistente en el mes de vencimiento:</summary><div class=\"box ej\"><span class=\"lbl\">Respuesta</span><b>Se entiende que el plazo expira el último día del mes</b></div><div class=\"box interp\"><span class=\"lbl\">Por qué</span>El art. 30.5: si en el mes de vencimiento no hubiera día equivalente a aquel en que comienza el cómputo, se entenderá que el plazo <b>expira el último día del mes</b>. Ejemplo: un plazo de un mes iniciado el 31 de enero vence el 28 —o 29— de febrero.</div><div class=\"box legal\"><span class=\"lbl\">Precepto</span>art. 30.5 LPAC</div></details><details class=\"panel\"><summary><b>7.</b> Si el último día del plazo es inhábil:</summary><div class=\"box ej\"><span class=\"lbl\">Respuesta</span><b>Se entiende prorrogado al primer día hábil siguiente</b></div><div class=\"box interp\"><span class=\"lbl\">Por qué</span>El art. 30.5 in fine: cuando el último día del plazo sea inhábil, se entenderá <b>prorrogado al primer día hábil siguiente</b>. Y recuerda el art. 30.2: en los plazos por días se excluyen del cómputo los <b>sábados, domingos y festivos</b> salvo que se declaren días naturales.</div><div class=\"box legal\"><span class=\"lbl\">Precepto</span>art. 30.2 y 30.5 LPAC</div></details><details class=\"panel\"><summary><b>8.</b> La notificación practicada por medios electrónicos se entenderá rechazada cuando:</summary><div class=\"box ej\"><span class=\"lbl\">Respuesta</span><b>Hayan transcurrido diez días naturales desde la puesta a disposición sin acceder a su contenido</b></div><div class=\"box interp\"><span class=\"lbl\">Por qué</span>El art. 43.2: se entenderá <b>rechazada</b> cuando hayan transcurrido <b>diez días naturales</b> desde la puesta a disposición de la notificación <b>sin que se acceda</b> a su contenido. Y se entiende <b>practicada</b> en el momento en que se produce el acceso (art. 43.2 primer inciso).</div><div class=\"box legal\"><span class=\"lbl\">Precepto</span>art. 43.2 LPAC</div><div class=\"box warn\"><span class=\"lbl\">Atención</span>Diez días <b>naturales</b>, no hábiles. Contrasta con los diez días del art. 40.2, que son hábiles.</div></details><details class=\"panel\"><summary><b>9.</b> Si la solicitud no reúne los requisitos exigidos:</summary><div class=\"box ej\"><span class=\"lbl\">Respuesta</span><b>Se requerirá al interesado para que en un plazo de diez días subsane, con indicación de que si no lo hace se le tendrá por desistido</b></div><div class=\"box interp\"><span class=\"lbl\">Por qué</span>El art. 68.1: se requerirá al interesado para que, en un plazo de <b>diez días</b>, subsane la falta o acompañe los documentos preceptivos, con indicación de que, si así no lo hiciera, se le tendrá por <b>desistido</b> de su petición, previa resolución del art. 21.</div><div class=\"box legal\"><span class=\"lbl\">Precepto</span>art. 68.1 LPAC</div></details><details class=\"panel\"><summary><b>10.</b> En procedimientos iniciados a solicitud del interesado, el vencimiento del plazo máximo sin notificar resolución:</summary><div class=\"box ej\"><span class=\"lbl\">Respuesta</span><b>Legitima al interesado para entenderla estimada por silencio administrativo, salvo excepciones</b></div><div class=\"box interp\"><span class=\"lbl\">Por qué</span>El art. 24.1: el vencimiento del plazo máximo sin haberse notificado resolución expresa legitima al interesado para entenderla <b>estimada</b> por silencio. Las <b>excepciones</b>: norma con rango de ley o de Derecho de la Unión que establezca lo contrario, procedimientos de <b>derecho de petición</b>, los que impliquen <b>facultades sobre el dominio o servicio público</b>, los de <b>impugnación de actos</b> y los de <b>responsabilidad patrimonial</b>.</div><div class=\"box legal\"><span class=\"lbl\">Precepto</span>art. 24.1 LPAC</div></details></section>\n<section class=\"card\" id=\"pendiente\"><h2>Lo que estos exámenes exigen y todavía no tienes</h2>\n<p class=\"small\">Honestidad primero: de las 60 preguntas, <b>11</b> caen fuera de los temas construidos hasta ahora. Estas son, con lo que hay que estudiar para cerrarlas.</p>\n<table class=\"t\"><thead><tr><th>Materia</th><th>Preguntas afectadas</th><th>Qué falta</th></tr></thead><tbody>\n<tr><td><b>Tema 1</b> · Órganos de gobierno locales</td><td>Turno 17 h · B10</td><td>Mayorías del Pleno: simple, absoluta y de dos tercios. Quórum de constitución. Arts. 46 y 47 LBRL.</td></tr>\n<tr><td><b>Temas 4 a 7</b> · Funcionamiento electrónico</td><td>Turno 9 h · B1 a B10</td><td>LPAC arts. 5, 6, 9, 10, 13, 14, 16, 26, 27, 31, 40 a 44 y 68. Registro, apoderamientos, identificación, firma, copias auténticas y notificaciones electrónicas.</td></tr>\n<tr><td><b>Umbrales SARA</b></td><td>Turno 9 h · A5</td><td>Cifras vigentes de los arts. 20, 21 y 22 LCSP, actualizadas por el último reglamento delegado.</td></tr>\n</tbody></table>\n<div class=\"box ej\"><span class=\"lbl\">Orden recomendado</span>Primero los <b>temas 4 a 7</b>: son diez preguntas de un solo examen y se responden con media docena de artículos muy memorizables. Después el <b>tema 1</b>, que es una pregunta pero de las que no se fallan nunca. Los umbrales SARA, el día antes.</div>\n</section>\n\n<section class=\"card\" id=\"mapa\"><h2>Mapa de retorno: si fallas esta pregunta, vuelve a esta página</h2>\n<table class=\"t\"><thead><tr><th>Materia de la pregunta</th><th>Página del proyecto a la que volver</th></tr></thead><tbody>\n<tr><td>Expediente de contratación, valor estimado, contrato menor, formalización</td><td><a href=\"LCSP_ampliacion_expediente.html\">LCSP · Ampliación: del expediente a la formalización</a></td></tr>\n<tr><td>Ámbito de la LCSP, entidades del sector público, contratos excluidos</td><td><a href=\"LCSP_01-11_ambito.html\">LCSP · Arts. 1 a 11</a> · <a href=\"TEMA_9_flujo_y_casos.html\">Tema 9 · Visión de conjunto</a></td></tr>\n<tr><td>Tipos de contrato, régimen jurídico, jurisdicción competente</td><td><a href=\"LCSP_12-27_contratos.html\">LCSP · Arts. 12 a 27</a> · <a href=\"TEMA_10_flujo_y_casos.html\">Tema 10 · Visión de conjunto</a></td></tr>\n<tr><td>Fases del gasto, documentos contables, clasificación económica</td><td><a href=\"TRLHL_ampliacion_contable.html\">TRLHL · Ampliación contable</a></td></tr>\n<tr><td>Presupuesto general: formación, aprobación, prórroga, modificaciones</td><td><a href=\"TEMA_8_flujo_y_casos.html\">Tema 8 · Visión de conjunto</a></td></tr>\n<tr><td>Subvenciones: plan estratégico, bases, beneficiarios, BDNS</td><td><a href=\"LGS_ampliacion.html\">LGS · Ampliación</a> · <a href=\"LGS_01-21_ambito.html\">LGS · Arts. 1 a 21</a> · <a href=\"LGS_22-35_procedimiento.html\">LGS · Arts. 22 a 35</a></td></tr>\n<tr><td>Acto administrativo, invalidez y recursos</td><td><a href=\"LPAC_34-46_acto_administrativo.html\">LPAC · Arts. 34 a 46</a> · <a href=\"LPAC_112-126_recursos.html\">LPAC · Recursos</a></td></tr>\n<tr><td>Plazos, solicitud, subsanación, silencio</td><td><a href=\"LPAC_66-74_solicitud_ordenacion.html\">LPAC · Arts. 66 a 74</a> · <a href=\"LPAC_84-96_finalizacion.html\">LPAC · Arts. 84 a 96</a></td></tr>\n</tbody></table>\n</section>\n\n<section class=\"card\" id=\"discrepancias\"><h2>Las cinco preguntas en que discrepo de la marca del examen</h2>\n<p class=\"small\">No las escondo. En estas cinco, la letra de la norma de la biblioteca dice una cosa y la marca de la hoja dice otra. Contrástalas con la plantilla oficial si la tienes; si no, quédate con el criterio de la ley y sabe que la pregunta era discutible.</p>\n<table class=\"t\"><thead><tr><th>Examen</th><th>Pregunta</th><th>Lo que dice la norma</th></tr></thead><tbody>\n<tr><td>17 h · B7</td><td>Qué NO es anexo del presupuesto</td><td>La <b>liquidación del ejercicio anterior</b> no está en el art. 166.1: es documentación del art. 168.1.b).</td></tr>\n<tr><td>17 h · B8</td><td>Créditos para gastos corrientes</td><td>Las <b>inversiones reales</b> son capítulo 6, gasto de capital. No pueden ser gasto corriente.</td></tr>\n<tr><td>17 h · B9</td><td>Créditos para gastos de capital</td><td>Los <b>gastos de personal</b> son capítulo 1, corriente. No pueden ser gasto de capital.</td></tr>\n<tr><td>12 h · A5</td><td>Justificación de la no división en lotes</td><td>Está expresamente en la <b>letra g) del art. 116.4</b> LCSP.</td></tr>\n<tr><td>12 h · A9</td><td>Plazo de espera antes de formalizar</td><td><b>Quince días hábiles</b>, art. 153.3 LCSP. No diez.</td></tr>\n</tbody></table>\n<div class=\"box exc\"><span class=\"lbl\">Qué hacer con esto en el examen</span>Si te encuentras una de estas, marca <b>la que dice la ley</b> y, si el examen admite alegaciones, alégala con el artículo en la mano. Es exactamente así como se recuperan puntos.</div>\n</section>\n\n<section class=\"card\" id=\"conexiones\"><h2>Diez preguntas de conexión</h2>\n<p class=\"small\">Responde en voz alta <b>antes</b> de desplegar. No preguntan por un artículo suelto: preguntan por la cifra, la unidad y el órgano aplicados a un caso, que es exactamente lo que hace el examen.</p>\n<div id=\"qbox\"></div></section>\n\n<section class=\"card\" id=\"sem\"><h2>Semáforo: qué dominas y qué no</h2>\n<p class=\"small\">Marca cada destreza. Lo que quede en rojo es tu plan de estudio de esta semana.</p>\n<div id=\"sembox\"></div><div id=\"semres\" style=\"margin-top:.8rem\"></div></section>\n";

<script>

/* ═══ Mejoras de interacción · Bloque II ═══ */
(function(){
"use strict";
var K_THEME="oposi_bII_theme", K_FS="oposi_bII_fs", K_STREAK="oposi_bII_streak";
function load(k,f){try{var v=localStorage.getItem(k);return v?JSON.parse(v):f;}catch(e){return f;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
var root=document.documentElement;

/* Tema persistente (sobrescribe el toggle simple anterior) */
var saved=load(K_THEME,null);
if(saved){root.setAttribute("data-theme",saved);}
else if(window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches){root.setAttribute("data-theme","dark");}
var bt=document.getElementById("theme");
if(bt)bt.onclick=function(){
  var n=root.getAttribute("data-theme")==="dark"?"light":"dark";
  root.setAttribute("data-theme",n);save(K_THEME,n);
};

/* Tamaño de texto persistente */
var fs=load(K_FS,16);
function setFs(v){fs=Math.max(13,Math.min(22,v));root.style.setProperty("--fs",fs+"px");save(K_FS,fs);}
setFs(fs);
var bp=document.getElementById("fs+"),bm=document.getElementById("fs-");
if(bp)bp.onclick=function(){setFs(fs+1);};
if(bm)bm.onclick=function(){setFs(fs-1);};

/* Racha compartida con el índice */
(function(){
  var el=document.getElementById("streakN");if(!el)return;
  var hoy=new Date().toISOString().slice(0,10);
  var s=load(K_STREAK,{last:null,n:0});
  if(s.last!==hoy){
    var ayer=new Date(Date.now()-864e5).toISOString().slice(0,10);
    s.n=(s.last===ayer)?s.n+1:1;s.last=hoy;save(K_STREAK,s);
  }
  el.textContent=s.n;
})();

/* Reveal on scroll para las tarjetas */
function reveal(){
  var els=document.querySelectorAll("section.card:not(.rv)");
  if(!els.length)return;
  if(!("IntersectionObserver" in window)){return;}
  var io=new IntersectionObserver(function(es){
    es.forEach(function(en){if(en.isIntersecting){en.target.classList.add("in");io.unobserve(en.target);}});
  },{threshold:.06,rootMargin:"0px 0px -30px 0px"});
  Array.prototype.forEach.call(els,function(el){el.classList.add("rv");io.observe(el);});
}

/* Sección activa en el índice lateral */
function spy(){
  var links=document.querySelectorAll("nav.side a[href^='#']");
  if(!links.length||!("IntersectionObserver" in window))return;
  var map={};
  Array.prototype.forEach.call(links,function(a){
    var t=document.getElementById(a.getAttribute("href").slice(1));
    if(t)map[t.id]=a;
  });
  var io=new IntersectionObserver(function(es){
    es.forEach(function(en){
      if(en.isIntersecting){
        Array.prototype.forEach.call(links,function(a){a.classList.remove("on");});
        if(map[en.target.id])map[en.target.id].classList.add("on");
      }
    });
  },{rootMargin:"-80px 0px -70% 0px",threshold:0});
  Object.keys(map).forEach(function(id){io.observe(document.getElementById(id));});
}

/* Ripple en botones */
document.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b||b.classList.contains("navtoggle"))return;
  var r=b.getBoundingClientRect(),d=Math.max(r.width,r.height),s=document.createElement("span");
  s.className="ripple";s.style.width=s.style.height=d+"px";
  s.style.left=(e.clientX-r.left-d/2)+"px";s.style.top=(e.clientY-r.top-d/2)+"px";
  b.appendChild(s);setTimeout(function(){if(s.parentNode)s.parentNode.removeChild(s);},560);
});

/* Atajos de teclado */
document.addEventListener("keydown",function(e){
  if(e.target.matches("input,textarea"))return;
  if(e.key==="/"){var q=document.getElementById("q");if(q){e.preventDefault();q.focus();}}
  if(e.key==="t"&&bt)bt.click();
});

/* El contenido se inyecta por JS: esperamos a que exista */
function init(){reveal();spy();}
if(document.getElementById("main")&&document.getElementById("main").children.length){init();}
else{setTimeout(init,60);}
addEventListener("load",function(){setTimeout(init,80);});
})();


</script>
<script>


/* ═══ Parser de respuestas: estructura semántica ═══ */
var FCFMT=(function(){
  var CITA=/\s*\(((?:arts?\.|DA\b|DT\b|disp\.)[^)]*)\)\s*\.?\s*$/i;
  var strip=function(h){return h.replace(/<[^>]+>/g,"");};

  function esc(s){return s;}

  function parse(raw){
    var out={verdict:null,cite:null,kind:"p",items:[],text:""};
    var body=String(raw).trim();

    /* 1 ── Cita legal al final */
    var m=body.match(CITA);
    if(m){out.cite=m[1].replace(/\s+/g," ").trim();body=body.slice(0,m.index).trim();}
    body=body.replace(/[.;,\s]+$/,"");

    /* 2 ── Veredicto Sí / No inicial */
    var v=strip(body).match(/^(Sí|Sí,|No|No,)[.:,]?\s/);
    if(v){
      out.verdict=/^Sí/.test(v[1])?"si":"no";
      body=body.replace(/^(<[^>]+>\s*)*(Sí|No)[.,:]?\s*/,"").trim();
      body=body.replace(/^en\s/,"En ");
    }

    /* 3 ── Enumeración con · */
    var parts=body.split(/\s+·\s+/);
    if(parts.length>=2){
      out.kind="list";
      var letras=parts.filter(function(p){return /^\s*<?[a-h]\)/.test(strip(p));}).length;
      out.marker = letras>=parts.length-1 ? "alpha" : "num";
      out.items=parts.map(function(p){
        return p.replace(/^\s*[a-h]\)\s*/,"").replace(/[.\s]+$/,"").trim();
      }).filter(Boolean);
      return out;
    }

    /* 4 ── Cláusulas contrapuestas con ; */
    var semi=body.split(/;\s+/);
    if(semi.length>=2&&semi.length<=3&&semi.every(function(s){return strip(s).length>14;})){
      out.kind="clauses";
      out.items=semi.map(function(s){return s.replace(/[.\s]+$/,"").trim();});
      return out;
    }

    /* 5 ── Párrafo */
    out.text=body;
    return out;
  }

  function render(raw){
    var d=parse(raw),h="";

    if(d.verdict){
      h+='<span class="fc-verdict '+d.verdict+'">'+(d.verdict==="si"?"✓ Sí":"✗ No")+'</span>';
    }

    if(d.kind==="list"){
      h+='<ol class="fc-list '+d.marker+'">';
      d.items.forEach(function(it){h+='<li>'+it+'</li>';});
      h+='</ol>';
    }else if(d.kind==="clauses"){
      h+='<div class="fc-clauses">';
      d.items.forEach(function(it){h+='<p>'+it+'</p>';});
      h+='</div>';
    }else if(d.text){
      h+='<p class="fc-p">'+d.text+'</p>';
    }

    if(d.cite){
      h+='<span class="fc-cite"><span class="s">§</span>'+d.cite+'</span>';
    }
    return {html:h,struct:(d.kind!=="p"||!!d.verdict||strip(raw).length>150)};
  }
  return {parse:parse,render:render};
})();

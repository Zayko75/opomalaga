ículo 110.</p><p>1. Será aplicable a la redacción de las actas lo dispuesto en el artículo 86.1, en cuanto a la utilización de las lenguas.</p><p>2. El acta, una vez aprobada por el Pleno, se transcribirá en el Libro de Actas, autorizándola con las firmas del Alcalde o Presidente y del Secretario.</p></div></div></details><details class=\"panel\"><summary>Disección</summary><div class=\"body\"><ul>\n<li><b>Lenguas (110.1):</b> se aplica lo dispuesto en el art. 86.1 en cuanto a su utilización.</li>\n<li><b>Transcripción (110.2):</b> «El acta, <b>una vez aprobada por el Pleno</b>, se transcribirá en el <b>Libro de Actas</b>, autorizándola con las <b>firmas del Alcalde o Presidente y del Secretario</b>».</li>\n</ul></div></details><details class=\"panel\"><summary>En lenguaje llano</summary><div class=\"body\"><p>Primero se aprueba, después se pasa al Libro, y la autorizan dos firmas: la del Alcalde y la del Secretario.</p></div></details><details class=\"panel\"><summary>¿Por qué existe?</summary><div class=\"body\"><div class=\"interp\"><span class=\"lbl\">Interpretación · aportación externa</span>Las dos firmas reparten la garantía: el Presidente responde de que eso es lo que ocurrió en la sesión que dirigió, y el Secretario, de la fe pública de su contenido.</div></div></details><details class=\"panel\"><summary>Ejemplos</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Ejemplo 1</span>Acta aprobada en la sesión de noviembre: se transcribe al Libro con ambas firmas.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 2</span>El Libro de Actas lo custodia el Secretario en la Casa Consistorial, sin que pueda salir de ella (art. 203).</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 3</span>Caso límite: se expide certificación de un acuerdo antes de aprobarse el acta. Cabe, con la salvedad del art. 206.</div></div></details><details class=\"panel\"><summary>Trampas</summary><div class=\"body\"><div class=\"box warn\"><span class=\"lbl\">Cuidado</span>El orden es <b>aprobación primero, transcripción después</b>. Y son <b>dos</b> firmas, no solo la del Secretario.</div></div></details><details class=\"panel\"><summary>Conexiones</summary><div class=\"body\"><p>Con el art. 91.1 —aprobación—, el art. 203 —custodia— y los arts. 204 a 206 —certificaciones—.</p></div></details><details class=\"panel\"><summary>Anclaje memorístico</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Para retenerlo</span>Libro de Actas: <b>aprobada, transcrita y con dos firmas</b>.</div></div></details></section><section class=\"card art\" id=\"rof204\"><h2><span class=\"num\">ROF 204</span> Expedición de certificaciones</h2><p class=\"ubic\">RD 2568/1986 ▸ Título VI ▸ Capítulo II «De las certificaciones»</p><div class=\"idea\">Las certificaciones las expide siempre el Secretario.</div><svg viewBox=\"0 0 980 252\" width=\"100%\" role=\"img\" aria-label=\"Recorrido desde la adopción del acuerdo hasta la certificación que se incorpora al expediente\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"t1efrr3\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#4b5563\"/></marker><marker id=\"t1efer3\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#15803d\"/></marker><marker id=\"t1efwr3\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#b45309\"/></marker></defs><text x=\"490\" y=\"24\" font-size=\"13\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"bold\">Del acuerdo al expediente: el recorrido del documento</text><rect x=\"20\" y=\"46\" width=\"164\" height=\"80\" rx=\"8\" fill=\"#e8efff\" stroke=\"#1d4ed8\" stroke-width=\"1.4\"/><text x=\"102\" y=\"75.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#1d4ed8\" font-weight=\"bold\">1 · SESIÓN</text><text x=\"102\" y=\"89.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Se adopta</text><text x=\"102\" y=\"103.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">el acuerdo</text><rect x=\"214\" y=\"46\" width=\"164\" height=\"80\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"296\" y=\"68.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#4b5563\" font-weight=\"bold\">2 · ACTA</text><text x=\"296\" y=\"82.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">La extiende</text><text x=\"296\" y=\"96.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">el SECRETARIO</text><text x=\"296\" y=\"110.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">art. 109 ROF</text><rect x=\"408\" y=\"46\" width=\"164\" height=\"80\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"490\" y=\"68.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#4b5563\" font-weight=\"bold\">3 · APROBACIÓN</text><text x=\"490\" y=\"82.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">por el Pleno</text><text x=\"490\" y=\"96.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">en la sesión</text><text x=\"490\" y=\"110.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">siguiente</text><rect x=\"602\" y=\"46\" width=\"164\" height=\"80\" rx=\"8\" fill=\"#eaf6ee\" stroke=\"#15803d\" stroke-width=\"1.4\"/><text x=\"684\" y=\"68.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#15803d\" font-weight=\"bold\">4 · LIBRO DE ACTAS</text><text x=\"684\" y=\"82.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Se transcribe, con</text><text x=\"684\" y=\"96.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">firmas del Alcalde</text><text x=\"684\" y=\"110.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">y del Secretario</text><rect x=\"796\" y=\"46\" width=\"164\" height=\"80\" rx=\"8\" fill=\"#fdeceb\" stroke=\"#b91c1c\" stroke-width=\"1.4\"/><text x=\"878\" y=\"68.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#b91c1c\" font-weight=\"bold\">5 · CERTIFICACIÓN</text><text x=\"878\" y=\"82.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">La expide el Secretario</text><text x=\"878\" y=\"96.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">con el V.º B.º</text><text x=\"878\" y=\"110.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">del Presidente</text><line x1=\"187\" y1=\"86\" x2=\"209\" y2=\"86\" stroke=\"#4b5563\" stroke-width=\"1.6\" marker-end=\"url(#t1efrr3)\"/><line x1=\"381\" y1=\"86\" x2=\"403\" y2=\"86\" stroke=\"#4b5563\" stroke-width=\"1.6\" marker-end=\"url(#t1efrr3)\"/><line x1=\"575\" y1=\"86\" x2=\"597\" y2=\"86\" stroke=\"#4b5563\" stroke-width=\"1.6\" marker-end=\"url(#t1efrr3)\"/><line x1=\"769\" y1=\"86\" x2=\"791\" y2=\"86\" stroke=\"#4b5563\" stroke-width=\"1.6\" marker-end=\"url(#t1efrr3)\"/><rect x=\"20\" y=\"140\" width=\"940\" height=\"44\" rx=\"8\" fill=\"#fdf3e3\" stroke=\"#b45309\" stroke-width=\"1.4\"/><text x=\"490\" y=\"158.07\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"bold\">ATAJO DEL ART. 206 ROF: pueden expedirse certificaciones ANTES de aprobarse el acta, siempre que se haga</text><text x=\"490\" y=\"173.07\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">LA ADVERTENCIA O SALVEDAD y a reserva de los términos que resulten de la aprobación</text><text x=\"490\" y=\"208\" font-size=\"10.6\" text-anchor=\"middle\" fill=\"#b91c1c\" font-weight=\"bold\">La certificación del acuerdo es el documento que se incorpora al expediente de gasto: sin ella, la aprobación no se acredita.</text><text x=\"490\" y=\"234\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#4b5563\" font-weight=\"normal\">Al aprobar el acta solo cabe subsanar errores materiales o de hecho: NUNCA modificar el fondo de los acuerdos.</text></svg><details class=\"panel\" open><summary>Texto legal</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · ROF</span><p>Artículo 204. Las certificaciones de todos los actos, resoluciones y acuerdos de los órganos de gobierno de la entidad, así como las copias y certificados de los libros y documentos que en las distintas dependencias existan, se expedirán siempre por el Secretario, salvo precepto expreso que disponga otra cosa.</p></div></div></details><details class=\"panel\"><summary>Disección</summary><div class=\"body\"><ul>\n<li><b>Regla:</b> las certificaciones de <b>todos los actos, resoluciones y acuerdos</b> de los órganos de gobierno de la entidad, <b>así como las copias y certificados de los libros y documentos</b> de las distintas dependencias, <b>se expedirán siempre por el Secretario</b>.</li>\n<li><b>La excepción:</b> «<b>salvo precepto expreso que disponga otra cosa</b>».</li>\n</ul></div></details><details class=\"panel\"><summary>En lenguaje llano</summary><div class=\"body\"><p>El Secretario es quien certifica. Esa es la pieza que convierte un acuerdo en un documento que puede incorporarse a un expediente o presentarse ante otra Administración.</p></div></details><details class=\"panel\"><summary>¿Por qué existe?</summary><div class=\"body\"><div class=\"interp\"><span class=\"lbl\">Interpretación · aportación externa</span>La fe pública administrativa se concentra en un funcionario con habilitación nacional precisamente para que su independencia respalde el contenido de lo certificado frente al órgano que adoptó el acuerdo.</div></div></details><details class=\"panel\"><summary>Ejemplos</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Ejemplo 1</span>Certificación del acuerdo plenario que aprueba el presupuesto, para unirla al expediente.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 2</span>Certificado de un asiento del Libro de Actas solicitado por un interesado.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 3</span>Caso límite: «salvo precepto expreso». Hay certificaciones que una norma específica atribuye a otro órgano; fuera de esos casos, el Secretario.</div></div></details><details class=\"panel\"><summary>Trampas</summary><div class=\"body\"><div class=\"box warn\"><span class=\"lbl\">Cuidado</span>El adverbio es <b>«siempre»</b>, y la excepción exige <b>precepto expreso</b>, no una práctica interna.</div></div></details><details class=\"panel\"><summary>Conexiones</summary><div class=\"body\"><p>Con el art. 205 —visto bueno— y el art. 206 —antes de aprobar el acta—.</p></div></details><details class=\"panel\"><summary>Anclaje memorístico</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Para retenerlo</span>Certifica <b>siempre el Secretario</b>.</div></div></details></section><section class=\"card art\" id=\"rof205\"><h2><span class=\"num\">ROF 205</span> El visto bueno del Presidente</h2><p class=\"ubic\">RD 2568/1986 ▸ Título VI ▸ Capítulo II</p><div class=\"idea\">El visto bueno acredita que quien firma está en el cargo y que su firma es auténtica.</div><details class=\"panel\" open><summary>Texto legal</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · ROF</span><p>Artículo 205. Las certificaciones se expedirán por orden del Presidente de la Corporación y con su \"visto bueno\", para significar que el Secretario o funcionario que las expide y autoriza está en el ejercicio del cargo y que su firma es auténtica. Irán rubricadas al margen por el Jefe de la Unidad al que corresponda, llevarán el sello de la Corporación y se reintegrarán, en su caso, con arreglo a la respectiva Ordenanza de exacción, si existiere.</p></div></div></details><details class=\"panel\"><summary>Disección</summary><div class=\"body\"><ul>\n<li><b>Regla:</b> las certificaciones se expiden <b>por orden del Presidente de la Corporación y con su «visto bueno»</b>.</li>\n<li><b>Para qué sirve exactamente:</b> «para significar que el Secretario o funcionario que las expide y autoriza <b>está en el ejercicio del cargo</b> y que <b>su firma es auténtica</b>».</li>\n<li><b>Formalidades:</b> irán <b>rubricadas al margen</b> por el Jefe de la Unidad correspondiente, llevarán el <b>sello</b> de la Corporación y se reintegrarán conforme a la ordenanza de exacción si existiere.</li>\n</ul></div></details><details class=\"panel\"><summary>En lenguaje llano</summary><div class=\"body\"><p>El visto bueno del Alcalde no dice que el contenido sea cierto —de eso responde el Secretario—, sino que quien firma es quien dice ser y está en su puesto.</p></div></details><details class=\"panel\"><summary>¿Por qué existe?</summary><div class=\"body\"><div class=\"interp\"><span class=\"lbl\">Interpretación · aportación externa</span>Separar ambas garantías evita que el Presidente pueda condicionar lo que se certifica: él avala la identidad del certificante, no el contenido del acuerdo.</div></div></details><details class=\"panel\"><summary>Ejemplos</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Ejemplo 1</span>Certificación del acuerdo de adjudicación con el visto bueno del Presidente de la Diputación.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 2</span>Certificación rubricada al margen por el jefe de la unidad y con el sello de la Corporación.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 3</span>Caso límite: alguien entiende que el visto bueno valida el fondo del acuerdo. No: el precepto acota su alcance de forma expresa.</div></div></details><details class=\"panel\"><summary>Trampas</summary><div class=\"body\"><div class=\"box warn\"><span class=\"lbl\">Cuidado</span>Es la pregunta más fina del bloque de certificaciones. El visto bueno acredita <b>el ejercicio del cargo y la autenticidad de la firma</b>, nada más.</div></div></details><details class=\"panel\"><summary>Conexiones</summary><div class=\"body\"><p>Con el art. 204 —quién certifica— y el art. 206 —certificar antes de aprobar el acta—.</p></div></details><details class=\"panel\"><summary>Anclaje memorístico</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Para retenerlo</span>V.º B.º = <b>está en el cargo y la firma es suya</b>. El contenido lo responde el Secretario.</div></div></details></section><section class=\"card art\" id=\"rof206\"><h2><span class=\"num\">ROF 206</span> Certificaciones antes de aprobarse el acta</h2><p class=\"ubic\">RD 2568/1986 ▸ Título VI ▸ Capítulo II</p><div class=\"idea\">Se puede certificar un acuerdo antes de aprobar el acta, con advertencia expresa.</div><svg viewBox=\"0 0 980 252\" width=\"100%\" role=\"img\" aria-label=\"Recorrido desde la adopción del acuerdo hasta la certificación que se incorpora al expediente\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"t1efrr4\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#4b5563\"/></marker><marker id=\"t1efer4\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#15803d\"/></marker><marker id=\"t1efwr4\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#b45309\"/></marker></defs><text x=\"490\" y=\"24\" font-size=\"13\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"bold\">Del acuerdo al expediente: el recorrido del documento</text><rect x=\"20\" y=\"46\" width=\"164\" height=\"80\" rx=\"8\" fill=\"#e8efff\" stroke=\"#1d4ed8\" stroke-width=\"1.4\"/><text x=\"102\" y=\"75.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#1d4ed8\" font-weight=\"bold\">1 · SESIÓN</text><text x=\"102\" y=\"89.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Se adopta</text><text x=\"102\" y=\"103.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">el acuerdo</text><rect x=\"214\" y=\"46\" width=\"164\" height=\"80\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"296\" y=\"68.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#4b5563\" font-weight=\"bold\">2 · ACTA</text><text x=\"296\" y=\"82.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">La extiende</text><text x=\"296\" y=\"96.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">el SECRETARIO</text><text x=\"296\" y=\"110.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">art. 109 ROF</text><rect x=\"408\" y=\"46\" width=\"164\" height=\"80\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"490\" y=\"68.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#4b5563\" font-weight=\"bold\">3 · APROBACIÓN</text><text x=\"490\" y=\"82.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">por el Pleno</text><text x=\"490\" y=\"96.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">en la sesión</text><text x=\"490\" y=\"110.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">siguiente</text><rect x=\"602\" y=\"46\" width=\"164\" height=\"80\" rx=\"8\" fill=\"#eaf6ee\" stroke=\"#15803d\" stroke-width=\"1.4\"/><text x=\"684\" y=\"68.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#15803d\" font-weight=\"bold\">4 · LIBRO DE ACTAS</text><text x=\"684\" y=\"82.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Se transcribe, con</text><text x=\"684\" y=\"96.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">firmas del Alcalde</text><text x=\"684\" y=\"110.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">y del Secretario</text><rect x=\"796\" y=\"46\" width=\"164\" height=\"80\" rx=\"8\" fill=\"#fdeceb\" stroke=\"#b91c1c\" stroke-width=\"1.4\"/><text x=\"878\" y=\"68.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#b91c1c\" font-weight=\"bold\">5 · CERTIFICACIÓN</text><text x=\"878\" y=\"82.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">La expide el Secretario</text><text x=\"878\" y=\"96.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">con el V.º B.º</text><text x=\"878\" y=\"110.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">del Presidente</text><line x1=\"187\" y1=\"86\" x2=\"209\" y2=\"86\" stroke=\"#4b5563\" stroke-width=\"1.6\" marker-end=\"url(#t1efrr4)\"/><line x1=\"381\" y1=\"86\" x2=\"403\" y2=\"86\" stroke=\"#4b5563\" stroke-width=\"1.6\" marker-end=\"url(#t1efrr4)\"/><line x1=\"575\" y1=\"86\" x2=\"597\" y2=\"86\" stroke=\"#4b5563\" stroke-width=\"1.6\" marker-end=\"url(#t1efrr4)\"/><line x1=\"769\" y1=\"86\" x2=\"791\" y2=\"86\" stroke=\"#4b5563\" stroke-width=\"1.6\" marker-end=\"url(#t1efrr4)\"/><rect x=\"20\" y=\"140\" width=\"940\" height=\"44\" rx=\"8\" fill=\"#fdf3e3\" stroke=\"#b45309\" stroke-width=\"1.4\"/><text x=\"490\" y=\"158.07\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"bold\">ATAJO DEL ART. 206 ROF: pueden expedirse certificaciones ANTES de aprobarse el acta, siempre que se haga</text><text x=\"490\" y=\"173.07\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">LA ADVERTENCIA O SALVEDAD y a reserva de los términos que resulten de la aprobación</text><text x=\"490\" y=\"208\" font-size=\"10.6\" text-anchor=\"middle\" fill=\"#b91c1c\" font-weight=\"bold\">La certificación del acuerdo es el documento que se incorpora al expediente de gasto: sin ella, la aprobación no se acredita.</text><text x=\"490\" y=\"234\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#4b5563\" font-weight=\"normal\">Al aprobar el acta solo cabe subsanar errores materiales o de hecho: NUNCA modificar el fondo de los acuerdos.</text></svg><details class=\"panel\" open><summary>Texto legal</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · ROF</span><p>Artículo 206. Podrán expedirse certificaciones de las resoluciones y acuerdos de los órganos de gobierno y administración de las entidades locales, antes de ser aprobadas las actas que los contengan, siempre que se haga la advertencia o salvedad en este sentido y a reserva de los términos que resulten de la aprobación del acta correspondiente.</p></div></div></details><details class=\"panel\"><summary>Disección</summary><div class=\"body\"><ul>\n<li><b>Regla:</b> «Podrán expedirse certificaciones de las resoluciones y acuerdos <b>antes de ser aprobadas las actas</b> que los contengan».</li>\n<li><b>Las dos condiciones:</b> que se haga <b>la advertencia o salvedad en este sentido</b>, y <b>a reserva de los términos que resulten de la aprobación</b> del acta correspondiente.</li>\n</ul></div></details><details class=\"panel\"><summary>En lenguaje llano</summary><div class=\"body\"><p>No hace falta esperar al Pleno siguiente para certificar un acuerdo: se certifica ya, advirtiendo que el acta aún no está aprobada.</p></div></details><details class=\"panel\"><summary>¿Por qué existe?</summary><div class=\"body\"><div class=\"interp\"><span class=\"lbl\">Interpretación · aportación externa</span>El acta tarda semanas en aprobarse. Sin este atajo, ningún acuerdo podría ejecutarse en ese intervalo, y se paralizarían contratos, subvenciones y pagos durante un mes entero.</div></div></details><details class=\"panel\"><summary>Ejemplos</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Ejemplo 1</span>Se aprueba el expediente de contratación y se certifica al día siguiente para incorporarlo al expediente, con la salvedad del 206.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 2</span>Se certifica la concesión de una subvención para poder notificarla sin esperar a la aprobación del acta.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 3</span>Caso límite: la aprobación del acta introduce una rectificación de error material que afecta a lo certificado. Por eso la certificación se expide <b>a reserva</b> de esos términos.</div></div></details><details class=\"panel\"><summary>Trampas</summary><div class=\"body\"><div class=\"box warn\"><span class=\"lbl\">Cuidado</span>Las dos condiciones son <b>acumulativas</b>: advertencia expresa <b>y</b> reserva. Una certificación anticipada sin la salvedad está mal expedida.</div></div></details><details class=\"panel\"><summary>Conexiones</summary><div class=\"body\"><p>Con los arts. 91.1, 110 y 204. Es la pieza que permite que el ciclo del gasto no se detenga.</p></div></details><details class=\"panel\"><summary>Anclaje memorístico</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Para retenerlo</span>Certificar antes del acta: <b>sí, pero con la salvedad</b>.</div></div></details></section><section class=\"card\" id=\"cifras\"><h2>Cifras y listas cerradas</h2>\n<p class=\"small\">Pulsa en una columna para ordenar.</p>\n<table id=\"tcif\"><thead><tr><th class=\"sortable\">Dato</th><th class=\"sortable\">Qué es</th><th class=\"sortable\">Precepto</th></tr></thead><tbody>\n<tr><td>Cada mes</td><td>Sesión ordinaria: municipios de más de 20.000 habitantes y Diputaciones</td><td>Art. 46.2.a) LBRL</td></tr>\n<tr><td>Cada 2 meses</td><td>Sesión ordinaria: municipios de 5.001 a 20.000 habitantes</td><td>Art. 46.2.a) LBRL</td></tr>\n<tr><td>Cada 3 meses</td><td>Sesión ordinaria: municipios de hasta 5.000 habitantes</td><td>Art. 46.2.a) LBRL</td></tr>\n<tr><td>Cuarta parte</td><td>Del <span class=\"t\" data-g=\"numerolegal\">número legal</span> de miembros, para pedir sesión extraordinaria</td><td>Art. 46.2.a) LBRL</td></tr>\n<tr><td>3 al año</td><td>Máximo de sesiones extraordinarias que puede solicitar cada concejal</td><td>Art. 46.2.a) LBRL</td></tr>\n<tr><td>15 días hábiles</td><td>Demora máxima en celebrar la extraordinaria solicitada</td><td>Art. 46.2.a) LBRL</td></tr>\n<tr><td>Décimo día hábil, a las 12</td><td>Convocatoria automática si el Presidente no convoca</td><td>Art. 46.2.a) LBRL</td></tr>\n<tr><td>2 días hábiles</td><td>Antelación mínima de la convocatoria</td><td>Art. 46.2.b) LBRL · art. 80.4 ROF</td></tr>\n<tr><td>Un tercio, mínimo 3</td><td><span class=\"t\" data-g=\"quorum\">Quórum</span> de constitución, mantenido toda la sesión</td><td>Art. 46.2.c) LBRL · art. 90 ROF</td></tr>\n<tr><td>30 días</td><td>Para convocar la extraordinaria que fija la periodicidad, tras la constitutiva</td><td>Art. 78.1 ROF</td></tr>\n<tr><td>20 %</td><td>De los <span class=\"t\" data-g=\"recursos\">recursos ordinarios</span>: concesión de más de 5 años y enajenación de bienes</td><td>Art. 47.2.j) y m) LBRL</td></tr>\n<tr><td>10 %</td><td>De los recursos ordinarios: operaciones de crédito, quitas y esperas</td><td>Art. 47.2.l) LBRL</td></tr>\n<tr><td>24 horas</td><td>Antelación de la pregunta escrita para contestarse en la propia sesión</td><td>Art. 97.7 ROF</td></tr>\n<tr><td>7 términos</td><td><span class=\"t\" data-g=\"dictamen\">Dictamen</span>, <span class=\"t\" data-g=\"proposicion\">proposición</span>, <span class=\"t\" data-g=\"mocion\">moción</span>, <span class=\"t\" data-g=\"votopart\">voto particular</span>, enmienda, ruego y pregunta</td><td>Art. 97 ROF</td></tr>\n<tr><td>2 firmas</td><td>Alcalde y Secretario, para transcribir el acta al Libro</td><td>Art. 110.2 ROF</td></tr>\n<tr><td><span class=\"t\" data-g=\"vistobueno\">Visto bueno</span></td><td>Acredita el ejercicio del cargo y la autenticidad de la firma, no el contenido</td><td>Art. 205 ROF</td></tr>\n</tbody></table>\n<svg viewBox=\"0 0 960 272\" width=\"100%\" role=\"img\" aria-label=\"Diferencia entre mayoría simple y absoluta y los tres supuestos económicos que exigen mayoría absoluta\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"t1cfrr2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#4b5563\"/></marker><marker id=\"t1cfer2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#15803d\"/></marker><marker id=\"t1cfwr2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#b45309\"/></marker></defs><text x=\"480\" y=\"24\" font-size=\"13\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"bold\">Mayoría simple y mayoría absoluta · art. 47 LBRL</text><rect x=\"20\" y=\"44\" width=\"450\" height=\"76\" rx=\"8\" fill=\"#eaf6ee\" stroke=\"#15803d\" stroke-width=\"1.4\"/><text x=\"245\" y=\"63.14\" font-size=\"10.4\" text-anchor=\"middle\" fill=\"#15803d\" font-weight=\"bold\">MAYORÍA SIMPLE · 47.1</text><text x=\"245\" y=\"78.14\" font-size=\"10.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">LA REGLA GENERAL</text><text x=\"245\" y=\"93.14\" font-size=\"10.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Votos afirmativos MÁS que los negativos</text><text x=\"245\" y=\"108.14\" font-size=\"10.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Se mide sobre los MIEMBROS PRESENTES</text><rect x=\"490\" y=\"44\" width=\"450\" height=\"76\" rx=\"8\" fill=\"#fdeceb\" stroke=\"#b91c1c\" stroke-width=\"1.4\"/><text x=\"715\" y=\"63.14\" font-size=\"10.4\" text-anchor=\"middle\" fill=\"#b91c1c\" font-weight=\"bold\">MAYORÍA ABSOLUTA · 47.2</text><text x=\"715\" y=\"78.14\" font-size=\"10.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">EXCEPCIÓN TASADA</text><text x=\"715\" y=\"93.14\" font-size=\"10.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Voto favorable de más de la mitad</text><text x=\"715\" y=\"108.14\" font-size=\"10.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">del NÚMERO LEGAL de miembros</text><rect x=\"20\" y=\"132\" width=\"920\" height=\"34\" rx=\"8\" fill=\"#e8efff\" stroke=\"#1d4ed8\" stroke-width=\"1.4\"/><text x=\"480\" y=\"152.85\" font-size=\"11\" text-anchor=\"middle\" fill=\"#1d4ed8\" font-weight=\"bold\">LAS TRES DE CONTENIDO ECONÓMICO QUE TE INTERESAN</text><rect x=\"20\" y=\"174\" width=\"300\" height=\"62\" rx=\"8\" fill=\"#fdeceb\" stroke=\"#b91c1c\" stroke-width=\"1.4\"/><text x=\"170\" y=\"194.36\" font-size=\"9.6\" text-anchor=\"middle\" fill=\"#b91c1c\" font-weight=\"bold\">j) CONCESIÓN de bienes o</text><text x=\"170\" y=\"208.36\" font-size=\"9.6\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">servicios por más de 5 años</text><text x=\"170\" y=\"222.36\" font-size=\"9.6\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">y cuantía superior al 20 %</text><rect x=\"340\" y=\"174\" width=\"300\" height=\"62\" rx=\"8\" fill=\"#fdeceb\" stroke=\"#b91c1c\" stroke-width=\"1.4\"/><text x=\"490\" y=\"194.36\" font-size=\"9.6\" text-anchor=\"middle\" fill=\"#b91c1c\" font-weight=\"bold\">l) OPERACIONES de crédito</text><text x=\"490\" y=\"208.36\" font-size=\"9.6\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">o financieras, quitas y esperas,</text><text x=\"490\" y=\"222.36\" font-size=\"9.6\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">cuando superen el 10 %</text><rect x=\"660\" y=\"174\" width=\"300\" height=\"62\" rx=\"8\" fill=\"#fdeceb\" stroke=\"#b91c1c\" stroke-width=\"1.4\"/><text x=\"810\" y=\"194.36\" font-size=\"9.6\" text-anchor=\"middle\" fill=\"#b91c1c\" font-weight=\"bold\">m) ENAJENACIÓN de bienes</text><text x=\"810\" y=\"208.36\" font-size=\"9.6\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">cuando la cuantía exceda</text><text x=\"810\" y=\"222.36\" font-size=\"9.6\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">del 20 % de los recursos</text><text x=\"480\" y=\"262\" font-size=\"11\" text-anchor=\"middle\" fill=\"#b91c1c\" font-weight=\"bold\">Simple se cuenta sobre PRESENTES; absoluta sobre el NÚMERO LEGAL. Ahí está la trampa.</text></svg></section><section class=\"card\" id=\"test\"><h2>Test · 32 preguntas con corrección razonada</h2>\n<div class=\"tools noprint\" style=\"margin-bottom:.8rem\">\n <button id=\"corr\">Corregir todo</button>\n <button id=\"fallos\">Repetir solo los fallos</button>\n <button id=\"reset\">Reiniciar</button>\n <span class=\"seg\" role=\"group\" aria-label=\"Penalización\">\n  <button id=\"pen0\" data-pen=\"0\" aria-pressed=\"true\">Sin penalización</button>\n  <button id=\"pen1\" data-pen=\"1\" aria-pressed=\"false\">Penaliza −50 %</button>\n </span>\n <span id=\"score\" class=\"chip\" style=\"margin-left:.4rem\">0 de 32</span>\n</div>\n<div class=\"box warn\" style=\"margin-bottom:.7rem\"><span class=\"lbl\">Entrena las dos reglas</span><b>Sin penalización no dejes nada en blanco. Con penalización, contesta solo si has descartado al menos dos opciones.</b> Puedes devolver una pregunta a blanco después de contestarla.</div>\n<div id=\"testbox\"></div></section><section class=\"card\" id=\"sem\"><h2>Semáforo de autoevaluación</h2>\n<p class=\"small\">Marca cada destreza. Lo rojo y lo ámbar es tu repaso de mañana.</p>\n<div id=\"sembox\"></div><div id=\"semres\"></div></section><section class=\"card\" id=\"cierre\"><h2>Cierre y repaso espaciado</h2>\n<div class=\"idea\">La respuesta al caso del principio: en una corporación de trece, la mayoría absoluta son <b>siete</b> votos favorables. Con ocho a favor hay mayoría absoluta y el acuerdo es válido. Si hubieran sido seis a favor, uno en contra y seis abstenciones, habría mayoría simple pero <b>no</b> absoluta, y el acuerdo sería nulo por falta de quórum de votación.</div>\n<svg viewBox=\"0 0 980 252\" width=\"100%\" role=\"img\" aria-label=\"Recorrido desde la adopción del acuerdo hasta la certificación que se incorpora al expediente\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"t1efrr5\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#4b5563\"/></marker><marker id=\"t1efer5\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#15803d\"/></marker><marker id=\"t1efwr5\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#b45309\"/></marker></defs><text x=\"490\" y=\"24\" font-size=\"13\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"bold\">Del acuerdo al expediente: el recorrido del documento</text><rect x=\"20\" y=\"46\" width=\"164\" height=\"80\" rx=\"8\" fill=\"#e8efff\" stroke=\"#1d4ed8\" stroke-width=\"1.4\"/><text x=\"102\" y=\"75.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#1d4ed8\" font-weight=\"bold\">1 · SESIÓN</text><text x=\"102\" y=\"89.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Se adopta</text><text x=\"102\" y=\"103.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">el acuerdo</text><rect x=\"214\" y=\"46\" width=\"164\" height=\"80\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"296\" y=\"68.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#4b5563\" font-weight=\"bold\">2 · ACTA</text><text x=\"296\" y=\"82.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">La extiende</text><text x=\"296\" y=\"96.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">el SECRETARIO</text><text x=\"296\" y=\"110.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">art. 109 ROF</text><rect x=\"408\" y=\"46\" width=\"164\" height=\"80\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"490\" y=\"68.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#4b5563\" font-weight=\"bold\">3 · APROBACIÓN</text><text x=\"490\" y=\"82.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">por el Pleno</text><text x=\"490\" y=\"96.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">en la sesión</text><text x=\"490\" y=\"110.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">siguiente</text><rect x=\"602\" y=\"46\" width=\"164\" height=\"80\" rx=\"8\" fill=\"#eaf6ee\" stroke=\"#15803d\" stroke-width=\"1.4\"/><text x=\"684\" y=\"68.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#15803d\" font-weight=\"bold\">4 · LIBRO DE ACTAS</text><text x=\"684\" y=\"82.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Se transcribe, con</text><text x=\"684\" y=\"96.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">firmas del Alcalde</text><text x=\"684\" y=\"110.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">y del Secretario</text><rect x=\"796\" y=\"46\" width=\"164\" height=\"80\" rx=\"8\" fill=\"#fdeceb\" stroke=\"#b91c1c\" stroke-width=\"1.4\"/><text x=\"878\" y=\"68.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#b91c1c\" font-weight=\"bold\">5 · CERTIFICACIÓN</te var estado=TEST.map(function(){return -1;}), soloFallos=false, revelar=false, pen=0;
function letra(i){return 'abcd'[i];}
function pintaTest(){

   if(show){ if(ok){bg='var(--ej-bg)';bd='var(--ej)';ic='✓ ';}

 });

}

  document.querySelectorAll('section.card').forEach(function(s){
   var found=false;
   var w=document.createTreeWalker(s,NodeFilter.SHOW_TEXT,null);var nodes=[];
   while(w.nextNode()){var nd=w.currentNode;
    if(nd.parentNode.closest('script,style,mark,svg'))continue;

<script>

/* ═══ Mejoras de interacción · Bloque II ═══ */
(function(){
"use strict";
var K_THEME="oposi_bII_theme", K_FS="oposi_bII_fs", K_STREAK="oposi_bII_streak";
function load(k,f){try{var v=localStorage.getItem(k);return v?JSON.parse(v):f;}catch(e){return f;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
var root=document.documentElement;

/* Tema persistente (sobrescribe el toggle simple anterior) */
var saved=load(K_THEME,null);
if(saved){root.setAttribute("data-theme",saved);}
else if(window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches){root.setAttribute("data-theme","dark");}
var bt=document.getElementById("theme");
if(bt)bt.onclick=function(){
  var n=root.getAttribute("data-theme")==="dark"?"light":"dark";
  root.setAttribute("data-theme",n);save(K_THEME,n);
};

/* Tamaño de texto persistente · solo afecta al cuerpo de la página */
var fs=load(K_FS,16);
function setFs(v){
  fs=Math.max(13,Math.min(22,v));
  root.style.setProperty("--z",(fs/16).toFixed(4));
  save(K_FS,fs);
}
setFs(fs);
var bp=document.getElementById("fs+"),bm=document.getElementById("fs-");
if(bp)bp.onclick=function(){setFs(fs+1);};
if(bm)bm.onclick=function(){setFs(fs-1);};

/* Racha compartida con el índice */
(function(){
  var el=document.getElementById("streakN");if(!el)return;
  var hoy=new Date().toISOString().slice(0,10);
  var s=load(K_STREAK,{last:null,n:0});
  if(s.last!==hoy){
    var ayer=new Date(Date.now()-864e5).toISOString().slice(0,10);
    s.n=(s.last===ayer)?s.n+1:1;s.last=hoy;save(K_STREAK,s);
  }
  el.textContent=s.n;
})();

/* Reveal on scroll para las tarjetas */
function reveal(){
  var els=document.querySelectorAll("section.card:not(.rv)");
  if(!els.length)return;
  if(!("IntersectionObserver" in window)){return;}
  var io=new IntersectionObserver(function(es){
    es.forEach(function(en){if(en.isIntersecting){en.target.classList.add("in");io.unobserve(en.target);}});
  },{threshold:0,rootMargin:"0px 0px -30px 0px"});
  Array.prototype.forEach.call(els,function(el){el.classList.add("rv");io.observe(el);});
}

/* Sección activa en el índice lateral */
function spy(){
  var links=document.querySelectorAll("nav.side a[href^='#']");
  if(!links.length||!("IntersectionObserver" in window))return;
  var map={};
  Array.prototype.forEach.call(links,function(a){
    var t=document.getElementById(a.getAttribute("href").slice(1));
    if(t)map[t.id]=a;
  });
  var io=new IntersectionObserver(function(es){
    es.forEach(function(en){
      if(en.isIntersecting){
        Array.prototype.forEach.call(links,function(a){a.classList.remove("on");});
        if(map[en.target.id])map[en.target.id].classList.add("on");
      }
    });
  },{rootMargin:"-80px 0px -70% 0px",threshold:0});
  Object.keys(map).forEach(function(id){io.observe(document.getElementById(id));});
}

/* Ripple en botones */
document.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b||b.classList.contains("navtoggle"))return;
  var r=b.getBoundingClientRect(),d=Math.max(r.width,r.height),s=document.createElement("span");
  s.className="ripple";s.style.width=s.style.height=d+"px";
  s.style.left=(e.clientX-r.left-d/2)+"px";s.style.top=(e.clientY-r.top-d/2)+"px";
  b.appendChild(s);setTimeout(function(){if(s.parentNode)s.parentNode.removeChild(s);},560);
});

/* Atajos de teclado */
document.addEventListener("keydown",function(e){
  if(e.target.matches("input,textarea"))return;
  if(e.key==="/"){var q=document.getElementById("q");if(q){e.preventDefault();q.focus();}}
  if(e.key==="t"&&bt)bt.click();
});

/* El contenido se inyecta por JS: esperamos a que exista */
function init(){reveal();spy();}
if(document.getElementById("main")&&document.getElementById("main").children.length){init();}
else{setTimeout(init,60);}
addEventListener("load",function(){setTimeout(init,80);});
})();


</script>

var FCFMT=(function(){
  var CITA=/\s*\(((?:arts?\.|DA\b|DT\b|disp\.)[^)]*)\)\s*\.?\s*$/i;
  var strip=function(h){return h.replace(/<[^>]+>/g,"");};

  function esc(s){return s;}

  function parse(raw){
    var out={verdict:null,cite:null,kind:"p",items:[],text:""};
    var body=String(raw).trim();

    /* 1 ── Cita legal al final */
    var m=body.match(CITA);
    if(m){out.cite=m[1].replace(/\s+/g," ").trim();body=body.slice(0,m.index).trim();}
    body=body.replace(/[.;,\s]+$/,"");

    /* 2 ── Veredicto Sí / No inicial */
    var v=strip(body).match(/^(Sí|Sí,|No|No,)[.:,]?\s/);
    if(v){
      out.verdict=/^Sí/.test(v[1])?"si":"no";
      body=body.replace(/^(<[^>]+>\s*)*(Sí|No)[.,:]?\s*/,"").trim();
      body=body.replace(/^en\s/,"En ");
    }

    /* 3 ── Enumeración con · */
    var parts=body.split(/\s+·\s+/);
    if(parts.length>=2){
      out.kind="list";
      var letras=parts.filter(function(p){return /^\s*<?[a-h]\)/.test(strip(p));}).length;
      out.marker = letras>=parts.length-1 ? "alpha" : "num";
      out.items=parts.map(function(p){
        return p.replace(/^\s*[a-h]\)\s*/,"").replace(/[.\s]+$/,"").trim();
      }).filter(Boolean);
      return out;
    }

    /* 4 ── Cláusulas contrapuestas con ; */
    var semi=body.split(/;\s+/);
    if(semi.length>=2&&semi.length<=3&&semi.every(function(s){return strip(s).length>14;})){
      out.kind="clauses";
      out.items=semi.map(function(s){return s.replace(/[.\s]+$/,"").trim();});
      return out;
    }

    /* 5 ── Párrafo */
    out.text=body;
    return out;
  }

  function render(raw){
    var d=parse(raw),h="";

    if(d.verdict){
      h+='<span class="fc-verdict '+d.verdict+'">'+(d.verdict==="si"?"✓ Sí":"✗ No")+'</span>';
    }

    if(d.kind==="list"){
      h+='<ol class="fc-list '+d.marker+'">';
      d.items.forEach(function(it){h+='<li>'+it+'</li>';});
      h+='</ol>';
    }else if(d.kind==="clauses"){
      h+='<div class="fc-clauses">';
      d.items.forEach(function(it){h+='<p>'+it+'</p>';});
      h+='</div>';
    }else if(d.text){
      h+='<p class="fc-p">'+d.text+'</p>';
    }

    if(d.cite){
      h+='<span class="fc-cite"><span class="s">§</span>'+d.cite+'</span>';
    }
    return {html:h,struct:(d.kind!=="p"||!!d.verdict||strip(raw).length>150)};
  }
  return {parse:parse,render:render};
})();

          +'<div class="fc-txt"></div>'

  bar.className="fc-bar";bar.innerHTML="<i></i>";
  sec.appendChild(bar);

  var ctr=document.createElement("div");
  ctr.className="fc-ctrls noprint";
  ctr.innerHTML='<button id="fcflip">⟲ Girar</button>'
    +'<button id="fcok">✔ Lo sabía</button>'
    +'<button id="fcko">↻ Repasar</button>'
    +'<button id="fcreset">Reiniciar</button>'
    +'<span class="fc-score">'
      +'<span class="fc-pill ok" id="fcpok">0 sabidas</span>'
      +'<span class="fc-pill ko" id="fcpko">0 repasar</span>'
      +'<span class="fc-pill left" id="fccount">0</span>'

  sec.appendChild(ctr);

  var deck=stage.querySelector("#fcdeck"), lift=stage.querySelector("#fclift"),
      card=stage.querySelector("#fcbox"),
      front=stage.querySelector(".fc-front"), backf=stage.querySelector(".fc-back"),
      fill=bar.querySelector("i"),
      pok=ctr.querySelector("#fcpok"), pko=ctr.querySelector("#fcpko"),
      pleft=ctr.querySelector("#fccount");
  var rot=0;

  function reset(){
    order=CARDS.map(function(_,i){return i;});
    fi=0;ok=0;ko=0;back=false;busy=false;rot=0;
    card.style.transition="none";card.style.transform="rotateY(0deg)";
    void card.offsetWidth;card.style.transition="";
    deck.classList.remove("empty");
    var d=stage.querySelector(".fc-done");if(d)d.remove();
    card.style.display="";
    draw();
  }

  function bump(el){el.classList.remove("bump");void el.offsetWidth;el.classList.add("bump");}

  function draw(){
    pok.textContent=ok+(ok===1?" sabida":" sabidas");
    pko.textContent=ko+" repasar";
    var done=N-order.length;
    fill.style.width=(N?done/N*100:0)+"%";

    if(!order.length){
      pleft.textContent="0 quedan";
      deck.classList.add("empty");
      card.style.display="none";
      if(!stage.querySelector(".fc-done")){
        var d=document.createElement("div");
        d.className="fc-done";
        d.innerHTML='<span class="seal">🏆</span><h3>Ronda completada</h3>'
          +'<p>'+ok+' de '+N+' a la primera'+(ko?' · '+ko+' necesitaron repaso':'')+'</p>';
        deck.appendChild(d);
      }
      return;
    }
    if(fi>=order.length)fi=0;
    pleft.textContent=order.length+(order.length===1?" queda":" quedan");

    var c=CARDS[order[fi]];
    front.querySelector(".fc-txt").innerHTML='<p class="fc-p">'+c[0]+'</p>';
    var r=FCFMT.render(c[1]);
    backf.querySelector(".fc-txt").innerHTML=r.html;

    var pip=(done+1)+"/"+N;
    Array.prototype.forEach.call(stage.querySelectorAll(".fc-pip"),function(p){p.textContent=pip;});
  }

  function flip(){
    if(busy||!order.length)return;

  function next(good){
    if(busy||!order.length)return;
    busy=true;
    if(good){ok++;bump(pok);}else{ko++;bump(pko);}
    lift.classList.remove("lift");
    lift.classList.add(good?"out-ok":"out-ko");
    setTimeout(function(){
      if(good){order.splice(fi,1);}
      else{var m=order.splice(fi,1)[0];order.push(m);}
      back=false;rot=0;
      card.style.transition="none";card.style.transform="rotateY(0deg)";
      void card.offsetWidth;card.style.transition="";
      draw();
      lift.classList.remove("out-ok","out-ko");
      lift.classList.add("in");
      setTimeout(function(){lift.classList.remove("in");busy=false;},480);
    },460);
  }

  card.onclick=flip;
  card.onkeydown=function(e){
    if(e.key===" "||e.key==="Enter"){e.preventDefault();flip();}
    if(e.key==="ArrowRight"){e.preventDefault();next(true);}
    if(e.key==="ArrowLeft"){e.preventDefault();next(false);}
  };
  ctr.querySelector("#fcflip").onclick=flip;
  ctr.querySelector("#fcok").onclick=function(){next(true);};
  ctr.querySelector("#fcko").onclick=function(){next(false);};
  ctr.querySelector("#fcreset").onclick=reset;

  /* Deslizar en táctil */
  var x0=null,y0=null;
  card.addEventListener("touchstart",function(e){x0=e.touches[0].clientX;y0=e.touches[0].clientY;},{passive:true});
  card.addEventListener("touchend",function(e){

    x0=y0=null;
  },{passive:true});

  /* Atajos globales cuando el mazo está a la vista */
  document.addEventListener("keydown",function(e){
    if(e.target.matches("input,textarea,select"))return;
    var r=stage.getBoundingClientRect();
    if(r.bottom<80||r.top>innerHeight-80)return;
    if(e.key===" "){e.preventDefault();flip();}
    else if(e.key==="ArrowRight"){e.preventDefault();next(true);}
    else if(e.key==="ArrowLeft"){e.preventDefault();next(false);}
  });

  reset();
  return true;
}
if(!boot()){
  var tries=0;
  var iv=setInterval(function(){if(boot()||++tries>40)clearInterval(iv);},120);
  addEventListener("load",function(){setTimeout(boot,100);});
}
})();

ÉCIMO DÍA HÁBIL siguiente, a las DOCE HORAS.</text></svg><details class=\"panel\" open><summary>Texto legal</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · ROF</span><p>Artículo 80.</p><p>1. Corresponde al Alcalde o Presidente convocar todas las sesiones del Pleno. La convocatoria de las sesiones extraordinarias habrá de ser motivada.</p><p>2. A la convocatoria de las sesiones se acompañará el orden del día comprensivo de los asuntos a tratar con el suficiente detalle, y los borradores de actas de sesiones anteriores que deban ser aprobados en la sesión.</p><p>3. La convocatoria, orden del día y borradores de actas deberán ser notificados a los Concejales o Diputados en su domicilio.</p><p>4. Entre la convocatoria y la celebración de la sesión no podrán transcurrir menos de dos días hábiles, salvo en el caso de las sesiones extraordinarias urgentes.</p></div></div></details><details class=\"panel\"><summary>Disección</summary><div class=\"body\"><ul>\n<li><b>Quién (80.1):</b> corresponde al <b>Alcalde o Presidente</b> convocar <b>todas</b> las sesiones del Pleno. La convocatoria de las <b>extraordinarias habrá de ser motivada</b>.</li>\n<li><b>Qué acompaña (80.2):</b> el <b>orden del día</b> comprensivo de los asuntos <b>con el suficiente detalle</b>, y los <b>borradores de actas</b> de sesiones anteriores que deban aprobarse.</li>\n<li><b>Notificación (80.3):</b> convocatoria, orden del día y borradores se <b>notifican a los Concejales o Diputados en su domicilio</b>.</li>\n<li><b>Plazo (80.4):</b> entre convocatoria y celebración <b>no podrán transcurrir menos de dos días hábiles</b>, salvo en las extraordinarias urgentes.</li>\n</ul></div></details><details class=\"panel\"><summary>En lenguaje llano</summary><div class=\"body\"><p>Convoca siempre el Alcalde, avisa con dos días hábiles como mínimo y manda junto con la convocatoria el orden del día y el borrador del acta anterior.</p></div></details><details class=\"panel\"><summary>¿Por qué existe?</summary><div class=\"body\"><div class=\"interp\"><span class=\"lbl\">Interpretación · aportación externa</span>Enviar el borrador del acta con la convocatoria permite que su aprobación sea el primer punto de la sesión siguiente sin necesidad de leerla en voz alta, que es lo que hacía interminables los plenos.</div></div></details><details class=\"panel\"><summary>Ejemplos</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Ejemplo 1</span>Pleno el jueves: la convocatoria debe salir como muy tarde el lunes, para que medien dos días hábiles.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 2</span>Se convoca extraordinaria sin motivar: defecto de forma del 80.1.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 3</span>Caso límite: extraordinaria urgente. No rige el plazo de dos días hábiles, pero el Pleno debe <b>ratificar la urgencia</b> (art. 46.2.b LBRL).</div></div></details><details class=\"panel\"><summary>Trampas</summary><div class=\"body\"><div class=\"box warn\"><span class=\"lbl\">Cuidado</span>Son <b>dos días hábiles</b>, y se cuentan <b>entre</b> la convocatoria y la celebración. La motivación solo se exige a las <b>extraordinarias</b>.</div></div></details><details class=\"panel\"><summary>Conexiones</summary><div class=\"body\"><p>Con el art. 46.2.b) LBRL y con el art. 82 —orden del día—.</p></div></details><details class=\"panel\"><summary>Anclaje memorístico</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Para retenerlo</span>Convoca <b>el Alcalde</b>, con <b>orden del día + borrador de acta</b>, y <b>dos días hábiles</b>.</div></div></details></section><section class=\"card art\" id=\"rof82\"><h2><span class=\"num\">ROF 82</span> El orden del día</h2><p class=\"ubic\">RD 2568/1986 ▸ Título III ▸ Capítulo I ▸ Sección 1.ª</p><div class=\"idea\">Lo fija el Alcalde, solo con asuntos dictaminados, salvo urgencia ratificada.</div><details class=\"panel\" open><summary>Texto legal</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · ROF</span><p>Artículo 82.</p><p>1. El orden del día de las sesiones será fijado por el Alcalde o Presidente asistido de la Secretaría. Asimismo, podrá recabar la asistencia de los miembros de la Comisión de Gobierno y, donde ésta no exista, de los Tenientes de Alcalde, y consultar si lo estima oportuno a los portavoces de los grupos existentes en la Corporación.</p><p>2. En el orden del día sólo pueden incluirse los asuntos que hayan sido previamente dictaminados, informados o sometidos a consulta de la Comisión Informativa que corresponda.</p><p>3. El Alcalde o Presidente, por razones de urgencia debidamente motivada, podrá incluir en el orden del día, a iniciativa propia o a propuesta de alguno de los portavoces, asuntos que no hayan sido previamente informados por la respectiva Comisión Informativa, pero en este supuesto no podrá adoptarse acuerdo alguno sobre estos asuntos sin que el Pleno ratifique su inclusión en el orden del día.</p><p>4. En el orden del día de las sesiones ordinarias se incluirá siempre el punto de ruegos y preguntas.</p></div></div></details><details class=\"panel\"><summary>Disección</summary><div class=\"body\"><ul>\n<li><b>Quién (82.1):</b> lo fija el <b>Alcalde o Presidente asistido de la Secretaría</b>. Puede recabar la asistencia de los miembros de la Comisión de Gobierno o de los Tenientes de Alcalde, y <b>consultar a los portavoces</b> si lo estima oportuno.</li>\n<li><b>Regla (82.2):</b> <b>solo pueden incluirse</b> los asuntos <b>previamente dictaminados, informados o sometidos a consulta</b> de la Comisión Informativa que corresponda.</li>\n<li><b>Urgencia (82.3):</b> por <b>razones de urgencia debidamente motivada</b>, el Alcalde puede incluir asuntos <b>no dictaminados</b>, pero <b>no podrá adoptarse acuerdo alguno sin que el Pleno ratifique su inclusión</b>.</li>\n<li><b>Ruegos y preguntas (82.4):</b> en el orden del día de las <b>sesiones ordinarias</b> se incluirá <b>siempre</b> ese punto.</li>\n</ul></div></details><details class=\"panel\"><summary>En lenguaje llano</summary><div class=\"body\"><p>En el orden del día solo va lo que ha pasado por comisión. Si hay prisa puede colarse algo sin dictaminar, pero antes de votarlo el Pleno tiene que decir que sí a que se trate.</p></div></details><details class=\"panel\"><summary>¿Por qué existe?</summary><div class=\"body\"><div class=\"interp\"><span class=\"lbl\">Interpretación · aportación externa</span>El filtro de la Comisión Informativa garantiza que los grupos han podido estudiar el asunto antes de votarlo. La ratificación de la urgencia es la válvula que permite reaccionar sin eliminar esa garantía.</div></div></details><details class=\"panel\"><summary>Ejemplos</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Ejemplo 1</span>Un expediente de modificación de crédito pasa por la Comisión de Hacienda antes de ir al Pleno.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 2</span>Se incluye por urgencia una subvención de emergencia: el Pleno ratifica la inclusión y después vota el fondo.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 3</span>Caso límite: se vota el fondo sin ratificar la inclusión. El acuerdo queda viciado: el 82.3 lo prohíbe expresamente.</div></div></details><details class=\"panel\"><summary>Trampas</summary><div class=\"body\"><div class=\"box warn\"><span class=\"lbl\">Cuidado</span>Son <b>dos votaciones</b> en el supuesto de urgencia: primero la <b>ratificación de la inclusión</b>, después el <b>fondo</b>. Y el punto de ruegos y preguntas solo es obligatorio en las <b>ordinarias</b>.</div></div></details><details class=\"panel\"><summary>Conexiones</summary><div class=\"body\"><p>Con el art. 97.2 —proposición— y el art. 91.4 —moción—. Con el art. 80.2 —el orden del día acompaña a la convocatoria—.</p></div></details><details class=\"panel\"><summary>Anclaje memorístico</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Para retenerlo</span>Orden del día = <b>lo dictaminado</b>. Lo urgente entra, pero <b>se ratifica antes de votar</b>.</div></div></details></section><section class=\"card art\" id=\"rof90\"><h2><span class=\"num\">ROF 90</span> Quórum de constitución</h2><p class=\"ubic\">RD 2568/1986 ▸ Título III ▸ Capítulo I ▸ Sección 2.ª</p><div class=\"idea\">Un tercio del número legal, nunca menos de tres, mantenido toda la sesión.</div><svg viewBox=\"0 0 960 262\" width=\"100%\" role=\"img\" aria-label=\"Quórum de constitución del Pleno, su mantenimiento y presencia obligatoria del Presidente y del Secretario\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"t1dfr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#4b5563\"/></marker><marker id=\"t1dfe\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#15803d\"/></marker><marker id=\"t1dfw\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#b45309\"/></marker></defs><text x=\"480\" y=\"24\" font-size=\"13\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"bold\">Quórum de constitución del Pleno</text><rect x=\"20\" y=\"44\" width=\"450\" height=\"70\" rx=\"8\" fill=\"#e8efff\" stroke=\"#1d4ed8\" stroke-width=\"1.4\"/><text x=\"245\" y=\"66.78\" font-size=\"10.8\" text-anchor=\"middle\" fill=\"#1d4ed8\" font-weight=\"bold\">REGLA GENERAL</text><text x=\"245\" y=\"82.78\" font-size=\"10.8\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">UN TERCIO de los miembros,</text><text x=\"245\" y=\"98.78\" font-size=\"10.8\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">que NUNCA podrá ser INFERIOR A TRES</text><rect x=\"490\" y=\"44\" width=\"450\" height=\"70\" rx=\"8\" fill=\"#fdf3e3\" stroke=\"#b45309\" stroke-width=\"1.4\"/><text x=\"715\" y=\"67.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"bold\">MUNICIPIOS DE HASTA 100 RESIDENTES</text><text x=\"715\" y=\"82.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">sin Concejo Abierto: el NÚMERO LEGAL</text><text x=\"715\" y=\"97.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">de miembros, nunca inferior a DOS</text><rect x=\"20\" y=\"126\" width=\"920\" height=\"44\" rx=\"8\" fill=\"#fdeceb\" stroke=\"#b91c1c\" stroke-width=\"1.4\"/><text x=\"480\" y=\"144.14\" font-size=\"10.4\" text-anchor=\"middle\" fill=\"#b91c1c\" font-weight=\"bold\">EL QUÓRUM DEBE MANTENERSE DURANTE TODA LA SESIÓN, y se requiere en todo caso la asistencia</text><text x=\"480\" y=\"159.14\" font-size=\"10.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">del PRESIDENTE y del SECRETARIO, o de quienes legalmente les sustituyan</text><text x=\"480\" y=\"196\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#4b5563\" font-weight=\"normal\">Si falta el Presidente y quien deba sustituirle, preside el miembro de la Corporación DE MAYOR EDAD entre los presentes.</text><text x=\"480\" y=\"222\" font-size=\"9.8\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"bold\">Discrepancia de redacción: la LBRL 46.2.c) dice «un tercio del MÍNIMO legal»; el ROF 90.1 dice «un tercio del NÚMERO legal».</text><text x=\"480\" y=\"248\" font-size=\"9.8\" text-anchor=\"middle\" fill=\"#4b5563\" font-weight=\"normal\">Los acuerdos se adoptan por votación ordinaria, salvo que el Pleno acuerde para un caso concreto la votación nominal.</text></svg><details class=\"panel\" open><summary>Texto legal</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · ROF</span><p>Artículo 90.</p><p>1. Para la válida constitución del Pleno se requiere la asistencia de un tercio del número legal de miembros de la Corporación, que nunca podrá ser inferior a tres. Este quórum deberá mantenerse durante toda la sesión. En todo caso se requiere la asistencia del Presidente y del Secretario de la Corporación o de quienes legalmente les sustituyan.</p><p>2. Si en primera convocatoria no existiera el quórum necesario según lo dispuesto en el número anterior, se entenderá convocada la sesión automáticamente a la misma hora, dos días después. Si tampoco entonces se alcanzase el quórum necesario, la Presidencia dejará sin efecto la convocatoria posponiendo el estudio de los asuntos incluidos en el orden del día para la primera sesión que se celebre con posterioridad, sea ordinaria o extraordinaria.</p></div></div></details><details class=\"panel\"><summary>Disección</summary><div class=\"body\"><ul>\n<li><b>Regla (90.1):</b> para la válida constitución del Pleno se requiere la asistencia de <b>un tercio del número legal de miembros</b> de la Corporación, <b>que nunca podrá ser inferior a tres</b>. Este <b>quórum deberá mantenerse durante toda la sesión</b>.</li>\n<li><b>Presencias necesarias:</b> en todo caso se requiere la asistencia del <b>Presidente y del Secretario</b>, o de quienes legalmente les sustituyan.</li>\n</ul></div></details><details class=\"panel\"><summary>En lenguaje llano</summary><div class=\"body\"><p>Con un tercio basta para empezar, pero si durante la sesión se marcha gente y se baja de ese tercio, hay que levantarla.</p></div></details><details class=\"panel\"><summary>¿Por qué existe?</summary><div class=\"body\"><div class=\"interp\"><span class=\"lbl\">Interpretación · aportación externa</span>Un quórum bajo evita el bloqueo por absentismo; exigir que se mantenga impide que se aprueben asuntos al final de la sesión, cuando ya solo queda media bancada.</div></div></details><details class=\"panel\"><summary>Ejemplos</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Ejemplo 1</span>Corporación de trece miembros: el tercio son cinco, por encima del mínimo de tres.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 2</span>Corporación de siete: el tercio sería 2,33, pero opera el mínimo de tres.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 3</span>Caso límite: en mitad de la sesión se ausenta el Secretario sin sustituto. No puede continuarse: su presencia es necesaria en todo caso.</div></div></details><details class=\"panel\"><summary>Trampas</summary><div class=\"body\"><div class=\"box warn\"><span class=\"lbl\">Cuidado</span><b>Discrepancia de redacción entre las dos normas.</b> El ROF 90.1 habla de «un tercio del <b>número legal</b>»; el art. 46.2.c) LBRL, de «un tercio del <b>mínimo legal</b>». Si en un test te dan las dos, la que prevalece es la de la <b>Ley</b>.</div></div></details><details class=\"panel\"><summary>Conexiones</summary><div class=\"body\"><p>Reproduce y desarrolla el art. 46.2.c) LBRL.</p></div></details><details class=\"panel\"><summary>Anclaje memorístico</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Para retenerlo</span><b>Un tercio, nunca menos de tres</b>, y <b>durante toda la sesión</b>.</div></div></details></section><section class=\"card art\" id=\"rof91\"><h2><span class=\"num\">ROF 91</span> Desarrollo de las sesiones</h2><p class=\"ubic\">RD 2568/1986 ▸ Título III ▸ Capítulo I ▸ Sección 2.ª</p><div class=\"idea\">Se empieza por el acta anterior y solo se corrigen errores materiales.</div><details class=\"panel\" open><summary>Texto legal</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · ROF</span><p>Artículo 91.</p><p>1. Las sesiones comenzarán preguntando el Presidente si algún miembro de la Corporación tiene que formular alguna observación al acta de la sesión anterior que se hubiere distribuido con la convocatoria. Si no hubiera observaciones se considerará aprobada. Si las hubiera se debatirán y decidirán las rectificaciones que procedan. En ningún caso podrá modificarse el fondo de los acuerdos adoptados y sólo cabrá subsanar los meros errores materiales o de hecho. Al reseñar, en cada acta, la lectura y aprobación de la anterior se consignarán las observaciones y rectificaciones practicadas.</p><p>2. Todos los asuntos se debatirán y votarán por el orden en que estuviesen relacionados en el orden del día.</p><p>3. No obstante lo dispuesto en el número anterior, el Alcalde o Presidente puede alterar el orden de los temas, o retirar un asunto cuando su aprobación exigiera una mayoría especial y ésta no pudiera obtenerse en el momento previsto inicialmente en el orden del día.</p><p>4. En las sesiones ordinarias, concluido el examen de los asuntos incluidos en el orden del día y antes de pasar al turno de ruegos y preguntas, el Presidente preguntará si algún grupo político desea someter a la consideración del Pleno por razones de urgencia, algún asunto no comprendido en el Orden del día que acompañaba a la convocatoria y que no tenga cabida en el punto de ruegos y preguntas. Si así fuere, el Portavoz del grupo proponente justificará la urgencia de la moción y el Pleno votará, acto seguido, sobre la procedencia de su debate. Si el resultado de la votación fuera positivo se seguirá el procedimiento previsto en el artículo 93 y siguientes de este Reglamento. Lo dispuesto en este apartado no será de aplicación, en ningún caso, a las mociones de censura, cuya tramitación, debate y votación se regirán por lo establecido en el artículo 108 de este Reglamento.</p></div></div></details><details class=\"panel\"><summary>Disección</summary><div class=\"body\"><ul>\n<li><b>Primer punto (91.1):</b> el Presidente pregunta si hay <b>observaciones al acta</b> de la sesión anterior distribuida con la convocatoria. <b>Si no las hay, se considera aprobada.</b> Si las hay, se debaten y deciden las rectificaciones.</li>\n<li><b>El límite:</b> «En ningún caso podrá modificarse <b>el fondo de los acuerdos</b> adoptados y <b>sólo cabrá subsanar los meros errores materiales o de hecho</b>».</li>\n<li><b>Orden (91.2 y 91.3):</b> se debate y vota por el orden del día, pero el Presidente <b>puede alterar el orden</b> o <b>retirar un asunto</b> cuando exija <b>mayoría especial</b> y esta no pueda obtenerse en ese momento.</li>\n<li><b>Mociones (91.4):</b> en las ordinarias, concluido el orden del día y <b>antes de los ruegos y preguntas</b>, el Presidente pregunta si algún grupo desea someter por urgencia un asunto no incluido.</li>\n</ul></div></details><details class=\"panel\"><summary>En lenguaje llano</summary><div class=\"body\"><p>Lo primero es aprobar el acta de la vez anterior, y ahí solo se pueden corregir erratas: lo que se acordó, acordado está.</p></div></details><details class=\"panel\"><summary>¿Por qué existe?</summary><div class=\"body\"><div class=\"interp\"><span class=\"lbl\">Interpretación · aportación externa</span>Si en la aprobación del acta pudiera cambiarse el fondo, el Pleno estaría revisando acuerdos firmes por la puerta de atrás, sin procedimiento de revisión ni garantías.</div></div></details><details class=\"panel\"><summary>Ejemplos</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Ejemplo 1</span>El acta dice «once votos a favor» cuando fueron doce: error material, se subsana.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 2</span>Un concejal pretende cambiar el sentido de un acuerdo al aprobar el acta: no cabe.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 3</span>Caso límite: un asunto requiere mayoría absoluta y falta un voto. El Presidente puede <b>retirarlo</b> y llevarlo a otra sesión (91.3).</div></div></details><details class=\"panel\"><summary>Trampas</summary><div class=\"body\"><div class=\"box warn\"><span class=\"lbl\">Cuidado</span>La facultad del 91.3 de retirar un asunto está pensada <b>precisamente</b> para los que exigen mayoría especial. Y la moción del 91.4 va <b>después</b> del orden del día y <b>antes</b> de ruegos y preguntas.</div></div></details><details class=\"panel\"><summary>Conexiones</summary><div class=\"body\"><p>Con el art. 97.3 —definición de moción— y con los arts. 109 y 110 —el acta—.</p></div></details><details class=\"panel\"><summary>Anclaje memorístico</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Para retenerlo</span>Acta: <b>solo errores materiales</b>. Mociones: <b>después del orden del día, antes de ruegos</b>.</div></div></details></section><section class=\"card art\" id=\"rof97\"><h2><span class=\"num\">ROF 97</span> Terminología de las intervenciones</h2><p class=\"ubic\">RD 2568/1986 ▸ Título III ▸ Capítulo I ▸ Sección 2.ª</p><div class=\"idea\">Siete palabras con significado técnico: dictamen, proposición, moción, voto particular, enmienda, ruego y pregunta.</div><svg viewBox=\"0 0 980 256\" width=\"100%\" role=\"img\" aria-label=\"Terminología del artículo 97 del ROF: dictamen, proposición, moción, voto particular, enmienda, ruego y pregunta\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"t1ffr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#4b5563\"/></marker><marker id=\"t1ffe\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#15803d\"/></marker><marker id=\"t1ffw\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#b45309\"/></marker></defs><text x=\"490\" y=\"24\" font-size=\"13\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"bold\">Las siete palabras del art. 97 ROF</text><rect x=\"20\" y=\"44\" width=\"232\" height=\"78\" rx=\"8\" fill=\"#e8efff\" stroke=\"#1d4ed8\" stroke-width=\"1.4\"/><text x=\"136\" y=\"66.72\" font-size=\"9.2\" text-anchor=\"middle\" fill=\"#1d4ed8\" font-weight=\"bold\">DICTAMEN</text><text x=\"136\" y=\"79.72\" font-size=\"9.2\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Propuesta al Pleno tras</text><text x=\"136\" y=\"92.72\" font-size=\"9.2\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">el estudio del expediente</text><text x=\"136\" y=\"105.72\" font-size=\"9.2\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">por la Comisión Informativa</text><rect x=\"256\" y=\"44\" width=\"232\" height=\"78\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"372\" y=\"66.72\" font-size=\"9.2\" text-anchor=\"middle\" fill=\"#4b5563\" font-weight=\"bold\">PROPOSICIÓN</text><text x=\"372\" y=\"79.72\" font-size=\"9.2\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Propuesta sobre asunto</text><text x=\"372\" y=\"92.72\" font-size=\"9.2\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">del orden del día no</text><text x=\"372\" y=\"105.72\" font-size=\"9.2\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">dictaminado · art. 82.3</text><rect x=\"492\" y=\"44\" width=\"232\" height=\"78\" rx=\"8\" fill=\"#fdf3e3\" stroke=\"#b45309\" stroke-width=\"1.4\"/><text x=\"608\" y=\"66.72\" font-size=\"9.2\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"bold\">MOCIÓN</text><text x=\"608\" y=\"79.72\" font-size=\"9.2\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Propuesta sometida</text><text x=\"608\" y=\"92.72\" font-size=\"9.2\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">DIRECTAMENTE al Pleno</text><text x=\"608\" y=\"105.72\" font-size=\"9.2\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">art. 91.4 · oral o escrita</text><rect x=\"728\" y=\"44\" width=\"232\" height=\"78\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"844\" y=\"66.72\" font-size=\"9.2\" text-anchor=\"middle\" fill=\"#4b5563\" font-weight=\"bold\">VOTO PARTICULAR</text><text x=\"844\" y=\"79.72\" font-size=\"9.2\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Modificación de un dictamen</text><text x=\"844\" y=\"92.72\" font-size=\"9.2\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">por un miembro de</text><text x=\"844\" y=\"105.72\" font-size=\"9.2\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">la Comisión Informativa</text><rect x=\"20\" y=\"132\" width=\"312\" height=\"78\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"176\" y=\"154.72\" font-size=\"9.2\" text-anchor=\"middle\" fill=\"#4b5563\" font-weight=\"bold\">ENMIENDA</text><text x=\"176\" y=\"167.72\" font-size=\"9.2\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Modificación de un dictamen o</text><text x=\"176\" y=\"180.72\" font-size=\"9.2\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">proposición, por escrito antes</text><text x=\"176\" y=\"193.72\" font-size=\"9.2\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">de iniciarse la deliberación</text><rect x=\"336\" y=\"132\" width=\"312\" height=\"78\" rx=\"8\" fill=\"#eaf6ee\" stroke=\"#15803d\" stroke-width=\"1.4\"/><text x=\"492\" y=\"154.72\" font-size=\"9.2\" text-anchor=\"middle\" fill=\"#15803d\" font-weight=\"bold\">RUEGO</text><text x=\"492\" y=\"167.72\" font-size=\"9.2\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Formulación de una propuesta</text><text x=\"492\" y=\"180.72\" font-size=\"9.2\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">de actuación. No da lugar</text><text x=\"492\" y=\"193.72\" font-size=\"9.2\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">a votación</text><rect x=\"652\" y=\"132\" width=\"312\" height=\"78\" rx=\"8\" fill=\"#eaf6ee\" stroke=\"#15803d\" stroke-width=\"1.4\"/><text x=\"808\" y=\"154.72\" font-size=\"9.2\" text-anchor=\"middle\" fill=\"#15803d\" font-weight=\"bold\">PREGUNTA</text><text x=\"808\" y=\"167.72\" font-size=\"9.2\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Interrogante sobre una situación.</text><text x=\"808\" y=\"180.72\" font-size=\"9.2\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Por escrito con 24 HORAS,</text><text x=\"808\" y=\"193.72\" font-size=\"9.2\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">se contesta en la propia sesión</text><text x=\"490\" y=\"236\" font-size=\"10.6\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"bold\">En el orden del día de las sesiones ordinarias se incluirá SIEMPRE el punto de ruegos y preguntas (art. 82.4 ROF).</text></svg><details class=\"panel\" open><summary>Texto legal</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · ROF</span><p>Artículo 97. A los efectos del desarrollo de las sesiones y para definir el carácter de las intervenciones de los miembros de la Corporación, se utilizará la siguiente terminología:</p><p>1. Dictamen, es la propuesta sometida al Pleno tras el estudio del expediente por la Comisión Informativa. Contiene una parte expositiva y un acuerdo a adoptar.</p><p>2. Proposición, es la propuesta que se somete al Pleno relativa a un asunto incluido en el orden del día, que acompaña a la convocatoria, en virtud de lo dispuesto en el artículo 82.3 de este Reglamento. Contendrá una parte expositiva o justificación y un acuerdo, asimismo, a adoptar. No procederá entrar a debatir ni votar una proposición sin que previamente se haya ratificado, de acuerdo con lo dispuesto en el referido artículo 82.3, la inclusión del asunto en el orden del día.</p><p>3. Moción, es la propuesta que se somete directamente a conocimiento del Pleno al amparo de lo prevenido en el artículo 91.4 de este Reglamento. Podrá formularse por escrito u oralmente.</p><p>4. Voto particular, es la propuesta de modificación de un dictamen formulada por un miembro que forma parte de la Comisión Informativa. Deberá acompañar al dictamen desde el día siguiente a su aprobación por la Comisión.</p><p>5. Enmienda, es la propuesta de modificación de un dictamen o proposición presentada por cualquier miembro, mediante escrito presentado al Presidente antes de iniciarse la deliberación del asunto.</p><p>6. Ruego, es la formulación de una propuesta de actuación dirigida a algunos de los órganos de gobierno municipal. Los ruegos formulados en el seno del Pleno podrán ser debatidos, pero en ningún caso sometidos a votación. Pueden plantear ruegos todos los miembros de la Corporación, o los grupos municipales a través de sus portavoces. Los ruegos podrán ser efectuados oralmente o por escrito y serán debatidos generalmente en la sesión siguiente, sin perjuicio de que lo puedan ser en la misma sesión que se formulen si el Alcalde o Presidente lo estima conveniente.</p><p>7. Pregunta, es cualquier cuestión planteada a los órganos de gobierno en el seno del Pleno. Pueden plantear preguntas todos los miembros de la Corporación, o los grupos municipales a través de sus portavoces. Las preguntas planteadas oralmente en el transcurso de una sesión serán generalmente contestadas por su destinatario en la sesión siguiente, sin perjuicio de que el preguntado quiera darle respuesta inmediata. Las preguntas formuladas por escrito serán contestadas por su destinatario en la sesión siguiente, sin perjuicio de que el preguntado quiera darle respuesta inmediata. Las preguntas formuladas por escrito con veinticuatro horas de antelación, serán contestadas ordinariamente en la sesión o, por causas debidamente motivadas, en la siguiente.</p></div></div></details><details class=\"panel\"><summary>Disección</summary><div class=\"body\"><ul>\n<li><b>1. Dictamen:</b> propuesta sometida al Pleno <b>tras el estudio del expediente por la Comisión Informativa</b>. Tiene parte expositiva y acuerdo a adoptar.</li>\n<li><b>2. Proposición:</b> propuesta sobre asunto <b>incluido en el orden del día</b> en virtud del art. 82.3 —es decir, <b>no dictaminado</b>—. <b>No cabe debatirla ni votarla sin ratificar antes</b> su inclusión.</li>\n<li><b>3. Moción:</b> propuesta que se somete <b>directamente</b> al Pleno al amparo del art. 91.4. Puede formularse <b>por escrito u oralmente</b>.</li>\n<li><b>4. Voto particular:</b> propuesta de modificación de un <b>dictamen</b>, formulada por <b>un miembro de la Comisión Informativa</b>. Acompaña al dictamen <b>desde el día siguiente a su aprobación por la Comisión</b>.</li>\n<li><b>5. Enmienda:</b> propuesta de modificación de un dictamen o proposición presentada por <b>cualquier miembro</b>, por escrito al Presidente <b>antes de iniciarse la deliberación</b>.</li>\n<li><b>6. Ruego:</b> formulación de una propuesta de actuación. <b>No da lugar a votación.</b></li>\n<li><b>7. Pregunta:</b> interrogante sobre una situación. Si se formula <b>por escrito con veinticuatro horas de antelación</b>, se contesta ordinariamente <b>en la propia sesión</b>; si no, en la siguiente.</li>\n</ul></div></details><details class=\"panel\"><summary>En lenguaje llano</summary><div class=\"body\"><p>Son siete palabras que en el Pleno significan cosas distintas, y mezclarlas es el error más común. La diferencia está en de dónde viene la propuesta y quién la formula.</p></div></details><details class=\"panel\"><summary>¿Por qué existe?</summary><div class=\"body\"><div class=\"interp\"><span class=\"lbl\">Interpretación · aportación externa</span>Un reglamento de funcionamiento necesita un vocabulario preciso: si moción y proposición significaran lo mismo, no podría saberse si hace falta ratificar la urgencia antes de votar.</div></div></details><details class=\"panel\"><summary>Ejemplos</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Ejemplo 1</span>La Comisión de Hacienda estudia el presupuesto y eleva su <b>dictamen</b> al Pleno.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 2</span>Un concejal de esa misma comisión discrepa y presenta un <b>voto particular</b>, que acompaña al dictamen.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 3</span>Caso límite: un grupo quiere plantear un asunto que no está en el orden del día. No es enmienda ni proposición: es una <b>moción</b>, por la vía del art. 91.4.</div></div></details><details class=\"panel\"><summary>Trampas</summary><div class=\"body\"><div class=\"box warn\"><span class=\"lbl\">Cuidado</span>Tres pares que se confunden: <b>dictamen</b> (viene de comisión) frente a <b>proposición</b> (no dictaminada, en el orden del día) frente a <b>moción</b> (directamente al Pleno); <b>voto particular</b> (solo un miembro de la comisión, sobre un dictamen) frente a <b>enmienda</b> (cualquier miembro, antes de la deliberación); y <b>ruego</b> (no se vota) frente a <b>pregunta</b> (se contesta).</div></div></details><details class=\"panel\"><summary>Conexiones</summary><div class=\"body\"><p>Con los arts. 82.3 y 91.4, a los que el propio artículo remite.</p></div></details><details class=\"panel\"><summary>Anclaje memorístico</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Para retenerlo</span>De dónde viene: <b>comisión → dictamen</b>; <b>orden del día sin dictaminar → proposición</b>; <b>directo al Pleno → moción</b>.</div></div></details></section><section class=\"card art\" id=\"lbrl47\"><h2><span class=\"num\">LBRL 47</span> Mayorías necesarias para la adopción de acuerdos</h2><p class=\"ubic\">Ley 7/1985 ▸ Título V ▸ Capítulo I ▸ Sección 2.ª</p><div class=\"idea\">Regla general la mayoría simple; la absoluta solo en una lista tasada.</div><svg viewBox=\"0 0 960 272\" width=\"100%\" role=\"img\" aria-label=\"Diferencia entre mayoría simple y absoluta y los tres supuestos económicos que exigen mayoría absoluta\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"t1cfr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#4b5563\"/></marker><marker id=\"t1cfe\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#15803d\"/></marker><marker id=\"t1cfw\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#b45309\"/></marker></defs><text x=\"480\" y=\"24\" font-size=\"13\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"bold\">Mayoría simple y mayoría absoluta · art. 47 LBRL</text><rect x=\"20\" y=\"44\" width=\"450\" height=\"76\" rx=\"8\" fill=\"#eaf6ee\" stroke=\"#15803d\" stroke-width=\"1.4\"/><text x=\"245\" y=\"63.14\" font-size=\"10.4\" text-anchor=\"middle\" fill=\"#15803d\" font-weight=\"bold\">MAYORÍA SIMPLE · 47.1</text><text x=\"245\" y=\"78.14\" font-size=\"10.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">LA REGLA GENERAL</text><text x=\"245\" y=\"93.14\" font-size=\"10.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Votos afirmativos MÁS que los negativos</text><text x=\"245\" y=\"108.14\" font-size=\"10.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Se mide sobre los MIEMBROS PRESENTES</text><rect x=\"490\" y=\"44\" width=\"450\" height=\"76\" rx=\"8\" fill=\"#fdeceb\" stroke=\"#b91c1c\" stroke-width=\"1.4\"/><text x=\"715\" y=\"63.14\" font-size=\"10.4\" text-anchor=\"middle\" fill=\"#b91c1c\" font-weight=\"bold\">MAYORÍA ABSOLUTA · 47.2</text><text x=\"715\" y=\"78.14\" font-size=\"10.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">EXCEPCIÓN TASADA</text><text x=\"715\" y=\"93.14\" font-size=\"10.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Voto favorable de más de la mitad</text><text x=\"715\" y=\"108.14\" font-size=\"10.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">del NÚMERO LEGAL de miembros</text><rect x=\"20\" y=\"132\" width=\"920\" height=\"34\" rx=\"8\" fill=\"#e8efff\" stroke=\"#1d4ed8\" stroke-width=\"1.4\"/><text x=\"480\" y=\"152.85\" font-size=\"11\" text-anchor=\"middle\" fill=\"#1d4ed8\" font-weight=\"bold\">LAS TRES DE CONTENIDO ECONÓMICO QUE TE INTERESAN</text><rect x=\"20\" y=\"174\" width=\"300\" height=\"62\" rx=\"8\" fill=\"#fdeceb\" stroke=\"#b91c1c\" stroke-width=\"1.4\"/><text x=\"170\" y=\"194.36\" font-size=\"9.6\" text-anchor=\"middle\" fill=\"#b91c1c\" font-weight=\"bold\">j) CONCESIÓN de bienes o</text><text x=\"170\" y=\"208.36\" font-size=\"9.6\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">servicios por más de 5 años</text><text x=\"170\" y=\"222.36\" font-size=\"9.6\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">y cuantía superior al 20 %</text><rect x=\"340\" y=\"174\" width=\"300\" height=\"62\" rx=\"8\" fill=\"#fdeceb\" stroke=\"#b91c1c\" stroke-width=\"1.4\"/><text x=\"490\" y=\"194.36\" font-size=\"9.6\" text-anchor=\"middle\" fill=\"#b91c1c\" font-weight=\"bold\">l) OPERACIONES de crédito</text><text x=\"490\" y=\"208.36\" font-size=\"9.6\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">o financieras, quitas y esperas,</text><text x=\"490\" y=\"222.36\" font-size=\"9.6\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">cuando superen el 10 %</text><rect x=\"660\" y=\"174\" width=\"300\" height=\"62\" rx=\"8\" fill=\"#fdeceb\" stroke=\"#b91c1c\" stroke-width=\"1.4\"/><text x=\"810\" y=\"194.36\" font-size=\"9.6\" text-anchor=\"middle\" fill=\"#b91c1c\" font-weight=\"bold\">m) ENAJENACIÓN de bienes</text><text x=\"810\" y=\"208.36\" font-size=\"9.6\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">cuando la cuantía exceda</text><text x=\"810\" y=\"222.36\" font-size=\"9.6\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">del 20 % de los recursos</text><text x=\"480\" y=\"262\" font-size=\"11\" text-anchor=\"middle\" fill=\"#b91c1c\" font-weight=\"bold\">Simple se cuenta sobre PRESENTES; absoluta sobre el NÚMERO LEGAL. Ahí está la trampa.</text></svg><details class=\"panel\" open><summary>Texto legal</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LBRL</span><p>Artículo 47.</p><p>1. Los acuerdos de las corporaciones locales se adoptan, como regla general, por mayoría simple de los miembros presentes. Existe mayoría simple cuando los votos afirmativos son más que los negativos.</p><p>2. Se requiere el voto favorable de la mayoría absoluta del número legal de miembros de las corporaciones para la adopción de acuerdos en las siguientes materias:</p><p>a) Creación y supresión de municipios y alteración de términos municipales.</p><p>b) Creación, modificación y supresión de las entidades a que se refiere el artículo 45 de esta ley.</p><p>c) Aprobación de la delimitación del término municipal.</p><p>d) Alteración del nombre y de la capitalidad del municipio.</p><p>e) Adopción o modificación de su bandera, enseña o escudo.</p><p>f) Aprobación y modificación del reglamento orgánico propio de la corporación.</p><p>g) Creación, modificación o disolución de mancomunidades u otras organizaciones asociativas, así como la adhesión a las mismas y la aprobación y modificación de sus estatutos.</p><p>h) Transferencia de funciones o actividades a otras Administraciones públicas, así como la aceptación de las delegaciones o encomiendas de gestión realizadas por otras administraciones, salvo que por ley se impongan obligatoriamente.</p><p>i) Cesión por cualquier título del aprovechamiento de los bienes comunales.</p><p>j) Concesión de bienes o servicios por más de cinco años, siempre que su cuantía exceda del 20 por ciento de los recursos ordinarios del presupuesto.</p><p>k) Municipalización o provincialización de actividades en régimen de monopolio y aprobación de la forma concreta de gestión del servicio correspondiente.</p><p>l) Aprobaciones de operaciones financieras o de crédito y concesiones de quitas o esperas, cuando su importe supere el 10 por ciento de los recursos ordinarios de su presupuesto, así como las operaciones de crédito previstas en el artículo 158.5 de la Ley 39/1988, de 28 de diciembre, reguladora de las Haciendas Locales. ll) Los acuerdos que corresponda adoptar a la corporación en la tramitación de los instrumentos de planeamiento general previstos en la legislación urbanística.</p><p>m) Enajenación de bienes, cuando su cuantía exceda del 20 por ciento de los recursos ordinarios de su presupuesto.</p><p>n) Alteración de la calificación jurídica de los bienes demaniales o comunales. ñ) Cesión gratuita de bienes a otras Administraciones o instituciones públicas.</p><p>o) Las restantes determinadas por la ley.</p><p>3. Las normas relativas a adopción de acuerdos en los municipios señalados en el artículo 121 de esta ley, son las contenidas en el apartado 2 del artículo 123.</p></div></div></details><details class=\"panel\"><summary>Disección</summary><div class=\"body\"><ul>\n<li><b>Regla (47.1):</b> los acuerdos se adoptan <b>como regla general por mayoría simple de los miembros presentes</b>. «<b>Existe mayoría simple cuando los votos afirmativos son más que los negativos.</b>»</li>\n<li><b>Mayoría absoluta (47.2):</b> se requiere el voto favorable de la <b>mayoría absoluta del número legal de miembros</b> en las materias que el precepto enumera. Entre ellas, las de contenido económico:</li>\n<li><b>j)</b> <b>Concesión de bienes o servicios por más de cinco años</b>, siempre que su cuantía <b>exceda del 20 por ciento de los recursos ordinarios</b> del presupuesto.</li>\n<li><b>l)</b> <b>Operaciones financieras o de crédito y concesiones de quitas o esperas</b>, cuando su importe <b>supere el 10 por ciento de los recursos ordinarios</b>.</li>\n<li><b>m)</b> <b>Enajenación de bienes</b>, cuando su cuantía <b>exceda del 20 por ciento de los recursos ordinarios</b>.</li>\n<li><b>Y además:</b> alteración del término municipal, reglamento orgánico, mancomunidades, transferencia de funciones, bienes comunales, monopolio, planeamiento general, calificación jurídica de bienes demaniales o comunales, cesión gratuita de bienes y <b>las restantes determinadas por la ley</b>.</li>\n</ul></div></details><details class=\"panel\"><summary>En lenguaje llano</summary><div class=\"body\"><p>Casi todo se aprueba con que haya más síes que noes entre los que están. Solo un puñado de asuntos graves exige la mitad más uno de todos los concejales que debería haber, estén o no.</p></div></details><details class=\"panel\"><summary>¿Por qué existe?</summary><div class=\"body\"><div class=\"interp\"><span class=\"lbl\">Interpretación · aportación externa</span>Medir la mayoría simple sobre presentes permite gobernar con asistencia variable; medir la absoluta sobre el número legal protege los acuerdos que comprometen el patrimonio o la organización a largo plazo, impidiendo aprobarlos en una sesión con poca asistencia.</div></div></details><details class=\"panel\"><summary>Ejemplos</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Ejemplo 1</span>Corporación de trece, asisten nueve, votan seis a favor y tres en contra: mayoría simple, aprobado.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 2</span>Esa misma votación sobre una enajenación que excede del 20 % de los recursos: no basta, harían falta siete votos favorables.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 3</span>Caso límite: ocho a favor, uno en contra y cuatro abstenciones en una corporación de trece. Hay mayoría simple, pero <b>no</b> absoluta: faltaría un voto favorable.</div></div></details><details class=\"panel\"><summary>Trampas</summary><div class=\"body\"><div class=\"box warn\"><span class=\"lbl\">Cuidado</span>La trampa del tema: la <b>simple</b> se mide sobre <b>presentes</b>; la <b>absoluta</b>, sobre el <b>número legal</b>. Y la letra <b>o)</b> remite a «las restantes determinadas por la ley»: la lista del 47.2 no es cerrada hacia afuera.</div></div></details><details class=\"panel\"><summary>Conexiones</summary><div class=\"body\"><p>Con el art. 22 —atribuciones del Pleno— y, en lo económico, con el TRLHL y con la D. A. 2.ª LCSP.</p></div></details><details class=\"panel\"><summary>Anclaje memorístico</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Para retenerlo</span>Las tres económicas: <b>concesión j) · crédito l) · enajenación m)</b>. Y los porcentajes: <b>20 · 10 · 20</b>.</div></div></details></section><section class=\"card art\" id=\"lbrl22\"><h2><span class=\"num\">LBRL 22</span> Atribuciones del Pleno municipal</h2><p class=\"ubic\">Ley 7/1985 ▸ Título V ▸ Capítulo II «Organización» ▸ municipios de régimen común</p><div class=\"idea\">Lo que solo puede aprobar el Pleno, incluidos presupuesto y ordenanzas.</div><svg viewBox=\"0 0 990 412\" width=\"100%\" role=\"img\" aria-label=\"Cuadro de qué órgano aprueba cada acto económico de la entidad local y con qué mayoría\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"t1afrr2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#4b5563\"/></marker><marker id=\"t1afer2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#15803d\"/></marker><marker id=\"t1afwr2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#b45309\"/></marker></defs><text x=\"495\" y=\"24\" font-size=\"13\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"bold\">Quién aprueba qué, con qué mayoría y con qué documento</text><rect x=\"20\" y=\"38\" width=\"250\" height=\"30\" rx=\"8\" fill=\"#e8efff\" stroke=\"#1d4ed8\" stroke-width=\"1.4\"/><text x=\"145\" y=\"57\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#1d4ed8\" font-weight=\"bold\">Qué se aprueba</text><rect x=\"280\" y=\"38\" width=\"170\" height=\"30\" rx=\"8\" fill=\"#e8efff\" stroke=\"#1d4ed8\" stroke-width=\"1.4\"/><text x=\"365\" y=\"57\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#1d4ed8\" font-weight=\"bold\">Órgano</text><rect x=\"460\" y=\"38\" width=\"210\" height=\"30\" rx=\"8\" fill=\"#e8efff\" stroke=\"#1d4ed8\" stroke-width=\"1.4\"/><text x=\"565\" y=\"57\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#1d4ed8\" font-weight=\"bold\">Mayoría</text><rect x=\"680\" y=\"38\" width=\"290\" height=\"30\" rx=\"8\" fill=\"#e8efff\" stroke=\"#1d4ed8\" stroke-width=\"1.4\"/><text x=\"825\" y=\"57\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#1d4ed8\" font-weight=\"bold\">Precepto</text><rect x=\"20\" y=\"74\" width=\"250\" height=\"36\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"145\" y=\"89.29\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Presupuesto general</text><text x=\"145\" y=\"101.29\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">aprobación inicial</text><rect x=\"280\" y=\"74\" width=\"170\" height=\"36\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"365\" y=\"95.29\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">PLENO</text><rect x=\"460\" y=\"74\" width=\"210\" height=\"36\" rx=\"8\" fill=\"#eaf6ee\" stroke=\"#15803d\" stroke-width=\"1.4\"/><text x=\"565\" y=\"95.29\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Simple</text><rect x=\"680\" y=\"74\" width=\"290\" height=\"36\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"825\" y=\"95.29\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">LBRL 22.2.e) · TRLHL 168 y 169</text><rect x=\"20\" y=\"112\" width=\"250\" height=\"36\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"145\" y=\"127.29\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Crédito extraordinario</text><text x=\"145\" y=\"139.29\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">o suplemento de crédito</text><rect x=\"280\" y=\"112\" width=\"170\" height=\"36\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"365\" y=\"133.29\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">PLENO</text><rect x=\"460\" y=\"112\" width=\"210\" height=\"36\" rx=\"8\" fill=\"#eaf6ee\" stroke=\"#15803d\" stroke-width=\"1.4\"/><text x=\"565\" y=\"133.29\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Simple</text><rect x=\"680\" y=\"112\" width=\"290\" height=\"36\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"825\" y=\"127.29\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">TRLHL 177.2 · informe previo</text><text x=\"825\" y=\"139.29\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">de Intervención</text><rect x=\"20\" y=\"150\" width=\"250\" height=\"36\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"145\" y=\"165.29\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Ordenanza general de</text><text x=\"145\" y=\"177.29\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">subvenciones · bases</text><rect x=\"280\" y=\"150\" width=\"170\" height=\"36\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"365\" y=\"171.29\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">PLENO</text><rect x=\"460\" y=\"150\" width=\"210\" height=\"36\" rx=\"8\" fill=\"#eaf6ee\" stroke=\"#15803d\" stroke-width=\"1.4\"/><text x=\"565\" y=\"171.29\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Simple</text><rect x=\"680\" y=\"150\" width=\"290\" height=\"36\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"825\" y=\"171.29\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">LBRL 22.2.d) · LGS 17.2</text><rect x=\"20\" y=\"188\" width=\"250\" height=\"36\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"145\" y=\"203.29\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Contrato: VEC hasta el 10 % de</text><text x=\"145\" y=\"215.29\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">los recursos ordinarios y 6 M€</text><rect x=\"280\" y=\"188\" width=\"170\" height=\"36\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"365\" y=\"203.29\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">ALCALDE o</text><text x=\"365\" y=\"215.29\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">PRESIDENTE</text><rect x=\"460\" y=\"188\" width=\"210\" height=\"36\" rx=\"8\" fill=\"#eaf6ee\" stroke=\"#15803d\" stroke-width=\"1.4\"/><text x=\"565\" y=\"209.29\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">—</text><rect x=\"680\" y=\"188\" width=\"290\" height=\"36\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"825\" y=\"209.29\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">LCSP · D. A. 2.ª.1</text><rect x=\"20\" y=\"226\" width=\"250\" height=\"36\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"145\" y=\"241.29\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Contrato que excede de ese</text><text x=\"145\" y=\"253.29\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">límite por valor o duración</text><rect x=\"280\" y=\"226\" width=\"170\" height=\"36\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"365\" y=\"247.29\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">PLENO</text><rect x=\"460\" y=\"226\" width=\"210\" height=\"36\" rx=\"8\" fill=\"#eaf6ee\" stroke=\"#15803d\" stroke-width=\"1.4\"/><text x=\"565\" y=\"247.29\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Simple</text><rect x=\"680\" y=\"226\" width=\"290\" height=\"36\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"825\" y=\"247.29\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">LCSP · D. A. 2.ª.2</text><rect x=\"20\" y=\"264\" width=\"250\" height=\"36\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"145\" y=\"279.29\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Concesión de bienes o servicios</text><text x=\"145\" y=\"291.29\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">más de 5 años y más del 20 %</text><rect x=\"280\" y=\"264\" width=\"170\" height=\"36\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"365\" y=\"285.29\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">PLENO</text><rect x=\"460\" y=\"264\" width=\"210\" height=\"36\" rx=\"8\" fill=\"#fdeceb\" stroke=\"#b91c1c\" stroke-width=\"1.4\"/><text x=\"565\" y=\"285.29\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">ABSOLUTA</text><rect x=\"680\" y=\"264\" width=\"290\" height=\"36\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"825\" y=\"285.29\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">LBRL 47.2.j)</text><rect x=\"20\" y=\"302\" width=\"250\" height=\"36\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"145\" y=\"317.29\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Enajenación de bienes</text><text x=\"145\" y=\"329.29\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">que exceda del 20 % de recursos</text><rect x=\"280\" y=\"302\" width=\"170\" height=\"36\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"365\" y=\"323.29\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">PLENO</text><rect x=\"460\" y=\"302\" width=\"210\" height=\"36\" rx=\"8\" fill=\"#fdeceb\" stroke=\"#b91c1c\" stroke-width=\"1.4\"/><text x=\"565\" y=\"323.29\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">ABSOLUTA</text><rect x=\"680\" y=\"302\" width=\"290\" height=\"36\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"825\" y=\"323.29\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">LBRL 47.2.m)</text><rect x=\"20\" y=\"340\" width=\"250\" height=\"36\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"145\" y=\"355.29\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Operaciones de crédito</text><text x=\"145\" y=\"367.29\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">que superen el 10 % de recursos</text><rect x=\"280\" y=\"340\" width=\"170\" height=\"36\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"365\" y=\"361.29\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">PLENO</text><rect x=\"460\" y=\"340\" width=\"210\" height=\"36\" rx=\"8\" fill=\"#fdeceb\" stroke=\"#b91c1c\" stroke-width=\"1.4\"/><text x=\"565\" y=\"361.29\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">ABSOLUTA</text><rect x=\"680\" y=\"340\" width=\"290\" height=\"36\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"825\" y=\"361.29\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">LBRL 47.2.l)</text><text x=\"495\" y=\"400\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#b91c1c\" font-weight=\"bold\">Mayoría SIMPLE es la regla (47.1). La ABSOLUTA del número legal es excepción tasada, y estas tres son las de contenido económico.</text></svg><details class=\"panel\" open><summary>Texto legal</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LBRL</span><p>Artículo 22.</p><p>1. El Pleno, integrado por todos los Concejales, es presidido por el Alcalde.</p><p>2. Corresponden, en todo caso, al Pleno municipal en los Ayuntamientos, y a la Asamblea vecinal en el régimen de Concejo Abierto, las siguientes atribuciones:</p><p>a) El control y la fiscalización de los órganos de gobierno.</p><p>b) Los acuerdos relativos a la participación en organizaciones supramunicipales; alteración del término municipal; creación o supresión de municipios y de las entidades a que se refiere el artículo 45; creación de órganos desconcentrados; alteración de la capitalidad del municipio y el cambio de nombre de éste o de aquellas entidades y la adopción o modificación de su bandera, enseña o escudo.</p><p>c) La aprobación inicial del planeamiento general y la aprobación que ponga fin a la tramitación municipal de los planes y demás instrumentos de ordenación previstos en la legislación urbanística, así como los convenios que tengan por objeto la alteración de cualesquiera de dichos instrumentos.</p><p>d) La aprobación del reglamento orgánico y de las ordenanzas.</p><p>e) La determinación de los recursos propios de carácter tributario; la aprobación y modificación de los presupuestos, y la disposición de gastos en materia de su competencia y la aprobación de las cuentas; todo ello de acuerdo con lo dispuesto en la Ley Reguladora de las Haciendas Locales.</p><p>f) La aprobación de las formas de gestión de los servicios y de los expedientes de municipalización.</p><p>g) La aceptación de la delegación de competencias hecha por otras Administraciones públicas.</p><p>h) El planteamiento de conflictos de competencias a otras entidades locales y demás Administraciones públicas.</p><p>i) La aprobación de la plantilla de personal y de la relación de puestos de trabajo, la fijación de la cuantía de las retribuciones complementarias fijas y periódicas de los funcionarios y el número y régimen del personal eventual.</p><p>j) El ejercicio de acciones judiciales y administrativas y la defensa de la corporación en materias de competencia plenaria.</p><p>k) La declaración de lesividad de los actos del Ayuntamiento.</p><p>l) La alteración de la calificación jurídica de los bienes de dominio público.</p><p>m) La concertación de las operaciones de crédito cuya cuantía acumulada, dentro de cada ejercicio económico, exceda del 10 por ciento de los recursos ordinarios del Presupuesto -salvo las de tesorería, que le corresponderán cuando el importe acumulado de las operaciones vivas en cada momento supere el 15 por ciento de los ingresos corrientes liquidados en el ejercicio anterior- todo ello de conformidad con lo dispuesto en la Ley Reguladora de las Haciendas Locales.</p><p>n) (Derogada) ñ) La aprobación de los proyectos de obras y servicios cuando sea competente para su contratación o concesión, y cuando aún no estén previstos en los presupuestos.</p><p>o) (Derogada) p) Aquellas otras que deban corresponder al Pleno por exigir su aprobación una mayoría especial.</p><p>q) Las demás que expresamente le confieran las leyes.</p><p>3. Corresponde, igualmente, al Pleno la votación sobre la moción de censura al Alcalde y sobre la cuestión de confianza planteada por el mismo, que serán públicas y se realizarán mediante llamamiento nominal en todo caso, y se rigen por lo dispuesto en la legislación electoral general.</p><p>4. El Pleno puede delegar el ejercicio de sus atribuciones en el Alcalde y en la Junta de Gobierno Local, salvo las enunciadas en el apartado 2, párrafos a), b), c), d), e), f), g), h), i), l) y p), y en el apartado 3 de este artículo.</p></div></div></details><details class=\"panel\"><summary>Disección</summary><div class=\"body\"><ul>\n<li><b>Composición (22.1):</b> el Pleno lo integran <b>todos los Concejales</b> y lo preside el <b>Alcalde</b>.</li>\n<li><b>d) Ordenanzas:</b> «la aprobación del <b>reglamento orgánico y de las ordenanzas</b>». Aquí entra la <b>ordenanza general de subvenciones</b> del art. 17.2 LGS.</li>\n<li><b>e) Hacienda:</b> «la determinación de los <b>recursos propios de carácter tributario</b>; la <b>aprobación y modificación de los presupuestos</b>, y la <b>disposición de gastos</b> en materia de su competencia y la <b>aprobación de las cuentas</b>», de acuerdo con el TRLHL.</li>\n<li><b>a) Control:</b> el control y la fiscalización de los órganos de gobierno.</li>\n<li><b>i) Personal:</b> plantilla, relación de puestos de trabajo, retribuciones complementarias fijas y periódicas, y el personal eventual.</li>\n</ul></div></details><details class=\"panel\"><summary>En lenguaje llano</summary><div class=\"body\"><p>Hay cosas que no puede decidir el Alcalde por mucho que corran prisa: el presupuesto, las ordenanzas, los tributos y las cuentas son del Pleno.</p></div></details><details class=\"panel\"><summary>¿Por qué existe?</summary><div class=\"body\"><div class=\"interp\"><span class=\"lbl\">Interpretación · aportación externa</span>Reservar al Pleno el dinero y las normas es la traducción local de la separación entre quien decide el marco y quien ejecuta. El Alcalde gestiona; el Pleno fija las reglas y el presupuesto bajo el que gestiona.</div></div></details><details class=\"panel\"><summary>Ejemplos</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Ejemplo 1</span>La aprobación inicial del presupuesto de 2027: Pleno, letra e).</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 2</span>La ordenanza general de subvenciones que sirve de bases reguladoras: Pleno, letra d), en relación con el art. 17.2 LGS.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 3</span>Caso límite: un contrato de valor estimado dentro del límite del Alcalde. No es del Pleno, aunque suponga gasto: la D. A. 2.ª LCSP atribuye la competencia por cuantía.</div></div></details><details class=\"panel\"><summary>Trampas</summary><div class=\"body\"><div class=\"box warn\"><span class=\"lbl\">Cuidado</span>No confundas <b>atribución</b> con <b>mayoría</b>: que un asunto sea del Pleno no significa que exija mayoría absoluta. El presupuesto es del Pleno y se aprueba por <b>mayoría simple</b>.</div></div></details><details class=\"panel\"><summary>Conexiones</summary><div class=\"body\"><p>Con el art. 47 —mayorías—, con los arts. 168 y 169 TRLHL —presupuesto—, con el art. 177 TRLHL —modificaciones— y con la D. A. 2.ª LCSP.</p></div></details><details class=\"panel\"><summary>Anclaje memorístico</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Para retenerlo</span>Del Pleno: <b>normas, tributos, presupuesto y cuentas</b>.</div></div></details></section><section class=\"card art\" id=\"rof109\"><h2><span class=\"num\">ROF 109</span> Contenido del acta</h2><p class=\"ubic\">RD 2568/1986 ▸ Título III ▸ Capítulo I ▸ Sección 3.ª «De las actas»</p><div class=\"idea\">Diez elementos que el Secretario debe hacer constar en cada acta.</div><svg viewBox=\"0 0 980 252\" width=\"100%\" role=\"img\" aria-label=\"Recorrido desde la adopción del acuerdo hasta la certificación que se incorpora al expediente\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"t1efr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#4b5563\"/></marker><marker id=\"t1efe\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#15803d\"/></marker><marker id=\"t1efw\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#b45309\"/></marker></defs><text x=\"490\" y=\"24\" font-size=\"13\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"bold\">Del acuerdo al expediente: el recorrido del documento</text><rect x=\"20\" y=\"46\" width=\"164\" height=\"80\" rx=\"8\" fill=\"#e8efff\" stroke=\"#1d4ed8\" stroke-width=\"1.4\"/><text x=\"102\" y=\"75.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#1d4ed8\" font-weight=\"bold\">1 · SESIÓN</text><text x=\"102\" y=\"89.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Se adopta</text><text x=\"102\" y=\"103.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">el acuerdo</text><rect x=\"214\" y=\"46\" width=\"164\" height=\"80\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"296\" y=\"68.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#4b5563\" font-weight=\"bold\">2 · ACTA</text><text x=\"296\" y=\"82.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">La extiende</text><text x=\"296\" y=\"96.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">el SECRETARIO</text><text x=\"296\" y=\"110.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">art. 109 ROF</text><rect x=\"408\" y=\"46\" width=\"164\" height=\"80\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"490\" y=\"68.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#4b5563\" font-weight=\"bold\">3 · APROBACIÓN</text><text x=\"490\" y=\"82.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">por el Pleno</text><text x=\"490\" y=\"96.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">en la sesión</text><text x=\"490\" y=\"110.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">siguiente</text><rect x=\"602\" y=\"46\" width=\"164\" height=\"80\" rx=\"8\" fill=\"#eaf6ee\" stroke=\"#15803d\" stroke-width=\"1.4\"/><text x=\"684\" y=\"68.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#15803d\" font-weight=\"bold\">4 · LIBRO DE ACTAS</text><text x=\"684\" y=\"82.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Se transcribe, con</text><text x=\"684\" y=\"96.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">firmas del Alcalde</text><text x=\"684\" y=\"110.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">y del Secretario</text><rect x=\"796\" y=\"46\" width=\"164\" height=\"80\" rx=\"8\" fill=\"#fdeceb\" stroke=\"#b91c1c\" stroke-width=\"1.4\"/><text x=\"878\" y=\"68.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#b91c1c\" font-weight=\"bold\">5 · CERTIFICACIÓN</text><text x=\"878\" y=\"82.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">La expide el Secretario</text><text x=\"878\" y=\"96.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">con el V.º B.º</text><text x=\"878\" y=\"110.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">del Presidente</text><line x1=\"187\" y1=\"86\" x2=\"209\" y2=\"86\" stroke=\"#4b5563\" stroke-width=\"1.6\" marker-end=\"url(#t1efr)\"/><line x1=\"381\" y1=\"86\" x2=\"403\" y2=\"86\" stroke=\"#4b5563\" stroke-width=\"1.6\" marker-end=\"url(#t1efr)\"/><line x1=\"575\" y1=\"86\" x2=\"597\" y2=\"86\" stroke=\"#4b5563\" stroke-width=\"1.6\" marker-end=\"url(#t1efr)\"/><line x1=\"769\" y1=\"86\" x2=\"791\" y2=\"86\" stroke=\"#4b5563\" stroke-width=\"1.6\" marker-end=\"url(#t1efr)\"/><rect x=\"20\" y=\"140\" width=\"940\" height=\"44\" rx=\"8\" fill=\"#fdf3e3\" stroke=\"#b45309\" stroke-width=\"1.4\"/><text x=\"490\" y=\"158.07\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"bold\">ATAJO DEL ART. 206 ROF: pueden expedirse certificaciones ANTES de aprobarse el acta, siempre que se haga</text><text x=\"490\" y=\"173.07\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">LA ADVERTENCIA O SALVEDAD y a reserva de los términos que resulten de la aprobación</text><text x=\"490\" y=\"208\" font-size=\"10.6\" text-anchor=\"middle\" fill=\"#b91c1c\" font-weight=\"bold\">La certificación del acuerdo es el documento que se incorpora al expediente de gasto: sin ella, la aprobación no se acredita.</text><text x=\"490\" y=\"234\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#4b5563\" font-weight=\"normal\">Al aprobar el acta solo cabe subsanar errores materiales o de hecho: NUNCA modificar el fondo de los acuerdos.</text></svg><details class=\"panel\" open><summary>Texto legal</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · ROF</span><p>Artículo 109.</p><p>1. De cada sesión el Secretario extenderá acta en la que habrá de constar:</p><p>a) Lugar de la reunión, con expresión del nombre del Municipio y local en que se celebra.</p><p>b) Día, mes y año.</p><p>c) Hora en que comienza.</p><p>d) Nombre y apellidos del Presidente, de los miembros de la Corporación presentes, de los ausentes que se hubiesen excusado y de los que falten sin excusa.</p><p>e) Carácter ordinario o extraordinario de la sesión, y si se celebra en primera o en segunda convocatoria.</p><p>f) Asistencia del Secretario, o de quien legalmente le sustituya, y presencia del funcionario responsable de la Intervención, cuando concurra.</p><p>g) Asuntos que examinen, opiniones sintetizadas de los grupos o miembros de la Corporación que hubiesen intervenido en las deliberaciones e incidencias de éstas.</p><p>h) Votaciones que se verifiquen y en el caso de las nominales el sentido en que cada miembro emita su voto. En las votaciones ordinarias se hará constar el número de votos afirmativos, de los negativos y de las abstenciones. Se hará constar nominalmente el sentido del voto cuando así lo pidan los interesados.</p><p>i) Parte dispositiva de los acuerdos que se adopten.</p><p>j) Hora en que el Presidente levante la sesión.</p><p>2. De no celebrarse sesión por falta de asistentes, u otro motivo, el Secretario suplirá el acta con una diligencia autorizada con su firma, en la que consigne la causa y nombres de los concurrentes y de los que hubieren excusado su asistencia.</p></div></div></details><details class=\"panel\"><summary>Disección</summary><div class=\"body\"><ul>\n<li><b>Quién la extiende (109.1):</b> «De cada sesión <b>el Secretario extenderá acta</b>».</li>\n<li><b>a)</b> Lugar, con el nombre del municipio y el local. <b>b)</b> Día, mes y año. <b>c)</b> <b>Hora en que comienza</b>.</li>\n<li><b>d)</b> Nombre y apellidos del Presidente, de los miembros <b>presentes</b>, de los <b>ausentes que se excusaron</b> y de los que <b>faltan sin excusa</b>.</li>\n<li><b>e)</b> Carácter <b>ordinario o extraordinario</b> y si es en <b>primera o segunda convocatoria</b>.</li>\n<li><b>f)</b> Asistencia del <b>Secretario</b> y presencia del responsable de la <b>Intervención</b> cuando concurra.</li>\n<li><b>g)</b> Asuntos examinados y <b>opiniones sintetizadas</b> de los grupos o miembros intervinientes.</li>\n<li><b>h)</b> <b>Votaciones</b>: en las nominales, el sentido del voto de cada miembro; en las ordinarias, el <b>número de afirmativos, negativos y abstenciones</b>. Se hará constar nominalmente <b>cuando lo pidan los interesados</b>.</li>\n<li><b>i)</b> <b>Parte dispositiva</b> de los acuerdos. <b>j)</b> <b>Hora en que se levanta</b> la sesión.</li>\n<li><b>Si no se celebra (109.2):</b> el Secretario la suple con una <b>diligencia autorizada con su firma</b> que consigne la causa y los nombres de los concurrentes.</li>\n</ul></div></details><details class=\"panel\"><summary>En lenguaje llano</summary><div class=\"body\"><p>El acta no es un resumen libre: tiene diez contenidos obligados. Y las opiniones van sintetizadas, no transcritas palabra por palabra.</p></div></details><details class=\"panel\"><summary>¿Por qué existe?</summary><div class=\"body\"><div class=\"interp\"><span class=\"lbl\">Interpretación · aportación externa</span>El acta es la prueba de que el acuerdo existe y de cómo se adoptó. Sin la hora, el quórum y el detalle de la votación no podría comprobarse después si la mayoría exigida se alcanzó.</div></div></details><details class=\"panel\"><summary>Ejemplos</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Ejemplo 1</span>Un acuerdo que exige mayoría absoluta: el acta debe permitir contar los votos afirmativos.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 2</span>Un concejal pide que conste nominalmente su voto en una votación ordinaria: procede, por la letra h).</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 3</span>Caso límite: no se celebra la sesión por falta de asistentes. No hay acta, hay <b>diligencia</b> firmada por el Secretario.</div></div></details><details class=\"panel\"><summary>Trampas</summary><div class=\"body\"><div class=\"box warn\"><span class=\"lbl\">Cuidado</span>Las letras <b>c)</b> y <b>j)</b> son las dos horas: <b>la de comienzo y la de levantamiento</b>. Y las opiniones se recogen <b>sintetizadas</b>, no literales.</div></div></details><details class=\"panel\"><summary>Conexiones</summary><div class=\"body\"><p>Con el art. 110 —Libro de Actas— y con el art. 91.1 —aprobación del acta—.</p></div></details><details class=\"panel\"><summary>Anclaje memorístico</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Para retenerlo</span>Dos horas (<b>empieza y acaba</b>), tres listas de asistentes (<b>presentes, excusados, sin excusa</b>) y el recuento de la votación.</div></div></details></section><section class=\"card art\" id=\"rof110\"><h2><span class=\"num\">ROF 110</span> Transcripción al Libro de Actas</h2><p class=\"ubic\">RD 2568/1986 ▸ Título III ▸ Capítulo I ▸ Sección 3.ª</p><div class=\"idea\">Aprobada el acta, se transcribe al Libro con dos firmas.</div><svg viewBox=\"0 0 980 252\" width=\"100%\" role=\"img\" aria-label=\"Recorrido desde la adopción del acuerdo hasta la certificación que se incorpora al expediente\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"t1efrr2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#4b5563\"/></marker><marker id=\"t1efer2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#15803d\"/></marker><marker id=\"t1efwr2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#b45309\"/></marker></defs><text x=\"490\" y=\"24\" font-size=\"13\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"bold\">Del acuerdo al expediente: el recorrido del documento</text><rect x=\"20\" y=\"46\" width=\"164\" height=\"80\" rx=\"8\" fill=\"#e8efff\" stroke=\"#1d4ed8\" stroke-width=\"1.4\"/><text x=\"102\" y=\"75.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#1d4ed8\" font-weight=\"bold\">1 · SESIÓN</text><text x=\"102\" y=\"89.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Se adopta</text><text x=\"102\" y=\"103.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">el acuerdo</text><rect x=\"214\" y=\"46\" width=\"164\" height=\"80\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"296\" y=\"68.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#4b5563\" font-weight=\"bold\">2 · ACTA</text><text x=\"296\" y=\"82.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">La extiende</text><text x=\"296\" y=\"96.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">el SECRETARIO</text><text x=\"296\" y=\"110.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">art. 109 ROF</text><rect x=\"408\" y=\"46\" width=\"164\" height=\"80\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"490\" y=\"68.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#4b5563\" font-weight=\"bold\">3 · APROBACIÓN</text><text x=\"490\" y=\"82.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">por el Pleno</text><text x=\"490\" y=\"96.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">en la sesión</text><text x=\"490\" y=\"110.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">siguiente</text><rect x=\"602\" y=\"46\" width=\"164\" height=\"80\" rx=\"8\" fill=\"#eaf6ee\" stroke=\"#15803d\" stroke-width=\"1.4\"/><text x=\"684\" y=\"68.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#15803d\" font-weight=\"bold\">4 · LIBRO DE ACTAS</text><text x=\"684\" y=\"82.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Se transcribe, con</text><text x=\"684\" y=\"96.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">firmas del Alcalde</text><text x=\"684\" y=\"110.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">y del Secretario</text><rect x=\"796\" y=\"46\" width=\"164\" height=\"80\" rx=\"8\" fill=\"#fdeceb\" stroke=\"#b91c1c\" stroke-width=\"1.4\"/><text x=\"878\" y=\"68.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#b91c1c\" font-weight=\"bold\">5 · CERTIFICACIÓN</text><text x=\"878\" y=\"82.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">La expide el Secretario</text><text x=\"878\" y=\"96.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">con el V.º B.º</text><text x=\"878\" y=\"110.255\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">del Presidente</text><line x1=\"187\" y1=\"86\" x2=\"209\" y2=\"86\" stroke=\"#4b5563\" stroke-width=\"1.6\" marker-end=\"url(#t1efrr2)\"/><line x1=\"381\" y1=\"86\" x2=\"403\" y2=\"86\" stroke=\"#4b5563\" stroke-width=\"1.6\" marker-end=\"url(#t1efrr2)\"/><line x1=\"575\" y1=\"86\" x2=\"597\" y2=\"86\" stroke=\"#4b5563\" stroke-width=\"1.6\" marker-end=\"url(#t1efrr2)\"/><line x1=\"769\" y1=\"86\" x2=\"791\" y2=\"86\" stroke=\"#4b5563\" stroke-width=\"1.6\" marker-end=\"url(#t1efrr2)\"/><rect x=\"20\" y=\"140\" width=\"940\" height=\"44\" rx=\"8\" fill=\"#fdf3e3\" stroke=\"#b45309\" stroke-width=\"1.4\"/><text x=\"490\" y=\"158.07\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"bold\">ATAJO DEL ART. 206 ROF: pueden expedirse certificaciones ANTES de aprobarse el acta, siempre que se haga</text><text x=\"490\" y=\"173.07\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">LA ADVERTENCIA O SALVEDAD y a reserva de los términos que resulten de la aprobación</text><text x=\"490\" y=\"208\" font-size=\"10.6\" text-anchor=\"middle\" fill=\"#b91c1c\" font-weight=\"bold\">La certificación del acuerdo es el documento que se incorpora al expediente de gasto: sin ella, la aprobación no se acredita.</text><text x=\"490\" y=\"234\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#4b5563\" font-weight=\"normal\">Al aprobar el acta solo cabe subsanar errores materiales o de hecho: NUNCA modificar el fondo de los acuerdos.</text></svg><details class=\"panel\" open><summary>Texto legal</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · ROF</span><p>Art

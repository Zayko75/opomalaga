<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tema 1 · Los órganos colegiados locales</title>
<style>

/* ═══════════════════════════════════════════════════════════════
   SISTEMA DE DISEÑO · "Académico Gamificado" · Bloque II
   Temas 8, 9 y 10 · Auxiliar Administrativo
   ═══════════════════════════════════════════════════════════════ */
:root{
  --z:1;              /* A+ / A− · solo agranda el cuerpo de la página */

  --bg:#faf9f7;
  --bg-grad:radial-gradient(1100px 560px at 12% -8%, #ede9ff 0%, transparent 55%),
            radial-gradient(850px 460px at 96% 0%, #dcf5ee 0%, transparent 50%);
  --surface:#ffffff;
  --surface-2:#f4f3f0;
  --surface-3:#eceae5;
  --line:#e6e3dc;
  --line-strong:#d4d0c7;

  --ink:#15161c;
  --ink-2:#5d616e;
  --ink-3:#8b8f9c;

  --brand:#5b3df5;
  --brand-2:#7c5cff;
  --brand-soft:#efeaff;
  --brand-ring:rgba(91,61,245,.18);

  --legal:#4338ca;  --legal-bg:#eeecff;
  --ej:#059669;     --ej-bg:#e4f7f0;
  --warn:#c2690a;   --warn-bg:#fdf1de;
  --exc:#dc2626;    --exc-bg:#ffeceb;

  --ok:#16a34a; --ok-soft:#e7f7ec;
  --mid:#eab308; --mid-soft:#fdf6dd;
  --off:#a1a1aa; --off-soft:#f1f1f3;

  --sh-1:0 1px 2px rgba(20,20,30,.04), 0 2px 8px rgba(20,20,30,.04);
  --sh-2:0 2px 6px rgba(20,20,30,.05), 0 12px 28px rgba(20,20,30,.07);
  --sh-3:0 8px 20px rgba(91,61,245,.13), 0 24px 56px rgba(20,20,30,.10);
  --sh-glow:0 0 0 4px var(--brand-ring);

  --r-sm:9px; --r-md:14px; --r-lg:20px; --r-full:999px;

  --f-display:"Segoe UI Variable Display",system-ui,-apple-system,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-legal:ui-serif,Georgia,Cambria,"Times New Roman",serif;
  --f-mono:ui-monospace,"SF Mono","Cascadia Mono","Segoe UI Mono",Menlo,monospace;

  --t-h1:clamp(1.02rem,.95rem + .3vw,1.2rem);
  --t-h2:clamp(1.2rem,1.05rem + .6vw,1.55rem);
  --t-h3:clamp(1rem,.95rem + .25vw,1.12rem);
  --t-sm:.86rem;
  --t-xs:.75rem;

  --e-out:cubic-bezier(.22,1,.36,1);
  --e-spring:cubic-bezier(.34,1.56,.64,1);

  /* ── Compatibilidad con SVG y contenido generado ── */
  --panel:var(--surface);
  --ink2:var(--ink-2);
  --acc:var(--brand);
  --acc-soft:var(--brand-soft);
  --g:var(--ok); --y:var(--mid); --r:var(--exc);
}

html[data-theme="dark"]{
  --bg:#0a0b0f;
  --bg-grad:radial-gradient(1100px 560px at 12% -8%, #1c1740 0%, transparent 55%),
            radial-gradient(850px 460px at 96% 0%, #08302b 0%, transparent 50%);
  --surface:#13151b;
  --surface-2:#1a1d25;
  --surface-3:#232733;
  --line:#262a34;
  --line-strong:#343947;

  --ink:#eceef4;
  --ink-2:#9ba2b3;
  --ink-3:#6e7585;

  --brand:#8b6dff;
  --brand-2:#a78bff;
  --brand-soft:#1e1a3d;
  --brand-ring:rgba(139,109,255,.22);

  --legal:#a5b4fc; --legal-bg:#191b3a;
  --ej:#34d399;    --ej-bg:#0c2a24;
  --warn:#fbbf24;  --warn-bg:#2e2110;
  --exc:#fb7185;   --exc-bg:#331119;

  --ok:#4ade80; --ok-soft:#0e2a19;
  --mid:#facc15; --mid-soft:#2c2610;
  --off:#5b6070; --off-soft:#1c1f27;

  --sh-1:0 1px 2px rgba(0,0,0,.3), 0 2px 8px rgba(0,0,0,.25);
  --sh-2:0 2px 6px rgba(0,0,0,.35), 0 12px 28px rgba(0,0,0,.4);
  --sh-3:0 8px 20px rgba(139,109,255,.2), 0 24px 56px rgba(0,0,0,.5);
}

*,*::before,*::after{box-sizing:border-box}
html{font-size:16px;scroll-behavior:smooth}
/* A+ y A− agrandan o reducen únicamente el cuerpo: el texto de los
   artículos, las tablas y los diagramas. La cabecera, el índice lateral
   y los botones conservan su tamaño para no descolocar la pantalla. */
main{zoom:var(--z)}
@media print{main{zoom:1}}
body{
  margin:0;background:var(--bg);background-image:var(--bg-grad);
  background-attachment:fixed;background-repeat:no-repeat;
  color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.68;
  -webkit-font-smoothing:antialiased;
  transition:background-color .5s var(--e-out),color .3s;
}
::selection{background:var(--brand);color:#fff}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{font-family:var(--f-display);letter-spacing:-.022em;line-height:1.2}
.num{font-variant-numeric:tabular-nums}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:99px;border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3)}

/* ═══ HEADER ═══ */
header.top{
  position:sticky;top:0;z-index:60;
  background:color-mix(in srgb,var(--surface) 80%,transparent);
  backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);
  border-bottom:1px solid var(--line);
}
/* El título ocupa su propia línea, encima de los botones. Antes competía
   por el ancho con la barra de herramientas y acababa desmigado en una
   columna de una palabra por línea. */
.top-in{max-width:1280px;margin:0 auto;padding:.6rem 1.1rem .55rem;display:flex;flex-direction:column;gap:.5rem;align-items:stretch}
.brandwrap{display:flex;align-items:center;gap:.65rem;min-width:0;width:100%}
.mark{
  width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;
  font-weight:800;font-size:.8rem;letter-spacing:-.02em;text-decoration:none;
  box-shadow:0 4px 14px var(--brand-ring);
  transition:transform .3s var(--e-spring),box-shadow .3s;
}
.mark:hover{transform:rotate(-8deg) scale(1.08);box-shadow:var(--sh-3);text-decoration:none}
.top h1{font-size:var(--t-h1);margin:0;font-weight:800;line-height:1.25;min-width:0;flex:1 1 auto}
/* como mucho dos líneas: si no cabe, se recorta con puntos suspensivos */
.top h1 .tit{
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;text-wrap:balance;
}
.top h1 .sub{display:block;font-size:var(--t-xs);color:var(--ink-2);font-weight:500;letter-spacing:0;
  margin-top:.1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tools{margin-left:0;display:flex;gap:.4rem;flex-wrap:wrap;align-items:center;width:100%}

button,select,input[type=search]{
  font:inherit;font-size:var(--t-sm);font-weight:600;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:var(--r-sm);padding:.4rem .72rem;cursor:pointer;
  position:relative;overflow:hidden;
  transition:transform .18s var(--e-spring),border-color .2s,background .2s,box-shadow .2s,color .2s;
}
button:hover{transform:translateY(-1.5px);border-color:var(--brand);box-shadow:var(--sh-1)}
button:active{transform:translateY(0) scale(.97)}
button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible{outline:none;box-shadow:var(--sh-glow)}
input[type=search]{min-width:190px;cursor:text;font-weight:500}
input[type=search]:focus{border-color:var(--brand)}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--surface-2);padding:2px;gap:2px}
.seg button{border:0;border-radius:calc(var(--r-sm) - 2px);padding:.32rem .68rem;background:transparent;box-shadow:none}
.seg button:hover{transform:none;background:var(--surface)}
.seg button[aria-pressed="true"]{background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;box-shadow:0 2px 8px var(--brand-ring)}

.ripple{position:absolute;border-radius:50%;transform:scale(0);background:currentColor;opacity:.25;animation:rip .55s linear;pointer-events:none}
@keyframes rip{to{transform:scale(3.4);opacity:0}}

.progress{position:absolute;left:0;bottom:-1px;height:2.5px;width:0;
  background:linear-gradient(90deg,var(--brand),var(--legal),var(--ej));transition:width .1s linear}

/* ═══ LAYOUT ═══ */
.layout{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:270px 1fr;gap:1.8rem;padding:1.4rem 1.1rem 5rem}
main{min-width:0}

/* ═══ SIDEBAR ═══ */
nav.side{
  position:sticky;top:76px;align-self:start;max-height:calc(100vh - 96px);overflow:auto;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:.85rem;box-shadow:var(--sh-1);
}
nav.side h2{font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);
  margin:.5rem .4rem .5rem;font-weight:800}
nav.side h2:first-child{margin-top:.1rem}
nav.side a{
  display:flex;align-items:baseline;gap:.5rem;padding:.36rem .55rem;border-radius:var(--r-sm);
  text-decoration:none;color:var(--ink-2);font-size:var(--t-sm);font-weight:500;
  position:relative;transition:background .22s,color .22s,transform .22s var(--e-out);
}
nav.side a:hover{background:var(--surface-2);color:var(--ink);transform:translateX(3px);text-decoration:none}
nav.side a.on{background:var(--brand-soft);color:var(--brand);font-weight:700}
nav.side a.on::before{content:"";position:absolute;left:-.85rem;top:20%;bottom:20%;width:3px;
  border-radius:0 3px 3px 0;background:var(--brand)}
nav.side a b{color:var(--ink-3);font-weight:800;font-size:var(--t-xs);font-variant-numeric:tabular-nums;flex:none;min-width:1.9em}
nav.side a.on b{color:var(--brand)}
.navtoggle{display:none}

/* ═══ TARJETAS ═══ */
section.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:1.35rem 1.5rem;margin-bottom:1.1rem;box-shadow:var(--sh-1);
  transition:box-shadow .3s var(--e-out),border-color .3s;
}
section.card:hover{box-shadow:var(--sh-2)}
section.card>h2{
  margin:0 0 1rem;font-size:var(--t-h2);font-weight:800;
  display:flex;align-items:center;gap:.6rem;
}
section.card>h2::before{
  content:"";width:4px;height:1.05em;border-radius:99px;flex:none;
  background:linear-gradient(180deg,var(--brand),var(--brand-2));
}

/* ═══ ARTÍCULO ═══ */
.art{scroll-margin-top:86px;padding-top:.4rem}
.art + .art{margin-top:1.6rem;padding-top:1.6rem;border-top:1px dashed var(--line)}
.art h2{display:flex;flex-wrap:wrap;gap:.5rem;align-items:baseline;font-size:var(--t-h3);
  margin:0 0 .25rem;font-weight:800;letter-spacing:-.015em}
.art h2 .num{
  color:var(--brand);font-weight:800;font-family:var(--f-display);
  background:var(--brand-soft);padding:.1rem .5rem;border-radius:var(--r-sm);
  font-size:.92em;letter-spacing:-.02em;
}
.ubic{font-size:var(--t-xs);color:var(--ink-3);margin:0 0 .8rem;font-weight:600;
  letter-spacing:.03em;text-transform:uppercase}

/* ═══ IDEA CLAVE ═══ */
.idea{
  background:linear-gradient(100deg,var(--brand-soft),color-mix(in srgb,var(--brand-soft) 40%,transparent));
  border-left:4px solid var(--brand);border-radius:0 var(--r-md) var(--r-md) 0;
  padding:.75rem 1rem;font-weight:650;margin:.7rem 0 1rem;position:relative;
  font-size:.97rem;line-height:1.55;
}

/* ═══ ACORDEÓN ═══ */
details.panel{
  border:1px solid var(--line);border-radius:var(--r-md);margin:.6rem 0;
  background:var(--surface);overflow:hidden;
  transition:border-color .25s,box-shadow .25s,background .25s;
}
details.panel:hover{border-color:var(--line-strong)}
details.panel[open]{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-ring)}
details.panel>summary{
  cursor:pointer;padding:.62rem .9rem;font-weight:700;font-size:.93rem;
  list-style:none;display:flex;align-items:center;gap:.55rem;
  transition:background .2s,color .2s;
}
details.panel>summary:hover{background:var(--surface-2)}
details.panel[open]>summary{background:var(--brand-soft);color:var(--brand)}
details.panel>summary::-webkit-details-marker{display:none}
details.panel>summary::before{
  content:"";width:16px;height:16px;flex:none;border-radius:5px;
  background:var(--brand-soft);position:relative;transition:transform .3s var(--e-spring),background .25s;
}
details.panel>summary::after{
  content:"";position:absolute;width:0;height:0;margin-left:5px;
  border:4px solid transparent;border-left-color:var(--brand);
  transition:transform .3s var(--e-spring);
}
details.panel[open]>summary::before{background:var(--surface)}
details.panel[open]>summary::after{transform:rotate(90deg) translateX(-1px)}
details.panel .body{padding:.3rem 1rem 1rem;font-size:.95rem;animation:slidein .35s var(--e-out)}
@keyframes slidein{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* ═══ TEXTO LEGAL ═══ */
.legal{
  background:var(--legal-bg);border-left:4px solid var(--legal);
  border-radius:0 var(--r-md) var(--r-md) 0;padding:.85rem 1.05rem;
  font-family:var(--f-legal);font-size:.95rem;line-height:1.7;
}
.legal p{margin:.45rem 0}
.legal .lbl{
  font-family:var(--f-body);font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;
  color:var(--legal);font-weight:800;display:block;margin-bottom:.4rem;
}

/* ═══ CAJAS SEMÁNTICAS ═══ */
.box{
  border-left:4px solid var(--line);border-radius:0 var(--r-md) var(--r-md) 0;
  padding:.72rem .95rem;margin:.65rem 0;font-size:.94rem;
  transition:transform .25s var(--e-out),box-shadow .25s;
}
.box:hover{transform:translateX(3px);box-shadow:var(--sh-1)}
.box.ej{background:var(--ej-bg);border-color:var(--ej)}
.box.warn{background:var(--warn-bg);border-color:var(--warn)}
.box.exc{background:var(--exc-bg);border-color:var(--exc)}
.box .lbl{font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;font-weight:800;
  display:block;margin-bottom:.3rem}
.box.ej .lbl{color:var(--ej)}
.box.warn .lbl{color:var(--warn)}
.box.exc .lbl{color:var(--exc)}

.interp{
  border:1px dashed var(--warn);background:color-mix(in srgb,var(--warn-bg) 45%,transparent);
  border-radius:var(--r-md);padding:.65rem .9rem;font-size:.9rem;margin:.6rem 0;
}
.interp .lbl{font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;color:var(--warn);font-weight:800;display:block}

/* ═══ TABLAS ═══ */
table{width:100%;border-collapse:separate;border-spacing:0;font-size:.9rem;margin:.7rem 0;
  border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
th,td{padding:.5rem .68rem;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
td + td, th + th{border-left:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th{background:var(--surface-2);font-size:var(--t-xs);font-weight:800;letter-spacing:.05em;
  text-transform:uppercase;color:var(--ink-2);position:sticky;top:0}
tbody tr{transition:background .18s}
tbody tr:nth-child(even){background:color-mix(in srgb,var(--surface-2) 45%,transparent)}
tbody tr:hover{background:var(--brand-soft)}
th.sortable{cursor:pointer;user-select:none;transition:color .2s,background .2s}
th.sortable:hover{color:var(--brand);background:var(--brand-soft)}
th.sortable::after{content:" ⇅";color:var(--ink-3);font-size:.7rem}

ul,ol{margin:.5rem 0 .5rem 1.2rem;padding:0}
li{margin:.26rem 0}
li::marker{color:var(--brand);font-weight:700}

/* ═══ TOOLTIPS ═══ */
.t{border-bottom:1.5px dotted var(--brand);cursor:help;position:relative;
  transition:background .2s,color .2s}
.t:hover{background:var(--brand-soft);color:var(--brand);border-radius:3px}
#tip{
  position:fixed;z-index:99;max-width:330px;background:var(--ink);color:var(--bg);
  padding:.6rem .78rem;border-radius:var(--r-md);font-size:.82rem;line-height:1.5;
  display:none;box-shadow:0 8px 30px rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.08);
}
html[data-theme="dark"] #tip{background:#f0f1f5;color:#15161c}

/* ═══ FLECHAS DE DIAGRAMA ═══
   Un <path> con stroke pero sin fill toma el valor inicial (negro) y el
   navegador cierra el trazo implícitamente: aparece un triángulo relleno
   entre sus extremos. Forzamos fill:none para dejar solo la línea + la
   punta del <marker>, que sí lleva su color. */
svg path[stroke]:not([fill]){fill:none}
svg polyline:not([fill]){fill:none}
svg line{fill:none}

/* ═══ SVG ═══ */
svg{max-width:100%;height:auto;display:block;margin:.9rem auto}
svg text{font-family:var(--f-body)}

/* ═══ BUSCADOR ═══ */
mark.hit{background:linear-gradient(180deg,transparent 55%,#ffe066 55%);color:inherit;
  border-radius:2px;padding:0 1px;font-weight:600}
html[data-theme="dark"] mark.hit{background:linear-gradient(180deg,transparent 55%,#8a6d00 55%);color:#fff}

/* ═══ UTILIDADES ═══ */
.hide{display:none !important}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.small{font-size:var(--t-sm);color:var(--ink-2)}
.chip{
  display:inline-block;font-size:var(--t-xs);padding:.16rem .55rem;border-radius:var(--r-full);
  background:var(--brand-soft);color:var(--brand);font-weight:800;letter-spacing:.02em;
}

/* ═══ HUECOS RELLENABLES ═══ */
.gap{
  display:inline-block;min-width:5.5em;border-bottom:2px solid var(--brand);
  text-align:center;font-weight:700;color:transparent;cursor:pointer;
  transition:color .3s,background .3s;
}
.gap.on,.gap:hover{color:var(--brand);background:var(--brand-soft);border-radius:4px 4px 0 0}

/* ═══ REVELAR SOLUCIÓN ═══ */
.revelar{
  background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;border-color:transparent;
  font-weight:700;
}
.revelar:hover{box-shadow:var(--sh-3)}
.sol{
  margin-top:.7rem;padding:.8rem 1rem;border-radius:var(--r-md);
  background:var(--ej-bg);border-left:4px solid var(--ej);
  animation:slidein .4s var(--e-out);
}

/* ═══ TEST ═══ */
.opt{
  display:block;padding:.55rem .85rem;margin:.35rem 0;border:1.5px solid var(--line);
  border-radius:var(--r-md);cursor:pointer;background:var(--surface);font-size:.94rem;
  transition:border-color .22s,background .22s,transform .22s var(--e-out);
}
.opt:hover{border-color:var(--brand);background:var(--brand-soft);transform:translateX(4px)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft);font-weight:650}
.opt.ko{border-color:var(--exc);background:var(--exc-bg)}
.opt input{margin-right:.5rem;accent-color:var(--brand)}

#tscore,#semres{
  font-family:var(--f-display);font-weight:800;font-size:1.15rem;letter-spacing:-.02em;
}

/* ═══════════════════════════════════════════════════════════════
   FLASHCARDS 3D · mazo con giro, vuelo de salida y sheen
   ═══════════════════════════════════════════════════════════════ */
#flash{--fc-e:cubic-bezier(.2,.8,.25,1);--fc-h:250px}

/* — Escena — */
.fc-stage{
  perspective:1400px;perspective-origin:50% 45%;
  padding:.4rem 0 .2rem;position:relative;
}
.fc-deck{position:relative;height:var(--fc-h);will-change:transform}

/* — Cartas fantasma del mazo — */
.fc-ghost{
  position:absolute;inset:0;border-radius:var(--r-lg);
  background:var(--surface);border:1px solid var(--line);
  transition:transform .5s var(--fc-e),opacity .5s var(--fc-e);
}
.fc-ghost.g1{transform:translateY(9px) scale(.972);opacity:.75}
.fc-ghost.g2{transform:translateY(18px) scale(.944);opacity:.45}
.fc-deck.empty .fc-ghost{opacity:0;transform:translateY(26px) scale(.9)}

/* — Elevación durante el giro — */
.fc-lift{position:absolute;inset:0;transform-style:preserve-3d}
.fc-lift.lift{animation:fcLift .78s var(--fc-e)}
@keyframes fcLift{
  0%,100%{transform:scale(1) translateY(0)}
  45%{transform:scale(1.055) translateY(-16px)}
}
.fc-lift.out-ok{animation:fcOut .5s cubic-bezier(.5,0,.75,0) forwards}
.fc-lift.out-ko{animation:fcOutKo .5s cubic-bezier(.5,0,.75,0) forwards}
.fc-lift.in{animation:fcIn .48s var(--fc-e)}
@keyframes fcOut{
  0%{transform:translateX(0) rotate(0) scale(1);opacity:1}
  100%{transform:translateX(130%) rotate(17deg) scale(.85);opacity:0}
}
@keyframes fcOutKo{
  0%{transform:translateX(0) rotate(0) scale(1);opacity:1}
  100%{transform:translateX(-130%) rotate(-17deg) scale(.85);opacity:0}
}
@keyframes fcIn{
  0%{transform:translateY(26px) scale(.9);opacity:0}
  100%{transform:translateY(0) scale(1);opacity:1}
}

/* — La carta — */
.fc-card{
  position:absolute;inset:0;transform-style:preserve-3d;
  transition:transform .78s var(--fc-e);
  cursor:pointer;border-radius:var(--r-lg);
}
.fc-card:focus-visible{outline:none}
.fc-card:focus-visible .fc-face{box-shadow:var(--sh-glow),var(--sh-2)}

/* — Caras — */
.fc-face{
  position:absolute;inset:0;border-radius:var(--r-lg);
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  padding:2rem 2.2rem;text-align:center;overflow:hidden;
  box-shadow:var(--sh-2);
  transition:box-shadow .4s var(--fc-e);
}
.fc-card:hover .fc-face{box-shadow:var(--sh-3)}

/* Anverso · pregunta */
.fc-front{
  background:
    radial-gradient(120% 90% at 50% -20%, var(--brand-soft) 0%, transparent 60%),
    var(--surface);
  border:1.5px solid var(--line);color:var(--ink);
}
/* Reverso · respuesta */
.fc-back{
  transform:rotateY(180deg);
  background:linear-gradient(145deg,var(--brand) 0%,#6d4bf7 45%,var(--c5,#0891b2) 130%);
  border:1.5px solid transparent;color:#fff;
}
html[data-theme="dark"] .fc-back{
  background:linear-gradient(145deg,#5f45c9 0%,#4b3aa8 45%,#0e6b85 130%);
}
.fc-back .fc-txt{color:#fff}
.fc-back b,.fc-back strong{color:#fff;font-weight:800}

/* — Sheen que barre al girar — */
.fc-face::after{
  content:"";position:absolute;top:-60%;left:-70%;width:55%;height:220%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.42),transparent);
  transform:rotate(18deg);opacity:0;pointer-events:none;
}
.fc-lift.lift .fc-face::after{animation:fcSheen .78s var(--fc-e)}
@keyframes fcSheen{
  0%{opacity:0;left:-70%}
  35%{opacity:1}
  100%{opacity:0;left:150%}
}

/* — Etiqueta superior — */
.fc-tag{
  position:absolute;top:1rem;left:1.15rem;
  font-size:var(--t-xs);font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  display:inline-flex;align-items:center;gap:.4rem;
}
.fc-front .fc-tag{color:var(--brand)}
.fc-back .fc-tag{color:rgba(255,255,255,.9)}
.fc-tag::before{
  content:"";width:7px;height:7px;border-radius:50%;background:currentColor;
  animation:fcPulse 2.2s ease-in-out infinite;
}
@keyframes fcPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.65)}}

/* — Índice tipo naipe — */
.fc-pip{
  position:absolute;font-family:var(--f-display);font-weight:800;
  font-size:.78rem;letter-spacing:-.02em;opacity:.34;font-variant-numeric:tabular-nums;
}
.fc-pip.tr{top:1rem;right:1.15rem}
.fc-pip.bl{bottom:1rem;left:1.15rem;transform:rotate(180deg)}
.fc-front .fc-pip{color:var(--ink-2)}
.fc-back .fc-pip{color:#fff;opacity:.55}

/* — Texto — */
.fc-txt{
  font-size:clamp(1rem,.9rem + .55vw,1.28rem);font-weight:650;line-height:1.5;
  max-width:44ch;letter-spacing:-.012em;
}
.fc-front .fc-txt{font-family:var(--f-display);font-weight:700}
.fc-back .fc-txt{font-weight:600;line-height:1.6}
.fc-hint{
  position:absolute;bottom:1rem;left:0;right:0;
  font-size:var(--t-xs);font-weight:600;letter-spacing:.02em;
  display:flex;align-items:center;justify-content:center;gap:.4rem;
}
.fc-front .fc-hint{color:var(--ink-3)}
.fc-back .fc-hint{color:rgba(255,255,255,.72)}
.fc-hint .kbd{
  font-family:var(--f-mono);font-size:.68rem;font-weight:700;padding:.1rem .32rem;
  border-radius:5px;border:1px solid currentColor;opacity:.75;
}

/* — Pantalla final — */
.fc-done{
  position:absolute;inset:0;border-radius:var(--r-lg);
  background:linear-gradient(150deg,var(--ok-soft),var(--surface) 70%);
  border:1.5px solid var(--ok);
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  text-align:center;padding:2rem;gap:.35rem;
  animation:fcIn .5s var(--fc-e);box-shadow:var(--sh-2);
}
.fc-done .seal{
  font-size:2.6rem;line-height:1;
  animation:fcSeal .7s cubic-bezier(.2,1.5,.4,1);
}
@keyframes fcSeal{0%{transform:scale(0) rotate(-25deg);opacity:0}60%{transform:scale(1.2) rotate(6deg)}100%{transform:scale(1) rotate(0);opacity:1}}
.fc-done h3{font-size:1.3rem;font-weight:800;margin:.2rem 0 0}
.fc-done p{margin:0;color:var(--ink-2);font-size:var(--t-sm)}

/* — Barra de progreso de la ronda — */
.fc-bar{
  height:6px;border-radius:99px;background:var(--surface-3);
  overflow:hidden;margin:.95rem 0 .8rem;position:relative;
}
.fc-bar i{
  display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--brand),var(--c5,#0891b2));
  transition:width .55s var(--fc-e);
}

/* — Controles — */
.fc-ctrls{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.fc-ctrls button{font-weight:700}
#fcok{border-color:var(--ok);color:var(--ok)}
#fcok:hover{background:var(--ok);color:#fff;border-color:var(--ok)}
#fcko{border-color:var(--warn);color:var(--warn)}
#fcko:hover{background:var(--warn);color:#fff;border-color:var(--warn)}
#fcflip{background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;border-color:transparent}
#fcflip:hover{box-shadow:var(--sh-3)}

.fc-score{display:inline-flex;gap:.45rem;margin-left:auto;align-items:center}
.fc-pill{
  font-size:var(--t-xs);font-weight:800;padding:.24rem .6rem;border-radius:var(--r-full);
  font-variant-numeric:tabular-nums;border:1px solid;
}
.fc-pill.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.fc-pill.ko{color:var(--warn);border-color:var(--warn);background:var(--warn-bg)}
.fc-pill.left{color:var(--ink-2);border-color:var(--line);background:var(--surface-2)}
.fc-pill.bump{animation:fcBump .45s var(--e-spring)}
@keyframes fcBump{0%{transform:scale(1)}45%{transform:scale(1.28)}100%{transform:scale(1)}}

@media(max-width:620px){
  #flash{--fc-h:270px}
  .fc-face{padding:1.7rem 1.3rem}
  .fc-score{margin-left:0;width:100%}
}
@media(prefers-reduced-motion:reduce){
  .fc-card{transition:none}
  .fc-lift.lift,.fc-lift.in,.fc-lift.out-ok,.fc-lift.out-ko,.fc-face::after{animation:none !important}
}
@media print{.fc-stage,.fc-ctrls,.fc-bar{display:none !important}}
/* ═══ RESPUESTA ESTRUCTURADA ═══ */
.fc-face{justify-content:center}
.fc-face.struct{justify-content:flex-start;text-align:left;padding-top:3.1rem;padding-bottom:3.1rem}
.fc-body{
  width:100%;max-width:46ch;margin:0 auto;
  overflow-y:auto;max-height:100%;
  scrollbar-width:thin;
}
.fc-body::-webkit-scrollbar{width:5px}
.fc-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.35);border-radius:99px;border:0}
.fc-front .fc-body::-webkit-scrollbar-thumb{background:var(--line-strong)}

/* — Veredicto Sí / No — */
.fc-verdict{
  display:inline-flex;align-items:center;gap:.35rem;
  font-family:var(--f-display);font-weight:800;font-size:.82rem;
  letter-spacing:.06em;text-transform:uppercase;
  padding:.26rem .72rem;border-radius:var(--r-full);margin-bottom:.85rem;
  border:1.5px solid;animation:fcPopIn .45s var(--e-spring) backwards;animation-delay:.34s;
}
.fc-verdict.si{background:rgba(255,255,255,.16);border-color:rgba(190,255,215,.85);color:#d8ffe9}
.fc-verdict.no{background:rgba(255,255,255,.16);border-color:rgba(255,205,205,.85);color:#ffdedd}
@keyframes fcPopIn{0%{opacity:0;transform:scale(.7) translateY(6px)}100%{opacity:1;transform:none}}

/* — Párrafo — */
.fc-p{margin:0;font-size:clamp(1rem,.92rem + .45vw,1.2rem);font-weight:600;line-height:1.6}
.fc-face.struct .fc-p{font-size:clamp(.96rem,.9rem + .35vw,1.1rem)}

/* — Lista enumerada — */
.fc-list{list-style:none;margin:0;padding:0;display:grid;gap:.5rem;counter-reset:fc}
.fc-list li{
  counter-increment:fc;position:relative;margin:0;
  padding:.42rem .6rem .42rem 2.5rem;border-radius:var(--r-sm);
  background:rgba(255,255,255,.11);
  font-size:clamp(.92rem,.88rem + .3vw,1.04rem);font-weight:600;line-height:1.45;
  animation:fcRow .42s var(--e-out) backwards;
}
.fc-list li::before{
  content:counter(fc);position:absolute;left:.6rem;top:50%;transform:translateY(-50%);
  width:1.6rem;height:1.6rem;border-radius:50%;
  display:grid;place-items:center;
  background:rgba(255,255,255,.9);color:var(--brand);
  font-family:var(--f-display);font-weight:800;font-size:.78rem;
  font-variant-numeric:tabular-nums;
}
.fc-list.alpha li::before{content:counter(fc,lower-alpha)}
.fc-list li:nth-child(1){animation-delay:.36s}
.fc-list li:nth-child(2){animation-delay:.42s}
.fc-list li:nth-child(3){animation-delay:.48s}
.fc-list li:nth-child(4){animation-delay:.54s}
.fc-list li:nth-child(5){animation-delay:.60s}
.fc-list li:nth-child(n+6){animation-delay:.66s}
@keyframes fcRow{0%{opacity:0;transform:translateX(-12px)}100%{opacity:1;transform:none}}

/* — Cláusulas contrapuestas — */
.fc-clauses{display:grid;gap:.45rem}
.fc-clauses p{
  margin:0;padding:.45rem .7rem .45rem .95rem;border-radius:0 var(--r-sm) var(--r-sm) 0;
  background:rgba(255,255,255,.11);border-left:3px solid rgba(255,255,255,.55);
  font-size:clamp(.92rem,.88rem + .3vw,1.04rem);font-weight:600;line-height:1.5;
  animation:fcRow .42s var(--e-out) backwards;
}
.fc-clauses p:nth-child(1){animation-delay:.36s}
.fc-clauses p:nth-child(2){animation-delay:.44s}
.fc-clauses p:nth-child(3){animation-delay:.52s}

/* — Negritas resaltadas en el reverso — */
.fc-back .fc-body b,.fc-back .fc-body strong{
  font-weight:800;background:rgba(255,255,255,.2);
  padding:.03em .3em;border-radius:5px;
  box-decoration-break:clone;-webkit-box-decoration-break:clone;
}

/* — Cita legal al pie — */
.fc-cite{
  position:absolute;bottom:.95rem;left:0;right:0;
  display:inline-flex;align-items:center;justify-content:center;gap:.4rem;
  font-family:var(--f-mono);font-size:.74rem;font-weight:700;letter-spacing:.02em;
  color:rgba(255,255,255,.82);
  animation:fcPopIn .5s var(--e-out) backwards;animation-delay:.5s;
}
.fc-cite::before,.fc-cite::after{
  content:"";height:1px;width:clamp(18px,10%,52px);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.45));
}
.fc-cite::after{background:linear-gradient(90deg,rgba(255,255,255,.45),transparent)}
.fc-cite .s{font-size:.9rem;opacity:.75;font-family:var(--f-legal)}
.fc-front .fc-cite{color:var(--ink-3)}
.fc-front .fc-cite::before{background:linear-gradient(90deg,transparent,var(--line-strong))}
.fc-front .fc-cite::after{background:linear-gradient(90deg,var(--line-strong),transparent)}

/* la pista se oculta si hay cita, para no amontonar */
.fc-back .fc-cite ~ .fc-hint,.fc-back .fc-hint.muted{display:none}

@media(max-width:620px){
  #flash{--fc-h:320px}
  .fc-face.struct{padding-top:2.9rem;padding-bottom:2.8rem}
  .fc-list li{padding-left:2.3rem}
}
@media(prefers-reduced-motion:reduce){
  .fc-verdict,.fc-list li,.fc-clauses p,.fc-cite{animation:none !important}
}

/* ═══ SEMÁFORO ═══ */
.sembtn{
  border-radius:var(--r-full);padding:.32rem .7rem;font-weight:700;font-size:var(--t-sm);
}
.sembtn[data-v="g"]:hover,.sembtn.on[data-v="g"]{background:var(--ok);color:#fff;border-color:var(--ok)}
.sembtn[data-v="y"]:hover,.sembtn.on[data-v="y"]{background:var(--mid);color:#3d2f00;border-color:var(--mid)}
.sembtn[data-v="r"]:hover,.sembtn.on[data-v="r"]{background:var(--exc);color:#fff;border-color:var(--exc)}

/* ═══ CTA DE BLOQUE ═══ */
a.blk{
  display:inline-flex;align-items:center;gap:.5rem;
  background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;
  padding:.5rem .95rem;border-radius:var(--r-sm);font-weight:700;font-size:var(--t-sm);
  text-decoration:none;box-shadow:0 2px 10px var(--brand-ring);
  transition:transform .22s var(--e-spring),box-shadow .25s,gap .25s var(--e-out);
}
a.blk:hover{transform:translateY(-2px);box-shadow:var(--sh-3);gap:.75rem;text-decoration:none}
a.blk::after{content:"→"}
a.blk:active{transform:translateY(0) scale(.98)}

/* ═══ REVEAL ═══ */
.rv{opacity:0;transform:translateY(20px);transition:opacity .6s var(--e-out),transform .6s var(--e-out)}
.rv.in{opacity:1;transform:none}

/* ═══ RESPONSIVE ═══ */
@media(max-width:960px){
  .layout{grid-template-columns:1fr;padding-top:.9rem;gap:1rem}
  nav.side{position:static;max-height:none}
  nav.side.collapsed .navbody{display:none}
  .navtoggle{display:block;width:100%;text-align:left;font-weight:700}
  .grid2{grid-template-columns:1fr}
  .top h1 .sub{white-space:normal}
}
@media(max-width:620px){
  .top-in{padding:.55rem .8rem}
  .tools{width:100%;margin-left:0}
  /* en pantallas estrechas el título se achica un poco y puede llegar a
     tres líneas: preferimos eso a recortarlo y esconder texto */
  .top h1{font-size:.95rem}
  .top h1 .tit{-webkit-line-clamp:3}
  input[type=search]{flex:1;min-width:0}
  section.card{padding:1.05rem 1rem;border-radius:var(--r-md)}
  table{font-size:.82rem}
  th,td{padding:.4rem .5rem}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
  .rv{opacity:1;transform:none}
}
@media print{
  header.top,nav.side,.tools,.noprint,.progress{display:none !important}
  body{background:#fff;background-image:none;font-size:11pt;color:#000}
  .layout{display:block;max-width:none;padding:0}
  section.card{border:0;padding:0;margin:0 0 1rem;break-inside:avoid;box-shadow:none}
  details.panel{border:0;box-shadow:none}
  details.panel .body{display:block !important}
  details.panel>summary{padding-left:0}
  .art{break-inside:avoid}
  .rv{opacity:1;transform:none}
  a{color:#000;text-decoration:none}
}


/* ═══ ALTURA ADAPTATIVA DE LA TARJETA ═══ */
.fc-deck{transition:height .45s var(--fc-e)}
.fc-body{max-height:none;overflow:visible}
.fc-measure{
  position:absolute;left:0;right:0;top:0;height:auto;
  visibility:hidden;pointer-events:none;z-index:-1;
}
.fc-measure .fc-face{
  position:relative;inset:auto;height:auto;min-height:0;
  box-shadow:none;backface-visibility:visible;transform:none;
}
.fc-measure .fc-body{max-height:none;overflow:visible}
.fc-measure .fc-face::after{display:none}

/* ═══ MOSTRAR / OCULTAR ÍNDICE LATERAL ═══ */
.layout{transition:grid-template-columns .42s var(--e-out)}
.layout.nonav{grid-template-columns:0 1fr;gap:0}
.layout.nonav>nav.side{
  opacity:0;transform:translateX(-14px);pointer-events:none;
  padding:0;border-width:0;overflow:hidden;width:0;min-width:0;
}
nav.side{
  transition:opacity .3s var(--e-out),transform .38s var(--e-out);
  overflow-x:hidden;
}
#navhide .ic{display:inline-block;transition:transform .35s var(--e-spring);font-size:.95em;line-height:1}
#navhide[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
#navhide[aria-pressed="true"] .ic{transform:rotate(90deg)}
@media(max-width:960px){#navhide{display:none}}

/* ═══════════════════════════════════════════════════════════════
   LECTURA EN VOZ ALTA (TTS) del texto legal
   ═══════════════════════════════════════════════════════════════ */
.tts-bar{
  display:flex;align-items:center;gap:.45rem;flex-wrap:wrap;
  margin:.15rem 0 .7rem;
}
.tts-bar button{
  font-size:var(--t-xs);font-weight:700;padding:.3rem .62rem;
  border-radius:var(--r-full);border:1px solid var(--legal);
  background:transparent;color:var(--legal);
  display:inline-flex;align-items:center;gap:.35rem;line-height:1.2;
}
.tts-bar button:hover{background:var(--legal);color:var(--surface);border-color:var(--legal)}
.tts-bar button[hidden]{display:none}
.tts-bar .tts-play.on{background:var(--legal);color:var(--surface)}

/* Ondas de audio mientras lee */
.tts-wave{display:inline-flex;align-items:flex-end;gap:2px;height:11px}
.tts-wave i{
  width:2.5px;background:currentColor;border-radius:2px;height:35%;
  animation:ttsW .9s ease-in-out infinite;
}
.tts-wave i:nth-child(2){animation-delay:.15s}
.tts-wave i:nth-child(3){animation-delay:.3s}
.tts-wave i:nth-child(4){animation-delay:.45s}
@keyframes ttsW{0%,100%{height:32%}50%{height:100%}}

.tts-time{
  font-family:var(--f-mono);font-size:.7rem;font-weight:700;
  color:var(--ink-3);font-variant-numeric:tabular-nums;
}

/* Frase que se está leyendo */
.tts-s{transition:background .25s,color .25s;border-radius:3px}
.tts-s.now{
  background:linear-gradient(180deg,transparent 8%,color-mix(in srgb,var(--legal) 26%,transparent) 8%);
  box-shadow:0 0 0 2px color-mix(in srgb,var(--legal) 16%,transparent);
}
html[data-theme="dark"] .tts-s.now{
  background:linear-gradient(180deg,transparent 8%,color-mix(in srgb,var(--legal) 34%,transparent) 8%);
}
.legal.tts-on{box-shadow:0 0 0 3px color-mix(in srgb,var(--legal) 20%,transparent)}

/* ═══ Reproductor flotante ═══ */
.tts-mini{
  position:fixed;left:50%;bottom:1.1rem;transform:translateX(-50%) translateY(140%);
  z-index:80;display:flex;align-items:center;gap:.6rem;
  background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  border:1px solid var(--line);border-radius:var(--r-full);
  padding:.5rem .7rem .5rem .95rem;box-shadow:var(--sh-3);
  transition:transform .45s var(--e-spring),opacity .3s;opacity:0;pointer-events:none;
  max-width:min(94vw,540px);
}
.tts-mini.show{transform:translateX(-50%) translateY(0);opacity:1;pointer-events:auto}
.tts-mini .lbl{
  font-size:var(--t-xs);font-weight:800;color:var(--legal);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:16ch;
}
.tts-mini button{
  border-radius:50%;width:32px;height:32px;padding:0;display:grid;place-items:center;
  font-size:.8rem;border:1px solid var(--line);flex:none;
}
.tts-mini button.main{
  width:38px;height:38px;font-size:.95rem;
  background:linear-gradient(140deg,var(--legal),var(--brand));color:#fff;border-color:transparent;
}
.tts-mini .bar{
  flex:1;min-width:70px;height:5px;border-radius:99px;background:var(--surface-3);overflow:hidden;
}
.tts-mini .bar i{display:block;height:100%;width:0;background:var(--legal);
  border-radius:99px;transition:width .35s var(--e-out)}

/* ═══ Panel de ajustes de voz ═══ */
.tts-back{
  position:fixed;inset:0;z-index:90;background:rgba(10,10,18,.45);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  display:grid;place-items:center;padding:1rem;
  opacity:0;pointer-events:none;transition:opacity .3s var(--e-out);
}
.tts-back.show{opacity:1;pointer-events:auto}
.tts-panel{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--sh-3);width:min(94vw,470px);max-height:88vh;overflow:auto;
  padding:1.3rem 1.4rem;transform:translateY(16px) scale(.97);
  transition:transform .38s var(--e-spring);
}
.tts-back.show .tts-panel{transform:none}
.tts-panel h3{
  font-size:1.12rem;font-weight:800;margin:0 0 .25rem;
  display:flex;align-items:center;gap:.5rem;
}
.tts-panel .sub{font-size:var(--t-sm);color:var(--ink-2);margin:0 0 1.1rem}
.tts-row{margin-bottom:1.05rem}
.tts-row > label{
  display:block;font-size:var(--t-xs);font-weight:800;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-2);margin-bottom:.4rem;
}
.tts-seg{display:flex;gap:3px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:3px}
.tts-seg button{
  flex:1;border:0;background:transparent;border-radius:calc(var(--r-sm) - 3px);
  padding:.42rem .3rem;font-size:var(--t-sm);font-weight:700;box-shadow:none;
}
.tts-seg button:hover{transform:none;background:var(--surface)}
.tts-seg button[aria-pressed="true"]{
  background:linear-gradient(140deg,var(--legal),var(--brand));color:#fff;
}
.tts-panel select{
  width:100%;padding:.5rem .6rem;border-radius:var(--r-sm);
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  font-size:var(--t-sm);font-weight:600;cursor:pointer;
}
.tts-panel select:focus{border-color:var(--brand);outline:none}
.tts-slider{display:flex;align-items:center;gap:.75rem}
.tts-slider input[type=range]{flex:1;accent-color:var(--legal);cursor:pointer;height:22px}
.tts-val{
  font-family:var(--f-mono);font-weight:800;font-size:var(--t-sm);
  min-width:3.4em;text-align:right;color:var(--legal);font-variant-numeric:tabular-nums;
}
.tts-note{
  font-size:var(--t-xs);color:var(--ink-2);line-height:1.5;
  background:var(--surface-2);border-radius:var(--r-sm);padding:.6rem .75rem;margin:0 0 1rem;
}
.tts-note b{color:var(--ink)}
.tts-acts{display:flex;gap:.5rem;justify-content:flex-end;flex-wrap:wrap}
.tts-acts .prim{
  background:linear-gradient(140deg,var(--legal),var(--brand));color:#fff;border-color:transparent;
}
.tts-badge{
  font-size:.62rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
  padding:.1rem .35rem;border-radius:4px;background:var(--ej-bg);color:var(--ej);margin-left:.35rem;
}


/* — Variante compacta para los apartados desplegables — */
.tts-bar.mini{margin:0 0 .6rem}
.tts-bar.mini button{
  font-size:.7rem;padding:.24rem .55rem;
  border-color:var(--brand);color:var(--brand);
}
.tts-bar.mini button:hover{background:var(--brand);color:var(--surface)}
.tts-bar.mini .tts-play.on{background:var(--brand);color:var(--surface)}
.tts-bar.mini .tts-time{font-size:.66rem}
.idea .tts-bar.mini{margin:.55rem 0 0}
.legal.tts-on,.body.tts-on,.idea.tts-on{
  box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 20%,transparent)
}
.legal.tts-on{box-shadow:0 0 0 3px color-mix(in srgb,var(--legal) 20%,transparent)}


/* aviso de cambio de voz */
.tts-aviso{
  position:fixed;left:50%;bottom:5.2rem;transform:translateX(-50%) translateY(20px);
  z-index:95;max-width:min(92vw,460px);
  background:var(--warn-bg);border:1px solid var(--warn);color:var(--warn);
  border-radius:var(--r-md);padding:.6rem .9rem;font-size:var(--t-sm);font-weight:700;
  box-shadow:var(--sh-2);opacity:0;pointer-events:none;
  transition:opacity .3s var(--e-out),transform .35s var(--e-spring);
}
.tts-aviso.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:620px){
  .tts-mini{left:.6rem;right:.6rem;transform:translateY(140%);max-width:none}
  .tts-mini.show{transform:translateY(0)}
  .tts-mini .lbl{display:none}
}
@media(prefers-reduced-motion:reduce){
  .tts-wave i{animation:none;height:60%}
}
@media print{.tts-bar,.tts-mini,.tts-back{display:none !important}}

document.getElementById("main").innerHTML="<section class=\"card\" id=\"intro\"><h2>Tema 1 · Los órganos colegiados locales</h2>\n<p class=\"ubic\">Convocatoria · Orden del día · Requisitos de constitución · Funcionamiento · Actas y certificados de acuerdos</p>\n<div class=\"idea\">Este tema no se estudia como teoría de órganos colegiados. Se estudia como la respuesta a tres preguntas que aparecen dentro de cualquier supuesto de gasto: <b>quién aprueba</b>, <b>con qué mayoría</b> y <b>con qué documento</b>.</div>\n<svg viewBox=\"0 0 990 412\" width=\"100%\" role=\"img\" aria-label=\"Cuadro de qué órgano aprueba cada acto económico de la entidad local y con qué mayoría\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"t1afr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#4b5563\"/></marker><marker id=\"t1afe\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#15803d\"/></marker><marker id=\"t1afw\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#b45309\"/></marker></defs><text x=\"495\" y=\"24\" font-size=\"13\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"bold\">Quién aprueba qué, con qué mayoría y con qué documento</text><rect x=\"20\" y=\"38\" width=\"250\" height=\"30\" rx=\"8\" fill=\"#e8efff\" stroke=\"#1d4ed8\" stroke-width=\"1.4\"/><text x=\"145\" y=\"57\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#1d4ed8\" font-weight=\"bold\">Qué se aprueba</text><rect x=\"280\" y=\"38\" width=\"170\" height=\"30\" rx=\"8\" fill=\"#e8efff\" stroke=\"#1d4ed8\" stroke-width=\"1.4\"/><text x=\"365\" y=\"57\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#1d4ed8\" font-weight=\"bold\">Órgano</text><rect x=\"460\" y=\"38\" width=\"210\" height=\"30\" rx=\"8\" fill=\"#e8efff\" stroke=\"#1d4ed8\" stroke-width=\"1.4\"/><text x=\"565\" y=\"57\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#1d4ed8\" font-weight=\"bold\">Mayoría</text><rect x=\"680\" y=\"38\" width=\"290\" height=\"30\" rx=\"8\" fill=\"#e8efff\" stroke=\"#1d4ed8\" stroke-width=\"1.4\"/><text x=\"825\" y=\"57\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#1d4ed8\" font-weight=\"bold\">Precepto</text><rect x=\"20\" y=\"74\" width=\"250\" height=\"36\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"145\" y=\"89.29\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Presupuesto general</text><text x=\"145\" y=\"101.29\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">aprobación inicial</text><rect x=\"280\" y=\"74\" width=\"170\" height=\"36\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"365\" y=\"95.29\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">PLENO</text><rect x=\"460\" y=\"74\" width=\"210\" height=\"36\" rx=\"8\" fill=\"#eaf6ee\" stroke=\"#15803d\" stroke-width=\"1.4\"/><text x=\"565\" y=\"95.29\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Simple</text><rect x=\"680\" y=\"74\" width=\"290\" height=\"36\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"825\" y=\"95.29\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">LBRL 22.2.e) · TRLHL 168 y 169</text><rect x=\"20\" y=\"112\" width=\"250\" height=\"36\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"145\" y=\"127.29\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Crédito extraordinario</text><text x=\"145\" y=\"139.29\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">o suplemento de crédito</text><rect x=\"280\" y=\"112\" width=\"170\" height=\"36\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"365\" y=\"133.29\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">PLENO</text><rect x=\"460\" y=\"112\" width=\"210\" height=\"36\" rx=\"8\" fill=\"#eaf6ee\" stroke=\"#15803d\" stroke-width=\"1.4\"/><text x=\"565\" y=\"133.29\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Simple</text><rect x=\"680\" y=\"112\" width=\"290\" height=\"36\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"825\" y=\"127.29\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">TRLHL 177.2 · informe previo</text><text x=\"825\" y=\"139.29\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">de Intervención</text><rect x=\"20\" y=\"150\" width=\"250\" height=\"36\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"145\" y=\"165.29\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Ordenanza general de</text><text x=\"145\" y=\"177.29\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">subvenciones · bases</text><rect x=\"280\" y=\"150\" width=\"170\" height=\"36\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"365\" y=\"171.29\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">PLENO</text><rect x=\"460\" y=\"150\" width=\"210\" height=\"36\" rx=\"8\" fill=\"#eaf6ee\" stroke=\"#15803d\" stroke-width=\"1.4\"/><text x=\"565\" y=\"171.29\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Simple</text><rect x=\"680\" y=\"150\" width=\"290\" height=\"36\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"825\" y=\"171.29\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">LBRL 22.2.d) · LGS 17.2</text><rect x=\"20\" y=\"188\" width=\"250\" height=\"36\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"145\" y=\"203.29\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Contrato: VEC hasta el 10 % de</text><text x=\"145\" y=\"215.29\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">los recursos ordinarios y 6 M€</text><rect x=\"280\" y=\"188\" width=\"170\" height=\"36\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"365\" y=\"203.29\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">ALCALDE o</text><text x=\"365\" y=\"215.29\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">PRESIDENTE</text><rect x=\"460\" y=\"188\" width=\"210\" height=\"36\" rx=\"8\" fill=\"#eaf6ee\" stroke=\"#15803d\" stroke-width=\"1.4\"/><text x=\"565\" y=\"209.29\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">—</text><rect x=\"680\" y=\"188\" width=\"290\" height=\"36\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"825\" y=\"209.29\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">LCSP · D. A. 2.ª.1</text><rect x=\"20\" y=\"226\" width=\"250\" height=\"36\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"145\" y=\"241.29\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Contrato que excede de ese</text><text x=\"145\" y=\"253.29\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">límite por valor o duración</text><rect x=\"280\" y=\"226\" width=\"170\" height=\"36\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"365\" y=\"247.29\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">PLENO</text><rect x=\"460\" y=\"226\" width=\"210\" height=\"36\" rx=\"8\" fill=\"#eaf6ee\" stroke=\"#15803d\" stroke-width=\"1.4\"/><text x=\"565\" y=\"247.29\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Simple</text><rect x=\"680\" y=\"226\" width=\"290\" height=\"36\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"825\" y=\"247.29\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">LCSP · D. A. 2.ª.2</text><rect x=\"20\" y=\"264\" width=\"250\" height=\"36\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"145\" y=\"279.29\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Concesión de bienes o servicios</text><text x=\"145\" y=\"291.29\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">más de 5 años y más del 20 %</text><rect x=\"280\" y=\"264\" width=\"170\" height=\"36\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"365\" y=\"285.29\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">PLENO</text><rect x=\"460\" y=\"264\" width=\"210\" height=\"36\" rx=\"8\" fill=\"#fdeceb\" stroke=\"#b91c1c\" stroke-width=\"1.4\"/><text x=\"565\" y=\"285.29\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">ABSOLUTA</text><rect x=\"680\" y=\"264\" width=\"290\" height=\"36\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"825\" y=\"285.29\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">LBRL 47.2.j)</text><rect x=\"20\" y=\"302\" width=\"250\" height=\"36\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"145\" y=\"317.29\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Enajenación de bienes</text><text x=\"145\" y=\"329.29\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">que exceda del 20 % de recursos</text><rect x=\"280\" y=\"302\" width=\"170\" height=\"36\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"365\" y=\"323.29\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">PLENO</text><rect x=\"460\" y=\"302\" width=\"210\" height=\"36\" rx=\"8\" fill=\"#fdeceb\" stroke=\"#b91c1c\" stroke-width=\"1.4\"/><text x=\"565\" y=\"323.29\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">ABSOLUTA</text><rect x=\"680\" y=\"302\" width=\"290\" height=\"36\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"825\" y=\"323.29\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">LBRL 47.2.m)</text><rect x=\"20\" y=\"340\" width=\"250\" height=\"36\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"145\" y=\"355.29\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Operaciones de crédito</text><text x=\"145\" y=\"367.29\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">que superen el 10 % de recursos</text><rect x=\"280\" y=\"340\" width=\"170\" height=\"36\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"365\" y=\"361.29\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">PLENO</text><rect x=\"460\" y=\"340\" width=\"210\" height=\"36\" rx=\"8\" fill=\"#fdeceb\" stroke=\"#b91c1c\" stroke-width=\"1.4\"/><text x=\"565\" y=\"361.29\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">ABSOLUTA</text><rect x=\"680\" y=\"340\" width=\"290\" height=\"36\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"825\" y=\"361.29\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">LBRL 47.2.l)</text><text x=\"495\" y=\"400\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#b91c1c\" font-weight=\"bold\">Mayoría SIMPLE es la regla (47.1). La ABSOLUTA del número legal es excepción tasada, y estas tres son las de contenido económico.</text></svg>\n<div class=\"box ej\"><span class=\"lbl\">Cómo está organizado</span><ul>\n<li><b>Antes de la sesión</b> · art. 46 LBRL y arts. 78 a 82 ROF: periodicidad, convocatoria, orden del día y <span class=\"t\" data-g=\"quorum\">quórum</span>.</li>\n<li><b>Durante la sesión</b> · arts. 90, 91 y 97 ROF y art. 47 LBRL: desarrollo, las siete palabras del vocabulario plenario, <span class=\"t\" data-g=\"simple\">mayoría simple</span> y <span class=\"t\" data-g=\"absoluta\">mayoría absoluta</span>.</li>\n<li><b>Después de la sesión</b> · arts. 109, 110 y 204 a 206 ROF: el <span class=\"t\" data-g=\"acta\">acta</span>, el Libro de Actas y la <span class=\"t\" data-g=\"certificacion\">certificación</span> que se incorpora al expediente.</li>\n<li><b>Y el puente con tus otros temas</b> · art. 22 LBRL, arts. 168, 169 y 177 TRLHL, D. A. 2.ª LCSP y art. 17.2 LGS.</li>\n</ul></div>\n<div class=\"box warn\"><span class=\"lbl\">Verifica la vigencia</span>Trabajado sobre los textos consolidados del BOE de la carpeta: Ley 7/1985 y Real Decreto 2568/1986. El ROF es de 1986 y en algún punto ha sido desplazado por la Ley posterior; donde ocurre, lo señalo dentro del propio artículo.</div>\n<p class=\"small\">La pregunta que de verdad te van a hacer no es «¿qué es un órgano colegiado?». Es: <b>el Pleno aprueba una enajenación que supera el 20 % de los recursos ordinarios con ocho votos a favor y uno en contra en una corporación de trece. ¿Es válido el acuerdo?</b></p></section><section class=\"card art\" id=\"lbrl46\"><h2><span class=\"num\">LBRL 46</span> Funcionamiento de los órganos colegiados locales</h2><p class=\"ubic\">Ley 7/1985 ▸ Título V «Disposiciones comunes a las entidades locales» ▸ Capítulo I ▸ Sección 2.ª</p><div class=\"idea\">Periodicidad, convocatoria, quórum y votación del Pleno, todo en un artículo.</div><svg viewBox=\"0 0 980 284\" width=\"100%\" role=\"img\" aria-label=\"Periodicidad de las sesiones ordinarias del Pleno, plazo de convocatoria y régimen de las extraordinarias\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"t1bfr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#4b5563\"/></marker><marker id=\"t1bfe\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#15803d\"/></marker><marker id=\"t1bfw\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#b45309\"/></marker></defs><text x=\"490\" y=\"24\" font-size=\"13\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"bold\">La convocatoria del Pleno · art. 46.2 LBRL y arts. 78 a 82 ROF</text><rect x=\"20\" y=\"42\" width=\"920\" height=\"32\" rx=\"8\" fill=\"#e8efff\" stroke=\"#1d4ed8\" stroke-width=\"1.4\"/><text x=\"480\" y=\"61.85\" font-size=\"11\" text-anchor=\"middle\" fill=\"#1d4ed8\" font-weight=\"bold\">PERIODICIDAD MÍNIMA DE LAS SESIONES ORDINARIAS · art. 46.2.a) LBRL</text><rect x=\"20\" y=\"82\" width=\"300\" height=\"72\" rx=\"8\" fill=\"#fdeceb\" stroke=\"#b91c1c\" stroke-width=\"1.4\"/><text x=\"170\" y=\"99.105\" font-size=\"10.3\" text-anchor=\"middle\" fill=\"#b91c1c\" font-weight=\"bold\">CADA MES</text><text x=\"170\" y=\"114.105\" font-size=\"10.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Municipios de más de</text><text x=\"170\" y=\"129.105\" font-size=\"10.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">20.000 habitantes</text><text x=\"170\" y=\"144.105\" font-size=\"10.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">y Diputaciones</text><rect x=\"340\" y=\"82\" width=\"300\" height=\"72\" rx=\"8\" fill=\"#fdf3e3\" stroke=\"#b45309\" stroke-width=\"1.4\"/><text x=\"490\" y=\"99.105\" font-size=\"10.3\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"bold\">CADA DOS MESES</text><text x=\"490\" y=\"114.105\" font-size=\"10.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Municipios de</text><text x=\"490\" y=\"129.105\" font-size=\"10.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">5.001 a 20.000</text><text x=\"490\" y=\"144.105\" font-size=\"10.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">habitantes</text><rect x=\"660\" y=\"82\" width=\"300\" height=\"72\" rx=\"8\" fill=\"#eaf6ee\" stroke=\"#15803d\" stroke-width=\"1.4\"/><text x=\"810\" y=\"106.605\" font-size=\"10.3\" text-anchor=\"middle\" fill=\"#15803d\" font-weight=\"bold\">CADA TRES MESES</text><text x=\"810\" y=\"121.605\" font-size=\"10.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Municipios de hasta</text><text x=\"810\" y=\"136.605\" font-size=\"10.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">5.000 habitantes</text><rect x=\"20\" y=\"166\" width=\"450\" height=\"56\" rx=\"8\" fill=\"#e8efff\" stroke=\"#1d4ed8\" stroke-width=\"1.4\"/><text x=\"245\" y=\"182.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#1d4ed8\" font-weight=\"bold\">CONVOCATORIA</text><text x=\"245\" y=\"197.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Al menos DOS DÍAS HÁBILES de antelación,</text><text x=\"245\" y=\"212.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">salvo extraordinaria urgente, que el Pleno ratifica</text><rect x=\"490\" y=\"166\" width=\"450\" height=\"56\" rx=\"8\" fill=\"#eaf6ee\" stroke=\"#15803d\" stroke-width=\"1.4\"/><text x=\"715\" y=\"182.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15803d\" font-weight=\"bold\">DOCUMENTACIÓN</text><text x=\"715\" y=\"197.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Íntegra, a disposición de los miembros DESDE EL</text><text x=\"715\" y=\"212.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">MISMO DÍA de la convocatoria, en la Secretaría</text><text x=\"490\" y=\"244\" font-size=\"10.3\" text-anchor=\"middle\" fill=\"#4b5563\" font-weight=\"normal\">Extraordinaria a petición de la CUARTA PARTE del número legal de miembros, y ningún concejal puede pedir más de TRES al año.</text><text x=\"490\" y=\"268\" font-size=\"9.6\" text-anchor=\"middle\" fill=\"#b91c1c\" font-weight=\"bold\">No puede demorarse más de QUINCE DÍAS HÁBILES; si no se convoca, queda automáticamente convocada el DÉCIMO DÍA HÁBIL siguiente, a las DOCE HORAS.</text></svg><details class=\"panel\" open><summary>Texto legal</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LBRL</span><p>Artículo 46.</p><p>1. Los órganos colegiados de las entidades locales funcionan en régimen de sesiones ordinarias de periodicidad preestablecida y extraordinarias, que pueden ser, además, urgentes.</p><p>2. En todo caso, el funcionamiento del Pleno de las Corporaciones Locales se ajusta a las siguientes reglas:</p><p>a) El Pleno celebra sesión ordinaria como mínimo cada mes en los Ayuntamientos de municipios de más de 20.000 habitantes y en las Diputaciones Provinciales; cada dos meses en los Ayuntamientos de los municipios de una población entre 5.001 habitantes y 20.000 habitantes; y cada tres en los municipios de hasta 5.000 habitantes. Asimismo, el Pleno celebra sesión extraordinaria cuando así lo decida el Presidente o lo solicite la cuarta parte, al menos, del número legal de miembros de la Corporación, sin que ningún concejal pueda solicitar más de tres anualmente. En este último caso, la celebración del mismo no podrá demorarse por más de quince días hábiles desde que fuera solicitada, no pudiendo incorporarse el asunto al orden del día de un Pleno ordinario o de otro extraordinario con más asuntos si no lo autorizan expresamente los solicitantes de la convocatoria. Si el Presidente no convocase el Pleno extraordinario solicitado por el número de concejales indicado dentro del plazo señalado, quedará automáticamente convocado para el décimo día hábil siguiente al de la finalización de dicho plazo, a las doce horas, lo que será notificado por el Secretario de la Corporación a todos los miembros de la misma al día siguiente de la finalización del plazo citado anteriormente. En ausencia del Presidente o de quien legalmente haya de sustituirle, el Pleno quedará válidamente constituido siempre que concurra el quórum requerido en la letra c) de este precepto, en cuyo caso será presidido por el miembro de la Corporación de mayor edad entre los presentes.</p><p>b) Las sesiones plenarias han de convocarse, al menos, con dos días hábiles de antelación, salvo las extraordinarias que lo hayan sido con carácter urgente, cuya convocatoria con este carácter deberá ser ratificada por el Pleno. La documentación íntegra de los asuntos incluidos en el orden del día, que deba servir de base al debate y, en su caso, votación, deberá figurar a disposición de los Concejales o Diputados, desde el mismo día de la convocatoria, en la Secretaría de la Corporación.</p><p>c) El Pleno se constituye válidamente con la asistencia de un tercio del mínimo legal de miembros del mismo, que nunca podrá ser inferior a tres. En los municipios de hasta 100 residentes, que no funcionen en régimen de Concejo Abierto, el Pleno se constituirá válidamente con la asistencia del número legal de miembros del mismo, que nunca deberá ser inferior a dos. Estos quórums deberán mantenerse durante toda la sesión. En todo caso, se requiere la asistencia del Presidente y del Secretario de la Corporación o de quienes legalmente les sustituyan.</p><p>d) La adopción de acuerdos se produce mediante votación ordinaria, salvo que el propio Pleno acuerde, para un caso concreto, la votación nominal. El voto puede emitirse en sentido afirmativo o negativo, pudiendo los miembros de las Corporaciones abstenerse de votar. La ausencia de uno o varios Concejales o Diputados, una vez iniciada la deliberación de un asunto, equivale, a efectos de la votación correspondiente, a la abstención. En el caso de votaciones con resultado de empate, se efectuará una nueva votación, y si persistiera el empate, decidirá el voto de calidad del Presidente.</p><p>e) En los plenos ordinarios la parte dedicada al control de los demás órganos de la Corporación deberá presentar sustantividad propia y diferenciada de la parte resolutiva, debiéndose garantizar de forma efectiva en su funcionamiento y, en su caso, en su regulación, la participación de todos los grupos municipales en la formulación de ruegos, preguntas y mociones.</p><p>3. En todo caso, cuando concurran situaciones excepcionales de fuerza mayor, de grave riesgo colectivo, o catástrofes públicas que impidan o dificulten de manera desproporcionada el normal funcionamiento del régimen presencial de las sesiones de los órganos colegiados de las Entidades Locales, estos podrán, apreciada la concurrencia de la situación descrita por el Alcalde o Presidente o quien válidamente les sustituya al efecto de la convocatoria de acuerdo con la normativa vigente, constituirse, celebrar sesiones y adoptar acuerdos a distancia por medios electrónicos y telemáticos, siempre que sus miembros participantes se encuentren en territorio español y quede acreditada su identidad. Asimismo, se deberá asegurar la comunicación entre ellos en tiempo real durante la sesión, disponiéndose los medios necesarios para garantizar el carácter público o secreto de las mismas según proceda legalmente en cada caso. A los efectos anteriores, se consideran medios electrónicos válidos las audioconferencias, videoconferencias, u otros sistemas tecnológicos o audiovisuales que garanticen adecuadamente la seguridad tecnológica, la efectiva participación política de sus miembros, la validez del debate y votación de los acuerdos que se adopten.</p></div></div></details><details class=\"panel\"><summary>Disección</summary><div class=\"body\"><ul>\n<li><b>Clases (46.1):</b> sesiones <b>ordinarias</b> de periodicidad preestablecida y <b>extraordinarias</b>, que además pueden ser <b>urgentes</b>.</li>\n<li><b>Periodicidad (46.2.a):</b> <b>cada mes</b> en municipios de más de 20.000 habitantes y en las <b>Diputaciones</b>; <b>cada dos meses</b> entre 5.001 y 20.000; <b>cada tres</b> en los de hasta 5.000.</li>\n<li><b>Extraordinaria a petición:</b> la pide la <b>cuarta parte, al menos, del número legal</b> de miembros, y <b>ningún concejal puede solicitar más de tres anualmente</b>. No puede demorarse más de <b>quince días hábiles</b>; si el Presidente no convoca, queda <b>automáticamente convocada para el décimo día hábil siguiente, a las doce horas</b>, notificándolo el Secretario.</li>\n<li><b>Convocatoria (46.2.b):</b> al menos <b>dos días hábiles</b> de antelación, salvo las extraordinarias urgentes, cuya convocatoria <b>debe ratificar el Pleno</b>. La documentación íntegra está a disposición <b>desde el mismo día de la convocatoria</b> en la Secretaría.</li>\n<li><b>Quórum (46.2.c):</b> <b>un tercio</b> de los miembros, <b>nunca inferior a tres</b>; en municipios de hasta 100 residentes sin Concejo Abierto, el número legal, nunca inferior a dos. <b>Debe mantenerse durante toda la sesión</b> y se requiere la asistencia del <b>Presidente y del Secretario</b> o de quienes les sustituyan.</li>\n<li><b>Votación (46.2.d):</b> <b>ordinaria</b>, salvo que el Pleno acuerde para un caso concreto la <b>nominal</b>. El voto es afirmativo o negativo, y cabe <b>abstenerse</b>.</li>\n</ul></div></details><details class=\"panel\"><summary>En lenguaje llano</summary><div class=\"body\"><p>Este artículo contesta las cuatro preguntas de cualquier sesión: cada cuánto se reúnen, con cuánta antelación avisan, cuántos hacen falta para empezar y cómo se vota.</p></div></details><details class=\"panel\"><summary>¿Por qué existe?</summary><div class=\"body\"><div class=\"interp\"><span class=\"lbl\">Interpretación · aportación externa</span>La periodicidad mínima y la convocatoria automática existen para que la mayoría no pueda silenciar al Pleno: si el Presidente no convoca lo que le piden, la sesión se convoca sola. Es una garantía de la minoría.</div></div></details><details class=\"panel\"><summary>Ejemplos</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Ejemplo 1</span>Un ayuntamiento de 4.800 habitantes celebra Pleno ordinario cada tres meses: cumple el mínimo.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 2</span>Cuatro concejales de una corporación de dieciséis piden sesión extraordinaria: son la cuarta parte del número legal, procede.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 3</span>Caso límite: el Presidente no convoca en quince días hábiles. La sesión queda convocada por ministerio de la ley el décimo día hábil siguiente, a las doce.</div></div></details><details class=\"panel\"><summary>Trampas</summary><div class=\"body\"><div class=\"box warn\"><span class=\"lbl\">Cuidado</span>Las cifras se cruzan: <b>dos</b> días hábiles de antelación, <b>cuarta parte</b> para pedirla, <b>tres</b> al año por concejal, <b>quince</b> días hábiles de demora máxima y <b>décimo</b> día hábil a las <b>doce horas</b> para la convocatoria automática.</div></div></details><details class=\"panel\"><summary>Conexiones</summary><div class=\"body\"><p>Se desarrolla en los arts. 78 a 91 del ROF. Las mayorías, en el art. 47.</p></div></details><details class=\"panel\"><summary>Anclaje memorístico</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Para retenerlo</span><b>2 días · cuarta parte · 3 al año · 15 días · día 10 a las 12</b>.</div></div></details></section><section class=\"card art\" id=\"rof78\"><h2><span class=\"num\">ROF 78</span> Clases de sesiones</h2><p class=\"ubic\">RD 2568/1986 ▸ Título III ▸ Capítulo I «Del funcionamiento del Pleno» ▸ Sección 1.ª</p><div class=\"idea\">Ordinarias, extraordinarias y extraordinarias urgentes, con sus plazos.</div><details class=\"panel\" open><summary>Texto legal</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · ROF</span><p>Artículo 78.</p><p>1. Son sesiones ordinarias aquellas cuya periodicidad esta preestablecida. Dicha periodicidad será fijada por acuerdo del propio Pleno adoptado en sesión extraordinaria, que habrá de convocar el Alcalde o Presidente dentro de los treinta días siguientes al de la sesión constitutiva de la Corporación y no podrá exceder del límite trimestral a que se refiere el artículo 46.2.a) de la Ley 7/1985, de 2 de abril.</p><p>2. Son sesiones extraordinarias aquellas que convoque el Alcalde o Presidente con tal carácter, por iniciativa propia o a solicitud de la cuarta parte, al menos, del número legal de miembros de la Corporación. Tal solicitud habrá de hacerse por escrito en el que se razone el asunto o asuntos que la motiven, firmado personalmente por todos los que la suscriben. La relación de asuntos incluidos en el escrito no enerva la facultad del Alcalde o Presidente para determinar los puntos del Orden del día, si bien la exclusión de éste de alguno de los asuntos propuestos deberá ser motivada.</p><p>3. La convocatoria de la sesión extraordinaria a instancia de miembros de la Corporación deberá efectuarse dentro de los cuatro días siguientes a la petición y no podrá demorarse su celebración por más de dos meses desde que el escrito tuviera entrada en el Registro General.</p><p>4. Contra la denegación expresa o presunta de la solicitud a que se refiere el párrafo anterior, podrán interponerse por los interesados los correspondientes recursos, sin perjuicio de que la Administración del Estado o de la Comunidad Autónoma respectiva pueda hacer uso de las facultades a que se refiere el artículo 65 de la Ley 7/1985, de 2 de abril.</p></div></div></details><details class=\"panel\"><summary>Disección</summary><div class=\"body\"><ul>\n<li><b>Ordinarias (78.1):</b> las de <b>periodicidad preestablecida</b>, fijada por acuerdo del propio Pleno en <b>sesión extraordinaria</b> que el Alcalde convoca <b>dentro de los treinta días siguientes</b> a la sesión constitutiva, <b>sin exceder del límite trimestral</b> del art. 46.2.a) LBRL.</li>\n<li><b>Extraordinarias (78.2):</b> las convocadas con tal carácter por iniciativa propia o <b>a solicitud de la cuarta parte, al menos, del número legal</b> de miembros, mediante escrito <b>razonado y firmado personalmente</b> por todos los suscribientes. La relación de asuntos <b>no enerva la facultad del Alcalde</b> de fijar el orden del día, pero <b>excluir alguno debe motivarse</b>.</li>\n<li><b>Plazos (78.3):</b> la convocatoria a instancia de miembros debe efectuarse <b>dentro de los cuatro días siguientes</b> a la petición.</li>\n</ul></div></details><details class=\"panel\"><summary>En lenguaje llano</summary><div class=\"body\"><p>La periodicidad la fija el propio Pleno al principio del mandato, en una sesión convocada para eso dentro de los treinta días siguientes a constituirse.</p></div></details><details class=\"panel\"><summary>¿Por qué existe?</summary><div class=\"body\"><div class=\"interp\"><span class=\"lbl\">Interpretación · aportación externa</span>Dejar que cada corporación fije su propio ritmo respeta su autonomía, pero el techo trimestral de la Ley impide que una mayoría cómoda convierta el Pleno en algo testimonial.</div></div></details><details class=\"panel\"><summary>Ejemplos</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Ejemplo 1</span>Constituida la corporación el 17 de junio, el Alcalde convoca antes del 17 de julio la extraordinaria para fijar la periodicidad.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 2</span>Cuatro concejales firman personalmente un escrito razonado pidiendo sesión extraordinaria: cumple el 78.2.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 3</span>Caso límite: el Alcalde excluye del orden del día uno de los asuntos pedidos. Puede, pero <b>debe motivarlo</b>.</div></div></details><details class=\"panel\"><summary>Trampas</summary><div class=\"body\"><div class=\"box warn\"><span class=\"lbl\">Cuidado</span>Contradicción aparente: el ROF 78.3 dice que la celebración <b>no podrá demorarse más de dos meses</b>, pero la LBRL 46.2.a), posterior y de rango superior, fija <b>quince días hábiles</b>. <b>Prevalece la Ley.</b> Es la pregunta trampa clásica del tema.</div></div></details><details class=\"panel\"><summary>Conexiones</summary><div class=\"body\"><p>Desarrolla el art. 46.1 y 46.2.a) LBRL. La convocatoria, en el art. 80.</p></div></details><details class=\"panel\"><summary>Anclaje memorístico</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Para retenerlo</span>Periodicidad: la fija el Pleno en los <b>30 días</b> tras constituirse, sin pasar del <b>trimestre</b>.</div></div></details></section><section class=\"card art\" id=\"rof80\"><h2><span class=\"num\">ROF 80</span> Convocatoria de las sesiones</h2><p class=\"ubic\">RD 2568/1986 ▸ Título III ▸ Capítulo I ▸ Sección 1.ª</p><div class=\"idea\">Convoca el Alcalde, con orden del día y borradores de actas, y dos días hábiles.</div><svg viewBox=\"0 0 980 284\" width=\"100%\" role=\"img\" aria-label=\"Periodicidad de las sesiones ordinarias del Pleno, plazo de convocatoria y régimen de las extraordinarias\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"t1bfrr2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#4b5563\"/></marker><marker id=\"t1bfer2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#15803d\"/></marker><marker id=\"t1bfwr2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#b45309\"/></marker></defs><text x=\"490\" y=\"24\" font-size=\"13\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"bold\">La convocatoria del Pleno · art. 46.2 LBRL y arts. 78 a 82 ROF</text><rect x=\"20\" y=\"42\" width=\"920\" height=\"32\" rx=\"8\" fill=\"#e8efff\" stroke=\"#1d4ed8\" stroke-width=\"1.4\"/><text x=\"480\" y=\"61.85\" font-size=\"11\" text-anchor=\"middle\" fill=\"#1d4ed8\" font-weight=\"bold\">PERIODICIDAD MÍNIMA DE LAS SESIONES ORDINARIAS · art. 46.2.a) LBRL</text><rect x=\"20\" y=\"82\" width=\"300\" height=\"72\" rx=\"8\" fill=\"#fdeceb\" stroke=\"#b91c1c\" stroke-width=\"1.4\"/><text x=\"170\" y=\"99.105\" font-size=\"10.3\" text-anchor=\"middle\" fill=\"#b91c1c\" font-weight=\"bold\">CADA MES</text><text x=\"170\" y=\"114.105\" font-size=\"10.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Municipios de más de</text><text x=\"170\" y=\"129.105\" font-size=\"10.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">20.000 habitantes</text><text x=\"170\" y=\"144.105\" font-size=\"10.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">y Diputaciones</text><rect x=\"340\" y=\"82\" width=\"300\" height=\"72\" rx=\"8\" fill=\"#fdf3e3\" stroke=\"#b45309\" stroke-width=\"1.4\"/><text x=\"490\" y=\"99.105\" font-size=\"10.3\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"bold\">CADA DOS MESES</text><text x=\"490\" y=\"114.105\" font-size=\"10.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Municipios de</text><text x=\"490\" y=\"129.105\" font-size=\"10.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">5.001 a 20.000</text><text x=\"490\" y=\"144.105\" font-size=\"10.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">habitantes</text><rect x=\"660\" y=\"82\" width=\"300\" height=\"72\" rx=\"8\" fill=\"#eaf6ee\" stroke=\"#15803d\" stroke-width=\"1.4\"/><text x=\"810\" y=\"106.605\" font-size=\"10.3\" text-anchor=\"middle\" fill=\"#15803d\" font-weight=\"bold\">CADA TRES MESES</text><text x=\"810\" y=\"121.605\" font-size=\"10.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Municipios de hasta</text><text x=\"810\" y=\"136.605\" font-size=\"10.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">5.000 habitantes</text><rect x=\"20\" y=\"166\" width=\"450\" height=\"56\" rx=\"8\" fill=\"#e8efff\" stroke=\"#1d4ed8\" stroke-width=\"1.4\"/><text x=\"245\" y=\"182.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#1d4ed8\" font-weight=\"bold\">CONVOCATORIA</text><text x=\"245\" y=\"197.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Al menos DOS DÍAS HÁBILES de antelación,</text><text x=\"245\" y=\"212.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">salvo extraordinaria urgente, que el Pleno ratifica</text><rect x=\"490\" y=\"166\" width=\"450\" height=\"56\" rx=\"8\" fill=\"#eaf6ee\" stroke=\"#15803d\" stroke-width=\"1.4\"/><text x=\"715\" y=\"182.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15803d\" font-weight=\"bold\">DOCUMENTACIÓN</text><text x=\"715\" y=\"197.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Íntegra, a disposición de los miembros DESDE EL</text><text x=\"715\" y=\"212.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">MISMO DÍA de la convocatoria, en la Secretaría</text><text x=\"490\" y=\"244\" font-size=\"10.3\" text-anchor=\"middle\" fill=\"#4b5563\" font-weight=\"normal\">Extraordinaria a petición de la CUARTA PARTE del número legal de miembros, y ningún concejal puede pedir más de TRES al año.</text><text x=\"490\" y=\"268\" font-size=\"9.6\" text-anchor=\"middle\" fill=\"#b91c1c\" font-weight=\"bold\">No puede demorarse más de QUINCE DÍAS HÁBILES; si no se convoca, queda automáticamente convocada el D

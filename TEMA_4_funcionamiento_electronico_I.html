rker id=\"t4cfrr4\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#4b5563\"/></marker><marker id=\"t4cfer4\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#15803d\"/></marker><marker id=\"t4cfwr4\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#b45309\"/></marker></defs><text x=\"490\" y=\"24\" font-size=\"13\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"bold\">Quién se identifica y con qué</text><rect x=\"20\" y=\"44\" width=\"460\" height=\"36\" rx=\"8\" fill=\"#e8efff\" stroke=\"#1d4ed8\" stroke-width=\"1.4\"/><text x=\"250\" y=\"66.2\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1d4ed8\" font-weight=\"bold\">LA ADMINISTRACIÓN</text><rect x=\"500\" y=\"44\" width=\"460\" height=\"36\" rx=\"8\" fill=\"#eaf6ee\" stroke=\"#15803d\" stroke-width=\"1.4\"/><text x=\"730\" y=\"66.2\" font-size=\"12\" text-anchor=\"middle\" fill=\"#15803d\" font-weight=\"bold\">LA PERSONA INTERESADA</text><rect x=\"20\" y=\"90\" width=\"460\" height=\"54\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"250\" y=\"106.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Certificado cualificado de</text><text x=\"250\" y=\"120.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">AUTENTICACIÓN DE SITIO WEB</text><text x=\"250\" y=\"134.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">para identificar la sede · art. 18</text><rect x=\"500\" y=\"90\" width=\"460\" height=\"54\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"730\" y=\"113.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Certificado cualificado de</text><text x=\"730\" y=\"127.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">FIRMA ELECTRÓNICA · LPAC 9.2.a)</text><rect x=\"20\" y=\"148\" width=\"460\" height=\"54\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"250\" y=\"171.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">SELLO ELECTRÓNICO basado en</text><text x=\"250\" y=\"185.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">certificado cualificado · LRJSP 40</text><rect x=\"500\" y=\"148\" width=\"460\" height=\"54\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"730\" y=\"171.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Certificado cualificado de</text><text x=\"730\" y=\"185.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">SELLO ELECTRÓNICO · LPAC 9.2.b)</text><rect x=\"20\" y=\"206\" width=\"460\" height=\"54\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"250\" y=\"229.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">CÓDIGO SEGURO DE VERIFICACIÓN</text><text x=\"250\" y=\"243.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">solo en actuación automatizada · LRJSP 42</text><rect x=\"500\" y=\"206\" width=\"460\" height=\"54\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"730\" y=\"229.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">CLAVE CONCERTADA y otros sistemas</text><text x=\"730\" y=\"243.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">con registro previo · LPAC 9.2.c)</text><rect x=\"20\" y=\"264\" width=\"460\" height=\"54\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"250\" y=\"287.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">FIRMA DEL PERSONAL al servicio</text><text x=\"250\" y=\"301.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">de la Administración · LRJSP 43</text><rect x=\"500\" y=\"264\" width=\"460\" height=\"54\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"730\" y=\"287.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">El FUNCIONARIO HABILITADO firma</text><text x=\"730\" y=\"301.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">por quien no tiene medios · LPAC 12.2</text><text x=\"490\" y=\"340\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"bold\">Los tres sistemas del interesado son los mismos para identificarse (art. 9.2) y para firmar (art. 10.2). Lo que cambia es para qué se usan.</text></svg><details class=\"panel\" open><summary>Texto legal</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LPAC</span><p><b>Artículo 9. Sistemas de identificación de los interesados en el procedimiento.</b></p><p>1. Las Administraciones Públicas están obligadas a verificar la identidad de los interesados en el procedimiento administrativo, mediante la comprobación de su nombre y apellidos o denominación o razón social, según corresponda, que consten en el Documento Nacional de Identidad o documento identificativo equivalente.</p><p>2. Los interesados podrán identificarse electrónicamente ante las Administraciones Públicas a través de los sistemas siguientes:</p><p>a) Sistemas basados en certificados electrónicos cualificados de firma electrónica expedidos por prestadores incluidos en la ‘‘Lista de confianza de prestadores de servicios de certificación’’.</p><p>b) Sistemas basados en certificados electrónicos cualificados de sello electrónico expedidos por prestadores incluidos en la ‘‘Lista de confianza de prestadores de servicios de certificación’’.</p><p>c) Cualquier otro sistema que las Administraciones públicas consideren válido en los términos y condiciones que se establezca, siempre que cuenten con un registro previo como usuario que permita garantizar su identidad y previa comunicación a la Secretaría General de Administración Digital del Ministerio de Asuntos Económicos y Transformación Digital. Esta comunicación vendrá acompañada de una declaración responsable de que se cumple con todos los requisitos establecidos en la normativa vigente. De forma previa a la eficacia jurídica del sistema, habrán de transcurrir dos meses desde dicha comunicación, durante los cuales el órgano estatal competente por motivos de seguridad pública podrá acudir a la vía jurisdiccional, previo informe vinculante de la Secretaría de Estado de Seguridad, que deberá emitir en el plazo de diez días desde su solicitud. Las Administraciones Públicas deberán garantizar que la utilización de uno de los sistemas previstos en las letras a) y b) sea posible para todo procedimiento, aun cuando se admita para ese mismo procedimiento alguno de los previstos en la letra c).</p><p>3. En relación con los sistemas de identificación previstos en la letra c) del apartado anterior, se establece la obligatoriedad de que los recursos técnicos necesarios para la recogida, almacenamiento, tratamiento y gestión de dichos sistemas se encuentren situados en territorio de la Unión Europea, y en caso de tratarse de categorías especiales de datos a los que se refiere el artículo 9 del Reglamento (UE) 2016/679, del Parlamento Europeo y del Consejo, de 27 de abril de 2016, relativo a la protección de las personas físicas en lo que respecta al tratamiento de datos personales y a la libre circulación de estos datos y por el que se deroga la Directiva 95/46/CE, en territorio español. En cualquier caso, los datos se encontrarán disponibles para su acceso por parte de las autoridades judiciales y administrativas competentes. Los datos a que se refiere el párrafo anterior no podrán ser objeto de transferencia a un tercer país u organización internacional, con excepción de los que hayan sido objeto de una decisión de adecuación de la Comisión Europea o cuando así lo exija el cumplimiento de las obligaciones internacionales asumidas por el Reino de España.</p><p>4. En todo caso, la aceptación de alguno de estos sistemas por la Administración General del Estado servirá para acreditar frente a todas las Administraciones Públicas, salvo prueba en contrario, la identificación electrónica de los interesados en el procedimiento administrativo.</p></div></div></details><details class=\"panel\"><summary>Disección</summary><div class=\"body\"><ul>\n<li><b>Deber de la Administración (9.1):</b> está <b>obligada a verificar la identidad</b> de los interesados comprobando nombre y apellidos o denominación o razón social que consten en el DNI o documento equivalente.</li>\n<li><b>a)</b> Sistemas basados en <b>certificados electrónicos cualificados de firma electrónica</b> de prestadores incluidos en la lista de confianza.</li>\n<li><b>b)</b> Sistemas basados en <b>certificados electrónicos cualificados de sello electrónico</b> de esos mismos prestadores.</li>\n<li><b>c)</b> <b>Cualquier otro sistema</b> que las Administraciones consideren válido, siempre que cuente con <b>registro previo como usuario</b> que garantice su identidad y previa comunicación, con declaración responsable. Antes de que el sistema tenga eficacia jurídica deben <b>transcurrir dos meses</b> desde esa comunicación.</li>\n</ul></div></details><details class=\"panel\"><summary>En lenguaje llano</summary><div class=\"body\"><p>Para identificarte ante la Administración valen tres cosas: tu certificado de firma, un certificado de sello si eres una entidad, o un sistema de clave que te hayan dado tras registrarte y comprobar quién eres.</p></div></details><details class=\"panel\"><summary>¿Por qué existe?</summary><div class=\"body\"><div class=\"interp\"><span class=\"lbl\">Interpretación · aportación externa</span>Identificar es el paso previo a todo. Si la Administración no sabe quién está al otro lado, ni puede notificar, ni puede imputar efectos, ni puede proteger los datos de nadie.</div></div></details><details class=\"panel\"><summary>Ejemplos</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Ejemplo 1</span>Una persona entra a la sede con Cl@ve: letra c), sistema de clave concertada con registro previo.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 2</span>Una empresa se identifica con su certificado de sello: letra b).</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 3</span>Caso límite: una Administración quiere lanzar su propio sistema de identificación. No basta con aprobarlo: hay comunicación, declaración responsable y <b>dos meses</b> hasta que produzca efectos.</div></div></details><details class=\"panel\"><summary>Trampas</summary><div class=\"body\"><div class=\"box warn\"><span class=\"lbl\">Cuidado</span>Los <b>dos meses</b> de la letra c) son la cifra del artículo y la que se pregunta. Y fíjate en que el 9.1 impone un <b>deber de verificar</b>, no una facultad.</div></div></details><details class=\"panel\"><summary>Conexiones</summary><div class=\"body\"><p>Los mismos tres sistemas sirven para firmar (art. 10.2). Se desarrollan en los arts. 26 y 28 del RD 203/2021.</p></div></details><details class=\"panel\"><summary>Anclaje memorístico</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Para retenerlo</span>Tres letras: <b>firma, sello y clave</b>. Y la cifra: <b>dos meses</b>.</div></div></details></section><section class=\"card art\" id=\"lpac10\"><h2><span class=\"num\">LPAC 10</span> Sistemas de firma admitidos por las Administraciones Públicas</h2><p class=\"ubic\">Ley 39/2015 ▸ Título I ▸ Capítulo I</p><div class=\"idea\">Los mismos tres sistemas del art. 9, ahora para expresar voluntad.</div><svg viewBox=\"0 0 980 352\" width=\"100%\" role=\"img\" aria-label=\"Sistemas de identificación y firma de la Administración frente a los de la persona interesada\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"t4cfrr5\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#4b5563\"/></marker><marker id=\"t4cfer5\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#15803d\"/></marker><marker id=\"t4cfwr5\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#b45309\"/></marker></defs><text x=\"490\" y=\"24\" font-size=\"13\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"bold\">Quién se identifica y con qué</text><rect x=\"20\" y=\"44\" width=\"460\" height=\"36\" rx=\"8\" fill=\"#e8efff\" stroke=\"#1d4ed8\" stroke-width=\"1.4\"/><text x=\"250\" y=\"66.2\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1d4ed8\" font-weight=\"bold\">LA ADMINISTRACIÓN</text><rect x=\"500\" y=\"44\" width=\"460\" height=\"36\" rx=\"8\" fill=\"#eaf6ee\" stroke=\"#15803d\" stroke-width=\"1.4\"/><text x=\"730\" y=\"66.2\" font-size=\"12\" text-anchor=\"middle\" fill=\"#15803d\" font-weight=\"bold\">LA PERSONA INTERESADA</text><rect x=\"20\" y=\"90\" width=\"460\" height=\"54\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"250\" y=\"106.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Certificado cualificado de</text><text x=\"250\" y=\"120.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">AUTENTICACIÓN DE SITIO WEB</text><text x=\"250\" y=\"134.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">para identificar la sede · art. 18</text><rect x=\"500\" y=\"90\" width=\"460\" height=\"54\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"730\" y=\"113.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Certificado cualificado de</text><text x=\"730\" y=\"127.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">FIRMA ELECTRÓNICA · LPAC 9.2.a)</text><rect x=\"20\" y=\"148\" width=\"460\" height=\"54\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"250\" y=\"171.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">SELLO ELECTRÓNICO basado en</text><text x=\"250\" y=\"185.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">certificado cualificado · LRJSP 40</text><rect x=\"500\" y=\"148\" width=\"460\" height=\"54\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"730\" y=\"171.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Certificado cualificado de</text><text x=\"730\" y=\"185.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">SELLO ELECTRÓNICO · LPAC 9.2.b)</text><rect x=\"20\" y=\"206\" width=\"460\" height=\"54\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"250\" y=\"229.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">CÓDIGO SEGURO DE VERIFICACIÓN</text><text x=\"250\" y=\"243.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">solo en actuación automatizada · LRJSP 42</text><rect x=\"500\" y=\"206\" width=\"460\" height=\"54\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"730\" y=\"229.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">CLAVE CONCERTADA y otros sistemas</text><text x=\"730\" y=\"243.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">con registro previo · LPAC 9.2.c)</text><rect x=\"20\" y=\"264\" width=\"460\" height=\"54\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"250\" y=\"287.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">FIRMA DEL PERSONAL al servicio</text><text x=\"250\" y=\"301.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">de la Administración · LRJSP 43</text><rect x=\"500\" y=\"264\" width=\"460\" height=\"54\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"730\" y=\"287.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">El FUNCIONARIO HABILITADO firma</text><text x=\"730\" y=\"301.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">por quien no tiene medios · LPAC 12.2</text><text x=\"490\" y=\"340\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"bold\">Los tres sistemas del interesado son los mismos para identificarse (art. 9.2) y para firmar (art. 10.2). Lo que cambia es para qué se usan.</text></svg><details class=\"panel\" open><summary>Texto legal</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LPAC</span><p><b>Artículo 10. Sistemas de firma admitidos por las Administraciones Públicas.</b></p><p>1. Los interesados podrán firmar a través de cualquier medio que permita acreditar la autenticidad de la expresión de su voluntad y consentimiento, así como la integridad e inalterabilidad del documento.</p><p>2. En el caso de que los interesados optaran por relacionarse con las Administraciones Públicas a través de medios electrónicos, se considerarán válidos a efectos de firma:</p><p>a) Sistemas de firma electrónica cualificada y avanzada basados en certificados electrónicos cualificados de firma electrónica expedidos por prestadores incluidos en la ‘‘Lista de confianza de prestadores de servicios de certificación’’.</p><p>b) Sistemas de sello electrónico cualificado y de sello electrónico avanzado basados en certificados electrónicos cualificados de sello electrónico expedidos por prestador incluido en la ‘‘Lista de confianza de prestadores de servicios de certificación’’.</p><p>c) Cualquier otro sistema que las Administraciones públicas consideren válido en los términos y condiciones que se establezca, siempre que cuenten con un registro previo como usuario que permita garantizar su identidad y previa comunicación a la Secretaría General de Administración Digital del Ministerio de Asuntos Económicos y Transformación Digital. Esta comunicación vendrá acompañada de una declaración responsable de que se cumple con todos los requisitos establecidos en la normativa vigente. De forma previa a la eficacia jurídica del sistema, habrán de transcurrir dos meses desde dicha comunicación, durante los cuales el órgano estatal competente por motivos de seguridad pública podrá acudir a la vía jurisdiccional, previo informe vinculante de la Secretaría de Estado de Seguridad, que deberá emitir en el plazo de diez días desde su solicitud. Las Administraciones Públicas deberán garantizar que la utilización de uno de los sistemas previstos en las letras a) y b) sea posible para todos los procedimientos en todos sus trámites, aun cuando adicionalmente se permita alguno de los previstos al amparo de lo dispuesto en la letra c).</p><p>3. En relación con los sistemas de firma previstos en la letra c) del apartado anterior, se establece la obligatoriedad de que los recursos técnicos necesarios para la recogida, almacenamiento, tratamiento y gestión de dichos sistemas se encuentren situados en territorio de la Unión Europea, y en caso de tratarse de categorías especiales de datos a los que se refiere el artículo 9 del Reglamento (UE) 2016/679, del Parlamento Europeo y del Consejo, de 27 de abril de 2016, en territorio español. En cualquier caso, los datos se encontrarán disponibles para su acceso por parte de las autoridades judiciales y administrativas competentes. Los datos a que se refiere el párrafo anterior no podrán ser objeto de transferencia a un tercer país u organización internacional, con excepción de los que hayan sido objeto de una decisión de adecuación de la Comisión Europea o cuando así lo exija el cumplimiento de las obligaciones internacionales asumidas por el Reino de España.</p><p>4. Cuando así lo disponga expresamente la normativa reguladora aplicable, las Administraciones Públicas podrán admitir los sistemas de identificación contemplados en esta Ley como sistema de firma cuando permitan acreditar la autenticidad de la expresión de la voluntad y consentimiento de los interesados.</p><p>5. Cuando los interesados utilicen un sistema de firma de los previstos en este artículo, su identidad se entenderá ya acreditada mediante el propio acto de la firma.</p></div></div></details><details class=\"panel\"><summary>Disección</summary><div class=\"body\"><ul>\n<li><b>Regla general (10.1):</b> los interesados podrán firmar <b>a través de cualquier medio</b> que permita acreditar <b>la autenticidad de la expresión de su voluntad y consentimiento</b>, así como <b>la integridad e inalterabilidad</b> del documento.</li>\n<li><b>Si se relacionan electrónicamente (10.2):</b> valen la <b>firma electrónica cualificada y avanzada</b> basada en certificados cualificados de firma; el <b>sello cualificado y avanzado</b> basado en certificados cualificados de sello; y <b>cualquier otro sistema</b> con registro previo, con la misma comunicación y los mismos plazos del art. 9.</li>\n</ul></div></details><details class=\"panel\"><summary>En lenguaje llano</summary><div class=\"body\"><p>Firmar es decir «esto lo quiero yo». La ley acepta cualquier medio que demuestre dos cosas: que la voluntad es tuya y que el documento no se ha tocado después.</p></div></details><details class=\"panel\"><summary>¿Por qué existe?</summary><div class=\"body\"><div class=\"interp\"><span class=\"lbl\">Interpretación · aportación externa</span>El legislador no quiso atarse a una tecnología concreta, que envejece. Por eso el 10.1 fija el resultado exigible —autenticidad e integridad— y deja abierto el medio.</div></div></details><details class=\"panel\"><summary>Ejemplos</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Ejemplo 1</span>Presentas un recurso firmado con tu certificado cualificado: art. 10.2.a).</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 2</span>Una entidad presenta una declaración responsable con sello cualificado: letra b).</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 3</span>Caso límite: firma manuscrita digitalizada en una tableta en la oficina de asistencia. Cabe por el 10.1 si el sistema acredita autenticidad e integridad.</div></div></details><details class=\"panel\"><summary>Trampas</summary><div class=\"body\"><div class=\"box warn\"><span class=\"lbl\">Cuidado</span>Los tres sistemas de los arts. 9 y 10 <b>son los mismos</b>. Lo que cambia es la función: identificar es decir quién eres; firmar es decir que quieres.</div></div></details><details class=\"panel\"><summary>Conexiones</summary><div class=\"body\"><p>Con el art. 11, que dice <b>cuándo</b> se exige firma, y con el art. 12 para quien no tiene medios.</p></div></details><details class=\"panel\"><summary>Anclaje memorístico</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Para retenerlo</span><b>Identificar = quién eres. Firmar = qué quieres.</b> Mismos tres sistemas.</div></div></details></section><section class=\"card art\" id=\"lpac11\"><h2><span class=\"num\">LPAC 11</span> Uso de medios de identificación y firma en el procedimiento</h2><p class=\"ubic\">Ley 39/2015 ▸ Título I ▸ Capítulo I</p><div class=\"idea\">Con identificarse basta; la firma solo se exige en cinco casos tasados.</div><svg viewBox=\"0 0 960 270\" width=\"100%\" role=\"img\" aria-label=\"La identificación basta con carácter general y la firma solo se exige en cinco casos tasados\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"t4efrr2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#4b5563\"/></marker><marker id=\"t4efer2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#15803d\"/></marker><marker id=\"t4efwr2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#b45309\"/></marker></defs><text x=\"480\" y=\"24\" font-size=\"13\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"bold\">Identificarse no es firmar</text><rect x=\"20\" y=\"44\" width=\"920\" height=\"44\" rx=\"8\" fill=\"#eaf6ee\" stroke=\"#15803d\" stroke-width=\"1.4\"/><text x=\"480\" y=\"70.025\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#15803d\" font-weight=\"bold\">REGLA GENERAL · LPAC 11.1: para cualquier actuación del procedimiento BASTA CON IDENTIFICARSE</text><rect x=\"20\" y=\"100\" width=\"920\" height=\"34\" rx=\"8\" fill=\"#fdf3e3\" stroke=\"#b45309\" stroke-width=\"1.4\"/><text x=\"480\" y=\"121.025\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"bold\">LA FIRMA SOLO SE EXIGE EN CINCO CASOS · LPAC 11.2 · lista cerrada</text><rect x=\"20\" y=\"144\" width=\"300\" height=\"54\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"170\" y=\"167.35\" font-size=\"11\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">a) Formular SOLICITUDES</text><text x=\"170\" y=\"182.35\" font-size=\"11\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">b) Presentar DECLARACIONES</text><rect x=\"330\" y=\"144\" width=\"300\" height=\"54\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"480\" y=\"167.35\" font-size=\"11\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">responsables o comunicaciones</text><text x=\"480\" y=\"182.35\" font-size=\"11\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">c) Interponer RECURSOS</text><rect x=\"640\" y=\"144\" width=\"300\" height=\"54\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"790\" y=\"167.35\" font-size=\"11\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">d) DESISTIR de acciones</text><text x=\"790\" y=\"182.35\" font-size=\"11\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">e) RENUNCIAR a derechos</text><rect x=\"20\" y=\"210\" width=\"920\" height=\"34\" rx=\"8\" fill=\"#e8efff\" stroke=\"#1d4ed8\" stroke-width=\"1.4\"/><text x=\"480\" y=\"231.025\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#1d4ed8\" font-weight=\"bold\">Regla de los dedos: Solicitar · Declarar · Recurrir · Desistir · Renunciar → S-D-R-D-R</text></svg><details class=\"panel\" open><summary>Texto legal</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LPAC</span><p><b>Artículo 11. Uso de medios de identificación y firma en el procedimiento administrativo.</b></p><p>1. Con carácter general, para realizar cualquier actuación prevista en el procedimiento administrativo, será suficiente con que los interesados acrediten previamente su identidad a través de cualquiera de los medios de identificación previstos en esta Ley.</p><p>2. Las Administraciones Públicas sólo requerirán a los interesados el uso obligatorio de firma para:</p><p>a) Formular solicitudes.</p><p>b) Presentar declaraciones responsables o comunicaciones.</p><p>c) Interponer recursos.</p><p>d) Desistir de acciones.</p><p>e) Renunciar a derechos.</p></div></div></details><details class=\"panel\"><summary>Disección</summary><div class=\"body\"><ul>\n<li><b>Regla general (11.1):</b> «Con carácter general, para realizar <b>cualquier actuación</b> prevista en el procedimiento administrativo, <b>será suficiente con que los interesados acrediten previamente su identidad</b>».</li>\n<li><b>Excepciones (11.2):</b> las Administraciones <b>sólo</b> requerirán firma para: <b>a)</b> formular solicitudes; <b>b)</b> presentar declaraciones responsables o comunicaciones; <b>c)</b> interponer recursos; <b>d)</b> desistir de acciones; <b>e)</b> renunciar a derechos.</li>\n<li><b>Es una lista cerrada.</b> El «sólo» del 11.2 es la palabra clave del artículo.</li>\n</ul></div></details><details class=\"panel\"><summary>En lenguaje llano</summary><div class=\"body\"><p>Para consultar, aportar un papel o mirar cómo va lo tuyo, basta con decir quién eres. La firma se reserva para los cinco momentos en los que estás creando, defendiendo o abandonando un derecho.</p></div></details><details class=\"panel\"><summary>¿Por qué existe?</summary><div class=\"body\"><div class=\"interp\"><span class=\"lbl\">Interpretación · aportación externa</span>Exigir firma para todo convertiría cada trámite menor en un obstáculo. El legislador la reserva para los actos que comprometen de verdad la posición jurídica del interesado.</div></div></details><details class=\"panel\"><summary>Ejemplos</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Ejemplo 1</span>Consultar el expediente de una subvención: basta identificarse.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 2</span>Presentar la solicitud de esa subvención: firma, letra a).</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 3</span>Caso límite: aportar documentación requerida en un trámite de subsanación. No es ninguna de las cinco letras, luego basta identificación. Ahora bien, si la subsanación consiste precisamente en firmar la solicitud que no iba firmada, entonces sí.</div></div></details><details class=\"panel\"><summary>Trampas</summary><div class=\"body\"><div class=\"box warn\"><span class=\"lbl\">Cuidado</span>Es la <b>lista cerrada</b> que más se pregunta. Memorízala entera: si una opción de test añade «aportar documentos» o «consultar el expediente», está mal.</div></div></details><details class=\"panel\"><summary>Conexiones</summary><div class=\"body\"><p>Con el art. 66.1.e), que exige la firma en la solicitud, y con el art. 68.1, que la hace subsanable en diez días.</p></div></details><details class=\"panel\"><summary>Anclaje memorístico</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Para retenerlo</span><b>S-D-R-D-R</b>: <b>S</b>olicitar · <b>D</b>eclarar · <b>R</b>ecurrir · <b>D</b>esistir · <b>R</b>enunciar. Cinco dedos de una mano.</div></div></details></section><section class=\"card art\" id=\"lpac12\"><h2><span class=\"num\">LPAC 12</span> Asistencia en el uso de medios electrónicos a los interesados</h2><p class=\"ubic\">Ley 39/2015 ▸ Título I ▸ Capítulo I</p><div class=\"idea\">Quien no tiene medios puede ser identificado y firmar a través de un funcionario habilitado.</div><svg viewBox=\"0 0 960 280\" width=\"100%\" role=\"img\" aria-label=\"Canales de asistencia y requisitos de la actuación del funcionario habilitado\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"t4ffrr2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#4b5563\"/></marker><marker id=\"t4ffer2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#15803d\"/></marker><marker id=\"t4ffwr2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#b45309\"/></marker></defs><text x=\"480\" y=\"24\" font-size=\"13\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"bold\">Asistencia: canales y funcionario habilitado</text><rect x=\"20\" y=\"44\" width=\"920\" height=\"32\" rx=\"8\" fill=\"#e8efff\" stroke=\"#1d4ed8\" stroke-width=\"1.4\"/><text x=\"480\" y=\"64.025\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#1d4ed8\" font-weight=\"bold\">CANALES DE ASISTENCIA · RD 203/2021, art. 4</text><rect x=\"20\" y=\"84\" width=\"148\" height=\"46\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"94\" y=\"104\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">a) Presencial</text><text x=\"94\" y=\"117\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">en oficinas de asistencia</text><rect x=\"174\" y=\"84\" width=\"148\" height=\"46\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"248\" y=\"104\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">b) Portales de internet</text><text x=\"248\" y=\"117\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">y sedes electrónicas</text><rect x=\"328\" y=\"84\" width=\"148\" height=\"46\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"402\" y=\"104\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">c) Redes sociales</text><text x=\"402\" y=\"117\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\"></text><rect x=\"482\" y=\"84\" width=\"148\" height=\"46\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"556\" y=\"104\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">d) Telefónico</text><text x=\"556\" y=\"117\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\"></text><rect x=\"636\" y=\"84\" width=\"148\" height=\"46\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"710\" y=\"104\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">e) Correo electrónico</text><text x=\"710\" y=\"117\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\"></text><rect x=\"790\" y=\"84\" width=\"148\" height=\"46\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"864\" y=\"104\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">f) Cualquier otro</text><text x=\"864\" y=\"117\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">art. 12 LPAC</text><rect x=\"20\" y=\"144\" width=\"920\" height=\"34\" rx=\"8\" fill=\"#fdf3e3\" stroke=\"#b45309\" stroke-width=\"1.4\"/><text x=\"480\" y=\"165.025\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"bold\">FUNCIONARIO HABILITADO · LPAC 12.2 · firma por quien NO dispone de medios electrónicos</text><rect x=\"20\" y=\"186\" width=\"450\" height=\"56\" rx=\"8\" fill=\"#eaf6ee\" stroke=\"#15803d\" stroke-width=\"1.4\"/><text x=\"245\" y=\"203.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15803d\" font-weight=\"bold\">DOS REQUISITOS</text><text x=\"245\" y=\"217.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">1 · El interesado se IDENTIFICA ante el funcionario</text><text x=\"245\" y=\"231.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">2 · Presta CONSENTIMIENTO EXPRESO, con constancia</text><rect x=\"490\" y=\"186\" width=\"450\" height=\"56\" rx=\"8\" fill=\"#fdeceb\" stroke=\"#b91c1c\" stroke-width=\"1.4\"/><text x=\"715\" y=\"203.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#b91c1c\" font-weight=\"bold\">SOLO PARA</text><text x=\"715\" y=\"217.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">quienes NO están obligados a relacionarse</text><text x=\"715\" y=\"231.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">electrónicamente (art. 14.2 y 14.3)</text><text x=\"480\" y=\"264\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#4b5563\" font-weight=\"normal\">Cada Administración mantiene actualizado un registro de funcionarios habilitados (LPAC 12.3).</text></svg><details class=\"panel\" open><summary>Texto legal</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LPAC</span><p><b>Artículo 12. Asistencia en el uso de medios electrónicos a los interesados.</b></p><p>1. Las Administraciones Públicas deberán garantizar que los interesados pueden relacionarse con la Administración a través de medios electrónicos, para lo que pondrán a su disposición los canales de acceso que sean necesarios así como los sistemas y aplicaciones que en cada caso se determinen.</p><p>2. Las Administraciones Públicas asistirán en el uso de medios electrónicos a los interesados no incluidos en los apartados 2 y 3 del artículo 14 que así lo soliciten, especialmente en lo referente a la identificación y firma electrónica, presentación de solicitudes a través del registro electrónico general y obtención de copias auténticas. Asimismo, si alguno de estos interesados no dispone de los medios electrónicos necesarios, su identificación o firma electrónica en el procedimiento administrativo podrá ser válidamente realizada por un funcionario público mediante el uso del sistema de firma electrónica del que esté dotado para ello. En este caso, será necesario que el interesado que carezca de los medios electrónicos necesarios se identifique ante el funcionario y preste su consentimiento expreso para esta actuación, de lo que deberá quedar constancia para los casos de discrepancia o litigio.</p><p>3. La Administración General del Estado, las Comunidades Autónomas y las Entidades Locales mantendrán actualizado un registro, u otro sistema equivalente, donde constarán los funcionarios habilitados para la identificación o firma regulada en este artículo. Estos registros o sistemas deberán ser plenamente interoperables y estar interconectados con los de las restantes Administraciones Públicas, a los efectos de comprobar la validez de las citadas habilitaciones. En este registro o sistema equivalente, al menos, constarán los funcionarios que presten servicios en las oficinas de asistencia en materia de registros.</p></div></div></details><details class=\"panel\"><summary>Disección</summary><div class=\"body\"><ul>\n<li><b>Garantía (12.1):</b> las Administraciones deben <b>garantizar</b> que los interesados pueden relacionarse electrónicamente, poniendo a su disposición los <b>canales de acceso</b> necesarios y los sistemas y aplicaciones que se determinen.</li>\n<li><b>A quién se asiste (12.2):</b> a los interesados <b>no incluidos en los apartados 2 y 3 del art. 14</b> —es decir, a los <b>no obligados</b>— que así lo soliciten, especialmente en identificación y firma, presentación de solicitudes en el registro electrónico general y obtención de copias auténticas.</li>\n<li><b>El funcionario habilitado (12.2):</b> si el interesado <b>no dispone de los medios electrónicos necesarios</b>, su identificación o firma podrá realizarla válidamente <b>un funcionario público</b> con su propio sistema de firma. Hacen falta <b>dos cosas</b>: que el interesado <b>se identifique ante el funcionario</b> y que <b>preste su consentimiento expreso</b>, del que debe <b>quedar constancia</b>.</li>\n<li><b>Registro (12.3):</b> Estado, comunidades autónomas y <b>entidades locales</b> mantienen actualizado un <b>registro</b> u otro sistema equivalente de funcionarios habilitados.</li>\n</ul></div></details><details class=\"panel\"><summary>En lenguaje llano</summary><div class=\"body\"><p>Si estás obligado a hacerlo electrónicamente y no puedes, un funcionario lo hace por ti con su firma, pero solo si te identificas delante de él y dices expresamente que sí, y queda constancia de ello.</p></div></details><details class=\"panel\"><summary>¿Por qué existe?</summary><div class=\"body\"><div class=\"interp\"><span class=\"lbl\">Interpretación · aportación externa</span>Es el contrapeso del art. 14. Obligar a relacionarse electrónicamente sin una vía de auxilio dejaría fuera del procedimiento a quien no tiene medios, lo que equivaldría a negarle el acceso a la Administración.</div></div></details><details class=\"panel\"><summary>Ejemplos</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Ejemplo 1</span>Una persona mayor sin certificado presenta una instancia en la oficina de asistencia: el funcionario habilitado la identifica y firma por ella con constancia de su consentimiento.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 2</span>Esa misma oficina le expide una copia auténtica de un documento que aporta.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 3</span>Caso límite: una sociedad mercantil, obligada por el art. 14.2.a), pide asistencia. El art. 12.2 asiste a los <b>no obligados</b>: a ella no le alcanza esa asistencia.</div></div></details><details class=\"panel\"><summary>Trampas</summary><div class=\"body\"><div class=\"box warn\"><span class=\"lbl\">Cuidado</span>Dos trampas: el funcionario habilitado asiste a los <b>no obligados</b>, no a cualquiera; y los <b>dos requisitos</b> —identificación ante el funcionario y consentimiento expreso con constancia— se preguntan juntos. Falta uno y la actuación no es válida.</div></div></details><details class=\"panel\"><summary>Conexiones</summary><div class=\"body\"><p>Con el art. 14 —quién está obligado—, con el art. 4 del RD 203/2021 —canales— y con el art. 31 del Reglamento —registro de funcionarios habilitados en el Estado—.</p></div></details><details class=\"panel\"><summary>Anclaje memorístico</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Para retenerlo</span>Funcionario habilitado = <b>identificación + consentimiento expreso + constancia</b>. Y solo para <b>no obligados</b>.</div></div></details></section><section class=\"card art\" id=\"rd203_28\"><h2><span class=\"num\">RD 203/2021 28</span> Sistemas de clave concertada y otros sistemas de identificación</h2><p class=\"ubic\">RD 203/2021 ▸ Capítulo III ▸ Sección 2.ª</p><div class=\"idea\">Qué datos mínimos debe contener una clave concertada y quién la autoriza.</div><details class=\"panel\" open><summary>Texto legal</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · RD 203/2021</span><p><b>Artículo 28. Sistemas de clave concertada y otros sistemas de identificación de las personas interesadas.</b></p><p>1. Los sistemas de clave concertada o cualquier otro sistema que las Administraciones Públicas consideren válidos, admitidos para la identificación electrónica de persona física de conformidad con el artículo 9.2.c) de la Ley 39/2015, de 1 de octubre, deberán ajustarse a lo previsto en el Esquema Nacional de Seguridad y contener, como mínimo, el nombre y apellidos y el número de Documento Nacional de Identidad, Número de Identificación de Extranjero, Número de Identificación Consular Central o Número de Identificación Fiscal y, para los casos en que así se establezca en la definición del sistema, el número de pasaporte.</p><p>2. Los sistemas de identificación a que se refiere el apartado anterior deberán ser autorizados previamente por la Secretaría General de Administración Digital del Ministerio de Asuntos Económicos y Transformación Digital, que solo podrá ser denegada por motivos de seguridad pública, previo informe vinculante de la Secretaría de Estado de Seguridad del Ministerio del Interior.</p><p>3. En el ámbito estatal, la creación de los nuevos sistemas de identificación será aprobada por orden de la persona titular del Ministerio o, en su caso, resolución de la persona titular de la Presidencia o de la Dirección del organismo público o entidad de derecho público vinculado o dependiente por razón del ámbito material en que se vaya a utilizar, previa autorización de la Secretaría General de Administración Digital a que se refiere el apartado anterior. Cuando el nuevo sistema se refiera a la totalidad de la Administración General del Estado se requerirá Acuerdo del Consejo de Ministros a propuesta de la persona titular del Ministerio de Asuntos Económicos y Transformación Digital. En este caso, este sistema deberá estar accesible a través de la Plataforma común del Sector Público Administrativo Estatal para la identificación, autenticación y firma electrónica mediante el uso de claves concertadas.</p></div></div></details><details class=\"panel\"><summary>Disección</summary><div class=\"body\"><ul>\n<li><b>Contenido mínimo (28.1):</b> deben ajustarse al <b>Esquema Nacional de Seguridad</b> y contener, como mínimo, <b>nombre y apellidos</b> y el <b>número de DNI, NIE, Número de Identificación Consular Central o NIF</b> y, cuando así se establezca, el número de pasaporte.</li>\n<li><b>Autorización previa (28.2):</b> requieren <b>autorización previa</b> de la Secretaría General de Administración Digital, que <b>solo podrá denegarse por motivos de seguridad pública</b>, previo <b>informe vinculante</b> de la Secretaría de Estado de Seguridad.</li>\n</ul></div></details><details class=\"panel\"><summary>En lenguaje llano</summary><div class=\"body\"><p>Una clave tipo Cl@ve no se monta por libre: tiene que llevar unos datos mínimos, cumplir el Esquema Nacional de Seguridad y estar autorizada.</p></div></details><details class=\"panel\"><summary>¿Por qué existe?</summary><div class=\"body\"><div class=\"interp\"><span class=\"lbl\">Interpretación · aportación externa</span>Si cada Administración pudiera inventar su sistema de claves sin control, la identidad electrónica sería un mosaico de niveles de seguridad distintos y la interoperabilidad resultaría imposible.</div></div></details><details class=\"panel\"><summary>Ejemplos</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Ejemplo 1</span>Cl@ve es el sistema de clave concertada de referencia en el ámbito estatal.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 2</span>Un ayuntamiento quiere su propia clave para trámites menores: necesita la autorización previa del art. 28.2.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 3</span>Caso límite: la denegación solo cabe por <b>seguridad pública</b> y con <b>informe vinculante</b>. No puede denegarse por razones de oportunidad.</div></div></details><details class=\"panel\"><summary>Trampas</summary><div class=\"body\"><div class=\"box warn\"><span class=\"lbl\">Cuidado</span>Fíjate en «<b>informe vinculante</b>»: no es un informe más, decide. Y el motivo de denegación es <b>uno solo</b>.</div></div></details><details class=\"panel\"><summary>Conexiones</summary><div class=\"body\"><p>Desarrolla el art. 9.2.c) LPAC. El art. 26 del Reglamento recoge los tres sistemas de identificación del interesado.</p></div></details><details class=\"panel\"><summary>Anclaje memorístico</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Para retenerlo</span>Clave concertada: <b>nombre, apellidos y número de documento</b>, y <b>autorización previa</b> que solo decae por seguridad pública.</div></div></details></section><section class=\"card art\" id=\"rd203_31\"><h2><span class=\"num\">RD 203/2021 31</span> Registro de Funcionarios Habilitados</h2><p class=\"ubic\">RD 203/2021 ▸ Capítulo III ▸ Sección 3.ª</p><div class=\"idea\">Quién se inscribe en el registro de funcionarios habilitados y para qué está habilitado.</div><svg viewBox=\"0 0 960 280\" width=\"100%\" role=\"img\" aria-label=\"Canales de asistencia y requisitos de la actuación del funcionario habilitado\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"t4ffrr3\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#4b5563\"/></marker><marker id=\"t4ffer3\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#15803d\"/></marker><marker id=\"t4ffwr3\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#b45309\"/></marker></defs><text x=\"480\" y=\"24\" font-size=\"13\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"bold\">Asistencia: canales y funcionario habilitado</text><rect x=\"20\" y=\"44\" width=\"920\" height=\"32\" rx=\"8\" fill=\"#e8efff\" stroke=\"#1d4ed8\" stroke-width=\"1.4\"/><text x=\"480\" y=\"64.025\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#1d4ed8\" font-weight=\"bold\">CANALES DE ASISTENCIA · RD 203/2021, art. 4</text><rect x=\"20\" y=\"84\" width=\"148\" height=\"46\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"94\" y=\"104\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">a) Presencial</text><text x=\"94\" y=\"117\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">en oficinas de asistencia</text><rect x=\"174\" y=\"84\" width=\"148\" height=\"46\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"248\" y=\"104\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">b) Portales de internet</text><text x=\"248\" y=\"117\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">y sedes electrónicas</text><rect x=\"328\" y=\"84\" width=\"148\" height=\"46\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"402\" y=\"104\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">c) Redes sociales</text><text x=\"402\" y=\"117\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\"></text><rect x=\"482\" y=\"84\" width=\"148\" height=\"46\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"556\" y=\"104\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">d) Telefónico</text><text x=\"556\" y=\"117\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\"></text><rect x=\"636\" y=\"84\" width=\"148\" height=\"46\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"710\" y=\"104\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">e) Correo electrónico</text><text x=\"710\" y=\"117\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\"></text><rect x=\"790\" y=\"84\" width=\"148\" height=\"46\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"864\" y=\"104\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">f) Cualquier otro</text><text x=\"864\" y=\"117\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">art. 12 LPAC</text><rect x=\"20\" y=\"144\" width=\"920\" height=\"34\" rx=\"8\" fill=\"#fdf3e3\" stroke=\"#b45309\" stroke-width=\"1.4\"/><text x=\"480\" y=\"165.025\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"bold\">FUNCIONARIO HABILITADO · LPAC 12.2 · firma por quien NO dispone de medios electrónicos</text><rect x=\"20\" y=\"186\" width=\"450\" height=\"56\" rx=\"8\" fill=\"#eaf6ee\" stroke=\"#15803d\" stroke-width=\"1.4\"/><text x=\"245\" y=\"203.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15803d\" font-weight=\"bold\">DOS REQUISITOS</text><text x=\"245\" y=\"217.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">1 · El interesado se IDENTIFICA ante el funcionario</text><text x=\"245\" y=\"231.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">2 · Presta CONSENTIMIENTO EXPRESO, con constancia</text><rect x=\"490\" y=\"186\" width=\"450\" height=\"56\" rx=\"8\" fill=\"#fdeceb\" stroke=\"#b91c1c\" stroke-width=\"1.4\"/><text x=\"715\" y=\"203.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#b91c1c\" font-weight=\"bold\">SOLO PARA</text><text x=\"715\" y=\"217.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">quienes NO están obligados a relacionarse</text><text x=\"715\" y=\"231.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">electrónicamente (art. 14.2 y 14.3)</text><text x=\"480\" y=\"264\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#4b5563\" font-weight=\"normal\">Cada Administración mantiene actualizado un registro de funcionarios habilitados (LPAC 12.3).</text></svg><details class=\"panel\" open><summary>Texto legal</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · RD 203/2021</span><p><b>Artículo 31. Registro de Funcionarios Habilitados de la Administración General del Estado.</b></p><p>1. Se crea el Registro de Funcionarios Habilitados en el ámbito de la Administración General del Estado y sus organismos públicos y entidades de derecho público vinculados o dependientes, en el que constarán inscritos:</p><p>a) El personal funcionario habilitado para la identificación y firma electrónica de las personas interesadas en aquellos trámites y procedimientos que se determinen por el ministerio, organismo o entidad competente para su tramitación.</p><p>b) El personal funcionario habilitado para la expedición de copias auténticas. Esta habilitación será conferida por los órganos a los que corresponda la emisión de los documentos originales, su custodia, el archivo de documentos o que en sus normas de competencia así se haya previsto.</p><p>c) El personal funcionario habilitado que presta servicio en las oficinas de asistencia en materia de registros de la Administración General del Estado, que estará habilitados para la identificación y firma electrónica de las personas interesadas en aquellos trámites y procedimientos que se determinen y para la expedición de copias auténticas electrónicas de cualquier documento que estas presenten para que se remita desde la Oficina a la unidad competente para su incorporación a un expediente administrativo.</p><p>2. El Registro de Funcionarios Habilitados será gestionado por la Secretaría de Estado de Política Territorial y Función Pública del Ministerio de Política Territorial y Función Pública, en colaboración con la Secretaría General de Administración Digital del Ministerio de Asuntos Económicos y Transformación Digital. Este Registro será interoperable con los sistemas equivalentes que ya existan en el ámbito de la Administración General del Estado y sus organismos públicos y entidades de derecho público vinculados o dependientes.</p><p>3. Este Registro deberá ser plenamente interoperable con los registros u otros sistemas equivalentes que se creen por las comunidades autónomas y las entidades locales a los efectos de comprobar la validez de las citadas habilitaciones.</p><p>4. Mediante orden conjunta de la persona titular del Ministerio de Política Territorial y Función Pública y de la persona titular del Ministerio de Asuntos Económicos y Transformación Digital se regulará el funcionamiento del Registro de Funcionarios Habilitados</p></div></div></details><details class=\"panel\"><summary>Disección</summary><div class=\"body\"><ul>\n<li><b>a)</b> Personal funcionario habilitado para la <b>identificación y firma electrónica de las personas interesadas</b> en los trámites que se determinen.</li>\n<li><b>b)</b> Personal funcionario habilitado para la <b>expedición de copias auténticas</b>. Esta habilitación la confieren los órganos a los que corresponda la emisión de los documentos originales, su custodia o el archivo.</li>\n<li><b>c)</b> Personal funcionario que presta servicio en las <b>oficinas de asistencia en materia de registros</b>, habilitado <b>para las dos cosas</b>: identificación y firma de los interesados, y expedición de copias auténticas electrónicas de lo que presenten.</li>\n<li><b>Ámbito:</b> este registro concreto es el de la Administración General del Estado; el art. 12.3 LPAC impone a cada Administración, incluidas las entidades locales, mantener el suyo o un sistema equivalente.</li>\n</ul></div></details><details class=\"panel\"><summary>En lenguaje llano</summary><div class=\"body\"><p>No todo funcionario puede firmar por un ciudadano ni expedir copias auténticas. Hay que estar habilitado e inscrito, y la habilitación puede ser para una cosa, para la otra o para las dos.</p></div></details><details class=\"panel\"><summary>¿Por qué existe?</summary><div class=\"body\"><div class=\"interp\"><span class=\"lbl\">Interpretación · aportación externa</span>La habilitación es la que convierte una actuación ordinaria en un acto con efectos jurídicos frente a terceros. Sin registro no habría forma de comprobar a posteriori si quien firmó podía hacerlo.</div></div></details><details class=\"panel\"><summary>Ejemplos</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Ejemplo 1</span>En la oficina de asistencia te atienden y te hacen copia auténtica del título que aportas: letra c), habilitación doble.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 2</span>Un funcionario del archivo expide copias auténticas pero no firma por ciudadanos: letra b).</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 3</span>Caso límite: un funcionario no inscrito identifica y firma por un ciudadano. La actuación queda comprometida, porque el art. 12.2 LPAC exige que sea un funcionario habilitado.</div></div></details><details class=\"panel\"><summary>Trampas</summary><div class=\"body\"><div class=\"box warn\"><span class=\"lbl\">Cuidado</span>Las letras a) y b) son habilitaciones <b>distintas</b>. Solo la letra c), la de las oficinas de asistencia, lleva las dos de serie.</div></div></details><details class=\"panel\"><summary>Conexiones</summary><div class=\"body\"><p>Desarrolla el art. 12.2 y 12.3 LPAC. La copia auténtica se regula en el art. 27 LPAC.</p></div></details><details class=\"panel\"><summary>Anclaje memorístico</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Para retenerlo</span>Tres habilitaciones: <b>firmar por otro</b>, <b>copiar con autenticidad</b>, y en las oficinas de asistencia, <b>las dos</b>.</div></div></details></section><section class=\"card\" id=\"cifras\"><h2>Cifras y listas cerradas</h2>\n<p class=\"small\">Pulsa en una columna para ordenar. Esto es lo que hay que llevar de memoria.</p>\n<table id=\"tcif\"><thead><tr><th class=\"sortable\">Dato</th><th class=\"sortable\">Qué es</th><th class=\"sortable\">Precepto</th></tr></thead><tbody>\n<tr><td>2 meses</td><td>Desde la comunicación hasta que un nuevo sistema de identificación o firma produce efectos</td><td>Arts. 9.2.c) y 10.2.c) LPAC</td></tr>\n<tr><td>5 casos</td><td>Únicos supuestos en que se exige firma: solicitar, declarar, recurrir, desistir, renunciar</td><td>Art. 11.2 LPAC</td></tr>\n<tr><td>2 sistemas</td><td>Firma de la actuación automatizada: sello y código seguro de verificación</td><td>Art. 42 LRJSP</td></tr>\n<tr><td>3 sistemas</td><td>Identificación y firma del interesado: certificado de firma, certificado de sello y clave concertada</td><td>Arts. 9.2 y 10.2 LPAC</td></tr>\n<tr><td>6 canales</td><td>Asistencia: presencial, portales y sedes, redes sociales, telefónico, correo electrónico y cualquier otro</td><td>Art. 4 RD 203/2021</td></tr>\n<tr><td>2 publicaciones</td><td>Creación o supresión de sede: boletín oficial y directorio del PAGe</td><td>Art. 10.2 RD 203/2021</td></tr>\n<tr><td>Boletín de la Provincia</td><td>Dónde publica una entidad local la creación de su sede</td><td>Art. 10.2 RD 203/2021</td></tr>\n<tr><td>2 requisitos</td><td>Funcionario habilitado: identificación ante él y consentimiento expreso con constancia</td><td>Art. 12.2 LPAC</td></tr>\n<tr><td>3 responsabilidades</td><td>Del titular de la sede: integridad, veracidad y actualización</td><td>Art. 38.2 LRJSP</td></tr>\n<tr><td>Certificado <span class=\"t\" data-g=\"cualificado\">cualificado</span> de <span class=\"t\" data-g=\"sitioweb\">sitio web</span></td><td>Lo que identifica a la sede electrónica</td><td>Art. 38.6 LRJSP · art. 18 RD 203/2021</td></tr>\n<tr><td><span class=\"t\" data-g=\"clave\">Clave concertada</span></td><td>Tercer sistema de identificación del interesado, con registro previo</td><td>Art. 9.2.c) LPAC · art. 28 RD 203/2021</td></tr>\n<tr><td>Sujetos <span class=\"t\" data-g=\"obligados\">obligados</span></td><td>Quedan fuera de la asistencia del funcionario habilitado</td><td>Art. 14.2 y 14.3 LPAC</td></tr>\n<tr><td>Informe vinculante</td><td>De la Secretaría de Estado de Seguridad para denegar un sistema de clave concertada</td><td>Art. 28.2 RD 203/2021</td></tr>\n</tbody></table>\n<svg viewBox=\"0 0 960 270\" width=\"100%\" role=\"img\" aria-label=\"La identificación basta con carácter general y la firma solo se exige en cinco casos tasados\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"t4efr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#4b5563\"/></marker><marker id=\"t4efe\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#15803d\"/></marker><marker id=\"t4efw\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#b45309\"/></marker></defs><text x=\"480\" y=\"24\" font-size=\"13\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"bold\">Identificarse no es firmar</text><rect x=\"20\" y=\"44\" width=\"920\" height=\"44\" rx=\"8\" fill=\"#eaf6ee\" stroke=\"#15803d\" stroke-width=\"1.4\"/><text x=\"480\" y=\"70.025\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#15803d\" font-weight=\"bold\">REGLA GENERAL · LPAC 11.1: para cualquier actuación del procedimiento BASTA CON IDENTIFICARSE</text><rect x=\"20\" y=\"100\" width=\"920\" height=\"34\" rx=\"8\" fill=\"#fdf3e3\" stroke=\"#b45309\" stroke-width=\"1.4\"/><text x=\"480\" y=\"121.025\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"bold\">LA FIRMA SOLO SE EXIGE EN CINCO CASOS · LPAC 11.2 · lista cerrada</text><rect x=\"20\" y=\"144\" width=\"300\" height=\"54\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"170\" y=\"167.35\" font-size=\"11\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">a) Formular SOLICITUDES</text><text x=\"170\" y=\"182.35\" font-size=\"11\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">b) Presentar DECLARACIONES</text><rect x=\"330\" y=\"144\" width=\"300\" height=\"54\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"480\" y=\"167.35\" font-size=\"11\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">responsables o comunicaciones</text><text x=\"480\" y=\"182.35\" font-size=\"11\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">c) Interponer RECURSOS</text><rect x=\"640\" y=\"144\" width=\"300\" height=\"54\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"790\" y=\"167.35\" font-size=\"11\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">d) DESISTIR de acciones</text><text x=\"790\" y=\"182.35\" font-size=\"11\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">e) RENUNCIAR a derechos</text><rect x=\"20\" y=\"210\" width=\"920\" height=\"34\" rx=\"8\" fill=\"#e8efff\" stroke=\"#1d4ed8\" stroke-width=\"1.4\"/><text x=\"480\" y=\"231.025\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#1d4ed8\" font-weight=\"bold\">Regla de los dedos: Solicitar · Declarar · Recurrir · Desistir · Renunciar → S-D-R-D-R</text></svg></section><section class=\"card\" id=\"test\"><h2>Test · 30 preguntas con corrección razonada</h2>\n<div class=\"tools noprint\" style=\"margin-bottom:.8rem\">\n <button id=\"corr\">Corregir todo</button>\n <button id=\"fallos\">Repetir solo los fallos</button>\n <button id=\"reset\">Reiniciar</button>\n <span class=\"seg\" role=\"group\" aria-label=\"Penalización\">\n  <button id=\"pen0\" data-pen=\"0\" aria-pressed=\"true\">Sin penalización</button>\n  <button id=\"pen1\" data-pen=\"1\" aria-pressed=\"false\">Penaliza −50 %</button>\n </span>\n <span id=\"score\" class=\"chip\" style=\"margin-left:.4rem\">0 de 30</span>\n</div>\n<div class=\"box warn\" style=\"margin-bottom:.7rem\"><span class=\"lbl\">Entrena las dos reglas</span>Las bases fijan la penalización del 50 % para el primer y el segundo ejercicio; para el práctico no establecen ninguna y el tribunal lo anuncia al inicio. Con el interruptor puedes corregir el mismo test de las dos formas. <b>Sin penalización no dejes nada en blanco. Con penalización, contesta solo si has descartado al menos dos opciones.</b></div>\n<div id=\"testbox\"></div>\n</section><section class=\"card\" id=\"sem\"><h2>Semáforo de autoevaluación</h2>\n<p class=\"small\">Marca cada destreza. Lo rojo y lo ámbar es tu repaso de mañana.</p>\n<div id=\"sembox\"></div><div id=\"semres\"></div></section><section class=\"card\" id=\"cierre\"><h2>Cierre y repaso espaciado</h2>\n<div class=\"idea\">Si te quedas con una sola frase: <b>el portal informa, la sede tramita y el punto de acceso general te lleva a todas las sedes</b>. Y quien actúa se acredita: la página con certificado de sitio web, la máquina con sello o código seguro de verificación, la persona con su firma.</div>\n<svg viewBox=\"0 0 980 352\" width=\"100%\" role=\"img\" aria-label=\"Sistemas de identificación y firma de la Administración frente a los de la persona interesada\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"t4cfr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#4b5563\"/></marker><marker id=\"t4cfe\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#15803d\"/></marker><marker id=\"t4cfw\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#b45309\"/></marker></defs><text x=\"490\" y=\"24\" font-size=\"13\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"bold\">Quién se identifica y con qué</text><rect x=\"20\" y=\"44\" width=\"460\" height=\"36\" rx=\"8\" fill=\"#e8efff\" stroke=\"#1d4ed8\" stroke-width=\"1.4\"/><text x=\"250\" y=\"66.2\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1d4ed8\" font-weight=\"bold\">LA ADMINISTRACIÓN</text><rect x=\"500\" y=\"44\" width=\"460\" height=\"36\" rx=\"8\" fill=\"#eaf6ee\" stroke=\"#15803d\" stroke-width=\"1.4\"/><text x=\"730\" y=\"66.2\" font-size=\"12\" text-anchor=\"middle\" fill=\"#15803d\" font-weight=\"bold\">LA PERSONA INTERESADA</text><rect x=\"20\" y=\"90\" width=\"460\" height=\"54\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"250\" y=\"106.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Certificado cualificado de</text><text x=\"250\" y=\"120.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">AUTENTICACIÓN DE SITIO WEB</text><text x=\"250\" y=\"134.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">para identificar la sede · art. 18</text><rect x=\"500\" y=\"90\" width=\"460\" height=\"54\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"730\" y=\"113.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Certificado cualificado de</text><text x=\"730\" y=\"127.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">FIRMA ELECTRÓNICA · LPAC 9.2.a)</text><rect x=\"20\" y=\"148\" width=\"460\" height=\"54\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"250\" y=\"171.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">SELLO ELECTRÓNICO basado en</text><text x=\"250\" y=\"185.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">certificado cualificado · LRJSP 40</text><rect x=\"500\" y=\"148\" width=\"460\" height=\"54\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"730\" y=\"171.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Certificado cualificado de</text><text x=\"730\" y=\"185.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">SELLO ELECTRÓNICO · LPAC 9.2.b)</text><rect x=\"20\" y=\"206\" width=\"460\" height=\"54\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"250\" y=\"229.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">CÓDIGO SEGURO DE VERIFICACIÓN</text><text x=\"250\" y=\"243.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">solo en actuación automatizada · LRJSP 42</text><rect x=\"500\" y=\"206\" width=\"460\" height=\"54\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"730\" y=\"229.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">CLAVE CONCERTADA y otros sistemas</text><text x=\"730\" y=\"243.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">con registro previo · LPAC 9.2.c)</text><rect x=\"20\" y=\"264\" width=\"460\" height=\"54\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"250\" y=\"287.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">FIRMA DEL PERSONAL al servicio</text><text x=\"250\" y=\"301.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">de la Administración · LRJSP 43</text><rect x=\"500\" y=\"264\" width=\"460\" height=\"54\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"730\" y=\"287.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">El FUNCIONARIO HABILITADO firma</text><text x=\"730\" y=\"301.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">por quien no tiene medios · LPAC 12.2</text><text x=\"490\" y=\"340\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"bold\">Los tres sistemas del interesado son los mismos para identificarse (art. 9.2) y para firmar (art. 10.2). Lo que cambia es para qué se usan.</text></svg>\n<table><thead><tr><th>Si te preguntan…</th><th>La respuesta vive en…</th></tr></thead><tbody>\n<tr><td>Dónde se publica la creación de una sede municipal</td><td>Art. 10.2 RD 203/2021 · Boletín de la Provincia <b>y</b> directorio del PAGe</td></tr>\n<tr><td>Con qué se firma un acto dictado por el sistema</td><td>Art. 42 LRJSP · sello o código seguro de verificación</td></tr>\n<tr><td>Cuándo se exige firma al interesado</td><td>Art. 11.2 LPAC · los cinco casos, y ni uno más</td></tr>\n<tr><td>A quién asiste el funcionario habilitado</td><td>Art. 12.2 LPAC · a los <b>no</b> obligados del art. 14.2 y 14.3</td></tr>\n<tr><td>Qué identifica a la sede</td><td>Art. 18 RD 203/2021 · certificado cualificado de autenticación de sitio web</td></tr>\n</tbody></table>\n<div class=\"box ej\"><span class=\"lbl\">Calendario de repaso espaciado</span><ul>\n<li><b>Al día siguiente</b> — solo el test, y solo los fallos.</li>\n<li><b>A los 3 días</b> — las listas cerradas, escritas de memoria en papel.</li>\n<li><b>A los 7 días</b> — el tema entero en vista «Texto legal», tapando la explicación.</li>\n<li><b>A los 21 días</b> — test completo con el interruptor de penalización activado.</li></ul></div>\n</section>";
</script>
<script>
(function(){var n='<h2>Secciones</h2>';
 NAV.forEach(function(a){n+='<a href="#'+a[0]+'">'+a[1]+'</a>';});
 document.getElementById('navbody').innerHTML=n;})();
document.getElementById('navtoggle').onclick=function(){
 var s=document.getElementById('side');s.classList.toggle('collapsed');
 this.setAttribute('aria-expanded',s.classList.contains('collapsed')?'false':'true');};

/* ---------- TEST ---------- */
var estado=TEST.map(function(){return -1;}), soloFallos=false, revelar=false, pen=0;
function letra(i){return 'abcd'[i];}
function pintaTest(){
 var h='',n=0;
 TEST.forEach(function(q,i){
  if(soloFallos && estado[i]===q[2]) return;
  n++;
  h+='<div class="box" data-qi="'+i+'" style="border-color:var(--acc)"><span class="lbl" style="color:var(--acc)">Pregunta '+(i+1)+'</span><p style="margin:.1rem 0 .5rem">'+q[0]+'</p>';
  q[1].forEach(function(op,j){
   var sel=estado[i]===j, ok=j===q[2], show=(estado[i]>=0)||revelar;
   var bg='transparent',bd='var(--line)',ic='';
   if(show){ if(ok){bg='var(--ej-bg)';bd='var(--ej)';ic='✓ ';}
             else if(sel){bg='var(--exc-bg)';bd='var(--exc)';ic='✗ ';} }
   h+='<button class="opt" data-i="'+i+'" data-j="'+j+'" style="display:block;width:100%;text-align:left;margin:.22rem 0;background:'+bg+';border-color:'+bd+';white-space:normal;line-height:1.45'+(sel?';font-weight:600':'')+'">'+ic+letra(j)+') '+op+'</button>';
  });
  if(estado[i]>=0){
   h+='<div class="noprint" style="margin:.3rem 0 .1rem"><button class="blanco" data-i="'+i+'" style="font-size:.78rem;padding:.2rem .5rem">Dejar en blanco</button></div>';
  }
  if(estado[i]>=0||revelar){
   h+='<div style="margin-top:.5rem;font-size:.9rem">';
   q[3].forEach(function(f,j){
    var ok=j===q[2];
    h+='<p style="margin:.3rem 0;padding-left:.7rem;border-left:3px solid '+(ok?'var(--ej)':'var(--exc)')+'"><b>'+letra(j)+')</b> '+f+'</p>';});
   h+='</div>';
  }
  h+='</div>';
 });
 if(!n)h='<div class="box ej"><span class="lbl">Nada que repetir</span>No tienes fallos pendientes.</div>';
 document.getElementById('testbox').innerHTML=h;
 document.querySelectorAll('.opt').forEach(function(b){
  b.onclick=function(){estado[+b.getAttribute('data-i')]=+b.getAttribute('data-j');pintaTest();};});
 document.querySelectorAll('.blanco').forEach(function(b){
  b.onclick=function(){estado[+b.getAttribute('data-i')]=-1;pintaTest();};});
 marca();
}
function marca(){
 var ok=0,mal=0,bl=0;
 TEST.forEach(function(q,i){
  if(estado[i]<0){bl++;} else if(estado[i]===q[2]){ok++;} else {mal++;}});
 var N=TEST.length, max=25;
 var bruto=pen? (ok-mal/2) : ok;
 if(bruto<0)bruto=0;
 var nota=(bruto*max/N);
 document.getElementById('score').textContent=
  ok+' aciertos · '+mal+' fallos · '+bl+' en blanco  →  '+nota.toFixed(2)+' / '+max+(pen?'  (con penalización)':'  (sin penalización)');
}
document.getElementById('corr').onclick=function(){
 revelar=!revelar;this.textContent=revelar?'Ocultar soluciones':'Corregir todo';pintaTest();};
document.getElementById('fallos').onclick=function(){
 soloFallos=!soloFallos;this.textContent=soloFallos?'Ver todas':'Repetir solo los fallos';pintaTest();};
document.getElementById('reset').onclick=function(){
 estado=TEST.map(function(){return -1;});soloFallos=false;revelar=false;
 document.getElementById('fallos').textContent='Repetir solo los fallos';
 document.getElementById('corr').textContent='Corregir todo';pintaTest();};
document.querySelectorAll('[data-pen]').forEach(function(b){
 b.onclick=function(){
  pen=+b.getAttribute('data-pen');
  document.querySelectorAll('[data-pen]').forEach(function(x){x.setAttribute('aria-pressed',x===b?'true':'false');});
  marca();};});
pintaTest();

/* ---------- SEMÁFORO ---------- */
var sem=SEM.map(function(){return 0;});
function drawSem(){
 var h='<table><tbody>';
 SEM.forEach(function(c,i){
  h+='<tr><td>'+c+'</td><td style="width:150px;white-space:nowrap">'
   +['🟢','🟡','🔴'].map(function(e,j){
     var on=sem[i]===j+1;
     return '<button class="sembtn" data-i="'+i+'" data-v="'+(j+1)+'" aria-label="nivel '+(j+1)+'" style="font-size:1rem;padding:.15rem .35rem;margin-right:.2rem;border-color:'+(on?'var(--acc)':'var(--line)')+';background:'+(on?'var(--acc-soft)':'transparent')+'">'+e+'</button>';}).join('')
   +'</td></tr>';});
 h+='</tbody></table>';
 document.getElementById('sembox').innerHTML=h;
 document.querySelectorAll('.sembtn').forEach(function(b){
  b.onclick=function(){sem[+b.getAttribute('data-i')]=+b.getAttribute('data-v');drawSem();};});
 var r=[],a=[];
 sem.forEach(function(v,i){if(v===3)r.push(SEM[i]);if(v===2)a.push(SEM[i]);});
 var o='';
 if(r.length)o+='<div class="box exc"><span class="lbl">Vuelve a ello hoy mismo</span><ul><li>'+r.join('</li><li>')+'</li></ul></div>';
 if(a.length)o+='<div class="box warn"><span class="lbl">Refuerza en 24 h</span><ul><li>'+a.join('</li><li>')+'</li></ul></div>';
 if(!r.length&&!a.length&&sem.some(function(v){return v===1;}))o='<div class="box ej"><span class="lbl">Bien</span>Ahora explícaselo a alguien sin mirar la página.</div>';
 document.getElementById('semres').innerHTML=o;
}
drawSem();

/* ---------- GLOSARIO ---------- */
(function(){
 var tip=document.getElementById('tip');
 function show(el,ev){var k=el.getAttribute('data-g'),d=GLOS[k];if(!d)return;
  tip.innerHTML='<b>'+d[0]+'</b><br>'+d[1];tip.style.display='block';
  tip.style.left=Math.min(ev.clientX+12,window.innerWidth-340)+'px';
  tip.style.top=Math.min(ev.clientY+16,window.innerHeight-170)+'px';}
 document.addEventListener('mouseover',function(e){var t=e.target.closest('.t');if(t)show(t,e);});
 document.addEventListener('mouseout',function(e){if(e.target.closest('.t'))tip.style.display='none';});
 document.addEventListener('click',function(e){var t=e.target.closest('.t');if(t)show(t,e);else tip.style.display='none';});
})();

/* ---------- TABLA ORDENABLE ---------- */
(function(){
 var t=document.getElementById('tcif');if(!t)return;
 t.querySelectorAll('th.sortable').forEach(function(th,ci){
  var asc=true;
  th.onclick=function(){
   var tb=t.tBodies[0],rows=[].slice.call(tb.rows);
   rows.sort(function(a,b){
    var x=a.cells[ci].textContent.trim(),y=b.cells[ci].textContent.trim();
    var nx=parseFloat(x.replace(/\./g,'').replace(',','.')),ny=parseFloat(y.replace(/\./g,'').replace(',','.'));
    if(!isNaN(nx)&&!isNaN(ny))return asc?nx-ny:ny-nx;
    return asc?x.localeCompare(y,'es'):y.localeCompare(x,'es');});
   rows.forEach(function(r){tb.appendChild(r);});asc=!asc;};});
})();

/* ---------- VISTA ---------- */
document.querySelectorAll('[data-view]').forEach(function(b){
 b.onclick=function(){
  document.querySelectorAll('[data-view]').forEach(function(x){x.setAttribute('aria-pressed','false');});
  b.setAttribute('aria-pressed','true');
  var v=b.getAttribute('data-view');
  document.querySelectorAll('section.card .legal').forEach(function(e){
   var d=e.closest('details.panel'); if(d) d.classList.toggle('hide',v==='expl');});
  document.querySelectorAll('section.card details.panel').forEach(function(d){
   if(!d.querySelector('.legal')) d.classList.toggle('hide',v==='legal');});
  document.querySelectorAll('section.card svg').forEach(function(e){e.classList.toggle('hide',v==='legal');});
 };});

/* ---------- HERRAMIENTAS ---------- */
var openAll=false;
document.getElementById('expand').onclick=function(){
 openAll=!openAll;document.querySelectorAll('details.panel').forEach(function(d){d.open=openAll;});
 this.textContent=openAll?'Plegar todo':'Desplegar todo';};
document.getElementById('theme').onclick=function(){
 var h=document.documentElement;h.setAttribute('data-theme',h.getAttribute('data-theme')==='dark'?'light':'dark');};
var fs=16;

 var p=m.parentNode;p.replaceChild(document.createTextNode(m.textContent),m);p.normalize();});}
q.addEventListener('input',function(){
 clearTimeout(timer);timer=setTimeout(function(){

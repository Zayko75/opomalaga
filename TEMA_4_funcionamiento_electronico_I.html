tails class=\"panel\"><summary>En lenguaje llano</summary><div class=\"body\"><p>Para abrir una sede no basta con poner la página en marcha: hay que aprobar un acto, publicarlo donde toque y además inscribirlo en el directorio del punto de acceso general. Y para cerrarla, lo mismo.</p></div></details><details class=\"panel\"><summary>¿Por qué existe?</summary><div class=\"body\"><div class=\"interp\"><span class=\"lbl\">Interpretación · aportación externa</span>Si las sedes pudieran aparecer y desaparecer sin publicidad, nadie podría saber qué direcciones son oficiales, y la suplantación sería trivial. La publicación en boletín y en directorio crea una lista verificable de direcciones fiables.</div></div></details><details class=\"panel\"><summary>Ejemplos</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Ejemplo 1</span>El Ayuntamiento de Alhaurín el Grande crea su sede electrónica: el acuerdo se publica en el <b>Boletín Oficial de la Provincia de Málaga</b> y en el directorio del PAGe.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 2</span>La Diputación crea una sede asociada para el organismo autónomo de recaudación: misma tramitación, y la asociada funciona como sede plena.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 3</span>Caso límite: se suprime una sede asociada. También hay que publicarlo; el art. 10.2 habla de creación o supresión.</div></div></details><details class=\"panel\"><summary>Trampas</summary><div class=\"body\"><div class=\"box warn\"><span class=\"lbl\">Cuidado</span>Tres errores clásicos: creer que la asociada vale menos que la principal —vale igual, «a todos los efectos»—; creer que basta con publicar en un sitio —son <b>dos</b>, boletín y directorio—; y poner el BOE o el BOJA cuando el titular es un ayuntamiento o una diputación: es el <b>boletín de la provincia</b>.</div></div></details><details class=\"panel\"><summary>Conexiones</summary><div class=\"body\"><p>Desarrolla el art. 38.3 LRJSP. El contenido que luego debe ofrecer la sede está en el art. 11.</p></div></details><details class=\"panel\"><summary>Anclaje memorístico</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Para retenerlo</span>Entidad local → <b>Boletín de la Provincia</b>. Y siempre <b>dos publicaciones</b>: boletín y directorio.</div></div></details></section><section class=\"card art\" id=\"rd203_11\"><h2><span class=\"num\">RD 203/2021 11</span> Contenido y servicios de las sedes y sedes asociadas</h2><p class=\"ubic\">RD 203/2021 ▸ Capítulo II ▸ Sección 3.ª</p><div class=\"idea\">Lista del contenido mínimo que toda sede debe tener a disposición del ciudadano.</div><details class=\"panel\" open><summary>Texto legal</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · RD 203/2021</span><p><b>Artículo 11. Contenido y servicios de las sedes electrónicas y sedes asociadas.</b></p><p>1. Toda sede electrónica o sede electrónica asociada dispondrá del siguiente contenido mínimo a disposición de las personas interesadas:</p><p>a) La identificación de la sede electrónica o sede electrónica asociada, así como del órgano u organismo titular de la misma y los órganos competentes para la gestión de la información, servicios, procedimientos y trámites puestos a disposición en ella.</p><p>b) La identificación del acto o disposición de creación y el acceso al mismo, directamente o mediante enlace a su publicación en el Boletín Oficial correspondiente.</p><p>c) La información necesaria para la correcta utilización de la sede electrónica, incluyendo su mapa o información equivalente, con especificación de la estructura de navegación y las distintas secciones disponibles, así como la relativa a propiedad intelectual, protección de datos personales y accesibilidad.</p><p>d) La relación de sistemas de identificación y firma electrónica que sean admitidos o utilizados en la misma.</p><p>e) La normativa reguladora del Registro al que se acceda a través de la sede electrónica.</p><p>f) La fecha y hora oficial, así como el calendario de días inhábiles a efectos del cómputo de plazos aplicable a la Administración en que se integre el órgano, organismo público o entidad de derecho público vinculado o dependiente que sea titular de la sede electrónica o sede electrónica asociada.</p><p>g) Información acerca de cualquier incidencia técnica que acontezca e imposibilite el funcionamiento ordinario del sistema o aplicación que corresponda, así como de la ampliación del plazo no vencido que, en su caso, haya acordado el órgano competente debido a dicha circunstancia.</p><p>h) Relación actualizada de los servicios, procedimientos y trámites disponibles i) Relación actualizada de las actuaciones administrativas automatizadas vinculadas a los servicios, procedimientos y trámites descritos en la letra anterior. Cada una se acompañará de la descripción de su diseño y funcionamiento, los mecanismos de rendición de cuentas y transparencia, así como los datos utilizados en su configuración y aprendizaje.</p><p>2. Las sedes electrónicas y sedes electrónicas asociadas dispondrán, al menos, de los siguientes servicios a disposición de las personas interesadas:</p><p>a) Un acceso a los servicios y trámites disponibles en la sede electrónica o sede electrónica asociada, con indicación de los plazos máximos de duración de los procedimientos, excluyendo las posibles ampliaciones o suspensiones que en su caso, pudiera acordar el órgano competente.</p><p>b) Un enlace para la formulación de sugerencias y quejas ante los órganos que en cada caso resulten competentes.</p><p>c) Los mecanismos de comunicación y procedimiento de reclamación establecidos al respecto de los requisitos de accesibilidad de los sitios web y aplicaciones móviles del sector público.</p><p>d) Un sistema de verificación de los certificados de la sede electrónica.</p><p>e) Un sistema de verificación de los sellos electrónicos de los órganos, organismos públicos o entidades de derecho público que abarque la sede electrónica o sede electrónica asociada.</p><p>f) Un servicio de comprobación de la autenticidad e integridad de los documentos emitidos por los órganos, organismos públicos o entidades de derecho público comprendidos en el ámbito de la sede electrónica, que hayan sido firmados por cualquiera de los sistemas de firma conformes a la Ley 40/2015, 1 de octubre, y para los cuales se haya generado un código seguro de verificación.</p><p>g) Un acceso a los modelos, y sistemas de presentación masiva, de uso voluntario, que permitan a las personas interesadas presentar simultáneamente varias solicitudes en la forma que establezca, en su caso, cada Administración, organismo público o entidad de derecho público titular de la sede electrónica o sede electrónica asociada.</p><p>h) El acceso a los modelos normalizados de presentación de solicitudes que establezca, en su caso, cada Administración u organismo público o entidad de derecho público titular de la sede electrónica o sede electrónica asociada.</p><p>i) Un servicio de consulta del directorio geográfico de oficinas de asistencia en materia de registros, que permita al interesado identificar la más próxima a su dirección de consulta.</p><p>3. De acuerdo con lo previsto en el artículo 66.1 de la Ley 39/2015, de 1 de octubre, las Administraciones Públicas deberán mantener y actualizar en la sede electrónica correspondiente un listado con los códigos de identificación vigentes de sus órganos, centros o unidades administrativas.</p></div></div></details><details class=\"panel\"><summary>Disección</summary><div class=\"body\"><ul>\n<li><b>Identificación:</b> de la sede y del órgano titular, y de los órganos competentes para gestionar lo que hay en ella.</li>\n<li><b>El acto de creación:</b> identificado y accesible, directamente o por enlace al boletín.</li>\n<li><b>Información de uso:</b> mapa de la sede, propiedad intelectual, protección de datos y accesibilidad.</li>\n<li><b>Sistemas de identificación y firma</b> admitidos o utilizados en la sede.</li>\n<li><b>Normativa del registro</b> al que se accede desde la sede.</li>\n<li><b>Fecha y hora oficial y calendario de días inhábiles</b> a efectos del cómputo de plazos.</li>\n</ul></div></details><details class=\"panel\"><summary>En lenguaje llano</summary><div class=\"body\"><p>Es la lista de lo que no puede faltar en una sede. Si echas en falta alguna de estas cosas, la sede está mal montada.</p></div></details><details class=\"panel\"><summary>¿Por qué existe?</summary><div class=\"body\"><div class=\"interp\"><span class=\"lbl\">Interpretación · aportación externa</span>Cada elemento resuelve un problema concreto: sin el calendario de días inhábiles no se puede computar un plazo; sin la relación de sistemas de firma, el ciudadano no sabe con qué puede presentar; sin el acto de creación, no puede comprobar que la sede es oficial.</div></div></details><details class=\"panel\"><summary>Ejemplos</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Ejemplo 1</span>Vas a presentar un recurso el último día y necesitas saber si es hábil: el calendario está en la propia sede, por exigencia de este artículo.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 2</span>Quieres saber si tu certificado sirve: la sede publica la relación de sistemas admitidos.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 3</span>Caso límite: una sede que no publica el calendario de días inhábiles. El defecto es de la Administración, y no puede volverse contra el ciudadano que computó mal.</div></div></details><details class=\"panel\"><summary>Trampas</summary><div class=\"body\"><div class=\"box warn\"><span class=\"lbl\">Cuidado</span>La <b>fecha y hora oficial</b> de la sede no es la de tu ordenador. Para los plazos vale la de la sede.</div></div></details><details class=\"panel\"><summary>Conexiones</summary><div class=\"body\"><p>Enlaza con el cómputo de plazos del art. 30 LPAC y con el registro electrónico del art. 16 LPAC.</p></div></details><details class=\"panel\"><summary>Anclaje memorístico</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Para retenerlo</span>Lo que no puede faltar: <b>quién es, cómo nació, cómo se usa, con qué se firma, qué registro tiene y qué día es hoy</b>.</div></div></details></section><section class=\"card art\" id=\"rd203_12\"><h2><span class=\"num\">RD 203/2021 12</span> Responsabilidad sobre la sede electrónica</h2><p class=\"ubic\">RD 203/2021 ▸ Capítulo II ▸ Sección 3.ª</p><div class=\"idea\">Responde el titular, y si hay enlace a otra sede responde el titular de esa otra.</div><details class=\"panel\" open><summary>Texto legal</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · RD 203/2021</span><p><b>Artículo 12. Responsabilidad sobre la sede electrónica o sede electrónica asociada.</b></p><p>1. El titular de la sede electrónica y, en su caso, de la sede electrónica asociada, será responsable de la integridad, veracidad y actualización de la información y los servicios de su competencia a los que pueda accederse a través de la misma.</p><p>2. En caso de que la sede electrónica o sede electrónica asociada contenga un enlace o vínculo a otra sede o sede asociada, será el titular de esta última el responsable de la integridad, veracidad y actualización de la información o procedimientos que figuren en la misma, sin perjuicio de la debida diligencia del titular de la primera respecto de la incorporación de los contenidos en la misma.</p><p>3. En caso de que una sede electrónica o sede electrónica asociada contenga procedimientos, servicios o ambos, cuya competencia corresponda a otro órgano administrativo, organismo público o entidad de derecho público vinculado o dependiente, sea de la misma o de diferente Administración, el titular de la competencia será responsable de la integridad, veracidad y actualización de lo relativo a dichos procedimientos, servicios o ambos sin perjuicio de la debida diligencia del titular de la sede electrónica o sede electrónica asociada respecto de la incorporación de los contenidos en la misma.</p></div></div></details><details class=\"panel\"><summary>Disección</summary><div class=\"body\"><ul>\n<li><b>Regla general (12.1):</b> el titular responde de la <b>integridad, veracidad y actualización</b> de la información y servicios <b>de su competencia</b>.</li>\n<li><b>Enlaces (12.2):</b> si la sede enlaza a otra sede, responde <b>el titular de esta última</b>, sin perjuicio de la <b>debida diligencia</b> del primero al incorporar el enlace.</li>\n<li><b>Competencia ajena (12.3):</b> si la sede aloja procedimientos o servicios cuya competencia es de otro órgano u otra Administración, responde <b>el titular de la competencia</b>, con la misma salvedad de diligencia.</li>\n</ul></div></details><details class=\"panel\"><summary>En lenguaje llano</summary><div class=\"body\"><p>La responsabilidad sigue a la competencia, no al dueño de la página. Quien manda sobre el contenido es quien responde de él.</p></div></details><details class=\"panel\"><summary>¿Por qué existe?</summary><div class=\"body\"><div class=\"interp\"><span class=\"lbl\">Interpretación · aportación externa</span>Si respondiera siempre el dueño de la sede, ninguna Administración querría alojar servicios de otra, y se acabaría la interoperabilidad. Separando titularidad de competencia, se puede compartir sede sin asumir responsabilidad ajena.</div></div></details><details class=\"panel\"><summary>Ejemplos</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Ejemplo 1</span>La sede de un ayuntamiento pequeño aloja el servicio de recaudación de la Diputación: de ese servicio responde la Diputación.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 2</span>La sede municipal enlaza a la del Catastro: de lo que allí se publique responde el Catastro.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 3</span>Caso límite: el enlace lleva meses roto. Ahí sí responde el titular de la primera sede, por la «debida diligencia» que el precepto le exige.</div></div></details><details class=\"panel\"><summary>Trampas</summary><div class=\"body\"><div class=\"box warn\"><span class=\"lbl\">Cuidado</span>No confundas <b>titularidad de la sede</b> con <b>titularidad de la competencia</b>. El artículo existe precisamente para separarlas.</div></div></details><details class=\"panel\"><summary>Conexiones</summary><div class=\"body\"><p>Desarrolla la responsabilidad del art. 38.2 LRJSP.</p></div></details><details class=\"panel\"><summary>Anclaje memorístico</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Para retenerlo</span><b>Responde quien manda</b>, no quien aloja. Salvo que el que aloja sea descuidado.</div></div></details></section><section class=\"card art\" id=\"rd203_18\"><h2><span class=\"num\">RD 203/2021 18</span> Identificación de las sedes electrónicas</h2><p class=\"ubic\">RD 203/2021 ▸ Capítulo III «Sistemas de identificación y firma» ▸ Sección 1.ª</p><div class=\"idea\">La sede se acredita con certificado cualificado de autenticación de sitio web.</div><details class=\"panel\" open><summary>Texto legal</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · RD 203/2021</span><p><b>Artículo 18. Identificación de las sedes electrónicas y de las sedes electrónicas asociadas.</b></p><p>1. De acuerdo con lo previsto en el artículo 38 de la Ley 40/2015, de 1 de octubre, las sedes electrónicas y sedes electrónicas asociadas utilizarán, para identificarse y garantizar una comunicación segura con las mismas, certificados cualificados de autenticación de sitio web o medio equivalente. Dichos certificados electrónicos se ajustarán a lo señalado en el Real Decreto 4/2010, de 8 de enero, por el que se regula el Esquema Nacional de Interoperabilidad, y la normativa vigente en materia de identidad y firma electrónica.</p><p>2. En el ámbito estatal las sedes electrónicas y sedes electrónicas asociadas se identificarán mediante certificados cualificados de autenticación de sitio web. Con carácter adicional y para su identificación inmediata, los ciudadanos y ciudadanas dispondrán de la información general obligatoria que debe constar en las mismas de acuerdo con lo establecido en este Reglamento. Las direcciones electrónicas que tengan la condición de sede electrónica o sede electrónica asociada deberán hacerlo constar de forma visible e inequívoca. Para facilitar su identificación, seguirán las disposiciones generales que se establezcan para la imagen institucional de la Administración General del Estado y su dirección electrónica incluirá el nombre de dominio «.gob.es».</p></div></div></details><details class=\"panel\"><summary>Disección</summary><div class=\"body\"><ul>\n<li><b>Regla (18.1):</b> las sedes y sedes asociadas utilizan, para identificarse y garantizar una comunicación segura, <b>certificados cualificados de autenticación de sitio web o medio equivalente</b>, ajustados al Esquema Nacional de Interoperabilidad.</li>\n<li><b>Visibilidad (18.2):</b> las direcciones que tengan condición de sede <b>deberán hacerlo constar de forma visible e inequívoca</b>.</li>\n</ul></div></details><details class=\"panel\"><summary>En lenguaje llano</summary><div class=\"body\"><p>Es el carnet de identidad de la página. Te permite comprobar que estás donde crees estar y que nadie está escuchando en medio.</p></div></details><details class=\"panel\"><summary>¿Por qué existe?</summary><div class=\"body\"><div class=\"interp\"><span class=\"lbl\">Interpretación · aportación externa</span>Evita el fraude de la página clonada. Sin un certificado que ate la dirección a una Administración concreta, cualquiera podría montar una sede falsa y recoger datos y documentos.</div></div></details><details class=\"panel\"><summary>Ejemplos</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Ejemplo 1</span>Entras en la sede de la Diputación y el navegador muestra el candado con el certificado a nombre de la entidad: eso es el art. 18 funcionando.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 2</span>Una página que pide tu certificado digital pero no se identifica como sede de forma visible e inequívoca incumple el 18.2.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 3</span>Caso límite: «o medio equivalente». La norma no cierra la puerta a otras soluciones técnicas, siempre que cumplan el Esquema Nacional de Interoperabilidad.</div></div></details><details class=\"panel\"><summary>Trampas</summary><div class=\"body\"><div class=\"box warn\"><span class=\"lbl\">Cuidado</span>El certificado de <b>sitio web</b> identifica a la sede. No lo confundas con el <b>sello electrónico</b> del art. 40 LRJSP, que identifica a la Administración en los documentos.</div></div></details><details class=\"panel\"><summary>Conexiones</summary><div class=\"body\"><p>Es el desarrollo del art. 38.6 LRJSP. Se completa con el sistema de sellos del art. 40 LRJSP.</p></div></details><details class=\"panel\"><summary>Anclaje memorístico</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Para retenerlo</span>Sitio web → identifica la <b>página</b>. Sello → identifica el <b>documento</b>.</div></div></details></section><section class=\"card art\" id=\"lrjsp39\"><h2><span class=\"num\">LRJSP 39</span> Portal de internet</h2><p class=\"ubic\">Ley 40/2015 ▸ Capítulo V ▸ Sección 1.ª</p><div class=\"idea\">Punto de acceso que da entrada a la información publicada y, en su caso, a la sede.</div><svg viewBox=\"0 0 980 300\" width=\"100%\" role=\"img\" aria-label=\"Diferencia entre portal de internet, sede electrónica y punto de acceso general electrónico\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"t4afrr3\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#4b5563\"/></marker><marker id=\"t4afer3\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#15803d\"/></marker><marker id=\"t4afwr3\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#b45309\"/></marker></defs><text x=\"490\" y=\"24\" font-size=\"13\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"bold\">Las tres direcciones electrónicas: no son lo mismo</text><rect x=\"20\" y=\"44\" width=\"300\" height=\"54\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"170\" y=\"66.7\" font-size=\"12\" text-anchor=\"middle\" fill=\"#4b5563\" font-weight=\"bold\">PORTAL DE INTERNET</text><text x=\"170\" y=\"83.7\" font-size=\"12\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">LRJSP 39</text><rect x=\"20\" y=\"106\" width=\"300\" height=\"86\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"170\" y=\"127.35\" font-size=\"11\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Punto de acceso electrónico</text><text x=\"170\" y=\"144.35\" font-size=\"11\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">que permite acceder a la</text><text x=\"170\" y=\"161.35\" font-size=\"11\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">INFORMACIÓN publicada</text><text x=\"170\" y=\"178.35\" font-size=\"11\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">y, en su caso, a la sede</text><rect x=\"340\" y=\"44\" width=\"300\" height=\"54\" rx=\"8\" fill=\"#e8efff\" stroke=\"#1d4ed8\" stroke-width=\"1.4\"/><text x=\"490\" y=\"66.7\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1d4ed8\" font-weight=\"bold\">SEDE ELECTRÓNICA</text><text x=\"490\" y=\"83.7\" font-size=\"12\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">LRJSP 38 · RD 203/2021, 9</text><rect x=\"340\" y=\"106\" width=\"300\" height=\"86\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"490\" y=\"127.35\" font-size=\"11\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Dirección donde se hacen los</text><text x=\"490\" y=\"144.35\" font-size=\"11\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">TRÁMITES que exigen</text><text x=\"490\" y=\"161.35\" font-size=\"11\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">identificar a la Administración</text><text x=\"490\" y=\"178.35\" font-size=\"11\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">o identificar o firmar el interesado</text><rect x=\"660\" y=\"44\" width=\"300\" height=\"54\" rx=\"8\" fill=\"#eaf6ee\" stroke=\"#15803d\" stroke-width=\"1.4\"/><text x=\"810\" y=\"66.7\" font-size=\"12\" text-anchor=\"middle\" fill=\"#15803d\" font-weight=\"bold\">PUNTO DE ACCESO GENERAL</text><text x=\"810\" y=\"83.7\" font-size=\"12\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">RD 203/2021, 7</text><rect x=\"660\" y=\"106\" width=\"300\" height=\"86\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"810\" y=\"127.35\" font-size=\"11\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Toda Administración tiene uno.</text><text x=\"810\" y=\"144.35\" font-size=\"11\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">DISPONE DE UNA SEDE desde la</text><text x=\"810\" y=\"161.35\" font-size=\"11\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">que se accede a todas las sedes</text><text x=\"810\" y=\"178.35\" font-size=\"11\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">y sedes asociadas</text><rect x=\"20\" y=\"208\" width=\"940\" height=\"46\" rx=\"8\" fill=\"#fdf3e3\" stroke=\"#b45309\" stroke-width=\"1.4\"/><text x=\"490\" y=\"235.025\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"bold\">La sede electrónica asociada tiene consideración de sede electrónica A TODOS LOS EFECTOS (RD 203/2021, art. 10.1)</text><text x=\"490\" y=\"282\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#4b5563\" font-weight=\"normal\">Titularidad: una Administración, o uno o varios organismos públicos o entidades de derecho público, en el ámbito de sus competencias.</text></svg><details class=\"panel\" open><summary>Texto legal</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LRJSP</span><p><b>Artículo 39. Portal de internet.</b></p><p>Se entiende por portal de internet el punto de acceso electrónico cuya titularidad corresponda a una Administración Pública, organismo público o entidad de Derecho Público que permite el acceso a través de internet a la información publicada y, en su caso, a la sede electrónica correspondiente.</p></div></div></details><details class=\"panel\"><summary>Disección</summary><div class=\"body\"><ul>\n<li><b>Definición:</b> punto de acceso electrónico cuya <b>titularidad</b> corresponde a una Administración, organismo público o entidad de derecho público, que permite el acceso <b>a través de internet</b> a la <b>información publicada</b> y, <b>en su caso</b>, a la sede electrónica correspondiente.</li>\n<li><b>Lo decisivo:</b> el portal da información; la sede permite tramitar. Un portal puede no tener sede detrás.</li>\n</ul></div></details><details class=\"panel\"><summary>En lenguaje llano</summary><div class=\"body\"><p>El portal es el escaparate. La sede es la ventanilla. Puedes mirar el escaparate sin identificarte; para la ventanilla hace falta identificarse.</p></div></details><details class=\"panel\"><summary>¿Por qué existe?</summary><div class=\"body\"><div class=\"interp\"><span class=\"lbl\">Interpretación · aportación externa</span>Separar ambos conceptos permite que una Administración publique información sin someter toda su web al régimen de responsabilidad y seguridad de la sede, que es mucho más exigente.</div></div></details><details class=\"panel\"><summary>Ejemplos</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Ejemplo 1</span>El portal de la Diputación publica el organigrama, las noticias y el tablón: información.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 2</span>Desde ese mismo portal hay un enlace a la sede para presentar instancias: ahí empieza el otro régimen.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 3</span>Caso límite: la información que una Administración publica como propia en su portal se entiende identificada sin más trámite (art. 40.2 LRJSP).</div></div></details><details class=\"panel\"><summary>Trampas</summary><div class=\"body\"><div class=\"box warn\"><span class=\"lbl\">Cuidado</span>El art. 39 dice «<b>y, en su caso</b>, a la sede». Es decir: no todo portal tiene sede asociada.</div></div></details><details class=\"panel\"><summary>Conexiones</summary><div class=\"body\"><p>Se desarrolla en los arts. 5 y 6 del RD 203/2021 y se distingue del PAGe del art. 7.</p></div></details><details class=\"panel\"><summary>Anclaje memorístico</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Para retenerlo</span><b>Portal = escaparate · Sede = ventanilla · PAGe = el directorio de todas las ventanillas</b>.</div></div></details></section><section class=\"card art\" id=\"rd203_7\"><h2><span class=\"num\">RD 203/2021 7</span> Punto de Acceso General electrónico</h2><p class=\"ubic\">RD 203/2021 ▸ Capítulo II ▸ Sección 2.ª</p><div class=\"idea\">Toda Administración tiene uno, y dispone de una sede desde la que se llega a todas las demás.</div><svg viewBox=\"0 0 980 300\" width=\"100%\" role=\"img\" aria-label=\"Diferencia entre portal de internet, sede electrónica y punto de acceso general electrónico\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"t4afrr4\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#4b5563\"/></marker><marker id=\"t4afer4\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#15803d\"/></marker><marker id=\"t4afwr4\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#b45309\"/></marker></defs><text x=\"490\" y=\"24\" font-size=\"13\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"bold\">Las tres direcciones electrónicas: no son lo mismo</text><rect x=\"20\" y=\"44\" width=\"300\" height=\"54\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"170\" y=\"66.7\" font-size=\"12\" text-anchor=\"middle\" fill=\"#4b5563\" font-weight=\"bold\">PORTAL DE INTERNET</text><text x=\"170\" y=\"83.7\" font-size=\"12\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">LRJSP 39</text><rect x=\"20\" y=\"106\" width=\"300\" height=\"86\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"170\" y=\"127.35\" font-size=\"11\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Punto de acceso electrónico</text><text x=\"170\" y=\"144.35\" font-size=\"11\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">que permite acceder a la</text><text x=\"170\" y=\"161.35\" font-size=\"11\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">INFORMACIÓN publicada</text><text x=\"170\" y=\"178.35\" font-size=\"11\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">y, en su caso, a la sede</text><rect x=\"340\" y=\"44\" width=\"300\" height=\"54\" rx=\"8\" fill=\"#e8efff\" stroke=\"#1d4ed8\" stroke-width=\"1.4\"/><text x=\"490\" y=\"66.7\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1d4ed8\" font-weight=\"bold\">SEDE ELECTRÓNICA</text><text x=\"490\" y=\"83.7\" font-size=\"12\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">LRJSP 38 · RD 203/2021, 9</text><rect x=\"340\" y=\"106\" width=\"300\" height=\"86\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"490\" y=\"127.35\" font-size=\"11\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Dirección donde se hacen los</text><text x=\"490\" y=\"144.35\" font-size=\"11\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">TRÁMITES que exigen</text><text x=\"490\" y=\"161.35\" font-size=\"11\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">identificar a la Administración</text><text x=\"490\" y=\"178.35\" font-size=\"11\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">o identificar o firmar el interesado</text><rect x=\"660\" y=\"44\" width=\"300\" height=\"54\" rx=\"8\" fill=\"#eaf6ee\" stroke=\"#15803d\" stroke-width=\"1.4\"/><text x=\"810\" y=\"66.7\" font-size=\"12\" text-anchor=\"middle\" fill=\"#15803d\" font-weight=\"bold\">PUNTO DE ACCESO GENERAL</text><text x=\"810\" y=\"83.7\" font-size=\"12\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">RD 203/2021, 7</text><rect x=\"660\" y=\"106\" width=\"300\" height=\"86\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"810\" y=\"127.35\" font-size=\"11\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Toda Administración tiene uno.</text><text x=\"810\" y=\"144.35\" font-size=\"11\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">DISPONE DE UNA SEDE desde la</text><text x=\"810\" y=\"161.35\" font-size=\"11\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">que se accede a todas las sedes</text><text x=\"810\" y=\"178.35\" font-size=\"11\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">y sedes asociadas</text><rect x=\"20\" y=\"208\" width=\"940\" height=\"46\" rx=\"8\" fill=\"#fdf3e3\" stroke=\"#b45309\" stroke-width=\"1.4\"/><text x=\"490\" y=\"235.025\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"bold\">La sede electrónica asociada tiene consideración de sede electrónica A TODOS LOS EFECTOS (RD 203/2021, art. 10.1)</text><text x=\"490\" y=\"282\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#4b5563\" font-weight=\"normal\">Titularidad: una Administración, o uno o varios organismos públicos o entidades de derecho público, en el ámbito de sus competencias.</text></svg><details class=\"panel\" open><summary>Texto legal</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · RD 203/2021</span><p><b>Artículo 7. Punto de Acceso General electrónico.</b></p><p>1. Las Administraciones Públicas contarán con un Punto de Acceso General electrónico (PAGe).</p><p>2. El PAGe de cada Administración Pública facilitará el acceso a los servicios, trámites e información de los órganos, organismos públicos y entidades vinculados o dependientes de la Administración Pública correspondiente.</p><p>3. El PAGe dispondrá de una sede electrónica, a través de la cual se podrá acceder a todas las sedes electrónicas y sedes asociadas de la Administración Pública correspondiente. Además, esta sede podrá incluir un área personalizada a través de la cual cada interesado, mediante procedimientos seguros que garanticen la integridad y confidencialidad de sus datos personales, podrá acceder a su información, al seguimiento de los trámites administrativos que le afecten y a las notificaciones y comunicaciones en el ámbito de la Administración Pública competente.</p><p>4. El PAGe de la Administración General del Estado y su sede electrónica serán gestionados por el Ministerio de Política Territorial y Función Pública en colaboración con la Secretaría General de Administración Digital del Ministerio de Asuntos Económicos y Transformación Digital. En dicha sede electrónica está alojada la Dirección Electrónica Habilitada única a la que se refiere el artículo 43 de la Ley 39/2015, de 1 de octubre. El PAGe de la Administración General del Estado, a través de su sede, permitirá la comprobación de la autenticidad e integridad de los documentos facilitados por el sector público estatal a través del Código Seguro de Verificación o de cualquier otro sistema de firma o sello basado en certificado electrónico cualificado que se haya utilizado en su generación. También permitirá, en su caso, su recuperación.</p><p>5. El PAGe de la Administración General del Estado podrá interoperar con portales web oficiales de la Unión Europea.</p></div></div></details><details class=\"panel\"><summary>Disección</summary><div class=\"body\"><ul>\n<li><b>Obligatorio (7.1):</b> «Las Administraciones Públicas <b>contarán</b> con un Punto de Acceso General electrónico (PAGe)». No es potestativo.</li>\n<li><b>Qué ofrece (7.2):</b> acceso a los servicios, trámites e información de los órganos, organismos y entidades <b>vinculados o dependientes</b> de esa Administración.</li>\n<li><b>Tiene sede propia (7.3):</b> el PAGe <b>dispone de una sede electrónica</b> desde la que se accede a <b>todas</b> las sedes y sedes asociadas de esa Administración. Puede incluir un <b>área personalizada</b> para consultar información propia, seguimiento de trámites, notificaciones y comunicaciones.</li>\n</ul></div></details><details class=\"panel\"><summary>En lenguaje llano</summary><div class=\"body\"><p>Es la puerta única. En vez de tener que saberte la dirección de cada sede, entras por el punto de acceso general y desde ahí llegas a todas.</p></div></details><details class=\"panel\"><summary>¿Por qué existe?</summary><div class=\"body\"><div class=\"interp\"><span class=\"lbl\">Interpretación · aportación externa</span>La multiplicación de sedes dejaba al ciudadano perdido: cada organismo con su dirección y su diseño. El PAGe resuelve el problema de encontrar la ventanilla correcta, y el área personalizada el de saber cómo va lo tuyo.</div></div></details><details class=\"panel\"><summary>Ejemplos</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Ejemplo 1</span>Quieres ver el estado de tu solicitud de subvención y tus notificaciones pendientes: entras al área personalizada del PAGe.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 2</span>No recuerdas si tu trámite es del ayuntamiento o del organismo autónomo: entras por el PAGe de esa Administración y llegas igual.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 3</span>Caso límite: el área personalizada es potestativa —«<b>podrá</b> incluir»—, mientras que tener PAGe y que el PAGe tenga sede es obligatorio.</div></div></details><details class=\"panel\"><summary>Trampas</summary><div class=\"body\"><div class=\"box warn\"><span class=\"lbl\">Cuidado</span>El PAGe <b>no es</b> una sede más: es un punto de acceso que <b>dispone de</b> una sede. Y el directorio donde se publican las sedes creadas vive en el PAGe (art. 10.2).</div></div></details><details class=\"panel\"><summary>Conexiones</summary><div class=\"body\"><p>Con el art. 10.2 —el directorio— y con el art. 8, que regula la Carpeta Ciudadana del sector público estatal.</p></div></details><details class=\"panel\"><summary>Anclaje memorístico</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Para retenerlo</span><b>Una Administración, un PAGe.</b> Y dentro del PAGe, el directorio de todas sus sedes.</div></div></details></section><section class=\"card art\" id=\"rd203_4\"><h2><span class=\"num\">RD 203/2021 4</span> Canales de asistencia para el acceso a los servicios electrónicos</h2><p class=\"ubic\">RD 203/2021 ▸ Capítulo I «Disposiciones generales»</p><div class=\"idea\">Seis canales por los que la Administración debe ayudarte a usar lo electrónico.</div><svg viewBox=\"0 0 960 280\" width=\"100%\" role=\"img\" aria-label=\"Canales de asistencia y requisitos de la actuación del funcionario habilitado\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"t4ffr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#4b5563\"/></marker><marker id=\"t4ffe\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#15803d\"/></marker><marker id=\"t4ffw\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#b45309\"/></marker></defs><text x=\"480\" y=\"24\" font-size=\"13\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"bold\">Asistencia: canales y funcionario habilitado</text><rect x=\"20\" y=\"44\" width=\"920\" height=\"32\" rx=\"8\" fill=\"#e8efff\" stroke=\"#1d4ed8\" stroke-width=\"1.4\"/><text x=\"480\" y=\"64.025\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#1d4ed8\" font-weight=\"bold\">CANALES DE ASISTENCIA · RD 203/2021, art. 4</text><rect x=\"20\" y=\"84\" width=\"148\" height=\"46\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"94\" y=\"104\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">a) Presencial</text><text x=\"94\" y=\"117\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">en oficinas de asistencia</text><rect x=\"174\" y=\"84\" width=\"148\" height=\"46\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"248\" y=\"104\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">b) Portales de internet</text><text x=\"248\" y=\"117\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">y sedes electrónicas</text><rect x=\"328\" y=\"84\" width=\"148\" height=\"46\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"402\" y=\"104\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">c) Redes sociales</text><text x=\"402\" y=\"117\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\"></text><rect x=\"482\" y=\"84\" width=\"148\" height=\"46\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"556\" y=\"104\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">d) Telefónico</text><text x=\"556\" y=\"117\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\"></text><rect x=\"636\" y=\"84\" width=\"148\" height=\"46\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"710\" y=\"104\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">e) Correo electrónico</text><text x=\"710\" y=\"117\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\"></text><rect x=\"790\" y=\"84\" width=\"148\" height=\"46\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"864\" y=\"104\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">f) Cualquier otro</text><text x=\"864\" y=\"117\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">art. 12 LPAC</text><rect x=\"20\" y=\"144\" width=\"920\" height=\"34\" rx=\"8\" fill=\"#fdf3e3\" stroke=\"#b45309\" stroke-width=\"1.4\"/><text x=\"480\" y=\"165.025\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"bold\">FUNCIONARIO HABILITADO · LPAC 12.2 · firma por quien NO dispone de medios electrónicos</text><rect x=\"20\" y=\"186\" width=\"450\" height=\"56\" rx=\"8\" fill=\"#eaf6ee\" stroke=\"#15803d\" stroke-width=\"1.4\"/><text x=\"245\" y=\"203.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15803d\" font-weight=\"bold\">DOS REQUISITOS</text><text x=\"245\" y=\"217.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">1 · El interesado se IDENTIFICA ante el funcionario</text><text x=\"245\" y=\"231.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">2 · Presta CONSENTIMIENTO EXPRESO, con constancia</text><rect x=\"490\" y=\"186\" width=\"450\" height=\"56\" rx=\"8\" fill=\"#fdeceb\" stroke=\"#b91c1c\" stroke-width=\"1.4\"/><text x=\"715\" y=\"203.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#b91c1c\" font-weight=\"bold\">SOLO PARA</text><text x=\"715\" y=\"217.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">quienes NO están obligados a relacionarse</text><text x=\"715\" y=\"231.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">electrónicamente (art. 14.2 y 14.3)</text><text x=\"480\" y=\"264\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#4b5563\" font-weight=\"normal\">Cada Administración mantiene actualizado un registro de funcionarios habilitados (LPAC 12.3).</text></svg><details class=\"panel\" open><summary>Texto legal</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · RD 203/2021</span><p><b>Artículo 4. Canales de asistencia para el acceso a los servicios electrónicos.</b></p><p>Las Administraciones Públicas prestarán la asistencia necesaria para facilitar el acceso de las personas interesadas a los servicios electrónicos proporcionados en su ámbito competencial a través de alguno o algunos de los siguientes canales:</p><p>a) Presencial, a través de las oficinas de asistencia que se determinen.</p><p>b) Portales de internet y sedes electrónicas.</p><p>c) Redes sociales.</p><p>d) Telefónico.</p><p>e) Correo electrónico.</p><p>f) Cualquier otro canal que pueda establecerse de acuerdo con lo previsto en el artículo 12 de la Ley 39/2015, de 1 de octubre.</p></div></div></details><details class=\"panel\"><summary>Disección</summary><div class=\"body\"><ul>\n<li><b>a) Presencial</b>, a través de las oficinas de asistencia que se determinen.</li>\n<li><b>b) Portales de internet y sedes electrónicas.</b></li>\n<li><b>c) Redes sociales.</b></li>\n<li><b>d) Telefónico.</b></li>\n<li><b>e) Correo electrónico.</b></li>\n<li><b>f) Cualquier otro</b> que pueda establecerse de acuerdo con el art. 12 LPAC.</li>\n<li><b>Y la clave:</b> la norma dice «a través de <b>alguno o algunos</b>». No obliga a tenerlos todos.</li>\n</ul></div></details><details class=\"panel\"><summary>En lenguaje llano</summary><div class=\"body\"><p>Obligar a relacionarse electrónicamente sin ayudar a hacerlo sería una trampa. Este artículo enumera por dónde tiene que llegar esa ayuda.</p></div></details><details class=\"panel\"><summary>¿Por qué existe?</summary><div class=\"body\"><div class=\"interp\"><span class=\"lbl\">Interpretación · aportación externa</span>La brecha digital es real: hay personas obligadas a relacionarse por medios electrónicos que no saben o no pueden. Estos canales, y sobre todo el presencial, son el contrapeso.</div></div></details><details class=\"panel\"><summary>Ejemplos</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Ejemplo 1</span>Una asociación vecinal no sabe presentar la justificación de una subvención: va a la oficina de asistencia, canal a).</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 2</span>Una empresa pregunta por teléfono qué certificado admite la sede: canal d).</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 3</span>Caso límite: las redes sociales son canal de asistencia, pero <b>no</b> son registro: por ahí no se presenta nada.</div></div></details><details class=\"panel\"><summary>Trampas</summary><div class=\"body\"><div class=\"box warn\"><span class=\"lbl\">Cuidado</span>«Alguno o algunos»: no están todos obligados en todas las Administraciones. Y el canal presencial no desaparece por mucho que el procedimiento sea electrónico.</div></div></details><details class=\"panel\"><summary>Conexiones</summary><div class=\"body\"><p>Es el desarrollo del art. 12 LPAC, que regula la asistencia y el funcionario habilitado.</p></div></details><details class=\"panel\"><summary>Anclaje memorístico</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Para retenerlo</span>Seis canales: <b>P</b>resencial, <b>P</b>ortales, <b>R</b>edes, <b>T</b>eléfono, <b>C</b>orreo y <b>cualquier otro</b>. «Dos pes, una erre, una te, una ce y un comodín».</div></div></details></section><section class=\"card art\" id=\"lrjsp40\"><h2><span class=\"num\">LRJSP 40</span> Sistemas de identificación de las Administraciones Públicas</h2><p class=\"ubic\">Ley 40/2015 ▸ Capítulo V ▸ Sección 2.ª «De la identificación y firma electrónicas»</p><div class=\"idea\">La Administración se identifica con sello electrónico basado en certificado cualificado.</div><svg viewBox=\"0 0 980 352\" width=\"100%\" role=\"img\" aria-label=\"Sistemas de identificación y firma de la Administración frente a los de la persona interesada\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"t4cfrr2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#4b5563\"/></marker><marker id=\"t4cfer2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#15803d\"/></marker><marker id=\"t4cfwr2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#b45309\"/></marker></defs><text x=\"490\" y=\"24\" font-size=\"13\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"bold\">Quién se identifica y con qué</text><rect x=\"20\" y=\"44\" width=\"460\" height=\"36\" rx=\"8\" fill=\"#e8efff\" stroke=\"#1d4ed8\" stroke-width=\"1.4\"/><text x=\"250\" y=\"66.2\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1d4ed8\" font-weight=\"bold\">LA ADMINISTRACIÓN</text><rect x=\"500\" y=\"44\" width=\"460\" height=\"36\" rx=\"8\" fill=\"#eaf6ee\" stroke=\"#15803d\" stroke-width=\"1.4\"/><text x=\"730\" y=\"66.2\" font-size=\"12\" text-anchor=\"middle\" fill=\"#15803d\" font-weight=\"bold\">LA PERSONA INTERESADA</text><rect x=\"20\" y=\"90\" width=\"460\" height=\"54\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"250\" y=\"106.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Certificado cualificado de</text><text x=\"250\" y=\"120.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">AUTENTICACIÓN DE SITIO WEB</text><text x=\"250\" y=\"134.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">para identificar la sede · art. 18</text><rect x=\"500\" y=\"90\" width=\"460\" height=\"54\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"730\" y=\"113.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Certificado cualificado de</text><text x=\"730\" y=\"127.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">FIRMA ELECTRÓNICA · LPAC 9.2.a)</text><rect x=\"20\" y=\"148\" width=\"460\" height=\"54\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"250\" y=\"171.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">SELLO ELECTRÓNICO basado en</text><text x=\"250\" y=\"185.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">certificado cualificado · LRJSP 40</text><rect x=\"500\" y=\"148\" width=\"460\" height=\"54\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"730\" y=\"171.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Certificado cualificado de</text><text x=\"730\" y=\"185.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">SELLO ELECTRÓNICO · LPAC 9.2.b)</text><rect x=\"20\" y=\"206\" width=\"460\" height=\"54\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"250\" y=\"229.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">CÓDIGO SEGURO DE VERIFICACIÓN</text><text x=\"250\" y=\"243.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">solo en actuación automatizada · LRJSP 42</text><rect x=\"500\" y=\"206\" width=\"460\" height=\"54\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"730\" y=\"229.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">CLAVE CONCERTADA y otros sistemas</text><text x=\"730\" y=\"243.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">con registro previo · LPAC 9.2.c)</text><rect x=\"20\" y=\"264\" width=\"460\" height=\"54\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"250\" y=\"287.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">FIRMA DEL PERSONAL al servicio</text><text x=\"250\" y=\"301.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">de la Administración · LRJSP 43</text><rect x=\"500\" y=\"264\" width=\"460\" height=\"54\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"730\" y=\"287.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">El FUNCIONARIO HABILITADO firma</text><text x=\"730\" y=\"301.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">por quien no tiene medios · LPAC 12.2</text><text x=\"490\" y=\"340\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"bold\">Los tres sistemas del interesado son los mismos para identificarse (art. 9.2) y para firmar (art. 10.2). Lo que cambia es para qué se usan.</text></svg><details class=\"panel\" open><summary>Texto legal</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LRJSP</span><p><b>Artículo 40. Sistemas de identificación de las Administraciones Públicas.</b></p><p>1. Las Administraciones Públicas podrán identificarse mediante el uso de un sello electrónico basado en un certificado electrónico reconocido o cualificado que reúna los requisitos exigidos por la legislación de firma electrónica. Estos certificados electrónicos incluirán el número de identificación fiscal y la denominación correspondiente, así como, en su caso, la identidad de la persona titular en el caso de los sellos electrónicos de órganos administrativos. La relación de sellos electrónicos utilizados por cada Administración Pública, incluyendo las características de los certificados electrónicos y los prestadores que los expiden, deberá ser pública y accesible por medios electrónicos. Además, cada Administración Pública adoptará las medidas adecuadas para facilitar la verificación de sus sellos electrónicos.</p><p>2. Se entenderá identificada la Administración Pública respecto de la información que se publique como propia en su portal de internet.</p></div></div></details><details class=\"panel\"><summary>Disección</summary><div class=\"body\"><ul>\n<li><b>El sello (40.1):</b> las Administraciones <b>podrán</b> identificarse mediante <b>sello electrónico basado en certificado electrónico reconocido o cualificado</b>. El certificado incluye el <b>NIF y la denominación</b> y, en su caso, la identidad del titular cuando el sello sea de un órgano.</li>\n<li><b>Publicidad:</b> la relación de sellos utilizados por cada Administración, con las características de los certificados y los prestadores que los expiden, <b>debe ser pública y accesible por medios electrónicos</b>, y hay que facilitar su verificación.</li>\n<li><b>Identificación automática (40.2):</b> «Se entenderá identificada la Administración Pública respecto de la información que se publique como propia en su <b>portal de internet</b>».</li>\n</ul></div></details><details class=\"panel\"><summary>En lenguaje llano</summary><div class=\"body\"><p>El sello electrónico es el equivalente al sello de caucho de toda la vida: dice que el documento sale de esa Administración. Y la información del portal se entiende suya sin necesidad de sellar nada.</p></div></details><details class=\"panel\"><summary>¿Por qué existe?</summary><div class=\"body\"><div class=\"interp\"><span class=\"lbl\">Interpretación · aportación externa</span>Un documento electrónico sin firma ni sello no se distingue de un archivo cualquiera. El sello ata el documento a la organización, no a una persona, que es justo lo que hace falta cuando no interviene ningún empleado concreto.</div></div></details><details class=\"panel\"><summary>Ejemplos</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Ejemplo 1</span>Un certificado de empadronamiento emitido automáticamente lleva el sello del ayuntamiento, no la firma de un funcionario.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 2</span>El tablón de anuncios del portal no necesita sello: el art. 40.2 lo da por identificado.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 3</span>Caso límite: sello <b>de órgano</b>. Entonces el certificado incluye además la identidad de la persona titular del órgano.</div></div></details><details class=\"panel\"><summary>Trampas</summary><div class=\"body\"><div class=\"box warn\"><span class=\"lbl\">Cuidado</span>El sello identifica a la <b>Administración o al órgano</b>, no a una persona física. Para la persona está la firma del art. 43.</div></div></details><details class=\"panel\"><summary>Conexiones</summary><div class=\"body\"><p>Se usa como sistema de firma en la actuación automatizada (art. 42.a). Se desarrolla en los arts. 15 y 19 del RD 203/2021.</p></div></details><details class=\"panel\"><summary>Anclaje memorístico</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Para retenerlo</span><b>Sello = organización. Firma = persona.</b></div></div></details></section><section class=\"card art\" id=\"lrjsp41\"><h2><span class=\"num\">LRJSP 41</span> Actuación administrativa automatizada</h2><p class=\"ubic\">Ley 40/2015 ▸ Capítulo V ▸ Sección 2.ª</p><div class=\"idea\">Acto hecho íntegramente por medios electrónicos sin que intervenga directamente un empleado público.</div><svg viewBox=\"0 0 960 236\" width=\"100%\" role=\"img\" aria-label=\"Qué es la actuación administrativa automatizada, cómo se firma y qué debe fijarse previamente\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"t4dfr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#4b5563\"/></marker><marker id=\"t4dfe\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#15803d\"/></marker><marker id=\"t4dfw\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#b45309\"/></marker></defs><text x=\"480\" y=\"24\" font-size=\"13\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"bold\">Actuación administrativa automatizada</text><rect x=\"20\" y=\"44\" width=\"920\" height=\"46\" rx=\"8\" fill=\"#e8efff\" stroke=\"#1d4ed8\" stroke-width=\"1.4\"/><text x=\"480\" y=\"63.025\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#1d4ed8\" font-weight=\"bold\">Acto o actuación realizada ÍNTEGRAMENTE por medios electrónicos en un procedimiento</text><text x=\"480\" y=\"79.025\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">SIN QUE HAYA INTERVENIDO DE FORMA DIRECTA UN EMPLEADO PÚBLICO · LRJSP 41.1</text><rect x=\"20\" y=\"104\" width=\"450\" height=\"56\" rx=\"8\" fill=\"#eaf6ee\" stroke=\"#15803d\" stroke-width=\"1.4\"/><text x=\"245\" y=\"127.85\" font-size=\"11\" text-anchor=\"middle\" fill=\"#15803d\" font-weight=\"bold\">SE FIRMA CON · LRJSP 42</text><text x=\"245\" y=\"143.85\" font-size=\"11\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">a) Sello electrónico  ·  b) Código seguro de verificación</text><rect x=\"490\" y=\"104\" width=\"450\" height=\"56\" rx=\"8\" fill=\"#fdf3e3\" stroke=\"#b45309\" stroke-width=\"1.4\"/><text x=\"715\" y=\"122.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"bold\">HAY QUE FIJAR ANTES · LRJSP 41.2</text><text x=\"715\" y=\"135.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Órganos de definición, programación, mantenimiento,</text><text x=\"715\" y=\"148.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">supervisión, control y auditoría · y el responsable a efectos de impugnación</text><text x=\"480\" y=\"190\" font-size=\"11\" text-anchor=\"middle\" fill=\"#4b5563\" font-weight=\"normal\">En las entidades locales se está a la disposición adicional octava del Real Decreto 128/2018 (RD 203/2021, art. 13.3).</text><text x=\"480\" y=\"216\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"bold\">El CSV permite comprobar la integridad del documento accediendo a la sede electrónica correspondiente.</text></svg><details class=\"panel\" open><summary>Texto legal</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LRJSP</span><p><b>Artículo 41. Actuación administrativa automatizada.</b></p><p>1. Se entiende por actuación administrativa automatizada, cualquier acto o actuación realizada íntegramente a través de medios electrónicos por una Administración Pública en el marco de un procedimiento administrativo y en la que no haya intervenido de forma directa un empleado público.</p><p>2. En caso de actuación administrativa automatizada deberá establecerse previamente el órgano u órganos competentes, según los casos, para la definición de las especificaciones, programación, mantenimiento, supervisión y control de calidad y, en su caso, auditoría del sistema de información y de su código fuente. Asimismo, se indicará el órgano que debe ser considerado responsable a efectos de impugnación.</p></div></div></details><details class=\"panel\"><summary>Disección</summary><div class=\"body\"><ul>\n<li><b>Definición (41.1):</b> cualquier acto o actuación realizada <b>íntegramente a través de medios electrónicos</b> por una Administración <b>en el marco de un procedimiento administrativo</b> y <b>en la que no haya intervenido de forma directa un empleado público</b>.</li>\n<li><b>Lo que hay que fijar antes (41.2):</b> el órgano u órganos competentes para la <b>definición de las especificaciones, programación, mantenimiento, supervisión y control de calidad</b> y, en su caso, <b>auditoría</b> del sistema de información y de su código fuente. Y además: <b>el órgano responsable a efectos de impugnación</b>.</li>\n</ul></div></details><details class=\"panel\"><summary>En lenguaje llano</summary><div class=\"body\"><p>Cuando la decisión la toma el sistema y no una persona, la ley exige que esté escrito de antemano quién programó, quién vigila y, sobre todo, contra quién se recurre.</p></div></details><details class=\"panel\"><summary>¿Por qué existe?</summary><div class=\"body\"><div class=\"interp\"><span class=\"lbl\">Interpretación · aportación externa</span>Sin esa designación previa, una resolución automática sería un acto sin autor: nadie a quien pedir cuentas y nadie contra quien recurrir. El art. 41.2 impide que la automatización se convierta en un escudo.</div></div></details><details class=\"panel\"><summary>Ejemplos</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Ejemplo 1</span>Un ayuntamiento emite automáticamente volantes de empadronamiento: resolución previa que fija órganos y recursos.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 2</span>Un sistema calcula y liquida automáticamente una tasa: misma exigencia.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 3</span>Caso límite: si un empleado revisa y valida cada salida, ya no es actuación automatizada, porque ha intervenido de forma directa.</div></div></details><details class=\"panel\"><summary>Trampas</summary><div class=\"body\"><div class=\"box warn\"><span class=\"lbl\">Cuidado</span>Las tres notas son acumulativas: <b>íntegramente electrónica</b>, <b>dentro de un procedimiento</b> y <b>sin intervención directa de empleado público</b>. Falla una y no hay actuación automatizada.</div></div></details><details class=\"panel\"><summary>Conexiones</summary><div class=\"body\"><p>Se firma con sello o CSV (art. 42). En entidades locales, el art. 13.3 del RD 203/2021 remite a la disposición adicional octava del RD 128/2018.</p></div></details><details class=\"panel\"><summary>Anclaje memorístico</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Para retenerlo</span>Lo que no puede faltar nunca: <b>quién responde a efectos de impugnación</b>.</div></div></details></section><section class=\"card art\" id=\"lrjsp42\"><h2><span class=\"num\">LRJSP 42</span> Sistemas de firma para la actuación administrativa automatizada</h2><p class=\"ubic\">Ley 40/2015 ▸ Capítulo V ▸ Sección 2.ª</p><div class=\"idea\">Solo dos: sello electrónico y código seguro de verificación.</div><svg viewBox=\"0 0 960 236\" width=\"100%\" role=\"img\" aria-label=\"Qué es la actuación administrativa automatizada, cómo se firma y qué debe fijarse previamente\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"t4dfrr2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#4b5563\"/></marker><marker id=\"t4dfer2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#15803d\"/></marker><marker id=\"t4dfwr2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#b45309\"/></marker></defs><text x=\"480\" y=\"24\" font-size=\"13\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"bold\">Actuación administrativa automatizada</text><rect x=\"20\" y=\"44\" width=\"920\" height=\"46\" rx=\"8\" fill=\"#e8efff\" stroke=\"#1d4ed8\" stroke-width=\"1.4\"/><text x=\"480\" y=\"63.025\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#1d4ed8\" font-weight=\"bold\">Acto o actuación realizada ÍNTEGRAMENTE por medios electrónicos en un procedimiento</text><text x=\"480\" y=\"79.025\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">SIN QUE HAYA INTERVENIDO DE FORMA DIRECTA UN EMPLEADO PÚBLICO · LRJSP 41.1</text><rect x=\"20\" y=\"104\" width=\"450\" height=\"56\" rx=\"8\" fill=\"#eaf6ee\" stroke=\"#15803d\" stroke-width=\"1.4\"/><text x=\"245\" y=\"127.85\" font-size=\"11\" text-anchor=\"middle\" fill=\"#15803d\" font-weight=\"bold\">SE FIRMA CON · LRJSP 42</text><text x=\"245\" y=\"143.85\" font-size=\"11\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">a) Sello electrónico  ·  b) Código seguro de verificación</text><rect x=\"490\" y=\"104\" width=\"450\" height=\"56\" rx=\"8\" fill=\"#fdf3e3\" stroke=\"#b45309\" stroke-width=\"1.4\"/><text x=\"715\" y=\"122.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"bold\">HAY QUE FIJAR ANTES · LRJSP 41.2</text><text x=\"715\" y=\"135.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Órganos de definición, programación, mantenimiento,</text><text x=\"715\" y=\"148.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">supervisión, control y auditoría · y el responsable a efectos de impugnación</text><text x=\"480\" y=\"190\" font-size=\"11\" text-anchor=\"middle\" fill=\"#4b5563\" font-weight=\"normal\">En las entidades locales se está a la disposición adicional octava del Real Decreto 128/2018 (RD 203/2021, art. 13.3).</text><text x=\"480\" y=\"216\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"bold\">El CSV permite comprobar la integridad del documento accediendo a la sede electrónica correspondiente.</text></svg><details class=\"panel\" open><summary>Texto legal</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LRJSP</span><p><b>Artículo 42. Sistemas de firma para la actuación administrativa automatizada.</b></p><p>En el ejercicio de la competencia en la actuación administrativa automatizada, cada Administración Pública podrá determinar los supuestos de utilización de los siguientes sistemas de firma electrónica:</p><p>a) Sello electrónico de Administración Pública, órgano, organismo público o entidad de derecho público, basado en certificado electrónico reconocido o cualificado que reúna los requisitos exigidos por la legislación de firma electrónica.</p><p>b) Código seguro de verificación vinculado a la Administración Pública, órgano, organismo público o entidad de Derecho Público, en los términos y condiciones establecidos, permitiéndose en todo caso la comprobación de la integridad del documento mediante el acceso a la sede electrónica correspondiente.</p></div></div></details><details class=\"panel\"><summary>Disección</summary><div class=\"body\"><ul>\n<li><b>a) Sello electrónico</b> de Administración, órgano, organismo o entidad de derecho público, basado en <b>certificado reconocido o cualificado</b>.</li>\n<li><b>b) Código seguro de verificación (CSV)</b> vinculado a la Administración, órgano, organismo o entidad, <b>permitiéndose en todo caso la comprobación de la integridad del documento mediante el acceso a la sede electrónica correspondiente</b>.</li>\n<li><b>Son dos y solo dos.</b> La lista es cerrada para la actuación automatizada.</li>\n</ul></div></details><details class=\"panel\"><summary>En lenguaje llano</summary><div class=\"body\"><p>Si el acto lo hace la máquina, se firma con el sello de la casa o con un código que permite comprobar en la sede que el papel que tienes en la mano coincide con el original.</p></div></details><details class=\"panel\"><summary>¿Por qué existe?</summary><div class=\"body\"><div class=\"interp\"><span class=\"lbl\">Interpretación · aportación externa</span>El CSV resuelve un problema muy práctico: el documento se imprime y circula en papel, pero sigue siendo verificable. Cualquiera puede teclear el código en la sede y comprobar que no se ha manipulado.</div></div></details><details class=\"panel\"><summary>Ejemplos</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Ejemplo 1</span>Un certificado descargado de la sede lleva un CSV al pie: tecleándolo en la sede aparece el documento original.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 2</span>Una diligencia automática de registro lleva el sello del órgano.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 3</span>Caso límite: un documento con CSV cuya sede ya no existe. La verificación es parte del sistema; suprimir la sede sin prever la verificación deja el documento huérfano.</div></div></details><details class=\"panel\"><summary>Trampas</summary><div class=\"body\"><div class=\"box warn\"><span class=\"lbl\">Cuidado</span>El CSV es un sistema de <b>firma</b> en la actuación automatizada, no un mero número de referencia. Y solo opera en actuación automatizada: fuera de ella, firma el titular del órgano o el empleado (art. 43).</div></div></details><details class=\"panel\"><summary>Conexiones</summary><div class=\"body\"><p>Desarrolla la firma de los actos del art. 41. Su desarrollo reglamentario está en el art. 20 del RD 203/2021.</p></div></details><details class=\"panel\"><summary>Anclaje memorístico</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Para retenerlo</span>Automatizado se firma con <b>S o C</b>: <b>S</b>ello o <b>C</b>ódigo seguro de verificación.</div></div></details></section><section class=\"card art\" id=\"lrjsp43\"><h2><span class=\"num\">LRJSP 43</span> Firma electrónica del personal al servicio de las Administraciones</h2><p class=\"ubic\">Ley 40/2015 ▸ Capítulo V ▸ Sección 2.ª</p><div class=\"idea\">Cuando no es automatizado, firma el titular del órgano o el empleado público.</div><svg viewBox=\"0 0 980 352\" width=\"100%\" role=\"img\" aria-label=\"Sistemas de identificación y firma de la Administración frente a los de la persona interesada\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"t4cfrr3\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#4b5563\"/></marker><marker id=\"t4cfer3\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#15803d\"/></marker><marker id=\"t4cfwr3\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#b45309\"/></marker></defs><text x=\"490\" y=\"24\" font-size=\"13\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"bold\">Quién se identifica y con qué</text><rect x=\"20\" y=\"44\" width=\"460\" height=\"36\" rx=\"8\" fill=\"#e8efff\" stroke=\"#1d4ed8\" stroke-width=\"1.4\"/><text x=\"250\" y=\"66.2\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1d4ed8\" font-weight=\"bold\">LA ADMINISTRACIÓN</text><rect x=\"500\" y=\"44\" width=\"460\" height=\"36\" rx=\"8\" fill=\"#eaf6ee\" stroke=\"#15803d\" stroke-width=\"1.4\"/><text x=\"730\" y=\"66.2\" font-size=\"12\" text-anchor=\"middle\" fill=\"#15803d\" font-weight=\"bold\">LA PERSONA INTERESADA</text><rect x=\"20\" y=\"90\" width=\"460\" height=\"54\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"250\" y=\"106.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Certificado cualificado de</text><text x=\"250\" y=\"120.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">AUTENTICACIÓN DE SITIO WEB</text><text x=\"250\" y=\"134.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">para identificar la sede · art. 18</text><rect x=\"500\" y=\"90\" width=\"460\" height=\"54\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"730\" y=\"113.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Certificado cualificado de</text><text x=\"730\" y=\"127.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">FIRMA ELECTRÓNICA · LPAC 9.2.a)</text><rect x=\"20\" y=\"148\" width=\"460\" height=\"54\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"250\" y=\"171.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">SELLO ELECTRÓNICO basado en</text><text x=\"250\" y=\"185.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">certificado cualificado · LRJSP 40</text><rect x=\"500\" y=\"148\" width=\"460\" height=\"54\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"730\" y=\"171.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Certificado cualificado de</text><text x=\"730\" y=\"185.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">SELLO ELECTRÓNICO · LPAC 9.2.b)</text><rect x=\"20\" y=\"206\" width=\"460\" height=\"54\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"250\" y=\"229.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">CÓDIGO SEGURO DE VERIFICACIÓN</text><text x=\"250\" y=\"243.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">solo en actuación automatizada · LRJSP 42</text><rect x=\"500\" y=\"206\" width=\"460\" height=\"54\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"730\" y=\"229.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">CLAVE CONCERTADA y otros sistemas</text><text x=\"730\" y=\"243.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">con registro previo · LPAC 9.2.c)</text><rect x=\"20\" y=\"264\" width=\"460\" height=\"54\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"250\" y=\"287.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">FIRMA DEL PERSONAL al servicio</text><text x=\"250\" y=\"301.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">de la Administración · LRJSP 43</text><rect x=\"500\" y=\"264\" width=\"460\" height=\"54\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"730\" y=\"287.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">El FUNCIONARIO HABILITADO firma</text><text x=\"730\" y=\"301.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">por quien no tiene medios · LPAC 12.2</text><text x=\"490\" y=\"340\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"bold\">Los tres sistemas del interesado son los mismos para identificarse (art. 9.2) y para firmar (art. 10.2). Lo que cambia es para qué se usan.</text></svg><details class=\"panel\" open><summary>Texto legal</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LRJSP</span><p><b>Artículo 43. Firma electrónica del personal al servicio de las Administraciones Públicas.</b></p><p>1. Sin perjuicio de lo previsto en los artículos 38, 41 y 42, la actuación de una Administración Pública, órgano, organismo público o entidad de derecho público, cuando utilice medios electrónicos, se realizará mediante firma electrónica del titular del órgano o empleado público.</p><p>2. Cada Administración Pública determinará los sistemas de firma electrónica que debe utilizar su personal, los cuales podrán identificar de forma conjunta al titular del puesto de trabajo o cargo y a la Administración u órgano en la que presta sus servicios. Por razones de seguridad pública los sistemas de firma electrónica podrán referirse sólo el número de identificación profesional del empleado público.</p></div></div></details><details class=\"panel\"><summary>Disección</summary><div class=\"body\"><ul>\n<li><b>Regla (43.1):</b> sin perjuicio de los arts. 38, 41 y 42, la actuación de la Administración por medios electrónicos <b>se realizará mediante firma electrónica del titular del órgano o empleado público</b>.</li>\n<li><b>Sistemas (43.2):</b> cada Administración determina los suyos, que <b>podrán identificar de forma conjunta</b> al titular del puesto o cargo <b>y</b> a la Administración u órgano donde presta servicios.</li>\n<li><b>Anonimato por seguridad (43.2):</b> por razones de <b>seguridad pública</b> los sistemas de firma podrán referirse <b>solo al número de identificación profesional</b> del empleado público.</li>\n</ul></div></details><details class=\"panel\"><summary>En lenguaje llano</summary><div class=\"body\"><p>Lo normal es que firme una persona, y que su firma diga a la vez quién es y dónde trabaja. Solo por seguridad pública puede ocultarse el nombre y dejar el número profesional.</p></div></details><details class=\"panel\"><summary>¿Por qué existe?</summary><div class=\"body\"><div class=\"interp\"><span class=\"lbl\">Interpretación · aportación externa</span>La firma personal mantiene la cadena de responsabilidad: detrás de cada acto hay alguien. El número profesional es la excepción para quienes, por su función, exponerse por nombre y apellidos sería un riesgo.</div></div></details><details class=\"panel\"><summary>Ejemplos</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Ejemplo 1</span>La resolución de concesión de una subvención la firma electrónicamente el titular del órgano concedente.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 2</span>Un agente en funciones de seguridad firma con número de identificación profesional.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 3</span>Caso límite: el art. 23 del RD 203/2021 precisa cuándo cabe ese número: información clasificada, seguridad pública, defensa nacional u otras actuaciones donde el anonimato esté legalmente justificado.</div></div></details><details class=\"panel\"><summary>Trampas</summary><div class=\"body\"><div class=\"box warn\"><span class=\"lbl\">Cuidado</span>El anonimato no es libre: exige <b>razones de seguridad pública</b> y, en el desarrollo reglamentario, petición de la Administración al prestador cualificado.</div></div></details><details class=\"panel\"><summary>Conexiones</summary><div class=\"body\"><p>Es la regla; los arts. 41 y 42 son la excepción automatizada. Se desarrolla en los arts. 22 y 23 del RD 203/2021.</p></div></details><details class=\"panel\"><summary>Anclaje memorístico</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Para retenerlo</span>Si hay <b>persona</b> detrás, firma la persona. Si no la hay, sello o CSV.</div></div></details></section><section class=\"card art\" id=\"lpac9\"><h2><span class=\"num\">LPAC 9</span> Sistemas de identificación de los interesados en el procedimiento</h2><p class=\"ubic\">Ley 39/2015 ▸ Título I «De los interesados en el procedimiento» ▸ Capítulo I</p><div class=\"idea\">Tres vías para identificarse: certificado de firma, certificado de sello y clave concertada.</div><svg viewBox=\"0 0 980 352\" width=\"100%\" role=\"img\" aria-label=\"Sistemas de identificación y firma de la Administración frente a los de la persona interesada\" xmlns=\"http://www.w3.org/2000/svg\"><defs><ma

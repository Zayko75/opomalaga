 determinados procedimientos y para ciertos colectivos de personas físicas que por razón de su capacidad económica, técnica, dedicación profesional u otros motivos quede acreditado que tienen acceso y disponibilidad de los medios electrónicos necesarios.</p></div></div></details><details class=\"panel\"><summary>Disección</summary><div class=\"body\"><ul>\n<li><b>Regla (14.1):</b> las personas físicas <b>podrán elegir en todo momento</b> si se comunican por medios electrónicos o no, <b>salvo que estén obligadas</b>. Y el medio elegido <b>podrá ser modificado en cualquier momento</b>.</li>\n<li><b>Obligados (14.2),</b> «para la realización de <b>cualquier trámite</b> de un procedimiento administrativo, <b>al menos</b>»: <b>a)</b> personas jurídicas; <b>b)</b> entidades sin personalidad jurídica; <b>c)</b> quienes ejerzan actividad profesional de <b>colegiación obligatoria</b>, para los trámites de esa actividad —<b>notarios y registradores</b> incluidos en todo caso—; <b>d)</b> quienes <b>representen</b> a un obligado; <b>e)</b> los <b>empleados públicos</b>, por razón de su condición, en la forma que determine reglamentariamente cada Administración.</li>\n<li><b>Ampliación por reglamento (14.3):</b> pueden añadirse colectivos de personas físicas por <b>capacidad económica, técnica, dedicación profesional u otros motivos</b> acreditados de acceso y disponibilidad de medios.</li>\n</ul></div></details><details class=\"panel\"><summary>En lenguaje llano</summary><div class=\"body\"><p>Si eres una persona física normal, eliges: papel o electrónico, y puedes cambiar cuando quieras. Si eres empresa, asociación, colegiado en ejercicio, representante de un obligado o empleado público, no eliges.</p></div></details><details class=\"panel\"><summary>¿Por qué existe?</summary><div class=\"body\"><div class=\"interp\"><span class=\"lbl\">Interpretación · aportación externa</span>La obligación se impone a quien ya trabaja con medios electrónicos en su actividad ordinaria; el derecho de elección se conserva para quien podría quedar excluido. Es la línea que separa modernizar de dejar fuera.</div></div></details><details class=\"panel\"><summary>Ejemplos</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Ejemplo 1</span>Una asociación de vecinos presenta una solicitud de subvención: es entidad con personalidad jurídica, obligada por la letra a).</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 2</span>Una arquitecta colegiada presenta un proyecto en el ayuntamiento: obligada por la letra c), por ser trámite de su actividad profesional. Si pide una licencia para reformar su casa, actúa como particular.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 3</span>Caso límite: un particular que no está obligado otorga poder a su gestor, que sí es un obligado. El representante queda sujeto por la letra d) aunque el representado no lo esté.</div></div></details><details class=\"panel\"><summary>Trampas</summary><div class=\"body\"><div class=\"box warn\"><span class=\"lbl\">Cuidado</span>Tres cosas: el «<b>al menos</b>» del 14.2 significa que la lista es un <b>mínimo</b>, no un máximo; la letra c) obliga <b>solo</b> para los trámites de la actividad profesional; y la letra d) obliga al <b>representante de un obligado</b>, no a todo representante.</div></div></details><details class=\"panel\"><summary>Conexiones</summary><div class=\"body\"><p>Delimita a quién asiste el funcionario habilitado del art. 12.2 —solo a los <b>no</b> obligados—. Se desarrolla en el art. 3 del RD 203/2021 y en el art. 32.2 para los representantes.</p></div></details><details class=\"panel\"><summary>Anclaje memorístico</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Para retenerlo</span>Los cinco obligados: <b>Jurídicas · Entidades sin personalidad · Colegiados · Representantes de obligados · Empleados públicos</b>.</div></div></details></section><section class=\"card art\" id=\"rd203_3\"><h2><span class=\"num\">RD 203/2021 3</span> Derecho y obligación de relacionarse electrónicamente</h2><p class=\"ubic\">RD 203/2021 ▸ Capítulo I «Disposiciones generales»</p><div class=\"idea\">Cómo se ejerce el derecho a elegir y desde cuándo produce efectos: quinto día hábil.</div><svg viewBox=\"0 0 960 220\" width=\"100%\" role=\"img\" aria-label=\"Pasos y plazo de cinco días hábiles para que la opción por el medio electrónico produzca efectos\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"t5dfr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#4b5563\"/></marker><marker id=\"t5dfe\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#15803d\"/></marker><marker id=\"t5dfw\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#b45309\"/></marker></defs><text x=\"480\" y=\"24\" font-size=\"13\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"bold\">La persona física no obligada que quiere lo electrónico</text><rect x=\"20\" y=\"46\" width=\"186\" height=\"70\" rx=\"8\" fill=\"#e8efff\" stroke=\"#1d4ed8\" stroke-width=\"1.4\"/><text x=\"113\" y=\"76.85\" font-size=\"11\" text-anchor=\"middle\" fill=\"#1d4ed8\" font-weight=\"bold\">1 · LO COMUNICA</text><text x=\"113\" y=\"92.85\" font-size=\"11\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">al órgano competente</text><rect x=\"258\" y=\"46\" width=\"186\" height=\"70\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"351\" y=\"68.85\" font-size=\"11\" text-anchor=\"middle\" fill=\"#4b5563\" font-weight=\"bold\">2 · QUEDA</text><text x=\"351\" y=\"84.85\" font-size=\"11\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">CONSTANCIA</text><text x=\"351\" y=\"100.85\" font-size=\"11\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">de la decisión</text><rect x=\"496\" y=\"46\" width=\"186\" height=\"70\" rx=\"8\" fill=\"#fdeceb\" stroke=\"#b91c1c\" stroke-width=\"1.4\"/><text x=\"589\" y=\"68.85\" font-size=\"11\" text-anchor=\"middle\" fill=\"#b91c1c\" font-weight=\"bold\">3 · EFECTOS desde</text><text x=\"589\" y=\"84.85\" font-size=\"11\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">el 5.º DÍA HÁBIL</text><text x=\"589\" y=\"100.85\" font-size=\"11\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">siguiente</text><rect x=\"734\" y=\"46\" width=\"186\" height=\"70\" rx=\"8\" fill=\"#eaf6ee\" stroke=\"#15803d\" stroke-width=\"1.4\"/><text x=\"827\" y=\"68.85\" font-size=\"11\" text-anchor=\"middle\" fill=\"#15803d\" font-weight=\"bold\">4 · PUEDE</text><text x=\"827\" y=\"84.85\" font-size=\"11\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">CAMBIAR</text><text x=\"827\" y=\"100.85\" font-size=\"11\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">en cualquier momento</text><line x1=\"210\" y1=\"81\" x2=\"252\" y2=\"81\" stroke=\"#4b5563\" stroke-width=\"1.6\" marker-end=\"url(#t5dfr)\"/><line x1=\"448\" y1=\"81\" x2=\"490\" y2=\"81\" stroke=\"#4b5563\" stroke-width=\"1.6\" marker-end=\"url(#t5dfr)\"/><line x1=\"686\" y1=\"81\" x2=\"728\" y2=\"81\" stroke=\"#4b5563\" stroke-width=\"1.6\" marker-end=\"url(#t5dfr)\"/><rect x=\"20\" y=\"132\" width=\"920\" height=\"40\" rx=\"8\" fill=\"#fdf3e3\" stroke=\"#b45309\" stroke-width=\"1.4\"/><text x=\"480\" y=\"155.85\" font-size=\"11\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Lo mismo vale para DEJAR de relacionarse electrónicamente si antes había optado por ello · RD 203/2021, art. 3.2</text><text x=\"480\" y=\"198\" font-size=\"11\" text-anchor=\"middle\" fill=\"#b91c1c\" font-weight=\"bold\">La cifra del artículo es el QUINTO DÍA HÁBIL siguiente a la recepción de la comunicación por el órgano que tramita.</text></svg><details class=\"panel\" open><summary>Texto legal</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · RD 203/2021</span><p><b>Artículo 3. Derecho y obligación de relacionarse electrónicamente con las Administraciones Públicas.</b></p><p>1. Estarán obligados a relacionarse a través de medios electrónicos con las Administraciones Públicas para la realización de cualquier trámite de un procedimiento administrativo, al menos, los sujetos a los que se refiere el artículo 14.2 de la Ley 39/2015, de 1 de octubre.</p><p>2. Las personas físicas no obligadas a relacionarse a través de medios electrónicos con las Administraciones Públicas podrán ejercitar su derecho a relacionarse electrónicamente con la Administración Pública de que se trate al inicio del procedimiento y, a tal efecto, lo comunicarán al órgano competente para la tramitación del mismo de forma que este pueda tener constancia de dicha decisión. La voluntad de relacionarse electrónicamente o, en su caso, de dejar de hacerlo cuando ya se había optado anteriormente por ello, podrá realizarse en una fase posterior del procedimiento, si bien deberá comunicarse a dicho órgano de forma que quede constancia de la misma. En ambos casos, los efectos de la comunicación se producirán a partir del quinto día hábil siguiente a aquel en que el órgano competente para tramitar el procedimiento haya tenido constancia de la misma.</p><p>3. De acuerdo con lo previsto en el apartado 3 del artículo 14 de la Ley 39/2015, de 1 de octubre, la obligatoriedad de relacionarse electrónicamente podrá establecerse reglamentariamente por las Administraciones Públicas para determinados procedimientos y para ciertos colectivos de personas físicas que, por razón de su capacidad económica, técnica, dedicación profesional u otros motivos, quede acreditado que tienen acceso y disponibilidad de los medios electrónicos necesarios. A tal efecto, en el ámbito estatal la mencionada obligatoriedad de relacionarse por medios electrónicos con sus órganos, organismos y entidades de derecho público podrá ser establecida por real decreto acordado en Consejo de Ministros o por orden de la persona titular del Departamento competente respecto de los procedimientos de que se trate que afecten al ámbito competencial de uno o varios Ministerios cuya regulación no requiera de norma con rango de real decreto. Asimismo, se publicará en el Punto de Acceso General electrónico (PAGe) de la Administración General del Estado y en la sede electrónica o sede asociada que corresponda.</p></div></div></details><details class=\"panel\"><summary>Disección</summary><div class=\"body\"><ul>\n<li><b>Remisión (3.1):</b> están obligados <b>al menos</b> los sujetos del art. 14.2 LPAC.</li>\n<li><b>Cómo se ejerce (3.2):</b> las personas físicas <b>no obligadas</b> pueden ejercitar su derecho a relacionarse electrónicamente <b>al inicio del procedimiento</b>, comunicándolo al órgano competente <b>de forma que este pueda tener constancia</b> de la decisión.</li>\n<li><b>También después:</b> la voluntad de relacionarse electrónicamente, <b>o de dejar de hacerlo</b> si antes se había optado por ello, puede manifestarse <b>en una fase posterior</b>, comunicándolo igualmente con constancia.</li>\n<li><b>La cifra:</b> «en ambos casos, los efectos de la comunicación se producirán <b>a partir del quinto día hábil siguiente</b> a aquel en que el órgano competente para tramitar el procedimiento» la reciba.</li>\n</ul></div></details><details class=\"panel\"><summary>En lenguaje llano</summary><div class=\"body\"><p>Cambiar de canal no es instantáneo. Lo comunicas, queda constancia, y a partir del quinto día hábil siguiente la Administración ya tiene que tratarte por el canal nuevo.</p></div></details><details class=\"panel\"><summary>¿Por qué existe?</summary><div class=\"body\"><div class=\"interp\"><span class=\"lbl\">Interpretación · aportación externa</span>La Administración necesita un margen para reconfigurar notificaciones y avisos. Sin ese plazo, un cambio de canal en mitad de un procedimiento provocaría notificaciones fallidas y nulidades.</div></div></details><details class=\"panel\"><summary>Ejemplos</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Ejemplo 1</span>Un vecino en un expediente en papel comunica el 2 de noviembre que quiere notificaciones electrónicas: los efectos empiezan el quinto día hábil siguiente.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 2</span>Otro que venía recibiendo notificaciones electrónicas comunica que quiere volver al papel: mismo plazo.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 3</span>Caso límite: una notificación practicada dentro de esos cinco días hábiles por el canal antiguo es válida, porque el cambio aún no ha surtido efecto.</div></div></details><details class=\"panel\"><summary>Trampas</summary><div class=\"body\"><div class=\"box warn\"><span class=\"lbl\">Cuidado</span>Son <b>días hábiles</b>, y se cuentan desde que lo recibe <b>el órgano que tramita</b>, no desde que el interesado lo envía. Y el mismo plazo vale para entrar y para salir del canal electrónico.</div></div></details><details class=\"panel\"><summary>Conexiones</summary><div class=\"body\"><p>Desarrolla el art. 14.1 LPAC. Enlaza con las notificaciones de los arts. 41 a 43 LPAC.</p></div></details><details class=\"panel\"><summary>Anclaje memorístico</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Para retenerlo</span>Cambiar de canal: <b>quinto día hábil</b>. La única cifra del artículo.</div></div></details></section><section class=\"card art\" id=\"rd203_2\"><h2><span class=\"num\">RD 203/2021 2</span> Principios generales</h2><p class=\"ubic\">RD 203/2021 ▸ Capítulo I</p><div class=\"idea\">Neutralidad tecnológica, accesibilidad, interoperabilidad, seguridad y proporcionalidad.</div><details class=\"panel\" open><summary>Texto legal</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · RD 203/2021</span><p><b>Artículo 2. Principios generales.</b></p><p>El sector público deberá respetar los siguientes principios en sus actuaciones y relaciones electrónicas:</p><p>a) Los principios de neutralidad tecnológica y de adaptabilidad al progreso de las tecnologías y sistemas de comunicaciones electrónicas, para garantizar tanto la independencia en la elección de las alternativas tecnológicas necesarias para relacionarse con las Administraciones Públicas por parte de las personas interesadas y por el propio sector público, como la libertad para desarrollar e implantar los avances tecnológicos en un ámbito de libre mercado. A estos efectos, el sector público utilizará estándares abiertos, así como, en su caso y de forma complementaria, estándares que sean de uso generalizado. Las herramientas y dispositivos que deban utilizarse para la comunicación por medios electrónicos, así como sus características técnicas, serán no discriminatorios, estarán disponibles de forma general y serán compatibles con los productos informáticos de uso general.</p><p>b) El principio de accesibilidad, entendido como el conjunto de principios y técnicas que se deben respetar al diseñar, construir, mantener y actualizar los servicios electrónicos para garantizar la igualdad y la no discriminación en el acceso de las personas usuarias, en particular de las personas con discapacidad y de las personas mayores.</p><p>c) El principio de facilidad de uso, que determina que el diseño de los servicios electrónicos esté centrado en las personas usuarias, de forma que se minimice el grado de conocimiento necesario para el uso del servicio.</p><p>d) El principio de interoperabilidad, entendido como la capacidad de los sistemas de información y, por ende, de los procedimientos a los que éstos dan soporte, de compartir datos y posibilitar el intercambio de información entre ellos.</p><p>e) El principio de proporcionalidad, en cuya virtud sólo se exigirán las garantías y medidas de seguridad adecuadas a la naturaleza y circunstancias de los distintos trámites y actuaciones electrónicos.</p><p>f) El principio de personalización y proactividad, entendido como la capacidad de las Administraciones Públicas para que, partiendo del conocimiento adquirido del usuario final del servicio, proporcione servicios precumplimentados y se anticipe a las posibles necesidades de los mismos.</p></div></div></details><details class=\"panel\"><summary>Disección</summary><div class=\"body\"><ul>\n<li><b>Neutralidad tecnológica y adaptabilidad al progreso:</b> garantizan la <b>independencia en la elección</b> de alternativas tecnológicas y la libertad de desarrollo en libre mercado. A tal fin, <b>estándares abiertos</b> y, complementariamente, estándares de uso generalizado. Las herramientas serán <b>no discriminatorias</b>, de disponibilidad general y <b>compatibles con los productos informáticos de uso general</b>.</li>\n<li><b>Accesibilidad:</b> principios y técnicas a respetar al diseñar, construir, mantener y actualizar los servicios electrónicos.</li>\n<li>Y junto a ellos, los de <b>interoperabilidad, seguridad, proporcionalidad, personalización y proactividad</b> que el propio artículo enumera.</li>\n</ul></div></details><details class=\"panel\"><summary>En lenguaje llano</summary><div class=\"body\"><p>La Administración no puede obligarte a usar un sistema operativo, un navegador o un programa concretos. Tiene que funcionar con lo que la gente tiene.</p></div></details><details class=\"panel\"><summary>¿Por qué existe?</summary><div class=\"body\"><div class=\"interp\"><span class=\"lbl\">Interpretación · aportación externa</span>Si cada Administración eligiera su tecnología sin restricción, el ciudadano acabaría necesitando media docena de programas distintos y quien no pudiera pagarlos quedaría excluido. La neutralidad tecnológica es una garantía de acceso, no una preferencia técnica.</div></div></details><details class=\"panel\"><summary>Ejemplos</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Ejemplo 1</span>Una sede que solo funciona con un navegador concreto vulnera la neutralidad tecnológica.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 2</span>Un formulario que exige un programa de pago para abrirse incumple el principio de estándares abiertos.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 3</span>Caso límite: los estándares de uso generalizado se admiten, pero <b>de forma complementaria</b>, no en sustitución de los abiertos.</div></div></details><details class=\"panel\"><summary>Trampas</summary><div class=\"body\"><div class=\"box warn\"><span class=\"lbl\">Cuidado</span>Neutralidad tecnológica <b>no</b> significa que la Administración no pueda elegir tecnología: significa que su elección no puede condicionar la del ciudadano.</div></div></details><details class=\"panel\"><summary>Conexiones</summary><div class=\"body\"><p>Es el marco de todo el Reglamento. La accesibilidad se reitera en el art. 38.5 LRJSP para las sedes.</p></div></details><details class=\"panel\"><summary>Anclaje memorístico</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Para retenerlo</span>Dos ideas: <b>estándares abiertos</b> y <b>no discriminación</b> de herramientas.</div></div></details></section><section class=\"card art\" id=\"rd203_5\"><h2><span class=\"num\">RD 203/2021 5</span> Portales de internet de las Administraciones Públicas</h2><p class=\"ubic\">RD 203/2021 ▸ Capítulo II ▸ Sección 1.ª</p><div class=\"idea\">Qué debe ofrecer el portal y su relación con la sede.</div><details class=\"panel\" open><summary>Texto legal</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · RD 203/2021</span><p><b>Artículo 5. Portales de internet de las Administraciones Públicas.</b></p><p>1. De acuerdo con lo previsto en el artículo 39 de la Ley 40/2015, de 1 de octubre, se entiende por portal de internet el punto de acceso electrónico cuya titularidad corresponda a una Administración Pública, organismo público o entidad de derecho público que permite el acceso a través de internet a la información y, en su caso, a la sede electrónica o sede electrónica asociada correspondiente.</p><p>2. Cada Administración podrá determinar los contenidos y canales mínimos de atención a las personas interesadas y de difusión y prestación de servicios que deban tener sus portales, así como criterios obligatorios de imagen institucional. En cualquier caso, deberán tenerse en cuenta los contenidos, formatos y funcionalidades que en la normativa de reutilización, accesibilidad y transparencia se establezcan como obligatorios para los sitios web.</p><p>3. Los portales de internet dispondrán de sistemas que permitan el establecimiento de medidas de seguridad de acuerdo con lo establecido en Real Decreto 3/2010, de 8 de enero, por el que se regula el Esquema Nacional de Seguridad en el ámbito de la Administración Electrónica.</p></div></div></details><details class=\"panel\"><summary>Disección</summary><div class=\"body\"><ul>\n<li><b>Concepto:</b> desarrolla el art. 39 LRJSP: punto de acceso electrónico que permite el acceso por internet a la información publicada y, en su caso, a la sede.</li>\n<li><b>Contenido:</b> el portal debe facilitar el acceso a la información y a los servicios de la Administración titular, respetando accesibilidad y estándares.</li>\n<li><b>Relación con la sede:</b> desde el portal se accede a la sede cuando el trámite exige identificación; el portal por sí mismo no tramita.</li>\n</ul></div></details><details class=\"panel\"><summary>En lenguaje llano</summary><div class=\"body\"><p>El portal es la cara pública. Todo lo que puedas leer sin identificarte vive ahí.</p></div></details><details class=\"panel\"><summary>¿Por qué existe?</summary><div class=\"body\"><div class=\"interp\"><span class=\"lbl\">Interpretación · aportación externa</span>Distinguir portal de sede permite que la mayor parte de la web de una Administración —noticias, organigramas, tablones— no quede sujeta al régimen reforzado de responsabilidad de la sede.</div></div></details><details class=\"panel\"><summary>Ejemplos</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Ejemplo 1</span>El portal de la Diputación con sus noticias y su tablón de anuncios.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 2</span>El enlace que desde ese portal lleva a la sede para presentar instancias.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 3</span>Caso límite: contenido de publicidad activa de la Ley de transparencia. Se publica en el portal, y la Administración se entiende identificada respecto de él por el art. 40.2 LRJSP.</div></div></details><details class=\"panel\"><summary>Trampas</summary><div class=\"body\"><div class=\"box warn\"><span class=\"lbl\">Cuidado</span>Portal y sede pueden compartir dominio y diseño. Lo que los distingue no es la apariencia, sino si hay que identificarse para actuar.</div></div></details><details class=\"panel\"><summary>Conexiones</summary><div class=\"body\"><p>Con el art. 39 LRJSP, con el art. 7 —PAGe— y con los arts. 9 a 12 —sedes—.</p></div></details><details class=\"panel\"><summary>Anclaje memorístico</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Para retenerlo</span><b>Portal = leer. Sede = actuar.</b></div></div></details></section><section class=\"card art\" id=\"lpac5\"><h2><span class=\"num\">LPAC 5</span> Representación</h2><p class=\"ubic\">Ley 39/2015 ▸ Título I ▸ Capítulo I</p><div class=\"idea\">Cuándo hay que acreditar la representación, cómo se acredita y qué pasa si falta.</div><svg viewBox=\"0 0 960 266\" width=\"100%\" role=\"img\" aria-label=\"Vías para acreditar la representación y plazo de diez días para subsanar su falta\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"t5efrr2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#4b5563\"/></marker><marker id=\"t5efer2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#15803d\"/></marker><marker id=\"t5efwr2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#b45309\"/></marker></defs><text x=\"480\" y=\"24\" font-size=\"13\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"bold\">Acreditar la representación</text><rect x=\"20\" y=\"42\" width=\"920\" height=\"38\" rx=\"8\" fill=\"#e8efff\" stroke=\"#1d4ed8\" stroke-width=\"1.4\"/><text x=\"480\" y=\"64.78\" font-size=\"10.8\" text-anchor=\"middle\" fill=\"#1d4ed8\" font-weight=\"bold\">CUÁNDO HAY QUE ACREDITARLA · art. 5.3: solicitar, declarar, recurrir, desistir y renunciar. En los actos de mero trámite SE PRESUME</text><rect x=\"20\" y=\"92\" width=\"215\" height=\"54\" rx=\"8\" fill=\"#eaf6ee\" stroke=\"#15803d\" stroke-width=\"1.4\"/><text x=\"127.5\" y=\"115.35\" font-size=\"11\" text-anchor=\"middle\" fill=\"#15803d\" font-weight=\"bold\">APUD ACTA</text><text x=\"127.5\" y=\"130.35\" font-size=\"11\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">personal o electrónico</text><rect x=\"255\" y=\"92\" width=\"215\" height=\"54\" rx=\"8\" fill=\"#eaf6ee\" stroke=\"#15803d\" stroke-width=\"1.4\"/><text x=\"362.5\" y=\"115.35\" font-size=\"11\" text-anchor=\"middle\" fill=\"#15803d\" font-weight=\"bold\">INSCRIPCIÓN en el registro</text><text x=\"362.5\" y=\"130.35\" font-size=\"11\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">de apoderamientos</text><rect x=\"490\" y=\"92\" width=\"215\" height=\"54\" rx=\"8\" fill=\"#eaf6ee\" stroke=\"#15803d\" stroke-width=\"1.4\"/><text x=\"597.5\" y=\"115.35\" font-size=\"11\" text-anchor=\"middle\" fill=\"#15803d\" font-weight=\"bold\">CERTIFICADO CUALIFICADO</text><text x=\"597.5\" y=\"130.35\" font-size=\"11\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">de representante</text><rect x=\"725\" y=\"92\" width=\"215\" height=\"54\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"832.5\" y=\"115.35\" font-size=\"11\" text-anchor=\"middle\" fill=\"#4b5563\" font-weight=\"bold\">CUALQUIER MEDIO</text><text x=\"832.5\" y=\"130.35\" font-size=\"11\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">válido en Derecho</text><rect x=\"20\" y=\"160\" width=\"920\" height=\"40\" rx=\"8\" fill=\"#fdf3e3\" stroke=\"#b45309\" stroke-width=\"1.4\"/><text x=\"480\" y=\"183.78\" font-size=\"10.8\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"bold\">SI FALTA O ES INSUFICIENTE · art. 5.6: no impide tener por realizado el acto si se subsana en el plazo de DIEZ DÍAS que debe conceder el órgano</text><text x=\"480\" y=\"224\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#4b5563\" font-weight=\"normal\">El órgano que tramita debe INCORPORAR AL EXPEDIENTE la acreditación de la condición de representante y de los poderes reconocidos (art. 5.5).</text><text x=\"480\" y=\"250\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#4b5563\" font-weight=\"normal\">El documento electrónico que acredite el resultado de la consulta al registro vale como acreditación.</text></svg><details class=\"panel\" open><summary>Texto legal</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LPAC</span><p><b>Artículo 5. Representación.</b></p><p>1. Los interesados con capacidad de obrar podrán actuar por medio de representante, entendiéndose con éste las actuaciones administrativas, salvo manifestación expresa en contra del interesado.</p><p>2. Las personas físicas con capacidad de obrar y las personas jurídicas, siempre que ello esté previsto en sus Estatutos, podrán actuar en representación de otras ante las Administraciones Públicas.</p><p>3. Para formular solicitudes, presentar declaraciones responsables o comunicaciones, interponer recursos, desistir de acciones y renunciar a derechos en nombre de otra persona, deberá acreditarse la representación. Para los actos y gestiones de mero trámite se presumirá aquella representación.</p><p>4. La representación podrá acreditarse mediante cualquier medio válido en Derecho que deje constancia fidedigna de su existencia. A estos efectos, se entenderá acreditada la representación realizada mediante apoderamiento apud acta efectuado por comparecencia personal o comparecencia electrónica en la correspondiente sede electrónica, o a través de la acreditación de su inscripción en el registro electrónico de apoderamientos de la Administración Pública competente.</p><p>5. El órgano competente para la tramitación del procedimiento deberá incorporar al expediente administrativo acreditación de la condición de representante y de los poderes que tiene reconocidos en dicho momento. El documento electrónico que acredite el resultado de la consulta al registro electrónico de apoderamientos correspondiente tendrá la condición de acreditación a estos efectos.</p><p>6. La falta o insuficiente acreditación de la representación no impedirá que se tenga por realizado el acto de que se trate, siempre que se aporte aquélla o se subsane el defecto dentro del plazo de diez días que deberá conceder al efecto el órgano administrativo, o de un plazo superior cuando las circunstancias del caso así lo requieran.</p><p>7. Las Administraciones Públicas podrán habilitar con carácter general o específico a personas físicas o jurídicas autorizadas para la realización de determinadas transacciones electrónicas en representación de los interesados. Dicha habilitación deberá especificar las condiciones y obligaciones a las que se comprometen los que así adquieran la condición de representantes, y determinará la presunción de validez de la representación salvo que la normativa de aplicación prevea otra cosa. Las Administraciones Públicas podrán requerir, en cualquier momento, la acreditación de dicha representación. No obstante, siempre podrá comparecer el interesado por sí mismo en el procedimiento.</p></div></div></details><details class=\"panel\"><summary>Disección</summary><div class=\"body\"><ul>\n<li><b>Regla (5.1):</b> los interesados con capacidad de obrar <b>podrán actuar por medio de representante</b>, entendiéndose con él las actuaciones, <b>salvo manifestación expresa en contra</b> del interesado.</li>\n<li><b>Quién puede representar (5.2):</b> personas físicas con capacidad de obrar y <b>personas jurídicas, siempre que esté previsto en sus Estatutos</b>.</li>\n<li><b>Cuándo hay que acreditarla (5.3):</b> para <b>formular solicitudes, presentar declaraciones responsables o comunicaciones, interponer recursos, desistir de acciones y renunciar a derechos</b>. Para los <b>actos y gestiones de mero trámite se presume</b>.</li>\n<li><b>Cómo (5.4):</b> cualquier medio válido en Derecho que deje <b>constancia fidedigna</b>. Se entiende acreditada por <b>apoderamiento apud acta</b> —comparecencia personal o electrónica en la sede— o por <b>inscripción en el registro electrónico de apoderamientos</b>.</li>\n<li><b>Al expediente (5.5):</b> el órgano debe <b>incorporar</b> la acreditación de la condición de representante y de los poderes reconocidos. El documento electrónico de la consulta al registro vale como acreditación.</li>\n<li><b>Si falta (5.6):</b> no impide tener por realizado el acto si se aporta o subsana <b>en el plazo de diez días</b> que debe conceder el órgano, o en un plazo superior si las circunstancias lo exigen.</li>\n</ul></div></details><details class=\"panel\"><summary>En lenguaje llano</summary><div class=\"body\"><p>Para los papeleos pequeños se te cree que representas a alguien. Para los cinco actos que comprometen de verdad, hay que demostrarlo. Y si no lo demuestras de entrada, tienes diez días.</p></div></details><details class=\"panel\"><summary>¿Por qué existe?</summary><div class=\"body\"><div class=\"interp\"><span class=\"lbl\">Interpretación · aportación externa</span>La presunción para el mero trámite agiliza; la exigencia para los cinco actos protege al representado de que alguien decida por él sin poder. Y la subsanación impide que un defecto formal tumbe un acto hecho en plazo.</div></div></details><details class=\"panel\"><summary>Ejemplos</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Ejemplo 1</span>Un gestor consulta el estado de un expediente de su cliente: mero trámite, se presume la representación.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 2</span>Ese mismo gestor interpone un recurso: hay que acreditarla.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 3</span>Caso límite: se interpone el recurso el último día sin acreditar la representación. El acto se tiene por realizado en esa fecha si se subsana en los diez días. No se pierde el plazo.</div></div></details><details class=\"panel\"><summary>Trampas</summary><div class=\"body\"><div class=\"box warn\"><span class=\"lbl\">Cuidado</span>Los cinco actos del art. 5.3 son <b>los mismos cinco</b> que exigen firma en el art. 11.2. No es casualidad: son los que comprometen la posición jurídica del interesado.</div></div></details><details class=\"panel\"><summary>Conexiones</summary><div class=\"body\"><p>Con el art. 6 —registros de apoderamientos—, con el art. 11.2 —firma— y con el art. 68.1 —subsanación de solicitudes, también diez días—.</p></div></details><details class=\"panel\"><summary>Anclaje memorístico</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Para retenerlo</span>Mero trámite → <b>se presume</b>. Los cinco actos → <b>se acredita</b>. Si falta → <b>diez días</b>.</div></div></details></section><section class=\"card art\" id=\"lpac6\"><h2><span class=\"num\">LPAC 6</span> Registros electrónicos de apoderamientos</h2><p class=\"ubic\">Ley 39/2015 ▸ Título I ▸ Capítulo I</p><div class=\"idea\">Tres tipos de poder, apud acta, y cinco años de validez máxima.</div><svg viewBox=\"0 0 960 268\" width=\"100%\" role=\"img\" aria-label=\"Las tres tipologías de poder inscribibles, la forma apud acta y el plazo de validez de cinco años\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"t5cfrr2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#4b5563\"/></marker><marker id=\"t5cfer2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#15803d\"/></marker><marker id=\"t5cfwr2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#b45309\"/></marker></defs><text x=\"480\" y=\"24\" font-size=\"13\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"bold\">Los poderes que se inscriben en el registro · art. 6.4 LPAC</text><rect x=\"20\" y=\"44\" width=\"300\" height=\"72\" rx=\"8\" fill=\"#e8efff\" stroke=\"#1d4ed8\" stroke-width=\"1.4\"/><text x=\"170\" y=\"68.025\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#1d4ed8\" font-weight=\"bold\">a) PODER GENERAL</text><text x=\"170\" y=\"84.025\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Cualquier actuación</text><text x=\"170\" y=\"100.025\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">ante CUALQUIER Administración</text><rect x=\"330\" y=\"44\" width=\"300\" height=\"72\" rx=\"8\" fill=\"#eaf6ee\" stroke=\"#15803d\" stroke-width=\"1.4\"/><text x=\"480\" y=\"68.025\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#15803d\" font-weight=\"bold\">b) PODER ANTE UNA</text><text x=\"480\" y=\"84.025\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Cualquier actuación ante UNA</text><text x=\"480\" y=\"100.025\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Administración u Organismo</text><rect x=\"640\" y=\"44\" width=\"300\" height=\"72\" rx=\"8\" fill=\"#fdf3e3\" stroke=\"#b45309\" stroke-width=\"1.4\"/><text x=\"790\" y=\"68.025\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"bold\">c) PODER PARA TRÁMITES</text><text x=\"790\" y=\"84.025\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Solo los trámites</text><text x=\"790\" y=\"100.025\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">ESPECIFICADOS en el poder</text><rect x=\"20\" y=\"130\" width=\"920\" height=\"40\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"480\" y=\"153.85\" font-size=\"11\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">APUD ACTA · art. 6.5: comparecencia ELECTRÓNICA en la sede o PERSONAL en las oficinas de asistencia en materia de registros</text><rect x=\"20\" y=\"180\" width=\"450\" height=\"44\" rx=\"8\" fill=\"#fdeceb\" stroke=\"#b91c1c\" stroke-width=\"1.4\"/><text x=\"245\" y=\"198.025\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#b91c1c\" font-weight=\"bold\">VALIDEZ MÁXIMA: 5 AÑOS</text><text x=\"245\" y=\"214.025\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">desde la fecha de inscripción</text><rect x=\"490\" y=\"180\" width=\"450\" height=\"44\" rx=\"8\" fill=\"#fdeceb\" stroke=\"#b91c1c\" stroke-width=\"1.4\"/><text x=\"715\" y=\"198.025\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#b91c1c\" font-weight=\"bold\">PRÓRROGA: otros 5 AÑOS máximo</text><text x=\"715\" y=\"214.025\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">y revocable en cualquier momento</text><text x=\"480\" y=\"250\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#4b5563\" font-weight=\"normal\">Las solicitudes de inscripción, revocación, prórroga o denuncia pueden dirigirse a cualquier registro (art. 6.7).</text></svg><details class=\"panel\" open><summary>Texto legal</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LPAC</span><p><b>Artículo 6. Registros electrónicos de apoderamientos.</b></p><p>1. La Administración General del Estado, las Comunidades Autónomas y las Entidades Locales dispondrán de un registro electrónico general de apoderamientos, en el que deberán inscribirse, al menos, los de carácter general otorgados apud acta, presencial o electrónicamente, por quien ostente la condición de interesado en un procedimiento administrativo a favor de representante, para actuar en su nombre ante las Administraciones Públicas. También deberá constar el bastanteo realizado del poder. En el ámbito estatal, este registro será el Registro Electrónico de Apoderamientos de la Administración General del Estado. Los registros generales de apoderamientos no impedirán la existencia de registros particulares en cada Organismo donde se inscriban los poderes otorgados para la realización de trámites específicos en el mismo. Cada Organismo podrá disponer de su propio registro electrónico de apoderamientos.</p><p>2. Los registros electrónicos generales y particulares de apoderamientos pertenecientes a todas y cada una de las Administraciones, deberán ser plenamente interoperables entre sí, de modo que se garantice su interconexión, compatibilidad informática, así como la transmisión telemática de las solicitudes, escritos y comunicaciones que se incorporen a los mismos. Los registros electrónicos generales y particulares de apoderamientos permitirán comprobar válidamente la representación de quienes actúen ante las Administraciones Públicas en nombre de un tercero, mediante la consulta a otros registros administrativos similares, al registro mercantil, de la propiedad, y a los protocolos notariales. Los registros mercantiles, de la propiedad, y de los protocolos notariales serán interoperables con los registros electrónicos generales y particulares de apoderamientos.</p><p>3. Los asientos que se realicen en los registros electrónicos generales y particulares de apoderamientos deberán contener, al menos, la siguiente información:</p><p>a) Nombre y apellidos o la denominación o razón social, documento nacional de identidad, número de identificación fiscal o documento equivalente del poderdante.</p><p>b) Nombre y apellidos o la denominación o razón social, documento nacional de identidad, número de identificación fiscal o documento equivalente del apoderado.</p><p>c) Fecha de inscripción.</p><p>d) Período de tiempo por el cual se otorga el poder.</p><p>e) Tipo de poder según las facultades que otorgue.</p><p>4. Los poderes que se inscriban en los registros electrónicos generales y particulares de apoderamientos deberán corresponder a alguna de las siguientes tipologías:</p><p>a) Un poder general para que el apoderado pueda actuar en nombre del poderdante en cualquier actuación administrativa y ante cualquier Administración.</p><p>b) Un poder para que el apoderado pueda actuar en nombre del poderdante en cualquier actuación administrativa ante una Administración u Organismo concreto.</p><p>c) Un poder para que el apoderado pueda actuar en nombre del poderdante únicamente para la realización de determinados trámites especificados en el poder. (Párrafo anulado) Cada Comunidad Autónoma aprobará los modelos de poderes inscribibles en el registro cuando se circunscriba a actuaciones ante su respectiva Administración.</p><p>5. El apoderamiento «apud acta» se otorgará mediante comparecencia electrónica en la correspondiente sede electrónica haciendo uso de los sistemas de firma electrónica previstos en esta Ley, o bien mediante comparecencia personal en las oficinas de asistencia en materia de registros.</p><p>6. Los poderes inscritos en el registro tendrán una validez determinada máxima de cinco años a contar desde la fecha de inscripción. En todo caso, en cualquier momento antes de la finalización de dicho plazo el poderdante podrá revocar o prorrogar el poder. Las prórrogas otorgadas por el poderdante al registro tendrán una validez determinada máxima de cinco años a contar desde la fecha de inscripción.</p><p>7. Las solicitudes de inscripción del poder, de revocación, de prórroga o de denuncia del mismo podrán dirigirse a cualquier registro, debiendo quedar inscrita esta circunstancia en el registro de la Administración u Organismo ante la que tenga efectos el poder y surtiendo efectos desde la fecha en la que se produzca dicha inscripción.</p></div></div></details><details class=\"panel\"><summary>Disección</summary><div class=\"body\"><ul>\n<li><b>Quién lo tiene (6.1):</b> el Estado, las comunidades autónomas y <b>las entidades locales</b> dispondrán de un <b>registro electrónico general de apoderamientos</b>, donde se inscriben <b>al menos los de carácter general otorgados apud acta</b>. También constará el <b>bastanteo</b> del poder. Cada organismo <b>podrá</b> tener además su registro particular.</li>\n<li><b>Interoperabilidad (6.2):</b> todos los registros, generales y particulares, deben ser <b>plenamente interoperables</b>, y permitir comprobar la representación consultando otros registros administrativos, el <b>mercantil</b>, el <b>de la propiedad</b> y los <b>protocolos notariales</b>.</li>\n<li><b>Las tres tipologías (6.4):</b> <b>a)</b> poder <b>general</b> para cualquier actuación y ante <b>cualquier</b> Administración; <b>b)</b> poder para cualquier actuación ante <b>una</b> Administración u organismo concreto; <b>c)</b> poder solo para <b>determinados trámites</b> especificados.</li>\n<li><b>Apud acta (6.5):</b> <b>comparecencia electrónica</b> en la sede con los sistemas de firma de la Ley, <b>o comparecencia personal</b> en las oficinas de asistencia en materia de registros.</li>\n<li><b>Vigencia (6.6):</b> <b>cinco años máximo</b> desde la inscripción. El poderdante puede <b>revocar o prorrogar</b> en cualquier momento antes del vencimiento, y la <b>prórroga tiene también un máximo de cinco años</b>.</li>\n<li><b>Dónde se pide (6.7):</b> inscripción, revocación, prórroga o denuncia pueden dirigirse a <b>cualquier registro</b>, surtiendo efectos desde la inscripción en el de la Administración ante la que el poder vaya a tener efectos.</li>\n</ul></div></details><details class=\"panel\"><summary>En lenguaje llano</summary><div class=\"body\"><p>Apoderar a alguien ante la Administración se puede hacer sin notario: compareces en la sede con tu firma electrónica, o en persona en una oficina de registro. El poder dura como mucho cinco años, y se puede prorrogar otros cinco.</p></div></details><details class=\"panel\"><summary>¿Por qué existe?</summary><div class=\"body\"><div class=\"interp\"><span class=\"lbl\">Interpretación · aportación externa</span>El registro electrónico de apoderamientos sustituye al peregrinaje notarial para los trámites administrativos ordinarios. La caducidad a los cinco años evita que queden poderes vivos de por vida que nadie recuerda haber otorgado.</div></div></details><details class=\"panel\"><summary>Ejemplos</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Ejemplo 1</span>Una persona otorga en la sede del ayuntamiento un poder tipo c) a su gestoría solo para los trámites del IBI.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 2</span>Una empresa inscribe un poder tipo a) para que su asesoría actúe ante cualquier Administración.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 3</span>Caso límite: el poder cumple cinco años sin prórroga. Queda sin efecto automáticamente, aunque nadie lo revoque.</div></div></details><details class=\"panel\"><summary>Trampas</summary><div class=\"body\"><div class=\"box warn\"><span class=\"lbl\">Cuidado</span>Dos cifras que se cruzan: <b>cinco años el poder y cinco años la prórroga</b>, y ambas se cuentan <b>desde la fecha de inscripción</b>. Y el registro es obligatorio también para <b>las entidades locales</b>; los particulares de cada organismo son potestativos.</div></div></details><details class=\"panel\"><summary>Conexiones</summary><div class=\"body\"><p>Con el art. 5.4 —formas de acreditar— y con los arts. 32 a 34 del RD 203/2021.</p></div></details><details class=\"panel\"><summary>Anclaje memorístico</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Para retenerlo</span><b>Tres tipos de poder</b> (cualquiera / una / trámites concretos) y <b>cinco más cinco</b> años.</div></div></details></section><section class=\"card art\" id=\"rd203_32\"><h2><span class=\"num\">RD 203/2021 32</span> Acreditación en la actuación por medio de representante</h2><p class=\"ubic\">RD 203/2021 ▸ Capítulo III ▸ Sección 4.ª</p><div class=\"idea\">Las vías para acreditar y la obligación electrónica del representante de un obligado.</div><svg viewBox=\"0 0 960 266\" width=\"100%\" role=\"img\" aria-label=\"Vías para acreditar la representación y plazo de diez días para subsanar su falta\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"t5efrr3\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#4b5563\"/></marker><marker id=\"t5efer3\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#15803d\"/></marker><marker id=\"t5efwr3\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#b45309\"/></marker></defs><text x=\"480\" y=\"24\" font-size=\"13\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"bold\">Acreditar la representación</text><rect x=\"20\" y=\"42\" width=\"920\" height=\"38\" rx=\"8\" fill=\"#e8efff\" stroke=\"#1d4ed8\" stroke-width=\"1.4\"/><text x=\"480\" y=\"64.78\" font-size=\"10.8\" text-anchor=\"middle\" fill=\"#1d4ed8\" font-weight=\"bold\">CUÁNDO HAY QUE ACREDITARLA · art. 5.3: solicitar, declarar, recurrir, desistir y renunciar. En los actos de mero trámite SE PRESUME</text><rect x=\"20\" y=\"92\" width=\"215\" height=\"54\" rx=\"8\" fill=\"#eaf6ee\" stroke=\"#15803d\" stroke-width=\"1.4\"/><text x=\"127.5\" y=\"115.35\" font-size=\"11\" text-anchor=\"middle\" fill=\"#15803d\" font-weight=\"bold\">APUD ACTA</text><text x=\"127.5\" y=\"130.35\" font-size=\"11\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">personal o electrónico</text><rect x=\"255\" y=\"92\" width=\"215\" height=\"54\" rx=\"8\" fill=\"#eaf6ee\" stroke=\"#15803d\" stroke-width=\"1.4\"/><text x=\"362.5\" y=\"115.35\" font-size=\"11\" text-anchor=\"middle\" fill=\"#15803d\" font-weight=\"bold\">INSCRIPCIÓN en el registro</text><text x=\"362.5\" y=\"130.35\" font-size=\"11\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">de apoderamientos</text><rect x=\"490\" y=\"92\" width=\"215\" height=\"54\" rx=\"8\" fill=\"#eaf6ee\" stroke=\"#15803d\" stroke-width=\"1.4\"/><text x=\"597.5\" y=\"115.35\" font-size=\"11\" text-anchor=\"middle\" fill=\"#15803d\" font-weight=\"bold\">CERTIFICADO CUALIFICADO</text><text x=\"597.5\" y=\"130.35\" font-size=\"11\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">de representante</text><rect x=\"725\" y=\"92\" width=\"215\" height=\"54\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"832.5\" y=\"115.35\" font-size=\"11\" text-anchor=\"middle\" fill=\"#4b5563\" font-weight=\"bold\">CUALQUIER MEDIO</text><text x=\"832.5\" y=\"130.35\" font-size=\"11\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">válido en Derecho</text><rect x=\"20\" y=\"160\" width=\"920\" height=\"40\" rx=\"8\" fill=\"#fdf3e3\" stroke=\"#b45309\" stroke-width=\"1.4\"/><text x=\"480\" y=\"183.78\" font-size=\"10.8\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"bold\">SI FALTA O ES INSUFICIENTE · art. 5.6: no impide tener por realizado el acto si se subsana en el plazo de DIEZ DÍAS que debe conceder el órgano</text><text x=\"480\" y=\"224\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#4b5563\" font-weight=\"normal\">El órgano que tramita debe INCORPORAR AL EXPEDIENTE la acreditación de la condición de representante y de los poderes reconocidos (art. 5.5).</text><text x=\"480\" y=\"250\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#4b5563\" font-weight=\"normal\">El documento electrónico que acredite el resultado de la consulta al registro vale como acreditación.</text></svg><details class=\"panel\" open><summary>Texto legal</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · RD 203/2021</span><p><b>Artículo 32. Acreditación en la actuación por medio de representante.</b></p><p>1. De acuerdo con lo previsto en el artículo 5 de la Ley 39/2015, de 1 de octubre, las personas interesadas con capacidad de obrar podrán actuar ante las Administraciones Públicas por medio de representante, bien sea una persona física con capacidad de obrar bien sea una persona jurídica cuando así esté previsto en sus Estatutos.</p><p>2. Los representantes de las personas interesadas obligadas a relacionarse electrónicamente con las Administraciones Públicas están obligados a relacionarse electrónicamente en el ejercicio de dicha representación, de acuerdo con el artículo 14.2 de la Ley 39/2015, de 1 de octubre.</p><p>3. La representación puede acreditarse mediante cualquier medio válido en Derecho que deje constancia fidedigna de su existencia, entre otros:</p><p>a) Mediante apoderamiento apud acta efectuado por comparecencia personal en las oficinas de asistencia en materia de registros o comparecencia electrónica en la correspondiente sede electrónica o sede electrónica asociada.</p><p>b) Mediante acreditación de su inscripción en el registro electrónico de apoderamientos de la Administración Pública competente o en sus registros particulares de apoderamientos.</p><p>c) Mediante un certificado electrónico cualificado de representante.</p><p>d) Mediante documento público cuya matriz conste en un archivo notarial o de una inscripción practicada en un registro mercantil.</p><p>4. En el caso de actuaciones en nombre de persona jurídica, la capacidad de representación podrá acreditarse también mediante certificado electrónico cualificado de representante, entendiéndose en tal caso que el poder de representación abarca cualquier actuación ante cualquier Administración Pública.</p><p>5. Asimismo, de acuerdo con lo previsto en el artículo 5.7 de la Ley 39/2015, de 1 de octubre, las Administraciones Públicas podrán habilitar con carácter general o específico a personas físicas o jurídicas autorizadas para la realización de determinadas transacciones por medios electrónicos en representación de las personas interesadas. En la sede electrónica o sede electrónica asociada de cada una de las Administraciones Públicas se publicarán los trámites electrónicos que podrán realizarse con esta representación.</p></div></div></details><details class=\"panel\"><summary>Disección</summary><div class=\"body\"><ul>\n<li><b>Quién puede representar (32.1):</b> persona física con capacidad de obrar, o persona jurídica <b>cuando así esté previsto en sus Estatutos</b>.</li>\n<li><b>La regla que importa (32.2):</b> los representantes de personas interesadas <b>obligadas</b> a relacionarse electrónicamente <b>están obligados a relacionarse electrónicamente en el ejercicio de dicha representación</b>, conforme al art. 14.2 LPAC.</li>\n<li><b>Vías de acreditación (32.3):</b> cualquier medio válido en Derecho con constancia fidedigna, <b>entre otros</b>: <b>a)</b> apoderamiento <b>apud acta</b>, personal en las oficinas de asistencia o electrónico en la sede o sede asociada; <b>b)</b> acreditación de la <b>inscripción en el registro</b> electrónico de apoderamientos.</li>\n</ul></div></details><details class=\"panel\"><summary>En lenguaje llano</summary><div class=\"body\"><p>Si representas a quien está obligado a lo electrónico, tú también lo estás, aunque como particular pudieras elegir.</p></div></details><details class=\"panel\"><summary>¿Por qué existe?</summary><div class=\"body\"><div class=\"interp\"><span class=\"lbl\">Interpretación · aportación externa</span>La obligación sigue al asunto, no a la persona. De otro modo bastaría con nombrar representante a un particular para esquivar la obligación de la empresa.</div></div></details><details class=\"panel\"><summary>Ejemplos</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Ejemplo 1</span>Un particular representa a una sociedad: debe actuar electrónicamente.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 2</span>Ese mismo particular presenta su propia solicitud en papel: puede, porque ahí no actúa como representante.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 3</span>Caso límite: la lista de vías del 32.3 va precedida de «entre otros». No es cerrada: cabe cualquier medio que deje constancia fidedigna.</div></div></details><details class=\"panel\"><summary>Trampas</summary><div class=\"body\"><div class=\"box warn\"><span class=\"lbl\">Cuidado</span>Esta regla es la que explica la letra d) del art. 14.2 LPAC. Se pregunta como caso práctico, no como definición.</div></div></details><details class=\"panel\"><summary>Conexiones</summary><div class=\"body\"><p>Desarrolla los arts. 5 y 14.2.d) LPAC. Se completa con los arts. 33 y 34 del Reglamento.</p></div></details><details class=\"panel\"><summary>Anclaje memorístico</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Para retenerlo</span><b>El representante hereda la obligación del representado.</b></div></div></details></section><section class=\"card art\" id=\"rd203_33\"><h2><span class=\"num\">RD 203/2021 33</span> Registro Electrónico de Apoderamientos de la AGE</h2><p class=\"ubic\">RD 203/2021 ▸ Capítulo III ▸ Sección 4.ª</p><div class=\"idea\">Qué poderes se inscriben obligatoriamente y cuáles pueden inscribirse.</div><svg viewBox=\"0 0 960 268\" width=\"100%\" role=\"img\" aria-label=\"Las tres tipologías de poder inscribibles, la forma apud acta y el plazo de validez de cinco años\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"t5cfrr3\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#4b5563\"/></marker><marker id=\"t5cfer3\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#15803d\"/></marker><marker id=\"t5cfwr3\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#b45309\"/></marker></defs><text x=\"480\" y=\"24\" font-size=\"13\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"bold\">Los poderes que se inscriben en el registro · art. 6.4 LPAC</text><rect x=\"20\" y=\"44\" width=\"300\" height=\"72\" rx=\"8\" fill=\"#e8efff\" stroke=\"#1d4ed8\" stroke-width=\"1.4\"/><text x=\"170\" y=\"68.025\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#1d4ed8\" font-weight=\"bold\">a) PODER GENERAL</text><text x=\"170\" y=\"84.025\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Cualquier actuación</text><text x=\"170\" y=\"100.025\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">ante CUALQUIER Administración</text><rect x=\"330\" y=\"44\" width=\"300\" height=\"72\" rx=\"8\" fill=\"#eaf6ee\" stroke=\"#15803d\" stroke-width=\"1.4\"/><text x=\"480\" y=\"68.025\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#15803d\" font-weight=\"bold\">b) PODER ANTE UNA</text><text x=\"480\" y=\"84.025\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Cualquier actuación ante UNA</text><text x=\"480\" y=\"100.025\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Administración u Organismo</text><rect x=\"640\" y=\"44\" width=\"300\" height=\"72\" rx=\"8\" fill=\"#fdf3e3\" stroke=\"#b45309\" stroke-width=\"1.4\"/><text x=\"790\" y=\"68.025\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"bold\">c) PODER PARA TRÁMITES</text><text x=\"790\" y=\"84.025\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Solo los trámites</text><text x=\"790\" y=\"100.025\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">ESPECIFICADOS en el poder</text><rect x=\"20\" y=\"130\" width=\"920\" height=\"40\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"480\" y=\"153.85\" font-size=\"11\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">APUD ACTA · art. 6.5: comparecencia ELECTRÓNICA en la sede o PERSONAL en las oficinas de asistencia en materia de registros</text><rect x=\"20\" y=\"180\" width=\"450\" height=\"44\" rx=\"8\" fill=\"#fdeceb\" stroke=\"#b91c1c\" stroke-width=\"1.4\"/><text x=\"245\" y=\"198.025\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#b91c1c\" font-weight=\"bold\">VALIDEZ MÁXIMA: 5 AÑOS</text><text x=\"245\" y=\"214.025\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">desde la fecha de inscripción</text><rect x=\"490\" y=\"180\" width=\"450\" height=\"44\" rx=\"8\" fill=\"#fdeceb\" stroke=\"#b91c1c\" stroke-width=\"1.4\"/><text x=\"715\" y=\"198.025\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#b91c1c\" font-weight=\"bold\">PRÓRROGA: otros 5 AÑOS máximo</text><text x=\"715\" y=\"214.025\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">y revocable en cualquier momento</text><text x=\"480\" y=\"250\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#4b5563\" font-weight=\"normal\">Las solicitudes de inscripción, revocación, prórroga o denuncia pueden dirigirse a cualquier registro (art. 6.7).</text></svg><details class=\"panel\" open><summary>Texto legal</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · RD 203/2021</span><p><b>Artículo 33. Registro Electrónico de Apoderamientos de la Administración General del Estado.</b></p><p>1. A los efectos previstos en el artículo anterior y de acuerdo con el artículo 6 de la Ley 39/2015, de 1 de octubre, en el Registro Electrónico de Apoderamientos de la Administración General del Estado se inscribirán los apoderamientos de carácter general previstos en el artículo 6.4.a) de dicha ley otorgados «apud acta» a favor de representante, presencial o electrónicamente, por quien ostente la condición de interesado en un procedimiento administrativo para actuar en su nombre ante las Administraciones Públicas. Asimismo, podrán inscribirse los poderes previstos en el artículo 6.4.b) de la ley para actuar ante la Administración General del Estado o ante un organismo público o entidad de Derecho Público vinculado o dependiente de la misma que no cuente con un registro electrónico de apoderamientos particular. Por último, podrán inscribirse los poderes previstos en el artículo 6.4.c) de la ley otorgados para realizar determinados trámites y actuaciones especificados en el poder ante los órganos de la Administración General del Estado o ante un organismo público o entidad de derecho público vinculado o dependiente de dicha Administración que no cuente con el citado registro particular. Constará en el Registro el bastanteo del poder realizado por los servicios jurídicos correspondientes, sin perjuicio de la apreciación concreta de su suficiencia en la actuación, trámite o procedimiento en que se emplee.</p><p>2. El Registro Electrónico de Apoderamientos de la Administración General del Estado será gestionado por el Ministerio de Política Territorial y Función Pública con la colaboración del Ministerio de Asuntos Económicos y Transformación Digital, y será accesible desde la sede electrónica del PAGe de la Administración General del Estado así como desde las sedes y sedes electrónicas asociadas de la Administración General del Estado y de los organismos públicos o entidades de derecho público vinculados o dependientes.</p><p>3. Sin perjuicio de este registro general de apoderamientos, cada organismo público o entidad de derecho público vinculado o dependiente de la Administración General del Estado podrá disponer de un registro particular de apoderamientos en el que se inscriban los poderes otorgados por quien ostente la condición de interesado para realizar los trámites específicos de su competencia y cuya gestión corresponderá al propio organismo o entidad. En estos registros particulares no podrán inscribirse los poderes previstos en el artículo 6.4.a) de la Ley 39/2015, de 1 de octubre.</p><p>4. El Registro Electrónico de Apoderamientos y los registros particulares deberán ser interoperables y no tienen carácter público, por lo que el interesado sólo podrá acceder a la información de los apoderamientos de los que sea poderdante o apoderado.</p><p>5. Mediante orden conjunta de la persona titular del Ministerio de Política Territorial y Función Pública y de la persona titular del Ministerio de Asuntos Económicos y Transformación Digital se regularán los requisitos y condiciones de funcionamiento del Registro Electrónico de Apoderamientos de la Administración General del Estado.</p></div></div></details><details class=\"panel\"><summary>Disección</summary><div class=\"body\"><ul>\n<li><b>Se inscriben</b> los apoderamientos <b>de carácter general</b> del art. 6.4.a) LPAC otorgados <b>apud acta</b>, presencial o electrónicamente.</li>\n<li><b>Podrán inscribirse</b> los poderes del art. 6.4.b) para actuar ante la Administración General del Estado o ante un organismo que <b>no cuente con registro particular</b>.</li>\n<li><b>Podrán inscribirse</b> asimismo los del art. 6.4.c), para trámites determinados ante los órganos correspondientes.</li>\n</ul></div></details><details class=\"panel\"><summary>En lenguaje llano</summary><div class=\"body\"><p>El poder más amplio se inscribe siempre; los más estrechos, si no hay un registro particular que los acoja.</p></div></details><details class=\"panel\"><summary>¿Por qué existe?</summary><div class=\"body\"><div class=\"interp\"><span class=\"lbl\">Interpretación · aportación externa</span>Concentrar los poderes generales en un único registro permite que cualquier Administración los compruebe de una sola consulta, que es lo que hace operativa la interoperabilidad del art. 6.2 LPAC.</div></div></details><details class=\"panel\"><summary>Ejemplos</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Ejemplo 1</span>Un poder general tipo a): se inscribe en el registro general.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 2</span>Un poder tipo b) ante un organismo que ya tiene registro particular: va a ese registro particular.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 3</span>Caso límite: ese mismo organismo no tiene registro particular. Entonces el poder puede inscribirse en el registro general.</div></div></details><details class=\"panel\"><summary>Trampas</summary><div class=\"body\"><div class=\"box warn\"><span class=\"lbl\">Cuidado</span>Distingue el verbo: <b>«se inscribirán»</b> para los generales, <b>«podrán inscribirse»</b> para los demás. Es la diferencia entre obligatorio y potestativo.</div></div></details><details class=\"panel\"><summary>Conexiones</summary><div class=\"body\"><p>Desarrolla el art. 6 LPAC, cuyo apartado 1 obliga también a las entidades locales a tener el suyo.</p></div></details><details class=\"panel\"><summary>Anclaje memorístico</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Para retenerlo</span>General → <b>se inscribe</b>. Los otros dos → <b>pueden</b> inscribirse.</div></div></details></section><section class=\"card art\" id=\"rd203_34\"><h2><span class=\"num\">RD 203/2021 34</span> Acreditación mediante certificado cualificado de representante</h2><p class=\"ubic\">RD 203/2021 ▸ Capítulo III ▸ Sección 4.ª</p><div class=\"idea\">El certificado de representante de persona jurídica acredita si lleva poder general.</div><details class=\"panel\" open><summary>Texto legal</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · RD 203/2021</span><p><b>Artículo 34. Acreditación de la representación mediante certificado electrónico cualificado de representante.</b></p><p>1. La representación podrá acreditarse ante la Administración con un certificado electrónico cualificado de representante de persona jurídica que sea acorde a lo previsto en el artículo 28 y el Anexo I del al Reglamento (UE) 910/2014 del Parlamento Europeo y del Consejo, de 23 de julio de 2014, relativo a la identificación electrónica y los servicios de confianza para las transacciones, electrónicas en el mercado interior y por la que se deroga la Directiva 1999/93/CE (en adelante, Reglamento eIDAS) y a la Política marco de Firma Electrónica y de certificados a que hace referencia el Esquema Nacional de Interoperabilidad y, además, haya sido expedido a quien tenga un poder general para llevar a cabo cualquier actuación administrativa y ante cualquier Administración.</p><p>2. La aceptación de certificados electrónicos cualificados de representante de persona jurídica de alcance no general estará sujeta al Reglamento eIDAS, a la Política Marco de Firma Electrónica y de Certificados a que hace referencia el Esquema Nacional de Interoperabilidad y además, a los requisitos que disponga cada Administración.</p></div></div></details><details class=\"panel\"><summary>Disección</summary><div class=\"body\"><ul>\n<li><b>Regla (34.1):</b> la representación <b>podrá acreditarse</b> con un <b>certificado electrónico cualificado de representante de persona jurídica</b> conforme al Reglamento eIDAS y a la Política marco de Firma Electrónica del Esquema Nacional de Interoperabilidad, <b>y además</b> expedido a quien tenga <b>un poder general</b> para cualquier actuación ante cualquier Administración.</li>\n<li><b>Alcance no general (34.2):</b> la aceptación de certificados de representante <b>de alcance no general</b> queda sujeta al Reglamento eIDAS y a la Política marco.</li>\n</ul></div></details><details class=\"panel\"><summary>En lenguaje llano</summary><div class=\"body\"><p>El certificado de representante de una empresa sirve para acreditar que puedes actuar por ella, pero solo si el poder que hay detrás es general.</p></div></details><details class=\"panel\"><summary>¿Por qué existe?</summary><div class=\"body\"><div class=\"interp\"><span class=\"lbl\">Interpretación · aportación externa</span>Un certificado no dice por sí solo hasta dónde llega el poder. Exigir que respalde un poder general evita que alguien apoderado para una cosa concreta acabe actuando para todo.</div></div></details><details class=\"panel\"><summary>Ejemplos</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Ejemplo 1</span>El administrador de una sociedad con poder general firma con el certificado de representante: acredita.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 2</span>Un apoderado solo para contratación usa ese certificado para un trámite tributario: el alcance no lo cubre.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 3</span>Caso límite: certificado de alcance no general. No queda excluido, pero su aceptación se somete al eIDAS y a la Política marco.</div></div></details><details class=\"panel\"><summary>Trampas</summary><div class=\"body\"><div class=\"box warn\"><span class=\"lbl\">Cuidado</span>La clave es «<b>y, además</b>»: no basta con que el certificado sea cualificado; hace falta que detrás haya un <b>poder general</b>.</div></div></details><details class=\"panel\"><summary>Conexiones</summary><div class=\"body\"><p>Con el art. 5.4 LPAC y con las tipologías del art. 6.4.a).</p></div></details><details class=\"panel\"><summary>Anclaje memorístico</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Para retenerlo</span>Certificado de representante = acredita <b>si el poder es general</b>.</div></div></details></section><section class=\"card art\" id=\"rd203_8\"><h2><span class=\"num\">RD 203/2021 8</span> Carpeta Ciudadana del sector público estatal</h2><p class=\"ubic\">RD 203/2021 ▸ Capítulo II ▸ Sección 2.ª</p><div class=\"idea\">El área personalizada del PAGe: quién entra y qué puede hacer allí.</div><details class=\"panel\" open><summary>Texto legal</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · RD 203/2021</span><p><b>Artículo 8. Carpeta Ciudadana del sector público estatal.</b></p><p>1. La Carpeta Ciudadana es el área personalizada de las personas interesadas a que se refiere el artículo 7.3 en su relación con el sector público estatal. Además del interesado podrán acceder a la Carpeta Ciudadana:</p><p>a) Sus representantes legales.</p><p>b) Quien ostente un poder general previsto en el artículo 6.4.a) de la Ley 39/2015, de 1 de octubre, otorgado por el interesado e inscrito en el Registro Electrónico de Apoderamientos.</p><p>2. La Carpeta Ciudadana será accesible a través de la sede electrónica del PAGe de la Administración General del Estado y podrá ofrecer, entre otras, las funcionalidades siguientes para el interesado o sus representantes:</p><p>a) Permitir el seguimiento del estado de tramitación de los procedimientos en que sea interesado, de acuerdo con lo previsto en el artículo 53.1.a) de la Ley 39/ 2015, de 1 de octubre.</p><p>b) Permitir el acceso a sus comunicaciones y notificaciones.</p><p>c) Conocer qué datos suyos obran en poder del sector público estatal, sin perjuicio de las limitaciones que establezca la normativa vigente.</p><p>d) Facilitar la obtención de certificaciones administrativas exigidas por la normativa correspondiente.</p><p>3. El interesado accederá a la Carpeta Ciudadana mediante los sistemas de identificación a los que se refiere el artículo 9.2 de la Ley 39/2015, de 1 de octubre.</p><p>4. El interesado deberá asegurar el buen uso de los sistemas de identificación y velar por que el acceso a su carpeta Ciudadana solo se haga por sí mismo o por tercero autorizado.</p></div></div></details><details class=\"panel\"><summary>Disección</summary><div class=\"body\"><ul>\n<li><b>Qué es (8.1):</b> el <b>área personalizada</b> de las personas interesadas del art. 7.3 en su relación con el sector público estatal.</li>\n<li><b>Quién accede además del interesado:</b> <b>a)</b> sus <b>representantes legales</b>; <b>b)</b> quien ostente un <b>poder general</b> del art. 6.4.a) LPAC otorgado por el interesado <b>e inscrito</b> en el Registro Electrónico de Apoderamientos.</li>\n<li><b>Funcionalidades (8.2):</b> <b>a)</b> seguimiento del estado de tramitación conforme al art. 53.1.a) LPAC; <b>b)</b> acceso a comunicaciones y notificaciones; <b>c)</b> conocer <b>qué datos suyos obran</b> en poder del sector público estatal; <b>d)</b> facilitar la obtención de certificaciones administrativas.</li>\n</ul></div></details><details class=\"panel\"><summary>En lenguaje llano</summary><div class=\"body\"><p>Es tu zona privada: lo que tienes en marcha, lo que te han notificado y qué datos tuyos tiene la Administración.</p></div></details><details class=\"panel\"><summary>¿Por qué existe?</summary><div class=\"body\"><div class=\"interp\"><span class=\"lbl\">Interpretación · aportación externa</span>Materializa el derecho del art. 53.1.a) a conocer el estado de la tramitación. Sin un sitio concreto donde consultarlo, ese derecho obligaría a preguntar expediente por expediente.</div></div></details><details class=\"panel\"><summary>Ejemplos</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Ejemplo 1</span>Entras a ver si te han notificado la resolución de una convocatoria.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 2</span>Tu asesoría, con poder general inscrito, entra por ti: letra b) del 8.1.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 3</span>Caso límite: alguien con un poder tipo c), solo para ciertos trámites. No accede a la Carpeta: el art. 8.1.b) exige poder <b>general</b> e <b>inscrito</b>.</div></div></details><details class=\"panel\"><summary>Trampas</summary><div class=\"body\"><div class=\"box warn\"><span class=\"lbl\">Cuidado</span>Dos requisitos acumulativos para el apoderado: poder <b>general</b> <b>e inscrito</b> en el registro. Y el ámbito de esta Carpeta es el <b>sector público estatal</b>.</div></div></details><details class=\"panel\"><summary>Conexiones</summary><div class=\"body\"><p>Con el art. 7.3 —área personalizada del PAGe—, con el art. 53.1.a) LPAC y con el art. 6.4.a).</p></div></details><details class=\"panel\"><summary>Anclaje memorístico</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Para retenerlo</span>A la Carpeta entran: <b>tú, tu representante legal y tu apoderado general inscrito</b>.</div></div></details></section><section class=\"card\" id=\"cifras\"><h2>Cifras y listas cerradas</h2>\n<p class=\"small\">Pulsa en una columna para ordenar.</p>\n<table id=\"tcif\"><thead><tr><th class=\"sortable\">Dato</th><th class=\"sortable\">Qué es</th><th class=\"sortable\">Precepto</th></tr></thead><tbody>\n<tr><td>5 sujetos</td><td>Obligados a relacionarse electrónicamente en todo caso</td><td>Art. 14.2 LPAC</td></tr>\n<tr><td>5 días hábiles</td><td>Efectos de la comunicación de cambio de canal, en ambos sentidos</td><td>Art. 3.2 RD 203/2021</td></tr>\n<tr><td>5 actos</td><td>Exigen acreditar la representación; en el <span class=\"t\" data-g=\"merotramite\">mero trámite</span> se presume</td><td>Art. 5.3 LPAC</td></tr>\n<tr><td><span class=\"t\" data-g=\"bastanteo\">Bastanteo</span></td><td>Debe constar en el registro de apoderamientos</td><td>Art. 6.1 LPAC</td></tr>\n<tr><td>Reglamento <span class=\"t\" data-g=\"eidas\">eIDAS</span></td><td>Marco de los certificados de representante de persona jurídica</td><td>Art. 34 RD 203/2021</td></tr>\n<tr><td>10 días</td><td>Subsanación de la falta o insuficiencia de la representación</td><td>Art. 5.6 LPAC</td></tr>\n<tr><td>3 tipologías</td><td>Poderes inscribibles: general, ante una Administración, para trámites concretos</td><td>Art. 6.4 LPAC</td></tr>\n<tr><td>5 años</td><td>Validez máxima del poder inscrito, desde la fecha de inscripción</td><td>Art. 6.6 LPAC</td></tr>\n<tr><td>5 años</td><td>Validez máxima de la prórroga del poder</td><td>Art. 6.6 LPAC</td></tr>\n<tr><td>9 derechos</td><td>De quien tiene <span class=\"t\" data-g=\"capacidad\">capacidad de obrar</span></td><td>Art. 13 LPAC</td></tr>\n<tr><td>9 derechos</td><td>Del <span class=\"t\" data-g=\"interesado\">interesado</span> en el procedimiento</td><td>Art. 53.1 LPAC</td></tr>\n<tr><td>2 formas</td><td>De otorgar el <span class=\"t\" data-g=\"apudacta\">apud acta</span>: comparecencia electrónica o personal</td><td>Art. 6.5 LPAC</td></tr>\n<tr><td>Poder general e inscrito</td><td>Lo que necesita un apoderado para entrar en la <span class=\"t\" data-g=\"carpeta\">Carpeta Ciudadana</span></td><td>Art. 8.1.b) RD 203/2021</td></tr>\n<tr><td>Estándares abiertos</td><td>Exigencia de la <span class=\"t\" data-g=\"neutralidad\">neutralidad tecnológica</span></td><td>Art. 2.a) RD 203/2021</td></tr>\n</tbody></table>\n<svg viewBox=\"0 0 960 268\" width=\"100%\" role=\"img\" aria-label=\"Las tres tipologías de poder inscribibles, la forma apud acta y el plazo de validez de cinco años\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"t5cfr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#4b5563\"/></marker><marker id=\"t5cfe\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#15803d\"/></marker><marker id=\"t5cfw\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#b45309\"/></marker></defs><text x=\"480\" y=\"24\" font-size=\"13\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"bold\">Los poderes que se inscriben en el registro · art. 6.4 LPAC</text><rect x=\"20\" y=\"44\" width=\"300\" height=\"72\" rx=\"8\" fill=\"#e8efff\" stroke=\"#1d4ed8\" stroke-width=\"1.4\"/><text x=\"170\" y=\"68.025\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#1d4ed8\" font-weight=\"bold\">a) PODER GENERAL</text><text x=\"170\" y=\"84.025\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Cualquier actuación</text><text x=\"170\" y=\"100.025\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">ante CUALQUIER Administración</text><rect x=\"330\" y=\"44\" width=\"300\" height=\"72\" rx=\"8\" fill=\"#eaf6ee\" stroke=\"#15803d\" stroke-width=\"1.4\"/><text x=\"480\" y=\"68.025\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#15803d\" font-weight=\"bold\">b) PODER ANTE UNA</text><text x=\"480\" y=\"84.025\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Cualquier actuación ante UNA</text><text x=\"480\" y=\"100.025\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Administración u Organismo</text><rect x=\"640\" y=\"44\" width=\"300\" height=\"72\" rx=\"8\" fill=\"#fdf3e3\" stroke=\"#b45309\" stroke-width=\"1.4\"/><text x=\"790\" y=\"68.025\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"bold\">c) PODER PARA TRÁMITES</text><text x=\"790\" y=\"84.025\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"no

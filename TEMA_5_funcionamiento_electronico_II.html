<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tema 5 · Funcionamiento electrónico del sector público (II)</title>
<style>

/* ═══════════════════════════════════════════════════════════════
   SISTEMA DE DISEÑO · "Académico Gamificado" · Bloque II
   Temas 8, 9 y 10 · Auxiliar Administrativo
   ═══════════════════════════════════════════════════════════════ */
:root{
  --z:1;              /* A+ / A− · solo agranda el cuerpo de la página */

  --bg:#faf9f7;
  --bg-grad:radial-gradient(1100px 560px at 12% -8%, #ede9ff 0%, transparent 55%),
            radial-gradient(850px 460px at 96% 0%, #dcf5ee 0%, transparent 50%);
  --surface:#ffffff;
  --surface-2:#f4f3f0;
  --surface-3:#eceae5;
  --line:#e6e3dc;
  --line-strong:#d4d0c7;

  --ink:#15161c;
  --ink-2:#5d616e;
  --ink-3:#8b8f9c;

  --brand:#5b3df5;
  --brand-2:#7c5cff;
  --brand-soft:#efeaff;
  --brand-ring:rgba(91,61,245,.18);

  --legal:#4338ca;  --legal-bg:#eeecff;
  --ej:#059669;     --ej-bg:#e4f7f0;
  --warn:#c2690a;   --warn-bg:#fdf1de;
  --exc:#dc2626;    --exc-bg:#ffeceb;

  --ok:#16a34a; --ok-soft:#e7f7ec;
  --mid:#eab308; --mid-soft:#fdf6dd;
  --off:#a1a1aa; --off-soft:#f1f1f3;

  --sh-1:0 1px 2px rgba(20,20,30,.04), 0 2px 8px rgba(20,20,30,.04);
  --sh-2:0 2px 6px rgba(20,20,30,.05), 0 12px 28px rgba(20,20,30,.07);
  --sh-3:0 8px 20px rgba(91,61,245,.13), 0 24px 56px rgba(20,20,30,.10);
  --sh-glow:0 0 0 4px var(--brand-ring);

  --r-sm:9px; --r-md:14px; --r-lg:20px; --r-full:999px;

  --f-display:"Segoe UI Variable Display",system-ui,-apple-system,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-legal:ui-serif,Georgia,Cambria,"Times New Roman",serif;
  --f-mono:ui-monospace,"SF Mono","Cascadia Mono","Segoe UI Mono",Menlo,monospace;

  --t-h1:clamp(1.02rem,.95rem + .3vw,1.2rem);
  --t-h2:clamp(1.2rem,1.05rem + .6vw,1.55rem);
  --t-h3:clamp(1rem,.95rem + .25vw,1.12rem);
  --t-sm:.86rem;
  --t-xs:.75rem;

  --e-out:cubic-bezier(.22,1,.36,1);
  --e-spring:cubic-bezier(.34,1.56,.64,1);

  /* ── Compatibilidad con SVG y contenido generado ── */
  --panel:var(--surface);
  --ink2:var(--ink-2);
  --acc:var(--brand);
  --acc-soft:var(--brand-soft);
  --g:var(--ok); --y:var(--mid); --r:var(--exc);
}

html[data-theme="dark"]{
  --bg:#0a0b0f;
  --bg-grad:radial-gradient(1100px 560px at 12% -8%, #1c1740 0%, transparent 55%),
            radial-gradient(850px 460px at 96% 0%, #08302b 0%, transparent 50%);
  --surface:#13151b;
  --surface-2:#1a1d25;
  --surface-3:#232733;
  --line:#262a34;
  --line-strong:#343947;

  --ink:#eceef4;
  --ink-2:#9ba2b3;
  --ink-3:#6e7585;

  --brand:#8b6dff;
  --brand-2:#a78bff;
  --brand-soft:#1e1a3d;
  --brand-ring:rgba(139,109,255,.22);

  --legal:#a5b4fc; --legal-bg:#191b3a;
  --ej:#34d399;    --ej-bg:#0c2a24;
  --warn:#fbbf24;  --warn-bg:#2e2110;
  --exc:#fb7185;   --exc-bg:#331119;

  --ok:#4ade80; --ok-soft:#0e2a19;
  --mid:#facc15; --mid-soft:#2c2610;
  --off:#5b6070; --off-soft:#1c1f27;

  --sh-1:0 1px 2px rgba(0,0,0,.3), 0 2px 8px rgba(0,0,0,.25);
  --sh-2:0 2px 6px rgba(0,0,0,.35), 0 12px 28px rgba(0,0,0,.4);
  --sh-3:0 8px 20px rgba(139,109,255,.2), 0 24px 56px rgba(0,0,0,.5);
}

*,*::before,*::after{box-sizing:border-box}
html{font-size:16px;scroll-behavior:smooth}
/* A+ y A− agrandan o reducen únicamente el cuerpo: el texto de los
   artículos, las tablas y los diagramas. La cabecera, el índice lateral
   y los botones conservan su tamaño para no descolocar la pantalla. */
main{zoom:var(--z)}
@media print{main{zoom:1}}
body{
  margin:0;background:var(--bg);background-image:var(--bg-grad);
  background-attachment:fixed;background-repeat:no-repeat;
  color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.68;
  -webkit-font-smoothing:antialiased;
  transition:background-color .5s var(--e-out),color .3s;
}
::selection{background:var(--brand);color:#fff}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{font-family:var(--f-display);letter-spacing:-.022em;line-height:1.2}
.num{font-variant-numeric:tabular-nums}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:99px;border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3)}

/* ═══ HEADER ═══ */
header.top{
  position:sticky;top:0;z-index:60;
  background:color-mix(in srgb,var(--surface) 80%,transparent);
  backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);
  border-bottom:1px solid var(--line);
}
/* El título ocupa su propia línea, encima de los botones. Antes competía
   por el ancho con la barra de herramientas y acababa desmigado en una
   columna de una palabra por línea. */
.top-in{max-width:1280px;margin:0 auto;padding:.6rem 1.1rem .55rem;display:flex;flex-direction:column;gap:.5rem;align-items:stretch}
.brandwrap{display:flex;align-items:center;gap:.65rem;min-width:0;width:100%}
.mark{
  width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;
  font-weight:800;font-size:.8rem;letter-spacing:-.02em;text-decoration:none;
  box-shadow:0 4px 14px var(--brand-ring);
  transition:transform .3s var(--e-spring),box-shadow .3s;
}
.mark:hover{transform:rotate(-8deg) scale(1.08);box-shadow:var(--sh-3);text-decoration:none}
.top h1{font-size:var(--t-h1);margin:0;font-weight:800;line-height:1.25;min-width:0;flex:1 1 auto}
/* como mucho dos líneas: si no cabe, se recorta con puntos suspensivos */
.top h1 .tit{
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;text-wrap:balance;
}
.top h1 .sub{display:block;font-size:var(--t-xs);color:var(--ink-2);font-weight:500;letter-spacing:0;
  margin-top:.1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tools{margin-left:0;display:flex;gap:.4rem;flex-wrap:wrap;align-items:center;width:100%}

button,select,input[type=search]{
  font:inherit;font-size:var(--t-sm);font-weight:600;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:var(--r-sm);padding:.4rem .72rem;cursor:pointer;
  position:relative;overflow:hidden;
  transition:transform .18s var(--e-spring),border-color .2s,background .2s,box-shadow .2s,color .2s;
}
button:hover{transform:translateY(-1.5px);border-color:var(--brand);box-shadow:var(--sh-1)}
button:active{transform:translateY(0) scale(.97)}
button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible{outline:none;box-shadow:var(--sh-glow)}
input[type=search]{min-width:190px;cursor:text;font-weight:500}
input[type=search]:focus{border-color:var(--brand)}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--surface-2);padding:2px;gap:2px}
.seg button{border:0;border-radius:calc(var(--r-sm) - 2px);padding:.32rem .68rem;background:transparent;box-shadow:none}
.seg button:hover{transform:none;background:var(--surface)}
.seg button[aria-pressed="true"]{background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;box-shadow:0 2px 8px var(--brand-ring)}

.ripple{position:absolute;border-radius:50%;transform:scale(0);background:currentColor;opacity:.25;animation:rip .55s linear;pointer-events:none}
@keyframes rip{to{transform:scale(3.4);opacity:0}}

.progress{position:absolute;left:0;bottom:-1px;height:2.5px;width:0;
  background:linear-gradient(90deg,var(--brand),var(--legal),var(--ej));transition:width .1s linear}

/* ═══ LAYOUT ═══ */
.layout{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:270px 1fr;gap:1.8rem;padding:1.4rem 1.1rem 5rem}
main{min-width:0}

/* ═══ SIDEBAR ═══ */
nav.side{
  position:sticky;top:76px;align-self:start;max-height:calc(100vh - 96px);overflow:auto;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:.85rem;box-shadow:var(--sh-1);
}
nav.side h2{font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);
  margin:.5rem .4rem .5rem;font-weight:800}
nav.side h2:first-child{margin-top:.1rem}
nav.side a{
  display:flex;align-items:baseline;gap:.5rem;padding:.36rem .55rem;border-radius:var(--r-sm);
  text-decoration:none;color:var(--ink-2);font-size:var(--t-sm);font-weight:500;
  position:relative;transition:background .22s,color .22s,transform .22s var(--e-out);
}
nav.side a:hover{background:var(--surface-2);color:var(--ink);transform:translateX(3px);text-decoration:none}
nav.side a.on{background:var(--brand-soft);color:var(--brand);font-weight:700}
nav.side a.on::before{content:"";position:absolute;left:-.85rem;top:20%;bottom:20%;width:3px;
  border-radius:0 3px 3px 0;background:var(--brand)}
nav.side a b{color:var(--ink-3);font-weight:800;font-size:var(--t-xs);font-variant-numeric:tabular-nums;flex:none;min-width:1.9em}
nav.side a.on b{color:var(--brand)}
.navtoggle{display:none}

/* ═══ TARJETAS ═══ */
section.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:1.35rem 1.5rem;margin-bottom:1.1rem;box-shadow:var(--sh-1);
  transition:box-shadow .3s var(--e-out),border-color .3s;
}
section.card:hover{box-shadow:var(--sh-2)}
section.card>h2{
  margin:0 0 1rem;font-size:var(--t-h2);font-weight:800;
  display:flex;align-items:center;gap:.6rem;
}
section.card>h2::before{
  content:"";width:4px;height:1.05em;border-radius:99px;flex:none;
  background:linear-gradient(180deg,var(--brand),var(--brand-2));
}

/* ═══ ARTÍCULO ═══ */
.art{scroll-margin-top:86px;padding-top:.4rem}
.art + .art{margin-top:1.6rem;padding-top:1.6rem;border-top:1px dashed var(--line)}
.art h2{display:flex;flex-wrap:wrap;gap:.5rem;align-items:baseline;font-size:var(--t-h3);
  margin:0 0 .25rem;font-weight:800;letter-spacing:-.015em}
.art h2 .num{
  color:var(--brand);font-weight:800;font-family:var(--f-display);
  background:var(--brand-soft);padding:.1rem .5rem;border-radius:var(--r-sm);
  font-size:.92em;letter-spacing:-.02em;
}
.ubic{font-size:var(--t-xs);color:var(--ink-3);margin:0 0 .8rem;font-weight:600;
  letter-spacing:.03em;text-transform:uppercase}

/* ═══ IDEA CLAVE ═══ */
.idea{
  background:linear-gradient(100deg,var(--brand-soft),color-mix(in srgb,var(--brand-soft) 40%,transparent));
  border-left:4px solid var(--brand);border-radius:0 var(--r-md) var(--r-md) 0;
  padding:.75rem 1rem;font-weight:650;margin:.7rem 0 1rem;position:relative;
  font-size:.97rem;line-height:1.55;
}

/* ═══ ACORDEÓN ═══ */
details.panel{
  border:1px solid var(--line);border-radius:var(--r-md);margin:.6rem 0;
  background:var(--surface);overflow:hidden;
  transition:border-color .25s,box-shadow .25s,background .25s;
}
details.panel:hover{border-color:var(--line-strong)}
details.panel[open]{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-ring)}
details.panel>summary{
  cursor:pointer;padding:.62rem .9rem;font-weight:700;font-size:.93rem;
  list-style:none;display:flex;align-items:center;gap:.55rem;
  transition:background .2s,color .2s;
}
details.panel>summary:hover{background:var(--surface-2)}
details.panel[open]>summary{background:var(--brand-soft);color:var(--brand)}
details.panel>summary::-webkit-details-marker{display:none}
details.panel>summary::before{
  content:"";width:16px;height:16px;flex:none;border-radius:5px;
  background:var(--brand-soft);position:relative;transition:transform .3s var(--e-spring),background .25s;
}
details.panel>summary::after{
  content:"";position:absolute;width:0;height:0;margin-left:5px;
  border:4px solid transparent;border-left-color:var(--brand);
  transition:transform .3s var(--e-spring);
}
details.panel[open]>summary::before{background:var(--surface)}
details.panel[open]>summary::after{transform:rotate(90deg) translateX(-1px)}
details.panel .body{padding:.3rem 1rem 1rem;font-size:.95rem;animation:slidein .35s var(--e-out)}
@keyframes slidein{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* ═══ TEXTO LEGAL ═══ */
.legal{
  background:var(--legal-bg);border-left:4px solid var(--legal);
  border-radius:0 var(--r-md) var(--r-md) 0;padding:.85rem 1.05rem;
  font-family:var(--f-legal);font-size:.95rem;line-height:1.7;
}
.legal p{margin:.45rem 0}
.legal .lbl{
  font-family:var(--f-body);font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;
  color:var(--legal);font-weight:800;display:block;margin-bottom:.4rem;
}

/* ═══ CAJAS SEMÁNTICAS ═══ */
.box{
  border-left:4px solid var(--line);border-radius:0 var(--r-md) var(--r-md) 0;
  padding:.72rem .95rem;margin:.65rem 0;font-size:.94rem;
  transition:transform .25s var(--e-out),box-shadow .25s;
}
.box:hover{transform:translateX(3px);box-shadow:var(--sh-1)}
.box.ej{background:var(--ej-bg);border-color:var(--ej)}
.box.warn{background:var(--warn-bg);border-color:var(--warn)}
.box.exc{background:var(--exc-bg);border-color:var(--exc)}
.box .lbl{font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;font-weight:800;
  display:block;margin-bottom:.3rem}
.box.ej .lbl{color:var(--ej)}
.box.warn .lbl{color:var(--warn)}
.box.exc .lbl{color:var(--exc)}

.interp{
  border:1px dashed var(--warn);background:color-mix(in srgb,var(--warn-bg) 45%,transparent);
  border-radius:var(--r-md);padding:.65rem .9rem;font-size:.9rem;margin:.6rem 0;
}
.interp .lbl{font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;color:var(--warn);font-weight:800;display:block}

/* ═══ TABLAS ═══ */
table{width:100%;border-collapse:separate;border-spacing:0;font-size:.9rem;margin:.7rem 0;
  border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
th,td{padding:.5rem .68rem;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
td + td, th + th{border-left:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th{background:var(--surface-2);font-size:var(--t-xs);font-weight:800;letter-spacing:.05em;
  text-transform:uppercase;color:var(--ink-2);position:sticky;top:0}
tbody tr{transition:background .18s}
tbody tr:nth-child(even){background:color-mix(in srgb,var(--surface-2) 45%,transparent)}
tbody tr:hover{background:var(--brand-soft)}
th.sortable{cursor:pointer;user-select:none;transition:color .2s,background .2s}
th.sortable:hover{color:var(--brand);background:var(--brand-soft)}
th.sortable::after{content:" ⇅";color:var(--ink-3);font-size:.7rem}

ul,ol{margin:.5rem 0 .5rem 1.2rem;padding:0}
li{margin:.26rem 0}
li::marker{color:var(--brand);font-weight:700}

/* ═══ TOOLTIPS ═══ */
.t{border-bottom:1.5px dotted var(--brand);cursor:help;position:relative;
  transition:background .2s,color .2s}
.t:hover{background:var(--brand-soft);color:var(--brand);border-radius:3px}
#tip{
  position:fixed;z-index:99;max-width:330px;background:var(--ink);color:var(--bg);
  padding:.6rem .78rem;border-radius:var(--r-md);font-size:.82rem;line-height:1.5;
  display:none;box-shadow:0 8px 30px rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.08);
}
html[data-theme="dark"] #tip{background:#f0f1f5;color:#15161c}

/* ═══ FLECHAS DE DIAGRAMA ═══
   Un <path> con stroke pero sin fill toma el valor inicial (negro) y el
   navegador cierra el trazo implícitamente: aparece un triángulo relleno
   entre sus extremos. Forzamos fill:none para dejar solo la línea + la
   punta del <marker>, que sí lleva su color. */
svg path[stroke]:not([fill]){fill:none}
svg polyline:not([fill]){fill:none}
svg line{fill:none}

/* ═══ SVG ═══ */
svg{max-width:100%;height:auto;display:block;margin:.9rem auto}
svg text{font-family:var(--f-body)}

/* ═══ BUSCADOR ═══ */
mark.hit{background:linear-gradient(180deg,transparent 55%,#ffe066 55%);color:inherit;
  border-radius:2px;padding:0 1px;font-weight:600}
html[data-theme="dark"] mark.hit{background:linear-gradient(180deg,transparent 55%,#8a6d00 55%);color:#fff}

/* ═══ UTILIDADES ═══ */
.hide{display:none !important}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.small{font-size:var(--t-sm);color:var(--ink-2)}
.chip{
  display:inline-block;font-size:var(--t-xs);padding:.16rem .55rem;border-radius:var(--r-full);
  background:var(--brand-soft);color:var(--brand);font-weight:800;letter-spacing:.02em;
}

/* ═══ HUECOS RELLENABLES ═══ */
.gap{
  display:inline-block;min-width:5.5em;border-bottom:2px solid var(--brand);
  text-align:center;font-weight:700;color:transparent;cursor:pointer;
  transition:color .3s,background .3s;
}
.gap.on,.gap:hover{color:var(--brand);background:var(--brand-soft);border-radius:4px 4px 0 0}

/* ═══ REVELAR SOLUCIÓN ═══ */
.revelar{
  background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;border-color:transparent;
  font-weight:700;
}
.revelar:hover{box-shadow:var(--sh-3)}
.sol{
  margin-top:.7rem;padding:.8rem 1rem;border-radius:var(--r-md);
  background:var(--ej-bg);border-left:4px solid var(--ej);
  animation:slidein .4s var(--e-out);
}

/* ═══ TEST ═══ */
.opt{
  display:block;padding:.55rem .85rem;margin:.35rem 0;border:1.5px solid var(--line);
  border-radius:var(--r-md);cursor:pointer;background:var(--surface);font-size:.94rem;
  transition:border-color .22s,background .22s,transform .22s var(--e-out);
}
.opt:hover{border-color:var(--brand);background:var(--brand-soft);transform:translateX(4px)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft);font-weight:650}
.opt.ko{border-color:var(--exc);background:var(--exc-bg)}
.opt input{margin-right:.5rem;accent-color:var(--brand)}

#tscore,#semres{
  font-family:var(--f-display);font-weight:800;font-size:1.15rem;letter-spacing:-.02em;
}

/* ═══════════════════════════════════════════════════════════════
   FLASHCARDS 3D · mazo con giro, vuelo de salida y sheen
   ═══════════════════════════════════════════════════════════════ */
#flash{--fc-e:cubic-bezier(.2,.8,.25,1);--fc-h:250px}

/* — Escena — */
.fc-stage{
  perspective:1400px;perspective-origin:50% 45%;
  padding:.4rem 0 .2rem;position:relative;
}
.fc-deck{position:relative;height:var(--fc-h);will-change:transform}

/* — Cartas fantasma del mazo — */
.fc-ghost{
  position:absolute;inset:0;border-radius:var(--r-lg);
  background:var(--surface);border:1px solid var(--line);
  transition:transform .5s var(--fc-e),opacity .5s var(--fc-e);
}
.fc-ghost.g1{transform:translateY(9px) scale(.972);opacity:.75}
.fc-ghost.g2{transform:translateY(18px) scale(.944);opacity:.45}
.fc-deck.empty .fc-ghost{opacity:0;transform:translateY(26px) scale(.9)}

/* — Elevación durante el giro — */
.fc-lift{position:absolute;inset:0;transform-style:preserve-3d}
.fc-lift.lift{animation:fcLift .78s var(--fc-e)}
@keyframes fcLift{
  0%,100%{transform:scale(1) translateY(0)}
  45%{transform:scale(1.055) translateY(-16px)}
}
.fc-lift.out-ok{animation:fcOut .5s cubic-bezier(.5,0,.75,0) forwards}
.fc-lift.out-ko{animation:fcOutKo .5s cubic-bezier(.5,0,.75,0) forwards}
.fc-lift.in{animation:fcIn .48s var(--fc-e)}
@keyframes fcOut{
  0%{transform:translateX(0) rotate(0) scale(1);opacity:1}
  100%{transform:translateX(130%) rotate(17deg) scale(.85);opacity:0}
}
@keyframes fcOutKo{
  0%{transform:translateX(0) rotate(0) scale(1);opacity:1}
  100%{transform:translateX(-130%) rotate(-17deg) scale(.85);opacity:0}
}
@keyframes fcIn{
  0%{transform:translateY(26px) scale(.9);opacity:0}
  100%{transform:translateY(0) scale(1);opacity:1}
}

/* — La carta — */
.fc-card{
  position:absolute;inset:0;transform-style:preserve-3d;
  transition:transform .78s var(--fc-e);
  cursor:pointer;border-radius:var(--r-lg);
}
.fc-card:focus-visible{outline:none}
.fc-card:focus-visible .fc-face{box-shadow:var(--sh-glow),var(--sh-2)}

/* — Caras — */
.fc-face{
  position:absolute;inset:0;border-radius:var(--r-lg);
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  padding:2rem 2.2rem;text-align:center;overflow:hidden;
  box-shadow:var(--sh-2);
  transition:box-shadow .4s var(--fc-e);
}
.fc-card:hover .fc-face{box-shadow:var(--sh-3)}

/* Anverso · pregunta */
.fc-front{
  background:
    radial-gradient(120% 90% at 50% -20%, var(--brand-soft) 0%, transparent 60%),
    var(--surface);
  border:1.5px solid var(--line);color:var(--ink);
}
/* Reverso · respuesta */
.fc-back{
  transform:rotateY(180deg);
  background:linear-gradient(145deg,var(--brand) 0%,#6d4bf7 45%,var(--c5,#0891b2) 130%);
  border:1.5px solid transparent;color:#fff;
}
html[data-theme="dark"] .fc-back{
  background:linear-gradient(145deg,#5f45c9 0%,#4b3aa8 45%,#0e6b85 130%);
}
.fc-back .fc-txt{color:#fff}
.fc-back b,.fc-back strong{color:#fff;font-weight:800}

/* — Sheen que barre al girar — */
.fc-face::after{
  content:"";position:absolute;top:-60%;left:-70%;width:55%;height:220%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.42),transparent);
  transform:rotate(18deg);opacity:0;pointer-events:none;
}
.fc-lift.lift .fc-face::after{animation:fcSheen .78s var(--fc-e)}
@keyframes fcSheen{
  0%{opacity:0;left:-70%}
  35%{opacity:1}
  100%{opacity:0;left:150%}
}

/* — Etiqueta superior — */
.fc-tag{
  position:absolute;top:1rem;left:1.15rem;
  font-size:var(--t-xs);font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  display:inline-flex;align-items:center;gap:.4rem;
}
.fc-front .fc-tag{color:var(--brand)}
.fc-back .fc-tag{color:rgba(255,255,255,.9)}
.fc-tag::before{
  content:"";width:7px;height:7px;border-radius:50%;background:currentColor;
  animation:fcPulse 2.2s ease-in-out infinite;
}
@keyframes fcPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.65)}}

/* — Índice tipo naipe — */
.fc-pip{
  position:absolute;font-family:var(--f-display);font-weight:800;
  font-size:.78rem;letter-spacing:-.02em;opacity:.34;font-variant-numeric:tabular-nums;
}
.fc-pip.tr{top:1rem;right:1.15rem}
.fc-pip.bl{bottom:1rem;left:1.15rem;transform:rotate(180deg)}
.fc-front .fc-pip{color:var(--ink-2)}
.fc-back .fc-pip{color:#fff;opacity:.55}

/* — Texto — */
.fc-txt{
  font-size:clamp(1rem,.9rem + .55vw,1.28rem);font-weight:650;line-height:1.5;
  max-width:44ch;letter-spacing:-.012em;
}
.fc-front .fc-txt{font-family:var(--f-display);font-weight:700}
.fc-back .fc-txt{font-weight:600;line-height:1.6}
.fc-hint{
  position:absolute;bottom:1rem;left:0;right:0;
  font-size:var(--t-xs);font-weight:600;letter-spacing:.02em;
  display:flex;align-items:center;justify-content:center;gap:.4rem;
}
.fc-front .fc-hint{color:var(--ink-3)}
.fc-back .fc-hint{color:rgba(255,255,255,.72)}
.fc-hint .kbd{
  font-family:var(--f-mono);font-size:.68rem;font-weight:700;padding:.1rem .32rem;
  border-radius:5px;border:1px solid currentColor;opacity:.75;
}

/* — Pantalla final — */
.fc-done{
  position:absolute;inset:0;border-radius:var(--r-lg);
  background:linear-gradient(150deg,var(--ok-soft),var(--surface) 70%);
  border:1.5px solid var(--ok);
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  text-align:center;padding:2rem;gap:.35rem;
  animation:fcIn .5s var(--fc-e);box-shadow:var(--sh-2);
}
.fc-done .seal{
  font-size:2.6rem;line-height:1;
  animation:fcSeal .7s cubic-bezier(.2,1.5,.4,1);
}
@keyframes fcSeal{0%{transform:scale(0) rotate(-25deg);opacity:0}60%{transform:scale(1.2) rotate(6deg)}100%{transform:scale(1) rotate(0);opacity:1}}
.fc-done h3{font-size:1.3rem;font-weight:800;margin:.2rem 0 0}
.fc-done p{margin:0;color:var(--ink-2);font-size:var(--t-sm)}

/* — Barra de progreso de la ronda — */
.fc-bar{
  height:6px;border-radius:99px;background:var(--surface-3);
  overflow:hidden;margin:.95rem 0 .8rem;position:relative;
}
.fc-bar i{
  display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--brand),var(--c5,#0891b2));
  transition:width .55s var(--fc-e);
}

/* — Controles — */
.fc-ctrls{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.fc-ctrls button{font-weight:700}
#fcok{border-color:var(--ok);color:var(--ok)}
#fcok:hover{background:var(--ok);color:#fff;border-color:var(--ok)}
#fcko{border-color:var(--warn);color:var(--warn)}
#fcko:hover{background:var(--warn);color:#fff;border-color:var(--warn)}
#fcflip{background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;border-color:transparent}
#fcflip:hover{box-shadow:var(--sh-3)}

.fc-score{display:inline-flex;gap:.45rem;margin-left:auto;align-items:center}
.fc-pill{
  font-size:var(--t-xs);font-weight:800;padding:.24rem .6rem;border-radius:var(--r-full);
  font-variant-numeric:tabular-nums;border:1px solid;
}
.fc-pill.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.fc-pill.ko{color:var(--warn);border-color:var(--warn);background:var(--warn-bg)}
.fc-pill.left{color:var(--ink-2);border-color:var(--line);background:var(--surface-2)}
.fc-pill.bump{animation:fcBump .45s var(--e-spring)}
@keyframes fcBump{0%{transform:scale(1)}45%{transform:scale(1.28)}100%{transform:scale(1)}}

@media(max-width:620px){
  #flash{--fc-h:270px}
  .fc-face{padding:1.7rem 1.3rem}
  .fc-score{margin-left:0;width:100%}
}
@media(prefers-reduced-motion:reduce){
  .fc-card{transition:none}
  .fc-lift.lift,.fc-lift.in,.fc-lift.out-ok,.fc-lift.out-ko,.fc-face::after{animation:none !important}
}
@media print{.fc-stage,.fc-ctrls,.fc-bar{display:none !important}}
/* ═══ RESPUESTA ESTRUCTURADA ═══ */
.fc-face{justify-content:center}
.fc-face.struct{justify-content:flex-start;text-align:left;padding-top:3.1rem;padding-bottom:3.1rem}
.fc-body{
  width:100%;max-width:46ch;margin:0 auto;
  overflow-y:auto;max-height:100%;
  scrollbar-width:thin;
}
.fc-body::-webkit-scrollbar{width:5px}
.fc-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.35);border-radius:99px;border:0}
.fc-front .fc-body::-webkit-scrollbar-thumb{background:var(--line-strong)}

/* — Veredicto Sí / No — */
.fc-verdict{
  display:inline-flex;align-items:center;gap:.35rem;
  font-family:var(--f-display);font-weight:800;font-size:.82rem;
  letter-spacing:.06em;text-transform:uppercase;
  padding:.26rem .72rem;border-radius:var(--r-full);margin-bottom:.85rem;
  border:1.5px solid;animation:fcPopIn .45s var(--e-spring) backwards;animation-delay:.34s;
}
.fc-verdict.si{background:rgba(255,255,255,.16);border-color:rgba(190,255,215,.85);color:#d8ffe9}
.fc-verdict.no{background:rgba(255,255,255,.16);border-color:rgba(255,205,205,.85);color:#ffdedd}
@keyframes fcPopIn{0%{opacity:0;transform:scale(.7) translateY(6px)}100%{opacity:1;transform:none}}

/* — Párrafo — */
.fc-p{margin:0;font-size:clamp(1rem,.92rem + .45vw,1.2rem);font-weight:600;line-height:1.6}
.fc-face.struct .fc-p{font-size:clamp(.96rem,.9rem + .35vw,1.1rem)}

/* — Lista enumerada — */
.fc-list{list-style:none;margin:0;padding:0;display:grid;gap:.5rem;counter-reset:fc}
.fc-list li{
  counter-increment:fc;position:relative;margin:0;
  padding:.42rem .6rem .42rem 2.5rem;border-radius:var(--r-sm);
  background:rgba(255,255,255,.11);
  font-size:clamp(.92rem,.88rem + .3vw,1.04rem);font-weight:600;line-height:1.45;
  animation:fcRow .42s var(--e-out) backwards;
}
.fc-list li::before{
  content:counter(fc);position:absolute;left:.6rem;top:50%;transform:translateY(-50%);
  width:1.6rem;height:1.6rem;border-radius:50%;
  display:grid;place-items:center;
  background:rgba(255,255,255,.9);color:var(--brand);
  font-family:var(--f-display);font-weight:800;font-size:.78rem;
  font-variant-numeric:tabular-nums;
}
.fc-list.alpha li::before{content:counter(fc,lower-alpha)}
.fc-list li:nth-child(1){animation-delay:.36s}
.fc-list li:nth-child(2){animation-delay:.42s}
.fc-list li:nth-child(3){animation-delay:.48s}
.fc-list li:nth-child(4){animation-delay:.54s}
.fc-list li:nth-child(5){animation-delay:.60s}
.fc-list li:nth-child(n+6){animation-delay:.66s}
@keyframes fcRow{0%{opacity:0;transform:translateX(-12px)}100%{opacity:1;transform:none}}

/* — Cláusulas contrapuestas — */
.fc-clauses{display:grid;gap:.45rem}
.fc-clauses p{
  margin:0;padding:.45rem .7rem .45rem .95rem;border-radius:0 var(--r-sm) var(--r-sm) 0;
  background:rgba(255,255,255,.11);border-left:3px solid rgba(255,255,255,.55);
  font-size:clamp(.92rem,.88rem + .3vw,1.04rem);font-weight:600;line-height:1.5;
  animation:fcRow .42s var(--e-out) backwards;
}
.fc-clauses p:nth-child(1){animation-delay:.36s}
.fc-clauses p:nth-child(2){animation-delay:.44s}
.fc-clauses p:nth-child(3){animation-delay:.52s}

/* — Negritas resaltadas en el reverso — */
.fc-back .fc-body b,.fc-back .fc-body strong{
  font-weight:800;background:rgba(255,255,255,.2);
  padding:.03em .3em;border-radius:5px;
  box-decoration-break:clone;-webkit-box-decoration-break:clone;
}

/* — Cita legal al pie — */
.fc-cite{
  position:absolute;bottom:.95rem;left:0;right:0;
  display:inline-flex;align-items:center;justify-content:center;gap:.4rem;
  font-family:var(--f-mono);font-size:.74rem;font-weight:700;letter-spacing:.02em;
  color:rgba(255,255,255,.82);
  animation:fcPopIn .5s var(--e-out) backwards;animation-delay:.5s;
}
.fc-cite::before,.fc-cite::after{
  content:"";height:1px;width:clamp(18px,10%,52px);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.45));
}
.fc-cite::after{background:linear-gradient(90deg,rgba(255,255,255,.45),transparent)}
.fc-cite .s{font-size:.9rem;opacity:.75;font-family:var(--f-legal)}
.fc-front .fc-cite{color:var(--ink-3)}
.fc-front .fc-cite::before{background:linear-gradient(90deg,transparent,var(--line-strong))}
.fc-front .fc-cite::after{background:linear-gradient(90deg,var(--line-strong),transparent)}

/* la pista se oculta si hay cita, para no amontonar */
.fc-back .fc-cite ~ .fc-hint,.fc-back .fc-hint.muted{display:none}

@media(max-width:620px){
  #flash{--fc-h:320px}
  .fc-face.struct{padding-top:2.9rem;padding-bottom:2.8rem}
  .fc-list li{padding-left:2.3rem}
}
@media(prefers-reduced-motion:reduce){
  .fc-verdict,.fc-list li,.fc-clauses p,.fc-cite{animation:none !important}
}

/* ═══ SEMÁFORO ═══ */
.sembtn{
  border-radius:var(--r-full);padding:.32rem .7rem;font-weight:700;font-size:var(--t-sm);
}
.sembtn[data-v="g"]:hover,.sembtn.on[data-v="g"]{background:var(--ok);color:#fff;border-color:var(--ok)}
.sembtn[data-v="y"]:hover,.sembtn.on[data-v="y"]{background:var(--mid);color:#3d2f00;border-color:var(--mid)}
.sembtn[data-v="r"]:hover,.sembtn.on[data-v="r"]{background:var(--exc);color:#fff;border-color:var(--exc)}

/* ═══ CTA DE BLOQUE ═══ */
a.blk{
  display:inline-flex;align-items:center;gap:.5rem;
  background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;
  padding:.5rem .95rem;border-radius:var(--r-sm);font-weight:700;font-size:var(--t-sm);
  text-decoration:none;box-shadow:0 2px 10px var(--brand-ring);
  transition:transform .22s var(--e-spring),box-shadow .25s,gap .25s var(--e-out);
}
a.blk:hover{transform:translateY(-2px);box-shadow:var(--sh-3);gap:.75rem;text-decoration:none}
a.blk::after{content:"→"}
a.blk:active{transform:translateY(0) scale(.98)}

/* ═══ REVEAL ═══ */
.rv{opacity:0;transform:translateY(20px);transition:opacity .6s var(--e-out),transform .6s var(--e-out)}
.rv.in{opacity:1;transform:none}

/* ═══ RESPONSIVE ═══ */
@media(max-width:960px){
  .layout{grid-template-columns:1fr;padding-top:.9rem;gap:1rem}
  nav.side{position:static;max-height:none}
  nav.side.collapsed .navbody{display:none}
  .navtoggle{display:block;width:100%;text-align:left;font-weight:700}
  .grid2{grid-template-columns:1fr}
  .top h1 .sub{white-space:normal}
}
@media(max-width:620px){
  .top-in{padding:.55rem .8rem}
  .tools{width:100%;margin-left:0}
  /* en pantallas estrechas el título se achica un poco y puede llegar a
     tres líneas: preferimos eso a recortarlo y esconder texto */
  .top h1{font-size:.95rem}
  .top h1 .tit{-webkit-line-clamp:3}
  input[type=search]{flex:1;min-width:0}
  section.card{padding:1.05rem 1rem;border-radius:var(--r-md)}
  table{font-size:.82rem}
  th,td{padding:.4rem .5rem}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
  .rv{opacity:1;transform:none}
}
@media print{
  header.top,nav.side,.tools,.noprint,.progress{display:none !important}
  body{background:#fff;background-image:none;font-size:11pt;color:#000}
  .layout{display:block;max-width:none;padding:0}
  section.card{border:0;padding:0;margin:0 0 1rem;break-inside:avoid;box-shadow:none}
  details.panel{border:0;box-shadow:none}
  details.panel .body{display:block !important}
  details.panel>summary{padding-left:0}
  .art{break-inside:avoid}
  .rv{opacity:1;transform:none}
  a{color:#000;text-decoration:none}
}


/* ═══ ALTURA ADAPTATIVA DE LA TARJETA ═══ */
.fc-deck{transition:height .45s var(--fc-e)}
.fc-body{max-height:none;overflow:visible}
.fc-measure{
  position:absolute;left:0;right:0;top:0;height:auto;
  visibility:hidden;pointer-events:none;z-index:-1;
}
.fc-measure .fc-face{
  position:relative;inset:auto;height:auto;min-height:0;
  box-shadow:none;backface-visibility:visible;transform:none;
}
.fc-measure .fc-body{max-height:none;overflow:visible}
.fc-measure .fc-face::after{display:none}

/* ═══ MOSTRAR / OCULTAR ÍNDICE LATERAL ═══ */
.layout{transition:grid-template-columns .42s var(--e-out)}
.layout.nonav{grid-template-columns:0 1fr;gap:0}
.layout.nonav>nav.side{
  opacity:0;transform:translateX(-14px);pointer-events:none;
  padding:0;border-width:0;overflow:hidden;width:0;min-width:0;
}
nav.side{
  transition:opacity .3s var(--e-out),transform .38s var(--e-out);
  overflow-x:hidden;
}
#navhide .ic{display:inline-block;transition:transform .35s var(--e-spring);font-size:.95em;line-height:1}
#navhide[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
#navhide[aria-pressed="true"] .ic{transform:rotate(90deg)}
@media(max-width:960px){#navhide{display:none}}

/* ═══════════════════════════════════════════════════════════════
   LECTURA EN VOZ ALTA (TTS) del texto legal
   ═══════════════════════════════════════════════════════════════ */
.tts-bar{
  display:flex;align-items:center;gap:.45rem;flex-wrap:wrap;
  margin:.15rem 0 .7rem;
}
.tts-bar button{
  font-size:var(--t-xs);font-weight:700;padding:.3rem .62rem;
  border-radius:var(--r-full);border:1px solid var(--legal);
  background:transparent;color:var(--legal);
  display:inline-flex;align-items:center;gap:.35rem;line-height:1.2;
}
.tts-bar button:hover{background:var(--legal);color:var(--surface);border-color:var(--legal)}
.tts-bar button[hidden]{display:none}
.tts-bar .tts-play.on{background:var(--legal);color:var(--surface)}

/* Ondas de audio mientras lee */
.tts-wave{display:inline-flex;align-items:flex-end;gap:2px;height:11px}
.tts-wave i{
  width:2.5px;background:currentColor;border-radius:2px;height:35%;
  animation:ttsW .9s ease-in-out infinite;
}
.tts-wave i:nth-child(2){animation-delay:.15s}
.tts-wave i:nth-child(3){animation-delay:.3s}
.tts-wave i:nth-child(4){animation-delay:.45s}
@keyframes ttsW{0%,100%{height:32%}50%{height:100%}}

.tts-time{
  font-family:var(--f-mono);font-size:.7rem;font-weight:700;
  color:var(--ink-3);font-variant-numeric:tabular-nums;
}

/* Frase que se está leyendo */
.tts-s{transition:background .25s,color .25s;border-radius:3px}
.tts-s.now{
  background:linear-gradient(180deg,transparent 8%,color-mix(in srgb,var(--legal) 26%,transparent) 8%);
  box-shadow:0 0 0 2px color-mix(in srgb,var(--legal) 16%,transparent);
}
html[data-theme="dark"] .tts-s.now{
  background:linear-gradient(180deg,transparent 8%,color-mix(in srgb,var(--legal) 34%,transparent) 8%);
}
.legal.tts-on{box-shadow:0 0 0 3px color-mix(in srgb,var(--legal) 20%,transparent)}

/* ═══ Reproductor flotante ═══ */
.tts-mini{
  position:fixed;left:50%;bottom:1.1rem;transform:translateX(-50%) translateY(140%);
  z-index:80;display:flex;align-items:center;gap:.6rem;
  background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  border:1px solid var(--line);border-radius:var(--r-full);
  padding:.5rem .7rem .5rem .95rem;box-shadow:var(--sh-3);
  transition:transform .45s var(--e-spring),opacity .3s;opacity:0;pointer-events:none;
  max-width:min(94vw,540px);
}
.tts-mini.show{transform:translateX(-50%) translateY(0);opacity:1;pointer-events:auto}
.tts-mini .lbl{
  font-size:var(--t-xs);font-weight:800;color:var(--legal);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:16ch;
}
.tts-mini button{
  border-radius:50%;width:32px;height:32px;padding:0;display:grid;place-items:center;
  font-size:.8rem;border:1px solid var(--line);flex:none;
}
.tts-mini button.main{
  width:38px;height:38px;font-size:.95rem;
  background:linear-gradient(140deg,var(--legal),var(--brand));color:#fff;border-color:transparent;
}
.tts-mini .bar{
  flex:1;min-width:70px;height:5px;border-radius:99px;background:var(--surface-3);overflow:hidden;
}
.tts-mini .bar i{display:block;height:100%;width:0;background:var(--legal);
  border-radius:99px;transition:width .35s var(--e-out)}

/* ═══ Panel de ajustes de voz ═══ */
.tts-back{
  position:fixed;inset:0;z-index:90;background:rgba(10,10,18,.45);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  display:grid;place-items:center;padding:1rem;
  opacity:0;pointer-events:none;transition:opacity .3s var(--e-out);
}
.tts-back.show{opacity:1;pointer-events:auto}
.tts-panel{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--sh-3);width:min(94vw,470px);max-height:88vh;overflow:auto;
  padding:1.3rem 1.4rem;transform:translateY(16px) scale(.97);
  transition:transform .38s var(--e-spring);
}
.tts-back.show .tts-panel{transform:none}
.tts-panel h3{
  font-size:1.12rem;font-weight:800;margin:0 0 .25rem;
  display:flex;align-items:center;gap:.5rem;
}
.tts-panel .sub{font-size:var(--t-sm);color:var(--ink-2);margin:0 0 1.1rem}
.tts-row{margin-bottom:1.05rem}
.tts-row > label{
  display:block;font-size:var(--t-xs);font-weight:800;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-2);margin-bottom:.4rem;
}
.tts-seg{display:flex;gap:3px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:3px}
.tts-seg button{
  flex:1;border:0;background:transparent;border-radius:calc(var(--r-sm) - 3px);
  padding:.42rem .3rem;font-size:var(--t-sm);font-weight:700;box-shadow:none;
}
.tts-seg button:hover{transform:none;background:var(--surface)}
.tts-seg button[aria-pressed="true"]{
  background:linear-gradient(140deg,var(--legal),var(--brand));color:#fff;
}
.tts-panel select{
  width:100%;padding:.5rem .6rem;border-radius:var(--r-sm);
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  font-size:var(--t-sm);font-weight:600;cursor:pointer;
}
.tts-panel select:focus{border-color:var(--brand);outline:none}
.tts-slider{display:flex;align-items:center;gap:.75rem}
.tts-slider input[type=range]{flex:1;accent-color:var(--legal);cursor:pointer;height:22px}
.tts-val{
  font-family:var(--f-mono);font-weight:800;font-size:var(--t-sm);
  min-width:3.4em;text-align:right;color:var(--legal);font-variant-numeric:tabular-nums;
}
.tts-note{
  font-size:var(--t-xs);color:var(--ink-2);line-height:1.5;
  background:var(--surface-2);border-radius:var(--r-sm);padding:.6rem .75rem;margin:0 0 1rem;
}
.tts-note b{color:var(--ink)}
.tts-acts{display:flex;gap:.5rem;justify-content:flex-end;flex-wrap:wrap}
.tts-acts .prim{
  background:linear-gradient(140deg,var(--legal),var(--brand));color:#fff;border-color:transparent;
}
.tts-badge{
  font-size:.62rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
  padding:.1rem .35rem;border-radius:4px;background:var(--ej-bg);color:var(--ej);margin-left:.35rem;
}


/* — Variante compacta para los apartados desplegables — */
.tts-bar.mini{margin:0 0 .6rem}
.tts-bar.mini button{
  font-size:.7rem;padding:.24rem .55rem;
  border-color:var(--brand);color:var(--brand);
}
.tts-bar.mini button:hover{background:var(--brand);color:var(--surface)}
.tts-bar.mini .tts-play.on{background:var(--brand);color:var(--surface)}
.tts-bar.mini .tts-time{font-size:.66rem}
.idea .tts-bar.mini{margin:.55rem 0 0}
.legal.tts-on,.body.tts-on,.idea.tts-on{
  box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 20%,transparent)
}
.legal.tts-on{box-shadow:0 0 0 3px color-mix(in srgb,var(--legal) 20%,transparent)}


/* aviso de cambio de voz */
.tts-aviso{
  position:fixed;left:50%;bottom:5.2rem;transform:translateX(-50%) translateY(20px);
  z-index:95;max-width:min(92vw,460px);
  background:var(--warn-bg);border:1px solid var(--warn);color:var(--warn);
  border-radius:var(--r-md);padding:.6rem .9rem;font-size:var(--t-sm);font-weight:700;
  box-shadow:var(--sh-2);opacity:0;pointer-events:none;
  transition:opacity .3s var(--e-out),transform .35s var(--e-spring);
}
.tts-aviso.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:620px){
  .tts-mini{left:.6rem;right:.6rem;transform:translateY(140%);max-width:none}
  .tts-mini.show{transform:translateY(0)}
  .tts-mini .lbl{display:none}
}
@media(prefers-reduced-motion:reduce){
  .tts-wave i{animation:none;height:60%}
}
@media print{.tts-bar,.tts-mini,.tts-back{display:none !important}}

 administrativo».", "No distingue por el contenido del trámite.", "La obligación no se agota en la solicitud.", "No distingue por la forma de iniciación."]], ["La expresión «al menos» del art. 14.2 significa que…", ["la obligación es potestativa para la Administración", "la lista de obligados puede ampliarse", "la lista es cerrada", "solo obliga a los dos primeros apartados"], 1, ["La obligación no es potestativa para quien está incluido.", "Correcta. Es un mínimo, y el art. 14.3 permite ampliarlo por reglamento.", "Si fuera cerrada, el «al menos» sobraría.", "Alcanza a las cinco letras."]], ["El bastanteo del poder…", ["lo realiza siempre un notario", "sustituye a la inscripción", "debe constar en el registro electrónico de apoderamientos", "no se recoge en la Ley 39/2015"], 2, ["Es una comprobación que realiza la propia Administración.", "Es un complemento de la inscripción, no un sustituto.", "Correcta. Art. 6.1 LPAC: «También deberá constar el bastanteo realizado del poder».", "El art. 6.1 LPAC lo menciona expresamente."]], ["Los registros de apoderamientos deben permitir comprobar la representación consultando…", ["solo los protocolos notariales", "únicamente otros registros administrativos", "solo el registro mercantil", "otros registros administrativos, el mercantil, el de la propiedad y los protocolos notariales"], 3, ["Es una de las fuentes, no la única.", "El art. 6.2 enumera más fuentes.", "Es una de las fuentes, no la única.", "Correcta. Art. 6.2 LPAC, y esos registros deben ser interoperables con los de apoderamientos."]], ["El órgano que tramita el procedimiento debe incorporar al expediente…", ["la acreditación de la condición de representante y de los poderes reconocidos en ese momento", "solo el poder notarial si existe", "únicamente la solicitud", "nada relativo a la representación"], 0, ["Correcta. Art. 5.5 LPAC; el documento electrónico de la consulta al registro vale como acreditación.", "No se limita al poder notarial.", "El art. 5.5 exige expresamente más.", "El art. 5.5 impone esa incorporación."]], ["Los actos para los que el art. 5.3 exige acreditar la representación coinciden con…", ["las causas de nulidad de pleno derecho", "los cinco casos en que el art. 11.2 exige firma", "los motivos de abstención", "los supuestos de tramitación de urgencia"], 1, ["Las causas de nulidad están en el art. 47 LPAC.", "Correcta. Solicitar, declarar, recurrir, desistir y renunciar: son los mismos cinco.", "Las causas de abstención están en el art. 23 LRJSP.", "No guardan relación."]]];

<script>
document.getElementById("main").innerHTML="<section class=\"card\" id=\"intro\"><h2>Tema 5 · Funcionamiento electrónico del sector público (II)</h2>\n<p class=\"ubic\">El acceso electrónico de la ciudadanía a los servicios públicos · Los servicios públicos electrónicos · Derecho y obligación de relacionarse electrónicamente</p>\n<div class=\"idea\">Tres preguntas y el tema está entero: <b>qué derechos tienes</b>, <b>si puedes elegir</b> entre papel y electrónico, y <b>cómo demuestras</b> que actúas en nombre de otro.</div>\n<div class=\"box ej\"><span class=\"lbl\">Cómo está organizado</span><ul>\n<li><b>Los derechos</b> · arts. 13 y 53 LPAC: dos listas de nueve letras que no hay que confundir. La primera es de quien tiene <span class=\"t\" data-g=\"capacidad\">capacidad de obrar</span>; la segunda, de quien es <span class=\"t\" data-g=\"interesado\">interesado</span> en un procedimiento.</li>\n<li><b>Elegir o estar obligado</b> · art. 14 LPAC y art. 3 del RD 203/2021: los cinco <span class=\"t\" data-g=\"obligados\">sujetos obligados</span> —entre ellos los profesionales sujetos a <span class=\"t\" data-g=\"colegiacion\">colegiación obligatoria</span>—, la ampliación por reglamento y los cinco días hábiles para cambiar de canal.</li>\n<li><b>Actuar por otro</b> · arts. 5 y 6 LPAC y arts. 32 a 34 del Reglamento: cuándo se acredita la representación, el <span class=\"t\" data-g=\"apudacta\">apoderamiento apud acta</span>, el <span class=\"t\" data-g=\"rea\">registro de apoderamientos</span> y el certificado de representante.</li>\n<li><b>Los servicios electrónicos</b> · arts. 2, 5 y 8 del Reglamento: principios, portales, el <span class=\"t\" data-g=\"page\">Punto de Acceso General</span> y la <span class=\"t\" data-g=\"carpeta\">Carpeta Ciudadana</span>.</li>\n</ul></div>\n<div class=\"box warn\"><span class=\"lbl\">Verifica la vigencia</span>Trabajado sobre los textos consolidados del BOE de la carpeta: Ley 39/2015, Ley 40/2015 y Real Decreto 203/2021. La Ley 11/2007 de acceso electrónico está derogada y no se ha usado.</div>\n<svg viewBox=\"0 0 980 352\" width=\"100%\" role=\"img\" aria-label=\"Árbol de decisión sobre quién está obligado a relacionarse electrónicamente con la Administración\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"t5afr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#4b5563\"/></marker><marker id=\"t5afe\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#15803d\"/></marker><marker id=\"t5afw\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#b45309\"/></marker></defs><text x=\"490\" y=\"24\" font-size=\"13\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"bold\">¿Estás obligado a relacionarte electrónicamente?</text><rect x=\"290\" y=\"40\" width=\"400\" height=\"38\" rx=\"8\" fill=\"#e8efff\" stroke=\"#1d4ed8\" stroke-width=\"1.4\"/><text x=\"490\" y=\"63.2\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1d4ed8\" font-weight=\"bold\">¿Quién realiza el trámite?</text><rect x=\"20\" y=\"108\" width=\"460\" height=\"34\" rx=\"8\" fill=\"#eaf6ee\" stroke=\"#15803d\" stroke-width=\"1.4\"/><text x=\"250\" y=\"128.85\" font-size=\"11\" text-anchor=\"middle\" fill=\"#15803d\" font-weight=\"bold\">PERSONA FÍSICA no incluida a la derecha</text><rect x=\"500\" y=\"108\" width=\"460\" height=\"34\" rx=\"8\" fill=\"#fdeceb\" stroke=\"#b91c1c\" stroke-width=\"1.4\"/><text x=\"730\" y=\"128.85\" font-size=\"11\" text-anchor=\"middle\" fill=\"#b91c1c\" font-weight=\"bold\">OBLIGADOS SIEMPRE · art. 14.2 LPAC</text><line x1=\"400\" y1=\"80\" x2=\"250\" y2=\"106\" stroke=\"#4b5563\" stroke-width=\"1.6\" marker-end=\"url(#t5afr)\"/><line x1=\"580\" y1=\"80\" x2=\"730\" y2=\"106\" stroke=\"#4b5563\" stroke-width=\"1.6\" marker-end=\"url(#t5afr)\"/><rect x=\"20\" y=\"150\" width=\"460\" height=\"112\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"250\" y=\"167.28\" font-size=\"10.8\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">ELIGE y puede cambiar de medio</text><text x=\"250\" y=\"184.28\" font-size=\"10.8\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">en cualquier momento (art. 14.1).</text><text x=\"250\" y=\"201.28\" font-size=\"10.8\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\"></text><text x=\"250\" y=\"218.28\" font-size=\"10.8\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Si opta por lo electrónico, los efectos</text><text x=\"250\" y=\"235.28\" font-size=\"10.8\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">llegan al 5.º DÍA HÁBIL siguiente</text><text x=\"250\" y=\"252.28\" font-size=\"10.8\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">(RD 203/2021, art. 3.2)</text><rect x=\"500\" y=\"150\" width=\"460\" height=\"112\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"730\" y=\"167.07\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">a) Personas jurídicas</text><text x=\"730\" y=\"184.07\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">b) Entidades sin personalidad jurídica</text><text x=\"730\" y=\"201.07\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">c) Profesionales de colegiación obligatoria</text><text x=\"730\" y=\"218.07\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">   —notarios y registradores incluidos—</text><text x=\"730\" y=\"235.07\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">d) Quien representa a un obligado</text><text x=\"730\" y=\"252.07\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">e) Empleados públicos, por su condición</text><rect x=\"20\" y=\"272\" width=\"940\" height=\"42\" rx=\"8\" fill=\"#fdf3e3\" stroke=\"#b45309\" stroke-width=\"1.4\"/><text x=\"490\" y=\"289.605\" font-size=\"10.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Y además (art. 14.3): por reglamento puede obligarse a ciertos colectivos de personas físicas por capacidad</text><text x=\"490\" y=\"303.605\" font-size=\"10.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">económica, técnica, dedicación profesional u otros motivos acreditados</text><text x=\"490\" y=\"334\" font-size=\"11\" text-anchor=\"middle\" fill=\"#b91c1c\" font-weight=\"bold\">Los obligados del 14.2 lo están para la realización de CUALQUIER TRÁMITE de un procedimiento administrativo.</text></svg>\n<p class=\"small\">Este tema sí tiene cifras, y son pocas: <b>cinco</b> obligados, <b>cinco</b> días hábiles para cambiar de canal, <b>tres</b> tipologías de poder, <b>cinco</b> años de validez y <b>diez</b> días para subsanar la representación.</p>\n</section><section class=\"card art\" id=\"lpac13\"><h2><span class=\"num\">LPAC 13</span> Derechos de las personas en sus relaciones con las Administraciones</h2><p class=\"ubic\">Ley 39/2015 ▸ Título I «De los interesados en el procedimiento» ▸ Capítulo I</p><div class=\"idea\">Nueve derechos de cualquiera que tenga capacidad de obrar, sea o no interesado.</div><svg viewBox=\"0 0 980 300\" width=\"100%\" role=\"img\" aria-label=\"Comparación entre los derechos del artículo 13 y los del artículo 53 de la Ley 39/2015\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"t5bfr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#4b5563\"/></marker><marker id=\"t5bfe\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#15803d\"/></marker><marker id=\"t5bfw\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#b45309\"/></marker></defs><text x=\"490\" y=\"24\" font-size=\"13\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"bold\">Dos listas de derechos que no hay que confundir</text><rect x=\"20\" y=\"44\" width=\"460\" height=\"38\" rx=\"8\" fill=\"#e8efff\" stroke=\"#1d4ed8\" stroke-width=\"1.4\"/><text x=\"250\" y=\"67.025\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#1d4ed8\" font-weight=\"bold\">ART. 13 · QUIEN TIENE CAPACIDAD DE OBRAR</text><rect x=\"500\" y=\"44\" width=\"460\" height=\"38\" rx=\"8\" fill=\"#eaf6ee\" stroke=\"#15803d\" stroke-width=\"1.4\"/><text x=\"730\" y=\"66.85\" font-size=\"11\" text-anchor=\"middle\" fill=\"#15803d\" font-weight=\"bold\">ART. 53 · QUIEN ES INTERESADO EN UN PROCEDIMIENTO</text><text x=\"30\" y=\"102\" font-size=\"9.6\" text-anchor=\"start\" fill=\"#15181d\" font-weight=\"normal\">a) Comunicarse por el Punto de Acceso General</text><text x=\"510\" y=\"102\" font-size=\"9.6\" text-anchor=\"start\" fill=\"#15181d\" font-weight=\"normal\">a) Conocer el estado de la tramitación y el sentido del silencio</text><text x=\"30\" y=\"122\" font-size=\"9.6\" text-anchor=\"start\" fill=\"#15181d\" font-weight=\"normal\">b) Ser asistido en el uso de medios electrónicos</text><text x=\"510\" y=\"122\" font-size=\"9.6\" text-anchor=\"start\" fill=\"#15181d\" font-weight=\"normal\">b) Identificar a autoridades y personal responsable</text><text x=\"30\" y=\"142\" font-size=\"9.6\" text-anchor=\"start\" fill=\"#15181d\" font-weight=\"normal\">c) Usar las lenguas oficiales</text><text x=\"510\" y=\"142\" font-size=\"9.6\" text-anchor=\"start\" fill=\"#15181d\" font-weight=\"normal\">c) No presentar documentos originales</text><text x=\"30\" y=\"162\" font-size=\"9.6\" text-anchor=\"start\" fill=\"#15181d\" font-weight=\"normal\">d) Acceder a información pública, archivos y registros</text><text x=\"510\" y=\"162\" font-size=\"9.6\" text-anchor=\"start\" fill=\"#15181d\" font-weight=\"normal\">d) No presentar datos o documentos ya aportados</text><text x=\"30\" y=\"182\" font-size=\"9.6\" text-anchor=\"start\" fill=\"#15181d\" font-weight=\"normal\">e) Ser tratado con respeto y deferencia</text><text x=\"510\" y=\"182\" font-size=\"9.6\" text-anchor=\"start\" fill=\"#15181d\" font-weight=\"normal\">e) Formular alegaciones y aportar documentos</text><text x=\"30\" y=\"202\" font-size=\"9.6\" text-anchor=\"start\" fill=\"#15181d\" font-weight=\"normal\">f) Exigir responsabilidades</text><text x=\"510\" y=\"202\" font-size=\"9.6\" text-anchor=\"start\" fill=\"#15181d\" font-weight=\"normal\">f) Obtener información sobre requisitos de los proyectos</text><text x=\"30\" y=\"222\" font-size=\"9.6\" text-anchor=\"start\" fill=\"#15181d\" font-weight=\"normal\">g) Obtener y usar medios de identificación y firma</text><text x=\"510\" y=\"222\" font-size=\"9.6\" text-anchor=\"start\" fill=\"#15181d\" font-weight=\"normal\">g) Actuar asistido de asesor</text><text x=\"30\" y=\"242\" font-size=\"9.6\" text-anchor=\"start\" fill=\"#15181d\" font-weight=\"normal\">h) Protección de datos personales</text><text x=\"510\" y=\"242\" font-size=\"9.6\" text-anchor=\"start\" fill=\"#15181d\" font-weight=\"normal\">h) Cumplir obligaciones de pago por medios electrónicos</text><text x=\"30\" y=\"262\" font-size=\"9.6\" text-anchor=\"start\" fill=\"#15181d\" font-weight=\"normal\">i) Cualesquiera otros de la Constitución y las leyes</text><text x=\"510\" y=\"262\" font-size=\"9.6\" text-anchor=\"start\" fill=\"#15181d\" font-weight=\"normal\">i) Cualesquiera otros que les reconozcan la Constitución y las leyes</text><text x=\"490\" y=\"286\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"bold\">El art. 13 cierra diciendo que se entienden «sin perjuicio de los reconocidos en el artículo 53».</text></svg><details class=\"panel\" open><summary>Texto legal</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LPAC</span><p><b>Artículo 13. Derechos de las personas en sus relaciones con las Administraciones Públicas.</b></p><p>Quienes de conformidad con el artículo 3, tienen capacidad de obrar ante las Administraciones Públicas, son titulares, en sus relaciones con ellas, de los siguientes derechos:</p><p>a) A comunicarse con las Administraciones Públicas a través de un Punto de Acceso General electrónico de la Administración.</p><p>b) A ser asistidos en el uso de medios electrónicos en sus relaciones con las Administraciones Públicas.</p><p>c) A utilizar las lenguas oficiales en el territorio de su Comunidad Autónoma, de acuerdo con lo previsto en esta Ley y en el resto del ordenamiento jurídico.</p><p>d) Al acceso a la información pública, archivos y registros, de acuerdo con lo previsto en la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno y el resto del Ordenamiento Jurídico.</p><p>e) A ser tratados con respeto y deferencia por las autoridades y empleados públicos, que habrán de facilitarles el ejercicio de sus derechos y el cumplimiento de sus obligaciones.</p><p>f) A exigir las responsabilidades de las Administraciones Públicas y autoridades, cuando así corresponda legalmente.</p><p>g) A la obtención y utilización de los medios de identificación y firma electrónica contemplados en esta Ley.</p><p>h) A la protección de datos de carácter personal, y en particular a la seguridad y confidencialidad de los datos que figuren en los ficheros, sistemas y aplicaciones de las Administraciones Públicas.</p><p>i) Cualesquiera otros que les reconozcan la Constitución y las leyes. Estos derechos se entienden sin perjuicio de los reconocidos en el artículo 53 referidos a los interesados en el procedimiento administrativo.</p></div></div></details><details class=\"panel\"><summary>Disección</summary><div class=\"body\"><ul>\n<li><b>Quién los tiene:</b> quienes, conforme al art. 3, tienen <b>capacidad de obrar</b> ante las Administraciones. No hace falta ser interesado en un procedimiento.</li>\n<li><b>a)</b> Comunicarse a través de un <b>Punto de Acceso General electrónico</b>. <b>b)</b> Ser <b>asistido</b> en el uso de medios electrónicos. <b>c)</b> Usar las <b>lenguas oficiales</b>.</li>\n<li><b>d)</b> Acceso a la <b>información pública, archivos y registros</b> conforme a la Ley 19/2013. <b>e)</b> Ser tratado con <b>respeto y deferencia</b>. <b>f)</b> Exigir <b>responsabilidades</b>.</li>\n<li><b>g)</b> Obtener y utilizar los <b>medios de identificación y firma</b> de la Ley. <b>h)</b> <b>Protección de datos</b>, seguridad y confidencialidad. <b>i)</b> Cualesquiera otros de la Constitución y las leyes.</li>\n<li><b>Cláusula de cierre:</b> estos derechos se entienden <b>sin perjuicio de los reconocidos en el art. 53</b> a los interesados en el procedimiento.</li>\n</ul></div></details><details class=\"panel\"><summary>En lenguaje llano</summary><div class=\"body\"><p>Es la carta de derechos del ciudadano de a pie, tenga o no un expediente abierto. Puedes entrar, preguntar, que te atiendan bien y que te ayuden con lo electrónico aunque no seas parte de nada.</p></div></details><details class=\"panel\"><summary>¿Por qué existe?</summary><div class=\"body\"><div class=\"interp\"><span class=\"lbl\">Interpretación · aportación externa</span>Antes, los derechos iban ligados a la condición de interesado: sin expediente abierto, no había posición jurídica que invocar. El art. 13 reconoce un suelo mínimo frente a la Administración por el solo hecho de tener capacidad de obrar.</div></div></details><details class=\"panel\"><summary>Ejemplos</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Ejemplo 1</span>Alguien que no tiene ningún expediente pide ayuda en la oficina para usar la sede: derecho b).</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 2</span>Un vecino pide acceso a información pública municipal: derecho d), por la vía de la Ley 19/2013.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 3</span>Caso límite: ese mismo vecino inicia después un procedimiento. Desde ese momento suma los derechos del art. 53, sin perder los del 13.</div></div></details><details class=\"panel\"><summary>Trampas</summary><div class=\"body\"><div class=\"box warn\"><span class=\"lbl\">Cuidado</span>Las dos listas se cruzan en los test. El art. 13 es para <b>quien tiene capacidad de obrar</b>; el art. 53, para <b>quien es interesado en un procedimiento</b>. Si una opción te pone «conocer el estado de la tramitación» dentro del art. 13, está mal: eso es el 53.1.a).</div></div></details><details class=\"panel\"><summary>Conexiones</summary><div class=\"body\"><p>Con el art. 53 —derechos del interesado—, con el art. 12 —asistencia— y con el art. 14 —elegir el medio—.</p></div></details><details class=\"panel\"><summary>Anclaje memorístico</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Para retenerlo</span>Art. 13: <b>capacidad de obrar</b>. Art. 53: <b>interesado</b>. Nueve letras cada uno, y los dos cierran con «cualesquiera otros».</div></div></details></section><section class=\"card art\" id=\"lpac53\"><h2><span class=\"num\">LPAC 53</span> Derechos del interesado en el procedimiento administrativo</h2><p class=\"ubic\">Ley 39/2015 ▸ Título IV «De las disposiciones sobre el procedimiento» ▸ Capítulo I</p><div class=\"idea\">Nueve derechos más, estos ya dentro de un procedimiento concreto.</div><svg viewBox=\"0 0 980 300\" width=\"100%\" role=\"img\" aria-label=\"Comparación entre los derechos del artículo 13 y los del artículo 53 de la Ley 39/2015\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"t5bfrr2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#4b5563\"/></marker><marker id=\"t5bfer2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#15803d\"/></marker><marker id=\"t5bfwr2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#b45309\"/></marker></defs><text x=\"490\" y=\"24\" font-size=\"13\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"bold\">Dos listas de derechos que no hay que confundir</text><rect x=\"20\" y=\"44\" width=\"460\" height=\"38\" rx=\"8\" fill=\"#e8efff\" stroke=\"#1d4ed8\" stroke-width=\"1.4\"/><text x=\"250\" y=\"67.025\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#1d4ed8\" font-weight=\"bold\">ART. 13 · QUIEN TIENE CAPACIDAD DE OBRAR</text><rect x=\"500\" y=\"44\" width=\"460\" height=\"38\" rx=\"8\" fill=\"#eaf6ee\" stroke=\"#15803d\" stroke-width=\"1.4\"/><text x=\"730\" y=\"66.85\" font-size=\"11\" text-anchor=\"middle\" fill=\"#15803d\" font-weight=\"bold\">ART. 53 · QUIEN ES INTERESADO EN UN PROCEDIMIENTO</text><text x=\"30\" y=\"102\" font-size=\"9.6\" text-anchor=\"start\" fill=\"#15181d\" font-weight=\"normal\">a) Comunicarse por el Punto de Acceso General</text><text x=\"510\" y=\"102\" font-size=\"9.6\" text-anchor=\"start\" fill=\"#15181d\" font-weight=\"normal\">a) Conocer el estado de la tramitación y el sentido del silencio</text><text x=\"30\" y=\"122\" font-size=\"9.6\" text-anchor=\"start\" fill=\"#15181d\" font-weight=\"normal\">b) Ser asistido en el uso de medios electrónicos</text><text x=\"510\" y=\"122\" font-size=\"9.6\" text-anchor=\"start\" fill=\"#15181d\" font-weight=\"normal\">b) Identificar a autoridades y personal responsable</text><text x=\"30\" y=\"142\" font-size=\"9.6\" text-anchor=\"start\" fill=\"#15181d\" font-weight=\"normal\">c) Usar las lenguas oficiales</text><text x=\"510\" y=\"142\" font-size=\"9.6\" text-anchor=\"start\" fill=\"#15181d\" font-weight=\"normal\">c) No presentar documentos originales</text><text x=\"30\" y=\"162\" font-size=\"9.6\" text-anchor=\"start\" fill=\"#15181d\" font-weight=\"normal\">d) Acceder a información pública, archivos y registros</text><text x=\"510\" y=\"162\" font-size=\"9.6\" text-anchor=\"start\" fill=\"#15181d\" font-weight=\"normal\">d) No presentar datos o documentos ya aportados</text><text x=\"30\" y=\"182\" font-size=\"9.6\" text-anchor=\"start\" fill=\"#15181d\" font-weight=\"normal\">e) Ser tratado con respeto y deferencia</text><text x=\"510\" y=\"182\" font-size=\"9.6\" text-anchor=\"start\" fill=\"#15181d\" font-weight=\"normal\">e) Formular alegaciones y aportar documentos</text><text x=\"30\" y=\"202\" font-size=\"9.6\" text-anchor=\"start\" fill=\"#15181d\" font-weight=\"normal\">f) Exigir responsabilidades</text><text x=\"510\" y=\"202\" font-size=\"9.6\" text-anchor=\"start\" fill=\"#15181d\" font-weight=\"normal\">f) Obtener información sobre requisitos de los proyectos</text><text x=\"30\" y=\"222\" font-size=\"9.6\" text-anchor=\"start\" fill=\"#15181d\" font-weight=\"normal\">g) Obtener y usar medios de identificación y firma</text><text x=\"510\" y=\"222\" font-size=\"9.6\" text-anchor=\"start\" fill=\"#15181d\" font-weight=\"normal\">g) Actuar asistido de asesor</text><text x=\"30\" y=\"242\" font-size=\"9.6\" text-anchor=\"start\" fill=\"#15181d\" font-weight=\"normal\">h) Protección de datos personales</text><text x=\"510\" y=\"242\" font-size=\"9.6\" text-anchor=\"start\" fill=\"#15181d\" font-weight=\"normal\">h) Cumplir obligaciones de pago por medios electrónicos</text><text x=\"30\" y=\"262\" font-size=\"9.6\" text-anchor=\"start\" fill=\"#15181d\" font-weight=\"normal\">i) Cualesquiera otros de la Constitución y las leyes</text><text x=\"510\" y=\"262\" font-size=\"9.6\" text-anchor=\"start\" fill=\"#15181d\" font-weight=\"normal\">i) Cualesquiera otros que les reconozcan la Constitución y las leyes</text><text x=\"490\" y=\"286\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"bold\">El art. 13 cierra diciendo que se entienden «sin perjuicio de los reconocidos en el artículo 53».</text></svg><details class=\"panel\" open><summary>Texto legal</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LPAC</span><p><b>Artículo 53. Derechos del interesado en el procedimiento administrativo.</b></p><p>1. Además del resto de derechos previstos en esta Ley, los interesados en un procedimiento administrativo, tienen los siguientes derechos:</p><p>a) A conocer, en cualquier momento, el estado de la tramitación de los procedimientos en los que tengan la condición de interesados; el sentido del silencio administrativo que corresponda, en caso de que la Administración no dicte ni notifique resolución expresa en plazo; el órgano competente para su instrucción, en su caso, y resolución; y los actos de trámite dictados. Asimismo, también tendrán derecho a acceder y a obtener copia de los documentos contenidos en los citados procedimientos. Quienes se relacionen con las Administraciones Públicas a través de medios electrónicos, tendrán derecho a consultar la información a la que se refiere el párrafo anterior, en el Punto de Acceso General electrónico de la Administración que funcionará como un portal de acceso. Se entenderá cumplida la obligación de la Administración de facilitar copias de los documentos contenidos en los procedimientos mediante la puesta a disposición de las mismas en el Punto de Acceso General electrónico de la Administración competente o en las sedes electrónicas que correspondan.</p><p>b) A identificar a las autoridades y al personal al servicio de las Administraciones Públicas bajo cuya responsabilidad se tramiten los procedimientos.</p><p>c) A no presentar documentos originales salvo que, de manera excepcional, la normativa reguladora aplicable establezca lo contrario. En caso de que, excepcionalmente, deban presentar un documento original, tendrán derecho a obtener una copia autenticada de éste.</p><p>d) A no presentar datos y documentos no exigidos por las normas aplicables al procedimiento de que se trate, que ya se encuentren en poder de las Administraciones Públicas o que hayan sido elaborados por éstas.</p><p>e) A formular alegaciones, utilizar los medios de defensa admitidos por el Ordenamiento Jurídico, y a aportar documentos en cualquier fase del procedimiento anterior al trámite de audiencia, que deberán ser tenidos en cuenta por el órgano competente al redactar la propuesta de resolución.</p><p>f) A obtener información y orientación acerca de los requisitos jurídicos o técnicos que las disposiciones vigentes impongan a los proyectos, actuaciones o solicitudes que se propongan realizar.</p><p>g) A actuar asistidos de asesor cuando lo consideren conveniente en defensa de sus intereses.</p><p>h) A cumplir las obligaciones de pago a través de los medios electrónicos previstos en el artículo 98.2.</p><p>i) Cualesquiera otros que les reconozcan la Constitución y las leyes.</p><p>2. Además de los derechos previstos en el apartado anterior, en el caso de procedimientos administrativos de naturaleza sancionadora, los presuntos responsables tendrán los siguientes derechos:</p><p>a) A ser notificado de los hechos que se le imputen, de las infracciones que tales hechos puedan constituir y de las sanciones que, en su caso, se les pudieran imponer, así como de la identidad del instructor, de la autoridad competente para imponer la sanción y de la norma que atribuya tal competencia.</p><p>b) A la presunción de no existencia de responsabilidad administrativa mientras no se demuestre lo contrario.</p></div></div></details><details class=\"panel\"><summary>Disección</summary><div class=\"body\"><ul>\n<li><b>a)</b> Conocer <b>en cualquier momento</b> el estado de la tramitación, <b>el sentido del silencio</b>, el órgano competente y los actos de trámite dictados; y <b>acceder y obtener copia</b> de los documentos. Quien se relaciona electrónicamente consulta esa información <b>en el Punto de Acceso General</b>, que funciona como portal de acceso.</li>\n<li><b>b)</b> Identificar a las autoridades y al personal responsable. <b>c)</b> <b>No presentar documentos originales</b>, salvo excepción normativa, y si han de presentarlos, obtener copia autenticada.</li>\n<li><b>d)</b> <b>No presentar datos y documentos no exigidos</b> o que ya estén en poder de la Administración. <b>e)</b> Formular alegaciones y aportar documentos en cualquier fase anterior al trámite de audiencia.</li>\n<li><b>f)</b> Obtener <b>información y orientación</b> sobre requisitos de los proyectos. <b>g)</b> Actuar <b>asistidos de asesor</b>. <b>h)</b> Cumplir las <b>obligaciones de pago</b> por los medios electrónicos del art. 98.2. <b>i)</b> Cualesquiera otros.</li>\n</ul></div></details><details class=\"panel\"><summary>En lenguaje llano</summary><div class=\"body\"><p>Una vez que tienes expediente, puedes saber en todo momento cómo va, quién lo lleva, qué pasa si no te contestan, y no te pueden pedir papeles que ya tienen.</p></div></details><details class=\"panel\"><summary>¿Por qué existe?</summary><div class=\"body\"><div class=\"interp\"><span class=\"lbl\">Interpretación · aportación externa</span>La letra d) es el corazón del artículo: el deber de no pedir lo que ya se tiene traslada a la Administración la carga de buscarlo en sus propios archivos, que es lo que realmente simplifica la vida al ciudadano.</div></div></details><details class=\"panel\"><summary>Ejemplos</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Ejemplo 1</span>Pides copia de un informe de tu expediente: la Administración cumple poniéndola a disposición en el Punto de Acceso General o en la sede.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 2</span>Te reclaman de nuevo el certificado de empadronamiento que ya aportaste: letra d), no procede.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 3</span>Caso límite: el derecho de alegaciones de la letra e) se ejerce <b>en cualquier fase anterior al trámite de audiencia</b>; después, el momento es otro.</div></div></details><details class=\"panel\"><summary>Trampas</summary><div class=\"body\"><div class=\"box warn\"><span class=\"lbl\">Cuidado</span>El derecho a conocer <b>el sentido del silencio</b> está aquí, en la letra a), y se pregunta mucho. Y fíjate en que para quien se relaciona electrónicamente el cauce de consulta es el <b>Punto de Acceso General</b>.</div></div></details><details class=\"panel\"><summary>Conexiones</summary><div class=\"body\"><p>Es la lista que el art. 13 declara intacta. Se apoya en el PAGe del art. 7 del RD 203/2021 y en la Carpeta Ciudadana del art. 8.</p></div></details><details class=\"panel\"><summary>Anclaje memorístico</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Para retenerlo</span>Lo que no te pueden pedir: <b>originales</b> (c) ni <b>lo que ya tienen</b> (d).</div></div></details></section><section class=\"card art\" id=\"lpac14\"><h2><span class=\"num\">LPAC 14</span> Derecho y obligación de relacionarse electrónicamente</h2><p class=\"ubic\">Ley 39/2015 ▸ Título I ▸ Capítulo I</p><div class=\"idea\">Las personas físicas eligen; cinco colectivos están obligados siempre.</div><svg viewBox=\"0 0 980 352\" width=\"100%\" role=\"img\" aria-label=\"Árbol de decisión sobre quién está obligado a relacionarse electrónicamente con la Administración\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"t5afrr2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#4b5563\"/></marker><marker id=\"t5afer2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#15803d\"/></marker><marker id=\"t5afwr2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#b45309\"/></marker></defs><text x=\"490\" y=\"24\" font-size=\"13\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"bold\">¿Estás obligado a relacionarte electrónicamente?</text><rect x=\"290\" y=\"40\" width=\"400\" height=\"38\" rx=\"8\" fill=\"#e8efff\" stroke=\"#1d4ed8\" stroke-width=\"1.4\"/><text x=\"490\" y=\"63.2\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1d4ed8\" font-weight=\"bold\">¿Quién realiza el trámite?</text><rect x=\"20\" y=\"108\" width=\"460\" height=\"34\" rx=\"8\" fill=\"#eaf6ee\" stroke=\"#15803d\" stroke-width=\"1.4\"/><text x=\"250\" y=\"128.85\" font-size=\"11\" text-anchor=\"middle\" fill=\"#15803d\" font-weight=\"bold\">PERSONA FÍSICA no incluida a la derecha</text><rect x=\"500\" y=\"108\" width=\"460\" height=\"34\" rx=\"8\" fill=\"#fdeceb\" stroke=\"#b91c1c\" stroke-width=\"1.4\"/><text x=\"730\" y=\"128.85\" font-size=\"11\" text-anchor=\"middle\" fill=\"#b91c1c\" font-weight=\"bold\">OBLIGADOS SIEMPRE · art. 14.2 LPAC</text><line x1=\"400\" y1=\"80\" x2=\"250\" y2=\"106\" stroke=\"#4b5563\" stroke-width=\"1.6\" marker-end=\"url(#t5afrr2)\"/><line x1=\"580\" y1=\"80\" x2=\"730\" y2=\"106\" stroke=\"#4b5563\" stroke-width=\"1.6\" marker-end=\"url(#t5afrr2)\"/><rect x=\"20\" y=\"150\" width=\"460\" height=\"112\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"250\" y=\"167.28\" font-size=\"10.8\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">ELIGE y puede cambiar de medio</text><text x=\"250\" y=\"184.28\" font-size=\"10.8\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">en cualquier momento (art. 14.1).</text><text x=\"250\" y=\"201.28\" font-size=\"10.8\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\"></text><text x=\"250\" y=\"218.28\" font-size=\"10.8\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Si opta por lo electrónico, los efectos</text><text x=\"250\" y=\"235.28\" font-size=\"10.8\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">llegan al 5.º DÍA HÁBIL siguiente</text><text x=\"250\" y=\"252.28\" font-size=\"10.8\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">(RD 203/2021, art. 3.2)</text><rect x=\"500\" y=\"150\" width=\"460\" height=\"112\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"730\" y=\"167.07\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">a) Personas jurídicas</text><text x=\"730\" y=\"184.07\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">b) Entidades sin personalidad jurídica</text><text x=\"730\" y=\"201.07\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">c) Profesionales de colegiación obligatoria</text><text x=\"730\" y=\"218.07\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">   —notarios y registradores incluidos—</text><text x=\"730\" y=\"235.07\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">d) Quien representa a un obligado</text><text x=\"730\" y=\"252.07\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">e) Empleados públicos, por su condición</text><rect x=\"20\" y=\"272\" width=\"940\" height=\"42\" rx=\"8\" fill=\"#fdf3e3\" stroke=\"#b45309\" stroke-width=\"1.4\"/><text x=\"490\" y=\"289.605\" font-size=\"10.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Y además (art. 14.3): por reglamento puede obligarse a ciertos colectivos de personas físicas por capacidad</text><text x=\"490\" y=\"303.605\" font-size=\"10.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">económica, técnica, dedicación profesional u otros motivos acreditados</text><text x=\"490\" y=\"334\" font-size=\"11\" text-anchor=\"middle\" fill=\"#b91c1c\" font-weight=\"bold\">Los obligados del 14.2 lo están para la realización de CUALQUIER TRÁMITE de un procedimiento administrativo.</text></svg><details class=\"panel\" open><summary>Texto legal</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LPAC</span><p><b>Artículo 14. Derecho y obligación de relacionarse electrónicamente con las Administraciones Públicas.</b></p><p>1. Las personas físicas podrán elegir en todo momento si se comunican con las Administraciones Públicas para el ejercicio de sus derechos y obligaciones a través de medios electrónicos o no, salvo que estén obligadas a relacionarse a través de medios electrónicos con las Administraciones Públicas. El medio elegido por la persona para comunicarse con las Administraciones Públicas podrá ser modificado por aquella en cualquier momento.</p><p>2. En todo caso, estarán obligados a relacionarse a través de medios electrónicos con las Administraciones Públicas para la realización de cualquier trámite de un procedimiento administrativo, al menos, los siguientes sujetos:</p><p>a) Las personas jurídicas.</p><p>b) Las entidades sin personalidad jurídica.</p><p>c) Quienes ejerzan una actividad profesional para la que se requiera colegiación obligatoria, para los trámites y actuaciones que realicen con las Administraciones Públicas en ejercicio de dicha actividad profesional. En todo caso, dentro de este colectivo se entenderán incluidos los notarios y registradores de la propiedad y mercantiles.</p><p>d) Quienes representen a un interesado que esté obligado a relacionarse electrónicamente con la Administración.</p><p>e) Los empleados de las Administraciones Públicas para los trámites y actuaciones que realicen con ellas por razón de su condición de empleado público, en la forma en que se determine reglamentariamente por cada Administración.</p><p>3. Reglamentariamente, las Administraciones podrán establecer la obligación de relacionarse con ellas a través de medios electrónicos para

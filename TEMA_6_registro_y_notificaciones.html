 documentos de un formato antiguo a uno vigente: el art. 17.2 lo exige expresamente.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 3</span>Caso límite: un servicio quiere borrar documentación antigua para liberar espacio. No puede: la eliminación requiere autorización.</div></div></details><details class=\"panel\"><summary>Trampas</summary><div class=\"body\"><div class=\"box warn\"><span class=\"lbl\">Cuidado</span>El archivo único es de <b>procedimientos finalizados</b>. Los expedientes en tramitación no están ahí.</div></div></details><details class=\"panel\"><summary>Conexiones</summary><div class=\"body\"><p>Se desarrolla en el art. 55 del RD 203/2021 y se apoya en el Esquema Nacional de Seguridad.</p></div></details><details class=\"panel\"><summary>Anclaje memorístico</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Para retenerlo</span><b>Único</b>, de <b>finalizados</b>, y <b>no se borra sin autorización</b>.</div></div></details></section><section class=\"card art\" id=\"rd203_55\"><h2><span class=\"num\">RD 203/2021 55</span> Archivo electrónico único</h2><p class=\"ubic\">RD 203/2021 ▸ Capítulo V «Documento y expediente electrónicos» ▸ Sección 3.ª</p><div class=\"idea\">Define el archivo único como conjunto de sistemas y servicios, no como un local.</div><svg viewBox=\"0 0 960 230\" width=\"100%\" role=\"img\" aria-label=\"Requisitos del archivo electrónico único de documentos de procedimientos finalizados\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"t6hfrr2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#4b5563\"/></marker><marker id=\"t6hfer2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#15803d\"/></marker><marker id=\"t6hfwr2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#b45309\"/></marker></defs><text x=\"480\" y=\"24\" font-size=\"13\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"bold\">El archivo electrónico único · art. 17 LPAC y art. 55 RD 203/2021</text><rect x=\"20\" y=\"44\" width=\"920\" height=\"36\" rx=\"8\" fill=\"#e8efff\" stroke=\"#1d4ed8\" stroke-width=\"1.4\"/><text x=\"480\" y=\"65.85\" font-size=\"11\" text-anchor=\"middle\" fill=\"#1d4ed8\" font-weight=\"bold\">Cada Administración mantiene UN archivo electrónico ÚNICO de los documentos de PROCEDIMIENTOS FINALIZADOS</text><rect x=\"20\" y=\"94\" width=\"450\" height=\"66\" rx=\"8\" fill=\"#eaf6ee\" stroke=\"#15803d\" stroke-width=\"1.4\"/><text x=\"245\" y=\"108.105\" font-size=\"10.3\" text-anchor=\"middle\" fill=\"#15803d\" font-weight=\"bold\">EL FORMATO debe garantizar</text><text x=\"245\" y=\"123.105\" font-size=\"10.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">autenticidad · integridad · conservación</text><text x=\"245\" y=\"138.105\" font-size=\"10.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">y la consulta con independencia</text><text x=\"245\" y=\"153.105\" font-size=\"10.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">del tiempo transcurrido</text><rect x=\"490\" y=\"94\" width=\"450\" height=\"66\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"715\" y=\"108.105\" font-size=\"10.3\" text-anchor=\"middle\" fill=\"#4b5563\" font-weight=\"bold\">LOS SOPORTES, conforme al</text><text x=\"715\" y=\"123.105\" font-size=\"10.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">ESQUEMA NACIONAL DE SEGURIDAD:</text><text x=\"715\" y=\"138.105\" font-size=\"10.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">integridad, autenticidad, confidencialidad,</text><text x=\"715\" y=\"153.105\" font-size=\"10.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">calidad, protección y conservación</text><text x=\"480\" y=\"186\" font-size=\"10.8\" text-anchor=\"middle\" fill=\"#b91c1c\" font-weight=\"bold\">La ELIMINACIÓN de documentos debe ser AUTORIZADA conforme a la normativa aplicable: no se borra nada por decisión propia.</text><text x=\"480\" y=\"212\" font-size=\"10.4\" text-anchor=\"middle\" fill=\"#4b5563\" font-weight=\"normal\">Se asegurará la posibilidad de trasladar los datos a otros formatos y soportes accesibles desde distintas aplicaciones.</text></svg><details class=\"panel\" open><summary>Texto legal</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · RD 203/2021</span><p><b>Artículo 55. Archivo electrónico único.</b></p><p>1. El archivo electrónico único de cada Administración es el conjunto de sistemas y servicios que sustenta la gestión, custodia y recuperación de los documentos y expedientes electrónicos así como de otras agrupaciones documentales o de información una vez finalizados los procedimientos administrativos o actuaciones correspondientes.</p><p>2. En el archivo electrónico único de la Administración General del Estado serán accesibles todos los documentos y expedientes electrónicos del sector público estatal una vez finalizados los procedimientos y en los plazos determinados por la Comisión Superior Calificadora de Documentos Administrativos de acuerdo con lo que se desarrolle reglamentariamente. La gestión del archivo electrónico único garantizará la autenticidad, conservación, integridad, confidencialidad, disponibilidad y cadena de custodia de los expedientes y documentos almacenados, así como su acceso, en las condiciones exigidas por el Esquema Nacional de Interoperabilidad y el Esquema Nacional de Seguridad, por la normativa de transparencia, acceso a la información pública y buen gobierno, por la legislación de archivos y patrimonio histórico y cultural y por la normativa específica que sea de aplicación, de acuerdo con lo que se desarrolle reglamentariamente.</p></div></div></details><details class=\"panel\"><summary>Disección</summary><div class=\"body\"><ul>\n<li><b>Qué es (55.1):</b> el <b>conjunto de sistemas y servicios</b> que sustenta la <b>gestión, custodia y recuperación</b> de documentos y expedientes electrónicos y otras agrupaciones documentales, <b>una vez finalizados</b> los procedimientos.</li>\n<li><b>Garantías (55.2):</b> su gestión garantiza <b>autenticidad, conservación, integridad, confidencialidad, disponibilidad y cadena de custodia</b>, y el acceso en las condiciones del Esquema Nacional de Seguridad.</li>\n</ul></div></details><details class=\"panel\"><summary>En lenguaje llano</summary><div class=\"body\"><p>El archivo único no es una sala con estanterías: es el sistema informático que guarda y permite recuperar lo que ya terminó.</p></div></details><details class=\"panel\"><summary>¿Por qué existe?</summary><div class=\"body\"><div class=\"interp\"><span class=\"lbl\">Interpretación · aportación externa</span>Definirlo como conjunto de sistemas y servicios permite que esté distribuido técnicamente pero sea único jurídicamente, que es lo que hace viable la obligación del art. 17.1.</div></div></details><details class=\"panel\"><summary>Ejemplos</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Ejemplo 1</span>Un expediente de licencia terminado se custodia en el archivo único con su cadena de custodia.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 2</span>Se consulta años después un expediente archivado: el sistema debe permitir recuperarlo íntegro.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 3</span>Caso límite: «cadena de custodia» significa poder acreditar quién tuvo acceso y cuándo; no basta con conservar el fichero.</div></div></details><details class=\"panel\"><summary>Trampas</summary><div class=\"body\"><div class=\"box warn\"><span class=\"lbl\">Cuidado</span>«Único» no quiere decir «un solo servidor»: quiere decir un solo archivo <b>en sentido jurídico</b> por Administración.</div></div></details><details class=\"panel\"><summary>Conexiones</summary><div class=\"body\"><p>Desarrolla el art. 17 LPAC.</p></div></details><details class=\"panel\"><summary>Anclaje memorístico</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Para retenerlo</span>Archivo único = <b>sistemas y servicios</b>, no un local.</div></div></details></section><section class=\"card art\" id=\"lpac40\"><h2><span class=\"num\">LPAC 40</span> Notificación</h2><p class=\"ubic\">Ley 39/2015 ▸ Título III «De los actos administrativos» ▸ Capítulo II «Eficacia de los actos»</p><div class=\"idea\">Diez días para cursarla, y qué debe contener para que surta efecto.</div><details class=\"panel\" open><summary>Texto legal</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LPAC</span><p><b>Artículo 40. Notificación.</b></p><p>1. El órgano que dicte las resoluciones y actos administrativos los notificará a los interesados cuyos derechos e intereses sean afectados por aquéllos, en los términos previstos en los artículos siguientes.</p><p>2. Toda notificación deberá ser cursada dentro del plazo de diez días a partir de la fecha en que el acto haya sido dictado, y deberá contener el texto íntegro de la resolución, con indicación de si pone fin o no a la vía administrativa, la expresión de los recursos que procedan, en su caso, en vía administrativa y judicial, el órgano ante el que hubieran de presentarse y el plazo para interponerlos, sin perjuicio de que los interesados puedan ejercitar, en su caso, cualquier otro que estimen procedente.</p><p>3. Las notificaciones que, conteniendo el texto íntegro del acto, omitiesen alguno de los demás requisitos previstos en el apartado anterior, surtirán efecto a partir de la fecha en que el interesado realice actuaciones que supongan el conocimiento del contenido y alcance de la resolución o acto objeto de la notificación, o interponga cualquier recurso que proceda.</p><p>4. Sin perjuicio de lo establecido en el apartado anterior, y a los solos efectos de entender cumplida la obligación de notificar dentro del plazo máximo de duración de los procedimientos, será suficiente la notificación que contenga, cuando menos, el texto íntegro de la resolución, así como el intento de notificación debidamente acreditado.</p><p>5. Las Administraciones Públicas podrán adoptar las medidas que consideren necesarias para la protección de los datos personales que consten en las resoluciones y actos administrativos, cuando éstos tengan por destinatarios a más de un interesado.</p></div></div></details><details class=\"panel\"><summary>Disección</summary><div class=\"body\"><ul>\n<li><b>Plazo (40.2):</b> toda notificación debe ser <b>cursada dentro del plazo de diez días</b> a partir de la fecha en que el acto <b>haya sido dictado</b>.</li>\n<li><b>Contenido (40.2):</b> <b>texto íntegro</b> de la resolución, indicación de <b>si pone fin o no a la vía administrativa</b>, los <b>recursos</b> que procedan en vía administrativa y judicial, el <b>órgano</b> ante el que presentarlos y el <b>plazo</b> para interponerlos.</li>\n<li><b>Notificación defectuosa (40.3):</b> la que contiene el texto íntegro pero omite alguno de los demás requisitos <b>surte efecto</b> desde que el interesado realice actuaciones que supongan conocimiento del contenido y alcance, <b>o interponga cualquier recurso</b>.</li>\n<li><b>A efectos del plazo máximo (40.4):</b> para entender cumplida la obligación de notificar dentro del plazo máximo del procedimiento basta la notificación que contenga <b>al menos el texto íntegro</b> y el <b>intento de notificación debidamente acreditado</b>.</li>\n</ul></div></details><details class=\"panel\"><summary>En lenguaje llano</summary><div class=\"body\"><p>Dictado el acto, hay diez días para echarlo al correo o ponerlo en la sede. Y para que no se te pase el plazo del procedimiento basta con el intento acreditado, aunque el interesado no lo recoja.</p></div></details><details class=\"panel\"><summary>¿Por qué existe?</summary><div class=\"body\"><div class=\"interp\"><span class=\"lbl\">Interpretación · aportación externa</span>El apartado 4 separa dos cosas que se confunden: que la notificación surta efectos frente al interesado y que la Administración haya cumplido su plazo. Sin esa separación, cualquier ciudadano podría provocar la caducidad o el silencio simplemente no recogiendo.</div></div></details><details class=\"panel\"><summary>Ejemplos</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Ejemplo 1</span>Resolución dictada el 2 de noviembre: debe cursarse como máximo el 12 de noviembre.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 2</span>Notificación sin indicación de recursos: el interesado interpone uno y queda convalidada por el 40.3.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 3</span>Caso límite: el interesado no recoge nada, pero consta el intento acreditado y el texto íntegro. El plazo máximo del procedimiento se entiende cumplido (40.4).</div></div></details><details class=\"panel\"><summary>Trampas</summary><div class=\"body\"><div class=\"box warn\"><span class=\"lbl\">Cuidado</span>Los <b>diez días</b> se cuentan desde que el acto <b>se dicta</b>, no desde que se recibe. Y son días hábiles, por la regla general del art. 30.2.</div></div></details><details class=\"panel\"><summary>Conexiones</summary><div class=\"body\"><p>Con el art. 21 —plazo máximo de resolución— y con el art. 43.3, que precisa que la puesta a disposición cumple el 40.4.</p></div></details><details class=\"panel\"><summary>Anclaje memorístico</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Para retenerlo</span><b>Diez días</b> para cursarla, y para el plazo máximo basta el <b>intento acreditado</b>.</div></div></details></section><section class=\"card art\" id=\"lpac41\"><h2><span class=\"num\">LPAC 41</span> Condiciones generales para la práctica de las notificaciones</h2><p class=\"ubic\">Ley 39/2015 ▸ Título III ▸ Capítulo II</p><div class=\"idea\">Preferentemente electrónicas; dos excepciones en papel y dos prohibiciones absolutas.</div><svg viewBox=\"0 0 980 330\" width=\"100%\" role=\"img\" aria-label=\"Cuándo la notificación es electrónica, cuándo puede ser en papel y cuándo no puede ser electrónica\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"t6cfrr2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#4b5563\"/></marker><marker id=\"t6cfer2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#15803d\"/></marker><marker id=\"t6cfwr2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#b45309\"/></marker></defs><text x=\"490\" y=\"24\" font-size=\"13\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"bold\">Electrónica o en papel: el árbol del art. 41 LPAC</text><rect x=\"290\" y=\"40\" width=\"400\" height=\"38\" rx=\"8\" fill=\"#e8efff\" stroke=\"#1d4ed8\" stroke-width=\"1.4\"/><text x=\"490\" y=\"63.2\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1d4ed8\" font-weight=\"bold\">¿Cómo se notifica?</text><rect x=\"20\" y=\"106\" width=\"460\" height=\"34\" rx=\"8\" fill=\"#eaf6ee\" stroke=\"#15803d\" stroke-width=\"1.4\"/><text x=\"250\" y=\"127.025\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#15803d\" font-weight=\"bold\">PREFERENTEMENTE ELECTRÓNICA</text><rect x=\"500\" y=\"106\" width=\"460\" height=\"34\" rx=\"8\" fill=\"#fdeceb\" stroke=\"#b91c1c\" stroke-width=\"1.4\"/><text x=\"730\" y=\"126.85\" font-size=\"11\" text-anchor=\"middle\" fill=\"#b91c1c\" font-weight=\"bold\">Y SIEMPRE si el interesado está OBLIGADO</text><line x1=\"400\" y1=\"80\" x2=\"250\" y2=\"104\" stroke=\"#4b5563\" stroke-width=\"1.6\" marker-end=\"url(#t6cfrr2)\"/><line x1=\"580\" y1=\"80\" x2=\"730\" y2=\"104\" stroke=\"#4b5563\" stroke-width=\"1.6\" marker-end=\"url(#t6cfrr2)\"/><rect x=\"20\" y=\"150\" width=\"460\" height=\"84\" rx=\"8\" fill=\"#fdf3e3\" stroke=\"#b45309\" stroke-width=\"1.4\"/><text x=\"250\" y=\"165.57\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"bold\">EXCEPCIONES · pueden ser EN PAPEL (41.1)</text><text x=\"250\" y=\"180.57\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">a) Comparecencia espontánea del interesado</text><text x=\"250\" y=\"195.57\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">en la oficina de asistencia, si lo pide</text><text x=\"250\" y=\"210.57\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">b) Entrega directa por empleado público</text><text x=\"250\" y=\"225.57\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">para asegurar la eficacia de la actuación</text><rect x=\"500\" y=\"150\" width=\"460\" height=\"84\" rx=\"8\" fill=\"#fdeceb\" stroke=\"#b91c1c\" stroke-width=\"1.4\"/><text x=\"730\" y=\"165.57\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#b91c1c\" font-weight=\"bold\">PROHIBIDAS por vía electrónica (41.2)</text><text x=\"730\" y=\"180.57\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">a) Actos con elementos NO susceptibles</text><text x=\"730\" y=\"195.57\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">de conversión a formato electrónico</text><text x=\"730\" y=\"210.57\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">b) Las que contengan MEDIOS DE PAGO</text><text x=\"730\" y=\"225.57\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">a favor de los obligados, como cheques</text><rect x=\"20\" y=\"246\" width=\"940\" height=\"40\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"490\" y=\"262.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Sea cual sea el medio, la notificación vale si permite constancia de: envío o puesta a disposición · recepción o acceso · fechas y horas ·</text><text x=\"490\" y=\"276.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">contenido íntegro · identidad fidedigna de remitente y destinatario. Y la acreditación se incorpora al expediente.</text><text x=\"490\" y=\"310\" font-size=\"11\" text-anchor=\"middle\" fill=\"#b91c1c\" font-weight=\"bold\">El aviso al móvil o al correo es MERAMENTE INFORMATIVO: su falta no impide que la notificación sea plenamente válida.</text></svg><details class=\"panel\" open><summary>Texto legal</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LPAC</span><p><b>Artículo 41. Condiciones generales para la práctica de las notificaciones.</b></p><p>1. Las notificaciones se practicarán preferentemente por medios electrónicos y, en todo caso, cuando el interesado resulte obligado a recibirlas por esta vía. No obstante lo anterior, las Administraciones podrán practicar las notificaciones por medios no electrónicos en los siguientes supuestos:</p><p>a) Cuando la notificación se realice con ocasión de la comparecencia espontánea del interesado o su representante en las oficinas de asistencia en materia de registro y solicite la comunicación o notificación personal en ese momento.</p><p>b) Cuando para asegurar la eficacia de la actuación administrativa resulte necesario practicar la notificación por entrega directa de un empleado público de la Administración notificante. Con independencia del medio utilizado, las notificaciones serán válidas siempre que permitan tener constancia de su envío o puesta a disposición, de la recepción o acceso por el interesado o su representante, de sus fechas y horas, del contenido íntegro, y de la identidad fidedigna del remitente y destinatario de la misma. La acreditación de la notificación efectuada se incorporará al expediente. Los interesados que no estén obligados a recibir notificaciones electrónicas, podrán decidir y comunicar en cualquier momento a la Administración Pública, mediante los modelos normalizados que se establezcan al efecto, que las notificaciones sucesivas se practiquen o dejen de practicarse por medios electrónicos. Reglamentariamente, las Administraciones podrán establecer la obligación de practicar electrónicamente las notificaciones para determinados procedimientos y para ciertos colectivos de personas físicas que por razón de su capacidad económica, técnica, dedicación profesional u otros motivos quede acreditado que tienen acceso y disponibilidad de los medios electrónicos necesarios. Adicionalmente, el interesado podrá identificar un dispositivo electrónico y/o una dirección de correo electrónico que servirán para el envío de los avisos regulados en este artículo, pero no para la práctica de notificaciones.</p><p>2. En ningún caso se efectuarán por medios electrónicos las siguientes notificaciones:</p><p>a) Aquellas en las que el acto a notificar vaya acompañado de elementos que no sean susceptibles de conversión en formato electrónico.</p><p>b) Las que contengan medios de pago a favor de los obligados, tales como cheques.</p><p>3. En los procedimientos iniciados a solicitud del interesado, la notificación se practicará por el medio señalado al efecto por aquel. Esta notificación será electrónica en los casos en los que exista obligación de relacionarse de esta forma con la Administración. Cuando no fuera posible realizar la notificación de acuerdo con lo señalado en la solicitud, se practicará en cualquier lugar adecuado a tal fin, y por cualquier medio que permita tener constancia de la recepción por el interesado o su representante, así como de la fecha, la identidad y el contenido del acto notificado.</p><p>4. En los procedimientos iniciados de oficio, a los solos efectos de su iniciación, las Administraciones Públicas podrán recabar, mediante consulta a las bases de datos del Instituto Nacional de Estadística, los datos sobre el domicilio del interesado recogidos en el Padrón Municipal, remitidos por las Entidades Locales en aplicación de lo previsto en la Ley 7/1985, de 2 de abril, reguladora de las Bases del Régimen Local.</p><p>5. Cuando el interesado o su representante rechace la notificación de una actuación administrativa, se hará constar en el expediente, especificándose las circunstancias del intento de notificación y el medio, dando por efectuado el trámite y siguiéndose el procedimiento.</p><p>6. Con independencia de que la notificación se realice en papel o por medios electrónicos, las Administraciones Públicas enviarán un aviso al dispositivo electrónico y/o a la dirección de correo electrónico del interesado que éste haya comunicado, informándole de la puesta a disposición de una notificación en la sede electrónica de la Administración u Organismo correspondiente o en la dirección electrónica habilitada única. La falta de práctica de este aviso no impedirá que la notificación sea considerada plenamente válida.</p><p>7. Cuando el interesado fuera notificado por distintos cauces, se tomará como fecha de notificación la de aquélla que se hubiera producido en primer lugar.</p></div></div></details><details class=\"panel\"><summary>Disección</summary><div class=\"body\"><ul>\n<li><b>Regla (41.1):</b> <b>preferentemente por medios electrónicos</b> y, <b>en todo caso</b>, cuando el interesado esté obligado a recibirlas así.</li>\n<li><b>Pueden ser en papel:</b> <b>a)</b> con ocasión de la <b>comparecencia espontánea</b> del interesado o su representante en la oficina de asistencia, si solicita la notificación personal en ese momento; <b>b)</b> cuando para <b>asegurar la eficacia</b> de la actuación sea necesaria la <b>entrega directa por un empleado público</b>.</li>\n<li><b>Validez, sea cual sea el medio:</b> constancia del <b>envío o puesta a disposición</b>, de la <b>recepción o acceso</b>, de <b>fechas y horas</b>, del <b>contenido íntegro</b> y de la <b>identidad fidedigna</b> de remitente y destinatario. La acreditación <b>se incorpora al expediente</b>.</li>\n<li><b>Nunca electrónicas (41.2):</b> <b>a)</b> cuando el acto vaya acompañado de <b>elementos no susceptibles de conversión en formato electrónico</b>; <b>b)</b> las que contengan <b>medios de pago</b> a favor de los obligados, como <b>cheques</b>.</li>\n<li><b>Procedimientos a solicitud (41.3):</b> se notifica por el <b>medio señalado por el interesado</b>, salvo que exista obligación electrónica.</li>\n<li><b>El aviso:</b> el interesado puede identificar un dispositivo o correo <b>para los avisos, pero no para la práctica de notificaciones</b>.</li>\n</ul></div></details><details class=\"panel\"><summary>En lenguaje llano</summary><div class=\"body\"><p>Lo normal es electrónico. Solo se va al papel si te plantas en la oficina y lo pides, o si hay que entregarlo en mano para que surta efecto. Y hay dos cosas que nunca viajan por vía electrónica: lo que no cabe en un fichero y los cheques.</p></div></details><details class=\"panel\"><summary>¿Por qué existe?</summary><div class=\"body\"><div class=\"interp\"><span class=\"lbl\">Interpretación · aportación externa</span>Las dos prohibiciones del 41.2 son de puro sentido común material: un objeto no se convierte en PDF y un cheque electrónico no se cobra. El legislador prefirió decirlo que dejarlo a la interpretación.</div></div></details><details class=\"panel\"><summary>Ejemplos</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Ejemplo 1</span>Un vecino pasa por la oficina y pide que le entreguen allí mismo la resolución: letra a) del 41.1.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 2</span>Una resolución que devuelve un ingreso mediante cheque: prohibida la vía electrónica por el 41.2.b).</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 3</span>Caso límite: el interesado dio su móvil para avisos y no recibió el aviso. La notificación sigue siendo válida: el aviso es meramente informativo.</div></div></details><details class=\"panel\"><summary>Trampas</summary><div class=\"body\"><div class=\"box warn\"><span class=\"lbl\">Cuidado</span>Tres pares que se cruzan en los test: <b>excepciones</b> (pueden ser en papel) frente a <b>prohibiciones</b> (nunca electrónicas); y el <b>aviso</b> frente a la <b>notificación</b>. El móvil sirve para avisar, nunca para notificar.</div></div></details><details class=\"panel\"><summary>Conexiones</summary><div class=\"body\"><p>Con el art. 14 —obligados—, con el art. 43 —práctica electrónica— y con el art. 43 del RD 203/2021 —aviso de puesta a disposición—.</p></div></details><details class=\"panel\"><summary>Anclaje memorístico</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Para retenerlo</span>Dos <b>excepciones</b>: comparecencia espontánea y entrega directa. Dos <b>prohibiciones</b>: lo no convertible y los cheques.</div></div></details></section><section class=\"card art\" id=\"rd203_43\"><h2><span class=\"num\">RD 203/2021 43</span> Aviso de puesta a disposición de la notificación</h2><p class=\"ubic\">RD 203/2021 ▸ Capítulo IV ▸ Sección 2.ª</p><div class=\"idea\">El aviso es informativo: su falta no invalida la notificación.</div><details class=\"panel\" open><summary>Texto legal</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · RD 203/2021</span><p><b>Artículo 43. Aviso de puesta a disposición de la notificación.</b></p><p>1. De acuerdo con lo previsto en el artículo 41.6 de la Ley 39/2015, de 1 de octubre, con independencia de que la notificación se realice en papel o por medios electrónicos, las Administraciones Públicas, organismos públicos o entidades de derecho público vinculados o dependientes enviarán al interesado o, en su caso, a su representante, aviso informándole de la puesta a disposición de la notificación bien en la Dirección Electrónica Habilitada única, bien en la sede electrónica o sede electrónica asociada de la Administración, u Organismo o Entidad o, en su caso, en ambas. La falta de práctica de este aviso, de carácter meramente informativo, no impedirá que la notificación sea considerada plenamente válida. El aviso se remitirá al dispositivo electrónico o la dirección de correo electrónico que el interesado haya comunicado voluntariamente al efecto, o a ambos, de acuerdo con lo previsto en el artículo 41.1 de la Ley 39/2015, de 1 de octubre. El interesado se hace responsable, por la comunicación a la Administración, organismo público o entidad de derecho público vinculado o dependiente, de que dispone de acceso al dispositivo o dirección de correo electrónico designados. En caso de que dejen de estar operativos o pierda la posibilidad de acceso, el interesado está obligado a comunicar a la Administración que no se realice el aviso en tales medios. El incumplimiento de esta obligación por parte del interesado no conllevará responsabilidad alguna para la Administración por los avisos efectuados a dichos medios no operativos. El aviso regulado en este apartado sólo se practicará en caso de que el interesado o su representante hayan comunicado a la Administración un dispositivo electrónico o dirección de correo electrónico al efecto.</p><p>2. Cuando el interesado sea un sujeto obligado a relacionarse por medios electrónicos y la Administración emisora de la notificación no disponga de datos de contacto electrónicos para practicar el aviso de su puesta a disposición, en los procedimientos iniciados de oficio la primera notificación que efectúe la Administración, organismo o entidad se realizará en papel en la forma determinada por el artículo 42.2 de la Ley 39/2015, de 1 de octubre, advirtiendo al interesado en esa primera notificación que las sucesivas se practicarán en forma electrónica por comparecencia en la sede electrónica o sede electrónica asociada que corresponda o, en su caso, a través de la Dirección Electrónica Habilitada única según haya dispuesto para sus notificaciones la Administración, organismo o entidad respectivo, y dándole a conocer que, de acuerdo con lo previsto en el artículo 41.1 de la Ley 39/2015, de 1 de octubre, puede identificar un dispositivo electrónico, una dirección de correo electrónico o ambos para el aviso de la puesta a disposición de las notificaciones electrónicas posteriores.</p><p>3. Las Administraciones podrán crear bases de datos de contacto electrónico para la práctica de los avisos de puesta a disposición de notificaciones en su respectivo ámbito.</p></div></div></details><details class=\"panel\"><summary>Disección</summary><div class=\"body\"><ul>\n<li><b>Obligación de avisar (43.1):</b> <b>con independencia de que la notificación sea en papel o electrónica</b>, se enviará al interesado o a su representante un <b>aviso</b> informándole de la puesta a disposición, en la <b>Dirección Electrónica Habilitada única</b>, en la <b>sede</b> o en ambas.</li>\n<li><b>La frase clave:</b> «La falta de práctica de este aviso, <b>de carácter meramente informativo, no impedirá que la notificación sea considerada plenamente válida</b>».</li>\n<li><b>Dónde se envía:</b> al dispositivo electrónico o dirección de correo que el interesado haya comunicado <b>voluntariamente</b>.</li>\n</ul></div></details><details class=\"panel\"><summary>En lenguaje llano</summary><div class=\"body\"><p>Te avisan por cortesía y por eficacia, pero el aviso no es la notificación. Si no te llega el SMS, el plazo corre igual.</p></div></details><details class=\"panel\"><summary>¿Por qué existe?</summary><div class=\"body\"><div class=\"interp\"><span class=\"lbl\">Interpretación · aportación externa</span>Si el aviso fuese constitutivo, cualquier fallo de la operadora telefónica invalidaría notificaciones en masa. La ley separa el canal de cortesía del canal jurídico.</div></div></details><details class=\"panel\"><summary>Ejemplos</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Ejemplo 1</span>Un interesado no recibe el SMS y deja pasar los diez días: la notificación se entiende rechazada igualmente.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 2</span>El aviso llega también en las notificaciones en papel, porque estas se ponen a disposición en la sede.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 3</span>Caso límite: el interesado no comunicó ningún dispositivo. No hay aviso que enviar, y no pasa nada.</div></div></details><details class=\"panel\"><summary>Trampas</summary><div class=\"body\"><div class=\"box warn\"><span class=\"lbl\">Cuidado</span>Esta es de las preguntas más repetidas del bloque electrónico. La respuesta es siempre la misma: <b>la falta de aviso no invalida la notificación</b>.</div></div></details><details class=\"panel\"><summary>Conexiones</summary><div class=\"body\"><p>Desarrolla el art. 41.6 LPAC. Enlaza con el art. 43.2 LPAC —los diez días naturales—.</p></div></details><details class=\"panel\"><summary>Anclaje memorístico</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Para retenerlo</span>El aviso es <b>meramente informativo</b>. Grábalo con esas dos palabras.</div></div></details></section><section class=\"card art\" id=\"lpac43\"><h2><span class=\"num\">LPAC 43</span> Práctica de las notificaciones a través de medios electrónicos</h2><p class=\"ubic\">Ley 39/2015 ▸ Título III ▸ Capítulo II</p><div class=\"idea\">Comparecencia en sede o dirección habilitada; diez días naturales sin acceder es rechazo.</div><svg viewBox=\"0 0 960 268\" width=\"100%\" role=\"img\" aria-label=\"Cómo se practica la notificación electrónica y cuándo se entiende rechazada por el transcurso de diez días naturales\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"t6dfr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#4b5563\"/></marker><marker id=\"t6dfe\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#15803d\"/></marker><marker id=\"t6dfw\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#b45309\"/></marker></defs><text x=\"480\" y=\"24\" font-size=\"13\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"bold\">La notificación electrónica · art. 43 LPAC</text><rect x=\"20\" y=\"44\" width=\"920\" height=\"38\" rx=\"8\" fill=\"#e8efff\" stroke=\"#1d4ed8\" stroke-width=\"1.4\"/><text x=\"480\" y=\"66.71\" font-size=\"10.6\" text-anchor=\"middle\" fill=\"#1d4ed8\" font-weight=\"bold\">SE PRACTICA mediante COMPARECENCIA EN LA SEDE, a través de la DIRECCIÓN ELECTRÓNICA HABILITADA ÚNICA, o por ambos</text><rect x=\"20\" y=\"98\" width=\"450\" height=\"62\" rx=\"8\" fill=\"#eaf6ee\" stroke=\"#15803d\" stroke-width=\"1.4\"/><text x=\"245\" y=\"116.85\" font-size=\"11\" text-anchor=\"middle\" fill=\"#15803d\" font-weight=\"bold\">SI ACCEDE AL CONTENIDO</text><text x=\"245\" y=\"132.85\" font-size=\"11\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Se entiende PRACTICADA en el momento</text><text x=\"245\" y=\"148.85\" font-size=\"11\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">en que se produce el acceso</text><rect x=\"490\" y=\"98\" width=\"450\" height=\"62\" rx=\"8\" fill=\"#fdeceb\" stroke=\"#b91c1c\" stroke-width=\"1.4\"/><text x=\"715\" y=\"116.71\" font-size=\"10.6\" text-anchor=\"middle\" fill=\"#b91c1c\" font-weight=\"bold\">SI NO ACCEDE</text><text x=\"715\" y=\"132.71\" font-size=\"10.6\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Se entiende RECHAZADA al transcurrir</text><text x=\"715\" y=\"148.71\" font-size=\"10.6\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">10 DÍAS NATURALES desde la puesta a disposición</text><rect x=\"20\" y=\"174\" width=\"920\" height=\"38\" rx=\"8\" fill=\"#fdf3e3\" stroke=\"#b45309\" stroke-width=\"1.4\"/><text x=\"480\" y=\"196.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">El rechazo presunto solo opera cuando la notificación es OBLIGATORIA o ha sido EXPRESAMENTE ELEGIDA por el interesado</text><text x=\"480\" y=\"232\" font-size=\"10.8\" text-anchor=\"middle\" fill=\"#b91c1c\" font-weight=\"bold\">Comparecer en la sede = acceder al contenido estando debidamente identificado. Abrir el aviso del móvil NO es comparecer.</text><text x=\"480\" y=\"256\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#4b5563\" font-weight=\"normal\">Los interesados pueden acceder a sus notificaciones desde el Punto de Acceso General, que funciona como portal (43.4).</text></svg><details class=\"panel\" open><summary>Texto legal</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LPAC</span><p><b>Artículo 43. Práctica de las notificaciones a través de medios electrónicos.</b></p><p>1. Las notificaciones por medios electrónicos se practicarán mediante comparecencia en la sede electrónica de la Administración u Organismo actuante, a través de la dirección electrónica habilitada única o mediante ambos sistemas, según disponga cada Administración u Organismo. A los efectos previstos en este artículo, se entiende por comparecencia en la sede electrónica, el acceso por el interesado o su representante debidamente identificado al contenido de la notificación.</p><p>2. Las notificaciones por medios electrónicos se entenderán practicadas en el momento en que se produzca el acceso a su contenido. Cuando la notificación por medios electrónicos sea de carácter obligatorio, o haya sido expresamente elegida por el interesado, se entenderá rechazada cuando hayan transcurrido diez días naturales desde la puesta a disposición de la notificación sin que se acceda a su contenido.</p><p>3. Se entenderá cumplida la obligación a la que se refiere el artículo 40.4 con la puesta a disposición de la notificación en la sede electrónica de la Administración u Organismo actuante o en la dirección electrónica habilitada única.</p><p>4. Los interesados podrán acceder a las notificaciones desde el Punto de Acceso General electrónico de la Administración, que funcionará como un portal de acceso.</p></div></div></details><details class=\"panel\"><summary>Disección</summary><div class=\"body\"><ul>\n<li><b>Cómo (43.1):</b> mediante <b>comparecencia en la sede electrónica</b>, a través de la <b>Dirección Electrónica Habilitada única</b>, o por <b>ambos sistemas</b>, según disponga cada Administración. Comparecer en la sede es <b>el acceso al contenido por el interesado o su representante debidamente identificado</b>.</li>\n<li><b>Cuándo se entiende practicada (43.2):</b> <b>en el momento en que se produzca el acceso a su contenido</b>.</li>\n<li><b>El rechazo presunto (43.2):</b> cuando la notificación electrónica sea <b>obligatoria</b> o haya sido <b>expresamente elegida</b>, se entiende <b>rechazada</b> al transcurrir <b>diez días naturales</b> desde la puesta a disposición <b>sin acceder a su contenido</b>.</li>\n<li><b>Plazo máximo del procedimiento (43.3):</b> la obligación del art. 40.4 se entiende cumplida <b>con la puesta a disposición</b> en la sede o en la dirección habilitada.</li>\n<li><b>Dónde se consultan (43.4):</b> desde el <b>Punto de Acceso General</b>, que funciona como portal de acceso.</li>\n</ul></div></details><details class=\"panel\"><summary>En lenguaje llano</summary><div class=\"body\"><p>La notificación está ahí desde que la ponen. Si entras, queda notificada en ese instante. Si no entras en diez días naturales, se da por rechazada y el procedimiento sigue sin ti.</p></div></details><details class=\"panel\"><summary>¿Por qué existe?</summary><div class=\"body\"><div class=\"interp\"><span class=\"lbl\">Interpretación · aportación externa</span>El plazo de rechazo presunto evita que el procedimiento quede bloqueado por la inacción del interesado, y la brevedad —diez días naturales— se justifica porque acceder cuesta un minuto, no un desplazamiento.</div></div></details><details class=\"panel\"><summary>Ejemplos</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Ejemplo 1</span>Puesta a disposición el lunes; el interesado entra el miércoles: notificada el miércoles.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 2</span>Puesta a disposición y nadie entra en diez días naturales: rechazada, y el procedimiento continúa.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 3</span>Caso límite: un interesado <b>no</b> obligado que <b>no</b> eligió expresamente la vía electrónica. A él no se le aplica el rechazo presunto del 43.2.</div></div></details><details class=\"panel\"><summary>Trampas</summary><div class=\"body\"><div class=\"box warn\"><span class=\"lbl\">Cuidado</span>Son <b>diez días naturales</b>, no hábiles: es de las pocas veces que la Ley 39/2015 cuenta en naturales, y por eso se pregunta tanto. Y abrir el aviso del móvil <b>no</b> es comparecer: comparecer es acceder al contenido identificado.</div></div></details><details class=\"panel\"><summary>Conexiones</summary><div class=\"body\"><p>Con el art. 41 —cuándo es electrónica—, con el art. 40.4 —plazo máximo— y con los arts. 44 y 45 del RD 203/2021.</p></div></details><details class=\"panel\"><summary>Anclaje memorístico</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Para retenerlo</span><b>Diez días naturales</b> y se acabó. Si accedes antes, notificada; si no, rechazada.</div></div></details></section><section class=\"card art\" id=\"rd203_44\"><h2><span class=\"num\">RD 203/2021 44</span> Notificación a través de la Dirección Electrónica Habilitada única</h2><p class=\"ubic\">RD 203/2021 ▸ Capítulo IV ▸ Sección 2.ª</p><div class=\"idea\">El buzón único estatal donde se concentran las notificaciones de todas las Administraciones.</div><details class=\"panel\" open><summary>Texto legal</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · RD 203/2021</span><p><b>Artículo 44. Notificación a través de la Dirección Electrónica Habilitada única.</b></p><p>1. La Dirección Electrónica Habilitada única es el sistema de información para la notificación electrónica cuya gestión corresponde al Ministerio de Asuntos Económicos y Transformación Digital en colaboración con el Ministerio de Política Territorial y Función Pública.</p><p>2. De acuerdo con lo previsto en el artículo 7.4, la Dirección Electrónica Habilitada única se aloja en la sede electrónica del PAGe de la Administración General del Estado.</p><p>3. La adhesión a la Dirección Electrónica Habilitada única se realizará en los términos previstos en el artículo 65. Todas las Administraciones Públicas y sus organismos públicos y entidades de derecho público vinculados o dependientes colaborarán para establecer sistemas interoperables que permitan que las personas físicas y jurídicas puedan acceder a todas sus notificaciones a través de la Dirección Electrónica Habilitada única, tal como establece el artículo 43 de la Ley 39/2015, de 1 de octubre. Esta previsión será aplicable con independencia de cuál sea la Administración que practica la notificación y si las notificaciones se han practicado en papel o por medios electrónicos.</p><p>4. Cuando una incidencia técnica imposibilite el funcionamiento ordinario de la Dirección Electrónica Habilitada única, una vez comunicada dicha incidencia a los órganos, organismos o entidades emisores que la utilicen como medio de notificación, estos podrán determinar una ampliación del plazo no vencido para comparecer y acceder a las notificaciones emitidas. En caso de que también pongan a disposición las notificaciones en su sede electrónica o sede electrónica asociada, deberán publicar también en esta tanto la incidencia técnica acontecida en la Dirección Electrónica Habilitada única como la ampliación concreta, en su caso, del plazo no vencido.</p><p>5. Con carácter previo al acceso al contenido de la notificación puesta a disposición del interesado en la Dirección Electrónica Habilitada única, este será informado de que de acuerdo con lo previsto en los artículos 41 y 43 de la Ley 39/2015, de 1 de octubre, dicho acceso al contenido, el rechazo expreso de la notificación o bien la presunción de rechazo por haber transcurrido el plazo de diez días naturales desde la puesta a disposición de la notificación sin acceder al contenido de la misma, dará por efectuado el trámite de notificación y se continuará el procedimiento.</p><p>6. Para dar por efectuado el trámite de notificación a efectos jurídicos, en la Dirección Electrónica Habilitada única deberá quedar constancia, con indicación de fecha y hora, del momento del acceso al contenido de la notificación, del rechazo expreso de la misma o del vencimiento del plazo previsto en el artículo 43.2 de la Ley 39/2015, de 1 de octubre. El estado del trámite de notificación en la Dirección Electrónica Habilitada única se sincronizará automáticamente con la sede electrónica o sede electrónica asociada en la que, en su caso, la notificación también se hubiera puesto a disposición del interesado.</p></div></div></details><details class=\"panel\"><summary>Disección</summary><div class=\"body\"><ul>\n<li><b>Qué es (44.1):</b> el <b>sistema de información para la notificación electrónica</b>, gestionado por el ministerio competente en transformación digital en colaboración con el de política territorial.</li>\n<li><b>Dónde vive (44.2):</b> <b>se aloja en la sede electrónica del Punto de Acceso General</b> de la Administración General del Estado.</li>\n<li><b>Adhesión (44.3):</b> en los términos del art. 65. Todas las Administraciones <b>colaborarán</b> para que las personas puedan acceder a <b>todas</b> sus notificaciones a través de ella.</li>\n</ul></div></details><details class=\"panel\"><summary>En lenguaje llano</summary><div class=\"body\"><p>Es el buzón único: la idea es que no tengas que entrar en veinte sedes distintas para saber si te han notificado algo.</p></div></details><details class=\"panel\"><summary>¿Por qué existe?</summary><div class=\"body\"><div class=\"interp\"><span class=\"lbl\">Interpretación · aportación externa</span>Con miles de sedes electrónicas, exigir al ciudadano vigilarlas todas haría imposible el deber de diligencia. Un punto único convierte esa vigilancia en una rutina diaria razonable.</div></div></details><details class=\"panel\"><summary>Ejemplos</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Ejemplo 1</span>Una empresa consulta su buzón y ve notificaciones de la Agencia Tributaria y de su ayuntamiento.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 2</span>Una entidad local se adhiere a la dirección habilitada para no mantener su propio sistema.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 3</span>Caso límite: una Administración que notifica solo por su sede. Es posible —el art. 43.1 LPAC admite sede, dirección habilitada o ambas—, pero el Reglamento empuja a la convergencia.</div></div></details><details class=\"panel\"><summary>Trampas</summary><div class=\"body\"><div class=\"box warn\"><span class=\"lbl\">Cuidado</span>La dirección habilitada <b>se aloja en la sede del PAGe estatal</b>; no es una sede propia ni un correo electrónico.</div></div></details><details class=\"panel\"><summary>Conexiones</summary><div class=\"body\"><p>Con el art. 43.1 LPAC y con el art. 7.4 del Reglamento.</p></div></details><details class=\"panel\"><summary>Anclaje memorístico</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Para retenerlo</span><b>Un buzón para todas</b>, alojado en la sede del Punto de Acceso General del Estado.</div></div></details></section><section class=\"card art\" id=\"rd203_45\"><h2><span class=\"num\">RD 203/2021 45</span> Notificación electrónica en sede electrónica o sede asociada</h2><p class=\"ubic\">RD 203/2021 ▸ Capítulo IV ▸ Sección 2.ª</p><div class=\"idea\">Hay que advertir antes de acceder, y dejar constancia de fecha y hora de lo que ocurra.</div><svg viewBox=\"0 0 960 268\" width=\"100%\" role=\"img\" aria-label=\"Cómo se practica la notificación electrónica y cuándo se entiende rechazada por el transcurso de diez días naturales\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"t6dfrr2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#4b5563\"/></marker><marker id=\"t6dfer2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#15803d\"/></marker><marker id=\"t6dfwr2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#b45309\"/></marker></defs><text x=\"480\" y=\"24\" font-size=\"13\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"bold\">La notificación electrónica · art. 43 LPAC</text><rect x=\"20\" y=\"44\" width=\"920\" height=\"38\" rx=\"8\" fill=\"#e8efff\" stroke=\"#1d4ed8\" stroke-width=\"1.4\"/><text x=\"480\" y=\"66.71\" font-size=\"10.6\" text-anchor=\"middle\" fill=\"#1d4ed8\" font-weight=\"bold\">SE PRACTICA mediante COMPARECENCIA EN LA SEDE, a través de la DIRECCIÓN ELECTRÓNICA HABILITADA ÚNICA, o por ambos</text><rect x=\"20\" y=\"98\" width=\"450\" height=\"62\" rx=\"8\" fill=\"#eaf6ee\" stroke=\"#15803d\" stroke-width=\"1.4\"/><text x=\"245\" y=\"116.85\" font-size=\"11\" text-anchor=\"middle\" fill=\"#15803d\" font-weight=\"bold\">SI ACCEDE AL CONTENIDO</text><text x=\"245\" y=\"132.85\" font-size=\"11\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Se entiende PRACTICADA en el momento</text><text x=\"245\" y=\"148.85\" font-size=\"11\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">en que se produce el acceso</text><rect x=\"490\" y=\"98\" width=\"450\" height=\"62\" rx=\"8\" fill=\"#fdeceb\" stroke=\"#b91c1c\" stroke-width=\"1.4\"/><text x=\"715\" y=\"116.71\" font-size=\"10.6\" text-anchor=\"middle\" fill=\"#b91c1c\" font-weight=\"bold\">SI NO ACCEDE</text><text x=\"715\" y=\"132.71\" font-size=\"10.6\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Se entiende RECHAZADA al transcurrir</text><text x=\"715\" y=\"148.71\" font-size=\"10.6\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">10 DÍAS NATURALES desde la puesta a disposición</text><rect x=\"20\" y=\"174\" width=\"920\" height=\"38\" rx=\"8\" fill=\"#fdf3e3\" stroke=\"#b45309\" stroke-width=\"1.4\"/><text x=\"480\" y=\"196.675\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">El rechazo presunto solo opera cuando la notificación es OBLIGATORIA o ha sido EXPRESAMENTE ELEGIDA por el interesado</text><text x=\"480\" y=\"232\" font-size=\"10.8\" text-anchor=\"middle\" fill=\"#b91c1c\" font-weight=\"bold\">Comparecer en la sede = acceder al contenido estando debidamente identificado. Abrir el aviso del móvil NO es comparecer.</text><text x=\"480\" y=\"256\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#4b5563\" font-weight=\"normal\">Los interesados pueden acceder a sus notificaciones desde el Punto de Acceso General, que funciona como portal (43.4).</text></svg><details class=\"panel\" open><summary>Texto legal</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · RD 203/2021</span><p><b>Artículo 45. Notificación electrónica en sede electrónica o sede electrónica asociada.</b></p><p>1. Con carácter previo al acceso al contenido de la notificación puesta a disposición del interesado en la sede electrónica o sede electrónica asociada del emisor de la misma, este será informado de que de acuerdo con lo previsto en los artículos 41 y 43 de la Ley 39/2015, de 1 de octubre, la comparecencia y acceso al contenido, el rechazo expreso de la notificación o bien la presunción de rechazo por haber transcurrido el plazo de diez días naturales desde la puesta a disposición de la notificación sin acceder al contenido de la misma dará por efectuado el trámite de notificación y se continuará el procedimiento.</p><p>2. Para dar por efectuado el trámite de notificación a efectos jurídicos, en la sede electrónica o sede electrónica asociada deberá quedar constancia, con indicación de fecha y hora, del momento del acceso al contenido de la notificación, del rechazo expreso de la misma o del vencimiento del plazo previsto en el artículo 43.2 de la Ley 39/2015, de 1 de octubre. El estado del trámite de notificación en la sede electrónica o sede electrónica asociada se sincronizará automáticamente con la Dirección Electrónica Habilitada única si la notificación también se hubiera puesto a disposición del interesado en aquella.</p><p>3. De conformidad con el artículo 43.3 de la Ley 39/2015, de 1 de octubre, se entenderá cumplida la obligación de notificar en plazo por parte de la Administración, a que se refiere el artículo 40.4 de dicha ley, con la puesta a disposición de la notificación en la sede o en la dirección electrónica habilitada única.</p></div></div></details><details class=\"panel\"><summary>Disección</summary><div class=\"body\"><ul>\n<li><b>Advertencia previa (45.1):</b> <b>antes</b> de acceder al contenido, el interesado debe ser <b>informado</b> de que la comparecencia y acceso, el <b>rechazo expreso</b> o la <b>presunción de rechazo</b> por el transcurso de los <b>diez días naturales</b> <b>dará por efectuado el trámite</b> de notificación y se continuará el procedimiento.</li>\n<li><b>Constancia (45.2):</b> en la sede debe quedar constancia, <b>con indicación de fecha y hora</b>, del momento del <b>acceso</b>, del <b>rechazo expreso</b> o del <b>vencimiento</b> del plazo.</li>\n</ul></div></details><details class=\"panel\"><summary>En lenguaje llano</summary><div class=\"body\"><p>Antes de que pulses, la sede tiene que avisarte de que al abrirlo queda notificado, y de que si no lo abres en diez días también. Y todo eso queda grabado con su hora.</p></div></details><details class=\"panel\"><summary>¿Por qué existe?</summary><div class=\"body\"><div class=\"interp\"><span class=\"lbl\">Interpretación · aportación externa</span>Sin esa advertencia previa, el ciudadano podría alegar desconocimiento de las consecuencias de no entrar. Y sin la constancia horaria, no habría forma de probar cuándo empezó a correr el plazo del recurso.</div></div></details><details class=\"panel\"><summary>Ejemplos</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Ejemplo 1</span>La sede muestra el aviso legal antes de abrir la notificación: art. 45.1.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 2</span>El interesado rechaza expresamente: queda constancia con fecha y hora y el trámite se da por efectuado.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 3</span>Caso límite: vence el plazo sin acceso. También queda constancia del vencimiento, y esa es la fecha que cuenta.</div></div></details><details class=\"panel\"><summary>Trampas</summary><div class=\"body\"><div class=\"box warn\"><span class=\"lbl\">Cuidado</span>Tres situaciones, un mismo efecto: <b>acceso</b>, <b>rechazo expreso</b> y <b>rechazo presunto</b> dan por efectuado el trámite. Lo que cambia es la fecha.</div></div></details><details class=\"panel\"><summary>Conexiones</summary><div class=\"body\"><p>Desarrolla los arts. 41 y 43 LPAC.</p></div></details><details class=\"panel\"><summary>Anclaje memorístico</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Para retenerlo</span>Acceder, rechazar o dejar pasar: <b>las tres notifican</b>.</div></div></details></section><section class=\"card art\" id=\"lpac42\"><h2><span class=\"num\">LPAC 42</span> Práctica de las notificaciones en papel</h2><p class=\"ubic\">Ley 39/2015 ▸ Título III ▸ Capítulo II</p><div class=\"idea\">Dos intentos, mayor de catorce años, tres días y la frontera de las quince horas.</div><svg viewBox=\"0 0 980 290\" width=\"100%\" role=\"img\" aria-label=\"Los dos intentos de notificación en papel con las reglas de edad, plazo y horario\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"t6efr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#4b5563\"/></marker><marker id=\"t6efe\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#15803d\"/></marker><marker id=\"t6efw\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#b45309\"/></marker></defs><text x=\"490\" y=\"24\" font-size=\"13\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"bold\">La notificación en papel en el domicilio · art. 42.2 LPAC</text><rect x=\"20\" y=\"46\" width=\"196\" height=\"86\" rx=\"8\" fill=\"#e8efff\" stroke=\"#1d4ed8\" stroke-width=\"1.4\"/><text x=\"118\" y=\"71.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#1d4ed8\" font-weight=\"bold\">1 · PRIMER INTENTO</text><text x=\"118\" y=\"85.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Si no está el interesado,</text><text x=\"118\" y=\"99.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">puede recoger cualquier</text><text x=\"118\" y=\"113.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">MAYOR DE 14 AÑOS</text><rect x=\"268\" y=\"46\" width=\"196\" height=\"86\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"366\" y=\"78.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#4b5563\" font-weight=\"bold\">2 · SI NADIE RECOGE</text><text x=\"366\" y=\"92.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Se hace constar en el</text><text x=\"366\" y=\"106.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">expediente el DÍA Y LA HORA</text><rect x=\"516\" y=\"46\" width=\"196\" height=\"86\" rx=\"8\" fill=\"#fdf3e3\" stroke=\"#b45309\" stroke-width=\"1.4\"/><text x=\"614\" y=\"71.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"bold\">3 · SEGUNDO INTENTO</text><text x=\"614\" y=\"85.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">POR UNA SOLA VEZ,</text><text x=\"614\" y=\"99.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">en HORA DISTINTA y dentro</text><text x=\"614\" y=\"113.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">de los TRES DÍAS siguientes</text><rect x=\"764\" y=\"46\" width=\"196\" height=\"86\" rx=\"8\" fill=\"#fdeceb\" stroke=\"#b91c1c\" stroke-width=\"1.4\"/><text x=\"862\" y=\"78.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#b91c1c\" font-weight=\"bold\">4 · SI TAMBIÉN FALLA</text><text x=\"862\" y=\"92.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Se procede conforme</text><text x=\"862\" y=\"106.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">al ART. 44</text><line x1=\"220\" y1=\"89\" x2=\"262\" y2=\"89\" stroke=\"#4b5563\" stroke-width=\"1.6\" marker-end=\"url(#t6efr)\"/><line x1=\"468\" y1=\"89\" x2=\"510\" y2=\"89\" stroke=\"#4b5563\" stroke-width=\"1.6\" marker-end=\"url(#t6efr)\"/><line x1=\"716\" y1=\"89\" x2=\"758\" y2=\"89\" stroke=\"#4b5563\" stroke-width=\"1.6\" marker-end=\"url(#t6efr)\"/><rect x=\"20\" y=\"146\" width=\"940\" height=\"54\" rx=\"8\" fill=\"#fdeceb\" stroke=\"#b91c1c\" stroke-width=\"1.4\"/><text x=\"490\" y=\"160.71\" font-size=\"10.6\" text-anchor=\"middle\" fill=\"#b91c1c\" font-weight=\"bold\">LA REGLA DE LAS QUINCE HORAS</text><text x=\"490\" y=\"176.71\" font-size=\"10.6\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Si el primer intento fue ANTES de las 15:00, el segundo debe ser DESPUÉS de las 15:00, y viceversa.</text><text x=\"490\" y=\"192.71\" font-size=\"10.6\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Y en todo caso, al menos TRES HORAS de diferencia entre ambos intentos.</text><text x=\"490\" y=\"224\" font-size=\"10.4\" text-anchor=\"middle\" fill=\"#4b5563\" font-weight=\"normal\">Toda notificación en papel se pone ADEMÁS a disposición en la sede electrónica, para que el interesado pueda acceder voluntariamente (42.1).</text><text x=\"490\" y=\"252\" font-size=\"10.4\" text-anchor=\"middle\" fill=\"#4b5563\" font-weight=\"normal\">Si accede en sede, se le ofrece que las siguientes se practiquen por medios electrónicos (42.3).</text><text x=\"490\" y=\"278\" font-size=\"11\" text-anchor=\"middle\" fill=\"#b91c1c\" font-weight=\"bold\">Las cuatro cifras: 14 años · una sola repetición · 3 días · 3 horas, con la frontera en las 15:00.</text></svg><details class=\"panel\" open><summary>Texto legal</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LPAC</span><p><b>Artículo 42. Práctica de las notificaciones en papel.</b></p><p>1. Todas las notificaciones que se practiquen en papel deberán ser puestas a disposición del interesado en la sede electrónica de la Administración u Organismo actuante para que pueda acceder al contenido de las mismas de forma voluntaria.</p><p>2. Cuando la notificación se practique en el domicilio del interesado, de no hallarse presente éste en el momento de entregarse la notificación, podrá hacerse cargo de la misma cualquier persona mayor de catorce años que se encuentre en el domicilio y haga constar su identidad. Si nadie se hiciera cargo de la notificación, se hará constar esta circunstancia en el expediente, junto con el día y la hora en que se intentó la notificación, intento que se repetirá por una sola vez y en una hora distinta dentro de los tres días siguientes. En caso de que el primer intento de notificación se haya realizado antes de las quince horas, el segundo intento deberá realizarse después de las quince horas y viceversa, dejando en todo caso al menos un margen de diferencia de tres horas entre ambos intentos de notificación. Si el segundo intento también resultara infructuoso, se procederá en la forma prevista en el artículo 44.</p><p>3. Cuando el interesado accediera al contenido de la notificación en sede electrónica, se le ofrecerá la posibilidad de que el resto de notificaciones se puedan realizar a través de medios electrónicos.</p></div></div></details><details class=\"panel\"><summary>Disección</summary><div class=\"body\"><ul>\n<li><b>También en sede (42.1):</b> <b>todas</b> las notificaciones en papel se ponen <b>además</b> a disposición en la sede para que el interesado pueda acceder <b>de forma voluntaria</b>.</li>\n<li><b>Quién puede recoger (42.2):</b> si el interesado no está, puede hacerse cargo <b>cualquier persona mayor de catorce años</b> que se encuentre en el domicilio y <b>haga constar su identidad</b>.</li>\n<li><b>Si nadie recoge:</b> se hace constar en el expediente <b>el día y la hora</b> del intento, que <b>se repetirá por una sola vez y en hora distinta dentro de los tres días siguientes</b>.</li>\n<li><b>La regla horaria:</b> si el primer intento fue <b>antes de las quince horas</b>, el segundo debe ser <b>después</b>, y viceversa, dejando <b>al menos tres horas</b> de diferencia entre ambos.</li>\n<li><b>Si el segundo falla:</b> se procede conforme al <b>art. 44</b>.</li>\n<li><b>Invitación (42.3):</b> si el interesado accede en sede, se le ofrece que las siguientes se practiquen por medios electrónicos.</li>\n</ul></div></details><details class=\"panel\"><summary>En lenguaje llano</summary><div class=\"body\"><p>Van dos veces, en horarios distintos y con al menos tres horas de diferencia, dentro de tres días. Si no hay nadie que pueda recoger, se acabó el papel y toca el Boletín Oficial del Estado.</p></div></details><details class=\"panel\"><summary>¿Por qué existe?</summary><div class=\"body\"><div class=\"interp\"><span class=\"lbl\">Interpretación · aportación externa</span>La regla de las quince horas evita el intento de cortesía: llamar dos veces a la misma hora de la mañana garantiza no encontrar a quien trabaja. Obligar a cruzar la franja horaria es lo que hace real el segundo intento.</div></div></details><details class=\"panel\"><summary>Ejemplos</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Ejemplo 1</span>Primer intento el martes a las 10:00; el segundo debe ser después de las 15:00 y antes del viernes.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 2</span>Recoge la notificación la hija de quince años del interesado haciendo constar su identidad: válido.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 3</span>Caso límite: recoge el vecino del rellano. No vale: ha de ser alguien que <b>se encuentre en el domicilio</b>.</div></div></details><details class=\"panel\"><summary>Trampas</summary><div class=\"body\"><div class=\"box warn\"><span class=\"lbl\">Cuidado</span>Cuatro cifras y todas caen: <b>catorce</b> años, <b>una sola</b> repetición, <b>tres</b> días, <b>tres</b> horas, con la frontera en las <b>quince</b>. Y el segundo intento es obligatorio, no potestativo.</div></div></details><details class=\"panel\"><summary>Conexiones</summary><div class=\"body\"><p>Si fracasa, art. 44. Y toda notificación en papel se duplica en la sede por el art. 42.1.</p></div></details><details class=\"panel\"><summary>Anclaje memorístico</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Para retenerlo</span><b>14 · 1 · 3 · 3 · 15</b>: catorce años, un repeticón, tres días, tres horas, frontera en las quince.</div></div></details></section><section class=\"card art\" id=\"lpac44\"><h2><span class=\"num\">LPAC 44</span> Notificación infructuosa</h2><p class=\"ubic\">Ley 39/2015 ▸ Título III ▸ Capítulo II</p><div class=\"idea\">Tres supuestos y siempre el Boletín Oficial del Estado.</div><svg viewBox=\"0 0 960 250\" width=\"100%\" role=\"img\" aria-label=\"Publicación en el Boletín Oficial del Estado cuando la notificación resulta infructuosa y publicaciones facultativas\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"t6ffr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#4b5563\"/></marker><marker id=\"t6ffe\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#15803d\"/></marker><marker id=\"t6ffw\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#b45309\"/></marker></defs><text x=\"480\" y=\"24\" font-size=\"13\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"bold\">Cuando la notificación no llega · arts. 44 a 46 LPAC</text><rect x=\"20\" y=\"44\" width=\"920\" height=\"38\" rx=\"8\" fill=\"#e8efff\" stroke=\"#1d4ed8\" stroke-width=\"1.4\"/><text x=\"480\" y=\"66.71\" font-size=\"10.6\" text-anchor=\"middle\" fill=\"#1d4ed8\" font-weight=\"bold\">TRES SUPUESTOS · art. 44: interesados DESCONOCIDOS · se IGNORA el lugar · intentada, NO SE PUDO PRACTICAR</text><rect x=\"20\" y=\"98\" width=\"450\" height=\"62\" rx=\"8\" fill=\"#fdeceb\" stroke=\"#b91c1c\" stroke-width=\"1.4\"/><text x=\"245\" y=\"116.025\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#b91c1c\" font-weight=\"bold\">OBLIGATORIO</text><text x=\"245\" y=\"133.025\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Anuncio publicado en el</text><text x=\"245\" y=\"150.025\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">BOLETÍN OFICIAL DEL ESTADO</text><rect x=\"490\" y=\"98\" width=\"450\" height=\"62\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"715\" y=\"111.43\" font-size=\"9.8\" text-anchor=\"middle\" fill=\"#4b5563\" font-weight=\"bold\">FACULTATIVO Y PREVIO</text><text x=\"715\" y=\"125.43\" font-size=\"9.8\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Boletín de la comunidad o de la provincia ·</text><text x=\"715\" y=\"139.43\" font-size=\"9.8\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">tablón del ayuntamiento del último domicilio ·</text><text x=\"715\" y=\"153.43\" font-size=\"9.8\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">consulado o sección consular</text><rect x=\"20\" y=\"174\" width=\"920\" height=\"38\" rx=\"8\" fill=\"#fdf3e3\" stroke=\"#b45309\" stroke-width=\"1.4\"/><text x=\"480\" y=\"196.57\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Si la publicación LESIONA derechos o intereses legítimos · art. 46: solo una SOMERA INDICACIÓN del contenido y del lugar donde comparecer</text><text x=\"480\" y=\"234\" font-size=\"11\" text-anchor=\"middle\" fill=\"#b91c1c\" font-weight=\"bold\">Ninguna forma complementaria de difusión excluye la obligación de publicar en el BOE.</text></svg><details class=\"panel\" open><summary>Texto legal</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LPAC</span><p><b>Artículo 44. Notificación infructuosa.</b></p><p>Cuando los interesados en un procedimiento sean desconocidos, se ignore el lugar de la notificación o bien, intentada ésta, no se hubiese podido practicar, la notificación se hará por medio de un anuncio publicado en el «Boletín Oficial del Estado». Asimismo, previamente y con carácter facultativo, las Administraciones podrán publicar un anuncio en el boletín oficial de la Comunidad Autónoma o de la Provincia, en el tablón de edictos del Ayuntamiento del último domicilio del interesado o del Consulado o Sección Consular de la Embajada correspondiente. Las Administraciones Públicas podrán establecer otras formas de notificación complementarias a través de los restantes medios de difusión, que no excluirán la obligación de publicar el correspondiente anuncio en el «Boletín Oficial del Estado».</p></div></div></details><details class=\"panel\"><summary>Disección</summary><div class=\"body\"><ul>\n<li><b>Los tres supuestos:</b> interesados <b>desconocidos</b>; se <b>ignore el lugar</b> de la notificación; o, <b>intentada, no se hubiese podido practicar</b>.</li>\n<li><b>La consecuencia:</b> la notificación se hace por <b>anuncio publicado en el «Boletín Oficial del Estado»</b>.</li>\n<li><b>Facultativo y previo:</b> las Administraciones <b>podrán</b> publicar anuncio en el <b>boletín de la comunidad autónoma o de la provincia</b>, en el <b>tablón de edictos del ayuntamiento del último domicilio</b> o en el <b>consulado o sección consular</b>.</li>\n<li><b>La cláusula de cierre:</b> otras formas complementarias de difusión <b>no excluyen la obligación de publicar en el BOE</b>.</li>\n</ul></div></details><details class=\"panel\"><summary>En lenguaje llano</summary><div class=\"body\"><p>Cuando no hay manera de localizar a alguien, se publica en el Boletín Oficial del Estado. Lo demás —boletín provincial, tablón del ayuntamiento— puede hacerse, pero no sustituye al BOE.</p></div></details><details class=\"panel\"><summary>¿Por qué existe?</summary><div class=\"body\"><div class=\"interp\"><span class=\"lbl\">Interpretación · aportación externa</span>Un único diario de alcance nacional permite que exista un lugar donde cualquiera pueda comprobar si está siendo buscado por alguna Administración, por lejana que sea.</div></div></details><details class=\"panel\"><summary>Ejemplos</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Ejemplo 1</span>Expediente sancionador y el interesado ha cambiado de domicilio sin comunicarlo: anuncio en el BOE.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 2</span>El ayuntamiento publica además en el tablón de su último domicilio: facultativo y previo, no sustitutivo.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 3</span>Caso límite: se publica solo en el boletín provincial. La notificación no está bien practicada: falta el BOE.</div></div></details><details class=\"panel\"><summary>Trampas</summary><div class=\"body\"><div class=\"box warn\"><span class=\"lbl\">Cuidado</span>La trampa del año: poner el boletín de la provincia o el tablón como obligatorio. Lo <b>obligatorio</b> es el <b>BOE</b>; lo demás es <b>facultativo y previo</b>.</div></div></details><details class=\"panel\"><summary>Conexiones</summary><div class=\"body\"><p>Es la salida del art. 42.2 cuando fracasan los dos intentos. Se modula por el art. 46 si la publicación lesiona derechos.</p></div></details><details class=\"panel\"><summary>Anclaje memorístico</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Para retenerlo</span>Siempre <b>BOE</b>. Lo demás, adorno voluntario.</div></div></details></section><section class=\"card art\" id=\"lpac45\"><h2><span class=\"num\">LPAC 45</span> Publicación</h2><p class=\"ubic\">Ley 39/2015 ▸ Título III ▸ Capítulo II</p><div class=\"idea\">Cuándo la publicación sustituye a la notificación, con los procesos selectivos como caso estrella.</div><svg viewBox=\"0 0 960 236\" width=\"100%\" role=\"img\" aria-label=\"Supuestos en que la publicación sustituye a la notificación y dónde debe publicarse\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"t6gfr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#4b5563\"/></marker><marker id=\"t6gfe\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#15803d\"/></marker><marker id=\"t6gfw\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#b45309\"/></marker></defs><text x=\"480\" y=\"24\" font-size=\"13\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"bold\">Publicación con efectos de notificación · art. 45 LPAC</text><rect x=\"20\" y=\"44\" width=\"450\" height=\"76\" rx=\"8\" fill=\"#e8efff\" stroke=\"#1d4ed8\" stroke-width=\"1.4\"/><text x=\"245\" y=\"63.07\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#1d4ed8\" font-weight=\"bold\">a) PLURALIDAD INDETERMINADA</text><text x=\"245\" y=\"78.07\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">de personas, o cuando notificar a uno solo</text><text x=\"245\" y=\"93.07\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">se estime insuficiente —en ese caso,</text><text x=\"245\" y=\"108.07\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">ADICIONAL a la individual—</text><rect x=\"490\" y=\"44\" width=\"450\" height=\"76\" rx=\"8\" fill=\"#eaf6ee\" stroke=\"#15803d\" stroke-width=\"1.4\"/><text x=\"715\" y=\"63.07\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#15803d\" font-weight=\"bold\">b) PROCEDIMIENTOS SELECTIVOS</text><text x=\"715\" y=\"78.07\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">o de CONCURRENCIA COMPETITIVA</text><text x=\"715\" y=\"93.07\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">La convocatoria indica dónde se publicará,</text><text x=\"715\" y=\"108.07\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">y lo publicado en otro lugar CARECE DE VALIDEZ</text><rect x=\"20\" y=\"134\" width=\"920\" height=\"40\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"480\" y=\"150.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">La publicación debe contener los mismos elementos que el art. 40.2 exige a las notificaciones, y se hace en el DIARIO OFICIAL QUE CORRESPONDA</text><text x=\"480\" y=\"164.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">según cuál sea la Administración de la que proceda el acto</text><text x=\"480\" y=\"204\" font-size=\"11\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"bold\">La letra b) es la de tu oposición: las listas y los llamamientos se publican donde dijo la convocatoria, y solo ahí.</text></svg><details class=\"panel\" open><summary>Texto legal</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LPAC</span><p><b>Artículo 45. Publicación.</b></p><p>1. Los actos administrativos serán objeto de publicación cuando así lo establezcan las normas reguladoras de cada procedimiento o cuando lo aconsejen razones de interés público apreciadas por el órgano competente. En todo caso, los actos administrativos serán objeto de publicación, surtiendo ésta los efectos de la notificación, en los siguientes casos:</p><p>a) Cuando el acto tenga por destinatario a una pluralidad indeterminada de personas o cuando la Administración estime que la notificación efectuada a un solo interesado es insuficiente para garantizar la notificación a todos, siendo, en este último caso, adicional a la individualmente realizada.</p><p>b) Cuando se trate de actos integrantes de un procedimiento selectivo o de concurrencia competitiva de cualquier tipo. En este caso, la convocatoria del procedimiento deberá indicar el medio donde se efectuarán las sucesivas publicaciones, careciendo de validez las que se lleven a cabo en lugares distintos.</p><p>2. La publicación de un acto deberá contener los mismos elementos que el artículo 40.2 exige respecto de las notificaciones. Será también aplicable a la publicación lo establecido en el apartado 3 del mismo artículo. En los supuestos de publicaciones de actos que contengan elementos comunes, podrán publicarse de forma conjunta los aspectos coincidentes, especificándose solamente los aspectos individuales de cada acto.</p><p>3. La publicación de los actos se realizará en el diario oficial que corresponda, según cual sea la Administración de la que proceda el acto a notificar.</p><p>4. Sin perjuicio de lo dispuesto en el artículo 44, la publicación de actos y comunicaciones que, por disposición legal o reglamentaria deba practicarse en tablón de anuncios o edictos, se entenderá cumplida por su publicación en el Diario oficial correspondiente.</p></div></div></details><details class=\"panel\"><summary>Disección</summary><div class=\"body\"><ul>\n<li><b>Regla (45.1):</b> se publican los actos cuando lo establezcan las normas del procedimiento o lo aconsejen <b>razones de interés público</b>. Y <b>en todo caso</b>, surtiendo la publicación <b>los efectos de la notificación</b>, en dos casos.</li>\n<li><b>a)</b> Cuando el acto tenga por destinatario una <b>pluralidad indeterminada de personas</b>, o cuando la Administración estime <b>insuficiente</b> la notificación a un solo interesado —en este último caso, la publicación es <b>adicional</b> a la individual—.</li>\n<li><b>b)</b> Cuando se trate de actos de un <b>procedimiento selectivo o de concurrencia competitiva</b> de cualquier tipo. La <b>convocatoria debe indicar el medio</b> donde se efectuarán las sucesivas publicaciones, <b>careciendo de validez las que se lleven a cabo en lugares distintos</b>.</li>\n<li><b>Contenido y lugar (45.2 y 45.3):</b> mismos elementos que exige el art. 40.2, y publicación <b>en

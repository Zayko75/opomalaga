 el diario oficial que corresponda</b> según la Administración de la que proceda el acto.</li>\n</ul></div></details><details class=\"panel\"><summary>En lenguaje llano</summary><div class=\"body\"><p>Hay actos que no se notifican uno a uno: se publican, y eso vale como notificación. El caso más claro es el tuyo: una oposición. Lo que se publique fuera del sitio que dijo la convocatoria no sirve de nada.</p></div></details><details class=\"panel\"><summary>¿Por qué existe?</summary><div class=\"body\"><div class=\"interp\"><span class=\"lbl\">Interpretación · aportación externa</span>En un proceso con miles de aspirantes, la notificación individual sería inviable y además desigual. La publicación en un lugar único y anunciado de antemano garantiza que todos se enteran a la vez.</div></div></details><details class=\"panel\"><summary>Ejemplos</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Ejemplo 1</span>La lista de admitidos de un proceso selectivo: publicación con efectos de notificación, letra b).</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 2</span>Una resolución que afecta a todos los vecinos de una calle: letra a), pluralidad indeterminada.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 3</span>Caso límite: el tribunal publica el llamamiento solo en su perfil de una red social, cuando la convocatoria decía el tablón electrónico. Esa publicación <b>carece de validez</b>.</div></div></details><details class=\"panel\"><summary>Trampas</summary><div class=\"body\"><div class=\"box warn\"><span class=\"lbl\">Cuidado</span>La letra b) se pregunta con trampa de lugar. Lo decisivo no es dónde sea más visible, sino <b>dónde dijo la convocatoria</b>.</div></div></details><details class=\"panel\"><summary>Conexiones</summary><div class=\"body\"><p>Con el art. 44 —infructuosa— y con el art. 46 —somera indicación—.</p></div></details><details class=\"panel\"><summary>Anclaje memorístico</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Para retenerlo</span>Selectivos y concurrencia: <b>donde dijo la convocatoria, y solo ahí</b>.</div></div></details></section><section class=\"card art\" id=\"lpac46\"><h2><span class=\"num\">LPAC 46</span> Indicación de notificaciones y publicaciones</h2><p class=\"ubic\">Ley 39/2015 ▸ Título III ▸ Capítulo II</p><div class=\"idea\">Si publicar lesiona derechos, se publica solo una somera indicación.</div><svg viewBox=\"0 0 960 250\" width=\"100%\" role=\"img\" aria-label=\"Publicación en el Boletín Oficial del Estado cuando la notificación resulta infructuosa y publicaciones facultativas\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"t6ffrr2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#4b5563\"/></marker><marker id=\"t6ffer2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#15803d\"/></marker><marker id=\"t6ffwr2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#b45309\"/></marker></defs><text x=\"480\" y=\"24\" font-size=\"13\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"bold\">Cuando la notificación no llega · arts. 44 a 46 LPAC</text><rect x=\"20\" y=\"44\" width=\"920\" height=\"38\" rx=\"8\" fill=\"#e8efff\" stroke=\"#1d4ed8\" stroke-width=\"1.4\"/><text x=\"480\" y=\"66.71\" font-size=\"10.6\" text-anchor=\"middle\" fill=\"#1d4ed8\" font-weight=\"bold\">TRES SUPUESTOS · art. 44: interesados DESCONOCIDOS · se IGNORA el lugar · intentada, NO SE PUDO PRACTICAR</text><rect x=\"20\" y=\"98\" width=\"450\" height=\"62\" rx=\"8\" fill=\"#fdeceb\" stroke=\"#b91c1c\" stroke-width=\"1.4\"/><text x=\"245\" y=\"116.025\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#b91c1c\" font-weight=\"bold\">OBLIGATORIO</text><text x=\"245\" y=\"133.025\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Anuncio publicado en el</text><text x=\"245\" y=\"150.025\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">BOLETÍN OFICIAL DEL ESTADO</text><rect x=\"490\" y=\"98\" width=\"450\" height=\"62\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"715\" y=\"111.43\" font-size=\"9.8\" text-anchor=\"middle\" fill=\"#4b5563\" font-weight=\"bold\">FACULTATIVO Y PREVIO</text><text x=\"715\" y=\"125.43\" font-size=\"9.8\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Boletín de la comunidad o de la provincia ·</text><text x=\"715\" y=\"139.43\" font-size=\"9.8\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">tablón del ayuntamiento del último domicilio ·</text><text x=\"715\" y=\"153.43\" font-size=\"9.8\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">consulado o sección consular</text><rect x=\"20\" y=\"174\" width=\"920\" height=\"38\" rx=\"8\" fill=\"#fdf3e3\" stroke=\"#b45309\" stroke-width=\"1.4\"/><text x=\"480\" y=\"196.57\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Si la publicación LESIONA derechos o intereses legítimos · art. 46: solo una SOMERA INDICACIÓN del contenido y del lugar donde comparecer</text><text x=\"480\" y=\"234\" font-size=\"11\" text-anchor=\"middle\" fill=\"#b91c1c\" font-weight=\"bold\">Ninguna forma complementaria de difusión excluye la obligación de publicar en el BOE.</text></svg><details class=\"panel\" open><summary>Texto legal</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LPAC</span><p><b>Artículo 46. Indicación de notificaciones y publicaciones.</b></p><p>Si el órgano competente apreciase que la notificación por medio de anuncios o la publicación de un acto lesiona derechos o intereses legítimos, se limitará a publicar en el Diario oficial que corresponda una somera indicación del contenido del acto y del lugar donde los interesados podrán comparecer, en el plazo que se establezca, para conocimiento del contenido íntegro del mencionado acto y constancia de tal conocimiento. Adicionalmente y de manera facultativa, las Administraciones podrán establecer otras formas de notificación complementarias a través de los restantes medios de difusión que no excluirán la obligación de publicar en el correspondiente Diario oficial.</p></div></div></details><details class=\"panel\"><summary>Disección</summary><div class=\"body\"><ul>\n<li><b>Supuesto:</b> que el órgano aprecie que la notificación por anuncios o la publicación <b>lesiona derechos o intereses legítimos</b>.</li>\n<li><b>Consecuencia:</b> se limita a publicar en el diario oficial una <b>somera indicación del contenido del acto y del lugar donde los interesados podrán comparecer</b>, en el plazo que se establezca, para conocer el contenido íntegro <b>y dejar constancia de tal conocimiento</b>.</li>\n<li><b>Complementos:</b> cabe añadir otras formas de difusión, que <b>no excluyen</b> la obligación de publicar en el diario oficial.</li>\n</ul></div></details><details class=\"panel\"><summary>En lenguaje llano</summary><div class=\"body\"><p>Si publicar el contenido entero perjudicaría a alguien —datos de salud, una sanción, un asunto delicado—, se publica solo un resumen y se le dice dónde ir a leerlo.</p></div></details><details class=\"panel\"><summary>¿Por qué existe?</summary><div class=\"body\"><div class=\"interp\"><span class=\"lbl\">Interpretación · aportación externa</span>Es la válvula de protección de datos dentro del régimen de publicidad: concilia el deber de notificar con el derecho a no ver aireada información sensible en un boletín oficial.</div></div></details><details class=\"panel\"><summary>Ejemplos</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Ejemplo 1</span>Resolución de un expediente que contiene datos de salud: somera indicación y comparecencia.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 2</span>Sanción cuya publicación íntegra afectaría al honor del interesado: mismo cauce.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 3</span>Caso límite: el interesado comparece y conoce el contenido. Debe quedar <b>constancia de tal conocimiento</b>; sin ella, el trámite no está completo.</div></div></details><details class=\"panel\"><summary>Trampas</summary><div class=\"body\"><div class=\"box warn\"><span class=\"lbl\">Cuidado</span>La apreciación de la lesión la hace <b>el órgano competente</b>, de oficio; no depende de que el interesado lo pida.</div></div></details><details class=\"panel\"><summary>Conexiones</summary><div class=\"body\"><p>Modula los arts. 44 y 45. Enlaza con la normativa de protección de datos y con el art. 40.5.</p></div></details><details class=\"panel\"><summary>Anclaje memorístico</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Para retenerlo</span>Si publicar hace daño → <b>somera indicación</b> y comparecencia con constancia.</div></div></details></section><section class=\"card art\" id=\"rd203_41\"><h2><span class=\"num\">RD 203/2021 41</span> Comunicaciones administrativas por medios electrónicos</h2><p class=\"ubic\">RD 203/2021 ▸ Capítulo IV ▸ Sección 2.ª</p><div class=\"idea\">Lo que hay que comunicar al obligado electrónico, que no es lo mismo que notificar.</div><details class=\"panel\" open><summary>Texto legal</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · RD 203/2021</span><p><b>Artículo 41. Comunicaciones administrativas a las personas interesadas por medios electrónicos.</b></p><p>Cuando de acuerdo con lo previsto en el artículo 14 de la Ley 39/2015, de 1 de octubre, la relación de las personas interesadas con las Administraciones Públicas deba realizarse por medios electrónicos, serán objeto de comunicación al interesado por medios electrónicos, al menos:</p><p>a) La fecha y, en su caso, hora efectiva de inicio del cómputo de plazos que haya de cumplir la Administración tras la presentación del documento o documentos en el registro electrónico, de acuerdo con lo previsto en el artículo 31.2.c) de la Ley 39/2015, de 1 de octubre.</p><p>b) La fecha en que la solicitud ha sido recibida en el órgano competente, el plazo máximo para resolver el procedimiento y para la práctica de la notificación de los actos que le pongan término, así como de los efectos del silencio administrativo, de acuerdo con lo previsto en el artículo 21.4 de la Ley 39/2015, de 1 de octubre.</p><p>c) La solicitud de pronunciamiento previo y preceptivo a un órgano de la Unión Europea y la notificación del pronunciamiento de ese órgano de la Unión Europea a la Administración instructora de acuerdo con lo previsto en el artículo 22.1.b) de la Ley 39/2015, de 1 de octubre.</p><p>d) La existencia, desde que se tenga constancia de la misma, de un procedimiento no finalizado en el ámbito de la Unión Europea que condicione directamente el contenido de la resolución, así como la finalización de dicho procedimiento de acuerdo con lo previsto en el artículo 22.1.c) de la Ley 39/2015, de 1 de octubre.</p><p>e) La solicitud de un informe preceptivo a un órgano de la misma o distinta Administración y la recepción, en su caso, de dicho informe, de acuerdo con lo previsto en el artículo 22.1.d) de la Ley 39/2015, de 1 de octubre.</p><p>f) La solicitud de previo pronunciamiento de un órgano jurisdiccional, cuando este sea indispensable para la resolución del procedimiento, así como el contenido del pronunciamiento cuando la Administración actuante tenga la constancia del mismo de acuerdo con lo previsto en el artículo 22.1.g) de la Ley 39/2015, de 1 de octubre.</p><p>g) La realización del requerimiento de anulación o revisión de actos entre administraciones previsto en el artículo 22.2.a) de la Ley 39/2015, de 1 de octubre, así como su cumplimiento o, en su caso, la resolución del correspondiente recurso contencioso- administrativo.</p></div></div></details><details class=\"panel\"><summary>Disección</summary><div class=\"body\"><ul>\n<li><b>A quién:</b> cuando la relación deba ser electrónica conforme al art. 14 LPAC, serán objeto de <b>comunicación</b> al interesado por medios electrónicos, <b>al menos</b>, tres cosas.</li>\n<li><b>a)</b> La <b>fecha y, en su caso, hora efectiva de inicio del cómputo de plazos</b> que deba cumplir la Administración tras la presentación en el registro, conforme al art. 31.2.c) LPAC.</li>\n<li><b>b)</b> La <b>fecha de recepción</b> en el órgano competente, el <b>plazo máximo para resolver</b> y para notificar, y los <b>efectos del silencio</b>, conforme al art. 21.4 LPAC.</li>\n<li><b>c)</b> La solicitud de los trámites que corresponda, en los términos del propio precepto.</li>\n</ul></div></details><details class=\"panel\"><summary>En lenguaje llano</summary><div class=\"body\"><p>Comunicar no es notificar. La comunicación es información de servicio: cuándo entró tu solicitud, cuánto pueden tardar y qué pasa si no contestan.</p></div></details><details class=\"panel\"><summary>¿Por qué existe?</summary><div class=\"body\"><div class=\"interp\"><span class=\"lbl\">Interpretación · aportación externa</span>Materializa el art. 21.4 LPAC, que obliga a informar del plazo y del silencio. Al obligado electrónico se le da por el mismo canal por el que está obligado a relacionarse.</div></div></details><details class=\"panel\"><summary>Ejemplos</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Ejemplo 1</span>Una empresa presenta una solicitud y recibe la comunicación con la fecha de entrada y el plazo de resolución.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 2</span>Esa comunicación le indica que el silencio sería desestimatorio.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 3</span>Caso límite: la comunicación no abre plazos de recurso ni se somete al régimen del art. 43. Es información, no notificación.</div></div></details><details class=\"panel\"><summary>Trampas</summary><div class=\"body\"><div class=\"box warn\"><span class=\"lbl\">Cuidado</span>No confundas <b>comunicación</b> con <b>notificación</b>. A la comunicación no se le aplican los diez días naturales del art. 43.2.</div></div></details><details class=\"panel\"><summary>Conexiones</summary><div class=\"body\"><p>Con los arts. 21.4 y 31.2.c) LPAC.</p></div></details><details class=\"panel\"><summary>Anclaje memorístico</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Para retenerlo</span>Comunicar = <b>informar</b>. Notificar = <b>abrir plazos</b>.</div></div></details></section><section class=\"card\" id=\"cifras\"><h2>Cifras y listas cerradas</h2>\n<p class=\"small\">Pulsa en una columna para ordenar. Son las que más caen de todo el bloque electrónico.</p>\n<table id=\"tcif\"><thead><tr><th class=\"sortable\">Dato</th><th class=\"sortable\">Qué es</th><th class=\"sortable\">Precepto</th></tr></thead><tbody>\n<tr><td>10 días</td><td>Para cursar la notificación desde que se dicta el acto</td><td>Art. 40.2 LPAC</td></tr>\n<tr><td>10 días naturales</td><td>Sin acceder al contenido: <span class=\"t\" data-g=\"rechazo\">rechazo presunto</span> de la notificación electrónica</td><td>Art. 43.2 LPAC</td></tr>\n<tr><td>14 años</td><td>Edad mínima de quien puede hacerse cargo de la notificación en el domicilio</td><td>Art. 42.2 LPAC</td></tr>\n<tr><td>1 repetición</td><td>El segundo intento se hace por una sola vez</td><td>Art. 42.2 LPAC</td></tr>\n<tr><td>3 días</td><td>Plazo dentro del cual debe hacerse el segundo intento</td><td>Art. 42.2 LPAC</td></tr>\n<tr><td>3 horas</td><td>Margen mínimo entre los dos intentos</td><td>Art. 42.2 LPAC</td></tr>\n<tr><td>15 horas</td><td>Frontera: si el primer intento fue antes, el segundo después, y viceversa</td><td>Art. 42.2 LPAC</td></tr>\n<tr><td>5 lugares</td><td>De presentación de documentos</td><td>Art. 16.4 LPAC</td></tr>\n<tr><td>2 excepciones</td><td>Notificación en papel: comparecencia espontánea y entrega directa</td><td>Art. 41.1 LPAC</td></tr>\n<tr><td>2 prohibiciones</td><td>Nunca electrónica: elementos no convertibles y medios de pago</td><td>Art. 41.2 LPAC</td></tr>\n<tr><td>3 supuestos</td><td>De notificación <span class=\"t\" data-g=\"infructuosa\">infructuosa</span>: desconocidos, lugar ignorado, intentada sin éxito</td><td>Art. 44 LPAC</td></tr>\n<tr><td>BOE</td><td>Publicación obligatoria en la notificación infructuosa; lo demás es facultativo</td><td>Art. 44 LPAC</td></tr>\n<tr><td>2 casos</td><td>Publicación con efectos de notificación: pluralidad indeterminada y procesos selectivos</td><td>Art. 45.1 LPAC</td></tr>\n<tr><td><span class=\"t\" data-g=\"somera\">Somera indicación</span></td><td>Cuando publicar lesiona derechos o intereses legítimos</td><td>Art. 46 LPAC</td></tr>\n<tr><td><span class=\"t\" data-g=\"comparecencia\">Comparecencia</span></td><td>Acceso al contenido estando debidamente identificado</td><td>Art. 43.1 LPAC</td></tr>\n<tr><td><span class=\"t\" data-g=\"oficina\">Oficina de asistencia</span></td><td>Único cauce para presentar documentos en soporte no electrónico</td><td>Art. 39.3 RD 203/2021</td></tr>\n</tbody></table>\n<svg viewBox=\"0 0 980 290\" width=\"100%\" role=\"img\" aria-label=\"Los dos intentos de notificación en papel con las reglas de edad, plazo y horario\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"t6efrr2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#4b5563\"/></marker><marker id=\"t6efer2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#15803d\"/></marker><marker id=\"t6efwr2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#b45309\"/></marker></defs><text x=\"490\" y=\"24\" font-size=\"13\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"bold\">La notificación en papel en el domicilio · art. 42.2 LPAC</text><rect x=\"20\" y=\"46\" width=\"196\" height=\"86\" rx=\"8\" fill=\"#e8efff\" stroke=\"#1d4ed8\" stroke-width=\"1.4\"/><text x=\"118\" y=\"71.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#1d4ed8\" font-weight=\"bold\">1 · PRIMER INTENTO</text><text x=\"118\" y=\"85.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Si no está el interesado,</text><text x=\"118\" y=\"99.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">puede recoger cualquier</text><text x=\"118\" y=\"113.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">MAYOR DE 14 AÑOS</text><rect x=\"268\" y=\"46\" width=\"196\" height=\"86\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"366\" y=\"78.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#4b5563\" font-weight=\"bold\">2 · SI NADIE RECOGE</text><text x=\"366\" y=\"92.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Se hace constar en el</text><text x=\"366\" y=\"106.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">expediente el DÍA Y LA HORA</text><rect x=\"516\" y=\"46\" width=\"196\" height=\"86\" rx=\"8\" fill=\"#fdf3e3\" stroke=\"#b45309\" stroke-width=\"1.4\"/><text x=\"614\" y=\"71.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"bold\">3 · SEGUNDO INTENTO</text><text x=\"614\" y=\"85.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">POR UNA SOLA VEZ,</text><text x=\"614\" y=\"99.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">en HORA DISTINTA y dentro</text><text x=\"614\" y=\"113.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">de los TRES DÍAS siguientes</text><rect x=\"764\" y=\"46\" width=\"196\" height=\"86\" rx=\"8\" fill=\"#fdeceb\" stroke=\"#b91c1c\" stroke-width=\"1.4\"/><text x=\"862\" y=\"78.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#b91c1c\" font-weight=\"bold\">4 · SI TAMBIÉN FALLA</text><text x=\"862\" y=\"92.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Se procede conforme</text><text x=\"862\" y=\"106.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">al ART. 44</text><line x1=\"220\" y1=\"89\" x2=\"262\" y2=\"89\" stroke=\"#4b5563\" stroke-width=\"1.6\" marker-end=\"url(#t6efrr2)\"/><line x1=\"468\" y1=\"89\" x2=\"510\" y2=\"89\" stroke=\"#4b5563\" stroke-width=\"1.6\" marker-end=\"url(#t6efrr2)\"/><line x1=\"716\" y1=\"89\" x2=\"758\" y2=\"89\" stroke=\"#4b5563\" stroke-width=\"1.6\" marker-end=\"url(#t6efrr2)\"/><rect x=\"20\" y=\"146\" width=\"940\" height=\"54\" rx=\"8\" fill=\"#fdeceb\" stroke=\"#b91c1c\" stroke-width=\"1.4\"/><text x=\"490\" y=\"160.71\" font-size=\"10.6\" text-anchor=\"middle\" fill=\"#b91c1c\" font-weight=\"bold\">LA REGLA DE LAS QUINCE HORAS</text><text x=\"490\" y=\"176.71\" font-size=\"10.6\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Si el primer intento fue ANTES de las 15:00, el segundo debe ser DESPUÉS de las 15:00, y viceversa.</text><text x=\"490\" y=\"192.71\" font-size=\"10.6\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Y en todo caso, al menos TRES HORAS de diferencia entre ambos intentos.</text><text x=\"490\" y=\"224\" font-size=\"10.4\" text-anchor=\"middle\" fill=\"#4b5563\" font-weight=\"normal\">Toda notificación en papel se pone ADEMÁS a disposición en la sede electrónica, para que el interesado pueda acceder voluntariamente (42.1).</text><text x=\"490\" y=\"252\" font-size=\"10.4\" text-anchor=\"middle\" fill=\"#4b5563\" font-weight=\"normal\">Si accede en sede, se le ofrece que las siguientes se practiquen por medios electrónicos (42.3).</text><text x=\"490\" y=\"278\" font-size=\"11\" text-anchor=\"middle\" fill=\"#b91c1c\" font-weight=\"bold\">Las cuatro cifras: 14 años · una sola repetición · 3 días · 3 horas, con la frontera en las 15:00.</text></svg></section><section class=\"card\" id=\"test\"><h2>Test · 30 preguntas con corrección razonada</h2>\n<div class=\"tools noprint\" style=\"margin-bottom:.8rem\">\n <button id=\"corr\">Corregir todo</button>\n <button id=\"fallos\">Repetir solo los fallos</button>\n <button id=\"reset\">Reiniciar</button>\n <span class=\"seg\" role=\"group\" aria-label=\"Penalización\">\n  <button id=\"pen0\" data-pen=\"0\" aria-pressed=\"true\">Sin penalización</button>\n  <button id=\"pen1\" data-pen=\"1\" aria-pressed=\"false\">Penaliza −50 %</button>\n </span>\n <span id=\"score\" class=\"chip\" style=\"margin-left:.4rem\">0 de 30</span>\n</div>\n<div class=\"box warn\" style=\"margin-bottom:.7rem\"><span class=\"lbl\">Entrena las dos reglas</span><b>Sin penalización no dejes nada en blanco. Con penalización, contesta solo si has descartado al menos dos opciones.</b> Puedes devolver una pregunta a blanco después de contestarla.</div>\n<div id=\"testbox\"></div></section><section class=\"card\" id=\"sem\"><h2>Semáforo de autoevaluación</h2>\n<p class=\"small\">Marca cada destreza. Lo rojo y lo ámbar es tu repaso de mañana.</p>\n<div id=\"sembox\"></div><div id=\"semres\"></div></section><section class=\"card\" id=\"cierre\"><h2>Cierre y repaso espaciado</h2>\n<div class=\"idea\">La frase del tema: <b>la notificación electrónica se practica cuando accedes, y si no accedes en diez días naturales se entiende rechazada y el procedimiento sigue sin ti</b>. El aviso al móvil no cuenta para nada de eso.</div>\n<svg viewBox=\"0 0 960 250\" width=\"100%\" role=\"img\" aria-label=\"Publicación en el Boletín Oficial del Estado cuando la notificación resulta infructuosa y publicaciones facultativas\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"t6ffrr3\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#4b5563\"/></marker><marker id=\"t6ffer3\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#15803d\"/></marker><marker id=\"t6ffwr3\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#b45309\"/></marker></defs><text x=\"480\" y=\"24\" font-size=\"13\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"bold\">Cuando la notificación no llega · arts. 44 a 46 LPAC</text><rect x=\"20\" y=\"44\" width=\"920\" height=\"38\" rx=\"8\" fill=\"#e8efff\" stroke=\"#1d4ed8\" stroke-width=\"1.4\"/><text x=\"480\" y=\"66.71\" font-size=\"10.6\" text-anchor=\"middle\" fill=\"#1d4ed8\" font-weight=\"bold\">TRES SUPUESTOS · art. 44: interesados DESCONOCIDOS · se IGNORA el lugar · intentada, NO SE PUDO PRACTICAR</text><rect x=\"20\" y=\"98\" width=\"450\" height=\"62\" rx=\"8\" fill=\"#fdeceb\" stroke=\"#b91c1c\" stroke-width=\"1.4\"/><text x=\"245\" y=\"116.025\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#b91c1c\" font-weight=\"bold\">OBLIGATORIO</text><text x=\"245\" y=\"133.025\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Anuncio publicado en el</text><text x=\"245\" y=\"150.025\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">BOLETÍN OFICIAL DEL ESTADO</text><rect x=\"490\" y=\"98\" width=\"450\" height=\"62\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"715\" y=\"111.43\" font-size=\"9.8\" text-anchor=\"middle\" fill=\"#4b5563\" font-weight=\"bold\">FACULTATIVO Y PREVIO</text><text x=\"715\" y=\"125.43\" font-size=\"9.8\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Boletín de la comunidad o de la provincia ·</text><text x=\"715\" y=\"139.43\" font-size=\"9.8\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">tablón del ayuntamiento del último domicilio ·</text><text x=\"715\" y=\"153.43\" font-size=\"9.8\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">consulado o sección consular</text><rect x=\"20\" y=\"174\" width=\"920\" height=\"38\" rx=\"8\" fill=\"#fdf3e3\" stroke=\"#b45309\" stroke-width=\"1.4\"/><text x=\"480\" y=\"196.57\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Si la publicación LESIONA derechos o intereses legítimos · art. 46: solo una SOMERA INDICACIÓN del contenido y del lugar donde comparecer</text><text x=\"480\" y=\"234\" font-size=\"11\" text-anchor=\"middle\" fill=\"#b91c1c\" font-weight=\"bold\">Ninguna forma complementaria de difusión excluye la obligación de publicar en el BOE.</text></svg>\n<table><thead><tr><th>Si te preguntan…</th><th>La respuesta vive en…</th></tr></thead><tbody>\n<tr><td>Cuándo queda notificado electrónicamente</td><td>Art. 43.2 LPAC · al acceder al contenido</td></tr>\n<tr><td>Qué pasa si no entra en diez días</td><td>Art. 43.2 LPAC · rechazada, y son días naturales</td></tr>\n<tr><td>Si vale que no le llegara el SMS</td><td>Art. 43 RD 203/2021 · el aviso es meramente informativo</td></tr>\n<tr><td>Cuándo se repite el intento en papel</td><td>Art. 42.2 LPAC · una vez, en hora distinta, dentro de tres días</td></tr>\n<tr><td>Dónde se publica si no hay manera de notificar</td><td>Art. 44 LPAC · Boletín Oficial del Estado</td></tr>\n<tr><td>Dónde se publican las listas de una oposición</td><td>Art. 45.1.b) LPAC · donde dijo la convocatoria, y solo ahí</td></tr>\n</tbody></table>\n<div class=\"box ej\"><span class=\"lbl\">Calendario de repaso espaciado</span><ul>\n<li><b>Al día siguiente</b> — solo el test, y solo los fallos.</li>\n<li><b>A los 3 días</b> — las cifras del art. 42.2 y los diez naturales, escritas de memoria.</li>\n<li><b>A los 7 días</b> — el tema en vista «Texto legal», tapando la explicación.</li>\n<li><b>A los 21 días</b> — test completo con el interruptor de penalización activado.</li></ul></div></section>";

<script>
(function(){var n='<h2>Secciones</h2>';
 NAV.forEach(function(a){n+='<a href="#'+a[0]+'">'+a[1]+'</a>';});
 document.getElementById('navbody').innerHTML=n;})();
document.getElementById('navtoggle').onclick=function(){
 var s=document.getElementById('side');s.classList.toggle('collapsed');
 this.setAttribute('aria-expanded',s.classList.contains('collapsed')?'false':'true');};

/* ---------- TEST ---------- */
var estado=TEST.map(function(){return -1;}), soloFallos=false, revelar=false, pen=0;
function letra(i){return 'abcd'[i];}
function pintaTest(){
 var h='',n=0;
 TEST.forEach(function(q,i){
  if(soloFallos && estado[i]===q[2]) return;
  n++;
  h+='<div class="box" data-qi="'+i+'" style="border-color:var(--acc)"><span class="lbl" style="color:var(--acc)">Pregunta '+(i+1)+'</span><p style="margin:.1rem 0 .5rem">'+q[0]+'</p>';
  q[1].forEach(function(op,j){
   var sel=estado[i]===j, ok=j===q[2], show=(estado[i]>=0)||revelar;
   var bg='transparent',bd='var(--line)',ic='';
   if(show){ if(ok){bg='var(--ej-bg)';bd='var(--ej)';ic='✓ ';}
             else if(sel){bg='var(--exc-bg)';bd='var(--exc)';ic='✗ ';} }
   h+='<button class="opt" data-i="'+i+'" data-j="'+j+'" style="display:block;width:100%;text-align:left;margin:.22rem 0;background:'+bg+';border-color:'+bd+';white-space:normal;line-height:1.45'+(sel?';font-weight:600':'')+'">'+ic+letra(j)+') '+op+'</button>';
  });
  if(estado[i]>=0){
   h+='<div class="noprint" style="margin:.3rem 0 .1rem"><button class="blanco" data-i="'+i+'" style="font-size:.78rem;padding:.2rem .5rem">Dejar en blanco</button></div>';
  }
  if(estado[i]>=0||revelar){
   h+='<div style="margin-top:.5rem;font-size:.9rem">';
   q[3].forEach(function(f,j){
    var ok=j===q[2];
    h+='<p style="margin:.3rem 0;padding-left:.7rem;border-left:3px solid '+(ok?'var(--ej)':'var(--exc)')+'"><b>'+letra(j)+')</b> '+f+'</p>';});
   h+='</div>';
  }
  h+='</div>';
 });
 if(!n)h='<div class="box ej"><span class="lbl">Nada que repetir</span>No tienes fallos pendientes.</div>';
 document.getElementById('testbox').innerHTML=h;
 document.querySelectorAll('.opt').forEach(function(b){
  b.onclick=function(){estado[+b.getAttribute('data-i')]=+b.getAttribute('data-j');pintaTest();};});
 document.querySelectorAll('.blanco').forEach(function(b){
  b.onclick=function(){estado[+b.getAttribute('data-i')]=-1;pintaTest();};});
 marca();
}
function marca(){
 var ok=0,mal=0,bl=0;
 TEST.forEach(function(q,i){
  if(estado[i]<0){bl++;} else if(estado[i]===q[2]){ok++;} else {mal++;}});
 var N=TEST.length, max=25;
 var bruto=pen? (ok-mal/2) : ok;
 if(bruto<0)bruto=0;
 var nota=(bruto*max/N);
 document.getElementById('score').textContent=
  ok+' aciertos · '+mal+' fallos · '+bl+' en blanco  →  '+nota.toFixed(2)+' / '+max+(pen?'  (con penalización)':'  (sin penalización)');
}
document.getElementById('corr').onclick=function(){
 revelar=!revelar;this.textContent=revelar?'Ocultar soluciones':'Corregir todo';pintaTest();};
document.getElementById('fallos').onclick=function(){
 soloFallos=!soloFallos;this.textContent=soloFallos?'Ver todas':'Repetir solo los fallos';pintaTest();};
document.getElementById('reset').onclick=function(){
 estado=TEST.map(function(){return -1;});soloFallos=false;revelar=false;
 document.getElementById('fallos').textContent='Repetir solo los fallos';
 document.getElementById('corr').textContent='Corregir todo';pintaTest();};
document.querySelectorAll('[data-pen]').forEach(function(b){
 b.onclick=function(){
  pen=+b.getAttribute('data-pen');
  document.querySelectorAll('[data-pen]').forEach(function(x){x.setAttribute('aria-pressed',x===b?'true':'false');});
  marca();};});
pintaTest();

/* ---------- SEMÁFORO ---------- */
var sem=SEM.map(function(){return 0;});
function drawSem(){
 var h='<table><tbody>';
 SEM.forEach(function(c,i){
  h+='<tr><td>'+c+'</td><td style="width:150px;white-space:nowrap">'
   +['🟢','🟡','🔴'].map(function(e,j){
     var on=sem[i]===j+1;
     return '<button class="sembtn" data-i="'+i+'" data-v="'+(j+1)+'" aria-label="nivel '+(j+1)+'" style="font-size:1rem;padding:.15rem .35rem;margin-right:.2rem;border-color:'+(on?'var(--acc)':'var(--line)')+';background:'+(on?'var(--acc-soft)':'transparent')+'">'+e+'</button>';}).join('')
   +'</td></tr>';});
 h+='</tbody></table>';
 document.getElementById('sembox').innerHTML=h;
 document.querySelectorAll('.sembtn').forEach(function(b){
  b.onclick=function(){sem[+b.getAttribute('data-i')]=+b.getAttribute('data-v');drawSem();};});
 var r=[],a=[];
 sem.forEach(function(v,i){if(v===3)r.push(SEM[i]);if(v===2)a.push(SEM[i]);});
 var o='';
 if(r.length)o+='<div class="box exc"><span class="lbl">Vuelve a ello hoy mismo</span><ul><li>'+r.join('</li><li>')+'</li></ul></div>';
 if(a.length)o+='<div class="box warn"><span class="lbl">Refuerza en 24 h</span><ul><li>'+a.join('</li><li>')+'</li></ul></div>';
 if(!r.length&&!a.length&&sem.some(function(v){return v===1;}))o='<div class="box ej"><span class="lbl">Bien</span>Ahora explícaselo a alguien sin mirar la página.</div>';
 document.getElementById('semres').innerHTML=o;
}
drawSem();

/* ---------- GLOSARIO ---------- */
(function(){
 var tip=document.getElementById('tip');
 function show(el,ev){var k=el.getAttribute('data-g'),d=GLOS[k];if(!d)return;
  tip.innerHTML='<b>'+d[0]+'</b><br>'+d[1];tip.style.display='block';
  tip.style.left=Math.min(ev.clientX+12,window.innerWidth-340)+'px';
  tip.style.top=Math.min(ev.clientY+16,window.innerHeight-170)+'px';}
 document.addEventListener('mouseover',function(e){var t=e.target.closest('.t');if(t)show(t,e);});
 document.addEventListener('mouseout',function(e){if(e.target.closest('.t'))tip.style.display='none';});
 document.addEventListener('click',function(e){var t=e.target.closest('.t');if(t)show(t,e);else tip.style.display='none';});
})();

/* ---------- TABLA ORDENABLE ---------- */
(function(){
 var t=document.getElementById('tcif');if(!t)return;
 t.querySelectorAll('th.sortable').forEach(function(th,ci){
  var asc=true;
  th.onclick=function(){
   var tb=t.tBodies[0],rows=[].slice.call(tb.rows);
   rows.sort(function(a,b){
    var x=a.cells[ci].textContent.trim(),y=b.cells[ci].textContent.trim();
    var nx=parseFloat(x.replace(/\./g,'').replace(',','.')),ny=parseFloat(y.replace(/\./g,'').replace(',','.'));
    if(!isNaN(nx)&&!isNaN(ny))return asc?nx-ny:ny-nx;
    return asc?x.localeCompare(y,'es'):y.localeCompare(x,'es');});
   rows.forEach(function(r){tb.appendChild(r);});asc=!asc;};});
})();

/* ---------- VISTA ---------- */
document.querySelectorAll('[data-view]').forEach(function(b){
 b.onclick=function(){

 };});

 this.textContent=openAll?'Plegar todo':'Desplegar todo';};
document.getElementById('theme').onclick=function(){
 var h=document.documentElement;h.setAttribute('data-theme',h.getAttribute('data-theme')==='dark'?'light':'dark');};
var fs=16;
function zoomCuerpo(v){document.documentElement.style.setProperty('--z',(v/16).toFixed(4));}
document.getElementById('fs+').onclick=function(){fs=Math.min(22,fs+1);zoomCuerpo(fs);};

/* ---------- PROGRESO ---------- */
window.addEventListener('scroll',function(){
 var h=document.body.scrollHeight-window.innerHeight;
 document.getElementById('prog').style.width=(h>0?(window.scrollY/h*100):0)+'%';
 var cur=null;document.querySelectorAll('section.card').forEach(function(s){
  if(s.getBoundingClientRect().top<120)cur=s.id;});
 document.querySelectorAll('nav.side a').forEach(function(a){

},{passive:true});

/* ---------- BUSCADOR ---------- */
var q=document.getElementById('q'),timer=null;
function clearMarks(){document.querySelectorAll('mark.hit').forEach(function(m){
 var p=m.parentNode;p.replaceChild(document.createTextNode(m.textContent),m);p.normalize();});}
q.addEventListener('input',function(){
 clearTimeout(timer);timer=setTimeout(function(){
  clearMarks();
  var term=q.value.trim();
  document.querySelectorAll('section.card').forEach(function(s){s.classList.remove('hide');});
  if(term.length<3)return;
  var rx=new RegExp(term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
  document.querySelectorAll('section.card').forEach(function(s){
   var found=false;
   var w=document.createTreeWalker(s,NodeFilter.SHOW_TEXT,null);var nodes=[];
   while(w.nextNode()){var nd=w.currentNode;
    if(nd.parentNode.closest('script,style,mark,svg'))continue;
    if(rx.test(nd.nodeValue)){nodes.push(nd);rx.lastIndex=0;}}
   nodes.forEach(function(nd){
    found=true;
    var span=document.createElement('span');
    span.innerHTML=nd.nodeValue.replace(rx,function(m){return '<mark class="hit">'+m+'</mark>';});
    nd.parentNode.replaceChild(span,nd);});
   if(found){s.querySelectorAll('details.panel').forEach(function(d){if(d.querySelector('mark.hit'))d.open=true;});}
   s.classList.toggle('hide',!found);
  });
 },220);});
</script>
<script>

/* ═══ Mejoras de interacción · Bloque II ═══ */
(function(){
"use strict";
var K_THEME="oposi_bII_theme", K_FS="oposi_bII_fs", K_STREAK="oposi_bII_streak";
function load(k,f){try{var v=localStorage.getItem(k);return v?JSON.parse(v):f;}catch(e){return f;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
var root=document.documentElement;

/* Tema persistente (sobrescribe el toggle simple anterior) */
var saved=load(K_THEME,null);
if(saved){root.setAttribute("data-theme",saved);}
else if(window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches){root.setAttribute("data-theme","dark");}
var bt=document.getElementById("theme");
if(bt)bt.onclick=function(){
  var n=root.getAttribute("data-theme")==="dark"?"light":"dark";
  root.setAttribute("data-theme",n);save(K_THEME,n);
};

/* Tamaño de texto persistente · solo afecta al cuerpo de la página */
var fs=load(K_FS,16);
function setFs(v){
  fs=Math.max(13,Math.min(22,v));
  root.style.setProperty("--z",(fs/16).toFixed(4));
  save(K_FS,fs);
}
setFs(fs);
var bp=document.getElementById("fs+"),bm=document.getElementById("fs-");
if(bp)bp.onclick=function(){setFs(fs+1);};
if(bm)bm.onclick=function(){setFs(fs-1);};

/* Racha compartida con el índice */
(function(){
  var el=document.getElementById("streakN");if(!el)return;
  var hoy=new Date().toISOString().slice(0,10);
  var s=load(K_STREAK,{last:null,n:0});
  if(s.last!==hoy){
    var ayer=new Date(Date.now()-864e5).toISOString().slice(0,10);
    s.n=(s.last===ayer)?s.n+1:1;s.last=hoy;save(K_STREAK,s);
  }
  el.textContent=s.n;
})();

/* Reveal on scroll para las tarjetas */
function reveal(){
  var els=document.querySelectorAll("section.card:not(.rv)");
  if(!els.length)return;
  if(!("IntersectionObserver" in window)){return;}
  var io=new IntersectionObserver(function(es){
    es.forEach(function(en){if(en.isIntersecting){en.target.classList.add("in");io.unobserve(en.target);}});
  },{threshold:.06,rootMargin:"0px 0px -30px 0px"});
  Array.prototype.forEach.call(els,function(el){el.classList.add("rv");io.observe(el);});
}

/* Sección activa en el índice lateral */
function spy(){
  var links=document.querySelectorAll("nav.side a[href^='#']");
  if(!links.length||!("IntersectionObserver" in window))return;
  var map={};
  Array.prototype.forEach.call(links,function(a){
    var t=document.getElementById(a.getAttribute("href").slice(1));
    if(t)map[t.id]=a;
  });
  var io=new IntersectionObserver(function(es){
    es.forEach(function(en){
      if(en.isIntersecting){
        Array.prototype.forEach.call(links,function(a){a.classList.remove("on");});
        if(map[en.target.id])map[en.target.id].classList.add("on");
      }
    });
  },{rootMargin:"-80px 0px -70% 0px",threshold:0});
  Object.keys(map).forEach(function(id){io.observe(document.getElementById(id));});
}

/* Ripple en botones */
document.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b||b.classList.contains("navtoggle"))return;
  var r=b.getBoundingClientRect(),d=Math.max(r.width,r.height),s=document.createElement("span");
  s.className="ripple";s.style.width=s.style.height=d+"px";
  s.style.left=(e.clientX-r.left-d/2)+"px";s.style.top=(e.clientY-r.top-d/2)+"px";
  b.appendChild(s);setTimeout(function(){if(s.parentNode)s.parentNode.removeChild(s);},560);
});

/* Atajos de teclado */
document.addEventListener("keydown",function(e){
  if(e.target.matches("input,textarea"))return;
  if(e.key==="/"){var q=document.getElementById("q");if(q){e.preventDefault();q.focus();}}
  if(e.key==="t"&&bt)bt.click();
});

/* El contenido se inyecta por JS: esperamos a que exista */
function init(){reveal();spy();}
if(document.getElementById("main")&&document.getElementById("main").children.length){init();}
else{setTimeout(init,60);}
addEventListener("load",function(){setTimeout(init,80);});
})();

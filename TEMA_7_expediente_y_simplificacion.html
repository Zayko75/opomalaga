<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tema 7 · Funcionamiento electrónico del sector público (IV)</title>
<style>

/* ═══════════════════════════════════════════════════════════════
   SISTEMA DE DISEÑO · "Académico Gamificado" · Bloque II
   Temas 8, 9 y 10 · Auxiliar Administrativo
   ═══════════════════════════════════════════════════════════════ */
:root{
  --z:1;              /* A+ / A− · solo agranda el cuerpo de la página */

  --bg:#faf9f7;
  --bg-grad:radial-gradient(1100px 560px at 12% -8%, #ede9ff 0%, transparent 55%),
            radial-gradient(850px 460px at 96% 0%, #dcf5ee 0%, transparent 50%);
  --surface:#ffffff;
  --surface-2:#f4f3f0;
  --surface-3:#eceae5;
  --line:#e6e3dc;
  --line-strong:#d4d0c7;

  --ink:#15161c;
  --ink-2:#5d616e;
  --ink-3:#8b8f9c;

  --brand:#5b3df5;
  --brand-2:#7c5cff;
  --brand-soft:#efeaff;
  --brand-ring:rgba(91,61,245,.18);

  --legal:#4338ca;  --legal-bg:#eeecff;
  --ej:#059669;     --ej-bg:#e4f7f0;
  --warn:#c2690a;   --warn-bg:#fdf1de;
  --exc:#dc2626;    --exc-bg:#ffeceb;

  --ok:#16a34a; --ok-soft:#e7f7ec;
  --mid:#eab308; --mid-soft:#fdf6dd;
  --off:#a1a1aa; --off-soft:#f1f1f3;

  --sh-1:0 1px 2px rgba(20,20,30,.04), 0 2px 8px rgba(20,20,30,.04);
  --sh-2:0 2px 6px rgba(20,20,30,.05), 0 12px 28px rgba(20,20,30,.07);
  --sh-3:0 8px 20px rgba(91,61,245,.13), 0 24px 56px rgba(20,20,30,.10);
  --sh-glow:0 0 0 4px var(--brand-ring);

  --r-sm:9px; --r-md:14px; --r-lg:20px; --r-full:999px;

  --f-display:"Segoe UI Variable Display",system-ui,-apple-system,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-legal:ui-serif,Georgia,Cambria,"Times New Roman",serif;
  --f-mono:ui-monospace,"SF Mono","Cascadia Mono","Segoe UI Mono",Menlo,monospace;

  --t-h1:clamp(1.02rem,.95rem + .3vw,1.2rem);
  --t-h2:clamp(1.2rem,1.05rem + .6vw,1.55rem);
  --t-h3:clamp(1rem,.95rem + .25vw,1.12rem);
  --t-sm:.86rem;
  --t-xs:.75rem;

  --e-out:cubic-bezier(.22,1,.36,1);
  --e-spring:cubic-bezier(.34,1.56,.64,1);

  /* ── Compatibilidad con SVG y contenido generado ── */
  --panel:var(--surface);
  --ink2:var(--ink-2);
  --acc:var(--brand);
  --acc-soft:var(--brand-soft);
  --g:var(--ok); --y:var(--mid); --r:var(--exc);
}

html[data-theme="dark"]{
  --bg:#0a0b0f;
  --bg-grad:radial-gradient(1100px 560px at 12% -8%, #1c1740 0%, transparent 55%),
            radial-gradient(850px 460px at 96% 0%, #08302b 0%, transparent 50%);
  --surface:#13151b;
  --surface-2:#1a1d25;
  --surface-3:#232733;
  --line:#262a34;
  --line-strong:#343947;

  --ink:#eceef4;
  --ink-2:#9ba2b3;
  --ink-3:#6e7585;

  --brand:#8b6dff;
  --brand-2:#a78bff;
  --brand-soft:#1e1a3d;
  --brand-ring:rgba(139,109,255,.22);

  --legal:#a5b4fc; --legal-bg:#191b3a;
  --ej:#34d399;    --ej-bg:#0c2a24;
  --warn:#fbbf24;  --warn-bg:#2e2110;
  --exc:#fb7185;   --exc-bg:#331119;

  --ok:#4ade80; --ok-soft:#0e2a19;
  --mid:#facc15; --mid-soft:#2c2610;
  --off:#5b6070; --off-soft:#1c1f27;

  --sh-1:0 1px 2px rgba(0,0,0,.3), 0 2px 8px rgba(0,0,0,.25);
  --sh-2:0 2px 6px rgba(0,0,0,.35), 0 12px 28px rgba(0,0,0,.4);
  --sh-3:0 8px 20px rgba(139,109,255,.2), 0 24px 56px rgba(0,0,0,.5);
}

*,*::before,*::after{box-sizing:border-box}
html{font-size:16px;scroll-behavior:smooth}
/* A+ y A− agrandan o reducen únicamente el cuerpo: el texto de los
   artículos, las tablas y los diagramas. La cabecera, el índice lateral
   y los botones conservan su tamaño para no descolocar la pantalla. */
main{zoom:var(--z)}
@media print{main{zoom:1}}
body{
  margin:0;background:var(--bg);background-image:var(--bg-grad);
  background-attachment:fixed;background-repeat:no-repeat;
  color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.68;
  -webkit-font-smoothing:antialiased;
  transition:background-color .5s var(--e-out),color .3s;
}
::selection{background:var(--brand);color:#fff}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{font-family:var(--f-display);letter-spacing:-.022em;line-height:1.2}
.num{font-variant-numeric:tabular-nums}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:99px;border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3)}

/* ═══ HEADER ═══ */
header.top{
  position:sticky;top:0;z-index:60;
  background:color-mix(in srgb,var(--surface) 80%,transparent);
  backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);
  border-bottom:1px solid var(--line);
}
/* El título ocupa su propia línea, encima de los botones. Antes competía
   por el ancho con la barra de herramientas y acababa desmigado en una
   columna de una palabra por línea. */
.top-in{max-width:1280px;margin:0 auto;padding:.6rem 1.1rem .55rem;display:flex;flex-direction:column;gap:.5rem;align-items:stretch}
.brandwrap{display:flex;align-items:center;gap:.65rem;min-width:0;width:100%}
.mark{
  width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;
  font-weight:800;font-size:.8rem;letter-spacing:-.02em;text-decoration:none;
  box-shadow:0 4px 14px var(--brand-ring);
  transition:transform .3s var(--e-spring),box-shadow .3s;
}
.mark:hover{transform:rotate(-8deg) scale(1.08);box-shadow:var(--sh-3);text-decoration:none}
.top h1{font-size:var(--t-h1);margin:0;font-weight:800;line-height:1.25;min-width:0;flex:1 1 auto}
/* como mucho dos líneas: si no cabe, se recorta con puntos suspensivos */
.top h1 .tit{
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;text-wrap:balance;
}
.top h1 .sub{display:block;font-size:var(--t-xs);color:var(--ink-2);font-weight:500;letter-spacing:0;
  margin-top:.1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tools{margin-left:0;display:flex;gap:.4rem;flex-wrap:wrap;align-items:center;width:100%}

button,select,input[type=search]{
  font:inherit;font-size:var(--t-sm);font-weight:600;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:var(--r-sm);padding:.4rem .72rem;cursor:pointer;
  position:relative;overflow:hidden;
  transition:transform .18s var(--e-spring),border-color .2s,background .2s,box-shadow .2s,color .2s;
}
button:hover{transform:translateY(-1.5px);border-color:var(--brand);box-shadow:var(--sh-1)}
button:active{transform:translateY(0) scale(.97)}
button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible{outline:none;box-shadow:var(--sh-glow)}
input[type=search]{min-width:190px;cursor:text;font-weight:500}
input[type=search]:focus{border-color:var(--brand)}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--surface-2);padding:2px;gap:2px}
.seg button{border:0;border-radius:calc(var(--r-sm) - 2px);padding:.32rem .68rem;background:transparent;box-shadow:none}
.seg button:hover{transform:none;background:var(--surface)}
.seg button[aria-pressed="true"]{background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;box-shadow:0 2px 8px var(--brand-ring)}

.ripple{position:absolute;border-radius:50%;transform:scale(0);background:currentColor;opacity:.25;animation:rip .55s linear;pointer-events:none}
@keyframes rip{to{transform:scale(3.4);opacity:0}}

.progress{position:absolute;left:0;bottom:-1px;height:2.5px;width:0;
  background:linear-gradient(90deg,var(--brand),var(--legal),var(--ej));transition:width .1s linear}

/* ═══ LAYOUT ═══ */
.layout{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:270px 1fr;gap:1.8rem;padding:1.4rem 1.1rem 5rem}
main{min-width:0}

/* ═══ SIDEBAR ═══ */
nav.side{
  position:sticky;top:76px;align-self:start;max-height:calc(100vh - 96px);overflow:auto;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:.85rem;box-shadow:var(--sh-1);
}
nav.side h2{font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);
  margin:.5rem .4rem .5rem;font-weight:800}
nav.side h2:first-child{margin-top:.1rem}
nav.side a{
  display:flex;align-items:baseline;gap:.5rem;padding:.36rem .55rem;border-radius:var(--r-sm);
  text-decoration:none;color:var(--ink-2);font-size:var(--t-sm);font-weight:500;
  position:relative;transition:background .22s,color .22s,transform .22s var(--e-out);
}
nav.side a:hover{background:var(--surface-2);color:var(--ink);transform:translateX(3px);text-decoration:none}
nav.side a.on{background:var(--brand-soft);color:var(--brand);font-weight:700}
nav.side a.on::before{content:"";position:absolute;left:-.85rem;top:20%;bottom:20%;width:3px;
  border-radius:0 3px 3px 0;background:var(--brand)}
nav.side a b{color:var(--ink-3);font-weight:800;font-size:var(--t-xs);font-variant-numeric:tabular-nums;flex:none;min-width:1.9em}
nav.side a.on b{color:var(--brand)}
.navtoggle{display:none}

/* ═══ TARJETAS ═══ */
section.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:1.35rem 1.5rem;margin-bottom:1.1rem;box-shadow:var(--sh-1);
  transition:box-shadow .3s var(--e-out),border-color .3s;
}
section.card:hover{box-shadow:var(--sh-2)}
section.card>h2{
  margin:0 0 1rem;font-size:var(--t-h2);font-weight:800;
  display:flex;align-items:center;gap:.6rem;
}
section.card>h2::before{
  content:"";width:4px;height:1.05em;border-radius:99px;flex:none;
  background:linear-gradient(180deg,var(--brand),var(--brand-2));
}

/* ═══ ARTÍCULO ═══ */
.art{scroll-margin-top:86px;padding-top:.4rem}
.art + .art{margin-top:1.6rem;padding-top:1.6rem;border-top:1px dashed var(--line)}
.art h2{display:flex;flex-wrap:wrap;gap:.5rem;align-items:baseline;font-size:var(--t-h3);
  margin:0 0 .25rem;font-weight:800;letter-spacing:-.015em}
.art h2 .num{
  color:var(--brand);font-weight:800;font-family:var(--f-display);
  background:var(--brand-soft);padding:.1rem .5rem;border-radius:var(--r-sm);
  font-size:.92em;letter-spacing:-.02em;
}
.ubic{font-size:var(--t-xs);color:var(--ink-3);margin:0 0 .8rem;font-weight:600;
  letter-spacing:.03em;text-transform:uppercase}

/* ═══ IDEA CLAVE ═══ */
.idea{
  background:linear-gradient(100deg,var(--brand-soft),color-mix(in srgb,var(--brand-soft) 40%,transparent));
  border-left:4px solid var(--brand);border-radius:0 var(--r-md) var(--r-md) 0;
  padding:.75rem 1rem;font-weight:650;margin:.7rem 0 1rem;position:relative;
  font-size:.97rem;line-height:1.55;
}

/* ═══ ACORDEÓN ═══ */
details.panel{
  border:1px solid var(--line);border-radius:var(--r-md);margin:.6rem 0;
  background:var(--surface);overflow:hidden;
  transition:border-color .25s,box-shadow .25s,background .25s;
}
details.panel:hover{border-color:var(--line-strong)}
details.panel[open]{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-ring)}
details.panel>summary{
  cursor:pointer;padding:.62rem .9rem;font-weight:700;font-size:.93rem;
  list-style:none;display:flex;align-items:center;gap:.55rem;
  transition:background .2s,color .2s;
}
details.panel>summary:hover{background:var(--surface-2)}
details.panel[open]>summary{background:var(--brand-soft);color:var(--brand)}
details.panel>summary::-webkit-details-marker{display:none}
details.panel>summary::before{
  content:"";width:16px;height:16px;flex:none;border-radius:5px;
  background:var(--brand-soft);position:relative;transition:transform .3s var(--e-spring),background .25s;
}
details.panel>summary::after{
  content:"";position:absolute;width:0;height:0;margin-left:5px;
  border:4px solid transparent;border-left-color:var(--brand);
  transition:transform .3s var(--e-spring);
}
details.panel[open]>summary::before{background:var(--surface)}
details.panel[open]>summary::after{transform:rotate(90deg) translateX(-1px)}
details.panel .body{padding:.3rem 1rem 1rem;font-size:.95rem;animation:slidein .35s var(--e-out)}
@keyframes slidein{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* ═══ TEXTO LEGAL ═══ */
.legal{
  background:var(--legal-bg);border-left:4px solid var(--legal);
  border-radius:0 var(--r-md) var(--r-md) 0;padding:.85rem 1.05rem;
  font-family:var(--f-legal);font-size:.95rem;line-height:1.7;
}
.legal p{margin:.45rem 0}
.legal .lbl{
  font-family:var(--f-body);font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;
  color:var(--legal);font-weight:800;display:block;margin-bottom:.4rem;
}

/* ═══ CAJAS SEMÁNTICAS ═══ */
.box{
  border-left:4px solid var(--line);border-radius:0 var(--r-md) var(--r-md) 0;
  padding:.72rem .95rem;margin:.65rem 0;font-size:.94rem;
  transition:transform .25s var(--e-out),box-shadow .25s;
}
.box:hover{transform:translateX(3px);box-shadow:var(--sh-1)}
.box.ej{background:var(--ej-bg);border-color:var(--ej)}
.box.warn{background:var(--warn-bg);border-color:var(--warn)}
.box.exc{background:var(--exc-bg);border-color:var(--exc)}
.box .lbl{font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;font-weight:800;
  display:block;margin-bottom:.3rem}
.box.ej .lbl{color:var(--ej)}
.box.warn .lbl{color:var(--warn)}
.box.exc .lbl{color:var(--exc)}

.interp{
  border:1px dashed var(--warn);background:color-mix(in srgb,var(--warn-bg) 45%,transparent);
  border-radius:var(--r-md);padding:.65rem .9rem;font-size:.9rem;margin:.6rem 0;
}
.interp .lbl{font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;color:var(--warn);font-weight:800;display:block}

/* ═══ TABLAS ═══ */
table{width:100%;border-collapse:separate;border-spacing:0;font-size:.9rem;margin:.7rem 0;
  border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
th,td{padding:.5rem .68rem;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
td + td, th + th{border-left:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th{background:var(--surface-2);font-size:var(--t-xs);font-weight:800;letter-spacing:.05em;
  text-transform:uppercase;color:var(--ink-2);position:sticky;top:0}
tbody tr{transition:background .18s}
tbody tr:nth-child(even){background:color-mix(in srgb,var(--surface-2) 45%,transparent)}
tbody tr:hover{background:var(--brand-soft)}
th.sortable{cursor:pointer;user-select:none;transition:color .2s,background .2s}
th.sortable:hover{color:var(--brand);background:var(--brand-soft)}
th.sortable::after{content:" ⇅";color:var(--ink-3);font-size:.7rem}

ul,ol{margin:.5rem 0 .5rem 1.2rem;padding:0}
li{margin:.26rem 0}
li::marker{color:var(--brand);font-weight:700}

/* ═══ TOOLTIPS ═══ */
.t{border-bottom:1.5px dotted var(--brand);cursor:help;position:relative;
  transition:background .2s,color .2s}
.t:hover{background:var(--brand-soft);color:var(--brand);border-radius:3px}
#tip{
  position:fixed;z-index:99;max-width:330px;background:var(--ink);color:var(--bg);
  padding:.6rem .78rem;border-radius:var(--r-md);font-size:.82rem;line-height:1.5;
  display:none;box-shadow:0 8px 30px rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.08);
}
html[data-theme="dark"] #tip{background:#f0f1f5;color:#15161c}

/* ═══ FLECHAS DE DIAGRAMA ═══
   Un <path> con stroke pero sin fill toma el valor inicial (negro) y el
   navegador cierra el trazo implícitamente: aparece un triángulo relleno
   entre sus extremos. Forzamos fill:none para dejar solo la línea + la
   punta del <marker>, que sí lleva su color. */
svg path[stroke]:not([fill]){fill:none}
svg polyline:not([fill]){fill:none}
svg line{fill:none}

/* ═══ SVG ═══ */
svg{max-width:100%;height:auto;display:block;margin:.9rem auto}
svg text{font-family:var(--f-body)}

/* ═══ BUSCADOR ═══ */
mark.hit{background:linear-gradient(180deg,transparent 55%,#ffe066 55%);color:inherit;
  border-radius:2px;padding:0 1px;font-weight:600}
html[data-theme="dark"] mark.hit{background:linear-gradient(180deg,transparent 55%,#8a6d00 55%);color:#fff}

/* ═══ UTILIDADES ═══ */
.hide{display:none !important}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.small{font-size:var(--t-sm);color:var(--ink-2)}
.chip{
  display:inline-block;font-size:var(--t-xs);padding:.16rem .55rem;border-radius:var(--r-full);
  background:var(--brand-soft);color:var(--brand);font-weight:800;letter-spacing:.02em;
}

/* ═══ HUECOS RELLENABLES ═══ */
.gap{
  display:inline-block;min-width:5.5em;border-bottom:2px solid var(--brand);
  text-align:center;font-weight:700;color:transparent;cursor:pointer;
  transition:color .3s,background .3s;
}
.gap.on,.gap:hover{color:var(--brand);background:var(--brand-soft);border-radius:4px 4px 0 0}

/* ═══ REVELAR SOLUCIÓN ═══ */
.revelar{
  background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;border-color:transparent;
  font-weight:700;
}
.revelar:hover{box-shadow:var(--sh-3)}
.sol{
  margin-top:.7rem;padding:.8rem 1rem;border-radius:var(--r-md);
  background:var(--ej-bg);border-left:4px solid var(--ej);
  animation:slidein .4s var(--e-out);
}

/* ═══ TEST ═══ */
.opt{
  display:block;padding:.55rem .85rem;margin:.35rem 0;border:1.5px solid var(--line);
  border-radius:var(--r-md);cursor:pointer;background:var(--surface);font-size:.94rem;
  transition:border-color .22s,background .22s,transform .22s var(--e-out);
}
.opt:hover{border-color:var(--brand);background:var(--brand-soft);transform:translateX(4px)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft);font-weight:650}
.opt.ko{border-color:var(--exc);background:var(--exc-bg)}
.opt input{margin-right:.5rem;accent-color:var(--brand)}

#tscore,#semres{
  font-family:var(--f-display);font-weight:800;font-size:1.15rem;letter-spacing:-.02em;
}

/* ═══════════════════════════════════════════════════════════════
   FLASHCARDS 3D · mazo con giro, vuelo de salida y sheen
   ═══════════════════════════════════════════════════════════════ */
#flash{--fc-e:cubic-bezier(.2,.8,.25,1);--fc-h:250px}

/* — Escena — */
.fc-stage{
  perspective:1400px;perspective-origin:50% 45%;
  padding:.4rem 0 .2rem;position:relative;
}
.fc-deck{position:relative;height:var(--fc-h);will-change:transform}

/* — Cartas fantasma del mazo — */
.fc-ghost{
  position:absolute;inset:0;border-radius:var(--r-lg);
  background:var(--surface);border:1px solid var(--line);
  transition:transform .5s var(--fc-e),opacity .5s var(--fc-e);
}
.fc-ghost.g1{transform:translateY(9px) scale(.972);opacity:.75}
.fc-ghost.g2{transform:translateY(18px) scale(.944);opacity:.45}
.fc-deck.empty .fc-ghost{opacity:0;transform:translateY(26px) scale(.9)}

/* — Elevación durante el giro — */
.fc-lift{position:absolute;inset:0;transform-style:preserve-3d}
.fc-lift.lift{animation:fcLift .78s var(--fc-e)}
@keyframes fcLift{
  0%,100%{transform:scale(1) translateY(0)}
  45%{transform:scale(1.055) translateY(-16px)}
}
.fc-lift.out-ok{animation:fcOut .5s cubic-bezier(.5,0,.75,0) forwards}
.fc-lift.out-ko{animation:fcOutKo .5s cubic-bezier(.5,0,.75,0) forwards}
.fc-lift.in{animation:fcIn .48s var(--fc-e)}
@keyframes fcOut{
  0%{transform:translateX(0) rotate(0) scale(1);opacity:1}
  100%{transform:translateX(130%) rotate(17deg) scale(.85);opacity:0}
}
@keyframes fcOutKo{
  0%{transform:translateX(0) rotate(0) scale(1);opacity:1}
  100%{transform:translateX(-130%) rotate(-17deg) scale(.85);opacity:0}
}
@keyframes fcIn{
  0%{transform:translateY(26px) scale(.9);opacity:0}
  100%{transform:translateY(0) scale(1);opacity:1}
}

/* — La carta — */
.fc-card{
  position:absolute;inset:0;transform-style:preserve-3d;
  transition:transform .78s var(--fc-e);
  cursor:pointer;border-radius:var(--r-lg);
}
.fc-card:focus-visible{outline:none}
.fc-card:focus-visible .fc-face{box-shadow:var(--sh-glow),var(--sh-2)}

/* — Caras — */
.fc-face{
  position:absolute;inset:0;border-radius:var(--r-lg);
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  padding:2rem 2.2rem;text-align:center;overflow:hidden;
  box-shadow:var(--sh-2);
  transition:box-shadow .4s var(--fc-e);
}
.fc-card:hover .fc-face{box-shadow:var(--sh-3)}

/* Anverso · pregunta */
.fc-front{
  background:
    radial-gradient(120% 90% at 50% -20%, var(--brand-soft) 0%, transparent 60%),
    var(--surface);
  border:1.5px solid var(--line);color:var(--ink);
}
/* Reverso · respuesta */
.fc-back{
  transform:rotateY(180deg);
  background:linear-gradient(145deg,var(--brand) 0%,#6d4bf7 45%,var(--c5,#0891b2) 130%);
  border:1.5px solid transparent;color:#fff;
}
html[data-theme="dark"] .fc-back{
  background:linear-gradient(145deg,#5f45c9 0%,#4b3aa8 45%,#0e6b85 130%);
}
.fc-back .fc-txt{color:#fff}
.fc-back b,.fc-back strong{color:#fff;font-weight:800}

/* — Sheen que barre al girar — */
.fc-face::after{
  content:"";position:absolute;top:-60%;left:-70%;width:55%;height:220%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.42),transparent);
  transform:rotate(18deg);opacity:0;pointer-events:none;
}
.fc-lift.lift .fc-face::after{animation:fcSheen .78s var(--fc-e)}
@keyframes fcSheen{
  0%{opacity:0;left:-70%}
  35%{opacity:1}
  100%{opacity:0;left:150%}
}

/* — Etiqueta superior — */
.fc-tag{
  position:absolute;top:1rem;left:1.15rem;
  font-size:var(--t-xs);font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  display:inline-flex;align-items:center;gap:.4rem;
}
.fc-front .fc-tag{color:var(--brand)}
.fc-back .fc-tag{color:rgba(255,255,255,.9)}
.fc-tag::before{
  content:"";width:7px;height:7px;border-radius:50%;background:currentColor;
  animation:fcPulse 2.2s ease-in-out infinite;
}
@keyframes fcPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.65)}}

/* — Índice tipo naipe — */
.fc-pip{
  position:absolute;font-family:var(--f-display);font-weight:800;
  font-size:.78rem;letter-spacing:-.02em;opacity:.34;font-variant-numeric:tabular-nums;
}
.fc-pip.tr{top:1rem;right:1.15rem}
.fc-pip.bl{bottom:1rem;left:1.15rem;transform:rotate(180deg)}
.fc-front .fc-pip{color:var(--ink-2)}
.fc-back .fc-pip{color:#fff;opacity:.55}

/* — Texto — */
.fc-txt{
  font-size:clamp(1rem,.9rem + .55vw,1.28rem);font-weight:650;line-height:1.5;
  max-width:44ch;letter-spacing:-.012em;
}
.fc-front .fc-txt{font-family:var(--f-display);font-weight:700}
.fc-back .fc-txt{font-weight:600;line-height:1.6}
.fc-hint{
  position:absolute;bottom:1rem;left:0;right:0;
  font-size:var(--t-xs);font-weight:600;letter-spacing:.02em;
  display:flex;align-items:center;justify-content:center;gap:.4rem;
}
.fc-front .fc-hint{color:var(--ink-3)}
.fc-back .fc-hint{color:rgba(255,255,255,.72)}
.fc-hint .kbd{
  font-family:var(--f-mono);font-size:.68rem;font-weight:700;padding:.1rem .32rem;
  border-radius:5px;border:1px solid currentColor;opacity:.75;
}

/* — Pantalla final — */
.fc-done{
  position:absolute;inset:0;border-radius:var(--r-lg);
  background:linear-gradient(150deg,var(--ok-soft),var(--surface) 70%);
  border:1.5px solid var(--ok);
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  text-align:center;padding:2rem;gap:.35rem;
  animation:fcIn .5s var(--fc-e);box-shadow:var(--sh-2);
}
.fc-done .seal{
  font-size:2.6rem;line-height:1;
  animation:fcSeal .7s cubic-bezier(.2,1.5,.4,1);
}
@keyframes fcSeal{0%{transform:scale(0) rotate(-25deg);opacity:0}60%{transform:scale(1.2) rotate(6deg)}100%{transform:scale(1) rotate(0);opacity:1}}
.fc-done h3{font-size:1.3rem;font-weight:800;margin:.2rem 0 0}
.fc-done p{margin:0;color:var(--ink-2);font-size:var(--t-sm)}

/* — Barra de progreso de la ronda — */
.fc-bar{
  height:6px;border-radius:99px;background:var(--surface-3);
  overflow:hidden;margin:.95rem 0 .8rem;position:relative;
}
.fc-bar i{
  display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--brand),var(--c5,#0891b2));
  transition:width .55s var(--fc-e);
}

/* — Controles — */
.fc-ctrls{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.fc-ctrls button{font-weight:700}
#fcok{border-color:var(--ok);color:var(--ok)}
#fcok:hover{background:var(--ok);color:#fff;border-color:var(--ok)}
#fcko{border-color:var(--warn);color:var(--warn)}
#fcko:hover{background:var(--warn);color:#fff;border-color:var(--warn)}
#fcflip{background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;border-color:transparent}
#fcflip:hover{box-shadow:var(--sh-3)}

.fc-score{display:inline-flex;gap:.45rem;margin-left:auto;align-items:center}
.fc-pill{
  font-size:var(--t-xs);font-weight:800;padding:.24rem .6rem;border-radius:var(--r-full);
  font-variant-numeric:tabular-nums;border:1px solid;
}
.fc-pill.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.fc-pill.ko{color:var(--warn);border-color:var(--warn);background:var(--warn-bg)}
.fc-pill.left{color:var(--ink-2);border-color:var(--line);background:var(--surface-2)}
.fc-pill.bump{animation:fcBump .45s var(--e-spring)}
@keyframes fcBump{0%{transform:scale(1)}45%{transform:scale(1.28)}100%{transform:scale(1)}}

@media(max-width:620px){
  #flash{--fc-h:270px}
  .fc-face{padding:1.7rem 1.3rem}
  .fc-score{margin-left:0;width:100%}
}
@media(prefers-reduced-motion:reduce){
  .fc-card{transition:none}
  .fc-lift.lift,.fc-lift.in,.fc-lift.out-ok,.fc-lift.out-ko,.fc-face::after{animation:none !important}
}
@media print{.fc-stage,.fc-ctrls,.fc-bar{display:none !important}}
/* ═══ RESPUESTA ESTRUCTURADA ═══ */
.fc-face{justify-content:center}
.fc-face.struct{justify-content:flex-start;text-align:left;padding-top:3.1rem;padding-bottom:3.1rem}
.fc-body{
  width:100%;max-width:46ch;margin:0 auto;
  overflow-y:auto;max-height:100%;
  scrollbar-width:thin;
}
.fc-body::-webkit-scrollbar{width:5px}
.fc-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.35);border-radius:99px;border:0}
.fc-front .fc-body::-webkit-scrollbar-thumb{background:var(--line-strong)}

/* — Veredicto Sí / No — */
.fc-verdict{
  display:inline-flex;align-items:center;gap:.35rem;
  font-family:var(--f-display);font-weight:800;font-size:.82rem;
  letter-spacing:.06em;text-transform:uppercase;
  padding:.26rem .72rem;border-radius:var(--r-full);margin-bottom:.85rem;
  border:1.5px solid;animation:fcPopIn .45s var(--e-spring) backwards;animation-delay:.34s;
}
.fc-verdict.si{background:rgba(255,255,255,.16);border-color:rgba(190,255,215,.85);color:#d8ffe9}
.fc-verdict.no{background:rgba(255,255,255,.16);border-color:rgba(255,205,205,.85);color:#ffdedd}
@keyframes fcPopIn{0%{opacity:0;transform:scale(.7) translateY(6px)}100%{opacity:1;transform:none}}

/* — Párrafo — */
.fc-p{margin:0;font-size:clamp(1rem,.92rem + .45vw,1.2rem);font-weight:600;line-height:1.6}
.fc-face.struct .fc-p{font-size:clamp(.96rem,.9rem + .35vw,1.1rem)}

/* — Lista enumerada — */
.fc-list{list-style:none;margin:0;padding:0;display:grid;gap:.5rem;counter-reset:fc}
.fc-list li{
  counter-increment:fc;position:relative;margin:0;
  padding:.42rem .6rem .42rem 2.5rem;border-radius:var(--r-sm);
  background:rgba(255,255,255,.11);
  font-size:clamp(.92rem,.88rem + .3vw,1.04rem);font-weight:600;line-height:1.45;
  animation:fcRow .42s var(--e-out) backwards;
}
.fc-list li::before{
  content:counter(fc);position:absolute;left:.6rem;top:50%;transform:translateY(-50%);
  width:1.6rem;height:1.6rem;border-radius:50%;
  display:grid;place-items:center;
  background:rgba(255,255,255,.9);color:var(--brand);
  font-family:var(--f-display);font-weight:800;font-size:.78rem;
  font-variant-numeric:tabular-nums;
}
.fc-list.alpha li::before{content:counter(fc,lower-alpha)}
.fc-list li:nth-child(1){animation-delay:.36s}
.fc-list li:nth-child(2){animation-delay:.42s}
.fc-list li:nth-child(3){animation-delay:.48s}
.fc-list li:nth-child(4){animation-delay:.54s}
.fc-list li:nth-child(5){animation-delay:.60s}
.fc-list li:nth-child(n+6){animation-delay:.66s}
@keyframes fcRow{0%{opacity:0;transform:translateX(-12px)}100%{opacity:1;transform:none}}

/* — Cláusulas contrapuestas — */
.fc-clauses{display:grid;gap:.45rem}
.fc-clauses p{
  margin:0;padding:.45rem .7rem .45rem .95rem;border-radius:0 var(--r-sm) var(--r-sm) 0;
  background:rgba(255,255,255,.11);border-left:3px solid rgba(255,255,255,.55);
  font-size:clamp(.92rem,.88rem + .3vw,1.04rem);font-weight:600;line-height:1.5;
  animation:fcRow .42s var(--e-out) backwards;
}
.fc-clauses p:nth-child(1){animation-delay:.36s}
.fc-clauses p:nth-child(2){animation-delay:.44s}
.fc-clauses p:nth-child(3){animation-delay:.52s}

/* — Negritas resaltadas en el reverso — */
.fc-back .fc-body b,.fc-back .fc-body strong{
  font-weight:800;background:rgba(255,255,255,.2);
  padding:.03em .3em;border-radius:5px;
  box-decoration-break:clone;-webkit-box-decoration-break:clone;
}

/* — Cita legal al pie — */
.fc-cite{
  position:absolute;bottom:.95rem;left:0;right:0;
  display:inline-flex;align-items:center;justify-content:center;gap:.4rem;
  font-family:var(--f-mono);font-size:.74rem;font-weight:700;letter-spacing:.02em;
  color:rgba(255,255,255,.82);
  animation:fcPopIn .5s var(--e-out) backwards;animation-delay:.5s;
}
.fc-cite::before,.fc-cite::after{
  content:"";height:1px;width:clamp(18px,10%,52px);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.45));
}
.fc-cite::after{background:linear-gradient(90deg,rgba(255,255,255,.45),transparent)}
.fc-cite .s{font-size:.9rem;opacity:.75;font-family:var(--f-legal)}
.fc-front .fc-cite{color:var(--ink-3)}
.fc-front .fc-cite::before{background:linear-gradient(90deg,transparent,var(--line-strong))}
.fc-front .fc-cite::after{background:linear-gradient(90deg,var(--line-strong),transparent)}

/* la pista se oculta si hay cita, para no amontonar */
.fc-back .fc-cite ~ .fc-hint,.fc-back .fc-hint.muted{display:none}

@media(max-width:620px){
  #flash{--fc-h:320px}
  .fc-face.struct{padding-top:2.9rem;padding-bottom:2.8rem}
  .fc-list li{padding-left:2.3rem}
}
@media(prefers-reduced-motion:reduce){
  .fc-verdict,.fc-list li,.fc-clauses p,.fc-cite{animation:none !important}
}

/* ═══ SEMÁFORO ═══ */
.sembtn{
  border-radius:var(--r-full);padding:.32rem .7rem;font-weight:700;font-size:var(--t-sm);
}
.sembtn[data-v="g"]:hover,.sembtn.on[data-v="g"]{background:var(--ok);color:#fff;border-color:var(--ok)}
.sembtn[data-v="y"]:hover,.sembtn.on[data-v="y"]{background:var(--mid);color:#3d2f00;border-color:var(--mid)}
.sembtn[data-v="r"]:hover,.sembtn.on[data-v="r"]{background:var(--exc);color:#fff;border-color:var(--exc)}

/* ═══ CTA DE BLOQUE ═══ */
a.blk{
  display:inline-flex;align-items:center;gap:.5rem;
  background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;
  padding:.5rem .95rem;border-radius:var(--r-sm);font-weight:700;font-size:var(--t-sm);
  text-decoration:none;box-shadow:0 2px 10px var(--brand-ring);
  transition:transform .22s var(--e-spring),box-shadow .25s,gap .25s var(--e-out);
}
a.blk:hover{transform:translateY(-2px);box-shadow:var(--sh-3);gap:.75rem;text-decoration:none}
a.blk::after{content:"→"}
a.blk:active{transform:translateY(0) scale(.98)}

/* ═══ REVEAL ═══ */
.rv{opacity:0;transform:translateY(20px);transition:opacity .6s var(--e-out),transform .6s var(--e-out)}
.rv.in{opacity:1;transform:none}

/* ═══ RESPONSIVE ═══ */
@media(max-width:960px){
  .layout{grid-template-columns:1fr;padding-top:.9rem;gap:1rem}
  nav.side{position:static;max-height:none}
  nav.side.collapsed .navbody{display:none}
  .navtoggle{display:block;width:100%;text-align:left;font-weight:700}
  .grid2{grid-template-columns:1fr}
  .top h1 .sub{white-space:normal}
}
@media(max-width:620px){
  .top-in{padding:.55rem .8rem}
  .tools{width:100%;margin-left:0}
  /* en pantallas estrechas el título se achica un poco y puede llegar a
     tres líneas: preferimos eso a recortarlo y esconder texto */
  .top h1{font-size:.95rem}
  .top h1 .tit{-webkit-line-clamp:3}
  input[type=search]{flex:1;min-width:0}
  section.card{padding:1.05rem 1rem;border-radius:var(--r-md)}
  table{font-size:.82rem}
  th,td{padding:.4rem .5rem}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
  .rv{opacity:1;transform:none}
}
@media print{
  header.top,nav.side,.tools,.noprint,.progress{display:none !important}
  body{background:#fff;background-image:none;font-size:11pt;color:#000}
  .layout{display:block;max-width:none;padding:0}
  section.card{border:0;padding:0;margin:0 0 1rem;break-inside:avoid;box-shadow:none}
  details.panel{border:0;box-shadow:none}
  details.panel .body{display:block !important}
  details.panel>summary{padding-left:0}
  .art{break-inside:avoid}
  .rv{opacity:1;transform:none}
  a{color:#000;text-decoration:none}
}


/* ═══ ALTURA ADAPTATIVA DE LA TARJETA ═══ */
.fc-deck{transition:height .45s var(--fc-e)}
.fc-body{max-height:none;overflow:visible}
.fc-measure{
  position:absolute;left:0;right:0;top:0;height:auto;
  visibility:hidden;pointer-events:none;z-index:-1;
}
.fc-measure .fc-face{
  position:relative;inset:auto;height:auto;min-height:0;
  box-shadow:none;backface-visibility:visible;transform:none;
}
.fc-measure .fc-body{max-height:none;overflow:visible}
.fc-measure .fc-face::after{display:none}

/* ═══ MOSTRAR / OCULTAR ÍNDICE LATERAL ═══ */
.layout{transition:grid-template-columns .42s var(--e-out)}
.layout.nonav{grid-template-columns:0 1fr;gap:0}
.layout.nonav>nav.side{
  opacity:0;transform:translateX(-14px);pointer-events:none;
  padding:0;border-width:0;overflow:hidden;width:0;min-width:0;
}
nav.side{
  transition:opacity .3s var(--e-out),transform .38s var(--e-out);
  overflow-x:hidden;
}
#navhide .ic{display:inline-block;transition:transform .35s var(--e-spring);font-size:.95em;line-height:1}
#navhide[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
#navhide[aria-pressed="true"] .ic{transform:rotate(90deg)}
@media(max-width:960px){#navhide{display:none}}

/* ═══════════════════════════════════════════════════════════════
   LECTURA EN VOZ ALTA (TTS) del texto legal
   ═══════════════════════════════════════════════════════════════ */
.tts-bar{
  display:flex;align-items:center;gap:.45rem;flex-wrap:wrap;
  margin:.15rem 0 .7rem;
}
.tts-bar button{
  font-size:var(--t-xs);font-weight:700;padding:.3rem .62rem;
  border-radius:var(--r-full);border:1px solid var(--legal);
  background:transparent;color:var(--legal);
  display:inline-flex;align-items:center;gap:.35rem;line-height:1.2;
}
.tts-bar button:hover{background:var(--legal);color:var(--surface);border-color:var(--legal)}
.tts-bar button[hidden]{display:none}
.tts-bar .tts-play.on{background:var(--legal);color:var(--surface)}

/* Ondas de audio mientras lee */
.tts-wave{display:inline-flex;align-items:flex-end;gap:2px;height:11px}
.tts-wave i{
  width:2.5px;background:currentColor;border-radius:2px;height:35%;
  animation:ttsW .9s ease-in-out infinite;
}
.tts-wave i:nth-child(2){animation-delay:.15s}
.tts-wave i:nth-child(3){animation-delay:.3s}
.tts-wave i:nth-child(4){animation-delay:.45s}
@keyframes ttsW{0%,100%{height:32%}50%{height:100%}}

.tts-time{
  font-family:var(--f-mono);font-size:.7rem;font-weight:700;
  color:var(--ink-3);font-variant-numeric:tabular-nums;
}

/* Frase que se está leyendo */
.tts-s{transition:background .25s,color .25s;border-radius:3px}
.tts-s.now{
  background:linear-gradient(180deg,transparent 8%,color-mix(in srgb,var(--legal) 26%,transparent) 8%);
  box-shadow:0 0 0 2px color-mix(in srgb,var(--legal) 16%,transparent);
}
html[data-theme="dark"] .tts-s.now{
  background:linear-gradient(180deg,transparent 8%,color-mix(in srgb,var(--legal) 34%,transparent) 8%);
}
.legal.tts-on{box-shadow:0 0 0 3px color-mix(in srgb,var(--legal) 20%,transparent)}

/* ═══ Reproductor flotante ═══ */
.tts-mini{
  position:fixed;left:50%;bottom:1.1rem;transform:translateX(-50%) translateY(140%);
  z-index:80;display:flex;align-items:center;gap:.6rem;
  background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  border:1px solid var(--line);border-radius:var(--r-full);
  padding:.5rem .7rem .5rem .95rem;box-shadow:var(--sh-3);
  transition:transform .45s var(--e-spring),opacity .3s;opacity:0;pointer-events:none;
  max-width:min(94vw,540px);
}
.tts-mini.show{transform:translateX(-50%) translateY(0);opacity:1;pointer-events:auto}
.tts-mini .lbl{
  font-size:var(--t-xs);font-weight:800;color:var(--legal);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:16ch;
}
.tts-mini button{
  border-radius:50%;width:32px;height:32px;padding:0;display:grid;place-items:center;
  font-size:.8rem;border:1px solid var(--line);flex:none;
}
.tts-mini button.main{
  width:38px;height:38px;font-size:.95rem;
  background:linear-gradient(140deg,var(--legal),var(--brand));color:#fff;border-color:transparent;
}
.tts-mini .bar{
  flex:1;min-width:70px;height:5px;border-radius:99px;background:var(--surface-3);overflow:hidden;
}
.tts-mini .bar i{display:block;height:100%;width:0;background:var(--legal);
  border-radius:99px;transition:width .35s var(--e-out)}

/* ═══ Panel de ajustes de voz ═══ */
.tts-back{
  position:fixed;inset:0;z-index:90;background:rgba(10,10,18,.45);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  display:grid;place-items:center;padding:1rem;
  opacity:0;pointer-events:none;transition:opacity .3s var(--e-out);
}
.tts-back.show{opacity:1;pointer-events:auto}
.tts-panel{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--sh-3);width:min(94vw,470px);max-height:88vh;overflow:auto;
  padding:1.3rem 1.4rem;transform:translateY(16px) scale(.97);
  transition:transform .38s var(--e-spring);
}
.tts-back.show .tts-panel{transform:none}
.tts-panel h3{
  font-size:1.12rem;font-weight:800;margin:0 0 .25rem;
  display:flex;align-items:center;gap:.5rem;
}
.tts-panel .sub{font-size:var(--t-sm);color:var(--ink-2);margin:0 0 1.1rem}
.tts-row{margin-bottom:1.05rem}
.tts-row > label{
  display:block;font-size:var(--t-xs);font-weight:800;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-2);margin-bottom:.4rem;
}
.tts-seg{display:flex;gap:3px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:3px}
.tts-seg button{
  flex:1;border:0;background:transparent;border-radius:calc(var(--r-sm) - 3px);
  padding:.42rem .3rem;font-size:var(--t-sm);font-weight:700;box-shadow:none;
}
.tts-seg button:hover{transform:none;background:var(--surface)}
.tts-seg button[aria-pressed="true"]{
  background:linear-gradient(140deg,var(--legal),var(--brand));color:#fff;
}
.tts-panel select{
  width:100%;padding:.5rem .6rem;border-radius:var(--r-sm);
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  font-size:var(--t-sm);font-weight:600;cursor:pointer;
}
.tts-panel select:focus{border-color:var(--brand);outline:none}
.tts-slider{display:flex;align-items:center;gap:.75rem}
.tts-slider input[type=range]{flex:1;accent-color:var(--legal);cursor:pointer;height:22px}
.tts-val{
  font-family:var(--f-mono);font-weight:800;font-size:var(--t-sm);
  min-width:3.4em;text-align:right;color:var(--legal);font-variant-numeric:tabular-nums;
}
.tts-note{
  font-size:var(--t-xs);color:var(--ink-2);line-height:1.5;
  background:var(--surface-2);border-radius:var(--r-sm);padding:.6rem .75rem;margin:0 0 1rem;
}
.tts-note b{color:var(--ink)}
.tts-acts{display:flex;gap:.5rem;justify-content:flex-end;flex-wrap:wrap}
.tts-acts .prim{
  background:linear-gradient(140deg,var(--legal),var(--brand));color:#fff;border-color:transparent;
}
.tts-badge{
  font-size:.62rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
  padding:.1rem .35rem;border-radius:4px;background:var(--ej-bg);color:var(--ej);margin-left:.35rem;
}


/* — Variante compacta para los apartados desplegables — */
.tts-bar.mini{margin:0 0 .6rem}
.tts-bar.mini button{
  font-size:.7rem;padding:.24rem .55rem;
  border-color:var(--brand);color:var(--brand);
}
.tts-bar.mini button:hover{background:var(--brand);color:var(--surface)}
.tts-bar.mini .tts-play.on{background:var(--brand);color:var(--surface)}
.tts-bar.mini .tts-time{font-size:.66rem}
.idea .tts-bar.mini{margin:.55rem 0 0}
.legal.tts-on,.body.tts-on,.idea.tts-on{
  box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 20%,transparent)
}
.legal.tts-on{box-shadow:0 0 0 3px color-mix(in srgb,var(--legal) 20%,transparent)}


/* aviso de cambio de voz */
.tts-aviso{
  position:fixed;left:50%;bottom:5.2rem;transform:translateX(-50%) translateY(20px);
  z-index:95;max-width:min(92vw,460px);
  background:var(--warn-bg);border:1px solid var(--warn);color:var(--warn);
  border-radius:var(--r-md);padding:.6rem .9rem;font-size:var(--t-sm);font-weight:700;
  box-shadow:var(--sh-2);opacity:0;pointer-events:none;
  transition:opacity .3s var(--e-out),transform .35s var(--e-spring);
}
.tts-aviso.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:620px){
  .tts-mini{left:.6rem;right:.6rem;transform:translateY(140%);max-width:none}
  .tts-mini.show{transform:translateY(0)}
  .tts-mini .lbl{display:none}
}
@media(prefers-reduced-motion:reduce){
  .tts-wave i{animation:none;height:60%}
}
@media print{.tts-bar,.tts-mini,.tts-back{display:none !important}}

document.getElementById("main").innerHTML="<section class=\"card\" id=\"intro\"><h2>Tema 7 · Funcionamiento electrónico del sector público (IV)</h2>\n<p class=\"ubic\">La gestión electrónica de los procedimientos · Expediente y documento electrónico · Simplificación y reducción de cargas administrativas</p>\n<div class=\"idea\">Tres piezas encajadas: el <b>documento</b>, que es el ladrillo; el <b>expediente</b>, que es el muro; y la <b>simplificación</b>, que es no volver a pedirte lo que ya tienen y resolver más rápido cuando el asunto es sencillo.</div>\n<div class=\"box ej\"><span class=\"lbl\">Cómo está organizado</span><ul>\n<li><b>El documento</b> · art. 26 LPAC y arts. 46 y 50 del Reglamento: qué es un <span class=\"t\" data-g=\"documentoe\">documento administrativo electrónico</span>, sus cinco requisitos, los <span class=\"t\" data-g=\"metadatos\">metadatos</span> y la <span class=\"t\" data-g=\"marcatiempo\">marca de tiempo</span>.</li>\n<li><b>La copia</b> · art. 27 LPAC y arts. 47 a 49 y 53 del Reglamento: la <span class=\"t\" data-g=\"copiaauth\">copia auténtica</span>, de qué se expide, quién la hace y qué pasa con el papel que te quedan.</li>\n<li><b>El expediente</b> · arts. 28, 70 LPAC y art. 51 del Reglamento: qué entra en el <span class=\"t\" data-g=\"expediente\">expediente administrativo</span>, qué es <span class=\"t\" data-g=\"auxiliar\">información auxiliar</span> y el <span class=\"t\" data-g=\"indice\">índice electrónico autenticado</span>.</li>\n<li><b>La simplificación</b> · arts. 31 y 96 LPAC y arts. 61 y 64 del Reglamento: el registro permanente, la <span class=\"t\" data-g=\"simplificada\">tramitación simplificada</span>, las <span class=\"t\" data-g=\"intermediacion\">plataformas de intermediación</span> y la <span class=\"t\" data-g=\"reutilizacion\">reutilización de aplicaciones</span>.</li>\n</ul></div>\n<div class=\"box warn\"><span class=\"lbl\">Verifica la vigencia</span>Trabajado sobre los textos consolidados del BOE de la carpeta: Ley 39/2015, Ley 40/2015 y Real Decreto 203/2021.</div>\n<svg viewBox=\"0 0 980 300\" width=\"100%\" role=\"img\" aria-label=\"Contenido del expediente administrativo electrónico y la información que queda excluida\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"t7cfr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#4b5563\"/></marker><marker id=\"t7cfe\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#15803d\"/></marker><marker id=\"t7cfw\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#b45309\"/></marker></defs><text x=\"490\" y=\"24\" font-size=\"13\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"bold\">Qué entra y qué no entra en el expediente · art. 70 LPAC</text><rect x=\"20\" y=\"42\" width=\"920\" height=\"36\" rx=\"8\" fill=\"#e8efff\" stroke=\"#1d4ed8\" stroke-width=\"1.4\"/><text x=\"480\" y=\"63.85\" font-size=\"11\" text-anchor=\"middle\" fill=\"#1d4ed8\" font-weight=\"bold\">Conjunto ORDENADO de documentos y actuaciones que sirven de ANTECEDENTE Y FUNDAMENTO a la resolución</text><rect x=\"20\" y=\"90\" width=\"450\" height=\"96\" rx=\"8\" fill=\"#eaf6ee\" stroke=\"#15803d\" stroke-width=\"1.4\"/><text x=\"245\" y=\"106.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15803d\" font-weight=\"bold\">SÍ FORMA PARTE · 70.2</text><text x=\"245\" y=\"120.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Documentos, pruebas, dictámenes, informes,</text><text x=\"245\" y=\"134.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">acuerdos, notificaciones y demás diligencias</text><text x=\"245\" y=\"148.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">ÍNDICE NUMERADO cuando se remita</text><text x=\"245\" y=\"162.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">COPIA ELECTRÓNICA CERTIFICADA</text><text x=\"245\" y=\"176.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">de la resolución adoptada</text><rect x=\"490\" y=\"90\" width=\"450\" height=\"96\" rx=\"8\" fill=\"#fdeceb\" stroke=\"#b91c1c\" stroke-width=\"1.4\"/><text x=\"715\" y=\"106.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#b91c1c\" font-weight=\"bold\">NO FORMA PARTE · 70.4</text><text x=\"715\" y=\"120.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Información auxiliar o de apoyo: aplicaciones,</text><text x=\"715\" y=\"134.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">ficheros y bases de datos, notas, borradores,</text><text x=\"715\" y=\"148.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">opiniones, resúmenes, comunicaciones</text><text x=\"715\" y=\"162.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">e informes internos o entre órganos</text><text x=\"715\" y=\"176.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Y los JUICIOS DE VALOR</text><rect x=\"20\" y=\"198\" width=\"920\" height=\"44\" rx=\"8\" fill=\"#fdf3e3\" stroke=\"#b45309\" stroke-width=\"1.4\"/><text x=\"480\" y=\"216.14\" font-size=\"10.4\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"bold\">LA EXCEPCIÓN DEL 70.4: sí forman parte los INFORMES, PRECEPTIVOS Y FACULTATIVOS, solicitados antes de la resolución</text><text x=\"480\" y=\"231.14\" font-size=\"10.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">que ponga fin al procedimiento</text><text x=\"490\" y=\"264\" font-size=\"10.3\" text-anchor=\"middle\" fill=\"#4b5563\" font-weight=\"normal\">Al remitirlo: completo, foliado, autentificado y con índice autentificado (70.3). Un mismo documento puede estar en varios expedientes.</text><text x=\"490\" y=\"288\" font-size=\"9.8\" text-anchor=\"middle\" fill=\"#4b5563\" font-weight=\"normal\">El foliado se hace mediante ÍNDICE ELECTRÓNICO AUTENTICADO, firmado por el titular del órgano o sellado si el expediente se forma automáticamente (art. 51).</text></svg>\n<p class=\"small\">La pregunta más repetida del tema es la del art. 70.4: <b>qué no forma parte del expediente</b>. La segunda, la diferencia entre el art. 47.2 y el art. 49 del Reglamento.</p></section><section class=\"card art\" id=\"lpac26\"><h2><span class=\"num\">LPAC 26</span> Emisión de documentos por las Administraciones Públicas</h2><p class=\"ubic\">Ley 39/2015 ▸ Título I ▸ Capítulo II</p><div class=\"idea\">Cinco requisitos para que un documento electrónico administrativo sea válido.</div><svg viewBox=\"0 0 980 268\" width=\"100%\" role=\"img\" aria-label=\"Los cinco requisitos de validez del documento administrativo electrónico y los casos que no requieren firma\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"t7afr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#4b5563\"/></marker><marker id=\"t7afe\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#15803d\"/></marker><marker id=\"t7afw\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#b45309\"/></marker></defs><text x=\"490\" y=\"24\" font-size=\"13\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"bold\">Los cinco requisitos del documento electrónico válido · art. 26.2 LPAC</text><rect x=\"20\" y=\"46\" width=\"186\" height=\"86\" rx=\"8\" fill=\"#e8efff\" stroke=\"#1d4ed8\" stroke-width=\"1.4\"/><text x=\"113\" y=\"71.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#1d4ed8\" font-weight=\"bold\">a) INFORMACIÓN</text><text x=\"113\" y=\"85.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">archivada en soporte</text><text x=\"113\" y=\"99.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">electrónico, con formato</text><text x=\"113\" y=\"113.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">identificable</text><rect x=\"210\" y=\"46\" width=\"186\" height=\"86\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"303\" y=\"71.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#4b5563\" font-weight=\"bold\">b) DATOS DE</text><text x=\"303\" y=\"85.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">IDENTIFICACIÓN</text><text x=\"303\" y=\"99.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">que permitan su</text><text x=\"303\" y=\"113.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">individualización</text><rect x=\"400\" y=\"46\" width=\"186\" height=\"86\" rx=\"8\" fill=\"#fdf3e3\" stroke=\"#b45309\" stroke-width=\"1.4\"/><text x=\"493\" y=\"71.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"bold\">c) REFERENCIA</text><text x=\"493\" y=\"85.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">TEMPORAL</text><text x=\"493\" y=\"99.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">del momento en que</text><text x=\"493\" y=\"113.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">fue emitido</text><rect x=\"590\" y=\"46\" width=\"186\" height=\"86\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"683\" y=\"78.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#4b5563\" font-weight=\"bold\">d) METADATOS</text><text x=\"683\" y=\"92.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">MÍNIMOS</text><text x=\"683\" y=\"106.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">exigidos</text><rect x=\"780\" y=\"46\" width=\"186\" height=\"86\" rx=\"8\" fill=\"#eaf6ee\" stroke=\"#15803d\" stroke-width=\"1.4\"/><text x=\"873\" y=\"78.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15803d\" font-weight=\"bold\">e) FIRMAS</text><text x=\"873\" y=\"92.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">ELECTRÓNICAS</text><text x=\"873\" y=\"106.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">que correspondan</text><rect x=\"20\" y=\"146\" width=\"940\" height=\"44\" rx=\"8\" fill=\"#fdeceb\" stroke=\"#b91c1c\" stroke-width=\"1.4\"/><text x=\"490\" y=\"164.14\" font-size=\"10.4\" text-anchor=\"middle\" fill=\"#b91c1c\" font-weight=\"bold\">NO REQUIEREN FIRMA ELECTRÓNICA (26.3): los que se publiquen con carácter MERAMENTE INFORMATIVO</text><text x=\"490\" y=\"179.14\" font-size=\"10.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">y los que NO FORMEN PARTE de un expediente administrativo. En todo caso hay que identificar su origen.</text><text x=\"490\" y=\"218\" font-size=\"10.6\" text-anchor=\"middle\" fill=\"#4b5563\" font-weight=\"normal\">Son válidos los documentos que, cumpliendo estos requisitos, se trasladen a un tercero por medios electrónicos.</text><text x=\"490\" y=\"246\" font-size=\"11\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"bold\">Regla general del 26.1: los documentos se emiten POR ESCRITO y a través de MEDIOS ELECTRÓNICOS.</text></svg><details class=\"panel\" open><summary>Texto legal</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LPAC</span><p><b>Artículo 26. Emisión de documentos por las Administraciones Públicas.</b></p><p>1. Se entiende por documentos públicos administrativos los válidamente emitidos por los órganos de las Administraciones Públicas. Las Administraciones Públicas emitirán los documentos administrativos por escrito, a través de medios electrónicos, a menos que su naturaleza exija otra forma más adecuada de expresión y constancia.</p><p>2. Para ser considerados válidos, los documentos electrónicos administrativos deberán:</p><p>a) Contener información de cualquier naturaleza archivada en un soporte electrónico según un formato determinado susceptible de identificación y tratamiento diferenciado.</p><p>b) Disponer de los datos de identificación que permitan su individualización, sin perjuicio de su posible incorporación a un expediente electrónico.</p><p>c) Incorporar una referencia temporal del momento en que han sido emitidos.</p><p>d) Incorporar los metadatos mínimos exigidos.</p><p>e) Incorporar las firmas electrónicas que correspondan de acuerdo con lo previsto en la normativa aplicable. Se considerarán válidos los documentos electrónicos, que cumpliendo estos requisitos, sean trasladados a un tercero a través de medios electrónicos.</p><p>3. No requerirán de firma electrónica, los documentos electrónicos emitidos por las Administraciones Públicas que se publiquen con carácter meramente informativo, así como aquellos que no formen parte de un expediente administrativo. En todo caso, será necesario identificar el origen de estos documentos.</p></div></div></details><details class=\"panel\"><summary>Disección</summary><div class=\"body\"><ul>\n<li><b>Qué es (26.1):</b> documento público administrativo es el <b>válidamente emitido por los órganos</b> de las Administraciones. Se emiten <b>por escrito, a través de medios electrónicos</b>, salvo que su naturaleza exija otra forma.</li>\n<li><b>Los cinco requisitos (26.2):</b> <b>a)</b> información archivada en soporte electrónico con formato identificable; <b>b)</b> <b>datos de identificación</b> que permitan su individualización; <b>c)</b> <b>referencia temporal</b> del momento de emisión; <b>d)</b> <b>metadatos mínimos</b> exigidos; <b>e)</b> las <b>firmas electrónicas</b> que correspondan.</li>\n<li><b>Sin firma (26.3):</b> no la requieren los documentos que se publiquen con carácter <b>meramente informativo</b> ni los que <b>no formen parte de un expediente</b>. Pero <b>en todo caso hay que identificar su origen</b>.</li>\n</ul></div></details><details class=\"panel\"><summary>En lenguaje llano</summary><div class=\"body\"><p>Un documento administrativo electrónico es válido si se sabe qué es, de quién es, cuándo se hizo, lleva sus datos técnicos y va firmado. Lo meramente informativo no necesita firma, pero sí saberse de dónde sale.</p></div></details><details class=\"panel\"><summary>¿Por qué existe?</summary><div class=\"body\"><div class=\"interp\"><span class=\"lbl\">Interpretación · aportación externa</span>Los cinco requisitos son la traducción electrónica de lo que en papel daban el membrete, la fecha, el sello y la firma. Sin ellos, un fichero no se distingue de un borrador de cualquiera.</div></div></details><details class=\"panel\"><summary>Ejemplos</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Ejemplo 1</span>Una resolución de concesión de subvención: lleva los cinco requisitos.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 2</span>Una nota informativa publicada en el portal: no necesita firma, pero debe identificar su origen.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 3</span>Caso límite: un documento que cumple los cinco requisitos y se traslada a un tercero por medios electrónicos. Sigue siendo válido: el propio 26.2 lo dice.</div></div></details><details class=\"panel\"><summary>Trampas</summary><div class=\"body\"><div class=\"box warn\"><span class=\"lbl\">Cuidado</span>La excepción de firma del 26.3 es <b>doble</b> —informativos y no integrados en expediente— y <b>no exime de identificar el origen</b>. Esa coletilla es la que convierte la pregunta en trampa.</div></div></details><details class=\"panel\"><summary>Conexiones</summary><div class=\"body\"><p>Se desarrolla en el art. 46 del RD 203/2021; la referencia temporal, en el art. 50.</p></div></details><details class=\"panel\"><summary>Anclaje memorístico</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Para retenerlo</span>Cinco requisitos: <b>información · identificación · tiempo · metadatos · firma</b>.</div></div></details></section><section class=\"card art\" id=\"rd203_46\"><h2><span class=\"num\">RD 203/2021 46</span> Documento administrativo electrónico</h2><p class=\"ubic\">RD 203/2021 ▸ Capítulo V ▸ Sección 1.ª</p><div class=\"idea\">Define el documento por su origen: generado, recibido o incorporado por la Administración.</div><details class=\"panel\" open><summary>Texto legal</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · RD 203/2021</span><p><b>Artículo 46. Documento administrativo electrónico.</b></p><p>1. Se entiende por documento administrativo electrónico la información de cualquier naturaleza en forma electrónica, archivada en un soporte electrónico, según un formato determinado y susceptible de identificación y tratamiento diferenciado admitido en el Esquema Nacional de Interoperabilidad y normativa correspondiente, y que haya sido generada, recibida o incorporada por las Administraciones Públicas en el ejercicio de sus funciones sujetas a Derecho administrativo.</p><p>2. Cuando en el marco de un procedimiento administrativo tramitado por medios electrónicos el órgano actuante esté obligado a facilitar al interesado un ejemplar de un documento administrativo electrónico, dicho documento se podrá sustituir por la entrega de los datos necesarios para su acceso por medios electrónicos adecuados.</p></div></div></details><details class=\"panel\"><summary>Disección</summary><div class=\"body\"><ul>\n<li><b>Definición (46.1):</b> información de cualquier naturaleza en forma electrónica, archivada en soporte electrónico, con formato admitido en el <b>Esquema Nacional de Interoperabilidad</b>, <b>generada, recibida o incorporada</b> por las Administraciones <b>en el ejercicio de sus funciones sujetas a Derecho administrativo</b>.</li>\n<li><b>Entrega (46.2):</b> cuando haya que facilitar al interesado un ejemplar, <b>puede sustituirse por la entrega de los datos necesarios para su acceso</b> por medios electrónicos adecuados.</li>\n</ul></div></details><details class=\"panel\"><summary>En lenguaje llano</summary><div class=\"body\"><p>No hace falta que lo haya escrito la Administración: basta con que lo haya recibido o incorporado en el ejercicio de sus funciones administrativas.</p></div></details><details class=\"panel\"><summary>¿Por qué existe?</summary><div class=\"body\"><div class=\"interp\"><span class=\"lbl\">Interpretación · aportación externa</span>Si solo contaran los documentos generados por la propia Administración, quedarían fuera los aportados por los interesados, que son la mitad de cualquier expediente.</div></div></details><details class=\"panel\"><summary>Ejemplos</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Ejemplo 1</span>Un informe técnico municipal: generado.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 2</span>Una factura aportada por un contratista: recibida e incorporada.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 3</span>Caso límite: en lugar de enviarte el PDF, te dan el enlace y el código para descargarlo. El art. 46.2 lo permite.</div></div></details><details class=\"panel\"><summary>Trampas</summary><div class=\"body\"><div class=\"box warn\"><span class=\"lbl\">Cuidado</span>Las tres formas —<b>generada, recibida o incorporada</b>— se preguntan. Y el inciso «sujetas a Derecho administrativo» excluye la actividad privada de la Administración.</div></div></details><details class=\"panel\"><summary>Conexiones</summary><div class=\"body\"><p>Completa el art. 26 LPAC. Su conservación, en los arts. 53 a 55.</p></div></details><details class=\"panel\"><summary>Anclaje memorístico</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Para retenerlo</span><b>Generada, recibida o incorporada.</b> Las tres valen.</div></div></details></section><section class=\"card art\" id=\"rd203_50\"><h2><span class=\"num\">RD 203/2021 50</span> Referencia temporal de los documentos electrónicos</h2><p class=\"ubic\">RD 203/2021 ▸ Capítulo V ▸ Sección 1.ª</p><div class=\"idea\">Dos modalidades: marca de tiempo y sello cualificado de tiempo.</div><details class=\"panel\" open><summary>Texto legal</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · RD 203/2021</span><p><b>Artículo 50. Referencia temporal de los documentos administrativos electrónicos.</b></p><p>1. Todos los documentos administrativos electrónicos deberán llevar asociadas una de las siguientes modalidades de referencia temporal, de acuerdo con lo que determinen las normas reguladoras de los respectivos procedimientos:</p><p>a) Marca de tiempo, entendiendo por tal la asignación por medios electrónicos de la fecha y, en su caso, la hora a un documento electrónico.</p><p>b) Sello electrónico cualificado de tiempo, entendiendo por tal la asignación por medios electrónicos de una fecha y hora a un documento electrónico con la intervención de un prestador cualificado de servicios de confianza que asegure la exactitud e integridad de la marca de tiempo del documento. Los sellos electrónicos de tiempo no cualificados serán asimilables a todos los efectos a las marcas de tiempo.</p><p>2. La marca de tiempo será utilizada en todos aquellos casos en los que las normas reguladoras no establezcan la utilización de un sello electrónico cualificado de tiempo La información relativa a las marcas y sellos electrónicos cualificados de tiempo se asociará a los documentos electrónicos en la forma que determine el Esquema Nacional de Interoperabilidad y normativa correspondiente.</p><p>3. La relación de prestadores cualificados de servicios de confianza que prestan servicios de sellado de tiempo en el sector público deberá estar incluida en la «Lista de confianza de prestadores cualificados de servicios de confianza».</p></div></div></details><details class=\"panel\"><summary>Disección</summary><div class=\"body\"><ul>\n<li><b>a) Marca de tiempo:</b> asignación por medios electrónicos de <b>la fecha y, en su caso, la hora</b> a un documento electrónico.</li>\n<li><b>b) Sello electrónico cualificado de tiempo:</b> igual, pero <b>con la intervención de un prestador cualificado de servicios de confianza</b> que asegure la exactitud e integridad de la marca.</li>\n<li><b>Equiparación:</b> los sellos de tiempo <b>no cualificados</b> son asimilables <b>a todos los efectos</b> a las marcas de tiempo.</li>\n</ul></div></details><details class=\"panel\"><summary>En lenguaje llano</summary><div class=\"body\"><p>Hay dos formas de fechar un documento electrónico: la propia Administración lo fecha, o lo fecha un tercero de confianza autorizado. La segunda es más fuerte.</p></div></details><details class=\"panel\"><summary>¿Por qué existe?</summary><div class=\"body\"><div class=\"interp\"><span class=\"lbl\">Interpretación · aportación externa</span>Cuando la fecha decide un plazo —un recurso, una oferta—, interesa que no dependa del reloj de quien la pone. El sello cualificado traslada esa garantía a un tercero independiente.</div></div></details><details class=\"panel\"><summary>Ejemplos</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Ejemplo 1</span>Un informe interno fechado con marca de tiempo.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 2</span>La apertura de ofertas en una licitación electrónica, con sello cualificado de tiempo.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 3</span>Caso límite: un sello de tiempo no cualificado. Vale como marca de tiempo, pero no aporta la garantía reforzada del cualificado.</div></div></details><details class=\"panel\"><summary>Trampas</summary><div class=\"body\"><div class=\"box warn\"><span class=\"lbl\">Cuidado</span>«Cualificado» implica <b>prestador cualificado de servicios de confianza</b>. Sin él, es marca de tiempo.</div></div></details><details class=\"panel\"><summary>Conexiones</summary><div class=\"body\"><p>Desarrolla el art. 26.2.c) LPAC.</p></div></details><details class=\"panel\"><summary>Anclaje memorístico</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Para retenerlo</span>Marca de tiempo = <b>la pone la casa</b>. Sello cualificado = <b>la pone un tercero autorizado</b>.</div></div></details></section><section class=\"card art\" id=\"lpac27\"><h2><span class=\"num\">LPAC 27</span> Validez y eficacia de las copias realizadas por las Administraciones</h2><p class=\"ubic\">Ley 39/2015 ▸ Título I ▸ Capítulo II</p><div class=\"idea\">La copia auténtica vale lo mismo que el original, y sirve en todas las Administraciones.</div><svg viewBox=\"0 0 980 300\" width=\"100%\" role=\"img\" aria-label=\"Validez de la copia auténtica, de qué se expide, quién la hace y órganos competentes\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"t7bfr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#4b5563\"/></marker><marker id=\"t7bfe\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#15803d\"/></marker><marker id=\"t7bfw\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#b45309\"/></marker></defs><text x=\"490\" y=\"24\" font-size=\"13\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"bold\">La copia auténtica · art. 27 LPAC y arts. 47 a 49 RD 203/2021</text><rect x=\"20\" y=\"42\" width=\"920\" height=\"36\" rx=\"8\" fill=\"#eaf6ee\" stroke=\"#15803d\" stroke-width=\"1.4\"/><text x=\"480\" y=\"64.025\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#15803d\" font-weight=\"bold\">MISMA VALIDEZ Y EFICACIA QUE LOS DOCUMENTOS ORIGINALES · art. 27.2</text><rect x=\"20\" y=\"90\" width=\"450\" height=\"70\" rx=\"8\" fill=\"#e8efff\" stroke=\"#1d4ed8\" stroke-width=\"1.4\"/><text x=\"245\" y=\"106.21\" font-size=\"10.6\" text-anchor=\"middle\" fill=\"#1d4ed8\" font-weight=\"bold\">SE EXPIDE SIEMPRE A PARTIR DE</text><text x=\"245\" y=\"121.21\" font-size=\"10.6\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">un ORIGINAL</text><text x=\"245\" y=\"136.21\" font-size=\"10.6\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">o de OTRA COPIA AUTÉNTICA</text><text x=\"245\" y=\"151.21\" font-size=\"10.6\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">art. 47.2</text><rect x=\"490\" y=\"90\" width=\"450\" height=\"70\" rx=\"8\" fill=\"#e8efff\" stroke=\"#1d4ed8\" stroke-width=\"1.4\"/><text x=\"715\" y=\"106.21\" font-size=\"10.6\" text-anchor=\"middle\" fill=\"#1d4ed8\" font-weight=\"bold\">QUIÉN LA HACE · art. 27.1</text><text x=\"715\" y=\"121.21\" font-size=\"10.6\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">FUNCIONARIO HABILITADO</text><text x=\"715\" y=\"136.21\" font-size=\"10.6\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">o ACTUACIÓN ADMINISTRATIVA</text><text x=\"715\" y=\"151.21\" font-size=\"10.6\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">AUTOMATIZADA</text><rect x=\"20\" y=\"172\" width=\"228\" height=\"50\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"134\" y=\"193.93\" font-size=\"9.8\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">a) Órganos que emiten</text><text x=\"134\" y=\"206.93\" font-size=\"9.8\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">los documentos originales</text><rect x=\"252\" y=\"172\" width=\"228\" height=\"50\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"366\" y=\"193.93\" font-size=\"9.8\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">b) Órganos de custodia</text><text x=\"366\" y=\"206.93\" font-size=\"9.8\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">y archivo</text><rect x=\"484\" y=\"172\" width=\"228\" height=\"50\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"598\" y=\"193.93\" font-size=\"9.8\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">c) Órganos previstos</text><text x=\"598\" y=\"206.93\" font-size=\"9.8\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">en sus normas</text><rect x=\"716\" y=\"172\" width=\"228\" height=\"50\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"830\" y=\"193.93\" font-size=\"9.8\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">d) Oficinas de asistencia</text><text x=\"830\" y=\"206.93\" font-size=\"9.8\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">en materia de registros</text><rect x=\"20\" y=\"234\" width=\"920\" height=\"40\" rx=\"8\" fill=\"#fdf3e3\" stroke=\"#b45309\" stroke-width=\"1.4\"/><text x=\"480\" y=\"257.85\" font-size=\"11\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"bold\">Las copias auténticas de DOCUMENTOS PRIVADOS surten ÚNICAMENTE EFECTOS ADMINISTRATIVOS · art. 27.1</text><text x=\"490\" y=\"288\" font-size=\"11\" text-anchor=\"middle\" fill=\"#b91c1c\" font-weight=\"bold\">Las copias auténticas hechas por una Administración TIENEN VALIDEZ EN LAS RESTANTES.</text></svg><details class=\"panel\" open><summary>Texto legal</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LPAC</span><p><b>Artículo 27. Validez y eficacia de las copias realizadas por las Administraciones Públicas.</b></p><p>1. Cada Administración Pública determinará los órganos que tengan atribuidas las competencias de expedición de copias auténticas de los documentos públicos administrativos o privados. Las copias auténticas de documentos privados surten únicamente efectos administrativos. Las copias auténticas realizadas por una Administración Pública tendrán validez en las restantes Administraciones. A estos efectos, la Administración General del Estado, las Comunidades Autónomas y las Entidades Locales podrán realizar copias auténticas mediante funcionario habilitado o mediante actuación administrativa automatizada. Se deberá mantener actualizado un registro, u otro sistema equivalente, donde constarán los funcionarios habilitados para la expedición de copias auténticas que deberán ser plenamente interoperables y estar interconectados con los de las restantes Administraciones Públicas, a los efectos de comprobar la validez de la citada habilitación. En este registro o sistema equivalente constarán, al menos, los funcionarios que presten servicios en las oficinas de asistencia en materia de registros.</p><p>2. Tendrán la consideración de copia auténtica de un documento público administrativo o privado las realizadas, cualquiera que sea su soporte, por los órganos competentes de las Administraciones Públicas en las que quede garantizada la identidad del órgano que ha realizado la copia y su contenido. Las copias auténticas tendrán la misma validez y eficacia que los documentos originales.</p><p>3. Para garantizar la identidad y contenido de las copias electrónicas o en papel, y por tanto su carácter de copias auténticas, las Administraciones Públicas deberán ajustarse a lo previsto en el Esquema Nacional de Interoperabilidad, el Esquema Nacional de Seguridad y sus normas técnicas de desarrollo, así como a las siguientes reglas:</p><p>a) Las copias electrónicas de un documento electrónico original o de una copia electrónica auténtica, con o sin cambio de formato, deberán incluir los metadatos que acrediten su condición de copia y que se visualicen al consultar el documento.</p><p>b) Las copias electrónicas de documentos en soporte papel o en otro soporte no electrónico susceptible de digitalización, requerirán que el documento haya sido digitalizado y deberán incluir los metadatos que acrediten su condición de copia y que se visualicen al consultar el documento. Se entiende por digitalización, el proceso tecnológico que permite convertir un documento en soporte papel o en otro soporte no electrónico en un fichero electrónico que contiene la imagen codificada, fiel e íntegra del documento.</p><p>c) Las copias en soporte papel de documentos electrónicos requerirán que en las mismas figure la condición de copia y contendrán un código generado electrónicamente u otro sistema de verificación, que permitirá contrastar la autenticidad de la copia mediante el acceso a los archivos electrónicos del órgano u Organismo público emisor.</p><p>d) Las copias en soporte papel de documentos originales emitidos en dicho soporte se proporcionarán mediante una copia auténtica en papel del documento electrónico que se encuentre en poder de la Administración o bien mediante una puesta de manifiesto electrónica conteniendo copia auténtica del documento original. A estos efectos, las Administraciones harán públicos, a través de la sede electrónica correspondiente, los códigos seguros de verificación u otro sistema de verificación utilizado.</p><p>4. Los interesados podrán solicitar, en cualquier momento, la expedición de copias auténticas de los documentos públicos administrativos que hayan sido válidamente emitidos por las Administraciones Públicas. La solicitud se dirigirá al órgano que emitió el documento original, debiendo expedirse, salvo las excepciones derivadas de la aplicación de la Ley 19/2013, de 9 de diciembre, en el plazo de quince días a contar desde la recepción de la solicitud en el registro electrónico de la Administración u Organismo competente. Asimismo, las Administraciones Públicas estarán obligadas a expedir copias auténticas electrónicas de cualquier documento en papel que presenten los interesados y que se vaya a incorporar a un expediente administrativo.</p><p>5. Cuando las Administraciones Públicas expidan copias auténticas electrónicas, deberá quedar expresamente así indicado en el documento de la copia.</p><p>6. La expedición de copias auténticas de documentos públicos notariales, registrales y judiciales, así como de los diarios oficiales, se regirá por su legislación específica.</p></div></div></details><details class=\"panel\"><summary>Disección</summary><div class=\"body\"><ul>\n<li><b>Quién (27.1):</b> cada Administración determina los <b>órganos competentes</b> para expedirlas. Pueden hacerse <b>mediante funcionario habilitado o mediante actuación administrativa automatizada</b>, y hay que mantener un <b>registro</b> de funcionarios habilitados, <b>interoperable e interconectado</b> con los de las demás Administraciones. En él constarán <b>al menos</b> los que prestan servicio en las <b>oficinas de asistencia en materia de registros</b>.</li>\n<li><b>Documentos privados:</b> sus copias auténticas surten <b>únicamente efectos administrativos</b>.</li>\n<li><b>Validez cruzada:</b> las copias auténticas hechas por una Administración <b>tienen validez en las restantes</b>.</li>\n<li><b>Qué es (27.2):</b> la realizada <b>cualquiera que sea el soporte</b> por órgano competente, garantizando <b>la identidad del órgano que la hizo y su contenido</b>. Tienen <b>la misma validez y eficacia que los documentos originales</b>.</li>\n<li><b>Cómo (27.3):</b> conforme al Esquema Nacional de Interoperabilidad y al de Seguridad; las copias electrónicas incluyen <b>metadatos que acrediten su condición de copia</b> y que se visualicen al consultar el documento.</li>\n</ul></div></details><details class=\"panel\"><summary>En lenguaje llano</summary><div class=\"body\"><p>Una copia auténtica no es una fotocopia: tiene el mismo valor que el original y la admite cualquier Administración. Y se sabe que es copia porque lo dicen sus metadatos.</p></div></details><details class=\"panel\"><summary>¿Por qué existe?</summary><div class=\"body\"><div class=\"interp\"><span class=\"lbl\">Interpretación · aportación externa</span>Sin equivalencia entre copia auténtica y original, la digitalización sería inútil: habría que seguir custodiando y moviendo papeles. La validez cruzada entre Administraciones es lo que evita pedir el mismo certificado tres veces.</div></div></details><details class=\"panel\"><summary>Ejemplos</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Ejemplo 1</span>La oficina de asistencia digitaliza tu título y expide copia auténtica: vale como el original en cualquier Administración.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 2</span>Una copia auténtica de un contrato privado aportado a un expediente: solo surte efectos administrativos.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 3</span>Caso límite: copia auténtica obtenida por actuación automatizada, sin funcionario. El art. 27.1 lo admite expresamente.</div></div></details><details class=\"panel\"><summary>Trampas</summary><div class=\"body\"><div class=\"box warn\"><span class=\"lbl\">Cuidado</span>Dos matices que caen: las copias de <b>documentos privados</b> surten <b>únicamente efectos administrativos</b>; y la copia auténtica puede hacerse por <b>funcionario habilitado</b> <b>o</b> por <b>actuación automatizada</b>, no solo lo primero.</div></div></details><details class=\"panel\"><summary>Conexiones</summary><div class=\"body\"><p>Con el art. 16.5 —digitalización—, con el art. 12 —funcionarios habilitados— y con los arts. 47 a 49 del RD 203/2021.</p></div></details><details class=\"panel\"><summary>Anclaje memorístico</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Para retenerlo</span>Copia auténtica = <b>mismo valor que el orig

inal</b>, y <b>vale en todas</b>. Privados: <b>solo efectos administrativos</b>.</div></div></details></section><section class=\"card art\" id=\"rd203_47\"><h2><span class=\"num\">RD 203/2021 47</span> Requisitos de validez y eficacia de las copias auténticas</h2><p class=\"ubic\">RD 203/2021 ▸ Capítulo V ▸ Sección 2.ª</p><div class=\"idea\">Siempre se expiden a partir de un original o de otra copia auténtica.</div><details class=\"panel\" open><summary>Texto legal</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · RD 203/2021</span><p><b>Artículo 47. Requisitos de validez y eficacia de las copias auténticas de documentos.</b></p><p>1. De acuerdo con lo previsto en el artículo 27.2 de la Ley 39/2015, de 1 de octubre, tendrá la consideración de copia auténtica de un documento público administrativo o privado original o de otra copia auténtica, la realizada, cualquiera que sea su soporte, por los órganos competentes de las Administraciones Públicas en las que quede garantizada la identidad del órgano que ha realizado la copia y su contenido.</p><p>2. Las copias auténticas se expedirán siempre a partir de un original o de otra copia auténtica y tendrán la misma validez y eficacia que los documentos originales.</p></div></div></details><details class=\"panel\"><summary>Disección</summary><div class=\"body\"><ul>\n<li><b>Concepto (47.1):</b> remite al art. 27.2 LPAC: copia de un documento público administrativo o privado <b>original o de otra copia auténtica</b>, hecha por órgano competente, garantizando la identidad del órgano y el contenido.</li>\n<li><b>La regla de origen (47.2):</b> «Las copias auténticas <b>se expedirán siempre a partir de un original o de otra copia auténtica</b> y tendrán la misma validez y eficacia que los documentos originales».</li>\n</ul></div></details><details class=\"panel\"><summary>En lenguaje llano</summary><div class=\"body\"><p>No se hace copia auténtica de una fotocopia cualquiera: hace falta partir del original o de otra copia que ya sea auténtica.</p></div></details><details class=\"panel\"><summary>¿Por qué existe?</summary><div class=\"body\"><div class=\"interp\"><span class=\"lbl\">Interpretación · aportación externa</span>La cadena de autenticidad solo se sostiene si cada eslabón procede de otro fiable. Admitir copias de copias simples rompería la trazabilidad del documento.</div></div></details><details class=\"panel\"><summary>Ejemplos</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Ejemplo 1</span>Presentas el original de un certificado y te expiden copia auténtica: correcto.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 2</span>Presentas una copia auténtica anterior y piden otra: también vale.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 3</span>Caso límite: presentas una fotocopia sin más. No cabe copia auténtica de ella; lo que procede es el art. 49.</div></div></details><details class=\"panel\"><summary>Trampas</summary><div class=\"body\"><div class=\"box warn\"><span class=\"lbl\">Cuidado</span>La diferencia con el art. 49 es la clave del bloque: del <b>original</b> sale copia auténtica; de una <b>copia en papel</b> sale una copia electrónica con el mismo valor que la copia presentada, no más.</div></div></details><details class=\"panel\"><summary>Conexiones</summary><div class=\"body\"><p>Desarrolla el art. 27 LPAC. Se contrapone al art. 49 del propio Reglamento.</p></div></details><details class=\"panel\"><summary>Anclaje memorístico</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Para retenerlo</span>Copia auténtica <b>solo desde original o copia auténtica</b>.</div></div></details></section><section class=\"card art\" id=\"rd203_48\"><h2><span class=\"num\">RD 203/2021 48</span> Órganos competentes para la emisión de copias auténticas</h2><p class=\"ubic\">RD 203/2021 ▸ Capítulo V ▸ Sección 2.ª</p><div class=\"idea\">Cuatro clases de órganos en el ámbito estatal.</div><svg viewBox=\"0 0 980 300\" width=\"100%\" role=\"img\" aria-label=\"Validez de la copia auténtica, de qué se expide, quién la hace y órganos competentes\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"t7bfrr2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#4b5563\"/></marker><marker id=\"t7bfer2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#15803d\"/></marker><marker id=\"t7bfwr2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#b45309\"/></marker></defs><text x=\"490\" y=\"24\" font-size=\"13\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"bold\">La copia auténtica · art. 27 LPAC y arts. 47 a 49 RD 203/2021</text><rect x=\"20\" y=\"42\" width=\"920\" height=\"36\" rx=\"8\" fill=\"#eaf6ee\" stroke=\"#15803d\" stroke-width=\"1.4\"/><text x=\"480\" y=\"64.025\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#15803d\" font-weight=\"bold\">MISMA VALIDEZ Y EFICACIA QUE LOS DOCUMENTOS ORIGINALES · art. 27.2</text><rect x=\"20\" y=\"90\" width=\"450\" height=\"70\" rx=\"8\" fill=\"#e8efff\" stroke=\"#1d4ed8\" stroke-width=\"1.4\"/><text x=\"245\" y=\"106.21\" font-size=\"10.6\" text-anchor=\"middle\" fill=\"#1d4ed8\" font-weight=\"bold\">SE EXPIDE SIEMPRE A PARTIR DE</text><text x=\"245\" y=\"121.21\" font-size=\"10.6\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">un ORIGINAL</text><text x=\"245\" y=\"136.21\" font-size=\"10.6\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">o de OTRA COPIA AUTÉNTICA</text><text x=\"245\" y=\"151.21\" font-size=\"10.6\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">art. 47.2</text><rect x=\"490\" y=\"90\" width=\"450\" height=\"70\" rx=\"8\" fill=\"#e8efff\" stroke=\"#1d4ed8\" stroke-width=\"1.4\"/><text x=\"715\" y=\"106.21\" font-size=\"10.6\" text-anchor=\"middle\" fill=\"#1d4ed8\" font-weight=\"bold\">QUIÉN LA HACE · art. 27.1</text><text x=\"715\" y=\"121.21\" font-size=\"10.6\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">FUNCIONARIO HABILITADO</text><text x=\"715\" y=\"136.21\" font-size=\"10.6\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">o ACTUACIÓN ADMINISTRATIVA</text><text x=\"715\" y=\"151.21\" font-size=\"10.6\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">AUTOMATIZADA</text><rect x=\"20\" y=\"172\" width=\"228\" height=\"50\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"134\" y=\"193.93\" font-size=\"9.8\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">a) Órganos que emiten</text><text x=\"134\" y=\"206.93\" font-size=\"9.8\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">los documentos originales</text><rect x=\"252\" y=\"172\" width=\"228\" height=\"50\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"366\" y=\"193.93\" font-size=\"9.8\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">b) Órganos de custodia</text><text x=\"366\" y=\"206.93\" font-size=\"9.8\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">y archivo</text><rect x=\"484\" y=\"172\" width=\"228\" height=\"50\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"598\" y=\"193.93\" font-size=\"9.8\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">c) Órganos previstos</text><text x=\"598\" y=\"206.93\" font-size=\"9.8\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">en sus normas</text><rect x=\"716\" y=\"172\" width=\"228\" height=\"50\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"830\" y=\"193.93\" font-size=\"9.8\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">d) Oficinas de asistencia</text><text x=\"830\" y=\"206.93\" font-size=\"9.8\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">en materia de registros</text><rect x=\"20\" y=\"234\" width=\"920\" height=\"40\" rx=\"8\" fill=\"#fdf3e3\" stroke=\"#b45309\" stroke-width=\"1.4\"/><text x=\"480\" y=\"257.85\" font-size=\"11\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"bold\">Las copias auténticas de DOCUMENTOS PRIVADOS surten ÚNICAMENTE EFECTOS ADMINISTRATIVOS · art. 27.1</text><text x=\"490\" y=\"288\" font-size=\"11\" text-anchor=\"middle\" fill=\"#b91c1c\" font-weight=\"bold\">Las copias auténticas hechas por una Administración TIENEN VALIDEZ EN LAS RESTANTES.</text></svg><details class=\"panel\" open><summary>Texto legal</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · RD 203/2021</span><p><b>Artículo 48. Órganos competentes para la emisión de copias auténticas de documentos en el ámbito estatal.</b></p><p>1. En el ámbito estatal, serán competentes para la expedición de copias auténticas de documentos públicos administrativos o documentos privados, que sean documentos originales o copias auténticas de documento original los siguientes órganos:</p><p>a) Los órganos a los que corresponda la emisión de los documentos originales.</p><p>b) Los órganos a los que corresponda la custodia y archivo de documentos.</p><p>c) Los órganos que hayan previsto sus normas de competencia.</p><p>d) Las oficinas de asistencia en materia de registros, respecto de los documentos originales o copias auténticas presentados por las personas interesadas para que se remitan desde la Oficina a la unidad competente para su incorporación a un expediente administrativo.</p><p>2. La expedición de copias auténticas de documentos públicos administrativos o documentos privados, que sean documentos originales o copias auténticas de documento original, podrá llevarse a cabo mediante actuación administrativa automatizada o por personal funcionario habilitado inscrito en el Registro de Funcionarios Habilitados de la Administración General del Estado al que se refiere el artículo 31 de este Reglamento.</p><p>3. Los titulares de los órganos que se relacionan en los párrafos a), b) c) y d) del apartado 1 de este artículo designarán a los funcionarios y funcionarias habilitados para la emisión de las copias electrónicas auténticas, que se llevará a cabo mediante el correspondiente proceso de digitalización.</p></div></div></details><details class=\"panel\"><summary>Disección</summary><div class=\"body\"><ul>\n<li><b>a)</b> Los órganos a los que corresponda la <b>emisión de los documentos originales</b>.</li>\n<li><b>b)</b> Los órganos a los que corresponda la <b>custodia y archivo</b> de documentos.</li>\n<li><b>c)</b> Los órganos que lo <b>hayan previsto sus normas de competencia</b>.</li>\n<li><b>d)</b> Las <b>oficinas de asistencia en materia de registros</b>, respecto de los originales o copias auténticas que presenten las personas interesadas para su remisión a la unidad competente y su incorporación al expediente.</li>\n</ul></div></details><details class=\"panel\"><summary>En lenguaje llano</summary><div class=\"body\"><p>Puede hacer copia auténtica quien emitió el documento, quien lo guarda, quien lo tenga atribuido por su norma, y la ventanilla de registro con lo que tú le lleves.</p></div></details><details class=\"panel\"><summary>¿Por qué existe?</summary><div class=\"body\"><div class=\"interp\"><span class=\"lbl\">Interpretación · aportación externa</span>La letra d) es la operativa para el ciudadano: convierte la ventanilla en el lugar donde el papel se transforma en electrónico con plena validez, sin tener que acudir al órgano que emitió el original.</div></div></details><details class=\"panel\"><summary>Ejemplos</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Ejemplo 1</span>Vas a la oficina de asistencia con tu título original: letra d).</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 2</span>El archivo municipal expide copia auténtica de un expediente antiguo: letra b).</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 3</span>Caso límite: este artículo fija la competencia <b>en el ámbito estatal</b>. En las entidades locales, cada Administración determina sus órganos conforme al art. 27.1 LPAC.</div></div></details><details class=\"panel\"><summary>Trampas</summary><div class=\"body\"><div class=\"box warn\"><span class=\"lbl\">Cuidado</span>La letra d) está acotada: las oficinas de asistencia copian <b>lo que presentan los interesados</b> para incorporarlo a un expediente, no cualquier documento que tengan a mano.</div></div></details><details class=\"panel\"><summary>Conexiones</summary><div class=\"body\"><p>Desarrolla el art. 27.1 LPAC. Enlaza con el registro de funcionarios habilitados del art. 31.</p></div></details><details class=\"panel\"><summary>Anclaje memorístico</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Para retenerlo</span>Cuatro: <b>quien lo emite · quien lo guarda · quien lo tenga atribuido · la ventanilla</b>.</div></div></details></section><section class=\"card art\" id=\"rd203_49\"><h2><span class=\"num\">RD 203/2021 49</span> Emisión de copias de documentos aportados en papel</h2><p class=\"ubic\">RD 203/2021 ▸ Capítulo V ▸ Sección 2.ª</p><div class=\"idea\">La digitalización de una copia en papel vale lo mismo que esa copia, ni más ni menos.</div><details class=\"panel\" open><summary>Texto legal</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · RD 203/2021</span><p><b>Artículo 49. Emisión de copias de documentos aportados en papel por el interesado.</b></p><p>Cuando el interesado presente en papel una copia de un documento público administrativo o de un documento privado para incorporarlo a un expediente administrativo, el proceso de digitalización por la Administración Pública generará una copia electrónica que tendrá el mismo valor que la copia presentada en papel.</p></div></div></details><details class=\"panel\"><summary>Disección</summary><div class=\"body\"><ul>\n<li><b>Supuesto:</b> el interesado presenta <b>en papel una copia</b> de un documento público administrativo o privado para incorporarla a un expediente.</li>\n<li><b>Efecto:</b> el proceso de digitalización genera una copia electrónica que <b>tendrá el mismo valor que la copia presentada en papel</b>.</li>\n</ul></div></details><details class=\"panel\"><summary>En lenguaje llano</summary><div class=\"body\"><p>Si llevas una fotocopia, la Administración puede escanearla, pero lo escaneado vale lo mismo que la fotocopia: no se convierte en auténtica por pasar por el escáner.</p></div></details><details class=\"panel\"><summary>¿Por qué existe?</summary><div class=\"body\"><div class=\"interp\"><span class=\"lbl\">Interpretación · aportación externa</span>Es la regla que impide blanquear documentos: digitalizar no mejora la calidad jurídica de lo que se digitaliza. Si quieres una copia auténtica, trae el original.</div></div></details><details class=\"panel\"><summary>Ejemplos</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Ejemplo 1</span>Llevas una fotocopia de tu DNI: lo digitalizado vale como esa fotocopia.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 2</span>Llevas el original: entonces sí cabe copia auténtica por el art. 48.d).</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 3</span>Caso límite: alguien cree que escanear en la ventanilla convierte su copia en auténtica. No: el art. 49 lo niega expresamente.</div></div></details><details class=\"panel\"><summary>Trampas</summary><div class=\"body\"><div class=\"box warn\"><span class=\"lbl\">Cuidado</span>Es el contrapunto del art. 47.2 y una de las preguntas más finas del tema. <b>Mismo valor que la copia presentada</b>, no valor de original.</div></div></details><details class=\"panel\"><summary>Conexiones</summary><div class=\"body\"><p>Con los arts. 47 y 48 y con el art. 16.5 LPAC.</p></div></details><details class=\"panel\"><summary>Anclaje memorístico</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Para retenerlo</span>Escanear <b>no asciende</b> un documento. Copia entra, copia sale.</div></div></details></section><section class=\"card art\" id=\"rd203_53\"><h2><span class=\"num\">RD 203/2021 53</span> Tiempo de conservación y destrucción de documentos</h2><p class=\"ubic\">RD 203/2021 ▸ Capítulo V ▸ Sección 3.ª</p><div class=\"idea\">Seis meses a disposición del interesado para recoger lo que no se le pudo devolver.</div><svg viewBox=\"0 0 960 276\" width=\"100%\" role=\"img\" aria-label=\"Derecho a no aportar documentos ya en poder de la Administración y sus límites\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"t7ffr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#4b5563\"/></marker><marker id=\"t7ffe\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#15803d\"/></marker><marker id=\"t7ffw\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#b45309\"/></marker></defs><text x=\"480\" y=\"24\" font-size=\"13\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"bold\">Lo que la Administración no te puede pedir · art. 28 LPAC</text><rect x=\"20\" y=\"42\" width=\"450\" height=\"70\" rx=\"8\" fill=\"#eaf6ee\" stroke=\"#15803d\" stroke-width=\"1.4\"/><text x=\"245\" y=\"58.105\" font-size=\"10.3\" text-anchor=\"middle\" fill=\"#15803d\" font-weight=\"bold\">28.2 · NO APORTAR lo que ya está</text><text x=\"245\" y=\"73.105\" font-size=\"10.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">en poder de la Administración actuante</text><text x=\"245\" y=\"88.105\" font-size=\"10.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">o elaborado por cualquier otra.</text><text x=\"245\" y=\"103.105\" font-size=\"10.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">La Administración lo consulta o recaba</text><rect x=\"490\" y=\"42\" width=\"450\" height=\"70\" rx=\"8\" fill=\"#eaf6ee\" stroke=\"#15803d\" stroke-width=\"1.4\"/><text x=\"715\" y=\"58.105\" font-size=\"10.3\" text-anchor=\"middle\" fill=\"#15803d\" font-weight=\"bold\">28.3 · NO EXIGIR ORIGINALES</text><text x=\"715\" y=\"73.105\" font-size=\"10.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">salvo excepción normativa. Ni datos o</text><text x=\"715\" y=\"88.105\" font-size=\"10.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">documentos no exigidos, ni los ya aportados</text><text x=\"715\" y=\"103.105\" font-size=\"10.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">antes a cualquier Administración</text><rect x=\"20\" y=\"124\" width=\"450\" height=\"62\" rx=\"8\" fill=\"#fdeceb\" stroke=\"#b91c1c\" stroke-width=\"1.4\"/><text x=\"245\" y=\"136.105\" font-size=\"10.3\" text-anchor=\"middle\" fill=\"#b91c1c\" font-weight=\"bold\">PUEDES OPONERTE</text><text x=\"245\" y=\"151.105\" font-size=\"10.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">a la consulta… PERO NO CABE</text><text x=\"245\" y=\"166.105\" font-size=\"10.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">oposición en potestades SANCIONADORAS</text><text x=\"245\" y=\"181.105\" font-size=\"10.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">o de INSPECCIÓN</text><rect x=\"490\" y=\"124\" width=\"450\" height=\"62\" rx=\"8\" fill=\"#fdf3e3\" stroke=\"#b45309\" stroke-width=\"1.4\"/><text x=\"715\" y=\"136.105\" font-size=\"10.3\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"bold\">INFORMES PRECEPTIVOS de otro órgano</text><text x=\"715\" y=\"151.105\" font-size=\"10.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Deben remitirse en 10 DÍAS. Pasados,</text><text x=\"715\" y=\"166.105\" font-size=\"10.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">se informa al interesado de que puede</text><text x=\"715\" y=\"181.105\" font-size=\"10.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">aportarlo o esperar</text><rect x=\"20\" y=\"198\" width=\"920\" height=\"40\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"480\" y=\"221.57\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Si ya los aportaste, debes indicar EN QUÉ MOMENTO y ANTE QUÉ ÓRGANO los presentaste, y la Administración los recaba electrónicamente</text><text x=\"480\" y=\"260\" font-size=\"10.6\" text-anchor=\"middle\" fill=\"#b91c1c\" font-weight=\"bold\">Los documentos en papel que no se te puedan devolver se conservan a tu disposición SEIS MESES para que los recojas (art. 53 RD 203/2021).</text></svg><details class=\"panel\" open><summary>Texto legal</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · RD 203/2021</span><p><b>Artículo 53. Tiempo de conservación y destrucción de documentos.</b></p><p>1. Los documentos presentados por el interesado en soporte papel que por cualquier circunstancia no le puedan ser devueltos en el momento de su presentación, una vez digitalizados serán conservados a su disposición durante seis meses para que pueda recogerlos, independientemente del procedimiento administrativo al que se incorporen o de la Administración Pública a que vayan dirigidos, salvo que reglamentariamente la Administración correspondiente establezca un plazo mayor.</p><p>2. Los documentos presentados por el interesado en formato electrónico dentro de un dispositivo, que por cualquier circunstancia no le puedan ser devueltos en el momento de su presentación, una vez incorporados al expediente serán conservados a su disposición durante seis meses para que pueda recogerlos, independientemente del procedimiento administrativo al que se incorporen o de la Administración Pública a que vayan dirigidos, salvo que reglamentariamente la Administración correspondiente establezca un plazo mayor.</p><p>3. Transcurrido el plazo previsto en los apartados anteriores, la destrucción de los documentos se realizará de acuerdo con las competencias del Ministerio de Cultura y Deporte o del órgano competente de la comunidad autónoma, y siempre que no se trate de documentos con valor histórico, artístico u otro relevante o de documentos en los que la firma u otras expresiones manuscritas o mecánicas confieran al documento un valor especial.</p><p>4. Cuando la generación de copias electrónicas auténticas se realice a partir de documentos originales o copias auténticas de documentos en soporte no electrónico que se conserven formando parte de sus correspondientes expedientes y series documentales en cualesquiera de las oficinas, archivos o dependencias de cualquier organismo de las Administraciones públicas, dichos documentos originales o copias auténticas de documentos en soporte no electrónico se restituirán a sus oficinas, archivos o dependencias de origen, donde les será de aplicación la normativa específica en materia de archivos y conservación del patrimonio documental en su respectivo ámbito y siguiendo lo establecido por las autoridades calificadoras que correspondan.</p><p>5. En el ámbito estatal, se estará a lo preceptuado en el Real Decreto 1164/2002, de 8 de noviembre, por el que se regula la conservación del patrimonio documental con valor histórico, el control de la eliminación de otros documentos de la Administración General del Estado y sus organismos públicos y entidades de derecho público y la conservación de documentos administrativos en soporte distinto al original.</p></div></div></details><details class=\"panel\"><summary>Disección</summary><div class=\"body\"><ul>\n<li><b>Papel (53.1):</b> los documentos presentados en papel que <b>no puedan devolverse en el momento</b>, una vez digitalizados, se conservan a disposición del interesado <b>durante seis meses</b> para que los recoja, <b>con independencia del procedimiento o de la Administración</b> a que vayan dirigidos, salvo que reglamentariamente se establezca un plazo mayor.</li>\n<li><b>Dispositivos (53.2):</b> misma regla y mismo plazo para los documentos presentados <b>en formato electrónico dentro de un dispositivo</b> que no pueda devolverse.</li>\n<li><b>Después (53.3):</b> transcurrido el plazo, la <b>destrucción</b> se realiza conforme a las competencias y normativa aplicable.</li>\n</ul></div></details><details class=\"panel\"><summary>En lenguaje llano</summary><div class=\"body\"><p>Si te quedan un papel o un pendrive, tienes medio año para ir a recogerlo. Pasado ese tiempo, lo destruyen conforme a las normas de archivo.</p></div></details><details class=\"panel\"><summary>¿Por qué existe?</summary><div class=\"body\"><div class=\"interp\"><span class=\"lbl\">Interpretación · aportación externa</span>Un plazo cierto evita dos extremos igual de malos: destruir de inmediato algo que el interesado necesitaba, o acumular indefinidamente documentación ajena.</div></div></details><details class=\"panel\"><summary>Ejemplos</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Ejemplo 1</span>Entregas un original que debe custodiarse y no te lo devuelven: seis meses para recogerlo.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 2</span>Entregas un pendrive con un proyecto: mismo plazo.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 3</span>Caso límite: una norma reglamentaria fija un plazo mayor. Prevalece ese, porque el art. 53 lo admite expresamente.</div></div></details><details class=\"panel\"><summary>Trampas</summary><div class=\"body\"><div class=\"box warn\"><span class=\"lbl\">Cuidado</span>Los <b>seis meses</b> se cuentan con independencia del procedimiento y de la Administración destinataria. No es un plazo del expediente, es un plazo de custodia.</div></div></details><details class=\"panel\"><summary>Conexiones</summary><div class=\"body\"><p>Con el art. 16.5 LPAC —digitalización y devolución— y con el art. 17 —archivo—.</p></div></details><details class=\"panel\"><summary>Anclaje memorístico</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Para retenerlo</span><b>Seis meses</b> para recogerlo. Luego, destrucción reglada.</div></div></details></section><section class=\"card art\" id=\"lpac28\"><h2><span class=\"num\">LPAC 28</span> Documentos aportados por los interesados al procedimiento</h2><p class=\"ubic\">Ley 39/2015 ▸ Título I ▸ Capítulo II</p><div class=\"idea\">Derecho a no aportar lo que ya tienen, con dos límites y un plazo de diez días.</div><svg viewBox=\"0 0 960 276\" width=\"100%\" role=\"img\" aria-label=\"Derecho a no aportar documentos ya en poder de la Administración y sus límites\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"t7ffrr2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#4b5563\"/></marker><marker id=\"t7ffer2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#15803d\"/></marker><marker id=\"t7ffwr2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#b45309\"/></marker></defs><text x=\"480\" y=\"24\" font-size=\"13\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"bold\">Lo que la Administración no te puede pedir · art. 28 LPAC</text><rect x=\"20\" y=\"42\" width=\"450\" height=\"70\" rx=\"8\" fill=\"#eaf6ee\" stroke=\"#15803d\" stroke-width=\"1.4\"/><text x=\"245\" y=\"58.105\" font-size=\"10.3\" text-anchor=\"middle\" fill=\"#15803d\" font-weight=\"bold\">28.2 · NO APORTAR lo que ya está</text><text x=\"245\" y=\"73.105\" font-size=\"10.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">en poder de la Administración actuante</text><text x=\"245\" y=\"88.105\" font-size=\"10.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">o elaborado por cualquier otra.</text><text x=\"245\" y=\"103.105\" font-size=\"10.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">La Administración lo consulta o recaba</text><rect x=\"490\" y=\"42\" width=\"450\" height=\"70\" rx=\"8\" fill=\"#eaf6ee\" stroke=\"#15803d\" stroke-width=\"1.4\"/><text x=\"715\" y=\"58.105\" font-size=\"10.3\" text-anchor=\"middle\" fill=\"#15803d\" font-weight=\"bold\">28.3 · NO EXIGIR ORIGINALES</text><text x=\"715\" y=\"73.105\" font-size=\"10.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">salvo excepción normativa. Ni datos o</text><text x=\"715\" y=\"88.105\" font-size=\"10.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">documentos no exigidos, ni los ya aportados</text><text x=\"715\" y=\"103.105\" font-size=\"10.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">antes a cualquier Administración</text><rect x=\"20\" y=\"124\" width=\"450\" height=\"62\" rx=\"8\" fill=\"#fdeceb\" stroke=\"#b91c1c\" stroke-width=\"1.4\"/><text x=\"245\" y=\"136.105\" font-size=\"10.3\" text-anchor=\"middle\" fill=\"#b91c1c\" font-weight=\"bold\">PUEDES OPONERTE</text><text x=\"245\" y=\"151.105\" font-size=\"10.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">a la consulta… PERO NO CABE</text><text x=\"245\" y=\"166.105\" font-size=\"10.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">oposición en potestades SANCIONADORAS</text><text x=\"245\" y=\"181.105\" font-size=\"10.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">o de INSPECCIÓN</text><rect x=\"490\" y=\"124\" width=\"450\" height=\"62\" rx=\"8\" fill=\"#fdf3e3\" stroke=\"#b45309\" stroke-width=\"1.4\"/><text x=\"715\" y=\"136.105\" font-size=\"10.3\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"bold\">INFORMES PRECEPTIVOS de otro órgano</text><text x=\"715\" y=\"151.105\" font-size=\"10.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Deben remitirse en 10 DÍAS. Pasados,</text><text x=\"715\" y=\"166.105\" font-size=\"10.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">se informa al interesado de que puede</text><text x=\"715\" y=\"181.105\" font-size=\"10.3\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">aportarlo o esperar</text><rect x=\"20\" y=\"198\" width=\"920\" height=\"40\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"480\" y=\"221.57\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Si ya los aportaste, debes indicar EN QUÉ MOMENTO y ANTE QUÉ ÓRGANO los presentaste, y la Administración los recaba electrónicamente</text><text x=\"480\" y=\"260\" font-size=\"10.6\" text-anchor=\"middle\" fill=\"#b91c1c\" font-weight=\"bold\">Los documentos en papel que no se te puedan devolver se conservan a tu disposición SEIS MESES para que los recojas (art. 53 RD 203/2021).</text></svg><details class=\"panel\" open><summary>Texto legal</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LPAC</span><p><b>Artículo 28. Documentos aportados por los interesados al procedimiento administrativo.</b></p><p>1. Los interesados deberán aportar al procedimiento administrativo los datos y documentos exigidos por las Administraciones Públicas de acuerdo con lo dispuesto en la normativa aplicable. Asimismo, los interesados podrán aportar cualquier otro documento que estimen conveniente.</p><p>2. Los interesados tienen derecho a no aportar documentos que ya se encuentren en poder de la Administración actuante o hayan sido elaborados por cualquier otra Administración. La administración actuante podrá consultar o recabar dichos documentos salvo que el interesado se opusiera a ello. No cabrá la oposición cuando la aportación del documento se exigiera en el marco del ejercicio de potestades sancionadoras o de inspección. Las Administraciones Públicas deberán recabar los documentos electrónicamente a través de sus redes corporativas o mediante consulta a las plataformas de intermediación de datos u otros sistemas electrónicos habilitados al efecto. Cuando se trate de informes preceptivos ya elaborados por un órgano administrativo distinto al que tramita el procedimiento, estos deberán ser remitidos en el plazo de diez días a contar desde su solicitud. Cumplido este plazo, se informará al interesado de que puede aportar este informe o esperar a su remisión por el órgano competente.</p><p>3. Las Administraciones no exigirán a los interesados la presentación de documentos originales, salvo que, con carácter excepcional, la normativa reguladora aplicable establezca lo contrario. Asimismo, las Administraciones Públicas no requerirán a los interesados datos o documentos no exigidos por la normativa reguladora aplicable o que hayan sido aportados anteriormente por el interesado a cualquier Administración. A estos efectos, el interesado deberá indicar en qué momento y ante qué órgano administrativo presentó los citados documentos, debiendo las Administraciones Públicas recabarlos electrónicamente a través de sus redes corporativas o de una consulta a las plataformas de intermediación de datos u otros sistemas electrónicos habilitados al efecto, salvo que conste en el procedimiento la oposición expresa del interesado o la ley especial aplicable requiera su consentimiento expreso. Excepcionalmente, si las Administraciones Públicas no pudieran recabar los citados documentos, podrán solicitar nuevamente al interesado su aportación.</p><p>4. Cuando con carácter excepcional, y de acuerdo con lo previsto en esta Ley, la Administración solicitara al interesado la presentación de un documento original y éste estuviera en formato papel, el interesado deberá obtener una copia auténtica, según los requisitos establecidos en el artículo 27, con carácter previo a su presentación electrónica. La copia electrónica resultante reflejará expresamente esta circunstancia.</p><p>5. Excepcionalmente, cuando la relevancia del documento en el procedimiento lo exija o existan dudas derivadas de la calidad de la copia, las Administraciones podrán solicitar de manera motivada el cotejo de las copias aportadas por el interesado, para lo que podrán requerir la exhibición del documento o de la información original.</p><p>6. Las copias que aporten los interesados al procedimiento administrativo tendrán eficacia, exclusivamente en el ámbito de la actividad de las Administraciones Públicas.</p><p>7. Los interesados se responsabilizarán de la veracidad de los documentos que presenten.</p></div></div></details><details class=\"panel\"><summary>Disección</summary><div class=\"body\"><ul>\n<li><b>Deber y facultad (28.1):</b> los interesados <b>deberán aportar</b> los datos y documentos exigidos por la normativa, y <b>podrán aportar</b> cualquier otro que estimen conveniente.</li>\n<li><b>El derecho (28.2):</b> <b>no aportar documentos que ya se encuentren en poder de la Administración actuante o hayan sido elaborados por cualquier otra</b>. La Administración <b>podrá consultarlos o recabarlos salvo que el interesado se oponga</b>.</li>\n<li><b>El límite:</b> <b>no cabrá la oposición</b> cuando la aportación se exija en el marco de <b>potestades sancionadoras o de inspección</b>.</li>\n<li><b>Cómo se recaban:</b> <b>electrónicamente</b>, por redes corporativas, plataformas de intermediación de datos u otros sistemas habilitados.</li>\n<li><b>Informes preceptivos:</b> los ya elaborados por otro órgano deben remitirse <b>en el plazo de diez días</b> desde su solicitud. Cumplido el plazo, <b>se informa al interesado de que puede aportarlo o esperar</b>.</li>\n<li><b>No originales (28.3):</b> no se exigirán <b>documentos originales</b> salvo excepción normativa, ni datos o documentos <b>no exigidos</b> por la normativa o <b>ya aportados antes a cualquier Administración</b>. El interesado debe <b>indicar en qué momento y ante qué órgano</b> los presentó.</li>\n</ul></div></details><details class=\"panel\"><summary>En lenguaje llano</summary><div class=\"body\"><p>Lo que ya le has dado a cualquier Administración no te lo pueden volver a pedir: solo tienes que decirles cuándo y dónde lo entregaste. Salvo que estén investigándote o sancionándote, ahí no puedes oponerte a que lo consulten.</p></div></details><details class=\"panel\"><summary>¿Por qué existe?</summary><div class=\"body\"><div class=\"interp\"><span class=\"lbl\">Interpretación · aportación externa</span>Es el principio de «una sola vez», que traslada a la Administración el coste de buscar en sus propios sistemas. La excepción sancionadora e inspectora existe porque esas potestades perderían eficacia si el investigado pudiera bloquear el acceso a sus propios datos.</div></div></details><details class=\"panel\"><summary>Ejemplos</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Ejemplo 1</span>Pides una subvención y ya habías presentado el certificado de estar al corriente: indicas cuándo y ante quién, y lo recaban ellos.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 2</span>En una inspección urbanística te opones a que consulten un documento: la oposición no cabe (28.2).</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 3</span>Caso límite: se pide un informe preceptivo a otro órgano y pasan los diez días. Te informan de que puedes aportarlo tú o esperar; no se te impone.</div></div></details><details class=\"panel\"><summary>Trampas</summary><div class=\"body\"><div class=\"box warn\"><span class=\"lbl\">Cuidado</span>Tres cosas: la oposición <b>no cabe</b> en sancionador e inspección; el plazo de los informes preceptivos es de <b>diez días</b>; y el derecho del 28.3 alcanza a lo aportado <b>a cualquier Administración</b>, no solo a la actuante.</div></div></details><details class=\"panel\"><summary>Conexiones</summary><div class=\"body\"><p>Con el art. 53.1.c) y d) —derechos del interesado— y con los arts. 61 y 62 del RD 203/2021 —transmisiones y plataformas de intermediación—.</p></div></details><details class=\"panel\"><summary>Anclaje memorístico</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Para retenerlo</span>No te pueden pedir <b>originales</b> ni <b>lo ya dado</b>. Salvo <b>sancionador e inspección</b>, donde no hay oposición.</div></div></details></section><section class=\"card art\" id=\"lpac70\"><h2><span class=\"num\">LPAC 70</span> Expediente administrativo</h2><p class=\"ubic\">Ley 39/2015 ▸ Título IV ▸ Capítulo II «Ordenación del procedimiento»</p><div class=\"idea\">Conjunto ordenado de documentos, en formato electrónico, con índice y con exclusiones.</div><svg viewBox=\"0 0 980 300\" width=\"100%\" role=\"img\" aria-label=\"Contenido del expediente administrativo electrónico y la información que queda excluida\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"t7cfrr2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#4b5563\"/></marker><marker id=\"t7cfer2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#15803d\"/></marker><marker id=\"t7cfwr2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#b45309\"/></marker></defs><text x=\"490\" y=\"24\" font-size=\"13\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"bold\">Qué entra y qué no entra en el expediente · art. 70 LPAC</text><rect x=\"20\" y=\"42\" width=\"920\" height=\"36\" rx=\"8\" fill=\"#e8efff\" stroke=\"#1d4ed8\" stroke-width=\"1.4\"/><text x=\"480\" y=\"63.85\" font-size=\"11\" text-anchor=\"middle\" fill=\"#1d4ed8\" font-weight=\"bold\">Conjunto ORDENADO de documentos y actuaciones que sirven de ANTECEDENTE Y FUNDAMENTO a la resolución</text><rect x=\"20\" y=\"90\" width=\"450\" height=\"96\" rx=\"8\" fill=\"#eaf6ee\" stroke=\"#15803d\" stroke-width=\"1.4\"/><text x=\"245\" y=\"106.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15803d\" font-weight=\"bold\">SÍ FORMA PARTE · 70.2</text><text x=\"245\" y=\"120.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Documentos, pruebas, dictámenes, informes,</text><text x=\"245\" y=\"134.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">acuerdos, notificaciones y demás diligencias</text><text x=\"245\" y=\"148.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">ÍNDICE NUMERADO cuando se remita</text><text x=\"245\" y=\"162.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">COPIA ELECTRÓNICA CERTIFICADA</text><text x=\"245\" y=\"176.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">de la resolución adoptada</text><rect x=\"490\" y=\"90\" width=\"450\" height=\"96\" rx=\"8\" fill=\"#fdeceb\" stroke=\"#b91c1c\" stroke-width=\"1.4\"/><text x=\"715\" y=\"106.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#b91c1c\" font-weight=\"bold\">NO FORMA PARTE · 70.4</text><text x=\"715\" y=\"120.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Información auxiliar o de apoyo: aplicaciones,</text><text x=\"715\" y=\"134.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">ficheros y bases de datos, notas, borradores,</text><text x=\"715\" y=\"148.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">opiniones, resúmenes, comunicaciones</text><text x=\"715\" y=\"162.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">e informes internos o entre órganos</text><text x=\"715\" y=\"176.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Y los JUICIOS DE VALOR</text><rect x=\"20\" y=\"198\" width=\"920\" height=\"44\" rx=\"8\" fill=\"#fdf3e3\" stroke=\"#b45309\" stroke-width=\"1.4\"/><text x=\"480\" y=\"216.14\" font-size=\"10.4\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"bold\">LA EXCEPCIÓN DEL 70.4: sí forman parte los INFORMES, PRECEPTIVOS Y FACULTATIVOS, solicitados antes de la resolución</text><text x=\"480\" y=\"231.14\" font-size=\"10.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">que ponga fin al procedimiento</text><text x=\"490\" y=\"264\" font-size=\"10.3\" text-anchor=\"middle\" fill=\"#4b5563\" font-weight=\"normal\">Al remitirlo: completo, foliado, autentificado y con índice autentificado (70.3). Un mismo documento puede estar en varios expedientes.</text><text x=\"490\" y=\"288\" font-size=\"9.8\" text-anchor=\"middle\" fill=\"#4b5563\" font-weight=\"normal\">El foliado se hace mediante ÍNDICE ELECTRÓNICO AUTENTICADO, firmado por el titular del órgano o sellado si el expediente se forma automáticamente (art. 51).</text></svg><details class=\"panel\" open><summary>Texto legal</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LPAC</span><p><b>Artículo 70. Expediente Administrativo.</b></p><p>1. Se entiende por expediente administrativo el conjunto ordenado de documentos y actuaciones que sirven de antecedente y fundamento a la resolución administrativa, así como las diligencias encaminadas a ejecutarla.</p><p>2. Los expedientes tendrán formato electrónico y se formarán mediante la agregación ordenada de cuantos documentos, pruebas, dictámenes, informes, acuerdos, notificaciones y demás diligencias deban integrarlos, así como un índice numerado de todos los documentos que contenga cuando se remita. Asimismo, deberá constar en el expediente copia electrónica certificada de la resolución adoptada.</p><p>3. Cuando en virtud de una norma sea preciso remitir el expediente electrónico, se hará de acuerdo con lo previsto en el Esquema Nacional de Interoperabilidad y en las correspondientes Normas Técnicas de Interoperabilidad, y se enviará completo, foliado, autentificado y acompañado de un índice, asimismo autentificado, de los documentos que contenga. La autenticación del citado índice garantizará la integridad e inmutabilidad del expediente electrónico generado desde el momento de su firma y permitirá su recuperación siempre que sea preciso, siendo admisible que un mismo documento forme parte de distintos expedientes electrónicos.</p><p>4. No formará parte del expediente administrativo la información que tenga carácter auxiliar o de apoyo, como la contenida en aplicaciones, ficheros y bases de datos informáticas, notas, borradores, opiniones, resúmenes, comunicaciones e informes internos o entre órganos o entidades administrativas, así como los juicios de valor emitidos por las Administraciones Públicas, salvo que se trate de informes, preceptivos y facultativos, solicitados antes de la resolución administrativa que ponga fin al procedimiento.</p></div></div></details><details class=\"panel\"><summary>Disección</summary><div class=\"body\"><ul>\n<li><b>Qué es (70.1):</b> el <b>conjunto ordenado de documentos y actuaciones</b> que sirven de <b>antecedente y fundamento</b> a la resolución, así como <b>las diligencias encaminadas a ejecutarla</b>.</li>\n<li><b>Formato (70.2):</b> <b>tendrán formato electrónico</b> y se forman por <b>agregación ordenada</b> de documentos, pruebas, dictámenes, informes, acuerdos, notificaciones y demás diligencias, más un <b>índice numerado</b> de todos ellos <b>cuando se remita</b>. Debe constar <b>copia electrónica certificada de la resolución adoptada</b>.</li>\n<li><b>Remisión (70.3):</b> conforme al Esquema Nacional de Interoperabilidad, y se envía <b>completo, foliado, autentificado y acompañado de un índice, asimismo autentificado</b>. Esa autenticación garantiza <b>integridad e inmutabilidad</b> y permite su recuperación. <b>Un mismo documento puede formar parte de distintos expedientes.</b></li>\n<li><b>Lo que NO forma parte (70.4):</b> la información <b>auxiliar o de apoyo</b> —aplicaciones, ficheros y bases de datos, <b>notas, borradores, opiniones, resúmenes, comunicaciones e informes internos</b> o entre órganos— y los <b>juicios de valor</b>. <b>Salvo</b> que se trate de <b>informes, preceptivos y facultativos, solicitados antes de la resolución</b> que ponga fin al procedimiento.</li>\n</ul></div></details><details class=\"panel\"><summary>En lenguaje llano</summary><div class=\"body\"><p>El expediente es lo que sostiene la decisión, no todo el papeleo que se generó por el camino. Los borradores, las notas internas y las opiniones se quedan fuera; los informes que se pidieron antes de resolver, dentro.</p></div></details><details class=\"panel\"><summary>¿Por qué existe?</summary><div class=\"body\"><div class=\"interp\"><span class=\"lbl\">Interpretación · aportación externa</span>La exclusión del 70.4 protege la deliberación interna: si cada borrador formara parte del expediente, nadie se atrevería a poner por escrito una duda. La excepción de los informes evita que esa protección sirva para ocultar lo que fundó la decisión.</div></div></details><details class=\"panel\"><summary>Ejemplos</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Ejemplo 1</span>Un informe técnico preceptivo pedido antes de resolver: forma parte del expediente.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 2</span>El correo interno entre dos jefes de servicio comentando el asunto: no forma parte.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 3</span>Caso límite: un informe facultativo solicitado antes de la resolución. También entra: el 70.4 dice «preceptivos y facultativos».</div></div></details><details class=\"panel\"><summary>Trampas</summary><div class=\"body\"><div class=\"box warn\"><span class=\"lbl\">Cuidado</span>La excepción del 70.4 cubre los informes <b>preceptivos y facultativos</b>, con tal de que se hayan solicitado <b>antes</b> de la resolución. Si una opción dice «solo los preceptivos», está mal.</div></div></details><details class=\"panel\"><summary>Conexiones</summary><div class=\"body\"><p>Se desarrolla en el art. 51 del RD 203/2021. Enlaza con el derecho de acceso del art. 53.1.a) y con la Ley 19/2013.</p></div></details><details class=\"panel\"><summary>Anclaje memorístico</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Para retenerlo</span>Fuera: <b>notas, borradores, opiniones, resúmenes, internos y juicios de valor</b>. Dentro: <b>los informes pedidos antes de resolver</b>.</div></div></details></section><section class=\"card art\" id=\"rd203_51\"><h2><span class=\"num\">RD 203/2021 51</span> Configuración del expediente administrativo electrónico</h2><p class=\"ubic\">RD 203/2021 ▸ Capítulo V ▸ Sección 3.ª</p><div class=\"idea\">El foliado se hace con un índice electrónico autenticado, firmado o sellado.</div><svg viewBox=\"0 0 980 300\" width=\"100%\" role=\"img\" aria-label=\"Contenido del expediente administrativo electrónico y la información que queda excluida\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"t7cfrr3\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#4b5563\"/></marker><marker id=\"t7cfer3\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#15803d\"/></marker><marker id=\"t7cfwr3\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#b45309\"/></marker></defs><text x=\"490\" y=\"24\" font-size=\"13\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"bold\">Qué entra y qué no entra en el expediente · art. 70 LPAC</text><rect x=\"20\" y=\"42\" width=\"920\" height=\"36\" rx=\"8\" fill=\"#e8efff\" stroke=\"#1d4ed8\" stroke-width=\"1.4\"/><text x=\"480\" y=\"63.85\" font-size=\"11\" text-anchor=\"middle\" fill=\"#1d4ed8\" font-weight=\"bold\">Conjunto ORDENADO de documentos y actuaciones que sirven de ANTECEDENTE Y FUNDAMENTO a la resolución</text><rect x=\"20\" y=\"90\" width=\"450\" height=\"96\" rx=\"8\" fill=\"#eaf6ee\" stroke=\"#15803d\" stroke-width=\"1.4\"/><text x=\"245\" y=\"106.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15803d\" font-weight=\"bold\">SÍ FORMA PARTE · 70.2</text><text x=\"245\" y=\"120.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Documentos, pruebas, dictámenes, informes,</text><text x=\"245\" y=\"134.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">acuerdos, notificaciones y demás diligencias</text><text x=\"245\" y=\"148.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">ÍNDICE NUMERADO cuando se remita</text><text x=\"245\" y=\"162.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">COPIA ELECTRÓNICA CERTIFICADA</text><text x=\"245\" y=\"176.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">de la resolución adoptada</text><rect x=\"490\" y=\"90\" width=\"450\" height=\"96\" rx=\"8\" fill=\"#fdeceb\" stroke=\"#b91c1c\" stroke-width=\"1.4\"/><text x=\"715\" y=\"106.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#b91c1c\" font-weight=\"bold\">NO FORMA PARTE · 70.4</text><text x=\"715\" y=\"120.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Información auxiliar o de apoyo: aplicaciones,</text><text x=\"715\" y=\"134.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">ficheros y bases de datos, notas, borradores,</text><text x=\"715\" y=\"148.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">opiniones, resúmenes, comunicaciones</text><text x=\"715\" y=\"162.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">e informes internos o entre órganos</text><text x=\"715\" y=\"176.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Y los JUICIOS DE VALOR</text><rect x=\"20\" y=\"198\" width=\"920\" height=\"44\" rx=\"8\" fill=\"#fdf3e3\" stroke=\"#b45309\" stroke-width=\"1.4\"/><text x=\"480\" y=\"216.14\" font-size=\"10.4\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"bold\">LA EXCEPCIÓN DEL 70.4: sí forman parte los INFORMES, PRECEPTIVOS Y FACULTATIVOS, solicitados antes de la resolución</text><text x=\"480\" y=\"231.14\" font-size=\"10.4\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">que ponga fin al procedimiento</text><text x=\"490\" y=\"264\" font-size=\"10.3\" text-anchor=\"middle\" fill=\"#4b5563\" font-weight=\"normal\">Al remitirlo: completo, foliado, autentificado y con índice autentificado (70.3). Un mismo documento puede estar en varios expedientes.</text><text x=\"490\" y=\"288\" font-size=\"9.8\" text-anchor=\"middle\" fill=\"#4b5563\" font-weight=\"normal\">El foliado se hace mediante ÍNDICE ELECTRÓNICO AUTENTICADO, firmado por el titular del órgano o sellado si el expediente se forma automáticamente (art. 51).</text></svg><details class=\"panel\" open><summary>Texto legal</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · RD 203/2021</span><p><b>Artículo 51. Configuración del expediente administrativo electrónico.</b></p><p>1. El foliado de los expedientes administrativos electrónicos se llevará a cabo mediante un índice electrónico autenticado que garantizará la integridad del expediente y permitirá su recuperación siempre que sea preciso.</p><p>2. Un mismo documento electrónico podrá formar parte de distintos expedientes administrativos.</p><p>3. El índice electrónico autenticado será firmado por el titular del órgano que conforme el expediente para su tramitación o bien podrá ser sellado electrónicamente en el caso de expedientes electrónicos que se formen de manera automática, a través de un sistema que garantice su integridad.</p></div></div></details><details class=\"panel\"><summary>Disección</summary><div class=\"body\"><ul>\n<li><b>Foliado (51.1):</b> se lleva a cabo mediante un <b>índice electrónico autenticado</b> que <b>garantiza la integridad</b> del expediente y permite su recuperación.</li>\n<li><b>Reutilización (51.2):</b> un mismo documento electrónico <b>podrá formar parte de distintos expedientes</b>.</li>\n<li><b>Quién lo autentica (51.3):</b> el índice será <b>firmado por el titular del órgano</b> que conforme el expediente, <b>o sellado electrónicamente</b> cuando el expediente se forme <b>de manera automática</b>, mediante sistema que garantice su integridad.</li>\n</ul></div></details><details class=\"panel\"><summary>En lenguaje llano</summary><div class=\"body\"><p>En papel el expediente se numeraba hoja a hoja. En electrónico se consigue lo mismo con un índice firmado: si alguien quita o cambia algo, el índice deja de cuadrar.</p></div></details><details class=\"panel\"><summary>¿Por qué existe?</summary><div class=\"body\"><div class=\"interp\"><span class=\"lbl\">Interpretación · aportación externa</span>El índice autenticado sustituye a la grapa y al sello de la página: es lo que impide añadir o retirar documentos después, que era la garantía real del foliado tradicional.</div></div></details><details class=\"panel\"><summary>Ejemplos</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Ejemplo 1</span>Se remite un expediente al juzgado con su índice firmado por el titular del órgano.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 2</span>Un expediente formado automáticamente lleva el índice sellado electrónicamente.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 3</span>Caso límite: el mismo informe consta en dos expedientes distintos. Es correcto: lo permiten el art. 70.3 LPAC y el 51.2.</div></div></details><details class=\"panel\"><summary>Trampas</summary><div class=\"body\"><div class=\"box warn\"><span class=\"lbl\">Cuidado</span>Dos vías de autenticación según cómo se forme el expediente: <b>firma del titular del órgano</b> si lo conforma una persona; <b>sello electrónico</b> si se forma automáticamente.</div></div></details><details class=\"panel\"><summary>Conexiones</summary><div class=\"body\"><p>Desarrolla el art. 70 LPAC.</p></div></details><details class=\"panel\"><summary>Anclaje memorístico</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Para retenerlo</span>El foliado electrónico es el <b>índice autenticado</b>.</div></div></details></section><section class=\"card art\" id=\"lpac31\"><h2><span class=\"num\">LPAC 31</span> Cómputo de plazos en los registros</h2><p class=\"ubic\">Ley 39/2015 ▸ Título II «De la actividad de las Administraciones Públicas» ▸ Capítulo II</p><div class=\"idea\">Registro abierto las veinticuatro horas y qué pasa si presentas en día inhábil.</div><svg viewBox=\"0 0 960 266\" width=\"100%\" role=\"img\" aria-label=\"Funcionamiento del registro electrónico las veinticuatro horas y efectos de la presentación en día inhábil\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"t7dfr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#4b5563\"/></marker><marker id=\"t7dfe\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#15803d\"/></marker><marker id=\"t7dfw\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#b45309\"/></marker></defs><text x=\"480\" y=\"24\" font-size=\"13\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"bold\">El registro electrónico y los plazos · art. 31 LPAC</text><rect x=\"20\" y=\"42\" width=\"920\" height=\"36\" rx=\"8\" fill=\"#e8efff\" stroke=\"#1d4ed8\" stroke-width=\"1.4\"/><text x=\"480\" y=\"63.85\" font-size=\"11\" text-anchor=\"middle\" fill=\"#1d4ed8\" font-weight=\"bold\">Rige la FECHA Y HORA OFICIAL DE LA SEDE ELECTRÓNICA de acceso, no la del ordenador del interesado</text><rect x=\"20\" y=\"90\" width=\"450\" height=\"62\" rx=\"8\" fill=\"#eaf6ee\" stroke=\"#15803d\" stroke-width=\"1.4\"/><text x=\"245\" y=\"108.78\" font-size=\"10.8\" text-anchor=\"middle\" fill=\"#15803d\" font-weight=\"bold\">a) ABIERTO SIEMPRE</text><text x=\"245\" y=\"124.78\" font-size=\"10.8\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Permite presentar documentos TODOS</text><text x=\"245\" y=\"140.78\" font-size=\"10.8\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">LOS DÍAS DEL AÑO durante las 24 HORAS</text><rect x=\"490\" y=\"90\" width=\"450\" height=\"62\" rx=\"8\" fill=\"#fdf3e3\" stroke=\"#b45309\" stroke-width=\"1.4\"/><text x=\"715\" y=\"108.78\" font-size=\"10.8\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"bold\">b) SI PRESENTAS EN DÍA INHÁBIL</text><text x=\"715\" y=\"124.78\" font-size=\"10.8\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Se entiende realizada en la PRIMERA HORA</text><text x=\"715\" y=\"140.78\" font-size=\"10.8\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">DEL PRIMER DÍA HÁBIL SIGUIENTE</text><rect x=\"20\" y=\"166\" width=\"920\" height=\"40\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"480\" y=\"189.57\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Y el orden se respeta: lo presentado en día inhábil se reputa ANTERIOR, por su hora efectiva, a lo presentado el primer día hábil posterior</text><text x=\"480\" y=\"228\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#4b5563\" font-weight=\"normal\">Los plazos de la ADMINISTRACIÓN arrancan con la fecha y hora de presentación en el registro, y esa fecha debe comunicarse a quien presentó (31.2.c).</text><text x=\"480\" y=\"254\" font-size=\"11\" text-anchor=\"middle\" fill=\"#b91c1c\" font-weight=\"bold\">El calendario de días inhábiles de la sede es el ÚNICO aplicable al cómputo en los registros electrónicos (31.3).</text></svg><details class=\"panel\" open><summary>Texto legal</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LPAC</span><p><b>Artículo 31. Cómputo de plazos en los registros.</b></p><p>1. Cada Administración Pública publicará los días y el horario en el que deban permanecer abiertas las oficinas que prestarán asistencia para la presentación electrónica de documentos, garantizando el derecho de los interesados a ser asistidos en el uso de medios electrónicos.</p><p>2. El registro electrónico de cada Administración u Organismo se regirá a efectos de cómputo de los plazos, por la fecha y hora oficial de la sede electrónica de acceso, que deberá contar con las medidas de seguridad necesarias para garantizar su integridad y figurar de modo accesible y visible. El funcionamiento del registro electrónico se regirá por las siguientes reglas:</p><p>a) Permitirá la presentación de documentos todos los días del año durante las veinticuatro horas.</p><p>b) A los efectos del cómputo de plazo fijado en días hábiles, y en lo que se refiere al cumplimiento de plazos por los interesados, la presentación en un día inhábil se entenderá realizada en la primera hora del primer día hábil siguiente salvo que una norma permita expresamente la recepción en día inhábil. Los documentos se considerarán presentados por el orden de hora efectiva en el que lo fueron en el día inhábil. Los documentos presentados en el día inhábil se reputarán anteriores, según el mismo orden, a los que lo fueran el primer día hábil posterior.</p><p>c) El inicio del cómputo de los plazos que hayan de cumplir las Administraciones Públicas vendrá determinado por la fecha y hora de presentación en el registro electrónico de cada Administración u Organismo. En todo caso, la fecha y hora efectiva de inicio del cómputo de plazos deberá ser comunicada a quien presentó el documento.</p><p>3. La sede electrónica del registro de cada Administración Pública u Organismo, determinará, atendiendo al ámbito territorial en el que ejerce sus competencias el titular de aquélla y al calendario previsto en el artículo 30.7, los días que se considerarán inhábiles a los efectos previstos en este artículo. Este será el único calendario de días inhábiles que se aplicará a efectos del cómputo de plazos en los registros electrónicos, sin que resulte de aplicación a los mismos lo dispuesto en el artículo 30.6.</p></div></div></details><details class=\"panel\"><summary>Disección</summary><div class=\"body\"><ul>\n<li><b>La hora que vale (31.2):</b> el registro se rige, a efectos de cómputo, por la <b>fecha y hora oficial de la sede electrónica</b> de acceso, que debe figurar de modo accesible y visible.</li>\n<li><b>a) Siempre abierto:</b> permite la presentación <b>todos los días del año durante las veinticuatro horas</b>.</li>\n<li><b>b) Día inhábil:</b> a efectos del cumplimiento de plazos <b>por los interesados</b>, la presentación en día inhábil se entiende realizada <b>en la primera hora del primer día hábil siguiente</b>, salvo que una norma permita la recepción en día inhábil. Se respeta el <b>orden de hora efectiva</b>, y lo presentado en día inhábil se reputa <b>anterior</b> a lo presentado el primer día hábil posterior.</li>\n<li><b>c) Plazos de la Administración:</b> arrancan con la <b>fecha y hora de presentación</b> en el registro, y esa fecha <b>debe comunicarse</b> a quien presentó el documento.</li>\n<li><b>Calendario (31.3):</b> la sede determina los días inhábiles, y ese es el <b>único calendario</b> aplicable al cómputo en los registros electrónicos.</li>\n</ul></div></details><details class=\"panel\"><summary>En lenguaje llano</summary><div class=\"body\"><p>Puedes presentar un domingo a las tres de la madrugada y no pierdes el plazo: se entiende presentado a primera hora del lunes. Pero para la Administración el reloj empieza con la hora real de entrada.</p></div></details><details class=\"panel\"><summary>¿Por qué existe?</summary><div class=\"body\"><div class=\"interp\"><span class=\"lbl\">Interpretación · aportación externa</span>La asimetría es deliberada: al interesado se le protege llevándole la presentación al primer día hábil, y a la Administración se le empieza a contar desde el momento real, para que no gane tiempo por el calendario.</div></div></details><details class=\"panel\"><summary>Ejemplos</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Ejemplo 1</span>Presentas un recurso el sábado a las 23:50, último día del plazo: válido, se entiende presentado el lunes a primera hora.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 2</span>Dos interesados presentan el sábado a distinta hora: se conserva su orden relativo.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 3</span>Caso límite: alguien presenta el lunes a las 8:00. Va <b>después</b> de quien presentó el sábado, aunque el sábado fuera inhábil.</div></div></details><details class=\"panel\"><summary>Trampas</summary><div class=\"body\"><div class=\"box warn\"><span class=\"lbl\">Cuidado</span>Dos trampas: el registro está abierto <b>24 horas todos los días del año</b>, pero eso no convierte en hábil el día; y el calendario que manda es el <b>de la sede</b>, no el del domicilio del interesado.</div></div></details><details class=\"panel\"><summary>Conexiones</summary><div class=\"body\"><p>Con el art. 30 —cómputo general— y con el art. 41 del RD 203/2021 —comunicación de la fecha de inicio—.</p></div></details><details class=\"panel\"><summary>Anclaje memorístico</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Para retenerlo</span>Interesado en día inhábil → <b>primera hora del primer día hábil</b>. Administración → <b>hora real</b>.</div></div></details></section><section class=\"card art\" id=\"lpac96\"><h2><span class=\"num\">LPAC 96</span> Tramitación simplificada del procedimiento administrativo común</h2><p class=\"ubic\">Ley 39/2015 ▸ Título IV ▸ Capítulo IV «Finalización del procedimiento»</p><div class=\"idea\">Treinta días para resolver y una lista cerrada de siete trámites.</div><svg viewBox=\"0 0 980 290\" width=\"100%\" role=\"img\" aria-label=\"Supuestos, plazos y trámites de la tramitación simplificada del procedimiento administrativo común\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"t7efr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#4b5563\"/></marker><marker id=\"t7efe\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#15803d\"/></marker><marker id=\"t7efw\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#b45309\"/></marker></defs><text x=\"490\" y=\"24\" font-size=\"13\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"bold\">La tramitación simplificada · art. 96 LPAC</text><rect x=\"20\" y=\"42\" width=\"920\" height=\"36\" rx=\"8\" fill=\"#e8efff\" stroke=\"#1d4ed8\" stroke-width=\"1.4\"/><text x=\"480\" y=\"63.78\" font-size=\"10.8\" text-anchor=\"middle\" fill=\"#1d4ed8\" font-weight=\"bold\">Procede por RAZONES DE INTERÉS PÚBLICO o FALTA DE COMPLEJIDAD, de oficio o a solicitud del interesado</text><rect x=\"20\" y=\"90\" width=\"300\" height=\"66\" rx=\"8\" fill=\"#fdf3e3\" stroke=\"#b45309\" stroke-width=\"1.4\"/><text x=\"170\" y=\"105.43\" font-size=\"9.8\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"bold\">SI LA ACUERDA DE OFICIO</text><text x=\"170\" y=\"119.43\" font-size=\"9.8\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Hay que notificarlo. Si alguno se</text><text x=\"170\" y=\"133.43\" font-size=\"9.8\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">OPONE EXPRESAMENTE, se sigue</text><text x=\"170\" y=\"147.43\" font-size=\"9.8\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">la tramitación ORDINARIA</text><rect x=\"340\" y=\"90\" width=\"300\" height=\"66\" rx=\"8\" fill=\"#fdeceb\" stroke=\"#b91c1c\" stroke-width=\"1.4\"/><text x=\"490\" y=\"105.43\" font-size=\"9.8\" text-anchor=\"middle\" fill=\"#b91c1c\" font-weight=\"bold\">SI LA PIDE EL INTERESADO</text><text x=\"490\" y=\"119.43\" font-size=\"9.8\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">Puede desestimarse en 5 DÍAS</text><text x=\"490\" y=\"133.43\" font-size=\"9.8\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">sin recurso. Pasados los 5 días,</text><text x=\"490\" y=\"147.43\" font-size=\"9.8\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">se entiende DESESTIMADA</text><rect x=\"660\" y=\"90\" width=\"300\" height=\"66\" rx=\"8\" fill=\"#eaf6ee\" stroke=\"#15803d\" stroke-width=\"1.4\"/><text x=\"810\" y=\"105.43\" font-size=\"9.8\" text-anchor=\"middle\" fill=\"#15803d\" font-weight=\"bold\">PLAZO PARA RESOLVER</text><text x=\"810\" y=\"119.43\" font-size=\"9.8\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">30 DÍAS desde el siguiente a la</text><text x=\"810\" y=\"133.43\" font-size=\"9.8\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">notificación del acuerdo de</text><text x=\"810\" y=\"147.43\" font-size=\"9.8\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">tramitación simplificada</text><rect x=\"20\" y=\"170\" width=\"920\" height=\"62\" rx=\"8\" fill=\"#f1f3f7\" stroke=\"#4b5563\" stroke-width=\"1.4\"/><text x=\"480\" y=\"189.325\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#4b5563\" font-weight=\"bold\">LOS ÚNICOS TRÁMITES · 96.6</text><text x=\"480\" y=\"204.325\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">a) Inicio  ·  b) Subsanación  ·  c) Alegaciones al inicio durante 5 DÍAS  ·  d) Audiencia, solo si la resolución va a ser DESFAVORABLE</text><text x=\"480\" y=\"219.325\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#15181d\" font-weight=\"normal\">e) Informe del servicio jurídico, si es preceptivo  ·  f) Informe del CGPJ, si es preceptivo  ·  g) Dictamen del Consejo de Estado u órgano equivalente</text><text x=\"490\" y=\"254\" font-size=\"10.4\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"bold\">El dictamen del Consejo de Estado SUSPENDE automáticamente el plazo para resolver, y puede emitirse en 15 DÍAS si el órgano lo solicita.</text><text x=\"490\" y=\"278\" font-size=\"10.3\" text-anchor=\"middle\" fill=\"#4b5563\" font-weight=\"normal\">En sancionadores por infracción leve no cabe la oposición expresa del interesado (96.5).</text></svg><details class=\"panel\" open><summary>Texto legal</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · LPAC</span><p><b>Artículo 96. Tramitación simplificada del procedimiento administrativo común.</b></p><p>1. Cuando razones de interés público o la falta de complejidad del procedimiento así lo aconsejen, las Administraciones Públicas podrán acordar, de oficio o a solicitud del interesado, la tramitación simplificada del procedimiento. En cualquier momento del procedimiento anterior a su resolución, el órgano competente para su tramitación podrá acordar continuar con arreglo a la tramitación ordinaria.</p><p>2. Cuando la Administración acuerde de oficio la tramitación simplificada del procedimiento deberá notificarlo a los interesados. Si alguno de ellos manifestara su oposición expresa, la Administración deberá seguir la tramitación ordinaria.</p><p>3. Los interesados podrán solicitar la tramitación simplificada del procedimiento. Si el órgano competente para la tramitación aprecia que no concurre alguna de las razones previstas en el apartado 1, podrá desestimar dicha solicitud, en el plazo de cinco días desde su presentación, sin que exista posibilidad de recurso por parte del interesado. Transcurrido el mencionado plazo de cinco días se entenderá desestimada la solicitud.</p><p>4. En el caso de procedimientos en materia de responsabilidad patrimonial de las Administraciones Públicas, si una vez iniciado el procedimiento administrativo el órgano competente para su tramitación considera inequívoca la relación de causalidad entre el funcionamiento del servicio público y la lesión, así como la valoración del daño y el cálculo de la cuantía de la indemnización, podrá acordar de oficio la suspensión del procedimiento general y la iniciación de un procedimiento simplificado.</p><p>5. En el caso de procedimientos de naturaleza sancionadora, se podrá adoptar la tramitación simplificada del procedimiento cuando el órgano competente para iniciar el procedimiento considere que, de acuerdo con lo previsto en su normativa reguladora, existen elementos de juicio suficientes para calificar la infracción como leve, sin que quepa la oposición expresa por parte del interesado prevista en el apartado 2.</p><p>6. Salvo que reste menos para su tramitación ordinaria, los procedimientos administrativos tramitados de manera simplificada deberán ser resueltos en treinta días, a contar desde el siguiente al que se notifique al interesado el acuerdo de tramitación simplificada del procedimiento, y constarán únicamente de los siguientes trámites:</p><p>a) Inicio del procedimiento de oficio o a solicitud del interesado.</p><p>b) Subsanación de la solicitud presentada, en su caso.</p><p>c) Alegaciones formuladas al inicio del procedimiento durante el plazo de cinco días.</p><p>d) Trámite de audiencia, únicamente cuando la resolución vaya a ser desfavorable para el interesado.</p><p>e) Informe del servicio jurídico, cuando éste sea preceptivo.</p><p>f) Informe del Consejo General del Poder Judicial, cuando éste sea preceptivo.</p><p>g) Dictamen del Consejo de Estado u órgano consultivo equivalente de la Comunidad Autónoma en los casos en que sea preceptivo. Desde que se solicite el Dictamen al Consejo de Estado, u órgano equivalente, hasta que éste sea emitido, se producirá la suspensión automática del plazo para resolver. El órgano competente solicitará la emisión del Dictamen en un plazo tal que permita cumplir el plazo de resolución del procedimiento. El Dictamen podrá ser emitido en el plazo de quince días si así lo solicita el órgano competente. En todo caso, en el expediente que se remita al Consejo de Estado u órgano consultivo equivalente, se incluirá una propuesta de resolución. Cuando el Dictamen sea contrario al fondo de la propuesta de resolución, con independencia de que se atienda o no este criterio, el órgano competente para resolver acordará continuar el procedimiento con arreglo a la tramitación ordinaria, lo que se notificará a los interesados. En este caso, se entenderán convalidadas todas las actuaciones que se hubieran realizado durante la tramitación simplificada del procedimiento, a excepción del Dictamen del Consejo de Estado u órgano consultivo equivalente.</p><p>h) Resolución.</p><p>7. En el caso que un procedimiento exigiera la realización de un trámite no previsto en el apartado anterior, deberá ser tramitado de manera ordinaria.</p></div></div></details><details class=\"panel\"><summary>Disección</summary><div class=\"body\"><ul>\n<li><b>Cuándo (96.1):</b> por <b>razones de interés público</b> o <b>falta de complejidad</b>, <b>de oficio o a solicitud</b> del interesado. En cualquier momento anterior a la resolución puede volverse a la <b>tramitación ordinaria</b>.</li>\n<li><b>De oficio (96.2):</b> hay que <b>notificarlo</b>; si algún interesado <b>se opone expresamente</b>, se sigue la ordinaria.</li>\n<li><b>A solicitud (96.3):</b> puede <b>desestimarse en el plazo de cinco días</b>, <b>sin recurso</b>; transcurridos esos cinco días, <b>se entiende desestimada</b>.</li>\n<li><b>Sancionadores (96.5):</b> cabe si hay elementos para calificar la infracción como <b>leve</b>, y <b>sin que quepa la oposición</b> del interesado.</li>\n<li><b>Plazo y trámites (96.6):</b> salvo que reste menos para la ordinaria, se resuelven <b>en treinta días</b> desde el siguiente a la notificación del acuerdo, y constan <b>únicamente</b> de: inicio; subsanación; <b>alegaciones durante cinco días</b>; <b>audiencia solo si la resolución va a ser desfavorable</b>; informe del servicio jurídico si es preceptivo; informe del CGPJ si es preceptivo; y <b>dictamen del Consejo de Estado</b> u órgano equivalente.</li>\n<li><b>El dictamen:</b> <b>suspende automáticamente</b> el plazo para resolver y <b>podrá emitirse en quince días</b> si el órgano lo solicita.</li>\n</ul></div></details><details class=\"panel\"><summary>En lenguaje llano</summary><div class=\"body\"><p>Es la vía rápida: treinta días, siete trámites tasados y audiencia solo si te va a ir mal. Si la pides tú y no te contestan en cinco días, entiende que te la han negado.</p></div></details><details class=\"panel\"><summary>¿Por qué existe?</summary><div class=\"body\"><div class=\"interp\"><span class=\"lbl\">Interpretación · aportación externa</span>Si la simplificación pudiera recortar trámites a discreción, se convertiría en un atajo para resolver sin garantías. Por eso el 96.6 fija una lista cerrada y reserva la audiencia para cuando la resolución perjudique.</div></div></details><details class=\"panel\"><summary>Ejemplos</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Ejemplo 1</span>Procedimiento sancionador por infracción leve: tramitación simplificada sin posible oposición.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 2</span>El interesado pide la simplificada y pasan cinco días sin respuesta: desestimada.</div><div class=\"box ej\"><span class=\"lbl\">Ejemplo 3</span>Caso límite: la resolución va a ser favorable. Entonces <b>no hay trámite de audiencia</b>: solo procede si va a ser desfavorable.</div></div></details><details class=\"panel\"><summary>Trampas</summary><div class=\"body\"><div class=\"box warn\"><span class=\"lbl\">Cuidado</span>Cuatro cifras en un mismo artículo: <b>30</b> días para resolver, <b>5</b> para desestimar la solicitud, <b>5</b> de alegaciones y <b>15</b> para el dictamen. Y la audiencia <b>solo si es desfavorable</b>.</div></div></details><details class=\"panel\"><summary>Conexiones</summary><div class=\"body\"><p>Con el art. 21 —plazo máximo— y con el art. 82 —audiencia en la tramitación ordinaria, que es de diez a quince días—.</p></div></details><details class=\"panel\"><summary>Anclaje memorístico</summary><div class=\"body\"><div class=\"box ej\"><span class=\"lbl\">Para retenerlo</span><b>30 · 5 · 5 · 15</b>. Y audiencia <b>solo si te va a ir mal</b>.</div></div></details></section><section class=\"card art\" id=\"rd203_61\"><h2><span class=\"num\">RD 203/2021 61</span> Transmisiones de datos</h2><p class=\"ubic\">RD 203/2021 ▸ Capítulo VI «Relaciones entre Administraciones» ▸ Sección 2.ª</p><div class=\"idea\">Los datos que se consultan entre Administraciones valen como certificados administrativos.</div><details class=\"panel\" open><summary>Texto legal</summary><div class=\"body\"><div class=\"legal\"><span class=\"lbl\">Texto legal · RD 203/2021</span><p><b>Artículo 61. Transmisiones de datos.</b></p><p>1. Las transmisiones de datos a las que se refiere el artículo 155 de la Ley 40/2015, de 1

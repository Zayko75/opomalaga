 marker-end=\"url(#fl)\"/>\n<rect x=\"614\" y=\"1184\" width=\"338\" height=\"60\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/>\n<text x=\"783\" y=\"1206\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--exc)\">223.2 · Rendición al TRIBUNAL DE CUENTAS</text>\n<text x=\"783\" y=\"1226\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"currentColor\">antes del 15 de OCTUBRE</text>\n<text x=\"783\" y=\"1240\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--ink2)\">control externo · sin perjuicio de los OCEX autonómicos (223.4)</text>\n<rect x=\"146\" y=\"1184\" width=\"440\" height=\"60\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/>\n<text x=\"366\" y=\"1204\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--warn)\">213-222 · Control interno, en tres modalidades</text>\n<text x=\"366\" y=\"1222\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">función interventora · control financiero · control de eficacia</text>\n<text x=\"366\" y=\"1238\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">218.3 · las resoluciones contrarias a reparos se remiten anualmente al Tribunal de Cuentas</text>\n<rect x=\"146\" y=\"1256\" width=\"806\" height=\"52\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/>\n<text x=\"549\" y=\"1277\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">Y el ciclo vuelve a empezar: la LIQUIDACIÓN del ejercicio N es documento obligatorio del presupuesto N+1</text>\n<text x=\"549\" y=\"1296\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">art. 168.1.b) · por eso el tema 8 no es una lista de trámites, sino un bucle</text>\n</g>\n</svg>\n<div class=\"box ej\"><span class=\"lbl\">Cómo leer el diagrama</span>De arriba abajo, el <b>camino ordinario</b>. Los <b>rombos ámbar</b> son las tres preguntas que lo bifurcan todo: <b>¿hay reclamaciones?</b> (art. 170), <b>¿hay crédito?</b> (arts. 177 a 182) y <b>¿el remanente es negativo?</b> (art. 193). Los recuadros rojos son las salidas cuando la respuesta no es la ordinaria.</div>\n</section>\n\n<section class=\"card\" id=\"tiempo\"><h2>Línea temporal: el ciclo ocupa tres años naturales</h2>\n<p class=\"small\">Este es el error de perspectiva más frecuente del tema: pensar que el presupuesto «vive» un año. En realidad, el ciclo completo de un ejercicio <b>N</b> se extiende desde septiembre de <b>N−1</b> hasta octubre de <b>N+1</b>: veintiséis meses.</p>\n<svg viewBox=\"0 0 960 320\" role=\"img\" aria-label=\"Línea temporal del ciclo presupuestario a lo largo de tres años naturales\" style=\"width:100%;height:auto\">\n<defs><marker id=\"tl\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ink2)\"/></marker></defs>\n<rect x=\"20\" y=\"24\" width=\"290\" height=\"26\" rx=\"6\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/>\n<text x=\"165\" y=\"42\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">AÑO N−1 · se prepara</text>\n<rect x=\"318\" y=\"24\" width=\"290\" height=\"26\" rx=\"6\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/>\n<text x=\"463\" y=\"42\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">AÑO N · se ejecuta</text>\n<rect x=\"616\" y=\"24\" width=\"324\" height=\"26\" rx=\"6\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/>\n<text x=\"778\" y=\"42\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--warn)\">AÑO N+1 · se liquida y se controla</text>\n<line x1=\"20\" y1=\"150\" x2=\"930\" y2=\"150\" stroke=\"var(--line)\" stroke-width=\"4\"/>\n<path d=\"M930 150 L 946 150\" stroke=\"var(--ink2)\" stroke-width=\"2\" marker-end=\"url(#tl)\"/>\n<line x1=\"314\" y1=\"60\" x2=\"314\" y2=\"240\" stroke=\"var(--line)\" stroke-dasharray=\"4 4\"/>\n<line x1=\"612\" y1=\"60\" x2=\"612\" y2=\"240\" stroke=\"var(--line)\" stroke-dasharray=\"4 4\"/>\n<g font-size=\"10\" text-anchor=\"middle\">\n <circle cx=\"70\" cy=\"150\" r=\"7\" fill=\"var(--acc)\"/><line x1=\"70\" y1=\"150\" x2=\"70\" y2=\"110\" stroke=\"var(--acc)\"/>\n <text x=\"70\" y=\"102\" font-weight=\"700\" fill=\"var(--acc)\">15-SEP</text><text x=\"70\" y=\"88\" fill=\"currentColor\">OOAA y sociedades</text><text x=\"70\" y=\"76\" fill=\"var(--ink2)\">168.2 y 168.3</text>\n <circle cx=\"170\" cy=\"150\" r=\"7\" fill=\"var(--acc)\"/><line x1=\"170\" y1=\"150\" x2=\"170\" y2=\"190\" stroke=\"var(--acc)\"/>\n <text x=\"170\" y=\"204\" font-weight=\"700\" fill=\"var(--acc)\">15-OCT</text><text x=\"170\" y=\"218\" fill=\"currentColor\">al Pleno</text><text x=\"170\" y=\"230\" fill=\"var(--ink2)\">168.4</text>\n <circle cx=\"240\" cy=\"150\" r=\"7\" fill=\"var(--acc)\"/><line x1=\"240\" y1=\"150\" x2=\"240\" y2=\"110\" stroke=\"var(--acc)\"/>\n <text x=\"240\" y=\"102\" font-weight=\"700\" fill=\"var(--acc)\">15 días + 1 mes</text><text x=\"240\" y=\"88\" fill=\"currentColor\">exposición y reclamaciones</text><text x=\"240\" y=\"76\" fill=\"var(--ink2)\">169.1</text>\n <circle cx=\"305\" cy=\"150\" r=\"7\" fill=\"var(--exc)\"/><line x1=\"305\" y1=\"150\" x2=\"305\" y2=\"190\" stroke=\"var(--exc)\"/>\n <text x=\"305\" y=\"204\" font-weight=\"700\" fill=\"var(--exc)\">31-DIC</text><text x=\"305\" y=\"218\" fill=\"currentColor\">aprobación definitiva</text><text x=\"305\" y=\"230\" fill=\"var(--ink2)\">169.2 · si no: prórroga</text>\n <circle cx=\"463\" cy=\"150\" r=\"7\" fill=\"var(--ej)\"/><line x1=\"463\" y1=\"150\" x2=\"463\" y2=\"106\" stroke=\"var(--ej)\"/>\n <text x=\"463\" y=\"98\" font-weight=\"700\" fill=\"var(--ej)\">1-ENE a 31-DIC del año N</text><text x=\"463\" y=\"84\" fill=\"currentColor\">ejecución: A · D · O · P (183-189)</text><text x=\"463\" y=\"72\" fill=\"var(--ink2)\">modificaciones 177-182 · fiscalización 214-218</text>\n <circle cx=\"612\" cy=\"150\" r=\"7\" fill=\"var(--exc)\"/><line x1=\"612\" y1=\"150\" x2=\"612\" y2=\"190\" stroke=\"var(--exc)\"/>\n <text x=\"612\" y=\"204\" font-weight=\"700\" fill=\"var(--exc)\">31-DIC</text><text x=\"612\" y=\"218\" fill=\"currentColor\">cierre del ejercicio</text><text x=\"612\" y=\"230\" fill=\"var(--ink2)\">191.1 · anulación 175</text>\n <circle cx=\"690\" cy=\"150\" r=\"7\" fill=\"var(--warn)\"/><line x1=\"690\" y1=\"150\" x2=\"690\" y2=\"110\" stroke=\"var(--warn)\"/>\n <text x=\"690\" y=\"102\" font-weight=\"700\" fill=\"var(--warn)\">1-MAR</text><text x=\"690\" y=\"88\" fill=\"currentColor\">liquidación</text><text x=\"690\" y=\"76\" fill=\"var(--ink2)\">191.3 · Presidente</text>\n <circle cx=\"770\" cy=\"150\" r=\"7\" fill=\"var(--warn)\"/><line x1=\"770\" y1=\"150\" x2=\"770\" y2=\"190\" stroke=\"var(--warn)\"/>\n <text x=\"770\" y=\"204\" font-weight=\"700\" fill=\"var(--warn)\">15-MAY</text><text x=\"770\" y=\"218\" fill=\"currentColor\">rendición de cuentas</text><text x=\"770\" y=\"230\" fill=\"var(--ink2)\">212.1</text>\n <circle cx=\"835\" cy=\"150\" r=\"7\" fill=\"var(--warn)\"/><line x1=\"835\" y1=\"150\" x2=\"835\" y2=\"110\" stroke=\"var(--warn)\"/>\n <text x=\"835\" y=\"102\" font-weight=\"700\" fill=\"var(--warn)\">1-JUN</text><text x=\"835\" y=\"88\" fill=\"currentColor\">Comisión Especial</text><text x=\"835\" y=\"76\" fill=\"var(--ink2)\">212.2 · + 15 días de exposición</text>\n <circle cx=\"890\" cy=\"150\" r=\"7\" fill=\"var(--exc)\"/><line x1=\"890\" y1=\"150\" x2=\"890\" y2=\"190\" stroke=\"var(--exc)\"/>\n <text x=\"890\" y=\"204\" font-weight=\"700\" fill=\"var(--exc)\">1-OCT</text><text x=\"890\" y=\"218\" fill=\"currentColor\">Pleno aprueba</text><text x=\"890\" y=\"230\" fill=\"var(--ink2)\">212.4</text>\n <circle cx=\"928\" cy=\"150\" r=\"7\" fill=\"var(--exc)\"/><line x1=\"928\" y1=\"150\" x2=\"928\" y2=\"118\" stroke=\"var(--exc)\"/>\n <text x=\"920\" y=\"110\" font-weight=\"700\" fill=\"var(--exc)\">15-OCT</text><text x=\"905\" y=\"96\" fill=\"currentColor\">Tribunal de Cuentas</text><text x=\"905\" y=\"84\" fill=\"var(--ink2)\">223.2</text>\n</g>\n<rect x=\"20\" y=\"256\" width=\"910\" height=\"50\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/>\n<text x=\"475\" y=\"276\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--warn)\">El 15 de octubre aparece DOS VECES y no significa lo mismo</text>\n<text x=\"475\" y=\"295\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">en el año N−1, el presupuesto al Pleno (168.4) · en el año N+1, la cuenta general al Tribunal de Cuentas (223.2)</text>\n</svg>\n</section>\n\n<section class=\"card\" id=\"decisiones\"><h2>Los dos árboles de decisión que resuelven el 80 % de los casos</h2>\n<p class=\"small\">En la práctica, casi todo expediente presupuestario se atasca en una de estas dos encrucijadas. Merece la pena tenerlas memorizadas como un algoritmo.</p>\n<h3 style=\"font-size:1rem;margin-top:1rem\">A · Quiero gastar y no tengo crédito: ¿qué modificación uso?</h3>\n<svg viewBox=\"0 0 960 400\" role=\"img\" aria-label=\"Árbol de decisión para elegir la modificación de crédito procedente\" style=\"width:100%;height:auto\">\n<defs><marker id=\"d1\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\"><path d=\"M0 0 L9 4.5 L0 9 z\" fill=\"var(--acc)\"/></marker></defs>\n<rect x=\"330\" y=\"10\" width=\"300\" height=\"44\" rx=\"9\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/>\n<text x=\"480\" y=\"38\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">Necesito gastar y el crédito no basta</text>\n<path d=\"M480 56 L 480 76\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#d1)\"/>\n<path d=\"M480 80 L 640 112 L 480 144 L 320 112 z\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\" stroke-width=\"2\"/>\n<text x=\"480\" y=\"108\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--warn)\">¿De dónde sale el dinero?</text>\n<text x=\"480\" y=\"126\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--ink2)\">esta es la pregunta que decide, no el importe</text>\n<path d=\"M320 112 L 150 112 L 150 186\" stroke=\"var(--acc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#d1)\"/>\n<path d=\"M640 112 L 810 112 L 810 186\" stroke=\"var(--acc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#d1)\"/>\n<path d=\"M480 144 L 480 186\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#d1)\"/>\n<rect x=\"20\" y=\"192\" width=\"260\" height=\"94\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/>\n<text x=\"150\" y=\"214\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--exc)\">Dinero NUEVO</text>\n<text x=\"150\" y=\"234\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">remanente líquido de tesorería,</text>\n<text x=\"150\" y=\"248\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">mayores ingresos, bajas de otras partidas</text>\n<text x=\"150\" y=\"268\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--exc)\">177 · crédito extraordinario</text>\n<text x=\"150\" y=\"282\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--exc)\">o suplemento de crédito</text>\n<rect x=\"350\" y=\"192\" width=\"260\" height=\"94\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/>\n<text x=\"480\" y=\"214\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">Dinero que YA ESTÁ en otra partida</text>\n<text x=\"480\" y=\"236\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">179-180 · transferencia de crédito</text>\n<text x=\"480\" y=\"256\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">entre distintos grupos de función: PLENO</text>\n<text x=\"480\" y=\"272\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">salvo que altas y bajas afecten a personal</text>\n<rect x=\"680\" y=\"192\" width=\"260\" height=\"94\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/>\n<text x=\"810\" y=\"214\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">Dinero que ENTRA por un ingreso</text>\n<text x=\"810\" y=\"234\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">subvención, enajenación, reintegro…</text>\n<text x=\"810\" y=\"254\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">181 · generación de crédito</text>\n<text x=\"810\" y=\"274\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">178 · ampliación si el crédito es ampliable</text>\n<rect x=\"220\" y=\"306\" width=\"520\" height=\"76\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/>\n<text x=\"480\" y=\"326\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--warn)\">Caso especial: el gasto viene del ejercicio anterior</text>\n<text x=\"480\" y=\"346\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"currentColor\">182 · incorporación de remanentes de crédito</text>\n<text x=\"480\" y=\"364\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">obligatoria en proyectos con ingresos afectados (182.3) · potestativa en los demás</text>\n</svg>\n<h3 style=\"font-size:1rem;margin-top:1.4rem\">B · La Intervención pone un reparo: ¿se para el expediente y quién decide?</h3>\n<svg viewBox=\"0 0 960 350\" role=\"img\" aria-label=\"Árbol de decisión sobre los efectos del reparo y la resolución de discrepancias\" style=\"width:100%;height:auto\">\n<defs><marker id=\"d2\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\"><path d=\"M0 0 L9 4.5 L0 9 z\" fill=\"var(--acc)\"/></marker></defs>\n<rect x=\"350\" y=\"10\" width=\"260\" height=\"42\" rx=\"9\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/>\n<text x=\"480\" y=\"37\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">Reparo de la Intervención (215)</text>\n<path d=\"M480 54 L 480 72\" stroke=\"var(--acc)\" stroke-width=\"2\" marker-end=\"url(#d2)\"/>\n<path d=\"M480 76 L 660 106 L 480 136 L 300 106 z\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\" stroke-width=\"2\"/>\n<text x=\"480\" y=\"102\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--warn)\">¿Afecta a gastos y encaja</text>\n<text x=\"480\" y=\"120\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--warn)\">en alguna letra del 216.2?</text>\n<path d=\"M300 106 L 170 106 L 170 158\" stroke=\"var(--acc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#d2)\"/>\n<path d=\"M660 106 L 790 106 L 790 158\" stroke=\"var(--acc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#d2)\"/>\n<rect x=\"30\" y=\"164\" width=\"280\" height=\"86\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/>\n<text x=\"170\" y=\"186\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">NO · reparo NO suspensivo</text>\n<text x=\"170\" y=\"206\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">p. ej. reparo sobre reconocimiento</text>\n<text x=\"170\" y=\"220\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">o liquidación de DERECHOS (216.1)</text>\n<text x=\"170\" y=\"240\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">el expediente SIGUE</text>\n<rect x=\"650\" y=\"164\" width=\"290\" height=\"86\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/>\n<text x=\"795\" y=\"186\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--exc)\">SÍ · reparo SUSPENSIVO (216.2)</text>\n<text x=\"795\" y=\"204\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">a) insuficiencia o inadecuación de crédito</text>\n<text x=\"795\" y=\"218\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">b) actos no fiscalizados · c) omisión de trámites esenciales</text>\n<text x=\"795\" y=\"232\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">d) comprobación material de obras, suministros y servicios</text>\n<text x=\"795\" y=\"246\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--exc)\">el expediente SE PARA</text>\n<path d=\"M795 252 L 795 272\" stroke=\"var(--exc)\" stroke-width=\"2\" marker-end=\"url(#d2)\"/>\n<rect x=\"330\" y=\"276\" width=\"300\" height=\"62\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/>\n<text x=\"480\" y=\"296\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">Discrepancia (217): ¿quién resuelve?</text>\n<text x=\"480\" y=\"314\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">regla: el PRESIDENTE, y es INDELEGABLE (217.1)</text>\n<text x=\"480\" y=\"330\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--exc)\">el PLENO si el reparo es por crédito o por competencia suya (217.2)</text>\n<path d=\"M650 306 L 634 306\" stroke=\"var(--exc)\" stroke-width=\"2\"/>\n<path d=\"M795 276 L 795 306 L 634 306\" stroke=\"var(--exc)\" stroke-width=\"2\" fill=\"none\"/>\n<rect x=\"30\" y=\"276\" width=\"280\" height=\"62\" rx=\"8\" fill=\"var(--panel)\" stroke=\"var(--line)\"/>\n<text x=\"170\" y=\"296\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\">Después, siempre (218)</text>\n<text x=\"170\" y=\"314\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">informe al Pleno como punto independiente</text>\n<text x=\"170\" y=\"330\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">y remisión anual al Tribunal de Cuentas</text>\n</svg>\n</section>\n";
</script>
<script>
document.getElementById('main').innerHTML+="\n<section class=\"card\" id=\"caso1\"><h2>Caso práctico integral 1 · Un ejercicio completo, de principio a fin</h2>\n<div class=\"box warn\"><span class=\"lbl\">Advertencia</span>La entidad es <b>ficticia</b>; las fechas, cifras y trámites son <b>verosímiles</b> y están calculados sobre los plazos reales del TRLHL. No se trata de un caso real ni de asesoramiento sobre uno.</div>\n<p><b>El escenario.</b> <b>Ayuntamiento de Vilaverde del Río</b>, 18.400 habitantes. Presupuesto general del <b>ejercicio 2026</b>, integrado por: el de la propia entidad (24,6 M€), el del <b>Patronato Municipal de Deportes</b> —organismo autónomo administrativo— (1,8 M€) y los estados de previsión de <b>Aguas de Vilaverde, S.A.</b>, sociedad de capital <b>íntegramente municipal</b> (4,2 M€).</p>\n\n<h3 style=\"font-size:1.02rem;margin-top:1.2rem\">Fase 1 · Qué se está aprobando (arts. 162 a 167)</h3>\n<p>Lo primero que hay que tener claro es <b>qué</b> es cada cosa, porque de ahí depende todo lo demás:</p>\n<table><thead><tr><th>Ente</th><th>Qué aporta</th><th>Artículo</th></tr></thead><tbody>\n<tr><td>Ayuntamiento</td><td>Su <b>presupuesto</b>: obligaciones que como máximo puede reconocer y derechos que prevé liquidar</td><td>162 y 164.1.a)</td></tr>\n<tr><td>Patronato de Deportes</td><td>Su <b>presupuesto</b>, propuesto inicialmente por su órgano competente</td><td>164.1.b) y 168.2</td></tr>\n<tr><td>Aguas de Vilaverde, S.A.</td><td><b>Estados de previsión</b> de gastos e ingresos, no «presupuesto»</td><td>164.1.c) y 168.3</td></tr>\n</tbody></table>\n<p class=\"small\">Los tres se integran en un <b>presupuesto general</b> que se aprueba por <b>acuerdo único</b> (art. 168.5): ninguno puede aprobarse por separado. Y al general se le unen los <b>cuatro anexos</b> del art. 166: plan de inversiones a <b>cuatro años</b>, programas de las sociedades, estado de consolidación y estado de la deuda.</p>\n\n<h3 style=\"font-size:1.02rem;margin-top:1.2rem\">Fase 2 · Elaboración, otoño de 2025 (art. 168)</h3>\n<table><thead><tr><th>Fecha</th><th>Actuación</th><th>Artículo</th></tr></thead><tbody>\n<tr><td><b>8-SEP-2025</b></td><td>El Patronato aprueba su propuesta de presupuesto y la remite al Ayuntamiento</td><td>168.2 · <b>antes del 15-SEP</b></td></tr>\n<tr><td><b>11-SEP-2025</b></td><td>Aguas de Vilaverde remite previsiones de gastos e ingresos y su programa anual de actuación, inversiones y financiación</td><td>168.3 · <b>antes del 15-SEP</b></td></tr>\n<tr><td><b>29-SEP-2025</b></td><td>La <b>Alcaldía</b> forma el presupuesto general con los siete documentos del art. 168.1: memoria, <b>liquidación de 2024 y avance de la de 2025 referido al menos a seis meses</b>, anexo de personal, anexo de inversiones, anexo de beneficios fiscales, anexo de convenios de gasto social e <b>informe económico-financiero</b></td><td>168.1</td></tr>\n<tr><td><b>3-OCT-2025</b></td><td>La <b>Intervención</b> emite su informe</td><td>168.4</td></tr>\n<tr><td><b>9-OCT-2025</b></td><td>Se remite al <b>Pleno</b> para su aprobación, enmienda o devolución</td><td>168.4 · <b>antes del 15-OCT</b></td></tr>\n</tbody></table>\n<details class=\"panel\"><summary>¿Por qué el informe económico-financiero es el documento clave del expediente?</summary><div class=\"body\"><p>Porque es donde se acredita la <b>efectiva nivelación</b> del presupuesto (art. 168.1.g): expone las bases de evaluación de los ingresos y de las operaciones de crédito y la suficiencia de los créditos para atender las obligaciones exigibles. Sin él, el <b>principio de que cada presupuesto se aprueba sin déficit inicial</b> (art. 165.4) sería una afirmación sin respaldo. Es, además, el documento que suele sostener o derribar una reclamación fundada en el art. <b>170.2.c)</b> —manifiesta insuficiencia de ingresos respecto de los gastos—.</p></div></details>\n\n<h3 style=\"font-size:1.02rem;margin-top:1.2rem\">Fase 3 · Aprobación (arts. 169 a 171)</h3>\n<p>El Pleno aprueba <b>inicialmente</b> el 30 de octubre. Se publica anuncio en el <b>Boletín Oficial de la Provincia</b> y se expone al público <b>15 días</b> (art. 169.1). Durante ese plazo:</p>\n<div class=\"box ej\"><span class=\"lbl\">La reclamación</span>La <b>Asociación de Vecinos del Barrio Norte</b> —entidad legalmente constituida para velar por intereses vecinales, art. <b>170.1.c)</b>— presenta reclamación alegando que <b>no figura crédito</b> para atender una obligación exigible: una sentencia firme que condena al Ayuntamiento a ejecutar la urbanización de un tramo de acera. Encaja exactamente en el art. <b>170.2.b)</b>.</div>\n<p>Presentada la reclamación, el presupuesto <b>no</b> queda automáticamente aprobado: el Pleno dispone de <b>un mes</b> para resolverla (art. 169.1). Lo hace el <b>15 de diciembre</b>, estimándola parcialmente y consignando 78.000 € en la aplicación <b>1532/61900</b>.</p>\n<details class=\"panel\"><summary>¿De dónde sale ese número, 1532/61900?</summary><div class=\"body\"><p>Es la <b>aplicación presupuestaria</b>: el cruce de la clasificación <b>por programas</b> y de la <b>económica</b> (art. 167 y Orden EHA/3565/2008). <b>153</b> es el grupo de programa de vías públicas y <b>1532</b> el programa de pavimentación; <b>619</b> es el concepto económico de «otras inversiones de reposición en infraestructuras y bienes destinados al uso general». Sin dominar el art. 167 y la Orden, el presupuesto es una lista de números sin sentido; con ellos, cada euro tiene dirección postal.</p></div></details>\n<table><thead><tr><th>Fecha</th><th>Actuación</th><th>Artículo</th></tr></thead><tbody>\n<tr><td><b>22-DIC-2025</b></td><td>Aprobación <b>definitiva</b> por el Pleno</td><td>169.2 · <b>antes del 31-DIC</b></td></tr>\n<tr><td><b>29-DIC-2025</b></td><td>Publicación <b>resumida por capítulos</b> en el BOP; copia al Estado y a la comunidad autónoma, <b>simultáneamente</b> al envío al boletín</td><td>169.3 y 169.4</td></tr>\n<tr><td><b>1-ENE-2026</b></td><td><b>Entrada en vigor</b>: el presupuesto solo entra en vigor una vez publicado</td><td>169.5</td></tr>\n</tbody></table>\n<div class=\"box exc\"><span class=\"lbl\">La bifurcación que no ocurrió</span>Si el 31 de diciembre no hubiera habido aprobación definitiva, se habría <b>prorrogado automáticamente</b> el presupuesto de 2025 con sus <b>créditos iniciales</b> —no con los definitivos—, sin incluir los créditos para servicios o programas que <b>terminaban</b> en 2025 (art. 169.6). Y el Ayuntamiento habría empezado el año ejecutando un presupuesto que <b>ya no responde</b> a sus decisiones políticas de 2026: por eso la prórroga es una red de seguridad, no una alternativa.</div>\n<p class=\"small\">Contra la aprobación definitiva cabe <b>recurso contencioso-administrativo directo</b>, que <b>no suspende por sí solo</b> la aplicación del presupuesto (art. 171). Y si la impugnación <b>afecta o se refiere a la nivelación presupuestaria</b>, el <b>Tribunal de Cuentas deberá informar previamente</b> a la resolución del recurso (art. 171.2).</p>\n\n<h3 style=\"font-size:1.02rem;margin-top:1.2rem\">Fase 4 · Ejecución durante 2026 (arts. 172 a 190 y 214 a 218)</h3>\n<p>El art. <b>172.2</b> declara los créditos <b>limitativos y vinculantes</b> y remite los <b>niveles de vinculación</b> a la legislación presupuestaria del Estado, «salvo que reglamentariamente se disponga otra cosa». En la práctica, ese desarrollo es el <b>RD 500/1990</b> <i>(norma externa a la biblioteca)</i>, que permite a cada entidad concretarlos en sus <b>bases de ejecución</b> (art. 165.1). En Vilaverde están fijados en <b>área de gasto y capítulo</b>, y eso es lo que decide cuándo hace falta tramitar una modificación y cuándo no.</p>\n<table><thead><tr><th>Situación real durante 2026</th><th>Respuesta</th><th>Artículo</th></tr></thead><tbody>\n<tr><td>Se necesitan 4.000 € más en «material de oficina» y sobran en «suministros», <b>dentro del mismo capítulo 2 y área de gasto</b></td><td><b>No hay modificación</b>: se está por debajo del nivel de vinculación</td><td>172.2 y bases de ejecución</td></tr>\n<tr><td>Se necesitan 60.000 € en el capítulo 6 y sobran en el capítulo 2 del mismo grupo</td><td><b>Transferencia de crédito</b>; el órgano competente lo fijan las bases</td><td>179.1</td></tr>\n<tr><td>La transferencia es <b>entre distintos grupos de función</b> y no afecta a personal</td><td>La aprueba el <b>Pleno</b>, con los trámites de los arts. 169 a 171</td><td>179.2 y 179.4</td></tr>\n<tr><td>Llega una subvención de la Diputación de 120.000 € no prevista</td><td><b>Generación de crédito</b> por ingresos</td><td>181</td></tr>\n<tr><td>Un gasto urgente sin crédito de ningún tipo</td><td><b>Crédito extraordinario</b> (véase el caso 2)</td><td>177</td></tr>\n</tbody></table>\n<p>Cada gasto recorre las <b>cuatro fases</b> del art. <b>184.1</b>: <b>A</b>utorización → <b>D</b>isposición o compromiso → reconocimiento o liquidación de la <b>O</b>bligación → ordenación del <b>P</b>ago; su contenido se establece <b>reglamentariamente</b> y las competencias están en el art. <b>185</b>. Y en paralelo, la <b>Intervención</b> fiscaliza (arts. 214 a 218). Mientras tanto, la <b>Tesorería</b> (arts. 194 a 199) maneja los fondos con su <b>plan de disposición</b>, y la <b>contabilidad</b> (arts. 200 a 207) registra todo, porque será la materia prima de la liquidación y de la cuenta general.</p>\n<details class=\"panel\"><summary>¿Por qué se dice que el art. 173.5 es «el artículo que da miedo»?</summary><div class=\"body\"><p>Porque declara <b>nulos de pleno derecho</b> los acuerdos, resoluciones y actos administrativos que adopte la entidad con <b>crédito inexistente o insuficiente</b> para su cuantía. No anulables: <b>nulos</b>. Y esa nulidad enlaza con dos consecuencias personales: la <b>responsabilidad</b> del art. 188 y la <b>infracción muy grave</b> del art. <b>28.c) de la Ley 19/2013</b>. Un mismo hecho —comprometer gasto sin crédito— activa a la vez el TRLHL, la LPAC (art. 47.1.g) y la ley de transparencia.</p></div></details>\n\n<h3 style=\"font-size:1.02rem;margin-top:1.2rem\">Fase 5 · Cierre y liquidación (arts. 191 a 193)</h3>\n<table><thead><tr><th>Fecha</th><th>Actuación</th><th>Artículo</th></tr></thead><tbody>\n<tr><td><b>31-DIC-2026</b></td><td>Cierre. Lo pendiente de cobro y de pago queda a cargo de la <b>Tesorería</b>. Los créditos no afectados a obligaciones ya reconocidas quedan <b>anulados de pleno derecho</b>, salvo las excepciones del art. 182</td><td>191.1 y 175</td></tr>\n<tr><td>—</td><td>Se cuantifica el <b>remanente de tesorería</b>: obligaciones reconocidas no satisfechas + derechos pendientes de cobro + fondos líquidos, <b>minorando</b> los derechos de difícil o imposible recaudación y teniendo en cuenta los <b>ingresos afectados</b></td><td>191.2</td></tr>\n<tr><td><b>26-FEB-2027</b></td><td>La <b>Alcaldía</b> aprueba la liquidación, previo <b>informe de la Intervención</b></td><td>191.3 · <b>antes del 1-MAR</b></td></tr>\n<tr><td><b>5-MAR-2027</b></td><td>Se <b>da cuenta al Pleno</b> en la primera sesión que celebra y se remite copia al Estado y a la comunidad autónoma</td><td>193.4 y 193.5</td></tr>\n</tbody></table>\n<div class=\"box warn\"><span class=\"lbl\">Fíjate en quién hace qué</span>El presupuesto lo aprueba el <b>Pleno</b>; la liquidación, el <b>Presidente</b>. Es una de las confusiones más caras del tema, y la explicación es sencilla: aprobar el presupuesto es una <b>decisión política</b>; liquidarlo es una <b>constatación contable</b>.</div>\n\n<h3 style=\"font-size:1.02rem;margin-top:1.2rem\">Fase 6 · Cuenta general y control (arts. 208 a 223)</h3>\n<table><thead><tr><th>Fecha</th><th>Actuación</th><th>Artículo</th></tr></thead><tbody>\n<tr><td><b>12-MAY-2027</b></td><td>La <b>Alcaldía</b> rinde los estados y cuentas; el Patronato y la sociedad remiten los suyos en el mismo plazo</td><td>212.1 · <b>antes del 15-MAY</b></td></tr>\n<tr><td><b>28-MAY-2027</b></td><td>La cuenta general, <b>formada por la Intervención</b>, se somete a informe de la <b>Comisión Especial de Cuentas</b>, con miembros de todos los grupos</td><td>212.2 · <b>antes del 1-JUN</b></td></tr>\n<tr><td><b>2 a 17-JUN-2027</b></td><td>Exposición al público <b>15 días</b>: reclamaciones, reparos u observaciones; la Comisión emite <b>nuevo informe</b></td><td>212.3</td></tr>\n<tr><td><b>24-SEP-2027</b></td><td>El <b>Pleno</b> aprueba la cuenta general</td><td>212.4 · <b>antes del 1-OCT</b></td></tr>\n<tr><td><b>8-OCT-2027</b></td><td>Rendición al <b>Tribunal de Cuentas</b></td><td>223.2 · <b>antes del 15-OCT</b></td></tr>\n</tbody></table>\n<div class=\"box ej\"><span class=\"lbl\">Y el bucle se cierra</span>La <b>liquidación de 2026</b>, aprobada el 26 de febrero de 2027, es <b>documento obligatorio</b> del presupuesto de <b>2028</b> que se está formando en septiembre de 2027 (art. 168.1.b). En ese mismo mes conviven <b>tres ejercicios</b>: se controla 2026, se ejecuta 2027 y se elabora 2028. Entender esa simultaneidad es entender el tema.</div>\n</section>\n\n<section class=\"card\" id=\"caso2\"><h2>Caso práctico integral 2 · Un solo expediente que atraviesa todo el tema</h2>\n<div class=\"box warn\"><span class=\"lbl\">Advertencia</span>Supuesto <b>ficticio</b> construido sobre los preceptos reales del TRLHL. Sirve para ver el <b>encadenamiento</b>, no para resolver un asunto concreto.</div>\n<p><b>El escenario.</b> Marzo de 2026. Un temporal daña la cubierta del <b>Pabellón Municipal de Vilaverde</b>. El informe técnico cifra la reparación en <b>340.000 €</b> y advierte de riesgo para las personas. En el presupuesto de 2026 <b>no existe</b> crédito para esa obra: la aplicación 342/632 está dotada con 15.000 € para pequeñas reparaciones. Seguiremos el expediente hasta el Tribunal de Cuentas.</p>\n\n<h3 style=\"font-size:1.02rem;margin-top:1.1rem\">Paso 1 · La pregunta previa: ¿qué modificación procede? (arts. 177 a 182)</h3>\n<p>Aplicamos el árbol de decisión: <b>¿de dónde sale el dinero?</b> No hay partida de la que detraerlo sin dejar otro servicio sin cobertura, ni ingreso nuevo que generar. Sale del <b>remanente líquido de tesorería</b> de la liquidación de 2025, que fue positivo. Por tanto:</p>\n<ul>\n<li>Como el crédito existe pero es <b>insuficiente</b>, procede <b>suplemento de crédito</b> por 325.000 €; si la aplicación no existiera, sería <b>crédito extraordinario</b>. La distinción está en el art. <b>177.1</b>.</li>\n<li>El gasto <b>no puede demorarse</b> al ejercicio siguiente: es el presupuesto de hecho del art. 177.1.</li>\n<li>El expediente debe ser <b>previamente informado por la Intervención</b> y aprobarse por el <b>Pleno</b>, con los <b>mismos trámites y requisitos</b> que el presupuesto: exposición <b>15 días</b>, reclamaciones del art. 170 y publicidad del art. 169 (art. <b>177.2</b>).</li>\n<li>Debe <b>especificar</b> la concreta partida a incrementar y el <b>recurso</b> que financia el aumento (art. <b>177.4</b>).</li>\n</ul>\n<details class=\"panel\"><summary>¿Cuánto tarda esto realmente? Haz el cálculo</summary><div class=\"body\"><p>Aprobación inicial en Pleno + <b>15 días</b> de exposición + hasta <b>un mes</b> para resolver reclamaciones + publicación. Entre seis y ocho semanas en el mejor de los casos. Ese es el motivo por el que muchas entidades intentan resolver por <b>transferencia</b> (art. 179) lo que en rigor exige un suplemento: es más rápido. Y es exactamente ahí donde aparecen los reparos de la Intervención.</p></div></details>\n\n<h3 style=\"font-size:1.02rem;margin-top:1.1rem\">Paso 2 · El atajo y el reparo (arts. 214 a 218)</h3>\n<div class=\"box exc\"><span class=\"lbl\">Lo que ocurre en la práctica</span>Ante la urgencia, se propone aprobar el gasto <b>antes</b> de que el suplemento esté vigente, con cargo a los 15.000 € existentes y «regularizando después». La Intervención, en <b>fiscalización previa</b> (art. 214), formula <b>reparo</b>.</div>\n<table><thead><tr><th>Pregunta</th><th>Respuesta</th><th>Artículo</th></tr></thead><tbody>\n<tr><td>¿Es un reparo <b>suspensivo</b>?</td><td><b>Sí</b>: se basa en <b>insuficiencia de crédito</b> y afecta a la disposición de gastos</td><td>216.2.a)</td></tr>\n<tr><td>¿Se paraliza el expediente?</td><td><b>Sí</b>, hasta que el reparo sea solventado</td><td>216.2</td></tr>\n<tr><td>¿Quién resuelve la discrepancia?</td><td>El <b>PLENO</b>, porque el reparo se basa en insuficiencia de crédito</td><td>217.2.a)</td></tr>\n<tr><td>¿Podría resolverla la Alcaldía?</td><td><b>No</b> en este caso. La regla general es el Presidente y la facultad es <b>indelegable</b>, pero aquí opera la excepción del 217.2</td><td>217.1 y 217.2</td></tr>\n<tr><td>¿Y si se aprobara igualmente el gasto?</td><td>Acto <b>nulo de pleno derecho</b>, con responsabilidad personal e infracción muy grave</td><td>173.5 y 188 · art. 28.c) Ley 19/2013</td></tr>\n</tbody></table>\n<p>El Pleno del <b>28 de abril</b> hace dos cosas en la misma sesión: <b>resuelve la discrepancia</b> dando la razón a la Intervención y <b>aprueba inicialmente</b> el suplemento de crédito. El expediente se desbloquea por la vía correcta.</p>\n<details class=\"panel\"><summary>¿Qué pasa después con esa resolución de discrepancia?</summary><div class=\"body\"><p>Aunque aquí el Pleno dio la razón a la Intervención, si el Presidente hubiera resuelto <b>en contra</b> del reparo, el órgano interventor habría tenido que <b>elevar informe al Pleno</b> de todas esas resoluciones, como <b>punto independiente del orden del día</b> (art. <b>218.1</b>), y el Presidente habría podido presentar informe justificativo. Además, la Intervención remite <b>anualmente al Tribunal de Cuentas</b> todas las resoluciones y acuerdos contrarios a reparos (art. <b>218.3</b>). Es decir: el reparo no muere en el expediente, viaja hasta el control externo.</p></div></details>\n\n<h3 style=\"font-size:1.02rem;margin-top:1.1rem\">Paso 3 · Vigencia del crédito y ejecución del gasto (arts. 183 a 189)</h3>\n<p>Publicada la aprobación definitiva del suplemento el <b>19 de junio</b>, el crédito existe. A partir de ahí, las cuatro fases:</p>\n<table><thead><tr><th>Fase</th><th>Qué ocurre en este expediente</th><th>Fecha</th></tr></thead><tbody>\n<tr><td><b>A</b> · Autorización</td><td>Se acuerda realizar el gasto por 325.000 €, reservando crédito</td><td>22-JUN-2026</td></tr>\n<tr><td><b>D</b> · Disposición</td><td>Adjudicación del contrato de obras: el gasto queda comprometido con un tercero determinado</td><td>7-SEP-2026</td></tr>\n<tr><td><b>O</b> · Obligación</td><td>Certificaciones de obra conformadas: nace la deuda exigible</td><td>desde NOV-2026</td></tr>\n<tr><td><b>P</b> · Pago</td><td>Ordenación del pago conforme al <b>plan de disposición de fondos</b> de la Tesorería</td><td>DIC-2026 y 2027</td></tr>\n</tbody></table>\n<p class=\"small\">A 31 de diciembre de 2026 solo se han reconocido obligaciones por <b>190.000 €</b>. Quedan <b>135.000 €</b> de crédito comprometido pero no ejecutado.</p>\n\n<h3 style=\"font-size:1.02rem;margin-top:1.1rem\">Paso 4 · El 31 de diciembre: qué pasa con los 135.000 € (arts. 175 y 182)</h3>\n<div class=\"box ej\"><span class=\"lbl\">La regla y su excepción</span>Regla del art. <b>175</b>: los créditos no afectados al cumplimiento de obligaciones ya reconocidas quedan <b>anulados de pleno derecho</b>. Excepción del art. <b>182</b>: pueden <b>incorporarse</b> al ejercicio siguiente, <b>siempre que existan recursos financieros suficientes</b>.</div>\n<p>Aquí concurren <b>dos</b> de los supuestos del art. 182.1: la letra <b>b)</b> —créditos que amparan <b>compromisos de gasto</b> del art. 176.2.b)— y la letra <b>c)</b> —créditos por <b>operaciones de capital</b>—. Se incorporan los 135.000 € al presupuesto de 2027.</p>\n<details class=\"panel\"><summary>Dos matices del art. 182 que se preguntan mucho</summary><div class=\"body\"><p><b>Primero (182.2):</b> los remanentes incorporados solo pueden aplicarse <b>dentro del ejercicio</b> al que la incorporación se acuerde; y si proceden de créditos extraordinarios, suplementos o transferencias del <b>último trimestre</b> —letra a)—, solo para <b>los mismos gastos</b> que motivaron su concesión.</p><p><b>Segundo (182.3):</b> los créditos que amparen <b>proyectos financiados con ingresos afectados</b> deben incorporarse <b>obligatoriamente</b>, salvo desistimiento total o parcial. Si esta obra se hubiera financiado con una subvención finalista y no con remanente, la incorporación no habría sido una opción, sino un deber.</p></div></details>\n\n<h3 style=\"font-size:1.02rem;margin-top:1.1rem\">Paso 5 · La liquidación de 2026 sale con remanente negativo (art. 193)</h3>\n<p>La liquidación aprobada por la Alcaldía el <b>25 de febrero de 2027</b> arroja un <b>remanente de tesorería para gastos generales de −412.000 €</b>: el suplemento consumió el remanente de 2025 y varios derechos se calificaron de difícil recaudación (art. 191.2). Se activa el art. 193, con <b>tres remedios y en este orden</b>:</p>\n<table><thead><tr><th>Orden</th><th>Remedio</th><th>Quién y cuándo</th><th>Artículo</th></tr></thead><tbody>\n<tr><td><b>1.º</b></td><td><b>Reducir gastos</b> del nuevo presupuesto por cuantía igual al déficit</td><td>El <b>Pleno</b>, en la <b>primera sesión</b> que celebre</td><td>193.1</td></tr>\n<tr><td><b>2.º</b></td><td>Si no es posible, <b>operación de crédito</b> por su importe</td><td>Con las condiciones del art. 177.5</td><td>193.2</td></tr>\n<tr><td><b>3.º</b></td><td>Si tampoco, aprobar el presupuesto siguiente con <b>superávit inicial</b> no inferior al déficit</td><td>Presupuesto de 2028</td><td>193.3</td></tr>\n</tbody></table>\n<p>El Pleno del <b>4 de marzo de 2027</b> aprueba la reducción de gastos por 412.000 €. Esa reducción <b>solo puede revocarse</b> por acuerdo del Pleno, a propuesta del Presidente y previo informe del Interventor, cuando el desarrollo del presupuesto y la tesorería lo consientan (art. 193.1).</p>\n\n<h3 style=\"font-size:1.02rem;margin-top:1.1rem\">Paso 6 · Todo termina en la cuenta general y en el control externo (arts. 208 a 223)</h3>\n<p>El expediente completo —modificación, reparo, discrepancia, ejecución, incorporación y liquidación— acaba reflejado en tres sitios distintos:</p>\n<table><thead><tr><th>Dónde aparece</th><th>Qué se ve</th><th>Artículo</th></tr></thead><tbody>\n<tr><td><b>Cuenta general de 2026</b></td><td>Ejecución del presupuesto, resultado presupuestario y remanente de tesorería; se rinde <b>antes del 15-MAY-2027</b> y la aprueba el Pleno <b>antes del 1-OCT</b></td><td>209 y 212</td></tr>\n<tr><td><b>Informe de la Intervención al Pleno</b></td><td>Resoluciones contrarias a reparos y anomalías en materia de ingresos, como <b>punto independiente</b> del orden del día</td><td>218.1</td></tr>\n<tr><td><b>Tribunal de Cuentas</b></td><td>La cuenta general <b>antes del 15-OCT-2027</b> y, por separado, las resoluciones contrarias a reparos remitidas <b>anualmente</b></td><td>223.2 y 218.3</td></tr>\n</tbody></table>\n<div class=\"box ej\"><span class=\"lbl\">La moraleja del caso</span>Un solo hecho —una cubierta rota— ha activado <b>seis bloques</b> del tema: la estructura del crédito (172-176), las modificaciones (177-182), las fases del gasto (183-189), la función interventora (214-218), la liquidación y el remanente (191-193) y la cuenta general con el control externo (208-223). En un examen, la pregunta rara vez es «¿qué dice el art. 182?»; suele ser «¿qué ocurre con el crédito no ejecutado?». Y para responderla hay que ver el flujo, no el artículo.</div>\n</section>\n\n<section class=\"card\" id=\"conexiones\"><h2>Diez preguntas de conexión</h2>\n<p class=\"small\">No preguntan por un artículo, sino por la <b>relación</b> entre dos. Responde en voz alta y después despliega.</p>\n<div id=\"qbox\"></div>\n</section>\n\n<section class=\"card\" id=\"semaforo8\"><h2>Semáforo de la visión de conjunto</h2>\n<p class=\"small\">Marca cada conexión, no cada artículo. Abajo aparece tu lista de repaso.</p>\n<div id=\"sembox\"></div><div id=\"semres\" style=\"margin-top:.8rem\"></div>\n</section>\n";
</script>

(function(){
"use strict";
var K_THEME="oposi_bII_theme", K_FS="oposi_bII_fs", K_STREAK="oposi_bII_streak";
function load(k,f){try{var v=localStorage.getItem(k);return v?JSON.parse(v):f;}catch(e){return f;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
var root=document.documentElement;

/* Tema persistente (sobrescribe el toggle simple anterior) */
var saved=load(K_THEME,null);
if(saved){root.setAttribute("data-theme",saved);}
else if(window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches){root.setAttribute("data-theme","dark");}
var bt=document.getElementById("theme");
if(bt)bt.onclick=function(){
  var n=root.getAttribute("data-theme")==="dark"?"light":"dark";
  root.setAttribute("data-theme",n);save(K_THEME,n);
};

/* Tamaño de texto persistente */
var fs=load(K_FS,16);
function setFs(v){fs=Math.max(13,Math.min(22,v));root.style.setProperty("--fs",fs+"px");save(K_FS,fs);}
setFs(fs);
var bp=document.getElementById("fs+"),bm=document.getElementById("fs-");
if(bp)bp.onclick=function(){setFs(fs+1);};
if(bm)bm.onclick=function(){setFs(fs-1);};

(function(){
  var el=document.getElementById("streakN");if(!el)return;
  var hoy=new Date().toISOString().slice(0,10);
  var s=load(K_STREAK,{last:null,n:0});
  if(s.last!==hoy){
    var ayer=new Date(Date.now()-864e5).toISOString().slice(0,10);
    s.n=(s.last===ayer)?s.n+1:1;s.last=hoy;save(K_STREAK,s);
  }
  el.textContent=s.n;
})();

/* Reveal on scroll para las tarjetas */
function reveal(){
  var els=document.querySelectorAll("section.card:not(.rv)");
  if(!els.length)return;
  if(!("IntersectionObserver" in window)){return;}
  var io=new IntersectionObserver(function(es){
    es.forEach(function(en){if(en.isIntersecting){en.target.classList.add("in");io.unobserve(en.target);}});
  },{threshold:.06,rootMargin:"0px 0px -30px 0px"});
  Array.prototype.forEach.call(els,function(el){el.classList.add("rv");io.observe(el);});
}

/* Sección activa en el índice lateral */
function spy(){
  var links=document.querySelectorAll("nav.side a[href^='#']");
  if(!links.length||!("IntersectionObserver" in window))return;
  var map={};
  Array.prototype.forEach.call(links,function(a){
    var t=document.getElementById(a.getAttribute("href").slice(1));
    if(t)map[t.id]=a;
  });
  var io=new IntersectionObserver(function(es){
    es.forEach(function(en){
      if(en.isIntersecting){
        Array.prototype.forEach.call(links,function(a){a.classList.remove("on");});
        if(map[en.target.id])map[en.target.id].classList.add("on");
      }
    });
  },{rootMargin:"-80px 0px -70% 0px",threshold:0});
  Object.keys(map).forEach(function(id){io.observe(document.getElementById(id));});
}

/* Ripple en botones */
document.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b||b.classList.contains("navtoggle"))return;
  var r=b.getBoundingClientRect(),d=Math.max(r.width,r.height),s=document.createElement("span");
  s.className="ripple";s.style.width=s.style.height=d+"px";
  s.style.left=(e.clientX-r.left-d/2)+"px";s.style.top=(e.clientY-r.top-d/2)+"px";
  b.appendChild(s);setTimeout(function(){if(s.parentNode)s.parentNode.removeChild(s);},560);
});

else{setTimeout(init,60);}
addEventListener("load",function(){setTimeout(init,80);});
})();

/* ═══ Parser de respuestas: estructura semántica ═══ */
var FCFMT=(function(){
  var CITA=/\s*\(((?:arts?\.|DA\b|DT\b|disp\.)[^)]*)\)\s*\.?\s*$/i;
  var strip=function(h){return h.replace(/<[^>]+>/g,"");};

  function esc(s){return s;}

  function parse(raw){
    var out={verdict:null,cite:null,kind:"p",items:[],text:""};
    var body=String(raw).trim();

    /* 1 ── Cita legal al final */
    var m=body.match(CITA);
    if(m){out.cite=m[1].replace(/\s+/g," ").trim();body=body.slice(0,m.index).trim();}
    body=body.replace(/[.;,\s]+$/,"");

    /* 2 ── Veredicto Sí / No inicial */
    var v=strip(body).match(/^(Sí|Sí,|No|No,)[.:,]?\s/);
    if(v){
      out.verdict=/^Sí/.test(v[1])?"si":"no";
      body=body.replace(/^(<[^>]+>\s*)*(Sí|No)[.,:]?\s*/,"").trim();
      body=body.replace(/^en\s/,"En ");
    }

    /* 3 ── Enumeración con · */
    var parts=body.split(/\s+·\s+/);
    if(parts.length>=2){
      out.kind="list";
      var letras=parts.filter(function(p){return /^\s*<?[a-h]\)/.test(strip(p));}).length;
      out.marker = letras>=parts.length-1 ? "alpha" : "num";
      out.items=parts.map(function(p){
        return p.replace(/^\s*[a-h]\)\s*/,"").replace(/[.\s]+$/,"").trim();
      }).filter(Boolean);
      return out;
    }

    /* 4 ── Cláusulas contrapuestas con ; */
    var semi=body.split(/;\s+/);
    if(semi.length>=2&&semi.length<=3&&semi.every(function(s){return strip(s).length>14;})){
      out.kind="clauses";
      out.items=semi.map(function(s){return s.replace(/[.\s]+$/,"").trim();});
      return out;
    }

    /* 5 ── Párrafo */
    out.text=body;
    return out;
  }

  function render(raw){
    var d=parse(raw),h="";

    if(d.verdict){
      h+='<span class="fc-verdict '+d.verdict+'">'+(d.verdict==="si"?"✓ Sí":"✗ No")+'</span>';
    }

    if(d.kind==="list"){
      h+='<ol class="fc-list '+d.marker+'">';
      d.items.forEach(function(it){h+='<li>'+it+'</li>';});
      h+='</ol>';
    }else if(d.kind==="clauses"){
      h+='<div class="fc-clauses">';
      d.items.forEach(function(it){h+='<p>'+it+'</p>';});
      h+='</div>';
    }else if(d.text){
      h+='<p class="fc-p">'+d.text+'</p>';
    }

    if(d.cite){
      h+='<span class="fc-cite"><span class="s">§</span>'+d.cite+'</span>';
    }
    return {html:h,struct:(d.kind!=="p"||!!d.verdict||strip(raw).length>150)};
  }
  return {parse:parse,render:render};
})();

<script>
document.getElementById('main').innerHTML="\n<section class=\"card\" id=\"intro\"><h2>Tema 9 · Visión de conjunto</h2>\n<p class=\"small\">Esta página no explica artículos: los <b>conecta</b>. Léela <b>después</b> de haber trabajado los arts. 1 a 11 y antes de cada repaso, para recuperar de golpe el mapa completo.</p>\n<div class=\"box ej\"><span class=\"lbl\">La idea que ordena el tema</span>Todo el tema 9 responde a <b>una sola pregunta</b>: <i>¿se aplica la LCSP a este negocio y con qué intensidad?</i> Y se contesta con <b>tres filtros en cadena</b> —¿es oneroso? ¿quién lo celebra? ¿está excluido?— y una <b>cuarta pregunta</b> que enlaza con el tema 10: ¿en cuál de los <b>tres círculos</b> del art. 3 está la entidad contratante.</div>\n<div class=\"box warn\"><span class=\"lbl\">Fuentes utilizadas y vigencia</span>\n<ul><li><b>Ley 9/2017, de 8 de noviembre</b>, de Contratos del Sector Público (documento 7 de la biblioteca), arts. 1 a 11 y concordantes 23, 25, 26 y 27, texto consolidado.</li>\n<li>Concordancias con la <b>Ley 40/2015</b> (documento 2) en materia de consorcios y encargos a medios propios.</li>\n<li><b>Aportación externa</b>: la <b>Directiva 2014/24/UE</b>, de la que procede el concepto de organismo de Derecho público del art. 3.3.d), y el <b>art. 346 del TFUE</b>, citado por el art. 5.1. Verifica siempre la vigencia en el BOE consolidado; los <b>umbrales</b> se actualizan periódicamente por reglamento delegado de la Comisión.</li>\n<li>Las entidades y cifras de los casos prácticos son <b>ficticias</b>; los preceptos y los umbrales, reales.</li></ul></div>\n</section>\n<section class=\"card\" id=\"flujo\"><h2>Diagrama general de flujo: el embudo de la LCSP</h2><p class=\"small\">De arriba abajo, los tres filtros. Los <b>rombos</b> son las tres preguntas; los recuadros <b>rojos</b>, las salidas cuando la respuesta expulsa el negocio de la ley.</p><svg viewBox=\"0 0 960 780\" role=\"img\" aria-label=\"Embudo de aplicación de la Ley de Contratos del Sector Público\" style=\"width:100%;height:auto\"><defs><marker id=\"fl\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"330\" y=\"10\" width=\"300\" height=\"44\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"36.16\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"#fff\">¿Se aplica la LCSP a este negocio?</text><path d=\"M480 56 L 480 74\" stroke=\"var(--acc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl)\"/><path d=\"M480 74 L 630 110 L 480 146 L 330 110 z\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\" stroke-width=\"2\"/><text x=\"480\" y=\"106.02\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--warn)\">¿Es un contrato ONEROSO?</text><text x=\"480\" y=\"121.02\" text-anchor=\"middle\" font-size=\"7\" fill=\"var(--ink2)\">art. 2.1 · beneficio económico directo o indirecto</text><path d=\"M630 110 L 800 110 L 800 152\" stroke=\"var(--exc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fr)\"/><rect x=\"700\" y=\"158\" width=\"250\" height=\"60\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"825\" y=\"178.52\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--exc)\">NO · fuera de la LCSP</text><text x=\"825\" y=\"191.52\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">un negocio gratuito no es</text><text x=\"825\" y=\"204.52\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">contrato del sector público</text><text x=\"660\" y=\"102\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"var(--exc)\">NO</text><path d=\"M480 146 L 480 176\" stroke=\"var(--acc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl)\"/><text x=\"496\" y=\"168\" text-anchor=\"start\" font-size=\"10\" font-weight=\"700\" fill=\"var(--ej)\">SÍ</text><path d=\"M480 180 L 640 218 L 480 256 L 320 218 z\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\" stroke-width=\"2\"/><text x=\"480\" y=\"214.02\" text-anchor=\"middle\" font-size=\"9\" font-weight=\"700\" fill=\"var(--warn)\">¿Lo celebra una entidad del art. 3.1?</text><text x=\"480\" y=\"229.02\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--ink2)\">el ámbito subjetivo: quién contrata</text><path d=\"M640 218 L 800 218 L 800 254\" stroke=\"var(--exc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fr)\"/><rect x=\"690\" y=\"260\" width=\"260\" height=\"66\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"820\" y=\"277.02\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--warn)\">NO · salvo excepción</text><text x=\"820\" y=\"290.02\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"currentColor\">art. 2.2 · contratos SUBVENCIONADOS</text><text x=\"820\" y=\"303.02\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"currentColor\">en más del 50 % por un poder</text><text x=\"820\" y=\"316.02\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"currentColor\">adjudicador (art. 23): sí sujetos</text><text x=\"650\" y=\"210\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"var(--exc)\">NO</text><path d=\"M480 256 L 480 286\" stroke=\"var(--acc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl)\"/><text x=\"496\" y=\"278\" text-anchor=\"start\" font-size=\"10\" font-weight=\"700\" fill=\"var(--ej)\">SÍ</text><path d=\"M480 290 L 650 330 L 480 370 L 310 330 z\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\" stroke-width=\"2\"/><text x=\"480\" y=\"326.02\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--warn)\">¿Está en la lista de exclusiones?</text><text x=\"480\" y=\"341.02\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"var(--ink2)\">arts. 5 a 11 · negocios jurídicos excluidos</text><path d=\"M650 330 L 800 330 L 800 368\" stroke=\"var(--exc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fr)\"/><rect x=\"660\" y=\"374\" width=\"290\" height=\"74\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"805\" y=\"395.02\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--exc)\">SÍ · NEGOCIO EXCLUIDO</text><text x=\"805\" y=\"408.02\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"currentColor\">se rige por sus normas especiales</text><text x=\"805\" y=\"421.02\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"currentColor\">y se aplican los PRINCIPIOS de la LCSP</text><text x=\"805\" y=\"434.02\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"currentColor\">para dudas y lagunas · art. 4</text><text x=\"660\" y=\"322\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"var(--exc)\">SÍ</text><path d=\"M480 372 L 480 456\" stroke=\"var(--acc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl)\"/><text x=\"496\" y=\"418\" text-anchor=\"start\" font-size=\"10\" font-weight=\"700\" fill=\"var(--ej)\">NO</text><rect x=\"60\" y=\"462\" width=\"580\" height=\"44\" rx=\"8\" fill=\"var(--ej)\" stroke=\"var(--ej)\"/><text x=\"350\" y=\"488.16\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"#fff\">ES UN CONTRATO DEL SECTOR PÚBLICO · sujeto a la LCSP</text><path d=\"M350 508 L 350 530\" stroke=\"var(--acc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl)\"/><rect x=\"60\" y=\"534\" width=\"840\" height=\"34\" rx=\"8\" fill=\"var(--panel)\" stroke=\"var(--line)\"/><text x=\"480\" y=\"554.52\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">Pero, ¿con qué intensidad? Depende del CÍRCULO en que esté la entidad contratante (art. 3)</text><path d=\"M480 570 L 480 590\" stroke=\"var(--acc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl)\"/><rect x=\"20\" y=\"596\" width=\"300\" height=\"120\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"170\" y=\"633.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">1 · ADMINISTRACIÓN PÚBLICA</text><text x=\"170\" y=\"646.84\" text-anchor=\"middle\" font-size=\"10\" fill=\"#fff\">art. 3.2 · el círculo interior</text><text x=\"170\" y=\"659.84\" text-anchor=\"middle\" font-size=\"10\" fill=\"#fff\">AGE, CCAA, entidades locales,</text><text x=\"170\" y=\"672.84\" text-anchor=\"middle\" font-size=\"10\" fill=\"#fff\">Seguridad Social, OOAA,</text><text x=\"170\" y=\"685.84\" text-anchor=\"middle\" font-size=\"10\" fill=\"#fff\">universidades públicas…</text><rect x=\"330\" y=\"596\" width=\"300\" height=\"120\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"633.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"var(--acc)\">2 · PODER ADJUDICADOR</text><text x=\"480\" y=\"646.84\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">art. 3.3 · círculo intermedio</text><text x=\"480\" y=\"659.84\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">fundaciones públicas, Mutuas</text><text x=\"480\" y=\"672.84\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">colaboradoras y entes creados para</text><text x=\"480\" y=\"685.84\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">necesidades de interés general</text><rect x=\"640\" y=\"596\" width=\"300\" height=\"120\" rx=\"8\" fill=\"var(--panel)\" stroke=\"var(--line)\"/><text x=\"790\" y=\"633.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"currentColor\">3 · RESTO DEL SECTOR PÚBLICO</text><text x=\"790\" y=\"646.84\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">art. 3.1 · círculo exterior</text><text x=\"790\" y=\"659.84\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">sociedades y entes que no son</text><text x=\"790\" y=\"672.84\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">poder adjudicador: régimen</text><text x=\"790\" y=\"685.84\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">mínimo de la ley</text><rect x=\"20\" y=\"726\" width=\"920\" height=\"40\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"480\" y=\"749.52\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">Los tres están DENTRO de la LCSP; lo que cambia es el régimen. Solo el círculo 1 celebra contratos ADMINISTRATIVOS (art. 25)</text></svg><div class=\"box ej\"><span class=\"lbl\">Cómo leerlo</span>Un negocio solo está sujeto a la LCSP si supera <b>los tres filtros</b>. Y superarlos no significa el mismo régimen para todos: la última fila del diagrama es la que decide la <b>intensidad</b>.</div></section><section class=\"card\" id=\"circulos\"><h2>Los tres círculos del art. 3, con sus consecuencias</h2><p class=\"small\">El art. 3 no es una lista de entidades: es una estructura de <b>muñecas rusas</b>. Toda Administración Pública es poder adjudicador y todo poder adjudicador es sector público, pero no al revés.</p><svg viewBox=\"0 0 960 428\" role=\"img\" aria-label=\"Los tres círculos del ámbito subjetivo de la LCSP\" style=\"width:100%;height:auto\"><defs><marker id=\"fl\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"30\" y=\"30\" width=\"560\" height=\"346\" rx=\"14\" fill=\"var(--panel)\" stroke=\"var(--line)\" stroke-width=\"2\"/><text x=\"310\" y=\"54\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"currentColor\">SECTOR PÚBLICO · art. 3.1</text><rect x=\"70\" y=\"72\" width=\"480\" height=\"258\" rx=\"12\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\" stroke-width=\"2\"/><text x=\"310\" y=\"96\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"var(--acc)\">PODERES ADJUDICADORES · art. 3.3</text><rect x=\"120\" y=\"114\" width=\"380\" height=\"182\" rx=\"10\" fill=\"var(--acc)\" stroke=\"var(--acc)\" stroke-width=\"2\"/><text x=\"310\" y=\"140\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"#fff\">ADMINISTRACIONES PÚBLICAS</text><text x=\"310\" y=\"158\" text-anchor=\"middle\" font-size=\"10\" fill=\"#fff\">art. 3.2</text><text x=\"310\" y=\"182\" text-anchor=\"middle\" font-size=\"10\" fill=\"#fff\">AGE · CCAA · Ceuta y Melilla · entidades locales</text><text x=\"310\" y=\"198\" text-anchor=\"middle\" font-size=\"10\" fill=\"#fff\">Entidades Gestoras y Servicios Comunes</text><text x=\"310\" y=\"214\" text-anchor=\"middle\" font-size=\"10\" fill=\"#fff\">de la Seguridad Social</text><text x=\"310\" y=\"232\" text-anchor=\"middle\" font-size=\"10\" fill=\"#fff\">Organismos Autónomos · universidades públicas</text><text x=\"310\" y=\"248\" text-anchor=\"middle\" font-size=\"10\" fill=\"#fff\">autoridades administrativas independientes</text><text x=\"310\" y=\"270\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"#fff\">y ciertos consorcios y entes de derecho público</text><text x=\"310\" y=\"284\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"#fff\">no financiados con ingresos de mercado</text><text x=\"310\" y=\"310\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--acc)\">fundaciones públicas · Mutuas colaboradoras con la Seguridad Social</text><text x=\"310\" y=\"324\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"var(--acc)\">y los entes creados para necesidades de interés general no industrial ni mercantil</text><text x=\"310\" y=\"356\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--ink2)\">sociedades mercantiles públicas · fondos sin personalidad · el resto del art. 3.1</text><rect x=\"610\" y=\"30\" width=\"330\" height=\"96\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"775\" y=\"62.34\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">Si es ADMINISTRACIÓN PÚBLICA</text><text x=\"775\" y=\"75.34\" text-anchor=\"middle\" font-size=\"10\" fill=\"#fff\">contratos ADMINISTRATIVOS (art. 25)</text><text x=\"775\" y=\"88.34\" text-anchor=\"middle\" font-size=\"10\" fill=\"#fff\">jurisdicción contencioso-administrativa</text><text x=\"775\" y=\"101.34\" text-anchor=\"middle\" font-size=\"10\" fill=\"#fff\">en todo el ciclo del contrato</text><rect x=\"610\" y=\"134\" width=\"330\" height=\"96\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"775\" y=\"166.34\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"var(--acc)\">Si es PODER ADJUDICADOR no AP</text><text x=\"775\" y=\"179.34\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">sus contratos son PRIVADOS (art. 26.1.b)</text><text x=\"775\" y=\"192.34\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">preparación y adjudicación: contencioso</text><text x=\"775\" y=\"205.34\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">efectos y extinción: jurisdicción civil</text><rect x=\"610\" y=\"238\" width=\"330\" height=\"96\" rx=\"8\" fill=\"var(--panel)\" stroke=\"var(--line)\"/><text x=\"775\" y=\"270.34\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"currentColor\">Si NO es poder adjudicador</text><text x=\"775\" y=\"283.34\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">contratos PRIVADOS (art. 26.1.c)</text><text x=\"775\" y=\"296.34\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">régimen mínimo de la ley</text><text x=\"775\" y=\"309.34\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">efectos y extinción: jurisdicción civil</text><rect x=\"610\" y=\"342\" width=\"330\" height=\"44\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"775\" y=\"361.02\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">La pregunta del examen nunca es «¿está dentro?»,</text><text x=\"775\" y=\"374.02\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">sino «¿en qué círculo está?»</text><rect x=\"30\" y=\"388\" width=\"910\" height=\"30\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"485\" y=\"406.2\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">Partidos, sindicatos y organizaciones empresariales: solo en los casos del art. 3.4</text></svg><div class=\"box warn\"><span class=\"lbl\">La trampa</span><b>Fundaciones públicas</b> y <b>Mutuas colaboradoras con la Seguridad Social</b> son <b>siempre</b> poder adjudicador (art. 3.3.b y 3.3.c) y <b>nunca</b> Administración Pública. Si una pregunta las une a «contrato administrativo», es falsa.</div></section><section class=\"card\" id=\"exclusiones\"><h2>El mapa de las exclusiones</h2><p class=\"small\">Siete ámbitos y una regla común. Conviene memorizarlos por <b>ámbito</b>, no por número de artículo: así se recuerdan mejor y se aplican más rápido.</p><svg viewBox=\"0 0 960 438\" role=\"img\" aria-label=\"Cuadro de los negocios jurídicos excluidos de la LCSP\" style=\"width:100%;height:auto\"><defs><marker id=\"fl\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"230\" y=\"8\" width=\"500\" height=\"40\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"32.16\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"#fff\">LOS NEGOCIOS EXCLUIDOS · arts. 5 a 11</text><rect x=\"15\" y=\"62\" width=\"290\" height=\"90\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"160\" y=\"97.68\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--warn)\">5 · Defensa y seguridad</text><text x=\"160\" y=\"110.68\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"currentColor\">convenios del art. 346 TFUE</text><text x=\"160\" y=\"123.68\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"currentColor\">y contratos con normativa propia</text><rect x=\"335\" y=\"62\" width=\"290\" height=\"90\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"480\" y=\"97.68\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--ej)\">6 · Convenios y encomiendas</text><text x=\"480\" y=\"110.68\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"currentColor\">convenios entre entidades públicas</text><text x=\"480\" y=\"123.68\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"currentColor\">y encargos a medios propios</text><rect x=\"655\" y=\"62\" width=\"290\" height=\"90\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"800\" y=\"97.68\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--acc)\">7 · Ámbito internacional</text><text x=\"800\" y=\"110.68\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"currentColor\">acuerdos con Estados</text><text x=\"800\" y=\"123.68\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"currentColor\">y con organizaciones internacionales</text><rect x=\"15\" y=\"166\" width=\"290\" height=\"90\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"160\" y=\"201.68\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--acc)\">8 · I+D+i</text><text x=\"160\" y=\"214.68\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"currentColor\">contratos de investigación y desarrollo</text><text x=\"160\" y=\"227.68\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"currentColor\">salvo los CPV que enumera</text><rect x=\"335\" y=\"166\" width=\"290\" height=\"90\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"480\" y=\"201.68\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--exc)\">9 · Dominio público y patrimonio</text><text x=\"480\" y=\"214.68\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"currentColor\">autorizaciones y concesiones demaniales</text><text x=\"480\" y=\"227.68\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"currentColor\">y contratos patrimoniales</text><rect x=\"655\" y=\"166\" width=\"290\" height=\"90\" rx=\"8\" fill=\"var(--panel)\" stroke=\"var(--line)\"/><text x=\"800\" y=\"201.68\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"currentColor\">10 · Ámbito financiero</text><text x=\"800\" y=\"214.68\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"currentColor\">servicios financieros sobre valores</text><text x=\"800\" y=\"227.68\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"currentColor\">y préstamos</text><rect x=\"15\" y=\"270\" width=\"290\" height=\"90\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"160\" y=\"305.68\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--warn)\">11 · Otros</text><text x=\"160\" y=\"318.68\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"currentColor\">relación de funcionarios y contratos laborales</text><text x=\"160\" y=\"331.68\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"currentColor\">servicio público con tarifa de aplicación general</text><rect x=\"230\" y=\"374\" width=\"500\" height=\"52\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"480\" y=\"390.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"var(--exc)\">Art. 4 · La regla común</text><text x=\"480\" y=\"403.84\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">quedan excluidos y se rigen por sus normas especiales,</text><text x=\"480\" y=\"416.84\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">aplicándose los PRINCIPIOS de la LCSP para dudas y lagunas</text></svg><div class=\"box exc\"><span class=\"lbl\">No confundir</span><b>Excluido</b> no es lo mismo que <b>no sujeto a regulación armonizada</b>. Lo excluido queda fuera de la ley (con la salvedad del art. 4); lo no armonizado está <b>dentro</b>, solo que con un régimen menos exigente. Es la confusión que más puntos cuesta.</div></section>";
</script>
<script>
document.getElementById('main').innerHTML+="\n<section class=\"card\" id=\"caso1\"><h2>Caso práctico integral 1 · Seis negocios sobre la misma mesa</h2>\n<div class=\"box warn\"><span class=\"lbl\">Advertencia</span>Entidad <b>ficticia</b>; supuestos verosímiles construidos sobre los preceptos reales de la Ley 9/2017. No es asesoramiento sobre un caso concreto.</div>\n<p><b>El escenario.</b> El <b>Ayuntamiento de Vilaverde del Río</b> lleva al mismo Pleno seis operaciones. De cada una hay que decidir tres cosas, y en ese orden: <b>¿está dentro de la LCSP?</b> · <b>¿por qué?</b> · <b>¿qué consecuencia tiene?</b></p>\n\n<h3 style=\"font-size:1.02rem;margin-top:1rem\">a) Contrato de limpieza viaria por 1,2 M€</h3>\n<p><b>Dentro.</b> Es <b>oneroso</b> —el contratista obtiene un beneficio económico directo, art. <b>2.1</b>— y lo celebra una entidad del art. <b>3.1.a)</b>. El Ayuntamiento es <b>Administración Pública</b> (art. <b>3.2.a</b>), lo que lo sitúa en el círculo interior y anticipa el tema 10: será un contrato <b>administrativo</b> (art. 25.1.a) con jurisdicción contencioso-administrativa en todo su ciclo.</p>\n\n<h3 style=\"font-size:1.02rem;margin-top:1rem\">b) Convenio con la Diputación para conservar un camino rural</h3>\n<p><b>Fuera</b>, art. <b>6.1</b>: convenios celebrados entre entidades del sector público <b>siempre que su contenido no esté comprendido</b> en el de los contratos regulados por la ley.</p>\n<details class=\"panel\"><summary>El error habitual: llamar «convenio» a lo que es un contrato</summary><div class=\"body\"><p>Si lo que la Diputación va a hacer es <b>ejecutar la conservación a cambio de un precio</b>, el contenido <b>sí</b> está comprendido en el contrato de servicios del art. 17 y la exclusión decae: sería un contrato, no un convenio. La etiqueta que se ponga al documento es irrelevante; lo que decide es el <b>contenido</b> de la prestación. Y aunque el negocio quede excluido, el art. <b>4</b> obliga a aplicar los <b>principios</b> de la ley para resolver dudas y lagunas.</p></div></details>\n\n<h3 style=\"font-size:1.02rem;margin-top:1rem\">c) Concesión de un quiosco en el parque municipal</h3>\n<p><b>Fuera</b>, art. <b>9.1</b>: las <b>autorizaciones y concesiones sobre bienes de dominio público</b> se rigen por su legislación específica. El parque es dominio público de uso general y el quiosco ocupa una porción de él.</p>\n<div class=\"box exc\"><span class=\"lbl\">Dónde está la frontera</span>Si en lugar de ocupar suelo el objeto fuera <b>prestar un servicio</b> de titularidad municipal asumiendo el <b>riesgo operacional</b> —una escuela infantil, por ejemplo—, estaríamos ante una <b>concesión de servicios</b> del art. 15, plenamente sujeta a la ley. Ocupar dominio público no es lo mismo que gestionar un servicio público.</div>\n\n<h3 style=\"font-size:1.02rem;margin-top:1rem\">d) Compra de tuberías por Aguas de Vilaverde, S.A. (capital 100 % municipal)</h3>\n<p><b>Dentro</b>, pero no en el círculo interior. La sociedad forma parte del <b>sector público</b> (art. <b>3.1.h</b>). ¿Es <b>poder adjudicador</b>? Hay que aplicar el art. <b>3.3.d)</b>: lo será si fue creada específicamente para satisfacer <b>necesidades de interés general que no tengan carácter industrial o mercantil</b> y el Ayuntamiento financia mayoritariamente su actividad, controla su gestión o nombra a más de la mitad de su órgano de administración.</p>\n<table><thead><tr><th>Respuesta</th><th>Régimen</th><th>Artículo</th></tr></thead><tbody>\n<tr><td>Sí es poder adjudicador</td><td>Contrato <b>privado</b>, pero con preparación y adjudicación sujetas a la ley</td><td>26.1.b)</td></tr>\n<tr><td>No lo es</td><td>Contrato <b>privado</b> con el régimen mínimo de la ley</td><td>26.1.c)</td></tr>\n</tbody></table>\n<p class=\"small\">En ninguno de los dos casos será <b>administrativo</b>: el art. 25.1 exige que lo celebre una <b>Administración Pública</b>, y una sociedad mercantil nunca lo es.</p>\n\n<h3 style=\"font-size:1.02rem;margin-top:1rem\">e) Centro deportivo de 6 M€ construido por una asociación, subvencionado al 60 %</h3>\n<p><b>Dentro</b>, y por una vía que se olvida siempre: el art. <b>2.2</b>. Son contratos <b>subvencionados sujetos a regulación armonizada</b> los de <b>obras</b> y de <b>servicios</b> subvencionados <b>de forma directa y en más del 50 %</b> por un <b>poder adjudicador</b>, cuando encajen en las categorías del art. <b>23</b>.</p>\n<ul>\n<li>La asociación <b>no</b> pertenece al sector público, pero el contrato sí queda sujeto.</li>\n<li>La construcción de un <b>centro deportivo</b> figura expresamente en el art. 23.1.a), con umbral de <b>5.404.000 €</b>: los 6 M€ lo superan.</li>\n<li>Si el porcentaje fuera del <b>50 % exacto</b>, no bastaría: la ley exige <b>más</b> del 50 %.</li>\n</ul>\n\n<h3 style=\"font-size:1.02rem;margin-top:1rem\">f) Nombramiento de un funcionario y contratación de un peón laboral</h3>\n<p><b>Fuera</b>, art. <b>11.1</b>: la relación de servicio de los funcionarios públicos y los contratos regulados en la legislación laboral están excluidos.</p>\n\n<div class=\"box ej\"><span class=\"lbl\">La regla que se extrae</span>El tema 9 no se estudia memorizando listas, sino aplicando <b>tres filtros en cadena</b>: <b>¿oneroso?</b> (art. 2) → <b>¿quién contrata?</b> (art. 3) → <b>¿está excluido?</b> (arts. 4 a 11). Y cuando la respuesta es «dentro», queda una cuarta pregunta que ya es el tema 10: <b>¿en qué círculo?</b></div>\n</section>\n\n<section class=\"card\" id=\"caso2\"><h2>Caso práctico integral 2 · El mismo contrato, tres entidades, tres regímenes</h2>\n<div class=\"box warn\"><span class=\"lbl\">Advertencia</span>Supuesto <b>ficticio</b> construido sobre los preceptos reales de la Ley 9/2017.</div>\n<p><b>El escenario.</b> Exactamente el mismo objeto —<b>servicio de conserjería y control de accesos, 85.000 € al año</b>— se va a contratar por tres entidades distintas del mismo municipio. El objeto no cambia; el régimen, sí. Este caso demuestra por qué el art. 3 es el artículo más importante del tema.</p>\n\n<h3 style=\"font-size:1.02rem;margin-top:1rem\">Entidad 1 · El Ayuntamiento de Vilaverde</h3>\n<table><thead><tr><th>Pregunta</th><th>Respuesta</th><th>Artículo</th></tr></thead><tbody>\n<tr><td>¿Sector público?</td><td>Sí, entidad local</td><td>3.1.a)</td></tr>\n<tr><td>¿Poder adjudicador?</td><td>Sí: toda Administración Pública lo es</td><td>3.3.a)</td></tr>\n<tr><td>¿Administración Pública?</td><td><b>Sí</b></td><td>3.2.a)</td></tr>\n<tr><td>Naturaleza del contrato</td><td><b>Administrativo</b> (contrato de servicios del art. 17)</td><td>25.1.a)</td></tr>\n<tr><td>Jurisdicción</td><td><b>Contencioso-administrativa</b> en todo el ciclo: preparación, adjudicación, efectos, modificación y extinción</td><td>27.1.a)</td></tr>\n</tbody></table>\n\n<h3 style=\"font-size:1.02rem;margin-top:1rem\">Entidad 2 · La Fundación Municipal de Cultura</h3>\n<table><thead><tr><th>Pregunta</th><th>Respuesta</th><th>Artículo</th></tr></thead><tbody>\n<tr><td>¿Sector público?</td><td>Sí: es una <b>fundación pública</b></td><td>3.1.e)</td></tr>\n<tr><td>¿Poder adjudicador?</td><td><b>Sí</b>, por mención expresa de la ley</td><td>3.3.b)</td></tr>\n<tr><td>¿Administración Pública?</td><td><b>No</b>: las fundaciones públicas no figuran en el art. 3.2</td><td>3.2</td></tr>\n<tr><td>Naturaleza del contrato</td><td><b>Privado</b>: lo celebra un poder adjudicador que no es Administración Pública</td><td>26.1.b)</td></tr>\n<tr><td>Jurisdicción</td><td><b>Contencioso-administrativa</b> para preparación y adjudicación; <b>civil</b> para efectos y extinción</td><td>27.1.b) y 27.2</td></tr>\n</tbody></table>\n<div class=\"box exc\"><span class=\"lbl\">La confusión más cara del tema</span>Una fundación pública <b>siempre</b> es poder adjudicador y <b>nunca</b> es Administración Pública. Lo mismo ocurre con las <b>Mutuas colaboradoras con la Seguridad Social</b> (art. 3.3.c). Si en una pregunta aparece «fundación pública» junto a «contrato administrativo», la respuesta es falsa.</div>\n\n<h3 style=\"font-size:1.02rem;margin-top:1rem\">Entidad 3 · Aguas de Vilaverde, S.A.</h3>\n<table><thead><tr><th>Pregunta</th><th>Respuesta</th><th>Artículo</th></tr></thead><tbody>\n<tr><td>¿Sector público?</td><td>Sí: sociedad mercantil con capital mayoritariamente público</td><td>3.1.h)</td></tr>\n<tr><td>¿Poder adjudicador?</td><td><b>Depende</b>: hay que aplicar los criterios del art. 3.3.d)</td><td>3.3.d)</td></tr>\n<tr><td>¿Administración Pública?</td><td><b>Nunca</b></td><td>3.2</td></tr>\n<tr><td>Naturaleza del contrato</td><td><b>Privado</b>, con más o menos intensidad según sea o no poder adjudicador</td><td>26.1.b) o 26.1.c)</td></tr>\n</tbody></table>\n<details class=\"panel\"><summary>¿Cómo se decide si esa sociedad es poder adjudicador?</summary><div class=\"body\"><p>El art. <b>3.3.d)</b> impone dos condiciones acumulativas:</p><ol><li>Haber sido <b>creada específicamente para satisfacer necesidades de interés general que no tengan carácter industrial o mercantil</b>. Una sociedad que factura a los usuarios en régimen de mercado y compite tendría carácter mercantil; una creada para prestar el servicio con financiación municipal, no.</li><li>Que uno o varios poderes adjudicadores <b>financien mayoritariamente</b> su actividad, <b>controlen</b> su gestión o <b>nombren</b> a más de la mitad de los miembros de su órgano de administración, dirección o vigilancia. Son criterios <b>alternativos</b>: basta uno.</li></ol><p>La misma sociedad puede cambiar de calificación si cambia su modelo de financiación. Por eso el art. 3.3.d) se pregunta tanto: obliga a razonar, no a memorizar.</p></div></details>\n\n<h3 style=\"font-size:1.02rem;margin-top:1rem\">El cuadro comparativo, que es lo que hay que llevar en la cabeza</h3>\n<table><thead><tr><th></th><th>Ayuntamiento</th><th>Fundación municipal</th><th>Sociedad municipal</th></tr></thead><tbody>\n<tr><th>Sector público</th><td>Sí (3.1.a)</td><td>Sí (3.1.e)</td><td>Sí (3.1.h)</td></tr>\n<tr><th>Poder adjudicador</th><td>Sí (3.3.a)</td><td>Sí (3.3.b)</td><td>Depende (3.3.d)</td></tr>\n<tr><th>Administración Pública</th><td><b>Sí</b> (3.2)</td><td>No</td><td>No</td></tr>\n<tr><th>Contrato</th><td><b>Administrativo</b></td><td>Privado</td><td>Privado</td></tr>\n<tr><th>Jurisdicción</th><td>Contenciosa siempre</td><td>Mixta</td><td>Mixta o civil</td></tr>\n</tbody></table>\n<div class=\"box ej\"><span class=\"lbl\">Y una vuelta de tuerca</span>Si el contrato de conserjería del Ayuntamiento alcanzara los <b>216.000 €</b> de valor estimado, sería además <b>SARA</b> (art. 22.1.b): la respuesta a «¿en qué círculo?» y la respuesta a «¿supera el umbral?» son <b>independientes</b> y se acumulan. Eso ya es tema 10.</div>\n</section>\n\n<section class=\"card\" id=\"conexiones\"><h2>Diez preguntas de conexión</h2>\n<p class=\"small\">Responde en voz alta antes de desplegar. No preguntan por un artículo, sino por la relación entre dos.</p>\n<div id=\"qbox\"></div></section>\n<section class=\"card\" id=\"semaforo9\"><h2>Semáforo de la visión de conjunto</h2>\n<p class=\"small\">Marca cada conexión, no cada artículo.</p>\n<div id=\"sembox\"></div><div id=\"semres\" style=\"margin-top:.8rem\"></div></section>\n";
</script>

<script>

/* ═══ Mejoras de interacción · Bloque II ═══ */
(function(){
"use strict";
var K_THEME="oposi_bII_theme", K_FS="oposi_bII_fs", K_STREAK="oposi_bII_streak";
function load(k,f){try{var v=localStorage.getItem(k);return v?JSON.parse(v):f;}catch(e){return f;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
var root=document.documentElement;

/* Tema persistente (sobrescribe el toggle simple anterior) */
var saved=load(K_THEME,null);
if(saved){root.setAttribute("data-theme",saved);}
else if(window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches){root.setAttribute("data-theme","dark");}
var bt=document.getElementById("theme");
if(bt)bt.onclick=function(){
  var n=root.getAttribute("data-theme")==="dark"?"light":"dark";
  root.setAttribute("data-theme",n);save(K_THEME,n);
};

/* Tamaño de texto persistente */
var fs=load(K_FS,16);
function setFs(v){fs=Math.max(13,Math.min(22,v));root.style.setProperty("--fs",fs+"px");save(K_FS,fs);}
setFs(fs);
var bp=document.getElementById("fs+"),bm=document.getElementById("fs-");
if(bp)bp.onclick=function(){setFs(fs+1);};
if(bm)bm.onclick=function(){setFs(fs-1);};

/* Racha compartida con el índice */
(function(){
  var el=document.getElementById("streakN");if(!el)return;
  var hoy=new Date().toISOString().slice(0,10);
  var s=load(K_STREAK,{last:null,n:0});
  if(s.last!==hoy){
    var ayer=new Date(Date.now()-864e5).toISOString().slice(0,10);
    s.n=(s.last===ayer)?s.n+1:1;s.last=hoy;save(K_STREAK,s);
  }
  el.textContent=s.n;
})();

/* Reveal on scroll para las tarjetas */
function reveal(){
  var els=document.querySelectorAll("section.card:not(.rv)");
  if(!els.length)return;
  if(!("IntersectionObserver" in window)){return;}
  var io=new IntersectionObserver(function(es){
    es.forEach(function(en){if(en.isIntersecting){en.target.classList.add("in");io.unobserve(en.target);}});
  },{threshold:.06,rootMargin:"0px 0px -30px 0px"});
  Array.prototype.forEach.call(els,function(el){el.classList.add("rv");io.observe(el);});
}

/* Sección activa en el índice lateral */
function spy(){
  var links=document.querySelectorAll("nav.side a[href^='#']");
  if(!links.length||!("IntersectionObserver" in window))return;
  var map={};
  Array.prototype.forEach.call(links,function(a){
    var t=document.getElementById(a.getAttribute("href").slice(1));
    if(t)map[t.id]=a;
  });
  var io=new IntersectionObserver(function(es){
    es.forEach(function(en){
      if(en.isIntersecting){
        Array.prototype.forEach.call(links,function(a){a.classList.remove("on");});
        if(map[en.target.id])map[en.target.id].classList.add("on");
      }
    });
  },{rootMargin:"-80px 0px -70% 0px",threshold:0});
  Object.keys(map).forEach(function(id){io.observe(document.getElementById(id));});
}

/* Ripple en botones */
document.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b||b.classList.contains("navtoggle"))return;
  var r=b.getBoundingClientRect(),d=Math.max(r.width,r.height),s=document.createElement("span");
  s.className="ripple";s.style.width=s.style.height=d+"px";
  s.style.left=(e.clientX-r.left-d/2)+"px";s.style.top=(e.clientY-r.top-d/2)+"px";
  b.appendChild(s);setTimeout(function(){if(s.parentNode)s.parentNode.removeChild(s);},560);
});

/* Atajos de teclado */
document.addEventListener("keydown",function(e){
  if(e.target.matches("input,textarea"))return;

});

if(document.getElementById("main")&&document.getElementById("main").children.length){init();}
else{setTimeout(init,60);}
addEventListener("load",function(){setTimeout(init,80);});
})();


</script>
<script>


/* ═══ Parser de respuestas: estructura semántica ═══ */
var FCFMT=(function(){
  var CITA=/\s*\(((?:arts?\.|DA\b|DT\b|disp\.)[^)]*)\)\s*\.?\s*$/i;
  var strip=function(h){return h.replace(/<[^>]+>/g,"");};

  function esc(s){return s;}

  function parse(raw){
    var out={verdict:null,cite:null,kind:"p",items:[],text:""};
    var body=String(raw).trim();

    /* 1 ── Cita legal al final */
    var m=body.match(CITA);
    if(m){out.cite=m[1].replace(/\s+/g," ").trim();body=body.slice(0,m.index).trim();}
    body=body.replace(/[.;,\s]+$/,"");

    /* 2 ── Veredicto Sí / No inicial */
    var v=strip(body).match(/^(Sí|Sí,|No|No,)[.:,]?\s/);
    if(v){
      out.verdict=/^Sí/.test(v[1])?"si":"no";
      body=body.replace(/^(<[^>]+>\s*)*(Sí|No)[.,:]?\s*/,"").trim();
      body=body.replace(/^en\s/,"En ");
    }

    /* 3 ── Enumeración con · */
    var parts=body.split(/\s+·\s+/);
    if(parts.length>=2){
      out.kind="list";
      var letras=parts.filter(function(p){return /^\s*<?[a-h]\)/.test(strip(p));}).length;
      out.marker = letras>=parts.length-1 ? "alpha" : "num";
      out.items=parts.map(function(p){
        return p.replace(/^\s*[a-h]\)\s*/,"").replace(/[.\s]+$/,"").trim();
      }).filter(Boolean);
      return out;
    }

    /* 4 ── Cláusulas contrapuestas con ; */
    var semi=body.split(/;\s+/);
    if(semi.length>=2&&semi.length<=3&&semi.every(function(s){return strip(s).length>14;})){
      out.kind="clauses";
      out.items=semi.map(function(s){return s.replace(/[.\s]+$/,"").trim();});
      return out;
    }

    /* 5 ── Párrafo */
    out.text=body;
    return out;
  }

  function render(raw){
    var d=parse(raw),h="";

    if(d.verdict){
      h+='<span class="fc-verdict '+d.verdict+'">'+(d.verdict==="si"?"✓ Sí":"✗ No")+'</span>';
    }

    if(d.kind==="list"){
      h+='<ol class="fc-list '+d.marker+'">';
      d.items.forEach(function(it){h+='<li>'+it+'</li>';});
      h+='</ol>';
    }else if(d.kind==="clauses"){
      h+='<div class="fc-clauses">';
      d.items.forEach(function(it){h+='<p>'+it+'</p>';});
      h+='</div>';
    }else if(d.text){
      h+='<p class="fc-p">'+d.text+'</p>';
    }

    if(d.cite){
      h+='<span class="fc-cite"><span class="s">§</span>'+d.cite+'</span>';
    }
    return {html:h,struct:(d.kind!=="p"||!!d.verdict||strip(raw).length>150)};
  }
  return {parse:parse,render:render};
})();

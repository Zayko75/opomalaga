ARTS.push(
{n:169,t:"Publicidad, aprobación definitiva y entrada en vigor",ubic:"Título VI ▸ Cap. I ▸ Sección 1.ª",
idea:"Quince días al público, un mes para resolver quejas, definitivo antes del 31 de diciembre.",
literal:`<p>1. Aprobado inicialmente el presupuesto general, se expondrá al público, previo anuncio en el boletín oficial de la provincia o, en su caso, de la comunidad autónoma uniprovincial, por 15 días, durante los cuales los interesados podrán examinarlos y presentar reclamaciones ante el Pleno. El presupuesto se considerará definitivamente aprobado si durante el citado plazo no se hubiesen presentado reclamaciones; en caso contrario, el Pleno dispondrá de un plazo de un mes para resolverlas.</p>
<p>2. La aprobación definitiva del presupuesto general por el Pleno de la corporación habrá de realizarse antes del día 31 de diciembre del año anterior al del ejercicio en que deba aplicarse.</p>
<p>3. El presupuesto general, definitivamente aprobado, será insertado en el boletín oficial de la corporación, si lo tuviera, y, resumido por capítulos de cada uno de los presupuestos que lo integran, en el de la provincia o, en su caso, de la comunidad autónoma uniprovincial.</p>
<p>4. Del presupuesto general definitivamente aprobado se remitirá copia a la Administración del Estado y a la correspondiente comunidad autónoma. La remisión se realizará simultáneamente al envío al boletín oficial a que se refiere el apartado anterior.</p>
<p>5. El presupuesto entrará en vigor, en el ejercicio correspondiente, una vez publicado en la forma prevista en el apartado 3 de este artículo.</p>
<p>6. Si al iniciarse el ejercicio económico no hubiese entrado en vigor el presupuesto correspondiente, se considerará automáticamente prorrogado el del anterior, con sus créditos iniciales, sin perjuicio de las modificaciones que se realicen conforme a lo dispuesto en los artículos 177, 178 y 179 de esta ley y hasta la entrada en vigor del nuevo presupuesto. La prórroga no afectará a los créditos para servicios o programas que deban concluir en el ejercicio anterior o que estén financiados con crédito u otros ingresos específicos o afectados.</p>
<p>7. La copia del presupuesto y de sus modificaciones deberá hallarse a disposición del público, a efectos informativos, desde su aprobación definitiva hasta la finalización del ejercicio.</p>`,
dis:`<table><thead><tr><th>Apartado</th><th>Trámite</th><th>Plazo / dato clave</th></tr></thead><tbody>
<tr><td>169.1</td><td>Anuncio en el <span class="t" data-k="bop">BOP</span> y exposición al público</td><td><b>15 días</b></td></tr>
<tr><td>169.1</td><td>Si no hay reclamaciones</td><td>Aprobación definitiva <b>automática</b></td></tr>
<tr><td>169.1</td><td>Si hay reclamaciones: el Pleno las resuelve</td><td><b>Un mes</b></td></tr>
<tr><td>169.2</td><td>Aprobación definitiva por el Pleno</td><td>Antes del <b>31 de diciembre</b> del año anterior</td></tr>
<tr><td>169.3</td><td>Publicación: íntegra en el boletín de la corporación (si lo hay) y <b>resumida por capítulos</b> en el BOP</td><td>—</td></tr>
<tr><td>169.4</td><td>Copia al Estado y a la CCAA</td><td><b>Simultánea</b> al envío al boletín</td></tr>
<tr><td>169.5</td><td>Entrada en vigor</td><td>Una vez <b>publicado</b> conforme al 169.3</td></tr>
<tr><td>169.6</td><td><span class="t" data-k="prorroga">Prórroga automática</span></td><td>Con los <b>créditos iniciales</b> del anterior</td></tr>
<tr><td>169.7</td><td>Copia a disposición del público</td><td>Desde la aprobación definitiva hasta el <b>fin del ejercicio</b></td></tr>
</tbody></table>
<p><b>Lo que NO se prorroga (169.6):</b> los créditos para servicios o programas que deban concluir en el ejercicio anterior, y los financiados con crédito u otros ingresos específicos o afectados.</p>`,
llano:`<p>Aprobado el borrador, se cuelga en el tablón durante quince días para que cualquiera pueda mirarlo y quejarse. Si nadie se queja, queda aprobado solo, sin necesidad de una segunda votación. Si alguien se queja, el Pleno tiene un mes para contestar. Todo eso tiene que estar cerrado antes de que acabe el año. Después se publica un resumen en el boletín provincial y, con esa publicación, el presupuesto empieza a valer. Si el 1 de enero no está listo, se prorroga automáticamente el del año pasado, pero solo con sus cifras de partida.</p>`,
porque:`<p>La exposición pública convierte el presupuesto en un acto <b>controlable por los vecinos</b>, no solo por la oposición. La aprobación definitiva automática cuando no hay reclamaciones evita paralizar la maquinaria por puro trámite. Y la prórroga es una <b>red de seguridad</b>: sin ella, un ayuntamiento sin presupuesto el 1 de enero no podría pagar ni las nóminas. Se prorrogan solo los créditos <i>iniciales</i> porque las modificaciones del año anterior respondían a necesidades ya agotadas.</p>`,
ej:`<ul>
<li><b>Cotidiano:</b> las normas de una comunidad de vecinos que se exponen en el portal antes de aplicarse: si nadie protesta en el plazo, quedan aprobadas.</li>
<li><b>Real:</b> el Ayuntamiento de La Rinconada aprueba inicialmente su presupuesto el 20 de octubre de 2026; el anuncio sale en el BOP de Sevilla el 26 de octubre; en el plazo de exposición una asociación de vecinos presenta una reclamación por omisión de crédito; el Pleno la resuelve el 24 de noviembre y aprueba definitivamente; el resumen por capítulos se publica el 15 de diciembre y ese día entra en vigor para 2027.</li>
<li><b>Caso límite:</b> el mismo ayuntamiento no logra aprobar definitivamente hasta el 20 de enero. Durante enero rige el presupuesto de 2026 <b>con sus créditos iniciales</b> — no con los aumentados por las modificaciones de 2026. Y una subvención finalista ya justificada no se prorroga.</li>
</ul>`,
noej:`<ul>
<li><b>No entra en vigor</b> con la aprobación definitiva, sino con la <b>publicación</b> del resumen (art. 169.5).</li>
<li><b>No se publica íntegro</b> en el BOP: se publica <b>resumido por capítulos</b>. Íntegro solo en el boletín de la propia corporación, si lo tiene.</li>
<li><b>No hay segunda votación</b> si no se presentaron reclamaciones: la aprobación definitiva es automática.</li>
<li><b>La prórroga no es una decisión:</b> opera "automáticamente", sin acuerdo que la declare.</li>
</ul>`,
conex:`<ul>
<li><b>Art. 170:</b> quién puede reclamar y por qué causas durante esos 15 días.</li>
<li><b>Art. 171:</b> qué recurso cabe una vez aprobado definitivamente.</li>
<li><b>Arts. 177, 178 y 179:</b> modificaciones de crédito que sí pueden hacerse durante la prórroga.</li>
<li><b>Art. 168.4:</b> el plazo del 15 de octubre existe justamente para que quepan estos 15 días y el mes de resolución antes del 31 de diciembre.</li>
</ul>`,
trampas:`<ul>
<li><b>15 días</b> de exposición ≠ <b>un mes</b> para resolver reclamaciones ≠ <b>31 de diciembre</b> para aprobar definitivamente. Los tres se mezclan sin piedad en los tests.</li>
<li>"Resumido <b>por capítulos</b>", no por artículos ni por conceptos.</li>
<li>La remisión al Estado y a la CCAA es <b>simultánea</b> al envío al boletín, no posterior a la publicación.</li>
<li>La prórroga es con los <b>créditos iniciales</b>; olvidar la palabra "iniciales" es el error clásico.</li>
<li>El apartado 7 habla de disposición del público "a efectos informativos" hasta la <b>finalización del ejercicio</b>, no hasta la aprobación del siguiente.</li>
</ul>
<div class="interp"><span class="lbl">Interpretación / contexto — aportación externa</span>La ley dice "por 15 días" sin precisar su naturaleza. La doctrina y la práctica administrativa mayoritarias los computan como <b>hábiles</b>, por aplicación supletoria de las reglas de cómputo de la legislación de procedimiento administrativo común (art. 30 de la Ley 39/2015), pero el texto del TRLHL no lo dice expresamente. Conviene comprobar cómo lo formula la convocatoria a la que te presentas.</div>`,
ancla:`<p><b>La escalera 15 · 1 · 31:</b> <b>15</b> días de exposición → <b>1</b> mes para resolver → <b>31</b> de diciembre, cierre.<br>
<b>Para la entrada en vigor:</b> "no vale con aprobarlo; hay que <b>publicarlo</b>". Imagina un semáforo que no se pone verde hasta que sale en el boletín.<br>
<b>Para la prórroga:</b> "vuelve el presupuesto viejo, pero <b>desnudo</b>" (sin las modificaciones).</p>`,

{n:170,t:"Reclamación administrativa: legitimación activa y causas",ubic:"Título VI ▸ Cap. I ▸ Sección 1.ª",
idea:"Solo ciertas personas y solo por tres motivos tasados puede reclamarse el presupuesto.",
literal:`<p>1. A los efectos de lo dispuesto en el apartado 1 del artículo anterior, tendrán la consideración de interesados:</p>
<p>a) Los habitantes en el territorio de la respectiva entidad local.</p>
<p>b) Los que resulten directamente afectados, aunque no habiten en el territorio de la entidad local.</p>
<p>c) Los colegios oficiales, cámaras oficiales, sindicatos, asociaciones y demás entidades legalmente constituidas para velar por intereses profesionales o económicos y vecinales, cuando actúen en defensa de los que les son propios.</p>
<p>2. Únicamente podrán entablarse reclamaciones contra el presupuesto:</p>
<p>a) Por no haberse ajustado su elaboración y aprobación a los trámites establecidos en esta ley.</p>
<p>b) Por omitir el crédito necesario para el cumplimiento de obligaciones exigibles a la entidad local, en virtud de precepto legal o de cualquier otro título legítimo.</p>
<p>c) Por ser de manifiesta insuficiencia los ingresos con relación a los gastos presupuestados o bien de estos respecto a las necesidades para las que esté previsto.</p>`,
dis:`<div class="grid2">
<div><p><b>¿Quién? — legitimación (170.1)</b></p><ul>
<li><b>a)</b> Los <b>habitantes</b> del territorio. Basta con habitar: no se exige ser vecino empadronado ni contribuyente.</li>
<li><b>b)</b> Los <b>directamente afectados</b>, aunque no habiten allí.</li>
<li><b>c)</b> Colegios oficiales, cámaras oficiales, sindicatos, asociaciones y demás entidades legalmente constituidas para velar por intereses <b>profesionales, económicos o vecinales</b>, cuando actúen <b>en defensa de los propios</b>.</li>
</ul></div>
<div><p><b>¿Por qué? — causas tasadas (170.2)</b></p><ul>
<li><b>a)</b> Defecto de <b>trámite</b>: la elaboración o aprobación no se ajustó a la ley.</li>
<li><b>b)</b> <b>Omisión de crédito</b> necesario para obligaciones exigibles por precepto legal o cualquier otro título legítimo.</li>
<li><b>c)</b> <b>Manifiesta insuficiencia</b>: de los ingresos respecto a los gastos, o de los gastos respecto a las necesidades previstas.</li>
</ul></div>
</div>
<p class="small">La palabra <b>"únicamente"</b> del apartado 2 es determinante: la lista es cerrada. Cualquier otro motivo (discrepancia política, prioridades distintas) no sostiene una reclamación.</p>`,
llano:`<p>No cualquiera puede quejarse, y no por cualquier cosa. Pueden quejarse los que viven allí, los que salen perjudicados aunque vivan fuera, y las organizaciones que defienden intereses del colectivo. Y solo por tres razones: que no se han cumplido los trámites, que falta dinero para algo que la ley obliga a pagar, o que las cuentas no cuadran de forma evidente. Que a uno no le guste en qué se gasta no es motivo.</p>`,
porque:`<p>Si cualquier discrepancia fuera reclamable, el presupuesto quedaría bloqueado cada año por motivos políticos y la ciudad se paralizaría. Al mismo tiempo, negar toda reclamación dejaría a los vecinos sin defensa frente a ilegalidades. La solución del legislador es una <b>legitimación amplia</b> (casi cualquier habitante) combinada con unas <b>causas estrechas y objetivas</b>: se controla la legalidad y la solvencia del documento, no su orientación política.</p>`,
ej:`<ul>
<li><b>Cotidiano:</b> reclamar una nota de un examen. Puedes hacerlo por error de suma o por criterio mal aplicado; no porque el temario te parezca injusto.</li>
<li><b>Real (causa b):</b> el presupuesto de 2026 de un ayuntamiento no consigna crédito para pagar una sentencia firme de 240.000 € por responsabilidad patrimonial. La empresa acreedora, aunque tenga domicilio en Madrid, es "directamente afectada" (170.1.b) y reclama por omisión de crédito necesario (170.2.b).</li>
<li><b>Real (causa a):</b> el presupuesto se expuso al público solo 8 días. Un vecino reclama por defecto de trámite (170.2.a).</li>
<li><b>Caso límite:</b> un sindicato reclama porque el anexo de personal no recoge plazas comprometidas en un acuerdo. Está legitimado por el 170.1.c) si actúa en defensa de intereses profesionales propios; el encaje será, según cómo se plantee, la letra a) o la b) del 170.2.</li>
</ul>`,
noej:`<ul>
<li><b>No es causa</b> considerar que se destina poco dinero a cultura y demasiado a fiestas: es una discrepancia de oportunidad, no de legalidad.</li>
<li><b>No está legitimada</b> una asociación que reclama sobre materias ajenas a sus fines: el art. 170.1.c) exige que actúe "en defensa de los que le son propios".</li>
<li><b>No hay que ser contribuyente ni estar empadronado</b>: la letra a) habla de "habitantes en el territorio".</li>
</ul>`,
conex:`<ul>
<li><b>Art. 169.1:</b> este artículo desarrolla quién puede presentar las reclamaciones de ese trámite.</li>
<li><b>Art. 165.4:</b> el "sin déficit inicial" es lo que se protege con la causa c).</li>
<li><b>Art. 173.5:</b> nulidad de los compromisos sin crédito — el otro lado de la causa b).</li>
<li><b>Art. 4 de la Ley 39/2015:</b> concepto general de interesado, que aquí se sustituye por una definición específica.</li>
</ul>`,
trampas:`<ul>
<li>La palabra <b>"únicamente"</b>: causas <b>tasadas</b>. Cualquier test que ofrezca "por cualquier motivo de legalidad" es falso.</li>
<li>Letra b) del apartado 1: "aunque <b>no</b> habiten en el territorio". Se cuela a menudo negado.</li>
<li>La causa c) tiene <b>dos direcciones</b>: ingresos insuficientes respecto a gastos, <b>y también</b> gastos insuficientes respecto a las necesidades previstas.</li>
<li>Las reclamaciones se presentan <b>ante el Pleno</b> (art. 169.1), no ante el presidente.</li>
</ul>`,
ancla:`<p><b>Quién — "HAC":</b> <b>H</b>abitantes · <b>A</b>fectados directos · <b>C</b>olectivos organizados.<br>
<b>Por qué — "TOM":</b> <b>T</b>rámites incumplidos · <b>O</b>misión de crédito · <b>M</b>anifiesta insuficiencia.<br>
Imagen: un vecino llamado <b>Tom</b> que solo puede quejarse tres veces al año.</p>`,

{n:171,t:"Recurso contencioso-administrativo",ubic:"Título VI ▸ Cap. I ▸ Sección 1.ª",
idea:"Contra el presupuesto definitivo se va directo al juez, y el recurso no lo paraliza.",
literal:`<p>1. Contra la aprobación definitiva del presupuesto podrá interponerse directamente recurso contencioso-administrativo, en la forma y plazos que establecen las normas de dicha jurisdicción.</p>
<p>2. El Tribunal de Cuentas deberá informar previamente a la resolución del recurso cuando la impugnación afecte o se refiera a la nivelación presupuestaria.</p>
<p>3. La interposición de recursos no suspenderá por sí sola la aplicación del presupuesto definitivamente aprobado por la corporación.</p>`,
dis:`<ul>
<li><b>Objeto del recurso:</b> la <b>aprobación definitiva</b> del presupuesto.</li>
<li><b>Vía:</b> <span class="t" data-k="conten">contencioso-administrativa</span>, <b>directamente</b> — sin recurso administrativo previo (el presupuesto tiene naturaleza de disposición general).</li>
<li><b>Forma y plazos:</b> los de la jurisdicción contencioso-administrativa (remisión externa; el TRLHL no fija plazo propio).</li>
<li><b>Informe del <span class="t" data-k="tcuentas">Tribunal de Cuentas</span>:</b> preceptivo y <b>previo a la resolución del recurso</b>, solo cuando la impugnación afecte a la <span class="t" data-k="nivelacion">nivelación presupuestaria</span>.</li>
<li><b>Efecto:</b> la interposición <b>no suspende</b> por sí sola la aplicación del presupuesto.</li>
</ul>`,
llano:`<p>Si el presupuesto ya está definitivamente aprobado y sigues sin estar conforme, no hay más escalones dentro del Ayuntamiento: vas al juzgado. Mientras el juez decide, el presupuesto sigue funcionando: el Ayuntamiento no se para. Y si lo que discutes es que las cuentas no cuadran, antes de que el juez resuelva tiene que hablar el Tribunal de Cuentas.</p>`,
porque:`<p>El presupuesto es un instrumento vital: si un solo recurso pudiera suspenderlo, bastaría con impugnar cada diciembre para dejar sin actividad al municipio. De ahí la regla de <b>no suspensión automática</b>. Y como los jueces no son auditores, cuando el debate es técnico-contable (la nivelación) la ley les da un peritaje institucional: el informe del Tribunal de Cuentas.</p>`,
ej:`<ul>
<li><b>Cotidiano:</b> recurrir una multa de tráfico no impide que el plazo de pago siga corriendo: recurrir no es lo mismo que paralizar.</li>
<li><b>Real:</b> resuelta su reclamación en sentido desestimatorio, una asociación de comerciantes interpone recurso contencioso-administrativo contra la aprobación definitiva del presupuesto 2026 de un ayuntamiento sevillano. El Ayuntamiento sigue ejecutando el presupuesto con normalidad mientras el juzgado tramita el asunto.</li>
<li><b>Caso límite:</b> el recurso alega que los ingresos previstos por venta de suelo (3 M€) son ficticios y rompen la nivelación. Antes de resolver, el juzgado debe recabar informe del Tribunal de Cuentas (art. 171.2).</li>
</ul>`,
noej:`<ul>
<li><b>No cabe</b> recurso de reposición previo: la vía es directa. (El presupuesto se considera disposición de carácter general.)</li>
<li><b>No suspende</b> el presupuesto la mera interposición; otra cosa es que el órgano judicial acuerde una medida cautelar, que ya no es "por sí sola".</li>
<li><b>No interviene</b> el Tribunal de Cuentas en cualquier recurso: solo si se discute la nivelación.</li>
</ul>`,
conex:`<ul>
<li><b>Art. 169.2:</b> el acto recurrible es la aprobación definitiva regulada allí.</li>
<li><b>Art. 170.2.c):</b> la insuficiencia de ingresos, que es exactamente el terreno de la nivelación del 171.2.</li>
<li><b>Art. 165.4:</b> el mandato de aprobar sin déficit inicial que se está fiscalizando.</li>
</ul>`,
trampas:`<ul>
<li>"<b>Directamente</b>": nada de recurso administrativo previo.</li>
<li>El informe del Tribunal de Cuentas es <b>previo a la resolución del recurso</b>, no previo a su interposición ni previo a la aprobación del presupuesto.</li>
<li>"No suspenderá <b>por sí sola</b>": la matización deja abierta la suspensión judicial acordada expresamente.</li>
<li>Los plazos no están en el TRLHL: remite a las normas de la jurisdicción contencioso-administrativa.</li>
</ul>`,
ancla:`<p><b>"Directo, no para, y si es de cuadrar, el Tribunal ha de hablar."</b><br>Tres apartados, tres ideas: <b>1</b> directo · <b>2</b> Tribunal de Cuentas si hay nivelación · <b>3</b> no suspende.</p>`,

  if(s.last!==hoy){
    var ayer=new Date(Date.now()-864e5).toISOString().slice(0,10);
    s.n=(s.last===ayer)?s.n+1:1;s.last=hoy;save(K_STREAK,s);
  }
  el.textContent=s.n;
})();

/* Reveal on scroll para las tarjetas */
function reveal(){
  var els=document.querySelectorAll("section.card:not(.rv)");
  if(!els.length)return;
  if(!("IntersectionObserver" in window)){return;}
  var io=new IntersectionObserver(function(es){
    es.forEach(function(en){if(en.isIntersecting){en.target.classList.add("in");io.unobserve(en.target);}});
  },{threshold:.06,rootMargin:"0px 0px -30px 0px"});
  Array.prototype.forEach.call(els,function(el){el.classList.add("rv");io.observe(el);});
}

/* Sección activa en el índice lateral */
function spy(){
  var links=document.querySelectorAll("nav.side a[href^='#']");
  if(!links.length||!("IntersectionObserver" in window))return;
  var map={};
  Array.prototype.forEach.call(links,function(a){
    var t=document.getElementById(a.getAttribute("href").slice(1));
    if(t)map[t.id]=a;
  });
  var io=new IntersectionObserver(function(es){
    es.forEach(function(en){
      if(en.isIntersecting){
        Array.prototype.forEach.call(links,function(a){a.classList.remove("on");});
        if(map[en.target.id])map[en.target.id].classList.add("on");
      }
    });
  },{rootMargin:"-80px 0px -70% 0px",threshold:0});
  Object.keys(map).forEach(function(id){io.observe(document.getElementById(id));});
}

/* Ripple en botones */
document.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b||b.classList.contains("navtoggle"))return;
  var r=b.getBoundingClientRect(),d=Math.max(r.width,r.height),s=document.createElement("span");
  s.className="ripple";s.style.width=s.style.height=d+"px";
  s.style.left=(e.clientX-r.left-d/2)+"px";s.style.top=(e.clientY-r.top-d/2)+"px";
  b.appendChild(s);setTimeout(function(){if(s.parentNode)s.parentNode.removeChild(s);},560);
});

/* Atajos de teclado */
document.addEventListener("keydown",function(e){
  if(e.target.matches("input,textarea"))return;
  if(e.key==="/"){var q=document.getElementById("q");if(q){e.preventDefault();q.focus();}}
  if(e.key==="t"&&bt)bt.click();
});

/* El contenido se inyecta por JS: esperamos a que exista */
function init(){reveal();spy();}
if(document.getElementById("main")&&document.getElementById("main").children.length){init();}
else{setTimeout(init,60);}
addEventListener("load",function(){setTimeout(init,80);});
})();

</script>
<script>

/* ═══ Parser de respuestas: estructura semántica ═══ */
var FCFMT=(function(){
  var CITA=/\s*\(((?:arts?\.|DA\b|DT\b|disp\.)[^)]*)\)\s*\.?\s*$/i;
  var strip=function(h){return h.replace(/<[^>]+>/g,"");};

  function esc(s){return s;}

  function parse(raw){
    var out={verdict:null,cite:null,kind:"p",items:[],text:""};
    var body=String(raw).trim();

    /* 1 ── Cita legal al final */
    var m=body.match(CITA);
    if(m){out.cite=m[1].replace(/\s+/g," ").trim();body=body.slice(0,m.index).trim();}
    body=body.replace(/[.;,\s]+$/,"");

    /* 2 ── Veredicto Sí / No inicial */
    var v=strip(body).match(/^(Sí|Sí,|No|No,)[.:,]?\s/);
    if(v){
      out.verdict=/^Sí/.test(v[1])?"si":"no";
      body=body.replace(/^(<[^>]+>\s*)*(Sí|No)[.,:]?\s*/,"").trim();
      body=body.replace(/^en\s/,"En ");
    }

    /* 3 ── Enumeración con · */
    var parts=body.split(/\s+·\s+/);
    if(parts.length>=2){
      out.kind="list";
      var letras=parts.filter(function(p){return /^\s*<?[a-h]\)/.test(strip(p));}).length;
      out.marker = letras>=parts.length-1 ? "alpha" : "num";
      out.items=parts.map(function(p){
        return p.replace(/^\s*[a-h]\)\s*/,"").replace(/[.\s]+$/,"").trim();
      }).filter(Boolean);
      return out;
    }

    /* 4 ── Cláusulas contrapuestas con ; */
    var semi=body.split(/;\s+/);
    if(semi.length>=2&&semi.length<=3&&semi.every(function(s){return strip(s).length>14;})){
      out.kind="clauses";
      out.items=semi.map(function(s){return s.replace(/[.\s]+$/,"").trim();});
      return out;
    }

    /* 5 ── Párrafo */
    out.text=body;
    return out;
  }

  function render(raw){
    var d=parse(raw),h="";

    if(d.verdict){
      h+='<span class="fc-verdict '+d.verdict+'">'+(d.verdict==="si"?"✓ Sí":"✗ No")+'</span>';
    }

    if(d.kind==="list"){
      h+='<ol class="fc-list '+d.marker+'">';
      d.items.forEach(function(it){h+='<li>'+it+'</li>';});
      h+='</ol>';
    }else if(d.kind==="clauses"){
      h+='<div class="fc-clauses">';
      d.items.forEach(function(it){h+='<p>'+it+'</p>';});
      h+='</div>';
    }else if(d.text){
      h+='<p class="fc-p">'+d.text+'</p>';
    }

    if(d.cite){
      h+='<span class="fc-cite"><span class="s">§</span>'+d.cite+'</span>';
    }
    return {html:h,struct:(d.kind!=="p"||!!d.verdict||strip(raw).length>150)};
  }
  return {parse:parse,render:render};
})();

/* ═══ FLASHCARDS 3D ═══ */
(function(){
"use strict";
function boot(){
  var sec=document.getElementById("flash");
  if(!sec||sec.dataset.fc3d)return false;
  if(typeof FLASH==="undefined"||!FLASH||!FLASH.length)return false;
  sec.dataset.fc3d="1";

  var CARDS=FLASH, N=CARDS.length;
  var order,fi,ok,ko,back,busy;

  /* — Estructura — */
  var h2=sec.querySelector("h2");
  sec.innerHTML="";
  if(h2)sec.appendChild(h2);
  var intro=document.createElement("p");
  intro.className="small";
  intro.innerHTML="Piensa la respuesta <b>antes</b> de girar: el esfuerzo de recuperarla es lo que la fija. "
    +'<span class="fc-hint" style="position:static;display:inline;color:inherit">'
    +'<span class="kbd">espacio</span> girar · <span class="kbd">→</span> lo sabía · <span class="kbd">←</span> repasar</span>';
  sec.appendChild(intro);

  var stage=document.createElement("div");
  stage.className="fc-stage";
  stage.innerHTML=
    '<div class="fc-deck" id="fcdeck">'
    +'<span class="fc-ghost g2"></span><span class="fc-ghost g1"></span>'
    +'<div class="fc-lift" id="fclift">'
      +'<div class="fc-card" id="fcbox" tabindex="0" role="button" aria-label="Tarjeta. Pulsa para girar">'
        +'<div class="fc-face fc-front">'
          +'<span class="fc-tag">Pregunta</span><span class="fc-pip tr"></span><span class="fc-pip bl"></span>'
          +'<div class="fc-txt"></div>'
          +'<span class="fc-hint">Pulsa para girar</span>'
        +'</div>'
        +'<div class="fc-face fc-back">'
          +'<span class="fc-tag">Respuesta</span><span class="fc-pip tr"></span><span class="fc-pip bl"></span>'
          +'<div class="fc-txt"></div>'
          +'<span class="fc-hint">¿La sabías?</span>'
        +'</div>'
      +'</div>'
    +'</div></div>';
  sec.appendChild(stage);

  var bar=document.createElement("div");
  bar.className="fc-bar";bar.innerHTML="<i></i>";
  sec.appendChild(bar);

  var ctr=document.createElement("div");
  ctr.className="fc-ctrls noprint";
  ctr.innerHTML='<button id="fcflip">⟲ Girar</button>'
    +'<button id="fcok">✔ Lo sabía</button>'
    +'<button id="fcko">↻ Repasar</button>'
    +'<button id="fcreset">Reiniciar</button>'
    +'<span class="fc-score">'
      +'<span class="fc-pill ok" id="fcpok">0 sabidas</span>'
      +'<span class="fc-pill ko" id="fcpko">0 repasar</span>'
      +'<span class="fc-pill left" id="fccount">0</span>'
    +'</span>';
  sec.appendChild(ctr);

  var deck=stage.querySelector("#fcdeck"), lift=stage.querySelector("#fclift"),
      card=stage.querySelector("#fcbox"),
      front=stage.querySelector(".fc-front"), backf=stage.querySelector(".fc-back"),
      fill=bar.querySelector("i"),
      pok=ctr.querySelector("#fcpok"), pko=ctr.querySelector("#fcpko"),
      pleft=ctr.querySelector("#fccount");
  var rot=0;

  function reset(){
    order=CARDS.map(function(_,i){return i;});
    fi=0;ok=0;ko=0;back=false;busy=false;rot=0;
    card.style.transition="none";card.style.transform="rotateY(0deg)";
    void card.offsetWidth;card.style.transition="";
    deck.classList.remove("empty");
    var d=stage.querySelector(".fc-done");if(d)d.remove();
    card.style.display="";
    draw();
  }

  function bump(el){el.classList.remove("bump");void el.offsetWidth;el.classList.add("bump");}

  function draw(){
    pok.textContent=ok+(ok===1?" sabida":" sabidas");
    pko.textContent=ko+" repasar";
    var done=N-order.length;
    fill.style.width=(N?done/N*100:0)+"%";

    if(!order.length){
      pleft.textContent="0 quedan";
      deck.classList.add("empty");
      card.style.display="none";
      if(!stage.querySelector(".fc-done")){
        var d=document.createElement("div");
        d.className="fc-done";
        d.innerHTML='<span class="seal">🏆</span><h3>Ronda completada</h3>'
          +'<p>'+ok+' de '+N+' a la primera'+(ko?' · '+ko+' necesitaron repaso':'')+'</p>';
        deck.appendChild(d);
      }
      return;
    }
    if(fi>=order.length)fi=0;
    pleft.textContent=order.length+(order.length===1?" queda":" quedan");

    var c=CARDS[order[fi]];
    front.querySelector(".fc-txt").innerHTML='<p class="fc-p">'+c[0]+'</p>';
    var r=FCFMT.render(c[1]);
    backf.querySelector(".fc-txt").innerHTML=r.html;
    backf.classList.toggle("struct",r.struct);
    var hint=backf.querySelector(".fc-hint");
    if(hint)hint.classList.toggle("muted",/fc-cite/.test(r.html));
    var pip=(done+1)+"/"+N;
    Array.prototype.forEach.call(stage.querySelectorAll(".fc-pip"),function(p){p.textContent=pip;});
  }

  function flip(){
    if(busy||!order.length)return;
    back=!back;rot+=180;
    card.style.transform="rotateY("+rot+"deg)";
    card.setAttribute("aria-label",back?"Respuesta. Pulsa para volver":"Pregunta. Pulsa para girar");
    lift.classList.remove("lift");void lift.offsetWidth;lift.classList.add("lift");
  }

  function next(good){
    if(busy||!order.length)return;
    busy=true;
    if(good){ok++;bump(pok);}else{ko++;bump(pko);}
    lift.classList.remove("lift");
    lift.classList.add(good?"out-ok":"out-ko");
    setTimeout(function(){
      if(good){order.splice(fi,1);}
      else{var m=order.splice(fi,1)[0];order.push(m);}
      back=false;rot=0;
      card.style.transition="none";card.style.transform="rotateY(0deg)";
      void card.offsetWidth;card.style.transition="";
      draw();
      lift.classList.remove("out-ok","out-ko");
      lift.classList.add("in");
      setTimeout(function(){lift.classList.remove("in");busy=false;},480);
    },460);
  }

  card.onclick=flip;
  card.onkeydown=function(e){
    if(e.key===" "||e.key==="Enter"){e.preventDefault();flip();}
    if(e.key==="ArrowRight"){e.preventDefault();next(true);}
    if(e.key==="ArrowLeft"){e.preventDefault();next(false);}
  };
  ctr.querySelector("#fcflip").onclick=flip;
  ctr.querySelector("#fcok").onclick=function(){next(true);};
  ctr.querySelector("#fcko").onclick=function(){next(false);};
  ctr.querySelector("#fcreset").onclick=reset;

  /* Deslizar en táctil */
  var x0=null,y0=null;
  card.addEventListener("touchstart",function(e){x0=e.touches[0].clientX;y0=e.touches[0].clientY;},{passive:true});
  card.addEventListener("touchend",function(e){
    if(x0===null)return;
    var dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0;
    if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)){next(dx>0);}
    x0=y0=null;
  },{passive:true});

  /* Atajos globales cuando el mazo está a la vista */
  document.addEventListener("keydown",function(e){
    if(e.target.matches("input,textarea,select"))return;
    var r=stage.getBoundingClientRect();
    if(r.bottom<80||r.top>innerHeight-80)return;
    if(e.key===" "){e.preventDefault();flip();}
    else if(e.key==="ArrowRight"){e.preventDefault();next(true);}
    else if(e.key==="ArrowLeft"){e.preventDefault();next(false);}
  });

  reset();
  return true;
}
if(!boot()){
  var tries=0;
  var iv=setInterval(function(){if(boot()||++tries>40)clearInterval(iv);},120);
  addEventListener("load",function(){setTimeout(boot,100);});
}
})();

</script>

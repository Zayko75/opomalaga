<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>TRLHL · Arts. 162-171 · Contenido y aprobación del presupuesto</title>
<style>
/* ═══════════════════════════════════════════════════════════════
   SISTEMA DE DISEÑO · "Académico Gamificado" · Bloque II
   Temas 8, 9 y 10 · Auxiliar Administrativo
   ═══════════════════════════════════════════════════════════════ */
:root{
  --fs:16px;

  --bg:#faf9f7;
  --bg-grad:radial-gradient(1100px 560px at 12% -8%, #ede9ff 0%, transparent 55%),
            radial-gradient(850px 460px at 96% 0%, #dcf5ee 0%, transparent 50%);
  --surface:#ffffff;
  --surface-2:#f4f3f0;
  --surface-3:#eceae5;
  --line:#e6e3dc;
  --line-strong:#d4d0c7;

  --ink:#15161c;
  --ink-2:#5d616e;
  --ink-3:#8b8f9c;

  --brand:#5b3df5;
  --brand-2:#7c5cff;
  --brand-soft:#efeaff;
  --brand-ring:rgba(91,61,245,.18);

  --legal:#4338ca;  --legal-bg:#eeecff;
  --ej:#059669;     --ej-bg:#e4f7f0;
  --warn:#c2690a;   --warn-bg:#fdf1de;
  --exc:#dc2626;    --exc-bg:#ffeceb;

  --ok:#16a34a; --ok-soft:#e7f7ec;
  --mid:#eab308; --mid-soft:#fdf6dd;
  --off:#a1a1aa; --off-soft:#f1f1f3;

  --sh-1:0 1px 2px rgba(20,20,30,.04), 0 2px 8px rgba(20,20,30,.04);
  --sh-2:0 2px 6px rgba(20,20,30,.05), 0 12px 28px rgba(20,20,30,.07);
  --sh-3:0 8px 20px rgba(91,61,245,.13), 0 24px 56px rgba(20,20,30,.10);
  --sh-glow:0 0 0 4px var(--brand-ring);

  --r-sm:9px; --r-md:14px; --r-lg:20px; --r-full:999px;

  --f-display:"Segoe UI Variable Display",system-ui,-apple-system,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-legal:ui-serif,Georgia,Cambria,"Times New Roman",serif;
  --f-mono:ui-monospace,"SF Mono","Cascadia Mono","Segoe UI Mono",Menlo,monospace;

  --t-h1:clamp(1.02rem,.95rem + .3vw,1.2rem);
  --t-h2:clamp(1.2rem,1.05rem + .6vw,1.55rem);
  --t-h3:clamp(1rem,.95rem + .25vw,1.12rem);
  --t-sm:.86rem;
  --t-xs:.75rem;

  --e-out:cubic-bezier(.22,1,.36,1);
  --e-spring:cubic-bezier(.34,1.56,.64,1);

  /* ── Compatibilidad con SVG y contenido generado ── */
  --panel:var(--surface);
  --ink2:var(--ink-2);
  --acc:var(--brand);
  --acc-soft:var(--brand-soft);
  --g:var(--ok); --y:var(--mid); --r:var(--exc);
}

html[data-theme="dark"]{
  --bg:#0a0b0f;
  --bg-grad:radial-gradient(1100px 560px at 12% -8%, #1c1740 0%, transparent 55%),
            radial-gradient(850px 460px at 96% 0%, #08302b 0%, transparent 50%);
  --surface:#13151b;
  --surface-2:#1a1d25;
  --surface-3:#232733;
  --line:#262a34;
  --line-strong:#343947;

  --ink:#eceef4;
  --ink-2:#9ba2b3;
  --ink-3:#6e7585;

  --brand:#8b6dff;
  --brand-2:#a78bff;
  --brand-soft:#1e1a3d;
  --brand-ring:rgba(139,109,255,.22);

  --legal:#a5b4fc; --legal-bg:#191b3a;
  --ej:#34d399;    --ej-bg:#0c2a24;
  --warn:#fbbf24;  --warn-bg:#2e2110;
  --exc:#fb7185;   --exc-bg:#331119;

  --ok:#4ade80; --ok-soft:#0e2a19;
  --mid:#facc15; --mid-soft:#2c2610;
  --off:#5b6070; --off-soft:#1c1f27;

  --sh-1:0 1px 2px rgba(0,0,0,.3), 0 2px 8px rgba(0,0,0,.25);
  --sh-2:0 2px 6px rgba(0,0,0,.35), 0 12px 28px rgba(0,0,0,.4);
  --sh-3:0 8px 20px rgba(139,109,255,.2), 0 24px 56px rgba(0,0,0,.5);
}

*,*::before,*::after{box-sizing:border-box}
html{font-size:var(--fs);scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);background-image:var(--bg-grad);
  background-attachment:fixed;background-repeat:no-repeat;
  color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.68;
  -webkit-font-smoothing:antialiased;
  transition:background-color .5s var(--e-out),color .3s;
}
::selection{background:var(--brand);color:#fff}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{font-family:var(--f-display);letter-spacing:-.022em;line-height:1.2}
.num{font-variant-numeric:tabular-nums}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:99px;border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3)}

/* ═══ HEADER ═══ */
header.top{
  position:sticky;top:0;z-index:60;
  background:color-mix(in srgb,var(--surface) 80%,transparent);
  backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);
  border-bottom:1px solid var(--line);
}
.top-in{max-width:1280px;margin:0 auto;padding:.65rem 1.1rem;display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.brandwrap{display:flex;align-items:center;gap:.65rem;min-width:0;flex:1}
.mark{
  width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;
  font-weight:800;font-size:.8rem;letter-spacing:-.02em;text-decoration:none;
  box-shadow:0 4px 14px var(--brand-ring);
  transition:transform .3s var(--e-spring),box-shadow .3s;
}
.mark:hover{transform:rotate(-8deg) scale(1.08);box-shadow:var(--sh-3);text-decoration:none}
.top h1{font-size:var(--t-h1);margin:0;font-weight:800;line-height:1.25;min-width:0}
.top h1 .sub{display:block;font-size:var(--t-xs);color:var(--ink-2);font-weight:500;letter-spacing:0;
  margin-top:.1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tools{margin-left:auto;display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}

button,select,input[type=search]{
  font:inherit;font-size:var(--t-sm);font-weight:600;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:var(--r-sm);padding:.4rem .72rem;cursor:pointer;
  position:relative;overflow:hidden;
  transition:transform .18s var(--e-spring),border-color .2s,background .2s,box-shadow .2s,color .2s;
}
button:hover{transform:translateY(-1.5px);border-color:var(--brand);box-shadow:var(--sh-1)}
button:active{transform:translateY(0) scale(.97)}
button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible{outline:none;box-shadow:var(--sh-glow)}
input[type=search]{min-width:190px;cursor:text;font-weight:500}
input[type=search]:focus{border-color:var(--brand)}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--surface-2);padding:2px;gap:2px}
.seg button{border:0;border-radius:calc(var(--r-sm) - 2px);padding:.32rem .68rem;background:transparent;box-shadow:none}
.seg button:hover{transform:none;background:var(--surface)}
.seg button[aria-pressed="true"]{background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;box-shadow:0 2px 8px var(--brand-ring)}

.ripple{position:absolute;border-radius:50%;transform:scale(0);background:currentColor;opacity:.25;animation:rip .55s linear;pointer-events:none}
@keyframes rip{to{transform:scale(3.4);opacity:0}}

.progress{position:absolute;left:0;bottom:-1px;height:2.5px;width:0;
  background:linear-gradient(90deg,var(--brand),var(--legal),var(--ej));transition:width .1s linear}

/* ═══ LAYOUT ═══ */
.layout{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:270px 1fr;gap:1.8rem;padding:1.4rem 1.1rem 5rem}
main{min-width:0}

/* ═══ SIDEBAR ═══ */
nav.side{
  position:sticky;top:76px;align-self:start;max-height:calc(100vh - 96px);overflow:auto;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:.85rem;box-shadow:var(--sh-1);
}
nav.side h2{font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);
  margin:.5rem .4rem .5rem;font-weight:800}
nav.side h2:first-child{margin-top:.1rem}
nav.side a{
  display:flex;align-items:baseline;gap:.5rem;padding:.36rem .55rem;border-radius:var(--r-sm);
  text-decoration:none;color:var(--ink-2);font-size:var(--t-sm);font-weight:500;
  position:relative;transition:background .22s,color .22s,transform .22s var(--e-out);
}
nav.side a:hover{background:var(--surface-2);color:var(--ink);transform:translateX(3px);text-decoration:none}
nav.side a.on{background:var(--brand-soft);color:var(--brand);font-weight:700}
nav.side a.on::before{content:"";position:absolute;left:-.85rem;top:20%;bottom:20%;width:3px;
  border-radius:0 3px 3px 0;background:var(--brand)}
nav.side a b{color:var(--ink-3);font-weight:800;font-size:var(--t-xs);font-variant-numeric:tabular-nums;flex:none;min-width:1.9em}
nav.side a.on b{color:var(--brand)}
.navtoggle{display:none}

/* ═══ TARJETAS ═══ */
section.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:1.35rem 1.5rem;margin-bottom:1.1rem;box-shadow:var(--sh-1);
  transition:box-shadow .3s var(--e-out),border-color .3s;
}
section.card:hover{box-shadow:var(--sh-2)}
section.card>h2{
  margin:0 0 1rem;font-size:var(--t-h2);font-weight:800;
  display:flex;align-items:center;gap:.6rem;
}
section.card>h2::before{
  content:"";width:4px;height:1.05em;border-radius:99px;flex:none;
  background:linear-gradient(180deg,var(--brand),var(--brand-2));
}

/* ═══ ARTÍCULO ═══ */
.art{scroll-margin-top:86px;padding-top:.4rem}
.art + .art{margin-top:1.6rem;padding-top:1.6rem;border-top:1px dashed var(--line)}
.art h2{display:flex;flex-wrap:wrap;gap:.5rem;align-items:baseline;font-size:var(--t-h3);
  margin:0 0 .25rem;font-weight:800;letter-spacing:-.015em}
.art h2 .num{
  color:var(--brand);font-weight:800;font-family:var(--f-display);
  background:var(--brand-soft);padding:.1rem .5rem;border-radius:var(--r-sm);
  font-size:.92em;letter-spacing:-.02em;
}
.ubic{font-size:var(--t-xs);color:var(--ink-3);margin:0 0 .8rem;font-weight:600;
  letter-spacing:.03em;text-transform:uppercase}

/* ═══ IDEA CLAVE ═══ */
.idea{
  background:linear-gradient(100deg,var(--brand-soft),color-mix(in srgb,var(--brand-soft) 40%,transparent));
  border-left:4px solid var(--brand);border-radius:0 var(--r-md) var(--r-md) 0;
  padding:.75rem 1rem;font-weight:650;margin:.7rem 0 1rem;position:relative;
  font-size:.97rem;line-height:1.55;
}

/* ═══ ACORDEÓN ═══ */
details.panel{
  border:1px solid var(--line);border-radius:var(--r-md);margin:.6rem 0;
  background:var(--surface);overflow:hidden;
  transition:border-color .25s,box-shadow .25s,background .25s;
}
details.panel:hover{border-color:var(--line-strong)}
details.panel[open]{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-ring)}
details.panel>summary{
  cursor:pointer;padding:.62rem .9rem;font-weight:700;font-size:.93rem;
  list-style:none;display:flex;align-items:center;gap:.55rem;
  transition:background .2s,color .2s;
}
details.panel>summary:hover{background:var(--surface-2)}
details.panel[open]>summary{background:var(--brand-soft);color:var(--brand)}
details.panel>summary::-webkit-details-marker{display:none}
details.panel>summary::before{
  content:"";width:16px;height:16px;flex:none;border-radius:5px;
  background:var(--brand-soft);position:relative;transition:transform .3s var(--e-spring),background .25s;
}
details.panel>summary::after{
  content:"";position:absolute;width:0;height:0;margin-left:5px;
  border:4px solid transparent;border-left-color:var(--brand);
  transition:transform .3s var(--e-spring);
}
details.panel[open]>summary::before{background:var(--surface)}
details.panel[open]>summary::after{transform:rotate(90deg) translateX(-1px)}
details.panel .body{padding:.3rem 1rem 1rem;font-size:.95rem;animation:slidein .35s var(--e-out)}
@keyframes slidein{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* ═══ TEXTO LEGAL ═══ */
.legal{
  background:var(--legal-bg);border-left:4px solid var(--legal);
  border-radius:0 var(--r-md) var(--r-md) 0;padding:.85rem 1.05rem;
  font-family:var(--f-legal);font-size:.95rem;line-height:1.7;
}
.legal p{margin:.45rem 0}
.legal .lbl{
  font-family:var(--f-body);font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;
  color:var(--legal);font-weight:800;display:block;margin-bottom:.4rem;
}

/* ═══ CAJAS SEMÁNTICAS ═══ */
.box{
  border-left:4px solid var(--line);border-radius:0 var(--r-md) var(--r-md) 0;
  padding:.72rem .95rem;margin:.65rem 0;font-size:.94rem;
  transition:transform .25s var(--e-out),box-shadow .25s;
}
.box:hover{transform:translateX(3px);box-shadow:var(--sh-1)}
.box.ej{background:var(--ej-bg);border-color:var(--ej)}
.box.warn{background:var(--warn-bg);border-color:var(--warn)}
.box.exc{background:var(--exc-bg);border-color:var(--exc)}
.box .lbl{font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;font-weight:800;
  display:block;margin-bottom:.3rem}
.box.ej .lbl{color:var(--ej)}
.box.warn .lbl{color:var(--warn)}
.box.exc .lbl{color:var(--exc)}

.interp{
  border:1px dashed var(--warn);background:color-mix(in srgb,var(--warn-bg) 45%,transparent);
  border-radius:var(--r-md);padding:.65rem .9rem;font-size:.9rem;margin:.6rem 0;
}
.interp .lbl{font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;color:var(--warn);font-weight:800;display:block}

/* ═══ TABLAS ═══ */
table{width:100%;border-collapse:separate;border-spacing:0;font-size:.9rem;margin:.7rem 0;
  border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
th,td{padding:.5rem .68rem;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
td + td, th + th{border-left:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th{background:var(--surface-2);font-size:var(--t-xs);font-weight:800;letter-spacing:.05em;
  text-transform:uppercase;color:var(--ink-2);position:sticky;top:0}
tbody tr{transition:background .18s}
tbody tr:nth-child(even){background:color-mix(in srgb,var(--surface-2) 45%,transparent)}
tbody tr:hover{background:var(--brand-soft)}
th.sortable{cursor:pointer;user-select:none;transition:color .2s,background .2s}
th.sortable:hover{color:var(--brand);background:var(--brand-soft)}
th.sortable::after{content:" ⇅";color:var(--ink-3);font-size:.7rem}

ul,ol{margin:.5rem 0 .5rem 1.2rem;padding:0}
li{margin:.26rem 0}
li::marker{color:var(--brand);font-weight:700}

/* ═══ TOOLTIPS ═══ */
.t{border-bottom:1.5px dotted var(--brand);cursor:help;position:relative;
  transition:background .2s,color .2s}
.t:hover{background:var(--brand-soft);color:var(--brand);border-radius:3px}
#tip{
  position:fixed;z-index:99;max-width:330px;background:var(--ink);color:var(--bg);
  padding:.6rem .78rem;border-radius:var(--r-md);font-size:.82rem;line-height:1.5;
  display:none;box-shadow:0 8px 30px rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.08);
}
html[data-theme="dark"] #tip{background:#f0f1f5;color:#15161c}

/* ═══ FLECHAS DE DIAGRAMA ═══
   Un <path> con stroke pero sin fill toma el valor inicial (negro) y el
   navegador cierra el trazo implícitamente: aparece un triángulo relleno
   entre sus extremos. Forzamos fill:none para dejar solo la línea + la
   punta del <marker>, que sí lleva su color. */
svg path[stroke]:not([fill]){fill:none}
svg polyline:not([fill]){fill:none}
svg line{fill:none}

/* ═══ SVG ═══ */
svg{max-width:100%;height:auto;display:block;margin:.9rem auto}
svg text{font-family:var(--f-body)}

/* ═══ BUSCADOR ═══ */
mark.hit{background:linear-gradient(180deg,transparent 55%,#ffe066 55%);color:inherit;
  border-radius:2px;padding:0 1px;font-weight:600}
html[data-theme="dark"] mark.hit{background:linear-gradient(180deg,transparent 55%,#8a6d00 55%);color:#fff}

/* ═══ UTILIDADES ═══ */
.hide{display:none !important}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.small{font-size:var(--t-sm);color:var(--ink-2)}
.chip{
  display:inline-block;font-size:var(--t-xs);padding:.16rem .55rem;border-radius:var(--r-full);
  background:var(--brand-soft);color:var(--brand);font-weight:800;letter-spacing:.02em;
}

/* ═══ HUECOS RELLENABLES ═══ */
.gap{
  display:inline-block;min-width:5.5em;border-bottom:2px solid var(--brand);
  text-align:center;font-weight:700;color:transparent;cursor:pointer;
  transition:color .3s,background .3s;
}
.gap.on,.gap:hover{color:var(--brand);background:var(--brand-soft);border-radius:4px 4px 0 0}

/* ═══ REVELAR SOLUCIÓN ═══ */
.revelar{
  background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;border-color:transparent;
  font-weight:700;
}
.revelar:hover{box-shadow:var(--sh-3)}
.sol{
  margin-top:.7rem;padding:.8rem 1rem;border-radius:var(--r-md);
  background:var(--ej-bg);border-left:4px solid var(--ej);
  animation:slidein .4s var(--e-out);
}

/* ═══ TEST ═══ */
.opt{
  display:block;padding:.55rem .85rem;margin:.35rem 0;border:1.5px solid var(--line);
  border-radius:var(--r-md);cursor:pointer;background:var(--surface);font-size:.94rem;
  transition:border-color .22s,background .22s,transform .22s var(--e-out);
}
.opt:hover{border-color:var(--brand);background:var(--brand-soft);transform:translateX(4px)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft);font-weight:650}
.opt.ko{border-color:var(--exc);background:var(--exc-bg)}
.opt input{margin-right:.5rem;accent-color:var(--brand)}

#tscore,#semres{
  font-family:var(--f-display);font-weight:800;font-size:1.15rem;letter-spacing:-.02em;
}

/* ═══════════════════════════════════════════════════════════════
   FLASHCARDS 3D · mazo con giro, vuelo de salida y sheen
   ═══════════════════════════════════════════════════════════════ */
#flash{--fc-e:cubic-bezier(.2,.8,.25,1);--fc-h:250px}

/* — Escena — */
.fc-stage{
  perspective:1400px;perspective-origin:50% 45%;
  padding:.4rem 0 .2rem;position:relative;
}
.fc-deck{position:relative;height:var(--fc-h);will-change:transform}

/* — Cartas fantasma del mazo — */
.fc-ghost{
  position:absolute;inset:0;border-radius:var(--r-lg);
  background:var(--surface);border:1px solid var(--line);
  transition:transform .5s var(--fc-e),opacity .5s var(--fc-e);
}
.fc-ghost.g1{transform:translateY(9px) scale(.972);opacity:.75}
.fc-ghost.g2{transform:translateY(18px) scale(.944);opacity:.45}
.fc-deck.empty .fc-ghost{opacity:0;transform:translateY(26px) scale(.9)}

/* — Elevación durante el giro — */
.fc-lift{position:absolute;inset:0;transform-style:preserve-3d}
.fc-lift.lift{animation:fcLift .78s var(--fc-e)}
@keyframes fcLift{
  0%,100%{transform:scale(1) translateY(0)}
  45%{transform:scale(1.055) translateY(-16px)}
}
.fc-lift.out-ok{animation:fcOut .5s cubic-bezier(.5,0,.75,0) forwards}
.fc-lift.out-ko{animation:fcOutKo .5s cubic-bezier(.5,0,.75,0) forwards}
.fc-lift.in{animation:fcIn .48s var(--fc-e)}
@keyframes fcOut{
  0%{transform:translateX(0) rotate(0) scale(1);opacity:1}
  100%{transform:translateX(130%) rotate(17deg) scale(.85);opacity:0}
}
@keyframes fcOutKo{
  0%{transform:translateX(0) rotate(0) scale(1);opacity:1}
  100%{transform:translateX(-130%) rotate(-17deg) scale(.85);opacity:0}
}
@keyframes fcIn{
  0%{transform:translateY(26px) scale(.9);opacity:0}
  100%{transform:translateY(0) scale(1);opacity:1}
}

/* — La carta — */
.fc-card{
  position:absolute;inset:0;transform-style:preserve-3d;
  transition:transform .78s var(--fc-e);
  cursor:pointer;border-radius:var(--r-lg);
}
.fc-card:focus-visible{outline:none}
.fc-card:focus-visible .fc-face{box-shadow:var(--sh-glow),var(--sh-2)}

/* — Caras — */
.fc-face{
  position:absolute;inset:0;border-radius:var(--r-lg);
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  padding:2rem 2.2rem;text-align:center;overflow:hidden;
  box-shadow:var(--sh-2);
  transition:box-shadow .4s var(--fc-e);
}
.fc-card:hover .fc-face{box-shadow:var(--sh-3)}

/* Anverso · pregunta */
.fc-front{
  background:
    radial-gradient(120% 90% at 50% -20%, var(--brand-soft) 0%, transparent 60%),
    var(--surface);
  border:1.5px solid var(--line);color:var(--ink);
}
/* Reverso · respuesta */
.fc-back{
  transform:rotateY(180deg);
  background:linear-gradient(145deg,var(--brand) 0%,#6d4bf7 45%,var(--c5,#0891b2) 130%);
  border:1.5px solid transparent;color:#fff;
}
html[data-theme="dark"] .fc-back{
  background:linear-gradient(145deg,#5f45c9 0%,#4b3aa8 45%,#0e6b85 130%);
}
.fc-back .fc-txt{color:#fff}
.fc-back b,.fc-back strong{color:#fff;font-weight:800}

/* — Sheen que barre al girar — */
.fc-face::after{
  content:"";position:absolute;top:-60%;left:-70%;width:55%;height:220%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.42),transparent);
  transform:rotate(18deg);opacity:0;pointer-events:none;
}
.fc-lift.lift .fc-face::after{animation:fcSheen .78s var(--fc-e)}
@keyframes fcSheen{
  0%{opacity:0;left:-70%}
  35%{opacity:1}
  100%{opacity:0;left:150%}
}

/* — Etiqueta superior — */
.fc-tag{
  position:absolute;top:1rem;left:1.15rem;
  font-size:var(--t-xs);font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  display:inline-flex;align-items:center;gap:.4rem;
}
.fc-front .fc-tag{color:var(--brand)}
.fc-back .fc-tag{color:rgba(255,255,255,.9)}
.fc-tag::before{
  content:"";width:7px;height:7px;border-radius:50%;background:currentColor;
  animation:fcPulse 2.2s ease-in-out infinite;
}
@keyframes fcPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.65)}}

/* — Índice tipo naipe — */
.fc-pip{
  position:absolute;font-family:var(--f-display);font-weight:800;
  font-size:.78rem;letter-spacing:-.02em;opacity:.34;font-variant-numeric:tabular-nums;
}
.fc-pip.tr{top:1rem;right:1.15rem}
.fc-pip.bl{bottom:1rem;left:1.15rem;transform:rotate(180deg)}
.fc-front .fc-pip{color:var(--ink-2)}
.fc-back .fc-pip{color:#fff;opacity:.55}

/* — Texto — */
.fc-txt{
  font-size:clamp(1rem,.9rem + .55vw,1.28rem);font-weight:650;line-height:1.5;
  max-width:44ch;letter-spacing:-.012em;
}
.fc-front .fc-txt{font-family:var(--f-display);font-weight:700}
.fc-back .fc-txt{font-weight:600;line-height:1.6}
.fc-hint{
  position:absolute;bottom:1rem;left:0;right:0;
  font-size:var(--t-xs);font-weight:600;letter-spacing:.02em;
  display:flex;align-items:center;justify-content:center;gap:.4rem;
}
.fc-front .fc-hint{color:var(--ink-3)}
.fc-back .fc-hint{color:rgba(255,255,255,.72)}
.fc-hint .kbd{
  font-family:var(--f-mono);font-size:.68rem;font-weight:700;padding:.1rem .32rem;
  border-radius:5px;border:1px solid currentColor;opacity:.75;
}

/* — Pantalla final — */
.fc-done{
  position:absolute;inset:0;border-radius:var(--r-lg);
  background:linear-gradient(150deg,var(--ok-soft),var(--surface) 70%);
  border:1.5px solid var(--ok);
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  text-align:center;padding:2rem;gap:.35rem;
  animation:fcIn .5s var(--fc-e);box-shadow:var(--sh-2);
}
.fc-done .seal{
  font-size:2.6rem;line-height:1;
  animation:fcSeal .7s cubic-bezier(.2,1.5,.4,1);
}
@keyframes fcSeal{0%{transform:scale(0) rotate(-25deg);opacity:0}60%{transform:scale(1.2) rotate(6deg)}100%{transform:scale(1) rotate(0);opacity:1}}
.fc-done h3{font-size:1.3rem;font-weight:800;margin:.2rem 0 0}
.fc-done p{margin:0;color:var(--ink-2);font-size:var(--t-sm)}

/* — Barra de progreso de la ronda — */
.fc-bar{
  height:6px;border-radius:99px;background:var(--surface-3);
  overflow:hidden;margin:.95rem 0 .8rem;position:relative;
}
.fc-bar i{
  display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--brand),var(--c5,#0891b2));

}

/* — Controles — */
.fc-ctrls{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.fc-ctrls button{font-weight:700}
#fcok{border-color:var(--ok);color:var(--ok)}
#fcok:hover{background:var(--ok);color:#fff;border-color:var(--ok)}
#fcko{border-color:var(--warn);color:var(--warn)}
#fcko:hover{background:var(--warn);color:#fff;border-color:var(--warn)}
#fcflip{background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;border-color:transparent}
#fcflip:hover{box-shadow:var(--sh-3)}

.fc-score{display:inline-flex;gap:.45rem;margin-left:auto;align-items:center}

@media(max-width:620px){

}
@media(prefers-reduced-motion:reduce){

/* ═══ RESPUESTA ESTRUCTURADA ═══ */

.fc-verdict{

.fc-verdict.no{background:rgba(255,255,255,.16);border-color:rgba(255,205,205,.85);color:#ffdedd}
@keyframes fcPopIn{0%{opacity:0;transform:scale(.7) translateY(6px)}100%{opacity:1;transform:none}}

/* — Párrafo — */
.fc-p{margin:0;font-size:clamp(1rem,.92rem + .45vw,1.2rem);font-weight:600;line-height:1.6}
.fc-face.struct .fc-p{font-size:clamp(.96rem,.9rem + .35vw,1.1rem)}

/* — Lista enumerada — */
.fc-list{list-style:none;margin:0;padding:0;display:grid;gap:.5rem;counter-reset:fc}
.fc-list li{
  counter-increment:fc;position:relative;margin:0;
  padding:.42rem .6rem .42rem 2.5rem;border-radius:var(--r-sm);
  background:rgba(255,255,255,.11);
  font-size:clamp(.92rem,.88rem + .3vw,1.04rem);font-weight:600;line-height:1.45;

}
.fc-list li::before{
  content:counter(fc);position:absolute;left:.6rem;top:50%;transform:translateY(-50%);
  width:1.6rem;height:1.6rem;border-radius:50%;
  display:grid;place-items:center;
  background:rgba(255,255,255,.9);color:var(--brand);
  font-family:var(--f-display);font-weight:800;font-size:.78rem;
  font-variant-numeric:tabular-nums;
}
.fc-list.alpha li::before{content:counter(fc,lower-alpha)}
.fc-list li:nth-child(1){animation-delay:.36s}
.fc-list li:nth-child(2){animation-delay:.42s}
.fc-list li:nth-child(3){animation-delay:.48s}
.fc-list li:nth-child(4){animation-delay:.54s}
.fc-list li:nth-child(5){animation-delay:.60s}
.fc-list li:nth-child(n+6){animation-delay:.66s}
@keyframes fcRow{0%{opacity:0;transform:translateX(-12px)}100%{opacity:1;transform:none}}

/* — Cláusulas contrapuestas — */
.fc-clauses{display:grid;gap:.45rem}
.fc-clauses p{
  margin:0;padding:.45rem .7rem .45rem .95rem;border-radius:0 var(--r-sm) var(--r-sm) 0;

}
.fc-clauses p:nth-child(1){animation-delay:.36s}
.fc-clauses p:nth-child(2){animation-delay:.44s}
.fc-clauses p:nth-child(3){animation-delay:.52s}

/* — Negritas resaltadas en el reverso — */
.fc-back .fc-body b,.fc-back .fc-body strong{

.fc-cite::before,.fc-cite::after{

.fc-front .fc-cite{color:var(--ink-3)}
.fc-front .fc-cite::before{background:linear-gradient(90deg,transparent,var(--line-strong))}
.fc-front .fc-cite::after{background:linear-gradient(90deg,var(--line-strong),transparent)}

/* la pista se oculta si hay cita, para no amontonar */
.fc-back .fc-cite ~ .fc-hint,.fc-back .fc-hint.muted{display:none}

@media(max-width:620px){

<script>
const GLOSARIO={
 "presupuesto":"Documento contable y jurídico, aprobado por el Pleno, que fija el techo de gasto de un ejercicio y estima los ingresos con los que se financia. Ej.: el presupuesto de Utrera para 2026 autoriza gastar como máximo 78 M€.",
 "credito":"Crédito presupuestario: la cantidad máxima de dinero autorizada para una finalidad concreta. Ej.: 120.000 € en la aplicación de 'mantenimiento de colegios'.",
 "obligacion":"Obligación reconocida: la deuda que el Ayuntamiento admite formalmente que debe pagar, una vez comprobado que el servicio o suministro se ha prestado. Ej.: aprobada la factura del proveedor, nace la obligación.",
 "derecho":"Derecho liquidado: el importe concreto que un tercero debe a la entidad local, una vez cuantificado. Ej.: liquidado el IBI de un inmueble en 340 €, ese es el derecho.",
 "oa":"Organismo autónomo: ente con personalidad jurídica propia creado por la entidad local para gestionar un servicio (patronatos de deportes, de cultura, gerencias de urbanismo). Depende del Ayuntamiento pero tiene su propio presupuesto.",
 "sociedad":"Sociedad mercantil local: empresa con forma de S.A. o S.L. cuyo capital pertenece a la entidad local (p. ej. la empresa municipal de aguas). No aprueba 'presupuesto', sino estados de previsión de gastos e ingresos.",
 "bases":"Bases de ejecución: el 'reglamento de uso' del presupuesto. Adaptan las normas presupuestarias generales a la organización concreta de la entidad. Ej.: fijan qué órgano autoriza gastos de hasta 3.000 €.",
 "estabilidad":"Estabilidad presupuestaria: exigencia de que las cuentas públicas no incurran en déficit estructural. Ej.: un ayuntamiento no puede presupuestar más gasto no financiero que ingresos no financieros.",
 "afectacion":"No afectación: regla general de que todos los ingresos financian todo el gasto, sin que un ingreso concreto quede reservado a un gasto concreto. Ej.: lo recaudado por el IBI no está reservado a pagar el alumbrado.",
 "bruto":"Principio de presupuesto bruto (o de integridad): derechos y obligaciones se anotan por su importe total, sin compensar unos con otros. Ej.: no se puede anotar la subvención 'ya descontados' los gastos del programa.",
 "nivelacion":"Nivelación presupuestaria: que el total de ingresos previstos cubra el total de gastos autorizados; es decir, aprobar sin déficit inicial.",
 "aplicacion":"Aplicación presupuestaria: la 'casilla' exacta donde vive cada euro de gasto, formada al cruzar la clasificación por programas con la económica. Ej.: 323/22103 (funcionamiento de centros docentes / combustibles).",
 "vinculacion":"Nivel de vinculación jurídica: el nivel de agregación en el que el crédito es realmente limitativo; por debajo de él se puede mover el gasto sin tramitar una modificación de crédito (art. 172 TRLHL).",
 "intervencion":"Intervención: el órgano de control interno de la entidad local, con función de fiscalización previa del gasto y de informe preceptivo del presupuesto. Lo desempeña un funcionario de habilitación nacional.",
 "pleno":"Pleno: órgano colegiado formado por todos los concejales o diputados. Es el único competente para aprobar el presupuesto.",
 "bop":"Boletín Oficial de la Provincia: diario oficial donde las entidades locales publican sus anuncios y acuerdos con efectos frente a terceros.",
 "prorroga":"Prórroga presupuestaria: si el 1 de enero no ha entrado en vigor el presupuesto nuevo, sigue rigiendo automáticamente el anterior con sus créditos iniciales.",
 "interesado":"Interesado: quien está legitimado para intervenir en un procedimiento. En el presupuesto, la ley define expresamente quiénes lo son (art. 170.1).",
 "liquidacion":"Liquidación del presupuesto: cierre contable del ejercicio, que determina los derechos y obligaciones pendientes, el remanente de tesorería y el resultado presupuestario.",
 "tcuentas":"Tribunal de Cuentas: órgano fiscalizador externo de las cuentas y la gestión económica del sector público, dependiente de las Cortes Generales.",
 "conten":"Recurso contencioso-administrativo: impugnación ante los juzgados y tribunales de lo contencioso-administrativo, es decir, ya fuera de la propia Administración."
};
const ARTS=[
{n:162,t:"Definición",ubic:"Título VI (Presupuesto y gasto público) ▸ Capítulo I (De los presupuestos) ▸ Sección 1.ª (Contenido y aprobación)",
idea:"El presupuesto pone en cifras el gasto máximo autorizado y el ingreso que se espera obtener.",
literal:`<p>Los presupuestos generales de las entidades locales constituyen la expresión cifrada, conjunta y sistemática de las obligaciones que, como máximo, pueden reconocer la entidad, y sus organismos autónomos, y de los derechos que prevean liquidar durante el correspondiente ejercicio, así como de las previsiones de ingresos y gastos de las sociedades mercantiles cuyo capital social pertenezca íntegramente a la entidad local correspondiente.</p>`,
dis:`<ul>
<li><b>Supuesto de hecho:</b> toda entidad local que elabora su presupuesto general.</li>
<li><b>Sujetos:</b> la entidad local, sus <span class="t" data-k="oa">organismos autónomos</span> y sus <span class="t" data-k="sociedad">sociedades mercantiles</span> íntegramente locales.</li>
<li><b>Consecuencia jurídica:</b> el documento fija un <b>techo de gasto</b> vinculante y una <b>previsión</b> de ingresos.</li>
<li><b>Tres adjetivos que hay que retener:</b> expresión <b>cifrada</b> (en euros, no en prosa), <b>conjunta</b> (todos los entes, un solo documento) y <b>sistemática</b> (ordenada según una estructura predeterminada).</li>
</ul>
<table><thead><tr><th>Lado</th><th>Naturaleza</th><th>¿Es un límite?</th></tr></thead><tbody>
<tr><td>Gastos (<span class="t" data-k="obligacion">obligaciones</span>)</td><td>Autorización máxima</td><td><b>Sí</b>: no se puede reconocer más</td></tr>
<tr><td>Ingresos (<span class="t" data-k="derecho">derechos</span>)</td><td>Previsión estimativa</td><td><b>No</b>: se puede recaudar más o menos</td></tr>
</tbody></table>`,
llano:`<p>Imagina la economía doméstica de una familia numerosa que además tiene dos negocios. El presupuesto es la hoja donde escriben: "este año no gastaremos más de 40.000 € y calculamos ingresar unos 41.000 €". La cifra de gasto es una promesa que les ata: no pueden pasarse. La de ingresos es un cálculo: pueden entrar más o menos euros de los previstos.</p>`,
porque:`<p>Sin un techo cifrado y aprobado por el órgano representativo, quien gobierna podría comprometer dinero público sin control. El presupuesto convierte la decisión de gastar en una <b>autorización previa y pública</b>: el Pleno decide antes, no después. Y al exigir que sea <i>conjunto</i>, impide el truco de sacar gasto fuera del documento metiéndolo en organismos o empresas satélite.</p>`,
ej:`<ul>
<li><b>Cotidiano:</b> el tope de la tarjeta de crédito. El banco te fija 3.000 €: puedes gastar menos, nunca más. Lo que ingreses en la cuenta es otra cosa, y varía.</li>
<li><b>Real:</b> el Ayuntamiento de Utrera aprueba para 2026 un presupuesto general de 78,4 M€, que integra el del Ayuntamiento (71 M€), el del Patronato Municipal de Deportes (2,9 M€) y los estados de previsión de la empresa municipal de aguas (4,5 M€).</li>
<li><b>Caso límite:</b> una sociedad mercantil cuyo capital es un 60 % municipal y un 40 % privado. El art. 162 solo menciona las de capital <b>íntegramente</b> local; su tratamiento no se resuelve aquí, sino en el art. 166.1.b) (programa anual de actuación como anexo).</li>
</ul>`,
noej:`<ul>
<li><b>No es presupuesto</b> el plan económico-financiero de saneamiento: es un plan de corrección, no una autorización de gasto.</li>
<li><b>No es presupuesto</b> la <span class="t" data-k="liquidacion">liquidación</span>: esta mira hacia atrás (lo ejecutado), el presupuesto mira hacia delante (lo autorizado).</li>
<li><b>No entra aquí</b> una fundación pública local o un consorcio: el art. 162 solo cita entidad, organismos autónomos y sociedades de capital íntegramente local.</li>
</ul>`,
conex:`<ul>
<li><b>Art. 164:</b> desarrolla qué se integra en el presupuesto general.</li>
<li><b>Art. 165.4:</b> el corolario del "máximo": cada presupuesto se aprueba sin déficit inicial.</li>
<li><b>Art. 172:</b> los créditos son limitativos y vinculantes — la consecuencia práctica del "como máximo".</li>
<li><b>Art. 173.5:</b> es nulo de pleno derecho el compromiso de gasto sin crédito.</li>
</ul>`,
trampas:`<ul>
<li>Confundir los dos lados: los <b>gastos</b> son máximo; los <b>ingresos</b>, previsión. Es la pregunta de test más repetida de todo el artículo.</li>
<li>La ley dice "obligaciones que, <b>como máximo</b>, pueden reconocer" — no dice "que deben gastar". Presupuestar no obliga a gastar.</li>
<li>"Íntegramente" (100 % del capital) en el art. 162, frente a "titular único o partícipe mayoritario" en el art. 166.1.b). No son lo mismo.</li>
</ul>`,
ancla:`<p><b>Las tres C:</b> el presupuesto es <b>C</b>ifrado, <b>C</b>onjunto y sistemátiCo... mejor aún, imagina un <b>CCS</b>: <b>C</b>ifrada, <b>C</b>onjunta, <b>S</b>istemática.<br>
<b>Para no invertir los lados:</b> "el <b>G</b>asto es <b>G</b>uillotina, el <b>I</b>ngreso es <b>I</b>ntuición".</p>`,

{n:163,t:"Ámbito temporal",ubic:"Título VI ▸ Cap. I ▸ Sección 1.ª",
idea:"El presupuesto dura un año natural y cada ejercicio se queda con lo suyo.",
literal:`<p>El ejercicio presupuestario coincidirá con el año natural y a él se imputarán:</p>
<p>a) Los derechos liquidados en el ejercicio, cualquiera que sea el período de que deriven; y</p>
<p>b) Las obligaciones reconocidas durante el ejercicio.</p>`,
dis:`<ul>
<li><b>Regla temporal:</b> ejercicio = año natural (1 de enero a 31 de diciembre). No cabe un ejercicio "de julio a junio".</li>
<li><b>Criterio de imputación de ingresos:</b> el momento de la <b>liquidación</b> del derecho, <i>con independencia del período del que derive</i>.</li>
<li><b>Criterio de imputación de gastos:</b> el momento del <b>reconocimiento</b> de la obligación.</li>
</ul>`,
llano:`<p>El año presupuestario es como una caja de zapatos con una etiqueta: "2026". Dentro se mete el papel del día en que se liquidó el cobro o se reconoció la deuda, aunque el hecho venga de antes. Si en marzo de 2026 el Ayuntamiento liquida un IBI atrasado de 2023, ese dinero va a la caja de 2026, no a la de 2023.</p>`,
porque:`<p>Necesitas una regla clara de "a qué año pertenece cada euro", porque si no, dos ejercicios podrían disputarse el mismo apunte o ninguno lo recogería. Al fijar el <b>momento del acto administrativo</b> (liquidar, reconocer) y no el momento del hecho económico, la ley elige un criterio objetivo y verificable documentalmente.</p>`,
ej:`<ul>
<li><b>Cotidiano:</b> el extracto bancario. La compra la hiciste el 30 de diciembre, pero si el cargo entra el 2 de enero, aparece en el extracto de enero.</li>
<li><b>Real:</b> el Ayuntamiento de Dos Hermanas liquida en abril de 2026 una plusvalía correspondiente a una transmisión de 2024 por 2.150 €. Se imputa al presupuesto de ingresos de <b>2026</b>.</li>
<li><b>Caso límite:</b> una factura de suministro eléctrico de diciembre de 2025 que llega en enero de 2026 y se reconoce en 2026. Se imputa a 2026 — salvo que se acuda a la vía específica de reconocimiento extrajudicial de créditos, figura no regulada en este artículo.</li>
</ul>`,
noej:`<ul>
<li><b>No</b> se imputa por la fecha del hecho imponible ni por la fecha de la factura: el criterio es la liquidación o el reconocimiento.</li>
<li><b>No</b> cabe un ejercicio presupuestario de duración distinta al año natural, ni aunque la corporación se constituya a mitad de año.</li>
</ul>`,
conex:`<ul>
<li><b>Art. 169.6:</b> si el 1 de enero no hay presupuesto en vigor, se prorroga el anterior — el ejercicio arranca igualmente.</li>
<li><b>Art. 176:</b> anualidad presupuestaria: solo se aplican al presupuesto las obligaciones reconocidas hasta el fin del ejercicio.</li>
</ul>`,
trampas:`<ul>
<li>La coletilla "<b>cualquiera que sea el período de que deriven</b>" va referida solo a los <b>derechos</b> (letra a), no a las obligaciones.</li>
<li>"Año natural" ≠ "doce meses desde la aprobación".</li>
</ul>`,
ancla:`<p><b>"D de Derecho, D de la fecha en que se Declara"</b>. Y para el conjunto: <b>1-E a 31-D, sin excepción</b>.</p>`,

{n:164,t:"Contenido del presupuesto general",ubic:"Título VI ▸ Cap. I ▸ Sección 1.ª",
idea:"Un solo presupuesto general que suma tres piezas: entidad, organismos autónomos y sociedades.",
literal:`<p>1. Las entidades locales elaborarán y aprobarán anualmente un presupuesto general en el que se integrarán:</p>
<p>a) El presupuesto de la propia entidad.</p>
<p>b) Los de los organismos autónomos dependientes de esta.</p>
<p>c) Los estados de previsión de gastos e ingresos de las sociedades mercantiles cuyo capital social pertenezca íntegramente a la entidad local.</p>
<p>2. Los organismos autónomos de las entidades locales se clasifican, a efectos de su régimen presupuestario y contable, en la forma siguiente:</p>
<p>a) Organismos autónomos de carácter administrativo.</p>
<p>b) Organismos autónomos de carácter comercial, industrial, financiero o análogo.</p>
<p>Las normas de creación de cada organismo autónomo deberán indicar expresamente su carácter.</p>`,
dis:`<ul>
<li><b>Obligación:</b> elaborar y aprobar <b>anualmente</b> un presupuesto general. Es un deber, no una facultad.</li>
<li><b>Tres integrantes:</b> presupuesto de la entidad + presupuestos de los <span class="t" data-k="oa">organismos autónomos</span> + <b>estados de previsión</b> de las sociedades de capital íntegramente local.</li>
<li><b>Nota de vocabulario:</b> las sociedades no aportan "presupuesto", aportan "estados de previsión de gastos e ingresos". La ley cuida la palabra.</li>
<li><b>Clasificación de los OOAA:</b> administrativos / comerciales, industriales, financieros o análogos. La norma de creación debe decir cuál es.</li>
</ul>`,
llano:`<p>Piensa en una empresa familiar con filiales. Cada filial hace sus cuentas, pero al final del año todo se presenta en un único cuaderno consolidado para que se vea el conjunto. El presupuesto general es ese cuaderno: dentro siguen distinguiéndose las piezas, pero se aprueban de golpe.</p>`,
porque:`<p>Si cada organismo y cada empresa municipal aprobara sus cuentas por separado, nadie vería el tamaño real del sector público local, y sería fácil esconder gasto o deuda en entes satélite. La integración obliga a que el Pleno vea <b>la foto completa</b> antes de decidir. La clasificación de los OOAA existe porque un patronato de deportes (administrativo) y una gerencia de tipo comercial no pueden llevar el mismo régimen contable.</p>`,
ej:`<ul>
<li><b>Cotidiano:</b> la cuenta conjunta de una pareja que además mantiene cuentas individuales: para saber cómo va el año, hay que mirar las tres a la vez.</li>
<li><b>Real:</b> el presupuesto general de la Diputación de Sevilla para 2026 integra el de la propia Diputación, el del OPAEF (organismo autónomo de gestión tributaria) y los estados de previsión de sus sociedades de capital 100 % provincial.</li>
<li><b>Caso límite:</b> un consorcio adscrito al Ayuntamiento. No aparece en la lista del art. 164.1; su integración se resuelve por la normativa de estabilidad y de régimen jurídico, no por este artículo.</li>
</ul>`,
noej:`<ul>
<li><b>No se integra</b> una sociedad mercantil con capital mixto (p. ej. 51 % municipal): el art. 164.1.c) exige capital íntegramente local. Sí aportará su programa anual de actuación como anexo (art. 166.1.b).</li>
<li><b>No se integran</b> las entidades de ámbito territorial inferior al municipio como si fueran organismos autónomos: tienen su propio régimen.</li>
</ul>`,
conex:`<ul>
<li><b>Art. 162:</b> definición — usa exactamente los mismos tres sujetos.</li>
<li><b>Art. 166.1.c):</b> estado de consolidación, que es el anexo donde se ve la suma depurada.</li>
<li><b>Art. 168.2 y 168.3:</b> plazo del 15 de septiembre para que OOAA y sociedades remitan sus documentos.</li>
<li><b>Art. 168.5:</b> el acuerdo de aprobación es único: no se puede aprobar un integrante por separado.</li>
</ul>`,
trampas:`<ul>
<li>Tres letras, tres sujetos: si un test añade "las fundaciones públicas locales" o "los consorcios", es falso respecto de este artículo.</li>
<li>"Íntegramente" es la palabra clave de la letra c).</li>
<li>Los OOAA son <b>dos</b> categorías, no tres. "Comercial, industrial, financiero o análogo" es <b>una sola</b> categoría con cuatro adjetivos.</li>
</ul>`,
ancla:`<p><b>E-O-S</b>: <b>E</b>ntidad, <b>O</b>rganismos autónomos, <b>S</b>ociedades. Imagina que el presupuesto general va montado en una moto de tres ruedas: si le quitas una, se cae.<br>Para los OOAA: <b>"A" y "CIFA"</b> → <b>A</b>dministrativos / <b>C</b>omercial, <b>I</b>ndustrial, <b>F</b>inanciero o <b>A</b>nálogo.</p>`,

{n:165,t:"Contenido de los presupuestos integrantes",ubic:"Título VI ▸ Cap. I ▸ Sección 1.ª",
idea:"Cada presupuesto lleva gastos, ingresos y bases de ejecución, y se aprueba sin déficit.",
literal:`<p>1. El presupuesto general atenderá al cumplimiento del principio de estabilidad en los términos previstos en la Ley 18/2001, General de Estabilidad Presupuestaria, y contendrá para cada uno de los presupuestos que en él se integren:</p>
<p>a) Los estados de gastos, en los que se incluirán, con la debida especificación, los créditos necesarios para atender al cumplimiento de las obligaciones.</p>
<p>b) Los estados de ingresos, en los que figurarán las estimaciones de los distintos recursos económicos a liquidar durante el ejercicio.</p>
<p>Asimismo, incluirá las bases de ejecución, que contendrán la adaptación de las disposiciones generales en materia presupuestaria a la organización y circunstancias de la propia entidad, así como aquellas otras necesarias para su acertada gestión, estableciendo cuantas prevenciones se consideren oportunas o convenientes para la mejor realización de los gastos y recaudación de los recursos, sin que puedan modificar lo legislado para la administración económica ni comprender preceptos de orden administrativo que requieran legalmente procedimiento y solemnidades específicas distintas de lo previsto para el presupuesto.</p>
<p>2. Los recursos de la entidad local y de cada uno de sus organismos autónomos y sociedades mercantiles se destinarán a satisfacer el conjunto de sus respectivas obligaciones, salvo en el caso de ingresos específicos afectados a fines determinados.</p>
<p>3. Los derechos liquidados y las obligaciones reconocidas se aplicarán a los presupuestos por su importe íntegro, quedando prohibido atender obligaciones mediante minoración de los derechos a liquidar o ya ingresados, salvo que la ley lo autorice de modo expreso.</p>
<p>Se exceptúan de lo anterior las devoluciones de ingresos que se declaren indebidos por tribunal o autoridad competentes.</p>
<p>4. Cada uno de los presupuestos que se integran en el presupuesto general deberá aprobarse sin déficit inicial.</p>`,
dis:`<table><thead><tr><th>Apartado</th><th>Principio</th><th>Qué significa</th><th>Excepción</th></tr></thead><tbody>
<tr><td>165.1</td><td><span class="t" data-k="estabilidad">Estabilidad</span></td><td>El presupuesto general debe respetarla</td><td>—</td></tr>
<tr><td>165.1</td><td>Contenido</td><td>Estados de gastos + estados de ingresos + <span class="t" data-k="bases">bases de ejecución</span></td><td>—</td></tr>
<tr><td>165.2</td><td><span class="t" data-k="afectacion">No afectación</span></td><td>Todos los recursos financian todas las obligaciones</td><td>Ingresos específicos afectados a fines determinados</td></tr>
<tr><td>165.3</td><td><span class="t" data-k="bruto">Presupuesto bruto</span></td><td>Por importe íntegro; prohibido compensar</td><td>Ley que lo autorice expresamente; devoluciones de ingresos indebidos declaradas por tribunal o autoridad competente</td></tr>
<tr><td>165.4</td><td><span class="t" data-k="nivelacion">Sin déficit inicial</span></td><td>Cada presupuesto integrante, no solo el general</td><td>—</td></tr>
</tbody></table>
<p class="small"><b>Límites de las bases de ejecución:</b> no pueden modificar lo legislado en materia de administración económica ni incluir preceptos administrativos que exijan procedimiento y solemnidades distintas de las del presupuesto.</p>`,
llano:`<p>Cada presupuesto lleva tres cosas: la lista de lo que se puede gastar, la lista de lo que se espera ingresar y el manual de instrucciones de la casa (las bases de ejecución). Y tres reglas de juego limpio: el dinero es de todos para todo (salvo el que viene con destino marcado), las cifras se anotan enteras sin restar por debajo, y no se puede empezar el año con un agujero.</p>`,
porque:`<p>El principio de <b>no afectación</b> evita que el presupuesto se convierta en un mosaico de bolsillos intocables que impide priorizar. El <b>presupuesto bruto</b> impide maquillar: si un servicio ingresa 100 y gasta 90, deben verse las dos cifras, no un "10" neto que oculta el volumen real. Y el <b>déficit inicial cero</b> evita aprobar de entrada un plan imposible que traslade el problema al año siguiente.</p>`,
ej:`<ul>
<li><b>Cotidiano (no afectación):</b> tu nómina no viene con etiquetas; pagas hipoteca, comida y gasolina desde el mismo bolsillo. Pero si tu abuela te da 300 € "para el máster", ese dinero sí está afectado.</li>
<li><b>Real (afectación):</b> una subvención de la Junta de Andalucía de 180.000 € para rehabilitar el mercado de abastos solo puede financiar esa obra: es ingreso afectado, excepción del art. 165.2.</li>
<li><b>Real (bruto):</b> la escuela infantil municipal ingresa 210.000 € en cuotas y gasta 260.000 €. Deben figurar ambas cifras; está prohibido presupuestar solo el saldo neto de 50.000 €.</li>
<li><b>Caso límite:</b> devolución de un ingreso indebido declarada por sentencia. Aquí sí se minora el derecho: es la excepción expresa del art. 165.3, párrafo segundo.</li>
</ul>`,
noej:`<ul>
<li><b>No es excepción a la no afectación</b> que el equipo de gobierno "quiera" destinar lo recaudado por la tasa de basura solo a limpieza: la afectación tiene que venir impuesta por la norma que crea el recurso.</li>
<li><b>No cabe</b> que las bases de ejecución alteren el régimen de las modificaciones de crédito: eso es "lo legislado en materia de administración económica".</li>
<li><b>Déficit inicial</b> no es lo mismo que <b>remanente de tesorería negativo</b>: el primero se refiere al momento de aprobar, el segundo al cierre del ejercicio.</li>
</ul>`,
conex:`<ul>
<li><b>Art. 172:</b> los créditos son limitativos; las bases de ejecución fijan el <span class="t" data-k="vinculacion">nivel de vinculación</span>.</li>
<li><b>Art. 167.4:</b> el control fiscal opera sobre el nivel de vinculación determinado según el art. 172.</li>
<li><b>Art. 168.1.g):</b> el informe económico-financiero debe acreditar precisamente la "efectiva nivelación del presupuesto".</li>
<li><b>Art. 170.2.c):</b> la manifiesta insuficiencia de ingresos es causa de reclamación — es el control de la nivelación por los interesados.</li>
</ul>`,
trampas:`<ul>
<li>La remisión a la <b>Ley 18/2001</b> está desfasada: hoy rige la Ley Orgánica 2/2012, de Estabilidad Presupuestaria y Sostenibilidad Financiera. El texto consolidado conserva la cita antigua.</li>
<li>"Sin déficit inicial" se predica de <b>cada uno</b> de los presupuestos integrantes, no solo del general.</li>
<li>Las <b>bases de ejecución</b> son contenido obligatorio, pero no son un anexo (los anexos están en el art. 166). Se aprueban con el presupuesto.</li>
<li>La excepción del art. 165.3 exige que la devolución la declare "tribunal o autoridad competentes": no vale la simple decisión de un gestor.</li>
</ul>`,
ancla:`<p><b>G-I-B</b>: <b>G</b>astos, <b>I</b>ngresos, <b>B</b>ases de ejecución. Y los tres principios, en orden de apartado: <b>2-3-4 = No afectación, Bruto, Sin déficit</b> → <i>"No Bebas Sin agua"</i>.</p>`,

ARTS.push(
{n:166,t:"Anexos al presupuesto general",ubic:"Título VI ▸ Cap. I ▸ Sección 1.ª",
idea:"Cuatro documentos se unen al presupuesto para enseñar el medio plazo y la deuda.",
literal:`<p>1. Al presupuesto general se unirán como anexos:</p>
<p>a) Los planes y programas de inversión y financiación que, para un plazo de cuatro años, podrán formular los municipios y demás entidades locales de ámbito supramunicipal.</p>
<p>b) Los programas anuales de actuación, inversiones y financiación de las sociedades mercantiles de cuyo capital social sea titular único o partícipe mayoritario la entidad local.</p>
<p>c) El estado de consolidación del presupuesto de la propia entidad con el de todos los presupuestos y estados de previsión de sus organismos autónomos y sociedades mercantiles.</p>
<p>d) El estado de previsión de movimientos y situación de la deuda comprensiva del detalle de operaciones de crédito o de endeudamiento pendientes de reembolso al principio del ejercicio, de las nuevas operaciones previstas a realizar a lo largo del ejercicio y del volumen de endeudamiento al cierre del ejercicio económico, con distinción de operaciones a corto plazo, operaciones a largo plazo, de recurrencia al mercado de capitales y realizadas en divisas o similares, así como de las amortizaciones que se prevén realizar durante el mismo ejercicio.</p>
<p>2. El plan de inversiones que deberá coordinarse, en su caso, con el programa de actuación y planes de etapas de planeamiento urbanístico, se completará con el programa financiero, que contendrá:</p>
<p>a) La inversión prevista a realizar en cada uno de los cuatro ejercicios.</p>
<p>b) Los ingresos por subvenciones, contribuciones especiales, cargas de urbanización, recursos patrimoniales y otros ingresos de capital que se prevean obtener en dichos ejercicios, así como una proyección del resto de los ingresos previstos en el citado período.</p>
<p>c) Las operaciones de crédito que resulten necesarias para completar la financiación, con indicación de los costes que vayan a generar.</p>
<p>3. De los planes y programas de inversión y financiación se dará cuenta, en su caso, al Pleno de la Corporación coincidiendo con la aprobación del presupuesto, debiendo ser objeto de revisión anual, añadiendo un nuevo ejercicio a sus previsiones.</p>`,
dis:`<ul>
<li><b>Cuatro anexos (166.1):</b> a) planes y programas de inversión y financiación a <b>cuatro años</b>; b) programas anuales de actuación de sociedades de capital <b>íntegro o mayoritario</b>; c) estado de <b>consolidación</b>; d) estado de previsión de movimientos y situación de la <b>deuda</b>.</li>
<li><b>Naturaleza del anexo a):</b> potestativo — la ley dice "<b>podrán</b> formular".</li>
<li><b>Contenido del programa financiero (166.2):</b> inversión de cada uno de los cuatro ejercicios + ingresos de capital previstos + operaciones de crédito necesarias con sus costes.</li>
<li><b>Tramitación (166.3):</b> se <b>da cuenta</b> al <span class="t" data-k="pleno">Pleno</span> coincidiendo con la aprobación del presupuesto; revisión <b>anual</b> añadiendo un ejercicio nuevo.</li>
</ul>`,
llano:`<p>El presupuesto solo mira a un año, y hay decisiones que no caben en doce meses: un pabellón deportivo, un préstamo a quince años. Los anexos son las fotos que faltan: la película de las inversiones a cuatro años, lo que hacen las empresas municipales, la suma de todo el grupo sin duplicidades y el estado real de la deuda.</p>`,
porque:`<p>Un presupuesto anual aislado engaña: puedes aprobar el primer año de una obra sin enseñar que arrastra tres años más de pagos, o endeudarte sin que se vea el volumen acumulado. Los anexos son el <b>antídoto contra el cortoplacismo</b>. El de consolidación evita contar dos veces las transferencias internas del grupo (lo que el Ayuntamiento da al patronato aparece como gasto y como ingreso).</p>`,
ej:`<ul>
<li><b>Cotidiano:</b> comprar un coche a plazos. La cuenta de este mes solo enseña la primera cuota; para saber si puedes, necesitas la tabla de los cuatro años y el saldo de tus préstamos.</li>
<li><b>Real:</b> el Ayuntamiento de Alcalá de Guadaíra aprueba su presupuesto 2026 y adjunta un plan de inversiones 2026-2029 de 22 M€, con 6,4 M€ de subvenciones de la Diputación, 3 M€ de contribuciones especiales y un préstamo de 5 M€ a un coste estimado de 380.000 € en intereses.</li>
<li><b>Caso límite:</b> una sociedad municipal con el 55 % del capital. No se integra en el presupuesto general (art. 164 exige el 100 %), pero <b>sí</b> aporta su programa anual de actuación como anexo (art. 166.1.b: "partícipe mayoritario").</li>
</ul>`,
noej:`<ul>
<li><b>No es anexo</b> la memoria explicativa ni el informe económico-financiero: esos son <b>documentación</b> que acompaña al presupuesto en el art. 168.1. Es la confusión más frecuente entre ambos artículos.</li>
<li><b>No es anexo</b> la plantilla de personal en cuanto tal; el art. 168.1.c) habla del "anexo de personal" como documentación del art. 168, no del 166.</li>
<li><b>No se aprueban</b> los planes de inversión: se "da cuenta" de ellos al Pleno.</li>
</ul>`,
conex:`<ul>
<li><b>Art. 164:</b> integrantes (100 % capital) frente a anexo del 166.1.b) (mayoritario). Fronteras distintas.</li>
<li><b>Art. 168.4:</b> el presidente remite al Pleno el presupuesto "con los anexos y documentación complementaria detallados en el apartado 1 del artículo 166 y en el presente artículo".</li>
<li><b>Arts. 48 y ss.:</b> régimen de las operaciones de crédito que se reflejan en el anexo de deuda.</li>
</ul>`,
trampas:`<ul>
<li><b>Anexos (art. 166) ≠ documentación (art. 168.1).</b> Si te preguntan "¿qué se une como anexo?", la memoria explicativa NO vale.</li>
<li>El plan de inversiones es a <b>cuatro años</b>, y se <b>revisa anualmente</b> añadiendo un ejercicio: no es un plan cerrado.</li>
<li>Letra b): "titular único <b>o</b> partícipe mayoritario" — más amplio que el art. 164.</li>
<li>La letra a) usa "<b>podrán</b>": el plan de inversiones es potestativo, aunque el anexo esté listado.</li>
</ul>`,
ancla:`<p><b>PICO-D</b> para los cuatro anexos: <b>P</b>lanes de inversión (4 años) · <b>I</b>ndustria municipal (programas de las sociedades) · <b>CO</b>nsolidación · <b>D</b>euda.<br>Imagen absurda que ayuda: un obrero con un <b>pico</b> cavando durante <b>cuatro</b> años para desenterrar la <b>deuda</b>.</p>`,

{n:167,t:"Estructura de los estados de ingresos y gastos",ubic:"Título VI ▸ Cap. I ▸ Sección 1.ª",
idea:"El Ministerio fija el formato: cada euro de gasto se clasifica por finalidad y por naturaleza.",
literal:`<p>1. El Ministerio de Hacienda y Administraciones Públicas establecerá con carácter general la estructura de los presupuestos de las entidades locales teniendo en cuenta la naturaleza económica de los ingresos y de los gastos, las finalidades u objetivos que con estos últimos se propongan conseguir y de acuerdo con los criterios que se establecen en los siguientes apartados de este artículo.</p>
<p>2. Las entidades locales podrán clasificar los gastos e ingresos atendiendo a su propia estructura de acuerdo con sus reglamentos o decretos de organización.</p>
<p>3. Los estados de gastos de los presupuestos generales de las entidades locales aplicarán las clasificaciones por programas y económica de acuerdo con los siguientes criterios:</p>
<p>a) La clasificación por programas que constará de los siguientes niveles: el primero relativo al área de gasto, el segundo a la política de gasto, el tercero a los grupos de programas, que se subdividirán en programas. Esta clasificación podrá ampliarse en más niveles, relativos a subprogramas respectivamente.</p>
<p>En todo caso, y con las peculiaridades que puedan concurrir en el ámbito de las entidades locales, los niveles de área de gasto y de política de gasto se ajustarán a los establecidos para la Administración del Estado.</p>
<p>b) La clasificación económica presentará con separación los gastos corrientes y los gastos de capital, de acuerdo con los siguientes criterios:</p>
<p>En los créditos para gastos corrientes se incluirán los de funcionamiento de los servicios, los de intereses y las transferencias corrientes.</p>
<p>En los créditos para gastos de capital, los de inversiones reales, las transferencias de capital y las variaciones de activos y pasivos financieros.</p>
<p>c) la clasificación económica constará de tres niveles, el primero relativo al capítulo, el segundo al artículo y el tercero al concepto. Esta clasificación podrá ampliarse en uno o dos niveles, relativos al subconcepto y la partida respectivamente.</p>
<p>En todo caso, los niveles de capítulo y artículo habrán de ser los mismos que los establecidos para la Administración del Estado.</p>
<p>4. La aplicación presupuestaria cuya expresión cifrada constituye el crédito presupuestario vendrá definida, al menos, por la conjunción de las clasificaciones por programas y económica, a nivel de grupo de programa o programa y concepto o subconcepto respectivamente.</p>
<p>En el caso de que la entidad local opte por utilizar la clasificación orgánica, ésta integrará asimismo la aplicación presupuestaria.</p>
<p>El control contable de los gastos se realizará sobre la aplicación presupuestaria antes definida y el fiscal sobre el nivel de vinculación determinado conforme dispone el artículo 172 de esta Ley.</p>
<p>5. El Ministerio de Hacienda y Administraciones Públicas establecerá la estructura de la información de los presupuestos, de su ejecución y liquidación, a la que deberán ajustarse todas las entidades locales a efectos del cumplimiento de sus obligaciones de remisión de dicha información.</p>`,
dis:`<ul>
<li><b>Quién manda:</b> el Ministerio de Hacienda fija la estructura con carácter general (hoy, la Orden EHA/3565/2008, que también está en esta biblioteca).</li>
<li><b>Dos clasificaciones obligatorias del gasto:</b> por <b>programas</b> (¿para qué se gasta?) y <b>económica</b> (¿en qué se gasta?).</li>
<li><b>Una tercera, potestativa:</b> la <b>orgánica</b> (¿quién gasta?), según el art. 167.2 y 167.4.</li>
</ul>
<table><thead><tr><th>Clasificación</th><th>Niveles</th><th>Ampliable</th><th>Debe coincidir con el Estado</th></tr></thead><tbody>
<tr><td>Por programas</td><td>Área de gasto ▸ Política de gasto ▸ Grupo de programas ▸ Programa</td><td>Sí: subprogramas</td><td>Área y política de gasto</td></tr>
<tr><td>Económica</td><td>Capítulo ▸ Artículo ▸ Concepto</td><td>Sí: subconcepto y partida (uno o dos niveles)</td><td>Capítulo y artículo</td></tr>
<tr><td>Orgánica</td><td>Según reglamento propio</td><td>—</td><td>No: es potestativa</td></tr>
</tbody></table>
<ul>
<li><b><span class="t" data-k="aplicacion">Aplicación presupuestaria</span> (167.4):</b> como mínimo, grupo de programa o programa <b>+</b> concepto o subconcepto. Si se usa la orgánica, también la integra.</li>
<li><b>Dos controles distintos:</b> el <b>contable</b> se hace sobre la aplicación presupuestaria; el <b>fiscal</b>, sobre el <span class="t" data-k="vinculacion">nivel de vinculación</span> del art. 172.</li>
<li><b>Gasto corriente:</b> funcionamiento de los servicios, intereses y transferencias corrientes. <b>Gasto de capital:</b> inversiones reales, transferencias de capital y variaciones de activos y pasivos financieros.</li>
</ul>`,
llano:`<p>Todo euro de gasto lleva dos etiquetas. Una dice <b>para qué</b> (deporte, alumbrado, seguridad): es la clasificación por programas. Otra dice <b>en qué</b> (sueldos, luz, asfalto, intereses): es la económica. Al juntar las dos etiquetas obtienes la casilla exacta donde vive el dinero, que es la aplicación presupuestaria. Y si el Ayuntamiento quiere, puede añadir una tercera etiqueta: <b>quién</b> lo gasta (concejalía).</p>`,
porque:`<p>Sin una estructura común, cada ayuntamiento clasificaría a su gusto y sería imposible comparar, consolidar ni fiscalizar nada. La doble clasificación responde a dos preguntas que ningún control puede eludir: la <b>económica</b> permite saber si el dinero se va en personal o en obras; la de <b>programas</b> permite saber si la ciudad está priorizando servicios sociales o fiestas. El Estado impone solo los niveles superiores para permitir la comparación agregada, dejando libertad en los inferiores.</p>`,
ej:`<ul>
<li><b>Cotidiano:</b> la lista de la compra de un supermercado. Un producto está a la vez en el pasillo "congelados" (dónde) y en la categoría "alimentación infantil" (para qué). Cruzando ambas etiquetas sabes exactamente qué has comprado.</li>
<li><b>Real:</b> aplicación <b>323/22103</b> del presupuesto de un ayuntamiento: <i>323</i> es el grupo de programa "funcionamiento de centros docentes de enseñanza infantil y primaria" y <i>22103</i> el subconcepto "combustibles y carburantes". El crédito de esa casilla: 42.000 €.</li>
<li><b>Caso límite:</b> si la entidad usa clasificación orgánica, la aplicación pasaría a ser <b>10/323/22103</b>, donde <i>10</i> identifica la Delegación de Educación. La ley lo permite pero no lo impone.</li>
</ul>`,
noej:`<ul>
<li><b>No es libre</b> el nivel de capítulo y artículo: deben ser los mismos que los del Estado. La libertad empieza en el concepto.</li>
<li><b>No</b> se clasifican los ingresos por programas: la clasificación por programas es exclusiva de los <b>estados de gastos</b> (art. 167.3).</li>
<li><b>No</b> coincide aplicación presupuestaria con nivel de vinculación: son cosas distintas y con controles distintos.</li>
</ul>`,
conex:`<ul>
<li><b>Orden EHA/3565/2008</b> (documento 6 de la biblioteca): desarrolla esta estructura con los códigos concretos.</li>
<li><b>Art. 172:</b> define el carácter limitativo y vinculante de los créditos, base del control fiscal.</li>
<li><b>Art. 165.1.a):</b> los créditos deben incluirse "con la debida especificación" — esa especificación es esta estructura.</li>
</ul>`,
trampas:`<ul>
<li>Orden de los niveles económicos: <b>capítulo ▸ artículo ▸ concepto</b> (▸ subconcepto ▸ partida). Un test que ponga "concepto ▸ artículo ▸ capítulo" es falso.</li>
<li>Cuidado con la palabra "artículo": aquí no es un artículo de la ley, es un nivel de la clasificación económica.</li>
<li>La clasificación <b>orgánica es potestativa</b>; las otras dos, obligatorias.</li>
<li>Control <b>contable</b> → aplicación presupuestaria. Control <b>fiscal</b> → nivel de vinculación. Se intercambian mucho en los tests.</li>
</ul>`,
ancla:`<p>Económica: <b>CApitulo · ARtículo · COncepto · SUbconcepto · PArtida</b> → <b>"CA-AR-CO-SU-PA"</b>, suena a trabalenguas y por eso se queda.<br>Programas: <b>Á</b>rea ▸ <b>P</b>olítica ▸ <b>G</b>rupo ▸ <b>P</b>rograma → <i>"Ápaga la luz, Grupo Pequeño"</i>.<br>Y el cruce: <b>programa + concepto = aplicación</b>.</p>`,
vis:`<svg viewBox="0 0 640 260" role="img" aria-label="Las dos clasificaciones del gasto y la aplicación presupuestaria">
<text x="150" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="var(--acc)">POR PROGRAMAS · ¿para qué?</text>

{n:168,t:"Procedimiento de elaboración y aprobación inicial",ubic:"Título VI ▸ Cap. I ▸ Sección 1.ª",
idea:"El presidente lo forma con siete documentos, recoge a sus entes y lo lleva al Pleno.",
literal:`<p>1. El presupuesto de la Entidad Local será formado por su Presidente y a él habrá de unirse la siguiente documentación:</p>
<p>a) Memoria explicativa de su contenido y de las principales modificaciones que presente en relación con el vigente.</p>
<p>b) Liquidación del presupuesto del ejercicio anterior y avance de la del corriente, referida, al menos, a seis meses del ejercicio corriente.</p>
<p>c) Anexo de personal de la Entidad Local.</p>
<p>d) Anexo de las inversiones a realizar en el ejercicio.</p>
<p>e) Anexo de beneficios fiscales en tributos locales conteniendo información detallada de los beneficios fiscales y su incidencia en los ingresos de cada Entidad Local.</p>
<p>f) Anexo con información relativa a los convenios suscritos con las Comunidades Autónomas en materia de gasto social, con especificación de la cuantía de las obligaciones de pago y de los derechos económicos que se deben reconocer en el ejercicio al que se refiere el presupuesto general y de las obligaciones pendientes de pago y derechos económicos pendientes de cobro, reconocidos en ejercicios anteriores, así como de la aplicación o partida presupuestaria en la que se recogen, y la referencia a que dichos convenios incluyen la cláusula de retención de recursos del sistema de financiación a la que se refiere el artículo 57 bis de la Ley 7/1985, de 2 de abril, reguladora de las Bases del Régimen Local.</p>
<p>g) Un informe económico-financiero, en el que se expongan las bases utilizadas para la evaluación de los ingresos y de las operaciones de crédito previstas, la suficiencia de los créditos para atender el cumplimiento de las obligaciones exigibles y los gastos de funcionamiento de los servicios y, en consecuencia, la efectiva nivelación del presupuesto.</p>
<p>2. El presupuesto de cada uno de los organismos autónomos integrantes del general, propuesto inicialmente por el órgano competente de aquéllos, será remitido a la Entidad Local de la que dependan antes del 15 de septiembre de cada año, acompañado de la documentación detallada en el apartado anterior.</p>
<p>3. Las sociedades mercantiles, incluso de aquellas en cuyo capital sea mayoritaria la participación de la Entidad Local, remitirán a ésta, antes del día 15 de septiembre de cada año, sus previsiones de gastos e ingresos, así como los programas anuales de actuación, inversiones y financiación para el ejercicio siguiente.</p>
<p>4. Sobre la base de los presupuestos y estados de previsión a que se refieren los apartados anteriores, el presidente de la entidad formará el presupuesto general y lo remitirá, informado por la Intervención y con los anexos y documentación complementaria detallados en el apartado 1 del artículo 166 y en el presente artículo, al Pleno de la corporación antes del día 15 de octubre para su aprobación, enmienda o devolución.</p>
<p>5. El acuerdo de aprobación, que será único, habrá de detallar los presupuestos que integran el presupuesto general, no pudiendo aprobarse ninguno de ellos separadamente.</p>`,
dis:`<ul>
<li><b>Sujeto que forma:</b> el <b>Presidente</b> (alcalde o presidente de la diputación). No la Intervención, no el Pleno.</li>
<li><b>Sujeto que informa:</b> la <span class="t" data-k="intervencion">Intervención</span> (informe preceptivo antes de ir al Pleno).</li>
<li><b>Sujeto que decide:</b> el <span class="t" data-k="pleno">Pleno</span>, que puede <b>aprobar, enmendar o devolver</b>.</li>
</ul>
<table><thead><tr><th>Hito</th><th>Quién</th><th>Fecha límite</th></tr></thead><tbody>
<tr><td>Remisión del presupuesto de los organismos autónomos</td><td>Órgano competente del OA</td><td>Antes del <b>15 de septiembre</b></td></tr>
<tr><td>Remisión de previsiones y programas de las sociedades</td><td>Sociedades mercantiles (incluso de capital mayoritario)</td><td>Antes del <b>15 de septiembre</b></td></tr>
<tr><td>Remisión del presupuesto general al Pleno</td><td>Presidente, informado por Intervención</td><td>Antes del <b>15 de octubre</b></td></tr>
</tbody></table>
<p><b>Los siete documentos del art. 168.1:</b></p>
<ol><li>Memoria explicativa</li><li>Liquidación del ejercicio anterior + avance del corriente (al menos <b>seis meses</b>)</li><li>Anexo de personal</li><li>Anexo de inversiones del ejercicio</li><li>Anexo de beneficios fiscales en tributos locales</li><li>Anexo de convenios con CCAA en materia de gasto social</li><li>Informe económico-financiero</li></ol>
<p><b>Apartado 5:</b> acuerdo <b>único</b>, que detalla los presupuestos integrantes; prohibida la aprobación separada.</p>`,
llano:`<p>El alcalde monta el rompecabezas. Antes del 15 de septiembre le llegan las piezas de los patronatos y de las empresas municipales. Con ellas y con siete documentos que explican y justifican las cifras, arma el presupuesto general, se lo pasa al interventor para que lo informe, y antes del 15 de octubre lo pone encima de la mesa del Pleno. El Pleno puede decir sí, cambiarlo o devolvérselo. Lo que no puede es aprobar solo una pieza.</p>`,
porque:`<p>El calendario existe para que el presupuesto pueda estar en vigor el 1 de enero: si trabajas hacia atrás desde el 31 de diciembre, necesitas margen para exposición pública y reclamaciones (art. 169), y por eso el Pleno debe tenerlo el 15 de octubre. La <b>documentación</b> existe porque una cifra sin explicación no es controlable: la memoria dice qué cambia, la liquidación anterior enseña de dónde vienes, el informe económico-financiero acredita que los ingresos previstos son creíbles. Y el <b>acuerdo único</b> evita la trampa de aprobar el presupuesto de la entidad y dejar los de sus entes en el aire.</p>`,
ej:`<ul>
<li><b>Cotidiano:</b> montar un viaje familiar. Cada uno manda sus fechas antes de una fecha tope, tú haces el plan conjunto, se lo enseñas al que lleva las cuentas y luego lo somete a votación de todos. Nadie aprueba "solo su parte".</li>
<li><b>Real:</b> el 10 de septiembre de 2026 el Patronato Municipal de Cultura de Écija remite su presupuesto de 1,2 M€; el 12 de septiembre la empresa municipal de vivienda remite sus previsiones; el 6 de octubre el alcalde, con el informe favorable de la Intervención, remite al Pleno el presupuesto general de 34,8 M€. El Pleno lo aprueba inicialmente el 14 de octubre.</li>
<li><b>Caso límite:</b> el Pleno del 14 de octubre <b>devuelve</b> el presupuesto al presidente. El plazo del 15 de octubre ya está cumplido con la remisión; lo que peligra ahora es la aprobación definitiva del 31 de diciembre, y si no llega, opera la prórroga del art. 169.6.</li>
</ul>`,
noej:`<ul>
<li><b>No forma el presupuesto</b> la Junta de Gobierno Local ni el interventor: lo forma el Presidente.</li>
<li><b>No es aprobación definitiva</b> la del Pleno del art. 168: es <b>aprobación inicial</b>. La definitiva llega en el art. 169.</li>
<li><b>No basta</b> con el avance de liquidación del ejercicio corriente: hace falta también la liquidación del anterior.</li>
</ul>`,
conex:`<ul>
<li><b>Art. 166.1:</b> los anexos que se remiten junto con esta documentación.</li>
<li><b>Art. 169:</b> lo que ocurre después de la aprobación inicial.</li>
<li><b>Art. 165.4:</b> la nivelación que el informe económico-financiero debe acreditar.</li>
<li><b>Art. 57 bis LBRL:</b> citado expresamente en la letra f) sobre convenios de gasto social.</li>
</ul>`,
trampas:`<ul>
<li><b>15 de septiembre / 15 de octubre.</b> Es la pareja de fechas más preguntada. Y ojo: la ley dice "<b>antes del</b> día 15", no "el día 15".</li>
<li>El apartado 3 incluye a las sociedades de capital <b>mayoritario</b> (no solo las del 100 %): más amplio que el art. 164.1.c).</li>
<li>El avance de liquidación se refiere "<b>al menos</b>" a seis meses: es un mínimo, no una cifra exacta.</li>
<li>El Pleno tiene tres salidas: aprobar, <b>enmendar</b> o <b>devolver</b>. Muchos tests omiten una de las tres.</li>
<li>El informe de la <b>Intervención</b> es previo a la remisión al Pleno, no posterior.</li>
</ul>`,
ancla:`<p><b>Los siete documentos — "Mi Liquidación Puede Ir Bien Con Intervención":</b><br>
<b>M</b>emoria · <b>L</b>iquidación y avance · <b>P</b>ersonal · <b>I</b>nversiones · <b>B</b>eneficios fiscales · <b>C</b>onvenios de gasto social · <b>I</b>nforme económico-financiero.</p>
<p><b>Las fechas — "el 15 se repite":</b> 15 de <b>S</b>eptiembre los <b>S</b>atélites (organismos y sociedades) → 15 de <b>O</b>ctubre el pleno <b>O</b>ye al presidente → 31 de diciembre, cierre.</p>`,

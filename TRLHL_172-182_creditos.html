<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>TRLHL · Arts. 172-182 · Los créditos y sus modificaciones</title>
<style>
/* ═══════════════════════════════════════════════════════════════
   SISTEMA DE DISEÑO · "Académico Gamificado" · Bloque II
   Temas 8, 9 y 10 · Auxiliar Administrativo
   ═══════════════════════════════════════════════════════════════ */
:root{
  --fs:16px;

  --bg:#faf9f7;
  --bg-grad:radial-gradient(1100px 560px at 12% -8%, #ede9ff 0%, transparent 55%),
            radial-gradient(850px 460px at 96% 0%, #dcf5ee 0%, transparent 50%);
  --surface:#ffffff;
  --surface-2:#f4f3f0;
  --surface-3:#eceae5;
  --line:#e6e3dc;
  --line-strong:#d4d0c7;

  --ink:#15161c;
  --ink-2:#5d616e;
  --ink-3:#8b8f9c;

  --brand:#5b3df5;
  --brand-2:#7c5cff;
  --brand-soft:#efeaff;
  --brand-ring:rgba(91,61,245,.18);

  --legal:#4338ca;  --legal-bg:#eeecff;
  --ej:#059669;     --ej-bg:#e4f7f0;
  --warn:#c2690a;   --warn-bg:#fdf1de;
  --exc:#dc2626;    --exc-bg:#ffeceb;

  --ok:#16a34a; --ok-soft:#e7f7ec;
  --mid:#eab308; --mid-soft:#fdf6dd;
  --off:#a1a1aa; --off-soft:#f1f1f3;

  --sh-1:0 1px 2px rgba(20,20,30,.04), 0 2px 8px rgba(20,20,30,.04);
  --sh-2:0 2px 6px rgba(20,20,30,.05), 0 12px 28px rgba(20,20,30,.07);
  --sh-3:0 8px 20px rgba(91,61,245,.13), 0 24px 56px rgba(20,20,30,.10);
  --sh-glow:0 0 0 4px var(--brand-ring);

  --r-sm:9px; --r-md:14px; --r-lg:20px; --r-full:999px;

  --f-display:"Segoe UI Variable Display",system-ui,-apple-system,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-legal:ui-serif,Georgia,Cambria,"Times New Roman",serif;
  --f-mono:ui-monospace,"SF Mono","Cascadia Mono","Segoe UI Mono",Menlo,monospace;

  --t-h1:clamp(1.02rem,.95rem + .3vw,1.2rem);
  --t-h2:clamp(1.2rem,1.05rem + .6vw,1.55rem);
  --t-h3:clamp(1rem,.95rem + .25vw,1.12rem);
  --t-sm:.86rem;
  --t-xs:.75rem;

  --e-out:cubic-bezier(.22,1,.36,1);
  --e-spring:cubic-bezier(.34,1.56,.64,1);

  /* ── Compatibilidad con SVG y contenido generado ── */
  --panel:var(--surface);
  --ink2:var(--ink-2);
  --acc:var(--brand);
  --acc-soft:var(--brand-soft);
  --g:var(--ok); --y:var(--mid); --r:var(--exc);
}

html[data-theme="dark"]{
  --bg:#0a0b0f;
  --bg-grad:radial-gradient(1100px 560px at 12% -8%, #1c1740 0%, transparent 55%),
            radial-gradient(850px 460px at 96% 0%, #08302b 0%, transparent 50%);
  --surface:#13151b;
  --surface-2:#1a1d25;
  --surface-3:#232733;
  --line:#262a34;
  --line-strong:#343947;

  --ink:#eceef4;
  --ink-2:#9ba2b3;
  --ink-3:#6e7585;

  --brand:#8b6dff;
  --brand-2:#a78bff;
  --brand-soft:#1e1a3d;
  --brand-ring:rgba(139,109,255,.22);

  --legal:#a5b4fc; --legal-bg:#191b3a;
  --ej:#34d399;    --ej-bg:#0c2a24;
  --warn:#fbbf24;  --warn-bg:#2e2110;
  --exc:#fb7185;   --exc-bg:#331119;

  --ok:#4ade80; --ok-soft:#0e2a19;
  --mid:#facc15; --mid-soft:#2c2610;
  --off:#5b6070; --off-soft:#1c1f27;

  --sh-1:0 1px 2px rgba(0,0,0,.3), 0 2px 8px rgba(0,0,0,.25);
  --sh-2:0 2px 6px rgba(0,0,0,.35), 0 12px 28px rgba(0,0,0,.4);
  --sh-3:0 8px 20px rgba(139,109,255,.2), 0 24px 56px rgba(0,0,0,.5);
}

*,*::before,*::after{box-sizing:border-box}
html{font-size:var(--fs);scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);background-image:var(--bg-grad);
  background-attachment:fixed;background-repeat:no-repeat;
  color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.68;
  -webkit-font-smoothing:antialiased;
  transition:background-color .5s var(--e-out),color .3s;
}
::selection{background:var(--brand);color:#fff}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{font-family:var(--f-display);letter-spacing:-.022em;line-height:1.2}
.num{font-variant-numeric:tabular-nums}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:99px;border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3)}

/* ═══ HEADER ═══ */
header.top{
  position:sticky;top:0;z-index:60;
  background:color-mix(in srgb,var(--surface) 80%,transparent);
  backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);
  border-bottom:1px solid var(--line);
}
.top-in{max-width:1280px;margin:0 auto;padding:.65rem 1.1rem;display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.brandwrap{display:flex;align-items:center;gap:.65rem;min-width:0;flex:1}
.mark{
  width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;
  font-weight:800;font-size:.8rem;letter-spacing:-.02em;text-decoration:none;
  box-shadow:0 4px 14px var(--brand-ring);
  transition:transform .3s var(--e-spring),box-shadow .3s;
}
.mark:hover{transform:rotate(-8deg) scale(1.08);box-shadow:var(--sh-3);text-decoration:none}
.top h1{font-size:var(--t-h1);margin:0;font-weight:800;line-height:1.25;min-width:0}
.top h1 .sub{display:block;font-size:var(--t-xs);color:var(--ink-2);font-weight:500;letter-spacing:0;
  margin-top:.1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tools{margin-left:auto;display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}

button,select,input[type=search]{
  font:inherit;font-size:var(--t-sm);font-weight:600;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:var(--r-sm);padding:.4rem .72rem;cursor:pointer;
  position:relative;overflow:hidden;
  transition:transform .18s var(--e-spring),border-color .2s,background .2s,box-shadow .2s,color .2s;
}
button:hover{transform:translateY(-1.5px);border-color:var(--brand);box-shadow:var(--sh-1)}
button:active{transform:translateY(0) scale(.97)}
button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible{outline:none;box-shadow:var(--sh-glow)}
input[type=search]{min-width:190px;cursor:text;font-weight:500}
input[type=search]:focus{border-color:var(--brand)}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--surface-2);padding:2px;gap:2px}
.seg button{border:0;border-radius:calc(var(--r-sm) - 2px);padding:.32rem .68rem;background:transparent;box-shadow:none}
.seg button:hover{transform:none;background:var(--surface)}
.seg button[aria-pressed="true"]{background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;box-shadow:0 2px 8px var(--brand-ring)}

.ripple{position:absolute;border-radius:50%;transform:scale(0);background:currentColor;opacity:.25;animation:rip .55s linear;pointer-events:none}
@keyframes rip{to{transform:scale(3.4);opacity:0}}

.progress{position:absolute;left:0;bottom:-1px;height:2.5px;width:0;
  background:linear-gradient(90deg,var(--brand),var(--legal),var(--ej));transition:width .1s linear}

/* ═══ LAYOUT ═══ */
.layout{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:270px 1fr;gap:1.8rem;padding:1.4rem 1.1rem 5rem}
main{min-width:0}

/* ═══ SIDEBAR ═══ */
nav.side{
  position:sticky;top:76px;align-self:start;max-height:calc(100vh - 96px);overflow:auto;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:.85rem;box-shadow:var(--sh-1);
}
nav.side h2{font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);
  margin:.5rem .4rem .5rem;font-weight:800}
nav.side h2:first-child{margin-top:.1rem}
nav.side a{
  display:flex;align-items:baseline;gap:.5rem;padding:.36rem .55rem;border-radius:var(--r-sm);
  text-decoration:none;color:var(--ink-2);font-size:var(--t-sm);font-weight:500;
  position:relative;transition:background .22s,color .22s,transform .22s var(--e-out);
}
nav.side a:hover{background:var(--surface-2);color:var(--ink);transform:translateX(3px);text-decoration:none}
nav.side a.on{background:var(--brand-soft);color:var(--brand);font-weight:700}
nav.side a.on::before{content:"";position:absolute;left:-.85rem;top:20%;bottom:20%;width:3px;
  border-radius:0 3px 3px 0;background:var(--brand)}
nav.side a b{color:var(--ink-3);font-weight:800;font-size:var(--t-xs);font-variant-numeric:tabular-nums;flex:none;min-width:1.9em}
nav.side a.on b{color:var(--brand)}
.navtoggle{display:none}

/* ═══ TARJETAS ═══ */
section.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:1.35rem 1.5rem;margin-bottom:1.1rem;box-shadow:var(--sh-1);
  transition:box-shadow .3s var(--e-out),border-color .3s;
}
section.card:hover{box-shadow:var(--sh-2)}
section.card>h2{
  margin:0 0 1rem;font-size:var(--t-h2);font-weight:800;
  display:flex;align-items:center;gap:.6rem;
}
section.card>h2::before{
  content:"";width:4px;height:1.05em;border-radius:99px;flex:none;
  background:linear-gradient(180deg,var(--brand),var(--brand-2));
}

/* ═══ ARTÍCULO ═══ */
.art{scroll-margin-top:86px;padding-top:.4rem}
.art + .art{margin-top:1.6rem;padding-top:1.6rem;border-top:1px dashed var(--line)}
.art h2{display:flex;flex-wrap:wrap;gap:.5rem;align-items:baseline;font-size:var(--t-h3);
  margin:0 0 .25rem;font-weight:800;letter-spacing:-.015em}
.art h2 .num{
  color:var(--brand);font-weight:800;font-family:var(--f-display);
  background:var(--brand-soft);padding:.1rem .5rem;border-radius:var(--r-sm);
  font-size:.92em;letter-spacing:-.02em;
}
.ubic{font-size:var(--t-xs);color:var(--ink-3);margin:0 0 .8rem;font-weight:600;
  letter-spacing:.03em;text-transform:uppercase}

/* ═══ IDEA CLAVE ═══ */
.idea{
  background:linear-gradient(100deg,var(--brand-soft),color-mix(in srgb,var(--brand-soft) 40%,transparent));
  border-left:4px solid var(--brand);border-radius:0 var(--r-md) var(--r-md) 0;
  padding:.75rem 1rem;font-weight:650;margin:.7rem 0 1rem;position:relative;
  font-size:.97rem;line-height:1.55;
}

/* ═══ ACORDEÓN ═══ */
details.panel{
  border:1px solid var(--line);border-radius:var(--r-md);margin:.6rem 0;
  background:var(--surface);overflow:hidden;
  transition:border-color .25s,box-shadow .25s,background .25s;
}
details.panel:hover{border-color:var(--line-strong)}
details.panel[open]{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-ring)}
details.panel>summary{
  cursor:pointer;padding:.62rem .9rem;font-weight:700;font-size:.93rem;
  list-style:none;display:flex;align-items:center;gap:.55rem;
  transition:background .2s,color .2s;
}
details.panel>summary:hover{background:var(--surface-2)}
details.panel[open]>summary{background:var(--brand-soft);color:var(--brand)}
details.panel>summary::-webkit-details-marker{display:none}
details.panel>summary::before{
  content:"";width:16px;height:16px;flex:none;border-radius:5px;
  background:var(--brand-soft);position:relative;transition:transform .3s var(--e-spring),background .25s;
}
details.panel>summary::after{
  content:"";position:absolute;width:0;height:0;margin-left:5px;
  border:4px solid transparent;border-left-color:var(--brand);
  transition:transform .3s var(--e-spring);
}
details.panel[open]>summary::before{background:var(--surface)}
details.panel[open]>summary::after{transform:rotate(90deg) translateX(-1px)}
details.panel .body{padding:.3rem 1rem 1rem;font-size:.95rem;animation:slidein .35s var(--e-out)}
@keyframes slidein{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* ═══ TEXTO LEGAL ═══ */
.legal{
  background:var(--legal-bg);border-left:4px solid var(--legal);
  border-radius:0 var(--r-md) var(--r-md) 0;padding:.85rem 1.05rem;
  font-family:var(--f-legal);font-size:.95rem;line-height:1.7;
}
.legal p{margin:.45rem 0}
.legal .lbl{
  font-family:var(--f-body);font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;
  color:var(--legal);font-weight:800;display:block;margin-bottom:.4rem;
}

/* ═══ CAJAS SEMÁNTICAS ═══ */
.box{
  border-left:4px solid var(--line);border-radius:0 var(--r-md) var(--r-md) 0;
  padding:.72rem .95rem;margin:.65rem 0;font-size:.94rem;
  transition:transform .25s var(--e-out),box-shadow .25s;
}
.box:hover{transform:translateX(3px);box-shadow:var(--sh-1)}
.box.ej{background:var(--ej-bg);border-color:var(--ej)}
.box.warn{background:var(--warn-bg);border-color:var(--warn)}
.box.exc{background:var(--exc-bg);border-color:var(--exc)}
.box .lbl{font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;font-weight:800;
  display:block;margin-bottom:.3rem}
.box.ej .lbl{color:var(--ej)}
.box.warn .lbl{color:var(--warn)}
.box.exc .lbl{color:var(--exc)}

.interp{
  border:1px dashed var(--warn);background:color-mix(in srgb,var(--warn-bg) 45%,transparent);
  border-radius:var(--r-md);padding:.65rem .9rem;font-size:.9rem;margin:.6rem 0;
}
.interp .lbl{font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;color:var(--warn);font-weight:800;display:block}

/* ═══ TABLAS ═══ */
table{width:100%;border-collapse:separate;border-spacing:0;font-size:.9rem;margin:.7rem 0;
  border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
th,td{padding:.5rem .68rem;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
td + td, th + th{border-left:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th{background:var(--surface-2);font-size:var(--t-xs);font-weight:800;letter-spacing:.05em;
  text-transform:uppercase;color:var(--ink-2);position:sticky;top:0}
tbody tr{transition:background .18s}
tbody tr:nth-child(even){background:color-mix(in srgb,var(--surface-2) 45%,transparent)}
tbody tr:hover{background:var(--brand-soft)}
th.sortable{cursor:pointer;user-select:none;transition:color .2s,background .2s}
th.sortable:hover{color:var(--brand);background:var(--brand-soft)}
th.sortable::after{content:" ⇅";color:var(--ink-3);font-size:.7rem}

ul,ol{margin:.5rem 0 .5rem 1.2rem;padding:0}
li{margin:.26rem 0}
li::marker{color:var(--brand);font-weight:700}

/* ═══ TOOLTIPS ═══ */
.t{border-bottom:1.5px dotted var(--brand);cursor:help;position:relative;
  transition:background .2s,color .2s}
.t:hover{background:var(--brand-soft);color:var(--brand);border-radius:3px}
#tip{
  position:fixed;z-index:99;max-width:330px;background:var(--ink);color:var(--bg);
  padding:.6rem .78rem;border-radius:var(--r-md);font-size:.82rem;line-height:1.5;
  display:none;box-shadow:0 8px 30px rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.08);
}
html[data-theme="dark"] #tip{background:#f0f1f5;color:#15161c}

/* ═══ FLECHAS DE DIAGRAMA ═══
   Un <path> con stroke pero sin fill toma el valor inicial (negro) y el
   navegador cierra el trazo implícitamente: aparece un triángulo relleno
   entre sus extremos. Forzamos fill:none para dejar solo la línea + la
   punta del <marker>, que sí lleva su color. */
svg path[stroke]:not([fill]){fill:none}
svg polyline:not([fill]){fill:none}
svg line{fill:none}

/* ═══ SVG ═══ */
svg{max-width:100%;height:auto;display:block;margin:.9rem auto}
svg text{font-family:var(--f-body)}

/* ═══ BUSCADOR ═══ */
mark.hit{background:linear-gradient(180deg,transparent 55%,#ffe066 55%);color:inherit;
  border-radius:2px;padding:0 1px;font-weight:600}
html[data-theme="dark"] mark.hit{background:linear-gradient(180deg,transparent 55%,#8a6d00 55%);color:#fff}

/* ═══ UTILIDADES ═══ */
.hide{display:none !important}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.small{font-size:var(--t-sm);color:var(--ink-2)}
.chip{
  display:inline-block;font-size:var(--t-xs);padding:.16rem .55rem;border-radius:var(--r-full);
  background:var(--brand-soft);color:var(--brand);font-weight:800;letter-spacing:.02em;
}

/* ═══ HUECOS RELLENABLES ═══ */
.gap{
  display:inline-block;min-width:5.5em;border-bottom:2px solid var(--brand);
  text-align:center;font-weight:700;color:transparent;cursor:pointer;
  transition:color .3s,background .3s;
}
.gap.on,.gap:hover{color:var(--brand);background:var(--brand-soft);border-radius:4px 4px 0 0}

/* ═══ REVELAR SOLUCIÓN ═══ */
.revelar{
  background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;border-color:transparent;
  font-weight:700;
}
.revelar:hover{box-shadow:var(--sh-3)}
.sol{
  margin-top:.7rem;padding:.8rem 1rem;border-radius:var(--r-md);
  background:var(--ej-bg);border-left:4px solid var(--ej);
  animation:slidein .4s var(--e-out);
}

/* ═══ TEST ═══ */
.opt{
  display:block;padding:.55rem .85rem;margin:.35rem 0;border:1.5px solid var(--line);
  border-radius:var(--r-md);cursor:pointer;background:var(--surface);font-size:.94rem;
  transition:border-color .22s,background .22s,transform .22s var(--e-out);
}
.opt:hover{border-color:var(--brand);background:var(--brand-soft);transform:translateX(4px)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft);font-weight:650}
.opt.ko{border-color:var(--exc);background:var(--exc-bg)}
.opt input{margin-right:.5rem;accent-color:var(--brand)}

#tscore,#semres{
  font-family:var(--f-display);font-weight:800;font-size:1.15rem;letter-spacing:-.02em;
}

/* ═══════════════════════════════════════════════════════════════
   FLASHCARDS 3D · mazo con giro, vuelo de salida y sheen
   ═══════════════════════════════════════════════════════════════ */
#flash{--fc-e:cubic-bezier(.2,.8,.25,1);--fc-h:250px}

/* — Escena — */
.fc-stage{
  perspective:1400px;perspective-origin:50% 45%;
  padding:.4rem 0 .2rem;position:relative;
}
.fc-deck{position:relative;height:var(--fc-h);will-change:transform}

/* — Cartas fantasma del mazo — */
.fc-ghost{
  position:absolute;inset:0;border-radius:var(--r-lg);
  background:var(--surface);border:1px solid var(--line);
  transition:transform .5s var(--fc-e),opacity .5s var(--fc-e);
}
.fc-ghost.g1{transform:translateY(9px) scale(.972);opacity:.75}
.fc-ghost.g2{transform:translateY(18px) scale(.944);opacity:.45}
.fc-deck.empty .fc-ghost{opacity:0;transform:translateY(26px) scale(.9)}

/* — Elevación durante el giro — */
.fc-lift{position:absolute;inset:0;transform-style:preserve-3d}
.fc-lift.lift{animation:fcLift .78s var(--fc-e)}
@keyframes fcLift{
  0%,100%{transform:scale(1) translateY(0)}
  45%{transform:scale(1.055) translateY(-16px)}
}
.fc-lift.out-ok{animation:fcOut .5s cubic-bezier(.5,0,.75,0) forwards}
.fc-lift.out-ko{animation:fcOutKo .5s cubic-bezier(.5,0,.75,0) forwards}
.fc-lift.in{animation:fcIn .48s var(--fc-e)}
@keyframes fcOut{
  0%{transform:translateX(0) rotate(0) scale(1);opacity:1}
  100%{transform:translateX(130%) rotate(17deg) scale(.85);opacity:0}
}
@keyframes fcOutKo{
  0%{transform:translateX(0) rotate(0) scale(1);opacity:1}
  100%{transform:translateX(-130%) rotate(-17deg) scale(.85);opacity:0}
}
@keyframes fcIn{
  0%{transform:translateY(26px) scale(.9);opacity:0}
  100%{transform:translateY(0) scale(1);opacity:1}
}

/* — La carta — */
.fc-card{
  position:absolute;inset:0;transform-style:preserve-3d;
  transition:transform .78s var(--fc-e);
  cursor:pointer;border-radius:var(--r-lg);
}
.fc-card:focus-visible{outline:none}
.fc-card:focus-visible .fc-face{box-shadow:var(--sh-glow),var(--sh-2)}

/* — Caras — */
.fc-face{
  position:absolute;inset:0;border-radius:var(--r-lg);
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  padding:2rem 2.2rem;text-align:center;overflow:hidden;
  box-shadow:var(--sh-2);
  transition:box-shadow .4s var(--fc-e);
}
.fc-card:hover .fc-face{box-shadow:var(--sh-3)}

/* Anverso · pregunta */
.fc-front{
  background:
    radial-gradient(120% 90% at 50% -20%, var(--brand-soft) 0%, transparent 60%),
    var(--surface);
  border:1.5px solid var(--line);color:var(--ink);
}
/* Reverso · respuesta */
.fc-back{
  transform:rotateY(180deg);
  background:linear-gradient(145deg,var(--brand) 0%,#6d4bf7 45%,var(--c5,#0891b2) 130%);
  border:1.5px solid transparent;color:#fff;
}
html[data-theme="dark"] .fc-back{
  background:linear-gradient(145deg,#5f45c9 0%,#4b3aa8 45%,#0e6b85 130%);
}
.fc-back .fc-txt{color:#fff}
.fc-back b,.fc-back strong{color:#fff;font-weight:800}

/* — Sheen que barre al girar — */
.fc-face::after{
  content:"";position:absolute;top:-60%;left:-70%;width:55%;height:220%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.42),transparent);
  transform:rotate(18deg);opacity:0;pointer-events:none;
}
.fc-lift.lift .fc-face::after{animation:fcSheen .78s var(--fc-e)}
@keyframes fcSheen{
  0%{opacity:0;left:-70%}
  35%{opacity:1}
  100%{opacity:0;left:150%}
}

/* — Etiqueta superior — */
.fc-tag{
  position:absolute;top:1rem;left:1.15rem;
  font-size:var(--t-xs);font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  display:inline-flex;align-items:center;gap:.4rem;
}
.fc-front .fc-tag{color:var(--brand)}
.fc-back .fc-tag{color:rgba(255,255,255,.9)}
.fc-tag::before{
  content:"";width:7px;height:7px;border-radius:50%;background:currentColor;
  animation:fcPulse 2.2s ease-in-out infinite;
}
@keyframes fcPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.65)}}

/* — Índice tipo naipe — */
.fc-pip{
  position:absolute;font-family:var(--f-display);font-weight:800;
  font-size:.78rem;letter-spacing:-.02em;opacity:.34;font-variant-numeric:tabular-nums;
}
.fc-pip.tr{top:1rem;right:1.15rem}
.fc-pip.bl{bottom:1rem;left:1.15rem;transform:rotate(180deg)}
.fc-front .fc-pip{color:var(--ink-2)}
.fc-back .fc-pip{color:#fff;opacity:.55}

/* — Texto — */
.fc-txt{
  font-size:clamp(1rem,.9rem + .55vw,1.28rem);font-weight:650;line-height:1.5;
  max-width:44ch;letter-spacing:-.012em;
}
.fc-front .fc-txt{font-family:var(--f-display);font-weight:700}
.fc-back .fc-txt{font-weight:600;line-height:1.6}
.fc-hint{
  position:absolute;bottom:1rem;left:0;right:0;
  font-size:var(--t-xs);font-weight:600;letter-spacing:.02em;
  display:flex;align-items:center;justify-content:center;gap:.4rem;
}
.fc-front .fc-hint{color:var(--ink-3)}
.fc-back .fc-hint{color:rgba(255,255,255,.72)}
.fc-hint .kbd{
  font-family:var(--f-mono);font-size:.68rem;font-weight:700;padding:.1rem .32rem;
  border-radius:5px;border:1px solid currentColor;opacity:.75;
}

/* — Pantalla final — */
.fc-done{
  position:absolute;inset:0;border-radius:var(--r-lg);
  background:linear-gradient(150deg,var(--ok-soft),var(--surface) 70%);
  border:1.5px solid var(--ok);
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  text-align:center;padding:2rem;gap:.35rem;
  animation:fcIn .5s var(--fc-e);box-shadow:var(--sh-2);
}
.fc-done .seal{
  font-size:2.6rem;line-height:1;
  animation:fcSeal .7s cubic-bezier(.2,1.5,.4,1);
}
@keyframes fcSeal{0%{transform:scale(0) rotate(-25deg);opacity:0}60%{transform:scale(1.2) rotate(6deg)}100%{transform:scale(1) rotate(0);opacity:1}}
.fc-done h3{font-size:1.3rem;font-weight:800;margin:.2rem 0 0}
.fc-done p{margin:0;color:var(--ink-2);font-size:var(--t-sm)}

/* — Barra de progreso de la ronda — */
.fc-bar{
  height:6px;border-radius:99px;background:var(--surface-3);
  overflow:hidden;margin:.95rem 0 .8rem;position:relative;
}
.fc-bar i{
  display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--brand),var(--c5,#0891b2));
  transition:width .55s var(--fc-e);
}

/* — Controles — */
.fc-ctrls{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.fc-ctrls button{font-weight:700}
#fcok{border-color:var(--ok);color:var(--ok)}
#fcok:hover{background:var(--ok);color:#fff;border-color:var(--ok)}
#fcko{border-color:var(--warn);color:var(--warn)}
#fcko:hover{background:var(--warn);color:#fff;border-color:var(--warn)}
#fcflip{background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;border-color:transparent}
#fcflip:hover{box-shadow:var(--sh-3)}

.fc-score{display:inline-flex;gap:.45rem;margin-left:auto;align-items:center}
.fc-pill{
  font-size:var(--t-xs);font-weight:800;padding:.24rem .6rem;border-radius:var(--r-full);
  font-variant-numeric:tabular-nums;border:1px solid;
}
.fc-pill.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.fc-pill.ko{color:var(--warn);border-color:var(--warn);background:var(--warn-bg)}
.fc-pill.left{color:var(--ink-2);border-color:var(--line);background:var(--surface-2)}
.fc-pill.bump{animation:fcBump .45s var(--e-spring)}
@keyframes fcBump{0%{transform:scale(1)}45%{transform:scale(1.28)}100%{transform:scale(1)}}

@media(max-width:620px){
  #flash{--fc-h:270px}
  .fc-face{padding:1.7rem 1.3rem}
  .fc-score{margin-left:0;width:100%}
}
@media(prefers-reduced-motion:reduce){
  .fc-card{transition:none}
  .fc-lift.lift,.fc-lift.in,.fc-lift.out-ok,.fc-lift.out-ko,.fc-face::after{animation:none !important}
}
@media print{.fc-stage,.fc-ctrls,.fc-bar{display:none !important}}
/* ═══ RESPUESTA ESTRUCTURADA ═══ */
.fc-face{justify-content:center}
.fc-face.struct{justify-content:flex-start;text-align:left;padding-top:3.1rem;padding-bottom:3.1rem}
.fc-body{
  width:100%;max-width:46ch;margin:0 auto;
  overflow-y:auto;max-height:100%;
  scrollbar-width:thin;
}
.fc-body::-webkit-scrollbar{width:5px}
.fc-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.35);border-radius:99px;border:0}
.fc-front .fc-body::-webkit-scrollbar-thumb{background:var(--line-strong)}

/* — Veredicto Sí / No — */
.fc-verdict{
  display:inline-flex;align-items:center;gap:.35rem;
  font-family:var(--f-display);font-weight:800;font-size:.82rem;
  letter-spacing:.06em;text-transform:uppercase;
  padding:.26rem .72rem;border-radius:var(--r-full);margin-bottom:.85rem;
  border:1.5px solid;animation:fcPopIn .45s var(--e-spring) backwards;animation-delay:.34s;
}
.fc-verdict.si{background:rgba(255,255,255,.16);border-color:rgba(190,255,215,.85);color:#d8ffe9}
.fc-verdict.no{background:rgba(255,255,255,.16);border-color:rgba(255,205,205,.85);color:#ffdedd}
@keyframes fcPopIn{0%{opacity:0;transform:scale(.7) translateY(6px)}100%{opacity:1;transform:none}}

/* — Párrafo — */
.fc-p{margin:0;font-size:clamp(1rem,.92rem + .45vw,1.2rem);font-weight:600;line-height:1.6}
.fc-face.struct .fc-p{font-size:clamp(.96rem,.9rem + .35vw,1.1rem)}

/* — Lista enumerada — */
.fc-list{list-style:none;margin:0;padding:0;display:grid;gap:.5rem;counter-reset:fc}
.fc-list li{
  counter-increment:fc;position:relative;margin:0;
  padding:.42rem .6rem .42rem 2.5rem;border-radius:var(--r-sm);
  background:rgba(255,255,255,.11);
  font-size:clamp(.92rem,.88rem + .3vw,1.04rem);font-weight:600;line-height:1.45;
  animation:fcRow .42s var(--e-out) backwards;
}
.fc-list li::before{
  content:counter(fc);position:absolute;left:.6rem;top:50%;transform:translateY(-50%);
  width:1.6rem;height:1.6rem;border-radius:50%;
  display:grid;place-items:center;
  background:rgba(255,255,255,.9);color:var(--brand);
  font-family:var(--f-display);font-weight:800;font-size:.78rem;
  font-variant-numeric:tabular-nums;
}
.fc-list.alpha li::before{content:counter(fc,lower-alpha)}
.fc-list li:nth-child(1){animation-delay:.36s}
.fc-list li:nth-child(2){animation-delay:.42s}
.fc-list li:nth-child(3){animation-delay:.48s}
.fc-list li:nth-child(4){animation-delay:.54s}
.fc-list li:nth-child(5){animation-delay:.60s}
.fc-list li:nth-child(n+6){animation-delay:.66s}
@keyframes fcRow{0%{opacity:0;transform:translateX(-12px)}100%{opacity:1;transform:none}}

/* — Cláusulas contrapuestas — */
.fc-clauses{display:grid;gap:.45rem}
.fc-clauses p{
  margin:0;padding:.45rem .7rem .45rem .95rem;border-radius:0 var(--r-sm) var(--r-sm) 0;
  background:rgba(255,255,255,.11);border-left:3px solid rgba(255,255,255,.55);
  font-size:clamp(.92rem,.88rem + .3vw,1.04rem);font-weight:600;line-height:1.5;
  animation:fcRow .42s var(--e-out) backwards;
}
.fc-clauses p:nth-child(1){animation-delay:.36s}
.fc-clauses p:nth-child(2){animation-delay:.44s}
.fc-clauses p:nth-child(3){animation-delay:.52s}

/* — Negritas resaltadas en el reverso — */
.fc-back .fc-body b,.fc-back .fc-body strong{
  font-weight:800;background:rgba(255,255,255,.2);
  padding:.03em .3em;border-radius:5px;
  box-decoration-break:clone;-webkit-box-decoration-break:clone;
}

/* — Cita legal al pie — */
.fc-cite{
  position:absolute;bottom:.95rem;left:0;right:0;
  display:inline-flex;align-items:center;justify-content:center;gap:.4rem;
  font-family:var(--f-mono);font-size:.74rem;font-weight:700;letter-spacing:.02em;
  color:rgba(255,255,255,.82);
  animation:fcPopIn .5s var(--e-out) backwards;animation-delay:.5s;
}
.fc-cite::before,.fc-cite::after{
  content:"";height:1px;width:clamp(18px,10%,52px);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.45));
}
.fc-cite::after{background:linear-gradient(90deg,rgba(255,255,255,.45),transparent)}
.fc-cite .s{font-size:.9rem;opacity:.75;font-family:var(--f-legal)}
.fc-front .fc-cite{color:var(--ink-3)}
.fc-front .fc-cite::before{background:linear-gradient(90deg,transparent,var(--line-strong))}
.fc-front .fc-cite::after{background:linear-gradient(90deg,var(--line-strong),transparent)}

/* la pista se oculta si hay cita, para no amontonar */
.fc-back .fc-cite ~ .fc-hint,.fc-back .fc-hint.muted{display:none}

@media(max-width:620px){
  #flash{--fc-h:320px}
  .fc-face.struct{padding-top:2.9rem;padding-bottom:2.8rem}
  .fc-list li{padding-left:2.3rem}
}
@media(prefers-reduced-motion:reduce){
  .fc-verdict,.fc-list li,.fc-clauses p,.fc-cite{animation:none !important}
}

/* ═══ SEMÁFORO ═══ */
.sembtn{
  border-radius:var(--r-full);padding:.32rem .7rem;font-weight:700;font-size:var(--t-sm);
}
.sembtn[data-v="g"]:hover,.sembtn.on[data-v="g"]{background:var(--ok);color:#fff;border-color:var(--ok)}
.sembtn[data-v="y"]:hover,.sembtn.on[data-v="y"]{background:var(--mid);color:#3d2f00;border-color:var(--mid)}
.sembtn[data-v="r"]:hover,.sembtn.on[data-v="r"]{background:var(--exc);color:#fff;border-color:var(--exc)}

/* ═══ CTA DE BLOQUE ═══ */
a.blk{
  display:inline-flex;align-items:center;gap:.5rem;
  background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;
  padding:.5rem .95rem;border-radius:var(--r-sm);font-weight:700;font-size:var(--t-sm);
  text-decoration:none;box-shadow:0 2px 10px var(--brand-ring);
  transition:transform .22s var(--e-spring),box-shadow .25s,gap .25s var(--e-out);
}
a.blk:hover{transform:translateY(-2px);box-shadow:var(--sh-3);gap:.75rem;text-decoration:none}
a.blk::after{content:"→"}
a.blk:active{transform:translateY(0) scale(.98)}

/* ═══ REVEAL ═══ */
.rv{opacity:0;transform:translateY(20px);transition:opacity .6s var(--e-out),transform .6s var(--e-out)}
.rv.in{opacity:1;transform:none}

/* ═══ RESPONSIVE ═══ */
@media(max-width:960px){
  .layout{grid-template-columns:1fr;padding-top:.9rem;gap:1rem}
  nav.side{position:static;max-height:none}
  nav.side.collapsed .navbody{display:none}
  .navtoggle{display:block;width:100%;text-align:left;font-weight:700}
  .grid2{grid-template-columns:1fr}
  .top h1 .sub{white-space:normal}
}
@media(max-width:620px){
  .top-in{padding:.55rem .8rem}
  .tools{width:100%;margin-left:0}
  input[type=search]{flex:1;min-width:0}
  section.card{padding:1.05rem 1rem;border-radius:var(--r-md)}
  table{font-size:.82rem}
  th,td{padding:.4rem .5rem}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
  .rv{opacity:1;transform:none}
}
@media print{
  header.top,nav.side,.tools,.noprint,.progress{display:none !important}
  body{background:#fff;background-image:none;font-size:11pt;color:#000}
  .layout{display:block;max-width:none;padding:0}
  section.card{border:0;padding:0;margin:0 0 1rem;break-inside:avoid;box-shadow:none}
  details.panel{border:0;box-shadow:none}
  details.panel .body{display:block !important}
  details.panel>summary{padding-left:0}
  .art{break-inside:avoid}
  .rv{opacity:1;transform:none}
  a{color:#000;text-decoration:none}
}


/* ═══ ALTURA ADAPTATIVA DE LA TARJETA ═══ */
.fc-deck{transition:height .45s var(--fc-e)}
.fc-body{max-height:none;overflow:visible}
.fc-measure{
  position:absolute;left:0;right:0;top:0;height:auto;
  visibility:hidden;pointer-events:none;z-index:-1;
}
.fc-measure .fc-face{
  position:relative;inset:auto;height:auto;min-height:0;
  box-shadow:none;backface-visibility:visible;transform:none;
}
.fc-measure .fc-body{max-height:none;overflow:visible}
.fc-measure .fc-face::after{display:none}

/* ═══ MOSTRAR / OCULTAR ÍNDICE LATERAL ═══ */
.layout{transition:grid-template-columns .42s var(--e-out)}
.layout.nonav{grid-template-columns:0 1fr;gap:0}
.layout.nonav>nav.side{
  opacity:0;transform:translateX(-14px);pointer-events:none;
  padding:0;border-width:0;overflow:hidden;width:0;min-width:0;
}
nav.side{
  transition:opacity .3s var(--e-out),transform .38s var(--e-out);
  overflow-x:hidden;
}
#navhide .ic{display:inline-block;transition:transform .35s var(--e-spring);font-size:.95em;line-height:1}
#navhide[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
#navhide[aria-pressed="true"] .ic{transform:rotate(90deg)}
@media(max-width:960px){#navhide{display:none}}

/* ═══════════════════════════════════════════════════════════════
   LECTURA EN VOZ ALTA (TTS) del texto legal
   ═══════════════════════════════════════════════════════════════ */
.tts-bar{
  display:flex;align-items:center;gap:.45rem;flex-wrap:wrap;
  margin:.15rem 0 .7rem;
}
.tts-bar button{
  font-size:var(--t-xs);font-weight:700;padding:.3rem .62rem;
  border-radius:var(--r-full);border:1px solid var(--legal);
  background:transparent;color:var(--legal);
  display:inline-flex;align-items:center;gap:.35rem;line-height:1.2;
}
.tts-bar button:hover{background:var(--legal);color:var(--surface);border-color:var(--legal)}
.tts-bar button[hidden]{display:none}
.tts-bar .tts-play.on{background:var(--legal);color:var(--surface)}

/* Ondas de audio mientras lee */
.tts-wave{display:inline-flex;align-items:flex-end;gap:2px;height:11px}
.tts-wave i{
  width:2.5px;background:currentColor;border-radius:2px;height:35%;
  animation:ttsW .9s ease-in-out infinite;
}
.tts-wave i:nth-child(2){animation-delay:.15s}
.tts-wave i:nth-child(3){animation-delay:.3s}
.tts-wave i:nth-child(4){animation-delay:.45s}
@keyframes ttsW{0%,100%{height:32%}50%{height:100%}}

.tts-time{
  font-family:var(--f-mono);font-size:.7rem;font-weight:700;
  color:var(--ink-3);font-variant-numeric:tabular-nums;
}

/* Frase que se está leyendo */
.tts-s{transition:background .25s,color .25s;border-radius:3px}
.tts-s.now{
  background:linear-gradient(180deg,transparent 8%,color-mix(in srgb,var(--legal) 26%,transparent) 8%);
  box-shadow:0 0 0 2px color-mix(in srgb,var(--legal) 16%,transparent);
}
html[data-theme="dark"] .tts-s.now{
  background:linear-gradient(180deg,transparent 8%,color-mix(in srgb,var(--legal) 34%,transparent) 8%);
}
.legal.tts-on{box-shadow:0 0 0 3px color-mix(in srgb,var(--legal) 20%,transparent)}

/* ═══ Reproductor flotante ═══ */
.tts-mini{
  position:fixed;left:50%;bottom:1.1rem;transform:translateX(-50%) translateY(140%);
  z-index:80;display:flex;align-items:center;gap:.6rem;
  background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  border:1px solid var(--line);border-radius:var(--r-full);
  padding:.5rem .7rem .5rem .95rem;box-shadow:var(--sh-3);
  transition:transform .45s var(--e-spring),opacity .3s;opacity:0;pointer-events:none;
  max-width:min(94vw,540px);
}
.tts-mini.show{transform:translateX(-50%) translateY(0);opacity:1;pointer-events:auto}
.tts-mini .lbl{
  font-size:var(--t-xs);font-weight:800;color:var(--legal);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:16ch;
}
.tts-mini button{
  border-radius:50%;width:32px;height:32px;padding:0;display:grid;place-items:center;
  font-size:.8rem;border:1px solid var(--line);flex:none;
}
.tts-mini button.main{
  width:38px;height:38px;font-size:.95rem;
  background:linear-gradient(140deg,var(--legal),var(--brand));color:#fff;border-color:transparent;
}
.tts-mini .bar{
  flex:1;min-width:70px;height:5px;border-radius:99px;background:var(--surface-3);overflow:hidden;
}
.tts-mini .bar i{display:block;height:100%;width:0;background:var(--legal);
  border-radius:99px;transition:width .35s var(--e-out)}

/* ═══ Panel de ajustes de voz ═══ */
.tts-back{
  position:fixed;inset:0;z-index:90;background:rgba(10,10,18,.45);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  display:grid;place-items:center;padding:1rem;
  opacity:0;pointer-events:none;transition:opacity .3s var(--e-out);
}
.tts-back.show{opacity:1;pointer-events:auto}
.tts-panel{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--sh-3);width:min(94vw,470px);max-height:88vh;overflow:auto;
  padding:1.3rem 1.4rem;transform:translateY(16px) scale(.97);
  transition:transform .38s var(--e-spring);
}
.tts-back.show .tts-panel{transform:none}
.tts-panel h3{
  font-size:1.12rem;font-weight:800;margin:0 0 .25rem;
  display:flex;align-items:center;gap:.5rem;
}
.tts-panel .sub{font-size:var(--t-sm);color:var(--ink-2);margin:0 0 1.1rem}
.tts-row{margin-bottom:1.05rem}
.tts-row > label{
  display:block;font-size:var(--t-xs);font-weight:800;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-2);margin-bottom:.4rem;
}
.tts-seg{display:flex;gap:3px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:3px}
.tts-seg button{
  flex:1;border:0;background:transparent;border-radius:calc(var(--r-sm) - 3px);
  padding:.42rem .3rem;font-size:var(--t-sm);font-weight:700;box-shadow:none;
}
.tts-seg button:hover{transform:none;background:var(--surface)}
.tts-seg button[aria-pressed="true"]{
  background:linear-gradient(140deg,var(--legal),var(--brand));color:#fff;
}
.tts-panel select{
  width:100%;padding:.5rem .6rem;border-radius:var(--r-sm);
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  font-size:var(--t-sm);font-weight:600;cursor:pointer;
}

<script>
const GLOSARIO={
 "presupuesto":"Documento contable y jurídico, aprobado por el Pleno, que fija el techo de gasto de un ejercicio y estima los ingresos con los que se financia. Ej.: el presupuesto de Utrera para 2026 autoriza gastar como máximo 78 M€.",
 "credito":"Crédito presupuestario: la cantidad máxima de dinero autorizada para una finalidad concreta. Ej.: 120.000 € en la aplicación de 'mantenimiento de colegios'.",
 "obligacion":"Obligación reconocida: la deuda que el Ayuntamiento admite formalmente que debe pagar, una vez comprobado que el servicio o suministro se ha prestado. Ej.: aprobada la factura del proveedor, nace la obligación.",
 "derecho":"Derecho liquidado: el importe concreto que un tercero debe a la entidad local, una vez cuantificado. Ej.: liquidado el IBI de un inmueble en 340 €, ese es el derecho.",
 "oa":"Organismo autónomo: ente con personalidad jurídica propia creado por la entidad local para gestionar un servicio (patronatos de deportes, de cultura, gerencias de urbanismo). Depende del Ayuntamiento pero tiene su propio presupuesto.",
 "sociedad":"Sociedad mercantil local: empresa con forma de S.A. o S.L. cuyo capital pertenece a la entidad local (p. ej. la empresa municipal de aguas). No aprueba 'presupuesto', sino estados de previsión de gastos e ingresos.",
 "bases":"Bases de ejecución: el 'reglamento de uso' del presupuesto. Adaptan las normas presupuestarias generales a la organización concreta de la entidad. Ej.: fijan qué órgano autoriza gastos de hasta 3.000 €.",
 "estabilidad":"Estabilidad presupuestaria: exigencia de que las cuentas públicas no incurran en déficit estructural. Ej.: un ayuntamiento no puede presupuestar más gasto no financiero que ingresos no financieros.",
 "afectacion":"No afectación: regla general de que todos los ingresos financian todo el gasto, sin que un ingreso concreto quede reservado a un gasto concreto. Ej.: lo recaudado por el IBI no está reservado a pagar el alumbrado.",
 "bruto":"Principio de presupuesto bruto (o de integridad): derechos y obligaciones se anotan por su importe total, sin compensar unos con otros. Ej.: no se puede anotar la subvención 'ya descontados' los gastos del programa.",
 "nivelacion":"Nivelación presupuestaria: que el total de ingresos previstos cubra el total de gastos autorizados; es decir, aprobar sin déficit inicial.",
 "aplicacion":"Aplicación presupuestaria: la 'casilla' exacta donde vive cada euro de gasto, formada al cruzar la clasificación por programas con la económica. Ej.: 323/22103 (funcionamiento de centros docentes / combustibles).",
 "vinculacion":"Nivel de vinculación jurídica: el nivel de agregación en el que el crédito es realmente limitativo; por debajo de él se puede mover el gasto sin tramitar una modificación de crédito (art. 172 TRLHL).",
 "intervencion":"Intervención: el órgano de control interno de la entidad local, con función de fiscalización previa del gasto y de informe preceptivo del presupuesto. Lo desempeña un funcionario de habilitación nacional.",
 "pleno":"Pleno: órgano colegiado formado por todos los concejales o diputados. Es el único competente para aprobar el presupuesto.",
 "bop":"Boletín Oficial de la Provincia: diario oficial donde las entidades locales publican sus anuncios y acuerdos con efectos frente a terceros.",
 "prorroga":"Prórroga presupuestaria: si el 1 de enero no ha entrado en vigor el presupuesto nuevo, sigue rigiendo automáticamente el anterior con sus créditos iniciales.",
 "interesado":"Interesado: quien está legitimado para intervenir en un procedimiento. En el presupuesto, la ley define expresamente quiénes lo son (art. 170.1).",
 "liquidacion":"Liquidación del presupuesto: cierre contable del ejercicio, que determina los derechos y obligaciones pendientes, el remanente de tesorería y el resultado presupuestario.",
 "tcuentas":"Tribunal de Cuentas: órgano fiscalizador externo de las cuentas y la gestión económica del sector público, dependiente de las Cortes Generales.",
 "conten":"Recurso contencioso-administrativo: impugnación ante los juzgados y tribunales de lo contencioso-administrativo, es decir, ya fuera de la propia Administración.",
 "limitativo":"Carácter limitativo del crédito: no se puede gastar ni un euro por encima de lo autorizado. Ej.: si la aplicación de asfaltado tiene 200.000 €, no cabe comprometer 210.000 €.","plurianual":"Gasto plurianual: compromiso que se extiende a ejercicios futuros. Ej.: un contrato de limpieza viaria de cuatro años.","remanente":"Remanente líquido de tesorería: el sobrante financiero resultante de la liquidación del ejercicio, calculado como fondos líquidos más derechos pendientes de cobro menos obligaciones pendientes de pago, ajustado por dudoso cobro y desviaciones.","ce":"Crédito extraordinario: modificación que crea un crédito que NO existía en el presupuesto. Ej.: no hay ninguna partida para indemnizar una expropiación y hay que crearla.","sc":"Suplemento de crédito: modificación que aumenta un crédito que SÍ existía pero es insuficiente. Ej.: la partida de energía eléctrica tenía 300.000 € y hacen falta 380.000 €.","transfer":"Transferencia de crédito: traslado de importe de una aplicación a otra, sin alterar la cuantía total del presupuesto. Ej.: pasar 20.000 € de festejos a servicios sociales.","generacion":"Generación de crédito: aumento del crédito por la aparición de un ingreso no tributario nuevo. Ej.: una empresa aporta 50.000 € para cofinanciar un parque.","incorporacion":"Incorporación de remanentes: pasar al ejercicio siguiente créditos que no llegaron a gastarse, en los casos tasados del art. 182.","ampliable":"Crédito ampliable: el que las bases de ejecución declaran expresamente ampliable en función de la efectiva recaudación de un recurso afectado.","quorum":"Quórum del art. 47.3 LBRL: mayoría absoluta del número legal de miembros de la corporación, exigida para los acuerdos más relevantes.","nulidad":"Nulidad de pleno derecho: el grado máximo de invalidez. El acto no produce efecto alguno, no puede convalidarse y el vicio no se sana con el tiempo.","embargo":"Providencia de embargo: acto por el que se traban bienes del deudor para cobrar una deuda. Contra la hacienda local está vedada salvo bienes patrimoniales no afectados."
};
const ARTS=[{n:172,t:"Especialidad y limitación de los créditos",ubic:"Título VI (Presupuesto y gasto público) ▸ Capítulo I (De los presupuestos) ▸ Sección 2.ª (De los créditos y sus modificaciones)",idea:"Cada crédito sirve solo para lo suyo y no admite un euro de más.",literal:`<p>1. Los créditos para gastos se destinarán exclusivamente a la finalidad específica para la cual hayan sido autorizados en el presupuesto general de la entidad local o por sus modificaciones debidamente aprobadas.</p><p>2. Los créditos autorizados tienen carácter limitativo y vinculante. Los niveles de vinculación serán los que vengan establecidos en cada momento por la legislación presupuestaria del Estado, salvo que reglamentariamente se disponga otra cosa.</p>`,dis:`<ul>
<li><b>Especialidad cualitativa (172.1):</b> el crédito se destina <b>exclusivamente</b> a la finalidad para la que fue autorizado, en el presupuesto o en sus modificaciones.</li>
<li><b>Especialidad cuantitativa (172.2):</b> los créditos son <span class="t" data-k="limitativo">limitativos y vinculantes</span>.</li>
<li><b>Niveles de <span class="t" data-k="vinculacion">vinculación</span>:</b> los que fije en cada momento la legislación presupuestaria del Estado, salvo que reglamentariamente se disponga otra cosa (en la práctica, las bases de ejecución los concretan).</li>
</ul>
<div class="box warn"><span class="lbl">La clave que hay que entender</span>La aplicación presupuestaria es la casilla donde vive el crédito; el <b>nivel de vinculación</b> es la bolsa dentro de la cual puedes moverte sin tramitar una modificación. Si la vinculación está a nivel de capítulo, puedes gastar de una aplicación más de lo consignado siempre que el capítulo entero no se supere.</div>`,llano:`<p>Cada bolsa de dinero lleva una etiqueta con su destino y con su tope. Ni se puede usar para otra cosa, ni se puede sacar más de lo que hay. Ahora bien, la ley permite agrupar bolsas pequeñas en una bolsa grande: mientras no te salgas de la bolsa grande, puedes mover dinero entre las pequeñas sin pedir permiso.</p>`,porque:`<p>Sin especialidad, la autorización del Pleno sería papel mojado: se aprobaría gasto social y se gastaría en fiestas. Sin límite cuantitativo, el techo del art. 162 no existiría. Y sin niveles de vinculación, la gestión diaria sería imposible: habría que tramitar una modificación cada vez que faltan 200 € en una casilla.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> los sobres de la economía doméstica. El sobre de "colegio" no se toca para el sobre de "vacaciones", pero si tienes una caja llamada "gastos de los niños" que agrupa varios sobres, dentro de ella sí puedes reajustar.</li>
<li><b>Real:</b> las bases de ejecución de un ayuntamiento fijan la vinculación en <b>área de gasto + capítulo</b>. La aplicación 342/22100 (energía eléctrica de instalaciones deportivas) tiene 60.000 € y se llevan gastados 64.000 €, pero el capítulo 2 del área 3 tiene margen: no hace falta modificación.</li>
<li><b>Caso límite:</b> si esa misma vinculación fuera a nivel de aplicación, esos 4.000 € exigirían una transferencia de crédito previa.</li>
</ul>`,noej:`<ul>
<li><b>No es especialidad</b> el nivel de vinculación: la primera es la regla, el segundo es la flexibilidad tolerada dentro de ella.</li>
<li><b>No son limitativas</b> las previsiones de <b>ingresos</b>: recaudar más no infringe el art. 172.</li>
</ul>`,conex:`<ul>
<li><b>Art. 167.4:</b> el control fiscal se hace precisamente sobre el nivel de vinculación de este artículo.</li>
<li><b>Art. 173.5:</b> la sanción del incumplimiento: nulidad de pleno derecho.</li>
<li><b>Art. 178:</b> la excepción expresa al carácter limitativo son los créditos ampliables.</li>
<li><b>Art. 165.1.a):</b> los créditos figuran "con la debida especificación".</li>
</ul>`,trampas:`<ul>
<li>La especialidad tiene dos caras: <b>cualitativa</b> (finalidad) y <b>cuantitativa</b> (importe). Los tests suelen dar solo una.</li>
<li>"Limitativo <b>y vinculante</b>": son dos adjetivos, no uno.</li>
<li>La excepción al 172.2 la introduce el art. 178 con la fórmula "no obstante lo dispuesto en el apartado 2 del artículo 172".</li>
</ul>`,ancla:`<p><b>Dos candados:</b> el del <b>para qué</b> (finalidad) y el del <b>cuánto</b> (importe). Imagina una hucha con dos cerraduras: una dice DESTINO y otra TOPE.</p>`,vis:`<svg viewBox="0 0 640 180" role="img" aria-label="Especialidad cualitativa y cuantitativa">
<rect x="40" y="30" width="240" height="110" rx="10" fill="var(--acc-soft)" stroke="var(--acc)"/>
<text x="160" y="58" text-anchor="middle" font-size="13" font-weight="700" fill="var(--acc)">ESPECIALIDAD CUALITATIVA</text>
<text x="160" y="82" text-anchor="middle" font-size="12" fill="currentColor">solo para la finalidad</text>
<text x="160" y="100" text-anchor="middle" font-size="12" fill="currentColor">para la que se autorizó</text>
<text x="160" y="124" text-anchor="middle" font-size="11" fill="var(--ink2)">art. 172.1</text>
<rect x="360" y="30" width="240" height="110" rx="10" fill="var(--exc-bg)" stroke="var(--exc)"/>
<text x="480" y="58" text-anchor="middle" font-size="13" font-weight="700" fill="var(--exc)">ESPECIALIDAD CUANTITATIVA</text>
<text x="480" y="82" text-anchor="middle" font-size="12" fill="currentColor">limitativo y vinculante</text>
<text x="480" y="100" text-anchor="middle" font-size="12" fill="currentColor">ni un euro de más</text>
<text x="480" y="124" text-anchor="middle" font-size="11" fill="var(--ink2)">art. 172.2</text>
<text x="320" y="92" text-anchor="middle" font-size="18" fill="var(--ink2)">+</text>
<text x="320" y="165" text-anchor="middle" font-size="11" fill="var(--ink2)">La flexibilidad tolerada dentro de estos candados = nivel de vinculación</text>
</svg>`},
{n:173,t:"Exigibilidad de las obligaciones, prerrogativas y limitación de los compromisos de gasto",ubic:"Título VI (Presupuesto y gasto público) ▸ Capítulo I (De los presupuestos) ▸ Sección 2.ª (De los créditos y sus modificaciones)",idea:"Solo se paga lo presupuestado o lo que ordene una sentencia; comprometer sin crédito es nulo.",literal:`<p>1. Las obligaciones de pago sólo serán exigibles de la hacienda local cuando resulten de la ejecución de sus respectivos presupuestos, con los límites señalados en el artículo anterior, o de sentencia judicial firme.</p><p>2. Los tribunales, jueces y autoridades administrativas no podrán despachar mandamientos de ejecución ni dictar providencias de embargo contra los derechos, fondos, valores y bienes de la hacienda local ni exigir fianzas, depósitos y cauciones a las entidades locales, excepto cuando se trate de bienes patrimoniales no afectados a un uso o servicio público.</p><p>3. El cumplimiento de las resoluciones judiciales que determinen obligaciones a cargo de las entidades locales o de sus organismos autónomos corresponderá exclusivamente a aquéllas, sin perjuicio de las facultades de suspensión o inejecución de sentencias previstas en las leyes.</p><p>4. La Autoridad administrativa encargada de la ejecución acordará el pago en la forma y con los límites del respectivo presupuesto. Si para el pago fuere necesario un crédito extraordinario o un suplemento de crédito, deberá solicitarse del Pleno uno u otro dentro de los tres meses siguientes al día de notificación de la resolución judicial.</p><p>5. No podrán adquirirse compromisos de gastos por cuantía superior al importe de los créditos autorizados en los estados de gastos, siendo nulos de pleno derecho los acuerdos, resoluciones y actos administrativos que infrinjan la expresada norma, sin perjuicio de las responsabilidades a que haya lugar.</p><p>6. No obstante lo previsto en el apartado anterior, la disponibilidad de los créditos presupuestarios quedará condicionada, en todo caso, a:</p><p>a) La existencia de documentos fehacientes que acrediten compromisos firmes de aportación, en caso de ayudas, subvenciones, donaciones u otras formas de cesión de recursos por terceros tenidos en cuenta en las previsiones iniciales del presupuesto a efecto de su nivelación y hasta el importe previsto en los estados de ingresos en orden a la afectación de dichos recursos en la forma prevista por la ley o, en su caso, a las finalidades específicas de las aportaciones a realizar.</p><p>b) La concesión de las autorizaciones previstas en el artículo 53, de conformidad con las reglas contenidas en el capítulo VII del título I de esta ley, en el caso de que existan previsiones iniciales dentro del capítulo IX del estado de ingresos.</p>`,dis:`<table><thead><tr><th>Apdo.</th><th>Regla</th><th>Detalle que se pregunta</th></tr></thead><tbody>
<tr><td>173.1</td><td>Exigibilidad</td><td>Solo por ejecución del presupuesto <b>o sentencia judicial firme</b></td></tr>
<tr><td>173.2</td><td>Inembargabilidad</td><td>Nada de <span class="t" data-k="embargo">embargos</span> ni fianzas, <b>salvo bienes patrimoniales no afectados</b> a uso o servicio público</td></tr>
<tr><td>173.3</td><td>Ejecución de sentencias</td><td>Corresponde <b>exclusivamente</b> a la propia entidad</td></tr>
<tr><td>173.4</td><td>Si falta crédito para pagar la sentencia</td><td>Solicitar al Pleno crédito extraordinario o suplemento en <b>3 meses</b> desde la notificación</td></tr>
<tr><td>173.5</td><td>Compromisos sin crédito</td><td><span class="t" data-k="nulidad">Nulos de pleno derecho</span>, sin perjuicio de responsabilidades</td></tr>
<tr><td>173.6</td><td>Disponibilidad condicionada</td><td>a) documentos fehacientes de compromisos firmes de aportación · b) autorizaciones del art. 53 si hay previsiones en el capítulo IX de ingresos</td></tr>
</tbody></table>`,llano:`<p>El Ayuntamiento solo debe pagar lo que está en su presupuesto o lo que le mande un juez. A cambio, sus bienes públicos no se pueden embargar: quien gane un pleito tiene que esperar a que la propia entidad habilite el dinero, y para eso tiene tres meses para llevarlo al Pleno. Y si alguien firma un contrato sin que haya crédito, ese contrato no vale nada: es nulo de raíz.</p>`,porque:`<p>Los bienes municipales sostienen servicios esenciales: si se pudiera embargar el camión de la basura, el perjudicado sería el vecino. Por eso la ley cambia embargo por <b>procedimiento de pago obligatorio</b> y plazo tasado. La nulidad radical del apartado 5, por su parte, es el único modo de que el techo de gasto sea real: si el gasto sin crédito fuera solo anulable, se consolidaría por el paso del tiempo.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> una casa cuyo salario está protegido frente a embargos: el acreedor cobra, pero por el cauce y en el plazo que marca la ley.</li>
<li><b>Real:</b> sentencia firme de 310.000 € por responsabilidad patrimonial notificada el 4 de marzo de 2026. No hay crédito. El alcalde debe iniciar el expediente y llevar al Pleno el crédito extraordinario <b>antes del 4 de junio de 2026</b> (art. 173.4).</li>
<li><b>Caso límite:</b> un solar patrimonial sin uso ni servicio público sí puede ser embargado (excepción del art. 173.2); no así el edificio del colegio.</li>
</ul>`,noej:`<ul>
<li><b>No es exigible</b> una deuda nacida de un encargo verbal sin crédito: es nula de pleno derecho.</li>
<li><b>No cabe</b> providencia de embargo sobre la recaudación del IBI ni sobre la cuenta corriente afecta a servicios.</li>
<li><b>No es anulabilidad</b>: la ley dice <b>nulos de pleno derecho</b>.</li>
</ul>`,conex:`<ul>
<li><b>Art. 172:</b> los límites a los que remite el apartado 1.</li>
<li><b>Art. 177:</b> el crédito extraordinario o suplemento que hay que tramitar en tres meses.</li>
<li><b>Art. 53:</b> autorizaciones para operaciones de crédito, a las que remite el 173.6.b).</li>
<li><b>Art. 47.1 y 2 LPAC:</b> régimen general de nulidad y anulabilidad.</li>
</ul>`,trampas:`<ul>
<li><b>Tres meses</b> desde la <b>notificación</b> de la resolución judicial, no desde su firmeza ni desde su ejecución.</li>
<li>La excepción a la inembargabilidad son los <b>bienes patrimoniales NO afectados</b> a uso o servicio público: doble negación que se cuela mucho.</li>
<li>"Nulos de <b>pleno derecho</b>", no anulables.</li>
<li>El apartado 6 condiciona la <b>disponibilidad</b> del crédito, no su existencia.</li>
</ul>`,ancla:`<p><b>"Ni embargo ni palabra: presupuesto o sentencia."</b><br>El <b>3</b> manda en este artículo: <b>3</b> meses para pedir el crédito tras la sentencia.</p>`,vis:`<svg viewBox="0 0 640 200" role="img" aria-label="Exigibilidad y nulidad del gasto sin crédito">

{n:174,t:"Compromisos de gasto de carácter plurianual",ubic:"Título VI (Presupuesto y gasto público) ▸ Capítulo I (De los presupuestos) ▸ Sección 2.ª (De los créditos y sus modificaciones)",idea:"Se puede comprometer gasto de años futuros, pero con casos, tope de años y porcentajes.",literal:`<p>1. La autorización o realización de los gastos de carácter plurianual se subordinará al crédito que para cada ejercicio autoricen los respectivos presupuestos.</p><p>2. Podrán adquirirse compromisos por gastos que hayan de extenderse a ejercicios posteriores a aquel en que se autoricen, siempre que su ejecución se inicie en el propio ejercicio y que, además, se encuentren en alguno de los casos siguientes:</p><p>a) Inversiones y transferencias de capital.</p><p>b) Los demás contratos y los de suministro, de consultoría, de asistencia técnica y científica, de prestación de servicios, de ejecución de obras de mantenimiento y de arrendamiento de equipos no habituales de las entidades locales, sometidos a las normas del Real Decreto Legislativo 2/2000, de 16 de junio, por el que se aprueba el texto refundido de la Ley de Contratos de las Administraciones Públicas, que no puedan ser estipulados o resulten antieconómicos por un año.</p><p>c) Arrendamientos de bienes inmuebles.</p><p>d) Cargas financieras de las deudas de la entidad local y de sus organismos autónomos.</p><p>e) Transferencias corrientes que se deriven de convenios suscritos por las corporaciones locales con otras entidades públicas o privadas sin ánimo de lucro.</p><p>3. El número de ejercicios a que pueden aplicarse los gastos referidos en los párrafos a), b) y e) del apartado anterior no será superior a cuatro. Asimismo, en los casos incluidos en los párrafos a) y e), el gasto que se impute a cada uno de los ejercicios futuros autorizados no podrá exceder de la cantidad que resulte de aplicar al crédito correspondiente del año en que la operación se comprometió los siguientes porcentajes: en el ejercicio inmediato siguiente, el 70 por ciento; en el segundo ejercicio, el 60 por ciento, y en el tercero y cuarto, el 50 por ciento.</p><p>4. Con independencia de lo establecido en los apartados anteriores, para los programas y proyectos de inversión que taxativamente se especifiquen en las bases de ejecución del</p><p>presupuesto, podrán adquirirse compromisos de gastos que hayan de extenderse a ejercicios futuros hasta el importe que para cada una de las anualidades se determine.</p><p>A estos efectos, cuando en los créditos presupuestarios se encuentren incluidos proyectos de las características señaladas anteriormente, los porcentajes a los que se refiere el apartado 3 de este artículo se aplicarán sobre dichos créditos una vez deducida la anualidad correspondiente a dichos proyectos.</p><p>5. En casos excepcionales el Pleno de la corporación podrá ampliar el número de anualidades así como elevar los porcentajes a que se refiere el apartado 3 de este artículo.</p><p>6. Los compromisos a que se refiere el apartado 2 de este artículo deberán ser objeto de adecuada e independiente contabilización.</p>`,dis:`<ul>
<li><b>Regla base (174.1):</b> el gasto <span class="t" data-k="plurianual">plurianual</span> queda subordinado al crédito que autorice cada presupuesto futuro.</li>
<li><b>Requisito común (174.2):</b> que la ejecución <b>se inicie en el propio ejercicio</b>, y que se trate de uno de los cinco casos tasados.</li>
</ul>
<table><thead><tr><th>Casos del 174.2</th><th>Máx. ejercicios</th><th>Porcentajes del 174.3</th></tr></thead><tbody>
<tr><td>a) Inversiones y transferencias de capital</td><td><b>4</b></td><td><b>Sí</b> se aplican</td></tr>
<tr><td>b) Contratos de suministro, consultoría, asistencia, servicios, obras de mantenimiento y arrendamiento de equipos no habituales que no puedan estipularse o resulten antieconómicos por un año</td><td><b>4</b></td><td>No</td></tr>
<tr><td>c) Arrendamientos de bienes inmuebles</td><td>—</td><td>No</td></tr>
<tr><td>d) Cargas financieras de las deudas</td><td>—</td><td>No</td></tr>
<tr><td>e) Transferencias corrientes derivadas de convenios con entidades públicas o privadas sin ánimo de lucro</td><td><b>4</b></td><td><b>Sí</b> se aplican</td></tr>
</tbody></table>
<table><thead><tr><th>Ejercicio futuro</th><th>Porcentaje máximo sobre el crédito del año del compromiso</th></tr></thead><tbody>
<tr><td>Inmediato siguiente (1.º)</td><td><b>70 %</b></td></tr><tr><td>Segundo</td><td><b>60 %</b></td></tr>
<tr><td>Tercero</td><td><b>50 %</b></td></tr><tr><td>Cuarto</td><td><b>50 %</b></td></tr>
</tbody></table>
<ul>
<li><b>174.4:</b> para programas y proyectos de inversión <b>taxativamente especificados en las bases de ejecución</b>, cabe comprometer hasta el importe que se fije para cada anualidad; los porcentajes se aplican sobre los créditos una vez deducida esa anualidad.</li>
<li><b>174.5:</b> en casos excepcionales el <b>Pleno</b> puede ampliar el número de anualidades y elevar los porcentajes.</li>
<li><b>174.6:</b> contabilización adecuada e <b>independiente</b> de estos compromisos.</li>
</ul>`,llano:`<p>El presupuesto dura un año, pero muchas decisiones no caben en un año: una obra grande, un alquiler, un contrato de mantenimiento. La ley lo permite con tres condiciones: que empieces la obra este año, que sea uno de los casos de la lista y que no hipoteques demasiado los años que vienen. Para eso pone un tope decreciente: 70, 60, 50 y 50 por ciento. Y si de verdad hace falta más, que lo decida el Pleno.</p>`,porque:`<p>Comprometer el futuro es comprometer la libertad de decisión de las próximas corporaciones y de los próximos vecinos. Si un equipo de gobierno pudiera firmar en su último año contratos que consumen todo el presupuesto de los cuatro siguientes, vaciaría de contenido la elección. Los porcentajes son un <b>límite a la hipoteca del futuro</b>; la exigencia de iniciar la ejecución en el ejercicio evita firmar por firmar.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> firmar una hipoteca. El banco no te deja comprometer el 100 % de tus ingresos futuros: te aplica un porcentaje máximo de esfuerzo.</li>
<li><b>Real:</b> el crédito de 2026 para inversiones en el pabellón es de 1.000.000 €. Si se compromete una obra plurianual, en 2027 no podrán imputarse más de <b>700.000 €</b>, en 2028 no más de <b>600.000 €</b> y en 2029 y 2030 no más de <b>500.000 €</b> cada año, salvo acuerdo excepcional del Pleno.</li>
<li><b>Caso límite:</b> un arrendamiento de un edificio para dependencias municipales por diez años. La letra c) no está sujeta al tope de cuatro ejercicios ni a los porcentajes del apartado 3, que solo alcanzan a las letras a), b) y e) —y los porcentajes, solo a la a) y la e)—.</li>
</ul>`,noej:`<ul>
<li><b>No cabe</b> comprometer gasto plurianual si la ejecución no se inicia en el propio ejercicio.</li>
<li><b>No se aplican</b> los porcentajes a los arrendamientos de inmuebles ni a las cargas financieras.</li>
<li><b>No basta</b> con la voluntad del alcalde para superar los límites: es competencia del <b>Pleno</b> (174.5).</li>
</ul>`,conex:`<ul>
<li><b>Art. 165.1:</b> las bases de ejecución, donde se especifican los proyectos del 174.4.</li>
<li><b>Art. 166.1.a):</b> los planes de inversión a cuatro años: el mismo horizonte temporal.</li>
<li><b>Art. 182.1.b) y 176.2.b):</b> los compromisos adquiridos se arrastran vía incorporación de créditos.</li>
</ul>
<div class="interp"><span class="lbl">Interpretación / contexto — aportación externa</span>La letra b) del 174.2 remite al RDLeg 2/2000 (Ley de Contratos de las Administraciones Públicas), norma <b>derogada</b>: hoy la referencia debe entenderse hecha a la Ley 9/2017, de Contratos del Sector Público, que también está en esta biblioteca. El texto consolidado conserva la cita antigua.</div>`,trampas:`<ul>
<li><b>70-60-50-50</b>: el tercero y el cuarto comparten porcentaje. Muchos tests ponen 70-60-50-40.</li>
<li>El tope de <b>cuatro ejercicios</b> alcanza a las letras <b>a), b) y e)</b>; los <b>porcentajes</b>, solo a las letras <b>a) y e)</b>.</li>
<li>"Siempre que su ejecución <b>se inicie en el propio ejercicio</b>": requisito que se olvida.</li>
<li>Quien amplía anualidades y porcentajes es el <b>Pleno</b>, y solo en casos excepcionales.</li>
</ul>`,ancla:`<p><b>La escalera que baja:</b> <b>7-6-5-5</b>. Imagínala como un tobogán que se queda plano al final.<br><b>Cuatro años, cuatro letras con tope</b> — y recuerda: los porcentajes solo muerden a <b>A</b> y <b>E</b> (las vocales).</p>`,vis:`<svg viewBox="0 0 640 190" role="img" aria-label="Porcentajes máximos del gasto plurianual">

</svg>`},
{n:175,t:"Bajas por anulación de créditos",ubic:"Título VI (Presupuesto y gasto público) ▸ Capítulo I (De los presupuestos) ▸ Sección 2.ª (De los créditos y sus modificaciones)",idea:"Lo que no se ha gastado a 31 de diciembre se anula solo, salvo incorporación.",literal:`<p>Los créditos para gastos que el último día del ejercicio presupuestario no estén afectados al cumplimiento de obligaciones ya reconocidas quedarán anulados de pleno derecho, sin más excepciones que las señaladas en el artículo 182 de esta ley.</p>`,dis:`<ul>
<li><b>Supuesto:</b> créditos que el <b>último día del ejercicio</b> no estén afectados al cumplimiento de <b>obligaciones ya reconocidas</b>.</li>
<li><b>Consecuencia:</b> quedan <b>anulados de pleno derecho</b>. No hace falta acuerdo: opera automáticamente.</li>
<li><b>Única excepción:</b> la del art. 182 (<span class="t" data-k="incorporacion">incorporación de remanentes</span>).</li>
</ul>`,llano:`<p>El 31 de diciembre a medianoche, el dinero que no se ha llegado a comprometer con una obligación reconocida desaparece. No se guarda, no se acumula, no pasa al año siguiente. Solo se salvan los casos que el art. 182 permite rescatar.</p>`,porque:`<p>Si los créditos sobrantes se arrastraran sin control, el presupuesto anual dejaría de ser un techo: cada año se acumularía sobre el anterior y el Pleno perdería el control sobre cuánto se puede gastar realmente. La anulación automática obliga a que <b>cada ejercicio se decida de nuevo</b>.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> los días de vacaciones que caducan el 31 de diciembre: si no los disfrutas, se pierden.</li>
<li><b>Real:</b> la aplicación de "reparación de caminos rurales" tenía 90.000 € y a 31 de diciembre solo hay obligaciones reconocidas por 55.000 €. Los 35.000 € restantes quedan anulados, salvo que encajen en alguno de los supuestos del art. 182.</li>
<li><b>Caso límite:</b> una obra adjudicada en noviembre con contrato firmado pero sin certificaciones a 31 de diciembre. El crédito ampara un <b>compromiso</b> ya adquirido: es incorporable por la vía del art. 182.1.b) en relación con el 176.2.b).</li>
</ul>`,noej:`<ul>
<li><b>No se anulan</b> los créditos que amparan obligaciones ya reconocidas: esas obligaciones pasan a la tesorería como pendientes de pago (art. 191.2).</li>
<li><b>No es una baja por anulación acordada</b> (que sí puede usarse como financiación en el art. 177.4): esta anulación es automática.</li>
</ul>`,conex:`<ul>
<li><b>Art. 182:</b> la única excepción, con sus cuatro supuestos.</li>
<li><b>Art. 176:</b> temporalidad de los créditos, su fundamento.</li>
<li><b>Art. 191:</b> cierre y liquidación a 31 de diciembre.</li>
</ul>`,trampas:`<ul>
<li>Lo determinante es que el crédito esté <b>afectado a obligaciones ya reconocidas</b>, no que esté "gastado" o "comprometido" en sentido coloquial.</li>
<li>"Sin más excepciones que las señaladas en el <b>artículo 182</b>": la remisión es cerrada.</li>
</ul>`,ancla:`<p><b>"31 de diciembre: Cenicienta."</b> A las doce, el crédito no reconocido se convierte en calabaza. Solo el art. 182 tiene el zapato.</p>`,vis:`<svg viewBox="0 0 640 150" role="img" aria-label="Anulación de créditos a fin de ejercicio">

</svg>`},
{n:176,t:"Temporalidad de los créditos",ubic:"Título VI (Presupuesto y gasto público) ▸ Capítulo I (De los presupuestos) ▸ Sección 2.ª (De los créditos y sus modificaciones)",idea:"Cada crédito paga lo hecho en su propio año, con dos excepciones.",literal:`<p>1. Con cargo a los créditos del estado de gastos de cada presupuesto sólo podrán contraerse obligaciones derivadas de adquisiciones, obras, servicios y demás prestaciones o gastos en general que se realicen en el año natural del propio ejercicio presupuestario.</p><p>2. No obstante lo dispuesto en el apartado anterior, se aplicarán a los créditos del presupuesto vigente, en el momento de su reconocimiento, las obligaciones siguientes:</p><p>a) Las que resulten de la liquidación de atrasos a favor del personal que perciba sus retribuciones con cargo a los presupuestos generales de la entidad local.</p><p>b) Las derivadas de compromisos de gastos debidamente adquiridos en ejercicios anteriores, previa incorporación de los créditos en el supuesto establecido en el artículo 182.3.</p>`,dis:`<ul>
<li><b>Regla (176.1):</b> con cargo a los créditos de un presupuesto solo se contraen obligaciones por prestaciones <b>realizadas en el año natural de ese ejercicio</b>.</li>
<li><b>Excepciones (176.2), que se aplican al presupuesto vigente en el momento del reconocimiento:</b>
<ul><li><b>a)</b> atrasos a favor del <b>personal</b> retribuido con cargo al presupuesto de la entidad;</li>
<li><b>b)</b> obligaciones derivadas de <b>compromisos de gasto debidamente adquiridos</b> en ejercicios anteriores, previa <b>incorporación</b> de los créditos del art. 182.3.</li></ul></li>
</ul>`,llano:`<p>El presupuesto de 2026 paga lo que se hace en 2026. Dos cosas se salvan: los atrasos del personal y aquello que se comprometió en firme antes y cuyo crédito se ha incorporado. Todo lo demás que venga de años anteriores necesita otra vía.</p>`,porque:`<p>Es el principio de <b>anualidad</b> visto desde el lado del gasto: si cada año pudiera pagar gastos de cualquier año, la información del presupuesto sería inservible y la comparación entre ejercicios, imposible. Las dos excepciones responden a situaciones en las que la deuda ya está jurídicamente consolidada y negarla sería injusto.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> la declaración de la renta de un año que incluye atrasos salariales cobrados después: la ley da una regla específica precisamente porque rompe la anualidad.</li>
<li><b>Real:</b> en abril de 2026 se reconoce una subida retributiva con efectos de enero de 2025 para el personal municipal: los atrasos se imputan al presupuesto <b>de 2026</b> (176.2.a).</li>
<li><b>Caso límite:</b> una factura de octubre de 2025 sin compromiso previo ni crédito incorporado. No encaja en el 176.2: la vía habitual es el reconocimiento extrajudicial de créditos, figura ajena a este artículo.</li>
</ul>`,noej:`<ul>
<li><b>No es excepción</b> cualquier factura que llegue tarde: solo lo que responde a un compromiso debidamente adquirido con crédito incorporado.</li>
<li><b>No cubre</b> a personal de sociedades mercantiles: la letra a) habla de quien percibe retribuciones con cargo a los presupuestos generales de la entidad local.</li>
</ul>`,conex:`<ul>
<li><b>Art. 163:</b> el ejercicio coincide con el año natural.</li>
<li><b>Art. 175:</b> anulación de los créditos no utilizados.</li>
<li><b>Art. 182.3:</b> la incorporación obligatoria a la que remite la letra b).</li>
</ul>`,trampas:`<ul>
<li>Son <b>dos</b> excepciones, y la segunda exige <b>incorporación previa</b> del crédito.</li>
<li>Se imputan al presupuesto <b>vigente en el momento del reconocimiento</b>, no al del año en que se generó la prestación.</li>
</ul>`,ancla:`<p><b>"Cada año paga lo suyo, salvo la nómina atrasada y lo ya comprometido."</b> Dos excepciones: <b>P</b>ersonal y <b>C</b>ompromisos → <i>"PC"</i>.</p>`,vis:`<svg viewBox="0 0 640 150" role="img" aria-label="Temporalidad de los créditos y sus excepciones">

<text x="145" y="90" text-anchor="middle" font-size="11" fill="currentColor">prestaciones del propio año natural</text>

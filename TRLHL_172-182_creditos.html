<text x="475" y="119" text-anchor="middle" font-size="10" fill="currentColor">previa incorporación (art. 182.3)</text>
</svg>`},
{n:177,t:"Créditos extraordinarios y suplementos de crédito",ubic:"Título VI (Presupuesto y gasto público) ▸ Capítulo I (De los presupuestos) ▸ Sección 2.ª (De los créditos y sus modificaciones)",idea:"Si falta crédito o no llega, se crea o se amplía siguiendo el camino del presupuesto.",literal:`<p>1. Cuando haya de realizarse algún gasto que no pueda demorarse hasta el ejercicio siguiente, y no exista en el presupuesto de la corporación crédito o sea insuficiente o no ampliable el consignado, el presidente de la corporación ordenará la incoación del expediente de concesión de crédito extraordinario, en el primer caso, o de suplemento de crédito, en el segundo.</p><p>2. El expediente, que habrá de ser previamente informado por la Intervención, se someterá a la aprobación del Pleno de la corporación, con sujeción a los mismos trámites y requisitos que los presupuestos. Serán asimismo, de aplicación, las normas sobre información, reclamación y publicidad de los presupuestos a que se refiere el artículo 169 de esta ley.</p><p>3. Si la inexistencia o insuficiencia de crédito se produjera en el presupuesto de un organismo autónomo, el expediente de crédito extraordinario o de suplemento de crédito propuesto inicialmente por el órgano competente del organismo autónomo a que aquél corresponda, será remitido a la entidad local para su tramitación conforme a lo dispuesto en el apartado anterior.</p><p>4. El expediente deberá especificar la concreta partida presupuestaria a incrementar y el medio o recurso que ha de financiar el aumento que se propone.</p><p>Dicho aumento se financiará con cargo al remanente líquido de tesorería, con nuevos o mayores ingresos recaudados sobre los totales previstos en el presupuesto corriente, y mediante anulaciones o bajas de créditos de gastos de otras partidas del presupuesto vigente no comprometidos, cuyas dotaciones se estimen reducibles sin perturbación del respectivo servicio. En el expediente se acreditará que los ingresos previstos en el presupuesto vengan efectuándose con normalidad, salvo que aquéllos tengan carácter finalista.</p><p>5. Excepcionalmente, y por acuerdos adoptados con el quórum establecido por el artículo 47.3 de la Ley 7/1985, de 2 de abril, se considerarán recursos efectivamente disponibles para financiar nuevos o mayores gastos, por operaciones corrientes, que</p><p>expresamente sean declarados necesarios y urgentes, los procedentes de operaciones de crédito en que se den conjuntamente las siguientes condiciones:</p><p>Que su importe total anual no supere el cinco por ciento de los recursos por operaciones corrientes del presupuesto de la entidad.</p><p>Que la carga financiera total de la entidad, incluida la derivada de las operaciones proyectadas, no supere el 25 por ciento de los expresados recursos.</p><p>Que las operaciones queden canceladas antes de que se proceda a la renovación de la Corporación que las concierte.</p><p>6. Los acuerdos de las entidades locales que tengan por objeto la habilitación o suplemento de créditos en casos de calamidades públicas o de naturaleza análoga de excepcional interés general, serán inmediatamente ejecutivos, sin perjuicio de las reclamaciones que contra ellos se promovieran, las cuales deberán sustanciarse dentro de los ocho días siguientes a la presentación, entendiéndose desestimadas de no notificarse su resolución al recurrente dentro de dicho plazo.</p>`,dis:`<table><thead><tr><th></th><th><span class="t" data-k="ce">Crédito extraordinario</span></th><th><span class="t" data-k="sc">Suplemento de crédito</span></th></tr></thead><tbody>
<tr><th>Situación</th><td><b>No existe</b> crédito</td><td>Existe pero es <b>insuficiente y no ampliable</b></td></tr>
<tr><th>Requisito común</th><td colspan="2">Gasto que <b>no puede demorarse</b> al ejercicio siguiente</td></tr>
</tbody></table>
<ul>
<li><b>Quién incoa:</b> el <b>presidente</b> ordena la incoación del expediente (177.1).</li>
<li><b>Trámite (177.2):</b> informe previo de la <span class="t" data-k="intervencion">Intervención</span> → aprobación del <b>Pleno</b> → mismos trámites y requisitos que los presupuestos, incluidas las normas de <b>información, reclamación y publicidad</b> del art. 169.</li>
<li><b>Organismos autónomos (177.3):</b> propuesta inicial del órgano competente del OA y remisión a la entidad local para tramitarlo igual.</li>
<li><b>Contenido (177.4):</b> debe especificar la <b>partida a incrementar</b> y el <b>recurso que lo financia</b>.</li>
</ul>
<table><thead><tr><th>Recursos de financiación (177.4)</th></tr></thead><tbody>
<tr><td><span class="t" data-k="remanente">Remanente líquido de tesorería</span></td></tr>
<tr><td>Nuevos o mayores ingresos recaudados sobre los previstos en el presupuesto corriente</td></tr>
<tr><td>Anulaciones o bajas de créditos de otras partidas <b>no comprometidos</b>, reducibles sin perturbar el servicio</td></tr>
</tbody></table>
<div class="box exc"><span class="lbl">Excepción del 177.5 — operaciones de crédito para gasto corriente</span>Con <span class="t" data-k="quorum">quórum del art. 47.3 LBRL</span> y declaración expresa de necesidad y urgencia, cabe financiar con operaciones de crédito nuevos o mayores gastos <b>corrientes</b> si concurren <b>las tres condiciones a la vez</b>:
<ul><li>importe total anual ≤ <b>5 %</b> de los recursos por operaciones corrientes;</li>
<li>carga financiera total ≤ <b>25 %</b> de esos recursos;</li>
<li>operaciones canceladas <b>antes de la renovación de la Corporación</b> que las concierte.</li></ul></div>
<div class="box warn"><span class="lbl">Calamidades públicas (177.6)</span>Los acuerdos de habilitación o suplemento por calamidades públicas o análogas de excepcional interés general son <b>inmediatamente ejecutivos</b>. Las reclamaciones se sustancian en <b>8 días</b> desde su presentación y se entienden <b>desestimadas</b> si no se notifica resolución en ese plazo.</div>`,llano:`<p>Aparece un gasto urgente que no puede esperar al año que viene. Si no hay ninguna partida, se crea una (crédito extraordinario); si la hay pero se queda corta, se engorda (suplemento). Como esto altera el techo aprobado por el Pleno, el camino es el mismo que el del presupuesto: informe del interventor, aprobación plenaria, exposición pública y publicación. Y hay que decir de dónde sale el dinero.</p>`,porque:`<p>Estas dos figuras <b>aumentan el volumen total</b> del presupuesto: por eso no basta con una firma del alcalde, se exige el mismo procedimiento solemne que para aprobarlo. La exigencia de identificar el recurso financiador impide crear crédito de la nada. Y la excepción del apartado 5 existe porque a veces la única salida es endeudarse para gasto corriente — algo tan peligroso que la ley lo rodea de tres cerrojos numéricos y de mayoría absoluta.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> se rompe la caldera en enero. No tenías esa partida en tu presupuesto familiar: creas la partida y decides de dónde sacas el dinero (ahorros, una paga extra o recortar otro gasto).</li>
<li><b>Real:</b> derrumbe parcial del muro del cementerio en marzo de 2026. No existe crédito. El alcalde ordena incoar un crédito extraordinario de 145.000 € financiado con remanente líquido de tesorería; la interventora informa, el Pleno lo aprueba el 30 de marzo, se expone 15 días y se publica.</li>
<li><b>Caso límite:</b> riadas que anegan el casco urbano. El acuerdo de habilitación es <b>inmediatamente ejecutivo</b> (177.6): se puede gastar sin esperar a que terminen los plazos de reclamación.</li>
</ul>`,noej:`<ul>
<li><b>No es suplemento</b> aumentar un crédito <b>ampliable</b>: para eso está el art. 178, con requisitos propios.</li>
<li><b>No sirve como financiación</b> una baja de crédito <b>ya comprometido</b>: el 177.4 exige que no esté comprometido.</li>
<li><b>No cabe</b> financiar gasto corriente con préstamo fuera de las tres condiciones del 177.5.</li>
</ul>`,conex:`<ul>
<li><b>Art. 169:</b> información, reclamación y publicidad aplicables por remisión expresa.</li>
<li><b>Art. 173.4:</b> el crédito extraordinario o suplemento que hay que pedir en tres meses tras una sentencia.</li>
<li><b>Art. 47.3 LBRL:</b> el quórum de mayoría absoluta del 177.5.</li>
<li><b>Art. 182.1.a):</b> los concedidos en el último trimestre son incorporables.</li>
</ul>`,trampas:`<ul>
<li><b>No existe → extraordinario. Existe pero corto → suplemento.</b> Es la distinción básica y la más preguntada.</li>
<li>El presidente <b>incoa</b>; el Pleno <b>aprueba</b>. No los aprueba el alcalde.</li>
<li>Las tres condiciones del 177.5 son <b>cumulativas</b>: 5 %, 25 % y cancelación antes de la renovación.</li>
<li>En calamidades: <b>8 días</b> y silencio <b>desestimatorio</b>.</li>
<li>Se les aplican los trámites del presupuesto: por tanto también los <b>15 días</b> de exposición y el <b>mes</b> para resolver reclamaciones del art. 169.</li>
</ul>`,ancla:`<p><b>"E de Extraordinario, E de que no Existe."</b> Si existe pero falta, <b>S</b>uplemento (<b>S</b>umar).<br><b>Los números del 177.5: 5-25-antes.</b> Cinco por ciento, veinticinco por ciento, y cancelado antes de que cambie la corporación.<br><b>Calamidad = 8 días y silencio negativo.</b></p>`,vis:`<svg viewBox="0 0 640 220" role="img" aria-label="Créditos extraordinarios y suplementos de crédito">

{n:178,t:"Créditos ampliables",ubic:"Título VI (Presupuesto y gasto público) ▸ Capítulo I (De los presupuestos) ▸ Sección 2.ª (De los créditos y sus modificaciones)",idea:"Algunos créditos crecen solos si crece el ingreso al que van unidos.",literal:`<p>No obstante lo dispuesto en el apartado 2 del artículo 172 de esta ley tendrán la condición de ampliables aquellos créditos que de modo taxativo y debidamente explicitados se relacionen en las bases de ejecución del presupuesto, y, en su virtud, podrá ser incrementada su cuantía, previo cumplimiento de los requisitos exigidos por vía reglamentaria, en función de la efectividad de los recursos afectados.</p>`,dis:`<ul>
<li><b>Excepción expresa</b> al carácter limitativo del art. 172.2.</li>
<li><b>Requisito formal:</b> figurar de modo <b>taxativo y debidamente explicitado</b> en las <span class="t" data-k="bases">bases de ejecución</span>.</li>
<li><b>Requisito material:</b> el incremento se produce <b>en función de la efectividad de los recursos afectados</b>, previo cumplimiento de los requisitos reglamentarios.</li>
</ul>`,llano:`<p>Hay gastos que dependen directamente de un ingreso concreto: cuanto más entra, más se puede gastar. Si las bases de ejecución los han señalado uno por uno, ese crédito puede subir automáticamente cuando el ingreso se hace efectivo, sin montar un expediente de suplemento.</p>`,porque:`<p>Obligar a tramitar un suplemento cada vez que entra el ingreso afectado sería absurdo y lento. La ley admite un automatismo, pero lo condiciona a que el Pleno lo haya previsto <b>de antemano y por escrito</b> en las bases: así el automatismo sigue siendo una decisión plenaria, solo que anticipada.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> un sueldo con comisiones: tu presupuesto de ocio sube en la medida en que entren esas comisiones, no antes.</li>
<li><b>Real:</b> las bases de ejecución declaran ampliable el crédito de "actividades deportivas" en función de la recaudación por inscripciones. Presupuestados 80.000 € de ingresos y recaudados 96.000 €, el crédito puede ampliarse en esos 16.000 €.</li>
<li><b>Caso límite:</b> ese mismo crédito ampliable <b>no puede ser minorado por transferencia</b> (art. 180.1.a).</li>
</ul>`,noej:`<ul>
<li><b>No es ampliable</b> un crédito solo porque exista un ingreso afectado: hace falta la declaración taxativa en las bases.</li>
<li><b>No se amplía</b> por previsión de mayor recaudación, sino por su <b>efectividad</b>.</li>
</ul>`,conex:`<ul>
<li><b>Art. 172.2:</b> la regla que este artículo excepciona.</li>
<li><b>Art. 165.1:</b> las bases de ejecución como contenido obligatorio del presupuesto.</li>
<li><b>Art. 180.1.a):</b> los ampliables no pueden verse afectados por transferencias.</li>
</ul>`,trampas:`<ul>
<li>"De modo <b>taxativo</b> y debidamente <b>explicitados</b>": no vale una cláusula genérica.</li>
<li>Es una modificación que <b>aumenta el total</b> del presupuesto, como el crédito extraordinario y el suplemento, pero con procedimiento mucho más ágil.</li>
</ul>`,ancla:`<p><b>"Ampliable = acordeón atado a un ingreso."</b> Se estira solo si entra aire (recaudación), y solo si está escrito en las bases.</p>`,vis:`<svg viewBox="0 0 640 140" role="img" aria-label="Funcionamiento del crédito ampliable">

<text x="320" y="125" text-anchor="middle" font-size="11" fill="var(--ink2)">Excepción expresa al carácter limitativo del art. 172.2</text>
</svg>`},
{n:179,t:"Transferencias de crédito: límites formales y competencia",ubic:"Título VI (Presupuesto y gasto público) ▸ Capítulo I (De los presupuestos) ▸ Sección 2.ª (De los créditos y sus modificaciones)",idea:"Mover dinero entre partidas: lo regulan las bases, y el Pleno decide lo gordo.",literal:`<p>1. Las entidades locales regularán en las bases de ejecución del presupuesto el régimen de transferencias estableciendo, en cada caso, el órgano competente para autorizarlas.</p><p>2. En todo caso, la aprobación de las transferencias de crédito entre distintos grupos de función corresponderá al Pleno de la corporación salvo cuando las bajas y las altas afecten a créditos de personal.</p><p>3. Los organismos autónomos podrán realizar operaciones de transferencias de crédito con sujeción a lo dispuesto en los apartados anteriores.</p><p>4. Las modificaciones presupuestarias a que se refiere este artículo, en cuanto sean aprobadas por el Pleno, seguirán las normas sobre información, reclamaciones, recursos y publicidad a que se refieren los artículos 169, 170 y 171 de la ley.</p>`,dis:`<ul>
<li><b>179.1:</b> las <b>bases de ejecución</b> regulan el régimen de <span class="t" data-k="transfer">transferencias</span> y fijan el <b>órgano competente</b> en cada caso.</li>
<li><b>179.2:</b> en todo caso, corresponde al <b>Pleno</b> la aprobación de las transferencias <b>entre distintos grupos de función</b>, <b>salvo</b> cuando las bajas y las altas afecten a <b>créditos de personal</b>.</li>
<li><b>179.3:</b> los organismos autónomos también pueden hacer transferencias, con sujeción a lo anterior.</li>
<li><b>179.4:</b> las aprobadas por el Pleno siguen las normas de <b>información, reclamaciones, recursos y publicidad</b> de los arts. 169, 170 y 171.</li>
</ul>
<div class="box ej"><span class="lbl">Idea clave</span>La transferencia <b>no altera la cuantía total</b> del presupuesto: lo que sube en un sitio baja en otro. Por eso su procedimiento es más ligero que el del crédito extraordinario.</div>
<div class="interp"><span class="lbl">Interpretación / contexto — aportación externa</span>La expresión "grupos de función" procede de la estructura presupuestaria anterior a 2008. Con la clasificación vigente (Orden EHA/3565/2008) la doctrina y la práctica la entienden referida a las <b>áreas de gasto</b>. El texto legal no se ha actualizado; si el examen cita literalmente el precepto, la respuesta esperada suele ser la literal.</div>`,llano:`<p>Transferir es mover dinero de una casilla a otra sin que cambie el total. Cada ayuntamiento decide en sus bases quién puede autorizar cada movimiento. Pero cuando el movimiento cruza grandes bloques de gasto, decide el Pleno, salvo que se trate de dinero de personal.</p>`,porque:`<p>Como el total no cambia, no hace falta el procedimiento solemne del presupuesto. Pero cuando el dinero salta de un gran bloque a otro (de servicios sociales a deuda, por ejemplo), se está alterando la <b>prioridad política</b> que aprobó el Pleno: por eso vuelve al Pleno. La excepción de personal responde a que esos créditos tienen su propia disciplina y sus ajustes son frecuentes y técnicos.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> mover dinero entre sobres de la casa: si es del sobre "cine" al sobre "libros", lo decides tú; si es del sobre "colegio" al sobre "coche", lo habláis los dos.</li>
<li><b>Real:</b> pasar 18.000 € de la partida de festejos (área 3) a la de ayudas de emergencia social (área 2) exige acuerdo del <b>Pleno</b>, con exposición pública y publicidad.</li>
<li><b>Caso límite:</b> pasar 18.000 € entre dos partidas de personal de áreas distintas: pese a cruzar áreas, <b>no</b> requiere Pleno por la excepción expresa del 179.2.</li>
</ul>`,noej:`<ul>
<li><b>No es transferencia</b> el crédito extraordinario: allí el total sube; aquí se mantiene.</li>
<li><b>No decide libremente</b> el alcalde: decide lo que las bases le atribuyan, y nunca lo reservado al Pleno.</li>
</ul>`,conex:`<ul>
<li><b>Art. 180:</b> los límites objetivos de toda transferencia.</li>
<li><b>Arts. 169, 170 y 171:</b> por remisión del 179.4, cuando aprueba el Pleno.</li>
<li><b>Art. 167.3:</b> la clasificación por programas, de la que salen los "grupos de función".</li>
</ul>`,trampas:`<ul>
<li>La competencia del Pleno se activa por cruzar <b>grupos de función</b>, no por el importe.</li>
<li>La excepción de <b>personal</b> exige que <b>bajas y altas</b> afecten a créditos de personal.</li>
<li>Solo las aprobadas por el <b>Pleno</b> arrastran los trámites de los arts. 169 a 171.</li>
</ul>`,ancla:`<p><b>"Cruza función → Pleno; toca personal → excepción."</b><br>La transferencia es un <b>trasvase</b>: el pantano total no cambia de nivel.</p>`,vis:`<svg viewBox="0 0 640 170" role="img" aria-label="Competencia para aprobar transferencias de crédito">

<text x="455" y="139" text-anchor="middle" font-size="11" fill="currentColor">→ excepción: no hace falta Pleno</text>
</svg>`},
{n:180,t:"Transferencias de crédito: límites objetivos",ubic:"Título VI (Presupuesto y gasto público) ▸ Capítulo I (De los presupuestos) ▸ Sección 2.ª (De los créditos y sus modificaciones)",idea:"Tres cosas no se pueden tocar con transferencias, salvo personal y dos supuestos.",literal:`<p>1. Las transferencias de créditos de cualquier clase estarán sujetas a las siguientes limitaciones:</p><p>a) No afectarán a los créditos ampliables ni a los extraordinarios concedidos durante el ejercicio.</p><p>b) No podrán minorarse los créditos que hayan sido incrementados con suplementos o transferencias, salvo cuando afecten a créditos de personal, ni los créditos incorporados como consecuencia de remanentes no comprometidos procedentes de presupuestos cerrados.</p><p>c) No incrementarán créditos que como consecuencia de otras transferencias hayan sido objeto de minoración, salvo cuando afecten a créditos de personal.</p><p>2. Las anteriores limitaciones no afectarán a las transferencias de crédito que se refieran a los programas de imprevistos y funciones no clasificadas ni serán de aplicación cuando se trate de créditos modificados como consecuencia de reorganizaciones administrativas aprobadas por el Pleno.</p>`,dis:`<table><thead><tr><th>Límite (180.1)</th><th>Contenido</th><th>Salvedad</th></tr></thead><tbody>
<tr><td>a)</td><td>No afectarán a los créditos <b>ampliables</b> ni a los <b>extraordinarios</b> concedidos durante el ejercicio</td><td>—</td></tr>
<tr><td>b)</td><td>No podrán <b>minorarse</b> los créditos incrementados con <b>suplementos o transferencias</b>, ni los <b>incorporados</b> por remanentes no comprometidos de presupuestos cerrados</td><td>Créditos de <b>personal</b> (solo para la primera parte)</td></tr>
<tr><td>c)</td><td>No <b>incrementarán</b> créditos que hayan sido minorados por otras transferencias</td><td>Créditos de <b>personal</b></td></tr>
</tbody></table>
<div class="box ej"><span class="lbl">Excepciones generales (180.2)</span>Los límites anteriores <b>no</b> se aplican:
<ul><li>a las transferencias referidas a los programas de <b>imprevistos y funciones no clasificadas</b>;</li>
<li>cuando se trate de créditos modificados por <b>reorganizaciones administrativas aprobadas por el Pleno</b>.</li></ul></div>`,llano:`<p>Una vez que un crédito ha sido tocado, la ley evita que se convierta en un carrusel: lo que se ha reforzado no se puede vaciar después, y lo que se ha vaciado no se puede volver a llenar. Así se impide burlar el control haciendo idas y venidas. Personal queda fuera, y también los programas de imprevistos y las reorganizaciones que apruebe el Pleno.</p>`,porque:`<p>Sin estos límites, la transferencia sería la puerta trasera del presupuesto: se podría deshacer por decreto lo que el Pleno acaba de aprobar por expediente solemne. Las prohibiciones protegen la <b>estabilidad de las decisiones ya adoptadas</b> y evitan el "baile de partidas" que hace ilegible la ejecución.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> si has pedido un préstamo para arreglar el tejado, no puedes al mes siguiente usar ese dinero para otra cosa: se pediría con otra finalidad.</li>
<li><b>Real:</b> en marzo se aprueba un suplemento de 60.000 € para la partida de mantenimiento de colegios. En octubre no se puede minorar esa partida por transferencia para reforzar alumbrado (180.1.b).</li>
<li><b>Caso límite:</b> si esa minoración afectara a créditos de <b>personal</b>, sí sería posible; y también si deriva de una <b>reorganización administrativa</b> aprobada por el Pleno (180.2).</li>
</ul>`,noej:`<ul>
<li><b>No están limitados</b> los programas de imprevistos y funciones no clasificadas: son la válvula de escape del sistema.</li>
<li><b>No se prohíbe</b> incrementar un crédito ampliable por su propia vía (art. 178); lo prohibido es afectarlo mediante transferencia.</li>
</ul>`,conex:`<ul>
<li><b>Art. 179:</b> régimen y competencia de las transferencias.</li>
<li><b>Arts. 177 y 178:</b> los créditos extraordinarios, suplementos y ampliables que quedan protegidos.</li>
<li><b>Art. 182:</b> los créditos incorporados a los que alude la letra b).</li>
</ul>`,trampas:`<ul>
<li>La letra a) protege ampliables y <b>extraordinarios</b>; los <b>suplementos</b> aparecen en la letra b) y con otro matiz (no pueden minorarse).</li>
<li>La salvedad de <b>personal</b> aparece en las letras b) y c), no en la a).</li>
<li>El 180.2 contiene <b>dos</b> excepciones generales; suelen preguntar solo una.</li>
</ul>`,ancla:`<p><b>"Lo que subió no baja, lo que bajó no sube."</b> Y por encima de todo, la coletilla mágica: <b>salvo personal</b>.<br>Válvulas de escape: <b>imprevistos</b> y <b>reorganizaciones del Pleno</b>.</p>`,vis:`<svg viewBox="0 0 640 165" role="img" aria-label="Límites objetivos de las transferencias de crédito">
<rect x="25" y="25" width="185" height="70" rx="8" fill="var(--exc-bg)" stroke="var(--exc)"/>
<text x="117" y="47" text-anchor="middle" font-size="11" font-weight="700" fill="var(--exc)">a) No tocar</text>
<text x="117" y="66" text-anchor="middle" font-size="10" fill="currentColor">créditos ampliables ni</text>
<text x="117" y="82" text-anchor="middle" font-size="10" fill="currentColor">extraordinarios del ejercicio</text>
<rect x="225" y="25" width="185" height="70" rx="8" fill="var(--exc-bg)" stroke="var(--exc)"/>
<text x="317" y="47" text-anchor="middle" font-size="11" font-weight="700" fill="var(--exc)">b) No minorar</text>
<text x="317" y="66" text-anchor="middle" font-size="10" fill="currentColor">lo reforzado con suplemento</text>
<text x="317" y="82" text-anchor="middle" font-size="10" fill="currentColor">o transferencia, ni lo incorporado</text>
<rect x="425" y="25" width="190" height="70" rx="8" fill="var(--exc-bg)" stroke="var(--exc)"/>
<text x="520" y="47" text-anchor="middle" font-size="11" font-weight="700" fill="var(--exc)">c) No incrementar</text>
<text x="520" y="66" text-anchor="middle" font-size="10" fill="currentColor">lo que ya fue minorado</text>
<text x="520" y="82" text-anchor="middle" font-size="10" fill="currentColor">por otra transferencia</text>
<rect x="90" y="108" width="460" height="46" rx="8" fill="var(--ej-bg)" stroke="var(--ej)"/>
<text x="320" y="127" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ej)">SALVEDADES: créditos de personal (b y c)</text>
<text x="320" y="145" text-anchor="middle" font-size="11" fill="currentColor">y, en todo caso: imprevistos · reorganizaciones aprobadas por el Pleno</text>
</svg>`},
{n:181,t:"Generaciones de crédito",ubic:"Título VI (Presupuesto y gasto público) ▸ Capítulo I (De los presupuestos) ▸ Sección 2.ª (De los créditos y sus modificaciones)",idea:"Un ingreso nuevo no tributario puede crear crédito de gasto por su importe.",literal:`<p>Podrán generar crédito en los estados de gastos de los presupuestos, en la forma que reglamentariamente se establezca, los ingresos de naturaleza no tributaria derivados de las siguientes operaciones:</p><p>a) Aportaciones o compromisos firmes de aportación de personas físicas o jurídicas para financiar, juntamente con la entidad local o con alguno de sus organismos autónomos, gastos que por su naturaleza están comprendidos en sus fines u objetivos.</p><p>b) Enajenaciones de bienes de la entidad local o de sus organismos autónomos.</p><p>c) Prestación de servicios.</p><p>d) Reembolso de préstamos.</p><p>e) Reintegros de pagos indebidos con cargo al presupuesto corriente, en cuanto a reposición del crédito en la correspondiente cuantía.</p>`,dis:`<ul>
<li><b>Naturaleza:</b> la <span class="t" data-k="generacion">generación</span> aumenta el crédito porque ha entrado dinero nuevo <b>no tributario</b>.</li>
<li><b>Cinco operaciones habilitantes:</b>
<ol><li><b>a)</b> aportaciones o compromisos firmes de aportación de personas físicas o jurídicas para <b>cofinanciar</b> gastos comprendidos en los fines de la entidad o de sus organismos;</li>
<li><b>b)</b> <b>enajenaciones</b> de bienes de la entidad o de sus organismos autónomos;</li>
<li><b>c)</b> <b>prestación de servicios</b>;</li>
<li><b>d)</b> <b>reembolso de préstamos</b>;</li>
<li><b>e)</b> <b>reintegros de pagos indebidos</b> con cargo al presupuesto corriente, como reposición del crédito.</li></ol></li>
<li><b>Forma:</b> la que se establezca <b>reglamentariamente</b>.</li>
</ul>`,llano:`<p>Si aparece un dinero que no estaba previsto y no procede de impuestos —una subvención comprometida, la venta de un solar, el reintegro de un pago mal hecho—, ese dinero puede convertirse en crédito para gastar. No se trata de recortar en otro sitio: el presupuesto crece porque han crecido los ingresos.</p>`,porque:`<p>Sería absurdo rechazar una subvención de 200.000 € porque no estaba en el presupuesto de enero. La generación permite <b>absorber ingresos sobrevenidos</b> sin montar el procedimiento solemne del crédito extraordinario. Se limita a ingresos <b>no tributarios</b> porque los tributarios ya están previstos de forma global y su mayor recaudación se canaliza por otras vías (por ejemplo, financiando un suplemento).</p>`,ej:`<ul>
<li><b>Cotidiano:</b> vendes la moto vieja por 1.200 € y ese dinero se convierte en presupuesto para reformar el baño: no has recortado nada, has ingresado.</li>
<li><b>Real:</b> la Diputación concede 75.000 € para un programa de empleo con compromiso firme documentado. El Ayuntamiento genera crédito por esos 75.000 € en la partida correspondiente (181.a).</li>
<li><b>Caso límite:</b> una empresa devuelve 4.300 € cobrados de más en una certificación del ejercicio corriente. Es reintegro de pago indebido: <b>repone</b> el crédito (181.e).</li>
</ul>`,noej:`<ul>
<li><b>No genera crédito</b> una mayor recaudación del IBI: es ingreso <b>tributario</b>. Podrá financiar un suplemento (art. 177.4), pero no una generación.</li>
<li><b>No basta</b> una promesa verbal de aportación: la letra a) exige aportación o <b>compromiso firme</b>.</li>
</ul>`,conex:`<ul>
<li><b>Art. 173.6.a):</b> exige documentos fehacientes de compromisos firmes de aportación.</li>
<li><b>Art. 165.2:</b> los ingresos afectados, que suelen ser el origen de la generación.</li>
<li><b>Art. 182.1.d):</b> los créditos autorizados en función de la efectiva recaudación de derechos afectados son incorporables.</li>
</ul>`,trampas:`<ul>
<li>Solo ingresos de naturaleza <b>NO tributaria</b>. Es la palabra que decide la pregunta.</li>
<li>Son <b>cinco</b> supuestos tasados; el más olvidado es el <b>reembolso de préstamos</b>.</li>
<li>Generación ≠ ampliación: la ampliación exige estar listada en las bases; la generación, un ingreso de los cinco tipos.</li>
</ul>`,ancla:`<p><b>"A-E-P-R-R"</b>: <b>A</b>portaciones · <b>E</b>najenaciones · <b>P</b>restación de servicios · <b>R</b>eembolso de préstamos · <b>R</b>eintegros de pagos indebidos.<br>Regla de oro: <b>si es tributo, no genera</b>.</p>`,vis:`<svg viewBox="0 0 640 175" role="img" aria-label="Supuestos de generación de crédito">
<rect x="230" y="10" width="180" height="36" rx="8" fill="var(--ej-bg)" stroke="var(--ej)"/>
<text x="320" y="33" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ej)">Ingreso NO tributario</text>

<line x1="200" y1="60" x2="200" y2="76" stroke="var(--ej)" stroke-width="2"/><rect x="150" y="76" width="110" height="46" rx="6" fill="var(--panel)" stroke="var(--line)"/><text x="205" y="95">b) Enajenación</text><text x="205" y="111">de bienes</text>

<line x1="440" y1="60" x2="440" y2="76" stroke="var(--ej)" stroke-width="2"/><rect x="390" y="76" width="110" height="46" rx="6" fill="var(--panel)" stroke="var(--line)"/><text x="445" y="95">d) Reembolso</text><text x="445" y="111">de préstamos</text>
<line x1="560" y1="60" x2="560" y2="76" stroke="var(--ej)" stroke-width="2"/><rect x="510" y="76" width="110" height="46" rx="6" fill="var(--panel)" stroke="var(--line)"/><text x="565" y="95">e) Reintegros de</text><text x="565" y="111">pagos indebidos</text>

<text x="320" y="150" text-anchor="middle" font-size="11" fill="var(--exc)">Si el ingreso es TRIBUTARIO, no cabe generación de crédito</text>
</svg>`},
{n:182,t:"Incorporaciones de crédito",ubic:"Título VI (Presupuesto y gasto público) ▸ Capítulo I (De los presupuestos) ▸ Sección 2.ª (De los créditos y sus modificaciones)",idea:"Cuatro tipos de crédito sobrante se salvan y pasan al año siguiente.",literal:`<p>1. No obstante lo dispuesto en el artículo 175 de esta ley, podrán incorporarse a los correspondientes créditos de los presupuestos de gastos del ejercicio inmediato siguiente, siempre que existan para ello los suficientes recursos financieros:</p><p>a) Los créditos extraordinarios y los suplementos de créditos, así como las transferencias de crédito, que hayan sido concedidos o autorizados, respectivamente, en el último trimestre del ejercicio.</p><p>b) Los créditos que amparen los compromisos de gasto a que hace referencia el apartado 2.b) del artículo 176 de esta ley.</p><p>c) Los créditos por operaciones de capital.</p><p>d) Los créditos autorizados en función de la efectiva recaudación de derechos afectados.</p><p>2. Los remanentes incorporados según lo prevenido en el apartado anterior podrán ser aplicados tan sólo dentro del ejercicio presupuestario al que la incorporación se acuerde y, en el supuesto del párrafo a) de dicho apartado, para los mismos gastos que motivaron, en cada caso, su concesión y autorización.</p><p>3. Los créditos que amparen proyectos financiados con ingresos afectados deberán incorporarse obligatoriamente, salvo que se desista total o parcialmente de iniciar o continuar la ejecución del gasto.</p>`,dis:`<ul>
<li><b>Requisito común (182.1):</b> que existan <b>suficientes recursos financieros</b>.</li>
<li><b>Supuestos incorporables:</b>
<ol><li><b>a)</b> créditos extraordinarios, suplementos y transferencias concedidos o autorizados en el <b>último trimestre</b> del ejercicio;</li>
<li><b>b)</b> créditos que amparen <b>compromisos de gasto</b> del art. 176.2.b);</li>
<li><b>c)</b> créditos por <b>operaciones de capital</b>;</li>
<li><b>d)</b> créditos autorizados en función de la <b>efectiva recaudación de derechos afectados</b>.</li></ol></li>
<li><b>Límite temporal (182.2):</b> los remanentes incorporados solo pueden aplicarse <b>dentro del ejercicio</b> al que se acuerde la incorporación; y en el caso de la letra a), <b>para los mismos gastos</b> que motivaron su concesión.</li>
<li><b>Incorporación obligatoria (182.3):</b> los créditos que amparen <b>proyectos financiados con ingresos afectados</b> <b>deberán</b> incorporarse, salvo desistimiento total o parcial de iniciar o continuar el gasto.</li>
</ul>`,llano:`<p>La regla es que el crédito sobrante muere el 31 de diciembre (art. 175). Este artículo abre cuatro rendijas: lo aprobado en el último trimestre, lo que ya estaba comprometido, las inversiones y lo ligado a un ingreso finalista. Todo lo que se rescate hay que gastarlo en ese año nuevo, no más allá. Y lo que va unido a una subvención finalista no es que se pueda incorporar: <b>hay que</b> incorporarlo.</p>`,porque:`<p>Anular sin más los créditos aprobados en noviembre o los de una obra ya adjudicada sería absurdo: no ha habido tiempo material de ejecutarlos. La incorporación evita ese desperdicio, pero se limita para que no se convierta en una bolsa perpetua: por eso solo dura un ejercicio y por eso los de la letra a) conservan su finalidad original. La obligatoriedad del apartado 3 protege al financiador: si alguien te dio dinero para un fin concreto, no puedes dejarlo caducar.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> un vale regalo que caduca en un año: tienes que usarlo dentro del plazo y para lo que dice el vale.</li>
<li><b>Real:</b> un suplemento de crédito de 90.000 € aprobado el 20 de noviembre de 2026 para la reforma del mercado. A 31 de diciembre solo se han reconocido 12.000 €. Los 78.000 € restantes son incorporables (182.1.a) y solo podrán aplicarse en 2027 <b>a esa misma reforma</b>.</li>
<li><b>Caso límite:</b> subvención de la Junta para un centro de día, con crédito sin ejecutar. La incorporación es <b>obligatoria</b> (182.3), salvo que se desista formalmente del proyecto.</li>
</ul>`,noej:`<ul>
<li><b>No es incorporable</b> un crédito ordinario de gasto corriente no comprometido: muere con el ejercicio (art. 175).</li>
<li><b>No se pueden arrastrar</b> los remanentes incorporados a un tercer ejercicio: solo valen para el año de la incorporación.</li>
<li><b>No es potestativa</b> la incorporación de los créditos con financiación afectada.</li>
</ul>`,conex:`<ul>
<li><b>Art. 175:</b> la regla general de anulación que este artículo excepciona.</li>
<li><b>Art. 176.2.b):</b> los compromisos de ejercicios anteriores.</li>
<li><b>Art. 177:</b> los créditos extraordinarios y suplementos de la letra a).</li>
<li><b>Art. 193:</b> el remanente de tesorería, del que depende la existencia de recursos financieros suficientes.</li>
</ul>`,trampas:`<ul>
<li>Letra a): <b>último trimestre</b>, e incluye también las <b>transferencias</b>, no solo extraordinarios y suplementos.</li>
<li>Los incorporados de la letra a) mantienen la <b>misma finalidad</b>; los demás, no necesariamente.</li>
<li>Solo <b>un ejercicio</b>: no se encadenan incorporaciones.</li>
<li>El apartado 3 dice "<b>deberán</b>": obligatoria en financiación afectada.</li>
</ul>`,ancla:`<p><b>Las cuatro rendijas — "TRI-CO-CA-FI":</b> último <b>TRI</b>mestre · <b>CO</b>mpromisos · <b>CA</b>pital · <b>FI</b>nalistas.<br>Y la regla del tiempo: <b>un año y se acabó</b>.</p>`,vis:`<svg viewBox="0 0 640 195" role="img" aria-label="Supuestos de incorporación de remanentes de crédito">

<text x="320" y="175" text-anchor="middle" font-size="10" fill="currentColor">Solo aplicables en el ejercicio de la incorporación · la letra a), a los mismos gastos</text>
</svg>`}];

<script>
const PLAZOS=[["4 ejercicios", "Máximo de años a los que puede extenderse el gasto plurianual de las letras a), b) y e)", "Entidad", "174.3", "El Pleno puede ampliarlo excepcionalmente"], ["70 % / 60 % / 50 % / 50 %", "Porcentajes máximos imputables a cada ejercicio futuro (letras a y e)", "Entidad", "174.3", "Sobre el crédito del año del compromiso"], ["3 meses", "Plazo para solicitar al Pleno crédito extraordinario o suplemento tras sentencia judicial", "Presidente", "173.4", "Desde la notificación de la resolución"], ["31 de diciembre", "Anulación de pleno derecho de los créditos no afectados a obligaciones reconocidas", "—", "175", "Salvo incorporación del art. 182"], ["5 %", "Límite del importe anual de operaciones de crédito para financiar gasto corriente", "Pleno", "177.5", "Sobre recursos por operaciones corrientes"], ["25 %", "Límite de carga financiera total incluida la operación proyectada", "Pleno", "177.5", "Condición cumulativa"], ["Antes de la renovación", "Las operaciones del 177.5 deben quedar canceladas antes de renovar la Corporación", "Pleno", "177.5", "Tercera condición cumulativa"], ["8 días", "Sustanciación de reclamaciones en acuerdos por calamidades públicas", "Entidad", "177.6", "Silencio desestimatorio"], ["Mayoría absoluta", "Quórum del art. 47.3 LBRL para la excepción del 177.5", "Pleno", "177.5", "Declaración expresa de necesidad y urgencia"], ["Último trimestre", "Créditos extraordinarios, suplementos y transferencias incorporables", "Entidad", "182.1.a)", "Para los mismos gastos que los motivaron"], ["Un ejercicio", "Vigencia de los remanentes incorporados", "Entidad", "182.2", "No se encadenan incorporaciones"]];
const FLASH=[["¿Qué dos caras tiene la especialidad de los créditos?", "<b>Cualitativa</b> (solo para su finalidad, 172.1) y <b>cuantitativa</b> (limitativos y vinculantes, 172.2)."], ["¿Sobre qué se hace el control fiscal del gasto?", "Sobre el <b>nivel de vinculación</b> (art. 172.2 en relación con el 167.4); el contable, sobre la aplicación presupuestaria."], ["¿Cuándo son exigibles las obligaciones de la hacienda local?", "Cuando resulten de la ejecución de sus presupuestos o de <b>sentencia judicial firme</b> (art. 173.1)."], ["¿Se pueden embargar los bienes de una entidad local?", "No, salvo los <b>bienes patrimoniales no afectados</b> a un uso o servicio público (art. 173.2)."], ["¿Qué plazo hay para pedir crédito tras una sentencia?", "<b>Tres meses</b> desde la notificación de la resolución judicial (art. 173.4)."], ["¿Qué ocurre si se compromete gasto sin crédito?", "Los acuerdos, resoluciones y actos son <b>nulos de pleno derecho</b>, sin perjuicio de responsabilidades (art. 173.5)."], ["Requisito temporal del gasto plurianual", "Que su <b>ejecución se inicie en el propio ejercicio</b> (art. 174.2)."], ["Porcentajes del gasto plurianual", "<b>70 %</b> el ejercicio siguiente, <b>60 %</b> el segundo, <b>50 %</b> el tercero y el cuarto (art. 174.3), solo para las letras a) y e)."], ["¿Quién puede ampliar anualidades y porcentajes?", "El <b>Pleno</b>, en casos excepcionales (art. 174.5)."], ["¿Qué pasa con los créditos no gastados a 31 de diciembre?", "Quedan <b>anulados de pleno derecho</b> si no están afectados a obligaciones reconocidas, salvo el art. 182 (art. 175)."], ["Excepciones a la temporalidad de los créditos", "Atrasos de <b>personal</b> y obligaciones de <b>compromisos</b> de ejercicios anteriores previa incorporación (art. 176.2)."], ["Diferencia entre crédito extraordinario y suplemento", "<b>Extraordinario</b>: no existe crédito. <b>Suplemento</b>: existe pero es insuficiente y no ampliable (art. 177.1)."], ["¿Quién incoa y quién aprueba el crédito extraordinario?", "Lo <b>incoa el presidente</b>, lo informa la Intervención y lo <b>aprueba el Pleno</b> con los trámites del presupuesto (art. 177.1 y 2)."], ["Recursos para financiar un suplemento", "<b>Remanente líquido de tesorería</b>, nuevos o mayores ingresos recaudados, y bajas de créditos no comprometidos (art. 177.4)."], ["Las tres condiciones del art. 177.5", "Importe anual ≤ <b>5 %</b> de los recursos corrientes · carga financiera ≤ <b>25 %</b> · canceladas antes de la renovación de la Corporación. Con quórum del art. 47.3 LBRL."], ["Régimen de las calamidades públicas", "Acuerdos <b>inmediatamente ejecutivos</b>; reclamaciones sustanciadas en <b>8 días</b>, con silencio <b>desestimatorio</b> (art. 177.6)."], ["¿Qué es un crédito ampliable?", "El que las <b>bases de ejecución</b> relacionan de modo taxativo y que se incrementa en función de la efectividad de los recursos afectados (art. 178)."], ["¿Quién aprueba las transferencias entre grupos de función?", "El <b>Pleno</b>, salvo que bajas y altas afecten a créditos de <b>personal</b> (art. 179.2)."], ["¿Altera la transferencia el importe total del presupuesto?", "No: lo que sube en una aplicación baja en otra."], ["Los tres límites objetivos de las transferencias", "No afectar a ampliables ni extraordinarios · no minorar lo suplementado, transferido o incorporado · no incrementar lo ya minorado (art. 180.1)."], ["¿A qué no se aplican los límites del art. 180?", "A los programas de <b>imprevistos y funciones no clasificadas</b> y a las <b>reorganizaciones administrativas</b> aprobadas por el Pleno (art. 180.2)."], ["Los cinco supuestos de generación de crédito", "Aportaciones · enajenaciones · prestación de servicios · reembolso de préstamos · reintegros de pagos indebidos. Siempre ingresos <b>no tributarios</b> (art. 181)."], ["Los cuatro supuestos de incorporación de remanentes", "Extraordinarios, suplementos y transferencias del <b>último trimestre</b> · compromisos de ejercicios anteriores · operaciones de <b>capital</b> · créditos ligados a derechos <b>afectados</b> (art. 182.1)."], ["¿Cuánto duran los remanentes incorporados?", "Solo el <b>ejercicio</b> en que se acuerda la incorporación; los de la letra a), además, para los mismos gastos (art. 182.2)."], ["¿Qué incorporación es obligatoria?", "La de los créditos que amparan <b>proyectos con financiación afectada</b>, salvo desistimiento (art. 182.3)."]];
const TEST=[{"a": 172, "q": "El carácter de los créditos autorizados en el estado de gastos es:", "o": [["limitativo y vinculante", 1, "Correcto: art. 172.2, literalmente."], ["estimativo y orientativo", 0, "Eso describe los <b>ingresos</b>, no los créditos de gasto."], ["limitativo pero no vinculante", 0, "La ley usa los dos adjetivos unidos."], ["vinculante solo para el capítulo I", 0, "No hay tal restricción: los niveles de vinculación se fijan conforme al propio 172.2."]]}, {"a": 173, "q": "Los bienes de la hacienda local son siempre inembargables.", "vf": true, "ok": false, "fb": "<b>Falso.</b> El art. 173.2 exceptúa los <b>bienes patrimoniales no afectados</b> a un uso o servicio público."}, {"a": 173, "q": "Completa: «Si para el pago de una sentencia fuere necesario un crédito extraordinario o un suplemento, deberá solicitarse del Pleno dentro de los ______ meses siguientes a la notificación».", "gap": "tres", "fb": "<b>Tres meses</b> (art. 173.4), contados desde la <b>notificación</b> de la resolución judicial."}, {"a": 173, "q": "Los acuerdos que comprometen gasto por encima de los créditos autorizados son:", "o": [["nulos de pleno derecho", 1, "Correcto: art. 173.5. Grado máximo de invalidez."], ["anulables a instancia de la Intervención", 0, "No: la ley opta por la nulidad radical, no por la anulabilidad."], ["válidos si se convalidan por el Pleno", 0, "La nulidad de pleno derecho no admite convalidación."], ["válidos si existe consignación en el año siguiente", 0, "No: la nulidad se produce en el momento del compromiso."]]}, {"a": 174, "q": "Los porcentajes máximos aplicables a los gastos plurianuales de las letras a) y e) son:", "o": [["70 %, 60 %, 50 % y 50 %", 1, "Correcto: art. 174.3. Los ejercicios tercero y cuarto comparten el 50 %."], ["70 %, 60 %, 50 % y 40 %", 0, "Error clásico: el cuarto ejercicio mantiene el 50 %, no baja al 40 %."], ["80 %, 70 %, 60 % y 50 %", 0, "No: la escalera empieza en el 70 %."], ["50 % en todos los ejercicios", 0, "No: los dos primeros tienen porcentajes superiores."]]}, {"a": 174, "q": "Para comprometer gasto plurianual basta con que el gasto figure entre los casos del art. 174.2.", "vf": true, "ok": false, "fb": "<b>Falso.</b> Además se exige que su <b>ejecución se inicie en el propio ejercicio</b> (art. 174.2) y queda subordinado al crédito que autoricen los presupuestos futuros (174.1)."}, {"a": 175, "q": "Los créditos no afectados a obligaciones reconocidas el último día del ejercicio:", "o": [["quedan anulados de pleno derecho, salvo los supuestos del art. 182", 1, "Correcto: art. 175, con remisión cerrada al art. 182."], ["se incorporan automáticamente al ejercicio siguiente", 0, "No: la incorporación es la excepción y requiere recursos financieros suficientes."], ["pasan al remanente de tesorería como crédito disponible", 0, "El remanente es otra magnitud; el crédito como tal se anula."], ["se anulan salvo acuerdo del Pleno en contrario", 0, "No existe esa posibilidad genérica: solo el art. 182."]]}, {"a": 176, "q": "¿Cuál de estas obligaciones se aplica al presupuesto vigente en el momento de su reconocimiento?", "o": [["Los atrasos a favor del personal retribuido con cargo al presupuesto de la entidad", 1, "Correcto: excepción del art. 176.2.a)."], ["Cualquier factura de un ejercicio anterior", 0, "No: solo las derivadas de compromisos debidamente adquiridos con crédito incorporado."], ["Las obligaciones de las sociedades mercantiles municipales", 0, "No es el supuesto del artículo."], ["Las obligaciones anuladas en el ejercicio anterior", 0, "No figura como excepción."]]}, {"a": 177, "q": "No existe en el presupuesto crédito alguno para atender un gasto urgente. Procede:", "o": [["un crédito extraordinario", 1, "Correcto: cuando <b>no existe</b> crédito (art. 177.1)."], ["un suplemento de crédito", 0, "El suplemento procede cuando el crédito <b>existe</b> pero es insuficiente y no ampliable."], ["una transferencia de crédito", 0, "La transferencia mueve crédito existente entre aplicaciones; no crea una nueva finalidad no prevista."], ["una generación de crédito", 0, "La generación exige un ingreso no tributario de los cinco tipos del art. 181."]]}, {"a": 177, "q": "Completa: «El expediente de crédito extraordinario habrá de ser previamente informado por la ______».", "gap": "intervención", "fb": "Por la <b>Intervención</b> (art. 177.2), antes de someterse a la aprobación del Pleno."}, {"a": 177, "q": "Los acuerdos de habilitación de créditos por calamidades públicas son inmediatamente ejecutivos y las reclamaciones se sustancian en ocho días.", "vf": true, "ok": true, "fb": "<b>Verdadero</b> (art. 177.6). Además, si no se notifica resolución en ese plazo, las reclamaciones se entienden <b>desestimadas</b>."}, {"a": 177, "q": "¿Cuál NO es un recurso válido para financiar un suplemento de crédito?", "o": [["Bajas de créditos ya comprometidos de otras partidas", 1, "Correcto: el art. 177.4 exige que los créditos dados de baja <b>no estén comprometidos</b>."], ["El remanente líquido de tesorería", 0, "Sí lo es: art. 177.4."], ["Nuevos o mayores ingresos recaudados sobre los previstos", 0, "Sí lo es: art. 177.4."], ["Bajas de créditos no comprometidos reducibles sin perturbar el servicio", 0, "Sí lo es: art. 177.4."]]}, {"a": 178, "q": "Un crédito es ampliable cuando:", "o": [["figura de modo taxativo en las bases de ejecución y se incrementa según la efectividad de los recursos afectados", 1, "Correcto: art. 178, excepción expresa al art. 172.2."], ["lo decide el presidente por razones de urgencia", 0, "No: la condición es formal y previa, en las bases de ejecución."], ["existe cualquier ingreso afectado", 0, "No basta el ingreso afectado: hace falta la declaración taxativa."], ["así lo acuerda el Pleno una vez iniciado el ejercicio", 0, "La declaración es previa, en las bases aprobadas con el presupuesto."]]}, {"a": 179, "q": "La aprobación de transferencias entre distintos grupos de función corresponde al Pleno:", "o": [["salvo cuando las bajas y altas afecten a créditos de personal", 1, "Correcto: excepción literal del art. 179.2."], ["en todo caso, sin excepción", 0, "Falta la salvedad de los créditos de personal."], ["solo si superan el 10 % del crédito", 0, "El criterio no es cuantitativo."], ["nunca: siempre es competencia del presidente", 0, "No: el art. 179.2 reserva expresamente ese supuesto al Pleno."]]}, {"a": 180, "q": "Las limitaciones a las transferencias de crédito NO se aplican:", "o": [["a los programas de imprevistos y funciones no clasificadas ni a las reorganizaciones administrativas aprobadas por el Pleno", 1, "Correcto: las dos excepciones del art. 180.2."], ["a los créditos extraordinarios concedidos durante el ejercicio", 0, "Al contrario: la letra a) del 180.1 los protege expresamente."], ["a los créditos incorporados de presupuestos cerrados", 0, "Están protegidos por la letra b)."], ["a ninguna transferencia: son límites absolutos", 0, "No: el propio 180.2 establece excepciones."]]}, {"a": 181, "q": "Puede generar crédito el ingreso derivado de:", "o": [["la enajenación de bienes de la entidad local", 1, "Correcto: art. 181.b), ingreso no tributario."], ["una mayor recaudación del IBI", 0, "No: es un ingreso <b>tributario</b>. Podría financiar un suplemento, pero no genera crédito."], ["el recargo de apremio de una tasa", 0, "También tributario: excluido del art. 181."], ["una previsión de mayor recaudación futura", 0, "La generación exige el ingreso o el compromiso firme, no una previsión."]]}, {"a": 182, "q": "Completa: «Los créditos que amparen proyectos financiados con ingresos afectados ______ incorporarse obligatoriamente, salvo desistimiento».", "gap": "deberán", "fb": "<b>Deberán</b> (art. 182.3): es la única incorporación obligatoria del artículo."}, {"a": 182, "q": "Los remanentes incorporados pueden aplicarse en el ejercicio de la incorporación y también en el siguiente.", "vf": true, "ok": false, "fb": "<b>Falso.</b> El art. 182.2 los limita a aplicarse <b>tan solo dentro del ejercicio</b> al que la incorporación se acuerde."}, {"a": 182, "q": "¿Cuál de estos créditos NO es incorporable conforme al art. 182.1?", "o": [["Un crédito ordinario de gasto corriente no comprometido", 1, "Correcto: se anula conforme al art. 175, al no encajar en ninguno de los cuatro supuestos."], ["Un suplemento concedido en el último trimestre", 0, "Sí lo es: letra a)."], ["Un crédito por operaciones de capital", 0, "Sí lo es: letra c)."], ["Un crédito autorizado en función de la efectiva recaudación de derechos afectados", 0, "Sí lo es: letra d), y además con incorporación obligatoria por el apartado 3."]]}, {"a": 172, "q": "El nivel de vinculación jurídica y la aplicación presupuestaria son lo mismo.", "vf": true, "ok": false, "fb": "<b>Falso.</b> La aplicación presupuestaria es la casilla concreta del crédito; el nivel de vinculación es la bolsa dentro de la cual puede moverse el gasto sin modificación. Sobre la primera se hace el control contable, sobre el segundo el fiscal (art. 167.4)."}];
const CASOS=[{"t": "Caso 1 · ¿Qué modificación toca?", "e": "Cuatro situaciones en el mismo ayuntamiento durante 2026: <b>(1)</b> hay que indemnizar una expropiación por 210.000 € y no existe ninguna partida; <b>(2)</b> la partida de energía eléctrica tenía 300.000 € y se agota en octubre, y no está declarada ampliable; <b>(3)</b> la Diputación concede 60.000 € con compromiso firme para un programa de empleo; <b>(4)</b> sobran 25.000 € en festejos y faltan 25.000 € en ayudas sociales, que son áreas de gasto distintas. <b>Identifica la figura y el órgano competente en cada caso.</b>", "s": "<p><b>(1) Crédito extraordinario</b> (art. 177.1): no existe crédito. Lo incoa el presidente, lo informa la Intervención y lo aprueba el <b>Pleno</b>, con los trámites del art. 169. Financiación: remanente líquido, mayores ingresos o bajas no comprometidas.</p><p><b>(2) Suplemento de crédito</b> (art. 177.1): el crédito existe pero es insuficiente y no ampliable. Mismo procedimiento que el anterior.</p><p><b>(3) Generación de crédito</b> (art. 181.a): aportación con compromiso firme de un tercero, ingreso no tributario. Se tramita en la forma reglamentariamente establecida; no exige el procedimiento del presupuesto. Recuerda además el art. 173.6.a): la disponibilidad queda condicionada a documentos fehacientes.</p><p><b>(4) Transferencia de crédito</b> (arts. 179 y 180): el total no varía. Como cruza grupos de función y no son créditos de personal, la aprueba el <b>Pleno</b> (179.2) y sigue los trámites de los arts. 169 a 171 (179.4).</p>"}, {"t": "Caso 2 · El cierre del ejercicio", "e": "A 31 de diciembre de 2026 quedan sin ejecutar: <b>(a)</b> 40.000 € de un suplemento aprobado el 12 de noviembre para reformar la biblioteca; <b>(b)</b> 15.000 € de la partida de material de oficina; <b>(c)</b> 250.000 € de una obra adjudicada y contratada en septiembre, sin certificaciones; <b>(d)</b> 90.000 € de un proyecto financiado con una subvención finalista de la Junta. <b>¿Qué ocurre con cada importe?</b>", "s": "<p><b>(a) Incorporable</b> por el art. 182.1.a): suplemento concedido en el <b>último trimestre</b>. Solo podrá aplicarse en 2027 y <b>a la misma finalidad</b> (reforma de la biblioteca), por exigencia del 182.2.</p><p><b>(b) Se anula</b> de pleno derecho (art. 175): crédito ordinario no afectado a obligaciones reconocidas y ajeno a los cuatro supuestos del art. 182.</p><p><b>(c) Incorporable</b> por el art. 182.1.b) en relación con el 176.2.b): ampara compromisos de gasto debidamente adquiridos. También encajaría en la letra c) si son operaciones de capital.</p><p><b>(d) Incorporación OBLIGATORIA</b> (art. 182.3): proyecto con financiación afectada. Solo cabría no incorporarlo si se desiste total o parcialmente de ejecutar el gasto.</p><p><b>Requisito común:</b> que existan suficientes recursos financieros (art. 182.1).</p>"}, {"t": "Caso 3 · La sentencia y el plurianual", "e": "El 10 de febrero de 2026 se notifica al Ayuntamiento una sentencia firme que le condena a pagar 480.000 €. No hay crédito. Además, el equipo de gobierno quiere adjudicar en diciembre de 2026 una obra plurianual de 2027 a 2030, sin ejecutar nada en 2026. El crédito de inversiones de 2026 asciende a 800.000 €. <b>Analiza ambas operaciones.</b>", "s": "<p><b>1) La sentencia.</b> La obligación es exigible pese a no estar presupuestada, porque procede de sentencia firme (art. 173.1). No cabe embargo sobre bienes afectados a un servicio público (173.2) y la ejecución corresponde exclusivamente a la entidad (173.3). El presidente debe solicitar al Pleno el crédito extraordinario <b>antes del 10 de mayo de 2026</b> (tres meses desde la notificación, art. 173.4).</p><p><b>2) El plurianual.</b> No puede comprometerse: el art. 174.2 exige que la <b>ejecución se inicie en el propio ejercicio</b>. Si se iniciara en 2026, los límites serían: máximo cuatro ejercicios y, sobre los 800.000 € de crédito de 2026, hasta <b>560.000 €</b> en 2027 (70 %), <b>480.000 €</b> en 2028 (60 %) y <b>400.000 €</b> en 2029 y 2030 (50 % cada uno), salvo que el Pleno amplíe anualidades o porcentajes por excepcionalidad (174.5). Todo ello con contabilización independiente (174.6).</p>"}];

const INTRO_HTML="<section class=\"card\" id=\"intro\"><h2>Bloque 2 del tema 8 · De los créditos y sus modificaciones</h2><p class=\"small\">Ya sabes cómo se aprueba el presupuesto. Ahora toca lo que pasa cuando empieza a funcionar: qué disciplina tienen los créditos (arts. 172 a 176) y de qué siete maneras pueden modificarse durante el ejercicio (arts. 177 a 182).</p><div class=\"box ej\"><span class=\"lbl\">La idea que ordena todo el bloque</span>Hay dos familias de modificaciones: las que <b>aumentan el total</b> del presupuesto (crédito extraordinario, suplemento, ampliación, generación e incorporación) y las que <b>no lo alteran</b> (transferencia). De ahí salen todas las diferencias de procedimiento: cuanto más sube el techo, más solemne es el trámite.</div><div class=\"box warn\"><span class=\"lbl\">Advertencia de vigencia</span>Texto consolidado del RDLeg 2/2004 actualizado a <b>28 de enero de 2026</b>. Dos remisiones han quedado desfasadas en el texto: el art. 174.2.b) cita el RDLeg 2/2000 (hoy Ley 9/2017 de Contratos del Sector Público) y el art. 179.2 habla de \"grupos de función\" (terminología anterior a la Orden EHA/3565/2008). Verifica siempre en el BOE consolidado.</div><svg viewBox=\"0 0 660 250\" role=\"img\" aria-label=\"Mapa conceptual de los créditos y sus modificaciones\"><rect x=\"230\" y=\"8\" width=\"200\" height=\"36\" rx=\"9\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"330\" y=\"31\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"#fff\">LOS CRÉDITOS</text><line x1=\"330\" y1=\"44\" x2=\"330\" y2=\"60\" stroke=\"var(--acc)\" stroke-width=\"2\"/><line x1=\"140\" y1=\"60\" x2=\"520\" y2=\"60\" stroke=\"var(--acc)\" stroke-width=\"2\"/><line x1=\"140\" y1=\"60\" x2=\"140\" y2=\"78\" stroke=\"var(--acc)\" stroke-width=\"2\"/><line x1=\"520\" y1=\"60\" x2=\"520\" y2=\"78\" stroke=\"var(--acc)\" stroke-width=\"2\"/><rect x=\"25\" y=\"78\" width=\"230\" height=\"150\" rx=\"9\" fill=\"var(--acc-soft)\" stroke=\"var(--a var q=document.getElementById('q'),timer=null;

  clearMarks();
  var term=q.value.trim();
  document.querySelectorAll('section.card').forEach(function(s){s.classList.remove('hide');});
  if(term.length<3)return;
  var rx=new RegExp(term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
  document.querySelectorAll('section.card').forEach(function(s){
   var found=false;
   var w=document.createTreeWalker(s,NodeFilter.SHOW_TEXT,null);var nodes=[];
   while(w.nextNode()){var nd=w.currentNode;
    if(nd.parentNode.closest('script,style,mark'))continue;
    if(rx.test(nd.nodeValue)){nodes.push(nd);rx.lastIndex=0;}}
   nodes.forEach(function(nd){
    found=true;
    var span=document.createElement('span');
    span.innerHTML=nd.nodeValue.replace(rx,function(m){return '<mark class="hit">'+m+'</mark>';});
    nd.parentNode.replaceChild(span,nd);});

<script>
/* ═══ Mejoras de interacción · Bloque II ═══ */
(function(){
"use strict";
var K_THEME="oposi_bII_theme", K_FS="oposi_bII_fs", K_STREAK="oposi_bII_streak";
function load(k,f){try{var v=localStorage.getItem(k);return v?JSON.parse(v):f;}catch(e){return f;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
var root=document.documentElement;

/* Tema persistente (sobrescribe el toggle simple anterior) */
var saved=load(K_THEME,null);
if(saved){root.setAttribute("data-theme",saved);}
else if(window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches){root.setAttribute("data-theme","dark");}
var bt=document.getElementById("theme");
if(bt)bt.onclick=function(){
  var n=root.getAttribute("data-theme")==="dark"?"light":"dark";
  root.setAttribute("data-theme",n);save(K_THEME,n);
};

/* Tamaño de texto persistente */
var fs=load(K_FS,16);
function setFs(v){fs=Math.max(13,Math.min(22,v));root.style.setProperty("--fs",fs+"px");save(K_FS,fs);}
setFs(fs);
var bp=document.getElementById("fs+"),bm=document.getElementById("fs-");
if(bp)bp.onclick=function(){setFs(fs+1);};
if(bm)bm.onclick=function(){setFs(fs-1);};

(function(){
  var el=document.getElementById("streakN");if(!el)return;
  var hoy=new Date().toISOString().slice(0,10);
  var s=load(K_STREAK,{last:null,n:0});
  if(s.last!==hoy){
    var ayer=new Date(Date.now()-864e5).toISOString().slice(0,10);
    s.n=(s.last===ayer)?s.n+1:1;s.last=hoy;save(K_STREAK,s);
  }

})();

/* Reveal on scroll para las tarjetas */
function reveal(){
  var els=document.querySelectorAll("section.card:not(.rv)");
  if(!els.length)return;
  if(!("IntersectionObserver" in window)){return;}
  var io=new IntersectionObserver(function(es){
    es.forEach(function(en){if(en.isIntersecting){en.target.classList.add("in");io.unobserve(en.target);}});
  },{threshold:.06,rootMargin:"0px 0px -30px 0px"});
  Array.prototype.forEach.call(els,function(el){el.classList.add("rv");io.observe(el);});
}

/* Sección activa en el índice lateral */
function spy(){
  var links=document.querySelectorAll("nav.side a[href^='#']");
  if(!links.length||!("IntersectionObserver" in window))return;
  var map={};
  Array.prototype.forEach.call(links,function(a){
    var t=document.getElementById(a.getAttribute("href").slice(1));
    if(t)map[t.id]=a;
  });
  var io=new IntersectionObserver(function(es){
    es.forEach(function(en){
      if(en.isIntersecting){
        Array.prototype.forEach.call(links,function(a){a.classList.remove("on");});
        if(map[en.target.id])map[en.target.id].classList.add("on");
      }
    });
  },{rootMargin:"-80px 0px -70% 0px",threshold:0});
  Object.keys(map).forEach(function(id){io.observe(document.getElementById(id));});
}

/* Ripple en botones */
document.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b||b.classList.contains("navtoggle"))return;
  var r=b.getBoundingClientRect(),d=Math.max(r.width,r.height),s=document.createElement("span");
  s.className="ripple";s.style.width=s.style.height=d+"px";
  s.style.left=(e.clientX-r.left-d/2)+"px";s.style.top=(e.clientY-r.top-d/2)+"px";
  b.appendChild(s);setTimeout(function(){if(s.parentNode)s.parentNode.removeChild(s);},560);
});

/* Atajos de teclado */
document.addEventListener("keydown",function(e){
  if(e.target.matches("input,textarea"))return;
  if(e.key==="/"){var q=document.getElementById("q");if(q){e.preventDefault();q.focus();}}

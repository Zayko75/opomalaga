<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>TRLHL · Arts. 183-193 bis · Ejecución y liquidación del presupuesto</title>
<style>
/* ═══════════════════════════════════════════════════════════════
   SISTEMA DE DISEÑO · "Académico Gamificado" · Bloque II
   Temas 8, 9 y 10 · Auxiliar Administrativo
   ═══════════════════════════════════════════════════════════════ */
:root{
  --fs:16px;

  --bg:#faf9f7;
  --bg-grad:radial-gradient(1100px 560px at 12% -8%, #ede9ff 0%, transparent 55%),
            radial-gradient(850px 460px at 96% 0%, #dcf5ee 0%, transparent 50%);
  --surface:#ffffff;
  --surface-2:#f4f3f0;
  --surface-3:#eceae5;
  --line:#e6e3dc;
  --line-strong:#d4d0c7;

  --ink:#15161c;
  --ink-2:#5d616e;
  --ink-3:#8b8f9c;

  --brand:#5b3df5;
  --brand-2:#7c5cff;
  --brand-soft:#efeaff;
  --brand-ring:rgba(91,61,245,.18);

  --legal:#4338ca;  --legal-bg:#eeecff;
  --ej:#059669;     --ej-bg:#e4f7f0;
  --warn:#c2690a;   --warn-bg:#fdf1de;
  --exc:#dc2626;    --exc-bg:#ffeceb;

  --ok:#16a34a; --ok-soft:#e7f7ec;
  --mid:#eab308; --mid-soft:#fdf6dd;
  --off:#a1a1aa; --off-soft:#f1f1f3;

  --sh-1:0 1px 2px rgba(20,20,30,.04), 0 2px 8px rgba(20,20,30,.04);
  --sh-2:0 2px 6px rgba(20,20,30,.05), 0 12px 28px rgba(20,20,30,.07);
  --sh-3:0 8px 20px rgba(91,61,245,.13), 0 24px 56px rgba(20,20,30,.10);
  --sh-glow:0 0 0 4px var(--brand-ring);

  --r-sm:9px; --r-md:14px; --r-lg:20px; --r-full:999px;

  --f-display:"Segoe UI Variable Display",system-ui,-apple-system,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-legal:ui-serif,Georgia,Cambria,"Times New Roman",serif;
  --f-mono:ui-monospace,"SF Mono","Cascadia Mono","Segoe UI Mono",Menlo,monospace;

  --t-h1:clamp(1.02rem,.95rem + .3vw,1.2rem);
  --t-h2:clamp(1.2rem,1.05rem + .6vw,1.55rem);
  --t-h3:clamp(1rem,.95rem + .25vw,1.12rem);
  --t-sm:.86rem;
  --t-xs:.75rem;

  --e-out:cubic-bezier(.22,1,.36,1);
  --e-spring:cubic-bezier(.34,1.56,.64,1);

  /* ── Compatibilidad con SVG y contenido generado ── */
  --panel:var(--surface);
  --ink2:var(--ink-2);
  --acc:var(--brand);
  --acc-soft:var(--brand-soft);
  --g:var(--ok); --y:var(--mid); --r:var(--exc);
}

html[data-theme="dark"]{
  --bg:#0a0b0f;
  --bg-grad:radial-gradient(1100px 560px at 12% -8%, #1c1740 0%, transparent 55%),
            radial-gradient(850px 460px at 96% 0%, #08302b 0%, transparent 50%);
  --surface:#13151b;
  --surface-2:#1a1d25;
  --surface-3:#232733;
  --line:#262a34;
  --line-strong:#343947;

  --ink:#eceef4;
  --ink-2:#9ba2b3;
  --ink-3:#6e7585;

  --brand:#8b6dff;
  --brand-2:#a78bff;
  --brand-soft:#1e1a3d;
  --brand-ring:rgba(139,109,255,.22);

  --legal:#a5b4fc; --legal-bg:#191b3a;
  --ej:#34d399;    --ej-bg:#0c2a24;
  --warn:#fbbf24;  --warn-bg:#2e2110;
  --exc:#fb7185;   --exc-bg:#331119;

  --ok:#4ade80; --ok-soft:#0e2a19;
  --mid:#facc15; --mid-soft:#2c2610;
  --off:#5b6070; --off-soft:#1c1f27;

  --sh-1:0 1px 2px rgba(0,0,0,.3), 0 2px 8px rgba(0,0,0,.25);
  --sh-2:0 2px 6px rgba(0,0,0,.35), 0 12px 28px rgba(0,0,0,.4);
  --sh-3:0 8px 20px rgba(139,109,255,.2), 0 24px 56px rgba(0,0,0,.5);
}

*,*::before,*::after{box-sizing:border-box}
html{font-size:var(--fs);scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);background-image:var(--bg-grad);
  background-attachment:fixed;background-repeat:no-repeat;
  color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.68;
  -webkit-font-smoothing:antialiased;
  transition:background-color .5s var(--e-out),color .3s;
}
::selection{background:var(--brand);color:#fff}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{font-family:var(--f-display);letter-spacing:-.022em;line-height:1.2}
.num{font-variant-numeric:tabular-nums}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:99px;border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3)}

/* ═══ HEADER ═══ */
header.top{
  position:sticky;top:0;z-index:60;
  background:color-mix(in srgb,var(--surface) 80%,transparent);
  backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);
  border-bottom:1px solid var(--line);
}
.top-in{max-width:1280px;margin:0 auto;padding:.65rem 1.1rem;display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.brandwrap{display:flex;align-items:center;gap:.65rem;min-width:0;flex:1}
.mark{
  width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;
  font-weight:800;font-size:.8rem;letter-spacing:-.02em;text-decoration:none;
  box-shadow:0 4px 14px var(--brand-ring);
  transition:transform .3s var(--e-spring),box-shadow .3s;
}
.mark:hover{transform:rotate(-8deg) scale(1.08);box-shadow:var(--sh-3);text-decoration:none}
.top h1{font-size:var(--t-h1);margin:0;font-weight:800;line-height:1.25;min-width:0}
.top h1 .sub{display:block;font-size:var(--t-xs);color:var(--ink-2);font-weight:500;letter-spacing:0;
  margin-top:.1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tools{margin-left:auto;display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}

button,select,input[type=search]{
  font:inherit;font-size:var(--t-sm);font-weight:600;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:var(--r-sm);padding:.4rem .72rem;cursor:pointer;
  position:relative;overflow:hidden;
  transition:transform .18s var(--e-spring),border-color .2s,background .2s,box-shadow .2s,color .2s;
}
button:hover{transform:translateY(-1.5px);border-color:var(--brand);box-shadow:var(--sh-1)}
button:active{transform:translateY(0) scale(.97)}
button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible{outline:none;box-shadow:var(--sh-glow)}
input[type=search]{min-width:190px;cursor:text;font-weight:500}
input[type=search]:focus{border-color:var(--brand)}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--surface-2);padding:2px;gap:2px}
.seg button{border:0;border-radius:calc(var(--r-sm) - 2px);padding:.32rem .68rem;background:transparent;box-shadow:none}
.seg button:hover{transform:none;background:var(--surface)}
.seg button[aria-pressed="true"]{background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;box-shadow:0 2px 8px var(--brand-ring)}

.ripple{position:absolute;border-radius:50%;transform:scale(0);background:currentColor;opacity:.25;animation:rip .55s linear;pointer-events:none}
@keyframes rip{to{transform:scale(3.4);opacity:0}}

.progress{position:absolute;left:0;bottom:-1px;height:2.5px;width:0;
  background:linear-gradient(90deg,var(--brand),var(--legal),var(--ej));transition:width .1s linear}

/* ═══ LAYOUT ═══ */
.layout{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:270px 1fr;gap:1.8rem;padding:1.4rem 1.1rem 5rem}
main{min-width:0}

/* ═══ SIDEBAR ═══ */
nav.side{
  position:sticky;top:76px;align-self:start;max-height:calc(100vh - 96px);overflow:auto;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:.85rem;box-shadow:var(--sh-1);
}
nav.side h2{font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);
  margin:.5rem .4rem .5rem;font-weight:800}
nav.side h2:first-child{margin-top:.1rem}
nav.side a{
  display:flex;align-items:baseline;gap:.5rem;padding:.36rem .55rem;border-radius:var(--r-sm);
  text-decoration:none;color:var(--ink-2);font-size:var(--t-sm);font-weight:500;
  position:relative;transition:background .22s,color .22s,transform .22s var(--e-out);
}
nav.side a:hover{background:var(--surface-2);color:var(--ink);transform:translateX(3px);text-decoration:none}
nav.side a.on{background:var(--brand-soft);color:var(--brand);font-weight:700}
nav.side a.on::before{content:"";position:absolute;left:-.85rem;top:20%;bottom:20%;width:3px;
  border-radius:0 3px 3px 0;background:var(--brand)}
nav.side a b{color:var(--ink-3);font-weight:800;font-size:var(--t-xs);font-variant-numeric:tabular-nums;flex:none;min-width:1.9em}
nav.side a.on b{color:var(--brand)}
.navtoggle{display:none}

/* ═══ TARJETAS ═══ */
section.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:1.35rem 1.5rem;margin-bottom:1.1rem;box-shadow:var(--sh-1);
  transition:box-shadow .3s var(--e-out),border-color .3s;
}
section.card:hover{box-shadow:var(--sh-2)}
section.card>h2{
  margin:0 0 1rem;font-size:var(--t-h2);font-weight:800;
  display:flex;align-items:center;gap:.6rem;
}
section.card>h2::before{
  content:"";width:4px;height:1.05em;border-radius:99px;flex:none;
  background:linear-gradient(180deg,var(--brand),var(--brand-2));
}

/* ═══ ARTÍCULO ═══ */
.art{scroll-margin-top:86px;padding-top:.4rem}
.art + .art{margin-top:1.6rem;padding-top:1.6rem;border-top:1px dashed var(--line)}
.art h2{display:flex;flex-wrap:wrap;gap:.5rem;align-items:baseline;font-size:var(--t-h3);
  margin:0 0 .25rem;font-weight:800;letter-spacing:-.015em}
.art h2 .num{
  color:var(--brand);font-weight:800;font-family:var(--f-display);
  background:var(--brand-soft);padding:.1rem .5rem;border-radius:var(--r-sm);
  font-size:.92em;letter-spacing:-.02em;
}
.ubic{font-size:var(--t-xs);color:var(--ink-3);margin:0 0 .8rem;font-weight:600;
  letter-spacing:.03em;text-transform:uppercase}

/* ═══ IDEA CLAVE ═══ */
.idea{
  background:linear-gradient(100deg,var(--brand-soft),color-mix(in srgb,var(--brand-soft) 40%,transparent));
  border-left:4px solid var(--brand);border-radius:0 var(--r-md) var(--r-md) 0;
  padding:.75rem 1rem;font-weight:650;margin:.7rem 0 1rem;position:relative;
  font-size:.97rem;line-height:1.55;
}

/* ═══ ACORDEÓN ═══ */
details.panel{
  border:1px solid var(--line);border-radius:var(--r-md);margin:.6rem 0;
  background:var(--surface);overflow:hidden;
  transition:border-color .25s,box-shadow .25s,background .25s;
}
details.panel:hover{border-color:var(--line-strong)}
details.panel[open]{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-ring)}
details.panel>summary{
  cursor:pointer;padding:.62rem .9rem;font-weight:700;font-size:.93rem;
  list-style:none;display:flex;align-items:center;gap:.55rem;
  transition:background .2s,color .2s;
}
details.panel>summary:hover{background:var(--surface-2)}
details.panel[open]>summary{background:var(--brand-soft);color:var(--brand)}
details.panel>summary::-webkit-details-marker{display:none}
details.panel>summary::before{
  content:"";width:16px;height:16px;flex:none;border-radius:5px;
  background:var(--brand-soft);position:relative;transition:transform .3s var(--e-spring),background .25s;
}
details.panel>summary::after{
  content:"";position:absolute;width:0;height:0;margin-left:5px;
  border:4px solid transparent;border-left-color:var(--brand);
  transition:transform .3s var(--e-spring);
}
details.panel[open]>summary::before{background:var(--surface)}
details.panel[open]>summary::after{transform:rotate(90deg) translateX(-1px)}
details.panel .body{padding:.3rem 1rem 1rem;font-size:.95rem;animation:slidein .35s var(--e-out)}
@keyframes slidein{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* ═══ TEXTO LEGAL ═══ */
.legal{
  background:var(--legal-bg);border-left:4px solid var(--legal);
  border-radius:0 var(--r-md) var(--r-md) 0;padding:.85rem 1.05rem;
  font-family:var(--f-legal);font-size:.95rem;line-height:1.7;
}
.legal p{margin:.45rem 0}
.legal .lbl{
  font-family:var(--f-body);font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;
  color:var(--legal);font-weight:800;display:block;margin-bottom:.4rem;
}

/* ═══ CAJAS SEMÁNTICAS ═══ */
.box{
  border-left:4px solid var(--line);border-radius:0 var(--r-md) var(--r-md) 0;
  padding:.72rem .95rem;margin:.65rem 0;font-size:.94rem;
  transition:transform .25s var(--e-out),box-shadow .25s;
}
.box:hover{transform:translateX(3px);box-shadow:var(--sh-1)}
.box.ej{background:var(--ej-bg);border-color:var(--ej)}
.box.warn{background:var(--warn-bg);border-color:var(--warn)}
.box.exc{background:var(--exc-bg);border-color:var(--exc)}
.box .lbl{font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;font-weight:800;
  display:block;margin-bottom:.3rem}
.box.ej .lbl{color:var(--ej)}
.box.warn .lbl{color:var(--warn)}
.box.exc .lbl{color:var(--exc)}

.interp{
  border:1px dashed var(--warn);background:color-mix(in srgb,var(--warn-bg) 45%,transparent);
  border-radius:var(--r-md);padding:.65rem .9rem;font-size:.9rem;margin:.6rem 0;
}
.interp .lbl{font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;color:var(--warn);font-weight:800;display:block}

/* ═══ TABLAS ═══ */
table{width:100%;border-collapse:separate;border-spacing:0;font-size:.9rem;margin:.7rem 0;
  border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
th,td{padding:.5rem .68rem;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
td + td, th + th{border-left:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th{background:var(--surface-2);font-size:var(--t-xs);font-weight:800;letter-spacing:.05em;
  text-transform:uppercase;color:var(--ink-2);position:sticky;top:0}
tbody tr{transition:background .18s}
tbody tr:nth-child(even){background:color-mix(in srgb,var(--surface-2) 45%,transparent)}
tbody tr:hover{background:var(--brand-soft)}
th.sortable{cursor:pointer;user-select:none;transition:color .2s,background .2s}
th.sortable:hover{color:var(--brand);background:var(--brand-soft)}
th.sortable::after{content:" ⇅";color:var(--ink-3);font-size:.7rem}

ul,ol{margin:.5rem 0 .5rem 1.2rem;padding:0}
li{margin:.26rem 0}
li::marker{color:var(--brand);font-weight:700}

/* ═══ TOOLTIPS ═══ */
.t{border-bottom:1.5px dotted var(--brand);cursor:help;position:relative;
  transition:background .2s,color .2s}
.t:hover{background:var(--brand-soft);color:var(--brand);border-radius:3px}
#tip{
  position:fixed;z-index:99;max-width:330px;background:var(--ink);color:var(--bg);
  padding:.6rem .78rem;border-radius:var(--r-md);font-size:.82rem;line-height:1.5;
  display:none;box-shadow:0 8px 30px rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.08);
}
html[data-theme="dark"] #tip{background:#f0f1f5;color:#15161c}

/* ═══ FLECHAS DE DIAGRAMA ═══
   Un <path> con stroke pero sin fill toma el valor inicial (negro) y el
   navegador cierra el trazo implícitamente: aparece un triángulo relleno
   entre sus extremos. Forzamos fill:none para dejar solo la línea + la
   punta del <marker>, que sí lleva su color. */
svg path[stroke]:not([fill]){fill:none}
svg polyline:not([fill]){fill:none}
svg line{fill:none}

/* ═══ SVG ═══ */
svg{max-width:100%;height:auto;display:block;margin:.9rem auto}
svg text{font-family:var(--f-body)}

/* ═══ BUSCADOR ═══ */
mark.hit{background:linear-gradient(180deg,transparent 55%,#ffe066 55%);color:inherit;
  border-radius:2px;padding:0 1px;font-weight:600}
html[data-theme="dark"] mark.hit{background:linear-gradient(180deg,transparent 55%,#8a6d00 55%);color:#fff}

/* ═══ UTILIDADES ═══ */
.hide{display:none !important}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.small{font-size:var(--t-sm);color:var(--ink-2)}
.chip{
  display:inline-block;font-size:var(--t-xs);padding:.16rem .55rem;border-radius:var(--r-full);
  background:var(--brand-soft);color:var(--brand);font-weight:800;letter-spacing:.02em;
}

/* ═══ HUECOS RELLENABLES ═══ */
.gap{
  display:inline-block;min-width:5.5em;border-bottom:2px solid var(--brand);
  text-align:center;font-weight:700;color:transparent;cursor:pointer;
  transition:color .3s,background .3s;
}
.gap.on,.gap:hover{color:var(--brand);background:var(--brand-soft);border-radius:4px 4px 0 0}

/* ═══ REVELAR SOLUCIÓN ═══ */
.revelar{
  background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;border-color:transparent;
  font-weight:700;
}
.revelar:hover{box-shadow:var(--sh-3)}
.sol{
  margin-top:.7rem;padding:.8rem 1rem;border-radius:var(--r-md);
  background:var(--ej-bg);border-left:4px solid var(--ej);
  animation:slidein .4s var(--e-out);
}

/* ═══ TEST ═══ */
.opt{
  display:block;padding:.55rem .85rem;margin:.35rem 0;border:1.5px solid var(--line);
  border-radius:var(--r-md);cursor:pointer;background:var(--surface);font-size:.94rem;
  transition:border-color .22s,background .22s,transform .22s var(--e-out);
}
.opt:hover{border-color:var(--brand);background:var(--brand-soft);transform:translateX(4px)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft);font-weight:650}
.opt.ko{border-color:var(--exc);background:var(--exc-bg)}
.opt input{margin-right:.5rem;accent-color:var(--brand)}

#tscore,#semres{
  font-family:var(--f-display);font-weight:800;font-size:1.15rem;letter-spacing:-.02em;
}

/* ═══════════════════════════════════════════════════════════════
   FLASHCARDS 3D · mazo con giro, vuelo de salida y sheen
   ═══════════════════════════════════════════════════════════════ */
#flash{--fc-e:cubic-bezier(.2,.8,.25,1);--fc-h:250px}

/* — Escena — */
.fc-stage{
  perspective:1400px;perspective-origin:50% 45%;
  padding:.4rem 0 .2rem;position:relative;
}
.fc-deck{position:relative;height:var(--fc-h);will-change:transform}

/* — Cartas fantasma del mazo — */
.fc-ghost{
  position:absolute;inset:0;border-radius:var(--r-lg);
  background:var(--surface);border:1px solid var(--line);
  transition:transform .5s var(--fc-e),opacity .5s var(--fc-e);
}
.fc-ghost.g1{transform:translateY(9px) scale(.972);opacity:.75}
.fc-ghost.g2{transform:translateY(18px) scale(.944);opacity:.45}
.fc-deck.empty .fc-ghost{opacity:0;transform:translateY(26px) scale(.9)}

/* — Elevación durante el giro — */
.fc-lift{position:absolute;inset:0;transform-style:preserve-3d}
.fc-lift.lift{animation:fcLift .78s var(--fc-e)}
@keyframes fcLift{
  0%,100%{transform:scale(1) translateY(0)}
  45%{transform:scale(1.055) translateY(-16px)}
}
.fc-lift.out-ok{animation:fcOut .5s cubic-bezier(.5,0,.75,0) forwards}
.fc-lift.out-ko{animation:fcOutKo .5s cubic-bezier(.5,0,.75,0) forwards}
.fc-lift.in{animation:fcIn .48s var(--fc-e)}
@keyframes fcOut{
  0%{transform:translateX(0) rotate(0) scale(1);opacity:1}
  100%{transform:translateX(130%) rotate(17deg) scale(.85);opacity:0}
}
@keyframes fcOutKo{
  0%{transform:translateX(0) rotate(0) scale(1);opacity:1}
  100%{transform:translateX(-130%) rotate(-17deg) scale(.85);opacity:0}
}
@keyframes fcIn{
  0%{transform:translateY(26px) scale(.9);opacity:0}
  100%{transform:translateY(0) scale(1);opacity:1}
}

/* — La carta — */
.fc-card{
  position:absolute;inset:0;transform-style:preserve-3d;
  transition:transform .78s var(--fc-e);
  cursor:pointer;border-radius:var(--r-lg);
}
.fc-card:focus-visible{outline:none}
.fc-card:focus-visible .fc-face{box-shadow:var(--sh-glow),var(--sh-2)}

/* — Caras — */
.fc-face{
  position:absolute;inset:0;border-radius:var(--r-lg);
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  padding:2rem 2.2rem;text-align:center;overflow:hidden;
  box-shadow:var(--sh-2);
  transition:box-shadow .4s var(--fc-e);
}
.fc-card:hover .fc-face{box-shadow:var(--sh-3)}

/* Anverso · pregunta */
.fc-front{
  background:
    radial-gradient(120% 90% at 50% -20%, var(--brand-soft) 0%, transparent 60%),
    var(--surface);
  border:1.5px solid var(--line);color:var(--ink);
}
/* Reverso · respuesta */
.fc-back{
  transform:rotateY(180deg);
  background:linear-gradient(145deg,var(--brand) 0%,#6d4bf7 45%,var(--c5,#0891b2) 130%);
  border:1.5px solid transparent;color:#fff;
}
html[data-theme="dark"] .fc-back{
  background:linear-gradient(145deg,#5f45c9 0%,#4b3aa8 45%,#0e6b85 130%);
}
.fc-back .fc-txt{color:#fff}
.fc-back b,.fc-back strong{color:#fff;font-weight:800}

/* — Sheen que barre al girar — */
.fc-face::after{
  content:"";position:absolute;top:-60%;left:-70%;width:55%;height:220%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.42),transparent);
  transform:rotate(18deg);opacity:0;pointer-events:none;
}
.fc-lift.lift .fc-face::after{animation:fcSheen .78s var(--fc-e)}
@keyframes fcSheen{
  0%{opacity:0;left:-70%}
  35%{opacity:1}
  100%{opacity:0;left:150%}
}

/* — Etiqueta superior — */
.fc-tag{
  position:absolute;top:1rem;left:1.15rem;
  font-size:var(--t-xs);font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  display:inline-flex;align-items:center;gap:.4rem;
}
.fc-front .fc-tag{color:var(--brand)}
.fc-back .fc-tag{color:rgba(255,255,255,.9)}
.fc-tag::before{
  content:"";width:7px;height:7px;border-radius:50%;background:currentColor;
  animation:fcPulse 2.2s ease-in-out infinite;
}
@keyframes fcPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.65)}}

/* — Índice tipo naipe — */
.fc-pip{
  position:absolute;font-family:var(--f-display);font-weight:800;
  font-size:.78rem;letter-spacing:-.02em;opacity:.34;font-variant-numeric:tabular-nums;
}
.fc-pip.tr{top:1rem;right:1.15rem}
.fc-pip.bl{bottom:1rem;left:1.15rem;transform:rotate(180deg)}
.fc-front .fc-pip{color:var(--ink-2)}
.fc-back .fc-pip{color:#fff;opacity:.55}

/* — Texto — */
.fc-txt{
  font-size:clamp(1rem,.9rem + .55vw,1.28rem);font-weight:650;line-height:1.5;
  max-width:44ch;letter-spacing:-.012em;
}
.fc-front .fc-txt{font-family:var(--f-display);font-weight:700}
.fc-back .fc-txt{font-weight:600;line-height:1.6}
.fc-hint{
  position:absolute;bottom:1rem;left:0;right:0;
  font-size:var(--t-xs);font-weight:600;letter-spacing:.02em;
  display:flex;align-items:center;justify-content:center;gap:.4rem;
}
.fc-front .fc-hint{color:var(--ink-3)}
.fc-back .fc-hint{color:rgba(255,255,255,.72)}
.fc-hint .kbd{
  font-family:var(--f-mono);font-size:.68rem;font-weight:700;padding:.1rem .32rem;
  border-radius:5px;border:1px solid currentColor;opacity:.75;
}

/* — Pantalla final — */
.fc-done{
  position:absolute;inset:0;border-radius:var(--r-lg);
  background:linear-gradient(150deg,var(--ok-soft),var(--surface) 70%);
  border:1.5px solid var(--ok);
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  text-align:center;padding:2rem;gap:.35rem;
  animation:fcIn .5s var(--fc-e);box-shadow:var(--sh-2);
}
.fc-done .seal{
  font-size:2.6rem;line-height:1;
  animation:fcSeal .7s cubic-bezier(.2,1.5,.4,1);
}
@keyframes fcSeal{0%{transform:scale(0) rotate(-25deg);opacity:0}60%{transform:scale(1.2) rotate(6deg)}100%{transform:scale(1) rotate(0);opacity:1}}
.fc-done h3{font-size:1.3rem;font-weight:800;margin:.2rem 0 0}
.fc-done p{margin:0;color:var(--ink-2);font-size:var(--t-sm)}

/* — Barra de progreso de la ronda — */
.fc-bar{
  height:6px;border-radius:99px;background:var(--surface-3);
  overflow:hidden;margin:.95rem 0 .8rem;position:relative;
}
.fc-bar i{
  display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--brand),var(--c5,#0891b2));
  transition:width .55s var(--fc-e);
}

/* — Controles — */
.fc-ctrls{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.fc-ctrls button{font-weight:700}
#fcok{border-color:var(--ok);color:var(--ok)}
#fcok:hover{background:var(--ok);color:#fff;border-color:var(--ok)}
#fcko{border-color:var(--warn);color:var(--warn)}
#fcko:hover{background:var(--warn);color:#fff;border-color:var(--warn)}
#fcflip{background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;border-color:transparent}
#fcflip:hover{box-shadow:var(--sh-3)}

.fc-score{display:inline-flex;gap:.45rem;margin-left:auto;align-items:center}
.fc-pill{
  font-size:var(--t-xs);font-weight:800;padding:.24rem .6rem;border-radius:var(--r-full);
  font-variant-numeric:tabular-nums;border:1px solid;
}
.fc-pill.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.fc-pill.ko{color:var(--warn);border-color:var(--warn);background:var(--warn-bg)}
.fc-pill.left{color:var(--ink-2);border-color:var(--line);background:var(--surface-2)}
.fc-pill.bump{animation:fcBump .45s var(--e-spring)}
@keyframes fcBump{0%{transform:scale(1)}45%{transform:scale(1.28)}100%{transform:scale(1)}}

@media(max-width:620px){
  #flash{--fc-h:270px}
  .fc-face{padding:1.7rem 1.3rem}
  .fc-score{margin-left:0;width:100%}
}
@media(prefers-reduced-motion:reduce){
  .fc-card{transition:none}
  .fc-lift.lift,.fc-lift.in,.fc-lift.out-ok,.fc-lift.out-ko,.fc-face::after{animation:none !important}
}
@media print{.fc-stage,.fc-ctrls,.fc-bar{display:none !important}}
/* ═══ RESPUESTA ESTRUCTURADA ═══ */
.fc-face{justify-content:center}
.fc-face.struct{justify-content:flex-start;text-align:left;padding-top:3.1rem;padding-bottom:3.1rem}
.fc-body{
  width:100%;max-width:46ch;margin:0 auto;
  overflow-y:auto;max-height:100%;
  scrollbar-width:thin;
}
.fc-body::-webkit-scrollbar{width:5px}
.fc-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.35);border-radius:99px;border:0}
.fc-front .fc-body::-webkit-scrollbar-thumb{background:var(--line-strong)}

/* — Veredicto Sí / No — */
.fc-verdict{
  display:inline-flex;align-items:center;gap:.35rem;
  font-family:var(--f-display);font-weight:800;font-size:.82rem;
  letter-spacing:.06em;text-transform:uppercase;
  padding:.26rem .72rem;border-radius:var(--r-full);margin-bottom:.85rem;
  border:1.5px solid;animation:fcPopIn .45s var(--e-spring) backwards;animation-delay:.34s;
}
.fc-verdict.si{background:rgba(255,255,255,.16);border-color:rgba(190,255,215,.85);color:#d8ffe9}
.fc-verdict.no{background:rgba(255,255,255,.16);border-color:rgba(255,205,205,.85);color:#ffdedd}
@keyframes fcPopIn{0%{opacity:0;transform:scale(.7) translateY(6px)}100%{opacity:1;transform:none}}

/* — Párrafo — */
.fc-p{margin:0;font-size:clamp(1rem,.92rem + .45vw,1.2rem);font-weight:600;line-height:1.6}
.fc-face.struct .fc-p{font-size:clamp(.96rem,.9rem + .35vw,1.1rem)}

/* — Lista enumerada — */
.fc-list{list-style:none;margin:0;padding:0;display:grid;gap:.5rem;counter-reset:fc}
.fc-list li{
  counter-increment:fc;position:relative;margin:0;
  padding:.42rem .6rem .42rem 2.5rem;border-radius:var(--r-sm);
  background:rgba(255,255,255,.11);
  font-size:clamp(.92rem,.88rem + .3vw,1.04rem);font-weight:600;line-height:1.45;
  animation:fcRow .42s var(--e-out) backwards;
}
.fc-list li::before{
  content:counter(fc);position:absolute;left:.6rem;top:50%;transform:translateY(-50%);
  width:1.6rem;height:1.6rem;border-radius:50%;
  display:grid;place-items:center;
  background:rgba(255,255,255,.9);color:var(--brand);
  font-family:var(--f-display);font-weight:800;font-size:.78rem;
  font-variant-numeric:tabular-nums;
}
.fc-list.alpha li::before{content:counter(fc,lower-alpha)}
.fc-list li:nth-child(1){animation-delay:.36s}
.fc-list li:nth-child(2){animation-delay:.42s}
.fc-list li:nth-child(3){animation-delay:.48s}
.fc-list li:nth-child(4){animation-delay:.54s}
.fc-list li:nth-child(5){animation-delay:.60s}
.fc-list li:nth-child(n+6){animation-delay:.66s}
@keyframes fcRow{0%{opacity:0;transform:translateX(-12px)}100%{opacity:1;transform:none}}

/* — Cláusulas contrapuestas — */
.fc-clauses{display:grid;gap:.45rem}
.fc-clauses p{
  margin:0;padding:.45rem .7rem .45rem .95rem;border-radius:0 var(--r-sm) var(--r-sm) 0;
  background:rgba(255,255,255,.11);border-left:3px solid rgba(255,255,255,.55);
  font-size:clamp(.92rem,.88rem + .3vw,1.04rem);font-weight:600;line-height:1.5;
  animation:fcRow .42s var(--e-out) backwards;
}
.fc-clauses p:nth-child(1){animation-delay:.36s}
.fc-clauses p:nth-child(2){animation-delay:.44s}
.fc-clauses p:nth-child(3){animation-delay:.52s}

/* — Negritas resaltadas en el reverso — */
.fc-back .fc-body b,.fc-back .fc-body strong{
  font-weight:800;background:rgba(255,255,255,.2);
  padding:.03em .3em;border-radius:5px;
  box-decoration-break:clone;-webkit-box-decoration-break:clone;
}

/* — Cita legal al pie — */
.fc-cite{
  position:absolute;bottom:.95rem;left:0;right:0;
  display:inline-flex;align-items:center;justify-content:center;gap:.4rem;
  font-family:var(--f-mono);font-size:.74rem;font-weight:700;letter-spacing:.02em;
  color:rgba(255,255,255,.82);
  animation:fcPopIn .5s var(--e-out) backwards;animation-delay:.5s;
}
.fc-cite::before,.fc-cite::after{
  content:"";height:1px;width:clamp(18px,10%,52px);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.45));
}
.fc-cite::after{background:linear-gradient(90deg,rgba(255,255,255,.45),transparent)}
.fc-cite .s{font-size:.9rem;opacity:.75;font-family:var(--f-legal)}
.fc-front .fc-cite{color:var(--ink-3)}
.fc-front .fc-cite::before{background:linear-gradient(90deg,transparent,var(--line-strong))}
.fc-front .fc-cite::after{background:linear-gradient(90deg,var(--line-strong),transparent)}

/* la pista se oculta si hay cita, para no amontonar */
.fc-back .fc-cite ~ .fc-hint,.fc-back .fc-hint.muted{display:none}

@media(max-width:620px){
  #flash{--fc-h:320px}
  .fc-face.struct{padding-top:2.9rem;padding-bottom:2.8rem}
  .fc-list li{padding-left:2.3rem}
}
@media(prefers-reduced-motion:reduce){
  .fc-verdict,.fc-list li,.fc-clauses p,.fc-cite{animation:none !important}
}

/* ═══ SEMÁFORO ═══ */
.sembtn{
  border-radius:var(--r-full);padding:.32rem .7rem;font-weight:700;font-size:var(--t-sm);
}
.sembtn[data-v="g"]:hover,.sembtn.on[data-v="g"]{background:var(--ok);color:#fff;border-color:var(--ok)}
.sembtn[data-v="y"]:hover,.sembtn.on[data-v="y"]{background:var(--mid);color:#3d2f00;border-color:var(--mid)}
.sembtn[data-v="r"]:hover,.sembtn.on[data-v="r"]{background:var(--exc);color:#fff;border-color:var(--exc)}

/* ═══ CTA DE BLOQUE ═══ */
a.blk{
  display:inline-flex;align-items:center;gap:.5rem;
  background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;
  padding:.5rem .95rem;border-radius:var(--r-sm);font-weight:700;font-size:var(--t-sm);
  text-decoration:none;box-shadow:0 2px 10px var(--brand-ring);
  transition:transform .22s var(--e-spring),box-shadow .25s,gap .25s var(--e-out);
}
a.blk:hover{transform:translateY(-2px);box-shadow:var(--sh-3);gap:.75rem;text-decoration:none}
a.blk::after{content:"→"}
a.blk:active{transform:translateY(0) scale(.98)}

/* ═══ REVEAL ═══ */
.rv{opacity:0;transform:translateY(20px);transition:opacity .6s var(--e-out),transform .6s var(--e-out)}
.rv.in{opacity:1;transform:none}

/* ═══ RESPONSIVE ═══ */
@media(max-width:960px){
  .layout{grid-template-columns:1fr;padding-top:.9rem;gap:1rem}
  nav.side{position:static;max-height:none}
  nav.side.collapsed .navbody{display:none}
  .navtoggle{display:block;width:100%;text-align:left;font-weight:700}
  .grid2{grid-template-columns:1fr}
  .top h1 .sub{white-space:normal}
}
@media(max-width:620px){
  .top-in{padding:.55rem .8rem}
  .tools{width:100%;margin-left:0}
  input[type=search]{flex:1;min-width:0}
  section.card{padding:1.05rem 1rem;border-radius:var(--r-md)}
  table{font-size:.82rem}
  th,td{padding:.4rem .5rem}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
  .rv{opacity:1;transform:none}
}
@media print{
  header.top,nav.side,.tools,.noprint,.progress{display:none !important}
  body{background:#fff;background-image:none;font-size:11pt;color:#000}
  .layout{display:block;max-width:none;padding:0}
  section.card{border:0;padding:0;margin:0 0 1rem;break-inside:avoid;box-shadow:none}
  details.panel{border:0;box-shadow:none}
  details.panel .body{display:block !important}
  details.panel>summary{padding-left:0}
  .art{break-inside:avoid}
  .rv{opacity:1;transform:none}
  a{color:#000;text-decoration:none}
}


/* ═══ ALTURA ADAPTATIVA DE LA TARJETA ═══ */
.fc-deck{transition:height .45s var(--fc-e)}
.fc-body{max-height:none;overflow:visible}
.fc-measure{
  position:absolute;left:0;right:0;top:0;height:auto;
  visibility:hidden;pointer-events:none;z-index:-1;
}
.fc-measure .fc-face{
  position:relative;inset:auto;height:auto;min-height:0;
  box-shadow:none;backface-visibility:visible;transform:none;
}
.fc-measure .fc-body{max-height:none;overflow:visible}
.fc-measure .fc-face::after{display:none}

/* ═══ MOSTRAR / OCULTAR ÍNDICE LATERAL ═══ */
.layout{transition:grid-template-columns .42s var(--e-out)}
.layout.nonav{grid-template-columns:0 1fr;gap:0}
.layout.nonav>nav.side{
  opacity:0;transform:translateX(-14px);pointer-events:none;
  padding:0;border-width:0;overflow:hidden;width:0;min-width:0;
}
nav.side{
  transition:opacity .3s var(--e-out),transform .38s var(--e-out);
  overflow-x:hidden;
}
#navhide .ic{display:inline-block;transition:transform .35s var(--e-spring);font-size:.95em;line-height:1}
#navhide[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
#navhide[aria-pressed="true"] .ic{transform:rotate(90deg)}
@media(max-width:960px){#navhide{display:none}}

/* ═══════════════════════════════════════════════════════════════
   LECTURA EN VOZ ALTA (TTS) del texto legal
   ═══════════════════════════════════════════════════════════════ */
.tts-bar{
  display:flex;align-items:center;gap:.45rem;flex-wrap:wrap;
  margin:.15rem 0 .7rem;
}
.tts-bar button{
  font-size:var(--t-xs);font-weight:700;padding:.3rem .62rem;
  border-radius:var(--r-full);border:1px solid var(--legal);
  background:transparent;color:var(--legal);
  display:inline-flex;align-items:center;gap:.35rem;line-height:1.2;
}
.tts-bar button:hover{background:var(--legal);color:var(--surface);border-color:var(--legal)}
.tts-bar button[hidden]{display:none}
.tts-bar .tts-play.on{background:var(--legal);color:var(--surface)}

/* Ondas de audio mientras lee */
.tts-wave{display:inline-flex;align-items:flex-end;gap:2px;height:11px}
.tts-wave i{
  width:2.5px;background:currentColor;border-radius:2px;height:35%;
  animation:ttsW .9s ease-in-out infinite;
}
.tts-wave i:nth-child(2){animation-delay:.15s}
.tts-wave i:nth-child(3){animation-delay:.3s}
.tts-wave i:nth-child(4){animation-delay:.45s}
@keyframes ttsW{0%,100%{height:32%}50%{height:100%}}

.tts-time{
  font-family:var(--f-mono);font-size:.7rem;font-weight:700;
  color:var(--ink-3);font-variant-numeric:tabular-nums;
}

/* Frase que se está leyendo */
.tts-s{transition:background .25s,color .25s;border-radius:3px}
.tts-s.now{
  background:linear-gradient(180deg,transparent 8%,color-mix(in srgb,var(--legal) 26%,transparent) 8%);
  box-shadow:0 0 0 2px color-mix(in srgb,var(--legal) 16%,transparent);
}
html[data-theme="dark"] .tts-s.now{
  background:linear-gradient(180deg,transparent 8%,color-mix(in srgb,var(--legal) 34%,transparent) 8%);
}
.legal.tts-on{box-shadow:0 0 0 3px color-mix(in srgb,var(--legal) 20%,transparent)}

/* ═══ Reproductor flotante ═══ */
.tts-mini{
  position:fixed;left:50%;bottom:1.1rem;transform:translateX(-50%) translateY(140%);
  z-index:80;display:flex;align-items:center;gap:.6rem;
  background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  border:1px solid var(--line);border-radius:var(--r-full);
  padding:.5rem .7rem .5rem .95rem;box-shadow:var(--sh-3);
  transition:transform .45s var(--e-spring),opacity .3s;opacity:0;pointer-events:none;
  max-width:min(94vw,540px);
}
.tts-mini.show{transform:translateX(-50%) translateY(0);opacity:1;pointer-events:auto}
.tts-mini .lbl{
  font-size:var(--t-xs);font-weight:800;color:var(--legal);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:16ch;
}
.tts-mini button{
  border-radius:50%;width:32px;height:32px;padding:0;display:grid;place-items:center;
  font-size:.8rem;border:1px solid var(--line);flex:none;
}
.tts-mini button.main{
  width:38px;height:38px;font-size:.95rem;
  background:linear-gradient(140deg,var(--legal),var(--brand));color:#fff;border-color:transparent;
}
.tts-mini .bar{
  flex:1;min-width:70px;height:5px;border-radius:99px;background:var(--surface-3);overflow:hidden;
}
.tts-mini .bar i{display:block;height:100%;width:0;background:var(--legal);
  border-radius:99px;transition:width .35s var(--e-out)}

/* ═══ Panel de ajustes de voz ═══ */
.tts-back{
  position:fixed;inset:0;z-index:90;background:rgba(10,10,18,.45);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  display:grid;place-items:center;padding:1rem;
  opacity:0;pointer-events:none;transition:opacity .3s var(--e-out);
}
.tts-back.show{opacity:1;pointer-events:auto}
.tts-panel{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--sh-3);width:min(94vw,470px);max-height:88vh;overflow:auto;
  padding:1.3rem 1.4rem;transform:translateY(16px) scale(.97);
  transition:transform .38s var(--e-spring);
}
.tts-back.show .tts-panel{transform:none}
.tts-panel h3{
  font-size:1.12rem;font-weight:800;margin:0 0 .25rem;
  display:flex;align-items:center;gap:.5rem;
}
.tts-panel .sub{font-size:var(--t-sm);color:var(--ink-2);margin:0 0 1.1rem}
.tts-row{margin-bottom:1.05rem}
.tts-row > label{
  display:block;font-size:var(--t-xs);font-weight:800;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-2);margin-bottom:.4rem;
}
.tts-seg{display:flex;gap:3px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:3px}
.tts-seg button{
  flex:1;border:0;background:transparent;border-radius:calc(var(--r-sm) - 3px);
  padding:.42rem .3rem;font-size:var(--t-sm);font-weight:700;box-shadow:none;
}
.tts-seg button:hover{transform:none;background:var(--surface)}
.tts-seg button[aria-pressed="true"]{
  background:linear-gradient(140deg,var(--legal),var(--brand));color:#fff;
}
.tts-panel select{
  width:100%;padding:.5rem .6rem;border-radius:var(--r-sm);

<script>
const GLOSARIO={
 "presupuesto":"Documento contable y jurídico, aprobado por el Pleno, que fija el techo de gasto de un ejercicio y estima los ingresos con los que se financia. Ej.: el presupuesto de Utrera para 2026 autoriza gastar como máximo 78 M€.",
 "credito":"Crédito presupuestario: la cantidad máxima de dinero autorizada para una finalidad concreta. Ej.: 120.000 € en la aplicación de 'mantenimiento de colegios'.",
 "obligacion":"Obligación reconocida: la deuda que el Ayuntamiento admite formalmente que debe pagar, una vez comprobado que el servicio o suministro se ha prestado. Ej.: aprobada la factura del proveedor, nace la obligación.",
 "derecho":"Derecho liquidado: el importe concreto que un tercero debe a la entidad local, una vez cuantificado. Ej.: liquidado el IBI de un inmueble en 340 €, ese es el derecho.",
 "oa":"Organismo autónomo: ente con personalidad jurídica propia creado por la entidad local para gestionar un servicio (patronatos de deportes, de cultura, gerencias de urbanismo). Depende del Ayuntamiento pero tiene su propio presupuesto.",
 "sociedad":"Sociedad mercantil local: empresa con forma de S.A. o S.L. cuyo capital pertenece a la entidad local (p. ej. la empresa municipal de aguas). No aprueba 'presupuesto', sino estados de previsión de gastos e ingresos.",
 "bases":"Bases de ejecución: el 'reglamento de uso' del presupuesto. Adaptan las normas presupuestarias generales a la organización concreta de la entidad. Ej.: fijan qué órgano autoriza gastos de hasta 3.000 €.",
 "estabilidad":"Estabilidad presupuestaria: exigencia de que las cuentas públicas no incurran en déficit estructural. Ej.: un ayuntamiento no puede presupuestar más gasto no financiero que ingresos no financieros.",
 "afectacion":"No afectación: regla general de que todos los ingresos financian todo el gasto, sin que un ingreso concreto quede reservado a un gasto concreto. Ej.: lo recaudado por el IBI no está reservado a pagar el alumbrado.",
 "bruto":"Principio de presupuesto bruto (o de integridad): derechos y obligaciones se anotan por su importe total, sin compensar unos con otros. Ej.: no se puede anotar la subvención 'ya descontados' los gastos del programa.",
 "nivelacion":"Nivelación presupuestaria: que el total de ingresos previstos cubra el total de gastos autorizados; es decir, aprobar sin déficit inicial.",
 "aplicacion":"Aplicación presupuestaria: la 'casilla' exacta donde vive cada euro de gasto, formada al cruzar la clasificación por programas con la económica. Ej.: 323/22103 (funcionamiento de centros docentes / combustibles).",
 "vinculacion":"Nivel de vinculación jurídica: el nivel de agregación en el que el crédito es realmente limitativo; por debajo de él se puede mover el gasto sin tramitar una modificación de crédito (art. 172 TRLHL).",
 "intervencion":"Intervención: el órgano de control interno de la entidad local, con función de fiscalización previa del gasto y de informe preceptivo del presupuesto. Lo desempeña un funcionario de habilitación nacional.",
 "pleno":"Pleno: órgano colegiado formado por todos los concejales o diputados. Es el único competente para aprobar el presupuesto.",
 "bop":"Boletín Oficial de la Provincia: diario oficial donde las entidades locales publican sus anuncios y acuerdos con efectos frente a terceros.",
 "prorroga":"Prórroga presupuestaria: si el 1 de enero no ha entrado en vigor el presupuesto nuevo, sigue rigiendo automáticamente el anterior con sus créditos iniciales.",
 "interesado":"Interesado: quien está legitimado para intervenir en un procedimiento. En el presupuesto, la ley define expresamente quiénes lo son (art. 170.1).",
 "liquidacion":"Liquidación del presupuesto: cierre contable del ejercicio, que determina los derechos y obligaciones pendientes, el remanente de tesorería y el resultado presupuestario.",
 "tcuentas":"Tribunal de Cuentas: órgano fiscalizador externo de las cuentas y la gestión económica del sector público, dependiente de las Cortes Generales.",
 "conten":"Recurso contencioso-administrativo: impugnación ante los juzgados y tribunales de lo contencioso-administrativo, es decir, ya fuera de la propia Administración.",
 "adop":"Fases ADOP: las cuatro etapas de la vida de un gasto — Autorización, Disposición, Reconocimiento de la obligación y Ordenación del pago.","autorizacion":"Autorización del gasto (fase A): acto por el que se acuerda realizar un gasto por una cuantía cierta o aproximada, reservando el crédito. Ej.: aprobar el expediente de contratación de una obra por 500.000 €.","disposicion":"Disposición o compromiso (fase D): acto por el que se acuerda la realización del gasto ya concretado en su importe exacto y con un tercero determinado. Ej.: adjudicar la obra a una empresa por 462.000 €.","reconocimiento":"Reconocimiento de la obligación (fase O): acto por el que se declara la existencia de un crédito exigible contra la entidad, tras acreditar la prestación. Ej.: aprobar la certificación de obra.","ordenacion":"Ordenación del pago (fase P): acto por el que el ordenador de pagos expide la orden de pago contra la tesorería.","ordenador":"Ordenador de pagos: en las entidades locales, el presidente. Es quien expide las órdenes de pago.","planfondos":"Plan de disposición de fondos: documento que fija el orden de prelación de los pagos de la tesorería. Lo establece el presidente.","ajustificar":"Pago a justificar: orden de pago expedida sin poder acompañar los documentos justificativos, que el perceptor debe justificar después. Ej.: fondos para una comisión de servicio.","cajafija":"Anticipo de caja fija: provisión de fondos de carácter permanente para atenciones periódicas o repetitivas (material de oficina, portes, dietas menores).","remtes":"Remanente de tesorería: magnitud que resulta de la liquidación y mide los recursos líquidos disponibles a fin de ejercicio. Fondos líquidos más derechos pendientes de cobro menos obligaciones pendientes de pago, con ajustes por dudoso cobro y por desviaciones de financiación.","dudoso":"Derechos de difícil o imposible recaudación: derechos liquidados que previsiblemente no se cobrarán y que deben minorarse del remanente de tesorería.","superavit":"Superávit inicial: aprobar el presupuesto con más ingresos previstos que gastos autorizados. Es la medida de último recurso frente a un remanente negativo."
};
const ARTS=[{n:183,t:"Régimen jurídico",ubic:"Título VI (Presupuesto y gasto público) ▸ Capítulo I (De los presupuestos) ▸ Sección 3.ª (Ejecución y liquidación)",idea:"La ejecución se rige por esta sección y, en lo demás, por las bases de ejecución.",literal:`<p>La ejecución de los créditos consignados en el presupuesto de gastos de las entidades locales se efectuará conforme a lo dispuesto en la presente sección y, complementariamente, por las normas que dicte cada entidad y queden plasmadas en las bases de ejecución del presupuesto.</p>`,dis:`<ul>
<li><b>Fuente primaria:</b> la propia Sección 3.ª del TRLHL.</li>
<li><b>Fuente complementaria:</b> las normas que dicte cada entidad y que queden plasmadas en las <span class="t" data-k="bases">bases de ejecución</span> del presupuesto.</li>
<li><b>Consecuencia práctica:</b> no hay dos ayuntamientos con idéntico régimen de ejecución. La ley fija el esqueleto; las bases, el detalle.</li>
</ul>`,llano:`<p>La ley dice cómo se gasta en lo esencial y deja que cada ayuntamiento escriba su propio manual de instrucciones. Ese manual son las bases de ejecución, que se aprueban con el presupuesto y valen para ese año.</p>`,porque:`<p>Un municipio de 800 habitantes y una gran ciudad no pueden tener el mismo circuito de firmas. La ley admite esa diversidad, pero la <b>encauza</b>: lo que decida la entidad tiene que estar escrito en las bases, aprobado por el Pleno y publicado con el presupuesto. Nada de prácticas informales.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> el reglamento de régimen interior de una comunidad de vecinos: la ley de propiedad horizontal marca el marco y cada comunidad concreta los detalles.</li>
<li><b>Real:</b> las bases de ejecución de un ayuntamiento fijan que los contratos menores hasta 3.000 € se aprueban por decreto de alcaldía en un solo acto ADO.</li>
<li><b>Caso límite:</b> unas bases que pretendieran alterar el orden de prelación del art. 187 serían ilegales: complementan la ley, no la sustituyen (véase también el límite del art. 165.1).</li>
</ul>`,noej:`<ul>
<li><b>No es fuente</b> de la ejecución una instrucción verbal del alcalde no recogida en las bases.</li>
<li><b>No pueden</b> las bases modificar lo legislado en materia de administración económica (art. 165.1).</li>
</ul>`,conex:`<ul>
<li><b>Art. 165.1:</b> las bases de ejecución como contenido obligatorio del presupuesto y sus límites.</li>
<li><b>Arts. 184 a 190:</b> el contenido de esta sección que las bases complementan.</li>
</ul>`,trampas:`<ul>
<li>Las bases son <b>complementarias</b>, nunca alternativas a la ley.</li>
<li>Se aprueban <b>con el presupuesto</b> y para cada ejercicio.</li>
</ul>`,ancla:`<p><b>"Ley primero, bases después."</b> Piensa en un traje de confección con arreglos: el patrón lo pone la ley, el sastre es cada entidad.</p>`,vis:`<svg viewBox="0 0 640 130" role="img" aria-label="Fuentes del régimen de ejecución">
<rect x="60" y="35" width="230" height="60" rx="8" fill="var(--acc-soft)" stroke="var(--acc)"/>
<text x="175" y="60" text-anchor="middle" font-size="12" font-weight="700" fill="var(--acc)">1. Sección 3.ª del TRLHL</text>
<text x="175" y="80" text-anchor="middle" font-size="11" fill="currentColor">arts. 183 a 193 bis</text>
<text x="320" y="70" text-anchor="middle" font-size="16" fill="var(--ink2)">+</text>
<rect x="350" y="35" width="230" height="60" rx="8" fill="var(--ej-bg)" stroke="var(--ej)"/>
<text x="465" y="60" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ej)">2. Bases de ejecución</text>
<text x="465" y="80" text-anchor="middle" font-size="11" fill="currentColor">normas propias de cada entidad</text>
<text x="320" y="118" text-anchor="middle" font-size="11" fill="var(--ink2)">carácter complementario, nunca contrario a la ley</text>
</svg>`},
{n:184,t:"Fases del procedimiento de gestión de los gastos",ubic:"Título VI (Presupuesto y gasto público) ▸ Capítulo I (De los presupuestos) ▸ Sección 3.ª (Ejecución y liquidación)",idea:"Todo gasto recorre cuatro fases: autorizar, comprometer, reconocer y ordenar el pago.",literal:`<p>1. La gestión del presupuesto de gastos se realizará en las siguientes fases cuyo contenido se establecerá reglamentariamente:</p><p>a) Autorización de gasto.</p><p>b) Disposición o compromiso de gasto.</p><p>c) Reconocimiento o liquidación de la obligación.</p><p>d) Ordenación de pago.</p><p>2. Las entidades locales podrán en la forma que reglamentariamente se establezca abarcar en un solo acto administrativo dos o más fases de ejecución de las enumeradas en el apartado anterior.</p>`,dis:`<table><thead><tr><th>Fase</th><th>Nombre legal</th><th>Qué se decide</th><th>Pregunta que responde</th></tr></thead><tbody>
<tr><td><b>A</b></td><td><span class="t" data-k="autorizacion">Autorización de gasto</span></td><td>Se acuerda gastar, reservando crédito</td><td>¿Vamos a gastar?</td></tr>
<tr><td><b>D</b></td><td><span class="t" data-k="disposicion">Disposición o compromiso</span></td><td>Se concreta con quién y por cuánto</td><td>¿Con quién y por cuánto?</td></tr>
<tr><td><b>O</b></td><td><span class="t" data-k="reconocimiento">Reconocimiento o liquidación de la obligación</span></td><td>Se declara la deuda exigible</td><td>¿Ya lo han hecho? ¿Debemos?</td></tr>
<tr><td><b>P</b></td><td><span class="t" data-k="ordenacion">Ordenación de pago</span></td><td>Se ordena pagar a la tesorería</td><td>¿Pagamos?</td></tr>
</tbody></table>
<ul>
<li><b>Contenido de las fases:</b> se establecerá <b>reglamentariamente</b>.</li>
<li><b>Acumulación (184.2):</b> las entidades pueden abarcar <b>dos o más fases en un solo acto administrativo</b>, en la forma reglamentariamente establecida. De ahí los documentos <b>AD</b>, <b>ADO</b> y <b>ADOP</b>.</li>
</ul>`,llano:`<p>Gastar dinero público no es sacar la tarjeta. Primero se decide que se va a gastar y se aparta el dinero. Después se concreta a quién y cuánto. Cuando el proveedor ha cumplido, se reconoce que se le debe. Y por último se ordena a la tesorería que pague. Cuatro pasos: A, D, O, P. En gastos pequeños se pueden juntar en un solo papel.</p>`,porque:`<p>Cada fase es un <b>punto de control</b>. Si se pagara directamente, nadie comprobaría si había crédito, si el proveedor fue elegido legalmente o si el servicio se prestó de verdad. Separar la decisión de gastar de la decisión de pagar es lo que permite que la Intervención fiscalice antes de que el dinero salga. La acumulación existe porque aplicar cuatro pasos a la compra de un paquete de folios sería desproporcionado.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> una reforma en casa. Decides que vas a reformar y reservas el dinero (A); firmas presupuesto con el albañil (D); él termina y aceptas la factura (O); haces la transferencia (P).</li>
<li><b>Real:</b> obra de asfaltado. <b>A</b>: aprobación del expediente de contratación por 500.000 €. <b>D</b>: adjudicación a la empresa por 462.000 €. <b>O</b>: aprobación de la certificación n.º 1 por 120.000 €. <b>P</b>: orden de pago de esos 120.000 €.</li>
<li><b>Caso límite:</b> compra de una impresora por 400 € tramitada como contrato menor: un único decreto acumula A, D y O (documento ADO).</li>
</ul>`,noej:`<ul>
<li><b>No es una fase</b> el pago material: la ley llega hasta la <b>ordenación</b> del pago; la realización material corresponde a la tesorería (arts. 194 y ss.).</li>
<li><b>No es acumulación</b> saltarse una fase: acumular es documentarlas juntas, no prescindir de ellas.</li>
</ul>`,conex:`<ul>
<li><b>Art. 185:</b> quién es competente en cada fase.</li>
<li><b>Art. 189:</b> requisitos previos a la expedición de las órdenes de pago.</li>
<li><b>Art. 219:</b> fiscalización previa, que se proyecta sobre estas fases.</li>
</ul>`,trampas:`<ul>
<li>El orden es <b>A-D-O-P</b>. Cuidado: "O" es de obligación (reconocimiento), no de ordenación.</li>
<li>La letra c) del 184.1 dice "reconocimiento <b>o liquidación</b> de la obligación": son sinónimos legales aquí.</li>
<li>La acumulación exige forma reglamentaria: no es libre.</li>
</ul>`,ancla:`<p><b>ADOP</b> — "<b>A</b>parto el dinero, lo <b>D</b>oy a alguien, reconozco que lo debo (<b>O</b>bligación) y <b>P</b>ago".<br>Piensa en <i>adoptar</i> un gasto: primero decides, luego eliges, luego te haces cargo y por fin mantienes.</p>`,vis:`<svg viewBox="0 0 640 160" role="img" aria-label="Las cuatro fases de la gestión del gasto">
<defs><marker id="f1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="var(--acc)"/></marker></defs>
<rect x="15" y="45" width="130" height="58" rx="8" fill="var(--acc-soft)" stroke="var(--acc)"/>
<text x="80" y="68" text-anchor="middle" font-size="15" font-weight="700" fill="var(--acc)">A</text>
<text x="80" y="86" text-anchor="middle" font-size="10" fill="currentColor">Autorización</text>
<path d="M148 74 L 168 74" stroke="var(--acc)" stroke-width="2" marker-end="url(#f1)"/>
<rect x="172" y="45" width="130" height="58" rx="8" fill="var(--acc-soft)" stroke="var(--acc)"/>
<text x="237" y="68" text-anchor="middle" font-size="15" font-weight="700" fill="var(--acc)">D</text>
<text x="237" y="86" text-anchor="middle" font-size="10" fill="currentColor">Disposición o compromiso</text>
<path d="M305 74 L 325 74" stroke="var(--acc)" stroke-width="2" marker-end="url(#f1)"/>
<rect x="329" y="45" width="130" height="58" rx="8" fill="var(--ej-bg)" stroke="var(--ej)"/>
<text x="394" y="68" text-anchor="middle" font-size="15" font-weight="700" fill="var(--ej)">O</text>
<text x="394" y="86" text-anchor="middle" font-size="10" fill="currentColor">Reconocimiento de la obligación</text>
<path d="M462 74 L 482 74" stroke="var(--acc)" stroke-width="2" marker-end="url(#f1)"/>
<rect x="486" y="45" width="130" height="58" rx="8" fill="var(--warn-bg)" stroke="var(--warn)"/>
<text x="551" y="68" text-anchor="middle" font-size="15" font-weight="700" fill="var(--warn)">P</text>
<text x="551" y="86" text-anchor="middle" font-size="10" fill="currentColor">Ordenación del pago</text>
<text x="320" y="28" text-anchor="middle" font-size="11" fill="var(--ink2)">Cabe acumular dos o más fases en un solo acto: AD · ADO · ADOP (art. 184.2)</text>
<text x="320" y="132" text-anchor="middle" font-size="11" fill="var(--ink2)">¿gastamos? → ¿con quién? → ¿lo han hecho? → ¡páguese!</text>
</svg>`},
{n:185,t:"Competencias en materia de gestión de gastos",ubic:"Título VI (Presupuesto y gasto público) ▸ Capítulo I (De los presupuestos) ▸ Sección 3.ª (Ejecución y liquidación)",idea:"Autorizar y comprometer: presidente o Pleno. Reconocer la obligación: el presidente.",literal:`<p>1. Dentro del importe de los créditos autorizados en los presupuestos corresponderá la autorización y disposición de los gastos al presidente o al Pleno de la entidad de acuerdo con la atribución de competencias que establezca la normativa vigente.</p><p>2. Corresponderá al presidente de la corporación el reconocimiento y liquidación de las obligaciones derivadas de compromisos de gastos legalmente adquiridos.</p><p>3. Las facultades a que se refieren los apartados anteriores podrán desconcentrarse o delegarse en los términos previstos por el artículo 23 de la Ley 7/1985, de 2 de abril, que deberán recogerse para cada ejercicio, en las bases de ejecución del presupuesto.</p><p>4. En los organismos autónomos las facultades indicadas se ejercerán en los términos expuestos anteriormente, correspondiendo a los órganos de aquéllos a los que sus estatutos atribuyan dichas competencias.</p>`,dis:`<table><thead><tr><th>Fase</th><th>Órgano competente</th><th>Norma</th></tr></thead><tbody>
<tr><td>Autorización y disposición (A y D)</td><td><b>Presidente o Pleno</b>, según la atribución de competencias de la normativa vigente</td><td>185.1</td></tr>
<tr><td>Reconocimiento y liquidación de la obligación (O)</td><td><b>Presidente</b>, cuando derivan de compromisos legalmente adquiridos</td><td>185.2</td></tr>
</tbody></table>
<ul>
<li><b>Límite común:</b> siempre "dentro del importe de los créditos autorizados".</li>
<li><b>Desconcentración y delegación (185.3):</b> posibles en los términos del <b>art. 23 LBRL</b>, y deben recogerse <b>para cada ejercicio en las bases de ejecución</b>.</li>
<li><b>Organismos autónomos (185.4):</b> las mismas reglas, correspondiendo a los órganos que designen sus <b>estatutos</b>.</li>
</ul>`,llano:`<p>¿Quién firma cada paso? Autorizar y comprometer puede ser cosa del alcalde o del Pleno, según lo que diga la normativa de régimen local para cada tipo de gasto. Reconocer que se debe algo por un compromiso ya adquirido es siempre del alcalde. Y todo eso puede delegarse, pero la delegación tiene que estar escrita en las bases de ese año.</p>`,porque:`<p>El reparto no es caprichoso: las decisiones que comprometen políticamente (grandes contratos, plurianuales) suben al Pleno; la gestión ordinaria se queda en la presidencia. Que el <b>reconocimiento</b> de la obligación sea del presidente responde a que ahí ya no hay decisión política: solo comprobar que lo comprometido se ha cumplido. Y exigir que la delegación conste en las bases evita que nadie sepa quién firma qué.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> en una empresa familiar, el gerente compra el día a día y el consejo aprueba las inversiones grandes; pero pagar las facturas ya aprobadas lo firma siempre el gerente.</li>
<li><b>Real:</b> las bases de ejecución de 2026 de un ayuntamiento delegan en la Junta de Gobierno Local la autorización y disposición de gastos superiores a 50.000 €, y mantienen en la Alcaldía el reconocimiento de obligaciones.</li>
<li><b>Caso límite:</b> una delegación acordada por decreto en mayo pero no recogida en las bases: el art. 185.3 exige que las delegaciones se recojan en las bases para cada ejercicio.</li>
</ul>`,noej:`<ul>
<li><b>No corresponde a la Intervención</b> ninguna de estas fases: su papel es fiscalizar, no gestionar.</li>
<li><b>No cabe</b> autorizar gasto por encima de los créditos autorizados (véanse arts. 172 y 173.5).</li>
</ul>`,conex:`<ul>
<li><b>Art. 184:</b> las fases cuyo reparto competencial se regula aquí.</li>
<li><b>Art. 23 LBRL:</b> régimen de delegación al que remite el 185.3.</li>
<li><b>Art. 186:</b> la cuarta fase, la ordenación de pagos, con régimen propio.</li>
<li><b>Art. 188:</b> responsabilidad personal de quien autoriza sin crédito.</li>
</ul>`,trampas:`<ul>
<li>El <b>reconocimiento de la obligación</b> es del <b>presidente</b>, aunque el gasto lo hubiera autorizado el Pleno.</li>
<li>Las delegaciones han de recogerse <b>para cada ejercicio</b> en las bases: no valen indefinidamente por sí solas.</li>
<li>En los OOAA mandan sus <b>estatutos</b>.</li>
</ul>`,ancla:`<p><b>"A y D se reparten; la O es del alcalde."</b> Y la <b>P</b> también (art. 186): al presidente le corresponden las dos últimas letras de ADOP.</p>`,vis:`<svg viewBox="0 0 640 165" role="img" aria-label="Competencias en las fases del gasto">

<text x="475" y="88" text-anchor="middle" font-size="10" fill="var(--ink2)">arts. 185.2 y 186.1</text>

</svg>`},
{n:186,t:"Ordenación de pagos",ubic:"Título VI (Presupuesto y gasto público) ▸ Capítulo I (De los presupuestos) ▸ Sección 3.ª (Ejecución y liquidación)",idea:"Ordena los pagos el presidente; se pueden crear unidades para ejecutarlo.",literal:`<p>1. Competen al presidente de la entidad local las funciones de ordenación de pagos.</p><p>2. El Pleno de la entidad local, a propuesta del presidente, podrá crear una unidad de ordenación de pagos que, bajo la superior autoridad de éste, ejerza las funciones administrativas de la ordenación de pagos.</p><p>3. El Pleno de las entidades locales de más de 500.000 habitantes de derecho, a propuesta del presidente, podrá asimismo crear una unidad central de tesorería que, bajo la superior autoridad de éste, ejerza las funciones de la ordenación de pagos.</p><p>4. La ordenación de pagos en los organismos autónomos la ejercerá el órgano de estos que, por estatutos, la tenga atribuida.</p>`,dis:`<ul>
<li><b>Regla (186.1):</b> las funciones de <span class="t" data-k="ordenacion">ordenación de pagos</span> competen al <b>presidente</b> de la entidad local.</li>
<li><b>Unidad de ordenación de pagos (186.2):</b> la crea el <b>Pleno a propuesta del presidente</b>; ejerce funciones <b>administrativas</b> bajo su superior autoridad. Sin requisito de población.</li>
<li><b>Unidad central de tesorería (186.3):</b> solo en entidades de <b>más de 500.000 habitantes de derecho</b>; también la crea el Pleno a propuesta del presidente y ejerce las funciones de ordenación de pagos bajo su superior autoridad.</li>
<li><b>Organismos autónomos (186.4):</b> ordena pagos el órgano que sus <b>estatutos</b> designen.</li>
</ul>`,llano:`<p>El que da la orden de pagar es el alcalde. En ayuntamientos grandes ese trabajo es enorme, así que el Pleno puede crear una oficina que lo tramite en su nombre; y si el municipio pasa de medio millón de habitantes, puede crear además una unidad central de tesorería. En ambos casos el alcalde sigue siendo la autoridad superior.</p>`,porque:`<p>Concentrar la orden de pago en una sola autoridad hace <b>identificable la responsabilidad</b> (art. 188). Pero en una ciudad grande el volumen es inmanejable de forma personal, y por eso la ley permite crear estructura administrativa sin romper la cadena de responsabilidad: las unidades actúan siempre "bajo la superior autoridad" del presidente.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> el titular de una cuenta que autoriza a un apoderado a firmar transferencias: la responsabilidad última sigue siendo suya.</li>
<li><b>Real:</b> un ayuntamiento de 90.000 habitantes crea por acuerdo plenario, a propuesta del alcalde, una unidad de ordenación de pagos dentro de la Intervención General. No podría crear una unidad central de tesorería del 186.3: no alcanza los 500.000 habitantes.</li>
<li><b>Caso límite:</b> en un organismo autónomo con estatutos que atribuyen la ordenación a su gerente, no la ejerce el alcalde (186.4).</li>
</ul>`,noej:`<ul>
<li><b>No es la tesorería</b> quien ordena el pago: la tesorería lo <b>materializa</b>. La orden nace del ordenador de pagos.</li>
<li><b>No puede</b> el presidente crear por sí solo estas unidades: las crea el <b>Pleno</b>, a propuesta suya.</li>
</ul>`,conex:`<ul>
<li><b>Art. 187:</b> el plan de disposición de fondos al que deben ajustarse las órdenes.</li>
<li><b>Art. 188:</b> responsabilidad personal de los ordenadores de pagos.</li>
<li><b>Arts. 194 y ss.:</b> la tesorería, que ejecuta materialmente los pagos.</li>
</ul>`,trampas:`<ul>
<li><b>500.000 habitantes de derecho</b>: cifra exacta y adjetivo exacto.</li>
<li>Las dos unidades son distintas: la del 186.2 ejerce funciones <b>administrativas</b>; la del 186.3, las <b>funciones de ordenación de pagos</b>.</li>
<li>Ambas se crean por el <b>Pleno a propuesta del presidente</b>.</li>
</ul>`,ancla:`<p><b>"El que ordena es el alcalde; la unidad solo tramita."</b><br>Cifra clave: <b>500.000</b> habitantes de derecho para la unidad central de tesorería.</p>`,vis:`<svg viewBox="0 0 640 175" role="img" aria-label="Ordenación de pagos y unidades posibles">

</svg>`},
{n:187,t:"Plan de disposición de fondos",ubic:"Título VI (Presupuesto y gasto público) ▸ Capítulo I (De los presupuestos) ▸ Sección 3.ª (Ejecución y liquidación)",idea:"Los pagos siguen un plan que prioriza personal y deudas de años anteriores.",literal:`<p>La expedición de las órdenes de pago habrá de acomodarse al plan de disposición de fondos de la tesorería que se establezca por el presidente que, en todo caso, deberá recoger la prioridad de los gastos de personal y de las obligaciones contraídas en ejercicios anteriores.</p>`,dis:`<ul>
<li><b>Instrumento:</b> el <span class="t" data-k="planfondos">plan de disposición de fondos</span> de la tesorería.</li>
<li><b>Quién lo establece:</b> el <b>presidente</b>.</li>
<li><b>Contenido mínimo obligatorio:</b> "en todo caso" debe recoger la <b>prioridad</b> de:
<ol><li>los <b>gastos de personal</b>;</li><li>las <b>obligaciones contraídas en ejercicios anteriores</b>.</li></ol></li>
<li><b>Efecto:</b> la expedición de las órdenes de pago debe <b>acomodarse</b> a ese plan.</li>
</ul>`,llano:`<p>Cuando no hay dinero para pagarlo todo a la vez, hace falta un orden. Ese orden lo fija el alcalde en un documento, y la ley le impone dos prioridades que no puede saltarse: primero las nóminas y las deudas que vienen de años anteriores.</p>`,porque:`<p>Sin prelación, el pago se decidiría caso a caso, con riesgo de arbitrariedad y de trato de favor a unos acreedores frente a otros. Las dos prioridades legales protegen a quien no puede esperar (los empleados públicos, cuyo salario es alimenticio) y a quien ya lleva demasiado esperando (los acreedores de ejercicios cerrados).</p>`,ej:`<ul>
<li><b>Cotidiano:</b> una familia con problemas de liquidez que decide pagar siempre primero la hipoteca y la luz antes que cualquier capricho.</li>
<li><b>Real:</b> el plan de disposición de fondos de un ayuntamiento establece este orden: 1) retribuciones de personal y cuotas sociales; 2) obligaciones de ejercicios cerrados; 3) amortización e intereses de deuda; 4) resto de acreedores por antigüedad de la factura.</li>
<li><b>Caso límite:</b> una orden de pago a un proveedor reciente expedida saltándose ese orden contraviene el art. 187 y compromete la responsabilidad del ordenador.</li>
</ul>`,noej:`<ul>
<li><b>No lo aprueba el Pleno</b>: lo establece el <b>presidente</b>.</li>
<li><b>No es una lista cerrada</b>: la ley fija dos prioridades mínimas y deja el resto al plan.</li>
</ul>`,conex:`<ul>
<li><b>Art. 186:</b> el ordenador de pagos que debe acomodarse al plan.</li>
<li><b>Art. 196:</b> funciones de la tesorería, que ejecuta conforme a ese plan.</li>
<li><b>Art. 135 CE y LO 2/2012:</b> prioridad absoluta del pago de intereses y capital de la deuda pública, que se superpone a esta regulación.</li>
</ul>`,trampas:`<ul>
<li>Las dos prioridades legales son <b>personal</b> y <b>obligaciones de ejercicios anteriores</b>. Se suele colar "los intereses de la deuda" como si estuviera en este artículo: no lo está (procede del art. 135 CE).</li>
<li>Lo establece el <b>presidente</b>, no la Intervención ni la Tesorería.</li>
</ul>`,ancla:`<p><b>"Primero la nómina, después lo viejo."</b> Dos prioridades, dos palabras: <b>PErsonal</b> y <b>PAsado</b>.</p>`,vis:`<svg viewBox="0 0 640 150" role="img" aria-label="Prioridades del plan de disposición de fondos">
<rect x="150" y="12" width="340" height="34" rx="8" fill="var(--acc-soft)" stroke="var(--acc)"/>
<text x="320" y="34" text-anchor="middle" font-size="12" font-weight="700" fill="var(--acc)">Plan de disposición de fondos · lo fija el PRESIDENTE</text>

<text x="175" y="83" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ej)">1.º Gastos de personal</text>

<text x="465" y="83" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ej)">2.º Obligaciones de ejercicios anteriores</text>
<rect x="150" y="106" width="340" height="34" rx="8" fill="var(--panel)" stroke="var(--line)"/>
<text x="320" y="128" text-anchor="middle" font-size="11" fill="var(--ink2)">3.º Resto de pagos, según el orden que fije el plan</text>
</svg>`},
{n:188,t:"Responsabilidad personal",ubic:"Título VI (Presupuesto y gasto público) ▸ Capítulo I (De los presupuestos) ▸ Sección 3.ª (Ejecución y liquidación)",idea:"Quien autoriza o paga sin crédito responde con su patrimonio; el interventor, si calla.",literal:`<p>Los ordenadores de gastos y de pagos, en todo caso, y los interventores de las entidades locales, cuando no adviertan por escrito su improcedencia, serán personalmente responsables de todo gasto que autoricen y de toda obligación que reconozcan, liquiden o paguen sin crédito suficiente.</p>`,dis:`<table><thead><tr><th>Sujeto</th><th>¿Cuándo responde?</th></tr></thead><tbody>
<tr><td>Ordenadores de <b>gastos</b> y de <b>pagos</b></td><td><b>En todo caso</b></td></tr>
<tr><td><span class="t" data-k="intervencion">Interventores</span></td><td>Solo <b>cuando no adviertan por escrito</b> su improcedencia</td></tr>
</tbody></table>
<ul>
<li><b>Objeto de la responsabilidad:</b> todo gasto que autoricen y toda obligación que reconozcan, liquiden o paguen <b>sin crédito suficiente</b>.</li>
<li><b>Carácter:</b> responsabilidad <b>personal</b>.</li>
</ul>`,llano:`<p>Si alguien autoriza o paga sin que haya dinero presupuestado, responde él, con su propio patrimonio. El interventor se salva si lo advirtió por escrito; si se calló, responde igual que los demás.</p>`,porque:`<p>La nulidad del art. 173.5 anula el acto, pero no repara el daño ni disuade a nadie. La responsabilidad <b>personal</b> pone el riesgo donde está la decisión. Y la exigencia de advertencia <b>por escrito</b> convierte al interventor en un contrapeso real: su firma o su silencio tienen consecuencias.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> el administrador de una comunidad que paga una obra no aprobada: responde él, no los vecinos.</li>
<li><b>Real:</b> el alcalde ordena pagar 60.000 € de una obra sin crédito; la interventora había emitido reparo por escrito. La responsabilidad personal recae sobre el ordenador, no sobre ella.</li>
<li><b>Caso límite:</b> misma situación, pero la interventora tramitó el pago sin advertir nada por escrito: responde también ella (art. 188).</li>
</ul>`,noej:`<ul>
<li><b>No basta</b> una advertencia verbal del interventor: la ley exige que sea <b>por escrito</b>.</li>
<li><b>No exime</b> al ordenador que haya actuado por instrucción política o por urgencia.</li>
</ul>`,conex:`<ul>
<li><b>Art. 173.5:</b> nulidad de pleno derecho del compromiso sin crédito.</li>
<li><b>Arts. 215 a 218:</b> reparos, efectos y discrepancias: el cauce formal de esa advertencia por escrito.</li>
<li><b>Art. 222:</b> facultades del personal controlador.</li>
</ul>`,trampas:`<ul>
<li>"<b>En todo caso</b>" se predica de los ordenadores; la condición del escrito, solo de los interventores.</li>
<li>Se responde de gastos <b>sin crédito suficiente</b>, no de cualquier irregularidad.</li>
</ul>`,ancla:`<p><b>"El que firma, paga; el que calla, también."</b> El interventor solo se salva con papel.</p>`,vis:`<svg viewBox="0 0 640 145" role="img" aria-label="Responsabilidad personal por gasto sin crédito">
<rect x="30" y="30" width="260" height="80" rx="8" fill="var(--exc-bg)" stroke="var(--exc)"/>
<text x="160" y="54" text-anchor="middle" font-size="12" font-weight="700" fill="var(--exc)">Ordenadores de gastos y pagos</text>
<text x="160" y="76" text-anchor="middle" font-size="12" fill="currentColor">responden EN TODO CASO</text>
<text x="160" y="96" text-anchor="middle" font-size="10" fill="var(--ink2)">gasto o pago sin crédito suficiente</text>
<rect x="350" y="30" width="260" height="80" rx="8" fill="var(--warn-bg)" stroke="var(--warn)"/>
<text x="480" y="54" text-anchor="middle" font-size="12" font-weight="700" fill="var(--warn)">Interventores</text>
<text x="480" y="76" text-anchor="middle" font-size="12" fill="currentColor">solo si NO advierten por escrito</text>
<text x="480" y="96" text-anchor="middle" font-size="10" fill="var(--ej)">el reparo escrito les exonera</text>
<text x="320" y="132" text-anchor="middle" font-size="11" fill="var(--ink2)">Responsabilidad PERSONAL, además de la nulidad del art. 173.5</text>
</svg>`},
{n:189,t:"Requisitos previos a la expedición de órdenes de pago",ubic:"Título VI (Presupuesto y gasto público) ▸ Capítulo I (De los presupuestos) ▸ Sección 3.ª (Ejecución y liquidación)",idea:"Antes de pagar hay que acreditar que la prestación se hizo o que existe el derecho.",literal:`<p>1. Previamente a la expedición de las órdenes de pago con cargo a los presupuestos de la entidad local y de sus organismos autónomos habrá de acreditarse documentalmente ante el órgano que haya de reconocer las obligaciones la realización de la prestación o el derecho del acreedor de conformidad con los acuerdos que en su día autorizaron y comprometieron el gasto.</p><p>2. Los perceptores de subvenciones concedidas con cargo a los presupuestos de las entidades locales y de los organismos autónomos vendrán obligados a acreditar, antes de su percepción, que se encuentran al corriente de sus obligaciones fiscales con la entidad, así como, posteriormente, a justificar la aplicación de los fondos recibidos.</p>`,dis:`<ul>
<li><b>Regla general (189.1):</b> previamente a la expedición de las órdenes de pago debe <b>acreditarse documentalmente</b>, ante el órgano que ha de reconocer las obligaciones, <b>la realización de la prestación</b> o el <b>derecho del acreedor</b>, conforme a los acuerdos que autorizaron y comprometieron el gasto.</li>
<li><b>Regla especial para subvenciones (189.2):</b> los perceptores deben:
<ol><li><b>antes de percibir</b>: acreditar que están <b>al corriente de sus obligaciones fiscales con la entidad</b>;</li>
<li><b>después</b>: <b>justificar la aplicación</b> de los fondos recibidos.</li></ol></li>
</ul>`,llano:`<p>No se paga contra promesas: hay que enseñar el papel que demuestra que el trabajo se hizo o que existe el derecho a cobrar. Y quien recibe una subvención tiene dos deberes: antes de cobrar, no tener deudas fiscales con el ayuntamiento; después de cobrar, explicar en qué se gastó el dinero.</p>`,porque:`<p>Es el punto donde la Administración comprueba que <b>ha recibido lo que pagó</b>. Sin esta acreditación, la fase de reconocimiento sería un trámite ciego. En subvenciones, la exigencia previa evita la contradicción de dar dinero a quien debe dinero, y la justificación posterior es lo que distingue una subvención de una donación.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> pagar al pintor cuando terminó y viste la habitación pintada, no antes.</li>
<li><b>Real:</b> una asociación cultural recibe 12.000 € de subvención. Antes de cobrar aporta certificado de estar al corriente con el ayuntamiento; después presenta facturas y memoria de actividad justificando los 12.000 €.</li>
<li><b>Caso límite:</b> una orden de pago que no puede acompañar la documentación en el momento de expedirse. No es ilegal: se expide <b>a justificar</b> por la vía del art. 190.</li>
</ul>`,noej:`<ul>
<li><b>No basta</b> con la factura si no acredita la realización de la prestación conforme a lo acordado.</li>
<li><b>No se exige</b> estar al corriente con la Seguridad Social o con la AEAT en este precepto: la ley habla de obligaciones fiscales <b>con la entidad</b>. (La Ley 38/2003 sí añade otras exigencias.)</li>
</ul>`,conex:`<ul>
<li><b>Art. 190:</b> la excepción de los pagos a justificar.</li>
<li><b>Art. 184.1.c):</b> el reconocimiento de la obligación al que sirve esta acreditación.</li>
<li><b>Ley 38/2003, General de Subvenciones</b> (documento 8 de la biblioteca): régimen completo de justificación y reintegro.</li>
</ul>`,trampas:`<ul>
<li>La acreditación es <b>previa</b> a la orden de pago y se hace <b>ante el órgano que reconoce</b> la obligación.</li>
<li>En subvenciones hay <b>dos momentos</b>: antes (estar al corriente) y después (justificar).</li>
</ul>`,ancla:`<p><b>"Primero el papel, luego el dinero."</b> En subvenciones: <b>antes limpio, después justificado</b>.</p>`,vis:`<svg viewBox="0 0 640 150" role="img" aria-label="Requisitos previos a la orden de pago">

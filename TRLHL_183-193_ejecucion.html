{n:190,t:"Pagos a justificar. Anticipos de caja fija",ubic:"Título VI (Presupuesto y gasto público) ▸ Capítulo I (De los presupuestos) ▸ Sección 3.ª (Ejecución y liquidación)",idea:"Si no hay papeles al pagar, el pago es a justificar: tres meses para rendir cuentas.",literal:`<p>1. Las órdenes de pago cuyos documentos no se puedan acompañar en el momento de su expedición, según previene el artículo anterior, tendrán el carácter de a justificar y se aplicarán a los correspondientes créditos presupuestarios.</p><p>2. Las bases de ejecución del presupuesto podrán establecer, previo informe de la Intervención, las normas que regulen la expedición de órdenes de pago a justificar con cargo a los presupuestos de gastos, determinando los criterios generales, los límites cuantitativos y los conceptos presupuestarios a los que sean aplicables.</p><p>Los perceptores de estas órdenes de pago quedarán obligados a justificar la aplicación de las cantidades percibidas en el plazo máximo de tres meses, y sujetos al régimen de responsabilidades que establece la normativa vigente.</p><p>En ningún caso podrán expedirse nuevas órdenes de pago a justificar, por los mismos conceptos presupuestarios, a perceptores que tuviesen aún en su poder fondos pendientes de justificación.</p><p>3. Para las atenciones de carácter periódico o repetitivo, los fondos librados a justificar podrán tener el carácter de anticipos de caja fija. Los perceptores de estos fondos quedarán obligados a justificar la aplicación de las cantidades percibidas a lo largo del ejercicio presupuestario en que se constituyó el anticipo.</p>`,dis:`<table><thead><tr><th></th><th><span class="t" data-k="ajustificar">Pagos a justificar</span></th><th><span class="t" data-k="cajafija">Anticipos de caja fija</span></th></tr></thead><tbody>
<tr><th>Cuándo</th><td>No se pueden acompañar los documentos del art. 189 al expedir la orden</td><td>Atenciones de carácter <b>periódico o repetitivo</b></td></tr>
<tr><th>Plazo de justificación</th><td><b>Tres meses</b> como máximo</td><td>A lo largo del <b>ejercicio</b> en que se constituyó el anticipo</td></tr>
<tr><th>Aplicación</th><td>A los correspondientes créditos presupuestarios</td><td>Fondos librados a justificar con este carácter</td></tr>
</tbody></table>
<ul>
<li><b>Regulación (190.2):</b> las <b>bases de ejecución</b>, previo <b>informe de la Intervención</b>, fijan criterios generales, <b>límites cuantitativos</b> y <b>conceptos presupuestarios</b> aplicables.</li>
<li><b>Prohibición expresa:</b> no pueden expedirse nuevas órdenes a justificar <b>por los mismos conceptos presupuestarios</b> a perceptores que <b>aún tengan fondos pendientes de justificación</b>.</li>
<li><b>Responsabilidad:</b> los perceptores quedan sujetos al régimen de responsabilidades vigente.</li>
</ul>`,llano:`<p>A veces hay que entregar dinero antes de tener las facturas: un viaje, una compra urgente fuera. Eso es un pago a justificar, y quien lo recibe tiene tres meses para presentar los papeles. Si el gasto es pequeño y se repite (sellos, portes, café de una residencia), se usa una caja fija que se va reponiendo y se justifica dentro del año. Y hay una regla de sentido común: mientras no justifiques lo anterior, no te dan más por lo mismo.</p>`,porque:`<p>La regla del art. 189 es correcta pero rígida: hay gastos que no admiten esperar a la factura. La ley crea una válvula, pero la <b>rodea de cerrojos</b> —plazo, límites cuantitativos en las bases, informe de la Intervención y prohibición de acumular sin justificar— porque estos fondos son los que más se prestan a descontrol.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> el dinero que le das a alguien para hacer la compra: te trae el cambio y el tique.</li>
<li><b>Real:</b> se libran 1.500 € a justificar a un técnico municipal para inscripciones y desplazamientos a un congreso en marzo de 2026. Deberá justificarlos <b>antes de junio de 2026</b>.</li>
<li><b>Caso límite:</b> ese mismo técnico pide en mayo otro pago a justificar del mismo concepto presupuestario sin haber justificado el anterior: <b>no puede expedirse</b> (art. 190.2).</li>
</ul>`,noej:`<ul>
<li><b>No es caja fija</b> un pago puntual y no repetitivo: la caja fija es para atenciones periódicas o repetitivas.</li>
<li><b>No hay libertad</b> para expedirlos: solo en los conceptos y con los límites que fijen las bases, previo informe de Intervención.</li>
</ul>`,conex:`<ul>
<li><b>Art. 189:</b> la regla general que este artículo excepciona.</li>
<li><b>Art. 165.1:</b> las bases de ejecución donde se regulan.</li>
<li><b>Art. 219.2:</b> fiscalización previa limitada y control financiero posterior de estos fondos.</li>
</ul>`,trampas:`<ul>
<li><b>Tres meses</b> para los pagos a justificar; <b>a lo largo del ejercicio</b> para la caja fija. No es el mismo plazo.</li>
<li>La prohibición de nuevas órdenes opera <b>por los mismos conceptos presupuestarios</b>, no de forma absoluta.</li>
<li>Las bases los regulan <b>previo informe de la Intervención</b>.</li>
</ul>`,ancla:`<p><b>"A justificar: tres meses. Caja fija: todo el año."</b><br>Y la regla del bar: <b>no se sirve otra copa a quien no ha pagado la anterior</b> (mismo concepto presupuestario).</p>`,vis:`<svg viewBox="0 0 640 165" role="img" aria-label="Pagos a justificar y anticipos de caja fija">

<text x="165" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="var(--exc)">3 MESES para justificar</text>
<text x="165" y="107" text-anchor="middle" font-size="10" fill="var(--ink2)">art. 190.1 y 2</text>
<rect x="340" y="25" width="270" height="90" rx="8" fill="var(--ej-bg)" stroke="var(--ej)"/>

<text x="320" y="147" text-anchor="middle" font-size="11" fill="var(--warn)">Prohibido expedir nuevas órdenes por los mismos conceptos si hay fondos sin justificar</text>
</svg>`},
{n:191,t:"Cierre y liquidación del presupuesto",ubic:"Título VI (Presupuesto y gasto público) ▸ Capítulo I (De los presupuestos) ▸ Sección 3.ª (Ejecución y liquidación)",idea:"El 31 de diciembre se cierra, antes del 1 de marzo se liquida y la aprueba el presidente.",literal:`<p>1. El presupuesto de cada ejercicio se liquidará en cuanto a la recaudación de derechos y al pago de obligaciones el 31 de diciembre del año natural correspondiente, quedando a cargo de la Tesorería local los ingresos y pagos pendientes, según sus respectivas contracciones.</p><p>2. Las obligaciones reconocidas y liquidadas no satisfechas el último día del ejercicio, los derechos pendientes de cobro y los fondos líquidos a 31 de diciembre configurarán el remanente de tesorería de la entidad local. La cuantificación del remanente de tesorería deberá realizarse teniendo en cuenta los posibles ingresos afectados y minorando de acuerdo con lo que reglamentariamente se establezca los derechos pendientes de cobro que se consideren de difícil o imposible recaudación.</p><p>3. Las entidades locales deberán confeccionar la liquidación de su presupuesto antes del día primero de marzo del ejercicio siguiente.</p><p>La aprobación de la liquidación del presupuesto corresponde al presidente de la entidad local, previo informe de la Intervención.</p>`,dis:`<table><thead><tr><th>Apdo.</th><th>Contenido</th><th>Dato clave</th></tr></thead><tbody>
<tr><td>191.1</td><td>Cierre en cuanto a recaudación de derechos y pago de obligaciones</td><td><b>31 de diciembre</b>; los pendientes quedan a cargo de la <b>Tesorería</b></td></tr>
<tr><td>191.2</td><td>Configuración del <span class="t" data-k="remtes">remanente de tesorería</span></td><td>Obligaciones reconocidas y liquidadas no satisfechas + derechos pendientes de cobro + fondos líquidos a 31-XII</td></tr>
<tr><td>191.2</td><td>Cuantificación</td><td>Teniendo en cuenta los <b>ingresos afectados</b> y minorando los derechos de <b>difícil o imposible recaudación</b></td></tr>
<tr><td>191.3</td><td>Confección de la liquidación</td><td>Antes del <b>1 de marzo</b> del ejercicio siguiente</td></tr>
<tr><td>191.3</td><td>Aprobación</td><td><b>Presidente</b>, previo <b>informe de la Intervención</b></td></tr>
</tbody></table>`,llano:`<p>El 31 de diciembre se echa el cierre: lo que quedó por cobrar y por pagar pasa a la tesorería. Con esos tres datos —lo que debemos, lo que nos deben y lo que tenemos en el banco— se calcula el remanente de tesorería, que es la foto de si sobra o falta dinero. Todo eso hay que tenerlo hecho antes del 1 de marzo, y lo aprueba el alcalde con el informe del interventor.</p>`,porque:`<p>La liquidación es el <b>examen de la verdad</b> del presupuesto: dice qué se ejecutó realmente frente a lo que se autorizó. El remanente de tesorería es la magnitud de la que dependen decisiones muy relevantes (financiar suplementos, incorporar créditos, corregir déficit). Por eso la ley obliga a depurarlo con los <b>dudosos cobros</b>: un remanente inflado con deudas incobrables llevaría a gastar dinero que no existe.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> el cierre de caja de un bar: caja, lo que te deben los clientes de cuenta y lo que debes a proveedores. Y descontar la cuenta de aquel que nunca va a pagar.</li>
<li><b>Real:</b> a 31 de diciembre de 2026 un ayuntamiento tiene 3,2 M€ en fondos líquidos, 4,1 M€ de derechos pendientes de cobro y 2,7 M€ de obligaciones pendientes de pago. Minorados 1,6 M€ por dudoso cobro, el remanente resultante es de 3,0 M€. La interventora informa y el alcalde aprueba la liquidación el 26 de febrero de 2027.</li>
<li><b>Caso límite:</b> si el resultado hubiera sido negativo, se activa el art. 193 en la primera sesión que celebre el Pleno.</li>
</ul>`,noej:`<ul>
<li><b>No aprueba la liquidación el Pleno</b>: la aprueba el <b>presidente</b>. Al Pleno se le <b>da cuenta</b> (art. 193.4).</li>
<li><b>No es la cuenta general</b>: la liquidación es una parte de ella y tiene otro calendario y otro órgano.</li>
<li><b>No coincide</b> remanente de tesorería con resultado presupuestario: son magnitudes distintas.</li>
</ul>`,conex:`<ul>
<li><b>Art. 193 y 193 bis:</b> qué hacer si el remanente es negativo y cómo minorar los dudosos cobros.</li>
<li><b>Art. 177.4:</b> el remanente líquido de tesorería como recurso para financiar modificaciones.</li>
<li><b>Art. 182:</b> la incorporación de remanentes exige recursos financieros suficientes.</li>
<li><b>Art. 212:</b> la cuenta general, en la que se integra la liquidación.</li>
</ul>`,trampas:`<ul>
<li><b>1 de marzo</b>: confeccionar la liquidación. <b>31 de marzo</b>: remitir copia al Estado y a la CCAA (art. 193.5). Son dos fechas distintas y muy confundidas.</li>
<li>Aprueba el <b>presidente</b>, previo informe de la <b>Intervención</b>.</li>
<li>El remanente se minora por dudoso cobro y se calcula <b>teniendo en cuenta los ingresos afectados</b>.</li>
</ul>`,ancla:`<p><b>"Cierro en diciembre, liquido en marzo, y firma el alcalde."</b><br>Remanente = <b>lo que tengo + lo que me deben − lo que debo</b>, quitando lo que no voy a cobrar.</p>`,vis:`<svg viewBox="0 0 640 190" role="img" aria-label="Cierre, liquidación y remanente de tesorería">

<text x="427" y="66" text-anchor="middle" font-size="16" fill="var(--ink2)">−</text>

<text x="534" y="75" text-anchor="middle" font-size="10" fill="currentColor">reconocidas no satisfechas</text>
<rect x="140" y="100" width="360" height="38" rx="8" fill="var(--acc-soft)" stroke="var(--acc)" stroke-width="2"/>
<text x="320" y="124" text-anchor="middle" font-size="12" font-weight="700" fill="var(--acc)">= REMANENTE DE TESORERÍA</text>
<text x="320" y="155" text-anchor="middle" font-size="10" fill="var(--warn)">minorando los derechos de difícil o imposible recaudación y atendiendo a los ingresos afectados</text>
<text x="320" y="178" text-anchor="middle" font-size="11" fill="var(--ink2)">Liquidación confeccionada antes del 1 de marzo · la aprueba el PRESIDENTE previo informe de Intervención</text>
</svg>`},
{n:192,t:"Cierre y liquidación del presupuesto de organismos autónomos",ubic:"Título VI (Presupuesto y gasto público) ▸ Capítulo I (De los presupuestos) ▸ Sección 3.ª (Ejecución y liquidación)",idea:"Los organismos autónomos liquidan igual, pero su aprobación sube al presidente de la entidad.",literal:`<p>1. La liquidación de los presupuestos de los organismos autónomos se ajustará a lo dispuesto en el apartado 1 del artículo anterior. Reglamentariamente se regularán las operaciones de cierre del ejercicio económico y de liquidación de los presupuestos, atendiendo al carácter de los citados organismos.</p><p>2. La liquidación de los presupuestos de los organismos autónomos, informada por la Intervención correspondiente y propuesta por el órgano competente de estos, será remitida a la entidad local para su aprobación por su presidente y a los efectos previstos en el artículo siguiente.</p>`,dis:`<ul>
<li><b>192.1:</b> la liquidación de los OOAA se ajusta al art. 191.1 (cierre a 31 de diciembre). El reglamento regulará las operaciones de cierre atendiendo al <b>carácter</b> de cada organismo (administrativo o comercial e industrial: art. 164.2).</li>
<li><b>192.2 — circuito:</b> <b>propuesta</b> del órgano competente del organismo → <b>informe</b> de la Intervención correspondiente → <b>remisión</b> a la entidad local → <b>aprobación por el presidente</b> de la entidad local → efectos del art. 193.</li>
</ul>`,llano:`<p>El patronato o la gerencia cierran sus cuentas igual que el ayuntamiento, pero no se las aprueban ellos mismos: las proponen, el interventor informa y quien firma la aprobación es el alcalde de la entidad de la que dependen.</p>`,porque:`<p>Si cada organismo aprobara su propia liquidación, el grupo local no tendría una visión única ni un responsable identificable, y el remanente negativo de un patronato podría pasar desapercibido. Centralizar la aprobación en el presidente de la entidad matriz mantiene la <b>unidad del presupuesto general</b> del art. 164.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> las cuentas de una filial que las prepara su director pero las firma el administrador del grupo.</li>
<li><b>Real:</b> el Patronato Municipal de Deportes cierra 2026 con un remanente negativo de 45.000 €. Propone su liquidación, la Intervención informa y el alcalde la aprueba: se activan entonces las medidas del art. 193 en el órgano competente del organismo.</li>
</ul>`,noej:`<ul>
<li><b>No la aprueba</b> el consejo rector del organismo: solo la propone.</li>
<li><b>No queda al margen</b> del art. 193: la remisión final del 192.2 lo dice expresamente.</li>
</ul>`,conex:`<ul>
<li><b>Art. 191:</b> régimen general al que se remite.</li>
<li><b>Art. 193:</b> los efectos a los que alude "a los efectos previstos en el artículo siguiente".</li>
<li><b>Art. 164.2:</b> la clasificación de los organismos autónomos que condiciona las operaciones de cierre.</li>
</ul>`,trampas:`<ul>
<li>Tres intervinientes en orden: <b>propone</b> el organismo, <b>informa</b> la Intervención, <b>aprueba</b> el presidente de la entidad local.</li>
<li>El apartado 1 solo se remite al <b>apartado 1</b> del art. 191, no a todo el artículo.</li>
</ul>`,ancla:`<p><b>"Propone el hijo, informa el interventor, firma el padre."</b></p>`,vis:`<svg viewBox="0 0 640 120" role="img" aria-label="Circuito de liquidación de los organismos autónomos">

{n:193,t:"Liquidación del presupuesto con remanente de tesorería negativo. Remisión a otras Administraciones públicas",ubic:"Título VI (Presupuesto y gasto público) ▸ Capítulo I (De los presupuestos) ▸ Sección 3.ª (Ejecución y liquidación)",idea:"Remanente negativo: reducir gastos, si no operación de crédito, si no superávit inicial.",literal:`<p>1. En caso de liquidación del presupuesto con remanente de tesorería negativo, el Pleno de la corporación o el órgano competente del organismo autónomo, según corresponda, deberán proceder, en la primera sesión que celebren, a la reducción de gastos del nuevo presupuesto por cuantía igual al déficit producido. La expresada reducción sólo podrá revocarse por acuerdo del Pleno, a propuesta del presidente, y previo informe del Interventor, cuando el desarrollo normal del presupuesto y la situación de la tesorería lo consintiesen.</p><p>2. Si la reducción de gastos no resultase posible, se podrá acudir al concierto de operación de crédito por su importe, siempre que se den las condiciones señaladas en el artículo 177.5 de esta ley.</p><p>3. De no adoptarse ninguna de las medidas previstas en los dos apartados anteriores, el presupuesto del ejercicio siguiente habrá de aprobarse con un superávit inicial de cuantía no inferior al repetido déficit.</p><p>4. De la liquidación de cada uno de los presupuestos que integran el presupuesto general y de los estados financieros de las sociedades mercantiles dependientes de la entidad, una vez realizada su aprobación, se dará cuenta al Pleno en la primera sesión que celebre.</p><p>5. Las entidades locales remitirán copia de la liquidación de sus presupuestos a la Administración del Estado y a la comunidad autónoma antes de finalizar el mes de marzo del ejercicio siguiente al que corresponda.</p><p>La falta de remisión de la liquidación en el plazo señalado facultará a la Administración para utilizar como actuales, a cualquier efecto, los datos que conozca relativos a la entidad de que se trate.</p>`,dis:`<div class="box exc"><span class="lbl">Escalera de medidas ante remanente de tesorería negativo</span>
<ol><li><b>Reducción de gastos</b> del nuevo presupuesto por cuantía <b>igual al déficit</b>, acordada por el Pleno (o el órgano competente del OA) <b>en la primera sesión que celebren</b>. Solo puede revocarse por acuerdo del Pleno, a propuesta del presidente y previo informe del Interventor, cuando el desarrollo del presupuesto y la tesorería lo consientan.</li>
<li>Si la reducción <b>no resulta posible</b>: <b>operación de crédito</b> por su importe, siempre que se den las condiciones del <b>art. 177.5</b> (5 %, 25 % y cancelación antes de la renovación).</li>
<li>Si no se adopta ninguna de las anteriores: el presupuesto del ejercicio siguiente debe aprobarse con <b><span class="t" data-k="superavit">superávit inicial</span></b> de cuantía <b>no inferior</b> al déficit.</li></ol></div>
<ul>
<li><b>193.4 — dar cuenta:</b> de la liquidación de cada presupuesto integrante y de los estados financieros de las sociedades dependientes, <b>una vez aprobada</b>, se da cuenta al <b>Pleno</b> en la <b>primera sesión</b> que celebre.</li>
<li><b>193.5 — remisión:</b> copia de la liquidación al <b>Estado</b> y a la <b>comunidad autónoma</b> <b>antes de finalizar el mes de marzo</b> del ejercicio siguiente. Si no se remite, la Administración puede usar como actuales los datos que conozca.</li>
</ul>`,llano:`<p>Si al cerrar el año resulta que faltan fondos, no se puede mirar hacia otro lado. Primero, recortar el presupuesto nuevo exactamente en lo que falta, y hay que hacerlo en la primera sesión del Pleno. Si no se puede recortar, pedir un préstamo con condiciones estrictas. Y si tampoco, el presupuesto del año siguiente tiene que nacer con superávit por al menos esa cantidad. Además, la liquidación se lleva al Pleno para su conocimiento y se manda al Estado y a la comunidad autónoma antes de que acabe marzo.</p>`,porque:`<p>Un remanente negativo significa que la entidad ha gastado más de lo que puede pagar. Si no se corrigiera, el desfase se arrastraría y crecería. La ley impone una <b>corrección automática y ordenada</b>, de menor a mayor coste: primero ajustar el gasto propio, después endeudarse (peor, porque traslada la carga al futuro) y, en último término, obligar a que el presupuesto siguiente genere el ahorro. La remisión al Estado y a la CCAA permite la supervisión externa.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> una familia que cierra el año con números rojos: primero recorta gastos, luego pide un préstamo y, si no, se impone ahorrar esa cantidad al año siguiente.</li>
<li><b>Real:</b> liquidación de 2026 con remanente negativo de 620.000 €. En la primera sesión del Pleno de marzo de 2027 se acuerda reducir gastos del presupuesto de 2027 por esos 620.000 €. Copia de la liquidación se remite al Estado y a la Junta antes del 31 de marzo de 2027.</li>
<li><b>Caso límite:</b> si el ayuntamiento no puede recortar sin dejar de prestar servicios obligatorios, podría acudir a una operación de crédito, pero solo si su importe anual no supera el 5 % de sus recursos corrientes y su carga financiera total se mantiene por debajo del 25 % (remisión al art. 177.5).</li>
</ul>`,noej:`<ul>
<li><b>No es opcional</b> el orden: la operación de crédito procede "si la reducción de gastos no resultase posible", no como alternativa libre.</li>
<li><b>No se remite</b> la liquidación en cualquier momento: <b>antes de finalizar marzo</b>.</li>
<li><b>No se aprueba</b> la liquidación por el Pleno: se le <b>da cuenta</b> (193.4).</li>
</ul>`,conex:`<ul>
<li><b>Art. 191.2:</b> el cálculo del remanente que activa este artículo.</li>
<li><b>Art. 177.5:</b> las condiciones que debe cumplir la operación de crédito.</li>
<li><b>Art. 165.4:</b> el principio de aprobación sin déficit inicial, que aquí se refuerza exigiendo superávit.</li>
<li><b>Art. 193 bis:</b> los mínimos de dudoso cobro que condicionan el cálculo.</li>
</ul>`,trampas:`<ul>
<li>El orden <b>1-2-3</b>: reducción → crédito → superávit inicial. Los tests cambian el orden o convierten el tercero en primero.</li>
<li>"En la <b>primera sesión</b> que celebren": no hay un plazo en días.</li>
<li>La revocación de la reducción exige tres cosas: acuerdo del <b>Pleno</b>, <b>propuesta del presidente</b> e <b>informe del Interventor</b>.</li>
<li><b>Marzo</b> para remitir; <b>1 de marzo</b> para confeccionar (art. 191.3).</li>
</ul>`,ancla:`<p><b>"Recorto, me endeudo o ahorro."</b> En ese orden y sin saltos.<br>Y el calendario de marzo: <b>día 1 se confecciona, fin de mes se remite</b>.</p>`,vis:`<svg viewBox="0 0 640 205" role="img" aria-label="Medidas ante un remanente de tesorería negativo">

{n:"193bis",t:"Derechos de difícil o imposible recaudación",ubic:"Título VI (Presupuesto y gasto público) ▸ Capítulo I (De los presupuestos) ▸ Sección 3.ª (Ejecución y liquidación)",idea:"Hay porcentajes mínimos obligatorios para descontar lo que no se va a cobrar.",literal:`<p>Las Entidades Locales deberán informar al Ministerio de Hacienda y Administraciones Públicas y a su Pleno, u órgano equivalente, del resultado de la aplicación de los criterios determinantes de los derechos de difícil o imposible recaudación con los siguientes límites mínimos:</p><p>a) Los derechos pendientes de cobro liquidados dentro de los presupuestos de los dos ejercicios anteriores al que corresponde la liquidación, se minorarán, como mínimo, en un 25 por ciento.</p><p>b) Los derechos pendientes de cobro liquidados dentro de los presupuestos del ejercicio tercero anterior al que corresponde la liquidación, se minorarán, como mínimo, en un 50 por ciento.</p><p>c) Los derechos pendientes de cobro liquidados dentro de los presupuestos de los ejercicios cuarto a quinto anteriores al que corresponde la liquidación, se minorarán, como mínimo, en un 75 por ciento.</p><p>d) Los derechos pendientes de cobro liquidados dentro de los presupuestos de los restantes ejercicios anteriores al que corresponde la liquidación, se minorarán en un 100 por ciento.</p>`,dis:`<ul>
<li><b>Obligación:</b> informar al <b>Ministerio de Hacienda</b> y al <b>Pleno</b> (u órgano equivalente) del resultado de aplicar los criterios de <span class="t" data-k="dudoso">dudoso cobro</span>.</li>
<li><b>Son límites MÍNIMOS:</b> la entidad puede minorar más, nunca menos.</li>
</ul>
<table><thead><tr><th>Antigüedad del derecho pendiente de cobro</th><th>Minoración mínima</th></tr></thead><tbody>
<tr><td>Liquidados en los <b>dos ejercicios anteriores</b> al de la liquidación</td><td><b>25 %</b></td></tr>
<tr><td>Liquidados en el <b>tercer ejercicio anterior</b></td><td><b>50 %</b></td></tr>
<tr><td>Liquidados en los ejercicios <b>cuarto a quinto anteriores</b></td><td><b>75 %</b></td></tr>
<tr><td><b>Restantes</b> ejercicios anteriores</td><td><b>100 %</b></td></tr>
</tbody></table>`,llano:`<p>Contar como dinero disponible una deuda de hace ocho años que nadie va a pagar es engañarse. La ley pone una escala: cuanto más vieja es la deuda, mayor porcentaje hay que descontar del remanente. A partir del sexto año anterior, se descuenta entera.</p>`,porque:`<p>Antes de esta regla, cada entidad aplicaba su propio criterio y el remanente se inflaba a conveniencia para justificar más gasto. Al fijar <b>mínimos objetivos por antigüedad</b>, el legislador impide ese maquillaje y hace comparables los remanentes de todos los municipios.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> el que te debe 50 € desde hace seis años: contablemente, ese dinero ya no existe.</li>
<li><b>Real:</b> liquidación de 2026 con derechos pendientes: 400.000 € de 2025 y 2024 (minorar al menos 100.000 €), 200.000 € de 2023 (al menos 100.000 €), 160.000 € de 2022 y 2021 (al menos 120.000 €) y 90.000 € anteriores (los 90.000 € completos). Minoración mínima total: <b>410.000 €</b>.</li>
<li><b>Caso límite:</b> si la entidad estima que una deuda reciente de 2025 es incobrable al 100 %, puede minorarla íntegramente: los porcentajes son suelos, no techos.</li>
</ul>`,noej:`<ul>
<li><b>No son porcentajes máximos</b>: la ley dice "límites mínimos".</li>
<li><b>No es un cálculo interno</b>: hay que informar al Ministerio y al Pleno.</li>
</ul>`,conex:`<ul>
<li><b>Art. 191.2:</b> la minoración de los derechos de difícil o imposible recaudación en el remanente.</li>
<li><b>Art. 193:</b> las medidas si, tras la minoración, el remanente resulta negativo.</li>
</ul>`,trampas:`<ul>
<li>La escala es <b>25 · 50 · 75 · 100</b>, y el primer tramo abarca <b>dos</b> ejercicios (los dos anteriores).</li>
<li>El tercer tramo abarca los ejercicios <b>cuarto a quinto</b> anteriores.</li>
<li>Se informa al <b>Ministerio de Hacienda y al Pleno</b>: dos destinatarios.</li>
</ul>`,ancla:`<p><b>"Cuartos crecientes": 25 · 50 · 75 · 100.</b> Un cuarto por escalón, empezando por los dos años más recientes juntos.</p>`,vis:`<svg viewBox="0 0 640 165" role="img" aria-label="Porcentajes mínimos de dudoso cobro">

90, "q": "Los anticipos de caja fija se destinan a atenciones de carácter periódico o repetitivo.", "vf": true, "ok": true, "fb": "<b>Verdadero</b> (art. 190.3). Se justifican a lo largo del ejercicio presupuestario en que se constituyó el anticipo."}, {"a": 191, "q": "Completa: «Las entidades locales deberán confeccionar la liquidación de su presupuesto antes del día ______ del ejercicio siguiente».", "gap": "primero de marzo", "fb": "Antes del <b>1 de marzo</b> (art. 191.3). No lo confundas con la remisión al Estado y a la CCAA, que es antes de finalizar marzo (art. 193.5)."}, {"a": 191, "q": "La liquidación del presupuesto la aprueba:", "o": [["el presidente de la entidad local, previo informe de la Intervención", 1, "Correcto: art. 191.3."], ["el Pleno, por mayoría simple", 0, "No: al Pleno solo se le da cuenta (art. 193.4)."], ["la Comisión Especial de Cuentas", 0, "Esa interviene en la cuenta general (art. 212.2), no en la liquidación."], ["la Intervención", 0, "La Intervención informa, no aprueba."]]}, {"a": 191, "q": "¿Qué magnitudes configuran el remanente de tesorería?", "o": [["obligaciones reconocidas no satisfechas, derechos pendientes de cobro y fondos líquidos a 31 de diciembre", 1, "Correcto: art. 191.2, minorando los derechos de dudoso cobro y atendiendo a los ingresos afectados."], ["ingresos y gastos previstos en el presupuesto inicial", 0, "Eso es el presupuesto, no el remanente."], ["el resultado presupuestario del ejercicio", 0, "Es otra magnitud distinta."], ["los créditos incorporados del ejercicio anterior", 0, "No: los créditos incorporados se regulan en el art. 182."]]}, {"a": 193, "q": "Ante una liquidación con remanente de tesorería negativo, la primera medida es:", "o": [["reducir gastos del nuevo presupuesto por cuantía igual al déficit", 1, "Correcto: art. 193.1, en la primera sesión que celebre el Pleno."], ["concertar una operación de crédito", 0, "Solo si la reducción de gastos no resultase posible (art. 193.2)."], ["aprobar el pre ecución", "fb": "<b>Bases de ejecución</b> (art. 183). Son contenido obligatorio del presupuesto por el art. 165.1."}, {"a": 192, "q": "La liquidación del presupuesto de un organismo autónomo la aprueba:", "o": [["el presidente de la entidad local de la que depende", 1, "Correcto: art. 192.2, previa propuesta del órgano del organismo e informe de la Intervención."], ["el órgano competente del propio organismo autónomo", 0, "Ese órgano la <b>propone</b>, no la aprueba."], ["el Pleno de la entidad local", 0, "No: el Pleno recibe cuenta, no aprueba."], ["la Intervención del organismo", 0, "La Intervención informa."]]}];
const CASOS=[{"t": "Caso 1 · Sigue el rastro de un gasto", "e": "El Ayuntamiento contrata la renovación del alumbrado de un barrio. Cronología: <b>(1)</b> 4 de febrero, el Pleno aprueba el expediente de contratación por 420.000 €; <b>(2)</b> 20 de marzo, se adjudica a una empresa por 388.000 €; <b>(3)</b> 30 de junio, se aprueba la certificación n.º 2 por 95.000 € tras informe favorable del director de obra; <b>(4)</b> 5 de julio, el alcalde expide la orden de pago; <b>(5)</b> 20 de julio, la tesorería transfiere el dinero. <b>Identifica las fases, los órganos y qué artículo aplica en cada paso.</b>", "s": "<p><b>(1) Fase A (autorización)</b> — art. 184.1.a). Órgano: el Pleno, conforme al reparto del art. 185.1 y a la normativa de régimen local.</p><p><b>(2) Fase D (disposición o compromiso)</b> — art. 184.1.b). Se concreta el tercero y el importe exacto.</p><p><b>(3) Fase O (reconocimiento de la obligación)</b> — art. 184.1.c). Corresponde al <b>presidente</b> (art. 185.2). Previamente se ha acreditado documentalmente la realización de la prestación, como exige el art. 189.1.</p><p><b>(4) Fase P (ordenación del pago)</b> — art. 184.1.d), competencia del presidente (art. 186.1), acomodándose al plan de disposición de fondos (art. 187).</p><p><b>(5) Pago material</b> — ya no es fase del art. 184: corresponde a la Tesorería (arts. 194 y ss.).</p><p><b>Nota:</b> si en cualquiera de esos pasos se hubiera actuado sin crédito suficiente, el acto sería nulo de pleno derecho (art. 173.5) y habría responsabilidad personal del ordenador y, si no reparó por escrito, del interventor (art. 188).</p>"}, {"t": "Caso 2 · La liquidación que sale mal", "e": "A 31 de diciembre de 2026, un ayuntamiento presenta: fondos líquidos 1.100.000 €; derechos pendientes de cobro 2.400.000 € (de los cuales 900.000 € de 2025-2024, 600.000 € de 2023, 500.000 € de 2022-2021 y 400.000 € anteriores); obligaciones pendientes de pago 3.000.000 €. <b>Calcula la minoración mínima por dudoso cobro, el remanente resultante y las medidas a adoptar.</b>", "s": "<p><b>1) Minoración mínima (art. 193 bis):</b> 900.000 × 25 % = 225.000 € · 600.000 × 50 % = 300.000 € · 500.000 × 75 % = 375.000 € · 400.000 × 100 % = 400.000 €. <b>Total mínimo: 1.300.000 €</b>.</p><p><b>2) Derechos computables:</b> 2.400.000 − 1.300.000 = <b>1.100.000 €</b>.</p><p><b>3) Remanente de tesorería (art. 191.2):</b> 1.100.000 (fondos líquidos) + 1.100.000 (derechos depurados) − 3.000.000 (obligaciones) = <b>−800.000 €</b>. Negativo.</p><p><b>4) Medidas (art. 193):</b> en la <b>primera sesión</b> que celebre, el Pleno debe reducir gastos del presupuesto de 2027 por 800.000 €. Si no fuera posible, cabe operación de crédito por ese importe con las condiciones del art. 177.5. Y si no se adopta ninguna, el presupuesto de 2028 deberá aprobarse con superávit inicial no inferior a 800.000 €.</p><p><b>5) Calendario:</b> liquidación confeccionada antes del <b>1 de marzo</b> de 2027 y aprobada por el alcalde previo informe de Intervención (art. 191.3); copia al Estado y a la comunidad autónoma antes de <b>finalizar marzo</b> (art. 193.5); cuenta al Pleno en la primera sesión (art. 193.4).</p>"}, {"t": "Caso 3 · El fondo que no se justifica", "e": "En abril de 2026 se libran 2.000 € a justificar a un funcionario para gastos de una feria de promoción. En julio no ha presentado justificación alguna y solicita otros 1.800 € del mismo concepto presupuestario para otra feria. Además, en la misma tesorería hay un anticipo de caja fija de 3.000 € para material de oficina constituido en enero. <b>¿Qué procede?</b>", "s": "<p><b>1) El plazo está incumplido.</b> Los pagos a justificar deben justificarse en un plazo máximo de <b>tres meses</b> (art. 190.2): vencía en julio. El perceptor queda sujeto al régimen de responsabilidades vigente.</p><p><b>2) La nueva orden no puede expedirse.</b> El art. 190.2 lo prohíbe expresamente: no caben nuevas órdenes a justificar <b>por los mismos conceptos presupuestarios</b> a perceptores con fondos pendientes de justificación.</p><p><b>3) El anticipo de caja fija es distinto.</b> Se justifica <b>a lo largo del ejercicio</b> en que se constituyó (art. 190.3), no en tres meses, porque atiende gastos periódicos o repetitivos. No se ve afectado por la situación anterior.</p><p><b>4) Marco:</b> todo ello dentro de los criterios, límites cuantitativos y conceptos que fijen las bases de ejecución, previo informe de la Intervención (art. 190.2).</p>"}];

const INTRO_HTML="<section class=\"card\" id=\"intro\"><h2>Bloque 3 del tema 8 · Ejecución y liquidación</h2><p class=\"small\">Ya sabes cómo se aprueba el presupuesto (bloque 1) y cómo se modifica (bloque 2). Aquí se ve cómo se gasta de verdad —las cuatro fases del gasto y quién firma cada una— y cómo se cierra el año: liquidación, remanente de tesorería y qué hacer si sale negativo.</p><div class=\"box ej\"><span class=\"lbl\">La idea que ordena todo el bloque</span>Todo gasto recorre el camino <b>A-D-O-P</b>, y en cada escalón hay un órgano competente y un control. Al final del año se hace la foto: la <b>liquidación</b>, cuyo resultado más importante es el <b>remanente de tesorería</b>. Si esa foto sale en negativo, la ley obliga a corregir en un orden estricto.</div><div class=\"box warn\"><span class=\"lbl\">Advertencia de vigencia</span>Texto consolidado del RDLeg 2/2004 actualizado a <b>28 de enero de 2026</b>. Ten presente que la prioridad absoluta del pago de intereses y capital de la deuda pública procede del art. 135 CE y de la LO 2/2012, no de este texto. Verifica siempre en el BOE consolidado.</div><svg viewBox=\"0 0 660 235\" role=\"img\" aria-label=\"Mapa conceptual de la ejecución y liquidación\"><rect x=\"230\" y=\"8\" width=\"200\" height=\"36\" rx=\"9\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"330\" y=\"31\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"#fff\">EL PRESUPUESTO EN MARCHA</text><line x1=\"330\" y1=\"44\" x2=\"330\" y2=\"60\" stroke=\"var(--acc)\" stroke-width=\"2\"/><line x1=\"130\" y1=\"60\" x2=\"530\" y2=\"60\" stroke=\"var(--acc)\" stroke-width=\"2\"/><line x1=\"130\" y1=\"60\" x2=\"130\" y2=\"78\" stroke=\"var(--acc)\" stroke-width=\"2\"/><line x1=\"330\" y1=\"60\" x2=\"330\" y2=\"78\" stroke=\"var(--acc)\" stroke-width=\"2\"/><line x1=\"530\" y1=\"60\" x2=\"530\" y2=\"78\" stroke=\"var(--acc)\" stroke-width=\"2\"/><rect x=\"25\" y=\"78\" width=\"210\" height=\"140\" rx=\"9\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"130\" y=\"100\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"var(--acc)\">CÓMO SE GASTA</text><text x=\"130\" y=\"126\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">183 · régimen</text><text x=\"130\" y=\"146\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">184 · fases ADOP</text><text x=\"130\" y=\"166\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">185 · competencias</text><text x=\"130\" y=\"186\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">186 y 187 · pagos</text><rect x=\"245\" y=\"78\" width=\"170\" height=\"140\" rx=\"9\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"330\" y=\"100\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"var(--warn)\">GARANTÍAS</text><text x=\"330\" y=\"126\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">188 · responsabilidad</text><text x=\"330\" y=\"146\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">189 · acreditación</text><text x=\"330\" y=\"166\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">190 · a justificar</text><text x=\"330\" y=\"186\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">y caja fija</text><rect x=\"425\" y=\"78\" width=\"210\" height=\"140\" rx=\"9\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"530\" y=\"100\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"var(--ej)\">CÓMO SE CIERRA</text><text x=\"530\" y=\"126\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">191 · liquidación</text><text x=\"530\" y=\"146\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">192 · organismos</text><text x=\"530\" y=\"166\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">193 · remanente negativo</text><text x=\"530\" y=\"186\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">193 bis · dudoso cobro</text></svg></section>";
const RESUMEN_HTML="<section class=\"card\" id=\"resumen\"><h2>Resumen ejecutivo</h2><table><tbody><tr><th style=\"width:70px\">183</th><td>Ejecución: esta sección + <b>bases de ejecución</b> de cada entidad.</td></tr><tr><th>184</th><td>Fases <b>A-D-O-P</b>: autorización, disposición, reconocimiento de la obligación y ordenación del pago. Cabe acumularlas.</td></tr><tr><th>185</th><td>A y D: <b>presidente o Pleno</b>. O: <b>presidente</b>. Delegación por el art. 23 LBRL, recogida en las bases para cada ejercicio.</td></tr><tr><th>186</th><td>Ordena pagos el <b>presidente</b>. El Pleno puede crear unidad de ordenación de pagos y, si hay más de <b>500.000 habitantes de derecho</b>, unidad central de tesorería.</td></tr><tr><th>187</th><td>Plan de disposición de fondos del presidente, con prioridad de <b>personal</b> y de <b>obligaciones de ejercicios anteriores</b>.</td></tr><tr><th>188</th><td>Responsabilidad personal: ordenadores <b>en todo caso</b>; interventores si <b>no advierten por escrito</b>.</td></tr><tr><th>189</th><td>Acreditación documental previa de la prestación o del derecho. Subvenciones: al corriente <b>antes</b>, justificar <b>después</b>.</td></tr><tr><th>190</th><td>Pagos a justificar: <b>3 meses</b>. Anticipos de caja fija: gastos periódicos, justificación <b>en el ejercicio</b>. Prohibido repetir sin justificar.</td></tr><tr><th>191</th><td>Cierre a <b>31-DIC</b>. Remanente = fondos líquidos + derechos pendientes − obligaciones pendientes, depurado. Liquidación antes del <b>1 de marzo</b>, aprobada por el <b>presidente</b> previo informe de Intervención.</td></tr><tr><th>192</th><td>OOAA: propone su órgano, informa Intervención, <b>aprueba el presidente</b> de la entidad local.</td></tr><tr><th>193</th><td>Remanente negativo: <b>1)</b> reducir gastos en la primera sesión · <b>2)</b> operación de crédito del art. 177.5 · <b>3)</b> superávit inicial. Cuenta al Pleno y remisión al Estado y CCAA <b>antes de fin de marzo</b>.</td></tr><tr><th>193 bis</th><td>Dudoso cobro, mínimos: <b>25 %</b> (dos ejercicios anteriores) · <b>50 %</b> (tercero) · <b>75 %</b> (cuarto y quinto) · <b>100 %</b> (restantes).</td></tr></tbody></table><h2 style=\"margin-top:1.2rem\">Calendario de repaso espaciado</h2><table><thead><tr><th>Momento</th><th>Fecha</th><th>Qué hacer</th></tr></thead><tbody id=\"calbody\"></tbody></table></section>";

/* ═══ Mejoras de interacción · Bloque II ═══ */
(function(){
"use strict";
var K_THEME="oposi_bII_theme", K_FS="oposi_bII_fs", K_STREAK="oposi_bII_streak";
function load(k,f){try{var v=localStorage.getItem(k);return v?JSON.parse(v):f;}catch(e){return f;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
var root=document.documentElement;

/* Tema persistente (sobrescribe el toggle simple anterior) */
var saved=load(K_THEME,null);
if(saved){root.setAttribute("data-theme",saved);}
else if(window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches){root.setAttribute("data-theme","dark");}
var bt=document.getElementById("theme");
if(bt)bt.onclick=function(){
  var n=root.getAttribute("data-theme")==="dark"?"light":"dark";
  root.setAttribute("data-theme",n);save(K_THEME,n);
};

/* Tamaño de texto persistente */
var fs=load(K_FS,16);
function setFs(v){fs=Math.max(13,Math.min(22,v));root.style.setProperty("--fs",fs+"px");save(K_FS,fs);}
setFs(fs);
var bp=document.getElementById("fs+"),bm=document.getElementById("fs-");
if(bp)bp.onclick=function(){setFs(fs+1);};
if(bm)bm.onclick=function(){setFs(fs-1);};

(function(){
  var el=document.getElementById("streakN");if(!el)return;
  var hoy=new Date().toISOString().slice(0,10);
  var s=load(K_STREAK,{last:null,n:0});
  if(s.last!==hoy){
    var ayer=new Date(Date.now()-864e5).toISOString().slice(0,10);
    s.n=(s.last===ayer)?s.n+1:1;s.last=hoy;save(K_STREAK,s);
  }
  el.textContent=s.n;
})();

/* Reveal on scroll para las tarjetas */
function reveal(){
  var els=document.querySelectorAll("section.card:not(.rv)");
  if(!els.length)return;
  if(!("IntersectionObserver" in window)){return;}
  var io=new IntersectionObserver(function(es){
    es.forEach(function(en){if(en.isIntersecting){en.target.classList.add("in");io.unobserve(en.target);}});
  },{threshold:.06,rootMargin:"0px 0px -30px 0px"});
  Array.prototype.forEach.call(els,function(el){el.classList.add("rv");io.observe(el);});
}

/* Sección activa en el índice lateral */
function spy(){
  var links=document.querySelectorAll("nav.side a[href^='#']");
  if(!links.length||!("IntersectionObserver" in window))return;
  var map={};
  Array.prototype.forEach.call(links,function(a){
    var t=document.getElementById(a.getAttribute("href").slice(1));
    if(t)map[t.id]=a;
  });
  var io=new IntersectionObserver(function(es){
    es.forEach(function(en){
      if(en.isIntersecting){
        Array.prototype.forEach.call(links,function(a){a.classList.remove("on");});
        if(map[en.target.id])map[en.target.id].classList.add("on");
      }
    });
  },{rootMargin:"-80px 0px -70% 0px",threshold:0});
  Object.keys(map).forEach(function(id){io.observe(document.getElementById(id));});
}

/* Ripple en botones */
document.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b||b.classList.contains("navtoggle"))return;
  var r=b.getBoundingClientRect(),d=Math.max(r.width,r.height),s=document.createElement("span");
  s.className="ripple";s.style.width=s.style.height=d+"px";
  s.style.left=(e.clientX-r.left-d/2)+"px";s.style.top=(e.clientY-r.top-d/2)+"px";
  b.appendChild(s);setTimeout(function(){if(s.parentNode)s.parentNode.removeChild(s);},560);
});

/* Atajos de teclado */
document.addEventListener("keydown",function(e){
  if(e.target.matches("input,textarea"))return;
  if(e.key==="/"){var q=document.getElementById("q");if(q){e.preventDefault();q.focus();}}
  if(e.key==="t"&&bt)bt.click();
});

/* El contenido se inyecta por JS: esperamos a que exista */
function init(){reveal();spy();}
if(document.getElementById("main")&&document.getElementById("main").children.length){init();}
else{setTimeout(init,60);}
addEventListener("load",function(){setTimeout(init,80);});
})();

</script>

    /* 1 ── Cita legal al final */
    var m=body.match(CITA);
    if(m){out.cite=m[1].replace(/\s+/g," ").trim();body=body.slice(0,m.index).trim();}
    body=body.replace(/[.;,\s]+$/,"");

    /* 2 ── Veredicto Sí / No inicial */
    var v=strip(body).match(/^(Sí|Sí,|No|No,)[.:,]?\s/);
    if(v){
      out.verdict=/^Sí/.test(v[1])?"si":"no";
      body=body.replace(/^(<[^>]+>\s*)*(Sí|No)[.,:]?\s*/,"").trim();
      body=body.replace(/^en\s/,"En ");
    }

    /* 3 ── Enumeración con · */
    var parts=body.split(/\s+·\s+/);
    if(parts.length>=2){
      out.kind="list";
      var letras=parts.filter(function(p){return /^\s*<?[a-h]\)/.test(strip(p));}).length;
      out.marker = letras>=parts.length-1 ? "alpha" : "num";
      out.items=parts.map(function(p){
        return p.replace(/^\s*[a-h]\)\s*/,"").replace(/[.\s]+$/,"").trim();
      }).filter(Boolean);
      return out;
    }

    /* 4 ── Cláusulas contrapuestas con ; */
    var semi=body.split(/;\s+/);
    if(semi.length>=2&&semi.length<=3&&semi.every(function(s){return strip(s).length>14;})){
      out.kind="clauses";
      out.items=semi.map(function(s){return s.replace(/[.\s]+$/,"").trim();});
      return out;
    }

    /* 5 ── Párrafo */
    out.text=body;
    return out;
  }

  function render(raw){
    var d=parse(raw),h="";

    if(d.verdict){
      h+='<span class="fc-verdict '+d.verdict+'">'+(d.verdict==="si"?"✓ Sí":"✗ No")+'</span>';
    }

    if(d.kind==="list"){
      h+='<ol class="fc-list '+d.marker+'">';
      d.items.forEach(function(it){h+='<li>'+it+'</li>';});
      h+='</ol>';
    }else if(d.kind==="clauses"){
      h+='<div class="fc-clauses">';
      d.items.forEach(function(it){h+='<p>'+it+'</p>';});
      h+='</div>';
    }else if(d.text){
      h+='<p class="fc-p">'+d.text+'</p>';
    }

    if(d.cite){
      h+='<span class="fc-cite"><span class="s">§</span>'+d.cite+'</span>';
    }
    return {html:h,struct:(d.kind!=="p"||!!d.verdict||strip(raw).length>150)};
  }
  return {parse:parse,render:render};
})();

(function(){

      pleft=ctr.querySelector("#fccount");
  var rot=0;

  function reset(){
    order=CARDS.map(function(_,i){return i;});
    fi=0;ok=0;ko=0;back=false;busy=false;rot=0;
    card.style.transition="none";card.style.transform="rotateY(0deg)";
    void card.offsetWidth;card.style.transition="";
    deck.classList.remove("empty");
    var d=stage.querySelector(".fc-done");if(d)d.remove();
    card.style.display="";

  function bump(el){el.classList.remove("bump");void el.offsetWidth;el.classList.add("bump");}

  function draw(){
    pok.textContent=ok+(ok===1?" sabida":" sabidas");
    pko.textContent=ko+" repasar";
    var done=N-order.length;
    fill.style.width=(N?done/N*100:0)+"%";

    if(!order.length){

      card.style.display="none";

        deck.appendChild(d);
      }
      return;
    }
    if(fi>=order.length)fi=0;
    pleft.textContent=order.length+(order.length===1?" queda":" quedan");

    var c=CARDS[order[fi]];
    front.querySelector(".fc-txt").innerHTML='<p class="fc-p">'+c[0]+'</p>';

  function flip(){
    if(busy||!order.length)return;

  function next(good){
    if(busy||!order.length)return;

    lift.classList.remove("lift");
    lift.classList.add(good?"out-ok":"out-ko");

      if(good){order.splice(fi,1);}
      else{var m=order.splice(fi,1)[0];order.push(m);}

    if(e.key===" "){e.preventDefault();flip();}
    else if(e.key==="ArrowRight"){e.preventDefault();next(true);}
    else if(e.key==="ArrowLeft"){e.preventDefault();next(false);}
  });

  reset();
  return true;
}
if(!boot()){
  var tries=0;
  var iv=setInterval(function(){if(boot()||++tries>40)clearInterval(iv);},120);
  addEventListener("load",function(){setTimeout(boot,100);});
}
})();

/* ═══ Altura adaptativa + índice plegable ═══ */
(function(){
"use strict";

/* ── 1 · Índice lateral plegable ── */
function sidebar(){
  var lay=document.querySelector(".layout"),
      side=document.getElementById("side"),
      tools=document.querySelector(".tools");
  if(!lay||!side||!tools||document.getElementById("navhide"))return;

  var K="oposi_bII_nav";
  function get(){try{return localStorage.getItem(K)==="0";}catch(e){return false;}}
  function set(v){try{localStorage.setItem(K,v?"0":"1");}catch(e){}}

  var b=document.createElement("button");
  b.id="navhide";b.type="button";
  b.innerHTML='<span class="ic">☰</span>';
  b.setAttribute("aria-controls","side");
  tools.insertBefore(b,tools.firstChild);

  function apply(hidden,anim){
    if(!anim)lay.style.transition="none";
    lay.classList.toggle("nonav",hidden);
    side.setAttribute("aria-hidden",String(hidden));
    b.setAttribute("aria-pressed",String(hidden));
    b.title=hidden?"Mostrar índice (i)":"Ocultar índice (i)";
    b.setAttribute("aria-label",b.title);
    if(!anim)requestAnimationFrame(function(){lay.style.transition="";});
  }
  apply(get(),false);

  b.onclick=function(){
    var h=!lay.classList.contains("nonav");
    apply(h,true);set(h);
    window.dispatchEvent(new Event("resize"));
  };
  document.addEventListener("keydown",function(e){
    if(e.target.matches("input,textarea,select"))return;
    if(e.key==="i"||e.key==="I"){e.preventDefault();b.click();}
  });
}

/* ── 2 · La tarjeta se adapta a su contenido ── */
function autofit(){
  var stage=document.querySelector(".fc-stage");
  if(!stage||stage.dataset.fit)return;
  var deck=stage.querySelector(".fc-deck"),
      front=stage.querySelector(".fc-front"),
      back=stage.querySelector(".fc-back");
  if(!deck||!front||!back)return;
  stage.dataset.fit="1";

  var meas=document.createElement("div");
  meas.className="fc-measure";meas.setAttribute("aria-hidden","true");
  meas.innerHTML='<div class="fc-face fc-front"><div class="fc-body"><div class="fc-txt"></div></div></div>';
  stage.appendChild(meas);
  var mFace=meas.querySelector(".fc-face"), mTxt=meas.querySelector(".fc-txt");

  function measure(cls,html){
    mFace.className="fc-face "+cls;
    mTxt.innerHTML=html;
    return mFace.offsetHeight;
  }

  function fit(){
    if(deck.classList.contains("empty")){deck.style.height="230px";return;}
    var fT=front.querySelector(".fc-txt"), bT=back.querySelector(".fc-txt");
    if(!fT||!bT)return;
    var h=Math.max(
      measure("fc-front"+(front.classList.contains("struct")?" struct":""),fT.innerHTML),
      measure("fc-back" +(back .classList.contains("struct")?" struct":""),bT.innerHTML),
      230
    );
    deck.style.height=Math.ceil(h+8)+"px";
  }

  /* recalcular cuando cambia la tarjeta, el tamaño de letra o la ventana */
  new MutationObserver(fit).observe(back,{childList:true,subtree:true,attributes:true,attributeFilter:["class"]});
  var t;
  addEventListener("resize",function(){clearTimeout(t);t=setTimeout(fit,120);},{passive:true});
  ["fs+","fs-"].forEach(function(id){
    var el=document.getElementById(id);
    if(el)el.addEventListener("click",function(){setTimeout(fit,60);});
  });
  fit();setTimeout(fit,250);
}

function go(){sidebar();autofit();}
if(document.readyState!=="loading")go();else document.addEventListener("DOMContentLoaded",go);
addEventListener("load",function(){setTimeout(go,120);});
var n=0,iv=setInterval(function(){go();if(++n>25)clearInterval(iv);},150);
})();

</script>
<script>

/* ═══════════════════════════════════════════════════════════════
   TTS · Lectura en voz alta del texto legal
   ═══════════════════════════════════════════════════════════════ */
(function(){
"use strict";
if(!("speechSynthesis" in window))return;

var K="oposi_bII_tts";
function load(){try{return JSON.parse(localStorage.getItem(K))||{};}catch(e){return {};}}
function save(o){try{localStorage.setItem(K,JSON.stringify(o));}catch(e){}}
var cfg=load();
if(cfg.rate==null)cfg.rate=1;
if(cfg.gen==null)cfg.gen="f";

var synth=window.speechSynthesis, voces=[], actual=null, bloques=[];

/* ─────────── 1 · Selección de voz ─────────── */
function esEspanol(v){return /^es\b|^es[-_]/i.test(v.lang||"")||/spanish|español/i.test(v.name||"");}
function calidad(v){
  var n=(v.name||"")+" "+(v.voiceURI||""), p=0;
  if(/natural|neural/i.test(n))p+=100;
  if(/online/i.test(n))p+=40;
  if(/premium|enhanced|eloquence/i.test(n))p+=35;
  if(/google/i.test(n))p+=30;
  if(v.localService===false)p+=15;
  if(/microsoft/i.test(n))p+=8;
  if(/^es-ES/i.test(v.lang))p+=12;   /* castellano de España primero */
  return p;
}
var MASC=/(pablo|álvaro|alvaro|jorge|diego|juan|raul|raúl|carlos|miguel|lorenzo|gonzalo|dalton|liam|andr[eé]s|luciano|male|hombre|masculin)/i;
var FEM =/(helena|elvira|laura|mónica|monica|paulina|sabina|esperanza|marisol|ximena|dalia|salome|camila|catalina|isidora|female|mujer|femenin)/i;
function genero(v){
  var n=v.name||"";
  if(MASC.test(n))return "m";
  if(FEM.test(n))return "f";
  return "?";
}
function cargarVoces(){
  var all=synth.getVoices()||[];
  voces=all.filter(esEspanol).sort(function(a,b){return calidad(b)-calidad(a);});
  if(!voces.length)voces=all.slice(0,12);
  pintarSelector();
}
function elegir(){
  if(cfg.voz){
    for(var i=0;i<voces.length;i++)if(voces[i].voiceURI===cfg.voz)return voces[i];
  }
  var g=cfg.gen;
  for(var j=0;j<voces.length;j++)if(genero(voces[j])===g)return voces[j];
  return voces[0]||null;
}

/* ─────────── 2 · Naturalidad: expandir lo que el TTS lee mal ─────────── */
var ORD={1:"primera",2:"segunda",3:"tercera",4:"cuarta",5:"quinta",
         6:"sexta",7:"séptima",8:"octava",9:"novena",10:"décima"};
function paraVoz(t){
  return t
    .replace(/\barts?\.\s*/gi,function(m){return /arts/i.test(m)?"artículos ":"artículo ";})
    .replace(/\bapdos?\.\s*/gi,"apartado ")
    .replace(/\bnúms?\.\s*/gi,"número ")
    .replace(/\bpárr\.\s*/gi,"párrafo ")
    .replace(/\bcap\.\s*/gi,"capítulo ")
    .replace(/\bpágs?\.\s*/gi,"página ")
    .replace(/\by\s+ss\./gi,"y siguientes")
    .replace(/\bss\./gi,"siguientes")
    .replace(/\bTRLHL\b/g,"Texto Refundido de la Ley de Haciendas Locales")
    .replace(/\bLCSP\b/g,"Ley de Contratos del Sector Público")
    .replace(/\bLBRL\b/g,"Ley de Bases del Régimen Local")
    .replace(/\bLRJSP\b/g,"Ley de Régimen Jurídico del Sector Público")
    .replace(/\bLPACAP\b/g,"Ley del Procedimiento Administrativo Común")
    .replace(/\bRDLeg\b/gi,"Real Decreto Legislativo")
    .replace(/\bRD\b/g,"Real Decreto")
    .replace(/\bCCAA\b/g,"comunidades autónomas")
    .replace(/\bCA\b/g,"comunidad autónoma")
    .replace(/\bEELL\b/g,"entidades locales")
    .replace(/\bBOE\b/g,"Boletín Oficial del Estado")
    .replace(/\bIVA\b/g,"I.V.A.")
    .replace(/\bSARA\b/g,"sara")
    .replace(/\bDA\s+(\d+)/g,"disposición adicional $1")
    .replace(/\bDT\s+(\d+)/g,"disposición transitoria $1")
    .replace(/(\d+)\.ª/g,function(m,n){return ORD[+n]||(n+"ª");})
    .replace(/(\d+)\.º/g,"$1º")
    /* 3.005,06 → 3005,06 para que lo lea como cifra y no como frase */
    .replace(/(\d)\.(?=\d{3}\b)/g,"$1")
    .replace(/(\d)\.(?=\d{3}\b)/g,"$1")
    .replace(/€/g," euros")
    .replace(/%/g," por ciento")
    .replace(/\bnº\b/gi,"número")
    .replace(/\s*·\s*/g,". ")
    .replace(/\(\s*/g,", ").replace(/\s*\)/g,", ")
    .replace(/\bvid\.\s*/gi,"véase ")
    .replace(/\bcfr\.\s*/gi,"compárese ")
    /* limpieza de puntuación tras las sustituciones */
    .replace(/([.:;!?])(?=[A-ZÁÉÍÓÚÑ¿¡])/g,"$1 ")
    .replace(/\s+([,.;:])/g,"$1")
    .replace(/,\s*([.;:])/g,"$1")
    .replace(/([,.;:])\s*\1+/g,"$1")
    .replace(/,\s*,/g,",")
    .replace(/\s{2,}/g," ")
    .trim();
}

/* ─────────── 3 · Segmentar en frases y envolverlas ─────────── */
var ABBR=/\b(arts?|apdos?|núms?|nums?|págs?|párr|cap|caps|ss|Sr|Sra|Sres|D|Dª|etc|vid|cfr|op|cit|ej|núm|art|fig|tít|secc)\.$/i;
function limites(t){
  var out=[],ini=0;
  for(var i=0;i<t.length;i++){
    var c=t[i];
    if(c!=="."&&c!=="!"&&c!=="?")continue;
    var sig=t[i+1]||" ";
    if(!/[\s"»)]/.test(sig))continue;             /* 3.005 o art.1 → no cortar */
    if(ABBR.test(t.slice(Math.max(0,i-9),i+1)))continue;
    if(/^\s*[0-9º ª]/.test(t.slice(i+1,i+3)))continue;
    if(i+1-ini<40)continue;                        /* frases demasiado cortas */
    out.push(i+1);ini=i+1;
  }
  if(ini<t.length)out.push(t.length);
  return out;
}
function segmentar(root){
  var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:function(n){
    if(!n.nodeValue||!n.nodeValue.trim())return NodeFilter.FILTER_REJECT;
    if(n.parentElement&&n.parentElement.closest(".lbl,.tts-bar"))return NodeFilter.FILTER_REJECT;
    return NodeFilter.FILTER_ACCEPT;
  }});
  var nodos=[];while(w.nextNode())nodos.push(w.currentNode);
  if(!nodos.length)return [];

  var full="";nodos.forEach(function(n){full+=n.nodeValue;});
  var cortes=limites(full), frases=[],ci=0,pos=0;
  cortes.forEach(function(){frases.push({text:"",spans:[]});});

  nodos.forEach(function(node){
    var txt=node.nodeValue, off=0, frag=document.createDocumentFragment();
    while(off<txt.length){
      var fin=cortes[ci]!=null?cortes[ci]-pos:txt.length;
      if(fin>txt.length)fin=txt.length;
      if(fin<=off)fin=txt.length;
      var trozo=txt.slice(off,fin);
      var sp=document.createElement("span");
      sp.className="tts-s";sp.setAttribute("data-s",ci);sp.textContent=trozo;
      frag.appendChild(sp);
      if(frases[ci]){frases[ci].text+=trozo;frases[ci].spans.push(sp);}
      if(pos+fin>=(cortes[ci]||Infinity))ci++;
      off=fin;
    }
    pos+=txt.length;
    node.parentNode.replaceChild(frag,node);
  });
  return frases.filter(function(f){return f.text.trim().length>1;});
}

/* ─────────── 4 · Reproductor ─────────── */
var mini,miniBar,miniLbl,miniPlay;
function crearMini(){
  mini=document.createElement("div");
  mini.className="tts-mini noprint";
  mini.innerHTML='<span class="lbl"></span>'
    +'<button class="main" data-a="play" title="Pausar o reanudar">⏸</button>'
    +'<span class="bar"><i></i></span>'
    +'<button data-a="prev" title="Frase anterior">↺</button>'
    +'<button data-a="stop" title="Detener">■</button>'
    +'<button data-a="cfg" title="Ajustes de voz">⚙</button>';
  document.body.appendChild(mini);
  miniBar=mini.querySelector(".bar i");miniLbl=mini.querySelector(".lbl");
  miniPlay=mini.querySelector('[data-a="play"]');
  mini.addEventListener("click",function(e){
    var b=e.target.closest("button");if(!b)return;
    var a=b.getAttribute("data-a");
    if(a==="play")pausarReanudar();
    else if(a==="stop")parar();
    else if(a==="prev"){if(actual){actual.i=Math.max(0,actual.i-2);siguiente();}}
    else if(a==="cfg")abrirPanel();
  });
}

function limpiarMarcas(){
  document.querySelectorAll(".tts-s.now").forEach(function(s){s.classList.remove("now");});
}
function parar(){
  synth.cancel();
  if(actual){
    actual.bloque.classList.remove("tts-on");
    var b=actual.bloque.querySelector(".tts-play");
    if(b){b.classList.remove("on");b.innerHTML=iconoPlay();}
  }
  limpiarMarcas();
  actual=null;
  if(mini)mini.classList.remove("show");
}
function iconoPlay(){return '<span aria-hidden="true">▶</span> Escuchar';}
function iconoOn(){return '<span class="tts-wave" aria-hidden="true"><i></i><i></i><i></i><i></i></span> Leyendo';}

function pausarReanudar(){
  if(!actual)return;
  if(synth.paused){synth.resume();miniPlay.textContent="⏸";}
  else{synth.pause();miniPlay.textContent="▶";}
}

function leer(bloque){
  if(actual&&actual.bloque===bloque){parar();return;}
  parar();
  var datos=bloque.__tts;
  if(!datos||!datos.length)return;
  var voz=elegir();
  actual={bloque:bloque,frases:datos,i:0,voz:voz};
  bloque.classList.add("tts-on");
  var b=bloque.querySelector(".tts-play");
  if(b){b.classList.add("on");b.innerHTML=iconoOn();}
  if(!mini)crearMini();
  var art=bloque.closest(".art");
  var t=art?art.querySelector("h2 .num"):null;
  var sufijo=bloque.__label?" · "+bloque.__label:"";
  miniLbl.textContent=(t?t.textContent:"")+sufijo||"Lectura";
  miniLbl.title=miniLbl.textContent;
  miniPlay.textContent="⏸";
  mini.classList.add("show");
  siguiente();
}

function siguiente(){
  if(!actual)return;
  limpiarMarcas();
  if(actual.i>=actual.frases.length){
    var fin=actual.bloque;
    parar();
    fin.dispatchEvent(new CustomEvent("tts:fin",{bubbles:true}));
    return;
  }
  var f=actual.frases[actual.i];
  var texto=paraVoz(f.text);
  if(!texto||texto.length<2){actual.i++;siguiente();return;}

  f.spans.forEach(function(s){s.classList.add("now");});
  if(f.spans[0]&&actual.i>0){
    var r=f.spans[0].getBoundingClientRect();
    if(r.top<70||r.bottom>innerHeight-90)
      f.spans[0].scrollIntoView({block:"center",behavior:"smooth"});
  }
  miniBar.style.width=((actual.i+1)/actual.frases.length*100)+"%";

  var u=new SpeechSynthesisUtterance(texto);
  if(actual.voz){u.voice=actual.voz;u.lang=actual.voz.lang;}else{u.lang="es-ES";}
  u.rate=cfg.rate;u.pitch=cfg.pitch||1;u.volume=1;
  u.onend=function(){if(actual){actual.i++;setTimeout(siguiente,90);}};
  u.onerror=function(e){
    if(e&&e.error==="interrupted")return;
    if(actual){actual.i++;setTimeout(siguiente,120);}
  };
  actual.u=u;
  synth.speak(u);
}

/* Chrome detiene la síntesis larga: lo mantenemos vivo */
setInterval(function(){
  if(actual&&synth.speaking&&!synth.paused){synth.pause();synth.resume();}
},9000);

/* ─────────── 5 · Panel de ajustes ─────────── */
var back,sel;
function crearPanel(){
  back=document.createElement("div");
  back.className="tts-back noprint";
  back.innerHTML=
   '<div class="tts-panel" role="dialog" aria-modal="true" aria-label="Ajustes de voz">'
   +'<h3>🔊 Lectura en voz alta</h3>'
   +'<p class="sub">Ajusta cómo se lee el texto legal. Se recuerda para todos los bloques.</p>'
   +'<div class="tts-row"><label>Tipo de voz</label>'
     +'<div class="tts-seg" id="ttsGen">'
       +'<button data-g="f">👩 Femenina</button>'
       +'<button data-g="m">👨 Masculina</button>'
     +'</div></div>'
   +'<div class="tts-row"><label>Voz concreta</label><select id="ttsVoz"></select></div>'
   +'<div class="tts-row"><label>Velocidad</label>'
     +'<div class="tts-slider"><input type="range" id="ttsRate" min="0.6" max="1.6" step="0.05">'
     +'<span class="tts-val" id="ttsRateV"></span></div></div>'
   +'<div class="tts-row"><label>Tono</label>'
     +'<div class="tts-slider"><input type="range" id="ttsPitch" min="0.7" max="1.3" step="0.05">'
     +'<span class="tts-val" id="ttsPitchV"></span></div></div>'
   +'<p class="tts-note" id="ttsNota"></p>'
   +'<div class="tts-acts">'
     +'<button id="ttsTest">▶ Probar</button>'
     +'<button class="prim" id="ttsOk">Hecho</button>'
   +'</div></div>';
  document.body.appendChild(back);
  sel=back.querySelector("#ttsVoz");

  back.addEventListener("click",function(e){if(e.target===back)cerrarPanel();});
  back.querySelector("#ttsOk").onclick=cerrarPanel;
  back.querySelector("#ttsGen").addEventListener("click",function(e){
    var b=e.target.closest("button[data-g]");if(!b)return;
    cfg.gen=b.getAttribute("data-g");cfg.voz=null;save(cfg);pintarSelector();probar();
  });
  sel.onchange=function(){cfg.voz=sel.value;save(cfg);probar();};
  var r=back.querySelector("#ttsRate"),rv=back.querySelector("#ttsRateV");
  r.value=cfg.rate;rv.textContent=(+cfg.rate).toFixed(2)+"×";
  r.oninput=function(){cfg.rate=+r.value;rv.textContent=cfg.rate.toFixed(2)+"×";save(cfg);};
  r.onchange=probar;
  var p=back.querySelector("#ttsPitch"),pv=back.querySelector("#ttsPitchV");
  p.value=cfg.pitch||1;pv.textContent=(+(cfg.pitch||1)).toFixed(2);
  p.oninput=function(){cfg.pitch=+p.value;pv.textContent=cfg.pitch.toFixed(2);save(cfg);};
  p.onchange=probar;
  back.querySelector("#ttsTest").onclick=probar;
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"&&back.classList.contains("show"))cerrarPanel();
  });
}
function probar(){
  synth.cancel();
  var v=elegir();
  var u=new SpeechSynthesisUtterance("El presupuesto general de la entidad local se aprueba antes del 31 de diciembre.");
  if(v){u.voice=v;u.lang=v.lang;}else u.lang="es-ES";
  u.rate=cfg.rate;u.pitch=cfg.pitch||1;
  synth.speak(u);
}
function pintarSelector(){
  if(!sel)return;
  var g=cfg.gen;
  back.querySelectorAll("#ttsGen button").forEach(function(b){
    b.setAttribute("aria-pressed",String(b.getAttribute("data-g")===g));
  });
  var pref=voces.filter(function(v){return genero(v)===g;});
  var otras=voces.filter(function(v){return genero(v)!==g;});
  function opt(v){
    var nat=/natural|neural|online|premium|enhanced|google/i.test(v.name)?" ★":"";
    return '<option value="'+v.voiceURI+'">'+v.name+nat+"</option>";
  }
  sel.innerHTML=(pref.length?'<optgroup label="'+(g==="f"?"Femeninas":"Masculinas")+'">'+pref.map(opt).join("")+"</optgroup>":"")
    +(otras.length?'<optgroup label="Otras voces en español">'+otras.map(opt).join("")+"</optgroup>":"");
  var v=elegir();
  if(v)sel.value=v.voiceURI;

  var nota=back.querySelector("#ttsNota");
  var hayNat=voces.some(function(x){return /natural|neural|online/i.test(x.name);});
  if(!voces.length){
    nota.innerHTML="⚠️ No se han detectado voces en español en este navegador. Prueba con Microsoft Edge o Chrome.";
  }else if(hayNat){
    nota.innerHTML="✅ Tienes voces <b>neuronales</b> disponibles (marcadas con ★): son las que suenan más humanas.";
  }else{
    nota.innerHTML="💡 Las voces marcadas con ★ suenan mejor. Para conseguir voces <b>neuronales</b> (mucho más naturales), "
      +"abre estas páginas en <b>Microsoft Edge</b>, o instálalas en Windows: <b>Configuración → Hora e idioma → Voz → Agregar voces</b>.";
  }
}
function abrirPanel(){if(!back)crearPanel();pintarSelector();back.classList.add("show");}
function cerrarPanel(){if(back)back.classList.remove("show");synth.cancel();}

/* ─────────── 6 · Inyectar los controles en cada apartado ─────────── */
/* Se excluyen a propósito tres apartados: conexiones con otros preceptos,
   trampas y errores frecuentes, y anclaje memorístico. */
var TTS_EXCLUIR=/(conexion|conexiones|trampas|anclaje)/i;

function ttsBarra(frases,compacta){
  var bar=document.createElement("div");
  bar.className="tts-bar noprint"+(compacta?" mini":"");
  bar.innerHTML='<button class="tts-play" type="button">'+iconoPlay()+"</button>"
    +(compacta?"":'<button class="tts-cfg" type="button" title="Ajustes de voz">⚙ Voz</button>')
    +'<span class="tts-time">'+frases.length+(frases.length===1?" frase":" frases")+"</span>";
  return bar;
}

function ttsPreparar(bl,opts){
  if(bl.getAttribute("data-tts"))return false;
  bl.setAttribute("data-tts","1");
  var frases=segmentar(bl);
  bl.__tts=frases;
  if(!frases.length||bl.textContent.trim().length<40)return false;
  bl.__label=opts.label||"";
  var bar=ttsBarra(frases,opts.compacta);
  if(opts.tras){
    var ref=bl.querySelector(opts.tras);
    if(ref&&ref.nextSibling)bl.insertBefore(bar,ref.nextSibling);
    else bl.insertBefore(bar,bl.firstChild);
  }else if(opts.alFinal){
    bl.appendChild(bar);
  }else{
    bl.insertBefore(bar,bl.firstChild);
  }
  bar.querySelector(".tts-play").onclick=function(e){e.stopPropagation();leer(bl);};
  var cfg=bar.querySelector(".tts-cfg");
  if(cfg)cfg.onclick=function(e){e.stopPropagation();abrirPanel();};
  return true;
}

function montar(){
  var hay=false;
  if(!back)crearPanel();

  /* 6a · Texto legal literal */
  Array.prototype.forEach.call(document.querySelectorAll(".legal:not([data-tts])"),function(bl){
    hay=ttsPreparar(bl,{tras:".lbl",label:"Texto legal"})||hay;
  });

  /* 6b · Idea clave */
  Array.prototype.forEach.call(document.querySelectorAll(".idea:not([data-tts])"),function(bl){
    hay=ttsPreparar(bl,{compacta:true,alFinal:true,label:"Idea clave"})||hay;
  });

  /* 6c · Apartados desplegables, salvo los tres excluidos */
  Array.prototype.forEach.call(document.querySelectorAll("details.panel"),function(p){
    var sum=p.querySelector("summary");
    var body=p.querySelector(".body");
    if(!sum||!body||body.getAttribute("data-tts"))return;
    var t=sum.textContent||"";
    if(TTS_EXCLUIR.test(t)){body.setAttribute("data-tts","skip");return;}
    hay=ttsPreparar(body,{compacta:true,label:t.replace(/[^\wáéíóúüñÁÉÍÓÚÜÑ\s·¿?¡!]/g,"").trim()})||hay;
  });

  /* 6d · Resumen e introducción del bloque */
  ["#resumen","#intro"].forEach(function(sel){
    var sec=document.querySelector(sel);
    if(!sec||sec.getAttribute("data-tts"))return;
    var h=sec.querySelector("h2");
    hay=ttsPreparar(sec,{tras:"h2",label:h?h.textContent:"Resumen"})||hay;
  });

  return hay;
}

/* ─────────── 7 · Arranque ─────────── */
cargarVoces();
if(typeof synth.onvoiceschanged!=="undefined")synth.onvoiceschanged=cargarVoces;
setTimeout(cargarVoces,400);setTimeout(cargarVoces,1400);

var n=0,iv=setInterval(function(){if(montar()||++n>40)clearInterval(iv);},150);
addEventListener("load",function(){setTimeout(montar,200);});
addEventListener("beforeunload",function(){synth.cancel();});
document.addEventListener("keydown",function(e){
  if(e.target.matches("input,textarea,select"))return;
  if(e.key==="Escape"&&actual)parar();
});
})();

</script>
<script>

/* ═══════════════════════════════════════════════════════════════
   AUTOAJUSTE DE DIAGRAMAS SVG
   · El texto que desborda su rectángulo se reparte en líneas.
   · Las filas siguientes se empujan hacia abajo y el rectángulo crece,
     de modo que ninguna línea nueva pise al texto de debajo.
   · Si no hay espacio libre bajo el rectángulo, en lugar de repartir
     se reduce la fuente: nunca se invade el elemento contiguo.
   · Las etiquetas sueltas reciben halo y se pintan sobre las flechas.
   Todas las medidas se toman del elemento ya renderizado.
   ═══════════════════════════════════════════════════════════════ */
(function(){
"use strict";
var NS="http://www.w3.org/2000/svg";
var PAD_X=9, PAD_Y=7, FS_MIN=6.5, MAX_LINEAS=4, INTER=1.16, SEP_MIN=5;

function num(el,a,d){var v=parseFloat(el.getAttribute(a));return isNaN(v)?(d||0):v;}
function ancho(t){try{if(t.getComputedTextLength)return t.getComputedTextLength();}catch(e){}return 0;}
function fs(t){
  var v=parseFloat(t.getAttribute("font-size"));
  if(!isNaN(v))return v;
  try{v=parseFloat(getComputedStyle(t).fontSize);if(!isNaN(v)&&v>0)return v;}catch(e){}
  return 10;
}
function partir(txt,cpp,maxW,n){
  if(txt.length*cpp<=maxW)return [txt];
  var seps=[" · "," — "," – ",", "," "],s,i,k;
  for(s=0;s<seps.length;s++){
    var tr=txt.split(seps[s]);
    if(tr.length<2)continue;
    var lin=[],act="";
    for(i=0;i<tr.length;i++){
      var cand=act?act+seps[s]+tr[i]:tr[i];
      if(act&&cand.length*cpp>maxW){lin.push(act);act=tr[i];}
      else act=cand;
    }
    if(act)lin.push(act);
    var caben=true;
    for(k=0;k<lin.length;k++)if(lin[k].length*cpp>maxW)caben=false;
    if(caben&&lin.length<=n)return lin;
  }
  return null;
}
function pintar(t,lin,size){
  while(t.firstChild)t.removeChild(t.firstChild);
  var x=t.getAttribute("x");
  for(var i=0;i<lin.length;i++){
    var ts=document.createElementNS(NS,"tspan");
    ts.setAttribute("x",x);
    if(i)ts.setAttribute("dy",(size*INTER).toFixed(1));
    ts.textContent=lin[i];
    t.appendChild(ts);
  }
}
function encajar(t,cpp,maxW){
  var sp=t.getElementsByTagName("tspan"),i;
  if(sp.length){
    for(i=0;i<sp.length;i++)
      if(sp[i].textContent.length*cpp>maxW+.5){
        sp[i].setAttribute("textLength",maxW.toFixed(1));
        sp[i].setAttribute("lengthAdjust","spacingAndGlyphs");
      }
  }else if((t.textContent||"").length*cpp>maxW+.5){
    t.setAttribute("textLength",maxW.toFixed(1));
    t.setAttribute("lengthAdjust","spacingAndGlyphs");
  }
}
/* reduce la fuente hasta que el texto quepa en una sola línea */
function encoger(t,txt,cpp,size,maxW){
  var s2=size,c2=cpp;
  while(s2>FS_MIN&&txt.length*c2>maxW){s2-=.5;c2=cpp*(s2/size);}
  t.setAttribute("font-size",s2.toFixed(1));
  encajar(t,c2,maxW);
  return s2;
}

function ajustar(svg){
  var rects=[],texts=[],i;
  var rl=svg.querySelectorAll("rect"),tl=svg.querySelectorAll("text");
  for(i=0;i<rl.length;i++)if(!rl[i].hasAttribute("data-halo"))rects.push(rl[i]);
  for(i=0;i<tl.length;i++)texts.push(tl[i]);
  if(!texts.length)return true;
  var medible=false;
  for(i=0;i<texts.length;i++)
    if((texts[i].textContent||"").trim()&&ancho(texts[i])>0){medible=true;break;}
  if(!medible)return false;

  var porRect=[],sueltos=[];
  function grupo(r){
    for(var j=0;j<porRect.length;j++)if(porRect[j].r===r)return porRect[j];
    var g={r:r,lista:[]};porRect.push(g);return g;
  }
  texts.forEach(function(t){
    if(t.getAttribute("data-fit"))return;
    var x=num(t,"x"),y=num(t,"y"),host=null,area=Infinity;
    rects.forEach(function(r){
      var rx=num(r,"x"),ry=num(r,"y"),rw=num(r,"width"),rh=num(r,"height");
      if(!rw||!rh)return;
      if(x>=rx-1&&x<=rx+rw+1&&y>=ry-1&&y<=ry+rh+1&&rw*rh<area){host=r;area=rw*rh;}
    });
    if(host)grupo(host).lista.push(t); else sueltos.push(t);
  });

  /* espacio libre bajo un rectángulo, hasta el siguiente elemento que le estorbe */
  function hueco(r){
    var rx=num(r,"x"),ry=num(r,"y"),rw=num(r,"width"),rh=num(r,"height");
    var abajo=ry+rh, libre=Infinity;
    rects.forEach(function(o){
      if(o===r)return;
      var ox=num(o,"x"),oy=num(o,"y"),ow=num(o,"width");
      if(oy>=abajo-1&&ox<rx+rw&&ox+ow>rx)libre=Math.min(libre,oy-abajo-SEP_MIN);
    });
    texts.forEach(function(t){
      var tx=num(t,"x"),ty=num(t,"y");
      if(ty>abajo&&tx>rx-40&&tx<rx+rw+40)
        libre=Math.min(libre,ty-fs(t)-abajo-SEP_MIN);
    });
    var vb=(svg.getAttribute("viewBox")||"").split(/[\s,]+/);
    if(vb.length===4)libre=Math.min(libre,parseFloat(vb[1])+parseFloat(vb[3])-abajo-2);
    return Math.max(0,libre);
  }

  /* ─── 1 · Texto dentro de un rectángulo ─── */
  porRect.forEach(function(g){
    var r=g.r, rx=num(r,"x"), ry=num(r,"y"), rw=num(r,"width"), rh=num(r,"height");
    var maxW=rw-PAD_X*2;
    if(maxW<20)return;
    g.lista.forEach(function(t){t.setAttribute("data-fit","1");});
    g.lista.sort(function(a,b){return num(a,"y")-num(b,"y");});

    /* filas: textos a la misma altura */
    var filas=[],act=null;
    g.lista.forEach(function(t){
      var y=num(t,"y");
      if(!act||Math.abs(y-act.y)>3){act={y:y,ts:[]};filas.push(act);}
      act.ts.push(t);
    });

    /* — plan: qué haría falta — */
    var total=0;
    filas.forEach(function(fl){
      fl.extra=0;fl.plan=[];
      fl.ts.forEach(function(t){
        var txt=(t.textContent||"").replace(/\s+/g," ").trim();
        var w=ancho(t);
        if(!txt||!w||w<=maxW){fl.plan.push(null);return;}
        var size=fs(t), cpp=w/txt.length;
        var lin=partir(txt,cpp,maxW,MAX_LINEAS);
        if(lin&&lin.length>1){
          fl.plan.push({t:t,lin:lin,size:size,cpp:cpp,txt:txt});
          fl.extra=Math.max(fl.extra,(lin.length-1)*size*INTER);
        }else fl.plan.push({t:t,lin:null,size:size,cpp:cpp,txt:txt});
      });
      total+=fl.extra;
    });

    /* — ¿cabe ese crecimiento? — */
    var ultima=filas[filas.length-1];
    var colchon=Math.max(0,(ry+rh)-ultima.y-PAD_Y);
    var crecer=Math.max(0,total-colchon);
    var libre=hueco(r);
    var reparte=crecer<=libre;

    var desp=0;
    filas.forEach(function(fl){
      if(desp>0)fl.ts.forEach(function(t){t.setAttribute("y",(num(t,"y")+desp).toFixed(1));});
      fl.plan.forEach(function(p){
        if(!p)return;
        if(p.lin&&reparte){pintar(p.t,p.lin,p.size);encajar(p.t,p.cpp,maxW);}
        else encoger(p.t,p.txt,p.cpp,p.size,maxW);
      });
      if(reparte)desp+=fl.extra;
    });

    if(reparte&&crecer>0)r.setAttribute("height",(rh+crecer).toFixed(1));

    /* comprobación final: ninguna línea puede sobresalir del rectángulo */
    var rh2=num(r,"height"), bajo=ry, i2;
    g.lista.forEach(function(t){
      var size=fs(t), y=num(t,"y"), sp=t.getElementsByTagName("tspan");
      if(sp.length){for(i2=0;i2<sp.length;i2++){
        if(i2)y+=parseFloat(sp[i2].getAttribute("dy"))||0;
        bajo=Math.max(bajo,y+size*0.3);}}
      else bajo=Math.max(bajo,y+size*0.3);
    });
    if(bajo>ry+rh2-1){
      var falta=bajo-(ry+rh2)+3;
      if(falta<=hueco(r))r.setAttribute("height",(rh2+falta).toFixed(1));
      else g.lista.forEach(function(t){
        var txt=(t.textContent||"").replace(/\s+/g," ").trim(), w=ancho(t);
        if(txt&&w)encoger(t,txt,w/txt.length,fs(t),maxW);
      });
    }
  });

  /* ─── 2 · Etiquetas sueltas ─── */
  sueltos.forEach(function(t){
    t.setAttribute("data-fit","1");
    var txt=(t.textContent||"").replace(/\s+/g," ").trim();
    if(!txt)return;
    var w=ancho(t); if(!w)return;
    var size=fs(t), x=num(t,"x"), y=num(t,"y");
    var an=t.getAttribute("text-anchor")||"start";
    var x0=an==="middle"?x-w/2:an==="end"?x-w:x;
    var halo=document.createElementNS(NS,"rect");
    halo.setAttribute("data-halo","1");
    halo.setAttribute("x",(x0-5).toFixed(1));
    halo.setAttribute("y",(y-size*0.92).toFixed(1));
    halo.setAttribute("width",(w+10).toFixed(1));
    halo.setAttribute("height",(size*1.28).toFixed(1));
    halo.setAttribute("rx","4");
    halo.setAttribute("fill","var(--surface)");
    halo.setAttribute("opacity",".93");
    var p=t.parentNode;
    p.appendChild(halo);p.appendChild(t);
  });
  return true;
}

function pasada(){
  var l=document.querySelectorAll("svg:not([data-fit])"),i;
  for(i=0;i<l.length;i++){try{if(ajustar(l[i]))l[i].setAttribute("data-fit","1");}catch(e){}}
}
if(document.readyState!=="loading")requestAnimationFrame(pasada);
else document.addEventListener("DOMContentLoaded",function(){requestAnimationFrame(pasada);});

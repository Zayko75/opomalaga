<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>TRLHL · Arts. 194-207 · Tesorería y contabilidad</title>
<style>

/* ═══════════════════════════════════════════════════════════════
   SISTEMA DE DISEÑO · "Académico Gamificado" · Bloque II
   Temas 8, 9 y 10 · Auxiliar Administrativo
   ═══════════════════════════════════════════════════════════════ */
:root{
  --fs:16px;

  --bg:#faf9f7;
  --bg-grad:radial-gradient(1100px 560px at 12% -8%, #ede9ff 0%, transparent 55%),
            radial-gradient(850px 460px at 96% 0%, #dcf5ee 0%, transparent 50%);
  --surface:#ffffff;
  --surface-2:#f4f3f0;
  --surface-3:#eceae5;
  --line:#e6e3dc;
  --line-strong:#d4d0c7;

  --ink:#15161c;
  --ink-2:#5d616e;
  --ink-3:#8b8f9c;

  --brand:#5b3df5;
  --brand-2:#7c5cff;
  --brand-soft:#efeaff;
  --brand-ring:rgba(91,61,245,.18);

  --legal:#4338ca;  --legal-bg:#eeecff;
  --ej:#059669;     --ej-bg:#e4f7f0;
  --warn:#c2690a;   --warn-bg:#fdf1de;
  --exc:#dc2626;    --exc-bg:#ffeceb;

  --ok:#16a34a; --ok-soft:#e7f7ec;
  --mid:#eab308; --mid-soft:#fdf6dd;
  --off:#a1a1aa; --off-soft:#f1f1f3;

  --sh-1:0 1px 2px rgba(20,20,30,.04), 0 2px 8px rgba(20,20,30,.04);
  --sh-2:0 2px 6px rgba(20,20,30,.05), 0 12px 28px rgba(20,20,30,.07);
  --sh-3:0 8px 20px rgba(91,61,245,.13), 0 24px 56px rgba(20,20,30,.10);
  --sh-glow:0 0 0 4px var(--brand-ring);

  --r-sm:9px; --r-md:14px; --r-lg:20px; --r-full:999px;

  --f-display:"Segoe UI Variable Display",system-ui,-apple-system,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-legal:ui-serif,Georgia,Cambria,"Times New Roman",serif;
  --f-mono:ui-monospace,"SF Mono","Cascadia Mono","Segoe UI Mono",Menlo,monospace;

  --t-h1:clamp(1.02rem,.95rem + .3vw,1.2rem);
  --t-h2:clamp(1.2rem,1.05rem + .6vw,1.55rem);
  --t-h3:clamp(1rem,.95rem + .25vw,1.12rem);
  --t-sm:.86rem;
  --t-xs:.75rem;

  --e-out:cubic-bezier(.22,1,.36,1);
  --e-spring:cubic-bezier(.34,1.56,.64,1);

  /* ── Compatibilidad con SVG y contenido generado ── */
  --panel:var(--surface);
  --ink2:var(--ink-2);
  --acc:var(--brand);
  --acc-soft:var(--brand-soft);
  --g:var(--ok); --y:var(--mid); --r:var(--exc);
}

html[data-theme="dark"]{
  --bg:#0a0b0f;
  --bg-grad:radial-gradient(1100px 560px at 12% -8%, #1c1740 0%, transparent 55%),
            radial-gradient(850px 460px at 96% 0%, #08302b 0%, transparent 50%);
  --surface:#13151b;
  --surface-2:#1a1d25;
  --surface-3:#232733;
  --line:#262a34;
  --line-strong:#343947;

  --ink:#eceef4;
  --ink-2:#9ba2b3;
  --ink-3:#6e7585;

  --brand:#8b6dff;
  --brand-2:#a78bff;
  --brand-soft:#1e1a3d;
  --brand-ring:rgba(139,109,255,.22);

  --legal:#a5b4fc; --legal-bg:#191b3a;
  --ej:#34d399;    --ej-bg:#0c2a24;
  --warn:#fbbf24;  --warn-bg:#2e2110;
  --exc:#fb7185;   --exc-bg:#331119;

  --ok:#4ade80; --ok-soft:#0e2a19;
  --mid:#facc15; --mid-soft:#2c2610;
  --off:#5b6070; --off-soft:#1c1f27;

  --sh-1:0 1px 2px rgba(0,0,0,.3), 0 2px 8px rgba(0,0,0,.25);
  --sh-2:0 2px 6px rgba(0,0,0,.35), 0 12px 28px rgba(0,0,0,.4);
  --sh-3:0 8px 20px rgba(139,109,255,.2), 0 24px 56px rgba(0,0,0,.5);
}

*,*::before,*::after{box-sizing:border-box}
html{font-size:var(--fs);scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);background-image:var(--bg-grad);
  background-attachment:fixed;background-repeat:no-repeat;
  color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.68;
  -webkit-font-smoothing:antialiased;
  transition:background-color .5s var(--e-out),color .3s;
}
::selection{background:var(--brand);color:#fff}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{font-family:var(--f-display);letter-spacing:-.022em;line-height:1.2}
.num{font-variant-numeric:tabular-nums}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:99px;border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3)}

/* ═══ HEADER ═══ */
header.top{
  position:sticky;top:0;z-index:60;
  background:color-mix(in srgb,var(--surface) 80%,transparent);
  backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);
  border-bottom:1px solid var(--line);
}
.top-in{max-width:1280px;margin:0 auto;padding:.65rem 1.1rem;display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.brandwrap{display:flex;align-items:center;gap:.65rem;min-width:0;flex:1}
.mark{
  width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;
  font-weight:800;font-size:.8rem;letter-spacing:-.02em;text-decoration:none;
  box-shadow:0 4px 14px var(--brand-ring);
  transition:transform .3s var(--e-spring),box-shadow .3s;
}
.mark:hover{transform:rotate(-8deg) scale(1.08);box-shadow:var(--sh-3);text-decoration:none}
.top h1{font-size:var(--t-h1);margin:0;font-weight:800;line-height:1.25;min-width:0}
.top h1 .sub{display:block;font-size:var(--t-xs);color:var(--ink-2);font-weight:500;letter-spacing:0;
  margin-top:.1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tools{margin-left:auto;display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}

button,select,input[type=search]{
  font:inherit;font-size:var(--t-sm);font-weight:600;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:var(--r-sm);padding:.4rem .72rem;cursor:pointer;
  position:relative;overflow:hidden;
  transition:transform .18s var(--e-spring),border-color .2s,background .2s,box-shadow .2s,color .2s;
}
button:hover{transform:translateY(-1.5px);border-color:var(--brand);box-shadow:var(--sh-1)}
button:active{transform:translateY(0) scale(.97)}
button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible{outline:none;box-shadow:var(--sh-glow)}
input[type=search]{min-width:190px;cursor:text;font-weight:500}
input[type=search]:focus{border-color:var(--brand)}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--surface-2);padding:2px;gap:2px}
.seg button{border:0;border-radius:calc(var(--r-sm) - 2px);padding:.32rem .68rem;background:transparent;box-shadow:none}
.seg button:hover{transform:none;background:var(--surface)}
.seg button[aria-pressed="true"]{background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;box-shadow:0 2px 8px var(--brand-ring)}

.ripple{position:absolute;border-radius:50%;transform:scale(0);background:currentColor;opacity:.25;animation:rip .55s linear;pointer-events:none}
@keyframes rip{to{transform:scale(3.4);opacity:0}}

.progress{position:absolute;left:0;bottom:-1px;height:2.5px;width:0;
  background:linear-gradient(90deg,var(--brand),var(--legal),var(--ej));transition:width .1s linear}

/* ═══ LAYOUT ═══ */
.layout{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:270px 1fr;gap:1.8rem;padding:1.4rem 1.1rem 5rem}
main{min-width:0}

/* ═══ SIDEBAR ═══ */
nav.side{
  position:sticky;top:76px;align-self:start;max-height:calc(100vh - 96px);overflow:auto;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:.85rem;box-shadow:var(--sh-1);
}
nav.side h2{font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);
  margin:.5rem .4rem .5rem;font-weight:800}
nav.side h2:first-child{margin-top:.1rem}
nav.side a{
  display:flex;align-items:baseline;gap:.5rem;padding:.36rem .55rem;border-radius:var(--r-sm);
  text-decoration:none;color:var(--ink-2);font-size:var(--t-sm);font-weight:500;
  position:relative;transition:background .22s,color .22s,transform .22s var(--e-out);
}
nav.side a:hover{background:var(--surface-2);color:var(--ink);transform:translateX(3px);text-decoration:none}
nav.side a.on{background:var(--brand-soft);color:var(--brand);font-weight:700}
nav.side a.on::before{content:"";position:absolute;left:-.85rem;top:20%;bottom:20%;width:3px;
  border-radius:0 3px 3px 0;background:var(--brand)}
nav.side a b{color:var(--ink-3);font-weight:800;font-size:var(--t-xs);font-variant-numeric:tabular-nums;flex:none;min-width:1.9em}
nav.side a.on b{color:var(--brand)}
.navtoggle{display:none}

/* ═══ TARJETAS ═══ */
section.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:1.35rem 1.5rem;margin-bottom:1.1rem;box-shadow:var(--sh-1);
  transition:box-shadow .3s var(--e-out),border-color .3s;
}
section.card:hover{box-shadow:var(--sh-2)}
section.card>h2{
  margin:0 0 1rem;font-size:var(--t-h2);font-weight:800;
  display:flex;align-items:center;gap:.6rem;
}
section.card>h2::before{
  content:"";width:4px;height:1.05em;border-radius:99px;flex:none;
  background:linear-gradient(180deg,var(--brand),var(--brand-2));
}

/* ═══ ARTÍCULO ═══ */
.art{scroll-margin-top:86px;padding-top:.4rem}
.art + .art{margin-top:1.6rem;padding-top:1.6rem;border-top:1px dashed var(--line)}
.art h2{display:flex;flex-wrap:wrap;gap:.5rem;align-items:baseline;font-size:var(--t-h3);
  margin:0 0 .25rem;font-weight:800;letter-spacing:-.015em}
.art h2 .num{
  color:var(--brand);font-weight:800;font-family:var(--f-display);
  background:var(--brand-soft);padding:.1rem .5rem;border-radius:var(--r-sm);
  font-size:.92em;letter-spacing:-.02em;
}
.ubic{font-size:var(--t-xs);color:var(--ink-3);margin:0 0 .8rem;font-weight:600;
  letter-spacing:.03em;text-transform:uppercase}

/* ═══ IDEA CLAVE ═══ */
.idea{
  background:linear-gradient(100deg,var(--brand-soft),color-mix(in srgb,var(--brand-soft) 40%,transparent));
  border-left:4px solid var(--brand);border-radius:0 var(--r-md) var(--r-md) 0;
  padding:.75rem 1rem;font-weight:650;margin:.7rem 0 1rem;position:relative;
  font-size:.97rem;line-height:1.55;
}

/* ═══ ACORDEÓN ═══ */
details.panel{
  border:1px solid var(--line);border-radius:var(--r-md);margin:.6rem 0;
  background:var(--surface);overflow:hidden;
  transition:border-color .25s,box-shadow .25s,background .25s;
}
details.panel:hover{border-color:var(--line-strong)}
details.panel[open]{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-ring)}
details.panel>summary{
  cursor:pointer;padding:.62rem .9rem;font-weight:700;font-size:.93rem;
  list-style:none;display:flex;align-items:center;gap:.55rem;
  transition:background .2s,color .2s;
}
details.panel>summary:hover{background:var(--surface-2)}
details.panel[open]>summary{background:var(--brand-soft);color:var(--brand)}
details.panel>summary::-webkit-details-marker{display:none}
details.panel>summary::before{
  content:"";width:16px;height:16px;flex:none;border-radius:5px;
  background:var(--brand-soft);position:relative;transition:transform .3s var(--e-spring),background .25s;
}
details.panel>summary::after{
  content:"";position:absolute;width:0;height:0;margin-left:5px;
  border:4px solid transparent;border-left-color:var(--brand);
  transition:transform .3s var(--e-spring);
}
details.panel[open]>summary::before{background:var(--surface)}
details.panel[open]>summary::after{transform:rotate(90deg) translateX(-1px)}
details.panel .body{padding:.3rem 1rem 1rem;font-size:.95rem;animation:slidein .35s var(--e-out)}
@keyframes slidein{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* ═══ TEXTO LEGAL ═══ */
.legal{
  background:var(--legal-bg);border-left:4px solid var(--legal);
  border-radius:0 var(--r-md) var(--r-md) 0;padding:.85rem 1.05rem;
  font-family:var(--f-legal);font-size:.95rem;line-height:1.7;
}
.legal p{margin:.45rem 0}
.legal .lbl{
  font-family:var(--f-body);font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;
  color:var(--legal);font-weight:800;display:block;margin-bottom:.4rem;
}

/* ═══ CAJAS SEMÁNTICAS ═══ */
.box{
  border-left:4px solid var(--line);border-radius:0 var(--r-md) var(--r-md) 0;
  padding:.72rem .95rem;margin:.65rem 0;font-size:.94rem;
  transition:transform .25s var(--e-out),box-shadow .25s;
}
.box:hover{transform:translateX(3px);box-shadow:var(--sh-1)}
.box.ej{background:var(--ej-bg);border-color:var(--ej)}
.box.warn{background:var(--warn-bg);border-color:var(--warn)}
.box.exc{background:var(--exc-bg);border-color:var(--exc)}
.box .lbl{font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;font-weight:800;
  display:block;margin-bottom:.3rem}
.box.ej .lbl{color:var(--ej)}
.box.warn .lbl{color:var(--warn)}
.box.exc .lbl{color:var(--exc)}

.interp{
  border:1px dashed var(--warn);background:color-mix(in srgb,var(--warn-bg) 45%,transparent);
  border-radius:var(--r-md);padding:.65rem .9rem;font-size:.9rem;margin:.6rem 0;
}
.interp .lbl{font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;color:var(--warn);font-weight:800;display:block}

/* ═══ TABLAS ═══ */
table{width:100%;border-collapse:separate;border-spacing:0;font-size:.9rem;margin:.7rem 0;
  border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
th,td{padding:.5rem .68rem;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
td + td, th + th{border-left:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th{background:var(--surface-2);font-size:var(--t-xs);font-weight:800;letter-spacing:.05em;
  text-transform:uppercase;color:var(--ink-2);position:sticky;top:0}
tbody tr{transition:background .18s}
tbody tr:nth-child(even){background:color-mix(in srgb,var(--surface-2) 45%,transparent)}
tbody tr:hover{background:var(--brand-soft)}
th.sortable{cursor:pointer;user-select:none;transition:color .2s,background .2s}
th.sortable:hover{color:var(--brand);background:var(--brand-soft)}
th.sortable::after{content:" ⇅";color:var(--ink-3);font-size:.7rem}

ul,ol{margin:.5rem 0 .5rem 1.2rem;padding:0}
li{margin:.26rem 0}
li::marker{color:var(--brand);font-weight:700}

/* ═══ TOOLTIPS ═══ */
.t{border-bottom:1.5px dotted var(--brand);cursor:help;position:relative;
  transition:background .2s,color .2s}
.t:hover{background:var(--brand-soft);color:var(--brand);border-radius:3px}
#tip{
  position:fixed;z-index:99;max-width:330px;background:var(--ink);color:var(--bg);
  padding:.6rem .78rem;border-radius:var(--r-md);font-size:.82rem;line-height:1.5;
  display:none;box-shadow:0 8px 30px rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.08);
}
html[data-theme="dark"] #tip{background:#f0f1f5;color:#15161c}

/* ═══ FLECHAS DE DIAGRAMA ═══
   Un <path> con stroke pero sin fill toma el valor inicial (negro) y el
   navegador cierra el trazo implícitamente: aparece un triángulo relleno
   entre sus extremos. Forzamos fill:none para dejar solo la línea + la
   punta del <marker>, que sí lleva su color. */
svg path[stroke]:not([fill]){fill:none}
svg polyline:not([fill]){fill:none}
svg line{fill:none}

/* ═══ SVG ═══ */
svg{max-width:100%;height:auto;display:block;margin:.9rem auto}
svg text{font-family:var(--f-body)}

/* ═══ BUSCADOR ═══ */
mark.hit{background:linear-gradient(180deg,transparent 55%,#ffe066 55%);color:inherit;
  border-radius:2px;padding:0 1px;font-weight:600}
html[data-theme="dark"] mark.hit{background:linear-gradient(180deg,transparent 55%,#8a6d00 55%);color:#fff}

/* ═══ UTILIDADES ═══ */
.hide{display:none !important}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.small{font-size:var(--t-sm);color:var(--ink-2)}
.chip{
  display:inline-block;font-size:var(--t-xs);padding:.16rem .55rem;border-radius:var(--r-full);
  background:var(--brand-soft);color:var(--brand);font-weight:800;letter-spacing:.02em;
}

/* ═══ HUECOS RELLENABLES ═══ */
.gap{
  display:inline-block;min-width:5.5em;border-bottom:2px solid var(--brand);
  text-align:center;font-weight:700;color:transparent;cursor:pointer;
  transition:color .3s,background .3s;
}
.gap.on,.gap:hover{color:var(--brand);background:var(--brand-soft);border-radius:4px 4px 0 0}

/* ═══ REVELAR SOLUCIÓN ═══ */
.revelar{
  background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;border-color:transparent;
  font-weight:700;
}
.revelar:hover{box-shadow:var(--sh-3)}
.sol{
  margin-top:.7rem;padding:.8rem 1rem;border-radius:var(--r-md);
  background:var(--ej-bg);border-left:4px solid var(--ej);
  animation:slidein .4s var(--e-out);
}

/* ═══ TEST ═══ */
.opt{
  display:block;padding:.55rem .85rem;margin:.35rem 0;border:1.5px solid var(--line);
  border-radius:var(--r-md);cursor:pointer;background:var(--surface);font-size:.94rem;
  transition:border-color .22s,background .22s,transform .22s var(--e-out);
}
.opt:hover{border-color:var(--brand);background:var(--brand-soft);transform:translateX(4px)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft);font-weight:650}
.opt.ko{border-color:var(--exc);background:var(--exc-bg)}
.opt input{margin-right:.5rem;accent-color:var(--brand)}

#tscore,#semres{
  font-family:var(--f-display);font-weight:800;font-size:1.15rem;letter-spacing:-.02em;
}

/* ═══════════════════════════════════════════════════════════════
   FLASHCARDS 3D · mazo con giro, vuelo de salida y sheen
   ═══════════════════════════════════════════════════════════════ */
#flash{--fc-e:cubic-bezier(.2,.8,.25,1);--fc-h:250px}

/* — Escena — */
.fc-stage{
  perspective:1400px;perspective-origin:50% 45%;
  padding:.4rem 0 .2rem;position:relative;
}
.fc-deck{position:relative;height:var(--fc-h);will-change:transform}

/* — Cartas fantasma del mazo — */
.fc-ghost{
  position:absolute;inset:0;border-radius:var(--r-lg);
  background:var(--surface);border:1px solid var(--line);
  transition:transform .5s var(--fc-e),opacity .5s var(--fc-e);
}
.fc-ghost.g1{transform:translateY(9px) scale(.972);opacity:.75}
.fc-ghost.g2{transform:translateY(18px) scale(.944);opacity:.45}
.fc-deck.empty .fc-ghost{opacity:0;transform:translateY(26px) scale(.9)}

/* — Elevación durante el giro — */
.fc-lift{position:absolute;inset:0;transform-style:preserve-3d}
.fc-lift.lift{animation:fcLift .78s var(--fc-e)}
@keyframes fcLift{
  0%,100%{transform:scale(1) translateY(0)}
  45%{transform:scale(1.055) translateY(-16px)}
}
.fc-lift.out-ok{animation:fcOut .5s cubic-bezier(.5,0,.75,0) forwards}
.fc-lift.out-ko{animation:fcOutKo .5s cubic-bezier(.5,0,.75,0) forwards}
.fc-lift.in{animation:fcIn .48s var(--fc-e)}
@keyframes fcOut{
  0%{transform:translateX(0) rotate(0) scale(1);opacity:1}
  100%{transform:translateX(130%) rotate(17deg) scale(.85);opacity:0}
}
@keyframes fcOutKo{
  0%{transform:translateX(0) rotate(0) scale(1);opacity:1}
  100%{transform:translateX(-130%) rotate(-17deg) scale(.85);opacity:0}
}
@keyframes fcIn{
  0%{transform:translateY(26px) scale(.9);opacity:0}
  100%{transform:translateY(0) scale(1);opacity:1}
}

/* — La carta — */
.fc-card{
  position:absolute;inset:0;transform-style:preserve-3d;
  transition:transform .78s var(--fc-e);
  cursor:pointer;border-radius:var(--r-lg);
}
.fc-card:focus-visible{outline:none}
.fc-card:focus-visible .fc-face{box-shadow:var(--sh-glow),var(--sh-2)}

/* — Caras — */
.fc-face{
  position:absolute;inset:0;border-radius:var(--r-lg);
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  padding:2rem 2.2rem;text-align:center;overflow:hidden;
  box-shadow:var(--sh-2);
  transition:box-shadow .4s var(--fc-e);
}
.fc-card:hover .fc-face{box-shadow:var(--sh-3)}

/* Anverso · pregunta */
.fc-front{
  background:
    radial-gradient(120% 90% at 50% -20%, var(--brand-soft) 0%, transparent 60%),
    var(--surface);
  border:1.5px solid var(--line);color:var(--ink);
}
/* Reverso · respuesta */
.fc-back{
  transform:rotateY(180deg);
  background:linear-gradient(145deg,var(--brand) 0%,#6d4bf7 45%,var(--c5,#0891b2) 130%);
  border:1.5px solid transparent;color:#fff;
}
html[data-theme="dark"] .fc-back{
  background:linear-gradient(145deg,#5f45c9 0%,#4b3aa8 45%,#0e6b85 130%);
}
.fc-back .fc-txt{color:#fff}
.fc-back b,.fc-back strong{color:#fff;font-weight:800}

/* — Sheen que barre al girar — */
.fc-face::after{
  content:"";position:absolute;top:-60%;left:-70%;width:55%;height:220%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.42),transparent);
  transform:rotate(18deg);opacity:0;pointer-events:none;
}
.fc-lift.lift .fc-face::after{animation:fcSheen .78s var(--fc-e)}
@keyframes fcSheen{
  0%{opacity:0;left:-70%}
  35%{opacity:1}
  100%{opacity:0;left:150%}
}

/* — Etiqueta superior — */
.fc-tag{
  position:absolute;top:1rem;left:1.15rem;
  font-size:var(--t-xs);font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  display:inline-flex;align-items:center;gap:.4rem;
}
.fc-front .fc-tag{color:var(--brand)}
.fc-back .fc-tag{color:rgba(255,255,255,.9)}
.fc-tag::before{
  content:"";width:7px;height:7px;border-radius:50%;background:currentColor;
  animation:fcPulse 2.2s ease-in-out infinite;
}
@keyframes fcPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.65)}}

/* — Índice tipo naipe — */
.fc-pip{
  position:absolute;font-family:var(--f-display);font-weight:800;
  font-size:.78rem;letter-spacing:-.02em;opacity:.34;font-variant-numeric:tabular-nums;
}
.fc-pip.tr{top:1rem;right:1.15rem}
.fc-pip.bl{bottom:1rem;left:1.15rem;transform:rotate(180deg)}
.fc-front .fc-pip{color:var(--ink-2)}
.fc-back .fc-pip{color:#fff;opacity:.55}

/* — Texto — */
.fc-txt{
  font-size:clamp(1rem,.9rem + .55vw,1.28rem);font-weight:650;line-height:1.5;
  max-width:44ch;letter-spacing:-.012em;
}
.fc-front .fc-txt{font-family:var(--f-display);font-weight:700}
.fc-back .fc-txt{font-weight:600;line-height:1.6}
.fc-hint{
  position:absolute;bottom:1rem;left:0;right:0;
  font-size:var(--t-xs);font-weight:600;letter-spacing:.02em;
  display:flex;align-items:center;justify-content:center;gap:.4rem;
}
.fc-front .fc-hint{color:var(--ink-3)}
.fc-back .fc-hint{color:rgba(255,255,255,.72)}
.fc-hint .kbd{
  font-family:var(--f-mono);font-size:.68rem;font-weight:700;padding:.1rem .32rem;
  border-radius:5px;border:1px solid currentColor;opacity:.75;
}

/* — Pantalla final — */
.fc-done{
  position:absolute;inset:0;border-radius:var(--r-lg);
  background:linear-gradient(150deg,var(--ok-soft),var(--surface) 70%);
  border:1.5px solid var(--ok);
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  text-align:center;padding:2rem;gap:.35rem;
  animation:fcIn .5s var(--fc-e);box-shadow:var(--sh-2);
}
.fc-done .seal{
  font-size:2.6rem;line-height:1;
  animation:fcSeal .7s cubic-bezier(.2,1.5,.4,1);
}
@keyframes fcSeal{0%{transform:scale(0) rotate(-25deg);opacity:0}60%{transform:scale(1.2) rotate(6deg)}100%{transform:scale(1) rotate(0);opacity:1}}
.fc-done h3{font-size:1.3rem;font-weight:800;margin:.2rem 0 0}
.fc-done p{margin:0;color:var(--ink-2);font-size:var(--t-sm)}

/* — Barra de progreso de la ronda — */
.fc-bar{
  height:6px;border-radius:99px;background:var(--surface-3);
  overflow:hidden;margin:.95rem 0 .8rem;position:relative;
}
.fc-bar i{
  display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--brand),var(--c5,#0891b2));
  transition:width .55s var(--fc-e);
}

/* — Controles — */
.fc-ctrls{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.fc-ctrls button{font-weight:700}
#fcok{border-color:var(--ok);color:var(--ok)}
#fcok:hover{background:var(--ok);color:#fff;border-color:var(--ok)}
#fcko{border-color:var(--warn);color:var(--warn)}
#fcko:hover{background:var(--warn);color:#fff;border-color:var(--warn)}
#fcflip{background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;border-color:transparent}
#fcflip:hover{box-shadow:var(--sh-3)}

.fc-score{display:inline-flex;gap:.45rem;margin-left:auto;align-items:center}
.fc-pill{
  font-size:var(--t-xs);font-weight:800;padding:.24rem .6rem;border-radius:var(--r-full);
  font-variant-numeric:tabular-nums;border:1px solid;
}
.fc-pill.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.fc-pill.ko{color:var(--warn);border-color:var(--warn);background:var(--warn-bg)}
.fc-pill.left{color:var(--ink-2);border-color:var(--line);background:var(--surface-2)}
.fc-pill.bump{animation:fcBump .45s var(--e-spring)}
@keyframes fcBump{0%{transform:scale(1)}45%{transform:scale(1.28)}100%{transform:scale(1)}}

@media(max-width:620px){
  #flash{--fc-h:270px}
  .fc-face{padding:1.7rem 1.3rem}
  .fc-score{margin-left:0;width:100%}
}
@media(prefers-reduced-motion:reduce){
  .fc-card{transition:none}
  .fc-lift.lift,.fc-lift.in,.fc-lift.out-ok,.fc-lift.out-ko,.fc-face::after{animation:none !important}
}
@media print{.fc-stage,.fc-ctrls,.fc-bar{display:none !important}}
/* ═══ RESPUESTA ESTRUCTURADA ═══ */
.fc-face{justify-content:center}
.fc-face.struct{justify-content:flex-start;text-align:left;padding-top:3.1rem;padding-bottom:3.1rem}
.fc-body{
  width:100%;max-width:46ch;margin:0 auto;
  overflow-y:auto;max-height:100%;
  scrollbar-width:thin;
}
.fc-body::-webkit-scrollbar{width:5px}
.fc-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.35);border-radius:99px;border:0}
.fc-front .fc-body::-webkit-scrollbar-thumb{background:var(--line-strong)}

/* — Veredicto Sí / No — */
.fc-verdict{
  display:inline-flex;align-items:center;gap:.35rem;
  font-family:var(--f-display);font-weight:800;font-size:.82rem;
  letter-spacing:.06em;text-transform:uppercase;
  padding:.26rem .72rem;border-radius:var(--r-full);margin-bottom:.85rem;
  border:1.5px solid;animation:fcPopIn .45s var(--e-spring) backwards;animation-delay:.34s;
}
.fc-verdict.si{background:rgba(255,255,255,.16);border-color:rgba(190,255,215,.85);color:#d8ffe9}
.fc-verdict.no{background:rgba(255,255,255,.16);border-color:rgba(255,205,205,.85);color:#ffdedd}
@keyframes fcPopIn{0%{opacity:0;transform:scale(.7) translateY(6px)}100%{opacity:1;transform:none}}

/* — Párrafo — */
.fc-p{margin:0;font-size:clamp(1rem,.92rem + .45vw,1.2rem);font-weight:600;line-height:1.6}
.fc-face.struct .fc-p{font-size:clamp(.96rem,.9rem + .35vw,1.1rem)}

/* — Lista enumerada — */
.fc-list{list-style:none;margin:0;padding:0;display:grid;gap:.5rem;counter-reset:fc}
.fc-list li{
  counter-increment:fc;position:relative;margin:0;
  padding:.42rem .6rem .42rem 2.5rem;border-radius:var(--r-sm);
  background:rgba(255,255,255,.11);
  font-size:clamp(.92rem,.88rem + .3vw,1.04rem);font-weight:600;line-height:1.45;
  animation:fcRow .42s var(--e-out) backwards;
}
.fc-list li::before{
  content:counter(fc);position:absolute;left:.6rem;top:50%;transform:translateY(-50%);
  width:1.6rem;height:1.6rem;border-radius:50%;
  display:grid;place-items:center;
  background:rgba(255,255,255,.9);color:var(--brand);
  font-family:var(--f-display);font-weight:800;font-size:.78rem;
  font-variant-numeric:tabular-nums;
}
.fc-list.alpha li::before{content:counter(fc,lower-alpha)}
.fc-list li:nth-child(1){animation-delay:.36s}
.fc-list li:nth-child(2){animation-delay:.42s}
.fc-list li:nth-child(3){animation-delay:.48s}
.fc-list li:nth-child(4){animation-delay:.54s}
.fc-list li:nth-child(5){animation-delay:.60s}
.fc-list li:nth-child(n+6){animation-delay:.66s}
@keyframes fcRow{0%{opacity:0;transform:translateX(-12px)}100%{opacity:1;transform:none}}

/* — Cláusulas contrapuestas — */
.fc-clauses{display:grid;gap:.45rem}
.fc-clauses p{
  margin:0;padding:.45rem .7rem .45rem .95rem;border-radius:0 var(--r-sm) var(--r-sm) 0;
  background:rgba(255,255,255,.11);border-left:3px solid rgba(255,255,255,.55);
  font-size:clamp(.92rem,.88rem + .3vw,1.04rem);font-weight:600;line-height:1.5;
  animation:fcRow .42s var(--e-out) backwards;
}
.fc-clauses p:nth-child(1){animation-delay:.36s}
.fc-clauses p:nth-child(2){animation-delay:.44s}
.fc-clauses p:nth-child(3){animation-delay:.52s}

/* — Negritas resaltadas en el reverso — */
.fc-back .fc-body b,.fc-back .fc-body strong{
  font-weight:800;background:rgba(255,255,255,.2);
  padding:.03em .3em;border-radius:5px;
  box-decoration-break:clone;-webkit-box-decoration-break:clone;
}

/* — Cita legal al pie — */
.fc-cite{
  position:absolute;bottom:.95rem;left:0;right:0;
  display:inline-flex;align-items:center;justify-content:center;gap:.4rem;
  font-family:var(--f-mono);font-size:.74rem;font-weight:700;letter-spacing:.02em;
  color:rgba(255,255,255,.82);
  animation:fcPopIn .5s var(--e-out) backwards;animation-delay:.5s;
}
.fc-cite::before,.fc-cite::after{
  content:"";height:1px;width:clamp(18px,10%,52px);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.45));
}
.fc-cite::after{background:linear-gradient(90deg,rgba(255,255,255,.45),transparent)}
.fc-cite .s{font-size:.9rem;opacity:.75;font-family:var(--f-legal)}
.fc-front .fc-cite{color:var(--ink-3)}
.fc-front .fc-cite::before{background:linear-gradient(90deg,transparent,var(--line-strong))}
.fc-front .fc-cite::after{background:linear-gradient(90deg,var(--line-strong),transparent)}

/* la pista se oculta si hay cita, para no amontonar */
.fc-back .fc-cite ~ .fc-hint,.fc-back .fc-hint.muted{display:none}

@media(max-width:620px){
  #flash{--fc-h:320px}
  .fc-face.struct{padding-top:2.9rem;padding-bottom:2.8rem}
  .fc-list li{padding-left:2.3rem}
}
@media(prefers-reduced-motion:reduce){
  .fc-verdict,.fc-list li,.fc-clauses p,.fc-cite{animation:none !important}
}

/* ═══ SEMÁFORO ═══ */
.sembtn{
  border-radius:var(--r-full);padding:.32rem .7rem;font-weight:700;font-size:var(--t-sm);
}
.sembtn[data-v="g"]:hover,.sembtn.on[data-v="g"]{background:var(--ok);color:#fff;border-color:var(--ok)}
.sembtn[data-v="y"]:hover,.sembtn.on[data-v="y"]{background:var(--mid);color:#3d2f00;border-color:var(--mid)}
.sembtn[data-v="r"]:hover,.sembtn.on[data-v="r"]{background:var(--exc);color:#fff;border-color:var(--exc)}

/* ═══ CTA DE BLOQUE ═══ */
a.blk{
  display:inline-flex;align-items:center;gap:.5rem;
  background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;
  padding:.5rem .95rem;border-radius:var(--r-sm);font-weight:700;font-size:var(--t-sm);
  text-decoration:none;box-shadow:0 2px 10px var(--brand-ring);
  transition:transform .22s var(--e-spring),box-shadow .25s,gap .25s var(--e-out);
}
a.blk:hover{transform:translateY(-2px);box-shadow:var(--sh-3);gap:.75rem;text-decoration:none}
a.blk::after{content:"→"}
a.blk:active{transform:translateY(0) scale(.98)}

/* ═══ REVEAL ═══ */
.rv{opacity:0;transform:translateY(20px);transition:opacity .6s var(--e-out),transform .6s var(--e-out)}
.rv.in{opacity:1;transform:none}

/* ═══ RESPONSIVE ═══ */
@media(max-width:960px){
  .layout{grid-template-columns:1fr;padding-top:.9rem;gap:1rem}
  nav.side{position:static;max-height:none}
  nav.side.collapsed .navbody{display:none}
  .navtoggle{display:block;width:100%;text-align:left;font-weight:700}
  .grid2{grid-template-columns:1fr}
  .top h1 .sub{white-space:normal}
}
@media(max-width:620px){
  .top-in{padding:.55rem .8rem}
  .tools{width:100%;margin-left:0}
  input[type=search]{flex:1;min-width:0}
  section.card{padding:1.05rem 1rem;border-radius:var(--r-md)}
  table{font-size:.82rem}
  th,td{padding:.4rem .5rem}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
  .rv{opacity:1;transform:none}
}
@media print{
  header.top,nav.side,.tools,.noprint,.progress{display:none !important}
  body{background:#fff;background-image:none;font-size:11pt;color:#000}
  .layout{display:block;max-width:none;padding:0}
  section.card{border:0;padding:0;margin:0 0 1rem;break-inside:avoid;box-shadow:none}
  details.panel{border:0;box-shadow:none}
  details.panel .body{display:block !important}
  details.panel>summary{padding-left:0}
  .art{break-inside:avoid}
  .rv{opacity:1;transform:none}
  a{color:#000;text-decoration:none}
}


/* ═══ ALTURA ADAPTATIVA DE LA TARJETA ═══ */
.fc-deck{transition:height .45s var(--fc-e)}
.fc-body{max-height:none;overflow:visible}
.fc-measure{
  position:absolute;left:0;right:0;top:0;height:auto;
  visibility:hidden;pointer-events:none;z-index:-1;
}
.fc-measure .fc-face{
  position:relative;inset:auto;height:auto;min-height:0;
  box-shadow:none;backface-visibility:visible;transform:none;
}
.fc-measure .fc-body{max-height:none;overflow:visible}
.fc-measure .fc-face::after{display:none}

/* ═══ MOSTRAR / OCULTAR ÍNDICE LATERAL ═══ */
.layout{transition:grid-template-columns .42s var(--e-out)}
.layout.nonav{grid-template-columns:0 1fr;gap:0}
.layout.nonav>nav.side{
  opacity:0;transform:translateX(-14px);pointer-events:none;
  padding:0;border-width:0;overflow:hidden;width:0;min-width:0;
}
nav.side{
  transition:opacity .3s var(--e-out),transform .38s var(--e-out);
  overflow-x:hidden;
}
#navhide .ic{display:inline-block;transition:transform .35s var(--e-spring);font-size:.95em;line-height:1}
#navhide[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
#navhide[aria-pressed="true"] .ic{transform:rotate(90deg)}
@media(max-width:960px){#navhide{display:none}}

/* ═══════════════════════════════════════════════════════════════
   LECTURA EN VOZ ALTA (TTS) del texto legal
   ═══════════════════════════════════════════════════════════════ */
.tts-bar{
  display:flex;align-items:center;gap:.45rem;flex-wrap:wrap;
  margin:.15rem 0 .7rem;
}
.tts-bar button{
  font-size:var(--t-xs);font-weight:700;padding:.3rem .62rem;
  border-radius:var(--r-full);border:1px solid var(--legal);
  background:transparent;color:var(--legal);
  display:inline-flex;align-items:center;gap:.35rem;line-height:1.2;
}
.tts-bar button:hover{background:var(--legal);color:var(--surface);border-color:var(--legal)}
.tts-bar button[hidden]{display:none}
.tts-bar .tts-play.on{background:var(--legal);color:var(--surface)}

/* Ondas de audio mientras lee */
.tts-wave{display:inline-flex;align-items:flex-end;gap:2px;height:11px}
.tts-wave i{
  width:2.5px;background:currentColor;border-radius:2px;height:35%;
  animation:ttsW .9s ease-in-out infinite;
}
.tts-wave i:nth-child(2){animation-delay:.15s}
.tts-wave i:nth-child(3){animation-delay:.3s}
.tts-wave i:nth-child(4){animation-delay:.45s}
@keyframes ttsW{0%,100%{height:32%}50%{height:100%}}

.tts-time{
  font-family:var(--f-mono);font-size:.7rem;font-weight:700;
  color:var(--ink-3);font-variant-numeric:tabular-nums;
}

/* Frase que se está leyendo */
.tts-s{transition:background .25s,color .25s;border-radius:3px}
.tts-s.now{
  background:linear-gradient(180deg,transparent 8%,color-mix(in srgb,var(--legal) 26%,transparent) 8%);
  box-shadow:0 0 0 2px color-mix(in srgb,var(--legal) 16%,transparent);
}
html[data-theme="dark"] .tts-s.now{
  background:linear-gradient(180deg,transparent 8%,color-mix(in srgb,var(--legal) 34%,transparent) 8%);
}
.legal.tts-on{box-shadow:0 0 0 3px color-mix(in srgb,var(--legal) 20%,transparent)}

/* ═══ Reproductor flotante ═══ */
.tts-mini{
  position:fixed;left:50%;bottom:1.1rem;transform:translateX(-50%) translateY(140%);
  z-index:80;display:flex;align-items:center;gap:.6rem;
  background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  border:1px solid var(--line);border-radius:var(--r-full);
  padding:.5rem .7rem .5rem .95rem;box-shadow:var(--sh-3);
  transition:transform .45s var(--e-spring),opacity .3s;opacity:0;pointer-events:none;
  max-width:min(94vw,540px);
}
.tts-mini.show{transform:translateX(-50%) translateY(0);opacity:1;pointer-events:auto}
.tts-mini .lbl{
  font-size:var(--t-xs);font-weight:800;color:var(--legal);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:16ch;
}
.tts-mini button{
  border-radius:50%;width:32px;height:32px;padding:0;display:grid;place-items:center;
  font-size:.8rem;border:1px solid var(--line);flex:none;
}
.tts-mini button.main{
  width:38px;height:38px;font-size:.95rem;
  background:linear-gradient(140deg,var(--legal),var(--brand));color:#fff;border-color:transparent;
}
.tts-mini .bar{
  flex:1;min-width:70px;height:5px;border-radius:99px;background:var(--surface-3);overflow:hidden;
}
.tts-mini .bar i{display:block;height:100%;width:0;background:var(--legal);
  border-radius:99px;transition:width .35s var(--e-out)}

/* ═══ Panel de ajustes de voz ═══ */
.tts-back{
  position:fixed;inset:0;z-index:90;background:rgba(10,10,18,.45);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  display:grid;place-items:center;padding:1rem;
  opacity:0;pointer-events:none;transition:opacity .3s var(--e-out);
}
.tts-back.show{opacity:1;pointer-events:auto}
.tts-panel{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--sh-3);width:min(94vw,470px);max-height:88vh;overflow:auto;
  padding:1.3rem 1.4rem;transform:translateY(16px) scale(.97);
  transition:transform .38s var(--e-spring);
}
.tts-back.show .tts-panel{transform:none}
.tts-panel h3{
  font-size:1.12rem;font-weight:800;margin:0 0 .25rem;
  display:flex;align-items:center;gap:.5rem;
}
.tts-panel .sub{font-size:var(--t-sm);color:var(--ink-2);margin:0 0 1.1rem}
.tts-row{margin-bottom:1.05rem}
.tts-row > label{
  display:block;font-size:var(--t-xs);font-weight:800;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-2);margin-bottom:.4rem;
}
.tts-seg{display:flex;gap:3px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:3px}
.tts-seg button{
  flex:1;border:0;background:transparent;border-radius:calc(var(--r-sm) - 3px);
  padding:.42rem .3rem;font-size:var(--t-sm);font-weight:700;box-shadow:none;
}
.tts-seg button:hover{transform:none;background:var(--surface)}
.tts-seg button[aria-pressed="true"]{
  background:linear-gradient(140deg,var(--legal),var(--brand));color:#fff;
}
.tts-panel select{
  width:100%;padding:.5rem .6rem;border-radius:var(--r-sm);
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  font-size:var(--t-sm);font-weight:600;cursor:pointer;
}
.tts-panel select:focus{border-color:var(--brand);outline:none}
.tts-slider{display:flex;align-items:center;gap:.75rem}
.tts-slider input[type=range]{flex:1;accent-color:var(--legal);cursor:pointer;height:22px}
.tts-val{

}

}

.tts-acts{display:flex;gap:.5rem;justify-content:flex-end;flex-wrap:wrap}

.tts-badge{

/* — Variante compacta para los apartados desplegables — */

/* aviso de cambio de voz */

  .tts-wave i{animation:none;height:60%}
}
@media print{.tts-bar,.tts-mini,.tts-back{display:none !important}}

<script>
const GLOSARIO={
 "presupuesto":"Documento contable y jurídico, aprobado por el Pleno, que fija el techo de gasto de un ejercicio y estima los ingresos con los que se financia. Ej.: el presupuesto de Utrera para 2026 autoriza gastar como máximo 78 M€.",
 "credito":"Crédito presupuestario: la cantidad máxima de dinero autorizada para una finalidad concreta. Ej.: 120.000 € en la aplicación de 'mantenimiento de colegios'.",
 "obligacion":"Obligación reconocida: la deuda que el Ayuntamiento admite formalmente que debe pagar, una vez comprobado que el servicio o suministro se ha prestado. Ej.: aprobada la factura del proveedor, nace la obligación.",
 "derecho":"Derecho liquidado: el importe concreto que un tercero debe a la entidad local, una vez cuantificado. Ej.: liquidado el IBI de un inmueble en 340 €, ese es el derecho.",
 "oa":"Organismo autónomo: ente con personalidad jurídica propia creado por la entidad local para gestionar un servicio (patronatos de deportes, de cultura, gerencias de urbanismo). Depende del Ayuntamiento pero tiene su propio presupuesto.",
 "sociedad":"Sociedad mercantil local: empresa con forma de S.A. o S.L. cuyo capital pertenece a la entidad local (p. ej. la empresa municipal de aguas). No aprueba 'presupuesto', sino estados de previsión de gastos e ingresos.",
 "bases":"Bases de ejecución: el 'reglamento de uso' del presupuesto. Adaptan las normas presupuestarias generales a la organización concreta de la entidad. Ej.: fijan qué órgano autoriza gastos de hasta 3.000 €.",
 "estabilidad":"Estabilidad presupuestaria: exigencia de que las cuentas públicas no incurran en déficit estructural. Ej.: un ayuntamiento no puede presupuestar más gasto no financiero que ingresos no financieros.",
 "afectacion":"No afectación: regla general de que todos los ingresos financian todo el gasto, sin que un ingreso concreto quede reservado a un gasto concreto. Ej.: lo recaudado por el IBI no está reservado a pagar el alumbrado.",
 "bruto":"Principio de presupuesto bruto (o de integridad): derechos y obligaciones se anotan por su importe total, sin compensar unos con otros. Ej.: no se puede anotar la subvención 'ya descontados' los gastos del programa.",
 "nivelacion":"Nivelación presupuestaria: que el total de ingresos previstos cubra el total de gastos autorizados; es decir, aprobar sin déficit inicial.",
 "aplicacion":"Aplicación presupuestaria: la 'casilla' exacta donde vive cada euro de gasto, formada al cruzar la clasificación por programas con la económica. Ej.: 323/22103 (funcionamiento de centros docentes / combustibles).",
 "vinculacion":"Nivel de vinculación jurídica: el nivel de agregación en el que el crédito es realmente limitativo; por debajo de él se puede mover el gasto sin tramitar una modificación de crédito (art. 172 TRLHL).",
 "intervencion":"Intervención: el órgano de control interno de la entidad local, con función de fiscalización previa del gasto y de informe preceptivo del presupuesto. Lo desempeña un funcionario de habilitación nacional.",
 "pleno":"Pleno: órgano colegiado formado por todos los concejales o diputados. Es el único competente para aprobar el presupuesto.",
 "bop":"Boletín Oficial de la Provincia: diario oficial donde las entidades locales publican sus anuncios y acuerdos con efectos frente a terceros.",
 "prorroga":"Prórroga presupuestaria: si el 1 de enero no ha entrado en vigor el presupuesto nuevo, sigue rigiendo automáticamente el anterior con sus créditos iniciales.",
 "interesado":"Interesado: quien está legitimado para intervenir en un procedimiento. En el presupuesto, la ley define expresamente quiénes lo son (art. 170.1).",
 "liquidacion":"Liquidación del presupuesto: cierre contable del ejercicio, que determina los derechos y obligaciones pendientes, el remanente de tesorería y el resultado presupuestario.",
 "tcuentas":"Tribunal de Cuentas: órgano fiscalizador externo de las cuentas y la gestión económica del sector público, dependiente de las Cortes Generales.",
 "conten":"Recurso contencioso-administrativo: impugnación ante los juzgados y tribunales de lo contencioso-administrativo, es decir, ya fuera de la propia Administración.",
 "tesoreria":"Tesorería: conjunto de todos los recursos financieros de la entidad —dinero, valores y créditos— tanto por operaciones presupuestarias como extrapresupuestarias.","unidadcaja":"Principio de unidad de caja: todos los fondos y valores se centralizan en una sola caja, sin cajas paralelas por servicios. Permite gestionar la liquidez del conjunto.","extrapres":"Operación extrapresupuestaria: movimiento de fondos que no afecta al presupuesto porque la entidad actúa como mero depositario o intermediario. Ej.: las retenciones de IRPF practicadas en nómina hasta su ingreso en Hacienda.","ctarestringida":"Cuenta restringida: cuenta bancaria de uso limitado, o solo para recaudar (los fondos salen únicamente hacia la cuenta operativa) o solo para pagar (se nutre exclusivamente de la operativa).","optesoreria":"Operación de tesorería: préstamo a corto plazo concertado para cubrir déficits temporales de liquidez por desfase entre cobros y pagos. Se regula en el art. 51 TRLHL.","excedente":"Excedente temporal de tesorería: dinero disponible que no se necesita a corto plazo y que puede colocarse en productos que reúnan condiciones de liquidez y seguridad.","contpublica":"Contabilidad pública: régimen contable al que quedan sujetas las entidades locales, que lleva consigo la obligación de rendir cuentas al Tribunal de Cuentas.","pgcpl":"Plan General de Contabilidad Pública adaptado a la Administración local: normativa contable, aprobada por el Ministerio de Hacienda a propuesta de la IGAE, que fija cuentas, criterios de valoración y estados a rendir.","resanalitico":"Resultado analítico: el que pone de manifiesto el coste y el rendimiento de cada servicio, más allá del resultado global de la entidad.","respatrimonial":"Resultado económico-patrimonial: diferencia entre ingresos y gastos económicos del ejercicio, con criterio de devengo, que explica la variación del patrimonio neto.","avales":"Aval: garantía por la que la entidad local responde de una deuda ajena si el deudor principal no paga. La tesorería responde de los avales contraídos.","ltesoreria":"Ley 47/2003, General Presupuestaria: norma estatal que regula, entre otras materias, la tesorería del Estado. Su capítulo III del título IV se aplica supletoriamente a la tesorería local."
};
const ARTS=[{n:194,t:"Definición y régimen jurídico",ubic:"Título VI (Presupuesto y gasto público) ▸ Capítulo II (De la tesorería de las entidades locales)",idea:"La tesorería es todo el dinero, valores y créditos de la entidad, sea o no presupuestario.",literal:`<p>1. Constituyen la tesorería de las entidades locales todos los recursos financieros, sean dinero, valores o créditos, de la entidad local, tanto por operaciones presupuestarias como extrapresupuestarias.</p><p>2. Los preceptos contenidos en el presente capítulo serán de aplicación, asimismo, a los organismos autónomos.</p><p>3. La tesorería de las entidades locales se regirá por lo dispuesto en el presente capítulo y, en cuanto les sean de aplicación, por las normas del capítulo tercero del título cuarto de la Ley 47/2003, de 26 de noviembre, General Presupuestaria.</p>`,dis:`<ul>
<li><b>194.1 — concepto:</b> constituyen la <span class="t" data-k="tesoreria">tesorería</span> <b>todos</b> los recursos financieros —<b>dinero, valores o créditos</b>— tanto por operaciones <b>presupuestarias</b> como <span class="t" data-k="extrapres">extrapresupuestarias</span>.</li>
<li><b>194.2 — ámbito:</b> el capítulo se aplica también a los <span class="t" data-k="oa">organismos autónomos</span>.</li>
<li><b>194.3 — régimen:</b> este capítulo y, en cuanto le sean de aplicación, las normas del <b>capítulo III del título IV de la <span class="t" data-k="ltesoreria">Ley 47/2003, General Presupuestaria</span></b>.</li>
</ul>`,llano:`<p>La tesorería no es solo la caja: es todo el dinero de la entidad, esté donde esté y venga de donde venga. También lo que la entidad guarda sin ser suyo del todo —una fianza de un contratista, las retenciones de IRPF de las nóminas—, que son operaciones extrapresupuestarias.</p>`,porque:`<p>Definir la tesorería de forma amplísima evita que existan <b>fondos fuera de control</b>. Si solo fuera tesorería lo presupuestario, las fianzas y depósitos quedarían en tierra de nadie. Y la remisión a la Ley General Presupuestaria da cobertura a lo que el TRLHL no regula, sin necesidad de repetir normas.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> el dinero de tu casa no es solo el de la cartera: también la cuenta, el depósito y lo que te deben.</li>
<li><b>Real:</b> forman parte de la tesorería municipal los 1,1 M€ de las cuentas operativas, los 40.000 € de fianzas de contratistas depositadas y los avales recibidos en garantía.</li>
<li><b>Caso límite:</b> las retenciones de IRPF practicadas en la nómina de diciembre y aún no ingresadas en la AEAT: son tesorería por operación <b>extrapresupuestaria</b>, aunque no aparezcan como gasto del presupuesto.</li>
</ul>`,noej:`<ul>
<li><b>No es tesorería</b> el patrimonio inmobiliario: la tesorería es recursos financieros.</li>
<li><b>No quedan fuera</b> los organismos autónomos: el capítulo también les alcanza.</li>
</ul>`,conex:`<ul>
<li><b>Art. 191.1:</b> a 31 de diciembre quedan a cargo de la Tesorería los ingresos y pagos pendientes.</li>
<li><b>Art. 196:</b> funciones de la tesorería.</li>
<li><b>Art. 51:</b> operaciones de tesorería a corto plazo.</li>
</ul>`,trampas:`<ul>
<li>Tres elementos: <b>dinero, valores o créditos</b>. Y dos orígenes: <b>presupuestario y extrapresupuestario</b>.</li>
<li>La remisión supletoria es a la <b>Ley 47/2003</b>, General Presupuestaria, no a la de Haciendas Locales.</li>
</ul>`,ancla:`<p><b>"Dinero, valores y créditos; dentro y fuera del presupuesto."</b> Todo cabe en la tesorería.</p>`,vis:`<svg viewBox="0 0 640 150" role="img" aria-label="Composición de la tesorería local">
<rect x="200" y="12" width="240" height="34" rx="8" fill="var(--acc)" stroke="var(--acc)"/>
<text x="320" y="34" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">TESORERÍA</text>
<line x1="320" y1="46" x2="320" y2="60" stroke="var(--acc)" stroke-width="2"/><line x1="120" y1="60" x2="520" y2="60" stroke="var(--acc)" stroke-width="2"/>
<g font-size="10" text-anchor="middle" fill="currentColor">
<line x1="120" y1="60" x2="120" y2="74" stroke="var(--acc)" stroke-width="2"/><rect x="40" y="74" width="160" height="40" rx="6" fill="var(--acc-soft)" stroke="var(--acc)"/><text x="120" y="99" font-size="11" font-weight="700">Dinero</text>
<line x1="320" y1="60" x2="320" y2="74" stroke="var(--acc)" stroke-width="2"/><rect x="240" y="74" width="160" height="40" rx="6" fill="var(--acc-soft)" stroke="var(--acc)"/><text x="320" y="99" font-size="11" font-weight="700">Valores</text>
<line x1="520" y1="60" x2="520" y2="74" stroke="var(--acc)" stroke-width="2"/><rect x="440" y="74" width="160" height="40" rx="6" fill="var(--acc-soft)" stroke="var(--acc)"/><text x="520" y="99" font-size="11" font-weight="700">Créditos</text>
</g>
<text x="320" y="136" text-anchor="middle" font-size="11" fill="var(--ej)">por operaciones presupuestarias Y extrapresupuestarias · también en los organismos autónomos</text>
</svg>`},
{n:195,t:"Control y régimen contable",ubic:"Título VI (Presupuesto y gasto público) ▸ Capítulo II (De la tesorería de las entidades locales)",idea:"Todo movimiento de tesorería está intervenido y contabilizado.",literal:`<p>Las disponibilidades de la tesorería y sus variaciones quedan sujetas a intervención y al régimen de la contabilidad pública.</p>`,dis:`<ul>
<li><b>Objeto:</b> las <b>disponibilidades</b> de la tesorería <b>y sus variaciones</b>.</li>
<li><b>Doble sujeción:</b> a la <b>intervención</b> (control interno) y al régimen de <b>contabilidad pública</b>.</li>
</ul>`,llano:`<p>Ni un euro entra o sale de la caja municipal sin que quede fiscalizado y anotado. Es la traducción a la tesorería de los dos controles que ya conoces: el del interventor y el de la contabilidad.</p>`,porque:`<p>La tesorería es el punto donde el dinero se vuelve tangible y, por tanto, donde el riesgo de desviación es mayor. Someter <b>las variaciones</b> —no solo el saldo— a intervención y contabilidad permite reconstruir el rastro completo de cada movimiento.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> una caja de un comercio con arqueo diario y registro de cada entrada y salida.</li>
<li><b>Real:</b> el arqueo trimestral de la tesorería municipal se somete a la Intervención, que verifica saldos bancarios y de caja (véase también el art. 222).</li>
</ul>`,noej:`<ul>
<li><b>No basta</b> con contabilizar: también hay intervención.</li>
<li><b>No se limita</b> al saldo final: alcanza a <b>las variaciones</b>.</li>
</ul>`,conex:`<ul>
<li><b>Art. 214.2.c):</b> intervención material del pago.</li>
<li><b>Art. 222:</b> facultad de verificar arqueos y recuentos.</li>
<li><b>Art. 205.e):</b> registrar los movimientos y situación de la tesorería es un fin de la contabilidad.</li>
</ul>`,trampas:`<ul>
<li>Sujeción <b>doble</b>: intervención <b>y</b> contabilidad pública.</li>
<li>Alcanza a las <b>disponibilidades y sus variaciones</b>.</li>
</ul>`,ancla:`<p><b>"Ni un euro sin firma ni sin apunte."</b></p>`,vis:`<svg viewBox="0 0 640 120" role="img" aria-label="Doble control de la tesorería">
<rect x="220" y="20" width="200" height="34" rx="8" fill="var(--acc-soft)" stroke="var(--acc)"/>
<text x="320" y="42" text-anchor="middle" font-size="12" font-weight="700" fill="var(--acc)">Disponibilidades y variaciones</text>
<rect x="90" y="70" width="200" height="36" rx="8" fill="var(--warn-bg)" stroke="var(--warn)"/>
<text x="190" y="93" text-anchor="middle" font-size="11" font-weight="700" fill="var(--warn)">Intervención</text>
<rect x="350" y="70" width="200" height="36" rx="8" fill="var(--ej-bg)" stroke="var(--ej)"/>
<text x="450" y="93" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ej)">Contabilidad pública</text>
<path d="M290 54 L 220 68" stroke="var(--acc)" stroke-width="2"/><path d="M350 54 L 420 68" stroke="var(--acc)" stroke-width="2"/>
</svg>`},
{n:196,t:"Funciones",ubic:"Título VI (Presupuesto y gasto público) ▸ Capítulo II (De la tesorería de las entidades locales)",idea:"Cinco funciones: cobrar, centralizar, distribuir en el tiempo, avalar y lo conexo.",literal:`<p>1. Son funciones encomendadas a la tesorería de las entidades locales:</p><p>a) Recaudar los derechos y pagar las obligaciones.</p><p>b) Servir al principio de unidad de caja, mediante la centralización de todos los fondos y valores generados por operaciones presupuestarias y extrapresupuestarias.</p><p>c) Distribuir en el tiempo las disponibilidades dinerarias para la puntual satisfacción de las obligaciones.</p><p>d) Responder de los avales contraídos.</p><p>e) Realizar las demás que se deriven o relacionen con las anteriormente numeradas.</p><p>2. Las funciones enumeradas en el apartado anterior se ejercerán, en su caso, por la unidad central de tesorería a que hace referencia el artículo 186 de esta ley.</p>`,dis:`<ol>
<li><b>a)</b> <b>Recaudar</b> los derechos y <b>pagar</b> las obligaciones.</li>
<li><b>b)</b> Servir al principio de <span class="t" data-k="unidadcaja">unidad de caja</span>, centralizando todos los fondos y valores de operaciones presupuestarias y extrapresupuestarias.</li>
<li><b>c)</b> <b>Distribuir en el tiempo</b> las disponibilidades dinerarias para la puntual satisfacción de las obligaciones.</li>
<li><b>d)</b> Responder de los <span class="t" data-k="avales">avales</span> contraídos.</li>
<li><b>e)</b> Las demás que se deriven o relacionen con las anteriores.</li>
</ol>
<p><b>196.2:</b> estas funciones se ejercerán, en su caso, por la <b>unidad central de tesorería</b> del art. 186 (entidades de más de 500.000 habitantes de derecho).</p>`,llano:`<p>La tesorería cobra, paga, guarda todo el dinero en un solo sitio, decide en qué orden se atiende cada obligación según la liquidez disponible y responde de los avales. En las ciudades muy grandes puede haber una unidad especializada para todo esto.</p>`,porque:`<p>La <b>unidad de caja</b> es la clave del artículo: si cada servicio tuviera su propia caja, la entidad podría tener dinero parado en un sitio y descubiertos en otro. Centralizar permite que la liquidez se gestione como un todo. Y la función de "distribuir en el tiempo" es precisamente lo que después se plasma en el <b>plan de disposición de fondos</b> del art. 187.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> una familia con una sola cuenta común en vez de cinco huchas separadas: se ve mejor cuánto hay y cuándo se puede pagar cada cosa.</li>
<li><b>Real:</b> la tesorería municipal centraliza los ingresos de las cuentas restringidas de recaudación en la cuenta operativa y programa los pagos de la semana conforme al plan de disposición de fondos.</li>
<li><b>Caso límite:</b> un patronato que abre una cuenta propia y retiene en ella su recaudación: contraviene el principio de unidad de caja del art. 196.1.b), aplicable también a los organismos autónomos (art. 194.2).</li>
</ul>`,noej:`<ul>
<li><b>No es función de la tesorería</b> reconocer obligaciones ni ordenar pagos: eso corresponde al presidente (arts. 185.2 y 186.1). La tesorería <b>materializa</b>.</li>
<li><b>No es unidad de caja</b> tener varias cuentas bancarias: lo prohibido es la dispersión de la gestión, no la existencia de cuentas con distinta función (art. 197).</li>
</ul>`,conex:`<ul>
<li><b>Art. 186:</b> unidad central de tesorería y ordenación de pagos.</li>
<li><b>Art. 187:</b> plan de disposición de fondos, concreción de la letra c).</li>
<li><b>Art. 197:</b> tipos de cuentas con las que se ejerce la función.</li>
</ul>`,trampas:`<ul>
<li>Son <b>cinco</b> funciones, y la que más se olvida es la <b>d) responder de los avales</b>.</li>
<li>La unidad de caja abarca fondos y valores <b>presupuestarios y extrapresupuestarios</b>.</li>
<li>La unidad central de tesorería del 196.2 remite al art. 186: <b>más de 500.000 habitantes de derecho</b>.</li>
</ul>`,ancla:`<p><b>"RECAUDA, CENTRALIZA, DISTRIBUYE, AVALA."</b> Cuatro verbos y un cajón de sastre.<br>La palabra clave del artículo: <b>unidad de caja</b>.</p>`,vis:`<svg viewBox="0 0 640 165" role="img" aria-label="Funciones de la tesorería">

<text x="320" y="153" text-anchor="middle" font-size="10" fill="var(--ink2)">Se ejercen, en su caso, por la unidad central de tesorería del art. 186</text>
</svg>`},
{n:197,t:"Caja y cuentas bancarias",ubic:"Título VI (Presupuesto y gasto público) ▸ Capítulo II (De la tesorería de las entidades locales)",idea:"Cuatro tipos de cuenta bancaria y cajas de efectivo para el día a día.",literal:`<p>1. Las entidades locales podrán concertar los servicios financieros de su tesorería con entidades de crédito y ahorro, mediante la apertura de los siguientes tipos de cuentas:</p><p>a) Cuentas operativas de ingresos y pagos.</p><p>b) Cuentas restringidas de recaudación.</p><p>c) Cuentas restringidas de pagos.</p><p>d) Cuentas financieras de colocación de excedentes de tesorería.</p><p>2. Asimismo las entidades locales podrán autorizar la existencia de cajas de efectivo, para los fondos de las operaciones diarias, las cuales estarán sujetas a las limitaciones que reglamentariamente se establezcan.</p>`,dis:`<table><thead><tr><th>Tipo de cuenta (197.1)</th><th>Para qué sirve</th></tr></thead><tbody>
<tr><td><b>a)</b> Operativas de ingresos y pagos</td><td>La cuenta corriente ordinaria: entra y sale dinero</td></tr>
<tr><td><b>b)</b> <span class="t" data-k="ctarestringida">Restringidas de recaudación</span></td><td>Solo reciben ingresos; su saldo se traslada a la operativa</td></tr>
<tr><td><b>c)</b> Restringidas de pagos</td><td>Solo pagan; se nutren desde la operativa</td></tr>
<tr><td><b>d)</b> Financieras de colocación de excedentes</td><td>Rentabilizan la liquidez sobrante</td></tr>
</tbody></table>
<p><b>197.2 — cajas de efectivo:</b> las entidades pueden autorizarlas para los <b>fondos de las operaciones diarias</b>, sujetas a las limitaciones que <b>reglamentariamente</b> se establezcan.</p>`,llano:`<p>El dinero municipal no vive en una sola cuenta. Hay una cuenta principal por la que entra y sale todo, cuentas que solo sirven para recaudar (las de los bancos colaboradores), cuentas que solo sirven para pagar y cuentas donde se coloca el dinero que sobra. Y una caja pequeña para el día a día.</p>`,porque:`<p>Las <b>cuentas restringidas</b> son un mecanismo de control: si una cuenta solo puede recibir, nadie puede sacar dinero de ella; si solo puede pagar, se puede limitar su saldo. Separar funciones bancarias reduce el riesgo de disposición indebida sin renunciar a la comodidad operativa. La caja de efectivo se admite por necesidad práctica, pero limitada por vía reglamentaria.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> tener una cuenta nómina, otra de ahorro y un poco de efectivo en el cajón.</li>
<li><b>Real:</b> las entidades colaboradoras ingresan la recaudación del IBI en cuentas <b>restringidas de recaudación</b>; el saldo se traspasa periódicamente a la cuenta operativa, desde la que se atienden las órdenes de pago.</li>
<li><b>Caso límite:</b> una cuenta financiera con un depósito a plazo de excedentes: encaja en la letra d), pero debe respetar el art. 199.2 (liquidez y seguridad).</li>
</ul>`,noej:`<ul>
<li><b>No cabe</b> pagar directamente desde una cuenta restringida de recaudación.</li>
<li><b>No son ilimitadas</b> las cajas de efectivo: están sujetas a limitaciones reglamentarias.</li>
</ul>`,conex:`<ul>
<li><b>Art. 196.1.b):</b> unidad de caja, que estas cuentas sirven, no contradicen.</li>
<li><b>Art. 199.2:</b> condiciones de liquidez y seguridad de las inversiones.</li>
<li><b>Art. 190.3:</b> anticipos de caja fija, distintos de las cajas de efectivo del 197.2.</li>
</ul>`,trampas:`<ul>
<li><b>Cuatro</b> tipos de cuenta. Las dos restringidas son <b>de recaudación</b> y <b>de pagos</b>.</li>
<li>Las cajas de efectivo son para <b>operaciones diarias</b> y su límite es reglamentario.</li>
<li>No confundir <b>caja de efectivo</b> (art. 197.2) con <b>anticipo de caja fija</b> (art. 190.3).</li>
</ul>`,ancla:`<p><b>"Una que entra y sale, dos que solo hacen una cosa y una que renta."</b> Operativa · restringida de recaudación · restringida de pagos · financiera.</p>`,vis:`<svg viewBox="0 0 640 160" role="img" aria-label="Tipos de cuentas de la tesorería">

{n:198,t:"Medios de ingreso y de pago",ubic:"Título VI (Presupuesto y gasto público) ▸ Capítulo II (De la tesorería de las entidades locales)",idea:"Se cobra y se paga por cualquier medio admitido, bancario o no.",literal:`<p>1. Las entidades locales podrán dictar reglas especiales para el ingreso del producto de la recaudación de los recursos que podrán realizarse en las cajas de efectivo o en las entidades de crédito colaboradoras mediante efectivo, transferencias, cheques o cualquier otro medio o documento de pago, sean o no bancarios, que se establezcan.</p><p>2. Las entidades locales podrán asimismo pagar sus obligaciones por cualquiera de los medios a que se refiere el apartado anterior.</p>`,dis:`<ul>
<li><b>198.1 — ingresos:</b> las entidades pueden dictar <b>reglas especiales</b> para el ingreso del producto de la recaudación, que podrá hacerse en <b>cajas de efectivo</b> o en <b>entidades de crédito colaboradoras</b>, mediante <b>efectivo, transferencias, cheques o cualquier otro medio o documento de pago, sean o no bancarios</b>.</li>
<li><b>198.2 — pagos:</b> las entidades pueden pagar sus obligaciones por <b>cualquiera de esos medios</b>.</li>
</ul>`,llano:`<p>La ley no impone una forma concreta de cobrar o pagar: vale el efectivo, la transferencia, el cheque o cualquier otro medio, y puede hacerse en la caja municipal o a través de bancos colaboradores. Cada entidad puede fijar sus propias reglas.</p>`,porque:`<p>La norma es <b>deliberadamente abierta</b> para no quedar obsoleta: escrita antes de la generalización de los medios telemáticos, permite hoy la domiciliación, la pasarela de pago o el cargo en cuenta sin necesidad de reforma. La expresión "sean o no bancarios" es la que da esa flexibilidad.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> pagar una compra en efectivo, con tarjeta o por Bizum: el comercio decide qué admite.</li>
<li><b>Real:</b> un ayuntamiento permite pagar el IBI por domiciliación bancaria, en las entidades colaboradoras con carta de pago o mediante pasarela telemática en su sede electrónica.</li>
<li><b>Caso límite:</b> el pago de una obligación mediante compensación con una deuda del acreedor no es un "medio de pago" de este artículo, sino una forma de extinción regulada en la normativa tributaria y presupuestaria.</li>
</ul>`,noej:`<ul>
<li><b>No autoriza</b> este artículo a pagar sin orden de pago previa: los requisitos de los arts. 186 a 189 siguen siendo exigibles.</li>
</ul>`,conex:`<ul>
<li><b>Art. 197:</b> cuentas y cajas donde se materializan estos medios.</li>
<li><b>Art. 189:</b> requisitos previos a la expedición de órdenes de pago.</li>
<li><b>RD 203/2021</b> (documento 4 de la biblioteca): actuación por medios electrónicos, marco de los pagos telemáticos.</li>
</ul>`,trampas:`<ul>
<li>La enumeración es <b>abierta</b>: "cualquier otro medio o documento de pago, <b>sean o no bancarios</b>".</li>
<li>El apartado 2 se remite a los mismos medios del apartado 1: no hay lista distinta para pagos.</li>
</ul>`,ancla:`<p><b>"Como se cobra, se paga."</b> Un artículo simétrico y de lista abierta.</p>`,vis:`<svg viewBox="0 0 640 130" role="img" aria-label="Medios de ingreso y de pago">

<text x="320" y="66" text-anchor="middle" font-size="16" fill="var(--ink2)">⇄</text>
<rect x="360" y="30" width="240" height="66" rx="8" fill="var(--warn-bg)" stroke="var(--warn)"/>
<text x="480" y="52" text-anchor="middle" font-size="11" font-weight="700" fill="var(--warn)">PAGOS (198.2)</text>
<text x="480" y="72" text-anchor="middle" font-size="10" fill="currentColor">por cualquiera de los medios</text>
<text x="480" y="87" text-anchor="middle" font-size="10" fill="currentColor">del apartado anterior</text>
<text x="320" y="118" text-anchor="middle" font-size="10" fill="var(--ink2)">efectivo · transferencias · cheques · cualquier otro medio, sea o no bancario</text>
</svg>`},
{n:199,t:"Gestión de la tesorería",ubic:"Título VI (Presupuesto y gasto público) ▸ Capítulo II (De la tesorería de las entidades locales)",idea:"Si falta liquidez, operaciones de tesorería; si sobra, inversiones líquidas y seguras.",literal:`<p>1. Las entidades locales, de acuerdo con lo establecido en el artículo 51 de esta ley, podrán concertar, con cualesquiera entidades financieras, operaciones de tesorería para cubrir déficit temporales de liquidez derivados de las diferencias de vencimientos de sus pagos e ingresos.</p><p>2. Igualmente, las entidades locales podrán rentabilizar sus excedentes temporales de tesorería mediante inversiones que reúnan las condiciones de liquidez y seguridad.</p>`,dis:`<ul>
<li><b>199.1 — falta de liquidez:</b> conforme al <b>art. 51</b>, pueden concertarse con cualesquiera entidades financieras <span class="t" data-k="optesoreria">operaciones de tesorería</span> para cubrir <b>déficits temporales de liquidez</b> derivados de las diferencias de vencimientos de pagos e ingresos.</li>
<li><b>199.2 — exceso de liquidez:</b> pueden rentabilizarse los <span class="t" data-k="excedente">excedentes temporales</span> mediante inversiones que reúnan las condiciones de <b>liquidez y seguridad</b>.</li>
</ul>`,llano:`<p>El dinero no entra y sale al mismo ritmo: los impuestos se cobran en unos meses concretos y las nóminas se pagan todos. Cuando falta liquidez puntual, la entidad puede pedir un crédito a corto plazo; cuando sobra, puede colocarla, pero solo en productos seguros y de los que se pueda salir enseguida.</p>`,porque:`<p>La <b>operación de tesorería</b> no financia gasto nuevo: financia un <b>desfase temporal</b>, y por eso se distingue del endeudamiento a largo plazo del art. 49. Y la exigencia de <b>liquidez y seguridad</b> en las inversiones impide que el dinero público se destine a productos rentables pero volátiles: no se especula con fondos que hay que tener disponibles para pagar nóminas.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> una línea de crédito para llegar a fin de mes, no para comprarse un coche.</li>
<li><b>Real:</b> un ayuntamiento concierta una póliza de tesorería de 800.000 € en enero, que cancela en octubre con la recaudación del IBI.</li>
<li><b>Caso límite:</b> colocar el excedente en fondos de renta variable: incumple las condiciones de <b>liquidez y seguridad</b> del art. 199.2.</li>
</ul>`,noej:`<ul>
<li><b>No son operaciones de tesorería</b> los préstamos a largo plazo para financiar inversiones: esos van por los arts. 49 y ss.</li>
<li><b>No cabe</b> usar la operación de tesorería para financiar un déficit estructural.</li>
</ul>`,conex:`<ul>
<li><b>Art. 51:</b> régimen de las operaciones de tesorería (plazo y límite).</li>
<li><b>Art. 177.5:</b> operaciones de crédito para gasto corriente, con condiciones estrictas.</li>
<li><b>Art. 193.2:</b> operación de crédito ante remanente de tesorería negativo.</li>
</ul>`,trampas:`<ul>
<li>Las operaciones del 199.1 son para <b>déficits temporales de liquidez</b>, no para financiar gasto.</li>
<li>Las inversiones del 199.2 exigen <b>liquidez y seguridad</b>, dos condiciones, no una.</li>
</ul>`,ancla:`<p><b>"Si falta, póliza; si sobra, colchón seguro."</b> Nunca al revés, y nunca especulando.</p>`,vis:`<svg viewBox="0 0 640 135" role="img" aria-label="Gestión de la tesorería">
<rect x="40" y="30" width="250" height="70" rx="8" fill="var(--exc-bg)" stroke="var(--exc)"/>
<text x="165" y="53" text-anchor="middle" font-size="11" font-weight="700" fill="var(--exc)">Déficit temporal de liquidez</text>
<text x="165" y="74" text-anchor="middle" font-size="11" fill="currentColor">→ operaciones de tesorería</text>
<text x="165" y="90" text-anchor="middle" font-size="10" fill="var(--ink2)">art. 51 · corto plazo</text>
<rect x="350" y="30" width="250" height="70" rx="8" fill="var(--ej-bg)" stroke="var(--ej)"/>
<text x="475" y="53" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ej)">Excedente temporal</text>
<text x="475" y="74" text-anchor="middle" font-size="11" fill="currentColor">→ inversiones rentables</text>
<text x="475" y="90" text-anchor="middle" font-size="10" fill="var(--exc)">con liquidez y seguridad</text>
<text x="320" y="123" text-anchor="middle" font-size="10" fill="var(--ink2)">La operación de tesorería cubre desfases de vencimientos, no financia gasto nuevo</text>
</svg>`},
{n:200,t:"Régimen jurídico",ubic:"Título VI (Presupuesto y gasto público) ▸ Capítulo III (De la contabilidad) ▸ Sección 1.ª (Disposiciones generales)",idea:"Entidades, organismos y sociedades quedan bajo contabilidad pública.",literal:`<p>1. Las entidades locales y sus organismos autónomos quedan sometidos al régimen de contabilidad pública en los términos establecidos en esta ley.</p><p>2. Las sociedades mercantiles en cuyo capital tengan participación total o mayoritaria las entidades locales estarán igualmente sometidas al régimen de contabilidad pública, sin perjuicio de que se adapten a las disposiciones del Código de Comercio y demás legislación mercantil y al Plan General de Contabilidad vigente para las empresas españolas.</p>`,dis:`<ul>
<li><b>200.1:</b> las entidades locales y sus <b>organismos autónomos</b> quedan sometidos al régimen de <span class="t" data-k="contpublica">contabilidad pública</span> en los términos de esta ley.</li>
<li><b>200.2:</b> las <b>sociedades mercantiles</b> con participación <b>total o mayoritaria</b> de las entidades locales están <b>igualmente sometidas</b> al régimen de contabilidad pública, <b>sin perjuicio</b> de adaptarse al <b>Código de Comercio</b>, demás legislación mercantil y <b>Plan General de Contabilidad</b> de las empresas españolas.</li>
</ul>`,llano:`<p>Todo el grupo local lleva contabilidad pública, incluidas las empresas municipales. Las sociedades, además, siguen llevando su contabilidad mercantil: no eligen entre una y otra, hacen ambas cosas.</p>`,porque:`<p>Las sociedades mercantiles públicas viven en dos mundos: son empresas frente a terceros y dinero público frente al ciudadano. Someterlas a la contabilidad pública <b>sin liberarlas</b> de la mercantil permite que sus cuentas se integren en la cuenta general y en la consolidación (arts. 209.3 y 209.4) sin dejar de ser comparables con el sector privado.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> quien lleva la contabilidad de su negocio y además rinde cuentas a un socio que le exige su propio formato.</li>
<li><b>Real:</b> la empresa municipal de aguas formula sus cuentas anuales conforme al PGC de empresas y, a la vez, rinde información para la cuenta general del ayuntamiento.</li>
<li><b>Caso límite:</b> una sociedad con participación municipal del <b>55 %</b>: entra en el art. 200.2 (participación <b>mayoritaria</b>), aunque no se integre en la cuenta general del art. 209.1.c), que exige capital íntegro.</li>
</ul>`,noej:`<ul>
<li><b>No quedan exentas</b> las sociedades por llevar contabilidad mercantil.</li>
<li><b>No alcanza</b> el art. 200.2 a sociedades con participación minoritaria.</li>
</ul>`,conex:`<ul>
<li><b>Art. 209:</b> contenido de la cuenta general, donde se integran estas cuentas.</li>
<li><b>Art. 203.1.b):</b> adaptación del Plan General de Contabilidad Pública.</li>
<li><b>Art. 220:</b> control financiero, que alcanza a las sociedades dependientes.</li>
</ul>`,trampas:`<ul>
<li>Participación <b>total o mayoritaria</b> en el art. 200.2, frente al capital <b>íntegro</b> del art. 209.1.c).</li>
<li>La sujeción es acumulativa: contabilidad pública <b>y</b> mercantil.</li>
</ul>`,ancla:`<p><b>"Doble contabilidad legal para las empresas municipales."</b> Pública y mercantil, a la vez.</p>`,vis:`<svg viewBox="0 0 640 130" role="img" aria-label="Ámbito de la contabilidad pública local">
<rect x="30" y="30" width="270" height="66" rx="8" fill="var(--acc-soft)" stroke="var(--acc)"/>
<text x="165" y="53" text-anchor="middle" font-size="11" font-weight="700" fill="var(--acc)">Entidad local y organismos autónomos</text>
<text x="165" y="76" text-anchor="middle" font-size="10" fill="currentColor">contabilidad pública</text>
<rect x="345" y="30" width="270" height="66" rx="8" fill="var(--ej-bg)" stroke="var(--ej)"/>
<text x="480" y="50" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ej)">Sociedades con participación</text>
<text x="480" y="66" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ej)">total o mayoritaria</text>
<text x="480" y="86" text-anchor="middle" font-size="10" fill="currentColor">pública + Código de Comercio y PGC</text>
<text x="320" y="118" text-anchor="middle" font-size="10" fill="var(--ink2)">La contabilidad pública no sustituye a la mercantil: se suma a ella</text>
</svg>`},
{n:201,t:"Rendición de cuentas",ubic:"Título VI (Presupuesto y gasto público) ▸ Capítulo III (De la contabilidad) ▸ Sección 1.ª (Disposiciones generales)",idea:"Estar en contabilidad pública obliga a rendir cuentas al Tribunal de Cuentas.",literal:`<p>La sujeción al régimen de contabilidad pública lleva consigo la obligación de rendir cuentas de las respectivas operaciones, cualquiera que sea su naturaleza, al Tribunal de Cuentas.</p>`,dis:`<ul>
<li><b>Consecuencia de la sujeción:</b> obligación de <b>rendir cuentas</b> de las respectivas operaciones, <b>cualquiera que sea su naturaleza</b>, al <span class="t" data-k="tcuentas">Tribunal de Cuentas</span>.</li>
</ul>`,llano:`<p>La contabilidad pública no es un ejercicio interno: quien está sujeto a ella tiene que rendir cuentas fuera, ante el Tribunal de Cuentas. Es la bisagra entre la contabilidad (capítulo III) y el control externo (art. 223).</p>`,porque:`<p>Sin obligación de rendición, la contabilidad sería un instrumento de gestión sin consecuencias. Este artículo convierte el deber contable en <b>responsabilidad frente a un tercero independiente</b>, que es lo que cierra el círculo del control.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> llevar las cuentas de una asociación y tener que presentarlas cada año en asamblea.</li>
<li><b>Real:</b> el ayuntamiento rinde su cuenta general de 2026 al Tribunal de Cuentas antes del 15 de octubre de 2027 (art. 223.2), como consecuencia del deber del art. 201.</li>
</ul>`,noej:`<ul>
<li><b>No se limita</b> a las operaciones presupuestarias: alcanza a las de <b>cualquier naturaleza</b>.</li>
<li><b>No sustituye</b> la rendición al Tribunal de Cuentas a la fiscalización de los órganos autonómicos (art. 223.4).</li>
</ul>`,conex:`<ul>
<li><b>Art. 223:</b> control externo y plazo de rendición.</li>
<li><b>Art. 212.5:</b> el presidente rinde la cuenta general aunque el Pleno la rechace.</li>
<li><b>Art. 205.f):</b> proporcionar los datos para las cuentas y documentos que deban remitirse al Tribunal.</li>
</ul>`,trampas:`<ul>
<li>"<b>Cualquiera que sea su naturaleza</b>": también las operaciones no presupuestarias.</li>
<li>El destinatario es el <b>Tribunal de Cuentas</b>, sin perjuicio de los órganos autonómicos.</li>
</ul>`,ancla:`<p><b>"Contabilidad pública = rendir cuentas fuera."</b></p>`,vis:`<svg viewBox="0 0 640 110" role="img" aria-label="De la contabilidad pública a la rendición de cuentas">

{n:202,t:"Ejercicio contable",ubic:"Título VI (Presupuesto y gasto público) ▸ Capítulo III (De la contabilidad) ▸ Sección 1.ª (Disposiciones generales)",idea:"El ejercicio contable es el mismo que el presupuestario: el año natural.",literal:`<p>El ejercicio contable coincidirá con el ejercicio presupuestario.</p>`,dis:`<ul>
<li><b>Regla única:</b> el ejercicio contable <b>coincide</b> con el ejercicio presupuestario, que por el art. 163 es el <b>año natural</b>.</li>
</ul>`,llano:`<p>Contabilidad y presupuesto van al mismo compás: los dos empiezan el 1 de enero y terminan el 31 de diciembre. No hay dos calendarios.</p>`,porque:`<p>Si el ejercicio contable no coincidiera con el presupuestario, sería imposible comparar lo ejecutado con lo autorizado ni cuadrar la liquidación con el balance. Es una regla de <b>coherencia elemental</b> del sistema de información económica.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> llevar la agenda y las cuentas de casa con el mismo calendario.</li>
<li><b>Real:</b> la liquidación del presupuesto de 2026 (art. 191) y el balance a 31 de diciembre de 2026 se refieren exactamente al mismo periodo.</li>
</ul>`,noej:`<ul>
<li><b>No cabe</b> un ejercicio contable partido ni desplazado, ni siquiera en el año de constitución de la corporación.</li>
</ul>`,conex:`<ul>
<li><b>Art. 163:</b> el ejercicio presupuestario coincide con el año natural.</li>
<li><b>Art. 191:</b> cierre y liquidación a 31 de diciembre.</li>
</ul>`,trampas:`<ul>
<li>La coincidencia se establece con el <b>ejercicio presupuestario</b>, y es este el que el art. 163 iguala al <b>año natural</b>.</li>
</ul>`,ancla:`<p><b>"Un solo calendario."</b> 163 + 202 = 1 de enero a 31 de diciembre.</p>`,vis:`<svg viewBox="0 0 640 110" role="img" aria-label="Coincidencia del ejercicio contable y presupuestario">

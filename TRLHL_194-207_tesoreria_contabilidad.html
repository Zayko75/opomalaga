<text x="320" y="26" text-anchor="middle" font-size="11" fill="var(--ink2)">arts. 163 y 202: el mismo periodo</text>
</svg>`},
{n:203,t:"Competencia",ubic:"Título VI (Presupuesto y gasto público) ▸ Capítulo III (De la contabilidad) ▸ Sección 1.ª (Disposiciones generales)",idea:"Las normas contables las aprueba Hacienda a propuesta de la IGAE.",literal:`<p>1. Corresponderá al Ministerio de Hacienda a propuesta de la Intervención General de la Administración del Estado:</p><p>a) Aprobar las normas contables de carácter general a las que tendrá que ajustarse la organización de la contabilidad de los entes locales y sus organismos autónomos.</p><p>b) Aprobar la adaptación del Plan General de Contabilidad Pública para las entidades locales, su normativa de desarrollo y los planes especiales o parciales que se elaboren conforme a la misma, así como los de las entidades públicas empresariales y sociedades mercantiles con participación total o mayoritaria de las entidades locales, que se elaboren conforme al Plan General de Contabilidad de la empresa española.</p><p>c) Establecer los libros que, como regla general y con carácter obligatorio, deban llevarse.</p><p>d) Determinar la estructura y justificación de las cuentas, estados y demás documentos relativos a la contabilidad pública.</p><p>2. A los efectos previstos en el apartado anterior, serán objeto de tratamiento contable simplificado aquellas entidades locales cuyas características así lo requieran y que serán fijadas reglamentariamente por el Ministerio de Hacienda.</p>`,dis:`<ul>
<li><b>Competencia (203.1):</b> corresponde al <b>Ministerio de Hacienda</b>, a propuesta de la <span class="t" data-k="igae">IGAE</span>:
<ol><li><b>a)</b> aprobar las <b>normas contables generales</b> a las que debe ajustarse la organización de la contabilidad de los entes locales y sus organismos autónomos;</li>
<li><b>b)</b> aprobar la <b>adaptación del Plan General de Contabilidad Pública</b> a las entidades locales, su normativa de desarrollo y los planes especiales o parciales, así como los de las entidades públicas empresariales y sociedades con participación total o mayoritaria;</li>
<li><b>c)</b> establecer los <b>libros</b> obligatorios;</li>
<li><b>d)</b> determinar la <b>estructura y justificación</b> de las cuentas, estados y demás documentos.</li></ol></li>
<li><b>203.2 — tratamiento contable simplificado:</b> para las entidades cuyas características lo requieran, fijadas <b>reglamentariamente</b> por el Ministerio de Hacienda.</li>
</ul>`,llano:`<p>Igual que el Ministerio fija la estructura del presupuesto (art. 167), fija también la de la contabilidad: qué plan de cuentas se aplica, qué libros hay que llevar y cómo se presentan las cuentas. Y como no es lo mismo un municipio de 300 habitantes que una capital, existe un modelo simplificado.</p>`,porque:`<p>La normalización es la condición de la <b>comparabilidad y la agregación</b>: sin un plan común, las cuentas de 8.000 entidades serían inservibles para el Tribunal de Cuentas y para las estadísticas nacionales. El tratamiento simplificado responde al principio de <b>proporcionalidad</b>: la carga contable debe ser asumible por la entidad.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> el modelo oficial de contabilidad de una pyme frente al de una gran empresa.</li>
<li><b>Real:</b> las Instrucciones de los modelos normal, simplificado y básico de contabilidad local, aprobadas por Orden del Ministerio de Hacienda, desarrollan estas competencias.</li>
<li><b>Caso límite:</b> un ayuntamiento pequeño acogido al modelo simplificado presenta cuentas con menor detalle, conforme al art. 209.2, párrafo segundo.</li>
</ul>`,noej:`<ul>
<li><b>No corresponde</b> a cada entidad aprobar su plan de cuentas.</li>
<li><b>No lo decide</b> la IGAE por sí sola: <b>propone</b>, y el Ministerio aprueba.</li>
</ul>`,conex:`<ul>
<li><b>Art. 210:</b> misma técnica para el contenido y la estructura de las cuentas de la cuenta general.</li>
<li><b>Art. 167.1:</b> paralelo en la estructura presupuestaria.</li>
<li><b>Art. 209.2:</b> modelos simplificados de cuentas.</li>
</ul>`,trampas:`<ul>
<li>Cuatro competencias (a-d) y una <b>propuesta previa de la IGAE</b>.</li>
<li>El <b>tratamiento contable simplificado</b> lo fija reglamentariamente el Ministerio de Hacienda, no el Pleno.</li>
</ul>`,ancla:`<p><b>"Propone la IGAE, aprueba Hacienda"</b> — igual que en el art. 210. Cuatro cosas: <b>normas, plan, libros y estructura</b>.</p>`,vis:`<svg viewBox="0 0 640 140" role="img" aria-label="Competencias en materia contable">

<g font-size="10" text-anchor="middle" fill="currentColor">
<rect x="15" y="60" width="145" height="48" rx="6" fill="var(--panel)" stroke="var(--line)"/><text x="87" y="80" font-weight="700">a) Normas</text><text x="87" y="96">contables generales</text>
<rect x="172" y="60" width="145" height="48" rx="6" fill="var(--panel)" stroke="var(--line)"/><text x="244" y="80" font-weight="700">b) Plan de</text><text x="244" y="96">contabilidad pública</text>
<rect x="329" y="60" width="145" height="48" rx="6" fill="var(--panel)" stroke="var(--line)"/><text x="401" y="80" font-weight="700">c) Libros</text><text x="401" y="96">obligatorios</text>
<rect x="486" y="60" width="139" height="48" rx="6" fill="var(--panel)" stroke="var(--line)"/><text x="555" y="80" font-weight="700">d) Estructura</text><text x="555" y="96">de las cuentas</text>

{n:204,t:"Función contable de la Intervención",ubic:"Título VI (Presupuesto y gasto público) ▸ Capítulo III (De la contabilidad) ▸ Sección 1.ª (Disposiciones generales)",idea:"La contabilidad la lleva la Intervención, que además inspecciona la de sus entes.",literal:`<p>1. A la Intervención de las entidades locales le corresponde llevar y desarrollar la contabilidad financiera y el seguimiento, en términos financieros, de la ejecución de los presupuestos de acuerdo con las normas generales y las dictadas por el Pleno de la corporación.</p><p>2. Asimismo, competerá a la Intervención la inspección de la contabilidad de los organismos autónomos y de las sociedades mercantiles dependientes de la entidad local, de acuerdo con los procedimientos que establezca el Pleno.</p>`,dis:`<ul>
<li><b>204.1:</b> a la <span class="t" data-k="intervencion">Intervención</span> le corresponde <b>llevar y desarrollar la contabilidad financiera</b> y el <b>seguimiento, en términos financieros, de la ejecución de los presupuestos</b>, conforme a las normas generales y a las dictadas por el <b>Pleno</b>.</li>
<li><b>204.2:</b> le compete también la <b>inspección de la contabilidad</b> de los <b>organismos autónomos</b> y de las <b>sociedades mercantiles</b> dependientes, según los procedimientos que establezca el <b>Pleno</b>.</li>
</ul>`,llano:`<p>Quien lleva las cuentas del ayuntamiento es la Intervención, y además vigila las de los patronatos y empresas municipales. El Pleno puede dictar normas propias sobre cómo se hace y con qué procedimientos se inspecciona.</p>`,porque:`<p>Concentrar la contabilidad en el mismo órgano que fiscaliza asegura que quien controla <b>conoce el dato de primera mano</b>. La inspección de los entes dependientes evita que el grupo local tenga contabilidades opacas fuera del alcance del interventor, que es quien después formará la cuenta general (art. 212.2).</p>`,ej:`<ul>
<li><b>Cotidiano:</b> el contable de la empresa matriz que además revisa cómo llevan las cuentas las filiales.</li>
<li><b>Real:</b> la Intervención municipal lleva la contabilidad financiera y presupuestaria del ayuntamiento y realiza inspecciones periódicas de la contabilidad del patronato de deportes.</li>
</ul>`,noej:`<ul>
<li><b>No lleva</b> la Intervención la contabilidad mercantil de las sociedades: la <b>inspecciona</b>.</li>
<li><b>No es libre</b> el procedimiento de inspección: lo establece el <b>Pleno</b>.</li>
</ul>`,conex:`<ul>
<li><b>Art. 212.2:</b> la cuenta general la <b>forma la Intervención</b>.</li>
<li><b>Art. 213:</b> control interno, otra de sus funciones.</li>
<li><b>Art. 207:</b> información periódica al Pleno.</li>
</ul>`,trampas:`<ul>
<li>Llevar la contabilidad y ejercer el control interno son funciones <b>distintas</b> del mismo órgano.</li>
<li>Las normas propias y los procedimientos de inspección los dicta el <b>Pleno</b>.</li>
</ul>`,ancla:`<p><b>"El interventor anota, vigila e inspecciona."</b> Tres verbos, un solo órgano.</p>`,vis:`<svg viewBox="0 0 640 130" role="img" aria-label="Función contable de la Intervención">

{n:205,t:"Fines de la contabilidad pública local",ubic:"Título VI (Presupuesto y gasto público) ▸ Capítulo III (De la contabilidad) ▸ Sección 1.ª (Disposiciones generales)",idea:"Once fines: del balance al control, pasando por costes, tesorería y estadística.",literal:`<p>La contabilidad de los entes locales estará organizada al servicio de los siguientes fines:</p><p>a) Establecer el balance de la entidad local, poniendo de manifiesto la composición y situación de su patrimonio, así como sus variaciones.</p><p>b) Determinar los resultados desde un punto de vista económico-patrimonial.</p><p>c) Determinar los resultados analíticos poniendo de manifiesto el coste y rendimiento de los servicios.</p><p>d) Registrar la ejecución de los presupuestos generales de la entidad, poniendo de manifiesto los resultados presupuestarios.</p><p>e) Registrar los movimientos y situación de la tesorería local.</p><p>f) Proporcionar los datos necesarios para la formación de la cuenta general de la entidad, así como de las cuentas, estados y documentos que deban elaborarse o remitirse al Tribunal de Cuentas.</p><p>g) Facilitar la información necesaria para la confección de estadísticas económico- financieras por parte del Ministerio de Hacienda.</p><p>h) Facilitar los datos y demás antecedentes que sean precisos para la confección de las cuentas económicas del sector público y las nacionales de España.</p><p>i) Rendir la información económica y financiera que sea necesaria para la toma de decisiones, tanto en el orden político como en el de gestión.</p><p>j) Posibilitar el ejercicio de los controles de legalidad, financiero y de eficacia.</p><p>k) Posibilitar el inventario y el control del inmovilizado material, inmaterial y financiero, el control del endeudamiento y el seguimiento individualizado de la situación deudora o acreedora de los interesados que se relacionen con la entidad local.</p>`,dis:`<table><thead><tr><th>Grupo</th><th>Fines (art. 205)</th></tr></thead><tbody>
<tr><td><b>Patrimonio y resultados</b></td><td><b>a)</b> establecer el <b>balance</b> · <b>b)</b> determinar los <span class="t" data-k="respatrimonial">resultados económico-patrimoniales</span> · <b>c)</b> determinar los <span class="t" data-k="resanalitico">resultados analíticos</span>, con el coste y rendimiento de los servicios</td></tr>
<tr><td><b>Presupuesto y tesorería</b></td><td><b>d)</b> registrar la <b>ejecución de los presupuestos</b> y sus resultados · <b>e)</b> registrar los movimientos y situación de la <b>tesorería</b></td></tr>
<tr><td><b>Rendición e información</b></td><td><b>f)</b> datos para la <b>cuenta general</b> y para el Tribunal de Cuentas · <b>g)</b> estadísticas económico-financieras del Ministerio · <b>h)</b> cuentas económicas del sector público y nacionales de España · <b>i)</b> información para la <b>toma de decisiones</b> política y de gestión</td></tr>
<tr><td><b>Control y patrimonio</b></td><td><b>j)</b> posibilitar los controles de <b>legalidad, financiero y de eficacia</b> · <b>k)</b> inventario y control del <b>inmovilizado</b>, control del <b>endeudamiento</b> y seguimiento individualizado de deudores y acreedores</td></tr>
</tbody></table>`,llano:`<p>La contabilidad no sirve solo para saber cuánto se ha gastado. Sirve para saber qué tiene la entidad (balance), cuánto cuesta cada servicio, cómo va la caja, qué hay que rendir al Tribunal de Cuentas, qué datos van a las estadísticas nacionales y, sobre todo, para que los tres controles del art. 213 sean posibles.</p>`,porque:`<p>Enumerar los fines no es un adorno: la letra <b>j)</b> convierte la contabilidad en <b>presupuesto lógico del control</b>. Sin datos fiables no hay función interventora, ni control financiero, ni control de eficacia. Y la letra <b>c)</b> —resultados analíticos— es la que permite las memorias de coste y rendimiento del art. 211.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> una hoja de cálculo doméstica que sirve a la vez para saber lo que tienes, lo que debes, cuánto cuesta el coche y qué puedes permitirte el mes que viene.</li>
<li><b>Real:</b> del sistema contable municipal salen el balance de 2026, el coste por usuario de la escuela infantil, el estado de tesorería, la cuenta general y los datos que se remiten al Ministerio.</li>
</ul>`,noej:`<ul>
<li><b>No es un fin</b> de la contabilidad aprobar el presupuesto: eso es competencia del Pleno.</li>
<li><b>No se agota</b> en lo presupuestario: los fines patrimoniales y analíticos son igual de exigibles.</li>
</ul>`,conex:`<ul>
<li><b>Art. 208:</b> la cuenta general muestra los aspectos económico, financiero, patrimonial y presupuestario.</li>
<li><b>Art. 211:</b> memorias de coste y rendimiento, que se nutren de la letra c).</li>
<li><b>Art. 213:</b> los tres controles que la letra j) hace posibles.</li>
</ul>`,trampas:`<ul>
<li>Son <b>once</b> fines (a-k). Los más olvidados: <b>c)</b> resultados analíticos y <b>k)</b> inventario y endeudamiento.</li>
<li>La letra <b>j)</b> menciona los tres controles: <b>legalidad, financiero y de eficacia</b>.</li>
</ul>`,ancla:`<p><b>Cuatro bloques:</b> lo que <b>tengo</b> (balance y resultados), lo que <b>ejecuto</b> (presupuesto y tesorería), lo que <b>rindo</b> (cuenta general y estadísticas) y lo que <b>controlo</b> (los tres controles y el inventario).</p>`,vis:`<svg viewBox="0 0 640 165" role="img" aria-label="Fines de la contabilidad pública local">

<g font-size="10" text-anchor="middle" fill="currentColor">

<rect x="172" y="58" width="145" height="56" rx="8" fill="var(--ej-bg)" stroke="var(--ej)"/><text x="244" y="80" font-weight="700">Ejecución</text><text x="244" y="96">presupuesto y tesorería</text><text x="244" y="109" fill="var(--ink2)">d, e</text>
<rect x="329" y="58" width="145" height="56" rx="8" fill="var(--warn-bg)" stroke="var(--warn)"/><text x="401" y="80" font-weight="700">Rendición</text><text x="401" y="96">cuentas y estadísticas</text><text x="401" y="109" fill="var(--ink2)">f, g, h, i</text>
<rect x="486" y="58" width="139" height="56" rx="8" fill="var(--exc-bg)" stroke="var(--exc)"/><text x="555" y="80" font-weight="700">Control</text><text x="555" y="96">legalidad, financiero, eficacia</text><text x="555" y="109" fill="var(--ink2)">j, k</text>
</g>
<text x="320" y="145" text-anchor="middle" font-size="10" fill="var(--ink2)">Sin contabilidad fiable no hay control posible: la letra j) es la bisagra con el art. 213</text>
</svg>`},
{n:206,t:"Soporte de las anotaciones contables",ubic:"Título VI (Presupuesto y gasto público) ▸ Capítulo III (De la contabilidad) ▸ Sección 1.ª (Disposiciones generales)",idea:"Libros, registros y cuentas donde se anota absolutamente todo lo que tiene efecto económico.",literal:`<p>1. La contabilidad pública se llevará en libros, registros y cuentas según los procedimientos técnicos que sean más convenientes por la índole de las operaciones y de las situaciones que en ellos deban anotarse y de forma que facilite el cumplimiento de los fines señalados en el artículo anterior.</p><p>2. En los citados libros, registros y cuentas, se contabilizarán la totalidad de los actos u operaciones de carácter administrativo, civil o mercantil, con repercusión financiera, patrimonial o económica en general.</p>`,dis:`<ul>
<li><b>206.1 — soporte:</b> la contabilidad se lleva en <b>libros, registros y cuentas</b>, según los procedimientos técnicos más convenientes por la índole de las operaciones, de forma que se cumplan los fines del art. 205.</li>
<li><b>206.2 — universalidad:</b> se contabilizará la <b>totalidad</b> de los actos u operaciones de carácter <b>administrativo, civil o mercantil</b> con repercusión <b>financiera, patrimonial o económica</b> en general.</li>
</ul>`,llano:`<p>Todo lo que tenga efecto económico se anota, sea un acto administrativo, un contrato civil o una operación mercantil. Y se anota donde mejor convenga técnicamente: la ley no impone un soporte concreto, sino un resultado.</p>`,porque:`<p>La regla de <b>universalidad</b> del apartado 2 impide zonas de sombra: si algo tiene repercusión económica, existe contablemente. Y la flexibilidad del apartado 1 permite que la norma sobreviva a los cambios tecnológicos, del libro de papel al sistema informático.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> apuntar todos los movimientos, también los pequeños y los que no son "compras".</li>
<li><b>Real:</b> se contabilizan la adjudicación de un contrato (acto administrativo), la compra de un solar (civil) y la participación en una sociedad municipal (mercantil).</li>
</ul>`,noej:`<ul>
<li><b>No basta</b> con anotar lo presupuestario: la universalidad alcanza a todo lo que tenga repercusión económica.</li>
<li><b>No impone</b> la ley un soporte físico concreto.</li>
</ul>`,conex:`<ul>
<li><b>Art. 203.1.c):</b> el Ministerio establece los libros obligatorios.</li>
<li><b>Art. 205:</b> los fines que el soporte debe permitir cumplir.</li>
<li><b>RD 203/2021</b> (documento 4 de la biblioteca): actuación por medios electrónicos, marco actual de los soportes.</li>
</ul>`,trampas:`<ul>
<li>Tres soportes: <b>libros, registros y cuentas</b>.</li>
<li>Tres naturalezas de operación: <b>administrativa, civil o mercantil</b>.</li>
</ul>`,ancla:`<p><b>"Todo lo que mueve dinero, se anota."</b> Da igual de qué rama del derecho venga.</p>`,vis:`<svg viewBox="0 0 640 120" role="img" aria-label="Universalidad de las anotaciones contables">
<rect x="30" y="30" width="170" height="56" rx="8" fill="var(--acc-soft)" stroke="var(--acc)"/>

<rect x="235" y="30" width="170" height="56" rx="8" fill="var(--ej-bg)" stroke="var(--ej)"/>
<text x="320" y="53" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ej)">Operaciones civiles</text>
<rect x="440" y="30" width="170" height="56" rx="8" fill="var(--warn-bg)" stroke="var(--warn)"/>
<text x="525" y="53" text-anchor="middle" font-size="11" font-weight="700" fill="var(--warn)">Operaciones mercantiles</text>
<text x="320" y="78" text-anchor="middle" font-size="10" fill="currentColor">con repercusión financiera, patrimonial o económica</text>
<text x="320" y="106" text-anchor="middle" font-size="11" fill="var(--ink2)">→ se contabiliza la TOTALIDAD, en libros, registros y cuentas</text>
</svg>`},
{n:207,t:"Información periódica para el Pleno de la corporación",ubic:"Título VI (Presupuesto y gasto público) ▸ Capítulo III (De la contabilidad) ▸ Sección 1.ª (Disposiciones generales)",idea:"La Intervención informa al Pleno de ejecución y tesorería con la periodicidad que este fije.",literal:`<p>La Intervención de la entidad local remitirá al Pleno de la entidad, por conducto de la presidencia, información de la ejecución de los presupuestos y del movimiento de la tesorería por operaciones presupuestarias independientes y auxiliares del presupuesto y de su situación, en los plazos y con la periodicidad que el Pleno establezca.</p>`,dis:`<ul>
<li><b>Quién:</b> la <b>Intervención</b>, <b>por conducto de la presidencia</b>.</li>
<li><b>A quién:</b> al <b>Pleno</b> de la entidad.</li>
<li><b>Qué:</b> información de la <b>ejecución de los presupuestos</b> y del <b>movimiento de la tesorería</b> por operaciones presupuestarias <b>independientes y auxiliares</b> del presupuesto, y de su situación.</li>
<li><b>Cuándo:</b> en los <b>plazos y con la periodicidad que el Pleno establezca</b>.</li>
</ul>`,llano:`<p>El Pleno no puede esperar a la liquidación de marzo para saber cómo va el año. Este artículo obliga a la Intervención a informarle periódicamente de cómo va la ejecución y cómo está la caja, con la frecuencia que el propio Pleno decida.</p>`,porque:`<p>Es el <b>control político continuo</b>: sin información periódica, la oposición y el propio gobierno gobernarían a ciegas hasta el cierre. Que sea el Pleno quien fije la periodicidad respeta la autonomía local, pero la obligación de informar no es disponible.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> revisar el estado de la cuenta cada trimestre en lugar de esperar al resumen anual del banco.</li>
<li><b>Real:</b> las bases de ejecución fijan que la Intervención remita al Pleno, con periodicidad trimestral, el estado de ejecución del presupuesto y el estado de la tesorería.</li>
<li><b>Caso límite:</b> unas bases que guarden silencio sobre la periodicidad no eliminan la obligación: el Pleno debe fijarla.</li>
</ul>`,noej:`<ul>
<li><b>No sustituye</b> esta información a la liquidación (art. 191) ni a la cuenta general (art. 212).</li>
<li><b>No la remite</b> la Intervención directamente al Pleno: lo hace <b>por conducto de la presidencia</b>.</li>
</ul>`,conex:`<ul>
<li><b>Art. 204:</b> la Intervención lleva la contabilidad de la que sale esta información.</li>
<li><b>Art. 193.4:</b> dar cuenta al Pleno de la liquidación.</li>
<li><b>Art. 218.1:</b> otro informe de la Intervención al Pleno, el de reparos.</li>
</ul>`,trampas:`<ul>
<li>La remisión es <b>por conducto de la presidencia</b>: detalle literal muy preguntable.</li>
<li>La periodicidad la fija el <b>Pleno</b>, no la ley.</li>
<li>Se informa de <b>dos</b> cosas: ejecución del presupuesto y movimiento y situación de la tesorería.</li>
</ul>`,ancla:`<p><b>"La Intervención informa, el alcalde traslada, el Pleno decide cada cuánto."</b></p>`,vis:`<svg viewBox="0 0 640 120" role="img" aria-label="Información periódica al Pleno">

const TEST=[{"a": 194, "q": "La tesorería de las entidades locales está constituida por:", "o": [["todos los recursos financieros —dinero, valores o créditos— por operaciones presupuestarias y extrapresupuestarias", 1, "Correcto: art. 194.1 TRLHL."], ["únicamente el dinero en efectivo y las cuentas bancarias", 0, "Se quedaría fuera de la definición legal: también valores y créditos."], ["solo los fondos procedentes de operaciones presupuestarias", 0, "La ley incluye expresamente las extrapresupuestarias."], ["el patrimonio mobiliario e inmobiliario de la entidad", 0, "La tesorería es recursos financieros, no patrimonio en general."]]}, {"a": 194, "q": "Completa: «La tesorería se regirá por este capítulo y, en cuanto le sean de aplicación, por las normas del capítulo tercero del título cuarto de la Ley ______, General Presupuestaria».", "gap": "47/2003", "fb": "<b>Ley 47/2003</b>, de 26 de noviembre, General Presupuestaria (art. 194.3 TRLHL)."}, {"a": 196, "q": "¿Cuál NO es una función de la tesorería del art. 196.1?", "o": [["ordenar los pagos", 1, "Correcto: la ordenación de pagos corresponde al presidente (art. 186.1 TRLHL). La tesorería materializa el pago."], ["recaudar los derechos y pagar las obligaciones", 0, "Sí lo es: letra a)."], ["servir al principio de unidad de caja", 0, "Sí lo es: letra b)."], ["responder de los avales contraídos", 0, "Sí lo es: letra d)."]]}, {"a": 197, "q": "Las cuentas restringidas de recaudación:", "o": [["solo reciben ingresos, que después se trasladan a la cuenta operativa", 1, "Correcto: art. 197.1.b) TRLHL. Su carácter restringido es un mecanismo de control."], ["permiten pagar directamente a los acreedores", 0, "Para pagar están las cuentas operativas y las restringidas de pagos."], ["son las cuentas donde se colocan los excedentes", 0, "Esas son las financieras de la letra d)."], ["sustituyen a las cajas de efectivo", 0, "Las cajas de efectivo se regulan aparte, en el art. 197.2."]]}, {"a": 199, "q": "Las operaciones de tesorería del art. 199.1 sirven para financiar nuevos gastos no previstos en el presupuesto.", "vf": true, "ok": false, "fb": "<b>Falso.</b> Sirven para cubrir <b>déficits temporales de liquidez</b> derivados de las diferencias de vencimientos de pagos e ingresos. Para financiar gasto corriente con crédito hay que acudir al art. 177.5 TRLHL, con sus tres condiciones."}, {"a": 199, "q": "Las inversiones de excedentes temporales de tesorería deben reunir las condiciones de:", "o": [["liquidez y seguridad", 1, "Correcto: art. 199.2 TRLHL."], ["rentabilidad y plazo", 0, "No son las condiciones legales."], ["seguridad y rentabilidad máxima", 0, "La ley no persigue la máxima rentabilidad, sino la seguridad y la disponibilidad."], ["autorización previa del Ministerio de Hacienda", 0, "No se exige en este precepto."]]}, {"a": 200, "q": "Quedan sometidas al régimen de contabilidad pública las sociedades mercantiles en cuyo capital las entidades locales tengan participación:", "o": [["total o mayoritaria", 1, "Correcto: art. 200.2 TRLHL, sin perjuicio del Código de Comercio y del PGC."], ["íntegra únicamente", 0, "El capital íntegro es el criterio del art. 209.1.c) para integrar la cuenta general, no el del art. 200.2."], ["superior al 25 %", 0, "No es el criterio legal."], ["cualquiera, aunque sea minoritaria", 0, "Debe ser total o mayoritaria."]]}, {"a": 201, "q": "Completa: «La sujeción al régimen de contabilidad pública lleva consigo la obligación de rendir cuentas de las respectivas operaciones, cualquiera que sea su naturaleza, al ______».", "gap": "Tribunal de Cuentas", "fb": "Al <b>Tribunal de Cuentas</b> (art. 201 TRLHL). Enlaza con el art. 223, control externo."}, {"a": 203, "q": "Las normas contables generales de las entidades locales se aprueban por:", "o": [["el Ministerio de Hacienda, a propuesta de la IGAE", 1, "Correcto: art. 203.1 TRLHL, igual que en el art. 210 para la cuenta general."], ["el Pleno de cada entidad en las bases de ejecución", 0, "El Pleno dicta normas propias sobre la llevanza (art. 204.1), no el plan contable."], ["la Intervención General de la Administración del Estado por sí sola", 0, "La IGAE propone; el Ministerio aprueba."], ["el Tribunal de Cuentas", 0, "El Tribunal fiscaliza, no aprueba normas contables."]]}, {"a": 204, "q": "La inspección de la contabilidad de los organismos autónomos y sociedades dependientes corresponde a:", "o": [["la Intervención de la entidad local, según los procedimientos que establezca el Pleno", 1, "Correcto: art. 204.2 TRLHL."], ["la Tesorería", 0, "La tesorería gestiona fondos, no inspecciona contabilidad."], ["el Tribunal de Cuentas en exclusiva", 0, "El control externo no excluye la inspección interna."], ["el propio órgano de cada organismo", 0, "La ley atribuye la inspección a la Intervención."]]}, {"a": 205, "q": "¿Cuál de estos es un fin de la contabilidad pública local?", "o": [["determinar los resultados analíticos, poniendo de manifiesto el coste y rendimiento de los servicios", 1, "Correcto: art. 205.c) TRLHL, base de las memorias del art. 211."], ["aprobar el presupuesto general", 0, "Es competencia del Pleno, no un fin de la contabilidad."], ["fiscalizar los actos con contenido económico", 0, "Eso es la función interventora (art. 214); la contabilidad la <b>posibilita</b> (letra j)."], ["fijar la estructura presupuestaria", 0, "Corresponde al Ministerio por el art. 167 TRLHL."]]}, {"a": 206, "q": "Se contabilizará la totalidad de los actos u operaciones de carácter administrativo, civil o mercantil con repercusión económica.", "vf": true, "ok": true, "fb": "<b>Verdadero</b> (art. 206.2 TRLHL). Es la regla de universalidad de las anotaciones contables."}, {"a": 207, "q": "La información periódica sobre ejecución del presupuesto y tesorería se remite al Pleno:", "o": [["por la Intervención, por conducto de la presidencia, con la periodicidad que el Pleno establezca", 1, "Correcto: art. 207 TRLHL."], ["por la Tesorería, mensualmente", 0, "Ni el órgano ni la periodicidad son los del precepto."], ["por el presidente, trimestralmente por imperativo legal", 0, "La ley no fija la periodicidad: la fija el Pleno."], ["por la Intervención directamente, sin intervención de la presidencia", 0, "La ley dice expresamente «por conducto de la presidencia»."]]}, {"a": 202, "q": "El ejercicio contable puede no coincidir con el presupuestario si así lo acuerda el Pleno.", "vf": true, "ok": false, "fb": "<b>Falso.</b> El art. 202 TRLHL establece la coincidencia sin excepciones, y el art. 163 TRLHL fija el ejercicio presupuestario en el año natural."}, {"a": 196, "q": "Completa: «Son funciones de la tesorería servir al principio de ______ de caja, mediante la centralización de todos los fondos y valores».", "gap": "unidad", "fb": "Principio de <b>unidad de caja</b> (art. 196.1.b TRLHL)."}, {"a": 197, "q": "¿Qué diferencia hay entre una caja de efectivo (art. 197.2) y un anticipo de caja fija (art. 190.3)?", "o": [["la caja de efectivo atiende operaciones diarias de tesorería; el anticipo de caja fija es una provisión de fondos a un perceptor para gastos periódicos o repetitivos", 1, "Correcto: son figuras distintas, con regímenes distintos."], ["son la misma figura con dos nombres", 0, "No: una está en el capítulo de tesorería y otra en el de ejecución del gasto."], ["la caja de efectivo se justifica en tres meses", 0, "Ese es el plazo de los pagos a justificar del art. 190.2."], ["el anticipo de caja fija lo autoriza el Ministerio", 0, "Lo regulan las bases de ejecución, previo informe de la Intervención."]]}, {"a": 205, "q": "El art. 205.j) señala como fin de la contabilidad posibilitar los controles de:", "o": [["legalidad, financiero y de eficacia", 1, "Correcto, y coincide con las tres modalidades de control interno del art. 213 TRLHL."], ["legalidad y de oportunidad", 0, "El control de oportunidad está excluido de la función fiscalizadora (art. 218.1)."], ["externo e interno", 0, "No es la formulación del precepto."], ["previo y posterior", 0, "Tampoco es la formulación legal."]]}, {"a": 200, "q": "Las sociedades mercantiles locales quedan exentas de la contabilidad mercantil por estar sujetas a contabilidad pública.", "vf": true, "ok": false, "fb": "<b>Falso.</b> El art. 200.2 TRLHL las sujeta a contabilidad pública <b>sin perjuicio</b> de que se adapten al Código de Comercio, la legislación mercantil y el Plan General de Contabilidad."}, {"a": 195, "q": "Quedan sujetas a intervención y contabilidad pública:", "o": [["las disponibilidades de la tesorería y sus variaciones", 1, "Correcto: art. 195 TRLHL. No solo el saldo, también los movimientos."], ["solo los pagos superiores a 3.005,06 euros", 0, "Esa cifra pertenece al art. 219.1 sobre fiscalización previa."], ["únicamente las operaciones presupuestarias", 0, "También las extrapresupuestarias, que forman parte de la tesorería."], ["solo los movimientos de las cuentas operativas", 0, "Alcanza a toda la tesorería."]]}, {"a": 203, "q": "El tratamiento contable simplificado se establece:", "o": [["reglamentariamente por el Ministerio de Hacienda, para las entidades cuyas características lo requieran", 1, "Correcto: art. 203.2 TRLHL. Se refleja en el art. 209.2, párrafo segundo."], ["por acuerdo del Pleno de cada entidad", 0, "No es una decisión local."], ["para todos los municipios de menos de 5.000 habitantes por ley", 0, "El precepto no fija ese umbral: remite a la vía reglamentaria."], ["por el Tribunal de Cuentas", 0, "No es competencia suya."]]}];
const CASOS=[{"t": "Caso 1 · El circuito del dinero", "e": "Un ayuntamiento recibe el 20 de marzo 340.000 € de recaudación del IBI a través de una entidad colaboradora, tiene pendientes 90.000 € de fianzas de contratistas y necesita pagar el 25 de marzo nóminas por 410.000 €, pero su cuenta operativa solo tiene 180.000 €. <b>Explica dónde entra cada importe, qué principio se aplica y qué puede hacer para pagar.</b>", "s": "<p><b>1) La recaudación</b> entra en una <b>cuenta restringida de recaudación</b> (art. 197.1.b TRLHL) y se traspasa a la cuenta operativa. Es un ingreso presupuestario.</p><p><b>2) Las fianzas</b> son tesorería por operación <b>extrapresupuestaria</b> (art. 194.1 TRLHL): la entidad las custodia, no son ingreso propio. Aun así forman parte de la tesorería y quedan sujetas a intervención y contabilidad (art. 195 TRLHL).</p><p><b>3) El principio aplicable</b> es el de <b>unidad de caja</b> (art. 196.1.b TRLHL): todos los fondos se centralizan, de modo que la liquidez se gestiona en conjunto y la tesorería puede <b>distribuir en el tiempo</b> las disponibilidades (letra c).</p><p><b>4) Para pagar</b>: una vez traspasada la recaudación, hay liquidez suficiente. Si no la hubiera, cabría concertar una <b>operación de tesorería</b> a corto plazo (arts. 199.1 y 51 TRLHL) para cubrir el desfase, nunca para financiar gasto nuevo.</p><p><b>5) Prelación:</b> las nóminas tienen <b>prioridad legal</b> en el plan de disposición de fondos (art. 187 TRLHL), junto con las obligaciones de ejercicios anteriores.</p><p><b>Advertencia:</b> no pueden usarse las fianzas para pagar nóminas; son fondos de terceros, aunque estén en la misma caja.</p>"}, {"t": "Caso 2 · Quién hace qué en la contabilidad", "e": "En la misma entidad conviven: la Intervención, la Tesorería, el Pleno, el Ministerio de Hacienda, la IGAE y el Tribunal de Cuentas. <b>Asigna a cada uno su papel en materia contable y cita el artículo.</b>", "s": "<p><b>Ministerio de Hacienda</b>, a propuesta de la <b>IGAE</b>: aprueba las normas contables generales, la adaptación del Plan General de Contabilidad Pública, los libros obligatorios y la estructura de las cuentas (<b>art. 203.1 TRLHL</b>); y determina el contenido y estructura de las cuentas de la cuenta general (<b>art. 210 TRLHL</b>).</p><p><b>Intervención</b>: lleva y desarrolla la contabilidad financiera y el seguimiento de la ejecución presupuestaria, e inspecciona la de organismos y sociedades (<b>art. 204 TRLHL</b>); forma la cuenta general (<b>art. 212.2 TRLHL</b>); informa periódicamente al Pleno (<b>art. 207 TRLHL</b>).</p><p><b>Tesorería</b>: recauda, paga, centraliza y distribuye en el tiempo (<b>art. 196 TRLHL</b>). Sus disponibilidades y variaciones se contabilizan e intervienen (<b>art. 195 TRLHL</b>).</p><p><b>Pleno</b>: dicta las normas propias sobre llevanza de la contabilidad y los procedimientos de inspección (<b>art. 204 TRLHL</b>), fija la periodicidad de la información (<b>art. 207 TRLHL</b>) y aprueba la cuenta general antes del 1 de octubre (<b>art. 212.4 TRLHL</b>).</p><p><b>Tribunal de Cuentas</b>: destinatario de la rendición de cuentas (<b>art. 201 TRLHL</b>) y órgano de fiscalización externa, con rendición antes del 15 de octubre (<b>art. 223 TRLHL</b>).</p>"}, {"t": "Caso 3 · De la anotación al control", "e": "La interventora quiere justificar ante el equipo de gobierno por qué es imprescindible depurar el inventario y afinar la contabilidad analítica. <b>Construye el argumento a partir de los fines del art. 205 TRLHL y de sus conexiones con el resto del tema 8.</b>", "s": "<p><b>1) Sin inventario no hay balance fiable.</b> El art. 205.a) TRLHL exige establecer el balance con la composición y situación del patrimonio, y la letra k) impone el inventario y control del inmovilizado. El balance forma parte de la cuenta general (art. 209.2 TRLHL).</p><p><b>2) Sin contabilidad analítica no hay memorias.</b> El art. 205.c) TRLHL obliga a determinar los resultados analíticos con el coste y rendimiento de los servicios; en municipios de más de 50.000 habitantes esas magnitudes se plasman en las memorias que acompañan a la cuenta general (art. 211 TRLHL).</p><p><b>3) Sin datos no hay control.</b> El art. 205.j) TRLHL señala como fin posibilitar los controles de <b>legalidad, financiero y de eficacia</b>, que son las tres modalidades del control interno del art. 213 TRLHL. El control de eficacia del art. 221 TRLHL es imposible sin coste y rendimiento.</p><p><b>4) Sin información no hay rendición.</b> Las letras f), g) y h) del art. 205 TRLHL vinculan la contabilidad con la cuenta general, con las estadísticas del Ministerio y con las cuentas nacionales.</p><p><b>Conclusión:</b> depurar inventario y analítica no es una tarea contable menor: condiciona el balance, las memorias, el control de eficacia y la rendición al Tribunal de Cuentas.</p>"}];

const INTRO_HTML="<section class=\"card\" id=\"intro\"><h2>Bloque 5 del tema 8 · Tesorería y contabilidad</h2><p class=\"small\">Con este bloque queda cubierto el <b>Título VI completo</b> del TRLHL. La tesorería (arts. 194-199) es la caja por la que pasa físicamente el dinero; la contabilidad (arts. 200-207) es el sistema de información del que salen la liquidación, la cuenta general y todo el control.</p><div class=\"box ej\"><span class=\"lbl\">La idea que ordena todo el bloque</span>La ejecución del gasto termina en una <b>orden de pago</b> (art. 186); a partir de ahí entra la <b>tesorería</b>, que materializa cobros y pagos bajo el principio de <b>unidad de caja</b>. Y todo lo que ocurre —presupuestario o no— se anota en la <b>contabilidad</b>, que existe para que sean posibles la rendición de cuentas y los tres controles del art. 213.</div><div class=\"box warn\"><span class=\"lbl\">Fuente y vigencia</span><b>Norma utilizada:</b> Real Decreto Legislativo 2/2004, de 5 de marzo, por el que se aprueba el texto refundido de la Ley Reguladora de las Haciendas Locales (documento 5 de la biblioteca), texto consolidado con última modificación de <b>28 de enero de 2026</b>. Se citan además, como <b>aportación externa</b> no incluida en la biblioteca, la Ley 47/2003, General Presupuestaria (a la que remite el art. 194.3) y las Instrucciones de contabilidad local dictadas en desarrollo del art. 203. Verifica su vigencia en el BOE consolidado.</div><svg viewBox=\"0 0 660 215\" role=\"img\" aria-label=\"Mapa conceptual de tesorería y contabilidad\"><rect x=\"215\" y=\"8\" width=\"230\" height=\"36\" rx=\"9\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"330\" y=\"31\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"#fff\">DESPUÉS DE LA ORDEN DE PAGO</text><line x1=\"330\" y1=\"44\" x2=\"330\" y2=\"60\" stroke=\"var(--acc)\" stroke-width=\"2\"/><line x1=\"170\" y1=\"60\" x2=\"490\" y2=\"60\" stroke=\"var(--acc)\" stroke-width=\"2\"/><line x1=\"170\" y1=\"60\" x2=\"170\" y2=\"78\" stroke=\"var(--acc)\" stroke-width=\"2\"/><line x1=\"490\" y1=\"60\" x2=\"490\" y2=\"78\" stroke=\"var(--acc)\" stroke-width=\"2\"/><rect x=\"35\" y=\"78\" width=\"270\" height=\"122\" rx=\"9\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"170\" y=\"100\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"var(--acc)\">TESORERÍA · arts. 194-199</text><text x=\"170\" y=\"124\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">194 concepto · 195 control</text><text x=\"170\" y=\"146\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">196 funciones y unidad de caja</text><text x=\"170\" y=\"168\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">197 cuentas · 198 medios</text><text x=\"170\" y=\"190\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">199 liquidez y excedentes</text><rect x=\"355\" y=\"78\" width=\"270\" height=\"122\" rx=\"9\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"490\" y=\"100\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"var(--ej)\">CONTABILIDAD · arts. 200-207</text><text x=\"490\" y=\"124\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">200 ámbito · 201 rendición</text><text x=\"490\" y=\"146\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">202 ejercicio · 203 competencias</text><text x=\"490\" y=\"168\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">204 Intervención · 205 fines</text><text x=\"490\" y=\"190\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">206 soporte · 207 información</text></svg></section>";
const RESUMEN_HTML="<section class=\"card\" id=\"resumen\"><h2>Resumen ejecutivo</h2><p class=\"small\"><b>Norma:</b> RDLeg 2/2004, TRLHL, Título VI, capítulos II y III.</p><table><tbody><tr><th style=\"width:60px\">194</th><td>Tesorería: <b>dinero, valores y créditos</b>, presupuestarios y extrapresupuestarios. Supletoria: Ley 47/2003.</td></tr><tr><th>195</th><td>Disponibilidades y variaciones sujetas a <b>intervención</b> y <b>contabilidad pública</b>.</td></tr><tr><th>196</th><td>Funciones: recaudar y pagar · <b>unidad de caja</b> · distribuir en el tiempo · responder de avales · conexas. Unidad central de tesorería del art. 186.</td></tr><tr><th>197</th><td>Cuentas: operativas · restringidas de recaudación · restringidas de pagos · financieras. Más cajas de efectivo con límites reglamentarios.</td></tr><tr><th>198</th><td>Ingresos y pagos por cualquier medio, <b>sea o no bancario</b>.</td></tr><tr><th>199</th><td>Déficit temporal → <b>operación de tesorería</b> (art. 51). Excedente → inversiones con <b>liquidez y seguridad</b>.</td></tr><tr><th>200</th><td>Contabilidad pública para entidad, organismos y sociedades de participación <b>total o mayoritaria</b>, sin perjuicio de la mercantil.</td></tr><tr><th>201</th><td>Obligación de <b>rendir cuentas al Tribunal de Cuentas</b>, cualquiera que sea la naturaleza de las operaciones.</td></tr><tr><th>202</th><td>Ejercicio contable = ejercicio presupuestario = <b>año natural</b> (art. 163).</td></tr><tr><th>203</th><td><b>Ministerio de Hacienda</b>, a propuesta de la <b>IGAE</b>: normas, plan contable, libros y estructura. Tratamiento simplificado por vía reglamentaria.</td></tr><tr><th>204</th><td>La <b>Intervención</b> lleva la contabilidad e <b>inspecciona</b> la de organismos y sociedades, según los procedimientos del Pleno.</td></tr><tr><th>205</th><td><b>Once fines</b>: balance · resultados económico-patrimoniales · <b>analíticos</b> · ejecución presupuestaria · tesorería · cuenta general · estadísticas · cuentas nacionales · decisiones · <b>controles de legalidad, financiero y de eficacia</b> · inventario y endeudamiento.</td></tr><tr><th>206</th><td>Libros, registros y cuentas; se contabiliza la <b>totalidad</b> de operaciones administrativas, civiles o mercantiles con repercusión económica.</td></tr><tr><th>207</th><td>La Intervención informa al <b>Pleno por conducto de la presidencia</b>, con la periodicidad que el Pleno fije.</td></tr></tbody></table><h2 style=\"margin-top:1.2rem\">Calendario de repaso espaciado</h2><table><thead><tr><th>Momento</th><th>Fecha</th><th>Qué hacer</th></tr></thead><tbody id=\"calbody\"></tbody></table></section>";

/* Reveal on scroll para las tarjetas */
function reveal(){
  var els=document.querySelectorAll("section.card:not(.rv)");
  if(!els.length)return;
  if(!("IntersectionObserver" in window)){return;}
  var io=new IntersectionObserver(function(es){
    es.forEach(function(en){if(en.isIntersecting){en.target.classList.add("in");io.unobserve(en.target);}});
  },{threshold:.06,rootMargin:"0px 0px -30px 0px"});
  Array.prototype.forEach.call(els,function(el){el.classList.add("rv");io.observe(el);});
}

/* Sección activa en el índice lateral */
function spy(){
  var links=document.querySelectorAll("nav.side a[href^='#']");
  if(!links.length||!("IntersectionObserver" in window))return;
  var map={};
  Array.prototype.forEach.call(links,function(a){
    var t=document.getElementById(a.getAttribute("href").slice(1));
    if(t)map[t.id]=a;
  });
  var io=new IntersectionObserver(function(es){
    es.forEach(function(en){
      if(en.isIntersecting){
        Array.prototype.forEach.call(links,function(a){a.classList.remove("on");});
        if(map[en.target.id])map[en.target.id].classList.add("on");
      }
    });
  },{rootMargin:"-80px 0px -70% 0px",threshold:0});
  Object.keys(map).forEach(function(id){io.observe(document.getElementById(id));});
}

<script>


/* ═══ Parser de respuestas: estructura semántica ═══ */
var FCFMT=(function(){
  var CITA=/\s*\(((?:arts?\.|DA\b|DT\b|disp\.)[^)]*)\)\s*\.?\s*$/i;
  var strip=function(h){return h.replace(/<[^>]+>/g,"");};

  function esc(s){return s;}

  function parse(raw){
    var out={verdict:null,cite:null,kind:"p",items:[],text:""};
    var body=String(raw).trim();

    /* 1 ── Cita legal al final */
    var m=body.match(CITA);
    if(m){out.cite=m[1].replace(/\s+/g," ").trim();body=body.slice(0,m.index).trim();}
    body=body.replace(/[.;,\s]+$/,"");

    /* 2 ── Veredicto Sí / No inicial */
    var v=strip(body).match(/^(Sí|Sí,|No|No,)[.:,]?\s/);
    if(v){
      out.verdict=/^Sí/.test(v[1])?"si":"no";
      body=body.replace(/^(<[^>]+>\s*)*(Sí|No)[.,:]?\s*/,"").trim();
      body=body.replace(/^en\s/,"En ");
    }

    /* 3 ── Enumeración con · */
    var parts=body.split(/\s+·\s+/);
    if(parts.length>=2){
      out.kind="list";
      var letras=parts.filter(function(p){return /^\s*<?[a-h]\)/.test(strip(p));}).length;
      out.marker = letras>=parts.length-1 ? "alpha" : "num";
      out.items=parts.map(function(p){
        return p.replace(/^\s*[a-h]\)\s*/,"").replace(/[.\s]+$/,"").trim();
      }).filter(Boolean);
      return out;
    }

    /* 4 ── Cláusulas contrapuestas con ; */
    var semi=body.split(/;\s+/);
    if(semi.length>=2&&semi.length<=3&&semi.every(function(s){return strip(s).length>14;})){
      out.kind="clauses";
      out.items=semi.map(function(s){return s.replace(/[.\s]+$/,"").trim();});
      return out;
    }

    /* 5 ── Párrafo */
    out.text=body;
    return out;
  }

  function render(raw){
    var d=parse(raw),h="";

    if(d.verdict){
      h+='<span class="fc-verdict '+d.verdict+'">'+(d.verdict==="si"?"✓ Sí":"✗ No")+'</span>';
    }

    if(d.kind==="list"){
      h+='<ol class="fc-list '+d.marker+'">';
      d.items.forEach(function(it){h+='<li>'+it+'</li>';});
      h+='</ol>';
    }else if(d.kind==="clauses"){
      h+='<div class="fc-clauses">';
      d.items.forEach(function(it){h+='<p>'+it+'</p>';});
      h+='</div>';
    }else if(d.text){
      h+='<p class="fc-p">'+d.text+'</p>';
    }

    if(d.cite){
      h+='<span class="fc-cite"><span class="s">§</span>'+d.cite+'</span>';
    }
    return {html:h,struct:(d.kind!=="p"||!!d.verdict||strip(raw).length>150)};
  }
  return {parse:parse,render:render};
})();

    +'<span class="fc-hint" style="position:static;display:inline;color:inherit">'
    +'<span class="kbd">espacio</span> girar · <span class="kbd">→</span> lo sabía · <span class="kbd">←</span> repasar</span>';
  sec.appendChild(intro);

  var stage=document.createElement("div");
  stage.className="fc-stage";
  stage.innerHTML=
    '<div class="fc-deck" id="fcdeck">'
    +'<span class="fc-ghost g2"></span><span class="fc-ghost g1"></span>'
    +'<div class="fc-lift" id="fclift">'
      +'<div class="fc-card" id="fcbox" tabindex="0" role="button" aria-label="Tarjeta. Pulsa para girar">'
        +'<div class="fc-face fc-front">'
          +'<span class="fc-tag">Pregunta</span><span class="fc-pip tr"></span><span class="fc-pip bl"></span>'
          +'<div class="fc-txt"></div>'
          +'<span class="fc-hint">Pulsa para girar</span>'
        +'</div>'
        +'<div class="fc-face fc-back">'
          +'<span class="fc-tag">Respuesta</span><span class="fc-pip tr"></span><span class="fc-pip bl"></span>'
          +'<div class="fc-txt"></div>'
          +'<span class="fc-hint">¿La sabías?</span>'
        +'</div>'
      +'</div>'
    +'</div></div>';
  sec.appendChild(stage);

  var bar=document.createElement("div");
  bar.className="fc-bar";bar.innerHTML="<i></i>";
  sec.appendChild(bar);

  var ctr=document.createElement("div");
  ctr.className="fc-ctrls noprint";
  ctr.innerHTML='<button id="fcflip">⟲ Girar</button>'
    +'<button id="fcok">✔ Lo sabía</button>'
    +'<button id="fcko">↻ Repasar</button>'
    +'<button id="fcreset">Reiniciar</button>'
    +'<span class="fc-score">'
      +'<span class="fc-pill ok" id="fcpok">0 sabidas</span>'
      +'<span class="fc-pill ko" id="fcpko">0 repasar</span>'
      +'<span class="fc-pill left" id="fccount">0</span>'
    +'</span>';
  sec.appendChild(ctr);

  var deck=stage.querySelector("#fcdeck"), lift=stage.querySelector("#fclift"),
      card=stage.querySelector("#fcbox"),
      front=stage.querySelector(".fc-front"), backf=stage.querySelector(".fc-back"),
      fill=bar.querySelector("i"),
      pok=ctr.querySelector("#fcpok"), pko=ctr.querySelector("#fcpko"),
      pleft=ctr.querySelector("#fccount");
  var rot=0;

  function reset(){
    order=CARDS.map(function(_,i){return i;});
    fi=0;ok=0;ko=0;back=false;busy=false;rot=0;
    card.style.transition="none";card.style.transform="rotateY(0deg)";
    void card.offsetWidth;card.style.transition="";
    deck.classList.remove("empty");
    var d=stage.querySelector(".fc-done");if(d)d.remove();
    card.style.display="";
    draw();
  }

  function bump(el){el.classList.remove("bump");void el.offsetWidth;el.classList.add("bump");}

  function draw(){
    pok.textContent=ok+(ok===1?" sabida":" sabidas");
    pko.textContent=ko+" repasar";
    var done=N-order.length;
    fill.style.width=(N?done/N*100:0)+"%";

    if(!order.length){
      pleft.textContent="0 quedan";
      deck.classList.add("empty");
      card.style.display="none";
      if(!stage.querySelector(".fc-done")){
        var d=document.createElement("div");
        d.className="fc-done";
        d.innerHTML='<span class="seal">🏆</span><h3>Ronda completada</h3>'
          +'<p>'+ok+' de '+N+' a la primera'+(ko?' · '+ko+' necesitaron repaso':'')+'</p>';
        deck.appendChild(d);
      }
      return;
    }
    if(fi>=order.length)fi=0;
    pleft.textContent=order.length+(order.length===1?" queda":" quedan");

    var c=CARDS[order[fi]];
    front.querySelector(".fc-txt").innerHTML='<p class="fc-p">'+c[0]+'</p>';
    var r=FCFMT.render(c[1]);
    backf.querySelector(".fc-txt").innerHTML=r.html;
    backf.classList.toggle("struct",r.struct);
    var hint=backf.querySelector(".fc-hint");
    if(hint)hint.classList.toggle("muted",/fc-cite/.test(r.html));
    var pip=(done+1)+"/"+N;
    Array.prototype.forEach.call(stage.querySelectorAll(".fc-pip"),function(p){p.textContent=pip;});
  }

  function flip(){
    if(busy||!order.length)return;
    back=!back;rot+=180;
    card.style.transform="rotateY("+rot+"deg)";
    card.setAttribute("aria-label",back?"Respuesta. Pulsa para volver":"Pregunta. Pulsa para girar");
    lift.classList.remove("lift");void lift.offsetWidth;lift.classList.add("lift");
  }

  function next(good){
    if(busy||!order.length)return;
    busy=true;
    if(good){ok++;bump(pok);}else{ko++;bump(pko);}
    lift.classList.remove("lift");
    lift.classList.add(good?"out-ok":"out-ko");
    setTimeout(function(){
      if(good){order.splice(fi,1);}
      else{var m=order.splice(fi,1)[0];order.push(m);}
      back=false;rot=0;
      card.style.transition="none";card.style.transform="rotateY(0deg)";
      void card.offsetWidth;card.style.transition="";
      draw();
      lift.classList.remove("out-ok","out-ko");
      lift.classList.add("in");
      setTimeout(function(){lift.classList.remove("in");busy=false;},480);
    },460);
  }

  card.onclick=flip;
  card.onkeydown=function(e){
    if(e.key===" "||e.key==="Enter"){e.preventDefault();flip();}
    if(e.key==="ArrowRight"){e.preventDefault();next(true);}
    if(e.key==="ArrowLeft"){e.preventDefault();next(false);}
  };
  ctr.querySelector("#fcflip").onclick=flip;
  ctr.querySelector("#fcok").onclick=function(){next(true);};
  ctr.querySelector("#fcko").onclick=function(){next(false);};
  ctr.querySelector("#fcreset").onclick=reset;

  /* Deslizar en táctil */
  var x0=null,y0=null;
  card.addEventListener("touchstart",function(e){x0=e.touches[0].clientX;y0=e.touches[0].clientY;},{passive:true});

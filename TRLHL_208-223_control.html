{n:215,t:"Reparos",ubic:"Título VI (Presupuesto y gasto público) ▸ Capítulo IV (Control y fiscalización)",idea:"Si el interventor está en desacuerdo, lo pone por escrito antes del acuerdo.",literal:`<p>Si en el ejercicio de la función interventora el órgano interventor se manifestara en desacuerdo con el fondo o con la forma de los actos, documentos o expedientes examinados, deberá formular sus reparos por escrito antes de la adopción del acuerdo o resolución.</p>`,dis:`<ul>
<li><b>Presupuesto de hecho:</b> desacuerdo del órgano interventor con el <b>fondo o la forma</b> de los actos, documentos o expedientes examinados.</li>
<li><b>Forma:</b> <span class="t" data-k="reparo">reparos</span> <b>por escrito</b>.</li>
<li><b>Momento:</b> <b>antes</b> de la adopción del acuerdo o resolución.</li>
<li><b>Carácter:</b> es un <b>deber</b> ("deberá formular"), no una facultad.</li>
</ul>`,llano:`<p>Cuando el interventor ve algo que no cuadra —por el fondo o por la forma— tiene que decirlo por escrito y decirlo antes, no después de que se firme. Ese escrito es el reparo.</p>`,porque:`<p>Un control que llega después del acuerdo ya no evita el daño: solo lo documenta. Exigir que el reparo sea <b>previo y escrito</b> convierte la advertencia en un obstáculo real y, además, deja rastro: ese papel es el que después exonera al interventor (art. 188) y el que se remite al Tribunal de Cuentas (art. 218.3).</p>`,ej:`<ul>
<li><b>Cotidiano:</b> el asesor que te avisa por escrito, antes de firmar el contrato, de que una cláusula es ilegal.</li>
<li><b>Real:</b> la interventora detecta que un expediente de contratación carece del informe jurídico preceptivo y formula reparo por escrito antes de que la Junta de Gobierno adjudique.</li>
<li><b>Caso límite:</b> reparo por el <b>fondo</b> (el gasto carece de crédito adecuado) frente a reparo por la <b>forma</b> (falta un trámite). Ambos caben en el art. 215; sus efectos suspensivos dependen del art. 216.</li>
</ul>`,noej:`<ul>
<li><b>No es reparo</b> una advertencia verbal ni una nota informal.</li>
<li><b>No cabe</b> reparar después de adoptado el acuerdo: para eso está el control financiero posterior.</li>
</ul>`,conex:`<ul>
<li><b>Art. 216:</b> efectos del reparo, con o sin suspensión.</li>
<li><b>Art. 217:</b> resolución de las discrepancias.</li>
<li><b>Art. 188:</b> la advertencia escrita exonera de responsabilidad personal al interventor.</li>
</ul>`,trampas:`<ul>
<li>Cabe reparo por el <b>fondo o por la forma</b>: no solo por falta de crédito.</li>
<li>Siempre <b>por escrito</b> y <b>antes</b> del acuerdo.</li>
</ul>`,ancla:`<p><b>"Por escrito y antes."</b> Un reparo tardío o verbal no es un reparo.</p>`,vis:`<svg viewBox="0 0 640 125" role="img" aria-label="El reparo del órgano interventor">
<rect x="40" y="35" width="200" height="55" rx="8" fill="var(--panel)" stroke="var(--line)"/>
<text x="140" y="57" text-anchor="middle" font-size="11" font-weight="700" fill="currentColor">Expediente examinado</text>
<text x="140" y="76" text-anchor="middle" font-size="10" fill="var(--ink2)">desacuerdo en fondo o forma</text>
<text x="270" y="66" text-anchor="middle" font-size="16" fill="var(--warn)">→</text>
<rect x="300" y="35" width="300" height="55" rx="8" fill="var(--warn-bg)" stroke="var(--warn)"/>
<text x="450" y="57" text-anchor="middle" font-size="12" font-weight="700" fill="var(--warn)">REPARO POR ESCRITO</text>
<text x="450" y="76" text-anchor="middle" font-size="11" fill="currentColor">antes de la adopción del acuerdo o resolución</text>
<text x="320" y="113" text-anchor="middle" font-size="10" fill="var(--ink2)">Es un deber del órgano interventor, no una facultad</text>
</svg>`},
{n:216,t:"Efectos de los reparos",ubic:"Título VI (Presupuesto y gasto público) ▸ Capítulo IV (Control y fiscalización)",idea:"El reparo de ingresos no para nada; el de gastos suspende en cuatro casos.",literal:`<p>1. Cuando la disconformidad se refiera al reconocimiento o liquidación de derechos a favor de las entidades locales o sus organismos autónomos, la oposición se formalizará en nota de reparo que, en ningún caso, suspenderá la tramitación del expediente.</p><p>2. Si el reparo afecta a la disposición de gastos, reconocimiento de obligaciones u ordenación de pagos, se suspenderá la tramitación del expediente hasta que aquél sea solventado en los siguientes casos:</p><p>a) Cuando se base en la insuficiencia de crédito o el propuesto no sea adecuado.</p><p>b) Cuando no hubieran sido fiscalizados los actos que dieron origen a las órdenes de pago.</p><p>c) En los casos de omisión en el expediente de requisitos o trámites esenciales.</p><p>d) Cuando el reparo derive de comprobaciones materiales de obras, suministros, adquisiciones y servicios.</p>`,dis:`<div class="grid2">
<div class="box ej"><span class="lbl">Reparo en INGRESOS (216.1)</span>Si la disconformidad se refiere al <b>reconocimiento o liquidación de derechos</b>, se formaliza en <b>nota de reparo</b> que <b>en ningún caso suspende</b> la tramitación del expediente.</div>
<div class="box exc"><span class="lbl">Reparo en GASTOS (216.2)</span>Si afecta a la <b>disposición de gastos</b>, <b>reconocimiento de obligaciones</b> u <b>ordenación de pagos</b>, <b>suspende</b> la tramitación hasta que se solvente, pero <b>solo en cuatro casos</b>.</div>
</div>
<table><thead><tr><th>Casos en que el reparo suspende (216.2)</th></tr></thead><tbody>
<tr><td><b>a)</b> Insuficiencia de crédito o crédito propuesto <b>no adecuado</b></td></tr>
<tr><td><b>b)</b> No haberse fiscalizado los actos que dieron origen a las órdenes de pago</td></tr>
<tr><td><b>c)</b> Omisión en el expediente de <b>requisitos o trámites esenciales</b></td></tr>
<tr><td><b>d)</b> Reparo derivado de <b>comprobaciones materiales</b> de obras, suministros, adquisiciones y servicios</td></tr>
</tbody></table>`,llano:`<p>Si el interventor repara algo relacionado con cobrar, deja constancia pero el expediente sigue: nadie se arruina por cobrar de más o de menos con un papel mal hecho. Si repara algo relacionado con gastar, la cosa se para... pero solo en cuatro supuestos graves: falta de dinero, falta de fiscalización previa, falta de un trámite esencial o que la comprobación de la obra no cuadre.</p>`,porque:`<p>La suspensión es un arma poderosa: si cualquier reparo paralizara, la gestión se bloquearía. La ley la reserva a los casos en que continuar produciría un <b>daño irreversible o una ilegalidad grave</b>: gastar sin dinero, pagar sin control previo, saltarse un trámite esencial o pagar una obra que no está hecha. En los ingresos no hay riesgo equivalente, y por eso el reparo nunca suspende.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> el freno de mano solo se usa en cuesta: no en cada semáforo.</li>
<li><b>Real:</b> la Intervención repara el reconocimiento de una obligación de 78.000 € por insuficiencia de crédito: el expediente <b>queda suspendido</b> (216.2.a). En cambio, repara la liquidación de una tasa por error en el sujeto pasivo: se formaliza nota de reparo y el expediente <b>continúa</b> (216.1).</li>
<li><b>Caso límite:</b> reparo por falta de un informe no esencial en un expediente de gasto: no encaja en las cuatro letras, así que <b>no suspende</b>, aunque deja constancia y puede acabar en el informe al Pleno del art. 218.</li>
</ul>`,noej:`<ul>
<li><b>No suspende</b> todo reparo de gasto: solo los de las cuatro letras.</li>
<li><b>No suspende nunca</b> el reparo de ingresos.</li>
<li><b>No es lo mismo</b> "requisitos o trámites esenciales" que cualquier defecto formal.</li>
</ul>`,conex:`<ul>
<li><b>Art. 215:</b> el reparo del que se predican estos efectos.</li>
<li><b>Art. 217:</b> quién resuelve si el gestor no está de acuerdo.</li>
<li><b>Art. 173.5:</b> nulidad del gasto sin crédito, que explica la letra a).</li>
<li><b>Art. 214.2.d):</b> comprobaciones materiales, origen de la letra d).</li>
</ul>`,trampas:`<ul>
<li>"En ningún caso suspenderá" se predica de los <b>ingresos</b>.</li>
<li>Las cuatro letras hay que saberlas: <b>crédito · falta de fiscalización previa · trámites esenciales · comprobación material</b>.</li>
<li>El ámbito del 216.2 son <b>disposición de gastos, reconocimiento de obligaciones y ordenación de pagos</b>: fases D, O y P.</li>
</ul>`,ancla:`<p><b>"Cobrar no para; gastar para, y solo por CUATRO."</b><br><b>C-F-T-C</b>: <b>C</b>rédito · <b>F</b>iscalización omitida · <b>T</b>rámites esenciales · <b>C</b>omprobación material.</p>`,vis:`<svg viewBox="0 0 640 205" role="img" aria-label="Efectos suspensivos del reparo">
<rect x="215" y="8" width="210" height="34" rx="8" fill="var(--acc-soft)" stroke="var(--acc)"/>
<text x="320" y="30" text-anchor="middle" font-size="12" font-weight="700" fill="var(--acc)">REPARO (art. 215)</text>
<path d="M270 42 L 170 60" stroke="var(--ej)" stroke-width="2"/><path d="M370 42 L 470 60" stroke="var(--exc)" stroke-width="2"/>
<rect x="30" y="62" width="270" height="52" rx="8" fill="var(--ej-bg)" stroke="var(--ej)"/>
<text x="165" y="83" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ej)">INGRESOS · derechos</text>
<text x="165" y="102" text-anchor="middle" font-size="11" fill="currentColor">nota de reparo · NO suspende nunca</text>
<rect x="340" y="62" width="270" height="52" rx="8" fill="var(--exc-bg)" stroke="var(--exc)"/>
<text x="475" y="83" text-anchor="middle" font-size="11" font-weight="700" fill="var(--exc)">GASTOS · fases D, O y P</text>
<text x="475" y="102" text-anchor="middle" font-size="11" fill="currentColor">SUSPENDE, pero solo en 4 casos</text>
<rect x="120" y="128" width="400" height="68" rx="8" fill="var(--panel)" stroke="var(--exc)"/>
<text x="320" y="147" text-anchor="middle" font-size="10" fill="currentColor">a) insuficiencia o inadecuación de crédito</text>
<text x="320" y="163" text-anchor="middle" font-size="10" fill="currentColor">b) actos no fiscalizados que originaron las órdenes de pago</text>
<text x="320" y="179" text-anchor="middle" font-size="10" fill="currentColor">c) omisión de requisitos o trámites esenciales</text>
<text x="320" y="193" text-anchor="middle" font-size="10" fill="currentColor">d) comprobaciones materiales de obras, suministros, adquisiciones y servicios</text>
</svg>`},
{n:217,t:"Discrepancias",ubic:"Título VI (Presupuesto y gasto público) ▸ Capítulo IV (Control y fiscalización)",idea:"Discrepa el gestor: resuelve el presidente, salvo dos casos que van al Pleno.",literal:`<p>1. Cuando el órgano a que afecte el reparo no esté de acuerdo con este, corresponderá al presidente de la entidad local resolver la discrepancia, siendo su resolución ejecutiva. Esta facultad no será delegable en ningún caso.</p><p>2. No obstante lo dispuesto en el apartado anterior, corresponderá al Pleno la resolución de las discrepancias cuando los reparos:</p><p>a) Se basen en insuficiencia o inadecuación de crédito.</p><p>b) Se refieran a obligaciones o gastos cuya aprobación sea de su competencia.</p>`,dis:`<ul>
<li><b>Regla (217.1):</b> resuelve el <b>presidente</b>; su resolución es <b>ejecutiva</b> y la facultad es <b>indelegable en todo caso</b>.</li>
<li><b>Excepciones (217.2) — resuelve el <b>Pleno</b> cuando los reparos:</b>
<ol><li><b>a)</b> se basen en <b>insuficiencia o inadecuación de crédito</b>;</li>
<li><b>b)</b> se refieran a obligaciones o gastos cuya <b>aprobación sea competencia del Pleno</b>.</li></ol></li>
</ul>`,llano:`<p>Cuando el que gestiona no acepta el reparo, alguien tiene que decidir. Normalmente decide el alcalde, y su decisión se ejecuta; además, no puede encargarle esa decisión a nadie. Pero si el problema es que no hay dinero, o si el gasto lo tenía que aprobar el Pleno, entonces decide el Pleno.</p>`,porque:`<p>Que la facultad sea <b>indelegable</b> es la clave del artículo: levantar un reparo es asumir públicamente la responsabilidad de gastar contra el criterio del interventor, y esa responsabilidad no puede diluirse en un concejal delegado. Y cuando lo que falla es el crédito —el límite que aprobó el Pleno— o cuando el gasto era competencia plenaria, solo el Pleno puede decidir: nadie puede levantar por sí solo un límite que no fijó.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> quien puede saltarse la recomendación del asesor es el dueño, y no puede delegar esa firma en el encargado.</li>
<li><b>Real:</b> reparo por omisión del informe técnico en una contratación de 40.000 € competencia de la Alcaldía: resuelve el alcalde. Reparo por insuficiencia de crédito en un gasto de 12.000 €: pese al importe pequeño, resuelve el <b>Pleno</b> (217.2.a).</li>
<li><b>Caso límite:</b> el alcalde delega en la Junta de Gobierno la resolución de discrepancias: sería nulo, porque la facultad <b>no es delegable en ningún caso</b>.</li>
</ul>`,noej:`<ul>
<li><b>No decide la Intervención</b>: ha reparado, pero no resuelve la discrepancia.</li>
<li><b>No depende</b> de la cuantía: depende de la <b>causa</b> del reparo y de la competencia sobre el gasto.</li>
</ul>`,conex:`<ul>
<li><b>Arts. 215 y 216:</b> reparo y sus efectos.</li>
<li><b>Art. 218:</b> el informe al Pleno de las resoluciones contrarias a reparos.</li>
<li><b>Art. 173.5:</b> el gasto sin crédito es nulo, aunque se levante el reparo.</li>
</ul>`,trampas:`<ul>
<li><b>"No será delegable en ningún caso"</b>: expresión literal muy preguntada.</li>
<li>Las <b>dos</b> excepciones a favor del Pleno: crédito y competencia plenaria.</li>
<li>La resolución del presidente es <b>ejecutiva</b>.</li>
</ul>`,ancla:`<p><b>"Resuelve el alcalde, y no puede pasar el marrón."</b> Sube al Pleno por <b>C</b>rédito o por <b>C</b>ompetencia: las <b>dos C</b>.</p>`,vis:`<svg viewBox="0 0 640 175" role="img" aria-label="Resolución de discrepancias">
<defs><marker id="d1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="var(--acc)"/></marker></defs>
<rect x="200" y="8" width="240" height="36" rx="8" fill="var(--warn-bg)" stroke="var(--warn)"/>
<text x="320" y="31" text-anchor="middle" font-size="12" font-weight="700" fill="var(--warn)">El gestor discrepa del reparo</text>
<path d="M320 44 L 320 58" stroke="var(--acc)" stroke-width="2" marker-end="url(#d1)"/>
<rect x="180" y="60" width="280" height="34" rx="8" fill="var(--panel)" stroke="var(--line)"/>

{n:218,t:"Informes sobre resolución de discrepancias",ubic:"Título VI (Presupuesto y gasto público) ▸ Capítulo IV (Control y fiscalización)",idea:"Las decisiones contra los reparos se llevan al Pleno y al Tribunal de Cuentas.",literal:`<p>1. El órgano interventor elevará informe al Pleno de todas las resoluciones adoptadas por el Presidente de la Entidad Local contrarias a los reparos efectuados, así como un resumen de las principales anomalías detectadas en materia de ingresos. Dicho informe atenderá únicamente a aspectos y cometidos propios del ejercicio de la función fiscalizadora, sin incluir cuestiones de oportunidad o conveniencia de las actuaciones que fiscalice.</p><p>Lo contenido en este apartado constituirá un punto independiente en el orden del día de la correspondiente sesión plenaria.</p><p>El Presidente de la Corporación podrá presentar en el Pleno informe justificativo de su actuación.</p><p>2. Sin perjuicio de lo anterior, cuando existan discrepancias, el Presidente de la Entidad Local podrá elevar su resolución al órgano de control competente por razón de la materia de la Administración que tenga atribuida la tutela financiera.</p><p>3. El órgano interventor remitirá anualmente al Tribunal de Cuentas todas las resoluciones y acuerdos adoptados por el Presidente de la Entidad Local y por el Pleno de la Corporación contrarios a los reparos formulados, así como un resumen de las principales anomalías detectadas en materia de ingresos. A la citada documentación deberá acompañar, en su caso, los informes justificativos presentados por la Corporación local.</p>`,dis:`<ul>
<li><b>218.1 — informe al Pleno:</b> el órgano interventor eleva informe de <b>todas</b> las resoluciones del presidente <b>contrarias a los reparos</b>, más un <b>resumen de las principales anomalías en materia de ingresos</b>. El informe atiende solo a aspectos de la función fiscalizadora, <b>sin entrar en oportunidad o conveniencia</b>. Constituye un <b>punto independiente del orden del día</b>. El presidente puede presentar informe justificativo de su actuación.</li>
<li><b>218.2 — tutela financiera:</b> el presidente <b>podrá</b> elevar su resolución al órgano de control competente de la Administración que tenga atribuida la <span class="t" data-k="tutela">tutela financiera</span>.</li>
<li><b>218.3 — Tribunal de Cuentas:</b> el órgano interventor remite <b>anualmente</b> todas las resoluciones y acuerdos <b>del presidente y del Pleno</b> contrarios a reparos, más el resumen de anomalías en ingresos, acompañando en su caso los informes justificativos de la corporación.</li>
</ul>`,llano:`<p>Cuando el alcalde decide seguir adelante pese al reparo, eso no se queda en un cajón: el interventor lo lleva al Pleno como punto propio del orden del día, y una vez al año se lo manda todo al Tribunal de Cuentas. El alcalde puede defenderse por escrito, y si quiere puede pedir opinión a quien ejerce la tutela financiera.</p>`,porque:`<p>El reparo levantado sin publicidad sería inútil. Este artículo garantiza <b>transparencia y trazabilidad</b>: el Pleno se entera (y con punto independiente, para que no se diluya entre "ruegos y preguntas") y el órgano fiscalizador externo también. La prohibición de entrar en oportunidad protege el papel técnico del interventor: informa de legalidad, no hace política.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> el acta que deja constancia de que el jefe decidió en contra del informe técnico, y que se envía a la matriz una vez al año.</li>
<li><b>Real:</b> en 2026 el alcalde resolvió cuatro discrepancias en contra de los reparos. La interventora lleva el informe al Pleno de febrero de 2027 como punto independiente; el alcalde presenta informe justificativo; en abril, la Intervención remite todo al Tribunal de Cuentas junto con el resumen de anomalías en ingresos.</li>
<li><b>Caso límite:</b> el informe de la interventora incluye una valoración sobre si la obra era o no prioritaria para la ciudad: excede su función, porque el 218.1 le prohíbe entrar en oportunidad o conveniencia.</li>
</ul>`,noej:`<ul>
<li><b>No se informa</b> solo de los reparos suspensivos: se informa de <b>todas</b> las resoluciones contrarias a reparos.</li>
<li><b>No es facultativo</b> el informe al Pleno; sí lo es elevar la resolución al órgano de tutela financiera (218.2, "podrá").</li>
<li><b>No va</b> al Tribunal de Cuentas caso a caso: la remisión es <b>anual</b>.</li>
</ul>`,conex:`<ul>
<li><b>Art. 217:</b> las resoluciones que se informan.</li>
<li><b>Art. 223:</b> el Tribunal de Cuentas como destinatario final.</li>
<li><b>Art. 188:</b> el reparo escrito y su valor exonerador.</li>
</ul>`,trampas:`<ul>
<li><b>Punto independiente</b> del orden del día: expresión literal.</li>
<li>Al Pleno se informa de las resoluciones <b>del presidente</b>; al Tribunal de Cuentas, de las <b>del presidente y del Pleno</b>.</li>
<li>La remisión al Tribunal es <b>anual</b>.</li>
<li>Nada de <b>oportunidad o conveniencia</b>.</li>
</ul>`,ancla:`<p><b>"Al Pleno, en punto aparte; al Tribunal, una vez al año."</b><br>Y el límite del interventor: <b>legalidad sí, oportunidad no</b>.</p>`,vis:`<svg viewBox="0 0 640 165" role="img" aria-label="Publicidad de las resoluciones contrarias a reparos">

{n:219,t:"Fiscalización previa",ubic:"Título VI (Presupuesto y gasto público) ▸ Capítulo IV (Control y fiscalización)",idea:"Hay gastos exentos de fiscalización previa y una versión limitada con revisión posterior.",literal:`<p>1. No estarán sometidos a intervención previa los gastos de material no inventariable, contratos menores, así como los de carácter periódico y demás de tracto sucesivo, una vez intervenido el gasto correspondiente al período inicial del acto o contrato del que deriven o sus modificaciones, así como otros gastos menores de 3.005,06 euros que, de acuerdo con la normativa vigente, se hagan efectivos a través del sistema de anticipos de caja fija.</p><p>2. El Pleno podrá acordar, a propuesta del presidente y previo informe del órgano interventor, que la intervención previa se limite a comprobar los siguientes extremos:</p><p>a) La existencia de crédito presupuestario y que el propuesto es el adecuado a la naturaleza de gasto u obligación que se proponga contraer.</p><p>En los casos en que se trate de contraer compromisos de gastos de carácter plurianual se comprobará, además, si se cumple lo preceptuado en el artículo 174 de esta ley.</p><p>b) Que las obligaciones o gasto se generan por órgano competente.</p><p>c) Aquellos otros extremos que, por su trascendencia en el proceso de gestión, se determinen por el Pleno a propuesta del presidente.</p><p>El órgano interventor podrá formular las observaciones complementarias que considere conveniente, sin que estas tengan, en ningún caso, efectos suspensivos en la tramitación de los expedientes correspondientes.</p><p>3. Las obligaciones o gastos sometidos a la fiscalización limitada a que se refiere el apartado 2 de este artículo serán objeto de otra plena con posterioridad, ejercida sobre una muestra representativa de los actos, documentos o expedientes que dieron origen a la referida fiscalización, mediante la aplicación de técnicas de muestreo o auditoría, con el fin de verificar que se ajustan a las disposiciones aplicables en cada caso y determinar el grado del cumplimiento de la legalidad en la gestión de los créditos.</p><p>Los órganos de control interno que realicen las fiscalizaciones con posterioridad deberán emitir informe escrito en el que hagan constar cuantas observaciones y conclusiones se deduzcan de ellas. Estos informes se remitirán al Pleno con las observaciones que hubieran efectuado los órganos gestores.</p><p>4. Las entidades locales podrán determinar, mediante acuerdo del Pleno, la sustitución de la fiscalización previa de derechos por la inherente a la toma de razón en contabilidad y por actuaciones comprobatorias posteriores mediante la utilización de técnicas de muestreo o auditoría.</p>`,dis:`<div class="box ej"><span class="lbl">219.1 — No sometidos a intervención previa</span>
<ul><li>gastos de <b>material no inventariable</b>;</li>
<li><b>contratos menores</b>;</li>
<li>gastos de carácter <b>periódico</b> y demás de <b>tracto sucesivo</b>, una vez intervenido el gasto del <b>período inicial</b> del acto o contrato del que deriven o sus modificaciones;</li>
<li>otros gastos menores de <b>3.005,06 euros</b> que se hagan efectivos por el sistema de <span class="t" data-k="cajafija">anticipos de caja fija</span>.</li></ul></div>
<div class="box warn"><span class="lbl">219.2 — Fiscalización previa limitada</span>La acuerda el <b>Pleno</b>, a propuesta del <b>presidente</b> y previo <b>informe del órgano interventor</b>. Se limita a comprobar:
<ul><li><b>a)</b> existencia de <b>crédito</b> y que el propuesto es <b>adecuado</b> a la naturaleza del gasto. En compromisos plurianuales, además, el cumplimiento del <b>art. 174</b>;</li>
<li><b>b)</b> que el gasto se genera por <b>órgano competente</b>;</li>
<li><b>c)</b> otros extremos que, por su trascendencia, determine el <b>Pleno a propuesta del presidente</b>.</li></ul>
El interventor puede formular <b>observaciones complementarias</b>, que <b>nunca tienen efectos suspensivos</b>.</div>
<ul>
<li><b>219.3 — fiscalización plena posterior:</b> los gastos fiscalizados de forma limitada se someten después a <b>fiscalización plena</b> sobre una <b>muestra representativa</b>, con técnicas de muestreo o auditoría. Se emite <b>informe escrito</b> que se remite al <b>Pleno</b> con las observaciones de los órganos gestores.</li>
<li><b>219.4 — ingresos:</b> el <b>Pleno</b> puede sustituir la fiscalización previa de <b>derechos</b> por la <span class="t" data-k="tomarazon">toma de razón en contabilidad</span> y actuaciones comprobatorias posteriores mediante muestreo o auditoría.</li>
</ul>`,llano:`<p>Fiscalizarlo absolutamente todo antes sería inviable. La ley exime de control previo a lo pequeño y repetitivo, permite que el Pleno reduzca la revisión previa a dos cosas esenciales —que haya dinero y que firme quien debe— y compensa esa rebaja con una revisión completa posterior por muestreo. Con los ingresos se puede ir más lejos: sustituir el control previo por una simple anotación contable y comprobar después.</p>`,porque:`<p>El control previo exhaustivo es caro y lento, y su rendimiento decrece en los gastos pequeños. La solución del legislador es <b>concentrar el control donde importa</b> —crédito y competencia— y trasladar el resto a un control posterior por muestreo, que es como funciona la auditoría moderna. El equilibrio se mantiene porque la rebaja siempre la decide el <b>Pleno</b>, con informe del interventor, y va acompañada de fiscalización plena posterior.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> en un aeropuerto no se abre todas las maletas: se pasan por el escáner y se abren unas cuantas al azar.</li>
<li><b>Real:</b> el Pleno aprueba en 2026 el régimen de fiscalización limitada previa. La Intervención comprueba en cada expediente crédito, adecuación y órgano competente; al año siguiente audita una muestra del 10 % de los expedientes y remite informe al Pleno.</li>
<li><b>Caso límite:</b> un contrato de mantenimiento de ascensores de tracto sucesivo: se fiscaliza el periodo inicial y sus modificaciones; las facturas mensuales posteriores quedan fuera de la intervención previa (219.1).</li>
</ul>`,noej:`<ul>
<li><b>No decide el interventor</b> limitar su propia fiscalización: lo acuerda el <b>Pleno</b>, aunque con su informe previo.</li>
<li><b>No suspenden</b> las observaciones complementarias del 219.2.</li>
<li><b>No desaparece</b> el control: la fiscalización limitada se compensa con la plena posterior por muestreo.</li>
</ul>`,conex:`<ul>
<li><b>Art. 214.2.a):</b> la intervención previa que aquí se excepciona o limita.</li>
<li><b>Art. 174:</b> comprobación adicional en compromisos plurianuales.</li>
<li><b>Art. 190.3:</b> los anticipos de caja fija a los que alude el 219.1.</li>
<li><b>Art. 220:</b> control financiero, con el que enlaza el control posterior.</li>
</ul>`,trampas:`<ul>
<li>La cifra literal es <b>3.005,06 euros</b> (equivalente a las antiguas 500.000 pesetas) y va referida a gastos pagados por <b>anticipos de caja fija</b>.</li>
<li>Los extremos básicos son <b>dos</b> (crédito adecuado y órgano competente) más los que añada el Pleno.</li>
<li>La fiscalización plena posterior se hace sobre <b>muestra representativa</b> y su informe va al <b>Pleno</b>.</li>
<li>La sustitución del 219.4 se refiere solo a los <b>derechos</b> (ingresos).</li>
</ul>`,ancla:`<p><b>"Lo pequeño no se mira antes; lo demás, solo crédito y competencia."</b><br>Cifra que hay que memorizar: <b>3.005,06 €</b>. Y la compensación: <b>muestreo después</b>.</p>`,vis:`<svg viewBox="0 0 640 200" role="img" aria-label="Excepciones y limitación de la fiscalización previa">
<rect x="20" y="15" width="290" height="80" rx="8" fill="var(--ej-bg)" stroke="var(--ej)"/>

<text x="165" y="71" text-anchor="middle" font-size="10" fill="currentColor">periódicos y de tracto sucesivo (tras el inicial)</text>
<text x="165" y="87" text-anchor="middle" font-size="10" fill="var(--exc)">gastos menores de 3.005,06 € por caja fija</text>
<rect x="330" y="15" width="290" height="80" rx="8" fill="var(--warn-bg)" stroke="var(--warn)"/>

<text x="475" y="55" text-anchor="middle" font-size="10" fill="currentColor">a) crédito existente y adecuado (+ art. 174)</text>
<text x="475" y="71" text-anchor="middle" font-size="10" fill="currentColor">b) órgano competente</text>
<text x="475" y="87" text-anchor="middle" font-size="10" fill="currentColor">c) lo que añada el Pleno</text>
<rect x="120" y="112" width="400" height="42" rx="8" fill="var(--acc-soft)" stroke="var(--acc)"/>
<text x="320" y="130" text-anchor="middle" font-size="11" font-weight="700" fill="var(--acc)">FISCALIZACIÓN PLENA POSTERIOR sobre muestra representativa</text>
<text x="320" y="147" text-anchor="middle" font-size="10" fill="currentColor">informe escrito al Pleno con las observaciones de los gestores</text>
<text x="320" y="178" text-anchor="middle" font-size="10" fill="var(--ink2)">En ingresos, el Pleno puede sustituir la fiscalización previa por la toma de razón en contabilidad (219.4)</text>
</svg>`},
{n:220,t:"Ámbito de aplicación y finalidad del control financiero",ubic:"Título VI (Presupuesto y gasto público) ▸ Capítulo IV (Control y fiscalización)",idea:"El control financiero audita cómo funcionan los servicios y termina en el Pleno.",literal:`<p>1. El control financiero tendrá por objeto comprobar el funcionamiento en el aspecto económico-financiero de los servicios de las entidades locales, de sus organismos autónomos y de las sociedades mercantiles de ellas dependientes.</p><p>2. Dicho control tendrá por objeto informar acerca de la adecuada presentación de la información financiera, del cumplimiento de las normas y directrices que sean de aplicación y del grado de eficacia y eficiencia en la consecución de los objetivos previstos.</p><p>3. El control financiero se realizará por procedimientos de auditoría de acuerdo con las normas de auditoría del sector público.</p><p>4. Como resultado del control efectuado habrá de emitirse informe escrito en el que se haga constar cuantas observaciones y conclusiones se deduzcan del examen practicado. Los informes, conjuntamente con las alegaciones efectuadas por el órgano auditado, serán enviados al Pleno para su examen.</p>`,dis:`<ul>
<li><b>Ámbito (220.1):</b> servicios de la entidad, de sus <b>organismos autónomos</b> y de sus <b>sociedades mercantiles dependientes</b>. Es más amplio que el de la función interventora.</li>
<li><b>Objeto (220.2) — tres finalidades:</b>
<ol><li>adecuada presentación de la <b>información financiera</b>;</li>
<li><b>cumplimiento</b> de las normas y directrices aplicables;</li>
<li>grado de <b>eficacia y eficiencia</b> en la consecución de los objetivos.</li></ol></li>
<li><b>Método (220.3):</b> procedimientos de <b>auditoría</b>, conforme a las normas de auditoría del sector público.</li>
<li><b>Resultado (220.4):</b> <b>informe escrito</b> con observaciones y conclusiones. Se envía al <b>Pleno</b> junto con las <b>alegaciones</b> del órgano auditado.</li>
</ul>`,llano:`<p>Mientras la función interventora mira expediente a expediente y antes, el control financiero mira el conjunto y después, con técnicas de auditoría: si las cuentas reflejan la realidad, si se cumplen las normas y si el servicio funciona bien. Termina siempre en un informe escrito que va al Pleno, con la respuesta de los auditados.</p>`,porque:`<p>Hay problemas que ningún control previo detecta: un servicio legal pero ruinoso, una información contable formalmente correcta pero engañosa. El control financiero aporta la <b>mirada agregada y experta</b>. Que las alegaciones acompañen al informe garantiza contradicción: el auditado tiene derecho a explicarse ante el mismo órgano que recibe la crítica.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> la auditoría anual de una empresa, que no revisa cada factura sino el conjunto y emite opinión.</li>
<li><b>Real:</b> control financiero de la empresa municipal de aguas: el informe concluye que la información financiera es adecuada, detecta incumplimientos en la contratación menor y señala un coste por metro cúbico un 18 % superior al de entidades comparables. Se remite al Pleno con las alegaciones de la empresa.</li>
<li><b>Caso límite:</b> las sociedades mercantiles no están sujetas a la función interventora del art. 214, pero sí a este control financiero.</li>
</ul>`,noej:`<ul>
<li><b>No es previo</b>: opera con posterioridad y sobre el funcionamiento, no sobre actos concretos antes de aprobarse.</li>
<li><b>No termina</b> en la Intervención: el informe va al <b>Pleno</b>.</li>
</ul>`,conex:`<ul>
<li><b>Art. 213:</b> lo incluye entre las modalidades de control interno, con la auditoría de cuentas.</li>
<li><b>Art. 219.3:</b> la fiscalización plena posterior, con técnicas semejantes.</li>
<li><b>Art. 221:</b> control de eficacia, con el que comparte la mirada a los objetivos.</li>
</ul>`,trampas:`<ul>
<li>Alcanza a las <b>sociedades mercantiles dependientes</b>, a diferencia del art. 214.</li>
<li>Tres finalidades: información financiera · cumplimiento normativo · <b>eficacia y eficiencia</b>.</li>
<li>El informe se envía al Pleno <b>junto con las alegaciones</b> del auditado.</li>
</ul>`,ancla:`<p><b>"Auditar el cómo funciona."</b> Tres preguntas: <b>¿informa bien? ¿cumple? ¿sirve?</b></p>`,vis:`<svg viewBox="0 0 640 165" role="img" aria-label="Objeto y resultado del control financiero">

<text x="320" y="147" text-anchor="middle" font-size="11" fill="var(--acc)">Informe escrito + alegaciones del auditado → al PLENO</text>
</svg>`},
{n:221,t:"Control de eficacia",ubic:"Título VI (Presupuesto y gasto público) ▸ Capítulo IV (Control y fiscalización)",idea:"El control de eficacia mira si se cumplen los objetivos y a qué coste.",literal:`<p>El control de eficacia tendrá por objeto la comprobación periódica del grado de cumplimiento de los objetivos, así como el análisis del coste de funcionamiento y del rendimiento de los respectivos servicios o inversiones.</p>`,dis:`<ul>
<li><b>Objeto — tres elementos:</b>
<ol><li>comprobación <b>periódica</b> del <b>grado de cumplimiento de los objetivos</b>;</li>
<li>análisis del <b>coste de funcionamiento</b>;</li>
<li>análisis del <b>rendimiento</b> de los respectivos servicios o inversiones.</li></ol></li>
</ul>`,llano:`<p>No basta con gastar legalmente y con las cuentas cuadradas: hay que preguntarse si se consiguió lo que se prometió, cuánto costó mantenerlo y qué rindió. Eso es el control de eficacia, y se hace de forma periódica.</p>`,porque:`<p>Es la última pieza del sistema: la legalidad y la contabilidad pueden ser impecables mientras el dinero se dedica a servicios que nadie usa. Al exigir una comprobación <b>periódica</b> —no puntual— la ley busca que la evaluación forme parte de la gestión ordinaria, no de un examen excepcional.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> revisar cada trimestre si el gimnasio que pagas te sirve para algo y cuánto te cuesta cada sesión efectiva.</li>
<li><b>Real:</b> el informe de control de eficacia de una biblioteca municipal concluye que el objetivo de 40.000 préstamos anuales se cumplió al 78 %, con un coste de funcionamiento de 310.000 € y un coste medio por préstamo de 9,94 €.</li>
</ul>`,noej:`<ul>
<li><b>No es control de legalidad</b>: no juzga si el gasto era conforme a derecho, sino si sirvió.</li>
<li><b>No es esporádico</b>: la ley exige comprobación <b>periódica</b>.</li>
</ul>`,conex:`<ul>
<li><b>Art. 211:</b> las memorias de coste, rendimiento y cumplimiento de objetivos de las entidades grandes.</li>
<li><b>Art. 213:</b> es una de las tres modalidades de control interno.</li>
<li><b>Art. 220.2:</b> el control financiero también evalúa eficacia y eficiencia.</li>
</ul>`,trampas:`<ul>
<li>Son <b>tres</b> objetos: cumplimiento de objetivos, coste de funcionamiento y rendimiento.</li>
<li>La comprobación es <b>periódica</b>.</li>
</ul>`,ancla:`<p><b>"¿Se cumplió, cuánto costó, qué rindió?"</b> Tres preguntas y ya tienes el artículo entero.</p>`,vis:`<svg viewBox="0 0 640 125" role="img" aria-label="Objeto del control de eficacia">
<rect x="205" y="10" width="230" height="32" rx="8" fill="var(--warn-bg)" stroke="var(--warn)"/>

{n:222,t:"Facultades del personal controlador",ubic:"Título VI (Presupuesto y gasto público) ▸ Capítulo IV (Control y fiscalización)",idea:"Los controladores actúan con plena independencia y pueden pedir y comprobar todo.",literal:`<p>Los funcionarios que tengan a su cargo la función interventora así como los que se designen para llevar a efecto los controles financiero y de eficacia, ejercerán su función con plena independencia y podrán recabar cuantos antecedentes consideren necesarios, efectuar el examen y comprobación de los libros, cuentas y documentos que consideren precisos, verificar arqueos y recuentos y solicitar de quien corresponda, cuando la naturaleza del acto, documento o expediente que deba ser intervenido lo requiera, los informes técnicos y asesoramientos que estimen necesarios.</p>`,dis:`<ul>
<li><b>Sujetos:</b> funcionarios con la <b>función interventora</b> y los designados para los controles <b>financiero y de eficacia</b>.</li>
<li><b>Garantía:</b> ejercen su función con <b>plena independencia</b>.</li>
<li><b>Facultades:</b>
<ol><li><b>recabar</b> cuantos antecedentes consideren necesarios;</li>
<li><b>examinar y comprobar</b> libros, cuentas y documentos;</li>
<li><b>verificar arqueos y recuentos</b>;</li>
<li><b>solicitar informes técnicos y asesoramientos</b> cuando la naturaleza del acto lo requiera.</li></ol></li>
</ul>`,llano:`<p>Para que el control sirva, quien controla no puede depender de a quien controla ni quedarse en la puerta. La ley se lo dice expresamente: independencia plena, y derecho a pedir papeles, revisar libros, contar el dinero de la caja y pedir ayuda técnica.</p>`,porque:`<p>Un interventor sin independencia sería un sello de goma. Sin facultades de investigación, un lector de expedientes. Este artículo es la <b>condición de posibilidad</b> de todo el capítulo: las funciones de los arts. 214 a 221 no se pueden ejercer si el controlador no puede exigir la información.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> el auditor que aparece sin avisar y cuenta la caja del negocio.</li>
<li><b>Real:</b> en el control financiero de la recaudación, la interventora verifica un arqueo sorpresa de la caja de la oficina de atención al contribuyente y solicita un informe técnico externo sobre la aplicación informática de recaudación.</li>
</ul>`,noej:`<ul>
<li><b>No puede</b> el órgano gestor negar antecedentes al controlador.</li>
<li><b>No alcanza</b> la independencia a decidir sobre la gestión: controla, no gestiona.</li>
</ul>`,conex:`<ul>
<li><b>Art. 213:</b> el Gobierno regula derechos y deberes del personal controlador.</li>
<li><b>Arts. 214 y 220:</b> las funciones que estas facultades hacen posibles.</li>
<li><b>Art. 92 bis LBRL:</b> funcionarios de administración local con habilitación de carácter nacional.</li>
</ul>`,trampas:`<ul>
<li>La expresión literal es <b>"plena independencia"</b>.</li>
<li>Entre las facultades está la de <b>verificar arqueos y recuentos</b>, que suele olvidarse.</li>
</ul>`,ancla:`<p><b>"Pedir, mirar, contar y consultar."</b> Cuatro verbos y una garantía: <b>plena independencia</b>.</p>`,vis:`<svg viewBox="0 0 640 130" role="img" aria-label="Facultades del personal controlador">

{n:223,t:"Control externo",ubic:"Título VI (Presupuesto y gasto público) ▸ Capítulo IV (Control y fiscalización)",idea:"Fuera de casa controla el Tribunal de Cuentas, sin perjuicio de los órganos autonómicos.",literal:`<p>1. La fiscalización externa de las cuentas y de la gestión económica de las entidades locales y de todos los organismos y sociedades de ellas dependientes es función propia del Tribunal de Cuentas, con el alcance y condiciones que establece su ley orgánica reguladora y su ley de funcionamiento.</p><p>2. A tal efecto, las entidades locales rendirán al citado Tribunal, antes del día 15 de octubre de cada año, la cuenta general a que se refiere el artículo 209 de esta ley correspondiente al ejercicio económico anterior.</p><p>3. Una vez fiscalizadas las cuentas por el Tribunal, se someterá a la consideración de la entidad local la propuesta de corrección de las anomalías observadas y el ejercicio de las acciones procedentes, sin perjuicio, todo ello, de las actuaciones que puedan corresponder al Tribunal en los casos de exigencia de responsabilidad contable.</p><p>4. Lo establecido en el presente artículo se entiende sin menoscabo de las facultades que, en materia de fiscalización externa de las entidades locales, tengan atribuidas por sus Estatutos las comunidades autónomas.</p>`,dis:`<ul>
<li><b>223.1 — competencia:</b> la fiscalización externa de las cuentas y de la gestión económica de las entidades locales y de <b>todos</b> los organismos y sociedades dependientes es función propia del <span class="t" data-k="tcuentas">Tribunal de Cuentas</span>, con el alcance de su ley orgánica y su ley de funcionamiento.</li>
<li><b>223.2 — rendición:</b> las entidades locales rinden al Tribunal, antes del <b>15 de octubre</b> de cada año, la <b>cuenta general del ejercicio anterior</b> (art. 209).</li>
<li><b>223.3 — resultado:</b> fiscalizadas las cuentas, se somete a la entidad la <b>propuesta de corrección</b> de las anomalías y el ejercicio de las acciones procedentes, sin perjuicio de la <b>responsabilidad contable</b> que pueda exigir el Tribunal.</li>
<li><b>223.4 — órganos autonómicos:</b> todo ello sin menoscabo de las facultades de fiscalización externa que los <b>Estatutos</b> atribuyan a las comunidades autónomas (<span class="t" data-k="ocex">OCEX</span>: en Andalucía, la Cámara de Cuentas).</li>
</ul>`,llano:`<p>Además del control de casa, hay un control de fuera: el Tribunal de Cuentas. Cada año, antes del 15 de octubre, hay que mandarle la cuenta general del año anterior. Si encuentra cosas mal, propone corregirlas y puede exigir responsabilidad contable a quien haya causado un daño a los fondos públicos. Y las comunidades autónomas pueden tener su propio órgano fiscalizador.</p>`,porque:`<p>El control interno lo ejercen funcionarios de la propia entidad: por muy independientes que sean, hace falta una <b>mirada externa</b> que no dependa de la corporación. Y como el daño a los fondos públicos no se repara solo señalándolo, el Tribunal puede exigir <b>responsabilidad contable</b>, es decir, la reintegración del perjuicio.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> la diferencia entre revisar tú tus cuentas y que las revise un auditor externo que no cobra de ti.</li>
<li><b>Real:</b> un ayuntamiento rinde su cuenta general de 2026 al Tribunal de Cuentas el 3 de octubre de 2027 a través de la plataforma de rendición. La Cámara de Cuentas de Andalucía, en paralelo, incluye a la entidad en su informe anual del sector local.</li>
<li><b>Caso límite:</b> el Pleno rechazó la cuenta general. Debe rendirse igualmente (art. 212.5) y el Tribunal la fiscaliza.</li>
</ul>`,noej:`<ul>
<li><b>No es control interno</b>: aquí no interviene la Intervención de la entidad como controladora, sino como rendidora de la información.</li>
<li><b>No excluye</b> la fiscalización del Tribunal de Cuentas la existencia de un órgano autonómico: son compatibles.</li>
</ul>`,conex:`<ul>
<li><b>Art. 212.5:</b> el presidente rinde la cuenta general al Tribunal tras el pronunciamiento del Pleno.</li>
<li><b>Art. 218.3:</b> remisión anual de resoluciones contrarias a reparos.</li>
<li><b>Art. 171.2:</b> informe del Tribunal de Cuentas cuando se impugna la nivelación presupuestaria.</li>
<li><b>Art. 136 CE:</b> el Tribunal de Cuentas como supremo órgano fiscalizador, dependiente de las Cortes Generales.</li>
</ul>`,trampas:`<ul>
<li><b>15 de octubre</b>: rendición al Tribunal de Cuentas. No confundir con el 1 de octubre (aprobación por el Pleno, art. 212.4) ni con el 15 de octubre del art. 168.4 (remisión del presupuesto al Pleno), que coinciden en fecha pero no en objeto.</li>
<li>Se rinde la cuenta general <b>del ejercicio anterior</b>.</li>
<li>La fiscalización externa alcanza a <b>todos</b> los organismos y sociedades dependientes.</li>
</ul>`,ancla:`<p><b>"El 15 de octubre, al Tribunal."</b> Y recuerda que el 15 de octubre aparece dos veces en el tema 8: <b>presupuesto al Pleno</b> (168.4) y <b>cuenta general al Tribunal</b> (223.2).</p>`,vis:`<svg viewBox="0 0 640 175" role="img" aria-label="Control externo de las entidades locales">

<script>
const PLAZOS=[["15 de mayo", "Rendición de los estados y cuentas de la entidad y remisión de las de OOAA y sociedades", "Presidente / órganos de los entes", "212.1", "Del ejercicio siguiente al que correspondan"], ["1 de junio", "Informe de la Comisión Especial de Cuentas sobre la cuenta general", "Comisión Especial", "212.2", "La cuenta la forma la Intervención"], ["15 días", "Exposición al público de la cuenta general con el informe de la Comisión", "Interesados", "212.3", "Reclamaciones, reparos u observaciones + nuevo informe"], ["1 de octubre", "Aprobación de la cuenta general", "Pleno", "212.4", "Puede aprobarla o rechazarla"], ["15 de octubre", "Rendición de la cuenta general al Tribunal de Cuentas", "Presidente", "223.2", "La del ejercicio económico anterior"], ["Más de 50.000 habitantes", "Umbral para acompañar las dos memorias a la cuenta general", "Municipios y entidades de ámbito superior", "211", "Coste y rendimiento · cumplimiento de objetivos"], ["3.005,06 euros", "Gastos menores por anticipos de caja fija excluidos de intervención previa", "Entidad", "219.1", "Junto con material no inventariable y contratos menores"], ["Anual", "Remisión al Tribunal de Cuentas de resoluciones contrarias a reparos", "Órgano interventor", "218.3", "Del presidente y del Pleno, con anomalías de ingresos"], ["Anual", "Informe resumen de los resultados del control interno a la IGAE", "Órgano interventor", "213", "En el plazo y contenido que fijen las normas del Gobierno"], ["Punto independiente", "Los reparos resueltos en contra se llevan al Pleno en punto propio del orden del día", "Órgano interventor", "218.1", "Sin entrar en oportunidad ni conveniencia"]];
const FLASH=[["¿Qué pone de manifiesto la cuenta general?", "La gestión realizada en los aspectos <b>económico, financiero, patrimonial y presupuestario</b> (art. 208)."], ["¿Por qué cuentas está integrada la cuenta general?", "La de la propia entidad, la de los organismos autónomos y las de las sociedades mercantiles de <b>capital íntegramente</b> propiedad de la entidad (art. 209.1)."], ["¿Con qué normativa se elaboran las cuentas de las sociedades mercantiles locales?", "Con la <b>normativa mercantil</b> (art. 209.3)."], ["¿Quién determina el contenido y la estructura de las cuentas?", "El <b>Ministerio de Hacienda</b>, a propuesta de la <b>IGAE</b> (art. 210)."], ["¿Quién acompaña memorias a la cuenta general y cuáles?", "Los municipios de más de <b>50.000 habitantes</b> y entidades de ámbito superior: memoria de <b>coste y rendimiento</b> de los servicios y memoria de <b>cumplimiento de objetivos</b> (art. 211)."], ["Calendario de la cuenta general", "<b>15 de mayo</b> rendición · <b>1 de junio</b> informe de la Comisión Especial · <b>15 días</b> de exposición · <b>1 de octubre</b> aprobación por el Pleno · <b>15 de octubre</b> al Tribunal de Cuentas."], ["¿Quién forma la cuenta general?", "La <b>Intervención</b> (art. 212.2). El presidente rinde los estados y cuentas."], ["¿Qué ocurre si el Pleno rechaza la cuenta general?", "El presidente debe rendirla igualmente al <b>Tribunal de Cuentas</b> (art. 212.5)."], ["Modalidades del control interno", "<b>Función interventora</b>, <b>control financiero</b> (incluida auditoría de cuentas) y <b>control de eficacia</b> (art. 213)."], ["¿A quién se remite el informe resumen anual del control interno?", "A la <b>IGAE</b> (art. 213)."], ["Las cuatro modalidades de la función interventora", "Intervención <b>previa o crítica</b> · intervención <b>formal</b> de la ordenación del pago · intervención <b>material</b> del pago · <b>comprobación material</b> de inversiones y aplicación de subvenciones (art. 214.2)."], ["¿Cómo y cuándo se formula un reparo?", "<b>Por escrito</b> y <b>antes</b> de la adopción del acuerdo o resolución, por desacuerdo de fondo o de forma (art. 215)."], ["¿Suspende el reparo en materia de ingresos?", "No: se formaliza en <b>nota de reparo</b> que en ningún caso suspende la tramitación (art. 216.1)."], ["¿En qué cuatro casos suspende el reparo de gastos?", "Insuficiencia o inadecuación de crédito · actos no fiscalizados que originaron órdenes de pago · omisión de requisitos o trámites esenciales · comprobaciones materiales (art. 216.2)."], ["¿Quién resuelve las discrepancias?", "El <b>presidente</b>, con resolución ejecutiva e <b>indelegable en todo caso</b> (art. 217.1)."], ["¿Cuándo resuelve el Pleno las discrepancias?", "Si el reparo se basa en <b>insuficiencia o inadecuación de crédito</b> o se refiere a gastos cuya aprobación sea de su competencia (art. 217.2)."], ["¿Qué se lleva al Pleno como punto independiente del orden del día?", "El informe del interventor sobre las resoluciones del presidente <b>contrarias a los reparos</b> y el resumen de anomalías en ingresos (art. 218.1)."], ["¿Qué se remite anualmente al Tribunal de Cuentas en materia de reparos?", "Todas las resoluciones y acuerdos del <b>presidente y del Pleno</b> contrarios a reparos, con el resumen de anomalías de ingresos y los informes justificativos (art. 218.3)."], ["Gastos no sometidos a intervención previa", "Material no inventariable · contratos menores · periódicos y de tracto sucesivo tras el periodo inicial · otros gastos menores de <b>3.005,06 €</b> por anticipos de caja fija (art. 219.1)."], ["Extremos de la fiscalización limitada previa", "Existencia y adecuación del <b>crédito</b> (y art. 174 en plurianuales) · <b>órgano competente</b> · otros que determine el Pleno a propuesta del presidente (art. 219.2)."], ["¿Qué compensa la fiscalización limitada?", "Una <b>fiscalización plena posterior</b> sobre muestra representativa, con informe escrito al Pleno (art. 219.3)."], ["Finalidades del control financiero", "Adecuada presentación de la <b>información financiera</b>, <b>cumplimiento</b> de normas y directrices, y grado de <b>eficacia y eficiencia</b> (art. 220.2)."], ["¿Qué alcanza el control financiero que no alcanza la función interventora?", "Las <b>sociedades mercantiles dependientes</b> (arts. 220.1 frente a 214.1)."], ["Objeto del control de eficacia", "Comprobación periódica del <b>cumplimiento de objetivos</b> y análisis del <b>coste de funcionamiento</b> y del <b>rendimiento</b> de servicios o inversiones (art. 221)."], ["Facultades del personal controlador", "Plena independencia · recabar antecedentes · examinar libros, cuentas y documentos · verificar <b>arqueos y recuentos</b> · solicitar informes técnicos (art. 222)."], ["¿Quién ejerce el control externo y con qué plazo de rendición?", "El <b>Tribunal de Cuentas</b>; la cuenta general del ejercicio anterior se rinde antes del <b>15 de octubre</b> de cada año (art. 223)."]];
const TEST=[{"a": 208, "q": "La cuenta general pone de manifiesto la gestión realizada en los aspectos:", "o": [["económico, financiero, patrimonial y presupuestario", 1, "Correcto: los cuatro aspectos del art. 208."], ["económico y presupuestario", 0, "Incompleto: faltan el financiero y el patrimonial."], ["presupuestario y de tesorería", 0, "No es la formulación legal."], ["contable y fiscal", 0, "No figura en el precepto."]]}, {"a": 209, "q": "Se integran en la cuenta general las cuentas de las sociedades mercantiles de capital mayoritariamente municipal.", "vf": true, "ok": false, "fb": "<b>Falso.</b> El art. 209.1.c) exige capital <b>íntegramente</b> propiedad de la entidad local. Las participadas remiten sus cuentas a efectos de los estados consolidados (209.4)."}, {"a": 211, "q": "¿Qué entidades deben acompañar a la cuenta general la memoria de coste y rendimiento de los servicios públicos?", "o": [["los municipios de más de 50.000 habitantes y las entidades de ámbito superior", 1, "Correcto: art. 211."], ["todos los municipios sin excepción", 0, "No: la obligación se limita por población y ámbito."], ["los municipios de más de 500.000 habitantes", 0, "Ese umbral es el de la unidad central de tesorería (art. 186.3)."], ["solo las diputaciones provinciales", 0, "También los municipios de más de 50.000 habitantes."]]}, {"a": 212, "q": "Completa: «Los estados y cuentas de la entidad local serán rendidas por su presidente antes del día ______».", "gap": "15 de mayo", "fb": "<b>15 de mayo</b> del ejercicio siguiente (art. 212.1). Después: 1 de junio (Comisión Especial), 15 días de exposición y 1 de octubre (Pleno)."}, {"a": 212, "q": "La cuenta general se somete a informe de la Comisión Especial de Cuentas antes del:", "o": [["1 de junio", 1, "Correcto: art. 212.2. La Comisión está formada por miembros de los distintos grupos políticos."], ["15 de mayo", 0, "Esa es la fecha de rendición por el presidente."], ["1 de octubre", 0, "Esa es la fecha límite de aprobación por el Pleno."], ["15 de octubre", 0, "Esa es la rendición al Tribunal de Cuentas (art. 223.2)."]]}, {"a": 212, "q": "Si el Pleno rechaza la cuenta general, no procede rendirla al Tribunal de Cuentas.", "vf": true, "ok": false, "fb": "<b>Falso.</b> El art. 212.5 exige que, una vez que el Pleno se pronuncie —aprobándola o rechazándola—, el presidente la rinda al Tribunal de Cuentas."}, {"a": 213, "q": "Las modalidades del control interno de las entidades locales son:", "o": [["función interventora, control financiero y control de eficacia", 1, "Correcto: art. 213, con la auditoría de cuentas incluida en el control financiero."], ["función interventora y control externo", 0, "El control externo (art. 223) no es control interno."], ["fiscalización previa, posterior y contable", 0, "No es la clasificación legal."], ["auditoría, tutela financiera y control de legalidad", 0, "No es la clasificación del art. 213."]]}, {"a": 214, "q": "¿Cuál NO es una modalidad de ejercicio de la función interventora?", "o": [["la auditoría de las sociedades mercantiles dependientes", 1, "Correcto: eso es control financiero (arts. 213 y 220), no función interventora."], ["la intervención crítica o previa", 0, "Sí lo es: art. 214.2.a)."], ["la intervención formal de la ordenación del pago", 0, "Sí lo es: art. 214.2.b)."], ["la comprobación material de las inversiones y de la aplicación de subvenciones", 0, "Sí lo es: art. 214.2.d)."]]}, {"a": 215, "q": "El reparo del órgano interventor debe formularse:", "o": [["por escrito y antes de la adopción del acuerdo o resolución", 1, "Correcto: art. 215, y puede referirse al fondo o a la forma."], ["por escrito, en el plazo de diez días desde el acuerdo", 0, "El reparo es previo, no posterior."], ["verbalmente en la sesión y por escrito después", 0, "La ley exige forma escrita y momento previo."], ["solo cuando afecte al fondo del expediente", 0, "También cabe por defectos de forma."]]}, {"a": 216, "q": "El reparo referido al reconocimiento o liquidación de derechos a favor de la entidad:", "o": [["se formaliza en nota de reparo que en ningún caso suspende la tramitación", 1, "Correcto: art. 216.1."], ["suspende siempre la tramitación del expediente", 0, "La suspensión se reserva a los cuatro casos del art. 216.2, referidos a gastos."], ["suspende si se basa en insuficiencia de crédito", 0, "Ese supuesto opera en gastos, no en derechos."], ["obliga a resolver al Pleno en todo caso", 0, "No es el efecto previsto."]]}, {"a": 216, "q": "¿Cuál de estos motivos NO determina la suspensión del expediente de gasto?", "o": [["la falta de un informe no esencial en el expediente", 1, "Correcto: el art. 216.2.c) exige omisión de requisitos o trámites <b>esenciales</b>."], ["la insuficiencia de crédito o su inadecuación", 0, "Sí suspende: letra a)."], ["que no se hubieran fiscalizado los actos que dieron origen a las órdenes de pago", 0, "Sí suspende: letra b)."], ["que el reparo derive de comprobaciones materiales de obras", 0, "Sí suspende: letra d)."]]}, {"a": 217, "q": "Completa: «La facultad del presidente de resolver las discrepancias no será ______ en ningún caso».", "gap": "delegable", "fb": "<b>Delegable</b> (art. 217.1). Además, su resolución es ejecutiva."}, {"a": 217, "q": "Corresponde al Pleno resolver la discrepancia cuando el reparo se basa en insuficiencia de crédito.", "vf": true, "ok": true, "fb": "<b>Verdadero</b> (art. 217.2.a). También cuando se refiera a gastos cuya aprobación sea competencia del Pleno."}, {"a": 218, "q": "El informe del interventor sobre resoluciones contrarias a reparos:", "o": [["constituye un punto independiente en el orden del día del Pleno", 1, "Correcto: art. 218.1. El presidente puede presentar informe justificativo."], ["se incluye en el turno de ruegos y preguntas", 0, "No: la ley exige punto independiente."], ["se remite solo al Tribunal de Cuentas", 0, "Va al Pleno y, anualmente, al Tribunal de Cuentas."], ["puede incluir valoraciones de oportunidad de la actuación fiscalizada", 0, "Lo prohíbe expresamente el art. 218.1."]]}, {"a": 219, "q": "Están excluidos de intervención previa los gastos menores de:", "o": [["3.005,06 euros que se hagan efectivos por anticipos de caja fija", 1, "Correcto: art. 219.1, junto con material no inventariable, contratos menores y gastos periódicos o de tracto sucesivo."], ["6.000 euros en todo caso", 0, "No es la cifra ni la condición legal."], ["3.005,06 euros, cualquiera que sea su forma de pago", 0, "La exclusión se vincula al sistema de anticipos de caja fija."], ["50.000 euros en contratos menores de obra", 0, "Los contratos menores están excluidos sin ese umbral en este precepto."]]}, {"a": 219, "q": "La fiscalización previa limitada la acuerda el propio órgano interventor.", "vf": true, "ok": false, "fb": "<b>Falso.</b> La acuerda el <b>Pleno</b>, a propuesta del presidente y previo informe del órgano interventor (art. 219.2)."}, {"a": 220, "q": "El control financiero se realiza:", "o": [["por procedimientos de auditoría, conforme a las normas de auditoría del sector público", 1, "Correcto: art. 220.3."], ["mediante intervención previa de cada expediente", 0, "Eso es función interventora, no control financiero."], ["exclusivamente sobre los organismos autónomos", 0, "Alcanza también a la entidad y a sus sociedades dependientes."], ["mediante toma de razón en contabilidad", 0, "Esa es la alternativa del art. 219.4 para la fiscalización previa de derechos."]]}, {"a": 221, "q": "El control de eficacia tiene por objeto:", "o": [["la comprobación periódica del cumplimiento de objetivos y el análisis del coste de funcionamiento y del rendimiento", 1, "Correcto: art. 221."], ["la comprobación de la legalidad de los actos de contenido económico", 0, "Eso es la función interventora (art. 214.1)."], ["la auditoría de las cuentas anuales", 0, "Se sitúa en el control financiero (art. 213)."], ["la fiscalización externa de la gestión económica", 0, "Eso corresponde al Tribunal de Cuentas (art. 223)."]]}, {"a": 222, "q": "Completa: «Los funcionarios que tengan a su cargo la función interventora ejercerán su función con ______ independencia».", "gap": "plena", "fb": "<b>Plena</b> independencia (art. 222), con facultades para recabar antecedentes, examinar libros, verificar arqueos y recuentos y solicitar informes técnicos."}, {"a": 223, "q": "Las entidades locales rinden la cuenta general al Tribunal de Cuentas antes del:", "o": [["15 de octubre de cada año, referida al ejercicio anterior", 1, "Correcto: art. 223.2."], ["1 de octubre de cada año", 0, "El 1 de octubre es la fecha límite de aprobación por el Pleno (art. 212.4)."], ["31 de marzo del ejercicio siguiente", 0, "Ese es el plazo de remisión de la liquidación al Estado y a la CCAA (art. 193.5)."], ["15 de mayo del ejercicio siguiente", 0, "Esa es la rendición de estados y cuentas por el presidente (art. 212.1)."]]}, {"a": 223, "q": "La fiscalización externa del Tribunal de Cuentas excluye la de los órganos de control externo autonómicos.", "vf": true, "ok": false, "fb": "<b>Falso.</b> El art. 223.4 dice que lo establecido se entiende <b>sin menoscabo</b> de las facultades que los Estatutos atribuyan a las comunidades autónomas."}];
const CASOS=[{"t": "Caso 1 · El reparo que para (o no)", "e": "En el mismo ayuntamiento se producen cuatro situaciones: <b>(1)</b> la Intervención repara el reconocimiento de una obligación de 52.000 € porque el crédito propuesto no es adecuado a la naturaleza del gasto; <b>(2)</b> repara la liquidación de una tasa por error en la identificación del sujeto pasivo; <b>(3)</b> repara una orden de pago porque el expediente de contratación del que deriva nunca se fiscalizó; <b>(4)</b> repara la certificación final de una obra porque la comprobación material revela unidades no ejecutadas. <b>¿Qué expedientes se suspenden y quién resuelve si el gestor discrepa?</b>", "s": "<p><b>(1) Suspende</b> — art. 216.2.a): crédito no adecuado. Si el gestor discrepa, resuelve el <b>PLENO</b>, porque el reparo se basa en inadecuación de crédito (art. 217.2.a).</p><p><b>(2) NO suspende</b> — art. 216.1: el reparo afecta a la liquidación de <b>derechos</b>, se formaliza en nota de reparo y el expediente continúa. Si hubiera discrepancia, resolvería el <b>presidente</b> (art. 217.1), salvo que el gasto fuera competencia plenaria, lo que aquí no aplica.</p><p><b>(3) Suspende</b> — art. 216.2.b): no se fiscalizaron los actos que dieron origen a la orden de pago. Resuelve el <b>presidente</b>, de forma ejecutiva e indelegable.</p><p><b>(4) Suspende</b> — art. 216.2.d): reparo derivado de comprobación material de obras. Resuelve el presidente, salvo que la aprobación del gasto fuera del Pleno.</p><p><b>Después:</b> todas las resoluciones contrarias a los reparos se llevan al Pleno como <b>punto independiente</b> del orden del día (art. 218.1) y se remiten <b>anualmente</b> al Tribunal de Cuentas (art. 218.3).</p>"}, {"t": "Caso 2 · El calendario de la cuenta general", "e": "El alcalde rinde los estados y cuentas de 2026 el 22 de mayo de 2027. La Comisión Especial de Cuentas informa el 10 de junio. La cuenta se expone al público del 15 al 30 de junio y una asociación presenta observaciones. El Pleno la rechaza el 28 de septiembre. <b>Detecta los incumplimientos y di qué debe hacerse a continuación.</b>", "s": "<p><b>1) Rendición tardía.</b> El art. 212.1 exige rendirlas <b>antes del 15 de mayo</b>: el 22 de mayo incumple el plazo.</p><p><b>2) Informe tardío de la Comisión.</b> El art. 212.2 exige someterla a informe <b>antes del 1 de junio</b>: el 10 de junio también incumple.</p><p><b>3) Exposición correcta.</b> 15 días (art. 212.3). Presentadas observaciones, la Comisión Especial debe examinarlas, practicar las comprobaciones que estime necesarias y emitir <b>nuevo informe</b>. Ese trámite no puede omitirse.</p><p><b>4) Pronunciamiento en plazo.</b> El Pleno se pronuncia el 28 de septiembre, antes del 1 de octubre (art. 212.4). Que la rechace es una de las dos salidas posibles.</p><p><b>5) Qué procede ahora.</b> El presidente <b>debe rendirla igualmente al Tribunal de Cuentas</b> (art. 212.5), antes del <b>15 de octubre</b> de 2027 (art. 223.2). El rechazo plenario no bloquea la fiscalización externa.</p>"}, {"t": "Caso 3 · Rebajar el control sin perderlo", "e": "Un ayuntamiento con una Intervención de dos personas quiere aligerar la carga de trabajo. Propone: <b>(a)</b> dejar de fiscalizar previamente los contratos menores; <b>(b)</b> limitar la fiscalización previa del resto de gastos a comprobar el crédito y el órgano competente; <b>(c)</b> sustituir la fiscalización previa de los ingresos por su anotación contable; <b>(d)</b> que la interventora acuerde todo esto mediante resolución propia. <b>¿Qué es posible y con qué requisitos?</b>", "s": "<p><b>(a) Innecesario:</b> los contratos menores <b>ya están excluidos</b> de intervención previa por el art. 219.1, junto con el material no inventariable, los gastos periódicos y de tracto sucesivo tras el periodo inicial y los gastos menores de 3.005,06 € pagados por anticipos de caja fija.</p><p><b>(b) Posible</b> como fiscalización limitada previa (art. 219.2), comprobando la existencia y adecuación del crédito —y el art. 174 si hay compromisos plurianuales— y que el gasto se genera por órgano competente, más lo que añada el Pleno. Contrapartida obligatoria: <b>fiscalización plena posterior</b> sobre muestra representativa, con informe escrito al Pleno (art. 219.3).</p><p><b>(c) Posible</b> por acuerdo del <b>Pleno</b> (art. 219.4): sustitución por la toma de razón en contabilidad y actuaciones comprobatorias posteriores mediante muestreo o auditoría.</p><p><b>(d) No.</b> Ni (b) ni (c) los puede acordar la Intervención: los acuerda el <b>Pleno</b>, en el caso de (b) a propuesta del presidente y previo informe del órgano interventor. La Intervención informa, no decide sobre el alcance de su propio control.</p>"}];
const SEMAFORO=["Qué es la cuenta general y qué muestra — art. 208", "Integrantes de la cuenta general y estados consolidados — art. 209", "Competencia sobre contenido y estructura — art. 210", "Memorias de las entidades de más de 50.000 habitantes — art. 211", "Calendario de la cuenta general: 15-M, 1-J, 15 días, 1-O — art. 212", "Las tres modalidades del control interno — art. 213", "Objeto y modalidades de la función interventora — art. 214", "Reparos: forma y momento — art. 215", "Efectos suspensivos y los cuatro casos — art. 216", "Resolución de discrepancias: presidente y Pleno — art. 217", "Informe al Pleno y remisión al Tribunal de Cuentas — art. 218", "Exclusiones y fiscalización limitada previa — art. 219", "Control financiero: objeto, método y destino del informe — art. 220", "Control de eficacia — art. 221", "Facultades del personal controlador — art. 222", "Control externo: Tribunal de Cuentas y OCEX — art. 223"];
const INTRO_HTML="<section class=\"card\" id=\"intro\"><h2>Bloque 4 del tema 8 · Cuenta general, control y fiscalización</h2><p class=\"small\">Último tramo del tema 8. Primero, cómo se rinden las cuentas del ejercicio (arts. 208 a 212). Después, quién vigila: el control interno en sus tres modalidades (arts. 213 a 222) y el control externo del Tribunal de Cuentas (art. 223).</p><div class=\"box ej\"><span class=\"lbl\">La idea que ordena todo el bloque</span>Hay <b>dos círculos de control</b>. El de dentro lo ejercen funcionarios de la propia entidad y actúa antes (función interventora), después (control financiero) y sobre los resultados (control de eficacia). El de fuera lo ejerce el Tribunal de Cuentas sobre la cuenta general. La pieza que los une es la <b>cuenta general</b>: se forma dentro y se rinde fuera.</div><div class=\"box warn\"><span class=\"lbl\">Advertencia de vigencia</span>Texto consolidado del RDLeg 2/2004 actualizado a <b>28 de enero de 2026</b>. El régimen de control interno está desarrollado por el RD 424/2017, que precisa muchos de estos preceptos (procedimientos, informe resumen, plan anual de control financiero). Verifica siempre en el BOE consolidado.</div><svg viewBox=\"0 0 660 250\" role=\"img\" aria-label=\"Mapa conceptual de la cuenta general y el control\"><rect x=\"215\" y=\"8\" width=\"230\" height=\"36\" rx=\"9\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"330\" y=\"31\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"#fff\">RENDIR CUENTAS Y CONTROLAR</text><line x1=\"330\" y1=\"44\" x2=\"330\" y2=\"60\" stroke=\"var(--acc)\" stroke-width=\"2\"/><line x1=\"130\" y1=\"60\" x2=\"530\" y2=\"60\" stroke=\"var(--acc)\" stroke-width=\"2\"/><line x1=\"130\" y1=\"60\" x2=\"130\" y2=\"78\" stroke=\"var(--acc)\" stroke-width=\"2\"/><line x1=\"330\" y1=\"60\" x2=\"330\" y2=\"78\" stroke=\"var(--acc)\" stroke-width=\"2\"/><line x1=\"530\" y1=\"60\" x2=\"530\" y2=\"78\" stroke=\"var(--acc)\" stroke-width=\"2\"/><rect   clearMarks();

  var rx=new RegExp(term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
  document.querySelectorAll('section.card').forEach(function(s){
   var found=false;
   var w=document.createTreeWalker(s,NodeFilter.SHOW_TEXT,null);var nodes=[];
   while(w.nextNode()){var nd=w.currentNode;
    if(nd.parentNode.closest('script,style,mark'))continue;
    if(rx.test(nd.nodeValue)){nodes.push(nd);rx.lastIndex=0;}}
   nodes.forEach(function(nd){
    found=true;
    var span=document.createElement('span');
    span.innerHTML=nd.nodeValue.replace(rx,function(m){return '<mark class="hit">'+m+'</mark>';});
    nd.parentNode.replaceChild(span,nd);});
   if(found){s.querySelectorAll('details.panel').forEach(function(d){if(d.querySelector('mark.hit'))d.open=true;});}

function drawTest(){

     +(s.done?'<div class="small" style="margin-top:.2rem">'+op[2]+'</div>':'')+'</div>';});
  }else if(t.vf){
   [['Verdadero',true],['Falso',false]].forEach(function(p,oi){
    var sel=s.ans===oi;

   if(s.done)h+='<div class="small" style="margin-top:.3rem">'+t.fb+'</div>';

   if(s.done)h+='<div class="small" style="margin-top:.3rem;color:'+(s.right?'var(--ej)':'var(--exc)')+'">'+(s.right?'Correcto. ':'Respuesta correcta: <b>'+t.gap+'</b>. ')+t.fb+'</div>';
  }

 document.getElementById('testbox').innerHTML=h;
 document.querySelectorAll('.opt').forEach(function(o){

function norm(s){return (s||'').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();}
document.getElementById('tcorr').onclick=function(){

  if(t.o)s.right=(t.o[s.ans]&&t.o[s.ans][1]===1);

 var pct=tot?Math.round(n/tot*100):0;

/* Reveal on scroll para las tarjetas */
function reveal(){
  var els=document.querySelectorAll("section.card:not(.rv)");
  if(!els.length)return;
  if(!("IntersectionObserver" in window)){return;}
  var io=new IntersectionObserver(function(es){
    es.forEach(function(en){if(en.isIntersecting){en.target.classList.add("in");io.unobserve(en.target);}});
  },{threshold:.06,rootMargin:"0px 0px -30px 0px"});
  Array.prototype.forEach.call(els,function(el){el.classList.add("rv");io.observe(el);});
}

/* Sección activa en el índice lateral */
function spy(){
  var links=document.querySelectorAll("nav.side a[href^='#']");
  if(!links.length||!("IntersectionObserver" in window))return;
  var map={};
  Array.prototype.forEach.call(links,function(a){
    var t=document.getElementById(a.getAttribute("href").slice(1));
    if(t)map[t.id]=a;
  });
  var io=new IntersectionObserver(function(es){
    es.forEach(function(en){
      if(en.isIntersecting){
        Array.prototype.forEach.call(links,function(a){a.classList.remove("on");});
        if(map[en.target.id])map[en.target.id].classList.add("on");
      }
    });

<script>

/* ═══ Parser de respuestas: estructura semántica ═══ */
var FCFMT=(function(){
  var CITA=/\s*\(((?:arts?\.|DA\b|DT\b|disp\.)[^)]*)\)\s*\.?\s*$/i;
  var strip=function(h){return h.replace(/<[^>]+>/g,"");};

  function esc(s){return s;}

  function parse(raw){
    var out={verdict:null,cite:null,kind:"p",items:[],text:""};
    var body=String(raw).trim();

    /* 1 ── Cita legal al final */
    var m=body.match(CITA);
    if(m){out.cite=m[1].replace(/\s+/g," ").trim();body=body.slice(0,m.index).trim();}
    body=body.replace(/[.;,\s]+$/,"");

    /* 2 ── Veredicto Sí / No inicial */
    var v=strip(body).match(/^(Sí|Sí,|No|No,)[.:,]?\s/);
    if(v){
      out.verdict=/^Sí/.test(v[1])?"si":"no";
      body=body.replace(/^(<[^>]+>\s*)*(Sí|No)[.,:]?\s*/,"").trim();
      body=body.replace(/^en\s/,"En ");
    }

    /* 3 ── Enumeración con · */
    var parts=body.split(/\s+·\s+/);
    if(parts.length>=2){
      out.kind="list";
      var letras=parts.filter(function(p){return /^\s*<?[a-h]\)/.test(strip(p));}).length;
      out.marker = letras>=parts.length-1 ? "alpha" : "num";
      out.items=parts.map(function(p){
        return p.replace(/^\s*[a-h]\)\s*/,"").replace(/[.\s]+$/,"").trim();
      }).filter(Boolean);
      return out;
    }

    /* 4 ── Cláusulas contrapuestas con ; */
    var semi=body.split(/;\s+/);
    if(semi.length>=2&&semi.length<=3&&semi.every(function(s){return strip(s).length>14;})){
      out.kind="clauses";
      out.items=semi.map(function(s){return s.replace(/[.\s]+$/,"").trim();});
      return out;
    }

    /* 5 ── Párrafo */
    out.text=body;
    return out;
  }

  function render(raw){
    var d=parse(raw),h="";

    if(d.verdict){
      h+='<span class="fc-verdict '+d.verdict+'">'+(d.verdict==="si"?"✓ Sí":"✗ No")+'</span>';
    }

    if(d.kind==="list"){
      h+='<ol class="fc-list '+d.marker+'">';
      d.items.forEach(function(it){h+='<li>'+it+'</li>';});
      h+='</ol>';
    }else if(d.kind==="clauses"){
      h+='<div class="fc-clauses">';
      d.items.forEach(function(it){h+='<p>'+it+'</p>';});
      h+='</div>';
    }else if(d.text){
      h+='<p class="fc-p">'+d.text+'</p>';
    }

    if(d.cite){
      h+='<span class="fc-cite"><span class="s">§</span>'+d.cite+'</span>';
    }
    return {html:h,struct:(d.kind!=="p"||!!d.verdict||strip(raw).length>150)};
  }
  return {parse:parse,render:render};
})();

    +'<span class="fc-score">'
      +'<span class="fc-pill ok" id="fcpok">0 sabidas</span>'

  sec.appendChild(ctr);

  var deck=stage.querySelector("#fcdeck"), lift=stage.querySelector("#fclift"),

      front=stage.querySelector(".fc-front"), backf=stage.querySelector(".fc-back"),
      fill=bar.querySelector("i"),
      pok=ctr.querySelector("#fcpok"), pko=ctr.querySelector("#fcpko"),
      pleft=ctr.querySelector("#fccount");
  var rot=0;

  function reset(){
    order=CARDS.map(function(_,i){return i;});
    fi=0;ok=0;ko=0;back=false;busy=false;rot=0;
    card.style.transition="none";card.style.transform="rotateY(0deg)";
    void card.offsetWidth;card.style.transition="";
    deck.classList.remove("empty");
    var d=stage.querySelector(".fc-done");if(d)d.remove();
    card.style.display="";
    draw();
  }

  function bump(el){el.classList.remove("bump");void el.offsetWidth;el.classList.add("bump");}

  function draw(){
    pok.textContent=ok+(ok===1?" sabida":" sabidas");
    pko.textContent=ko+" repasar";
    var done=N-order.length;
    fill.style.width=(N?done/N*100:0)+"%";

    if(!order.length){

          +'<p>'+ok+' de '+N+' a la primera'+(ko?' · '+ko+' necesitaron repaso':'')+'</p>';
        deck.appendChild(d);
      }
      return;
    }
    if(fi>=order.length)fi=0;
    pleft.textContent=order.length+(order.length===1?" queda":" quedan");

    var c=CARDS[order[fi]];
    front.querySelector(".fc-txt").innerHTML='<p class="fc-p">'+c[0]+'</p>';
    var r=FCFMT.render(c[1]);
    backf.querySelector(".fc-txt").innerHTML=r.html;
    backf.classList.toggle("struct",r.struct);
    var hint=backf.querySelector(".fc-hint");

    var pip=(done+1)+"/"+N;
    Array.prototype.forEach.call(stage.querySelectorAll(".fc-pip"),function(p){p.textContent=pip;});
  }

  function flip(){
    if(busy||!order.length)return;
    back=!back;rot+=180;
    card.style.transform="rotateY("+rot+"deg)";
    card.setAttribute("aria-label",back?"Respuesta. Pulsa para volver":"Pregunta. Pulsa para girar");
    lift.classList.remove("lift");void lift.offsetWidth;lift.classList.add("lift");
  }

  function next(good){
    if(busy||!order.length)return;
    busy=true;
    if(good){ok++;bump(pok);}else{ko++;bump(pko);}
    lift.classList.remove("lift");
    lift.classList.add(good?"out-ok":"out-ko");
    setTimeout(function(){
      if(good){order.splice(fi,1);}
      else{var m=order.splice(fi,1)[0];order.push(m);}
      back=false;rot=0;
      card.style.transition="none";card.style.transform="rotateY(0deg)";
      void card.offsetWidth;card.style.transition="";
      draw();
      lift.classList.remove("out-ok","out-ko");
      lift.classList.add("in");
      setTimeout(function(){lift.classList.remove("in");busy=false;},480);
    },460);
  }

  card.onclick=flip;
  card.onkeydown=function(e){
    if(e.key===" "||e.key==="Enter"){e.preventDefault();flip();}
    if(e.key==="ArrowRight"){e.preventDefault();next(true);}
    if(e.key==="ArrowLeft"){e.preventDefault();next(false);}
  };
  ctr.querySelector("#fcflip").onclick=flip;
  ctr.querySelector("#fcok").onclick=function(){next(true);};
  ctr.querySelector("#fcko").onclick=function(){next(false);};
  ctr.querySelector("#fcreset").onclick=reset;

  /* Deslizar en táctil */
  var x0=null,y0=null;
  card.addEventListener("touchstart",function(e){x0=e.touches[0].clientX;y0=e.touches[0].clientY;},{passive:true});
  card.addEventListener("touchend",function(e){

  });

}

}

    if(!anim)lay.style.transition="none";

  document.addEventListener("keydown",function(e){

/* ── 2 · La tarjeta se adapta a su contenido ── */
function autofit(){
  var stage=document.querySelector(".fc-stage");
  if(!stage||stage.dataset.fit)return;
  var deck=stage.querySelector(".fc-deck"),
      front=stage.querySelector(".fc-front"),
      back=stage.querySelector(".fc-back");
  if(!deck||!front||!back)return;
  stage.dataset.fit="1";

  var meas=document.createElement("div");
  meas.className="fc-measure";meas.setAttribute("aria-hidden","true");
  meas.innerHTML='<div class="fc-face fc-front"><div class="fc-body"><div class="fc-txt"></div></div></div>';
  stage.appendChild(meas);
  var mFace=meas.querySelector(".fc-face"), mTxt=meas.querySelector(".fc-txt");

  function measure(cls,html){
    mFace.className="fc-face "+cls;
    mTxt.innerHTML=html;
    return mFace.offsetHeight;
  }

  function fit(){
    if(deck.classList.contains("empty")){deck.style.height="230px";return;}
    var fT=front.querySelector(".fc-txt"), bT=back.querySelector(".fc-txt");
    if(!fT||!bT)return;

      measure("fc-front"+(front.classList.contains("struct")?" struct":""),fT.innerHTML),
      measure("fc-back" +(back .classList.contains("struct")?" struct":""),bT.innerHTML),
      230
    );
    deck.style.height=Math.ceil(h+8)+"px";
  }

  /* recalcular cuando cambia la tarjeta, el tamaño de letra o la ventana */
  new MutationObserver(fit).observe(back,{childList:true,subtree:true,attributes:true,attributeFilter:["class"]});
  var t;

    var el=document.getElementById(id);
    if(el)el.addEventListener("click",function(){setTimeout(fit,60);});
  });
  fit();setTimeout(fit,250);
}

})();

(function(){
"use strict";
if(!("speechSynthesis" in window))return;

var K="oposi_bII_tts";
function load(){try{return JSON.parse(localStorage.getItem(K))||{};}catch(e){return {};}}
function save(o){try{localStorage.setItem(K,JSON.stringify(o));}catch(e){}}

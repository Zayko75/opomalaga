<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>TRLHL · Arts. 208-212 y 213-223 · Cuenta general, control y fiscalización</title>
<style>
/* ═══════════════════════════════════════════════════════════════
   SISTEMA DE DISEÑO · "Académico Gamificado" · Bloque II
   Temas 8, 9 y 10 · Auxiliar Administrativo
   ═══════════════════════════════════════════════════════════════ */
:root{
  --fs:16px;

  --bg:#faf9f7;
  --bg-grad:radial-gradient(1100px 560px at 12% -8%, #ede9ff 0%, transparent 55%),
            radial-gradient(850px 460px at 96% 0%, #dcf5ee 0%, transparent 50%);
  --surface:#ffffff;
  --surface-2:#f4f3f0;
  --surface-3:#eceae5;
  --line:#e6e3dc;
  --line-strong:#d4d0c7;

  --ink:#15161c;
  --ink-2:#5d616e;
  --ink-3:#8b8f9c;

  --brand:#5b3df5;
  --brand-2:#7c5cff;
  --brand-soft:#efeaff;
  --brand-ring:rgba(91,61,245,.18);

  --legal:#4338ca;  --legal-bg:#eeecff;
  --ej:#059669;     --ej-bg:#e4f7f0;
  --warn:#c2690a;   --warn-bg:#fdf1de;
  --exc:#dc2626;    --exc-bg:#ffeceb;

  --ok:#16a34a; --ok-soft:#e7f7ec;
  --mid:#eab308; --mid-soft:#fdf6dd;
  --off:#a1a1aa; --off-soft:#f1f1f3;

  --sh-1:0 1px 2px rgba(20,20,30,.04), 0 2px 8px rgba(20,20,30,.04);
  --sh-2:0 2px 6px rgba(20,20,30,.05), 0 12px 28px rgba(20,20,30,.07);
  --sh-3:0 8px 20px rgba(91,61,245,.13), 0 24px 56px rgba(20,20,30,.10);
  --sh-glow:0 0 0 4px var(--brand-ring);

  --r-sm:9px; --r-md:14px; --r-lg:20px; --r-full:999px;

  --f-display:"Segoe UI Variable Display",system-ui,-apple-system,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-legal:ui-serif,Georgia,Cambria,"Times New Roman",serif;
  --f-mono:ui-monospace,"SF Mono","Cascadia Mono","Segoe UI Mono",Menlo,monospace;

  --t-h1:clamp(1.02rem,.95rem + .3vw,1.2rem);
  --t-h2:clamp(1.2rem,1.05rem + .6vw,1.55rem);
  --t-h3:clamp(1rem,.95rem + .25vw,1.12rem);
  --t-sm:.86rem;
  --t-xs:.75rem;

  --e-out:cubic-bezier(.22,1,.36,1);
  --e-spring:cubic-bezier(.34,1.56,.64,1);

  /* ── Compatibilidad con SVG y contenido generado ── */
  --panel:var(--surface);
  --ink2:var(--ink-2);
  --acc:var(--brand);
  --acc-soft:var(--brand-soft);
  --g:var(--ok); --y:var(--mid); --r:var(--exc);
}

html[data-theme="dark"]{
  --bg:#0a0b0f;
  --bg-grad:radial-gradient(1100px 560px at 12% -8%, #1c1740 0%, transparent 55%),
            radial-gradient(850px 460px at 96% 0%, #08302b 0%, transparent 50%);
  --surface:#13151b;
  --surface-2:#1a1d25;
  --surface-3:#232733;
  --line:#262a34;
  --line-strong:#343947;

  --ink:#eceef4;
  --ink-2:#9ba2b3;
  --ink-3:#6e7585;

  --brand:#8b6dff;
  --brand-2:#a78bff;
  --brand-soft:#1e1a3d;
  --brand-ring:rgba(139,109,255,.22);

  --legal:#a5b4fc; --legal-bg:#191b3a;
  --ej:#34d399;    --ej-bg:#0c2a24;
  --warn:#fbbf24;  --warn-bg:#2e2110;
  --exc:#fb7185;   --exc-bg:#331119;

  --ok:#4ade80; --ok-soft:#0e2a19;
  --mid:#facc15; --mid-soft:#2c2610;
  --off:#5b6070; --off-soft:#1c1f27;

  --sh-1:0 1px 2px rgba(0,0,0,.3), 0 2px 8px rgba(0,0,0,.25);
  --sh-2:0 2px 6px rgba(0,0,0,.35), 0 12px 28px rgba(0,0,0,.4);
  --sh-3:0 8px 20px rgba(139,109,255,.2), 0 24px 56px rgba(0,0,0,.5);
}

*,*::before,*::after{box-sizing:border-box}
html{font-size:var(--fs);scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);background-image:var(--bg-grad);
  background-attachment:fixed;background-repeat:no-repeat;
  color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.68;
  -webkit-font-smoothing:antialiased;
  transition:background-color .5s var(--e-out),color .3s;
}
::selection{background:var(--brand);color:#fff}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{font-family:var(--f-display);letter-spacing:-.022em;line-height:1.2}
.num{font-variant-numeric:tabular-nums}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:99px;border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3)}

/* ═══ HEADER ═══ */
header.top{
  position:sticky;top:0;z-index:60;
  background:color-mix(in srgb,var(--surface) 80%,transparent);
  backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);
  border-bottom:1px solid var(--line);
}
.top-in{max-width:1280px;margin:0 auto;padding:.65rem 1.1rem;display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.brandwrap{display:flex;align-items:center;gap:.65rem;min-width:0;flex:1}
.mark{
  width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;
  font-weight:800;font-size:.8rem;letter-spacing:-.02em;text-decoration:none;
  box-shadow:0 4px 14px var(--brand-ring);
  transition:transform .3s var(--e-spring),box-shadow .3s;
}
.mark:hover{transform:rotate(-8deg) scale(1.08);box-shadow:var(--sh-3);text-decoration:none}
.top h1{font-size:var(--t-h1);margin:0;font-weight:800;line-height:1.25;min-width:0}
.top h1 .sub{display:block;font-size:var(--t-xs);color:var(--ink-2);font-weight:500;letter-spacing:0;
  margin-top:.1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tools{margin-left:auto;display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}

button,select,input[type=search]{
  font:inherit;font-size:var(--t-sm);font-weight:600;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:var(--r-sm);padding:.4rem .72rem;cursor:pointer;
  position:relative;overflow:hidden;
  transition:transform .18s var(--e-spring),border-color .2s,background .2s,box-shadow .2s,color .2s;
}
button:hover{transform:translateY(-1.5px);border-color:var(--brand);box-shadow:var(--sh-1)}
button:active{transform:translateY(0) scale(.97)}
button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible{outline:none;box-shadow:var(--sh-glow)}
input[type=search]{min-width:190px;cursor:text;font-weight:500}
input[type=search]:focus{border-color:var(--brand)}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--surface-2);padding:2px;gap:2px}
.seg button{border:0;border-radius:calc(var(--r-sm) - 2px);padding:.32rem .68rem;background:transparent;box-shadow:none}
.seg button:hover{transform:none;background:var(--surface)}
.seg button[aria-pressed="true"]{background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;box-shadow:0 2px 8px var(--brand-ring)}

.ripple{position:absolute;border-radius:50%;transform:scale(0);background:currentColor;opacity:.25;animation:rip .55s linear;pointer-events:none}
@keyframes rip{to{transform:scale(3.4);opacity:0}}

.progress{position:absolute;left:0;bottom:-1px;height:2.5px;width:0;
  background:linear-gradient(90deg,var(--brand),var(--legal),var(--ej));transition:width .1s linear}

/* ═══ LAYOUT ═══ */
.layout{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:270px 1fr;gap:1.8rem;padding:1.4rem 1.1rem 5rem}
main{min-width:0}

/* ═══ SIDEBAR ═══ */
nav.side{
  position:sticky;top:76px;align-self:start;max-height:calc(100vh - 96px);overflow:auto;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:.85rem;box-shadow:var(--sh-1);
}
nav.side h2{font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);
  margin:.5rem .4rem .5rem;font-weight:800}
nav.side h2:first-child{margin-top:.1rem}
nav.side a{
  display:flex;align-items:baseline;gap:.5rem;padding:.36rem .55rem;border-radius:var(--r-sm);
  text-decoration:none;color:var(--ink-2);font-size:var(--t-sm);font-weight:500;
  position:relative;transition:background .22s,color .22s,transform .22s var(--e-out);
}
nav.side a:hover{background:var(--surface-2);color:var(--ink);transform:translateX(3px);text-decoration:none}
nav.side a.on{background:var(--brand-soft);color:var(--brand);font-weight:700}
nav.side a.on::before{content:"";position:absolute;left:-.85rem;top:20%;bottom:20%;width:3px;
  border-radius:0 3px 3px 0;background:var(--brand)}
nav.side a b{color:var(--ink-3);font-weight:800;font-size:var(--t-xs);font-variant-numeric:tabular-nums;flex:none;min-width:1.9em}
nav.side a.on b{color:var(--brand)}
.navtoggle{display:none}

/* ═══ TARJETAS ═══ */
section.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:1.35rem 1.5rem;margin-bottom:1.1rem;box-shadow:var(--sh-1);
  transition:box-shadow .3s var(--e-out),border-color .3s;
}
section.card:hover{box-shadow:var(--sh-2)}
section.card>h2{
  margin:0 0 1rem;font-size:var(--t-h2);font-weight:800;
  display:flex;align-items:center;gap:.6rem;
}
section.card>h2::before{
  content:"";width:4px;height:1.05em;border-radius:99px;flex:none;
  background:linear-gradient(180deg,var(--brand),var(--brand-2));
}

/* ═══ ARTÍCULO ═══ */
.art{scroll-margin-top:86px;padding-top:.4rem}
.art + .art{margin-top:1.6rem;padding-top:1.6rem;border-top:1px dashed var(--line)}
.art h2{display:flex;flex-wrap:wrap;gap:.5rem;align-items:baseline;font-size:var(--t-h3);
  margin:0 0 .25rem;font-weight:800;letter-spacing:-.015em}
.art h2 .num{
  color:var(--brand);font-weight:800;font-family:var(--f-display);
  background:var(--brand-soft);padding:.1rem .5rem;border-radius:var(--r-sm);
  font-size:.92em;letter-spacing:-.02em;
}
.ubic{font-size:var(--t-xs);color:var(--ink-3);margin:0 0 .8rem;font-weight:600;
  letter-spacing:.03em;text-transform:uppercase}

/* ═══ IDEA CLAVE ═══ */
.idea{
  background:linear-gradient(100deg,var(--brand-soft),color-mix(in srgb,var(--brand-soft) 40%,transparent));
  border-left:4px solid var(--brand);border-radius:0 var(--r-md) var(--r-md) 0;
  padding:.75rem 1rem;font-weight:650;margin:.7rem 0 1rem;position:relative;
  font-size:.97rem;line-height:1.55;
}

/* ═══ ACORDEÓN ═══ */
details.panel{
  border:1px solid var(--line);border-radius:var(--r-md);margin:.6rem 0;
  background:var(--surface);overflow:hidden;
  transition:border-color .25s,box-shadow .25s,background .25s;
}
details.panel:hover{border-color:var(--line-strong)}
details.panel[open]{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-ring)}
details.panel>summary{
  cursor:pointer;padding:.62rem .9rem;font-weight:700;font-size:.93rem;
  list-style:none;display:flex;align-items:center;gap:.55rem;
  transition:background .2s,color .2s;
}
details.panel>summary:hover{background:var(--surface-2)}
details.panel[open]>summary{background:var(--brand-soft);color:var(--brand)}
details.panel>summary::-webkit-details-marker{display:none}
details.panel>summary::before{
  content:"";width:16px;height:16px;flex:none;border-radius:5px;
  background:var(--brand-soft);position:relative;transition:transform .3s var(--e-spring),background .25s;
}
details.panel>summary::after{
  content:"";position:absolute;width:0;height:0;margin-left:5px;
  border:4px solid transparent;border-left-color:var(--brand);
  transition:transform .3s var(--e-spring);
}
details.panel[open]>summary::before{background:var(--surface)}
details.panel[open]>summary::after{transform:rotate(90deg) translateX(-1px)}
details.panel .body{padding:.3rem 1rem 1rem;font-size:.95rem;animation:slidein .35s var(--e-out)}
@keyframes slidein{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* ═══ TEXTO LEGAL ═══ */
.legal{
  background:var(--legal-bg);border-left:4px solid var(--legal);
  border-radius:0 var(--r-md) var(--r-md) 0;padding:.85rem 1.05rem;
  font-family:var(--f-legal);font-size:.95rem;line-height:1.7;
}
.legal p{margin:.45rem 0}
.legal .lbl{
  font-family:var(--f-body);font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;
  color:var(--legal);font-weight:800;display:block;margin-bottom:.4rem;
}

/* ═══ CAJAS SEMÁNTICAS ═══ */
.box{
  border-left:4px solid var(--line);border-radius:0 var(--r-md) var(--r-md) 0;
  padding:.72rem .95rem;margin:.65rem 0;font-size:.94rem;
  transition:transform .25s var(--e-out),box-shadow .25s;
}
.box:hover{transform:translateX(3px);box-shadow:var(--sh-1)}
.box.ej{background:var(--ej-bg);border-color:var(--ej)}
.box.warn{background:var(--warn-bg);border-color:var(--warn)}
.box.exc{background:var(--exc-bg);border-color:var(--exc)}
.box .lbl{font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;font-weight:800;
  display:block;margin-bottom:.3rem}
.box.ej .lbl{color:var(--ej)}
.box.warn .lbl{color:var(--warn)}
.box.exc .lbl{color:var(--exc)}

.interp{
  border:1px dashed var(--warn);background:color-mix(in srgb,var(--warn-bg) 45%,transparent);
  border-radius:var(--r-md);padding:.65rem .9rem;font-size:.9rem;margin:.6rem 0;
}
.interp .lbl{font-size:var(--t-xs);letter-spacing:.11em;text-transform:uppercase;color:var(--warn);font-weight:800;display:block}

/* ═══ TABLAS ═══ */
table{width:100%;border-collapse:separate;border-spacing:0;font-size:.9rem;margin:.7rem 0;
  border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
th,td{padding:.5rem .68rem;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
td + td, th + th{border-left:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th{background:var(--surface-2);font-size:var(--t-xs);font-weight:800;letter-spacing:.05em;
  text-transform:uppercase;color:var(--ink-2);position:sticky;top:0}
tbody tr{transition:background .18s}
tbody tr:nth-child(even){background:color-mix(in srgb,var(--surface-2) 45%,transparent)}
tbody tr:hover{background:var(--brand-soft)}
th.sortable{cursor:pointer;user-select:none;transition:color .2s,background .2s}
th.sortable:hover{color:var(--brand);background:var(--brand-soft)}
th.sortable::after{content:" ⇅";color:var(--ink-3);font-size:.7rem}

ul,ol{margin:.5rem 0 .5rem 1.2rem;padding:0}
li{margin:.26rem 0}
li::marker{color:var(--brand);font-weight:700}

/* ═══ TOOLTIPS ═══ */
.t{border-bottom:1.5px dotted var(--brand);cursor:help;position:relative;
  transition:background .2s,color .2s}
.t:hover{background:var(--brand-soft);color:var(--brand);border-radius:3px}
#tip{
  position:fixed;z-index:99;max-width:330px;background:var(--ink);color:var(--bg);
  padding:.6rem .78rem;border-radius:var(--r-md);font-size:.82rem;line-height:1.5;
  display:none;box-shadow:0 8px 30px rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.08);
}
html[data-theme="dark"] #tip{background:#f0f1f5;color:#15161c}

/* ═══ FLECHAS DE DIAGRAMA ═══
   Un <path> con stroke pero sin fill toma el valor inicial (negro) y el
   navegador cierra el trazo implícitamente: aparece un triángulo relleno
   entre sus extremos. Forzamos fill:none para dejar solo la línea + la
   punta del <marker>, que sí lleva su color. */
svg path[stroke]:not([fill]){fill:none}
svg polyline:not([fill]){fill:none}
svg line{fill:none}

/* ═══ SVG ═══ */
svg{max-width:100%;height:auto;display:block;margin:.9rem auto}
svg text{font-family:var(--f-body)}

/* ═══ BUSCADOR ═══ */
mark.hit{background:linear-gradient(180deg,transparent 55%,#ffe066 55%);color:inherit;
  border-radius:2px;padding:0 1px;font-weight:600}
html[data-theme="dark"] mark.hit{background:linear-gradient(180deg,transparent 55%,#8a6d00 55%);color:#fff}

/* ═══ UTILIDADES ═══ */
.hide{display:none !important}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.small{font-size:var(--t-sm);color:var(--ink-2)}
.chip{
  display:inline-block;font-size:var(--t-xs);padding:.16rem .55rem;border-radius:var(--r-full);
  background:var(--brand-soft);color:var(--brand);font-weight:800;letter-spacing:.02em;
}

/* ═══ HUECOS RELLENABLES ═══ */
.gap{
  display:inline-block;min-width:5.5em;border-bottom:2px solid var(--brand);
  text-align:center;font-weight:700;color:transparent;cursor:pointer;
  transition:color .3s,background .3s;
}
.gap.on,.gap:hover{color:var(--brand);background:var(--brand-soft);border-radius:4px 4px 0 0}

/* ═══ REVELAR SOLUCIÓN ═══ */
.revelar{
  background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;border-color:transparent;
  font-weight:700;
}
.revelar:hover{box-shadow:var(--sh-3)}
.sol{
  margin-top:.7rem;padding:.8rem 1rem;border-radius:var(--r-md);
  background:var(--ej-bg);border-left:4px solid var(--ej);
  animation:slidein .4s var(--e-out);
}

/* ═══ TEST ═══ */
.opt{
  display:block;padding:.55rem .85rem;margin:.35rem 0;border:1.5px solid var(--line);
  border-radius:var(--r-md);cursor:pointer;background:var(--surface);font-size:.94rem;
  transition:border-color .22s,background .22s,transform .22s var(--e-out);
}
.opt:hover{border-color:var(--brand);background:var(--brand-soft);transform:translateX(4px)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft);font-weight:650}
.opt.ko{border-color:var(--exc);background:var(--exc-bg)}
.opt input{margin-right:.5rem;accent-color:var(--brand)}

#tscore,#semres{
  font-family:var(--f-display);font-weight:800;font-size:1.15rem;letter-spacing:-.02em;
}

/* ═══════════════════════════════════════════════════════════════
   FLASHCARDS 3D · mazo con giro, vuelo de salida y sheen
   ═══════════════════════════════════════════════════════════════ */
#flash{--fc-e:cubic-bezier(.2,.8,.25,1);--fc-h:250px}

/* — Escena — */
.fc-stage{
  perspective:1400px;perspective-origin:50% 45%;
  padding:.4rem 0 .2rem;position:relative;
}
.fc-deck{position:relative;height:var(--fc-h);will-change:transform}

/* — Cartas fantasma del mazo — */
.fc-ghost{
  position:absolute;inset:0;border-radius:var(--r-lg);
  background:var(--surface);border:1px solid var(--line);
  transition:transform .5s var(--fc-e),opacity .5s var(--fc-e);
}
.fc-ghost.g1{transform:translateY(9px) scale(.972);opacity:.75}
.fc-ghost.g2{transform:translateY(18px) scale(.944);opacity:.45}
.fc-deck.empty .fc-ghost{opacity:0;transform:translateY(26px) scale(.9)}

/* — Elevación durante el giro — */
.fc-lift{position:absolute;inset:0;transform-style:preserve-3d}
.fc-lift.lift{animation:fcLift .78s var(--fc-e)}
@keyframes fcLift{
  0%,100%{transform:scale(1) translateY(0)}
  45%{transform:scale(1.055) translateY(-16px)}
}
.fc-lift.out-ok{animation:fcOut .5s cubic-bezier(.5,0,.75,0) forwards}
.fc-lift.out-ko{animation:fcOutKo .5s cubic-bezier(.5,0,.75,0) forwards}
.fc-lift.in{animation:fcIn .48s var(--fc-e)}
@keyframes fcOut{
  0%{transform:translateX(0) rotate(0) scale(1);opacity:1}
  100%{transform:translateX(130%) rotate(17deg) scale(.85);opacity:0}
}
@keyframes fcOutKo{
  0%{transform:translateX(0) rotate(0) scale(1);opacity:1}
  100%{transform:translateX(-130%) rotate(-17deg) scale(.85);opacity:0}
}
@keyframes fcIn{
  0%{transform:translateY(26px) scale(.9);opacity:0}
  100%{transform:translateY(0) scale(1);opacity:1}
}

/* — La carta — */
.fc-card{
  position:absolute;inset:0;transform-style:preserve-3d;
  transition:transform .78s var(--fc-e);
  cursor:pointer;border-radius:var(--r-lg);
}
.fc-card:focus-visible{outline:none}
.fc-card:focus-visible .fc-face{box-shadow:var(--sh-glow),var(--sh-2)}

/* — Caras — */
.fc-face{
  position:absolute;inset:0;border-radius:var(--r-lg);
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  padding:2rem 2.2rem;text-align:center;overflow:hidden;
  box-shadow:var(--sh-2);
  transition:box-shadow .4s var(--fc-e);
}
.fc-card:hover .fc-face{box-shadow:var(--sh-3)}

/* Anverso · pregunta */
.fc-front{
  background:
    radial-gradient(120% 90% at 50% -20%, var(--brand-soft) 0%, transparent 60%),
    var(--surface);
  border:1.5px solid var(--line);color:var(--ink);
}
/* Reverso · respuesta */
.fc-back{
  transform:rotateY(180deg);
  background:linear-gradient(145deg,var(--brand) 0%,#6d4bf7 45%,var(--c5,#0891b2) 130%);
  border:1.5px solid transparent;color:#fff;
}
html[data-theme="dark"] .fc-back{
  background:linear-gradient(145deg,#5f45c9 0%,#4b3aa8 45%,#0e6b85 130%);
}
.fc-back .fc-txt{color:#fff}
.fc-back b,.fc-back strong{color:#fff;font-weight:800}

/* — Sheen que barre al girar — */
.fc-face::after{
  content:"";position:absolute;top:-60%;left:-70%;width:55%;height:220%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.42),transparent);
  transform:rotate(18deg);opacity:0;pointer-events:none;
}
.fc-lift.lift .fc-face::after{animation:fcSheen .78s var(--fc-e)}
@keyframes fcSheen{
  0%{opacity:0;left:-70%}
  35%{opacity:1}
  100%{opacity:0;left:150%}
}

/* — Etiqueta superior — */
.fc-tag{
  position:absolute;top:1rem;left:1.15rem;
  font-size:var(--t-xs);font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  display:inline-flex;align-items:center;gap:.4rem;
}
.fc-front .fc-tag{color:var(--brand)}
.fc-back .fc-tag{color:rgba(255,255,255,.9)}
.fc-tag::before{
  content:"";width:7px;height:7px;border-radius:50%;background:currentColor;
  animation:fcPulse 2.2s ease-in-out infinite;
}
@keyframes fcPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.65)}}

/* — Índice tipo naipe — */
.fc-pip{
  position:absolute;font-family:var(--f-display);font-weight:800;
  font-size:.78rem;letter-spacing:-.02em;opacity:.34;font-variant-numeric:tabular-nums;
}
.fc-pip.tr{top:1rem;right:1.15rem}
.fc-pip.bl{bottom:1rem;left:1.15rem;transform:rotate(180deg)}
.fc-front .fc-pip{color:var(--ink-2)}
.fc-back .fc-pip{color:#fff;opacity:.55}

/* — Texto — */
.fc-txt{
  font-size:clamp(1rem,.9rem + .55vw,1.28rem);font-weight:650;line-height:1.5;
  max-width:44ch;letter-spacing:-.012em;
}
.fc-front .fc-txt{font-family:var(--f-display);font-weight:700}
.fc-back .fc-txt{font-weight:600;line-height:1.6}
.fc-hint{
  position:absolute;bottom:1rem;left:0;right:0;
  font-size:var(--t-xs);font-weight:600;letter-spacing:.02em;
  display:flex;align-items:center;justify-content:center;gap:.4rem;
}
.fc-front .fc-hint{color:var(--ink-3)}
.fc-back .fc-hint{color:rgba(255,255,255,.72)}
.fc-hint .kbd{
  font-family:var(--f-mono);font-size:.68rem;font-weight:700;padding:.1rem .32rem;
  border-radius:5px;border:1px solid currentColor;opacity:.75;
}

/* — Pantalla final — */
.fc-done{
  position:absolute;inset:0;border-radius:var(--r-lg);
  background:linear-gradient(150deg,var(--ok-soft),var(--surface) 70%);
  border:1.5px solid var(--ok);
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  text-align:center;padding:2rem;gap:.35rem;
  animation:fcIn .5s var(--fc-e);box-shadow:var(--sh-2);
}
.fc-done .seal{
  font-size:2.6rem;line-height:1;
  animation:fcSeal .7s cubic-bezier(.2,1.5,.4,1);
}
@keyframes fcSeal{0%{transform:scale(0) rotate(-25deg);opacity:0}60%{transform:scale(1.2) rotate(6deg)}100%{transform:scale(1) rotate(0);opacity:1}}
.fc-done h3{font-size:1.3rem;font-weight:800;margin:.2rem 0 0}
.fc-done p{margin:0;color:var(--ink-2);font-size:var(--t-sm)}

/* — Barra de progreso de la ronda — */
.fc-bar{
  height:6px;border-radius:99px;background:var(--surface-3);
  overflow:hidden;margin:.95rem 0 .8rem;position:relative;
}
.fc-bar i{
  display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--brand),var(--c5,#0891b2));
  transition:width .55s var(--fc-e);
}

/* — Controles — */
.fc-ctrls{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.fc-ctrls button{font-weight:700}
#fcok{border-color:var(--ok);color:var(--ok)}
#fcok:hover{background:var(--ok);color:#fff;border-color:var(--ok)}
#fcko{border-color:var(--warn);color:var(--warn)}
#fcko:hover{background:var(--warn);color:#fff;border-color:var(--warn)}
#fcflip{background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;border-color:transparent}
#fcflip:hover{box-shadow:var(--sh-3)}

.fc-score{display:inline-flex;gap:.45rem;margin-left:auto;align-items:center}
.fc-pill{
  font-size:var(--t-xs);font-weight:800;padding:.24rem .6rem;border-radius:var(--r-full);
  font-variant-numeric:tabular-nums;border:1px solid;
}
.fc-pill.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.fc-pill.ko{color:var(--warn);border-color:var(--warn);background:var(--warn-bg)}
.fc-pill.left{color:var(--ink-2);border-color:var(--line);background:var(--surface-2)}
.fc-pill.bump{animation:fcBump .45s var(--e-spring)}
@keyframes fcBump{0%{transform:scale(1)}45%{transform:scale(1.28)}100%{transform:scale(1)}}

@media(max-width:620px){
  #flash{--fc-h:270px}
  .fc-face{padding:1.7rem 1.3rem}
  .fc-score{margin-left:0;width:100%}
}
@media(prefers-reduced-motion:reduce){
  .fc-card{transition:none}
  .fc-lift.lift,.fc-lift.in,.fc-lift.out-ok,.fc-lift.out-ko,.fc-face::after{animation:none !important}
}
@media print{.fc-stage,.fc-ctrls,.fc-bar{display:none !important}}
/* ═══ RESPUESTA ESTRUCTURADA ═══ */
.fc-face{justify-content:center}
.fc-face.struct{justify-content:flex-start;text-align:left;padding-top:3.1rem;padding-bottom:3.1rem}
.fc-body{
  width:100%;max-width:46ch;margin:0 auto;
  overflow-y:auto;max-height:100%;
  scrollbar-width:thin;
}
.fc-body::-webkit-scrollbar{width:5px}
.fc-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.35);border-radius:99px;border:0}
.fc-front .fc-body::-webkit-scrollbar-thumb{background:var(--line-strong)}

/* — Veredicto Sí / No — */
.fc-verdict{
  display:inline-flex;align-items:center;gap:.35rem;
  font-family:var(--f-display);font-weight:800;font-size:.82rem;
  letter-spacing:.06em;text-transform:uppercase;
  padding:.26rem .72rem;border-radius:var(--r-full);margin-bottom:.85rem;
  border:1.5px solid;animation:fcPopIn .45s var(--e-spring) backwards;animation-delay:.34s;
}
.fc-verdict.si{background:rgba(255,255,255,.16);border-color:rgba(190,255,215,.85);color:#d8ffe9}
.fc-verdict.no{background:rgba(255,255,255,.16);border-color:rgba(255,205,205,.85);color:#ffdedd}
@keyframes fcPopIn{0%{opacity:0;transform:scale(.7) translateY(6px)}100%{opacity:1;transform:none}}

/* — Párrafo — */
.fc-p{margin:0;font-size:clamp(1rem,.92rem + .45vw,1.2rem);font-weight:600;line-height:1.6}
.fc-face.struct .fc-p{font-size:clamp(.96rem,.9rem + .35vw,1.1rem)}

/* — Lista enumerada — */
.fc-list{list-style:none;margin:0;padding:0;display:grid;gap:.5rem;counter-reset:fc}
.fc-list li{
  counter-increment:fc;position:relative;margin:0;
  padding:.42rem .6rem .42rem 2.5rem;border-radius:var(--r-sm);
  background:rgba(255,255,255,.11);
  font-size:clamp(.92rem,.88rem + .3vw,1.04rem);font-weight:600;line-height:1.45;
  animation:fcRow .42s var(--e-out) backwards;
}
.fc-list li::before{
  content:counter(fc);position:absolute;left:.6rem;top:50%;transform:translateY(-50%);
  width:1.6rem;height:1.6rem;border-radius:50%;
  display:grid;place-items:center;
  background:rgba(255,255,255,.9);color:var(--brand);
  font-family:var(--f-display);font-weight:800;font-size:.78rem;
  font-variant-numeric:tabular-nums;
}
.fc-list.alpha li::before{content:counter(fc,lower-alpha)}
.fc-list li:nth-child(1){animation-delay:.36s}
.fc-list li:nth-child(2){animation-delay:.42s}
.fc-list li:nth-child(3){animation-delay:.48s}
.fc-list li:nth-child(4){animation-delay:.54s}
.fc-list li:nth-child(5){animation-delay:.60s}
.fc-list li:nth-child(n+6){animation-delay:.66s}
@keyframes fcRow{0%{opacity:0;transform:translateX(-12px)}100%{opacity:1;transform:none}}

/* — Cláusulas contrapuestas — */
.fc-clauses{display:grid;gap:.45rem}
.fc-clauses p{
  margin:0;padding:.45rem .7rem .45rem .95rem;border-radius:0 var(--r-sm) var(--r-sm) 0;
  background:rgba(255,255,255,.11);border-left:3px solid rgba(255,255,255,.55);
  font-size:clamp(.92rem,.88rem + .3vw,1.04rem);font-weight:600;line-height:1.5;
  animation:fcRow .42s var(--e-out) backwards;
}
.fc-clauses p:nth-child(1){animation-delay:.36s}
.fc-clauses p:nth-child(2){animation-delay:.44s}
.fc-clauses p:nth-child(3){animation-delay:.52s}

/* — Negritas resaltadas en el reverso — */
.fc-back .fc-body b,.fc-back .fc-body strong{
  font-weight:800;background:rgba(255,255,255,.2);
  padding:.03em .3em;border-radius:5px;
  box-decoration-break:clone;-webkit-box-decoration-break:clone;
}

/* — Cita legal al pie — */
.fc-cite{
  position:absolute;bottom:.95rem;left:0;right:0;
  display:inline-flex;align-items:center;justify-content:center;gap:.4rem;
  font-family:var(--f-mono);font-size:.74rem;font-weight:700;letter-spacing:.02em;
  color:rgba(255,255,255,.82);
  animation:fcPopIn .5s var(--e-out) backwards;animation-delay:.5s;
}
.fc-cite::before,.fc-cite::after{
  content:"";height:1px;width:clamp(18px,10%,52px);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.45));
}
.fc-cite::after{background:linear-gradient(90deg,rgba(255,255,255,.45),transparent)}
.fc-cite .s{font-size:.9rem;opacity:.75;font-family:var(--f-legal)}
.fc-front .fc-cite{color:var(--ink-3)}
.fc-front .fc-cite::before{background:linear-gradient(90deg,transparent,var(--line-strong))}
.fc-front .fc-cite::after{background:linear-gradient(90deg,var(--line-strong),transparent)}

/* la pista se oculta si hay cita, para no amontonar */
.fc-back .fc-cite ~ .fc-hint,.fc-back .fc-hint.muted{display:none}

@media(max-width:620px){
  #flash{--fc-h:320px}
  .fc-face.struct{padding-top:2.9rem;padding-bottom:2.8rem}
  .fc-list li{padding-left:2.3rem}
}
@media(prefers-reduced-motion:reduce){
  .fc-verdict,.fc-list li,.fc-clauses p,.fc-cite{animation:none !important}
}

/* ═══ SEMÁFORO ═══ */
.sembtn{
  border-radius:var(--r-full);padding:.32rem .7rem;font-weight:700;font-size:var(--t-sm);
}
.sembtn[data-v="g"]:hover,.sembtn.on[data-v="g"]{background:var(--ok);color:#fff;border-color:var(--ok)}
.sembtn[data-v="y"]:hover,.sembtn.on[data-v="y"]{background:var(--mid);color:#3d2f00;border-color:var(--mid)}
.sembtn[data-v="r"]:hover,.sembtn.on[data-v="r"]{background:var(--exc);color:#fff;border-color:var(--exc)}

/* ═══ CTA DE BLOQUE ═══ */
a.blk{
  display:inline-flex;align-items:center;gap:.5rem;
  background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;
  padding:.5rem .95rem;border-radius:var(--r-sm);font-weight:700;font-size:var(--t-sm);
  text-decoration:none;box-shadow:0 2px 10px var(--brand-ring);
  transition:transform .22s var(--e-spring),box-shadow .25s,gap .25s var(--e-out);
}
a.blk:hover{transform:translateY(-2px);box-shadow:var(--sh-3);gap:.75rem;text-decoration:none}
a.blk::after{content:"→"}
a.blk:active{transform:translateY(0) scale(.98)}

/* ═══ REVEAL ═══ */
.rv{opacity:0;transform:translateY(20px);transition:opacity .6s var(--e-out),transform .6s var(--e-out)}
.rv.in{opacity:1;transform:none}

/* ═══ RESPONSIVE ═══ */
@media(max-width:960px){
  .layout{grid-template-columns:1fr;padding-top:.9rem;gap:1rem}
  nav.side{position:static;max-height:none}
  nav.side.collapsed .navbody{display:none}
  .navtoggle{display:block;width:100%;text-align:left;font-weight:700}
  .grid2{grid-template-columns:1fr}
  .top h1 .sub{white-space:normal}
}
@media(max-width:620px){
  .top-in{padding:.55rem .8rem}
  .tools{width:100%;margin-left:0}
  input[type=search]{flex:1;min-width:0}
  section.card{padding:1.05rem 1rem;border-radius:var(--r-md)}
  table{font-size:.82rem}
  th,td{padding:.4rem .5rem}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
  .rv{opacity:1;transform:none}
}
@media print{
  header.top,nav.side,.tools,.noprint,.progress{display:none !important}
  body{background:#fff;background-image:none;font-size:11pt;color:#000}
  .layout{display:block;max-width:none;padding:0}
  section.card{border:0;padding:0;margin:0 0 1rem;break-inside:avoid;box-shadow:none}
  details.panel{border:0;box-shadow:none}
  details.panel .body{display:block !important}
  details.panel>summary{padding-left:0}
  .art{break-inside:avoid}
  .rv{opacity:1;transform:none}
  a{color:#000;text-decoration:none}
}


/* ═══ ALTURA ADAPTATIVA DE LA TARJETA ═══ */
.fc-deck{transition:height .45s var(--fc-e)}
.fc-body{max-height:none;overflow:visible}
.fc-measure{
  position:absolute;left:0;right:0;top:0;height:auto;
  visibility:hidden;pointer-events:none;z-index:-1;
}
.fc-measure .fc-face{
  position:relative;inset:auto;height:auto;min-height:0;
  box-shadow:none;backface-visibility:visible;transform:none;
}
.fc-measure .fc-body{max-height:none;overflow:visible}
.fc-measure .fc-face::after{display:none}

/* ═══ MOSTRAR / OCULTAR ÍNDICE LATERAL ═══ */
.layout{transition:grid-template-columns .42s var(--e-out)}
.layout.nonav{grid-template-columns:0 1fr;gap:0}
.layout.nonav>nav.side{
  opacity:0;transform:translateX(-14px);pointer-events:none;
  padding:0;border-width:0;overflow:hidden;width:0;min-width:0;
}
nav.side{
  transition:opacity .3s var(--e-out),transform .38s var(--e-out);
  overflow-x:hidden;
}
#navhide .ic{display:inline-block;transition:transform .35s var(--e-spring);font-size:.95em;line-height:1}
#navhide[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
#navhide[aria-pressed="true"] .ic{transform:rotate(90deg)}
@media(max-width:960px){#navhide{display:none}}

/* ═══════════════════════════════════════════════════════════════
   LECTURA EN VOZ ALTA (TTS) del texto legal
   ═══════════════════════════════════════════════════════════════ */
.tts-bar{
  display:flex;align-items:center;gap:.45rem;flex-wrap:wrap;
  margin:.15rem 0 .7rem;
}
.tts-bar button{
  font-size:var(--t-xs);font-weight:700;padding:.3rem .62rem;
  border-radius:var(--r-full);border:1px solid var(--legal);
  background:transparent;color:var(--legal);
  display:inline-flex;align-items:center;gap:.35rem;line-height:1.2;
}
.tts-bar button:hover{background:var(--legal);color:var(--surface);border-color:var(--legal)}
.tts-bar button[hidden]{display:none}
.tts-bar .tts-play.on{background:var(--legal);color:var(--surface)}

/* Ondas de audio mientras lee */
.tts-wave{display:inline-flex;align-items:flex-end;gap:2px;height:11px}
.tts-wave i{
  width:2.5px;background:currentColor;border-radius:2px;height:35%;
  animation:ttsW .9s ease-in-out infinite;
}
.tts-wave i:nth-child(2){animation-delay:.15s}
.tts-wave i:nth-child(3){animation-delay:.3s}
.tts-wave i:nth-child(4){animation-delay:.45s}
@keyframes ttsW{0%,100%{height:32%}50%{height:100%}}

.tts-time{
  font-family:var(--f-mono);font-size:.7rem;font-weight:700;
  color:var(--ink-3);font-variant-numeric:tabular-nums;
}

/* Frase que se está leyendo */
.tts-s{transition:background .25s,color .25s;border-radius:3px}
.tts-s.now{
  background:linear-gradient(180deg,transparent 8%,color-mix(in srgb,var(--legal) 26%,transparent) 8%);
  box-shadow:0 0 0 2px color-mix(in srgb,var(--legal) 16%,transparent);
}
html[data-theme="dark"] .tts-s.now{
  background:linear-gradient(180deg,transparent 8%,color-mix(in srgb,var(--legal) 34%,transparent) 8%);
}
.legal.tts-on{box-shadow:0 0 0 3px color-mix(in srgb,var(--legal) 20%,transparent)}

/* ═══ Reproductor flotante ═══ */
.tts-mini{
  position:fixed;left:50%;bottom:1.1rem;transform:translateX(-50%) translateY(140%);
  z-index:80;display:flex;align-items:center;gap:.6rem;
  background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  border:1px solid var(--line);border-radius:var(--r-full);
  padding:.5rem .7rem .5rem .95rem;box-shadow:var(--sh-3);
  transition:transform .45s var(--e-spring),opacity .3s;opacity:0;pointer-events:none;
  max-width:min(94vw,540px);
}
.tts-mini.show{transform:translateX(-50%) translateY(0);opacity:1;pointer-events:auto}
.tts-mini .lbl{
  font-size:var(--t-xs);font-weight:800;color:var(--legal);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:16ch;
}
.tts-mini button{
  border-radius:50%;width:32px;height:32px;padding:0;display:grid;place-items:center;
  font-size:.8rem;border:1px solid var(--line);flex:none;
}
.tts-mini button.main{
  width:38px;height:38px;font-size:.95rem;
  background:linear-gradient(140deg,var(--legal),var(--brand));color:#fff;border-color:transparent;
}
.tts-mini .bar{
  flex:1;min-width:70px;height:5px;border-radius:99px;background:var(--surface-3);overflow:hidden;
}
.tts-mini .bar i{display:block;height:100%;width:0;background:var(--legal);
  border-radius:99px;transition:width .35s var(--e-out)}

/* ═══ Panel de ajustes de voz ═══ */
.tts-back{
  position:fixed;inset:0;z-index:90;background:rgba(10,10,18,.45);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  display:grid;place-items:center;padding:1rem;
  opacity:0;pointer-events:none;transition:opacity .3s var(--e-out);
}
.tts-back.show{opacity:1;pointer-events:auto}
.tts-panel{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--sh-3);width:min(94vw,470px);max-height:88vh;overflow:auto;
  padding:1.3rem 1.4rem;transform:translateY(16px) scale(.97);
  transition:transform .38s var(--e-spring);
}
.tts-back.show .tts-panel{transform:none}
.tts-panel h3{
  font-size:1.12rem;font-weight:800;margin:0 0 .25rem;
  display:flex;align-items:center;gap:.5rem;
}
.tts-panel .sub{font-size:var(--t-sm);color:var(--ink-2);margin:0 0 1.1rem}
.tts-row{margin-bottom:1.05rem}
.tts-row > label{
  display:block;font-size:var(--t-xs);font-weight:800;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-2);margin-bottom:.4rem;
}
.tts-seg{display:flex;gap:3px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:3px}
.tts-seg button{
  flex:1;border:0;background:transparent;border-radius:calc(var(--r-sm) - 3px);
  padding:.42rem .3rem;font-size:var(--t-sm);font-weight:700;box-shadow:none;
}
.tts-seg button:hover{transform:none;background:var(--surface)}
.tts-seg button[aria-pressed="true"]{
  background:linear-gradient(140deg,var(--legal),var(--brand));color:#fff;
}
.tts-panel select{
  width:100%;padding:.5rem .6rem;border-radius:var(--r-sm);

<script>
const GLOSARIO={
 "presupuesto":"Documento contable y jurídico, aprobado por el Pleno, que fija el techo de gasto de un ejercicio y estima los ingresos con los que se financia. Ej.: el presupuesto de Utrera para 2026 autoriza gastar como máximo 78 M€.",
 "credito":"Crédito presupuestario: la cantidad máxima de dinero autorizada para una finalidad concreta. Ej.: 120.000 € en la aplicación de 'mantenimiento de colegios'.",
 "obligacion":"Obligación reconocida: la deuda que el Ayuntamiento admite formalmente que debe pagar, una vez comprobado que el servicio o suministro se ha prestado. Ej.: aprobada la factura del proveedor, nace la obligación.",
 "derecho":"Derecho liquidado: el importe concreto que un tercero debe a la entidad local, una vez cuantificado. Ej.: liquidado el IBI de un inmueble en 340 €, ese es el derecho.",
 "oa":"Organismo autónomo: ente con personalidad jurídica propia creado por la entidad local para gestionar un servicio (patronatos de deportes, de cultura, gerencias de urbanismo). Depende del Ayuntamiento pero tiene su propio presupuesto.",
 "sociedad":"Sociedad mercantil local: empresa con forma de S.A. o S.L. cuyo capital pertenece a la entidad local (p. ej. la empresa municipal de aguas). No aprueba 'presupuesto', sino estados de previsión de gastos e ingresos.",
 "bases":"Bases de ejecución: el 'reglamento de uso' del presupuesto. Adaptan las normas presupuestarias generales a la organización concreta de la entidad. Ej.: fijan qué órgano autoriza gastos de hasta 3.000 €.",
 "estabilidad":"Estabilidad presupuestaria: exigencia de que las cuentas públicas no incurran en déficit estructural. Ej.: un ayuntamiento no puede presupuestar más gasto no financiero que ingresos no financieros.",
 "afectacion":"No afectación: regla general de que todos los ingresos financian todo el gasto, sin que un ingreso concreto quede reservado a un gasto concreto. Ej.: lo recaudado por el IBI no está reservado a pagar el alumbrado.",
 "bruto":"Principio de presupuesto bruto (o de integridad): derechos y obligaciones se anotan por su importe total, sin compensar unos con otros. Ej.: no se puede anotar la subvención 'ya descontados' los gastos del programa.",
 "nivelacion":"Nivelación presupuestaria: que el total de ingresos previstos cubra el total de gastos autorizados; es decir, aprobar sin déficit inicial.",
 "aplicacion":"Aplicación presupuestaria: la 'casilla' exacta donde vive cada euro de gasto, formada al cruzar la clasificación por programas con la económica. Ej.: 323/22103 (funcionamiento de centros docentes / combustibles).",
 "vinculacion":"Nivel de vinculación jurídica: el nivel de agregación en el que el crédito es realmente limitativo; por debajo de él se puede mover el gasto sin tramitar una modificación de crédito (art. 172 TRLHL).",
 "intervencion":"Intervención: el órgano de control interno de la entidad local, con función de fiscalización previa del gasto y de informe preceptivo del presupuesto. Lo desempeña un funcionario de habilitación nacional.",
 "pleno":"Pleno: órgano colegiado formado por todos los concejales o diputados. Es el único competente para aprobar el presupuesto.",
 "bop":"Boletín Oficial de la Provincia: diario oficial donde las entidades locales publican sus anuncios y acuerdos con efectos frente a terceros.",
 "prorroga":"Prórroga presupuestaria: si el 1 de enero no ha entrado en vigor el presupuesto nuevo, sigue rigiendo automáticamente el anterior con sus créditos iniciales.",
 "interesado":"Interesado: quien está legitimado para intervenir en un procedimiento. En el presupuesto, la ley define expresamente quiénes lo son (art. 170.1).",
 "liquidacion":"Liquidación del presupuesto: cierre contable del ejercicio, que determina los derechos y obligaciones pendientes, el remanente de tesorería y el resultado presupuestario.",
 "tcuentas":"Tribunal de Cuentas: órgano fiscalizador externo de las cuentas y la gestión económica del sector público, dependiente de las Cortes Generales.",
 "conten":"Recurso contencioso-administrativo: impugnación ante los juzgados y tribunales de lo contencioso-administrativo, es decir, ya fuera de la propia Administración.",
 "cuentagral":"Cuenta general: documento que, al terminar el ejercicio, muestra la gestión realizada en sus aspectos económico, financiero, patrimonial y presupuestario. Es la rendición de cuentas anual de la entidad.","cec":"Comisión Especial de Cuentas: órgano del Pleno, formado por miembros de todos los grupos políticos, que informa preceptivamente la cuenta general antes de su aprobación.","fint":"Función interventora: modalidad de control interno que fiscaliza los actos con contenido económico antes de que produzcan efectos, para verificar que se ajustan a la legalidad.","cfin":"Control financiero: comprobación, por procedimientos de auditoría, del funcionamiento económico-financiero de los servicios, incluida la calidad de la información financiera y la eficacia y eficiencia.","cefic":"Control de eficacia: comprobación periódica del grado de cumplimiento de objetivos y del coste y rendimiento de los servicios o inversiones.","reparo":"Reparo: manifestación escrita de desacuerdo del órgano interventor con el fondo o la forma de un acto, documento o expediente, formulada antes de que se adopte el acuerdo.","discrepancia":"Discrepancia: desacuerdo del órgano gestor con el reparo formulado por la Intervención. La resuelve el presidente o, en dos casos, el Pleno.","fiscprevia":"Fiscalización previa: intervención crítica del acto antes de que se apruebe. Puede limitarse a comprobar unos extremos básicos si lo acuerda el Pleno.","tomarazon":"Toma de razón en contabilidad: simple anotación contable del derecho, que puede sustituir a la fiscalización previa de ingresos si lo acuerda el Pleno.","tutela":"Tutela financiera: competencia de la comunidad autónoma (o del Estado) de supervisión financiera sobre las entidades locales de su territorio.","ocex":"Órgano de control externo autonómico: institución fiscalizadora de una comunidad autónoma (Cámara de Cuentas de Andalucía, Sindicatura de Comptes…).","igae":"Intervención General de la Administración del Estado (IGAE): órgano de control interno de la Administración General del Estado y centro directivo de la contabilidad pública."
};
const ARTS=[{n:208,t:"Formación de la cuenta general",ubic:"Título VI (Presupuesto y gasto público) ▸ Capítulo III (De la contabilidad) ▸ Sección 2.ª (Estados de cuentas anuales de las entidades locales)",idea:"Al acabar el año se forma la cuenta general: la foto completa de la gestión.",literal:`<p>Las entidades locales, a la terminación del ejercicio presupuestario, formarán la cuenta general que pondrá de manifiesto la gestión realizada en los aspectos económico, financiero, patrimonial y presupuestario.</p>`,dis:`<ul>
<li><b>Cuándo:</b> a la terminación del ejercicio presupuestario.</li>
<li><b>Qué es:</b> la <span class="t" data-k="cuentagral">cuenta general</span>, que pone de manifiesto la gestión realizada en <b>cuatro aspectos</b>: económico, financiero, patrimonial y presupuestario.</li>
<li><b>Quién:</b> las entidades locales (materialmente, la Intervención la forma: art. 212.2).</li>
</ul>`,llano:`<p>La liquidación cuenta cómo fue el presupuesto. La cuenta general va más allá: enseña también el patrimonio, la situación financiera y el resultado económico. Es el álbum completo del año, no solo la página del presupuesto.</p>`,porque:`<p>El presupuesto solo mide autorizaciones y ejecución de créditos. Pero un ayuntamiento tiene edificios, deudas, existencias y derechos: sin una cuenta que refleje el <b>patrimonio</b> y la <b>situación financiera</b>, sería imposible saber si la entidad es solvente. La cuenta general es el instrumento de la rendición de cuentas ante el Pleno, los vecinos y el Tribunal de Cuentas.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> la diferencia entre saber cuánto gastaste este mes y saber cuánto vale tu casa, cuánto debes al banco y cuánto tienes ahorrado.</li>
<li><b>Real:</b> la cuenta general de 2026 de un ayuntamiento incluye balance, cuenta del resultado económico-patrimonial, estado de cambios en el patrimonio neto, estado de flujos de efectivo, liquidación del presupuesto y memoria.</li>
<li><b>Caso límite:</b> una entidad con tratamiento contable simplificado presenta modelos simplificados, que reflejan en todo caso la situación financiera y la ejecución y liquidación de los presupuestos (art. 209.2).</li>
</ul>`,noej:`<ul>
<li><b>No es la liquidación</b>: la liquidación es una pieza de la cuenta general, con otro calendario y otro órgano de aprobación.</li>
<li><b>No es el presupuesto</b>: este mira al futuro; la cuenta, al pasado.</li>
</ul>`,conex:`<ul>
<li><b>Art. 209:</b> contenido de la cuenta general.</li>
<li><b>Art. 212:</b> rendición, publicidad y aprobación.</li>
<li><b>Art. 191:</b> la liquidación, que se integra en ella.</li>
</ul>`,trampas:`<ul>
<li>Los <b>cuatro aspectos</b> son económico, financiero, patrimonial y presupuestario. Si un test dice "económico y presupuestario" solamente, está incompleto.</li>
</ul>`,ancla:`<p><b>"E-F-P-P"</b>: <b>E</b>conómico, <b>F</b>inanciero, <b>P</b>atrimonial, <b>P</b>resupuestario. La cuenta general es la <b>foto de familia</b> del año, no el selfi del presupuesto.</p>`,vis:`<svg viewBox="0 0 640 140" role="img" aria-label="Los cuatro aspectos de la cuenta general">
<rect x="215" y="12" width="210" height="34" rx="8" fill="var(--acc)" stroke="var(--acc)"/>
<text x="320" y="35" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">CUENTA GENERAL</text>
<line x1="320" y1="46" x2="320" y2="60" stroke="var(--acc)" stroke-width="2"/><line x1="90" y1="60" x2="550" y2="60" stroke="var(--acc)" stroke-width="2"/>
<g font-size="11" text-anchor="middle" fill="currentColor">
<line x1="90" y1="60" x2="90" y2="74" stroke="var(--acc)" stroke-width="2"/><rect x="25" y="74" width="130" height="36" rx="6" fill="var(--acc-soft)" stroke="var(--acc)"/><text x="90" y="97">Económico</text>
<line x1="243" y1="60" x2="243" y2="74" stroke="var(--acc)" stroke-width="2"/><rect x="178" y="74" width="130" height="36" rx="6" fill="var(--acc-soft)" stroke="var(--acc)"/><text x="243" y="97">Financiero</text>
<line x1="396" y1="60" x2="396" y2="74" stroke="var(--acc)" stroke-width="2"/><rect x="331" y="74" width="130" height="36" rx="6" fill="var(--acc-soft)" stroke="var(--acc)"/><text x="396" y="97">Patrimonial</text>
<line x1="549" y1="60" x2="549" y2="74" stroke="var(--acc)" stroke-width="2"/><rect x="484" y="74" width="130" height="36" rx="6" fill="var(--acc-soft)" stroke="var(--acc)"/><text x="549" y="97">Presupuestario</text>
</g>
<text x="320" y="130" text-anchor="middle" font-size="11" fill="var(--ink2)">se forma a la terminación del ejercicio presupuestario</text>
</svg>`},
{n:209,t:"Contenido de la cuenta general de las entidades locales",ubic:"Título VI (Presupuesto y gasto público) ▸ Capítulo III (De la contabilidad) ▸ Sección 2.ª (Estados de cuentas anuales de las entidades locales)",idea:"La cuenta general suma entidad, organismos y sociedades, más estados consolidados.",literal:`<p>1. La cuenta general estará integrada por:</p><p>a) La de la propia entidad.</p><p>b) La de los organismos autónomos.</p><p>c) Las de las sociedades mercantiles de capital íntegramente propiedad de las entidades locales.</p><p>2. Las cuentas a que se refieren los párrafos a) y b) del apartado anterior reflejarán la situación económico-financiera y patrimonial, los resultados económico-patrimoniales y la ejecución y liquidación de los presupuestos.</p><p>Para las entidades locales con tratamiento contable simplificado, se establecerán modelos simplificados de cuentas que reflejarán, en todo caso, la situación financiera y la ejecución y liquidación de los presupuestos.</p><p>3. Las cuentas a que se refiere el apartado 1.c) anterior serán, en todo caso, las que deban elaborarse de acuerdo con la normativa mercantil.</p><p>4. Las entidades locales unirán a la Cuenta General los estados consolidados que determine el Ministro de Hacienda y Función Pública, en los términos previstos en las normas de consolidación que apruebe para el sector público local conformes a las Normas para la formulación de cuentas anuales consolidadas en el ámbito del sector público.</p><p>A efectos de la obtención de los estados consolidados, las entidades controladas, directamente o indirectamente, por la entidad local no comprendidas en los apartados anteriores, las entidades multigrupo y las entidades asociadas deberán remitir sus cuentas anuales a la entidad local acompañadas, en su caso, del informe de auditoría.</p><p>Los conceptos de control y de entidad multigrupo y entidad asociada son los definidos en las Normas para la formulación de cuentas anuales consolidadas en el ámbito del sector público.</p><p>Los estados consolidados deberán acompañar a la Cuenta General, al menos, cuando ésta se someta a aprobación del Pleno de la Corporación.</p>`,dis:`<ul>
<li><b>209.1 — integrantes:</b> a) la de la propia entidad; b) la de los <span class="t" data-k="oa">organismos autónomos</span>; c) las de las <b>sociedades mercantiles de capital íntegramente propiedad</b> de la entidad local.</li>
<li><b>209.2 — contenido de a) y b):</b> situación económico-financiera y patrimonial, resultados económico-patrimoniales y ejecución y liquidación de los presupuestos. Para entidades con <b>tratamiento contable simplificado</b>, modelos simplificados que reflejen en todo caso la situación financiera y la ejecución y liquidación.</li>
<li><b>209.3 — contenido de c):</b> las que deban elaborarse conforme a la <b>normativa mercantil</b>.</li>
<li><b>209.4 — estados consolidados:</b> los que determine el <b>Ministro de Hacienda y Función Pública</b>. Las entidades controladas no incluidas antes, las <b>multigrupo</b> y las <b>asociadas</b> deben remitir sus cuentas anuales con el informe de auditoría, en su caso. Los estados consolidados acompañan a la cuenta general <b>al menos cuando esta se someta a aprobación del Pleno</b>.</li>
</ul>`,llano:`<p>La cuenta general no es solo la del ayuntamiento: recoge también las de sus patronatos y las de sus empresas al 100 %. Y como además hay entidades participadas o controladas de otras formas, la ley obliga a que manden sus cuentas para poder elaborar unos estados consolidados que enseñen el grupo entero.</p>`,porque:`<p>Es la misma lógica del art. 164 aplicada al cierre: si cada ente rindiera cuentas por su lado, nadie vería la <b>dimensión real</b> del sector público local ni sus deudas cruzadas. La consolidación elimina duplicidades y enseña la posición neta del grupo, que es lo único relevante para juzgar la solvencia.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> las cuentas de un grupo empresarial: no basta con las de la matriz, hacen falta las de las filiales y una suma depurada.</li>
<li><b>Real:</b> la cuenta general de 2026 de una diputación integra la de la propia diputación, la del organismo autónomo de gestión tributaria y la de su sociedad de servicios al 100 %, y acompaña estados consolidados que incluyen datos de un consorcio controlado y de una sociedad participada al 40 % (asociada).</li>
<li><b>Caso límite:</b> una sociedad municipal al 55 % no integra la cuenta general por el 209.1.c) —que exige capital íntegro—, pero sí debe remitir sus cuentas anuales a efectos de consolidación (209.4).</li>
</ul>`,noej:`<ul>
<li><b>No se integran</b> como cuentas del 209.1 las de entidades multigrupo o asociadas: estas remiten sus cuentas <b>a efectos de consolidación</b>.</li>
<li><b>No siguen</b> las sociedades el plan contable público: se rigen por la <b>normativa mercantil</b>.</li>
</ul>`,conex:`<ul>
<li><b>Art. 164:</b> los mismos tres sujetos en la formación del presupuesto general.</li>
<li><b>Art. 166.1.c):</b> el estado de consolidación como anexo del presupuesto.</li>
<li><b>Art. 210:</b> quién determina contenido y estructura de esas cuentas.</li>
<li><b>Art. 223.2:</b> rendición de esta cuenta general al Tribunal de Cuentas.</li>
</ul>`,trampas:`<ul>
<li>Sociedades: <b>capital íntegramente propiedad</b> de la entidad. El capital mayoritario no integra.</li>
<li>Los estados consolidados acompañan <b>al menos</b> cuando la cuenta se somete a aprobación del Pleno.</li>
<li>Las cuentas de las sociedades se elaboran conforme a la <b>normativa mercantil</b>, no al modelo público.</li>
</ul>`,ancla:`<p><b>Los mismos tres de siempre: E-O-S</b> (Entidad, Organismos, Sociedades al 100 %). Y una cuarta capa que no integra pero suma: <b>consolidación</b> (controladas, multigrupo y asociadas).</p>`,vis:`<svg viewBox="0 0 640 190" role="img" aria-label="Composición de la cuenta general y consolidación">

<text x="320" y="31" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">CUENTA GENERAL</text>

</svg>`},
{n:210,t:"Competencia",ubic:"Título VI (Presupuesto y gasto público) ▸ Capítulo III (De la contabilidad) ▸ Sección 2.ª (Estados de cuentas anuales de las entidades locales)",idea:"El contenido y la estructura de las cuentas las fija el Ministerio de Hacienda.",literal:`<p>El contenido, estructura y normas de elaboración de las cuentas a que se refieren los párrafos a) y b) del apartado 1 del artículo anterior, se determinarán por el Ministerio de Hacienda, a propuesta de la Intervención General de la Administración del Estado.</p>`,dis:`<ul>
<li><b>Objeto:</b> contenido, estructura y normas de elaboración de las cuentas de la <b>propia entidad</b> y de sus <b>organismos autónomos</b> (letras a y b del art. 209.1).</li>
<li><b>Quién:</b> el <b>Ministerio de Hacienda</b>, a propuesta de la <span class="t" data-k="igae">Intervención General de la Administración del Estado</span>.</li>
<li><b>Fuera quedan</b> las cuentas de las sociedades mercantiles, que siguen la normativa mercantil (art. 209.3).</li>
</ul>`,llano:`<p>Para que las cuentas de 8.000 municipios se puedan comparar y sumar, alguien tiene que fijar el formato. Ese alguien es el Ministerio de Hacienda, y quien se lo propone técnicamente es la IGAE.</p>`,porque:`<p>La normalización contable es la condición para que exista control: sin un modelo común, ni el Tribunal de Cuentas ni el Ministerio podrían agregar la información del sector local ni detectar desviaciones. Es la misma lógica del art. 167 para la estructura presupuestaria.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> el modelo oficial de la declaración de la renta: todos declaran distinto, pero en el mismo formulario.</li>
<li><b>Real:</b> la Instrucción del modelo normal de contabilidad local, aprobada por Orden del Ministerio de Hacienda, fija el contenido del balance y de la memoria.</li>
</ul>`,noej:`<ul>
<li><b>No lo fija</b> cada entidad en sus bases de ejecución.</li>
<li><b>No alcanza</b> a las sociedades mercantiles locales.</li>
</ul>`,conex:`<ul>
<li><b>Art. 167.1:</b> paralelo en materia de estructura presupuestaria.</li>
<li><b>Art. 203 y ss.:</b> régimen de la contabilidad de las entidades locales.</li>
</ul>`,trampas:`<ul>
<li>La propuesta parte de la <b>IGAE</b>; la aprobación, del <b>Ministerio de Hacienda</b>.</li>
<li>Solo alcanza a las cuentas de las <b>letras a) y b)</b> del art. 209.1.</li>
</ul>`,ancla:`<p><b>"Propone la IGAE, dispone Hacienda."</b></p>`,vis:`<svg viewBox="0 0 640 115" role="img" aria-label="Competencia sobre el contenido de las cuentas">

{n:211,t:"Memorias que acompañan a la cuenta general",ubic:"Título VI (Presupuesto y gasto público) ▸ Capítulo III (De la contabilidad) ▸ Sección 2.ª (Estados de cuentas anuales de las entidades locales)",idea:"Los municipios grandes añaden dos memorias: coste de los servicios y objetivos cumplidos.",literal:`<p>Los municipios de más de 50.000 habitantes y las demás entidades locales de ámbito superior acompañarán a la cuenta general:</p><p>a) Una memoria justificativa del coste y rendimiento de los servicios públicos.</p><p>b) Una memoria demostrativa del grado en que se hayan cumplido los objetivos programados con indicación de los previstos y alcanzados, con su coste.</p>`,dis:`<ul>
<li><b>Sujetos obligados:</b> municipios de <b>más de 50.000 habitantes</b> y demás entidades locales de <b>ámbito superior</b> (diputaciones, cabildos, consejos insulares…).</li>
<li><b>Documentos que se acompañan:</b>
<ol><li><b>a)</b> memoria justificativa del <b>coste y rendimiento</b> de los servicios públicos;</li>
<li><b>b)</b> memoria demostrativa del <b>grado de cumplimiento de los objetivos</b> programados, con indicación de los previstos y alcanzados y de su coste.</li></ol></li>
</ul>`,llano:`<p>En las entidades grandes no basta con decir cuánto se gastó: hay que explicar cuánto cuesta cada servicio y qué se consiguió con él. Dos memorias: una de coste, otra de resultados.</p>`,porque:`<p>Es el germen de la <b>gestión por objetivos</b> en el mundo local: la cifra de gasto por sí sola no dice si el dinero se usó bien. Se exige solo a las entidades grandes por proporcionalidad: elaborar indicadores de coste y rendimiento requiere una estructura técnica que un municipio pequeño no tiene.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> no es lo mismo saber que gastaste 900 € en el gimnasio que saber cuántas veces fuiste.</li>
<li><b>Real:</b> un ayuntamiento de 180.000 habitantes acompaña a su cuenta general una memoria que cifra el coste por usuario de la escuela infantil municipal en 4.850 €/año y el grado de cumplimiento del objetivo de plazas ofertadas en el 92 %.</li>
<li><b>Caso límite:</b> una diputación provincial está obligada aunque su población no se mida por el umbral de 50.000: es entidad de ámbito superior al municipio.</li>
</ul>`,noej:`<ul>
<li><b>No están obligados</b> los municipios de 50.000 habitantes o menos: la ley dice "más de 50.000".</li>
<li><b>No son parte</b> de la cuenta general en sentido estricto: la <b>acompañan</b>.</li>
</ul>`,conex:`<ul>
<li><b>Art. 221:</b> control de eficacia, cuyo objeto coincide con el de estas memorias.</li>
<li><b>Art. 209:</b> contenido de la cuenta general a la que se unen.</li>
</ul>`,trampas:`<ul>
<li>Umbral: <b>más de 50.000 habitantes</b>. No confundir con los 500.000 del art. 186.3.</li>
<li>Son <b>dos</b> memorias, con objetos distintos: coste y rendimiento / cumplimiento de objetivos.</li>
</ul>`,ancla:`<p><b>"Cuánto cuesta y para qué sirvió."</b> Dos memorias, dos preguntas. Umbral: <b>50.000</b>.</p>`,vis:`<svg viewBox="0 0 640 140" role="img" aria-label="Memorias que acompañan a la cuenta general">
<rect x="180" y="10" width="280" height="34" rx="8" fill="var(--acc-soft)" stroke="var(--acc)"/>
<text x="320" y="32" text-anchor="middle" font-size="11" font-weight="700" fill="var(--acc)">Municipios de más de 50.000 habitantes</text>
<text x="320" y="58" text-anchor="middle" font-size="10" fill="var(--ink2)">y demás entidades locales de ámbito superior</text>
<rect x="40" y="72" width="260" height="52" rx="8" fill="var(--ej-bg)" stroke="var(--ej)"/>
<text x="170" y="93" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ej)">a) Coste y rendimiento</text>
<text x="170" y="111" text-anchor="middle" font-size="10" fill="currentColor">de los servicios públicos</text>
<rect x="340" y="72" width="260" height="52" rx="8" fill="var(--ej-bg)" stroke="var(--ej)"/>
<text x="470" y="93" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ej)">b) Cumplimiento de objetivos</text>
<text x="470" y="111" text-anchor="middle" font-size="10" fill="currentColor">previstos, alcanzados y su coste</text>
</svg>`},
{n:212,t:"Rendición, publicidad y aprobación de la cuenta general",ubic:"Título VI (Presupuesto y gasto público) ▸ Capítulo III (De la contabilidad) ▸ Sección 2.ª (Estados de cuentas anuales de las entidades locales)",idea:"Rendir en mayo, informar en junio, exponer quince días y aprobar antes de octubre.",literal:`<p>1. Los estados y cuentas de la entidad local serán rendidas por su presidente antes del día 15 de mayo del ejercicio siguiente al que correspondan. Las de los organismos autónomos y sociedades mercantiles cuyo capital pertenezca íntegramente a aquélla, rendidas y propuestas inicialmente por los órganos competentes de estos, serán remitidas a la entidad local en el mismo plazo.</p><p>2. La cuenta general formada por la Intervención será sometida antes del día 1 de junio a informe de la Comisión Especial de Cuentas de la entidad local, que estará constituida por miembros de los distintos grupos políticos integrantes de la corporación.</p><p>3. La cuenta general, con el informe de la Comisión Especial a que se refiere el apartado anterior, será expuesta al público por plazo de 15 días durante los cuales los interesados podrán examinarla y presentar reclamaciones, reparos u observaciones. Examinados estos por la Comisión Especial y practicadas por esta cuantas comprobaciones estime necesarias emitirá nuevo informe.</p><p>4. Acompañada de los informes de la Comisión Especial y de las reclamaciones y reparos formulados, la cuenta general se someterá al Pleno de la corporación, para que, en su caso, pueda ser aprobada antes del día 1 de octubre.</p><p>5. Una vez que el Pleno se haya pronunciado sobre la Cuenta General, aprobándola o rechazándola, el presidente de la corporación la rendirá al Tribunal de Cuentas.</p>`,dis:`<table><thead><tr><th>Hito</th><th>Quién</th><th>Fecha</th></tr></thead><tbody>
<tr><td>Rendición de estados y cuentas de la entidad</td><td><b>Presidente</b></td><td>Antes del <b>15 de mayo</b> del ejercicio siguiente</td></tr>
<tr><td>Remisión de las cuentas de OOAA y sociedades 100 %</td><td>Órganos competentes de estos</td><td>Mismo plazo (antes del 15 de mayo)</td></tr>
<tr><td>Formación de la cuenta general</td><td><b>Intervención</b></td><td>—</td></tr>
<tr><td>Informe de la <span class="t" data-k="cec">Comisión Especial de Cuentas</span></td><td>Comisión con miembros de <b>todos los grupos políticos</b></td><td>Antes del <b>1 de junio</b></td></tr>
<tr><td>Exposición al público</td><td>Interesados: reclamaciones, <b>reparos u observaciones</b></td><td><b>15 días</b></td></tr>
<tr><td>Nuevo informe tras examinar lo presentado</td><td>Comisión Especial</td><td>—</td></tr>
<tr><td>Aprobación</td><td><b>Pleno</b></td><td>Antes del <b>1 de octubre</b></td></tr>
<tr><td>Rendición al Tribunal de Cuentas</td><td><b>Presidente</b>, se apruebe o se rechace</td><td>Art. 223.2: antes del <b>15 de octubre</b></td></tr>
</tbody></table>`,llano:`<p>El alcalde rinde las cuentas antes del 15 de mayo; el interventor las junta y forma la cuenta general; una comisión con representantes de todos los grupos la informa antes del 1 de junio; se cuelga quince días para que cualquiera pueda mirarla y objetar; la comisión vuelve a informar; y el Pleno la aprueba antes del 1 de octubre. Aunque el Pleno la rechace, el alcalde tiene que enviarla al Tribunal de Cuentas.</p>`,porque:`<p>El calendario está pensado para que la cuenta llegue al Tribunal de Cuentas antes del 15 de octubre (art. 223.2). La <b>Comisión Especial de Cuentas</b> garantiza que la oposición examine las cuentas antes que el Pleno, y la exposición pública extiende ese control a los vecinos. Que la cuenta se rinda al Tribunal <b>aunque se rechace</b> impide que una mayoría incómoda bloquee la fiscalización externa: el control externo no depende de la voluntad política local.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> la junta de una comunidad: el administrador presenta cuentas, los vocales las revisan, se exponen y luego se votan. Si se rechazan, siguen existiendo.</li>
<li><b>Real:</b> cuenta general de 2026 de un ayuntamiento: rendida el 8 de mayo de 2027, informada por la Comisión Especial el 26 de mayo, expuesta del 1 al 21 de junio con una reclamación de una asociación vecinal, nuevo informe el 3 de julio, aprobada por el Pleno el 24 de septiembre y rendida al Tribunal de Cuentas el 6 de octubre.</li>
<li><b>Caso límite:</b> el Pleno rechaza la cuenta general. El presidente <b>igualmente</b> debe rendirla al Tribunal de Cuentas (art. 212.5).</li>
</ul>`,noej:`<ul>
<li><b>No forma la cuenta</b> el presidente: la forma la <b>Intervención</b>. El presidente <b>rinde</b>.</li>
<li><b>No es potestativo</b> el informe de la Comisión Especial: es preceptivo.</li>
<li><b>No impide</b> el rechazo plenario la rendición al Tribunal de Cuentas.</li>
</ul>`,conex:`<ul>
<li><b>Art. 209:</b> el contenido de lo que se rinde.</li>
<li><b>Art. 223.2:</b> plazo de rendición al Tribunal de Cuentas.</li>
<li><b>Art. 169.1:</b> los mismos 15 días de exposición pública del presupuesto: el paralelismo ayuda a recordarlo.</li>
<li><b>Art. 116 LBRL:</b> regulación de la Comisión Especial de Cuentas.</li>
</ul>`,trampas:`<ul>
<li>Cuatro fechas encadenadas: <b>15 de mayo · 1 de junio · 15 días · 1 de octubre</b>. Y la quinta, del art. 223.2: <b>15 de octubre</b>.</li>
<li>En la exposición pública caben "reclamaciones, <b>reparos u observaciones</b>": tres términos, más amplio que en el presupuesto.</li>
<li>La Comisión Especial informa <b>dos veces</b> si hay alegaciones.</li>
<li>"Para que, <b>en su caso</b>, pueda ser aprobada": el Pleno puede aprobarla o rechazarla.</li>
</ul>`,ancla:`<p><b>La escalera de la cuenta general:</b> <b>15-M</b> rendir · <b>1-J</b> informar · <b>15 días</b> exponer · <b>1-O</b> aprobar · <b>15-O</b> al Tribunal.<br>Truco: los dos "unos" son de mes que empieza (junio y octubre) y los dos "quinces" abren y cierran (mayo y octubre).</p>`,vis:`<svg viewBox="0 0 640 200" role="img" aria-label="Calendario de la cuenta general">

<text x="320" y="180" text-anchor="middle" font-size="11" fill="var(--exc)">Aunque el Pleno la rechace, el presidente debe rendirla al Tribunal de Cuentas (212.5)</text>
</svg>`},
{n:213,t:"Control interno",ubic:"Título VI (Presupuesto y gasto público) ▸ Capítulo IV (Control y fiscalización)",idea:"El control interno tiene tres modalidades: interventora, financiera y de eficacia.",literal:`<p>Se ejercerán en las Entidades Locales con la extensión y efectos que se determina en los artículos siguientes las funciones de control interno respecto de su gestión económica, de los organismos autónomos y de las sociedades mercantiles de ellas dependientes, en sus modalidades de función interventora, función de control financiero, incluida la auditoría de cuentas de las entidades que se determinen reglamentariamente, y función de control de la eficacia.</p><p>A propuesta del Ministerio de Hacienda y Administraciones Públicas, el Gobierno establecerá las normas sobre los procedimientos de control, metodología de aplicación, criterios de actuación, derechos y deberes del personal controlador y destinatarios de los informes de control, que se deberán seguir en el desarrollo de las funciones de control indicadas en el apartado anterior.</p><p>Los órganos interventores de las Entidades Locales remitirán con carácter anual a la Intervención General de la Administración del Estado un informe resumen de los resultados de los citados controles desarrollados en cada ejercicio, en el plazo y con el contenido que se regulen en las normas indicadas en el párrafo anterior.</p>`,dis:`<ul>
<li><b>Ámbito:</b> la gestión económica de la entidad, de sus <b>organismos autónomos</b> y de sus <b>sociedades mercantiles dependientes</b>.</li>
<li><b>Tres modalidades:</b>
<ol><li><span class="t" data-k="fint">función interventora</span>;</li>
<li><span class="t" data-k="cfin">función de control financiero</span>, <b>incluida la auditoría de cuentas</b> de las entidades que se determinen reglamentariamente;</li>
<li><span class="t" data-k="cefic">función de control de la eficacia</span>.</li></ol></li>
<li><b>Normas de desarrollo:</b> las establece el <b>Gobierno</b>, a propuesta del Ministerio de Hacienda: procedimientos, metodología, criterios de actuación, derechos y deberes del personal controlador y destinatarios de los informes.</li>
<li><b>Informe resumen anual:</b> los órganos interventores lo remiten a la <span class="t" data-k="igae">IGAE</span> con los resultados de los controles del ejercicio.</li>
</ul>`,llano:`<p>La entidad se controla a sí misma por dentro, y lo hace de tres maneras: revisando cada acto antes de que produzca efectos (función interventora), auditando cómo funcionan los servicios (control financiero) y comprobando si se cumplen los objetivos (control de eficacia). Cada año hay que contarle a la IGAE cómo ha ido.</p>`,porque:`<p>Un solo tipo de control no basta. La función interventora mira la <b>legalidad, acto por acto y antes</b>; el control financiero mira el conjunto <b>después</b> y con técnicas de auditoría; el de eficacia mira si el dinero sirvió para algo. Sin las tres, se podría cumplir escrupulosamente la ley gastando muy mal. El informe anual a la IGAE existe porque, hasta su implantación, nadie tenía una visión agregada del control interno local.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> en una empresa: el visto bueno previo del jefe (interventora), la auditoría anual de cuentas (financiera) y la evaluación de resultados del equipo (eficacia).</li>
<li><b>Real:</b> la Intervención de un ayuntamiento fiscaliza cada expediente de contratación, audita anualmente a la empresa municipal de aguas y elabora un informe de cumplimiento de objetivos de los servicios sociales; en abril remite a la IGAE el informe resumen del ejercicio anterior.</li>
</ul>`,noej:`<ul>
<li><b>No es control interno</b> la fiscalización del Tribunal de Cuentas: eso es control <b>externo</b> (art. 223).</li>
<li><b>No lo regula</b> cada entidad: las normas de procedimiento las establece el <b>Gobierno</b>.</li>
</ul>`,conex:`<ul>
<li><b>Arts. 214 a 219:</b> desarrollo de la función interventora.</li>
<li><b>Art. 220:</b> control financiero. <b>Art. 221:</b> control de eficacia.</li>
<li><b>Art. 223:</b> control externo, del que se distingue.</li>
</ul>`,trampas:`<ul>
<li>Son <b>tres</b> modalidades, y la auditoría de cuentas se sitúa <b>dentro</b> del control financiero.</li>
<li>El control interno alcanza también a las <b>sociedades mercantiles dependientes</b>.</li>
<li>El informe resumen anual va a la <b>IGAE</b>, no al Tribunal de Cuentas.</li>
</ul>`,ancla:`<p><b>"I-F-E"</b>: <b>I</b>nterventora (antes y por ley) · <b>F</b>inanciera (después y por auditoría) · <b>E</b>ficacia (objetivos).<br>Piensa en un <b>IFE</b>: tres cámaras vigilando la misma casa desde ángulos distintos.</p>`,vis:`<svg viewBox="0 0 640 175" role="img" aria-label="Las tres modalidades de control interno">

{n:214,t:"Ámbito de aplicación y modalidades de ejercicio de la función interventora",ubic:"Título VI (Presupuesto y gasto público) ▸ Capítulo IV (Control y fiscalización)",idea:"La función interventora fiscaliza todo acto con contenido económico, en cuatro momentos.",literal:`<p>1. La función interventora tendrá por objeto fiscalizar todos los actos de las entidades locales y de sus organismos autónomos que den lugar al reconocimiento y liquidación de derechos y obligaciones o gastos de contenido económico, los ingresos y pagos que de aquéllos se deriven, y la recaudación, inversión y aplicación, en general, de los caudales públicos administrados, con el fin de que la gestión se ajuste a las disposiciones aplicables en cada caso.</p><p>2. El ejercicio de la expresada función comprenderá:</p><p>a) La intervención crítica o previa de todo acto, documento o expediente susceptible de producir derechos u obligaciones de contenido económico o movimiento de fondos de valores.</p><p>b) La intervención formal de la ordenación del pago.</p><p>c) La intervención material del pago.</p><p>d) La intervención y comprobación material de las inversiones y de la aplicación de las subvenciones.</p>`,dis:`<ul>
<li><b>Objeto (214.1):</b> fiscalizar todos los actos de la entidad y de sus <b>organismos autónomos</b> que den lugar al reconocimiento y liquidación de <b>derechos y obligaciones o gastos</b> de contenido económico, los ingresos y pagos que se deriven, y la recaudación, inversión y aplicación de los caudales públicos. <b>Finalidad:</b> que la gestión se ajuste a las disposiciones aplicables.</li>
<li><b>Contenido (214.2) — cuatro modalidades:</b>
<ol><li><b>a)</b> intervención <b>crítica o previa</b> de todo acto, documento o expediente susceptible de producir derechos u obligaciones de contenido económico o movimiento de fondos de valores;</li>
<li><b>b)</b> intervención <b>formal</b> de la ordenación del pago;</li>
<li><b>c)</b> intervención <b>material</b> del pago;</li>
<li><b>d)</b> intervención y <b>comprobación material</b> de las inversiones y de la aplicación de las subvenciones.</li></ol></li>
</ul>`,llano:`<p>El interventor mira cuatro veces: antes de que se apruebe el gasto, cuando se ordena el pago, cuando el pago sale materialmente y, en obras y subvenciones, va a ver que aquello se hizo de verdad.</p>`,porque:`<p>Las tres primeras modalidades siguen la cadena del dinero (decisión → orden → salida). La cuarta existe porque en obras y subvenciones el papel puede ser impecable y la realidad no: alguien tiene que <b>ir a mirar</b>. Es la traducción práctica del principio de que el control no puede ser solo documental.</p>`,ej:`<ul>
<li><b>Cotidiano:</b> revisar el presupuesto antes de encargar la obra, comprobar la transferencia y, además, subir a ver si el tejado está puesto.</li>
<li><b>Real:</b> en una obra de 900.000 €, la Intervención fiscaliza el expediente de contratación (previa), la orden de pago de cada certificación (formal), la transferencia (material) y asiste al acta de recepción de la obra (comprobación material).</li>
<li><b>Caso límite:</b> un contrato menor de 2.000 €: no está sometido a intervención previa por el art. 219.1, lo que no elimina las demás modalidades ni el control financiero posterior.</li>
</ul>`,noej:`<ul>
<li><b>No alcanza</b> literalmente a las sociedades mercantiles: el art. 214.1 habla de la entidad y sus <b>organismos autónomos</b> (las sociedades se someten a control financiero, art. 220).</li>
<li><b>No es</b> la función interventora un control de oportunidad: verifica que la gestión se ajusta a las <b>disposiciones aplicables</b>.</li>
</ul>`,conex:`<ul>
<li><b>Art. 184:</b> las fases del gasto sobre las que se proyecta.</li>
<li><b>Art. 215 a 218:</b> qué ocurre cuando la Intervención discrepa.</li>
<li><b>Art. 219:</b> excepciones y limitación de la fiscalización previa.</li>
<li><b>Art. 220:</b> control financiero, que sí alcanza a las sociedades.</li>
</ul>`,trampas:`<ul>
<li><b>Cuatro</b> modalidades. La más olvidada es la <b>d)</b>: comprobación material de inversiones y subvenciones.</li>
<li>Distingue "intervención <b>formal</b> de la ordenación del pago" de "intervención <b>material</b> del pago": son dos, no una.</li>
<li>El ámbito subjetivo del 214.1 es la entidad y sus <b>organismos autónomos</b>.</li>
</ul>`,ancla:`<p><b>"Antes, la orden, la salida y la obra."</b> Cuatro momentos: <b>P</b>revia · <b>F</b>ormal · <b>M</b>aterial · <b>C</b>omprobación material → <i>"Por Favor, Mira y Comprueba"</i>.</p>`,vis:`<svg viewBox="0 0 640 165" role="img" aria-label="Modalidades de la función interventora">

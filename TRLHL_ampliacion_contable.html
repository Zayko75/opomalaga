<script>
document.getElementById('main').innerHTML="\n<section class=\"card\" id=\"intro\"><h2>Tema 8 · Ampliación: documentos contables y clasificación económica</h2>\n<div class=\"box exc\"><span class=\"lbl\">Por qué existe esta página</span>Los supuestos prácticos reales preguntan por cosas que no están en la letra del TRLHL pero que se manejan todos los días: <b>qué documento contable</b> corresponde a cada fase del gasto (RC, A, D, O, P y sus acumulados) y <b>a qué capítulo</b> se imputa cada gasto. Sin esto no se pueden contestar preguntas como «¿mediante qué documento se emite la certificación de existencia de crédito?» o «¿a qué capítulo va la reforma de una residencia?».</div>\n<div class=\"box warn\"><span class=\"lbl\">Fuentes utilizadas y vigencia</span>\n<ul><li><b>RDLeg 2/2004, TRLHL</b> (documento 5), arts. 172 a 189: fases del gasto y competencias.</li>\n<li><b>Orden EHA/3565/2008</b> (documento 6): estructura de la clasificación económica y criterios de imputación.</li>\n<li><b>Aportación externa</b>: el <b>RD 500/1990</b> y las Instrucciones de contabilidad local, de donde proceden los <b>documentos contables</b> y sus siglas. No están en la biblioteca del proyecto: verifícalos en el BOE consolidado.</li></ul></div>\n</section>\n<section class=\"card\" id=\"fases\"><h2>De la fase del gasto al documento contable</h2><p class=\"small\">Cinco siglas y cuatro acumulados. Es la pieza que más aparece en los supuestos y la que menos suele estudiarse.</p><svg viewBox=\"0 0 960 542\" role=\"img\" aria-label=\"Fases del gasto y documentos contables\" style=\"width:100%;height:auto\"><defs><marker id=\"fl\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"230\" y=\"8\" width=\"500\" height=\"38\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"31.16\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"#fff\">DE LA FASE DEL GASTO AL DOCUMENTO CONTABLE</text><rect x=\"20\" y=\"58\" width=\"920\" height=\"34\" rx=\"8\" fill=\"var(--panel)\" stroke=\"var(--line)\"/><text x=\"480\" y=\"78.52\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">Art. 184.1 TRLHL · cuatro fases · y el art. 184.2 permite acumular varias en un solo acto</text><rect x=\"20\" y=\"104\" width=\"172\" height=\"120\" rx=\"8\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"106\" y=\"137.9\" text-anchor=\"middle\" font-size=\"20\" font-weight=\"700\" fill=\"var(--acc)\">RC</text><text x=\"106\" y=\"150.9\" text-anchor=\"middle\" font-size=\"9\" fill=\"currentColor\">Retención de crédito</text><text x=\"106\" y=\"163.9\" text-anchor=\"middle\" font-size=\"9\" fill=\"currentColor\"></text><text x=\"106\" y=\"176.9\" text-anchor=\"middle\" font-size=\"9\" fill=\"currentColor\">reserva el crédito y CERTIFICA</text><text x=\"106\" y=\"189.9\" text-anchor=\"middle\" font-size=\"9\" fill=\"currentColor\">que existe consignación</text><text x=\"106\" y=\"202.9\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"currentColor\">es el paso PREVIO al expediente</text><path d=\"M194 164 L 206 164\" stroke=\"var(--acc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl)\"/><rect x=\"206\" y=\"104\" width=\"172\" height=\"120\" rx=\"8\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"292\" y=\"137.9\" text-anchor=\"middle\" font-size=\"20\" font-weight=\"700\" fill=\"var(--ej)\">A</text><text x=\"292\" y=\"150.9\" text-anchor=\"middle\" font-size=\"9\" fill=\"currentColor\">Autorización</text><text x=\"292\" y=\"163.9\" text-anchor=\"middle\" font-size=\"9\" fill=\"currentColor\"></text><text x=\"292\" y=\"176.9\" text-anchor=\"middle\" font-size=\"9\" fill=\"currentColor\">se acuerda realizar el gasto</text><text x=\"292\" y=\"189.9\" text-anchor=\"middle\" font-size=\"9\" fill=\"currentColor\">por una cuantía cierta</text><text x=\"292\" y=\"202.9\" text-anchor=\"middle\" font-size=\"9\" fill=\"currentColor\">aún sin tercero determinado</text><path d=\"M380 164 L 392 164\" stroke=\"var(--acc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl)\"/><rect x=\"392\" y=\"104\" width=\"172\" height=\"120\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"478\" y=\"137.9\" text-anchor=\"middle\" font-size=\"20\" font-weight=\"700\" fill=\"var(--warn)\">D</text><text x=\"478\" y=\"150.9\" text-anchor=\"middle\" font-size=\"9\" fill=\"currentColor\">Disposición o compromiso</text><text x=\"478\" y=\"163.9\" text-anchor=\"middle\" font-size=\"9\" fill=\"currentColor\"></text><text x=\"478\" y=\"176.9\" text-anchor=\"middle\" font-size=\"9\" fill=\"currentColor\">el gasto queda comprometido</text><text x=\"478\" y=\"189.9\" text-anchor=\"middle\" font-size=\"9\" fill=\"currentColor\">con un TERCERO determinado</text><text x=\"478\" y=\"202.9\" text-anchor=\"middle\" font-size=\"9\" fill=\"currentColor\">normalmente, la adjudicación</text><path d=\"M566 164 L 578 164\" stroke=\"var(--acc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl)\"/><rect x=\"578\" y=\"104\" width=\"172\" height=\"120\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"664\" y=\"137.9\" text-anchor=\"middle\" font-size=\"20\" font-weight=\"700\" fill=\"var(--exc)\">O</text><text x=\"664\" y=\"150.9\" text-anchor=\"middle\" font-size=\"9\" fill=\"currentColor\">Obligación</text><text x=\"664\" y=\"163.9\" text-anchor=\"middle\" font-size=\"9\" fill=\"currentColor\"></text><text x=\"664\" y=\"176.9\" text-anchor=\"middle\" font-size=\"9\" fill=\"currentColor\">se reconoce la deuda exigible</text><text x=\"664\" y=\"189.9\" text-anchor=\"middle\" font-size=\"9\" fill=\"currentColor\">con factura o certificación</text><text x=\"664\" y=\"202.9\" text-anchor=\"middle\" font-size=\"9\" fill=\"currentColor\">conformada</text><path d=\"M752 164 L 764 164\" stroke=\"var(--acc)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fl)\"/><rect x=\"764\" y=\"104\" width=\"172\" height=\"120\" rx=\"8\" fill=\"var(--panel)\" stroke=\"var(--line)\"/><text x=\"850\" y=\"137.9\" text-anchor=\"middle\" font-size=\"20\" font-weight=\"700\" fill=\"currentColor\">P</text><text x=\"850\" y=\"150.9\" text-anchor=\"middle\" font-size=\"9\" fill=\"currentColor\">Ordenación del pago</text><text x=\"850\" y=\"163.9\" text-anchor=\"middle\" font-size=\"9\" fill=\"currentColor\"></text><text x=\"850\" y=\"176.9\" text-anchor=\"middle\" font-size=\"9\" fill=\"currentColor\">se expide la orden de pago</text><text x=\"850\" y=\"189.9\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"currentColor\">conforme al plan de disposición</text><text x=\"850\" y=\"202.9\" text-anchor=\"middle\" font-size=\"9\" fill=\"currentColor\">de fondos (art. 187)</text><rect x=\"20\" y=\"240\" width=\"920\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"259.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">DOCUMENTOS ACUMULADOS · art. 184.2</text><rect x=\"20\" y=\"280\" width=\"110\" height=\"42\" rx=\"7\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"75\" y=\"308\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"700\" fill=\"var(--acc)\">AD</text><text x=\"146\" y=\"298\" text-anchor=\"start\" font-size=\"10.5\" font-weight=\"700\" fill=\"currentColor\">autorización + disposición</text><text x=\"146\" y=\"314\" text-anchor=\"start\" font-size=\"10\" fill=\"var(--ink2)\">al adjudicar un contrato ya conocido el adjudicatario</text><rect x=\"20\" y=\"330\" width=\"110\" height=\"42\" rx=\"7\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"75\" y=\"358\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"700\" fill=\"var(--ej)\">ADO</text><text x=\"146\" y=\"348\" text-anchor=\"start\" font-size=\"10.5\" font-weight=\"700\" fill=\"currentColor\">autorización + disposición + obligación</text><text x=\"146\" y=\"364\" text-anchor=\"start\" font-size=\"10\" fill=\"var(--ink2)\">gasto que se conoce y se reconoce de una vez, con factura</text><rect x=\"20\" y=\"380\" width=\"110\" height=\"42\" rx=\"7\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"75\" y=\"408\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"700\" fill=\"var(--warn)\">ADOP</text><text x=\"146\" y=\"398\" text-anchor=\"start\" font-size=\"10.5\" font-weight=\"700\" fill=\"currentColor\">las cuatro fases en un solo acto</text><text x=\"146\" y=\"414\" text-anchor=\"start\" font-size=\"10\" fill=\"var(--ink2)\">pagos inmediatos, como nóminas o suministros menores</text><rect x=\"20\" y=\"430\" width=\"110\" height=\"42\" rx=\"7\" fill=\"var(--panel)\" stroke=\"var(--line)\"/><text x=\"75\" y=\"458\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"700\" fill=\"currentColor\">RCAD</text><text x=\"146\" y=\"448\" text-anchor=\"start\" font-size=\"10.5\" font-weight=\"700\" fill=\"currentColor\">retención + autorización + disposición</text><text x=\"146\" y=\"464\" text-anchor=\"start\" font-size=\"10\" fill=\"var(--ink2)\">cuando se quiere reservar y comprometer en el mismo acto</text><rect x=\"20\" y=\"486\" width=\"920\" height=\"42\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"480\" y=\"503.86\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"currentColor\">Los documentos contables no están en el TRLHL: proceden del RD 500/1990 y de las Instrucciones de contabilidad local</text><text x=\"480\" y=\"516.86\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"currentColor\">(aportación externa a la biblioteca · verifícalos en el BOE)</text></svg></section><section class=\"card\" id=\"capitulos\"><h2>La clasificación económica del gasto, capítulo a capítulo</h2><p class=\"small\">Nueve capítulos en tres grupos. Y cuatro criterios que deciden si un gasto es inversión real.</p><svg viewBox=\"0 0 960 626\" role=\"img\" aria-label=\"Clasificación económica del presupuesto de gastos por capítulos\" style=\"width:100%;height:auto\"><defs><marker id=\"fl\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"200\" y=\"8\" width=\"560\" height=\"36\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"30\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"700\" fill=\"#fff\">CLASIFICACIÓN ECONÓMICA DEL GASTO · Orden EHA/3565/2008</text><rect x=\"20\" y=\"54\" width=\"920\" height=\"164\" rx=\"10\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"78\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"var(--acc)\">A.1 · OPERACIONES CORRIENTES</text><rect x=\"40\" y=\"100\" width=\"60\" height=\"24\" rx=\"6\" fill=\"#fff\" stroke=\"var(--acc)\"/><text x=\"70\" y=\"117\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"var(--acc)\">1</text><text x=\"116\" y=\"117\" text-anchor=\"start\" font-size=\"11\" fill=\"currentColor\">Gastos de personal</text><rect x=\"40\" y=\"130\" width=\"60\" height=\"24\" rx=\"6\" fill=\"#fff\" stroke=\"var(--acc)\"/><text x=\"70\" y=\"147\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"var(--acc)\">2</text><text x=\"116\" y=\"147\" text-anchor=\"start\" font-size=\"11\" fill=\"currentColor\">Gastos corrientes en bienes y servicios</text><rect x=\"40\" y=\"160\" width=\"60\" height=\"24\" rx=\"6\" fill=\"#fff\" stroke=\"var(--acc)\"/><text x=\"70\" y=\"177\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"var(--acc)\">3</text><text x=\"116\" y=\"177\" text-anchor=\"start\" font-size=\"11\" fill=\"currentColor\">Gastos financieros</text><rect x=\"40\" y=\"190\" width=\"60\" height=\"24\" rx=\"6\" fill=\"#fff\" stroke=\"var(--acc)\"/><text x=\"70\" y=\"207\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"var(--acc)\">4</text><text x=\"116\" y=\"207\" text-anchor=\"start\" font-size=\"11\" fill=\"currentColor\">Transferencias corrientes</text><rect x=\"20\" y=\"230\" width=\"920\" height=\"104\" rx=\"10\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><text x=\"480\" y=\"254\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"var(--ej)\">A.2 · OPERACIONES DE CAPITAL</text><rect x=\"40\" y=\"276\" width=\"60\" height=\"24\" rx=\"6\" fill=\"#fff\" stroke=\"var(--ej)\"/><text x=\"70\" y=\"293\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"var(--ej)\">6</text><text x=\"116\" y=\"293\" text-anchor=\"start\" font-size=\"11\" fill=\"currentColor\">Inversiones reales</text><rect x=\"40\" y=\"306\" width=\"60\" height=\"24\" rx=\"6\" fill=\"#fff\" stroke=\"var(--ej)\"/><text x=\"70\" y=\"323\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"var(--ej)\">7</text><text x=\"116\" y=\"323\" text-anchor=\"start\" font-size=\"11\" fill=\"currentColor\">Transferencias de capital</text><rect x=\"20\" y=\"346\" width=\"920\" height=\"104\" rx=\"10\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"480\" y=\"370\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"var(--warn)\">B · OPERACIONES FINANCIERAS</text><rect x=\"40\" y=\"392\" width=\"60\" height=\"24\" rx=\"6\" fill=\"#fff\" stroke=\"var(--warn)\"/><text x=\"70\" y=\"409\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"var(--warn)\">8</text><text x=\"116\" y=\"409\" text-anchor=\"start\" font-size=\"11\" fill=\"currentColor\">Activos financieros</text><rect x=\"40\" y=\"422\" width=\"60\" height=\"24\" rx=\"6\" fill=\"#fff\" stroke=\"var(--warn)\"/><text x=\"70\" y=\"439\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"var(--warn)\">9</text><text x=\"116\" y=\"439\" text-anchor=\"start\" font-size=\"11\" fill=\"currentColor\">Pasivos financieros</text><rect x=\"20\" y=\"462\" width=\"920\" height=\"40\" rx=\"8\" fill=\"var(--panel)\" stroke=\"var(--line)\"/><text x=\"480\" y=\"479.18\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"currentColor\">Capítulo 5 · Fondo de Contingencia y Otros Imprevistos</text><text x=\"480\" y=\"492.18\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">se sitúa entre las operaciones corrientes y las de capital</text><rect x=\"20\" y=\"514\" width=\"920\" height=\"96\" rx=\"8\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"480\" y=\"533.34\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"var(--exc)\">¿Cuándo un gasto va al capítulo 6? Los cuatro criterios de la Orden</text><text x=\"480\" y=\"546.34\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">a) que NO sean bienes fungibles · b) que tengan duración previsiblemente superior al ejercicio</text><text x=\"480\" y=\"559.34\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">c) que sean susceptibles de inclusión en INVENTARIO · d) que no sean gastos reiterativos</text><text x=\"480\" y=\"572.34\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\"></text><text x=\"480\" y=\"585.34\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">Por eso el equipamiento informático es capítulo 6 (inversión real) y el material didáctico</text><text x=\"480\" y=\"598.34\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">no inventariable que se subvenciona a una asociación es capítulo 4 (transferencia corriente)</text></svg></section>";
</script>
<script>
document.getElementById('main').innerHTML+="\n<section class=\"card\" id=\"tablas\"><h2>Tablas de referencia rápida</h2>\n<h3 style=\"font-size:1.02rem\">1 · Quién es competente en cada fase (art. 185 TRLHL)</h3>\n<table><thead><tr><th>Fase</th><th>Órgano</th><th>Artículo</th></tr></thead><tbody>\n<tr><td><b>Autorización y disposición</b></td><td>El <b>Presidente</b> o el <b>Pleno</b>, según la atribución de competencias de la normativa vigente y las bases de ejecución</td><td>185.1</td></tr>\n<tr><td><b>Reconocimiento y liquidación de la obligación</b></td><td>El <b>Presidente</b> de la corporación</td><td>185.2</td></tr>\n<tr><td><b>Ordenación del pago</b></td><td>El <b>Presidente</b>, conforme al plan de disposición de fondos</td><td>186 y 187</td></tr>\n</tbody></table>\n\n<h3 style=\"font-size:1.02rem;margin-top:1.3rem\">2 · Cómo decidir el capítulo de un gasto</h3>\n<table><thead><tr><th>Si el gasto es…</th><th>Capítulo</th><th>Ejemplo típico de examen</th></tr></thead><tbody>\n<tr><td>Retribuciones y cotizaciones del personal</td><td><b>1</b></td><td>Nómina y Seguridad Social</td></tr>\n<tr><td>Funcionamiento corriente: suministros, servicios, material fungible</td><td><b>2</b></td><td>Limpieza, luz, material de oficina</td></tr>\n<tr><td>Intereses de la deuda</td><td><b>3</b></td><td>Intereses de un préstamo</td></tr>\n<tr><td>Entrega sin contraprestación para gasto <b>corriente</b> del receptor</td><td><b>4</b></td><td><b>Subvención a una asociación para material didáctico NO inventariable</b></td></tr>\n<tr><td>Bienes inventariables, no fungibles, duraderos y no reiterativos</td><td><b>6</b></td><td><b>Equipamiento informático · reforma integral de un edificio</b></td></tr>\n<tr><td>Entrega sin contraprestación para gasto <b>de capital</b> del receptor</td><td><b>7</b></td><td>Subvención a un ayuntamiento para construir un pabellón</td></tr>\n<tr><td>Adquisición de activos financieros</td><td><b>8</b></td><td>Compra de acciones, anticipos al personal</td></tr>\n<tr><td>Amortización de deuda</td><td><b>9</b></td><td>Devolución del principal de un préstamo</td></tr>\n</tbody></table>\n<div class=\"box ej\"><span class=\"lbl\">La pregunta clásica</span>«¿Qué naturaleza tienen las ayudas que la entidad concede a una asociación para comprar <b>material didáctico no inventariable</b>?» → <b>transferencia corriente, capítulo 4</b>. Si el material fuera <b>inventariable</b>, sería <b>transferencia de capital, capítulo 7</b>. La palabra <b>inventariable</b> es la que decide.</div>\n\n<h3 style=\"font-size:1.02rem;margin-top:1.3rem\">3 · Gastos corrientes y gastos de capital</h3>\n<table><thead><tr><th>Grupo</th><th>Capítulos</th><th>Qué incluye</th></tr></thead><tbody>\n<tr><td><b>Operaciones corrientes</b></td><td>1 a 4</td><td>Gastos de funcionamiento de los servicios —personal y bienes corrientes y servicios—, <b>intereses</b> y <b>transferencias corrientes</b></td></tr>\n<tr><td><b>Operaciones de capital</b></td><td>6 y 7</td><td><b>Inversiones reales</b> y <b>transferencias de capital</b></td></tr>\n<tr><td><b>Operaciones financieras</b></td><td>8 y 9</td><td>Activos y pasivos financieros</td></tr>\n</tbody></table>\n<p class=\"small\">El <b>capítulo 5</b>, Fondo de Contingencia y Otros Imprevistos, se sitúa entre unos y otros. Ojo a la pregunta trampa: «los créditos para gastos corrientes deben incluir…» → gastos de funcionamiento, <b>intereses</b> y <b>transferencias corrientes</b>; las <b>inversiones reales</b> son de capital, y los activos y pasivos financieros no son ni corrientes ni de capital.</p>\n</section>\n\n<section class=\"card\" id=\"caso1\"><h2>Caso práctico integral · Del acuerdo al documento contable</h2>\n<div class=\"box warn\"><span class=\"lbl\">Advertencia</span>Entidad ficticia; trámites y preceptos reales.</div>\n<p><b>El escenario.</b> Una diputación acuerda tres cosas en el mismo Pleno: <b>a)</b> adquirir <b>equipamiento informático</b> para modernizar la administración; <b>b)</b> acometer la <b>reforma integral</b> de una residencia de mayores que gestiona ella misma, y encargar después su <b>gestión a una empresa privada</b>; <b>c)</b> conceder <b>ayudas</b> a una asociación de familiares para comprar <b>material didáctico no inventariable</b>.</p>\n\n<h3 style=\"font-size:1.02rem;margin-top:1rem\">a) El equipamiento informático</h3>\n<p><b>Gasto de capital, capítulo 6</b>. Cumple los cuatro criterios de la Orden EHA/3565/2008 para las inversiones reales: no es fungible, dura más de un ejercicio, es <b>inventariable</b> y no es reiterativo. No es gasto corriente aunque el contrato sea de <b>suministro</b>: el tipo de contrato y el capítulo presupuestario son clasificaciones <b>distintas</b> y no tienen por qué coincidir.</p>\n\n<h3 style=\"font-size:1.02rem;margin-top:1rem\">b) La reforma de la residencia y su gestión</h3>\n<table><thead><tr><th>Cuestión</th><th>Respuesta</th><th>Norma</th></tr></thead><tbody>\n<tr><td>Capítulo de la reforma</td><td><b>Capítulo 6, inversiones reales</b></td><td>Orden EHA/3565/2008</td></tr>\n<tr><td>Gestión actual por la propia entidad</td><td><b>Gestión directa</b></td><td>art. 85 LBRL <i>(norma externa)</i></td></tr>\n<tr><td>Gestión adjudicada a una empresa privada por contrato</td><td><b>Gestión indirecta</b>, mediante concesión de servicios si asume el riesgo operacional</td><td>art. 85 LBRL y art. 15 LCSP</td></tr>\n</tbody></table>\n<div class=\"box exc\"><span class=\"lbl\">Frontera del tema 10</span>Si a la empresa se le garantiza un <b>canon fijo</b> con independencia de la ocupación, no hay <b>riesgo operacional</b> y el contrato sería de <b>servicios</b> (art. 17), no una concesión (art. 15 en relación con el 14.4).</div>\n\n<h3 style=\"font-size:1.02rem;margin-top:1rem\">c) Las ayudas para material didáctico</h3>\n<p><b>Transferencia corriente, capítulo 4</b>: entrega sin contraprestación destinada a financiar una operación <b>corriente</b> del beneficiario, porque el material <b>no es inventariable</b>. Y en el plano jurídico es una <b>subvención</b> de la Ley 38/2003: entrega dineraria sin contraprestación, sujeta a un fin y con las obligaciones del art. 14.</p>\n\n<h3 style=\"font-size:1.02rem;margin-top:1rem\">Y ahora, los documentos contables</h3>\n<table><thead><tr><th>Momento</th><th>Documento</th><th>Por qué</th></tr></thead><tbody>\n<tr><td>Antes de iniciar el expediente de contratación</td><td><b>RC</b></td><td>Certifica la existencia de crédito, que el art. 116.3 LCSP exige incorporar al expediente</td></tr>\n<tr><td>Aprobación del expediente y del gasto</td><td><b>A</b></td><td>Art. 117.1 LCSP: la resolución que aprueba el expediente aprueba el gasto</td></tr>\n<tr><td>Adjudicación</td><td><b>D</b> o, acumulado, <b>AD</b></td><td>El gasto queda comprometido con un tercero determinado</td></tr>\n<tr><td>Certificación o factura conformada</td><td><b>O</b></td><td>Nace la obligación exigible</td></tr>\n<tr><td>Pago</td><td><b>P</b></td><td>Conforme al plan de disposición de fondos (art. 187 TRLHL)</td></tr>\n</tbody></table>\n<div class=\"box ej\"><span class=\"lbl\">La lección</span>Tres clasificaciones distintas conviven en el mismo expediente y no hay que mezclarlas: la <b>presupuestaria</b> (capítulo y aplicación), la <b>contractual</b> (tipo de contrato) y la <b>contable</b> (fase y documento). Los supuestos prácticos suelen preguntar por las tres seguidas.</div>\n</section>\n\n<section class=\"card\" id=\"conexiones\"><h2>Ocho preguntas de conexión</h2><div id=\"qbox\"></div></section>\n<section class=\"card\" id=\"semaforoB\"><h2>Semáforo</h2><div id=\"sembox\"></div><div id=\"semres\" style=\"margin-top:.8rem\"></div></section>\n\n<section class=\"card\" id=\"calendario\"><h2>Ampliación · El año presupuestario: quién hace qué y cuándo</h2>\n<p class=\"small\">Este bloque no estaba en la primera versión de la página. Se añade porque, en los tres exámenes analizados, <b>una de cada tres preguntas</b> se resuelve solo con este calendario.</p>\n<svg viewBox=\"0 0 960 506\" role=\"img\" aria-label=\"Calendario y órganos del presupuesto general de una entidad local\" style=\"width:100%;height:auto\"><defs><marker id=\"fl\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"250\" y=\"8\" width=\"460\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"27.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">EL AÑO PRESUPUESTARIO · QUIÉN HACE QUÉ Y CUÁNDO</text><rect x=\"20\" y=\"52\" width=\"920\" height=\"52\" rx=\"10\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"30\" y=\"62\" width=\"172\" height=\"32\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"116\" y=\"82\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--acc)\">Antes del 15 de octubre</text><text x=\"216\" y=\"74\" text-anchor=\"start\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">PRESIDENTE</text><text x=\"216\" y=\"90\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Forma el presupuesto y lo remite al Pleno, informado por la Intervención</text><text x=\"930\" y=\"82\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">art. 168.1 y 168.4</text><rect x=\"20\" y=\"110\" width=\"920\" height=\"52\" rx=\"10\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><rect x=\"30\" y=\"120\" width=\"172\" height=\"32\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--ej)\"/><text x=\"116\" y=\"140\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--ej)\">Aprobación inicial</text><text x=\"216\" y=\"132\" text-anchor=\"start\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">PLENO</text><text x=\"216\" y=\"148\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Aprueba inicialmente el presupuesto general</text><text x=\"930\" y=\"140\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">art. 169.1</text><rect x=\"20\" y=\"168\" width=\"920\" height=\"52\" rx=\"10\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"30\" y=\"178\" width=\"172\" height=\"32\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"116\" y=\"198\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--warn)\">15 días</text><text x=\"216\" y=\"190\" text-anchor=\"start\" font-size=\"11\" font-weight=\"700\" fill=\"var(--warn)\">EXPOSICIÓN AL PÚBLICO</text><text x=\"216\" y=\"206\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Anuncio en el BOP y presentación de reclamaciones</text><text x=\"930\" y=\"198\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">art. 169.1</text><rect x=\"20\" y=\"226\" width=\"920\" height=\"52\" rx=\"10\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><rect x=\"30\" y=\"236\" width=\"172\" height=\"32\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"116\" y=\"256\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--warn)\">1 mes</text><text x=\"216\" y=\"248\" text-anchor=\"start\" font-size=\"11\" font-weight=\"700\" fill=\"var(--warn)\">PLENO</text><text x=\"216\" y=\"264\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Resuelve las reclamaciones presentadas</text><text x=\"930\" y=\"256\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">art. 169.1</text><rect x=\"20\" y=\"284\" width=\"920\" height=\"52\" rx=\"10\" fill=\"var(--ej-bg)\" stroke=\"var(--ej)\"/><rect x=\"30\" y=\"294\" width=\"172\" height=\"32\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--ej)\"/><text x=\"116\" y=\"314\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--ej)\">Antes del 31 de diciembre</text><text x=\"216\" y=\"306\" text-anchor=\"start\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ej)\">PLENO</text><text x=\"216\" y=\"322\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Aprobación definitiva y publicación resumida por capítulos</text><text x=\"930\" y=\"314\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">art. 169.2 y 169.3</text><rect x=\"20\" y=\"342\" width=\"920\" height=\"52\" rx=\"10\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><rect x=\"30\" y=\"352\" width=\"172\" height=\"32\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"116\" y=\"372\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--acc)\">Tras la publicación</text><text x=\"216\" y=\"364\" text-anchor=\"start\" font-size=\"11\" font-weight=\"700\" fill=\"var(--acc)\">ENTRADA EN VIGOR</text><text x=\"216\" y=\"380\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">El presupuesto entra en vigor una vez publicado resumido por capítulos</text><text x=\"930\" y=\"372\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">art. 169.5</text><rect x=\"20\" y=\"400\" width=\"920\" height=\"52\" rx=\"10\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><rect x=\"30\" y=\"410\" width=\"172\" height=\"32\" rx=\"7\" fill=\"var(--bg)\" stroke=\"var(--exc)\"/><text x=\"116\" y=\"430\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--exc)\">Si no está en vigor</text><text x=\"216\" y=\"422\" text-anchor=\"start\" font-size=\"11\" font-weight=\"700\" fill=\"var(--exc)\">PRÓRROGA AUTOMÁTICA</text><text x=\"216\" y=\"438\" text-anchor=\"start\" font-size=\"9.8\" fill=\"currentColor\">Se prorroga el del ejercicio anterior con sus créditos iniciales</text><text x=\"930\" y=\"430\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--ink2)\">art. 169.6</text><rect x=\"20\" y=\"458\" width=\"920\" height=\"40\" rx=\"8\" fill=\"var(--panel)\" stroke=\"var(--line)\"/><text x=\"480\" y=\"474.86\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"currentColor\">Regla de oro: el PRESIDENTE forma · el INTERVENTOR informa · el PLENO aprueba.</text><text x=\"480\" y=\"487.86\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"currentColor\">Ninguna pregunta de examen sobre el presupuesto se sale de este esquema.</text></svg>\n<div class=\"box legal\"><span class=\"lbl\">Texto legal · art. 168.1 y 168.4 TRLHL</span>«El presupuesto de la entidad local será formado por su presidente [...]». «Sobre la base de los presupuestos y estados de previsión a que se refieren los apartados anteriores, el presidente de la entidad formará el presupuesto general y lo remitirá, informado por la Intervención [...] al Pleno de la corporación antes del día 15 de octubre para su aprobación, enmienda o devolución.»</div>\n<div class=\"box legal\"><span class=\"lbl\">Texto legal · art. 169.1, 169.2 y 169.5 TRLHL</span>«Aprobado inicialmente el presupuesto general, se expondrá al público, previo anuncio en el boletín oficial de la provincia [...] por 15 días [...]. El presupuesto se considerará definitivamente aprobado si durante el citado plazo no se hubiesen presentado reclamaciones; en caso contrario, el Pleno dispondrá de un plazo de un mes para resolverlas.» «La aprobación definitiva [...] habrá de realizarse antes del día 31 de diciembre del año anterior al del ejercicio en que deba aplicarse.» «El presupuesto entrará en vigor, en el ejercicio correspondiente, una vez publicado en la forma prevista en el apartado 3 de este artículo.»</div>\n<div class=\"box warn\"><span class=\"lbl\">Trampa: la entrada en vigor NO es automáticamente el 1 de enero</span>El art. 169.5 la vincula a la <b>publicación</b> resumida por capítulos, no a una fecha del calendario. Lo que sí ocurre al iniciarse el ejercicio, si el presupuesto no ha entrado en vigor, es la <b>prórroga automática</b> del art. 169.6.</div>\n<div class=\"box ej\"><span class=\"lbl\">No-ejemplo</span>Una diputación aprueba definitivamente el presupuesto el 28 de diciembre pero no lo publica hasta el 9 de enero. <b>No</b> está en vigor el 1 de enero: durante esos nueve días rige el presupuesto <b>prorrogado</b>. La aprobación definitiva en plazo no sustituye a la publicación.</div>\n<div class=\"box exc\"><span class=\"lbl\">Excepción del art. 169.6</span>La prórroga <b>no alcanza</b> a los créditos para servicios o programas que <b>debían concluir</b> en el ejercicio anterior ni a los financiados con crédito u otros <b>ingresos específicos o afectados</b>.</div>\n<div class=\"box\"><span class=\"lbl\">Impugnación · art. 171 TRLHL</span>Contra la aprobación definitiva cabe recurso <b>contencioso-administrativo directo</b>, en la forma y plazos de esa jurisdicción. Su interposición <b>no suspende por sí sola</b> la aplicación del presupuesto. Si la impugnación afecta a la nivelación presupuestaria, el Tribunal de Cuentas debe informar con carácter previo.</div>\n</section>\n\n<section class=\"card\" id=\"modif\"><h2>Ampliación · Las modificaciones de créditos</h2>\n<p class=\"small\">La segunda familia de preguntas más rentable del temario. Lo que se pregunta no es el concepto: es <b>cuál procede</b> en el caso planteado y <b>quién la aprueba</b>.</p>\n<svg viewBox=\"0 0 960 360\" role=\"img\" aria-label=\"Las siete figuras de modificación de créditos\" style=\"width:100%;height:auto\"><defs><marker id=\"fl\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--acc)\"/></marker><marker id=\"fr\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--exc)\"/></marker><marker id=\"fe\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ej)\"/></marker><marker id=\"fw\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"280\" y=\"8\" width=\"400\" height=\"32\" rx=\"8\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><text x=\"480\" y=\"27.84\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">LAS MODIFICACIONES DE CRÉDITO</text><rect x=\"20\" y=\"52\" width=\"220\" height=\"116\" rx=\"10\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"130\" y=\"74\" text-anchor=\"middle\" font-size=\"10.8\" font-weight=\"700\" fill=\"var(--exc)\">Crédito extraordinario</text><text x=\"130\" y=\"90\" text-anchor=\"middle\" font-size=\"9\" fill=\"var(--ink2)\">art. 177 TRLHL</text><text x=\"130\" y=\"108\" text-anchor=\"middle\" font-size=\"9.1\" fill=\"currentColor\">NO existe crédito para</text><text x=\"130\" y=\"121\" text-anchor=\"middle\" font-size=\"9.1\" fill=\"currentColor\">un gasto específico,</text><text x=\"130\" y=\"134\" text-anchor=\"middle\" font-size=\"9.1\" fill=\"currentColor\">determinado y no demorable.</text><rect x=\"32\" y=\"140\" width=\"196\" height=\"20\" rx=\"6\" fill=\"var(--bg)\" stroke=\"var(--exc)\"/><text x=\"130\" y=\"154\" text-anchor=\"middle\" font-size=\"8.8\" font-weight=\"700\" fill=\"var(--exc)\">PLENO · art. 177.2</text><rect x=\"252\" y=\"52\" width=\"220\" height=\"116\" rx=\"10\" fill=\"var(--exc-bg)\" stroke=\"var(--exc)\"/><text x=\"362\" y=\"74\" text-anchor=\"middle\" font-size=\"10.8\" font-weight=\"700\" fill=\"var(--exc)\">Suplemento de crédito</text><text x=\"362\" y=\"90\" text-anchor=\"middle\" font-size=\"9\" fill=\"var(--ink2)\">art. 177 TRLHL</text><text x=\"362\" y=\"108\" text-anchor=\"middle\" font-size=\"9.1\" fill=\"currentColor\">EXISTE crédito pero es</text><text x=\"362\" y=\"121\" text-anchor=\"middle\" font-size=\"9.1\" fill=\"currentColor\">insuficiente y NO ampliable.</text><rect x=\"264\" y=\"140\" width=\"196\" height=\"20\" rx=\"6\" fill=\"var(--bg)\" stroke=\"var(--exc)\"/><text x=\"362\" y=\"154\" text-anchor=\"middle\" font-size=\"8.8\" font-weight=\"700\" fill=\"var(--exc)\">PLENO · art. 177.2</text><rect x=\"484\" y=\"52\" width=\"220\" height=\"116\" rx=\"10\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"594\" y=\"74\" text-anchor=\"middle\" font-size=\"10.8\" font-weight=\"700\" fill=\"var(--warn)\">Créditos ampliables</text><text x=\"594\" y=\"90\" text-anchor=\"middle\" font-size=\"9\" fill=\"var(--ink2)\">art. 178 TRLHL</text><text x=\"594\" y=\"108\" text-anchor=\"middle\" font-size=\"9.1\" fill=\"currentColor\">Solo los relacionados de modo</text><text x=\"594\" y=\"121\" text-anchor=\"middle\" font-size=\"9.1\" fill=\"currentColor\">taxativo en las bases de</text><text x=\"594\" y=\"134\" text-anchor=\"middle\" font-size=\"9.1\" fill=\"currentColor\">ejecución del presupuesto.</text><rect x=\"496\" y=\"140\" width=\"196\" height=\"20\" rx=\"6\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"594\" y=\"154\" text-anchor=\"middle\" font-size=\"8.8\" font-weight=\"700\" fill=\"var(--warn)\">Bases de ejecución</text><rect x=\"716\" y=\"52\" width=\"220\" height=\"116\" rx=\"10\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"826\" y=\"74\" text-anchor=\"middle\" font-size=\"10.8\" font-weight=\"700\" fill=\"var(--warn)\">Transferencia de crédito</text><text x=\"826\" y=\"90\" text-anchor=\"middle\" font-size=\"9\" fill=\"var(--ink2)\">art. 179-180 TRLHL</text><text x=\"826\" y=\"108\" text-anchor=\"middle\" font-size=\"9.1\" fill=\"currentColor\">Traslada crédito entre partidas,</text><text x=\"826\" y=\"121\" text-anchor=\"middle\" font-size=\"9.1\" fill=\"currentColor\">con los límites del art. 180.</text><rect x=\"728\" y=\"140\" width=\"196\" height=\"20\" rx=\"6\" fill=\"var(--bg)\" stroke=\"var(--warn)\"/><text x=\"826\" y=\"148.5\" text-anchor=\"middle\" font-size=\"8.8\" font-weight=\"700\" fill=\"var(--warn)\">Bases; Pleno si cambia</text><text x=\"826\" y=\"159.5\" text-anchor=\"middle\" font-size=\"8.8\" font-weight=\"700\" fill=\"var(--warn)\">de grupo de función</text><rect x=\"20\" y=\"180\" width=\"220\" height=\"116\" rx=\"10\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"130\" y=\"202\" text-anchor=\"middle\" font-size=\"10.8\" font-weight=\"700\" fill=\"var(--acc)\">Generación de crédito</text><text x=\"130\" y=\"218\" text-anchor=\"middle\" font-size=\"9\" fill=\"var(--ink2)\">art. 181 TRLHL</text><text x=\"130\" y=\"236\" text-anchor=\"middle\" font-size=\"9.1\" fill=\"currentColor\">Ingresos NO tributarios:</text><text x=\"130\" y=\"249\" text-anchor=\"middle\" font-size=\"9.1\" fill=\"currentColor\">aportaciones, enajenaciones,</text><text x=\"130\" y=\"262\" text-anchor=\"middle\" font-size=\"9.1\" fill=\"currentColor\">servicios, préstamos, reintegros.</text><rect x=\"32\" y=\"268\" width=\"196\" height=\"20\" rx=\"6\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"130\" y=\"282\" text-anchor=\"middle\" font-size=\"8.8\" font-weight=\"700\" fill=\"var(--acc)\">Según reglamento</text><rect x=\"252\" y=\"180\" width=\"220\" height=\"116\" rx=\"10\" fill=\"var(--acc-soft)\" stroke=\"var(--acc)\"/><text x=\"362\" y=\"202\" text-anchor=\"middle\" font-size=\"10.8\" font-weight=\"700\" fill=\"var(--acc)\">Incorporación de remanentes</text><text x=\"362\" y=\"218\" text-anchor=\"middle\" font-size=\"9\" fill=\"var(--ink2)\">art. 182 TRLHL</text><text x=\"362\" y=\"236\" text-anchor=\"middle\" font-size=\"9.1\" fill=\"currentColor\">Créditos del ejercicio anterior</text><text x=\"362\" y=\"249\" text-anchor=\"middle\" font-size=\"9.1\" fill=\"currentColor\">que pasan al siguiente si hay</text><text x=\"362\" y=\"262\" text-anchor=\"middle\" font-size=\"9.1\" fill=\"currentColor\">recursos financieros.</text><rect x=\"264\" y=\"268\" width=\"196\" height=\"20\" rx=\"6\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><text x=\"362\" y=\"282\" text-anchor=\"middle\" font-size=\"8.8\" font-weight=\"700\" fill=\"var(--acc)\">Según reglamento</text><rect x=\"484\" y=\"180\" width=\"220\" height=\"116\" rx=\"10\" fill=\"var(--panel)\" stroke=\"var(--line)\"/><text x=\"594\" y=\"202\" text-anchor=\"middle\" font-size=\"10.8\" font-weight=\"700\" fill=\"currentColor\">Bajas por anulación</text><text x=\"594\" y=\"218\" text-anchor=\"middle\" font-size=\"9\" fill=\"var(--ink2)\">art. 177.4 TRLHL</text><text x=\"594\" y=\"236\" text-anchor=\"middle\" font-size=\"9.1\" fill=\"currentColor\">Reducción de créditos no</text><text x=\"594\" y=\"249\" text-anchor=\"middle\" font-size=\"9.1\" fill=\"currentColor\">comprometidos; sirve para</text><text x=\"594\" y=\"262\" text-anchor=\"middle\" font-size=\"9.1\" fill=\"currentColor\">financiar las dos primeras.</text><rect x=\"496\" y=\"268\" width=\"196\" height=\"20\" rx=\"6\" fill=\"var(--bg)\" stroke=\"var(--line)\"/><text x=\"594\" y=\"282\" text-anchor=\"middle\" font-size=\"8.8\" font-weight=\"700\" fill=\"currentColor\">Dentro del expediente</text><rect x=\"20\" y=\"308\" width=\"920\" height=\"44\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"var(--warn)\"/><text x=\"480\" y=\"326.86\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"currentColor\">Crédito extraordinario y suplemento de crédito siguen el MISMO trámite que el presupuesto (art. 177.2):</text><text x=\"480\" y=\"339.86\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"currentColor\">Presidente instruye · Intervención informa · Pleno aprueba · 15 días de exposición · 1 mes para resolver reclamaciones.</text></svg>\n<div class=\"box legal\"><span class=\"lbl\">Texto legal · art. 177.1 TRLHL</span>«Cuando haya de realizarse algún gasto que no pueda demorarse hasta el ejercicio siguiente, y no exista en el presupuesto de la corporación crédito o sea insuficiente o no ampliable el consignado, el presidente de la corporación ordenará la incoación del expediente de concesión de <b>crédito extraordinario</b>, en el primer caso, o de <b>suplemento de crédito</b>, en el segundo.»</div>\n<div class=\"box warn\"><span class=\"lbl\">La frontera entre las dos figuras, en una línea</span><b>No hay crédito</b> → extraordinario. <b>Lo hay pero no llega</b> y además no es ampliable → suplemento. Si el crédito <b>sí es ampliable</b>, no procede ninguna de las dos: se aplica el art. 178.</div>\n<div class=\"box legal\"><span class=\"lbl\">Texto legal · art. 179.1 y 179.2 TRLHL</span>«Las entidades locales regularán en las bases de ejecución del presupuesto el régimen de transferencias estableciendo, en cada caso, el órgano competente para autorizarlas.» «En todo caso, la aprobación de las transferencias de crédito entre distintos grupos de función corresponderá al Pleno de la corporación salvo cuando las bajas y las altas afecten a créditos de personal.»</div>\n<div class=\"box legal\"><span class=\"lbl\">Texto legal · art. 177.4 TRLHL · los tres recursos que financian el aumento</span>«Dicho aumento se financiará con cargo al <b>remanente líquido de tesorería</b>, con <b>nuevos o mayores ingresos</b> recaudados sobre los totales previstos en el presupuesto corriente, y mediante <b>anulaciones o bajas de créditos</b> de gastos de otras partidas del presupuesto vigente no comprometidos, cuyas dotaciones se estimen reducibles sin perturbación del respectivo servicio.»</div>\n<div class=\"box ej\"><span class=\"lbl\">Caso trabajado</span>Una diputación necesita 250.000 € en octubre para reparar un puente dañado por una riada. En el presupuesto <b>no hay ninguna partida</b> para esa obra. → Es un gasto <b>específico y determinado</b> que <b>no puede demorarse</b> y <b>no existe crédito</b>: procede <b>crédito extraordinario</b>. Se financia con remanente líquido de tesorería, con mayores ingresos o con bajas de otras partidas no comprometidas. El <b>Presidente</b> ordena la incoación, la <b>Intervención</b> informa y el <b>Pleno</b> lo aprueba con el trámite del presupuesto: 15 días de exposición y un mes para resolver reclamaciones.</div>\n<div class=\"box\"><span class=\"lbl\">No-ejemplo</span>La misma diputación quiere pasar 40.000 € de «material de oficina» a «suministro de combustible», ambas dentro del mismo grupo de función. <b>No</b> es un crédito extraordinario: es una <b>transferencia de crédito</b>, y la aprueba el órgano que digan las <b>bases de ejecución</b>, no necesariamente el Pleno.</div>\n<div class=\"box exc\"><span class=\"lbl\">Límites del art. 180 que suelen preguntarse</span>Las transferencias <b>no</b> afectan a los créditos ampliables ni a los extraordinarios concedidos durante el ejercicio; <b>no</b> pueden minorar créditos ya incrementados con suplementos o transferencias, salvo créditos de personal; y <b>no</b> pueden incrementar créditos que ya fueron minorados por otra transferencia, salvo créditos de personal.</div>\n</section>\n";
</script>

/* ---------- FILTRO DE FASES ---------- */
(function(){
 var svg=document.getElementById('mapa8');
 document.querySelectorAll('.fbtn').forEach(function(b){
  b.onclick=function(){
   document.querySelectorAll('.fbtn').forEach(function(x){x.setAttribute('aria-pressed','false');});
   b.setAttribute('aria-pressed','true');
   var f=b.getAttribute('data-f');
   svg.querySelectorAll('g[data-f]').forEach(function(g){
    g.style.opacity=(f==='0'||g.getAttribute('data-f')===f)?'1':'0.16';});
  };});

/* ---------- PREGUNTAS DE CONEXIÓN ---------- */
(function(){
 var h='';
 QS.forEach(function(q,i){
  h+='<details class="panel"><summary>'+(i+1)+'. '+q[0]+'</summary><div class="body"><p>'+q[1]+'</p></div></details>';});
 document.getElementById('qbox').innerHTML=h;

/* ---------- SEMÁFORO ---------- */
var sem=SEM.map(function(){return 0;});
function drawSem(){
 var h='<table><tbody>';
 SEM.forEach(function(c,i){
  h+='<tr><td>'+c+'</td><td style="width:150px;white-space:nowrap">'
   +['🟢','🟡','🔴'].map(function(e,j){
     var on=sem[i]===j+1;
     return '<button class="sembtn" data-i="'+i+'" data-v="'+(j+1)+'" style="font-size:1rem;padding:.15rem .35rem;margin-right:.2rem;border-color:'+(on?'var(--acc)':'var(--line)')+';background:'+(on?'var(--acc-soft)':'var(--panel)')+'">'+e+'</button>';}).join('')
   +'</td></tr>';});
 h+='</tbody></table>';
 document.getElementById('sembox').innerHTML=h;
 document.querySelectorAll('.sembtn').forEach(function(b){
  b.onclick=function(){sem[+b.getAttribute('data-i')]=+b.getAttribute('data-v');drawSem();};});
 var r=[],a=[];
 sem.forEach(function(v,i){if(v===3)r.push(SEM[i]);if(v===2)a.push(SEM[i]);});
 var o='';
 if(r.length)o+='<div class="box exc"><span class="lbl">Vuelve al bloque correspondiente hoy mismo</span><ul><li>'+r.join('</li><li>')+'</li></ul></div>';
 if(a.length)o+='<div class="box warn"><span class="lbl">Refuerza en 24 h</span><ul><li>'+a.join('</li><li>')+'</li></ul></div>';
 if(!r.length&&!a.length&&sem.some(function(v){return v===1;}))o='<div class="box ej"><span class="lbl">Bien</span>Tienes el mapa. Ahora explícaselo a alguien sin mirar la página: es la única prueba que vale.</div>';
 document.getElementById('semres').innerHTML=o;
}

/* ---------- HERRAMIENTAS ---------- */

document.getElementById('expand').onclick=function(){
 openAll=!openAll;document.querySelectorAll('details.panel').forEach(function(d){d.open=openAll;});
 this.textContent=openAll?'Plegar todo':'Desplegar todo';};
document.getElementById('theme').onclick=function(){
 var h=document.documentElement;h.setAttribute('data-theme',h.getAttribute('data-theme')==='dark'?'light':'dark');};
var fs=16;
document.getElementById('fs+').onclick=function(){fs=Math.min(22,fs+1);document.documentElement.style.setProperty('--fs',fs+'px');};

window.addEventListener('scroll',function(){
 var h=document.body.scrollHeight-window.innerHeight;
 document.getElementById('prog').style.width=(h>0?(window.scrollY/h*100):0)+'%';
 var cur=null;document.querySelectorAll('section.card').forEach(function(s){
  if(s.getBoundingClientRect().top<120)cur=s.id;});
 document.querySelectorAll('nav.side a').forEach(function(a){
  a.classList.toggle('on',a.getAttribute('href')==='#'+cur);});
},{passive:true});

/* ---------- BUSCADOR ---------- */
var q=document.getElementById('q'),timer=null;
function clearMarks(){document.querySelectorAll('mark.hit').forEach(function(m){
 var p=m.parentNode;p.replaceChild(document.createTextNode(m.textContent),m);p.normalize();});}
q.addEventListener('input',function(){
 clearTimeout(timer);timer=setTimeout(function(){
  clearMarks();
  var term=q.value.trim();
  document.querySelectorAll('section.card').forEach(function(s){s.classList.remove('hide');});
  if(term.length<3)return;
  var rx=new RegExp(term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
  document.querySelectorAll('section.card').forEach(function(s){
   var found=false;
   var w=document.createTreeWalker(s,NodeFilter.SHOW_TEXT,null);var nodes=[];
   while(w.nextNode()){var nd=w.currentNode;
    if(nd.parentNode.closest('script,style,mark,svg'))continue;
    if(rx.test(nd.nodeValue)){nodes.push(nd);rx.lastIndex=0;}}
   nodes.forEach(function(nd){
    found=true;
    var span=document.createElement('span');
    span.innerHTML=nd.nodeValue.replace(rx,function(m){return '<mark class="hit">'+m+'</mark>';});
    nd.parentNode.replaceChild(span,nd);});
   if(found){s.querySelectorAll('details.panel').forEach(function(d){if(d.querySelector('mark.hit'))d.open=true;});}
   s.classList.toggle('hide',!found);
  });
 },220);});



</script>
<script>

/* ═══ Mejoras de interacción · Bloque II ═══ */
(function(){
"use strict";
var K_THEME="oposi_bII_theme", K_FS="oposi_bII_fs", K_STREAK="oposi_bII_streak";
function load(k,f){try{var v=localStorage.getItem(k);return v?JSON.parse(v):f;}catch(e){return f;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
var root=document.documentElement;

/* Tema persistente (sobrescribe el toggle simple anterior) */
var saved=load(K_THEME,null);
if(saved){root.setAttribute("data-theme",saved);}
else if(window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches){root.setAttribute("data-theme","dark");}
var bt=document.getElementById("theme");
if(bt)bt.onclick=function(){
  var n=root.getAttribute("data-theme")==="dark"?"light":"dark";
  root.setAttribute("data-theme",n);save(K_THEME,n);
};

/* Tamaño de texto persistente */
var fs=load(K_FS,16);
function setFs(v){fs=Math.max(13,Math.min(22,v));root.style.setProperty("--fs",fs+"px");save(K_FS,fs);}
setFs(fs);
var bp=document.getElementById("fs+"),bm=document.getElementById("fs-");
if(bp)bp.onclick=function(){setFs(fs+1);};
if(bm)bm.onclick=function(){setFs(fs-1);};

/* Racha compartida con el índice */
(function(){
  var el=document.getElementById("streakN");if(!el)return;
  var hoy=new Date().toISOString().slice(0,10);
  var s=load(K_STREAK,{last:null,n:0});
  if(s.last!==hoy){
    var ayer=new Date(Date.now()-864e5).toISOString().slice(0,10);
    s.n=(s.last===ayer)?s.n+1:1;s.last=hoy;save(K_STREAK,s);
  }
  el.textContent=s.n;
})();

/* Reveal on scroll para las tarjetas */
function reveal(){
  var els=document.querySelectorAll("section.card:not(.rv)");
  if(!els.length)return;
  if(!("IntersectionObserver" in window)){return;}
  var io=new IntersectionObserver(function(es){
    es.forEach(function(en){if(en.isIntersecting){en.target.classList.add("in");io.unobserve(en.target);}});
  },{threshold:.06,rootMargin:"0px 0px -30px 0px"});
  Array.prototype.forEach.call(els,function(el){el.classList.add("rv");io.observe(el);});
}

/* Sección activa en el índice lateral */
function spy(){
  var links=document.querySelectorAll("nav.side a[href^='#']");
  if(!links.length||!("IntersectionObserver" in window))return;
  var map={};
  Array.prototype.forEach.call(links,function(a){
    var t=document.getElementById(a.getAttribute("href").slice(1));
    if(t)map[t.id]=a;
  });
  var io=new IntersectionObserver(function(es){
    es.forEach(function(en){
      if(en.isIntersecting){
        Array.prototype.forEach.call(links,function(a){a.classList.remove("on");});
        if(map[en.target.id])map[en.target.id].classList.add("on");
      }
    });
  },{rootMargin:"-80px 0px -70% 0px",threshold:0});
  Object.keys(map).forEach(function(id){io.observe(document.getElementById(id));});
}

/* Ripple en botones */
document.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b||b.classList.contains("navtoggle"))return;
  var r=b.getBoundingClientRect(),d=Math.max(r.width,r.height),s=document.createElement("span");
  s.className="ripple";s.style.width=s.style.height=d+"px";
  s.style.left=(e.clientX-r.left-d/2)+"px";s.style.top=(e.clientY-r.top-d/2)+"px";
  b.appendChild(s);setTimeout(function(){if(s.parentNode)s.parentNode.removeChild(s);},560);
});

/* Atajos de teclado */
document.addEventListener("keydown",function(e){
  if(e.target.matches("input,textarea"))return;
  if(e.key==="/"){var q=document.getElementById("q");if(q){e.preventDefault();q.focus();}}
  if(e.key==="t"&&bt)bt.click();
});

/* El contenido se inyecta por JS: esperamos a que exista */
function init(){reveal();spy();}
if(document.getElementById("main")&&document.getElementById("main").children.length){init();}
else{setTimeout(init,60);}
addEventListener("load",function(){setTimeout(init,80);});
})();
